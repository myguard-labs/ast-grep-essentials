---
name: test-rule-validator

"on": [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validator-tests:
    name: Test the changed-rule validator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the rule change
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install the ci test dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - name: Install ast-grep 0.50.0
        run: >-
          npm install --prefix "$RUNNER_TEMP/ast-grep-050"
          --ignore-scripts --no-audit --no-fund @ast-grep/cli@0.50.0
      - name: Test the changed-rule validator and the util fixtures
        env:
          AST_GREP_UTIL_TESTS: ${{ runner.temp }}/ast-grep-050/node_modules/.bin/ast-grep
        run: python -m unittest discover -s ci/tests -v
      - name: Test the global util fixtures on ast-grep 0.50.0
        run: >-
          "$RUNNER_TEMP/ast-grep-050/node_modules/.bin/ast-grep"
          test -c ci/util-tests/sgconfig.yml
  host-loadability:
    name: Load every non-PowerShell rule on the lowest consumer ast-grep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the rule change
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install ast-grep 0.45.2
        run: >-
          npm install --prefix "$RUNNER_TEMP/ast-grep-045"
          --ignore-scripts --no-audit --no-fund @ast-grep/cli@0.45.2
      - name: Load the rules on ast-grep 0.45.2
        run: >-
          python ci/check_host_loadability.py
          --ast-grep "$RUNNER_TEMP/ast-grep-045/node_modules/.bin/ast-grep"
      - name: Test the global util fixtures on ast-grep 0.45.2
        run: >-
          "$RUNNER_TEMP/ast-grep-045/node_modules/.bin/ast-grep"
          test -c ci/util-tests/sgconfig.yml
      - name: Test the host-loadability gate against ast-grep 0.45.2
        env:
          AST_GREP_045: ${{ runner.temp }}/ast-grep-045/node_modules/.bin/ast-grep
        run: python -m unittest discover -s ci/tests -p 'test_check_host_loadability.py' -v
