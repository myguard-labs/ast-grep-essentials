---
name: validate-changed-rules

"on":
  # The protected base revision supplies every executable file; the candidate
  # checkout is read only as rule/fixture data and receives no credential.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-rules:
    name: Validate changed rules with latest ast-grep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the trusted validator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the candidate rules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Test changed rules with latest ast-grep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python trusted/ci/validate_changed_rules.py
          --root candidate
      - name: Install the alias checker dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - name: Check deprecated aliases track their replacements
        run: >-
          python trusted/ci/sync_deprecated_aliases.py
          --root candidate
          --check
