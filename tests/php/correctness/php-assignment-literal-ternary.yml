id: php-assignment-literal-ternary
valid:
  - '$t = $mode == ''Y'' ? ''checked'' : '''';'
  - '<?php $t = $mode ? ''checked'' : '''';'
  - '<?php $t = ($mode) ? ''Y'' : ''N'';'
  - '<?php $t = ''Y'' . $suffix;'
invalid:
  - '$t = ''Y'' ? ''checked'' : '''';'
  - '<?php $this->t = ''Y'' ? $a : $b;'
  - '<?php $opts[''sel''] = ''Y'' ? 1 : 0;'
  - '<?php function f() { $t = ''Y'' ? ''checked'' : ''''; return $t; }'
