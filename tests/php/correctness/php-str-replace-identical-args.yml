id: php-str-replace-identical-args
valid:
  - '$text = str_replace( ''Wordpress'', ''WordPress'', $text );'
  - |-
    $t = str_replace('a', 'A', $t);
  - |-
    $t = str_replace('a', 'a ', $t);
  - |-
    $t = str_replace('a', $r, $t);
invalid:
  - '$text = str_replace( ''WordPress'', ''WordPress'', $text );'
  - |-
    $t = str_replace('a', 'a', $t, $n);
  - |-
    $t = str_replace('foo bar', 'foo bar', $t);
  - |-
    $t = str_replace('a\n', 'a\n', $t);
