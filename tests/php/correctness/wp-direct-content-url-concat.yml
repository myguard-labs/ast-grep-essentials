id: wp-direct-content-url-concat
valid:
  - 'echo ''<img src="'' . content_url( $dir . ''/'' . $file ) . ''" />'';'
  - '<?php $url = $base . WP_CONTENT_DIR;'
invalid:
  - 'echo ''<img src="'' . WP_CONTENT_URL . $dir . ''/'' . $file . ''" />'';'
  - '<?php $url = WP_CONTENT_URL . ''/plugins'';'
  - '<?php $url = $base . WP_CONTENT_URL;'
