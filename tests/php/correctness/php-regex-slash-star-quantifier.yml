id: php-regex-slash-star-quantifier
valid:
  - '$re = ''#https?://(www\.)?slideshare\.net/.*#i'';'
  - '<?php $re = ''#^/api/#'';'
  - '<?php $re = ''#https?://example\.com/\*#'';'
  - '<?php $re = ''#^/admin/.*#u'';'
invalid:
  - '$re = ''#https?://(www\.)?slideshare\.net/*#i'';'
  - '<?php $re = ''#^/api/v1/*#'';'
  - '<?php $re = ''#/*#'';'
  - '<?php preg_match(''#^/files/*#iu'', $path);'
