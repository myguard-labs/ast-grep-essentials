id: php-defined-constant-flag-without-value
valid:
  - '<?php if ( defined( ''RELOCATE'' ) && RELOCATE ) { $x = 1; }'
  - '<?php if ( !defined( ''RELOCATE'' ) ) { $x = 1; }'
  - '<?php if ( defined( ''RELOCATE'' ) and RELOCATE ) { $x = 1; }'
  - '<?php if ( defined( ''RELOCATE'' ) && true === RELOCATE ) { $x = 1; }'
invalid:
  - '<?php if ( defined( ''RELOCATE'' ) ) { $x = 1; }'
  - '<?php if ( defined( ''RELOCATE'' ) ) { $x = 1; } else { $x = 2; }'
  - '<?php if ( defined( $name ) ) { $x = 1; }'
  - '<?php if ( defined( ''RELOCATE'' ) ) $x = 1;'
  - '<?php if ( defined( "RELOCATE" ) ) { $x = 1; }'
