id: wp-echo-attribute-comma-args
valid:
  - '<tr class=''<?php echo $class . '' '' . $class1; ?>''>'
  - "<tr class='<?php echo implode( ' ', $classes ); ?>'>"
  - "<tr class='<?php echo esc_attr( $class . ' ' . $class1 ); ?>'>"
  - "<tr class='<?php echo sprintf( '%s %s', $class, $class1 ); ?>'>"
  - "<?php echo $a, $b;"
  - "<td><?php echo $label, $value; ?></td>"
  - "<a href=\"x\"><?php echo $a, $b; ?></a>"
  - "<?php\nfunction f() {\n  echo $a, $b;\n}\n"
  - "<?php if ( $x ) { echo $a, $b; } ?>"
  - "<a href=\"x\"><?php if ( $x ) { echo $a, $b; } ?></a>"
  - "<tr class='<?php echo $class, ' ', $class1; ?>'>"
  - "<tr class=\"<?php echo $a, \" \", $b, ' ', $c; ?>\">"
invalid:
  - '<tr class=''<?php echo $class, $class1; ?>''>'
  - "<tr class='<?php echo esc_attr( $class ), esc_attr( $class1 ); ?>'>"
  - "<tr class=\"<?php echo $a, $b, $c; ?>\">"
  - "<tr class=\"<?php echo $a, ' ', $b, $c; ?>\">"
  - "<div data-id=\"<?php echo $a, $b; ?>\">"
  - "<a href=\"<?php echo $a, $b; ?>\">x</a>"
  - "<div style=\"width:<?php echo $a, $b; ?>px\">"
  - "<div\n  id=\"x\"\n  class=\"<?php echo $a, $b; ?>\">"
  - "<div class=\"<?php if ( $x ) { echo $a, $b; } ?>\">"
  - "<div class=\"<?php foreach ( $l as $i ) { echo $i, $b; } ?>\">"
  - "<div class=<?php echo $a, $b; ?>>"
  - "<div class=\"<?php $z = 1; echo $a, $b; ?>\">"
  - "<div class='<?php echo foo( $a, 1 ), bar( $b ); ?>'>"
  - "<?php $x = 1; ?><div class=\"<?php echo $a, $b; ?>\">"
