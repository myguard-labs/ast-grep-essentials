id: wp-deprecated-file-version-zero
valid:
  - '<?php _deprecated_file( basename(__FILE__), ''2.1'', WPINC . ''/rss.php'' ); ?>'
  - '<?php _deprecated_file( __FILE__, ''4.7.0'', ''wp-includes/new.php'' );'
  - '<?php _deprecated_file( basename( __FILE__ ), ''6.2'', '''' );'
  - '<?php _deprecated_file( __FILE__, ''3.0'' );'
invalid:
  - '<?php _deprecated_file( basename(__FILE__), ''0.0'', WPINC . ''/rss.php'' ); ?>'
  - '<?php if ( $x ) { _deprecated_file( __FILE__, ''0.0'', ''new.php'', ''Use new.php.'' ); }'
  - '<?php function old_file() { _deprecated_file( __FILE__, ''0.0'', $replacement ); }'
  - '<?php _deprecated_file( $file, ''0.0'', ''inc/new.php'', ''Moved.'' );'
