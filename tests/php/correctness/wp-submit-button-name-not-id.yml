id: wp-submit-button-name-not-id
valid:
  - |-
    <?php
    submit_button( __( 'Apply' ), 'secondary', false, false, array( 'id' => 'doaction' ) );
  - |-
    <?php
    submit_button( 'Save', 'primary', false, false );
  - |-
    <?php
    submit_button( 'Save', 'primary', false, true );
  - |-
    <?php
    submit_button( 'Save', 'primary', false );
invalid:
  - |-
    <?php
    submit_button( __( 'Apply' ), 'secondary', 'doaction', false );
  - |-
    <?php
    submit_button( 'Delete', 'delete', 'delete_all', true );
  - |-
    <?php
    if ( $x ) { submit_button( $label, 'primary large', 'publish', false ); }
  - |-
    <?php
    submit_button( __( 'Filter' ), '', 'filter_action', false );
