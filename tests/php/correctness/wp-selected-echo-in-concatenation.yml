id: wp-selected-echo-in-concatenation
valid:
  - 'function f( $a, $b ) { return ''<option'' . selected( $a, $b, false ) . ''>''; }'
  - 'function f( $a, $b ) { if ( selected( $a, $b ) == 1 ) { return 1; } }'
invalid:
  - 'function f( $a, $b ) { return ''<option'' . selected( $a, $b ) . ''>''; }'
  - 'function f( $a, $b ) { return ''<option'' . checked( $a, $b ) . ''>''; }'
