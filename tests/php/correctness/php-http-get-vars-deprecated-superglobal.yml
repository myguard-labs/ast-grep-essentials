id: php-http-get-vars-deprecated-superglobal
valid:
  - '<?php $u = $_GET[''linkurl''];'
  - '<?php $u = $_POST["linkurl"];'
  - '<?php $u = $_SERVER["REQUEST_URI"];'
  - '<?php $u = $http_get_vars["linkurl"];'
invalid:
  - '<?php $u = $HTTP_GET_VARS[''linkurl''];'
  - '<?php $u = $HTTP_POST_VARS["linkurl"];'
  - '<?php $u = $HTTP_SERVER_VARS["REQUEST_URI"];'
  - '<?php if ( isset( $HTTP_POST_VARS["linkurl"] ) ) { run(); }'
