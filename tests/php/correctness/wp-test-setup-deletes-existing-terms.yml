id: wp-test-setup-deletes-existing-terms
valid:
  - >-
    <?php class T extends WC_Unit_Test_Case { public function build_tree(): void
    { parent::setUp(); foreach ( get_terms( array( 'taxonomy' => 'product_cat',
    'hide_empty' => false ) ) as $t ) { wp_delete_term( $t->term_id,
    'product_cat' ); } } } ?>
  - '<?php class T extends WP_UnitTestCase { public function tearDown(): void { wp_delete_term( $this->term_id, ''product_cat'' ); parent::tearDown(); } }'
  - '<?php class T extends WP_UnitTestCase { public function setUp(): void { parent::setUp(); $this->term = wp_insert_term( ''x'', ''product_cat'' ); } }'
  - '<?php class T extends WP_UnitTestCase { public function test_delete(): void { wp_delete_term( $this->term_id, ''category'' ); $this->assertTrue( true ); } }'
invalid:
  - >-
    <?php class T extends WC_Unit_Test_Case { public function setUp(): void {
    parent::setUp(); foreach ( get_terms( array( 'taxonomy' => 'product_cat',
    'hide_empty' => false ) ) as $t ) { wp_delete_term( $t->term_id,
    'product_cat' ); } } } ?>
  - '<?php class T extends WP_UnitTestCase { protected function setUp(): void { parent::setUp(); foreach ( get_terms( ''category'', array( ''hide_empty'' => false ) ) as $term ) { wp_delete_term( $term->term_id, ''category'' ); } } }'
  - '<?php class T extends WP_UnitTestCase { public function setUp() { parent::setUp(); array_map( function ( $t ) { wp_delete_term( $t->term_id, ''category'' ); }, get_categories() ); } }'
  - '<?php class T extends WP_UnitTestCase { public function setUp(): void { foreach ( get_terms( array( ''taxonomy'' => ''post_tag'', ''hide_empty'' => false ) ) as $t ) { wp_delete_term( $t->term_id, ''post_tag'' ); } parent::setUp(); } }'
