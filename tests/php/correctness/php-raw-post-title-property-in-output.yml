id: php-raw-post-title-property-in-output
valid:
  - '$title = esc_attr(get_the_title($post->ID));'
  - '$t = esc_attr($post->post_name);'
  - '$t = esc_attr($title);'
  - '$t = esc_attr(get_the_title($this->post));'
invalid:
  - '$title = esc_attr($post->post_title);'
  - '$t = esc_attr($this->post_title);'
  - '$t = esc_attr($wp_query->post->post_title);'
  - 'echo ''<input value="'' . esc_attr($item->post_title) . ''">'';'
