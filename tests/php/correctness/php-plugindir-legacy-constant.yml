id: php-plugindir-legacy-constant
valid:
  - '<?php $path = ABSPATH . WP_PLUGIN_DIR . ''/hello.php'';'
  - '<?php $p = WP_PLUGIN_URL . ''/hello.php'';'
  - '<?php $p = ''PLUGINDIR'';'
  - '<?php $p = $plugindir;'

invalid:
  - '<?php $path = ABSPATH . PLUGINDIR . ''/hello.php'';'
  - '<?php $p = PLUGINDIR;'
  - '<?php include( PLUGINDIR . ''/hello.php'' );'
  - '<?php if ( defined( ''X'' ) && file_exists( PLUGINDIR ) ) {}'
