id: php-docblock-unclosed-html-tag
valid:
  - |-
    /**
     * Checks the value <tt>$function_to_add</tt>
     */
  - '/** Plain summary with no markup. */ function f() {}'
  - |-
    /**
     * Value <tt>$a</tt> and
     * value <tt>$b</tt>
     */
  - |-
    /**
     * Opens <tt>$a
     * continues here</tt>
     */
invalid:
  - |-
    /**
     * Checks the value <tt>$function_to_add
     */
  - '/** Checks <tt>$a */ function f() {}'
  - |-
    /**
     * @param string $a Name of <tt>$a
     * @return void
     */
  - |-
    /**
     * First <tt>$a and
     * second <tt>$b
     */
