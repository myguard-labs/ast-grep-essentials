id: php-mysql2date-args-swapped
valid:
  - '<?php $t = mysql2date(get_option(''time_format''), $post->post_date); ?>'
  - '<?php $t = mysql2date("Y-m-d", $post->post_date);'
  - '<?php $t = mysql2date(get_option("date_format"), $post->post_date, false);'
  - '<?php $fmt = get_option("date_format"); $t = mysql2date($fmt, $post->post_date);'
invalid:
  - '<?php $t = mysql2date($post->post_date, get_option(''time_format'')); ?>'
  - '<?php $t = mysql2date($row->date, get_option("time_format"));'
  - '<?php echo mysql2date( $comment->comment_date, get_option( "date_format", "Y-m-d" ) );'
  - '<?php $t = mysql2date($a . " " . $b, get_option("date_format"));'
  - '<?php $t = mysql2date( $p->post_date, get_option( $key ) );'
