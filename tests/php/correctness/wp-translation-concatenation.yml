id: wp-translation-concatenation
valid:
  - '<?php echo __(''Hello'');'
  - "<?php printf( __( 'Hello %s' ), $name );"
  - "<?php echo sprintf( __( 'Hello %s' ), $name );"
  - "<?php echo __( 'a' ), $name;"
invalid:
  - '<?php echo __(''Hello'') . $name;'
  - "<?php echo __( 'Hello' ) . $name;"
  - "<?php $m = __( 'Hello ' ) . $name . '!';"
  - "<?php return __( 'Error: ' ) . $e->getMessage();"
  - "<?php echo __( 'a', 'dom' ) . $y;"
