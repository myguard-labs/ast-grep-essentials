id: php-superglobal-read-without-isset
valid:
  - >-
    <?php if ( isset( $_GET['author'] ) && $_GET['author'] == $current_user->ID
    ) { $class = 'current'; }
  - '<?php if ( array_key_exists( ''a'', $_POST ) && $_POST[''a''] == ''x'' ) {}'
  - '<?php if ( isset( $_POST[''a''], $_POST[''b''] ) && $_POST[''a''] == $_POST[''b''] ) {}'
  - '<?php if ( isset( $_GET[''a''] ) && $_GET[''a''] != ''x'' ) {}'
invalid:
  - '<?php if ( $_GET[''author''] == $current_user->ID ) { $class = ''current''; }'
  - '<?php if ( $_POST[''a''] == ''x'' ) {}'
  - '<?php if ( ''x'' == $_GET[''a''] ) {}'
  - '<?php $r = $_POST[''a''] != ''x'';'
