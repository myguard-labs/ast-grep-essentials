id: wp-deprecated-get-category-rss-link
valid:
  - '<?php $url = get_category_feed_link(1, ''rss2'');'
  - '<?php $u = get_category_link( 5 );'
  - '<?php $u = get_term_feed_link( 5, ''category'' );'
invalid:
  - '<?php $url = get_category_rss_link(false, 1, ''news'');'
  - '<?php echo get_category_rss_link();'
  - '<?php echo esc_url( get_category_rss_link( true, $cat_id, $cat_name ) );'
  - '<?php function f() { return get_category_rss_link( false, 3, ''x'' ); }'
