id: php-count-comparison-expression
valid:
  - '<?php if ( is_array( $ids ) && count( $ids ) > 0 ) { echo ''x''; }'
  - '<?php $n = count( $ids, COUNT_RECURSIVE );'
invalid:
  - '<?php if ( is_array( $ids ) && count( $ids > 0 ) ) { echo ''x''; }'
  - '<?php $n = count( $a <= $b );'
  - '<?php $n = count( $a !== $b );'
  - '<?php $n = count( $a < $b );'
  - '<?php $n = count( $a >= $b );'
  - '<?php $n = count( $a == $b );'
  - '<?php $n = count( $a != $b );'
  - '<?php $n = count( $a === $b );'
