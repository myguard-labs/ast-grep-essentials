id: php-deprecated-split-call
valid:
  - '$encdata = explode('','', $enc);'
  - '$parts = preg_split( ''/[,;]/'', $s );'
  - '$parts = mb_split( '','', $s );'
  - '$parts = $this->split( '','', $s );'
  - '$parts = str_split( $s, 2 );'
invalid:
  - '$encdata = split('','', $enc);'
  - '$parts = split( ''[,;]'', $s, 2 );'
  - '$parts = split( "\n", $text );'
  - 'list( $k, $v ) = split( ''='', $line, 2 );'
  - 'foreach ( split( '','', $s ) as $p ) { $x = $p; }'
