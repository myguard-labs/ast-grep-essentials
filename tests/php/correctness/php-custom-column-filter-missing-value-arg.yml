id: php-custom-column-filter-missing-value-arg
valid:
  - |-
    <?php
    $r .= apply_filters( 'manage_users_custom_column', '', $column_name, $user_object->ID );
  - '<?php $r = apply_filters( ''manage_users_custom_column'', $value, $column_name, $user_id );'
  - '<?php $r = apply_filters( ''manage_users_columns'', $columns );'
  - '<?php $r = apply_filters( ''manage_users_custom_column'', '''', $column_name, $user_id, $extra );'
invalid:
  - |-
    <?php
    $r .= apply_filters( 'manage_users_custom_column', $column_name, $user_object->ID );
  - '<?php $r = apply_filters( ''manage_users_custom_column'', $column_name, $user_id );'
  - '<?php return apply_filters( ''manage_users_custom_column'', $this->col, $this->user->ID );'
  - '<?php echo apply_filters( ''manage_users_custom_column'', $col, get_current_user_id() );'
