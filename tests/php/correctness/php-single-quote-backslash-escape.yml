id: php-single-quote-backslash-escape
valid:
  - '$m = ''$GLOBALS]->ID'';'
  - "<?php $m = '[a-z]+';"
  - "<?php $m = 'a]b[c';"
  - "<?php $m = 'a\\\\b]';"
invalid:
  - '$m = ''$GLOBALS\]->ID'';'
  - "<?php $m = '\\[0\\]';"
  - "<?php $m = 'foo\\]';"
  - "<?php $m = '\\[';"
  - "<?php $a = $b['x\\]y'];"
  - "<?php $m = '\\[' . $x;"
