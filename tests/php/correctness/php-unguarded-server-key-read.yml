    <?php return isset($_SERVER['HTTPS']) ? strtolower($_SERVER['HTTPS']) ==
    'on' : false;
  - '<?php echo strtolower( isset( $_SERVER[''HTTPS''] ) ? $_SERVER[''HTTPS''] : ''off'' );'
  - '<?php log_it( $a, isset( $_SERVER[''REMOTE_ADDR''] ) ? $_SERVER[''REMOTE_ADDR''] : ''-'' );'
  - '<?php $ip = filter_var( isset( $_SERVER[''REMOTE_ADDR''] ) ? $_SERVER[''REMOTE_ADDR''] : '''', FILTER_VALIDATE_IP );'
invalid:
