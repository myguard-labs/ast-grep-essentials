  - '<?php $h = trim( $_SERVER["HTTP_HOST"] );'
  - '<?php log_it( $a, $_SERVER[''REMOTE_ADDR''] );'
  - '<?php $o = new Client( $_SERVER[''HTTP_USER_AGENT''] );'
