id: php-wpdb-escape-call
valid:
  - '<?php $name = $wpdb->prepare( ''%s'', $category->name );'
  - '<?php $s = esc_sql( $input );'
  - '<?php $s = $wpdb->esc_like( $term );'
invalid:
  - '<?php $name = $wpdb->escape( $category->name );'
  - '<?php $s = $wpdb->escape( $_POST[''name''] );'
  - '<?php $q = "x" . $wpdb->escape( $input );'
  - '<?php function f( $v ) { global $wpdb; return $wpdb->escape( $v ); }'
