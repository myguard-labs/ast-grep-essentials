id: php-get-bloginfo-siteurl-key
valid:
  - '$link = get_bloginfo(''url'');'
  - '$link = get_bloginfo(''name'');'
  - '$link = get_option(''siteurl'');'
  - '$link = get_bloginfo(''wpurl'');'
invalid:
  - '$link = get_bloginfo(''siteurl'');'
  - 'echo get_bloginfo(''siteurl'');'
  - '$u = get_bloginfo(''siteurl'') . ''/wp-login.php'';'
  - '$u = esc_url(get_bloginfo(''siteurl''));'
