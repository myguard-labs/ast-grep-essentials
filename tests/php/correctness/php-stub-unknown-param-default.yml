id: php-stub-unknown-param-default
valid:
  - 'function mt_srand(int $seed = 0, int $mode = MT_RAND_MT19937): void {}'
  - "<?php\nfunction f( $a = null ) {}"
  - "<?php\nfunction f( $a = 'UNKNOWN' ) {}"
  - "<?php\nfunction f( $a = UNKNOWN_FLAG ) {}"
invalid:
  - 'function mt_srand(int $seed = UNKNOWN, int $mode = MT_RAND_MT19937): void {}'
  - "<?php\nfunction f( $a = UNKNOWN ) {}"
  - "<?php\nclass A { public function m( string $s = UNKNOWN ): void {} }"
  - "<?php\nfunction f( ?int $a = UNKNOWN, int ...$rest ): void {}"
