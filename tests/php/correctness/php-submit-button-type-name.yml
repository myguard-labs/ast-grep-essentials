id: php-submit-button-type-name
valid:
  - '<?php submit_button( ''Search'', ''primary'', ''submit'', false );'
  - "<?php submit_button( 'Save', 'primary' );"
  - "<?php submit_button( 'Save', 'secondary', 'submit' );"
  - "<?php submit_button( 'Save', $type, 'submit' );"
invalid:
  - '<?php submit_button( ''Search'', ''submit'', ''submit'', false );'
  - "<?php submit_button( __( 'Save' ), 'submit', 'save', false );"
  - "<?php submit_button( $text, 'submit', 'name', true, array( 'id' => 'x' ) );"
  - "<?php submit_button( 'Save', 'submit', 'save' );"
