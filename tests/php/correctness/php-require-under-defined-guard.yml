id: php-require-under-defined-guard
valid:
  - >-
    if ( defined('WP_CACHE') && file_exists(ABSPATH .
    'wp-content/advanced-cache.php') ) require (ABSPATH .
    'wp-content/advanced-cache.php');
  - 'if ( file_exists(ABSPATH . ''wp-content/advanced-cache.php'') ) require (ABSPATH . ''wp-content/advanced-cache.php'');'
  - 'if ( defined(''WP_CACHE'') && is_file( ABSPATH . ''wp-content/advanced-cache.php'' ) ) require (ABSPATH . ''wp-content/advanced-cache.php'');'
  - 'if ( defined(''WP_CACHE'') && file_exists( ABSPATH . ''wp-content/advanced-cache.php'' ) ) { require (ABSPATH . ''wp-content/advanced-cache.php''); }'
invalid:
  - >-
    if ( defined('WP_CACHE') ) require (ABSPATH .
    'wp-content/advanced-cache.php');
  - 'if ( defined(''WP_ADVANCED'') ) require (ABSPATH . ''wp-content/advanced-cache.php'');'
  - '<?php if ( defined( ''WP_CACHE'' ) ) require (ABSPATH . ''wp-content/advanced-cache.php'');'
  - 'if (defined("WP_CACHE")) require (ABSPATH . ''wp-content/advanced-cache.php'');'
