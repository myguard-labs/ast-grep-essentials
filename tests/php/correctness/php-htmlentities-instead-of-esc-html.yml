id: php-htmlentities-instead-of-esc-html
valid:
  - '<?php $title = esc_html(strip_tags($rss->get_title()));'
  - '<?php $t = esc_attr( $x );'
  - '<?php $t = wp_kses_post( $x );'
  - '<?php $t = $formatter->htmlentities( $x );'
invalid:
  - '<?php $title = htmlentities(strip_tags($rss->get_title()));'
  - '<?php $t = htmlentities( $x, ENT_QUOTES, "UTF-8" );'
  - '<?php echo htmlentities( $x );'
  - '<?php $t = trim( htmlentities( $x, ENT_QUOTES ) );'
