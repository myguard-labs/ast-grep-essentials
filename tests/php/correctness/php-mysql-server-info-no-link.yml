id: php-mysql-server-info-no-link
valid:
  - '<?php $v = mysql_get_server_info($dbh);'
  - '<?php $v = mysql_get_server_info( $this->dbh );'
  - '<?php $v = mysqli_get_server_info($db);'
  - '<?php $v = $db->mysql_get_server_info();'
invalid:
  - '<?php $v = mysql_get_server_info();'
  - '<?php echo mysql_get_server_info();'
  - '<?php if (version_compare(mysql_get_server_info(), "5.5", ">=")) { $x = 1; }'
  - '<?php $v = (string) mysql_get_server_info();'
