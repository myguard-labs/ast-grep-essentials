id: php-wp-category-cat-name-property
valid:
  - '$label = $category->name;'
  - '$cat_name = $category->name;'
  - '$slug = $term->slug;'
  - '$label = get_cat_name( $id );'
invalid:
  - '$label = $category->cat_name;'
  - 'echo $cat->cat_name;'
  - '$x = $cats[0]->cat_name;'
  - '$x = $this->category->cat_name;'
