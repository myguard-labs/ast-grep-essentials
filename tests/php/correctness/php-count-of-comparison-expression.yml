id: php-count-of-comparison-expression
valid:
  - |-
    <?php
    function f($ids) {
        if ( is_array($ids) && count($ids) > 0 ) {
            return 1;
        }
    }
  - '<?php $n = count($a) > 0;'
  - '<?php $n = count($a, COUNT_RECURSIVE) > 0;'
  - '<?php $n = count(array_filter($a, fn($x) => $x > 0));'
invalid:
  - |-
    <?php
    function f($ids) {
        if ( is_array($ids) && count($ids > 0) ) {
            return 1;
        }
    }
  - '<?php $n = count($a[''k''] > 0);'
  - '<?php $n = count($o->list > 0);'
  - '<?php $n = count(array_keys($a) > 0);'
