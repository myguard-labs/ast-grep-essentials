id: php-html-entity-decode-request-no-quotes
valid:
  - |-
    <?php
    $title = html_entity_decode( $_GET['t'], ENT_QUOTES );
  - '<?php $t = html_entity_decode( $_GET[''t''], ENT_QUOTES, ''UTF-8'' );'
  - '<?php $t = html_entity_decode( $_POST[''t''], ENT_QUOTES | ENT_HTML5, ''UTF-8'' );'
  - '<?php $t = html_entity_decode( $_GET[''t''], flags: ENT_QUOTES );'
invalid:
  - |-
    <?php
    $title = html_entity_decode( $_GET['t'] );
  - '<?php $t = html_entity_decode( $_POST[''t''] );'
  - '<?php $t = html_entity_decode( $_REQUEST[''t''] );'
  - '<?php $t = html_entity_decode( $_GET[''t''] ?? '''' );'
  - '<?php $t = trim( html_entity_decode( wp_unslash( $_POST[''t''] ) ) );'
