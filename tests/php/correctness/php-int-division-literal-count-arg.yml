id: php-int-division-literal-count-arg
valid:
  - |-
    <?php
    $b = array_fill(0, intdiv(0xFFFF, 32) + 1, 0xFFFFFFFF);
  - |-
    <?php
    $b = array_fill(0, 5, (10 / 2));
invalid:
  - |-
    <?php
    $b = array_fill(0, (0xFFFF / 32) + 1, 0xFFFFFFFF);
  - |-
    <?php
    $b = array_fill(0, (10 / 4), 0);
  - |-
    <?php
    $b = array_fill(0, 10 / 4, 0);
