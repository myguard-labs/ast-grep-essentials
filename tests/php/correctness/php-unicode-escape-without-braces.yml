id: php-unicode-escape-without-braces
valid:
  - '$s = "\u{00e4}";'
  - '<?php $s = ''\udce4'';'
  - '<?php $s = "caf\xc3\xa9";'
  - '<?php $s = "\u{1F600}";'
  - '<?php $s = "\u{00e4}\u{00fc}";'
invalid:
  - '$s = "\udce4";'
  - '<?php $s = "\u00e4";'
  - '<?php $s = "Price: \u20ac5";'
  - '<?php $n = ''x''; $s = "Hello $n \u00e9";'
  - '<?php $s = "\u{00e4}\u00e4";'
