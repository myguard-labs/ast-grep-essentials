id: php-comparator-self-subtraction
valid:
  - "<?php\nfunction cmp( $a, $b ) {\n\treturn $a->instance_number - $b->instance_number;\n}"
  - "<?php function c($a,$b){ return $a[\"k\"] - $b[\"k\"]; }"
  - "<?php function c($a,$b){ return $a - 1; }"
invalid:
  - "<?php\nfunction cmp( $a, $b ) {\n\treturn $a->instance_number - $a->instance_number;\n}"
  - "<?php function c($a,$b){ return $a[\"k\"] - $a[\"k\"]; }"
  - "<?php function c($a,$b){ return strlen($a) - strlen($a); }"
