id: wp-template-index-file-exists-bypass
valid:
  - >-
    if ( file_exists( get_index_template() ) ) { $template =
    get_index_template(); }
  - |-
    <?php
    if ( file_exists( TEMPLATEPATH . '/functions.php' ) ) { load(); }
  - |-
    <?php
    if ( file_exists( locate_template( 'index.php' ) ) ) { load(); }
  - |-
    <?php
    if ( file_exists( get_template_directory() . '/index.php' ) ) { load(); }
invalid:
  - >-
    if ( file_exists( TEMPLATEPATH . '/index.php' ) ) { $template = TEMPLATEPATH
    . '/index.php'; }
  - |-
    <?php
    if ( ! file_exists( TEMPLATEPATH . '/index.php' ) ) { die(); }
  - |-
    <?php
    $ok = file_exists( TEMPLATEPATH . '/index.php' ) && is_readable( $x );
  - |-
    <?php
    $ok = file_exists( TEMPLATEPATH.'/index.php' );
