id: php-srand-microtime-seed
valid:
  - |-
    <?php
    function f() {
        srand(1234);
    }
  - |-
    <?php
    function f() {
        mt_srand(42);
    }
  - |-
    <?php
    function f() {
        mt_srand(random_int(0, PHP_INT_MAX));
    }
  - |-
    <?php
    function f() {
        $t = microtime(true);
        return $t;
    }
invalid:
  - |-
    <?php
    function f() {
        srand((float) microtime() * 1000000);
    }
  - |-
    <?php
    function f() {
        mt_srand(microtime(true) * 1000);
    }
  - |-
    <?php
    function f() {
        srand((int) microtime(true));
    }
  - |-
    <?php
    function f() {
        mt_srand((double) microtime() * 100000);
    }
