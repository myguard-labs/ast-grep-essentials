id: php-wpdb-escape-deprecated
valid:
  - '<?php $s = $other->escape( $input );'
  - '<?php $s = esc_sql( $input );'
  - '<?php $s = $wpdb->prepare( ''x = %s'', $input );'
invalid:
  - '<?php $s = $wpdb->escape( $input );'
  - '<?php $s = $wpdb->escape();'
  - '<?php $wpdb->escape( $a, $b );'
  - '<?php $q = "x" . $wpdb->escape( $input );'
