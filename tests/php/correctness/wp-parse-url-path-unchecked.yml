id: wp-parse-url-path-unchecked
valid:
  - >-
    $url_parts = parse_url( $url ); $extension = pathinfo( $url_parts['path'] ??
    '', PATHINFO_EXTENSION );
  - '<?php $e = pathinfo( $parts[''path''] ?? '''' );'
  - '<?php $e = pathinfo( (string) parse_url( $url, PHP_URL_PATH ), PATHINFO_EXTENSION );'
  - '<?php $e = pathinfo( $parts[''host''], PATHINFO_EXTENSION );'
invalid:
  - >-
    $url_parts = parse_url( $url ); $extension = pathinfo( $url_parts['path'],
    PATHINFO_EXTENSION );
  - '<?php $e = pathinfo( $parts[''path''], PATHINFO_FILENAME | PATHINFO_EXTENSION );'
  - '<?php $r = array( ''ext'' => pathinfo( $parts[''path''], PATHINFO_EXTENSION ) );'
  - '<?php function f( $u ) { $parts = parse_url( $u ); return pathinfo( $parts[''path''], PATHINFO_DIRNAME ); }'
