id: php-strpos-identity-true
valid:
  - 'if ( strpos( $src, ''/'' ) === false ) { $src = ''''; }'
  - '<?php if (strpos($src, ''/'') !== false) { $a = 1; }'
  - '<?php if (strpos($src, ''/'') === 0) { $a = 1; }'
invalid:
  - 'if ( strpos( $src, ''/'' ) === true ) { $src = ''''; }'
  - '<?php $ok = strpos($s, ''x'') === true;'
  - '<?php if (strpos($h, $n) === true && $flag) { $a = 1; }'
