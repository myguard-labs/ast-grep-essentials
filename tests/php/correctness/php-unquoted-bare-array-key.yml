id: php-unquoted-bare-array-key
valid:
  - '<?php $x = $q[''s'']; ?>'
  - '<?php $x = $q["s"];'
  - '<?php $x = $q[$s];'
  - '<?php $x = $q[0];'
  - '<?php $x = $s[1];'
invalid:
  - '<?php $x = $q[s]; ?>'
  - '<?php $x = $_GET[s];'
  - '<?php $q[s] = 1;'
  - '<?php foo($arr[s], 1);'
  - '<?php echo $a->b[s];'
