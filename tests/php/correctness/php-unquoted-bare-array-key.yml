id: php-unquoted-bare-array-key
valid:
  - '<?php $t = $_GET[''template''];'
  - '<?php $t = $a[self::KEY];'
  - '<?php $t = $a[$i];'
  - '<?php $t = $a->items[0];'
  - '<?php $t = $a["k"]["j"];'
  - '<?php $x = $q[''s'']; ?>'
  - '<?php $x = $q["s"];'
  - '<?php $x = $q[$s];'
  - '<?php $x = $q[0];'
  - '<?php $x = $s[1];'
invalid:
  - '<?php $t = $_GET[template];'
  - '<?php $t = $_POST[action];'
  - '<?php $a[key] = 1;'
  - '<?php $t = $a->b[c];'
  - '<?php $t = $a[''x''][id];'
  - '<?php $x = $q[s]; ?>'
  - '<?php $x = $_GET[s];'
  - '<?php $q[s] = 1;'
  - '<?php foo($arr[s], 1);'
  - '<?php echo $a->b[s];'
