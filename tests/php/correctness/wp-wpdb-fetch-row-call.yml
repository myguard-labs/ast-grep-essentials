id: wp-wpdb-fetch-row-call
valid:
  - '<?php $alias = $wpdb->get_row( $sql );'
  - "$row = $wpdb->get_row( $sql );"
  - "$rows = $wpdb->get_results( $sql, ARRAY_A );"
  - "$row = $result->fetch_row();"
invalid:
  - '<?php $alias = $wpdb->fetch_row( $sql );'
  - "$row = $wpdb->fetch_row();"
  - "$row = $wpdb->fetch_row( $sql, ARRAY_A );"
  - "if ( $wpdb->fetch_row( $sql ) ) { $found = true; }"
