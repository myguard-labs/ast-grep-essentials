id: wp-wpdb-prepare-quoted-placeholder
valid:
- "<?php $row = $wpdb->get_row( $wpdb->prepare( \"SELECT * FROM t WHERE email = %s\", $email ) );"
- "<?php $row = $wpdb->prepare( 'SELECT * FROM t WHERE id = %d', $id );"
- "<?php $row = $wpdb->query( \"SELECT * FROM t WHERE e = '%s'\" );"
- "<?php $row = $stmt->prepare( \"SELECT * FROM t WHERE e = '%s'\" );"
- "<?php /* $wpdb->prepare( \"SELECT e = '%s'\", $e ); */"
- "<?php $s = \"prepare SELECT e = '%s'\";"
- "<?php $row = $wpdb->prepare( \"SELECT * FROM t WHERE code = '%1\\$s'\", $code );"
- "<?php $row = $wpdb->prepare( \"SELECT * FROM t WHERE code = '%05s'\", $code );"
- "<?php $row = $wpdb->prepare( \"SELECT * FROM t WHERE code = '%S'\", $code );"
- "<?php $row = $wpdb->prepare( \"SELECT * FROM t WHERE id = '%D'\", $id );"
- "<?php $row = $wpdb->prepare( \"SELECT * FROM t WHERE name = '%I'\", $name );"
invalid:
- "<?php $row = $wpdb->get_row( $wpdb->prepare( \"SELECT * FROM t WHERE email = '%s'\", $email ) );"
- "<?php $row = $wpdb->prepare( 'SELECT * FROM t WHERE id = \"%d\"', $id );"
- "<?php $row = $mydb->prepare( \"SELECT * FROM t WHERE n = '%1\\$d'\", $n );"
- "<?php $row = $wpdb->prepare( \"SELECT * FROM t WHERE n = '%05d'\", $n );"
- "<?php $row = $wpdb->prepare( \"SELECT * FROM t WHERE ratio = '%F'\", $ratio );"
