id: php-hand-written-selected-attribute
valid:
  - '$class = $current == $value ? '' class="active"'' : '''';'
  - '$s = selected( $a, $b, false );'
  - '$c = $x ? '' data-x="1"'' : '''';'
  - '$c = $x ? '' selected="selected" class="on"'' : '''';'

invalid:
  - '$selected = $current == $value ? '' selected="selected"'' : '''';'
  - 'echo $a == $b ? '' selected="selected"'' : '''';'
  - 'printf( ''<option %s>'', $a == $b ? '' selected="selected"'' : '''' );'
  - 'echo ''<option '' . ( $a === $b ? '' selected="selected"'' : '''' ) . ''>'';'
