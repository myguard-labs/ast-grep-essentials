id: wp-get-post-types-underscore-show-key
valid:
  - '<?php get_post_types( array( ''show_ui'' => true ) ); ?>'
  - '<?php get_post_types( array( ''show_ui'' => true ), ''objects'' ); ?>'
  - '<?php get_post_types( array( ''public'' => true ) ); ?>'
  - '<?php get_post_types( array( ''_builtin'' => false ) ); ?>'
invalid:
  - '<?php get_post_types( array( ''_show'' => true ) ); ?>'
  - '<?php get_post_types( array( ''_show'' => $flag ) ); ?>'
  - '<?php $t = get_post_types( array( ''_show'' => 1 ) ); ?>'
