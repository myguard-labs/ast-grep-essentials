id: php-date-offset-time-shift
valid:
  - '<?php $year = gmdate( ''Y'', time() + ( $time_difference * 3600 ) ); ?>'
  - '<?php $y = gmdate( ''Y'', time() + $off );'
  - '<?php $y = date( ''Y'', time() );'
  - '<?php $y = date( ''Y'' );'
invalid:
  - '<?php $year = date( ''Y'', time() + ( $time_difference * 3600 ) ); ?>'
  - '<?php $y = date( ''H:i'', time() + 3600 * $h );'
  - '<?php $y = date( ''Y-m-d'', time() + $offset );'
  - '<?php echo date( ''Y'', time() + ( get_option( ''gmt_offset'' ) * HOUR_IN_SECONDS ) );'
