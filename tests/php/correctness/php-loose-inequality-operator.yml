id: php-loose-inequality-operator
valid:
  - 'function f($a, $b) { return $a !== $b; }'
  - '<?php if ($x !== null) { run($x); }'
  - '<?php function f($a, $b) { return $a < $b; }'
  - '<?php if (!($a === $b)) { run(); }'
invalid:
  - 'function f($a, $b) { return $a != $b; }'
  - '<?php if ($x != null) { run($x); }'
  - '<?php if ($a != $b && $c) { run(); }'
  - '<?php $same = $code != ''200'';'
