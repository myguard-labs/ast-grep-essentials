id: php-user-trailingslashit-concat
valid:
  - >-
    <?php $link = get_category_link($cat_ID); $link = trailingslashit($link) .
    user_trailingslashit('feed', 'feed');
  - '<?php $l = user_trailingslashit( $link );'
  - '<?php $u = trailingslashit($base) . user_trailingslashit($path);'
invalid:
  - >-
    <?php $link = get_category_link($cat_ID); $link = $link .
    user_trailingslashit('feed', 'feed');
  - '<?php $u = $base . user_trailingslashit($path);'
  - '<?php return $permalink . user_trailingslashit( $slug, ''single'' );'
  - '<?php echo $base . user_trailingslashit(''page/2'', ''paged'');'
