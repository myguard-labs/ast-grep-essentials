id: wp-the-post-unguarded
valid:
  - 'if ( have_posts() ) the_post();'
  - "<?php if ( have_posts() ) { the_post(); }"
  - "<?php while ( have_posts() ) { the_post(); the_title(); }"
  - "<?php if ( have_posts() ) { while ( have_posts() ) { the_post(); } }"
invalid:
  - 'the_post();'
  - "<?php the_post();"
  - "<?php get_header(); the_post();"
  - "<?php the_post(); the_title();"
