id: php-adjacent-literals-merged-in-list
valid:
  - '<?php $names = ''notes''. ''linkcheck'';'
  - "<?php $m = array('a', 'b');"
  - "<?php $m = array($a . 'b');"
  - "<?php $m = 'a' . 'b'; $n = array('c', 'd');"
invalid:
  - '<?php $names = array(''notes''. ''linkcheck'');'
  - "<?php $m = ['notes' . 'linkcheck', 'x'];"
  - "<?php $m = [ 'a' . 'b' ];"
  - "<?php $m = array('a' . 'b', 'c');"
