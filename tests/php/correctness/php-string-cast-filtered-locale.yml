id: php-string-cast-filtered-locale
valid:
  - |-
    <?php
    $locale = get_locale();
  - |-
    <?php
    $l = get_locale();
    if (!is_string($l)) {
        $l = 'en_US';
    }
  - |-
    <?php
    $l = is_string($l = get_locale()) ? $l : 'en_US';
invalid:
  - |-
    <?php
    $locale = (string) get_locale();
  - |-
    <?php
    $l = (string)get_locale();
  - |-
    <?php
    $k = 'cache_' . (string) get_locale();
  - |-
    <?php
    foo((string) get_locale());
