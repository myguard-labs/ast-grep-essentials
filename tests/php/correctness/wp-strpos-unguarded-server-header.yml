id: wp-strpos-unguarded-server-header
valid:
  - >-
    <?php if ( isset( $_SERVER['HTTP_USER_AGENT'] ) && strpos(
    $_SERVER['HTTP_USER_AGENT'], 'OS 7_' ) !== false ) { $x = 1; }
  - '<?php if ( empty( $_SERVER[''HTTP_USER_AGENT''] ) || strpos( $_SERVER[''HTTP_USER_AGENT''], ''OS 7_'' ) === false ) { $x = 0; }'
  - '<?php if ( ! empty( $_SERVER[''HTTP_REFERER''] ) && strpos( $_SERVER[''HTTP_REFERER''], home_url() ) === 0 ) { $x = 1; }'
  - '<?php $ua = isset( $_SERVER[''HTTP_USER_AGENT''] ) ? $_SERVER[''HTTP_USER_AGENT''] : ''''; if ( strpos( $ua, ''OS 7_'' ) !== false ) { $x = 1; }'
invalid:
  - >-
    <?php if ( strpos( $_SERVER['HTTP_USER_AGENT'], 'OS 7_' ) !== false ) { $x =
    1; }
  - '<?php if ( strpos( $_SERVER["HTTP_USER_AGENT"], ''OS 7_'' ) !== false ) { $x = 1; }'
  - '<?php if ( strpos( $_SERVER[''HTTP_ACCEPT_LANGUAGE''], ''de'' ) === 0 ) { $x = 1; }'
  - '<?php if ( false !== strpos( $_SERVER[''HTTP_REFERER''], ''example.com'' ) ) { $x = 1; }'
