id: wp-wpdb-escape-deprecated
valid:
  - '$name = $db->escape( $raw_name );'
  - "$x = esc_sql( $name );"
  - "$x = $wpdb->prepare( 'SELECT ID FROM t WHERE n LIKE %s', '%' . $wpdb->esc_like( $name ) . '%' );"
  - "$x = $wpdb->get_var( $wpdb->prepare( 'SELECT ID FROM t WHERE n = %s', $name ) );"
invalid:
  - '$name = $wpdb->escape( $raw_name );'
  - "$q = \"SELECT ID FROM t WHERE n = '\" . $wpdb->escape( $_POST['n'] ) . \"'\";"
  - "function f( $n ) { global $wpdb; return $wpdb->escape( $n ); }"
  - "$clean = array_map( 'trim', array( $wpdb->escape( $a ), $b ) );"
  - "$x = $wpdb->escape( $a, $b );"
