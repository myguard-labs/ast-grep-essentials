id: php-gmdate-of-strtotime-local-date
valid:
  - '<?php $gmt = gmdate(''Y-m-d H:i:s'', time());'
  - '<?php $g = gmdate( ''Y'', $ts );'
  - '<?php $g = date_i18n( ''Y'', strtotime( $d ) );'
  - '<?php $g = gmdate( ''Y'', get_post_time( ''U'', true ) );'

invalid:
  - '<?php $gmt = gmdate(''Y-m-d H:i:s'', strtotime($d));'
  - '<?php $g = gmdate( ''c'', strtotime( $d ) );'
  - '<?php echo gmdate( ''Y-m-d'', strtotime( $post->post_date ) );'
  - '<?php $g = gmdate( $fmt, strtotime( $a . '' '' . $b ) );'
