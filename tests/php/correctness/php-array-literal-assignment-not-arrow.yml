id: php-array-literal-assignment-not-arrow
valid:
  - 'function f( $k, $v, $rest ) { return array( $k => $v ) + $rest; }'
  - '<?php $a = array( ''cb'' => function ( $v ) { $v = trim( $v ); return $v; } );'
invalid:
  - 'function f( $k, $v, $rest ) { return array( $k = $v ) + $rest; }'
  - '<?php $a = array( $k = 1, 2 );'
