id: wp-manual-gmt-offset-time
valid:
  - |-
    <?php
    $now = time() + get_option( 'gmt_offset' );
  - '<?php /* $now = time() + ( get_option( ''gmt_offset'' ) * 3600 ); */ $x = 1;'
  - '<?php $t = current_time( ''timestamp'' );'
  - '<?php $t = time() + HOUR_IN_SECONDS;'
invalid:
  - |-
    <?php
    $now = time() + ( get_option( 'gmt_offset' ) * 3600 );
  - '<?php function f(){ return time() + ( get_option( ''gmt_offset'' ) * 3600 ); }'
  - '<?php echo date( ''H:i'', time() + ( get_option( ''gmt_offset'' ) * 3600 ) );'
