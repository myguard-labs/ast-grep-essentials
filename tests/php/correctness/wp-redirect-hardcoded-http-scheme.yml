id: wp-redirect-hardcoded-http-scheme
valid:
  - '<?php wp_redirect( network_home_url() );'
  - '<?php wp_redirect( admin_url( ''edit.php'' ) . ''&updated=1'' );'
  - '<?php wp_redirect( $url . ''#top'' );'
invalid:
  - >-
    <?php wp_redirect( "http://" . $current_site->domain . $current_site->path
    );
  - '<?php wp_redirect( ''http://example.com/'' . $path );'
