id: php-str-replace-two-arguments
valid:
  - |
    <?php
    $headers = str_replace("\r\n", "\n", $headers);
  - |-
    <?php
    $t = str_replace('a', 'b', $t);
  - |-
    <?php
    $t = str_replace(["a", "b"], "", $t);
  - |-
    <?php
    $t = str_replace($s, $r, $t, $n);
invalid:
  - |
    <?php
    $headers = str_replace("\r\n", "\n");
  - |-
    <?php
    $t = str_replace("a", "b");
  - |-
    <?php
    $t = str_replace($s, $r);
  - |-
    <?php
    $t = str_replace(["a", "b"], "");
