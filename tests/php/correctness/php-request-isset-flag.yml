id: php-request-isset-flag
valid:
  - '<?php $do_resize = isset( $_POST[''image_resize''] );'
  - '<?php $f = isset( $local[''a''] );'
  - '<?php $v = $_REQUEST[''a''] ?? '''';'
  - '<?php if ( isset( $_REQUEST[''a''] ) ) { echo 1; }'
invalid:
  - '<?php $do_resize = isset( $_REQUEST[''image_resize''] );'
  - '<?php $flag = isset( $_REQUEST[''a''], $_REQUEST[''b''] );'
  - '<?php $this->flag = isset($_REQUEST[''debug'']);'
  - '<?php function f() { $admin = isset( $_REQUEST["admin"] ); return $admin; }'
