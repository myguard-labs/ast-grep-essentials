id: php-printf-literal-format-not-translated
valid:
  - '<?php printf( __( ''Revisions: %s'' ), $count );'
  - '<?php printf( ''Revisions: 100'', $count );'
  - '<?php printf( _n( ''%s item'', ''%s items'', $n ), $n );'
  - '<?php printf( esc_html__( ''Revisions: %s'' ), $count );'
invalid:
  - '<?php printf( ''Revisions: %s'', $count );'
  - '<?php printf( ''Done: %d%%'', $pct );'
  - '<?php printf( ''%1$s of %2$s'', $a, $b );'
  - '<?php $n = printf( ''Revisions: %s'', $count );'
