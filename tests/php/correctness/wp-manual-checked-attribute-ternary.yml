id: wp-manual-checked-attribute-ternary
valid:
  - '<?php echo ($opt == $val ? '' class="on"'' : ''''); ?>'
  - '<?php echo checked( $opt, $val, false );'
  - '<?php $attr = checked( $opt, $val, false ); echo $attr;'
invalid:
  - '<?php echo ($opt == $val ? '' checked="checked"'' : ''''); ?>'
  - '<?php echo ( ! empty( $o[''a''] ) ? '' checked="checked"'' : '''' );'
  - '<?php function f($a){ echo ($a && $b ? '' checked="checked"'' : ''''); }'
