id: wp-ip-sanitize-ipv4-only-class
valid:
  - >-
    <?php $ip = preg_replace( '/[^0-9a-fA-F:., ]/', '', $_SERVER['REMOTE_ADDR']
    );
  - '<?php $ip = preg_replace( ''/[^0-9a-f.:]/i'', '''', $_SERVER[''REMOTE_ADDR''] );'
  - '<?php $ip = filter_var( $_SERVER[''REMOTE_ADDR''], FILTER_VALIDATE_IP );'
invalid:
  - '<?php $ip = preg_replace( ''/[^0-9., ]/'', '''', $_SERVER[''REMOTE_ADDR''] );'
  - '<?php $ip = preg_replace( "/[^0-9.]/", '''', $_SERVER[''REMOTE_ADDR''] );'
  - '<?php $ip = preg_replace( ''/[^\d.]/'', '''', $_SERVER[''REMOTE_ADDR''] );'
  - '<?php return preg_replace( ''/[^0-9a-f.]/i'', '''', $_SERVER[''REMOTE_ADDR''] );'
