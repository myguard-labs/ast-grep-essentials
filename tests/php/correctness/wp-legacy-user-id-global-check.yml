id: wp-legacy-user-id-global-check
valid:
  - '<?php if ( $user_name ) : ?><p>Name</p><?php endif; ?>'
  - '<?php if ( is_user_logged_in() ) : ?><p>In</p><?php endif; ?>'
  - '<?php if ( get_current_user_id() ) : ?><p>In</p><?php endif; ?>'
invalid:
  - '<?php if ( $user_ID ) : ?><p>Logged in</p><?php endif; ?>'
  - '<?php if ( $user_ID ) : echo ''in''; endif;'
  - '<?php if ( $user_ID ) : ?><p>In</p><?php else : ?><p>Out</p><?php endif; ?>'
  - '<?php if ($user_ID): ?><a href="/x">Account</a><?php endif ?>'
