id: php-byref-function-returns-call
valid:
  - >-
    <?php function &get_items() { $items = apply_filters( 'items', array() );
    return $items; }
  - '<?php function f( &$items ) { return apply_filters( ''items'', $items ); }'
invalid:
  - '<?php function &get_items() { return apply_filters( ''items'', array() ); }'
  - '<?php function &get_items( $x ) { return apply_filters( ''items'', $x ); }'
