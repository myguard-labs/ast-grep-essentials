id: php-superglobal-index-unguarded-compare
valid:
  - >-
    <?php if ( isset( $_GET['post_status'] ) && 'trash' == $_GET['post_status']
    ) echo 'trash';
  - '<?php if ( ! empty( $_GET[''s''] ) && ''a'' == $_GET[''s''] ) echo 1;'
  - '<?php if ( isset( $_GET[''s''], $_GET[''t''] ) && $_GET[''s''] === $_GET[''t''] ) echo 1;'
  - '<?php if ( ! isset( $_GET[''s''] ) || $_GET[''s''] === ''a'' ) echo 1;'
invalid:
  - '<?php if ( ''trash'' == $_GET[''post_status''] ) echo ''trash'';'
  - '<?php if ( $_GET[''s''] == ''a'' ) echo 1;'
  - '<?php if ( ''a'' === $_GET[''s''] ) echo 1;'
  - '<?php if ( $_GET["s"] === ''a'' ) echo 1;'
