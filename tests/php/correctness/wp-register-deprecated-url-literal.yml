id: wp-register-deprecated-url-literal
valid:
  - '<?php $u = get_option(''siteurl'').''/wp-login.php?action=register''; ?>'
  - '<?php $u = wp_registration_url();'
  - '<?php $u = site_url( ''wp-login.php?action=register'' );'
  - '<?php $u = ''register.php'';'
invalid:
  - '<?php $u = get_option(''siteurl'').''/wp-register.php''; ?>'
  - '<?php $u = site_url( ''wp-register.php'' );'
  - '<?php echo ''<a href="/wp-register.php?x=1">Register</a>'';'
  - '<?php header(''Location: /wp-register.php'');'
