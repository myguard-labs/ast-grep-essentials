id: wp-attribute-escape-call
valid:
  - '<?php echo ''<a title="'' . esc_attr($style) . ''">''; ?>'
  - '<?php echo esc_attr( $value );'
  - |-
    <?php $x = my_attribute_escape( $value );
  - |-
    <?php $x = $this->attribute_escape( $value );
invalid:
  - '<?php echo ''<a title="'' . attribute_escape($style) . ''">''; ?>'
  - |-
    <?php echo attribute_escape( $a, $b );
  - |-
    <?php return attribute_escape( get_the_title() );
  - |-
    <?php echo esc_attr( attribute_escape( $v ) );
