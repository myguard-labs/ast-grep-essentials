id: php-superglobal-dollar-prefixed-key
valid:
  - '$x = $_POST[''post_author''];'
  - '<?php $x = $_POST[$key];'
  - '<?php $x = $_REQUEST[''a$b''];'
  - '<?php $x = $_POST["$id"];'
invalid:
  - '$x = $_POST[''$post_author''];'
  - '<?php $x = $_GET[''$id''];'
  - '<?php $x = $_REQUEST[''$id''];'
  - '<?php $x = $_POST[ ''$id'' ];'
