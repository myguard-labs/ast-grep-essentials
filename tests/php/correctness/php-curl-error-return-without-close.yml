id: php-curl-error-return-without-close
valid:
  - |-
    <?php
    function f($handle) {
        if ($curl_error = curl_error($handle)) {
            curl_close($handle);
            return new WP_Error('http_request_failed', $curl_error);
        }
    }
invalid:
  - |-
    <?php
    function f($handle) {
        if ($curl_error = curl_error($handle)) {
            return new WP_Error('http_request_failed', $curl_error);
        }
    }
