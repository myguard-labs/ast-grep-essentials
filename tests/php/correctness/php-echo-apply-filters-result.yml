id: php-echo-apply-filters-result
valid:
  - '<?php $output = apply_filters( ''wp_list_categories'', $output );'
  - '<?php echo esc_html( apply_filters( ''title'', $t ) );'
  - '<?php $out = apply_filters( ''title'', $t ); echo $out;'
  - '<?php return apply_filters( ''title'', $t );'
invalid:
  - '<?php echo apply_filters( ''wp_list_categories'', $output );'
  - '<?php echo apply_filters( ''title'' );'
  - '<?php function f( $t ) { echo apply_filters( ''title'', $t, 3 ); }'
  - '<?php echo apply_filters( ''the_content'', get_the_content() );'
