id: wp-translatable-string-embedded-url
valid:
  - '$msg = __( ''Consider a <a href="%s">child theme</a> instead.'' );'
  - "$m = __( 'Read the documentation.' );"
  - "$m = __( 'Consider a <a href=\"%s\">child theme</a>.', 'twentyten' );"
  - "$m = sprintf( __( 'See <a href=\"%s\">docs</a>.' ), 'http://example.org/docs' );"
invalid:
  - >-
    $msg = __( 'Consider a <a
    href="http://codex.wordpress.org/Child_Themes">child theme</a> instead.' );
  - "$m = __( 'Visit http://example.com for details.' );"
  - "echo __( '<a href=\"http://example.org/\">link</a>' );"
  - "$m = __('<img src=\"http://x.test/a.png\" alt=\"\">');"
