id: php-misspelled-sprintf-call
valid:
  - |-
    <?php
    $actions['spam'] = sprintf( '<a>%s</a>', $url );
  - |-
    <?php $s = vsprintf( '%s-%s', $parts );
  - |-
    <?php $s = printf( '%s', $x );
  - |-
    <?php $s = sprintf();
invalid:
  - |-
    <?php
    $actions['spam'] = sprinf( '<a>%s</a>', $url );
  - |-
    <?php echo sprinf( '%s-%s', $a, $b );
  - |-
    <?php $s = sprinf( ...$args );
  - |-
    <?php $f = array_map( fn( $v ) => sprinf( '%d', $v ), $xs );
