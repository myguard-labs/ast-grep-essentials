id: wp-ternary-guard-base-mismatch
valid:
  - >-
    $slug = empty( $ctx->post->post_name ) ? 'page' : 'page-' .
    $ctx->post->post_name;
  - '<?php $s = empty( $o->name ) ? ''n'' : $o->name;'
  - '<?php $s = empty( $this->slug ) ? '''' : ''a-'' . $this->slug;'
  - '<?php $s = empty( $a->name ) ? ''x'' : ''x-'' . $b->title;'
invalid:
  - >-
    $slug = empty( $ctx->post->post_name ) ? 'page' : 'page-' .
    $post->post_name;
  - '<?php $s = empty( $this->slug ) ? '''' : ''a-'' . $other->slug;'
  - '<?php $s = empty( $a->id ) ? 0 : ''#'' . $b->id;'
  - '<?php return empty( $item->label ) ? ''none'' : ''L:'' . $entry->label;'
