id: wp-gettext-nonliteral-sprintf
valid:
  - '$title = sprintf( __(''Comment on %s''), $post->post_title );'
  - '<?php printf( __( ''Hi %s'', ''td'' ), $n );'
  - '<?php $t = __( ''Hello'', ''td'' );'
invalid:
  - '$title = __( sprintf(''Comment on %s'', $post->post_title) );'
  - '<?php $t = __( sprintf( ''Hi %1$s %2$s'', $a, $b ) );'
  - '<?php echo esc_html( __( sprintf( ''x'' ) ) );'
  - '<?php $msg = __( sprintf( "Hello %s", $name ) );'
