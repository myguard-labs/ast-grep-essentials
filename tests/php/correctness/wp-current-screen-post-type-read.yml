id: wp-current-screen-post-type-read
valid:
  - '<?php $screen = get_current_screen(); $post_type = $screen->post_type;'
  - "<?php $screen = get_current_screen(); if ( $screen ) { $post_type = $screen->post_type; }"
  - '<?php $post_type = get_post_type( $post_id );'
  - "<?php global $typenow; $post_type = $typenow;"
invalid:
  - '<?php $post_type = get_current_screen()->post_type;'
  - "<?php if ( get_current_screen()->post_type === 'post' ) { echo 'post'; }"
  - "<?php echo get_current_screen()->post_type;"
  - "<?php $pt = get_current_screen()->post_type ?? '';"
