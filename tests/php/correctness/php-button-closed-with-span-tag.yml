id: php-button-closed-with-span-tag
valid:
  - '$html = ''<button type="button">Preview</button>'';'
  - '$h = ''<button><span>Go</span></button>'';'
  - '$h = ''<span>Go</span>'';'
  - 'echo ''<button type="button">Go</button>'';'
invalid:
  - '$html = ''<button type="button">Preview</span>'';'
  - '$h = ''<button class="btn" id="go">Go</span>'';'
  - 'echo ''<button type="submit"><i></i>Save</span>'';'
  - '$h = ''<button type="button">Go</span> <span>x</span>'';'
