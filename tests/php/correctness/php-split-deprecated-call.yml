id: php-split-deprecated-call
valid:
  - '<?php $parts = explode('' '', $line);'
  - |-
    <?php $p = preg_split('/,/', $s);
  - |-
    <?php $p = str_split($s);
  - |-
    <?php $p = $obj->split(',');
  - |
    $encdata = explode(',', $enc);
  - |
    $parts = preg_split( '/[,;]/', $s );
  - |
    $parts = mb_split( ',', $s );
  - |
    $parts = $this->split( ',', $s );
  - |
    $parts = str_split( $s, 2 );
  - |
    <?php $parts = explode(' ', $argv);
  - |
    <?php $p = mb_split(',', $s);
  - |
    <?php $p = Foo::split(',');
invalid:
  - '<?php $parts = split('' '', $line);'
  - |-
    <?php $p = split(',', $s);
  - |-
    <?php foreach (split(',', $s) as $x) {}
  - |-
    <?php list($a, $b) = split('=', $s);
  - |
    $encdata = split(',', $enc);
  - |
    $parts = split( '[,;]', $s, 2 );
  - |
    $parts = split( "\n", $text );
  - |
    list( $k, $v ) = split( '=', $line, 2 );
  - |
    foreach ( split( ',', $s ) as $p ) { $x = $p; }
  - |
    <?php $parts = split(' ', $argv);
  - |
    <?php $p = split("\n", $x, 2);
  - |
    <?php echo count(split(',', $s));
