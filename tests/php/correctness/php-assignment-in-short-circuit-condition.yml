id: php-assignment-in-short-circuit-condition
valid:
  - '<?php function f($a) { $m = g(); if ( !$a || $m ) { return $m; } }'
  - '<?php function f($a) { if ( ($m = g()) && $a ) { return $m; } }'
  - '<?php function f($a) { $m = g(); if ( $a && $m ) { return $m; } }'
  - '<?php function f($a, $b) { if ( $a || $b ) { $m = g(); return $m; } }'
invalid:
  - '<?php function f($a) { if ( !$a || $m = g() ) { return $m; } }'
  - '<?php function f($a) { if ( $a && $m = g() ) { return $m; } }'
  - '<?php function f($a) { if ( $a || $b && $m = g() ) { return $m; } }'
  - '<?php function f($a) { if ( $a ) { return 0; } elseif ( !$a or $m = g() ) { return $m; } }'
