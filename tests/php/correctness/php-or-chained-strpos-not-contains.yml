id: php-or-chained-strpos-not-contains
valid:
  - >-
    <?php if ( strpos( $show, 'url' ) === false && strpos( $show, 'home' ) ===
    false ) { $info = 1; }
  - |
    <?php
    if ( strpos( $a, 'x' ) === false || strpos( $b, 'y' ) === false ) { $i = 1; }
  - |
    <?php
    if ( strpos( $s, 'a' ) !== false || strpos( $s, 'b' ) !== false ) { $i = 1; }
invalid:
  - >-
    <?php if ( strpos( $show, 'url' ) === false || strpos( $show, 'home' ) ===
    false ) { $info = 1; }
  - |
    <?php
    return strpos( $s, $a ) === false || strpos( $s, $b ) === false;
  - |
    <?php
    if ( strpos( $this->url, 'a' ) === false || strpos( $this->url, 'b' ) === false ) { $i = 1; }
