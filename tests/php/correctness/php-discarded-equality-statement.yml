id: php-discarded-equality-statement
valid:
  - '<?php $blog[''summary''] = $tag[''value''];'
  - '<?php $ok = ($a == $b);'
  - '<?php if ($a == $b) { echo 1; }'
  - '<?php assert($a == $b);'
  - '<?php $a == $b || die();'
invalid:
  - '<?php $blog[''summary''] == $tag[''value''];'
  - '<?php $a[0] == ''x'';'
  - '<?php if ($x) $a == $b;'
  - '<?php $a == null;'
