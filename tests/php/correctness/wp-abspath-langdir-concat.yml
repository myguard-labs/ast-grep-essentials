id: wp-abspath-langdir-concat
valid:
  - '<?php $mofile = ABSPATH . WP_LANG_DIR . "/$locale.mo";'
  - '<?php $d = ABSPATH . WPINC . "/languages";'
  - '<?php load_textdomain("x", WP_LANG_DIR . "/plugins/x-" . $l . ".mo");'
  - '<?php $p = ABSPATH . "wp-content/languages";'
invalid:
  - '<?php $mofile = ABSPATH . LANGDIR . "/$locale.mo";'
  - '<?php $p = ABSPATH . LANGDIR;'
  - '<?php load_textdomain("x", ABSPATH . LANGDIR . "/plugins/x-" . $l . ".mo");'
  - '<?php function d() { return ABSPATH . LANGDIR . "/themes"; }'
