id: php-get-option-home-url-concat
valid:
  - '$url = get_option(''blogname'') . ''/xmlrpc.php'';'
  - '$url = home_url( ''/xmlrpc.php'' );'
  - '$url = get_option( ''home'' );'
  - '$same = get_option( ''home'' ) === $current;'
invalid:
  - '$url = get_option(''home'') . ''/xmlrpc.php'';'
  - '$url = get_option( ''home'' ) . $path;'
  - '$url = get_option( ''home'' ).''/feed/'';'
  - '$url = esc_url( get_option( ''home'' ) . ''/wp-login.php'' );'
