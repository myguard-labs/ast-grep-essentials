id: php-str-replace-two-args
valid:
  - '$h = str_replace(''\r\n'', ''\n'', $h);'
  - |-
    $t = str_replace('a', 'b', $t);
  - |-
    $t = str_replace('a', 'b', $t, $n);
  - |-
    $t = str_replace(['a' => 1], ['b'], $t);
invalid:
  - '$h = str_replace(''\r\n'', ''\n'');'
  - |-
    $t = str_replace($s, $r);
  - |-
    $t = str_replace(['a', 'b'], '');
  - |-
    $t = str_replace(search: 'a', replace: 'b');
