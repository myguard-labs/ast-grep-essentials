id: php-wp-specialchars-call
valid:
  - '$title = esc_html( $raw );'
  - '$t = esc_attr( $raw );'
  - '$t = wp_specialchars_decode( $s );'
  - '$t = htmlspecialchars( $s );'
invalid:
  - '$title = wp_specialchars( $raw );'
  - 'echo wp_specialchars( $raw, true );'
  - '$t = wp_specialchars( $a, 1, ''UTF-8'' );'
  - '$t = esc_html( wp_specialchars( $x ) );'
