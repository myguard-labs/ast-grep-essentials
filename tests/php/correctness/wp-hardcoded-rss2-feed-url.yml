id: wp-hardcoded-rss2-feed-url
valid:
  - 'wp_redirect( get_bloginfo( ''url'' ), 301 );'
  - '$feed = get_feed_link( get_default_feed() );'
  - '$name = get_bloginfo( ''name'' );'
  - '$v = get_bloginfo( $key );'
invalid:
  - 'wp_redirect( get_bloginfo( ''rss2_url'' ), 301 );'
  - '$feed = get_bloginfo( ''rss2_url'' );'
  - 'echo esc_url( get_bloginfo( ''rss2_url'' ) );'
  - '$links[] = get_bloginfo(''rss2_url'');'
