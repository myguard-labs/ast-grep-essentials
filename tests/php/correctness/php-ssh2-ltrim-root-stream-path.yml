    function g( $file ) { return file_get_contents( 'ssh2.sftp://' . $this->sftp_link . '/' . $file ); }
  - |-
    function g( $f ) { return file_get_contents( '/tmp/cache/' . ltrim( $f, '/' ) ); }
  - |-
