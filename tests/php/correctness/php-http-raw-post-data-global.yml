id: php-http-raw-post-data-global
valid:
  - '$request_body = trim($request_body);'
  - '$body = file_get_contents( "php://input" );'
  - '$body = $_POST["HTTP_RAW_POST_DATA"];'
  - '$http_raw_post_data = trim( $request_body );'
invalid:
  - '$HTTP_RAW_POST_DATA = trim($HTTP_RAW_POST_DATA);'
  - 'if ( ! empty( $HTTP_RAW_POST_DATA ) ) { run(); }'
  - '$msg = "body: $HTTP_RAW_POST_DATA";'
  - 'global $HTTP_RAW_POST_DATA;'
