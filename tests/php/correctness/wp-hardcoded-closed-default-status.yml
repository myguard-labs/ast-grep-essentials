id: wp-hardcoded-closed-default-status
valid:
  - >-
    <?php if ( ! isset( $post_data['comment_status'] ) ) {
    $post_data['comment_status'] = get_option( 'default_comment_status' ); }
  - '<?php /* if ( ! isset( $post_data[''comment_status''] ) ) { $post_data[''comment_status''] = ''closed''; } */ $x = 1;'
  - '<?php $post_data[''comment_status''] = get_option( ''default_comment_status'' );'
  - '<?php if ( $post_data[''comment_status''] === ''closed'' ) { return; }'
  - '<?php $post_data[''post_status''] = ''closed'';'
invalid:
  - >-
    <?php if ( ! isset( $post_data['comment_status'] ) ) {
    $post_data['comment_status'] = 'closed'; }
  - '<?php $commentdata[''comment_status''] = ''closed'';'
  - '<?php function f( $args ) { $args[''comment_status''] = ''closed''; return $args; }'
  - '<?php $this->defaults[''comment_status''] = ''closed'';'
