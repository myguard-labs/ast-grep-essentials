id: php-ftp-call-missing-connection
valid:
  - '<?php $pwd = ftp_pwd( $conn );'
  - '<?php $r = ftp_close($conn);'
  - '<?php $r = ftp_pwd(...$args);'
  - '<?php $r = ftp_get($c, $local, $remote, FTP_BINARY);'
invalid:
  - '<?php $pwd = ftp_pwd();'
  - '<?php $ok = ftp_close();'
  - '<?php $files = ftp_nlist();'
  - '<?php if (!ftp_pasv()) { die("x"); }'
