id: wp-ternary-statement-call-branches
valid:
  - >-
    <?php $label = cond() ? esc_attr__( 'Publish' ) : esc_attr__( 'Submit for
    Review' ); ?>
  - '<?php do_action( ''save'', $is_new ? ''insert'' : ''update'' ); ?>'
  - '<?php wp_redirect( $ok ? a() : b() ); ?>'
invalid:
  - >-
    <?php cond() ? esc_attr_e( 'Publish' ) : esc_attr_e( 'Submit for Review' );
    ?>
  - '<?php $ok ? a() : b(); ?>'
