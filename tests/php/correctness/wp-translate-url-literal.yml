id: wp-translate-url-literal
valid:
  - '$title = __( ''WordPress.org'' );'
  - "<?php $a = esc_url( 'https://wordpress.org' );"
  - "<?php $a = sprintf( '<a href=\"%s\">%s</a>', 'https://wordpress.org', __( 'WordPress' ) );"
  - "<?php $a = __( 'Visit our website' );"
invalid:
  - '$href = __( ''http://wordpress.org'' );'
  - "<?php $a = __( 'https://wordpress.org/plugins/' );"
  - "<?php echo esc_url( __( 'http://example.com/help' ) );"
