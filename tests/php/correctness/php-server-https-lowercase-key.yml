id: php-server-https-lowercase-key
valid:
  - '<?php $secure = isset($_SERVER[''HTTPS'']) && $_SERVER[''HTTPS''] == ''on'';'
  - "<?php $scheme = $_SERVER['REQUEST_SCHEME'] ?? 'http';"
  - "<?php $cfg = $config['https'];"
invalid:
  - '<?php $secure = isset($_SERVER[''https'']) && $_SERVER[''https''] == ''on'';'
  - "<?php $secure = $_SERVER[\"https\"] == 'on';"
  - "<?php $secure = isset($_SERVER[ 'https' ]);"
