id: wp-untranslated-wp-error-message
valid:
  - >-
    <?php return new WP_Error( 'http_request_failed', __( 'User has blocked
    requests.' ) ); ?>
  - "<?php return new WP_Error( 'code', esc_html__( 'Invalid.', 'td' ) );"
  - "<?php return new WP_Error( 'code', $message );"
  - "<?php return new WP_Error( 'code' );"
invalid:
  - >-
    <?php return new WP_Error( 'http_request_failed', 'User has blocked
    requests.' ); ?>
  - "<?php $e = new WP_Error( $code, 'Invalid request.' );"
  - "<?php if ( $bad ) { throw_it( new WP_Error( 'code', 'Invalid.' ) ); }"
  - "<?php return new WP_Error( 'code', 'Invalid.' );"
