id: php-request-stripslashes-unguarded
valid:
  - >-
    <?php $theme_name = isset($_REQUEST['theme_name']) ? stripslashes(
    $_REQUEST['theme_name'] ) : '';
  - '<?php $x = stripslashes( $value );'
  - '<?php function f() { $x = isset ( $_REQUEST[''a''] ) ? trim( stripslashes( $_REQUEST[''a''] ) ) : ''''; }'
  - '<?php $x = stripslashes( ''it\''s'' );'
invalid:
  - '<?php $theme_name = stripslashes( $_REQUEST[''theme_name''] );'
  - '<?php function f() { return stripslashes( $_REQUEST[''a''] ); }'
  - '<?php echo stripslashes($_REQUEST["name"]);'
  - '<?php $x = ''a'' . stripslashes( $_REQUEST[''a''] );'
