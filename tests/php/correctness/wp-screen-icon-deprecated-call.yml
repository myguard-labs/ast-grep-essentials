id: wp-screen-icon-deprecated-call
valid:
  - '<?php my_screen_icon(); ?>'
  - '<?php $this->screen_icon();'
  - '<?php $icon = get_screen_icon_name( ''edit'' );'
  - '<?php Admin_Helper::screen_icon( ''edit'' );'
  - '<?php Admin::screen_icon();'
  - '<?php screen_icon_rtl();'
invalid:
  - '<?php screen_icon(); ?>'
  - '<?php echo screen_icon( ''options-general'' );'
  - '<?php function show_head() { screen_icon( ''themes'' ); }'
  - '<?php $h = screen_icon();'
  - "<?php function render() { screen_icon(); echo '<h2>T</h2>'; }"
  - "<?php class P { function page() { screen_icon(); } }"
  - '<?php screen_icon( );'
  - '<?php screen_icon( ''edit'' );'
