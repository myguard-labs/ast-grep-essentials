id: php-gettext-wrapped-file-extension
valid:
  - '<?php $ext = __( ''Thumbnail'' );'
  - "<?php $ext = __( 'Save .jpg file' );"
  - "<?php $ext = __( 'Thumbnail.' );"
  - "<?php $ext = __( $label );"
invalid:
  - '<?php $ext = __( ''.thumbnail'' );'
  - "<?php $a = [ __( '.png' ) ];"
  - "<?php foo( __( '.tar.gz' ) );"
  - "<?php if ( $x ) { echo __( '.zip' ); }"
