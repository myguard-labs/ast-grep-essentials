id: php-server-key-unguarded-read
valid:
  - >-
    $n = isset($_SERVER['SCRIPT_FILENAME']) ?
    strlen($_SERVER['SCRIPT_FILENAME']) : 0;
  - "$n = isset($_SERVER['REQUEST_URI']) ? strlen(trim($_SERVER['REQUEST_URI'])) : 0;"
  - "$n = isset($_SERVER['A'], $_SERVER['B']) ? strlen($_SERVER['A']) + strlen($_SERVER['B']) : 0;"
invalid:
  - '$n = strlen($_SERVER[''SCRIPT_FILENAME'']);'
  - "$n = strlen($_SERVER[\"REQUEST_URI\"]);"
  - "$n = strlen(trim($_SERVER['QUERY_STRING']));"
