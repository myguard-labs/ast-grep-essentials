id: php-get-posts-number-key
valid:
  - '<?php get_posts( array( ''numberposts'' => 5 ) );'
  - '<?php get_posts( array( ''numberposts'' => 5, ''orderby'' => ''date'' ) );'
  - '<?php get_posts( [ ''numberposts'' => 5 ] );'
  - '<?php $users = get_users( array( ''number'' => 5 ) );'
invalid:
  - '<?php get_posts( array( ''number'' => 5 ) );'
  - '<?php get_posts( [ ''number'' => 5 ] );'
  - '<?php get_posts( array( ''orderby'' => ''date'', ''number'' => 5, ''post_type'' => ''page'' ) );'
  - '<?php $p = get_posts( array( ''post_type'' => ''page'', ''number'' => $n ) );'
