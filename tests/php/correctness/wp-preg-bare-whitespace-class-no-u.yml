id: wp-preg-bare-whitespace-class-no-u
valid:
  - '<?php function f($text) { return preg_split( ''#\s#u'', $text ); }'
  - '<?php $r = preg_match( ''/\s+/iu'', $s );'
  - '<?php $r = preg_replace( ''#\s+#u'', '' '', $s );'
  - '<?php $r = preg_split( ''/,/'', $s );'
  - '<?php $r = preg_match( ''/\d+/'', $s );'
invalid:
  - '<?php function f($text) { return preg_split( ''#\s#'', $text ); }'
  - '<?php $r = preg_match( ''/\s+/'', $s );'
  - '<?php $r = preg_replace( ''/\s+/'', '' '', $s );'
  - '<?php $r = preg_match_all( ''~\s*,\s*~'', $s, $m );'
  - '<?php $r = preg_replace_callback( ''/\s+/'', ''cb'', $s );'
