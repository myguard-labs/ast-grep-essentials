id: php-cs-fixer-unsupported-php-version-allowed
valid:
  - >-
    <?php return (new
    PhpCsFixer\Config())->setUnsupportedPhpVersionAllowed(false);
  - '<?php $config->setUnsupportedPhpVersionAllowed( false );'
  - '<?php $config->setRiskyAllowed( true );'
invalid:
  - >-
    <?php return (new
    PhpCsFixer\Config())->setUnsupportedPhpVersionAllowed(true);
  - '<?php $config->setUnsupportedPhpVersionAllowed(true);'
  - '<?php return Config::create()->setUnsupportedPhpVersionAllowed( true )->setRules( $rules );'
