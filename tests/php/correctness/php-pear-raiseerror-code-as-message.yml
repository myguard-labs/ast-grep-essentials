id: php-pear-raiseerror-code-as-message
valid:
  - >-
    <?php return PEAR::raiseError(null, DB_ERROR_NOT_FOUND, null, null, null,
    'DB_Error', true);
  - '<?php return PEAR::raiseError(''Not found'', DB_ERROR_NOT_FOUND, PEAR_ERROR_RETURN);'
  - '<?php return PEAR::raiseError($msg, null, PEAR_ERROR_DIE);'
  - '<?php return PEAR::raiseError(null, DB_ERROR_NOT_FOUND);'

invalid:
  - >-
    <?php return PEAR::raiseError(DB_ERROR_NOT_FOUND, null, null, null, null,
    'DB_Error', true);
  - '<?php return PEAR::raiseError(DB_ERROR_NOT_FOUND, null, null);'
  - '<?php return PEAR::raiseError(MDB2_ERROR_NOT_FOUND, null, null, null, null);'
  - '<?php return PEAR::raiseError(DB_ERROR_NOT_FOUND, null, PEAR_ERROR_RETURN, E_USER_WARNING);'
