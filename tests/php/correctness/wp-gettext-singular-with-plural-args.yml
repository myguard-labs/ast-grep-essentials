id: wp-gettext-singular-with-plural-args
valid:
  - '$s = __(''%s day'', ''default'');'
  - '<?php $s = __( ''%s day'' );'
  - '<?php $s = _n( ''%s day'', ''%s days'', $days );'
invalid:
  - '$s = __(''%s day'', ''%s days'', $days);'
  - '<?php echo __( ''One'', ''Many'', $n );'
  - '<?php return __( "a", "b", ''td'' );'
