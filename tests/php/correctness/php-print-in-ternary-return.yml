id: php-print-in-ternary-return
valid:
  - 'function f($echo, $nav) { if ($echo) { print $nav; } return $nav; }'
  - 'function f($c) { return $c ? function () { print 1; } : null; }'
  - 'function f($c, $v) { return $c ? $v : ''''; }'
  - 'function f($c, $v) { echo $c ? $v : ''''; }'
  - 'function f($c, $v) { if ($c) { print $v; } else { print ''''; } }'
invalid:
  - 'function f($echo, $nav) { return $echo ? print $nav : $nav; }'
  - 'function f($c, $v) { return $c ? $v : print $v; }'
  - 'function f($c, $v) { return $c ? (print $v) : $v; }'
  - 'class A { function m($c, $v) { return $c ? print $v : $v; } }'
