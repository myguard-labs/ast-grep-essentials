id: php-translation-placeholder-without-printf
valid:
  - '<?php printf( __( ''Read the <a href="%s">docs</a>.'' ), $url ); ?>'
  - '<?php printf( esc_html__( ''Found %s items'', ''td'' ), $count ); ?>'
  - '<?php echo sprintf( __( ''Found %s of %s'', ''td'' ), $a, $b ); ?>'
  - '<?php _e( ''Found items'' ); ?>'
invalid:
  - '<?php _e( ''Read the <a href="%s">docs</a>.'' ); ?>'
  - '<p><?php _e( ''Found %s items'' ); ?></p>'
  - '<?php _e( ''Found %s of %s'' ); ?>'
  - '<?php function show() { _e( ''Found <b>%s</b> items'' ); } ?>'
