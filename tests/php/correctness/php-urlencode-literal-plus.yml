id: php-urlencode-literal-plus
valid:
  - |-
    <?php
    $query_args = array( 'family' => urlencode( 'Open Sans:400,700' ) );
  - '<?php $q = urlencode(''Open Sans'');'
  - '<?php $q = urlencode($name) . ''+x'';'
invalid:
  - |-
    <?php
    $query_args = array( 'family' => urlencode( 'Open+Sans:400,700' ) );
  - '<?php $q = urlencode(''a+b'');'
  - '<?php $q = urlencode( ''c++'' );'
  - '<?php f(urlencode(''Open+Sans:400''), 1);'
