id: php-gettext-unnumbered-placeholders
valid:
  - '$s = sprintf( __( ''Updating plugin %1$d of %2$d...'' ), $i, $all );'
  - "$s = sprintf( __( 'Hello' ), $name );"
  - "$s = sprintf( __( 'Hello %1$s' ), $name );"
  - "$s = sprintf( __( '%2$s has %1$d items' ), $count, $name );"
invalid:
  - '$s = sprintf( __( ''Updating plugin %d of %d...'' ), $i, $all );'
  - "$s = sprintf( __( 'Hello %s' ), $name );"
  - "$s = sprintf( __( \"Hello %s\" ), $name );"
  - "$s = sprintf( __( '%s has %d items' ), $name, $count );"
