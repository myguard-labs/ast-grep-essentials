id: php-docblock-tag-missing-type
valid:
  - '/** @return array $form_fields */ function f() {}'
  - '/** @param string $name */ function f($name) {}'
  - '/** @param int|null $id */ function f($id) {}'
  - |-
    /**
     * @param array $items List
     * @return void
     */
    function f($items) {}
invalid:
  - '/** @return $form_fields */ function f() {}'
  - '/** @param $name */ function f($name) {}'
  - '/** @return   $this */ function f() {}'
  - |-
    /**
     * Run it.
     * @param $items List of items
     * @return array
     */
    function f($items) {}
