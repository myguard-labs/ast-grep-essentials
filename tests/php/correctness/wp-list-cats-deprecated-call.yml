id: wp-list-cats-deprecated-call
valid:
  - '<?php wp_list_categories(); ?>'
  - '<?php wp_list_categories( array( ''title_li'' => '''' ) );'
  - '<?php wp_dropdown_categories();'
invalid:
  - '<?php wp_list_cats(); ?>'
  - '<?php echo wp_list_cats( ''sort_column=name'' );'
  - '<?php $out = wp_list_cats( array( ''hide_empty'' => 0 ) );'
  - '<?php echo ''<ul>'' . wp_list_cats( ''a=b'' ) . ''</ul>'';'
