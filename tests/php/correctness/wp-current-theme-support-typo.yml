id: wp-current-theme-support-typo
valid:
  - '<?php $x = current_theme_supports( ''post-thumbnails'', ''post'' );'
  - '<?php if ( current_theme_supports( ''widgets'' ) ) { register_sidebar( $args ); }'
  - '<?php $uid = my_current_theme_support_check( ''widgets'' );'
  - '<?php add_theme_support( ''post-thumbnails'' );'
invalid:
  - '<?php $x = current_theme_support( ''post-thumbnails'', ''post'' );'
  - '<?php if ( current_theme_support( ''widgets'' ) ) { register_sidebar( $args ); }'
  - '<?php return ! current_theme_support( ''menus'' );'
  - '<?php $ok = current_theme_support( ''custom-logo'' ) ? 1 : 0;'
