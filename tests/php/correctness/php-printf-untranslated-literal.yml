id: php-printf-untranslated-literal
valid:
  - '<?php printf(__(''Edit &#8220%s&#8221; Category''), $name); ?>'
  - '<?php printf(esc_html__(''Total: %d items'', ''td''), $n); ?>'
  - '<?php printf($format, $n); ?>'
  - '<?php printf(_n(''%d item'', ''%d items'', $n, ''td''), $n); ?>'
invalid:
  - '<?php printf(''Edit &#8220%s&#8221; Category'', $name); ?>'
  - '<?php printf(''%s: %d items'', $label, count($rows)); ?>'
  - '<?php if ($ok) { printf(''Deleted %d rows'', $n); } ?>'
