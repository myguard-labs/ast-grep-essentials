id: wp-die-translated-message
valid:
  - |-
    <?php
    wp_die( __( 'Sorry, comments are closed.' ) );
  - '<?php die( ''Cheatin'' );'
  - '<?php die( $message );'
  - '<?php exit( 1 );'
invalid:
  - |-
    <?php
    die( __( 'Sorry, comments are closed.' ) );
  - '<?php if ( ! $ok ) { die( __( ''Not allowed.'' ) ); }'
  - '<?php die( __( $msg, ''d'' ) );'
  - '<?php die(__(''Nope'', ''my-plugin''));'
