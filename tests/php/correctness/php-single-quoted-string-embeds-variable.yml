id: php-single-quoted-string-embeds-variable
valid:
  - '<?php $s = get_gmt_from_date("$aa-$mm-$jj");'
  - '<?php $fn( ''plain'' );'
  - |-
    <?php $s = strlen("$a");
  - |-
    <?php $s = preg_match('/^a+/', $s);
  - |-
    <?php $s = trim('cost $5');
invalid:
  - '<?php $s = get_gmt_from_date(''$aa-$mm-$jj'');'
  - |-
    <?php do_action('save_$type');
  - |-
    <?php $o = get_option('$prefix_opt');
  - |-
    <?php $o = strtoupper('hi $name');
