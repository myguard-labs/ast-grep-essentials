id: php-mktime-substr-argument-uncast
valid:
  - '<?php $i = mktime((int) substr($m, 11, 2), 0, 0, 1, 1, 2000);'
  - |-
    <?php $i = mktime( intval( substr( $m, 11, 2 ) ), 0, 0, 1, 1, 2000 );
  - |-
    <?php $i = mktime( (int) substr( $m, 11, 2 ), (int) substr( $m, 14, 2 ), 0, 1, 1, 2000 );
  - |-
    <?php $i = mktime( $h, 0, 0, 1, 1, 2000 );
invalid:
  - '<?php $i = mktime(substr($m, 11, 2), 0, 0, 1, 1, 2000);'
  - |-
    <?php $i = mktime( substr( $m, 11, 2 ), substr( $m, 14, 2 ), 0, 1, 1, 2000 );
  - |-
    <?php $i = mktime( substr( $m, 11 ), 0 );
  - |-
    <?php $i = mktime(substr($m,11,2),0,0,1,1,2000);
