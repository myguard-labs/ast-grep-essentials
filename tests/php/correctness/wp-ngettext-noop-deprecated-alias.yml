id: wp-ngettext-noop-deprecated-alias
valid:
  - |-
    <?php
    $labels = _n_noop( 'Draft (%s)', 'Drafts (%s)' );
  - |-
    <?php
    $labels = _n_noop( 'Post', 'Posts', 'my-domain' );
  - |-
    <?php
    $labels = _nx_noop( 'Post', 'Posts', 'menu', 'my-domain' );
  - |-
    <?php
    echo translate_nooped_plural( $labels, $count );
invalid:
  - |-
    <?php
    $labels = __ngettext_noop( 'Draft (%s)', 'Drafts (%s)' );
  - |-
    <?php
    $labels = array( 'posts' => __ngettext_noop( 'Post', 'Posts' ) );
  - |-
    <?php
    register_labels( __ngettext_noop( 'Post', 'Posts', 'my-domain' ) );
