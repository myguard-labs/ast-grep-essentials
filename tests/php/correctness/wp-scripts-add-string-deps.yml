  - '<?php $scripts->add( "a", "/a.js", "1.5.4" );'
  - '<?php function f( $scripts ) { $scripts->add( ''a'', $src, ''3.1'' ); }'
  - '<?php $scripts->add( ''x'', plugins_url( ''x.js'' ), ''2.0'' );'
