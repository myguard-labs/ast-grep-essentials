  - '<?php $scripts->add( ''a'', ''/a.js'', array(), ''1.0'' );'
  - '<?php $scripts->add( ''a'', ''/a.js'' );'
  - '<?php $scripts->add( ''a'', ''/a.js'', array( ''jquery'' ), false, 1 );'
  - '<?php $scripts->add_data( ''a'', ''group'', 1 );'
invalid:
