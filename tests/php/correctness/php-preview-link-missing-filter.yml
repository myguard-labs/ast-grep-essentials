id: php-preview-link-missing-filter
valid:
  - >-
    $url = apply_filters( 'preview_post_link', add_query_arg( 'preview', 'true',
    get_permalink( $post->ID ) ) );
  - '$url = apply_filters( ''preview_post_link'', add_query_arg( ''preview'', ''true'', get_permalink( $post->ID ) ), $post );'
  - '$url = add_query_arg( ''page'', ''2'', get_permalink( $post->ID ) );'
  - '$url = add_query_arg( ''preview'', ''false'', get_permalink( $post->ID ) );'
invalid:
  - '$url = add_query_arg( ''preview'', ''true'', get_permalink( $post->ID ) );'
  - '$url = add_query_arg( ''preview'', ''true'', get_permalink() );'
  - '$url = add_query_arg( ''preview'', ''true'', get_permalink( $id ) ) . ''#top'';'
  - '$url = esc_url( add_query_arg( ''preview'', ''true'', get_permalink( $post ) ) );'
