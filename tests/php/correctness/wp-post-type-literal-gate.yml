id: wp-post-type-literal-gate
valid:
  - '<?php if ( is_object_in_taxonomy( get_post_type(), ''category'' ) ) : ?>'
  - '<?php if ( post_type_supports( get_post_type(), ''thumbnail'' ) ) { echo 1; }'
  - '<?php if ( is_object_in_taxonomy( get_post_type(), ''post_tag'' ) ) { echo 1; }'
  - '<?php if ( in_array( ''category'', get_object_taxonomies( get_post_type() ), true ) ) { echo 1; }'
invalid:
  - '<?php if ( ''post'' == get_post_type() ) : ?>'
  - '<?php $x = ( ''post'' == get_post_type() ) ? 1 : 2;'
  - '<?php if ( ( ''post'' == get_post_type() ) && $x ) { echo 1; }'
  - '<?php while ( have_posts() ) { if ( ''post'' == get_post_type() ) { echo 1; } }'
