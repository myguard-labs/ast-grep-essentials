id: php-gettext-concat-translation
valid:
  - '$out = sprintf( __( ''Changing to %s'' ), $base );'
  - '$out = sprintf( __( ''Changing to %s'', ''td'' ), $base );'
  - '$out = __( ''Hello'' );'
  - '$out = sprintf( ''%s: %s'', __( ''Label'' ), $value );'
  - '$out = implode( '', '', array( __( ''a'' ), __( ''b'' ) ) );'
invalid:
  - '$out = __( ''Changing to '' ) . $base;'
  - '$out = __( ''Hello, '' ) . $first . '' '' . $last;'
  - 'echo __( ''Hello, '' ) . $name;'
  - 'echo __( "Hello, " ) . $name;'
