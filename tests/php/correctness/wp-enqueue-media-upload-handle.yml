id: wp-enqueue-media-upload-handle
valid:
  - '<?php wp_enqueue_script( ''custom-header'' );'
  - "<?php wp_enqueue_script( 'my-media-upload' );"
  - "<?php wp_register_script( 'media-upload', $src );"
  - "<?php wp_enqueue_media();"
invalid:
  - '<?php wp_enqueue_script( ''media-upload'' );'
  - "<?php wp_enqueue_script( 'media-upload', '', array( 'jquery' ), '1.0', true );"
  - "<?php wp_enqueue_script( 'media-upload', get_template_directory_uri() . '/m.js' );"
  - "<?php add_action( 'admin_enqueue_scripts', function () { wp_enqueue_script( 'media-upload' ); } );"
