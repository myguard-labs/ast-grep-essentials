id: wp-deprecated-get-settings-call
valid:
  - '<?php $count = get_option(''posts_per_rss'');'
  - '<?php $n = get_site_option( ''blogname'' );'
  - '<?php $n = get_theme_mod( ''x'' );'
invalid:
  - '<?php $count = get_settings(''posts_per_rss'');'
  - '<?php if ( get_settings( ''users_can_register'' ) ) { die(); }'
  - '<?php echo esc_html( get_settings( ''blogname'' ) );'
  - '<?php $n = get_settings( $name );'
