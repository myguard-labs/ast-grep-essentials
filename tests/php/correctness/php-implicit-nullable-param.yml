id: php-implicit-nullable-param
valid:
  - 'function wxr_authors_list( ?array $post_ids = null ) {}'
  - 'function f( ?array $a = null ) {}'
  - 'function f( array|null $a = null ) {}'
  - 'function f( array $a ) {}'
  - 'function f( array $a = [] ) {}'
  - 'function g( array $a = array() ) {}'
  - 'function g( array $a = [1, 2] ) {}'
  - 'function g( array $a = self::DEFAULTS ) {}'
  - 'function g( array $a = FOO ) {}'
  - 'function g( array $null = [] ) {}'
  - 'function null( array $a = [] ) {}'
invalid:
  - 'function wxr_authors_list( array $post_ids = null ) {}'
  - 'function f(array $a=null){}'
  - 'function f( array $a = NULL ) {}'
  - 'function g( array $items = null ) {}'
  - 'function load_items( array $items = Null ) {}'
