id: php-gmdate-echoed-unlocalized
valid:
  - '<?php echo date_i18n( ''Y-m-d G:i:s'' ); ?>'
  - '<?php echo wp_date( ''Y-m-d'' ); ?>'
  - '<?php $s = gmdate( ''Y'' ); ?>'
  - '<?php echo mysql2date( ''Y'', $d ); ?>'

invalid:
  - '<?php echo gmdate( ''Y-m-d G:i:s'', time() ); ?>'
  - '<?php echo gmdate( ''Y'' ); ?>'
  - '<?php echo gmdate( $fmt, $ts ); ?>'
  - '<?php function f() { echo gmdate( ''Y-m-d'', $t ); }'
