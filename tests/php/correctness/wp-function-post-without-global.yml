id: wp-function-post-without-global
valid:
  - '<?php function the_author_posts() { global $post; echo $post->post_author; }'
  - '<?php function title_of( $post ) { return $post->post_title; }'
  - '<?php function f() { $post = get_post(); echo $post->ID; }'
invalid:
  - '<?php function the_author_posts() { echo $post->post_author; }'
  - '<?php function f( $id ) { echo $post->ID; }'
  - '<?php function f() { echo $post->ID; function g() { $post = 1; } }'
  - '<?php function f() { echo $post->ID; $c = function() { $post = get_post(); }; }'
