id: wp-register-post-type-missing-add-new-item
valid:
  - >-
    <?php register_post_type('book', array('labels' => array('name' => 'Books',
    'add_new_item' => 'Add Book'), 'public' => true));
  - '<?php register_post_type(''book'', array(''labels'' => array(''name'' => ''Books'', ''add_new_item'' => __(''Add Book'')), ''public'' => true));'
  - '<?php register_post_type(''book'', array(''public'' => true, ''labels'' => array(''add_new_item'' => ''Add Book'', ''name'' => ''Books'')));'
  - '<?php register_post_type(''book'', [''labels'' => [''name'' => ''Books'', ''add_new_item'' => ''Add''], ''public'' => true]);'
invalid:
  - >-
    <?php register_post_type('book', array('labels' => array('name' => 'Books'),
    'public' => true));
  - '<?php register_post_type(''book'', array(''labels'' => array(''name'' => ''Books'', ''singular_name'' => ''Book''), ''public'' => true));'
  - '<?php register_post_type(''book'', array(''labels'' => array(), ''public'' => true));'
  - '<?php register_post_type(''book'', array(''labels'' => array(''name'' => ''Books'', ''add_new'' => ''Add''), ''public'' => true));'
  - '<?php register_post_type(''book'', array(''labels'' => array(''name'' => ''Books''), ''rewrite'' => array(''slug'' => ''b'')));'
