id: wp-is-writeable-deprecated-alias
valid:
  - '<?php if ( is_writable( $file ) ) { echo ''ok''; }'
  - '<?php $ok = wp_is_writable( $dir );'
  - '<?php $ok = $this->is_writeable( $dir );'
invalid:
  - '<?php if ( is_writeable( $file ) ) { echo ''ok''; }'
  - '<?php $ok = is_writeable( $dir );'
  - '<?php if ( ! is_writeable( $p . ''/x'' ) ) { return false; }'
  - '<?php return is_writeable( WP_CONTENT_DIR );'
