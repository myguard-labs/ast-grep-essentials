id: php-self-closing-div-markup
valid:
  - '<?php echo ''<br class="clear" />''; ?>'
  - "<?php echo '<div class=\"clear\"></div>'; ?>"
  - "<?php echo '<divider class=\"x\" />'; ?>"
invalid:
  - '<?php echo ''<div class="clear" />''; ?>'
  - "<?php echo '<div/>'; ?>"
  - "<?php echo '<div id=\"x\" style=\"clear:both\"/>'; ?>"
