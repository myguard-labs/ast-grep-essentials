id: php-dir-magic-constant-pre53
valid:
  - '<?php require_once dirname( __FILE__ ) . ''/class-ftp-pure.php'';'
  - '<?php $base = dirname( __FILE__ ); ?>'
  - '<?php echo ''__DIR__''; ?>'
  - '<?php /* __DIR__ is not used here */ $x = 1; ?>'
invalid:
  - '<?php require_once __DIR__ . ''/class-ftp-pure.php'';'
  - '<?php include __DIR__ . ''/a.php''; ?>'
  - '<?php $base = __DIR__; ?>'
  - '<?php define( ''X'', __DIR__ . ''/x'' ); ?>'
  - '<?php $b = dirname( __DIR__ ); ?>'
