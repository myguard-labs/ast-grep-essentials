id: wp-deprecated-version-float-literal
valid:
  - |-
    <?php
    _deprecated_function( __FUNCTION__, '3.4', 'wp_get_theme()' );
  - '<?php _deprecated_function( __FUNCTION__, ''4.7.0'', ''wp_new()'' );'
  - '<?php _deprecated_function( __FUNCTION__, "3.4", ''wp_new()'' );'
  - '<?php _deprecated_function( __FUNCTION__, $version );'
invalid:
  - |-
    <?php
    _deprecated_function( __FUNCTION__, 3.4, 'wp_get_theme()' );
  - '<?php _deprecated_function( __FUNCTION__, 4.7 );'
  - '<?php function old() { _deprecated_function( __FUNCTION__, 2.5, ''new_fn'' ); return new_fn(); }'
  - '<?php _deprecated_function( __METHOD__, 6.0, ''Foo::bar()'' );'
