id: php-manual-https-server-check
valid:
  - >-
    <?php $https = ( isset($_SERVER['HTTP_HOST']) && 'on' ==
    strtolower($_SERVER['HTTP_HOST']) ) ? true : false;
  - '<?php $m = strtolower($_SERVER[''REQUEST_METHOD'']);'
  - '<?php $https = is_ssl();'
  - '<?php $h = strtolower( $host );'
invalid:
  - >-
    <?php $https = ( isset($_SERVER['HTTPS']) && 'on' ==
    strtolower($_SERVER['HTTPS']) ) ? true : false;
  - '<?php $s = strtolower($_SERVER["HTTPS"]);'
  - '<?php $s = strtolower( $_SERVER[ ''HTTPS'' ] );'
  - '<?php $ok = strtolower($_SERVER[''HTTPS'']) === ''on'';'
