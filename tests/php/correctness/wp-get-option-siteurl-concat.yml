id: wp-get-option-siteurl-concat
valid:
  - '$name = get_option( ''blogname'' ) . ''/wp-pass.php'';'
  - '<?php $u = site_url( ''/wp-login.php'' );'
  - '<?php if ( get_option( ''siteurl'' ) === $configured ) { $x = 1; }'
  - '<?php $t = get_option( ''blogname'' ) . '' - '' . $title;'
invalid:
  - '$action = get_option( ''siteurl'' ) . ''/wp-pass.php'';'
  - '<?php echo get_option( ''siteurl'' ) . ''/wp-admin/'';'
  - '<?php $u = get_option( ''siteurl'' ) . $path;'
  - '<?php wp_redirect( get_option( ''siteurl'' ) . ''/wp-login.php?x=1'' );'
