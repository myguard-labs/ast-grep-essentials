id: wp-sprintf-untranslated-format-literal
valid:
  - '<?php $t = sprintf( __( ''Draft created on %s'' ), $date ); ?>'
  - '<?php $t = sprintf( $format, $date ); ?>'
  - '<?php $t = sprintf( __( ''%1$s by %2$s'', ''my-domain'' ), $title, $author ); ?>'
invalid:
  - '<?php $t = sprintf( ''Draft created on %s'', $date ); ?>'
  - '<?php $t = sprintf( ''%d items'', $n ); ?>'
  - '<?php echo sprintf( ''<a href="%s">%s</a>'', $url, $label ); ?>'
  - '<?php $t = sprintf( ''%1$s of %2$s'', $a, $b ); ?>'
