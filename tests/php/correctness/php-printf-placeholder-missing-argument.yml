id: php-printf-placeholder-missing-argument
valid:
  - '<?php printf(''<a href="%s" title="x">Link</a>'', $url); ?>'
  - '<?php printf(''100%% done''); ?>'
  - '<?php printf(''no placeholder here''); ?>'
  - '<?php printf(''<a href="%s">Link</a>'', esc_url($url), $x); ?>'
invalid:
  - '<?php printf(''<a href="%s" title="x">Link</a>''); ?>'
  - '<?php printf(''<b>%s</b>''); ?>'
  - '<?php printf(''%s''); ?>'
  - '<?php if (true) { printf(''Total: %s''); } ?>'
