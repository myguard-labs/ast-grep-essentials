id: php-foreach-undefined-loop-variable
valid:
  - >-
    <?php foreach ($input as $key => $val) { if (isset($GLOBALS[$key])) {
    unset($GLOBALS[$key]); } }
  - "<?php foreach ($in as $k => $v) { $out[$k] = $v; }"
  - "<?php foreach ($in as $k => $v) { $map[$v] = $k; }"
  - "<?php foreach ($in as $k => $v) { $out[0] = $v; $out['n'] = $k; }"
invalid:
  - >-
    <?php foreach ($input as $key => $val) { if (isset($GLOBALS[$k])) {
    unset($GLOBALS[$key]); } }
  - "<?php foreach ($in as $k => $v) { $out[$i] = $v; }"
  - "<?php foreach ($in as $name => $value) { if ($value) { echo $names[$id]; } }"
  - "<?php foreach ($in as $k => $v) { $total[$j] += $v; }"
  - "<?php foreach ($in as $k => $v) { $out[$k][$j] = $v; }"
