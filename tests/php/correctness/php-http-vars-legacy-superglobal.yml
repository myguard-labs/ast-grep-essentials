id: php-http-vars-legacy-superglobal
valid:
  - '<?php $step = $_GET[''step''];'
  - '<?php $step = $_SERVER["step"];'
  - '<?php $step = $http_get_vars["step"];'
  - '<?php $step = $_ENV["HTTP_ENV_VARS"];'
invalid:
  - '<?php $step = $HTTP_GET_VARS[''step''];'
  - '<?php $step = $HTTP_COOKIE_VARS["step"];'
  - '<?php $step = $HTTP_ENV_VARS["step"];'
  - '<?php $step = $HTTP_SESSION_VARS["step"];'
