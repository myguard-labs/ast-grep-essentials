id: php-translation-hardcoded-url
valid:
  - |-
    <?php
    $text = __( 'Read the <a href="docs">docs</a>.' );
  - "<?php $x = __( 'Read the <a href=\"%s\">docs</a>.' );"
  - "<?php $x = __( 'The https protocol is required.' );"
  - "<?php $t = sprintf( __( 'Read <a href=\"%s\">docs</a>.', 'td' ), esc_url( $url ) );"
invalid:
  - |-
    <?php
    $text = __( 'Read the <a href="http://example.com/docs">docs</a>.' );
  - "<?php echo __( 'Visit https://example.com/help for more.' );"
  - "<?php echo __( \"Visit http://example.com/help for more.\" );"
  - "<?php function f() { return __('Docs: <a href=\"https://example.org/docs\">here</a>'); }"
