id: wp-parse-args-defaults-first
valid:
  - |
    <?php
    $parsed_args = wp_parse_args( $args, $defaults );
  - '<?php $parsed_args = wp_parse_args( $args, array( ''x'' => 1 ) );'
  - '<?php $parsed_args = wp_parse_args( $query );'
  - '<?php $parsed_args = wp_parse_args( $_GET, $defaults );'
invalid:
  - |
    <?php
    $parsed_args = wp_parse_args( $defaults, $args );
  - '<?php $parsed_args = wp_parse_args( $defaults, array( ''x'' => 1 ) );'
  - '<?php return wp_parse_args( $defaults, $this->args );'
  - '<?php $parsed_args = wp_parse_args( $defaults, $_GET );'
