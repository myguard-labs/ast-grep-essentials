id: php-stub-missing-return-type
valid:
  - |-
    <?php
    function shmop_size($shmid): int {}
  - "<?php\nfunction foo( $a ): void {}"
  - "<?php\nfunction foo( $a ): ?string {}"
  - "<?php\nfunction foo( $a ): int|false {}"
invalid:
  - |-
    <?php
    function shmop_size($shmid) {}
  - "<?php\nfunction foo() {}"
  - "<?php\nfunction foo( int $a, string $b = '' ) {}"
  - "<?php\nfunction foo( ...$args ) {}"
