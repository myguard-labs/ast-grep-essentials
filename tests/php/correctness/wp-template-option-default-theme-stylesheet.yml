id: wp-template-option-default-theme-stylesheet
valid:
  - >-
    $options = array( 'template' => $template, 'stylesheet' => WP_DEFAULT_THEME
    );
  - '<?php $o = array( ''template'' => get_template(), ''stylesheet'' => WP_DEFAULT_THEME );'
  - '<?php $o = [ ''template'' => $parent, ''stylesheet'' => WP_DEFAULT_THEME ];'
  - '<?php $o = array( ''name'' => ''x'', ''stylesheet'' => WP_DEFAULT_THEME );'
invalid:
  - >-
    $options = array( 'template' => WP_DEFAULT_THEME, 'stylesheet' =>
    WP_DEFAULT_THEME );
  - '<?php $o = [ ''template'' => WP_DEFAULT_THEME ];'
  - '<?php $mods = array( ''name'' => ''x'', ''template'' => WP_DEFAULT_THEME, ''version'' => 1 );'
