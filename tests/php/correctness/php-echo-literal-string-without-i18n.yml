id: php-echo-literal-string-without-i18n
valid:
  - '<?php _e( ''The customizer now supports conditionally showing panels.'' ); ?>'
  - '<?php echo $title; ?>'
  - '<?php echo ''Saved: '' . $title; ?>'
invalid:
  - >-
    <?php echo ( 'The customizer now supports conditionally showing panels.' );
    ?>
  - '<?php echo ''Settings saved''; ?>'
