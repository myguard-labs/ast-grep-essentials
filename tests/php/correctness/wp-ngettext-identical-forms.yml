id: wp-ngettext-identical-forms
valid:
  - >-
    <?php echo __ngettext('Done! <strong>%s</strong> tag added', 'Done!
    <strong>%s</strong> tags added', $count); ?>
  - '<?php echo __ngettext(''%d item'', ''%d items'', $count, ''my-domain'');'
  - '<?php echo __ngettext($single, $plural, $count);'
  - '<?php echo __ngettext(''%s file'', ''%s files'', $count);'
invalid:
  - >-
    <?php echo __ngettext('Done! <strong>%s</strong> tag added', 'Done!
    <strong>%s</strong> tag added', $count); ?>
  - '<?php echo __ngettext($label, $label, $count);'
  - '<?php echo __ngettext("%d item", "%d item", $count);'
  - '<?php echo __ngettext(''%d item'', ''%d item'', $count, ''my-domain'');'
