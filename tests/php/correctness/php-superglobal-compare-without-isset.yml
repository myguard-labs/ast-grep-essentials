id: php-superglobal-compare-without-isset
valid:
  - >-
    <?php if ( isset( $_GET['comment_status'] ) && 'moderated' ==
    $_GET['comment_status'] ) { echo 'x'; } ?>
  - "<?php if ( isset( $_POST['k'] ) && $_POST['k'] == 'v' ) { echo 1; }"
  - "<?php if ( isset( $_REQUEST['r'], $_REQUEST['s'] ) && $_REQUEST['r'] == $_REQUEST['s'] ) { echo 1; }"
  - "<?php if ( ( $_POST['k'] ?? '' ) == 'v' ) { echo 1; }"
invalid:
  - '<?php if ( ''moderated'' == $_GET[''comment_status''] ) { echo ''x''; } ?>'
  - "<?php if ( $_POST['k'] == $v ) { echo 1; }"
  - "<?php if ( 1 == $_COOKIE['c'] ) { echo 1; }"
  - "<?php if ( $ok && $_REQUEST['r'] == 'z' ) { echo 1; }"
