id: wp-deprecated-get-links-list
valid:
  - '<?php wp_list_bookmarks(); ?>'
  - '<?php wp_list_bookmarks( array( ''orderby'' => ''name'' ) );'
  - '<?php $b = get_bookmarks();'
invalid:
  - '<?php get_links_list(); ?>'
  - '<?php get_links_list( ''name'' );'
  - '<?php echo get_links_list();'
  - '<?php if ( $x ) { $links = get_links_list( $order ); }'
