id: php-function-declaration-nested-in-function-body
valid:
  - '<?php function a() { return 1; } function b() { return 2; }'
  - '<?php function a() { $f = function() { return 1; }; return $f; }'
  - '<?php if (!function_exists("a")) { function a() { return 1; } }'
  - '<?php function a() { return new class { function m() { return 1; } }; }'
invalid:
  - '<?php function a() { return 1; function b() { return 2; } }'
  - '<?php function a() { if ($x) { function b() { return 1; } } }'
  - '<?php function a() { foreach ($x as $y) { function b() { return 1; } } }'
  - '<?php function a() { echo 1; function b() { return 2; } echo 3; }'
