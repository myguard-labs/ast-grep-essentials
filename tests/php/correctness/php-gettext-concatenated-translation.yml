id: php-gettext-concatenated-translation
valid:
  - '$s = sprintf( __( ''| Version %s'' ), $v );'
  - '$s = sprintf( __( ''Version %s'', ''td'' ), $v );'
  - '$s = ''| '' . $v;'
  - '$s = ''a'' . ''b'';'
  - '$s = __( ''Version'' );'
invalid:
  - '$s = sprintf( ''| ''.__( ''Version %s'' ), $v );'
  - '$s = ''| '' . __( ''Version'', ''td'' );'
  - 'echo ''<h2>'' . __( ''Title'', ''td'' ) . ''</h2>'';'
  - '$s = ''| '' . __( ''Version'' ) . '' | '';'
