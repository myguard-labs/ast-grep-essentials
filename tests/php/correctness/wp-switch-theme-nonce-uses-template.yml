id: wp-switch-theme-nonce-uses-template
valid:
  - >-
    $activate_link = wp_nonce_url( $activate_link, 'switch-theme_' . $stylesheet
    );
  - |-
    <?php
    $l = wp_nonce_url( $l, 'switch-theme_' . $stylesheet );
  - |-
    <?php
    $l = wp_nonce_url( $l, 'switch-theme_' . $theme->get_stylesheet() );
  - |-
    <?php
    $l = wp_nonce_url( $l, "switch-theme_$stylesheet" );
invalid:
  - >-
    $activate_link = wp_nonce_url( $activate_link, 'switch-theme_' . $template
    );
  - |-
    <?php
    $l = wp_nonce_url( add_query_arg( 'action', 'activate', $u ), 'switch-theme_' . $template );
  - |-
    <?php
    echo esc_url( wp_nonce_url( $l, 'switch-theme_' . $template ) );
  - |-
    <?php
    $actions = array( 'activate' => wp_nonce_url( $u, 'switch-theme_' . $template ) );
