id: wp-date-without-timestamp
valid:
  - |-
    <?php
    $stamp = gmdate( 'Y-m-d H:i:s' );
  - '<?php $stamp = date( ''Y-m-d H:i:s'', time() );'
  - '<?php $stamp = date( ''Y'', $ts );'
  - '<?php $stamp = wp_date( ''Y-m-d'' );'
invalid:
  - |-
    <?php
    $stamp = date( 'Y-m-d H:i:s' );
  - '<?php echo date( ''Y'' );'
  - '<?php function f( $fmt ) { return date( $fmt ); }'
  - '<?php if ( date( ''N'' ) > 5 ) { $weekend = true; }'
  - '<?php $d = date( get_option( ''date_format'' ) );'
