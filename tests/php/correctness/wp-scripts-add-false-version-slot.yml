id: wp-scripts-add-false-version-slot
valid:
  - '<?php $scripts->add( $handle, $path, $dependencies, $version, 1 );'
  - '<?php $scripts->add( $handle, $path, $deps, false );'
  - '<?php $scripts->add( $handle, $path, $deps, ''1.2.3'', 1 );'
  - '<?php $scripts->add( $handle, $path, $deps, null, 1 );'
invalid:
  - '<?php $scripts->add( $handle, $path, $dependencies, false, $version );'
  - '<?php $wp_scripts->add( ''jq'', ''/j.js'', array(), false, 1 );'
  - '<?php $this->scripts->add( $h, $p, array( ''jquery'' ), false, $args );'
  - '<?php function f( $s ) { $s->add( ''a'', ''/a.js'', array(), false, true ); }'
