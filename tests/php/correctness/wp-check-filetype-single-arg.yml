id: wp-check-filetype-single-arg
valid:
  - '<?php $type = wp_check_filetype( $src, wp_get_mime_types() );'
  - '<?php $type = wp_check_filetype( $src, get_allowed_mime_types() );'
  - '<?php $type = wp_check_filetype( $src, $mimes );'
  - '<?php $t = wp_check_filetype( $src, mimes: $m );'
invalid:
  - '<?php $type = wp_check_filetype( $src );'
  - '<?php $type = wp_check_filetype( basename( $src ) );'
  - '<?php $type = wp_check_filetype( $dir . ''/x.png'' );'
  - '<?php $type = wp_check_filetype( $src, );'
