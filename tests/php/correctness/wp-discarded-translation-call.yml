id: wp-discarded-translation-call
valid:
  - '<?php _e( '' | '', ''twentyten'' ); ?>'
  - "<?php echo __( 'Hello', 'domain' );"
  - "<?php $t = __( 'Hello', 'domain' );"
  - "<?php wp_die( __( 'Hello', 'domain' ) );"
  - "<?php return __( 'Hello', 'domain' );"
invalid:
  - '<?php __( '' | '', ''twentyten'' ); ?>'
  - "<?php function f() { __( 'Saved', 'domain' ); }"
  - "<?php if ( $ok ) { __( 'Saved', 'domain' ); }"
  - "<?php __( 'Hello' );"
