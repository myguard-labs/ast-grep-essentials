id: php-falsy-guard-bare-variable-return
valid:
  - '<?php function f( $key ) { if ( '''' === $key ) return false; }'
  - '<?php function f($k){ if (null === $k) return false; }'
  - '<?php function f($k){ if ($k === false) return false; }'
  - '<?php function f($k){ if (!$k) { log_it(); } return 1; }'
  - '<?php function f($k){ if (!isset($k)) return false; }'
  - '<?php function f($k){ if (!is_string($k)) return false; }'
  - '<?php function f($k){ if (!empty($k)) return false; }'
  - '<?php function f($k){ if (!\is_string($k)) return false; }'
  - '<?php function f($o){ if (!$o->m()) return false; }'
invalid:
  - '<?php function f( $key ) { if ( ! $key ) return false; }'
  - '<?php function f($k){ if ( ! $k ) return null; }'
  - '<?php function f($id){ if (!$id) return 0; }'
  - '<?php function f($n){ if ( ! $n ) return ""; }'
  - '<?php function f($k){ if (!($k)) return false; }'
