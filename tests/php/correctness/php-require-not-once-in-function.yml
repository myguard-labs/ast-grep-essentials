id: php-require-not-once-in-function
valid:
  - >-
    <?php function load_dashboard() { require_once ABSPATH .
    'wp-admin/includes/dashboard.php'; }
  - '<?php require ABSPATH . ''wp-admin/x.php'';'
  - '<?php function f() { require_once( ABSPATH . ''wp-admin/x.php'' ); }'
  - '<?php function f() { if ( $a ) { include_once ABSPATH . ''wp-admin/x.php''; } }'
invalid:
  - >-
    <?php function load_dashboard() { require ABSPATH .
    'wp-admin/includes/dashboard.php'; }
  - '<?php function f() { require(ABSPATH . ''wp-admin/x.php''); }'
  - '<?php function f() { if ( $a ) { require ABSPATH . "wp-admin/x.php"; } }'
  - '<?php function f() { foreach ( $a as $b ) { require ABSPATH . ''wp-includes/'' . $b; } }'
