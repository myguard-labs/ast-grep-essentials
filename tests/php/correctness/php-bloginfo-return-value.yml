id: php-bloginfo-return-value
valid:
  - '$type = get_bloginfo(''html_type'');'
  - '<?php $name = get_bloginfo(''name'');'
  - '<?php bloginfo(''name'');'
  - '<?php $t = esc_html(get_bloginfo(''charset''));'
invalid:
  - '$type = bloginfo(''html_type'');'
  - '<?php $charset = bloginfo(''charset'');'
  - '<?php $this->title = bloginfo(''name'');'
  - '<?php function f() { $v = bloginfo(''version''); return $v; }'
