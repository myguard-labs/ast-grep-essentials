id: php-unset-request-array-key
valid:
  - 'unset($current[$key]);'
  - '<?php unset($_GET[''plugin'']);'
  - '<?php unset($current[sanitize_key($_GET[''plugin''])]);'
invalid:
  - 'unset($current[$_GET[''plugin'']]);'
  - '<?php unset($opts[$_POST["k"]]);'
  - '<?php unset($this->items[$_REQUEST[''id'']]);'
  - '<?php unset($a[$_GET[''x''][''y'']]);'
