id: wp-bloginfo-rss-comments-rss2-url
valid:
  - '<?php bloginfo_rss(''name''); ?>'
  - '<?php comments_rss_link( ''Comments feed'' ); ?>'
  - '<?php bloginfo_rss( ''rss2_url'' ); ?>'
invalid:
  - '<?php bloginfo_rss(''comments_rss2_url''); ?>'
  - '<?php echo bloginfo_rss(''comments_rss2_url''); ?>'
  - '<?php if ( is_feed() ) { bloginfo_rss(''comments_rss2_url''); } ?>'
  - '<?php bloginfo_rss( ''comments_rss2_url'' ); ?>'
