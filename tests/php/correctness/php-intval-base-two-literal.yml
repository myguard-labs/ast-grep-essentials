id: php-intval-base-two-literal
valid:
  - '$thismonth = ''''.zeroise(intval(substr($m, 4, 2)), 2);'
  - '$n = intval( $s );'
  - '$n = intval( $s, 10 );'
  - '$n = intval( $s, 16 );'
  - '$n = intval( $s, 12 );'
invalid:
  - '$thismonth = ''''.zeroise(intval(substr($m, 4, 2), 2), 2);'
  - '$n = intval($s,2);'
  - '$n = intval( $s, 2 ) + 1;'
  - '$n = intval( trim( $_POST["qty"] ), 2 );'
  - '$n = intval( $row["month"], 2 );'
