id: wp-truthy-post-superglobal-request-check
valid:
  - 'if ( $_POST[''log''] ) { handle_login(); }'
  - "<?php /* if ( $_POST ) is wrong */ if ( isset( $_POST['submit'] ) ) { go(); }"
  - "<?php $s = 'if ( $_POST )'; echo $s;"
  - "<?php if ( isset( $_POST['submit'] ) ) { go(); }"
  - "<?php if ( 'POST' === $_SERVER['REQUEST_METHOD'] ) { go(); }"
  - "<?php if ( wp_doing_ajax() ) { go(); }"
invalid:
  - 'if ( $_POST ) { handle_login(); }'
  - "<?php if($_POST){ go(); }"
  - "<?php if ( $_POST ): go(); endif;"
  - "<?php if ( $a ) { x(); } else if ( $_POST ) { go(); }"
