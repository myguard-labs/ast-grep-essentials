id: wp-anchor-button-without-href
valid:
  - >-
    $buttons .= '<a id="x-tmce" class="switch-tmce" href="#"
    onclick="switchEditors.switchto(this);">Visual</a>';
  - '<?php $h = ''<a href="#" class="x" onclick="go();">Go</a>'';'
  - '<?php $h = ''<button type="button" onclick="go();">Go</button>'';'
  - |-
    <?php $h = '<a
      class="x"
      href="#"
      onclick="go();">Go</a>';
invalid:
  - >-
    $buttons .= '<a id="x-tmce" class="switch-tmce"
    onclick="switchEditors.switchto(this);">Visual</a>';
  - '<?php $h = ''<a onclick="go();">Go</a>'';'
  - |-
    <?php $h = '<a class="x"
       onclick="go();">Go</a>';
  - '<?php echo ''<a  id="y"   onclick="go(1);" class="btn">Go</a>'';'
