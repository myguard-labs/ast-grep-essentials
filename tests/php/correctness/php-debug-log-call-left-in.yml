id: php-debug-log-call-left-in
valid:
  - '<?php error_log( $details[''setting''] ); ?>'
  - '<?php $logger->debug_log( $msg ); ?>'
  - '<?php my_debug_log( $msg ); ?>'
  - '<?php $name = ''debug_log''; error_log( $name ); ?>'
invalid:
  - '<?php debug_log( $details[''setting''] ); ?>'
  - '<?php debug_log(); ?>'
  - '<?php if ( WP_DEBUG ) { debug_log( ''x'', $y ); } ?>'
  - '<?php $r = debug_log( $a, $b, $c ); ?>'
