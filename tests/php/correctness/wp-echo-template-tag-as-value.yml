id: wp-echo-template-tag-as-value
valid:
  - '<?php printf(''%s'', get_the_title());'
  - "<?php printf( '%s', the_title( '', '', false ) );"
  - "<?php printf( '%s', the_title_attribute( array( 'echo' => false ) ) );"
  - "<?php the_title();"
invalid:
  - '<?php printf(''%s'', the_title());'
  - "<?php printf( '<h1>%s</h1>', the_title() );"
  - "<?php printf( '%s %s', $a, the_title() );"
