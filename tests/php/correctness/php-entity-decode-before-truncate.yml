id: php-entity-decode-before-truncate
valid:
  - |
    <?php
    $s = mb_strcut(strip_tags($str), 0, $count);
  - '<?php $s = mb_substr(html_entity_decode($str), 0, $count);'
  - '<?php $s = html_entity_decode(mb_strcut($str, 0, $count));'
invalid:
  - |
    <?php
    $s = mb_strcut(html_entity_decode($str, ENT_QUOTES), 0, $count);
  - '<?php $s = mb_strcut(html_entity_decode($str, ENT_QUOTES, ''UTF-8''), 0, $count, ''UTF-8'');'
  - '<?php $o = trim(mb_strcut(html_entity_decode($str, ENT_QUOTES | ENT_HTML5), 0, $n));'
