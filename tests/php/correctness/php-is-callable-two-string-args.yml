id: php-is-callable-two-string-args
valid:
  - >-
    <?php function f() { return is_callable( array( 'Imagick', 'queryFormats' )
    ); }
  - '<?php function f( $cb ) { return is_callable( $cb, true ); }'
  - '<?php function f( $o ) { return is_callable( array( $o, ''run'' ), false ); }'
invalid:
  - '<?php function f() { return is_callable( ''Imagick'', ''queryFormats'' ); }'
  - '<?php function f() { return is_callable( "Imagick", "queryFormats" ); }'
