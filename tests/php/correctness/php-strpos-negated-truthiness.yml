id: php-strpos-negated-truthiness
valid:
  - |
    <?php
    if (false === strpos($xmp, '<x:xmpmeta')) {
        return;
    }
  - '<?php if (strpos($xmp, ''<x'') === false) { return; }'
  - '<?php if (!str_contains($xmp, ''<x'')) { return; }'
invalid:
  - |
    <?php
    if (! strpos($xmp, '<x:xmpmeta')) {
        return;
    }
  - '<?php $missing = !strpos($s, ''x'');'
  - '<?php if (!strpos($a, $b) && $c) { $d = 1; }'
