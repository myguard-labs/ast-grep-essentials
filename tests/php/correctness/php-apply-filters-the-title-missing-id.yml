id: php-apply-filters-the-title-missing-id
valid:
  - '$post_title = apply_filters(''the_title'', $post->post_title, $post->ID);'
  - '<?php $t = apply_filters(''the_content'', $c);'
  - '<?php $t = apply_filters(''the_title'', $t, get_the_ID());'
  - '<?php $t = apply_filters(''the_title_rss'', $t);'
invalid:
  - '$post_title = apply_filters(''the_title'', $post->post_title);'
  - '<?php echo apply_filters(''the_title'', $post->post_title);'
  - '<?php return apply_filters(''the_title'', get_the_title());'
  - '<?php echo esc_html( apply_filters( ''the_title'', $t ) );'
  - |-
    <?php $t = apply_filters(
      'the_title',
      $t
    );
