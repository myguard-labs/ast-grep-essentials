id: php-return-literal-from-ref-function
valid:
  - '<?php function &get_pages($args = '''') { $pages = false; return $pages; }'
  - '<?php function normalize( array &$items ) { if ( ! $items ) { return false; } return $items; }'
invalid:
  - '<?php function &get_pages($args = '''') { return false; }'
  - '<?php function &get_items( array &$items ) { return false; }'
