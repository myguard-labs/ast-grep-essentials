id: php-manual-timezone-offset-time-arithmetic
valid:
  - '$y = date(''Y'', time());'
  - '<?php $y = wp_date(''Y'');'
  - '<?php $y = date(''Y'', $timestamp);'
  - '<?php $y = date(''Y-m-d'', time());'
invalid:
  - '$y = date(''Y'', time() + ($time_difference * 3600));'
  - '<?php $y = date(''H:i'', time() + (get_option(''gmt_offset'') * 3600));'
  - '<?php $y = date(''Y-m-d'', time() + ($offset * 3600));'
  - '<?php $y = date(DATE_ATOM, time() + (-5 * 3600));'
