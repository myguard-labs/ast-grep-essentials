id: wp-sidebars-widgets-raw-option-read
valid:
  - '<?php $sidebars_widgets = get_option( ''blogname'', array() );'
  - '<?php $w = wp_get_sidebars_widgets();'
  - '<?php $o = get_option( ''sidebars_widgets_backup'', array() );'
  - '<?php $o = get_option( ''widget_text'', array() );'
invalid:
  - '<?php $sidebars_widgets = get_option( ''sidebars_widgets'', array() );'
  - '<?php $w = get_option( ''sidebars_widgets'', false );'
  - '<?php if ( get_option( ''sidebars_widgets'', array() ) ) { $x = 1; }'
  - '<?php function f() { return get_option( ''sidebars_widgets'', array() ); }'
