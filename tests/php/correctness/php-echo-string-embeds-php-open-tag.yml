id: php-echo-string-embeds-php-open-tag
valid:
  - '<?php echo "<p>" . __(''Caution'') . "</p>";'
  - '<?php echo "<p>$name</p>";'
  - '<?php echo "<?xml version=''1.0''?>";'
invalid:
  - '<?php echo "<p><?php __(''Caution''); ?></p>";'
  - '<?php echo "a", "<?php b ?>";'
  - '<?php echo "Value: {$v} <?php x ?>";'
