id: wp-gettext-concatenated-fragment
valid:
  - >-
    <?php echo '<p>' . sprintf( __( 'Your address will be %s.' ), $site ) .
    '</p>';
  - '<?php $m = sprintf( __( ''Hello %s'', ''d'' ), $name );'
  - '<?php $l = $c ? __( ''Yes'' ) : __( ''No'' );'
  - '<?php $b = ( $x === __( ''Yes'' ) );'
invalid:
  - '<?php echo ''<p>'' . __( ''Your address will be '' ) . $site . ''</p>'';'
  - '<?php $m = __( ''Hello '' ) . $name;'
  - '<?php $m = $name . __( '' items'', ''d'' );'
  - '<?php echo ''a'' . __( ''b'' ) . ''c'';'
