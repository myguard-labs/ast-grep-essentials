id: php-underscore-translate-call
valid:
  - 'echo __( ''Set as background'' );'
  - '<?php echo __( ''Title'', ''my-domain'' );'
  - '<?php _e( ''Title'', ''my-domain'' );'
  - '<?php echo $this->_( ''Title'' );'
  - '<?php echo _x( ''Post'', ''noun'', ''d'' );'
invalid:
  - 'echo _( ''Set as background'' );'
  - '<?php echo _( "Title" );'
  - '<?php printf( _( ''Hello %s'' ), $name );'
  - '<?php $a = _( ''One'' );'
  - '<?php echo esc_html( _( ''Save'' ) );'
