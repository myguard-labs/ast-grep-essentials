id: php-class-brace-without-space
valid:
  - |-
    class Tests_Admin_wpUserSearch extends WP_UnitTestCase {
    }
  - "class A extends B\n{\n}"
  - "class A extends B implements C {\n}"
invalid:
  - |-
    class Tests_Admin_wpUserSearch extends WP_UnitTestCase{
    }
  - "final class A extends B{\n}"
  - "abstract class A extends Base{ public $x; }"
