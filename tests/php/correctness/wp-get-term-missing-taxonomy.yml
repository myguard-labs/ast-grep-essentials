id: wp-get-term-missing-taxonomy
valid:
  - '<?php $c = get_term( $parent_id, ''category'' );'
  - '<?php $c = get_term( $id, ''post_tag'' );'
  - '<?php $c = get_term( $id, $taxonomy, OBJECT );'
  - '<?php $c = get_term_by( ''id'', $id, ''category'' );'
invalid:
  - '<?php $c = get_term( $parent_id );'
  - '<?php $c = get_term( 5 );'
  - '<?php $c = get_term( (int) $_GET[''id''] );'
  - '<?php $c = get_term( $term->parent )->name;'
