id: php-sprintf-no-placeholder-args
valid:
  - '$s = sprintf( __( ''Update to version %s'' ), $status[''version''] );'
  - |-
    $s = sprintf( __( 'Count: %d', 'td' ), $n );
  - |-
    $s = sprintf( __( '%1$s of %2$s' ), $a, $b );
  - |-
    $s = sprintf( __( 'Update Now' ) );
invalid:
  - '$s = sprintf( __( ''Update Now'' ), $status[''version''] );'
  - |-
    $s = sprintf( __( "Update Now" ), $v, $w );
  - |-
    echo sprintf( __( 'Done' ), 1 );
  - |-
    $s = sprintf(__('Hello'), $this->name);
