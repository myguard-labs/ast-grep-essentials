id: php-microtime-explode-split
valid:
  - '<?php $mtime = explode( '','', microtime() );'
  - |-
    <?php $t = microtime( true );
  - |-
    <?php $m = explode( ' ', $str );
  - |-
    <?php $m = explode( ' ', microtime( true ) );
invalid:
  - '<?php $mtime = explode( '' '', microtime() );'
  - |-
    <?php list( $usec, $sec ) = explode( ' ', microtime() );
  - |-
    <?php $start = array_sum( explode( ' ', microtime() ) );
  - |-
    <?php $m = explode(' ', microtime());
