id: wp-count-query-includes-limit
valid:
  - >-
    $total = $wpdb->get_var( 'SELECT COUNT(*) FROM $wpdb->users
    $this->query_where' );
  - "$total = $wpdb->get_var( 'SELECT COUNT(*) FROM $wpdb->users' );"
  - "$total = $wpdb->get_var( 'SELECT FOUND_ROWS()' );"
  - "$rows = $wpdb->get_results( 'SELECT ID FROM $wpdb->users $this->query_limit' );"
  - >-
    $total = $wpdb->get_var( 'SELECT COUNT(*) FROM $wpdb->users
    $this->query_limit' );
  - >-
    $total = $wpdb->get_var( "SELECT COUNT(*) FROM $wpdb->users
    $this->query_where" );
  - >-
    $total = $wpdb->get_var( "SELECT ID FROM $wpdb->users $limit" );
  - >-
    $rows = $wpdb->get_results( "SELECT COUNT(*) FROM $wpdb->users $limit" );
  - >-
    $total = $wpdb->get_var( "SELECT COUNT(*) FROM $wpdb->users LIMIT 1" );
invalid:
  - >-
    $total = $wpdb->get_var( "SELECT COUNT(*) FROM $wpdb->users
    $this->query_limit" );
  - >-
    $total = $wpdb->get_var( "SELECT COUNT(*) FROM $wpdb->users
    {$this->query_limit}" );
  - >-
    $total = $wpdb->get_var("select count(*) from $wpdb->users $limit");
  - >-
    $total = $wpdb->get_var(  "SELECT COUNT(*) FROM $wpdb->users {$limit}"  );
  - |-
    $total = $wpdb->get_var( <<<SQL
    SELECT COUNT(*) FROM $wpdb->users $limit
    SQL
    );
