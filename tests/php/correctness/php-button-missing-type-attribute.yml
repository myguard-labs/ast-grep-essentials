id: php-button-missing-type-attribute
valid:
  - >-
    <?php echo '<button type="button"
    id="wp-link-close"><span>Close</span></button>'; ?>
  - '<?php echo ''<button type="submit" id="wp-link-close"><span>Close</span></button>''; ?>'
  - '<?php echo ''<button id="wp-link-close" type="button"><span>Close</span></button>''; ?>'
  - '<?php echo ''<button type="reset" id="wp-link-close"><span>Close</span></button>''; ?>'
invalid:
  - '<?php echo ''<button id="wp-link-close"><span>Close</span></button>''; ?>'
  - '<?php print(''<button id="wp-link-close"><span>Close</span></button>''); ?>'
  - '<?php $a = array( ''close'' => ''<button id="wp-link-close"><span>Close</span></button>'' ); ?>'
  - '<?php function f() { return ''<button id="wp-link-close"><span>Close</span></button>''; } ?>'
