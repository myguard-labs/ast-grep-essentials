id: php-get-option-blogname-over-bloginfo
valid:
  - '<?php echo get_bloginfo(''name''); ?>'
  - '<?php echo get_bloginfo( ''name'', ''display'' ); ?>'
  - '<?php echo get_option( ''blogdescription'' ); ?>'
  - '<?php echo get_option( ''blogname_custom'' ); ?>'
invalid:
  - '<?php echo get_option(''blogname''); ?>'
  - '<?php echo esc_html( get_option( ''blogname'' ) ); ?>'
  - '<?php function f() { return get_option( ''blogname'' ); }'
  - '<?php $t = get_option( ''blogname'' ) . '' - '' . get_option( ''blogdescription'' );'
