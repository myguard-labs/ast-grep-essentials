id: php-printf-untranslated-format
valid:
  - |
    <?php
    printf( __('Maximum size: %s'), $size );
  - '<?php printf( _x( ''Maximum size: %s'', ''context'', ''my-domain'' ), $size );'
  - '<?php printf( esc_html__( ''Maximum size: %s'', ''my-domain'' ), $size );'
  - '<?php $this->printf( ''Maximum size: %s'', $size );'
invalid:
  - |
    <?php
    printf( 'Maximum size: %s', $size );
  - '<?php printf( ''Maximum size: %s'', $size, $unit );'
  - '<?php if ( $x ) { printf( ''Maximum size: %s'', $size ); }'
  - '<?php printf( ''Maximum size: %s'', ...$args );'
