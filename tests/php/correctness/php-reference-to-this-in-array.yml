id: php-reference-to-this-in-array
valid:
  - |-
    <?php
    $cb = array( $this, 'callback' );
  - '<?php $cb = array( &$obj, ''callback'' );'
  - '<?php $cb = array( &$this->a, ''b'' );'
  - '<?php $cb = array( ''a'', &$thisx, ''b'' );'
invalid:
  - |-
    <?php
    $cb = array( &$this, 'callback' );
  - '<?php $cb = array( ''a'', ''b'', &$this, ''c'' );'
  - '<?php $cb = array( &$this, &$this, ''b'' );'
