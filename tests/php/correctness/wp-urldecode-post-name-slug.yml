id: wp-urldecode-post-name-slug
valid:
  - '<?php $uri = $page->post_name; ?>'
  - '<?php $slug = urldecode( $_GET["name"] ); ?>'
  - '<?php $slug = esc_attr( $page->post_name ); ?>'
invalid:
  - '<?php $uri = urldecode( $page->post_name ); ?>'
  - '<?php $slug = urldecode( $this->post->post_name ); ?>'
  - '<?php if ( urldecode( $p->post_name ) === $slug ) { echo 1; } ?>'
