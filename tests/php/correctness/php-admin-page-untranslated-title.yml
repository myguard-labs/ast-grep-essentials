id: php-admin-page-untranslated-title
valid:
  - >-
    add_theme_page(__('Customize Header'), 'Header Image and Color',
    'edit_themes', 'x.php', 'fn');
  - "<?php add_theme_page( esc_html__('Customize', 'td'), 'Header', 'edit_themes', 'x.php', 'fn' );"
  - "<?php add_theme_page( $title, 'Header', 'edit_themes', 'x.php', 'fn' );"
invalid:
  - >-
    add_theme_page('Customize Header', 'Header Image and Color', 'edit_themes',
    'x.php', 'fn');
  - "<?php add_theme_page('Customize', 'Header', 'edit_themes', 'x.php');"
  - "<?php $h = add_theme_page( 'Themes', 'T', 'edit_themes', 'x.php', array($this, 'render') );"
  - "<?php add_theme_page(\n    'Customize Header',\n    'Header',\n    'edit_themes',\n    'x.php',\n    'fn'\n);"
