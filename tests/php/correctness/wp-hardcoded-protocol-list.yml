id: wp-hardcoded-protocol-list
valid:
  - '$protocols = wp_allowed_protocols();'
  - '$ok = in_array( $scheme, wp_allowed_protocols(), true );'
  - '$protocols = array_merge( wp_allowed_protocols(), array( ''steam'' ) );'
  - '$protocols = apply_filters( ''my_protocols'', wp_allowed_protocols() );'
invalid:
  - '$protocols = array( ''http'', ''https'', ''ftp'' );'
  - '$protocols = [ ''http'', ''https'' ];'
  - '$allowed = array( ''https'', ''http'' );'
  - '$schemes = array( ''ftp'', ''http'', ''https'', ''mailto'' );'
