id: wp-clear-scheduled-hook-scalar-args
valid:
  - 'wp_clear_scheduled_hook( ''publish_future_post'', array( $post_id ) );'
  - '<?php wp_clear_scheduled_hook( ''h'', array() );'
  - '<?php wp_clear_scheduled_hook( ''h'', ARRAY( $a ) );'
  - '<?php wp_clear_scheduled_hook( ''h'', array( ''k'' => $a ) );'
invalid:
  - 'wp_clear_scheduled_hook( ''publish_future_post'', $post_id );'
  - '<?php wp_clear_scheduled_hook( ''h'', 5 );'
  - '<?php wp_clear_scheduled_hook( ''h'', ''abc'' );'
  - '<?php wp_clear_scheduled_hook( ''h'', $p->id );'
