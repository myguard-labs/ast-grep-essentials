id: php-mysql-error-missing-link
valid:
  - '<?php $err = mysql_error($link); ?>'
  - '<?php $err = mysqli_error($db);'
  - '<?php $err = $db->mysql_error();'
  - '<?php $err = mysql_error( $this->link );'
invalid:
  - '<?php $err = mysql_error(); ?>'
  - '<?php die(mysql_error());'
  - '<?php echo "Err: " . mysql_error() . "\n";'
  - '<?php if (!$r) { trigger_error(mysql_error(), E_USER_WARNING); }'
