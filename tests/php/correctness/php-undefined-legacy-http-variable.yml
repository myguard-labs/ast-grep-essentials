id: php-undefined-legacy-http-variable
valid:
  - '<?php $accepted = split('','', $HTTP_SERVER_VARS[''HTTP_ACCEPT_LANGUAGE'']);'
  - '<?php $h = $_SERVER[''HTTP_ACCEPT_LANGUAGE''];'
  - '<?php $http_accept = ''x''; echo $http_accept;'
  - '<?php $MY_HTTP_HOST = 1; echo $MY_HTTP_HOST;'
  - '<?php $HTTPS = $_SERVER[''HTTPS''];'
  - '<?php $v = $HTTP_GET_VARS[''id''];'
  - '<?php if (!empty($HTTP_COOKIE_VARS)) { run(); }'
  - '<?php $f = $HTTP_POST_FILES[''x''];'
invalid:
  - '<?php $accepted = split('','', $HTTP_ACCEPT_LANGUAGE);'
  - '<?php echo $HTTP_HOST;'
  - '<?php $ua = strtolower($HTTP_USER_AGENT);'
  - '<?php $ua = $HTTP_USER_AGENT;'
  - '<?php $x = $HTTP_X_VARS;'
