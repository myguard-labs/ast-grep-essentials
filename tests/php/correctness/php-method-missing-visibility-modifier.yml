id: php-method-missing-visibility-modifier
valid:
  - |-
    <?php
    class A {
        protected function f( &$q ) {}
    }
  - |-
    <?php class A { public function f() {} }
  - |-
    <?php class A { private static function f() {} }
  - |-
    <?php abstract class A { abstract protected function f(); }
  - |-
    <?php class A { final public function f() {} }
invalid:
  - |-
    <?php
    class A {
        function f( &$q ) {}
    }
  - |-
    <?php class A { static function f() {} }
  - |-
    <?php abstract class A { abstract function f(); }
  - |-
    <?php class A { final function f() {} }
