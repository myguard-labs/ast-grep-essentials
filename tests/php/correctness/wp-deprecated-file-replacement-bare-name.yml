id: wp-deprecated-file-replacement-bare-name
valid:
  - >-
    <?php _deprecated_file( basename(__FILE__), '2.1', WPINC .
    '/registration.php' ); ?>
  - '<?php _deprecated_file( __FILE__, ''3.0'', $replacement );'
  - '<?php _deprecated_file( __FILE__, ''3.0'', ABSPATH . WPINC . ''/registration.php'' );'
  - '<?php _deprecated_file( __FILE__, ''3.0'' );'
invalid:
  - '<?php _deprecated_file( basename(__FILE__), ''2.1'', ''registration.php'' ); ?>'
  - '<?php _deprecated_file( __FILE__, ''3.0'', ''registration.php'' );'
  - '<?php _deprecated_file( ''a.php'', ''2.0'', ''wp-includes/registration.php'' );'
  - '<?php function f() { _deprecated_file( basename( __FILE__ ), ''2.1'', ''class-x.php'' ); }'
