id: php-if-chain-split-before-else
valid:
  - '<?php if ( ''a'' == $t ) f(); elseif ( ''b'' == $t ) g(); else h();'
  - '<?php if ( $a ) { f(); } else { g(); }'
  - '<?php if ( $a ) { f(); } g(); if ( $b ) { h(); } else { i(); }'
  - '<?php if ( $a ) { f(); } elseif ( $b ) { g(); } if ( $c ) { h(); }'
invalid:
  - '<?php if ( ''a'' == $t ) f(); if ( ''b'' == $t ) g(); else h();'
  - '<?php if ( $a ) { f(); } if ( $b ) { g(); } else { h(); }'
  - '<?php if ( $a ) f(); if ( $b ) g(); else if ( $c ) h();'
  - '<?php if ( $a ) { if ( $b ) { x(); } if ( $c ) { y(); } else { z(); } }'
