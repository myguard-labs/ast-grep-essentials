id: php-variable-class-static-call
valid:
  - '<?php WP_User_Meta_Session_Tokens::drop_sessions();'
  - '<?php Foo::bar();'
  - '<?php parent::boot();'
  - '<?php call_user_func( array( $manager, ''drop_sessions'' ) );'
invalid:
  - '<?php $manager::drop_sessions();'
  - '<?php $class::create( $a );'
  - '<?php $result = $factory::build( 1, 2 );'
