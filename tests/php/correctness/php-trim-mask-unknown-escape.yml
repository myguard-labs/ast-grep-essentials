id: php-trim-mask-unknown-escape
valid:
  - '$tags = trim($tags, " \t,");'
  - '$tags = trim($tags, "\r\n");'
  - '$path = trim($path, "/\\");'
  - '$s = trim($s, "\0\x0B");'
  - '$s = trim($s, "a..z");'
  - '$s = trim($s, "\t");'
  - '$s = trim($s, "\x00");'
  - '$s = trim($s, "\u{00A0}");'
  - '$s = trim($s, "\n\r");'
  - '$s = ltrim($s, "\t ");'
  - '$s = trim($s, "\\s");'
invalid:
  - '$tags = trim($tags, " \s,");'
  - '$tags = trim($line, "\W");'
  - 'function f($s) { return trim($s, "\w,"); }'
  - 'if (trim($a, "\s") === "") {}'
  - '$tags = ltrim($tags, " \s,");'
  - '$tags = rtrim($tags, " \s,");'
  - '$s = trim($s, "\s$x");'
  - '$s = trim($s, "\d");'
  - '$s = trim($s, " \s\t,");'
