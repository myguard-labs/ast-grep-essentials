id: php-discarded-gettext-return
valid:
  - '<?php echo _x(''Tag'', ''Plugin Installer''); ?>'
  - '<?php $t = __(''Hello'', ''domain'');'
  - '<?php if ($x) { echo _x(''a'', ''b''); }'
  - '<?php _e(''Hello'');'
invalid:
  - '<?php _x(''Tag'', ''Plugin Installer''); ?>'
  - '<?php __(''Hello'');'
  - '<?php if ($x) __(''Hello'');'
  - '<?php _x(''a'', ''b'', ''domain'');'
