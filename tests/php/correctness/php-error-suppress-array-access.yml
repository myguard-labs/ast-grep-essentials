id: php-error-suppress-array-access
valid:
  - >-
    <?php if ( isset( $call['class'] ) && __CLASS__ == $call['class'] )
    continue; ?>
  - '<?php $x = $call[''class''] ?? null;'
  - '<?php $x = array_key_exists( ''class'', $call ) ? $call[''class''] : null;'
invalid:
  - '<?php if ( @$call[''class''] == __CLASS__ ) continue; ?>'
  - '<?php $x = @$call[$key];'
  - '<?php $x = @$call[''a''][''b''];'
