id: wp-count-sprintf-hardcoded-plural
valid:
  - 'sprintf( _n( ''(%s comment)'', ''(%s comments)'', $count ), $count );'
  - "sprintf( '(%d)', $count );"
  - "sprintf( '(%s)', $count );"
  - "printf( _n( '%s comment', '%s comments', $n ), $n );"
invalid:
  - 'sprintf( ''(%s comments)'', $count );'
  - "echo sprintf( '(%s comments)', number_format_i18n( $n ) );"
  - "$label = sprintf('(%s comments)', $count);"
  - "return sprintf( '(%s comments)', $a, $b );"
