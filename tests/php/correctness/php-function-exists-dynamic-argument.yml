id: php-function-exists-dynamic-argument
valid:
  - 'function_exists(''handler'');'
  - '<?php function_exists("strlen");'
  - '<?php function_exists(PHP_FUNC);'
  - '<?php class_exists($c);'
invalid:
  - 'function_exists($handler);'
  - '<?php if (function_exists($fn)) { $fn(); }'
  - '<?php function_exists($this->handler);'
  - '<?php function_exists($cbs[0]);'
