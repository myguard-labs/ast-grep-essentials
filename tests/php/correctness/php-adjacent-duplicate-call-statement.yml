id: php-adjacent-duplicate-call-statement
valid:
  - |
    <?php
    show_message( __('WordPress updated successfully') );
    show_message( __('WordPress updated') );
  - "<?php\nshow_message( __('WordPress updated successfully') );\necho 'x';\nshow_message( __('WordPress updated successfully') );"
  - "<?php\nshow_message( __('WordPress updated successfully') );"
  - "<?php\nshow_message( __('WordPress updated successfully') );\nshow_message( __('WordPress updated successfully!') );"
invalid:
  - |
    <?php
    show_message( __('WordPress updated successfully') );
    show_message( __('WordPress updated successfully') );
  - "<?php\nshow_message( __('WordPress updated successfully') );\nshow_message( __('WordPress updated successfully') );\nshow_message( __('WordPress updated successfully') );"
  - "<?php\nshow_message(__('WordPress updated successfully'));\nshow_message(__('WordPress updated successfully'));"
  - "<?php\n$x = 1;\nshow_message( __('WordPress updated successfully') );\nshow_message( __('WordPress updated successfully') );\n$y = 2;"
