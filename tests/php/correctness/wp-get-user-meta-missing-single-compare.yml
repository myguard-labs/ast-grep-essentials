id: wp-get-user-meta-missing-single-compare
valid:
  - >-
    if ( get_user_meta( $user_id, 'primary_blog', true ) == $blog_id ) { $found
    = true; }
  - '$ok = get_user_meta( $u, ''k'', true ) == ''yes'';'
  - '$ok = ''yes'' == get_user_meta( $u, ''k'', true );'
  - '$ok = get_user_meta( $u, ''k'', true ) != $v;'
invalid:
  - >-
    if ( get_user_meta( $user_id, 'primary_blog' ) == $blog_id ) { $found =
    true; }
  - '$ok = get_user_meta( $u, ''k'' ) == ''yes'';'
  - 'if ( get_user_meta( $uid, ''k'' ) == 1 ) { $f = true; }'
  - '$ok = get_user_meta( $u, ''flag'' ) == $v;'
