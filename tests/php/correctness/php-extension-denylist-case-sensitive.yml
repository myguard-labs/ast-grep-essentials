id: php-extension-denylist-case-sensitive
valid:
  - |-
    <?php
    if (in_array(strtolower(pathinfo($name, PATHINFO_EXTENSION)), $blacklist)) {
        return;
    }
  - '<?php if (in_array(strtolower(pathinfo($n, PATHINFO_EXTENSION)), $deny, true)) { die(); }'
  - '<?php $ext = strtolower(pathinfo($n, PATHINFO_EXTENSION)); if (in_array($ext, $deny)) { die(); }'
  - '<?php if (in_array(mb_strtolower(pathinfo($n, PATHINFO_EXTENSION)), $deny)) { die(); }'
invalid:
  - |-
    <?php
    if (in_array(pathinfo($name, PATHINFO_EXTENSION), $blacklist)) {
        return;
    }
  - '<?php if (in_array(pathinfo($n, PATHINFO_EXTENSION), $deny, true)) { die(); }'
  - '<?php if (!in_array(pathinfo($f["name"], PATHINFO_EXTENSION), array("php", "phtml"))) { ok(); }'
  - '<?php $bad = in_array(pathinfo($n, PATHINFO_EXTENSION), array("php","phar"));'
