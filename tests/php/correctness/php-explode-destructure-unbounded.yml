id: php-explode-destructure-unbounded
valid:
  - '<?php list($opt, $opt_arg) = explode(''='', $arg, 2);'
  - '<?php list($h, $t) = explode(PHP_EOL, $text, 2);'
  - '<?php list($a, $b) = array_pad(explode("=", $s, 2), 2, null);'
  - '<?php list($k, $v) = explode(":", $line, 2);'
invalid:
  - '<?php list($opt, $opt_arg) = explode(''='', $arg);'
  - '<?php list($k, $v) = explode(":", $line);'
  - '<?php list( $name, $ext ) = explode(".", $file);'
  - '<?php function f($s){ list($a, $b) = explode("/", trim($s)); return $b; }'
