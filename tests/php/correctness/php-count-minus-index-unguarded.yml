id: php-count-minus-index-unguarded
valid:
  - '<?php $prev = $stack[$i - 2];'
  - '<?php $n = count($stack) - 1;'
  - '<?php $last = end($stack);'
  - '<?php $n = count($stack); if ( $n > 0 ) { $last = $stack[$n - 1]; }'
invalid:
  - '<?php $prev = $stack[count($stack) - 2];'
  - '<?php $last = $stack[count($stack) - 1];'
  - '<?php $last = $o->items[count($o->items) - 1];'
  - '<?php $last = $a[$b][count($a[$b]) - 1];'
