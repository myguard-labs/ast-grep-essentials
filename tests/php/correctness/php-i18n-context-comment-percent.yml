id: php-i18n-context-comment-percent
valid:
  - '$s = _c( ''%1$s|Reorder: 1: Pages, 2: by {s}'' );'
  - '<?php $s = _c( "%s items|Reorder" );'
  - '<?php $s = _c( "Reorder|by {s}" );'
  - '<?php $s = _c( "Reorder|50%" );'
invalid:
  - '$s = _c( ''%1$s|Reorder: 1: Pages, 2: by %s'' );'
  - '<?php $s = _c( "Reorder: 1|by %s" );'
  - '<?php $s = _c( ''Page|%s items'' );'
  - '<?php $s = _c( $prefix . "|%s" );'
