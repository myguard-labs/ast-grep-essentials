  - '<?php $user = wp_signon( $creds ); if ( ! is_wp_error( $user ) ) { do_action( ''wp_login'', $user->user_login, $user ); }'
  - '<?php do_action( ''wp_login'', $user->user_login );'
invalid:
  - '<?php do_action( ''wp_login'', $credentials[''user_login''] );'
  - '<?php do_action( ''wp_login'', $creds[ $key ] );'
  - '<?php do_action( ''wp_login'', $_POST[''log''] );'
