id: php-date-format-literal-untranslated
valid:
  - >-
    printf( __( 'Month: %s', 'twentyfourteen' ), get_the_date( _x( 'F Y',
    'monthly archives date format', 'twentyfourteen' ) ) );
  - '<?php echo get_the_date( ''F Y'' );'
  - '<?php printf( __( ''Month: %s'', ''td'' ), get_the_date() );'
  - '<?php printf( __( ''Month: %s'', ''td'' ), get_the_date( $format ) );'
invalid:
  - 'printf( __( ''Month: %s'', ''twentyfourteen'' ), get_the_date( ''F Y'' ) );'
  - '<?php printf( __( ''Posted %1$s by %2$s'', ''td'' ), get_the_date( ''F j, Y'' ), get_the_author() );'
  - '<?php printf( __( ''Month: %s'', ''td'' ), esc_html( get_the_date( ''Y'' ) ) );'
  - '<?php printf( __( ''Month: %s'', ''td'' ), get_the_date( ''F Y'' ), 5 );'
