id: php-bare-gmt-constant-argument
valid:
  - '<?php $d = iso8601_to_datetime( $iso, ''GMT'' );'
  - '<?php $d = iso8601_to_datetime( $iso, "GMT" );'
  - '<?php $d = iso8601_to_datetime( $iso, $tz );'
  - '<?php $d = iso8601_to_datetime( $iso );'
invalid:
  - '<?php $d = iso8601_to_datetime( $iso, GMT );'
  - '<?php return iso8601_to_datetime( $post[''date''], GMT );'
  - '<?php $d = wp_foo( iso8601_to_datetime( gmdate(''c''), GMT ) );'
  - '<?php function f($iso) { $d = iso8601_to_datetime($iso,GMT); return $d; }'
