id: php-array-key-dollar-literal
valid:
  - '<?php $depth = $r[''depth''];'
  - '<?php $d = $r[$depth];'
  - '<?php $d = $r["$depth"];'
  - '<?php $d = $r[''cost$''];'
invalid:
  - '<?php $depth = $r[''$depth''];'
  - '<?php $d = $this->cfg[''$depth''];'
  - '<?php $r[''$depth''] = 1;'
  - '<?php $d = $r[''a''][''$b''];'
