id: wp-home-option-concatenated-slash
valid:
  - "function f( $path ) {\n\t$file = trailingslashit( get_option( 'home' ) ) . '/';\n}"
  - "function f( $p ) {\n\treturn untrailingslashit( get_option( 'home' ) ) . '/feed/';\n}"
  - "function f( $p ) {\n\treturn home_url( '/feed/' );\n}"
  - "function f( $p ) {\n\treturn trailingslashit( get_option( 'home' ) ) . 'feed/';\n}"
invalid:
  - "function f( $path ) {\n\t$file = get_option( 'home' ) . '/';\n}"
  - "function f( $p ) {\n\treturn get_option( 'home' ) . '/feed/';\n}"
  - "function f( $p ) {\n\treturn get_option( 'home' ) . $p;\n}"
  - "function f( $p ) {\n\t$u = get_option('home') . '/' . $p;\n}"
