id: php-set-time-limit-zero
valid:
  - 'set_time_limit(30);'
  - "<?php set_time_limit(60);"
  - "<?php set_time_limit(300);"
  - "<?php function run() { if ($cli) { set_time_limit(600); } work(); }"
invalid:
  - 'set_time_limit(0);'
  - "<?php @set_time_limit(0);"
  - "<?php if ($cli) { set_time_limit(0); }"
  - "<?php function run() { set_time_limit( 0 ); work(); }"
