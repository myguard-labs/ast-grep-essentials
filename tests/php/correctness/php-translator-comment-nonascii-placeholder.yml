    <?php
    /* translators: %s: plugin name */
  - |-
    <?php
    /* translators: %1$s: plugin name, %2$s: version */
  - |-
    <?php
    /* translators: 100%% done, %s: name */
  - |-
    <?php
    /* translators: café %s: name */
  - |-
    <?php
    /* note: %û is not a translators comment */
invalid:
