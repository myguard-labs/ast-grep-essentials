id: wp-register-sidebar-name-untranslated
valid:
  - >-
    register_sidebar( array( 'name' => __( 'Primary Widget Area', 'twentyten' ),
    'id' => 'primary-widget-area' ) );
  - '<?php register_sidebar( array( ''name'' => esc_html__( ''Primary'', ''x'' ), ''id'' => ''primary'' ) );'
  - '<?php register_sidebar( array( ''name'' => _x( ''Primary'', ''sidebar'', ''x'' ), ''id'' => ''primary'' ) );'
  - '<?php register_sidebar( array( ''name'' => __( ''Primary'', ''x'' ), ''id'' => ''p'', ''description'' => ''Plain text'' ) );'
invalid:
  - >-
    register_sidebar( array( 'name' => 'Primary Widget Area', 'id' =>
    'primary-widget-area' ) );
  - '<?php register_sidebar( array( ''name'' => ''Primary'', ''id'' => ''primary'', ''before_widget'' => ''<div>'' ) );'
  - '<?php register_sidebar( array( ''name'' => ''Primary'', ''description'' => __( ''Desc'', ''x'' ) ) );'
  - '<?php if ( $x ) { register_sidebar( array( ''name'' => ''Footer'', ''id'' => ''f'' ) ); }'
