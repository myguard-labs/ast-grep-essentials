id: php-error-reporting-masks-notice
valid:
  - '<?php error_reporting( E_ALL ); '
  - '<?php error_reporting( E_ALL & ~E_DEPRECATED ); '
invalid:
  - '<?php error_reporting( E_ALL ^ E_NOTICE ); '
  - '<?php error_reporting( E_ALL & ~E_NOTICE ); '
  - '<?php error_reporting( E_ALL & ~E_USER_NOTICE ); '
