id: php-group-annotation-with-extension
valid:
  - |-
    /**
     * @group functions
     */
    class Tests_Functions_Example extends WP_UnitTestCase {}
  - |-
      /**
       * @group ajax
       * @ticket 12345
       */
      class Tests_Ajax_Example extends WP_UnitTestCase {}
  - |-
      /**
       * @covers functions.php
       */
      class Tests_Covers_Example extends WP_UnitTestCase {}
  - |-
      /**
       * @group my-group_1
       */
      class Tests_Group_Example extends WP_UnitTestCase {}

invalid:
  - |-
    /**
     * @group functions.php
     */
    class Tests_Functions_Example extends WP_UnitTestCase {}
  - '// @group formatting.php'
  - |-
      /* @group a.b */
      class Tests_Block_Example extends WP_UnitTestCase {}
  - |-
      /**
       * @group tests/functions.php
       */
      class Tests_Path_Example extends WP_UnitTestCase {}
