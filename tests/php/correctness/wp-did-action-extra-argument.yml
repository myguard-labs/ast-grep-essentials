id: wp-did-action-extra-argument
valid:
  - '<?php if ( ! did_action( ''wp_loaded'' ) ) { return; }'
  - '<?php if ( did_action( ''init'' ) > 0 ) { run(); }'
  - '<?php $n = did_action( $hook );'
  - '<?php $n = did_action( "wp_loaded" );'
invalid:
  - >-
    <?php if ( false === did_action( 'wp_loaded',
    '_custom_header_background_just_in_time' ) ) { return; }
  - '<?php $n = did_action( ''init'', 10 );'
  - '<?php $n = did_action( $hook, $priority, $extra );'
  - '<?php if ( did_action( ''init'', 1 ) > 0 ) { run(); }'
