id: php-untranslated-ellipsis-literal
valid:
  - |-
    <?php
    $page_links[] = '<span class="page-numbers dots">' . __( '&hellip;' ) . '</span>';
  - '<?php $l = ''<span class="page-numbers dots">'' . esc_html__( ''...'', ''td'' ) . ''</span>'';'
  - '<?php $l = sprintf( ''<span class="page-numbers dots">%s</span>'', __( ''&hellip;'' ) );'
invalid:
  - |-
    <?php
    $page_links[] = '<span class="page-numbers dots">...</span>';
  - '<?php return ''<span class="page-numbers dots">...</span>'';'
  - '<?php echo ''<li><span class="page-numbers dots">...</span></li>'';'
  - '<?php $l = array(''<span class="page-numbers dots">...</span>'');'
