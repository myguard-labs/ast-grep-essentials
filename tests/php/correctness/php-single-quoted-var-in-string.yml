id: php-single-quoted-var-in-string
valid:
  - >-
    <?php echo '<a id="' . esc_attr( $editor_id ) . '-add_media"
    class="thickbox">';
  - |-
    <?php $s = "id-$x";
  - |-
    <?php $s = 'cost $5';
  - |-
    <?php $s = 'Use $ sign';
invalid:
  - '<?php echo ''<a id="$editor_id-add_media" class="thickbox">'';'
  - |-
    <?php $q = 'SELECT * FROM $table';
  - |-
    <?php echo 'Hello $name';
  - |-
    <?php $a = ['k' => '$value'];
