id: php-single-quoted-var-in-string
valid:
  - >-
    <?php echo '<a id="' . esc_attr( $editor_id ) . '-add_media"
    class="thickbox">';
  - '<?php $s = "id-$x";'
  - '<?php $s = ''cost $5'';'
  - '<?php $s = ''Use $ sign'';'
  - '<?php echo ''It\''s fine'';'
  - '<?php $s = "It''s $name";'
  - '<?php echo ''Hello $name'
invalid:
  - '<?php echo ''<a id="$editor_id-add_media" class="thickbox">'';'
  - '<?php $q = ''SELECT * FROM $table'';'
  - '<?php echo ''Hello $name'';'
  - '<?php $a = [''k'' => ''$value''];'
  - '<?php echo ''It\''s $name'';'
  - '<?php $q = ''SELECT * FROM users WHERE owner = \''$owner\'''';'
  - '<?php $s = ''$_x'';'
