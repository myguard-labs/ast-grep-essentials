id: php-block-div-inside-span-markup
valid:
  - >-
    $cols['comments'] = '<span class="vers"><span title="x"
    class="comment-grey-bubble"></span></span>';
  - '<?php $h = ''<div class="vers"><span title="x">y</span></div>'';'
  - '<?php $h = ''<span class="divider">x</span>'';'
  - '<?php $h = ''<span>a</span>'';'
invalid:
  - >-
    $cols['comments'] = '<span class="vers"><div title="x"
    class="comment-grey-bubble"></div></span>';
  - '<?php $h = ''<span><div>x</div></span>'';'
  - '<?php echo ''<span class="a" id="b"><div class="c">x</div></span>'';'
  - '<?php $h = ''<span style="color:red">text <div>x</div>'';'
