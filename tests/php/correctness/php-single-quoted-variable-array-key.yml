id: php-single-quoted-variable-array-key
valid:
  - |-
    <?php
    $post_meta_cache[ $post_id ][ $key ] = $value;
  - |-
    <?php
    $post_meta_cache[ f('$post_id') ] = $value;
  - |-
    <?php $x = $a['key'];
  - |-
    <?php $x = $a["$k"];
  - |-
    <?php $x = $a['price$'];
invalid:
  - |-
    <?php
    $post_meta_cache['$post_id'][ $key ] = $value;
  - |-
    <?php $x = $a['$key'];
  - |-
    <?php echo $row['$col'];
  - |-
    <?php $a['$k'] = 1;
