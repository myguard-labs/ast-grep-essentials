id: php-html-href-raw-ampersand
valid:
  - '$out = ''<a href="/x?a=1&amp;b=2">x</a>'';'
  - '<?php $o = ''<a href="/x?a=1&amp;b=2&amp;c=3">x</a>'';'
  - '<?php $o = ''<a href="/x">x</a>'';'
  - '<?php $o = ''/x?a=1&b=2'';'
invalid:
  - '$out = ''<a href="/x?a=1&b=2">x</a>'';'
  - '<?php $o = ''<a href="/x?a=1&amp;b=2&c=3">x</a>'';'
  - '<?php $o = ''<a href="https://e.com/?a=1&b=2">x</a>'';'
  - '<?php $o = ''<link href="/x?a=1&b=2" rel="x">'';'
