id: wp-translated-post-name-unsanitized
valid:
  - >-
    $row = array( 'post_name' => sanitize_title( _x( 'hello-world', 'Default
    post slug' ) ) );
  - "<?php $r = array( 'post_name' => sanitize_title( _x( 'contact', 'page slug', 'my-td' ) ) );"
  - "<?php $r = array( 'post_title' => _x( 'Hello', 'ctx' ) );"
  - "<?php $r = array( 'post_name' => 'hello-world' );"
invalid:
  - '$row = array( ''post_name'' => _x( ''hello-world'', ''Default post slug'' ) );'
  - "<?php $r = [ 'post_name' => _x( 'hello', 'ctx' ) ];"
  - "<?php $r = array( 'post_status' => 'publish', 'post_name' => _x( 'hello', 'ctx' ) );"
  - "<?php $r = array( 'post_name' => _x( 'hello', 'ctx', 'domain' ) );"
