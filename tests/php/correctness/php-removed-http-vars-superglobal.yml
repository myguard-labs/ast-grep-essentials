id: php-removed-http-vars-superglobal
valid:
  - |
    <?php
    $a = $_POST['a'];
  - '<?php $q = $_GET[''q''];'
  - '<?php $http_post_vars = array(); echo $http_post_vars;'
  - '<?php $h = $_SERVER[''HTTP_HOST''];'
invalid:
  - |
    <?php
    $a = $HTTP_POST_VARS['a'];
  - '<?php $q = $HTTP_GET_VARS[''q''];'
  - '<?php $s = $HTTP_SERVER_VARS[''REQUEST_URI''];'
  - '<?php if ( isset( $HTTP_GET_VARS[''id''] ) ) { echo 1; }'
