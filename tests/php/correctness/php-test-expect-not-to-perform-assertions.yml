id: php-test-expect-not-to-perform-assertions
valid:
  - >-
    public function test_renders_term(): void { wc_display_product_attributes(
    $product ); $this->assertStringContainsString( 'Gloss', $markup ); }
  - "<?php class T extends TestCase { public function test_a(): void { $this->expectException(RuntimeException::class); run(); } }"
  - "<?php class T extends TestCase { public function test_a(): void { $this->assertSame(1, run()); } }"
  - "<?php class T extends TestCase { public function test_a(): void { $this->expectOutputString('x'); run(); } }"
invalid:
  - >-
    public function test_renders_term(): void {
    $this->expectNotToPerformAssertions(); wc_display_product_attributes(
    $product ); }
  - "<?php class T extends TestCase { public function test_a(): void { $this->expectNotToPerformAssertions(); run(); } }"
  - "<?php class T extends TestCase { public function test_a(): void { if ($x) { $this->expectNotToPerformAssertions(); } run(); } }"
  - "<?php class T extends TestCase { public function test_a(): void { $this->expectNotToPerformAssertions( ); run(); } }"
