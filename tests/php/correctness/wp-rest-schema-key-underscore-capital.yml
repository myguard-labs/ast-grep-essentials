id: wp-rest-schema-key-underscore-capital
valid:
  - "<?php\n$properties = array(\n\t'viewport_width' => array( 'type' => 'number' ),\n);"
  - '<?php $p = array( ''viewportWidth'' => 1 );'
  - '<?php $p = array( ''view_port_width'' => 1 );'
  - '<?php $p = array( ''width_'' => 1 );'
invalid:
  - "<?php\n$properties = array(\n\t'viewport_Width' => array( 'type' => 'number' ),\n);"
  - '<?php $p = array( ''userId_Name'' => 1 );'
  - '<?php $p = [''viewport_Width'' => 1];'
  - '<?php $p = [ ''schema'' => [ ''item_Id'' => 1 ] ];'
  - '<?php $p = array( ''viewport_WIDTH'' => 1 );'
