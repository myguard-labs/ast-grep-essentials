id: php-hook-name-surrounding-whitespace
valid:
  - 'function f( $t ) { return apply_filters( ''ngettext_with_context'', $t ); }'
  - '<?php $v = apply_filters( ''the_title'', $t, $id );'
  - '<?php do_action( ''init'' );'
  - '<?php $v = apply_filters( ''my plugin_x'', $t );'
invalid:
  - 'function f( $t ) { return apply_filters( ''ngettext_with_context '', $t ); }'
  - '<?php do_action( ''init '' );'
  - '<?php $v = apply_filters( ''the_title '', $t, $id );'
  - '<?php $v = trim( apply_filters( ''the_title '', $t ) );'
