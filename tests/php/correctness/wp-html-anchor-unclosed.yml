id: wp-html-anchor-unclosed
valid:
  - '<?php $li = ''<li><a href="%s">%s</a></li>''; ?>'
  - '<?php $s = ''<abbr title="x">WP</abbr>'';'
  - '<?php $s = ''<a href="#top">Back to top</a>'';'
  - '<?php $s = ''<article><p>text</p></article>'';'
invalid:
  - '<?php $li = ''<li><a href="%s">%s</li>''; ?>'
  - '<?php echo ''<a href="#top">Back to top'';'
  - '<?php $s = ''<p><a>%s</p>'';'
  - '<?php $s = ''<a href="%s" class="btn">%s'';'
