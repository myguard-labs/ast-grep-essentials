id: php-mixed-type-pre80-compat
valid:
  - |-
    <?php
    class EvaluatedValue {
        public $value;
    }
  - |-
    <?php class A { public int $value; }
  - |-
    <?php class A { private ?string $value = null; }
  - |-
    <?php class A { /** @var mixed */ public $value; }
invalid:
  - |-
    <?php
    class EvaluatedValue {
        public mixed $value;
    }
  - |-
    <?php class A { private mixed $value; }
  - |-
    <?php class A { public static mixed $value; }
  - |-
    <?php class A { protected mixed $value = null; }
