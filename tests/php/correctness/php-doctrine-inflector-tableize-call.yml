id: php-doctrine-inflector-tableize-call
valid:
  - '$f = $this->tableize( $field );'
  - '$f = Inflector::classify( $field );'
  - '$f = $inflector->tableize( $field );'
  - '$f = Other::tableize( $field );'
invalid:
  - '$f = Inflector::tableize( $field );'
  - '$f = Inflector::tableize();'
  - 'return Inflector::tableize( $a . ''x'' );'
  - 'echo Inflector::tableize( $name );'
