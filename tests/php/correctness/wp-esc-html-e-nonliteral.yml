id: wp-esc-html-e-nonliteral
valid:
  - '<?php esc_html_e( ''Hi'' ); ?>'
  - '<?php esc_html_e( ''Hi'', ''my-domain'' ); ?>'
  - '<?php esc_html_e( "Hello there" ); ?>'
  - '<?php function f() { esc_html_e( ''Save changes'', ''tx'' ); } ?>'
invalid:
  - '<?php esc_html_e( sprintf( __( ''Hi %s'' ), $name ) ); ?>'
  - '<?php esc_html_e( __( ''Hi'' ) ); ?>'
  - '<?php esc_html_e( get_option( ''blogname'' ) ); ?>'
  - '<?php if ( $x ) { esc_html_e( strtoupper( ''Hi'' ) ); } ?>'
