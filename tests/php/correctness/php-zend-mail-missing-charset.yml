id: php-zend-mail-missing-charset
valid:
  - '$mailer = new Zend_Mail( ''UTF-8'' );'
  - '<?php $m = new Zend_Mail( $charset );'
  - '<?php $m = new Zend_Mail( "UTF-8" );'
  - '<?php $m = new Zend_Mail( ''ISO-8859-1'' );'
invalid:
  - '$mailer = new Zend_Mail();'
  - '<?php (new Zend_Mail())->setSubject( ''x'' );'
  - '<?php self::$mail = new Zend_Mail();'
  - '<?php return new Zend_Mail();'
  - '<?php $m = new Zend_Mail( );'
