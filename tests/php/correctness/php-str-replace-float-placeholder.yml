id: php-str-replace-float-placeholder
valid:
  - '$query = str_replace( ''f'' , ''F'', $query );'
  - |-
    $q = sprintf('%f', $x);
  - |-
    $q = str_replace('%%f', '%F', $q);
invalid:
  - '$query = str_replace( ''%f'' , ''%F'', $query );'
  - |-
    $q = str_replace('%f', '%F', $q);
  - |-
    $q = str_replace('%f', '%F', $q, $count);
  - |-
    $q = str_replace('%f', $r, $q);
