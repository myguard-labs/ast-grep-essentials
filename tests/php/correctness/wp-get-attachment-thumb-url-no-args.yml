id: wp-get-attachment-thumb-url-no-args
valid:
  - '<?php $thumb = wp_get_attachment_thumb_url($post->ID);'
  - '<?php $thumb = wp_get_attachment_thumb_url( $attachment_id );'
  - '<?php $thumb = wp_get_attachment_thumb_url( get_post_thumbnail_id() );'
  - '<?php $thumb = wp_get_attachment_thumb_url( (int) $_GET[''id''] );'
invalid:
  - '<?php $thumb = wp_get_attachment_thumb_url();'
  - '<?php echo wp_get_attachment_thumb_url();'
  - '<?php $img = esc_url( wp_get_attachment_thumb_url() );'
  - '<?php if ( wp_get_attachment_thumb_url() ) { echo ''x''; }'
  - '<?php function f() { return wp_get_attachment_thumb_url(); }'
