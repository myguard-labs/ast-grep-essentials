id: php-discarded-pure-return-value
valid:
  - '<?php if ($x) $href = add_query_arg( $args, $href ); ?>'
  - '<?php echo esc_url(add_query_arg(''a'', ''b''));'
  - '<?php return add_query_arg(''a'', ''b'');'
  - '<?php $u = add_query_arg([''a'' => 1], $url);'
invalid:
  - '<?php if ($x) add_query_arg( $args, $href ); ?>'
  - '<?php add_query_arg(''a'', ''b'');'
  - '<?php add_query_arg([''a'' => 1], $url);'
  - '<?php add_query_arg($k, $v, $url);'
