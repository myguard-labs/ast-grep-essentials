id: php-script-language-attribute
valid:
  - '<?php echo ''<script type="text/javascript">'';'
  - "<?php echo '<script type=\"text/javascript\" src=\"a.js\"></script>';"
  - "<?php echo '<script>var language = \"en\";</script>';"
invalid:
  - '<?php echo ''<script language="javascript">'';'
  - "<?php echo '<script type=\"text/javascript\" language=\"JavaScript\">';"
  - "<?php echo '<script language = \\'javascript\\'>';"
