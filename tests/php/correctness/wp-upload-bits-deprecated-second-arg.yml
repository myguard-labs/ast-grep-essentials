id: wp-upload-bits-deprecated-second-arg
valid:
  - '<?php $upload = wp_upload_bits( $name, null, $bits ); ?>'
  - "<?php $u = wp_upload_bits( $name, null, $bits, $time );"
  - "<?php $u = wp_upload_bits( $name, null, file_get_contents( $f ) );"
invalid:
  - '<?php $upload = wp_upload_bits( $name, $type, $bits ); ?>'
  - "<?php $u = wp_upload_bits( $name, 'image/png', $bits );"
  - "<?php $u = wp_upload_bits( $name, $type, $bits, $time );"
  - "<?php $u = wp_upload_bits( $name, '', $bits );"
  - "<?php if ( ! empty( $b ) ) { $u = wp_upload_bits( $n, $m, $b ); }"
