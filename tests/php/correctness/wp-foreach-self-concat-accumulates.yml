id: wp-foreach-self-concat-accumulates
valid:
  - >-
    function f($results, $r0) { $after = $r0; $afterafter = $r0; foreach
    ($results as $r) { $after = '&nbsp;(' . $r->posts . ')' . $afterafter; }
    return $after; }
  - '<?php foreach ( $items as $i ) { $name = ''x'' . $i; echo $name; }'
  - '<?php $s = ''a'' . $s; foreach ( $items as $i ) { $line = ''<li>'' . $i . ''</li>''; echo $line; }'
  - '<?php foreach ( $items as $i ) { $row = ''''; $row = ''<td>'' . $i . ''</td>''; echo $row; }'
invalid:
  - >-
    function f($results, $r0) { $after = $r0; foreach ($results as $r) { $after
    = '&nbsp;(' . $r->posts . ')' . $after; } return $after; }
  - '<?php foreach ( $items as $i ) { $html = ''<li>'' . $i . ''</li>'' . $html; }'
  - '<?php foreach ( $items as $k => $v ) { if ( $v ) { $s = $k . '','' . $s; } }'
  - '<?php foreach ( $items as $i ) $s = ''x'' . $s;'
