id: wp-admin-bar-add-menu-without-id
valid:
  - >-
    <?php $wp_admin_bar->add_menu( array( 'id' => 'dashboard', 'title' =>
    'Dashboard', 'href' => admin_url() ) );
  - '<?php $wp_admin_bar->add_menu( array( ''parent'' => ''top-secondary'', ''id'' => ''child'', ''title'' => ''C'' ) );'
  - '<?php $wp_admin_bar->add_node( array( ''title'' => ''T'' ) );'
  - '<?php $wp_admin_bar->add_menu( $args );'
invalid:
  - >-
    <?php $wp_admin_bar->add_menu( array( 'title' => 'Dashboard', 'href' =>
    admin_url() ) );
  - '<?php $wp_admin_bar->add_menu( array( ''parent'' => ''new-content'', ''title'' => ''Item'' ) );'
  - '<?php function f( $wp_admin_bar ) { $wp_admin_bar->add_menu( array( ''title'' => ''A'', ''href'' => ''#'', ''meta'' => array( ''class'' => ''x'' ) ) ); }'
  - '<?php $wp_admin_bar->add_menu( array() );'
