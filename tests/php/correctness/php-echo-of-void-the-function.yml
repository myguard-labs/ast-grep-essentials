id: php-echo-of-void-the-function
valid:
  - '<?php echo get_the_attachment_link( $id, false ); ?>'
  - '<?php the_attachment_link( $id, false );'
  - '<?php echo wp_get_attachment_link( $id );'
  - '<?php echo $this->the_attachment_link( $id );'
invalid:
  - '<?php echo the_attachment_link( $id, false ); ?>'
  - '<?php echo the_attachment_link();'
  - '<?php echo the_attachment_link( $id );'
  - '<p><?php echo the_attachment_link( $post->ID, true, false ); ?></p>'
