id: wp-get-option-misspelled-siteurl
valid:
  - >-
    <?php function f() { return get_option( 'home' ) != get_option( 'siteurl' );
    }
  - '<?php $h = get_option( ''home'' );'
  - '<?php $b = get_option( ''blogname'', '''' );'
  - '<?php $s = get_option( ''siteurl'' );'
invalid:
  - '<?php function f() { return get_option( ''home'' ) != get_option( ''url'' ); }'
  - '<?php $u = get_option( ''url'' );'
  - '<?php if ( get_option( ''url'' ) ) { $x = 1; }'
  - '<?php echo esc_url( get_option( ''url'' ) . ''/x'' );'
