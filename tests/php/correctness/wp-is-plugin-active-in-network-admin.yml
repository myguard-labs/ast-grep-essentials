id: wp-is-plugin-active-in-network-admin
valid:
  - 'if ( is_network_admin() && is_plugin_active_for_network( $f ) ) { $x = 1; }'
  - 'if ( is_admin() && is_plugin_active( $f ) ) { $x = 1; }'
  - 'if ( is_multisite() && is_plugin_active_for_network( $f ) ) { $x = 1; }'
  - 'if ( is_plugin_active( ''a/a.php'' ) ) { $x = 1; }'
invalid:
  - 'if ( is_network_admin() && is_plugin_active( $f ) ) { $x = 1; }'
  - 'if ( is_network_admin() || is_plugin_active( $f ) ) { $x = 1; }'
  - 'if ( is_plugin_active( $f ) && is_network_admin() ) { $x = 1; }'
  - 'if ( is_network_admin() && ! is_plugin_active( $f ) ) { $x = 1; }'
