id: wp-widget-update-param-name
valid:
  - >-
    <?php class W extends WP_Widget { function update( $new_instance,
    $old_instance ) { return $old_instance; } }
  - '<?php class W extends WP_Widget { public function update( array $new_instance, array $old_instance ): array { return $new_instance; } } ?>'
  - '<?php class W extends WP_Widget { function update( $instance, $old_instance ) { return $instance; } } ?>'
invalid:
  - >-
    <?php class W extends WP_Widget { function update( $new_instance, $instance
    ) { return $instance; } }
  - '<?php class W extends WP_Widget { public function update( array $new_instance, array $instance ) { return $new_instance; } } ?>'
  - '<?php class W extends WP_Widget { function update( $new_instance, $instance = array() ) { return $new_instance; } } ?>'
