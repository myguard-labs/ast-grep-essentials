id: wp-add-query-args-misspelled-call
valid:
  - |-
    <?php
    $url = add_query_arg( 'context', 'edit', $base );
  - '<?php $u = remove_query_arg( ''context'', $base );'
  - '<?php $u = $this->add_query_args( ''a'', ''b'' );'
  - '<?php $u = my_add_query_args( ''a'', ''b'' );'
invalid:
  - |-
    <?php
    $url = add_query_args( 'context', 'edit', $base );
  - '<?php $u = add_query_args();'
  - '<?php $u = add_query_args( array( ''a'' => 1 ), $base );'
  - '<?php echo esc_url( add_query_args( ''a'', ''b'', get_permalink() ) );'
