id: php-format-to-edit-unescaped
valid:
  - '<?php if ( ''description'' == $field ) $value = esc_html( $value );'
  - '<?php $v = esc_textarea( $v );'
  - '<?php $v = format_for_editor( $v );'
  - '<?php $v = esc_attr( $v );'
invalid:
  - '<?php if ( ''description'' == $field ) $value = format_to_edit( $value );'
  - '<?php $value = format_to_edit( $value, true );'
  - '<?php echo format_to_edit( $post->post_content );'
  - '<?php echo ''<textarea>'' . format_to_edit( $content, user_can_richedit() ) . ''</textarea>'';'
