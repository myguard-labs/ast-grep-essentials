id: wp-remote-request-user-url
valid:
- "<?php $r = wp_safe_remote_get( esc_url_raw( $_POST['feed'] ) );"
- "<?php $b = wp_remote_retrieve_body( wp_remote_get( 'https://api.example.com/v1/status' ) );"
- "<?php $r = wp_remote_post( 'https://api.example.com/x', array( 'body' => $_POST ) );"
- "<?php $r = wp_remote_get( $url );"
- "<?php /* wp_remote_request( $_GET['url'] ); */"
- "<?php $s = 'wp_remote_request( $_GET[url] )';"
invalid:
- "<?php $r = wp_remote_request( $_GET['url'] );"
- "<?php $b = wp_remote_retrieve_body( wp_remote_get( esc_url_raw( $_POST['feed'] ) ) );"
- "<?php $r = wp_remote_head( $_REQUEST['u'] );"
- "<?php $r = wp_remote_post( $_COOKIE['cb'], array() );"
