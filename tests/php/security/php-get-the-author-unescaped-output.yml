id: php-get-the-author-unescaped-output
valid:
  - 'echo esc_html( get_the_author() );'
  - 'echo esc_attr( get_the_author() );'
  - '$author = get_the_author();'
  - 'echo wp_kses_post( get_the_author() );'
invalid:
  - 'echo get_the_author();'
  - '<?php echo get_the_author(); ?>'
  - 'function f() { echo get_the_author(); }'
  - 'if ( $x ) { echo get_the_author(); }'
