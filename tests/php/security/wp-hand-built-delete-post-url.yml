id: wp-hand-built-delete-post-url
valid:
  - >-
    $u = add_query_arg( array( 'action' => 'delete', 'post' => $id ), admin_url(
    'post.php' ) );
invalid:
  - >-
    $u = wp_nonce_url( add_query_arg( array( 'action' => 'delete', 'post' => $id
    ), admin_url( 'post.php' ) ), 'delete-post_' . $id );
