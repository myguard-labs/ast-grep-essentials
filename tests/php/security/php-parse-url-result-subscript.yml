id: php-parse-url-result-subscript
valid:
  - 'function host( $u ) { $parts = parse_url( $u ); return $parts; }'
  - '<?php $h = parse_url($u, PHP_URL_HOST);'
  - '<?php $p = parse_url($u); if ($p === false) { return; } $h = $p[''host''];'
  - '<?php $h = $obj->parse_url($u)[''host''];'
invalid:
  - 'function host( $u ) { $h = parse_url( $u )[''host'']; return $h; }'
  - '<?php echo parse_url($_SERVER[''REQUEST_URI''])[''path''];'
  - '<?php $q = parse_url($u . ''/x'')[''query''];'
  - '<?php $h = parse_url($u)[PHP_URL_HOST];'
