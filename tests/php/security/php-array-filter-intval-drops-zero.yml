id: php-array-filter-intval-drops-zero
valid:
  - |-
    <?php
    $query['post_parent__in'] = array_unique( array_map( 'intval', $block->context['query']['parents'] ) );
invalid:
  - |-
    <?php
    $query['post_parent__in'] = array_filter( array_map( 'intval', $block->context['query']['parents'] ) );
