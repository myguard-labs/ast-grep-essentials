id: wp-create-user-literal-password
valid:
  - |-
    <?php
    wp_create_user($new_author_name, wp_generate_password());
  - |-
    <?php
    wp_create_user($new_author_name, $password);
  - |-
    <?php
    wp_create_user($user_name, wp_generate_password(20, false), $email);
  - |-
    <?php
    $id = wp_create_user($user_name, $_POST['pass1']);
invalid:
  - |-
    <?php
    wp_create_user($new_author_name, 'changeme');
  - |-
    <?php
    wp_create_user('admin', 'secret');
  - |-
    <?php
    $id = wp_create_user( $user_name, 'Passw0rd' );
  - |-
    <?php
    function make($u) {
      return wp_create_user($u, 'hunter2');
    }
