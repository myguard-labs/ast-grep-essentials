id: wp-wpdb-tables-call-in-loop
valid:
  - >-
    $global_tables = $wpdb->tables( 'global' ); foreach ( $tables as $table ) {
    if ( in_array( $table, $global_tables ) ) continue; }
invalid:
  - >-
    foreach ( $tables as $table ) { if ( in_array( $table, $wpdb->tables(
    'global' ) ) ) continue; }
