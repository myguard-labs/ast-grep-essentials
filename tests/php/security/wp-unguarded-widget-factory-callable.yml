id: wp-unguarded-widget-factory-callable
valid:
  - >-
    remove_action( 'wp_head', array( $widget_object, 'recent_comments_style' )
    );
  - |-
    <?php add_action( 'wp_head', array( $this, 'render' ) );
  - |-
    <?php remove_action( 'wp_head', array( $wp_widget_factory->get_widget( 'k' ), 'm' ) );

invalid:
  - >-
    remove_action( 'wp_head', array(
    $wp_widget_factory->widgets['WP_Widget_Recent_Comments'],
    'recent_comments_style' ) );
  - |-
    <?php add_action( 'x', array( $this->handlers[ $k ], 'run' ) );
  - |-
    <?php $cb = array( $factory->widgets[ $id ], 'render' );
