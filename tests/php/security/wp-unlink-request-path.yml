id: wp-unlink-request-path
valid:
- "<?php wp_delete_file( $target );"
- "<?php unlink( $upload['basedir'] . '/cache/report.csv' );"
- "<?php file_exists( $upload['basedir'] . '/' . $_POST['file'] );"
- "<?php wp_delete_attachment( $attachment_id, true );"
- "<?php /* unlink( $base . $_POST['file'] ); */"
- "<?php $s = 'unlink( $base . $_POST[file] )';"
invalid:
- "<?php wp_delete_file( $upload['basedir'] . '/cf/' . $_POST['file'] );"
- "<?php unlink( $upload['basedir'] . '/' . sanitize_text_field( $_REQUEST['filename'] ) );"
- "<?php rmdir( ABSPATH . $_GET['dir'] );"
- "<?php wp_delete_file_from_directory( $base . $_POST['f'], $base );"
