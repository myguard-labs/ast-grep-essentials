id: php-printf-computed-format
valid:
  - '<?php printf( ''<b>%s</b>'', $label );'
  - '<?php printf(''%s: %d'', $label, $n);'
  - '<?php vprintf(''%s-%s'', $parts);'
  - '<?php $obj->printf($fmt);'
  - '<?php printf("Hello");'
  - '<?php printf(''Hello'');'
  - '<?php printf(PHP_EOL);'
  - '<?php printf(__(''Hello''));'
invalid:
  - '<?php printf( ''<b>'' . $label . ''</b>'' );'
  - '<?php printf($_GET[''x'']);'
  - '<?php printf("Hello $name");'
  - '<?php printf(sprintf(''%s'', $x));'
  - '<?php printf($fmt);'
  - '<?php printf($obj->fmt);'
  - '<?php printf(get_fmt());'
  - '<?php printf($arr[''f'']);'
  - '<?php printf(__(''Hello'') . $x);'
  - '<?php printf(__("Hi $x"));'
