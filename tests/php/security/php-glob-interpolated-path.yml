id: php-glob-interpolated-path
valid:
  - '<?php $f = glob(''/fixed/sub/*.png''); ?>'
  - '<?php $f = glob( ''$dir/*.png'' );'
  - '<?php $f = glob( ABSPATH . ''wp-content/*'' );'
  - '<?php $f = glob( addcslashes( $dir, ''*?[]\\'' ) . ''/*'' );'
invalid:
  - '<?php $f = glob("$root/$sub/*.png"); ?>'
  - '<?php $f = glob( "{$root}/*.png" );'
  - '<?php $f = glob( "$dir/*" ) ?: [];'
  - '<?php foreach ( glob( "{$this->dir}/tpl-*.php" ) as $t ) {}'
