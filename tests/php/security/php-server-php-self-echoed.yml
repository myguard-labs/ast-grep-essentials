id: php-server-php-self-echoed
valid:
  - '<?php $self = $_SERVER[''PHP_SELF'']; ?>'
  - '<?php echo esc_url( $_SERVER[''REQUEST_URI''] ); ?>'
  - '<?php echo (int) $_SERVER[''SERVER_PORT'']; ?>'
  - '<?php if ( $_SERVER[''PHP_SELF''] === ''/index.php'' ) { $x = 1; } ?>'
  - '<?php echo esc_url( $_SERVER[''PHP_SELF''] ); ?>'
  - '<?php echo htmlspecialchars( $_SERVER[''PHP_SELF''] ); ?>'
  - '<?php echo esc_attr( $_SERVER[''PHP_SELF''] ); ?>'
  - '<?php echo esc_html( $_SERVER[''PHP_SELF''] ); ?>'
invalid:
  - '<form action="<?php echo $_SERVER[''PHP_SELF'']; ?>">'
  - '<?php echo $_SERVER["PHP_SELF"]; ?>'
  - '<?php echo "<form action=''" . $_SERVER[''PHP_SELF''] . "''>"; ?>'
  - '<?php echo $_SERVER[ ''PHP_SELF'' ]; ?>'
  - '<?php echo strtoupper( $_SERVER[''PHP_SELF''] ); ?>'
  - '<?php echo esc_url_raw( $_SERVER[''PHP_SELF''] ); ?>'
  - '<?php echo sprintf( ''%s'', $_SERVER[''PHP_SELF''] ); ?>'
  - '<?php echo trim( esc_html( ''x'' ) ) . $_SERVER[''PHP_SELF'']; ?>'
  - '<?php echo stripslashes( $_SERVER[''PHP_SELF''] ); ?>'
