id: php-ini-get-all-unguarded
valid:
  - >-
    function wp_is_changeable( $setting ) { $ini_all = false; if (
    function_exists( 'ini_get_all' ) ) { $ini_all = ini_get_all(); } return
    isset( $ini_all[ $setting ] ); }
invalid:
  - >-
    function wp_is_changeable( $setting ) { $ini_all = ini_get_all(); return
    isset( $ini_all[ $setting ] ); }
