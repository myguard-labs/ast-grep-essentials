id: wp-href-concat-unescaped-call
valid:
  - >-
    <?php echo '<link rel="alternate" href="' . esc_url( get_feed_link() ) . '"
    />';
  - '<?php echo ''<link rel="alternate" href="'' . esc_url( get_feed_link( ''rss2'' ) ) . ''" />''; ?>'
  - '<?php echo ''<link rel="alternate" href="'' . esc_url( $feed ) . ''" />''; ?>'
  - '<?php echo ''<link rel="alternate" href="https://example.com/feed/" />''; ?>'

invalid:
  - '<?php echo ''<link rel="alternate" href="'' . get_feed_link() . ''" />'';'
  - '<?php echo ''<link rel="alternate" href="'' . get_feed_link( ''rss2'' ) . ''" />''; ?>'
  - '<?php echo ''<link rel="alternate" href="'' . $feed_url . ''" />''; ?>'
  - '<?php $h = ''<link rel="alternate" href="'' . get_bloginfo( ''rss2_url'' ) . ''" />''; ?>'
