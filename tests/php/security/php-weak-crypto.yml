id: php-weak-crypto
valid:
- '<?php $h = password_hash($p, PASSWORD_DEFAULT);'
- '<?php $ok = password_verify($p, $h);'
- '<?php $t = bin2hex(random_bytes(32));'
- '<?php $n = random_int(0, 99);'
- '<?php $h = hash("sha256", $data);'
- '<?php // $h = md5($password);'
invalid:
- '<?php $h = md5($password);'
- '<?php $h = sha1($password);'
- '<?php $t = uniqid();'
- '<?php $n = mt_rand(0, 999999);'
- '<?php $c = crypt($password, $salt);'
- '<?php $h = MD5($password);'
- '<?php $h = \md5($password);'
