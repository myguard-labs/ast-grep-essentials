id: wp-esc-wraps-printf
valid:
  - '<?php esc_attr( sprintf( __( ''Return to %s'', ''twentyten'' ), $title ) ); ?>'
  - '<?php printf( ''%s'', esc_attr( $x ) ); ?>'
  - '<?php echo esc_attr( number_format_i18n( $n ) ); ?>'
  - '<?php esc_html( vsprintf( ''%s-%s'', $parts ) ); ?>'

invalid:
  - '<?php esc_attr( printf( __( ''Return to %s'', ''twentyten'' ), $title ) ); ?>'
  - '<?php esc_attr( printf( ''%s'', $x ) ); ?>'
  - '<?php echo esc_attr( printf( "%d items", $n ) ); ?>'
  - '<?php $v = esc_attr( printf( $fmt, $a, $b ) ); ?>'
