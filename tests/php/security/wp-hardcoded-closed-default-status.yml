id: wp-hardcoded-closed-default-status
valid:
  - >-
    <?php if ( ! isset( $post_data['comment_status'] ) ) {
    $post_data['comment_status'] = get_option( 'default_comment_status' ); }
  - '<?php /* if ( ! isset( $post_data[''comment_status''] ) ) { $post_data[''comment_status''] = ''closed''; } */ $x = 1;'
invalid:
  - >-
    <?php if ( ! isset( $post_data['comment_status'] ) ) {
    $post_data['comment_status'] = 'closed'; }
