id: wp-echo-get-param-unescaped
valid:
  - 'echo ''<a href='' . htmlspecialchars( $_GET[''t''] );'
  - 'echo esc_html( $_GET[''t''] );'
  - 'echo ''x'' . intval( $_GET[''n''] );'
  - '$v = ''a'' . $_GET[''t''];'
invalid:
  - 'echo ''<a href='' . $_GET[''t''];'
  - 'echo ''<a>'' . $_GET["t"];'
  - 'echo ''<p>'' . $_GET[''q''] . ''</p>'';'
  - 'echo $a . $_GET[''x''] . $b;'
