id: php-interpolated-attr-object-property-unescaped
valid:
  - >-
    $the_list .= "<category term='" . attribute_escape( $category->cat_name ) .
    "' />";
  - '$out = "<a href=''" . esc_url( $p->guid ) . "''>x</a>";'
  - '$out = ''<a href=\''$p->guid\''>x</a>'';'
  - '$out = "<a href=''%s''>x</a>"; $s = sprintf( $out, esc_url( $p->guid ) );'
invalid:
  - '$the_list .= "<category scheme=''$home'' term=''$category->cat_name'' />";'
  - '$o = "<input value=''$row->name'' />";'
  - 'echo "<a href=''$post->guid''>link</a>";'
  - '$o .= "<option value=''$opt->id'' selected>x</option>";'
