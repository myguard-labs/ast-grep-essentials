id: php-htmlentities-missing-charset
valid:
  - '<?php $escaped = htmlentities($line, ENT_COMPAT, ''UTF-8'');'
  - '<?php $e = htmlentities( $line, ENT_QUOTES | ENT_SUBSTITUTE, ''UTF-8'' );'
  - '<?php $e = htmlentities( $line, ENT_QUOTES, ''UTF-8'', false );'
  - '<?php $e = htmlspecialchars( $line, ENT_QUOTES, ''UTF-8'' );'
invalid:
  - '<?php $escaped = htmlentities($line);'
  - '<?php echo htmlentities( $_GET[''q''] );'
  - '<?php echo htmlentities( trim( $s ) );'
  - '<?php $e = htmlentities( $a . $b );'
