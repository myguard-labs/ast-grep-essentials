id: php-ssh2-ltrim-root-stream-path
valid:
  - >-
    function get_contents( $file ) { return file_get_contents( 'ssh2.sftp://' .
    $this->sftp_link . '/' . $file ); }
invalid:
  - >-
    function get_contents( $file ) { return file_get_contents( 'ssh2.sftp://' .
    $this->sftp_link . '/' . ltrim( $file, '/' ) ); }
