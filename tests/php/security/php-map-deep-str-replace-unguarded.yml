id: php-map-deep-str-replace-unguarded
valid:
  - >-
    <?php $v = map_deep( $v, static function ( $value ) { if ( is_string( $value
    ) ) { return str_replace( "\r\n", "\n", $value ); } return $value; } );
invalid:
  - >-
    <?php $v = map_deep( $v, static function ( $value ) { return str_replace(
    "\r\n", "\n", $value ); } );
