id: php-secret-compare-not-hash-equals
valid:
- "<?php if ( hash_equals( (string) get_option( 'mp_webhook_token' ), (string) $_GET['token'] ) ) { mp_run_webhook(); }"
- "<?php if ( $_GET['page'] === 'settings' ) { render(); }"
- "<?php if ( $token === $expected ) { run(); }"
- "<?php if ( $_POST['token'] ) { run(); }"
- "<?php $s = \"if ( \\$_GET['token'] === \\$x )\";"
- "<?php /* if ( $_GET['token'] === $x ) {} */"
- "<?php if ( $_GET['auth_action'] == 'login' ) { run(); }"
invalid:
- "<?php if ( $_GET['token'] === get_option( 'mp_webhook_token' ) ) { mp_run_webhook(); }"
- "<?php if ( $_SERVER['HTTP_X_SIGNATURE'] == hash_hmac( 'sha256', $body, $secret ) ) { run(); }"
- "<?php if ( $expected != $_POST['api_key'] ) { deny(); }"
- "<?php if ( $_COOKIE['auth'] !== $stored ) { deny(); }"
