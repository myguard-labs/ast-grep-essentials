id: php-count-of-comparison-expression
valid:
  - |-
    <?php
    function f($ids) {
        if ( is_array($ids) && count($ids) > 0 ) {
            return 1;
        }
    }
invalid:
  - |-
    <?php
    function f($ids) {
        if ( is_array($ids) && count($ids > 0) ) {
            return 1;
        }
    }
