id: wp-esc-attr-on-href-url
valid:
  - '$attributes = '' title="'' . esc_attr( $url ) . ''"'';'
  - '$a = '' href="'' . esc_url( $url ) . ''"'';'
  - '$a = '' data-href="'' . esc_attr( $url ) . ''"'';'
  - '$a = '' class="'' . esc_attr( $cls ) . ''"'';'

invalid:
  - '$attributes = '' href="'' . esc_attr( $url ) . ''"'';'
  - 'echo '' href="'' . esc_attr( $url );'
  - '$a = '' href="'' . esc_attr( get_permalink( $id ) ) . ''"'';'
  - '$attrs = [ '' href="'' . esc_attr( $u ) . ''"'' ];'
