id: php-phpinfo-call
valid:
  - '<?php // phpinfo(); ?>'
  - "<?php $x = \"phpinfo()\";"
  - "<?php $o->phpinfo();"
  - "<?php function phpinfo_wrapper() { return 1; }"
invalid:
  - '<?php phpinfo(); ?>'
  - "<?php if ( $debug ) { phpinfo(); }"
  - "<?php phpinfo( INFO_MODULES );"
  - "<?php echo phpinfo();"
  - "<?php function f() { return phpinfo(); }"
