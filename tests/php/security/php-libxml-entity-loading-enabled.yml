id: php-libxml-entity-loading-enabled
valid:
- "<?php $xml = simplexml_load_string( $_POST['xml'], 'SimpleXMLElement', LIBXML_NONET );"
- "<?php $dom->loadXML( $body, LIBXML_NONET | LIBXML_NOBLANKS );"
- "<?php libxml_disable_entity_loader( true );"
- "<?php $flags = LIBXML_NOENT;"
- "<?php my_parse( $x, LIBXML_NOENT );"
- "<?php /* simplexml_load_string( $x, 'SimpleXMLElement', LIBXML_NOENT ); */"
- "<?php $s = 'simplexml_load_string( $x, null, LIBXML_NOENT )';"
invalid:
- "<?php $xml = simplexml_load_string( $_POST['xml'], 'SimpleXMLElement', LIBXML_NOENT );"
- "<?php $dom->loadXML( $body, LIBXML_NOENT | LIBXML_DTDLOAD );"
- "<?php libxml_disable_entity_loader( false );"
- "<?php $x = simplexml_load_file( $p, 'SimpleXMLElement', LIBXML_DTDLOAD );"
