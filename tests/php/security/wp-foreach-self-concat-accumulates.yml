id: wp-foreach-self-concat-accumulates
valid:
  - >-
    function f($results, $r0) { $after = $r0; $afterafter = $r0; foreach
    ($results as $r) { $after = '&nbsp;(' . $r->posts . ')' . $afterafter; }
    return $after; }
invalid:
  - >-
    function f($results, $r0) { $after = $r0; foreach ($results as $r) { $after
    = '&nbsp;(' . $r->posts . ')' . $after; } return $after; }
