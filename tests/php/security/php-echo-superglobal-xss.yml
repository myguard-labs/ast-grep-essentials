id: php-echo-superglobal-xss
valid:
- '<?php echo htmlspecialchars($_GET["q"], ENT_QUOTES, "UTF-8");'
- '<?php echo intval($_GET["id"]);'
- '<?php echo urlencode($_GET["next"]);'
- '<?php echo $safe;'
- '<?php echo "static text";'
- '<?php $x = $_GET["q"];'
- '<?php // echo $_GET["q"];'
- '<?php echo htmlentities($_POST["name"]);'
- '<?php echo \htmlspecialchars($_GET["q"], ENT_QUOTES, "UTF-8");'
- '<?php echo HTMLSPECIALCHARS($_GET["q"], ENT_QUOTES, "UTF-8");'
- '<?php echo htmlspecialchars($_GET["q"], ENT_QUOTES, "UTF-8", 0);'
- '<?php echo "<p>" . htmlspecialchars($_GET["q"], ENT_NOQUOTES) . "</p>";'
- '<?php echo "<p class=\"fixed\">" . htmlspecialchars($_GET["q"], ENT_NOQUOTES) . "</p>";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], ENT_SUBSTITUTE | ENT_QUOTES) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], ENT_SUBSTITUTE | ENT_COMPAT) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], flags: (ENT_SUBSTITUTE | (ENT_COMPAT))) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], 2) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], (0x2 /* ENT_COMPAT */)) . "\">";'
# Digit-separated masks with bit 1 protect double-quoted attributes.
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], 1_0) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], (0x0_2 /* bit 1 */)) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], 0b1_0) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], 0o1_2) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], 0_12) . "\">";'
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], ENT_SUBSTITUTE | ENT_QUOTES) . "'>";
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], 0b11) . "'>";
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], 03) . "'>";
# Digit-separated masks with bit 0 protect single-quoted attributes.
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], 1_3) . "'>";
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], (0x0_3 /* bit 0 */)) . "'>";
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], 0b1_1) . "'>";
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], 0o1_3) . "'>";
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], 0_13) . "'>";
invalid:
- '<?php echo $_GET["q"];'
- '<?php echo $_POST["name"];'
- '<?php print $_REQUEST["msg"];'
- '<?php echo "Hello " . $_GET["name"];'
- '<?php echo "<p>{$_COOKIE["last"]}</p>";'
# The encoder wraps a different operand; the request value is still raw.
- '<?php echo htmlspecialchars($safe) . $_GET["q"];'
# json_encode is not an HTML encoder.
- '<?php echo json_encode($_GET["q"]);'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], ENT_NOQUOTES) . "\">";'
- '<?php echo "<input value=\"" . htmlentities($_GET["q"], 0) . "\">";'
- '<?php echo "<input value=\"" . htmlentities($_GET["q"], flags: 0) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], ENT_SUBSTITUTE) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], /* flags */ ENT_NOQUOTES) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], (ENT_NOQUOTES /* no quotes */ | (ENT_SUBSTITUTE))) . "\">";'
- '<?php echo "<input value=\"" . htmlentities($_GET["q"], flags: (ENT_NOQUOTES | ENT_SUBSTITUTE)) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], (/* no quote bits */ 8)) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], 0x8) . "\">";'
# Digit-separated masks without bit 1 leave double quotes exposed.
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], (/* no quote bits */ 1_2)) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], 0x0_8) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], 0b1_00) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], 0o1_0) . "\">";'
- '<?php echo "<input value=\"" . htmlspecialchars($_GET["q"], 0_10) . "\">";'
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], ENT_COMPAT | ENT_SUBSTITUTE) . "'>";
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], 2) . "'>";
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], (0b10)) . "'>";
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], 02) . "'>";
# Digit-separated masks without bit 0 leave single quotes exposed.
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], (/* no quote bit */ 1_2)) . "'>";
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], 0x0_8) . "'>";
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], 0b1_0) . "'>";
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], 0o1_0) . "'>";
- |
  <?php echo "<input value='" . htmlspecialchars($_GET["q"], 0_10) . "'>";
