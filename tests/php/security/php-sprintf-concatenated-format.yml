id: php-sprintf-concatenated-format
valid:
  - >-
    <?php function f( $cmd ) { throw new Exception( sprintf( 'Error: %s', $cmd )
    ); }
  - '<?php $m = sprintf(''Error: '' . ''%s'', $cmd);'
  - '<?php $m = sprintf(''%s'', ''Error: '' . $cmd);'
invalid:
  - >-
    <?php function f( $cmd ) { throw new Exception( sprintf( 'Error: ' . $cmd )
    ); }
  - '<?php $m = sprintf("Error: " . $cmd);'
  - '<?php $m = sprintf(''Value: '' . $a . $b);'
  - '<?php echo sprintf(''Hello '' . $name . ''!'');'
