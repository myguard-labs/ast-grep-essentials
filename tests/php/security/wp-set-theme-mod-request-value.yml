id: wp-set-theme-mod-request-value
valid:
  - >-
    <?php set_theme_mod( 'nav_menu_locations', array_map( 'absint',
    $_REQUEST['menu-locations'] ) );
  - "<?php set_theme_mod( \"x\", sanitize_text_field( $_POST[\"x\"] ) );"
  - "<?php set_theme_mod( \"x\", $value );"
  - "<?php set_theme_mod( \"x\", absint( $_GET[\"x\"] ) );"
invalid:
  - '<?php set_theme_mod( ''nav_menu_locations'', $_REQUEST[''menu-locations''] );'
  - "<?php set_theme_mod( \"x\", $_GET[\"x\"] );"
  - "<?php set_theme_mod( \"x\", $_POST[\"x\"] );"
  - "<?php set_theme_mod( \"x\", $_POST [ \"x\" ] );"
  - "<?php set_theme_mod( \"x\", $_POST[\"x\"][\"y\"] );"
  - "<?php set_theme_mod( \"x\", $_POST[\"x\"], 1 );"
