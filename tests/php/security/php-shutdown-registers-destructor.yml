id: php-shutdown-registers-destructor
valid:
  - >-
    <?php class C { function __construct() { register_shutdown_function( array(
    $this, 'flush' ) ); } function __destruct() {} }
invalid:
  - >-
    <?php class C { function __construct() { register_shutdown_function( array(
    $this, '__destruct' ) ); } function __destruct() {} }
