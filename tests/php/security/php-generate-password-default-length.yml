id: php-generate-password-default-length
valid:
  - |-
    <?php
    $salt = wp_generate_password( 64 );
  - '<?php $salt = wp_generate_password( 12, false );'
  - '<?php $salt = wp_generate_password( 64, true, true );'
  - '<?php $salt = wp_generate_password( $len );'
invalid:
  - |-
    <?php
    $salt = wp_generate_password();
  - '<?php $this->key = wp_generate_password();'
  - '<?php $key = wp_generate_password( );'
  - '<?php $a[''k''] = wp_generate_password();'
