id: php-file-write-request-path
valid:
- "<?php $name = wp_unique_filename( $dir, sanitize_file_name( $_FILES['avatar']['name'] ) );"
- "<?php file_put_contents( $dir . '/report.csv', $_POST['content'] );"
- "<?php copy( $_FILES['a']['tmp_name'], $dir . '/' . $generated );"
- "<?php $fh = fopen( $_GET['path'], 'r' );"
- "<?php rename( $_GET['src'], $dir . '/x' );"
- "<?php /* file_put_contents( $_POST['name'], $c ); */"
- "<?php $s = \"file_put_contents( \\$_POST['name'], \\$c )\";"
invalid:
- "<?php file_put_contents( $upload_dir . '/' . $_POST['name'], $_POST['content'] );"
- "<?php copy( $_FILES['avatar']['tmp_name'], $upload_dir . '/' . $_POST['filename'] );"
- "<?php $fh = fopen( $dir . $_GET['dest'], 'w' );"
- "<?php mkdir( ABSPATH . $_POST['dir'] );"
