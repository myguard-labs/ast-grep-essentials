id: php-ob-gzhandler-guard-missing-output-handler
valid:
  - >-
    if (function_exists('ob_gzhandler') && !ini_get('zlib.output_compression')
    && ini_get('output_handler') != 'ob_gzhandler') { $supportsGzip = true; }
invalid:
  - >-
    if (function_exists('ob_gzhandler') && !ini_get('zlib.output_compression'))
    { $supportsGzip = true; }
