id: wp-sql-query-superglobal-interpolation
valid:
  - >-
    <?php $wpdb->query($wpdb->prepare("INSERT INTO t (a) VALUES (%s)",
    $_POST['x']));
  - "<?php $wpdb->query(\"DELETE FROM t WHERE id = \" . (int) $_GET['id']);"
  - "<?php $wpdb->query(\"DELETE FROM t WHERE id = 5\");"
  - "<?php $wpdb->query($wpdb->prepare(\"DELETE FROM t WHERE id = %d\", absint($_GET['id'])));"
invalid:
  - '<?php $wpdb->query("INSERT INTO t (a) VALUES (''$_POST[x]'')");'
  - "<?php $wpdb->query(\"DELETE FROM t WHERE id = {$_GET['id']}\");"
  - "<?php $wpdb->query( \"UPDATE t SET a = '$_POST[a]' WHERE id = 1\" );"
  - "<?php $result = $wpdb->query(\"DELETE FROM t WHERE k = '{$_POST['k']}'\", ARRAY_A);"
