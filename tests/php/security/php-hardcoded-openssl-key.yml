id: php-hardcoded-openssl-key
valid:
  - |
    <?php $c = openssl_encrypt($data, 'aes-256-gcm', $key, 0, $iv, $tag);
  - |
    <?php $c = openssl_encrypt($data, 'aes-256-gcm', getenv('APP_KEY'), 0, $iv, $tag);
  - |
    <?php $c = openssl_decrypt($data, 'aes-256-cbc', "{$prefix}secret", 0, $iv);
  - |
    <?php $c = openssl_encrypt($data, 'aes-256-gcm', KEY_CONST, 0, $iv);
  - |
    <?php $c = other_encrypt($data, 'aes-256-gcm', '0123456789abcdef0123456789abcdef');
  - |
    <?php $c = openssl_encrypt(passphrase: $k, data: $d, cipher_algo: 'aes-256-gcm');
invalid:
  - |
    <?php $c = openssl_encrypt($data, 'aes-256-gcm', '0123456789abcdef0123456789abcdef', 0, $iv, $tag);
  - |
    <?php $c = openssl_decrypt($data, "aes-256-cbc", "0123456789abcdef", 0, $iv);
  - |
    <?php $c = \openssl_encrypt($data, 'aes-128-cbc', 'secretkey', OPENSSL_RAW_DATA, $iv);
