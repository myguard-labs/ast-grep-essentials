id: wp-primary-blog-hardcoded-id
valid:
  - >-
    <?php $wpdb->insert( $wpdb->blogs, array( 'domain' => $domain ) );
    update_usermeta( $uid, 'primary_blog', $wpdb->insert_id ); ?>
invalid:
  - >-
    <?php $wpdb->insert( $wpdb->blogs, array( 'domain' => $domain ) );
    update_usermeta( $uid, 'primary_blog', 1 ); ?>
