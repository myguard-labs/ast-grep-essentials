id: php-chmod-world-writable
valid:
- '<?php chmod($f, 0644);'
- '<?php chmod($f, 0755);'
- '<?php chmod($f, 0664);'
- '<?php chmod($f, 0775);'
- '<?php chmod($f, 0600);'
- '<?php chmod($f, $mode);'
- '<?php chmod($f, $base | 0002);'
- '<?php chmod($f, "0777");'
- '<?php chmod(permissions: 0644, filename: $f);'
- '<?php chmod(permissions: $mode, filename: $f);'
- '<?php my_chmod($f, 0777);'
- '<?php umask(0777);'
- '<?php // chmod($f, 0777);'
- '<?php $s = "chmod($f, 0777);";'
invalid:
- '<?php chmod($f, 0666);'
- '<?php chmod($f, 0777);'
- '<?php chmod($f, 0o666);'
- '<?php chmod($f, 0O777);'
- '<?php chmod($f, 438);'
- '<?php chmod($f, 511);'
- '<?php CHMOD($f, 0777);'
- '<?php \chmod($f, 0777);'
- '<?php chmod(permissions: 0777, filename: $f);'
- '<?php chmod(permissions: 0666, filename: $f);'
- '<?php chmod(filename: $f, permissions: 511);'
