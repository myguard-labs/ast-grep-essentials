id: wp-echo-unescaped-template-var
valid:
  - '<div class=''wp-<?php echo esc_attr( $type ) ?>-playlist''></div>'
  - '<p><?php echo esc_html( $title ); ?></p>'
  - '<p><?php echo ''static''; ?></p>'
  - '<p><?php echo absint( $count ); ?></p>'

invalid:
  - '<div class=''wp-<?php echo $type ?>-playlist''></div>'
  - '<p><?php echo $title; ?></p>'
  - '<?php if ( $x ) { echo $name; } ?>'
  - '<?php echo $x ?>'
