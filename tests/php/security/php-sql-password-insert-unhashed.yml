id: php-sql-password-insert-unhashed
valid:
  - >-
    $query = "INSERT INTO users (user_login, user_pass) VALUES ('admin',
    MD5('$pw'))";
  - '$query = "INSERT INTO users (user_login, user_pass) VALUES (%s, %s)";'
  - '$query = "INSERT INTO users (user_login, user_pass) VALUES (''admin'', ''" . wp_hash_password($pw) . "'')";'
  - '$query = "INSERT INTO posts (post_title, user_pass) VALUES (''t'', ''$pw'')";'
invalid:
  - >-
    $query = "INSERT INTO users (user_login, user_pass) VALUES ('admin',
    '$pw')";
  - '$query = "insert into users (user_login, user_pass) values (''admin'', ''$pw'')";'
  - '$query = "INSERT INTO users (user_pass) VALUES (''$pw'')";'
  - '$wpdb->query("INSERT INTO users (user_login, user_pass) VALUES (''$u'', ''$pw'')");'
