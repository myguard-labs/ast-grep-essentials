id: php-array-search-unguarded-dim
valid:
  - >-
    <?php function f($whitelist_options, $page, $key) { return array_search(
    $key, $whitelist_options[ $page ] ?? [] ); }
invalid:
  - >-
    <?php function f($whitelist_options, $page, $key) { return array_search(
    $key, $whitelist_options[ $page ] ); }
