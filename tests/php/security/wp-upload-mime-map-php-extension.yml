id: wp-upload-mime-map-php-extension
valid:
  - '<?php $m = array(''txt|c'' => ''text/plain'');'
  - '<?php $m = [''php-support-contract'', ''other''];'
  - '<?php $m = [''php-support-contract''];'
  - '<?php $m = [''label'' => ''php-support-contract''];'
  - '<?php $m = [''txt'' => ''application/x-httpd-php''];'
  - '<?php $m = [''phpx'' => ''text/plain''];'
  - '<?php $m = [''php'' => $type];'
  - '<?php $m = [''php'' => 1];'
  - '<?php $m = [''php''];'
  - '<?php $s = ''php'';'
invalid:
  - '<?php $m = array(''txt|c|php'' => ''text/plain'');'
  - '<?php $m = [''php'' => ''text/plain''];'
  - '<?php $m = [''php|phtml'' => ''application/x-httpd-php''];'
  - '<?php $m = [''php|php5'' => ''text/plain''];'
  - '<?php $m = [''jpg'' => ''image/jpeg'', ''phar'' => ''text/plain''];'
  - '<?php $m = [''pht'' => ''text/plain''];'
  - '<?php $m = [''php3'' => ''text/plain''];'
  - '<?php $m = [''php8'' => ''text/plain''];'
  - '<?php $m = array(''txt|pht|c'' => ''text/plain'');'
