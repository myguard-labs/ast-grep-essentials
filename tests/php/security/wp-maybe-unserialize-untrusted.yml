id: wp-maybe-unserialize-untrusted
valid:
- "<?php $opts = maybe_unserialize( get_option( 'myplugin_opts' ) );"
- "<?php $d = json_decode( wp_unslash( $_COOKIE['cart'] ), true );"
- "<?php $m = maybe_unserialize( get_post_meta( $id, 'k', true ) );"
- "<?php $b = wp_remote_retrieve_body( $response );"
- "<?php /* maybe_unserialize( $_COOKIE['cart'] ); */"
- "<?php $s = 'maybe_unserialize( $_COOKIE[cart] )';"
invalid:
- "<?php $data = maybe_unserialize( $_COOKIE['tribe_cart'] );"
- "<?php $state = maybe_unserialize( base64_decode( $_POST['state'] ) );"
- "<?php $cfg = maybe_unserialize( wp_remote_retrieve_body( wp_remote_get( $remote ) ) );"
