id: php-str-replace-quote-entity-attr
valid:
  - '<?php $t = str_replace(''"'', ''\"'', $title); ?>'
  - '<?php $t = esc_attr( $title ); ?>'
  - '<?php $t = str_replace( ''"'', '''', $title ); ?>'
  - '<?php $t = htmlspecialchars( $title, ENT_QUOTES, ''UTF-8'' ); ?>'
invalid:
  - '<?php $t = str_replace(''"'', ''&quot;'', $title); ?>'
  - '<?php return str_replace( ''"'', ''&quot;'', $s ); ?>'
  - '<?php echo str_replace( ''"'', ''&quot;'', $s, $n ); ?>'
  - '<?php $t = str_replace( ''"'', ''&quot;'', $this->title ); ?>'
