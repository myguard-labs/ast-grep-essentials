id: wp-hardcoded-trailing-slash-url
valid:
  - >-
    $output .= '<a href="' . trailingslashit(get_permalink()) .
    user_trailingslashit($i) . '">';
  - '<?php /* $output .= ''<a href="'' . trailingslashit(get_permalink()) . $i . ''/">''; */ $x = 1;'
invalid:
  - '$output .= ''<a href="'' . trailingslashit(get_permalink()) . $i . ''/">'';'
