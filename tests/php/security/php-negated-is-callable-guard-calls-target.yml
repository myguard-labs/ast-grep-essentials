id: php-negated-is-callable-guard-calls-target
valid:
  - "<?php\nif ( is_callable( 'exif_imagetype' ) ) {\n\t$mime = image_type_to_mime_type( exif_imagetype( $file ) );\n}\n"
invalid:
  - "<?php\nif ( ! is_callable( 'exif_imagetype' ) ) {\n\t$mime = image_type_to_mime_type( exif_imagetype( $file ) );\n}\n"
