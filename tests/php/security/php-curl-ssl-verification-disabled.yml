id: php-curl-ssl-verification-disabled
valid:
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, $host);'
- '<?php curl_setopt($ch, CURLOPT_FOLLOWLOCATION, false);'
- '<?php curl_setopt_array($ch, [CURLOPT_FOLLOWLOCATION => false, CURLOPT_SSL_VERIFYHOST => 2]);'
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, true);'
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, 1);'
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, 2);'
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, 1);'
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, $configured);'
- '<?php curl_setopt($ch, CURLOPT_TIMEOUT, 0);'
- '<?php curl_setopt_array($ch, [CURLOPT_SSL_VERIFYPEER => true, CURLOPT_SSL_VERIFYHOST => 2]);'
- '<?php curl_setopt_array($ch, ["CURLOPT_SSL_VERIFYPEER" => false]);'
- '<?php $opts = [CURLOPT_SSL_VERIFYPEER => false];'
- '<?php curl_setopt_array($ch, $opts, [CURLOPT_SSL_VERIFYPEER => false]);'
- '<?php curl_setopt_array($ch, [CURLOPT_HTTPHEADER => [CURLOPT_SSL_VERIFYPEER => false]]);'
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, "false");'
- '<?php my_curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, false);'
- '<?php // curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, false);'
- '<?php $s = "curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, false);";'
- '<?php curl_setopt(handle: $ch, option: CURLOPT_SSL_VERIFYPEER, value: true);'
- '<?php curl_setopt(handle: $ch, option: CURLOPT_SSL_VERIFYHOST, value: 2);'
- '<?php curl_setopt(value: false, handle: $ch, option: CURLOPT_TIMEOUT);'
- '<?php curl_setopt(handle: $ch, option: CURLOPT_SSL_VERIFYPEER, value: $configured);'
- '<?php my_curl_setopt(handle: $ch, option: CURLOPT_SSL_VERIFYPEER, value: false);'
invalid:
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, false);'
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, 0);'
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, false);'
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, 0);'
- '<?php CURL_SETOPT($ch, CURLOPT_SSL_VERIFYPEER, FALSE);'
- '<?php \curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, false);'
- '<?php curl_setopt_array($ch, [CURLOPT_SSL_VERIFYPEER => false, CURLOPT_URL => $u]);'
- '<?php curl_setopt_array($ch, [CURLOPT_SSL_VERIFYHOST => 0]);'
- '<?php \curl_setopt_array($ch, [CURLOPT_SSL_VERIFYPEER => 0]);'
- '<?php curl_setopt_array($ch, [CURLOPT_SSL_VERIFYPEER /* legacy */ => false]);'
- '<?php curl_setopt_array(options: [CURLOPT_SSL_VERIFYPEER => false], handle: $ch);'
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, "0");'
- "<?php curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, '0');"
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, false); curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, 0);'
- '<?php curl_setopt_array($ch, [CURLOPT_FOLLOWLOCATION => false, CURLOPT_SSL_VERIFYPEER => false, CURLOPT_SSL_VERIFYHOST => 0]);'
- '<?php curl_setopt(handle: $ch, option: CURLOPT_SSL_VERIFYPEER, value: false);'
- '<?php curl_setopt(value: 0, option: CURLOPT_SSL_VERIFYHOST, handle: $ch);'
- '<?php curl_setopt(option: CURLOPT_SSL_VERIFYPEER, value: "0", handle: $ch);'
- '<?php curl_setopt($ch, value: false, option: CURLOPT_SSL_VERIFYPEER);'
- '<?php curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, value: 0);'
- '<?php \curl_setopt(handle: $ch, option: CURLOPT_SSL_VERIFYHOST, value: FALSE);'
