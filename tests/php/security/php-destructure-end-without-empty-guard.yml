id: php-destructure-end-without-empty-guard
valid:
  - >-
    function f( $tag_stack ) { list( $opening_tag_name, $directives_prefixes ) =
    ! empty( $tag_stack ) ? end( $tag_stack ) : array( null, null ); return
    $opening_tag_name; }
invalid:
  - >-
    function f( $tag_stack ) { list( $opening_tag_name, $directives_prefixes ) =
    end( $tag_stack ); return $opening_tag_name; }
