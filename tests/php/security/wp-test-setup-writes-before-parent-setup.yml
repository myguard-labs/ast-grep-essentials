id: wp-test-setup-writes-before-parent-setup
valid:
  - >-
    <?php class T extends WC_Unit_Test_Case { protected function setUp(): void {
    parent::setUp(); update_option( 'wc_feature', 'yes' ); } } ?>
invalid:
  - >-
    <?php class T extends WC_Unit_Test_Case { protected function setUp(): void {
    update_option( 'wc_feature', 'yes' ); parent::setUp(); } } ?>
