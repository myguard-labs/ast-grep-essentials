id: php-libxml-parsehuge-flag
valid:
  - |
    <?php
    $x = simplexml_load_string($xml, 'SimpleXMLElement', LIBXML_NONET);
  - |
    <?php
    $d->loadXML($xml, LIBXML_NONET | LIBXML_COMPACT);
  - |
    <?php
    $flags = LIBXML_PARSEHUGE;
  - |
    <?php
    // $d->loadXML($xml, LIBXML_PARSEHUGE);
    $note = 'simplexml_load_string($x, null, LIBXML_PARSEHUGE)';
invalid:
  - |
    <?php
    $x = simplexml_load_string($xml, 'SimpleXMLElement', LIBXML_PARSEHUGE);
  - |
    <?php
    $d = new DOMDocument();
    $d->loadXML($xml, LIBXML_NONET | LIBXML_PARSEHUGE);
