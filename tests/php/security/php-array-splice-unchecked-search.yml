id: php-array-splice-unchecked-search
valid:
  - >-
    <?php $item = array_search( $plugin, $current ); if ( false !== $item )
    array_splice( $current, $item, 1 ); ?>
  - "<?php $pos = array_search( $needle, $list, true ); if ( $pos === false ) { return; } array_splice( $list, $pos, 1 );"
  - "<?php array_splice( $list, 0, 1 );"
  - "<?php $pos = array_search( $needle, $list ); if ( false !== $pos ) { array_splice( $list, $pos, 1, array( $new ) ); }"
invalid:
  - '<?php array_splice( $current, array_search( $plugin, $current ), 1 ); ?>'
  - "<?php array_splice( $list, array_search( $needle, $list, true ), 1 );"
  - "<?php array_splice( $list, array_search( $needle, $list ), 1, array( $new ) );"
  - "<?php array_splice( $this->items, array_search( $item, $this->items ), 0, $extra );"
