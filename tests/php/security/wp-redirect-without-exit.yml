id: wp-redirect-without-exit
valid:
  - 'function f($u) { wp_redirect($u); exit; }'
  - |-
    <?php
    function f($u) {
      wp_redirect($u);
      die;
    }
  - |-
    <?php
    function f($u) {
      wp_redirect($u);
      exit();
    }
  - |-
    <?php
    function f($u) {
      if ($u) {
        wp_redirect($u);
        exit;
      }
    }
  - |-
    <?php
    function f($u) {
      wp_redirect($u);
      die();
    }
  - |-
    <?php
    function f($u) {
      wp_redirect($u);
      die('x');
    }
  - |-
    <?php
    function f($u) {
      wp_redirect($u) or die();
    }
  - |-
    <?php
    function f($u) {
      wp_redirect($u) or exit('x');
    }
  - |-
    <?php
    function f($u) {
      wp_redirect($u) || die;
    }
invalid:
  - 'function f($u) { wp_redirect($u); echo ''x''; }'
  - |-
    <?php
    function f($u) {
      wp_redirect($u);
      do_work();
    }
  - |-
    <?php
    class A {
      function g($u) {
        wp_redirect($u, 301);
        update_option('a', 'b');
      }
    }
  - |-
    <?php
    function f($u) {
      if ($u) {
        wp_redirect($u);
      }
      echo 'x';
    }
  - |-
    <?php
    function f($u) {
      wp_redirect($u) and die();
      do_work();
    }
  - |-
    <?php
    function f($u) {
      wp_redirect($u) or log_it();
    }
  - |-
    <?php
    function f($u) {
      wp_redirect($u);
      echo 1;
      die();
    }
