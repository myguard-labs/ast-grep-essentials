id: php-get-post-result-read-other-variable
valid:
  - >-
    <?php function pings_open( $post_id = null ) { $_post = get_post( $post_id
    ); return 'open' == $_post->ping_status; }
invalid:
  - >-
    <?php function pings_open( $post_id = null ) { $_post = get_post( $post_id
    ); return 'open' == $post->ping_status; }
