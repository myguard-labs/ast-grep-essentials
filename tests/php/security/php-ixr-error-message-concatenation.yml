id: php-ixr-error-message-concatenation
valid:
  - '$this->error = new IXR_Error(403, ''Bad login/pass combination.'');'
  - |-
    <?php return new IXR_Error(403, __("Bad login/pass combination."));
  - |-
    <?php return new IXR_Error(403);
  - |-
    <?php return new IXR_Error(403, "Bad login/pass combination.");
invalid:
  - >-
    $this->error = new IXR_Error(403, 'Bad login/pass
    combination.'.$user_login);
  - |-
    <?php return new IXR_Error(403, "Bad: " . $user_login);
  - |-
    <?php return new IXR_Error(403, $user_login . " is not allowed");
  - |-
    <?php $e = new IXR_Error(403, "User " . $a . $b . " failed");
