id: php-error-log-request-data-unescaped
valid:
  - |
    <?php error_log("user " . str_replace(["\r", "\n"], " ", $_GET["user"]));
  - |
    <?php error_log("page " . (int) $_GET["page"]);
  - |
    <?php error_log(json_encode($_POST));
  - |
    <?php error_log("login ok for " . $username);
  - |
    <?php other_log("user " . $_GET["user"]);
  - |
    <?php
    // error_log("user " . $_GET["user"]);
    $s = 'error_log($_POST["x"])';
  - |
    <?php error_log("path " . $_SERVER["REQUEST_URI"]);
  - |
    <?php error_log("user " . str_replace(["\r", "\n"], "", $_GET["user"]));
  - |
    <?php error_log("user " . addcslashes($_GET["user"], "\0..\37"));
  - |
    <?php error_log("user " . filter_var($_GET["user"], FILTER_UNSAFE_RAW, FILTER_FLAG_STRIP_LOW));
invalid:
  - |
    <?php error_log("user " . $_GET["user"]);
  - |
    <?php error_log($_POST["name"]);
  - |
    <?php error_log("agent $_COOKIE[agent] seen");
  - |
    <?php error_log("q=" . trim($_REQUEST["q"]), 3, "/tmp/app.log");
  - |
    <?php error_log("user " . $_GET["user"] . " n " . intval("1"));
  - |
    <?php error_log(var_export($_GET["x"], true));
  - |
    <?php error_log(esc_html($_GET["x"]));
  - |
    <?php error_log(addcslashes($_GET["x"], "<>"));
  - |
    <?php error_log(filter_var($_GET["x"], FILTER_UNSAFE_RAW));
  - |
    <?php error_log(str_replace("<", "", $_GET["x"]));
  - |
    <?php error_log(preg_replace("/[<>]/", "", $_GET["x"]));
