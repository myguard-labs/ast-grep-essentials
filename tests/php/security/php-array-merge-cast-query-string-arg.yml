id: php-array-merge-cast-query-string-arg
valid:
  - >-
    function register_thing($args = array()) { $defaults = array('id' => 1);
    $thing = wp_parse_args($args, $defaults); return $thing; }
invalid:
  - >-
    function register_thing($args = array()) { $defaults = array('id' => 1);
    $thing = array_merge($defaults, (array) $args); return $thing; }
