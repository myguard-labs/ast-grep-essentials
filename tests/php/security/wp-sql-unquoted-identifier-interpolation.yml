id: wp-sql-unquoted-identifier-interpolation
valid:
  - '$sql = "UPDATE `$table` SET active = 1 WHERE id = 1";'
  - "$sql = \"SELECT * FROM `$table` WHERE id = 1\";"
  - "$sql = \"SELECT * FROM wp_posts WHERE id = 1\";"
  - "$sql = \"SELECT * FROM {$wpdb->posts} WHERE id = 1\";"
invalid:
  - '$sql = "UPDATE $table SET active = 1 WHERE id = 1";'
  - "$sql = \"SELECT * FROM $table WHERE id = 1\";"
  - "$sql = \"insert into $table (a) values (1)\";"
  - "$sql = \"DELETE FROM $table\nWHERE id = 1\";"
