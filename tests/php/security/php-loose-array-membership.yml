id: php-loose-array-membership
valid:
- '<?php in_array($n, $l, true);'
- '<?php array_search($n, $l, true);'
- '<?php array_keys($a, $v, true);'
- '<?php in_array($n, $l, 1);'
- '<?php array_search($n, $l, 1);'
- '<?php array_keys($a, $v, 1);'
- '<?php in_array(needle: $n, haystack: $l, strict: 1);'
- '<?php array_keys($a);'
- '<?php array_keys(array: $a, strict: false);'
- '<?php array_keys(array: $a);'
- '<?php array_keys(array: $a, filter_value: $v, strict: true);'
- '<?php in_array(needle: $n, haystack: $l, strict: true);'
- '<?php in_array(strict: true, needle: $n, haystack: $l);'
- '<?php array_search(strict: true, needle: $n, haystack: $l);'
- '<?php array_keys(array: $a, filter_value: $v, strict: true);'
- '<?php my_in_array($n, $l);'
- '<?php $a = [1, 2, 3];'
- '<?php // in_array($n, $l);'
- '<?php $s = "in_array($n, $l);";'
invalid:
- '<?php in_array($n, $l);'
- '<?php in_array($n, $l, false);'
- '<?php in_array($n, $l, $strict);'
- '<?php IN_ARRAY($n, $l);'
- '<?php \in_array($n, $l);'
- '<?php array_search($n, $l);'
- '<?php array_search($n, $l, false);'
- '<?php \array_search($n, $l);'
- '<?php array_keys($a, $v);'
- '<?php array_keys(array: $a, filter_value: $v);'
- '<?php array_keys($a, $v, false);'
- '<?php ARRAY_KEYS($a, $v);'
- '<?php in_array(needle: $n, haystack: $l, strict: $flag);'
- '<?php in_array($n, $l, strict: $flag ? false : true);'
- '<?php array_keys($a, $v, strict: $flag ? false : true);'
- '<?php in_array($n, $l, $flag ? false : true);'
- '<?php in_array($n, $l, strict: strict_default());'
