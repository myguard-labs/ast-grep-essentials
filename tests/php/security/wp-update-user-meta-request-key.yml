id: wp-update-user-meta-request-key
valid:
- "<?php update_user_meta( $user_id, 'phone', sanitize_text_field( $_POST['phone'] ) );"
- "<?php update_user_meta( $user_id, $key, $value );"
- "<?php update_post_meta( $post_id, $_POST['meta_key'], $v );"
- "<?php update_metadata( 'post', $id, $_POST['meta_key'], $v );"
- "<?php update_metadata( 'user', $id, 'phone', $_POST['v'] );"
- "<?php /* update_user_meta( $user_id, $_POST['meta_key'], $v ); */"
- "<?php $s = 'update_user_meta( $user_id, $_POST[meta_key], $v )';"
invalid:
- "<?php update_user_meta( $user_id, $_POST['meta_key'], $_POST['meta_value'] );"
- "<?php add_user_meta( $user_id, sanitize_key( $_REQUEST['k'] ), $v );"
- "<?php update_metadata( 'user', $id, $_POST['meta_key'], $v );"
- "<?php add_metadata( 'user', $id, $_GET['k'], $v );"
