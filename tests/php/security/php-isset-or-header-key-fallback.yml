id: php-isset-or-header-key-fallback
valid:
  - >-
    <?php if ( ! isset($headers['user-agent']) && !
    isset($headers['User-Agent']) ) { $headers['user-agent'] = 'x'; }
invalid:
  - >-
    <?php if ( ! isset($headers['user-agent']) || !
    isset($headers['User-Agent']) ) { $headers['user-agent'] = 'x'; }
