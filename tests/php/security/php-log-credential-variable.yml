id: php-log-credential-variable
valid:
  - '<?php function f($user_login) { logIO(''O'', " User login :  $user_login"); }'
  - |-
    <?php logIO("O", $args[1]);
  - |-
    <?php logIO("O", $user_login);
  - |-
    <?php logIO("O", "Login accepted");
invalid:
  - '<?php function f($user_pass) { logIO(''O'', " User pass :  $user_pass"); }'
  - |-
    <?php logIO("O", $password);
  - |-
    <?php logIO("O", "pw: " . $user_pass);
  - |-
    <?php logIO("O", "Pass: {$pass}");
