id: wp-schedule-single-event-without-clear
valid:
  - >-
    function f($id) { wp_clear_scheduled_hook('publish_future_post', $id);
    wp_schedule_single_event(time() + 60, 'publish_future_post', array($id)); }
invalid:
  - >-
    function f($id) { wp_schedule_single_event(time() + 60,
    'publish_future_post', array($id)); }
