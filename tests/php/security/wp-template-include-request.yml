id: wp-template-include-request
valid:
- "<?php get_template_part( 'content', 'page' );"
- "<?php load_template( plugin_dir_path( __FILE__ ) . 'layouts/' . $layout . '.php' );"
- "<?php get_header( $_GET['layout'] );"
- "<?php $tpl = $atts['slug'];"
- "<?php get_template_part( $slug );"
- "<?php /* get_template_part( $atts['slug'] ); */"
- "<?php $s = \"get_template_part( \\$atts['slug'] )\";"
invalid:
- "<?php get_template_part( $atts['slug'] );"
- "<?php load_template( plugin_dir_path( __FILE__ ) . 'layouts/' . $_GET['layout'] . '.php' );"
- "<?php locate_template( array( $_POST['tpl'] ), true );"
- "<?php get_extended_template_part( $attributes['name'] );"
