id: wp-date-default-timezone-literal-restore
valid:
  - >-
    function f( $tz ) { $prev = date_default_timezone_get();
    date_default_timezone_set( $tz ); date_default_timezone_set( $prev ); }
invalid:
  - >-
    function f( $tz ) { date_default_timezone_set( $tz );
    date_default_timezone_set( 'UTC' ); }
