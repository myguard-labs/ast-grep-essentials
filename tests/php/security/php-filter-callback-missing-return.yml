id: php-filter-callback-missing-return
valid:
  - >-
    <?php add_filter( 'template_include', static function ( $template ) { $start
    = microtime( true ); return $template; } );
invalid:
  - >-
    <?php add_filter( 'template_include', static function ( $template ) { $start
    = microtime( true ); } );
