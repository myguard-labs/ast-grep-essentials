id: wp-update-option-request-key
valid:
- "<?php update_option( 'myplugin_settings', $settings );"
- "<?php update_option( 'myplugin_color', sanitize_hex_color( $_POST['color'] ) );"
- "<?php get_option( $_GET['name'] );"
- "<?php update_user_option( $uid, $_POST['name'], $v );"
- "<?php /* update_option( $_POST['option_name'], $v ); */"
- "<?php $s = 'update_option( $_POST[option_name], $v )';"
- "<?php update_network_option( $_GET['nid'], 'plugin_opt', $v );"
- "<?php update_option( $allowed[ sanitize_key( $_POST['f'] ) ], $v );"
invalid:
- "<?php update_network_option( 1, $_GET['opt'], $v );"
- "<?php add_network_option( 1, $_GET['opt'], $v );"
- "<?php update_option( sanitize_key( $_POST['option_name'] ), wp_unslash( $_POST['option_value'] ) );"
- "<?php delete_option( $_GET['opt'] );"
- "<?php update_site_option( $_REQUEST['opt'], $v );"
