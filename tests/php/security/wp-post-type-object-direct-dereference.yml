id: wp-post-type-object-direct-dereference
valid:
  - >-
    <?php $post_type_object = get_post_type_object( $post_type ); $all_items =
    $post_type_object->labels->all_items;
  - "<?php $pto = get_post_type_object( $t ); if ( ! $pto ) { return; } $n = $pto->labels->name;"
  - "<?php $n = get_post_type_object( $t )?->labels->name;"
  - "<?php foreach ( $types as $t ) { $o = get_post_type_object( $t ); if ( $o instanceof WP_Post_Type ) { echo $o->label; } }"
invalid:
  - '<?php $all_items = get_post_type_object( $post_type )->labels->all_items;'
  - "<?php $label = get_post_type_object( get_post_type() )->label;"
  - "<?php echo esc_html( get_post_type_object( $t )->labels->name );"
  - "<?php $x = get_post_type_object( $t )->cap->edit_posts;"
