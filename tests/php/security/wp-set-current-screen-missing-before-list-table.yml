id: wp-set-current-screen-missing-before-list-table
valid:
  - >-
    <?php function f() { set_current_screen( 'edit-post' ); $wp_list_table =
    get_list_table( 'WP_Terms_List_Table' ); return $wp_list_table; }
invalid:
  - >-
    <?php function f() { $wp_list_table = get_list_table( 'WP_Terms_List_Table'
    ); return $wp_list_table; }
