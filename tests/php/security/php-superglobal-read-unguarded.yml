  - "<?php if ( ISSET( $_GET[\"a\"] ) ) { echo 1; }"
  - "<?php $x = $other[\"a\"];"
  - "<?php $x = isset( $_GET[\"a\"] ) ? esc_html( $_GET[\"a\"] ) : \"\";"
  - "<?php $a = $_GET[\"a\"] ?? \"\";"
  - "<?php $a = $_POST['a'] ?? '';"
  - "<?php $a = ($_GET[\"a\"]) ?? \"\";"
  - "<?php $_GET[\"a\"] ??= \"\";"
