  - "<?php $a = ($_GET[\"a\"] . \"z\") ?? \"\";"
  - "<?php if ( isset( $_GET[\"a\"] ) ) { echo $_GET[\"b\"]; }"
  - "<?php if ( isset( $_POST[\"a\"] ) ) { echo $_GET[\"a\"]; }"
  - "<?php if ( isset( $_GET[\"a\"] ) ) { echo 1; } else { echo $_GET[\"a\"]; }"
