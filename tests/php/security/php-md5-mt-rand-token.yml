id: php-md5-mt-rand-token
valid:
  - '<?php function f( $value ) { return md5( $value . time() . wp_rand() ); }'
  - |-
    <?php $t = md5(random_bytes(16));
  - |-
    <?php $t = md5(bin2hex(random_bytes(8)));
  - |-
    <?php $n = mt_rand(); $t = md5($salt);
invalid:
  - '<?php function f( $value ) { return md5( $value . time() . mt_rand() ); }'
  - |-
    <?php $t = md5(mt_rand());
  - |-
    <?php $t = md5(uniqid(mt_rand(), true));
  - |-
    <?php $t = md5(mt_rand() . $salt);
