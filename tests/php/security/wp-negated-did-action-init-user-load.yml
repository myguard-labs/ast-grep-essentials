id: wp-negated-did-action-init-user-load
valid:
  - >-
    <?php function switch_blog_user($blog_id) { if ( did_action('init') ) {
    $current_user = wp_get_current_user(); $current_user->for_blog($blog_id); }
    }
invalid:
  - >-
    <?php function switch_blog_user($blog_id) { if ( ! did_action('init') ) {
    $current_user = wp_get_current_user(); $current_user->for_blog($blog_id); }
    }
