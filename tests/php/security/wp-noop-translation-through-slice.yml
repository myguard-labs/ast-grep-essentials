id: wp-noop-translation-through-slice
valid:
  - >-
    'lintError' => wp_array_slice_assoc( _n( 'There is %d error.', 'There are %d
    errors.', 1 ), array( 'singular', 'plural' ) ),
invalid:
  - >-
    'lintError' => wp_array_slice_assoc( _n_noop( 'There is %d error.', 'There
    are %d errors.' ), array( 'singular', 'plural' ) ),
