id: php-suppressed-dl-call
valid:
  - 'dl( ''sockets.so'' );'
  - '$loaded = extension_loaded( ''sockets'' ) || dl( ''sockets.so'' );'
  - '@unlink( $file );'
  - '@sdl( ''sockets.so'' );'
invalid:
  - '@dl( ''sockets.so'' );'
  - '$ok = @dl( $name );'
  - 'if ( ! @dl( ''sockets.so'' ) ) { exit; }'
  - '@dl( PHP_SHLIB_PREFIX . ''x.'' . PHP_SHLIB_SUFFIX );'
  - '@dl();'
