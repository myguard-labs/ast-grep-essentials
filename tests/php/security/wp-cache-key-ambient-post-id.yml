id: wp-cache-key-ambient-post-id
valid:
  - "function get_thing_terms( $id = false ) {\n\t$terms = wp_get_object_terms( $id, 'category' );\n\twp_cache_add( $id, $terms, 'thing_relationships' );\n}"
invalid:
  - "function get_thing_terms( $id = false ) {\n\t$terms = wp_get_object_terms( $id, 'category' );\n\twp_cache_add( $post->ID, $terms, 'thing_relationships' );\n}"
