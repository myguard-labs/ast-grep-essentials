id: wp-manual-main-site-check
valid:
  - >-
    <?php if ( is_multisite() && $current_site->domain == $current_blog->domain
    ) { $x = 1; } ?>
invalid:
  - >-
    <?php if ( is_multisite() && $current_site->domain.$current_site->path ==
    $current_blog->domain.$current_blog->path ) { $x = 1; } ?>
