id: php-file-inclusion-variable
valid:
- '<?php require_once "config.php";'
- '<?php include "inc/header.php";'
- '<?php require __DIR__ . "/lib.php";'
- '<?php include ROOT . "/a.php";'
- '<?php // include $_GET["page"];'
- '<?php $s = "include $page;";'
- '<?php require_once dirname(__FILE__) . "/lib.php";'
- '<?php require_once \dirname(__FILE__) . "/lib.php";'
- '<?php require_once DIRNAME(__FILE__) . "/lib.php";'
invalid:
- '<?php include $page;'
- '<?php include $_GET["page"];'
- '<?php require_once $base . "/lib.php";'
- '<?php include "pages/{$name}.php";'
- '<?php require_once dirname(__FILE__) . "/" . $mod;'
