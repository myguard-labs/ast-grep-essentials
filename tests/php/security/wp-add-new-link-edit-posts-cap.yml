id: wp-add-new-link-edit-posts-cap
valid:
  - >-
    function f( $obj, $a ) { if ( current_user_can( $obj->cap->create_posts ) )
    { $a[] = 'post-new.php'; } return $a; }
invalid:
  - >-
    function f( $obj, $a ) { if ( current_user_can( $obj->cap->edit_posts ) ) {
    $a[] = 'post-new.php'; } return $a; }
