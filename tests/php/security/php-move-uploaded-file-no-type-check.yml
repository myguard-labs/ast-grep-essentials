    <?php
    function save() {
        move_uploaded_file($_FILES['f']['tmp_name'], $dest);
    }
  - |
    <?php
    class U {
        public function save($dest) {
            return move_uploaded_file($_FILES['f']['tmp_name'], $dest);
        }
    }
  - |
    <?php
    function save() {
        $ext = pathinfo($_FILES['f']['name'], PATHINFO_EXTENSION);
        \move_uploaded_file($_FILES['f']['tmp_name'], $dest . $ext);
    }
  - |
    <?php
    $h = function () use ($dest) {
        move_uploaded_file($_FILES['f']['tmp_name'], $dest);
    };
  - |
    <?php
    function save($path, $dest) {
        $unused = function () use ($path) {
            return mime_content_type($path);
        };
        move_uploaded_file($_FILES['f']['tmp_name'], $dest);
    }
