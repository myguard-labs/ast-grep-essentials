id: php-move-uploaded-file-no-type-check
valid:
  - |
    <?php
    function save() {
        $ft = wp_check_filetype($_FILES['f']['name']);
        move_uploaded_file($_FILES['f']['tmp_name'], $dest);
    }
  - |
    <?php
    function save() {
        if (mime_content_type($_FILES['f']['tmp_name']) !== 'image/png') { return; }
        move_uploaded_file($_FILES['f']['tmp_name'], $dest);
    }
  - |
    <?php
    function save() {
        return wp_handle_upload($_FILES['f'], ['test_form' => false]);
    }
  - |
    <?php
    function save() {
        copy($src, $dest);
    }
  - |
    <?php
    // move_uploaded_file($a, $b);
    function noop() { return 1; }
