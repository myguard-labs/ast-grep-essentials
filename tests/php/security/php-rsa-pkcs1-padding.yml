    <?php openssl_sign($data, $sig, $key, OPENSSL_ALGO_SHA256);
  - |
    <?php other_encrypt($data, $out, $key, OPENSSL_PKCS1_PADDING);
  - |
    <?php openssl_private_encrypt($d, $out, $key, OPENSSL_PKCS1_PADDING);
  - |
    <?php openssl_public_decrypt($sig, $out, $key, OPENSSL_PKCS1_PADDING);
invalid:
  - |
    <?php openssl_public_encrypt($data, $out, $key, OPENSSL_PKCS1_PADDING);
  - |
    <?php openssl_private_decrypt($enc, $out, $key, OPENSSL_PKCS1_PADDING);
  - |
