    <?php openssl_public_encrypt($data, $out, $key, OPENSSL_PKCS1_OAEP_PADDING);
  - |
    <?php openssl_private_decrypt($enc, $out, $key, OPENSSL_PKCS1_OAEP_PADDING);
  - |
    <?php openssl_public_encrypt($data, $out, $key);
