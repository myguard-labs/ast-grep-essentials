id: php-assignment-in-logical-condition
valid:
  - 'if ( $a && $b == $c ) { }'
  - "<?php if ( $a == $b || $c === $d ) { }"
  - "<?php if ( $a = foo() ) { }"
  - "<?php if ( $a || ! empty( $b ) ) { $x = $y && $z; }"
invalid:
  - 'if ( $a && $b = $c ) { }'
  - "<?php if ( $a || $b = $c ) { }"
  - "<?php if ( $ok && $row = fetch_row( $id ) ) { }"
  - "<?php if ( $a ) { } elseif ( $b && $c = next_item() ) { }"
