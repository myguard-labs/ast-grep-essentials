id: wp-register-post-type-missing-add-new-item
valid:
  - >-
    <?php register_post_type('book', array('labels' => array('name' => 'Books',
    'add_new_item' => 'Add Book'), 'public' => true));
invalid:
  - >-
    <?php register_post_type('book', array('labels' => array('name' => 'Books'),
    'public' => true));
