id: php-fetch-request-url
valid:
- "<?php $body = file_get_contents( __DIR__ . '/templates/index.html' );"
- "<?php $body = file_get_contents( $url );"
- "<?php curl_setopt( $ch, CURLOPT_TIMEOUT, $_POST['t'] );"
- "<?php curl_setopt( $ch, CURLOPT_URL, 'https://api.example.com/x' );"
- "<?php curl_setopt( $ch, CURLOPT_POSTFIELDS, $_POST['body'] );"
- "<?php curl_setopt( $ch, CURLOPT_FILE, $_POST['fh'] );"
- "<?php file_put_contents( $_GET['dest'], $data );"
- "<?php /* file_get_contents( $_GET['src'] ); */"
- "<?php $s = \"file_get_contents( \\$_GET['src'] )\";"
invalid:
- "<?php $body = file_get_contents( $_GET['src'] );"
- "<?php curl_setopt( $ch, CURLOPT_URL, $_POST['endpoint'] );"
- "<?php $size = getimagesize( $_REQUEST['image'] );"
- "<?php $fh = fopen( $_GET['path'], 'r' );"
