id: wp-die-unescaped-error-property
valid:
  - '<?php wp_die( esc_html( $pop3->ERROR ) ); ?>'
  - '<?php wp_die( esc_html__( ''Failed'', ''x'' ) ); ?>'
  - '<?php wp_die( esc_html( $e->ERROR ), ''Error'', array( ''response'' => 500 ) ); ?>'
  - '<?php wp_die( wp_kses_post( $o->ERROR ) ); ?>'
invalid:
  - '<?php wp_die( $pop3->ERROR ); ?>'
  - '<?php wp_die( $this->ERROR ); ?>'
  - '<?php if ( $r ) { wp_die( $r->ERROR ); } ?>'
