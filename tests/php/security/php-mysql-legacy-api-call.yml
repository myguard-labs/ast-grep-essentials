id: php-mysql-legacy-api-call
valid:
  - '<?php $result = $wpdb->get_row($sql); ?>'
  - '<?php $r = mysqli_connect("h", "u", "p");'
  - '<?php $r = $db->mysql_query($sql);'
  - '<?php $r = my_mysql_ping($c);'
invalid:
  - '<?php $result = mysql_query($sql, $dbh); ?>'
  - '<?php $r = mysql_fetch_assoc($res);'
  - '<?php if (!mysql_select_db($name, $link)) { die(); }'
  - '<?php $r = mysql_real_escape_string($s);'
