id: wp-unzip-file-request
valid:
- "<?php $result = unzip_file( $verified_archive_path, $dest );"
- "<?php $zip->extractTo( $dest );"
- "<?php $zip->open( $_FILES['pkg']['tmp_name'] );"
- "<?php $name = $_FILES['demo']['tmp_name'];"
- "<?php /* unzip_file( $_FILES['demo']['tmp_name'], $d ); */"
- "<?php $s = 'unzip_file( $_FILES[demo][tmp_name], $d )';"
- "<?php $parser->extract( $_GET['field'] );"
invalid:
- "<?php unzip_file( $_FILES['demo']['tmp_name'], WP_CONTENT_DIR . '/themes/' );"
- "<?php $zip->extractTo( ABSPATH . $_POST['target'] );"
- "<?php $archive->extract( PCLZIP_OPT_PATH, $_GET['dir'] );"
