id: php-exec-sink
valid:
- <?php escapeshellarg($cmd);
- <?php /* <?php system($cmd); */
- <?php $text = '<?php system($cmd);';
- <?php /* assert($condition); */
- <?php $text = 'assert($condition);';
invalid:
- <?php system($cmd);
- <?php exec($cmd);
- <?php SYSTEM($cmd);
- <?php assert($condition);
- <?php ASSERT($condition);
