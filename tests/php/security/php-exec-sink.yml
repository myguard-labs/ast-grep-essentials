id: php-exec-sink
valid:
- <?php escapeshellarg($cmd);
- <?php Vendor\system($cmd);
- <?php /* <?php system($cmd); */
- <?php $text = '<?php system($cmd);';
- <?php /* assert($condition); */
- <?php $text = 'assert($condition);';
invalid:
- <?php system($cmd);
- <?php exec($cmd);
- <?php SYSTEM($cmd);
- <?php \system($cmd);
- <?php passthru($cmd);
- <?php shell_exec($cmd);
- <?php popen($cmd, "r");
- <?php proc_open($cmd, [], $pipes);
- <?php eval($code);
- <?php assert($condition);
- <?php ASSERT($condition);
