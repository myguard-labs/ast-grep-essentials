id: php-author-link-without-author-guard
valid:
  - >-
    if ( ! empty($d['AuthorURI']) && ! empty($d['Author']) ) $d['Author'] = '<a
    href="' . $d['AuthorURI'] . '">' . $d['Author'] . '</a>';
invalid:
  - >-
    if ( ! empty($d['AuthorURI']) ) $d['Author'] = '<a href="' . $d['AuthorURI']
    . '">' . $d['Author'] . '</a>';
