id: php-bitwise-or-preg-match-condition
valid:
  - >-
    function f($line) { if ( preg_match('/From: /', $line) ||
    preg_match('/Reply-To: /', $line) ) { return 1; } }
invalid:
  - >-
    function f($line) { if ( preg_match('/From: /', $line) |
    preg_match('/Reply-To: /', $line) ) { return 1; } }
