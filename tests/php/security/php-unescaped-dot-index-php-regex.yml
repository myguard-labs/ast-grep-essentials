id: php-unescaped-dot-index-php-regex
valid:
  - '$p = preg_replace(''|/index\.php$|'', ''/'', $p);'
  - '<?php $p = preg_replace( ''#/index\.php$#'', ''/'', $p );'
  - '<?php $p = preg_replace( ''|/index[.]php$|'', ''/'', $p );'
  - '<?php $p = preg_replace( ''|/'' . preg_quote( ''index.php'', ''|'' ) . ''$|'', ''/'', $p );'
invalid:
  - '$p = preg_replace(''|/index.php$|'', ''/'', $p);'
  - '<?php $p = preg_replace( ''|/index.php$|'', '''', $url );'
  - '<?php return preg_replace( ''|/index.php$|'', ''/'', $p, 1 );'
  - '<?php $p = trim( preg_replace( ''|/index.php$|'', ''/'', $p ) );'
