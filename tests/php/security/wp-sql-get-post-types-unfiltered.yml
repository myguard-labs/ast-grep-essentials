id: wp-sql-get-post-types-unfiltered
valid:
  - >-
    $ids = $wpdb->get_col( "SELECT ID FROM $wpdb->posts WHERE post_type IN ('" .
    join( "', '", get_post_types( array( 'public' => false ) ) ) . "')" );
invalid:
  - >-
    $ids = $wpdb->get_col( "SELECT ID FROM $wpdb->posts WHERE post_type IN ('" .
    join( "', '", get_post_types() ) . "')" );
