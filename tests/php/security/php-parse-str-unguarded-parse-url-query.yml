id: php-parse-str-unguarded-parse-url-query
valid:
  - >-
    function f($url) { $parsed_url = parse_url($url); if ( ! empty(
    $parsed_url['query'] ) ) { parse_str($parsed_url['query'], $parsed_query); }
    return $parsed_query; }
invalid:
  - >-
    function f($url) { $parsed_url = parse_url($url);
    parse_str($parsed_url['query'], $parsed_query); return $parsed_query; }
