id: wp-publish-status-edit-published-capability
valid:
  - >-
    <?php if ( 'publish' == $_POST['post_status'] && !current_user_can(
    'publish_posts' ) ) $_POST['post_status'] = 'pending';
  - |-
    <?php if ( 'draft' == $_POST['post_status'] && !current_user_can( 'edit_published_posts' ) ) $_POST['post_status'] = 'pending';
  - |-
    <?php if ( 'publish' == $_POST['post_status'] && !current_user_can( 'publish_pages' ) ) $_POST['post_status'] = 'pending';

invalid:
  - >-
    <?php if ( 'publish' == $_POST['post_status'] && !current_user_can(
    'edit_published_posts' ) ) $_POST['post_status'] = 'pending';
  - |-
    <?php if ( !current_user_can( 'edit_published_posts' ) && 'publish' == $_POST['post_status'] ) $_POST['post_status'] = 'pending';
  - |-
    <?php if ( ( 'publish' == $_POST['post_status'] ) && ( !current_user_can( 'edit_published_pages' ) ) ) { $_POST['post_status'] = 'pending'; }
