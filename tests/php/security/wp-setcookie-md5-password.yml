id: wp-setcookie-md5-password
valid:
  - '<?php setcookie(''wordpresspass_x'', $user_pass_token, time() + 3600, ''/'');'
  - '<?php setcookie(''wp_pass'', password_hash($user_pass, PASSWORD_DEFAULT), time() + 3600, ''/'');'
  - '<?php setcookie(''wp_pass'', wp_hash($user_pass), time() + 3600, ''/'');'
  - '<?php setcookie(md5($user_pass), ''x'', time() + 3600, ''/'');'
invalid:
  - '<?php setcookie(''wordpresspass_x'', md5($user_pass), time() + 3600, ''/'');'
  - '<?php setcookie("wp_pass", md5($user_pass), [''expires'' => time() + 60, ''secure'' => true]);'
  - '<?php setcookie(''wp_pass'', md5($user->pass), time() + 3600, ''/'');'
  - '<?php setcookie(''wp_pass'', md5($_POST[''pw'']), time() + 3600, ''/'');'
