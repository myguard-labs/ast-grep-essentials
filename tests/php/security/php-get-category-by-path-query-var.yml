id: php-get-category-by-path-query-var
valid:
  - >-
    <?php function f() { $cat = get_query_var( 'category_name' ); if ( $cat ) {
    $category = get_category_by_path( $cat ); } }
invalid:
  - >-
    <?php function f() { $category = get_category_by_path( get_query_var(
    'category_name' ) ); }
