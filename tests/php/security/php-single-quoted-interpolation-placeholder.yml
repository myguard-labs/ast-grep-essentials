id: php-single-quoted-interpolation-placeholder
valid:
  - >-
    function f($option_name, $oldvalue, $newvalue) {
    do_action("update_option_{$option_name}", $oldvalue, $newvalue); }
invalid:
  - >-
    function f($option_name, $oldvalue, $newvalue) {
    do_action('update_option_{$option_name}', $oldvalue, $newvalue); }
