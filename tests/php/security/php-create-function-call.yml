id: php-create-function-call
valid:
- "<?php $cb = function ( $a ) { return $a * 2; };"
- "<?php create_function_wrapper( '$a', 'return $a;' );"
- "<?php /* create_function( '$a', 'return $a;' ); */"
- "<?php $s = 'create_function';"
invalid:
- "<?php $cb = create_function( '$a', 'return ' . $_GET['expr'] . ';' );"
- "<?php $cb = \\CREATE_FUNCTION( '$a', 'return 1;' );"
