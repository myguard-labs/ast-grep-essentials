id: php-bitwise-and-boolean-operands
valid:
  - "<?php\nif ( is_network_admin() && !$is_profile ) {\n\t$x = 1;\n}"
  - "<?php if ( $flags & FLAG_X ) { $x = 1; }"
  - "<?php if ( $flags & ~FLAG_X ) { $x = 1; }"
  - "<?php if ( ( $flags & FLAG_X ) && ! $skip ) { $x = 1; }"
invalid:
  - "<?php\nif ( is_network_admin() & !$is_profile ) {\n\t$x = 1;\n}"
  - "<?php if ( $a & ! $b ) { $x = 1; }"
  - "<?php if ( $user->can( 'edit' ) & ! empty( $id ) ) { $x = 1; }"
  - "<?php if ( $a ) { } elseif ( $b & ! $c ) { $x = 1; }"
