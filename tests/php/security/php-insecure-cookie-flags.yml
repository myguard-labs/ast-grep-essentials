id: php-insecure-cookie-flags
valid:
- '<?php setcookie("sid", $v, ["httponly" => true, "secure" => true, "samesite" => "Lax"]);'
- '<?php setcookie("sid", $v, ["HttpOnly" => true, "Secure" => true]);'
- '<?php setcookie("sid", $v, ["secure" /* why */ => true, "httponly" => true]);'
- '<?php setcookie("sid", $v, ["secure" => /* why */ true, "httponly" => true]);'
- '<?php setcookie("sid", $v, ["secure" => false, "secure" => true, "httponly" => true]);'
- '<?php setcookie("sid", $v, ["httponly" => false, "httponly" => true, "secure" => true]);'
- '<?php setcookie("sid", $v, ["secure" => $configured, "secure" => true, "httponly" => true]);'
- '<?php setcookie("sid", $v, time()+3600, "/", "", true, true);'
- '<?php setrawcookie("t", $v, ["secure" => true, "httponly" => true]);'
- '<?php setcookie(expires_or_options: ["secure" => true, "httponly" => true], name: "sid", value: $v);'
- '<?php setcookie(expires_or_options: ["secure" => true, "httponly" => true], name: "sid");'
- '<?php setrawcookie(value: $v, expires_or_options: ["secure" => true, "httponly" => true], name: "t");'
- '<?php setcookie(httponly: true, name: "sid", secure: true, value: $v);'
- '<?php setrawcookie(secure: true, value: $v, httponly: true, name: "t");'
- '<?php setcookie("sid", $v, 0, "/", "", true, httponly: true);'
- '<?php setrawcookie("t", $v, 0, "/", "", true, httponly: true);'
- '<?php $_COOKIE["sid"];'
- '<?php // setcookie("sid", $v);'
invalid:
- '<?php setcookie("sid", $v);'
- '<?php setrawcookie("token", $v);'
- '<?php setcookie("sid", $v, ["secure" => true]);'
- '<?php setcookie("sid", $v, ["httponly" => true, "samesite" => "Lax"]);'
- '<?php setcookie("sid", $v, ["secure" => false, "httponly" => true]);'
- '<?php setcookie("sid", $v, ["secure" => true, "httponly" => false]);'
- '<?php setcookie("sid", $v, ["secure" => true, "secure" => false, "httponly" => true]);'
- '<?php setcookie("sid", $v, ["secure" => true, "httponly" => true, "httponly" => false]);'
- '<?php setcookie("sid", $v, ["secure" => true, "secure" => $configured, "httponly" => true]);'
- '<?php setcookie("sid", $v, ["meta" => ["secure" => true, "httponly" => true]]);'
- '<?php setcookie(value: $v, name: "sid", expires_or_options: ["secure" => true]);'
- '<?php setcookie(expires_or_options: ["secure" => true], name: "sid");'
- '<?php setrawcookie(expires_or_options: ["secure" => false, "httponly" => true], name: "t", value: $v);'
- '<?php setcookie(name: "sid", secure: true);'
- '<?php setrawcookie(httponly: true, name: "t");'
- '<?php setcookie(httponly: true, secure: false, name: "sid");'
- '<?php setrawcookie(secure: true, httponly: false, name: "t");'
- '<?php setcookie("sid", $v, 0, "/", "", true, httponly: false);'
- '<?php setcookie("sid", $v, 0, "/", "", false, httponly: true);'
- '<?php setcookie("sid", $v, time()+3600, "/");'
- '<?php setcookie("sid", $v, time()+3600, "/", "example.com", true);'
- '<?php setcookie("sid", $v, time()+3600, "/", "example.com", false, true);'
- '<?php setcookie("sid", $v, time()+3600, "/", "example.com", true, false);'
- '<?php SETCOOKIE("sid", $v);'
- '<?php \setcookie("sid", $v);'
