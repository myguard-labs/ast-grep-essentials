id: php-new-without-parentheses
valid:
  - '<?php $val = new stdClass();'
  - '<?php $val = new class() extends Foo {};'
  - '<?php $val = new class(1, $a) extends Foo {};'
  - '<?php $val = new class() {};'
invalid:
  - '<?php $val = new stdClass;'
  - '<?php $val = new class {};'
  - '<?php $val = new class extends Foo {};'
