id: wp-sslverify-disabled-literal
valid:
  - '$args = array( ''sslverify'' => true );'
  - '$args = array( ''sslverify'' => $verify );'
  - '$args = array( ''timeout'' => false );'
  - '$args = array( "sslverify$x" => false );'
  - '$args = array( "{$k}sslverify" => false );'
  - '$args = array( "sslverify" => true );'
invalid:
  - '$args = array( ''sslverify'' => false );'
  - '$args = array( ''timeout'' => 5, ''sslverify'' => FALSE );'
  - '$args = [ ''sslverify'' => false ];'
  - '$args = array( "sslverify" => false );'
  - '$args = [ "timeout" => 5, "sslverify" => FALSE ];'
