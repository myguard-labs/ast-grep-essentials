id: php-extract-superglobal
valid:
- <?php extract($curated);
- <?php /* <?php extract($_GET); */
- <?php $text = '<?php extract($_GET);';
- <?php extract($curated, flags_from_request($_GET));
- <?php extract($curated, EXTR_PREFIX_ALL, $_GET["prefix"]);
- <?php extract($_GET_cache);
invalid:
- <?php extract($_GET);
- <?php extract($_POST);
- <?php EXTRACT($_GET);
- <?php extract($_SERVER);
- <?php extract($_COOKIE, EXTR_OVERWRITE);
- <?php extract($_REQUEST);
