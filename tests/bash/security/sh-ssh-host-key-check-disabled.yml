id: sh-ssh-host-key-check-disabled
valid:
  - 'ssh -o StrictHostKeyChecking=yes host'
  - 'ssh -o StrictHostKeyChecking=accept-new host'
  - 'ssh -o UserKnownHostsFile=/tmp/known_hosts host'
  - 'ssh -o ConnectTimeout=5 host'
  - 'wrapper -o StrictHostKeyChecking=no host'
  - 'ssh -- host printf %s -o StrictHostKeyChecking=no'
  - 'ssh host printf ''%s\n'' ''-oStrictHostKeyChecking=no'''
  - 'command scp -- -oStrictHostKeyChecking=no host:/tmp/'
  - 'printf ''ssh -o StrictHostKeyChecking=no host'''
  - '# ssh -o StrictHostKeyChecking=no host'
  - 'ssh -o StrictHostKeyChecking=no-such host'
  - 'ssh -o "StrictHostKeyChecking yes" host'
  - 'ssh -o "StrictHostKeyChecking accept-new" host'
  - 'ssh -o StrictHostKeyChecking=ask host'
  - 'ssh -o "UserKnownHostsFile no" host'
  - 'ssh -- host printf %s -o "StrictHostKeyChecking no"'
invalid:
  - 'ssh -o StrictHostKeyChecking=no host'
  - 'scp -oStrictHostKeyChecking=no file host:/tmp/'
  - 'sftp "-o" "StrictHostKeyChecking=no" host'
  - '''ssh'' ''-oStrictHostKeyChecking=no'' host'
  - 'ssh -o strictHOSTkeychecking=NO host'
  - 'ssh -v -o StrictHostKeyChecking=no host'
  - 'command ssh -o StrictHostKeyChecking=no host'
  - 'command ssh -v -o StrictHostKeyChecking=no host'
  - 'command scp -q -o StrictHostKeyChecking=no file host:/tmp/'
  - 'command -- ssh -o StrictHostKeyChecking=no host'
  - 'ssh -o StrictHostKeyChecking=no host printf %s -oStrictHostKeyChecking=no'
  - 'ssh -o "StrictHostKeyChecking no" host'
  - 'ssh -o StrictHostKeyChecking=off host'
  - 'ssh -o StrictHostKeyChecking=false host'
  - 'ssh -o "StrictHostKeyChecking = no" host'
  - 'ssh -o "strictHOSTkeychecking OFF" host'
  - 'scp "-oStrictHostKeyChecking no" file host:/tmp/'
  - 'ssh -oStrictHostKeyChecking=off host'
  - 'command ssh -o "StrictHostKeyChecking no" host'
