id: sh-svn-checkout-trunk-unpinned
valid:
  - 'svn co https://svn.example.com/project/tags/2.6.22/libs/ "$LIBDIR/Lib"'
  - 'svn update'
  - 'svn checkout https://svn.example.com/project/tags/v1/ dir'
  - 'svn co https://svn.example.com/project/tags/trunk-fixes/ dir'
invalid:
  - 'svn co https://svn.example.com/project/trunk/libs/ "$LIBDIR/Lib"'
  - 'svn checkout https://svn.example.com/project/trunk dir'
  - 'svn co -q https://svn.example.com/project/trunk/ "$dir"'
  - 'svn co --depth empty https://svn.example.com/p/trunk dir'
