id: sh-path-search-includes-cwd
valid:
- PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
- export PATH=/opt/app/bin:$PATH
- PATH="$HOME/bin:/usr/bin"
- MANPATH=.:$MANPATH
- export EDITOR=vi
- echo "PATH=.:$PATH"
- '# export PATH=.:$PATH'
invalid:
- PATH=.:$PATH
- export PATH=.:$PATH
- PATH=:$PATH
- PATH="$PATH:"
- PATH="$PATH::/opt/bin"
- export PATH="$PATH:."
- declare PATH=.:/usr/bin
