id: sh-secret-on-command-line
valid:
- MYSQL_PWD="$DB_PASS" mysql -u root app
- mysql -u root app
- mysql --user root app
- docker login --password-stdin registry.example
- curl --cacert /etc/ssl/ca.pem https://example.test
- sshpass -f /run/secrets/ssh ssh deploy@host
- deploy.sh -p "$DB_PASS"
- openssl rand -hex 32
- curl -u root https://example.test
- echo "mysql -p$DB_PASS"
- '# mysql -p"$DB_PASS" app'
invalid:
- mysql -u root -p"$DB_PASS" app
- mysql --password "$DB_PASS" app
- psql "-p$PGPASSWORD"
- curl -u "user:$API_TOKEN" https://example.test
- sshpass -p "$SSH_PASSWORD" ssh deploy@host
- docker login -p "$REGISTRY_TOKEN" registry.example
- openssl enc -aes-256-cbc -pass "pass:$ENC_SECRET"
- '"mysql" -p"$DB_PASS" app'
- mysql "-p$DB_PASS" app
- mysql "--password" "$DB_PASS" app
