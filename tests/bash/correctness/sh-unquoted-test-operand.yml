id: sh-unquoted-test-operand
valid:
  - 'if [ "$FLAG" = yes ]; then :; fi'
  - 'if [ "$a" = "$b" ]; then :; fi'
  - 'if [ -n "$name" ]; then :; fi'
  - 'if [ "${mode}" != on ]; then :; fi'
  - 'if [[ $a = yes ]]; then :; fi'
  - 'if [[ $a == "$b" ]]; then :; fi'
invalid:
  - 'if [ $FLAG = yes ]; then :; fi'
  - 'if [ "$a" = $b ]; then :; fi'
  - 'if [ $a != "" ]; then :; fi'
  - 'while [ $n -lt 10 ]; do n=$((n+1)); done'
