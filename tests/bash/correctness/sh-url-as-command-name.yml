id: sh-url-as-command-name
valid:
  - 'svn co http://example.com/libs'
  - 'git clone https://example.com/repo.git /srv/repo'
  - 'curl --fail --silent --show-error --location https://example.com/setup.sh --output /tmp/setup.sh'
  - 'echo "see https://example.com/docs for details"'
invalid:
  - 'http://example.com/libs'
  - 'https://example.com/setup.sh | sh'
  - 'https://example.com/pkg.tar.gz --output /tmp/pkg.tar.gz'
  - 'if ! http://example.com/health; then exit 1; fi'
