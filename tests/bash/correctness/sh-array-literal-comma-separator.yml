id: sh-array-literal-comma-separator
valid:
  - 'SUSE_VERSIONS=("15" "16")'
  - |-
      FILES=("$dir/a" "$dir/b")
  - |-
      NAMES=(one two three)
  - |-
      PKGS=(
        "curl"
        "git"
      )
  - |-
      LIST=("a,b" "c,d")
invalid:
  - 'SUSE_VERSIONS=("15", "16")'
  - |-
      PKGS=("curl", "git")
  - |-
      PKGS=(
        "curl",
        "git"
      )
  - |-
      DISTS=("bookworm","trixie")
  - |-
      ARR=("a" , "b")
