id: sh-grep-regex-from-variable
valid:
  - 'grep -qF "id=${label}" "$f"'
  - |-
    grep -qFx "$pat" "$f"
  - |-
    grep -qF -- "$pat" /etc/hosts
  - |-
    grep -qE "^[a-z]+$" /etc/hosts
  - |-
    grep -qE "^[a-z]+$" "$f"
  - |-
    grep -qE "^x" -- "$f"
  - |-
    grep -qE "^[a-z]+$" "$f1" "$f2"
invalid:
  - 'grep -qE "id=${label}" "$f"'
  - |-
    grep -qE -- "$pat" "$f"
  - |-
    if grep -qE "^${prefix}-[0-9]+$" "$f"; then echo hit; fi
  - |-
    grep -qE "$a|$b" /etc/hosts
  - |-
    grep -qE -x "^${p}x" "$f"
  - |-
    cat "$f" | grep -qE "$p"
