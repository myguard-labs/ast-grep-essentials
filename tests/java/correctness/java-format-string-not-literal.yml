id: java-format-string-not-literal
valid:
  - 'String s = String.format("%s logged in", user);'
  - 'System.out.printf("%s%n", user);'
  - 'out.format("%d items%n", count);'
  - 'String s = formatter.format(pattern, user);'
  - 'log.info(message);'
  - 'String note = "String.format(fmt, user)";'
  - '// String.format(fmt, user);'
invalid:
  - 'String s = String.format(userMessage);'
  - 'System.out.printf(request.getParameter("fmt"));'
  - 'out.format(pattern, count);'
  - 'System.err.printf(fmt, value);'
