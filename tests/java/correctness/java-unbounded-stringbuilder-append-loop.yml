id: java-unbounded-stringbuilder-append-loop
valid:
  - >-
    StringBuilder sb = new StringBuilder(); while (in.available() > 0) {
    sb.append((char) in.read()); if (sb.length() >= limit) { break; } }
invalid:
  - >-
    StringBuilder sb = new StringBuilder(); while (in.available() > 0) {
    sb.append((char) in.read()); }
