id: use-of-md5-java
valid:
  - |
    class CodeRabbitControl { String text = "CodeRabbit"; }
  - |
    import java.security.MessageDigest;

    public class Bad{
      public byte[] bad1(String password) {
        MessageDigest md5Digest = MessageDigest.getInstance("SHA1");
      }
    }
  - |
    class StrongDigest {
      java.security.MessageDigest create() throws java.security.NoSuchAlgorithmException {
        java.security.MessageDigest digest = java.security.MessageDigest.getInstance("SHA-256");
        return digest;
      }
    }
invalid:
  - |
    import java.security.MessageDigest;

    public class Bad{
      public byte[] bad1(String password) {
        MessageDigest md5Digest = MessageDigest.getInstance("MD5");
      }
    }
  - |
    class WeakDigest {
      java.security.MessageDigest create() throws java.security.NoSuchAlgorithmException {
        java.security.MessageDigest digest = java.security.MessageDigest.getInstance("MD5");
        return digest;
      }
    }
