id: cookie-httponly-false-java
valid:
  - |
    class CodeRabbitControl { String text = "CodeRabbit"; }
  - |
    @RequestMapping(value = "/cookie3", method = "GET")
    public void setSecureHttponlyCookie(@RequestParam String value, HttpServletResponse response) {
        Cookie cookie = new Cookie("cookie", value);
        cookie.setSecure(true);
        cookie.setHttpOnly(true);
        response.addCookie(cookie);
    }
  - |
    class A {
        void f(Cookie cookie) {
            cookie.setSecure(false);
        }
    }
  - |
    class A { void f(Cookie c, boolean b) { c.setHttpOnly(b); } }
invalid:
  - |
    class A {
        @RequestMapping(value = "/cookie4", method = "GET")
        public void explicitDisable(@RequestParam String value, HttpServletResponse response) {
            Cookie cookie = new Cookie("cookie", value);
            cookie.setSecure(false);
            cookie.setHttpOnly(false);
            response.addCookie(cookie);
        }
    }
  - |
    class A { void f(HttpServletResponse r) { Cookie c = new Cookie("a", "b"); c.setHttpOnly(false); r.addCookie(c); } }
  - |
    class A { void f() { this.cookie.setHttpOnly(false); } }
  - |
    class A { void f(Cookie c, boolean x) { if (x) c.setHttpOnly(false); } }
