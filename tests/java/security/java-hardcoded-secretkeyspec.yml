id: java-hardcoded-secretkeyspec
valid:
  - |
    class A { Object k(byte[] key) { return new SecretKeySpec(key, "AES"); } }
  - |
    class A { Object k(String pass) { return new SecretKeySpec(pass.getBytes("UTF-8"), "AES"); } }
  - |
    class A { Object k() { return new SecretKeySpec(System.getenv("KEY").getBytes(), "AES"); } }
  - |
    class A { Object k() { return new Other("0123456789abcdef".getBytes(), "AES"); } }
  - |
    class A { Object k() { return new SecretKeySpec(loadKey(), "AES"); } }
invalid:
  - |
    class A { Object k() { return new SecretKeySpec("0123456789abcdef".getBytes(), "AES"); } }
  - |
    class A { Object k() { return new SecretKeySpec("0123456789abcdef".getBytes(StandardCharsets.UTF_8), "AES"); } }
  - |
    class A { Object k() { return new javax.crypto.spec.SecretKeySpec("0123456789abcdef".getBytes("UTF-8"), "AES"); } }
