id: use-of-rc4-java
valid:
  - |
    class CodeRabbitControl { String text = "CodeRabbit"; }
  - |
    Cipher.getInstance("AES/CBC/PKCS7PADDING");
  - |
    import javax.crypto.Cipher;
    class Example {
        Cipher create() throws Exception {
            return Cipher.getInstance("AES/CBC/PKCS5Padding", "RC4");
        }
    }
invalid:
  - |
    Cipher.getInstance("RC4");
  - |
    useCipher(Cipher.getInstance("RC4"));
  - |
    import javax.crypto.Cipher;
    class Example {
        Cipher create() throws Exception {
            return Cipher.getInstance("RC4", "SunJCE");
        }
    }
