id: drivermanager-hardcoded-secret-java
valid:
  - |
    class CodeRabbitControl { String text = "CodeRabbit"; }
  - |
    Connection conn = DriverManager.getConnection("jdbc:oracle:thin:@localhost:1521:o92","a");
  - |
    class A { void f() throws Exception { Connection c = DriverManager.getConnection("jdbc:mysql://localhost/db", "root", System.getenv("DB_PASSWORD")); } }
  - |
    class A { void f(String pw) throws Exception { Connection c = DriverManager.getConnection("jdbc:mysql://localhost/db", "root", pw); } }
  - |
    class A { void f(String pw) { DataSource d = new DriverManagerDataSource("jdbc:h2:mem:t", "sa", pw); } }
invalid:
  - |
    Connection conn =DriverManager.getConnection("jdbc:oracle:thin:@localhost:1521:o92", "a", "password");
  - |
    class A { void f() throws Exception { Connection c = DriverManager.getConnection("jdbc:mysql://localhost/db", "root", "placeholder-pw"); } }
  - |
    class A { void f() { DataSource d = new DriverManagerDataSource("jdbc:h2:mem:t", "sa", "placeholder-pw"); } }
  - |
    class A { Connection f() throws Exception { return DriverManager.getConnection("jdbc:mysql://localhost/db", "root", "placeholder-pw"); } }
