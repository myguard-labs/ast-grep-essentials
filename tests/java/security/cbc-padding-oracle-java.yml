id: cbc-padding-oracle-java
valid:
  - |
    class CodeRabbitControl { String text = "CodeRabbit"; }
  - |
    Cipher.getInstance("AES/GCM/NoPadding");
  - |
    class A { void f() throws Exception { Cipher c = Cipher.getInstance("AES/GCM/NoPadding"); } }
  - |
    class A { void f() throws Exception { Cipher c = Cipher.getInstance("ChaCha20-Poly1305"); } }
invalid:
  - |
    Cipher.getInstance("AES/CBC/PKCS5Padding");
  - |
    class A { Cipher f() throws Exception { return Cipher.getInstance("AES/CBC/PKCS5Padding"); } }
  - |
    class A { void f() throws Exception { Cipher c; c = Cipher.getInstance("AES/CBC/PKCS5Padding"); } }
  - |
    class A { void f() throws Exception { Cipher c = Cipher.getInstance("DESede/CBC/PKCS5Padding"); } }
