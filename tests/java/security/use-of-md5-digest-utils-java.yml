id: use-of-md5-digest-utils-java
valid:
  - |
    class CodeRabbitControl { String text = "CodeRabbit"; }
  - |
    MessageDigest md5Digest = MessageDigest.getInstance("MD5");
  - |
    byte[] hashValue = DigestUtils.getSha512Digest().digest(password.getBytes());
  - |-
    class Example {
        void hash(byte[] input) {
            java.security.MessageDigest digest = DigestUtils.getSha512Digest();
            byte[] hash = digest.digest(input);
        }
    }
