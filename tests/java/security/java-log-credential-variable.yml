id: java-log-credential-variable
valid:
  - |
    class A { void f(String user) { log.info("user {} logged in", user); } }
  - |
    class A { void f(String password) { log.info("pw length {}", password.length()); } }
  - |
    class A { void f(String token) { log.info("token {}", mask(token)); } }
  - |
    class A { void f(int tokenCount) { log.info("count {}", tokenCount); } }
  - |
    class A { void f(String password) { other.info("pw {}", password); } }
  - |
    class A {
      // log.info("pw {}", password);
      String s = "log.info(password)";
    }
  - |
    class A { void f(User u) { log.info("name {}", u.getName()); } }
  - |
    class A { void f(String user) { log.info("user=" + user + "!"); } }
invalid:
  - |
    class A { void f(String password) { log.info("pw {}", password); } }
  - |
    class A { void f(User u) { logger.debug("pw " + u.getPassword()); } }
  - |
    class A { void f() { LOG.warn("key {}", this.apiKey); } }
  - |
    class A { void f(String accessToken, Exception e) { log.error("t=" + accessToken, e); } }
  - |
    class A { void f(String password) { log.info("password=" + password + "!"); } }
