id: swift-keychain-accessible-always
valid:
  - |
    let a = kSecAttrAccessibleWhenUnlocked
  - |
    let b = kSecAttrAccessibleAfterFirstUnlock
  - |
    let c = kSecAttrAccessibleWhenUnlockedThisDeviceOnly
invalid:
  - |
    let a = kSecAttrAccessibleAlways
  - |
    let b = kSecAttrAccessibleAlwaysThisDeviceOnly
  - |
    let q: [String: Any] = [kSecAttrAccessible as String: kSecAttrAccessibleAlways]
  - |
    query[kSecAttrAccessible as String] = kSecAttrAccessibleAlwaysThisDeviceOnly
