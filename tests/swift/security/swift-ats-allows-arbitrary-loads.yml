id: swift-ats-allows-arbitrary-loads
valid:
  - |
    let s = ["NSAllowsArbitraryLoads": false]
  - |
    let t = ["NSAllowsArbitraryLoads": false, "Other": true]
  - |
    let u = ["NSExceptionAllowsInsecureHTTPLoads": true]
invalid:
  - |
    let s = ["NSAllowsArbitraryLoads": true]
  - |
    let t = ["A": 1, "NSAllowsArbitraryLoads": true, "B": 2]
  - |
    let c = ["NSAllowsArbitraryLoads": true, "NSAllowsLocalNetworking": false]
  - |
    let ats: [String: Any] = [
        "NSAppTransportSecurity": ["NSAllowsArbitraryLoads": true]
    ]
