id: image-only-button-no-label-swift
valid:
  - >-
    Button { model.decrease() } label: { Image(systemName: "minus.circle.fill")
    }.accessibilityLabel("Decrease")
  - |-
    import SwiftUI

    struct CounterView: View {
      @State private var count = 0

      var body: some View {
        Button {
          count += 1
        } label: {
          Label("Increase", systemImage: "plus.circle.fill")
        }
      }
    }
  - |-
    import SwiftUI

    struct StepperRow: View {
      @State private var count = 0

      var body: some View {
        Button(action: { count += 1 }) { Image(systemName: "plus.circle.fill") }
          .accessibilityLabel("Increase")
          .padding()
      }
    }
invalid:
  - >-
    Button { model.decrease() } label: { Image(systemName: "minus.circle.fill")
    }
  - |-
    import SwiftUI

    struct ResetView: View {
      @State private var count = 0

      var body: some View {
        Button(action: { count = 0 }) {
          Image(systemName: "arrow.clockwise")
        }
      }
    }
  - |-
    import SwiftUI

    struct HintOnlyView: View {
      @State private var count = 0

      var body: some View {
        Button {
          count += 1
        } label: {
          Image(systemName: "plus.circle.fill")
        }
        .padding()
        .accessibilityHint("Adds one to the counter")
      }
    }
