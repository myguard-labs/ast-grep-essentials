id: ts-string-replace-literal-first-occurrence
valid:
  - 'const tmp = `contributors-${ ref.replaceAll( ''/'', ''-'' ) }.html`;'
  - 'const tmp = `contributors-${ ref.replaceAll( "/", "-" ) }.html`;'
  - 'const path = refs.replace( /\//g, ''-'' );'
invalid:
  - 'const tmp = `contributors-${ ref.replace( ''/'', ''-'' ) }.html`;'
  - 'const tmp = `contributors-${ ref.replace( "/", "-" ) }.html`;'
  - 'const path = refs.replace( ''/'', ''-'' );'
