id: ts-relative-dotdot-startswith
valid:
  - >-
    function inside(root, file) { const rel = relative(root, file); return
    isContainedRelativePath(rel) }
  - >-
    // function inside(root, file) { const rel = relative(root, file); return
    rel.startsWith('..') }
  - >-
    const astgrepFixture: string = "function inside(root, file) { const rel =
    relative(root, file); return rel.startsWith('..') }";
  - >-
    function within(base, target) { const path = resolve(base, target); return
    path.startsWith('..') }
invalid:
  - >-
    function inside(root, file) { const rel = relative(root, file); return
    rel.startsWith('..') }
  - >-
    function within(base, target) { const path = relative(base, target); return
    path.startsWith('..') }
