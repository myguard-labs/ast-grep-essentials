id: ts-log-credential-variable
valid:
  - |
    logger.info("user logged in")
  - |
    logger.info("pw length", password.length)
  - |
    logger.info("token", mask(token))
  - |
    console.log("count", tokenCount)
  - |
    other.info("pw", password)
  - |
    // logger.info("pw", password)
    const s = 'console.log(password)';
  - |
    logger.info("page", nextPageToken)
invalid:
  - |
    logger.info("pw", password)
  - |
    console.log(`login with ${user.password}`)
  - |
    log.error("bad key " + apiKey)
  - |
    this.logger.warn("t", accessToken)
  - |
    console.error("secret", config.clientSecret)
