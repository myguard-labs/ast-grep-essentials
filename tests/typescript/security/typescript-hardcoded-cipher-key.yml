id: typescript-hardcoded-cipher-key
valid:
  - |
    const c = crypto.createCipheriv('aes-256-gcm', key, iv);
  - |
    const c = crypto.createCipheriv('aes-256-gcm', Buffer.from(process.env.KEY, 'hex'), iv);
  - |
    const c = crypto.createCipheriv('aes-256-gcm', crypto.randomBytes(32), iv);
  - |
    const c = crypto.createCipheriv('aes-256-gcm', key, 'abcdefghijkl');
  - |
    const c = other.makeCipher('aes-256-gcm', '0123456789abcdef0123456789abcdef', iv);
invalid:
  - |
    const c = crypto.createCipheriv('aes-256-cbc', '01234567890123456789012345678901', iv);
  - |
    const d = createDecipheriv('aes-128-cbc', "0123456789abcdef", iv);
  - |
    const c = crypto.createCipheriv('aes-256-gcm', Buffer.from('0123456789abcdef0123456789abcdef'), iv);
