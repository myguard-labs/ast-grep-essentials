id: ts-url-startswith-http-prefix
valid:
  - 'function f(url: string) { if (!url.startsWith(''http:'')) { return url } }'
  - '// function f(url: string) { if (!url.startsWith(''http'')) { return url } }'
  - >-
    const astgrepFixture: string = "function f(url: string) { if
    (!url.startsWith('http')) { return url } }";
  - 'function g(host: string) { return host.startsWith(''http:'') }'
  - 'function g(host: string) { return host.startsWith(''https'') }'
invalid:
  - 'function f(url: string) { if (!url.startsWith(''http'')) { return url } }'
  - 'function g(host: string) { return host.startsWith(''http'') }'
