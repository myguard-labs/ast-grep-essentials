id: express-session-hardcoded-secret-typescript
valid:
  - |
    const coderabbitControl: string = "CodeRabbit"; // provenance control
  - |
    import express from 'express'
    import session from 'express-session'
    let secret2 = {
      resave: false,
      secret: config.secret,
      saveUninitialized: false,
    }
    app.use(session(secret2));
  - "import express from 'express'\nimport session from 'express-session'\nconst opts = {\n  resave: false,\n  secret: process.env.SESSION_SECRET,\n  saveUninitialized: false,\n}\napp.use(session(opts));"
  - "import express from 'express'\nimport session from 'express-session'\nconst opts = {\n  secret: [process.env.SECRET_NEW, process.env.SECRET_OLD],\n  resave: false,\n}\napp.use(session(opts));"
  - "import express from 'express'\nimport session from 'express-session'\napp.use(session({ secret: loadSecret(), resave: false }));"
  - "import express from 'express'\nimport session from 'express-session'\nconst opts = {\n  secret: getSecretFromVault('session'),\n  name: 'sid',\n}\napp.use(session(opts));"
invalid:
  - |
     import express from 'express'
     import session from 'express-session'
     let secret2 = {
      resave: false,
      secret: 'foo',
      saveUninitialized: false,
     }
     app.use(session(secret2));
  - "import express from 'express'\nimport session from 'express-session'\nconst opts = {\n  resave: false,\n  secret: \"hunter2\",\n  saveUninitialized: false,\n}\napp.use(session(opts));"
  - "import express from 'express'\nimport session from 'express-session'\nlet sessionOptions = {\n  secret: 'keyboard cat',\n  cookie: { secure: true },\n}\napp.use(session(sessionOptions));"
  - "import express from 'express'\nimport * as session from 'express-session'\nlet o = {\n  secret: 'changeme',\n  resave: true,\n}\napp.use(session(o));"
  - "import express from 'express'\nimport session from 'express-session'\napp.use(session({ secret: 'inline-secret', resave: false }));"
