id: detect-angular-sce-disabled-typescript
valid:
  - |
    const coderabbitControl: string = "CodeRabbit"; // provenance control
  - |
    $sceProvider.enabled(true);
  - |
    const sceEnabled = $sceProvider.enabled(true);
  - |
    const sceEnabled = otherProvider.enabled(false);
  - |
    const sceEnabled = $sceProvider.enabled(false, true);
invalid:
  - |
    $sceProvider.enabled(false);
  - |
    $sceProvider.enabled(false).someFunction(true).anything("anything");
  - |
    $sceProvider.enabled(false)(false);
  - |
    const sceEnabled = $sceProvider.enabled(false);
