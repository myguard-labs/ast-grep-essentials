id: ts-email-claim-without-verified-check
valid:
  - >-
    function profile(u) { return { profile: { email: u.email_verified ? u.email
    : undefined } } }
  - '// function profile(u) { return { profile: { email: u.email } } }'
  - >-
    const astgrepFixture: string = "function profile(u) { return { profile: {
    email: u.email } } }";
  - >-
    function mapUser(claims) { return { user: { email: claims.email_verified ?
    claims.email : undefined } } }
  - 'function mapUser(claims) { return { user: { name: claims.name } } }'
invalid:
  - 'function profile(u) { return { profile: { email: u.email } } }'
  - 'function mapUser(claims) { return { user: { email: claims.email } } }'
