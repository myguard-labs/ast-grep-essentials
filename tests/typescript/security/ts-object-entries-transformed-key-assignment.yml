id: ts-object-entries-transformed-key-assignment
valid:
  - |-
    const out: Record<string, unknown> = {};
    for (const [k, v] of Object.entries(input)) { out[k] = v; }
invalid:
  - |-
    const out: Record<string, unknown> = {};
    for (const [k, v] of Object.entries(input)) { out[redactKey(k)] = v; }
