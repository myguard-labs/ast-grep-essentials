id: ts-combined-boolean-expect-hides-failure
valid:
  - 'expect(res.exitCode, out).not.toBe(0);'
  - |-
    expect(res.ok).toBe(true);
    expect(body.length > 0).toBe(true);
  - |-
    expect(res.status).toBe(200);
  - |-
    expect(items.every((i) => i.ok && i.ready)).toBe(true);
invalid:
  - >-
    expect(res.exitCode !== 0 && out.includes("secret-boundary"),
    out).toBe(true);
  - |-
    expect(a > 0 && b > 0, out).toBe(true);
  - |-
    expect(a && b && c, 'all set').toBe(true);
  - |-
    await expect(page.isVisible() && ready, 'visible').toBe(true);
