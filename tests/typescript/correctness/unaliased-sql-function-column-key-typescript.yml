id: unaliased-sql-function-column-key-typescript
valid:
  - |-
    const r = await this.query("SELECT version() as version")
    const v = r[0]["version"]
  - 'const v = rows[0]["max_id"];'
  - 'const v = row[columnName];'
invalid:
  - |-
    const r = await this.query("SELECT version()")
    const v = r[0]["version()"]
  - 'const v = rows[0][''max(id)''];'
  - 'const v = r?.["now()"];'
