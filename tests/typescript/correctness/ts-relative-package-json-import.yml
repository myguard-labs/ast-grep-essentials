id: ts-relative-package-json-import
valid:
  - 'import ourPackageJson from "./package.json"'
  - 'import pkg from ''../package.json'''
  - 'import pkg from ''my-lib/package.json'''
  - 'import pkg from ''./nested/package.json'''
invalid:
  - 'import ourPackageJson from "../../package.json"'
  - 'import pkg from ''../../../package.json'''
  - 'import pkg from ''../../config/package.json'''
  - 'import pkg, { version } from ''../../package.json'''
