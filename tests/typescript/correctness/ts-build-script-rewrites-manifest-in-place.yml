id: ts-build-script-rewrites-manifest-in-place
valid:
  - |-
    const manifest = JSON.parse(fs.readFileSync(MANIFEST_PATH, 'utf8'))
    delete manifest.dependencies
    fs.writeFileSync(OUT_PATH, `${JSON.stringify(manifest, undefined, 2)}\n`)
  - |-
    const manifest = JSON.parse(fs.readFileSync(MANIFEST_PATH, 'utf8'))
    const out = path.join(DIST_DIR, 'package.json')
    fs.writeFileSync(out, JSON.stringify(manifest))
  - |-
    const manifest = JSON.parse(fs.readFileSync(MANIFEST_PATH, 'utf8'))
    console.log(manifest.name)
  - |-
    const manifest = JSON.parse(fs.readFileSync(MANIFEST_PATH, 'utf8'))
    fs.writeFileSync(DIST_MANIFEST_PATH, JSON.stringify(manifest), 'utf8')
invalid:
  - |-
    const manifest = JSON.parse(fs.readFileSync(MANIFEST_PATH, 'utf8'))
    delete manifest.dependencies
    fs.writeFileSync(MANIFEST_PATH, `${JSON.stringify(manifest, undefined, 2)}\n`)
  - |-
    const manifest = JSON.parse(fs.readFileSync(MANIFEST_PATH, 'utf8'))
    manifest.private = false
    fs.writeFileSync(MANIFEST_PATH, JSON.stringify(manifest))
  - |-
    function strip() {
      const m = JSON.parse(fs.readFileSync(MANIFEST_PATH, 'utf8'))
      delete m.scripts
      fs.writeFileSync(MANIFEST_PATH, JSON.stringify(m, null, 2) + '\n', 'utf8')
    }
  - |-
    const raw = fs.readFileSync(MANIFEST_PATH, 'utf8')
    fs.writeFileSync(MANIFEST_PATH, raw.replace('dev', 'prod'), { encoding: 'utf8' })
