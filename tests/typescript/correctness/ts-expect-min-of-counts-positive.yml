id: ts-expect-min-of-counts-positive
valid:
  - 'expect(sessions.length).toBeGreaterThan(0);'
  - "expect(a).toBeGreaterThan(0); expect(b).toBeGreaterThan(0);"
  - "expect(Math.min(a, b)).toBe(3);"
invalid:
  - 'expect(Math.min(sessions.length, growth)).toBeGreaterThan(0);'
  - "expect(Math.min(...counts)).toBeGreaterThan(0);"
  - "expect(Math.min(a, b, c)).toBeGreaterThan(0);"
  - "expect(Math.min(x.length, y!.length)).toBeGreaterThan(0);"
