id: ts-fetch-url-from-request-header
valid:
  - >-
    async function load(req: Request, url: string) { const base =
    'files.example.com'; return fetch(`https://${base}${url}`); }
invalid:
  - >-
    async function load(req: Request, url: string) { const base =
    req.headers.get('host'); return fetch(`https://${base}${url}`); }
