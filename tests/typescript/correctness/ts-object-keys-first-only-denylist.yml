id: ts-object-keys-first-only-denylist
valid:
  - >-
    const DENY = new Set(['plantuml_cmd']); if (Object.keys(ext).some(key =>
    DENY.has(key))) { return false; }
invalid:
  - >-
    const DENY = new Set(['plantuml_cmd']); const key = Object.keys(ext)[0]; if
    (DENY.has(key)) { return false; }
