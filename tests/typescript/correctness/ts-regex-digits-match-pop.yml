id: ts-regex-digits-match-pop
valid:
  - 'const id = Number(out.match(/\d+/g)?.[0]);'
  - 'const id = out.match(/\d+/)?.[0];'
  - 'const id = out.match(/(\d+)$/)?.[1];'
  - 'const n = out.match(/\d+/g)?.length;'
invalid:
  - 'const id = Number(out.match(/\d+/g)?.pop());'
  - 'const id = a.b.match(/\d+/g)?.pop();'
  - 'const last = String(x).match(/\d+/g)?.pop();'
  - 'const n = Number(out.match(/\d+/g)?.pop() ?? 0);'
