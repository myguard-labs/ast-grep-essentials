id: ts-exported-global-regexp-shared-state
valid:
  - 'const URL_PATTERN = new RegExp(SOURCE, ''gi'');'
  - "export const URL_PATTERN = new RegExp(SOURCE, 'i');"
  - "export const makeUrlRe = () => new RegExp(SOURCE, 'gi');"
  - "export function makeRe() { return new RegExp(SOURCE, 'g'); }"
invalid:
  - 'export const URL_PATTERN = new RegExp(SOURCE, ''gi'');'
  - "export const re = new RegExp(src, 'gim');"
  - "export const re = new RegExp(src, 'ig');"
