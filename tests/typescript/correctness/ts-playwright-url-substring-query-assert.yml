id: ts-playwright-url-substring-query-assert
valid:
  - >-
    expect( new URL( newPage.url() ).searchParams.get( 'preview' ) ).toBe(
    'true' );
  - 'expect( new URL( page.url() ).searchParams.get( ''id'' ) ).toBe( ''5'' );'
  - 'await expect( page ).toHaveURL( /preview=true/ );'
  - 'expect( page.url() ).toBe( ''https://example.test/?a=b'' );'
invalid:
  - 'expect( newPage.url() ).toContain( ''preview=true'' );'
  - 'expect( page.url() ).toContain( ''?id=5'' );'
  - 'expect( this.page.url() ).toContain( `token=${t}` );'
  - 'expect( frame.url() ).toContain( "x=1&y=2" );'
