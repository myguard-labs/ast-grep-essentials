id: ts-verified-flag-truthy-default
valid:
- const ok = email.verified || false;
- // const ok = email.verified || true;
- 'const astgrepFixture: string = "const ok = email.verified || true;";'
- 'const ok = email.verified ?? false;'
- 'const ok = email.verified === undefined ? true : email.verified;'
