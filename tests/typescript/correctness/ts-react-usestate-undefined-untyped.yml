id: ts-react-usestate-undefined-untyped
valid:
  - |-
    import { useState } from 'react';
    const [id, setId] = useState<string | undefined>(undefined);
  - 'const [id, setId] = useState<string>();'
  - 'const [id, setId] = useState(undefined as string | undefined);'
  - 'const [n, setN] = useState(0);'
invalid:
  - |-
    import { useState } from 'react';
    const [id, setId] = useState(undefined);
  - 'function C() { const [a, setA] = useState(undefined); return a; }'
  - 'export function useX() { return useState(undefined); }'
  - 'const state = useState(undefined);'
