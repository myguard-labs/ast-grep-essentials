id: ts-logger-fallback-captured-at-creation
valid:
  - |-
    static create(prefix: string, logger: Logger | null = null) {
      return { info: (...object: any[]) => (logger ?? this.globalLogger).log(LogLevel.Info, prefix, ...object) };
    }
  - "static create(logger: Logger | null = null) {\n  const get = () => logger ?? this.globalLogger;\n  return { info: (m: string) => get().log(m) };\n}"
  - "static create(logger: Logger | null = null) {\n  const target = logger ?? createDefault();\n  return { info: (m: string) => target.log(m) };\n}"
invalid:
  - |-
    static create(prefix: string, logger: Logger | null = null) {
      const target = logger ?? this.globalLogger;
      return { info: (...object: any[]) => target.log(LogLevel.Info, prefix, ...object) };
    }
  - "const t = opts.logger ?? this.fallback;"
  - "const t = logger?.child() ?? this.globalLogger;"
  - "function mk() {\n  const t = logger ?? this.globalLogger;\n  return t;\n}"
