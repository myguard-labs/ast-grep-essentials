id: ts-test-tobe-joined-argv-array
valid:
  - 'expect(run.realArgv).toEqual(args);'
  - 'expect(run.realArgv).toBe(args.length);'
  - 'expect(run.realArgv).toEqual(["--flag", "value"]);'
invalid:
  - 'expect(run.realArgs).toBe(args.join(" "));'
  - 'expect(out).toBe(a.b.join(","));'
  - 'expect(out).toBe((args as string[]).join(" "));'
