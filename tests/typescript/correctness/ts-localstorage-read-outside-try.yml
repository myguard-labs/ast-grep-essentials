id: ts-localstorage-read-outside-try
valid:
  - >-
    try { const cached = window.localStorage?.getItem('storeApiCartData'); }
    catch { return null; }
  - "function read() { try { return window.localStorage?.getItem('k'); } catch { return null; } }"
  - "try { if (a) { x = window.localStorage?.getItem('k'); } } catch {}"
  - "try { x = window.localStorage?.getItem('k'); } finally { done(); }"
invalid:
  - 'const cached = window.localStorage?.getItem(''storeApiCartData'');'
  - "const v = JSON.parse(window.localStorage?.getItem('k') ?? 'null');"
  - "function f() { return window.localStorage?.getItem(k); }"
  - "const v = window.localStorage?.getItem(k) as string | null;"
