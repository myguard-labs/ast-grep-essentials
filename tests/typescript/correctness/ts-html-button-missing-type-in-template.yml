id: ts-html-button-missing-type-in-template
valid:
  - 'const html = `<button type="button" aria-label="Download">x</button>`;'
  - "const h = `<input type=\"submit\" value=\"Go\">`;"
  - "const h = `<button-group><span>x</span></button-group>`;"
  - "const h = `<button\n  type=\"submit\">Go</button>`;"
invalid:
  - 'const html = `<button aria-label="Download">x</button>`;'
  - "const h = `<button class=\"btn\">${label}</button>`;"
  - "const h = `<button\n  class=\"btn\">x</button>`;"
  - "const h = html`<button disabled>x</button>`;"
