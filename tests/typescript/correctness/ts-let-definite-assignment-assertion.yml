id: ts-let-definite-assignment-assertion
valid:
  - 'let value: string | undefined'
  - "let value: string = \"x\";"
  - "let value = compute();"
invalid:
  - 'let value!: string'
  - "let cb!: () => void;"
  - "export let svc!: Service<Config>;"
  - "function f() { let n!: number; init(); return n; }"
