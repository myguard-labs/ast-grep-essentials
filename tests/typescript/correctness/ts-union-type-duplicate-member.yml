id: ts-union-type-duplicate-member
valid:
  - 'type CipherAlgorithm = AesCbcParams | AesGcmParams;'
  - 'type CipherAlgorithm = Foo<string> | Foo<number>;'
  - 'type Mode = "cbc" | "gcm";'
invalid:
  - 'type CipherAlgorithm = AesCbcParams | AesCbcParams;'
  - 'export type CipherAlgorithm = AesCbcParams | AesCbcParams;'
  - 'type Names = ns.Foo | ns.Foo;'
