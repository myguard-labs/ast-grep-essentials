id: ts-object-entries-transformed-key-assignment
valid:
  - |-
    const out: Record<string, unknown> = {};
    for (const [k, v] of Object.entries(input)) { out[k] = v; }
  - 'for (const [k, v] of Object.entries(input)) { out[k] = fn(v); }'
  - 'for (const [k, v] of Object.entries(input)) { out[`${prefix}${k}`] = v; }'
invalid:
  - |-
    const out: Record<string, unknown> = {};
    for (const [k, v] of Object.entries(input)) { out[redactKey(k)] = v; }
  - 'for (const [key, value] of Object.entries(obj ?? {})) { result[encodeURIComponent(key)] = value; }'
  - 'for (const [k, v] of Object.entries(a.b)) { this.out[slug(k)] = v; }'
  - 'for (const [k, v] of Object.entries(input as Record<string, string>)) { out[normalize(k)] = v; }'
