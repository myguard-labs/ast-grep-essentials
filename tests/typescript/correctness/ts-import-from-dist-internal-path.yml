id: ts-import-from-dist-internal-path
valid:
  - 'import { Table, Column } from ''@rmp135/sql-ts'';'
  - "import { x } from './dist-utils/a';"
  - "import type { T } from 'pkg';"
  - "import x from 'pkg/distribution/x';"
invalid:
  - 'import { Table, Column } from ''@rmp135/sql-ts/dist/Typings'';'
  - "import x from \"pkg/dist/index.js\";"
  - "import type { T } from 'pkg/dist/types';"
  - "import 'pkg/dist/side-effect';"
