id: ts-markdown-list-regex-missing-plus-marker
valid:
  - 'const re = /^(\s*(?:[-*+]\s|\d+[.)]\s))/;'
  - "const re = /^(\\s*(?:[-+*]\\s|\\d+[.)]\\s))/;"
  - "const re = new RegExp('^(\\\\s*(?:[-*+]\\\\s))');"
invalid:
  - 'const re = /^(\s*(?:[-*]\s|\d+[.)]\s))/;'
  - "const m = line.match(/^(\\s*(?:[-*]\\s|\\d+[.)]\\s))/);"
  - "if (/^(\\s*(?:[-*]\\s|\\d+[.)]\\s))/.test(line)) { x(); }"
  - "const re = /^(\\s*(?:[-*]\\s|\\d+[.)]\\s))/m;"
