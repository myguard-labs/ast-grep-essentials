    labels:
    - source: __ngettext("%d item", "%d item", $count)
      style: primary
      start: 11
      end: 51
  "<?php echo __ngettext($label, $label, $count);":
    labels:
    - source: __ngettext($label, $label, $count)
      style: primary
      start: 11
      end: 45
  "<?php echo __ngettext('%d item', '%d item', $count, 'my-domain');":
    labels:
    - source: __ngettext('%d item', '%d item', $count, 'my-domain')
      style: primary
      start: 11
      end: 64
  "<?php echo __ngettext('Done! <strong>%s</strong> tag added', 'Done! <strong>%s</strong> tag added', $count); ?>":
    labels:
    - source: >-
        __ngettext('Done! <strong>%s</strong> tag added', 'Done! <strong>%s</strong>
        tag added', $count)
      style: primary
      start: 11
      end: 107
