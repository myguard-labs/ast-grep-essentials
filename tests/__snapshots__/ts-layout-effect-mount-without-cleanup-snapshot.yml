id: ts-layout-effect-mount-without-cleanup
snapshots:
  ? |-
    useLayoutEffect(() => {
      if (openAlert) {
        logic.mount()
        logic.actions.openEditor(openAlert)
      }
    }, [openAlert])
  : labels:
    - source: |-
        useLayoutEffect(() => {
          if (openAlert) {
            logic.mount()
            logic.actions.openEditor(openAlert)
          }
        }, [openAlert])
      style: primary
      start: 0
      end: 120
