id: sh-recursive-chmod-world-writable
snapshots:
  chmod -R 777 "$dir":
    labels:
    - source: chmod -R 777 "$dir"
      style: primary
      start: 0
      end: 19
  chmod -R 777 "$dir" || true:
    labels:
    - source: chmod -R 777 "$dir"
      style: primary
      start: 0
      end: 19
  chmod -R 777 /var/www /srv:
    labels:
    - source: chmod -R 777 /var/www /srv
      style: primary
      start: 0
      end: 26
  find . -type d && chmod -R 777 .:
    labels:
    - source: chmod -R 777 .
      style: primary
      start: 18
      end: 32
