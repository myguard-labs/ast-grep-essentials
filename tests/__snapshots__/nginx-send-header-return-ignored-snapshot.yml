    static ngx_int_t
    branch(ngx_http_request_t *r, ngx_chain_t *out)
    {
        if (r->method == NGX_HTTP_GET) {
            ngx_http_send_header(r);
        }

        return ngx_http_output_filter(r, out);
    }
