id: ts-cross-env-node-options-overwrite
snapshots:
  const script = "cross-env NODE_OPTIONS=--max-old-space-size=4096 jest":
    labels:
    - source: "\"cross-env NODE_OPTIONS=--max-old-space-size=4096 jest\""
      style: primary
      start: 15
      end: 70
  const script = 'cross-env NODE_OPTIONS=--experimental-vm-modules jest':
    labels:
    - source: "'cross-env NODE_OPTIONS=--experimental-vm-modules jest'"
      style: primary
      start: 15
      end: 70
  "const scripts = { test: 'NODE_OPTIONS=--experimental-vm-modules jest' }":
    labels:
    - source: "'NODE_OPTIONS=--experimental-vm-modules jest'"
      style: primary
      start: 24
      end: 69
  "run(['NODE_OPTIONS=--require ./setup.js', 'node', 'app.js'])":
    labels:
    - source: "'NODE_OPTIONS=--require ./setup.js'"
      style: primary
      start: 5
      end: 40
