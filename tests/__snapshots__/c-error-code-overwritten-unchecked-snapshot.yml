id: c-error-code-overwritten-unchecked
snapshots:
  ? |-
    int a(void);
    int b(void);
    int f(void) { int rv; rv = a(); rv = b(); return rv; }
  : labels:
    - source: rv = a();
      style: primary
      start: 48
      end: 57
    - source: rv = a();
      style: secondary
      start: 48
      end: 57
    - source: rv = b();
      style: secondary
      start: 58
      end: 67
    - source: '{ int rv; rv = a(); rv = b(); return rv; }'
      style: secondary
      start: 38
      end: 80
