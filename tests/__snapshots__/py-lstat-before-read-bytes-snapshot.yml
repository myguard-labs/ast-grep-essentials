id: py-lstat-before-read-bytes
snapshots:
  ? |
    from pathlib import Path
    import stat

    def read_regular(path: Path) -> bytes:
        metadata = path.lstat()
        if not stat.S_ISREG(metadata.st_mode):
            raise ValueError("Expected a regular file")
        return path.read_bytes()
