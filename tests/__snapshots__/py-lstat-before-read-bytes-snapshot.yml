  "import logging\nfrom pathlib import Path\nimport stat\n\ndef load(self, path: Path, limit: int = 0) -> bytes:\n    meta = path.lstat()\n    if not stat.S_ISREG(meta.st_mode):\n        logging.warning(\"rejecting %s\", path)\n        raise ValueError(\"Expected a regular file\")\n    return path.read_bytes()":
