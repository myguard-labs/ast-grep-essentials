id: path-containment-hand-rolled-typescript
snapshots:
  ? |-
    import { join, relative } from 'path';
    export function within(base: string, p: string): boolean {
      const rel = relative(base, join(base, p));
      return !(rel === '..' || rel.startsWith('../'));
    }
