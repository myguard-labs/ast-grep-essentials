    - source: $f = "$dir/_lock"
      style: primary
      start: 6
      end: 23
    - source: "\"$dir/_lock\""
      style: secondary
      start: 11
      end: 23
  <?php $this->f = "$tmp/_FILE";:
    labels:
    - source: $this->f = "$tmp/_FILE"
      style: primary
      start: 6
      end: 29
    - source: "\"$tmp/_FILE\""
      style: secondary
      start: 17
      end: 29
