id: ts-logger-fallback-captured-at-creation
snapshots:
  ? |-
    static create(prefix: string, logger: Logger | null = null) {
      const target = logger ?? this.globalLogger;
      return { info: (...object: any[]) => target.log(LogLevel.Info, prefix, ...object) };
    }
  : labels:
    - source: const target = logger ?? this.globalLogger;
      style: primary
