id: ts-existssync-guard-creates-symlink
snapshots:
  ? |-
    import { existsSync, symlinkSync } from 'node:fs'
    export function link (target: string, dest: string) {
      if (!existsSync(dest)) symlinkSync(target, dest)
    }
  : labels:
    - source: if (!existsSync(dest)) symlinkSync(target, dest)
      style: primary
      start: 106
      end: 154
    - source: '!existsSync(dest)'
      style: secondary
      start: 110
      end: 127
    - source: '!existsSync(dest)'
      style: secondary
      start: 110
      end: 127
    - source: symlinkSync(target, dest)
      style: secondary
      start: 129
      end: 154
