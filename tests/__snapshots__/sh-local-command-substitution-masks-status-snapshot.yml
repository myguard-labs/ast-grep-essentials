id: sh-local-command-substitution-masks-status
snapshots:
  ? |-
    fetch_commit() {
      local commit=$(git ls-remote "$url" "$ref" | cut -f1)
    }
  : labels:
    - source: local commit=$(git ls-remote "$url" "$ref" | cut -f1)
      style: primary
      start: 19
      end: 72
    - source: $(git ls-remote "$url" "$ref" | cut -f1)
      style: secondary
      start: 32
      end: 72
    - source: commit=$(git ls-remote "$url" "$ref" | cut -f1)
      style: secondary
      start: 25
      end: 72
