id: sh-unguarded-grep-substitution
snapshots:
  count=$(grep -c "^ERR" "$log"):
    labels:
    - source: count=$(grep -c "^ERR" "$log")
      style: primary
      start: 0
      end: 30
    - source: $(grep -c "^ERR" "$log")
      style: secondary
      start: 6
      end: 30
  files=$(grep -rl pattern .github/):
    labels:
    - source: files=$(grep -rl pattern .github/)
      style: primary
      start: 0
      end: 34
    - source: $(grep -rl pattern .github/)
      style: secondary
      start: 6
      end: 34
  "hit=$(grep -m1 -E \"^v[0-9]+\" \"$f\")":
    labels:
    - source: hit=$(grep -m1 -E "^v[0-9]+" "$f")
      style: primary
      start: 0
      end: 34
    - source: $(grep -m1 -E "^v[0-9]+" "$f")
      style: secondary
      start: 4
      end: 34
  "set -e\nname=$(grep -m1 \"^Name:\" \"$f\")\necho \"$name\"":
    labels:
    - source: name=$(grep -m1 "^Name:" "$f")
      style: primary
      start: 7
      end: 37
    - source: $(grep -m1 "^Name:" "$f")
      style: secondary
      start: 12
      end: 37
