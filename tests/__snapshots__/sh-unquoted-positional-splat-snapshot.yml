id: sh-unquoted-positional-splat
snapshots:
  cp -- $* /var/backups/:
    labels:
    - source: $*
      style: primary
      start: 6
      end: 8
    - source: cp -- $* /var/backups/
      style: secondary
      start: 0
      end: 22
  exec $*:
    labels:
    - source: $*
      style: primary
      start: 5
      end: 7
    - source: exec $*
      style: secondary
      start: 0
      end: 7
  hugo $*:
    labels:
    - source: $*
      style: primary
      start: 5
      end: 7
    - source: hugo $*
      style: secondary
      start: 0
      end: 7
  printf "%s\n" $*:
    labels:
    - source: $*
      style: primary
      start: 14
      end: 16
    - source: printf "%s\n" $*
      style: secondary
      start: 0
      end: 16
