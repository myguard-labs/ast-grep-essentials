    class Test
      $pass = 'super secret'
      def initialize(key = nil, iv = nil)
      @pass1 = 'my secure pass phrase goes here'
      @keypem = 'foo.pem'
      OpenSSL::PKey::RSA.new(1024).to_pem(cipher, "secret")
