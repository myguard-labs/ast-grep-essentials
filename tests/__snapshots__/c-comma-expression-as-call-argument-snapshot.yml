id: c-comma-expression-as-call-argument
snapshots:
  ? |-
    int g(int, int);
    int f(int dest) { int fd; if ((fd = g((dest, 0777))) == -1) return 1; return fd; }
  : labels:
    - source: g((dest, 0777))
      style: primary
      start: 53
      end: 68
    - source: dest, 0777
      style: secondary
      start: 56
      end: 66
    - source: (dest, 0777)
      style: secondary
      start: 55
      end: 67
    - source: ((dest, 0777))
      style: secondary
      start: 54
      end: 68
