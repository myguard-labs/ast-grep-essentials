id: sh-predictable-temp-path
snapshots:
  TMP=/tmp/install.$$:
    labels:
    - source: TMP=/tmp/install.$$
      style: primary
      start: 0
      end: 19
    - source: /tmp/install.$$
      style: secondary
      start: 4
      end: 19
  TMPFILE="/var/tmp/build.log":
    labels:
    - source: TMPFILE="/var/tmp/build.log"
      style: primary
      start: 0
      end: 28
    - source: '"/var/tmp/build.log"'
      style: secondary
      start: 8
      end: 28
  cat /tmp/staged.json > /tmp/final.json:
    labels:
    - source: '> /tmp/final.json'
      style: primary
      start: 21
      end: 38
    - source: /tmp/final.json
      style: secondary
      start: 23
      end: 38
  echo "$data" > /tmp/app.conf:
    labels:
    - source: '> /tmp/app.conf'
      style: primary
      start: 13
      end: 28
    - source: /tmp/app.conf
      style: secondary
      start: 15
      end: 28
  f=$(mktemp -u):
    labels:
    - source: mktemp -u
      style: primary
      start: 4
      end: 13
    - source: mktemp
      style: secondary
      start: 4
      end: 10
    - source: -u
      style: secondary
      start: 11
      end: 13
  mktemp "-u":
    labels:
    - source: mktemp "-u"
      style: primary
      start: 0
      end: 11
    - source: mktemp
      style: secondary
      start: 0
      end: 6
    - source: '"-u"'
      style: secondary
      start: 7
      end: 11
  mktemp --dry-run:
    labels:
    - source: mktemp --dry-run
      style: primary
      start: 0
      end: 16
    - source: mktemp
      style: secondary
      start: 0
      end: 6
    - source: --dry-run
      style: secondary
      start: 7
      end: 16
  mktemp -du:
    labels:
    - source: mktemp -du
      style: primary
      start: 0
      end: 10
    - source: mktemp
      style: secondary
      start: 0
      end: 6
    - source: -du
      style: secondary
      start: 7
      end: 10
