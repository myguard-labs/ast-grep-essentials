id: ts-build-script-rewrites-manifest-in-place
snapshots:
  "const manifest = JSON.parse(fs.readFileSync(MANIFEST_PATH, 'utf8'))\ndelete manifest.dependencies\nfs.writeFileSync(MANIFEST_PATH, `${JSON.stringify(manifest, undefined, 2)}\\n`)":
    labels:
    - source: fs.writeFileSync(MANIFEST_PATH, `${JSON.stringify(manifest, undefined, 2)}\n`)
      style: primary
