      end: 175
  "const manifest = JSON.parse(fs.readFileSync(MANIFEST_PATH, 'utf8'))\nmanifest.private = false\nfs.writeFileSync(MANIFEST_PATH, JSON.stringify(manifest))":
    labels:
    - source: fs.writeFileSync(MANIFEST_PATH, JSON.stringify(manifest))
      style: primary
      start: 93
      end: 150
