id: c-utf8-prev-unbounded-decrement
snapshots:
  ? |-
    static const u_char *
    prev(const u_char *p, const u_char *start)
    {
        u_char c;
        do {
            p--;
            c = *p;
        } while ((c & 0xc0) == 0x80);
        return p;
    }
  : labels:
    - source: |-
        do {
                p--;
                c = *p;
            } while ((c & 0xc0) == 0x80);
      style: primary
      start: 85
      end: 152
    - source: p--
      style: secondary
      start: 98
      end: 101
    - source: '*p'
      style: secondary
      start: 115
      end: 117
