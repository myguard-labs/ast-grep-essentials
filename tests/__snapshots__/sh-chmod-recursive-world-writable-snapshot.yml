id: sh-chmod-recursive-world-writable
snapshots:
  chmod -R 1777 "$dir":
    labels:
    - source: chmod -R 1777 "$dir"
      style: primary
      start: 0
      end: 20
  chmod -R 1777 /tmp:
    labels:
    - source: chmod -R 1777 /tmp
      style: primary
      start: 0
      end: 18
  chmod -R 1777 /tmp || exit 1:
    labels:
    - source: chmod -R 1777 /tmp
      style: primary
      start: 0
      end: 18
  chmod -R 1777 /var/tmp /srv/share:
    labels:
    - source: chmod -R 1777 /var/tmp /srv/share
      style: primary
      start: 0
      end: 33
  if true; then chmod -R 1777 /tmp; fi:
    labels:
    - source: chmod -R 1777 /tmp
      style: primary
      start: 14
      end: 32
