id: wp-hardcoded-plugins-path
snapshots:
  $f = ABSPATH . 'wp-content/plugins/' . $plugin;:
    labels:
    - source: ABSPATH . 'wp-content/plugins/' . $plugin
      style: primary
      start: 5
      end: 46
  "$f = ABSPATH . 'wp-content/plugins/' . $row['slug'] . '/x.php';":
    labels:
    - source: ABSPATH . 'wp-content/plugins/' . $row['slug']
      style: primary
      start: 5
      end: 51
  $f = ABSPATH . 'wp-content/plugins/' . $this->slug;:
    labels:
    - source: ABSPATH . 'wp-content/plugins/' . $this->slug
      style: primary
      start: 5
      end: 50
  $ok = file_exists( ABSPATH . 'wp-content/plugins/' . $dir );:
    labels:
    - source: ABSPATH . 'wp-content/plugins/' . $dir
      style: primary
      start: 19
      end: 57
  include ABSPATH . 'wp-content/plugins/' . $slug . '/main.php';:
    labels:
    - source: ABSPATH . 'wp-content/plugins/' . $slug
      style: primary
      start: 8
      end: 47
