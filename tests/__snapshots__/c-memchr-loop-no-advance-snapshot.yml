id: c-memchr-loop-no-advance
snapshots:
  ? |-
    char *p = s;
    while ((p = memchr(p, '\\', end - p)) != NULL) {
        *p = '/';
    }
  : labels:
    - source: |-
        while ((p = memchr(p, '\\', end - p)) != NULL) {
            *p = '/';
        }
      style: primary
      start: 13
      end: 77
    - source: p = memchr(p, '\\', end - p)
      style: secondary
      start: 21
      end: 49
    - source: '*p = ''/'''
      style: secondary
      start: 66
      end: 74
