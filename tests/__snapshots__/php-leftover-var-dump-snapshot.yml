id: php-leftover-var-dump
snapshots:
  "<?php if ($debug) { var_dump($x); }":
    labels:
    - source: var_dump($x)
      style: primary
      start: 20
      end: 32
  "<?php var_dump($a, $b);":
    labels:
    - source: var_dump($a, $b)
      style: primary
      start: 6
      end: 22
  <?php var_dump(...$args);:
    labels:
    - source: var_dump(...$args)
      style: primary
      start: 6
      end: 24
  "function f( $x ) { var_dump( $x ); }":
    labels:
    - source: var_dump( $x )
      style: primary
      start: 19
      end: 33
