id: sh-openssl-md5-digest
snapshots:
  openssl dgst -md5 -binary file | base64:
    labels:
    - source: openssl dgst -md5 -binary file
      style: primary
      start: 0
      end: 30
  openssl dgst -md5 -hex "$file":
    labels:
    - source: openssl dgst -md5 -hex "$file"
      style: primary
      start: 0
      end: 30
  openssl dgst -md5 file.bin:
    labels:
    - source: openssl dgst -md5 file.bin
      style: primary
      start: 0
      end: 26
  openssl req -new -md5 -newkey 1024 -keyout key.pem -out req.pem -nodes:
    labels:
    - source: openssl req -new -md5 -newkey 1024 -keyout key.pem -out req.pem -nodes
      style: primary
      start: 0
      end: 70
  openssl x509 -fingerprint -md5 -noout -in cert.pem:
    labels:
    - source: openssl x509 -fingerprint -md5 -noout -in cert.pem
      style: primary
      start: 0
      end: 50
