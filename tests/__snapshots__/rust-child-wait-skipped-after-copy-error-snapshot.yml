id: rust-child-wait-skipped-after-copy-error
snapshots:
  ? |-
    let mut child = cmd.spawn()?;
    let mut stdin = child.stdin.take().unwrap();
    std::io::copy(&mut input, &mut stdin)?;
    let status = child.wait()?;
  : labels:
    - source: std::io::copy(&mut input, &mut stdin)?;
      style: primary
      start: 75
      end: 114
    - source: let mut stdin = child.stdin.take().unwrap();
      style: secondary
      start: 30
      end: 74
    - source: let status = child.wait()?;
      style: secondary
      start: 115
      end: 142
