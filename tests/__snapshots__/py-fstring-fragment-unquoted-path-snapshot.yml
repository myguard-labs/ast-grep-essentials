id: py-fstring-fragment-unquoted-path
snapshots:
  "link = f\"{base}#L{lineno}\"":
    labels:
    - source: "{lineno}"
      style: primary
      start: 17
      end: 25
    - source: lineno
      style: secondary
      start: 18
      end: 24
    - source: "#L"
      style: secondary
      start: 15
      end: 17
  "link = f\"{url}/blob/main/{rel}#L{path}\"":
    labels:
    - source: "{path}"
      style: primary
      start: 32
      end: 38
    - source: path
      style: secondary
      start: 33
      end: 37
    - source: "#L"
      style: secondary
      start: 30
      end: 32
  "link = f'{base}/#L{path}'\n":
    labels:
    - source: "{path}"
      style: primary
      start: 18
      end: 24
    - source: path
      style: secondary
      start: 19
      end: 23
    - source: /#L
      style: secondary
      start: 15
      end: 18
  "link = f'{base}/#L{path}-end'":
    labels:
    - source: "{path}"
      style: primary
      start: 18
      end: 24
    - source: path
      style: secondary
      start: 19
      end: 23
    - source: /#L
      style: secondary
      start: 15
      end: 18
