id: py-fstring-fragment-unquoted-path
snapshots:
  ? |
    link = f'{base}/#L{path}'
  : labels:
    - source: '{path}'
      style: primary
      start: 18
      end: 24
    - source: path
      style: secondary
      start: 19
      end: 23
    - source: /#L
      style: secondary
      start: 15
      end: 18
