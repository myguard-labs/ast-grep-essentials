id: sh-unquoted-array-element
snapshots:
  ports=($A):
    labels:
    - source: $A
      style: primary
      start: 7
      end: 9
    - source: ($A)
      style: secondary
      start: 6
      end: 10
  ports=(A:$A B:$B C:$C):
    labels:
    - source: A:$A
      style: primary
      start: 7
      end: 11
    - source: $A
      style: secondary
      start: 9
      end: 11
    - source: (A:$A B:$B C:$C)
      style: secondary
      start: 6
      end: 22
  ports=(a "$B"$C):
    labels:
    - source: '"$B"$C'
      style: primary
      start: 9
      end: 15
    - source: $C
      style: secondary
      start: 13
      end: 15
    - source: (a "$B"$C)
      style: secondary
      start: 6
      end: 16
  ports=(a "b" ${C}x):
    labels:
    - source: ${C}x
      style: primary
      start: 13
      end: 18
    - source: ${C}
      style: secondary
      start: 13
      end: 17
    - source: (a "b" ${C}x)
      style: secondary
      start: 6
      end: 19
  ports=(a ${B}):
    labels:
    - source: ${B}
      style: primary
      start: 9
      end: 13
    - source: (a ${B})
      style: secondary
      start: 6
      end: 14
