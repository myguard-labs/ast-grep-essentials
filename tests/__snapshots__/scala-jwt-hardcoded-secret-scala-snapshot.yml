    class SessionService {
      def createSessionToken(userId: String): String = {
          try {
              val algorithm = Algorithm.HMAC512("secretKey")
              val token = JWT.create()
                  .withIssuer("auth0")
                  .withClaim("userId", userId)
                  .sign(algorithm)
              token
          } catch {
