id: sh-arithmetic-context-injection
snapshots:
  '"let" "n=$1"':
    labels:
    - source: '"let" "n=$1"'
      style: primary
      start: 0
      end: 12
    - source: '"let"'
      style: secondary
      start: 0
      end: 5
    - source: '"n=$1"'
      style: secondary
      start: 6
      end: 12
  expr $1 + 1:
    labels:
    - source: expr $1 + 1
      style: primary
      start: 0
      end: 11
    - source: expr
      style: secondary
      start: 0
      end: 4
    - source: $1
      style: secondary
      start: 5
      end: 7
  let "n=$1":
    labels:
    - source: let "n=$1"
      style: primary
      start: 0
      end: 10
    - source: let
      style: secondary
      start: 0
      end: 3
    - source: '"n=$1"'
      style: secondary
      start: 4
      end: 10
  n=$(( $1 + 1 )):
    labels:
    - source: $(( $1 + 1 ))
      style: primary
      start: 2
      end: 15
  n=$(( ${2} * 4 )):
    labels:
    - source: $(( ${2} * 4 ))
      style: primary
      start: 2
      end: 17
  total=$(( $@ )):
    labels:
    - source: $(( $@ ))
      style: primary
      start: 6
      end: 15
