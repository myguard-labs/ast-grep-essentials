id: py-hardcoded-tempfile
snapshots:
  open("/tmp/session.pid", "w"):
    labels:
    - source: '"/tmp/session.pid"'
      style: primary
      start: 5
      end: 23
  p = "/tmp/build.lock":
    labels:
    - source: '"/tmp/build.lock"'
      style: primary
      start: 4
      end: 21
  p = '/var/tmp/cache.db':
    labels:
    - source: '''/var/tmp/cache.db'''
      style: primary
      start: 4
      end: 23
  p = f"/tmp/{name}.json":
    labels:
    - source: f"/tmp/{name}.json"
      style: primary
      start: 4
      end: 23
