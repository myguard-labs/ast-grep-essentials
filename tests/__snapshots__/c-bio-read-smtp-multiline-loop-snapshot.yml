id: c-bio-read-smtp-multiline-loop
snapshots:
  ? |-
    int n;
    do {
        n = BIO_read(sbio, buf, 1024);
    } while (n > 3 && buf[3] == '-');
  : labels:
    - source: |-
        do {
            n = BIO_read(sbio, buf, 1024);
        } while (n > 3 && buf[3] == '-');
      style: primary
      start: 7
      end: 80
    - source: n = BIO_read(sbio, buf, 1024);
      style: secondary
      start: 16
      end: 46
    - source: buf[3] == '-'
      style: secondary
      start: 65
      end: 78
