id: py-regex-fence-label-case-sensitive
snapshots:
  ? |-
    import re
    re.search(r'^```(?:yaml|yml)', text)
  : labels:
    - source: re.search(r'^```(?:yaml|yml)', text)
      style: primary
      start: 10
      end: 46
    - source: re.search
      style: secondary
      start: 10
      end: 19
    - source: r'^```(?:yaml|yml)'
      style: secondary
      start: 20
      end: 39
    - source: r'^```(?:yaml|yml)'
      style: secondary
      start: 20
      end: 39
