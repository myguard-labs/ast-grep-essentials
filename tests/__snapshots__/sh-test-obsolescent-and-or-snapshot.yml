id: sh-test-obsolescent-and-or
snapshots:
  "if [ \"$a\" = 1 -o \"$b\" = 2 ]; then echo hit; fi":
    labels:
    - source: "[ \"$a\" = 1 -o \"$b\" = 2 ]"
      style: primary
      start: 3
      end: 27
  "if [ -f \"$f\" -a -r \"$f\" ]; then cat \"$f\"; fi":
    labels:
    - source: "[ -f \"$f\" -a -r \"$f\" ]"
      style: primary
      start: 3
      end: 25
  "if [ -z \"$A\" -o -z \"$B\" ]; then :; fi":
    labels:
    - source: "[ -z \"$A\" -o -z \"$B\" ]"
      style: primary
      start: 3
      end: 25
  "while [ ! -d \"$d\" -a -n \"$x\" ]; do sleep 1; done":
    labels:
    - source: "[ ! -d \"$d\" -a -n \"$x\" ]"
      style: primary
      start: 6
      end: 30
