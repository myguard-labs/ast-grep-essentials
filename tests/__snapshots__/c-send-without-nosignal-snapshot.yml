    nonblocking(int fd, const char *buf, size_t len)
    {
        return (int) send(fd, buf, len, MSG_DONTWAIT);
    }
  : labels:
    - source: send(fd, buf, len, MSG_DONTWAIT)
      style: primary
      start: 79
      end: 111
  ? |
    static int
    scattered(int fd, const struct msghdr *msg)
    {
        return (int) sendmsg(fd, msg, 0);
    }
  : labels:
    - source: sendmsg(fd, msg, 0)
      style: primary
      start: 74
      end: 93
  ? |
    static int
    write_all(int fd, const char *buf, size_t len)
    {
        size_t off = 0;

        while (off < len) {
            ssize_t n = send(fd, buf + off, len - off, 0);

            if (n <= 0) {
                return -1;
            }
            off += (size_t) n;
        }

        return 0;
    }
  : labels:
    - source: send(fd, buf + off, len - off, 0)
      style: primary
      start: 125
      end: 158
