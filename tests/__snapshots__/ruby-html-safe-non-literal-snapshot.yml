id: ruby-html-safe-non-literal
snapshots:
  ? |
    out = "<b>#{name}</b>".html_safe
  : labels:
    - source: '"<b>#{name}</b>".html_safe'
      style: primary
      start: 6
      end: 32
  ? |
    out = params[:bio].html_safe
  : labels:
    - source: params[:bio].html_safe
      style: primary
      start: 6
      end: 28
  ? |
    out = raw(@comment.body)
  : labels:
    - source: raw(@comment.body)
      style: primary
      start: 6
      end: 24
