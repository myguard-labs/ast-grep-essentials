id: js-tsdown-renamed-option-typescript
snapshots:
  ? |-
    import { defineConfig } from 'tsdown'
    export default defineConfig({ inlineOnly: ['@types/hast'] })
  : labels:
    - source: 'inlineOnly: [''@types/hast'']'
      style: primary
      start: 68
      end: 95
    - source: defineConfig
      style: secondary
      start: 53
      end: 65
    - source: 'defineConfig({ inlineOnly: [''@types/hast''] })'
      style: secondary
      start: 53
      end: 98
    - source: '({ inlineOnly: [''@types/hast''] })'
      style: secondary
      start: 65
      end: 98
    - source: '{ inlineOnly: [''@types/hast''] }'
      style: secondary
      start: 66
      end: 97
    - source: inlineOnly
      style: secondary
      start: 68
      end: 78
