id: nginx-cpp-line-comment
snapshots:
  '#define BARE_URL http://nginx.org/':
    labels:
    - source: http://nginx.org
      style: primary
      start: 17
      end: 33
  '#define BLOCKED /* block */ 1 // trailing comment':
    labels:
    - source: 1 // trailing comment
      style: primary
      start: 28
      end: 49
