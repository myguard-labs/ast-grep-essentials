      style: primary
      start: 27
      end: 68
  ? |-
    #define MULTILINE_BODY(a) do { (a); } \
        while (0) // trailing comment
  : labels:
    - source: |-
        do { (a); } \
            while (0) // trailing comment
      style: primary
      start: 26
      end: 73
  '#define SUM(a, b) ((a) + (b)) // trailing comment':
    labels:
    - source: ((a) + (b)) // trailing comment
      style: primary
      start: 18
      end: 49
  '#define TIGHT_VALUE 1// trailing comment':
    labels:
    - source: 1// trailing comment
