id: sh-url-as-command-name
snapshots:
  "http://example.com/libs":
    labels:
    - source: http://example.com/libs
      style: primary
      start: 0
      end: 23
    - source: http://example.com/libs
      style: secondary
      start: 0
      end: 23
  "https://example.com/pkg.tar.gz --output /tmp/pkg.tar.gz":
    labels:
    - source: https://example.com/pkg.tar.gz --output /tmp/pkg.tar.gz
      style: primary
      start: 0
      end: 55
    - source: https://example.com/pkg.tar.gz
      style: secondary
      start: 0
      end: 30
  "https://example.com/setup.sh | sh":
    labels:
    - source: https://example.com/setup.sh
      style: primary
      start: 0
      end: 28
    - source: https://example.com/setup.sh
      style: secondary
      start: 0
      end: 28
  "if ! http://example.com/health; then exit 1; fi":
    labels:
    - source: http://example.com/health
      style: primary
      start: 5
      end: 30
    - source: http://example.com/health
      style: secondary
      start: 5
      end: 30
