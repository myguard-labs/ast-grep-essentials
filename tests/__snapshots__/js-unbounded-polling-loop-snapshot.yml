id: js-unbounded-polling-loop
snapshots:
  ? |-
    async pollResult($, id) {
      while (true) {
        const result = await this.getResult($, id);
        if (result.status === "completed") return result.outputs;
        await new Promise((r) => setTimeout(r, 3000));
      }
    }
