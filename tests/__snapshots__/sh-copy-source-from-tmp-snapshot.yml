id: sh-copy-source-from-tmp
snapshots:
  cp -a /tmp/internal/configs/njs/* /etc/nginx/njs/:
    labels:
    - source: cp -a /tmp/internal/configs/njs/* /etc/nginx/njs/
      style: primary
      start: 0
      end: 49
    - source: cp
      style: secondary
      start: 0
      end: 2
    - source: /tmp/internal/configs/njs/*
      style: secondary
      start: 6
      end: 33
  cp -r /tmp/dir/ /etc/app/:
    labels:
    - source: cp -r /tmp/dir/ /etc/app/
      style: primary
      start: 0
      end: 25
    - source: cp
      style: secondary
      start: 0
      end: 2
    - source: /tmp/dir/
      style: secondary
      start: 6
      end: 15
  cp /etc/app.conf /tmp/x /srv/:
    labels:
    - source: cp /etc/app.conf /tmp/x /srv/
      style: primary
      start: 0
      end: 29
    - source: cp
      style: secondary
      start: 0
      end: 2
    - source: /tmp/x
      style: secondary
      start: 17
      end: 23
  cp /tmp/build.tar.gz /opt/app/:
    labels:
    - source: cp /tmp/build.tar.gz /opt/app/
      style: primary
      start: 0
      end: 30
    - source: cp
      style: secondary
      start: 0
      end: 2
    - source: /tmp/build.tar.gz
      style: secondary
      start: 3
      end: 20
  mv /tmp/upload.bin /srv/data/:
    labels:
    - source: mv /tmp/upload.bin /srv/data/
      style: primary
      start: 0
      end: 29
    - source: mv
      style: secondary
      start: 0
      end: 2
    - source: /tmp/upload.bin
      style: secondary
      start: 3
      end: 18
