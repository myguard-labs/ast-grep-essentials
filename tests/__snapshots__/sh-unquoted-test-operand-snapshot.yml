id: sh-unquoted-test-operand
snapshots:
  "if [ \"$a\" = $b ]; then :; fi":
    labels:
    - source: $b
      style: primary
      start: 12
      end: 14
    - source: "[ \"$a\" = $b ]"
      style: secondary
      start: 3
      end: 16
    - source: "\"$a\" = $b"
      style: secondary
      start: 5
      end: 14
  "if [ $FLAG = yes ]; then :; fi":
    labels:
    - source: $FLAG
      style: primary
      start: 5
      end: 10
    - source: "[ $FLAG = yes ]"
      style: secondary
      start: 3
      end: 18
    - source: $FLAG = yes
      style: secondary
      start: 5
      end: 16
  "if [ $a != \"\" ]; then :; fi":
    labels:
    - source: $a
      style: primary
      start: 5
      end: 7
    - source: "[ $a != \"\" ]"
      style: secondary
      start: 3
      end: 15
    - source: $a != ""
      style: secondary
      start: 5
      end: 13
  "while [ $n -lt 10 ]; do n=$((n+1)); done":
    labels:
    - source: $n
      style: primary
      start: 8
      end: 10
    - source: "[ $n -lt 10 ]"
      style: secondary
      start: 6
      end: 19
    - source: $n -lt 10
      style: secondary
      start: 8
      end: 17
