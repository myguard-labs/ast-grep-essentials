id: c-openssl-version-check-without-libressl
snapshots:
  "#if OPENSSL_VERSION_NUMBER < 0x30000000L\nvoid f(void) { }\n#else\nvoid g(void) { }\n#endif":
    labels:
    - source: |-
        #if OPENSSL_VERSION_NUMBER < 0x30000000L
        void f(void) { }
        #else
        void g(void) { }
        #endif
      style: primary
      start: 0
      end: 87
    - source: OPENSSL_VERSION_NUMBER < 0x30000000L
      style: secondary
      start: 4
      end: 40
  "#if OPENSSL_VERSION_NUMBER >= 0x1000205fL\nvoid f(void) { }\n#endif":
    labels:
    - source: |-
        #if OPENSSL_VERSION_NUMBER >= 0x1000205fL
        void f(void) { }
        #endif
      style: primary
      start: 0
      end: 65
    - source: OPENSSL_VERSION_NUMBER >= 0x1000205fL
      style: secondary
      start: 4
      end: 41
  "#if defined(OPENSSL_VERSION_NUMBER) && OPENSSL_VERSION_NUMBER < 0x10100000L\nvoid f(void) { }\n#endif":
    labels:
    - source: |-
        #if defined(OPENSSL_VERSION_NUMBER) && OPENSSL_VERSION_NUMBER < 0x10100000L
        void f(void) { }
        #endif
      style: primary
      start: 0
      end: 99
    - source: defined(OPENSSL_VERSION_NUMBER) && OPENSSL_VERSION_NUMBER < 0x10100000L
      style: secondary
      start: 4
      end: 75
  "#ifdef USE_SSL\n#if OPENSSL_VERSION_NUMBER >= 0x1010100fL\nvoid f(void) { }\n#endif\n#endif":
    labels:
    - source: |-
        #if OPENSSL_VERSION_NUMBER >= 0x1010100fL
        void f(void) { }
        #endif
      style: primary
      start: 15
      end: 80
    - source: OPENSSL_VERSION_NUMBER >= 0x1010100fL
      style: secondary
      start: 19
      end: 56
