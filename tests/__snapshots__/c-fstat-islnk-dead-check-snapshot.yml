        int scan(int fd, int n) {
            struct stat sb;
            int i, links = 0;
            for (i = 0; i < n; i++) {
                if (fstat(fd + i, &sb) == 0) {
                    if (S_ISLNK(sb.st_mode))
                        links++;
                }
            }
            return links;
        }
