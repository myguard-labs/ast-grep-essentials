id: readdir-lstat-unguarded-typescript
snapshots:
  ? |-
    import fs from 'fs'
    for (const entry of fs.readdirSync(dir)) {
      fs.lstatSync(path.join(dir, entry))
    }
  : labels:
    - source: fs.lstatSync(path.join(dir, entry))
      style: primary
      start: 65
      end: 100
    - source: |-
        for (const entry of fs.readdirSync(dir)) {
          fs.lstatSync(path.join(dir, entry))
        }
      style: secondary
      start: 20
      end: 102
