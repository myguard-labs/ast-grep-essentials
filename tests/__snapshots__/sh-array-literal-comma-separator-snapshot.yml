id: sh-array-literal-comma-separator
snapshots:
  "ARR=(\"a\" , \"b\")":
    labels:
    - source: ("a" , "b")
      style: primary
      start: 4
      end: 15
  "DISTS=(\"bookworm\",\"trixie\")":
    labels:
    - source: ("bookworm","trixie")
      style: primary
      start: 6
      end: 27
  "PKGS=(\n  \"curl\",\n  \"git\"\n)":
    labels:
    - source: |-
        (
          "curl",
          "git"
        )
      style: primary
      start: 5
      end: 26
  "PKGS=(\"curl\", \"git\")":
    labels:
    - source: ("curl", "git")
      style: primary
      start: 5
      end: 20
  "SUSE_VERSIONS=(\"15\", \"16\")":
    labels:
    - source: ("15", "16")
      style: primary
      start: 14
      end: 26
