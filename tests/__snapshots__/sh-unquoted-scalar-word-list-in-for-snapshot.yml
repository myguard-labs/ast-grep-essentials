id: sh-unquoted-scalar-word-list-in-for
snapshots:
  "dir=\"/var/lib/my dir\"\nfor f in $dir; do\n  printf '%s\\n' \"$f\"\ndone":
    labels:
    - source: |-
        for f in $dir; do
          printf '%s\n' "$f"
        done
      style: primary
      start: 22
      end: 65
