    - source: |-
        for arg in $@; do
          printf '%s\n' "$arg"
        done
      style: primary
      start: 0
      end: 45
    - source: $@
      style: secondary
      start: 11
      end: 13
  "for f in $*; do\n  printf '%s\\n' \"$f\"\ndone":
