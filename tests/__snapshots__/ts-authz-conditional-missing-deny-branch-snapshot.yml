id: ts-authz-conditional-missing-deny-branch
snapshots:
  ? |
    export const getFilters = async (svc: any, creds: any) => {
      const [d] = await svc.authorizeConditional([{ permission }], { credentials: creds });
      if (d.result === AuthorizeResult.CONDITIONAL) {
        return transform(d.conditions);
      }
      return undefined;
    };
