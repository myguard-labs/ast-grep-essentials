id: sh-ls-glob-output-parsed
snapshots:
  mapfile -t p < <(ls -1 "$d"/*.patch | sort):
    labels:
    - source: ls -1 "$d"/*.patch
      style: primary
      start: 17
      end: 35
    - source: <(ls -1 "$d"/*.patch | sort)
      style: secondary
      start: 15
      end: 43
    - source: "\"$d\"/*.patch"
      style: secondary
      start: 23
      end: 35
  mapfile -t p < <(ls -d /var/log/*/):
    labels:
    - source: ls -d /var/log/*/
      style: primary
      start: 17
      end: 34
    - source: <(ls -d /var/log/*/)
      style: secondary
      start: 15
      end: 35
    - source: /var/log/*/
      style: secondary
      start: 23
      end: 34
  mapfile -t patches < <(ls "$PATCHES_DIR"/*.patch):
    labels:
    - source: ls "$PATCHES_DIR"/*.patch
      style: primary
      start: 23
      end: 48
    - source: <(ls "$PATCHES_DIR"/*.patch)
      style: secondary
      start: 21
      end: 49
    - source: "\"$PATCHES_DIR\"/*.patch"
      style: secondary
      start: 26
      end: 48
  while read -r f; do echo "$f"; done < <(ls -1 /var/log/*.log):
    labels:
    - source: ls -1 /var/log/*.log
      style: primary
      start: 40
      end: 60
    - source: <(ls -1 /var/log/*.log)
      style: secondary
      start: 38
      end: 61
    - source: /var/log/*.log
      style: secondary
      start: 46
      end: 60
