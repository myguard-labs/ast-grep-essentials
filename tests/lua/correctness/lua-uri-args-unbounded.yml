id: lua-uri-args-unbounded
valid:
  - 'local args, err = ngx.req.get_uri_args(64)'
  - 'local args = ngx.req.get_uri_args()'
  - 'local h = ngx.req.get_headers(100)'
  - 'local h = ngx.req.get_headers(limit)'
  - 'local args = req.get_uri_args(0)'
  - 'local text = "ngx.req.get_uri_args(0)"'
  - '-- ngx.req.get_uri_args(0)'
invalid:
  - 'local args = ngx.req.get_uri_args(0)'
  - 'local args = ngx.req.get_post_args(0)'
  - 'local h = ngx.req.get_headers(0)'
