id: lua-http-client-verify-disabled
valid:
  - 'local res = httpc:request_uri(url, { ssl_verify = true })'
  - 'local res = httpc:request_uri(url, { ssl_verify = verify })'
  - 'local opts = { verify = false }'
  - 'local ok = sock:sslhandshake(nil, host, true)'
  - 'local ok = sock:connect(host, 443)'
  - 'local text = "ssl_verify = false"'
  - '-- ssl_verify = false'
invalid:
  - 'local res = httpc:request_uri(url, { ssl_verify = false })'
  - 'local ok = sock:sslhandshake(nil, host, false)'
