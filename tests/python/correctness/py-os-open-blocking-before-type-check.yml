id: py-os-open-blocking-before-type-check
valid:
  - |
    import os
    import stat

    def check(path):
        fd = os.open(path, os.O_RDONLY | os.O_NONBLOCK)
        try:
            if not stat.S_ISREG(os.fstat(fd).st_mode):
                raise ValueError('not a regular file')
        finally:
            os.close(fd)
  - |
    import os
    import stat

    def check(path):
        flags = (
            os.O_RDONLY
            | getattr(os, "O_CLOEXEC", 0)
            | getattr(os, "O_NONBLOCK", 0)
        )
        try:
            fd = os.open(path, flags)
        except OSError:
            return None
        try:
            if not stat.S_ISREG(os.fstat(fd).st_mode):
                os.close(fd)
                return None
        finally:
            os.close(fd)
  - |
    import os
    import stat

    def check(path):
        flags = os.O_RDONLY
        flags |= os.O_NONBLOCK
        fd = os.open(path, flags)
        st = os.fstat(fd)
        return stat.S_ISFIFO(st.st_mode)
