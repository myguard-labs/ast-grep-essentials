id: py-mutable-default-arg
valid:
- 'def f(items=None): pass'
- 'def f(n=0, s="", t=()): pass'
- 'def f(items): pass'
- 'def f(x=CONST): pass'
- 'def f(x=frozenset()): pass'
- '# def f(items=[]): pass'
invalid:
- 'def f(items=[]): pass'
- 'def f(opts={}): pass'
- 'def f(seen=set()): pass'
- 'def f(a, b=1, c=[]): pass'
- 'def f(x=list()): pass'
