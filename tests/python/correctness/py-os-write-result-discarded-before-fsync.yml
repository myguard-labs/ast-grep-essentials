id: py-os-write-result-discarded-before-fsync
valid:
  - |-
    import os
    def write_marker(fd, generation):
        data = generation.encode("ascii")
        n = os.write(fd, data)
        os.fsync(fd)
        return n
  - |-
    import os
    def write_marker(fd, data):
        view = memoryview(data)
        while view:
            n = os.write(fd, view)
            view = view[n:]
        os.fsync(fd)
