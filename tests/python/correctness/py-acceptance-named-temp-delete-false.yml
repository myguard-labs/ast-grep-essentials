id: py-acceptance-named-temp-delete-false
valid:
  - |
    import tempfile
    handle = tempfile.NamedTemporaryFile(delete=True)
  - |
    import tempfile
    handle = tempfile.NamedTemporaryFile()
  - |
    handle = other.NamedTemporaryFile(delete=False)
  - |
    from other import NamedTemporaryFile
    handle = NamedTemporaryFile(delete=False)
  - |
    from tempfile import NamedTemporaryFile
    handle = NamedTemporaryFile(delete=True)
invalid:
  - |
    import tempfile
    handle = tempfile.NamedTemporaryFile(delete=False)
  - |
    import tempfile
    handle = tempfile.NamedTemporaryFile(mode="w", delete = False)
  - |
    from tempfile import NamedTemporaryFile
    handle = NamedTemporaryFile(delete=False)
