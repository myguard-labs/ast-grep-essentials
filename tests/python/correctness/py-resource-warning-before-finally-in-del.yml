    class Writer:
        def __init__(self, stream):
            self.stream = stream

        def __del__(self):
            if getattr(self, "stream", None) is not None:
                warnings.warn(
                    "unclosed Writer; use close() or a context manager",
                    ResourceWarning,
                    stacklevel=2,
                )
                try:
                    self.close()
                except OSError:
                    pass
