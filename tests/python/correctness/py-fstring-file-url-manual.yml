id: py-fstring-file-url-manual
valid:
  - |-
    def f(p):
        return f"https://{p}"
  - |-
    def f(p):
        return Path(p).resolve().as_uri()
  - |-
    def f(p):
        return f"file-{p}.txt"
  - |-
    def f(host):
        return f"ftp://{host}"
invalid:
  - |-
    def f(p):
        return f"file://{p}"
  - |-
    def f(p):
        return f"file://{os.path.abspath(p)}"
  - |-
    def f(path):
        return f"file://{path.resolve()}"
