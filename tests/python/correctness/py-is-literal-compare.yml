id: py-is-literal-compare
valid:
- x is None
- x is not None
- x is True
- status == "ok"
- n != 0
- ok = process.returncode == 0
- ok = process.returncode != 0
- x - (b is None) - y == 0
- ok = process.returncode is None
- x is other
- x in (1, 2)
- '# status is "ok"'
- text = 'status is "ok"'
invalid:
- status is "ok"
- n is not 0
- ratio is 1.5
- q is []
- t is (1, 2)
- s is {1, 2}
- d is {}
- name is "a" "b"
- ok = process.returncode is 0
