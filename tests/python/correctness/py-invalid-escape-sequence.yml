id: py-invalid-escape-sequence
valid:
  - 'LINE = r''.append\(x)'''
  - |-
    LINE = R'.append\(x)'
  - |-
    LINE = '\\d+ and \n'
  - |-
    LINE = rb'\d+'
invalid:
  - 'LINE = ''.append\(x)'''
  - |-
    pat = re.compile("\d+")
  - |-
    path = "C:\path\to"
  - |-
    pat = f"\d{n}"
  - |-
    pat = b'\d+'
