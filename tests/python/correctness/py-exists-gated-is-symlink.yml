id: py-exists-gated-is-symlink
valid:
  - |
    from pathlib import Path

    def reject_symlink(path: Path) -> None:
        if path.is_symlink():
            raise ValueError("Symlinks are not allowed")
  - |-
    def reject(path):
        if path.is_symlink() or path.exists():
            raise ValueError("bad path")
  - |-
    def check(a, b):
        return a.exists() and b.is_symlink()
  - |-
    def check(path):
        return path.exists() and path.is_file()
invalid:
  - |
    from pathlib import Path

    def reject_symlink(path: Path) -> None:
        if path.exists() and path.is_symlink():
            raise ValueError("Symlinks are not allowed")
  - |-
    def check(self):
        return self.path.exists() and self.path.is_symlink()
  - |-
    def check(root, name):
        if (root / name).exists() and (root / name).is_symlink():
            raise ValueError(name)
  - |-
    def check(paths):
        return [p for p in paths if p.exists() and p.is_symlink()]
