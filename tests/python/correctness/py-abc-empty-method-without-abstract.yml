id: py-abc-empty-method-without-abstract
valid:
  - |-
    from abc import ABC, abstractmethod
    class Base(ABC):
        @abstractmethod
        def run(self):
            pass
  - |
    from abc import ABC
    class Base(ABC):
        def run(self):
            raise NotImplementedError
  - |
    class Plain:
        def run(self):
            pass
  - |
    import abc
    class Base(abc.ABC):
        @abc.abstractmethod
        def run(self):
            pass
invalid:
  - |-
    from abc import ABC
    class Base(ABC):
        def run(self):
            pass
  - |
    import abc
    class Base(abc.ABC):
        def run(self):
            pass
  - |
    from abc import ABC
    class Base(ABC, Mixin):
        def run(self):
            pass
  - |
    from abc import ABC
    class Base(ABC):
        async def run(self):
            pass
