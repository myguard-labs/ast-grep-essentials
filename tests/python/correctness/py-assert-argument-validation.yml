id: py-assert-argument-validation
valid:
  - |-
    def chunk(size):
        if size <= 0:
            raise ValueError
        return size
  - |-
    def first(entry):
        data = entry.data
        assert data is not None
        return data[0]
  - |-
    def empty(value):
        assert value is None
        return True
  - |-
    def test_output():
        assert result == {}
  - |-
    def test_nested():
        assert result == {}
        def helper():
            return 1
invalid:
  - |-
    def check(value):
        assert value > 0
  - |-
    def tester(value):
        assert value > 0
  - |-
    def test_outer():
        def check(value):
            assert value > 0
  - |-
    def chunk(size):
        assert size > 0
        return size
