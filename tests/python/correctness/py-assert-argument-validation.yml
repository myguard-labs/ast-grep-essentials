id: py-assert-argument-validation
valid:
  - |-
    def chunk(size):
        if size <= 0:
            raise ValueError
        return size
  - |-
    def first(entry):
        data = entry.data
        assert data is not None
        return data[0]
  - |-
    def empty(value):
        assert value is None
        return True
invalid:
  - |-
    def chunk(size):
        assert size > 0
        return size
