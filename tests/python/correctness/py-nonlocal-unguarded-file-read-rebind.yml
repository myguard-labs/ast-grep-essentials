id: py-nonlocal-unguarded-file-read-rebind
valid:
  - |-
    from pathlib import Path
    def outer():
        saved = None
        def record():
            nonlocal saved
            if saved is None:
                saved = Path('pkg.json').read_bytes()
        record()
  - |-
    from pathlib import Path
    def outer():
        saved = None
        def record():
            nonlocal saved
            if not saved:
                saved = Path("pkg.json").read_bytes()
        record()
  - |-
    from pathlib import Path
    def outer():
        count = 0
        def record():
            nonlocal count
            payload = Path("pkg.json").read_bytes()
            count += len(payload)
        record()
  - |-
    from pathlib import Path
    def outer(cached):
        saved = None
        def record():
            nonlocal saved
            saved = cached
        record()
