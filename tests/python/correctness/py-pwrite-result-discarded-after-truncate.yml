id: py-pwrite-result-discarded-after-truncate
valid:
  - |
    import os

    def replace_token(fd, token):
        os.ftruncate(fd, 0)
        offset = 0
        while offset < len(token):
            written = os.pwrite(fd, token[offset:], offset)
            if written <= 0:
                raise OSError('positional write made no progress')
            offset += written
  - |-
    import os
    def replace(fd, data):
        os.ftruncate(fd, 0)
        written = os.pwrite(fd, data, 0)
        return written
  - |-
    import os
    def replace(fd, data):
        os.ftruncate(fd, 0)
        if os.pwrite(fd, data, 0) != len(data):
            raise OSError("short write")
  - |-
    import os
    def replace(fd, data):
        total = 0
        os.ftruncate(fd, 0)
        total += os.pwrite(fd, data, 0)
        return total
