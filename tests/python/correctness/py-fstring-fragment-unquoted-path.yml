id: py-fstring-fragment-unquoted-path
valid:
  - |
    link = f'{base}/#L{quote(path, safe="/")}'
  - |-
    link = f'{base}#L{int(line)}'
  - |-
    link = f'{base}#section-{name}'
  - |-
    link = f"{base}#L{quote(str(path))}"
invalid:
  - |
    link = f'{base}/#L{path}'
  - |-
    link = f"{base}#L{lineno}"
  - |-
    link = f"{url}/blob/main/{rel}#L{path}"
  - |-
    link = f'{base}/#L{path}-end'
