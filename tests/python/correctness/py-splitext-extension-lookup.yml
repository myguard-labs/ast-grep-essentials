id: py-splitext-extension-lookup
valid:
  - |-
    import os

    def lookup(name, ext_map):
        return os.path.splitext(name)[1].lower()
  - |-
    import os

    def lookup(name, ext_map):
        return ext_map.get(os.path.basename(name).lower())
  - |-
    import os

    def lookup(name, ext_map):
        base = os.path.basename(name)
        return ext_map.get(base.lower()) or ext_map.get(os.path.splitext(base)[1].lower(), None)
  - |-
    from pathlib import PurePath

    def lookup(name, ext_map):
        return ext_map.get(''.join(PurePath(name).suffixes).lower())
