id: py-fstring-without-placeholders
valid:
  - |-
    def log_retry(n):
        print(f"retrying the request {n}")
  - |-
    label = "retrying the request"
  - |-
    label = f"{n!r:>10} items"
  - |-
    pattern = rf"^{prefix}\d+$"
invalid:
  - |-
    def log_retry():
        print(f"retrying the request")
  - |-
    label = f'retrying the request'
  - |-
    label = F"retrying the request"
  - |-
    pattern = rf"^\d+$"
  - |-
    label = f"""retrying
    the request"""
