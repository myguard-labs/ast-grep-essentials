id: py-requests-no-timeout
valid:
- requests.get(url, timeout=10)
- requests.post(url, json=payload, timeout=(3, 30))
- httpx.get(url)
- requests.Session()
- session.get(url)
- requests.utils.quote(s)
- '# requests.get(url)'
- text = 'requests.get(url)'
invalid:
- requests.get(url)
- requests.post(url, json=payload)
- requests.request("GET", url)
- requests.head(url, allow_redirects=False)
