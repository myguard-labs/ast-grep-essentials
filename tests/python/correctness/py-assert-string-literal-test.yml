id: py-assert-string-literal-test
valid:
  - 'assert result is not None, ''Expected not to be null!'''
  - |-
    assert isinstance(x, str), "bad type"
  - |-
    assert 'key' in data, 'missing key'
invalid:
  - 'assert ''Expected not to be null!'', result is not None'
  - |-
    assert "Expected not to be null!", result is not None
  - |-
    assert 'x', f'bad {y}'
