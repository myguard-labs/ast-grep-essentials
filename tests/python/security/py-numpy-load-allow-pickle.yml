id: py-numpy-load-allow-pickle
valid:
- np.load(f)
- np.load(f, allow_pickle=False)
- numpy.load(f, mmap_mode="r")
- np.save(f, arr)
- other.load(f, allow_pickle=True)
- '# np.load(f, allow_pickle=True)'
- text = 'np.load(f, allow_pickle=True)'
invalid:
- np.load(f, allow_pickle=True)
- numpy.load(f, allow_pickle=True)
- np.load(f, mmap_mode="r", allow_pickle=True)
