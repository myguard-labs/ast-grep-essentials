id: py-stdlib-xml-parse
valid:
  - 'defusedxml.ElementTree.fromstring(data)'
  - 'defusedxml.sax.parse(fh, handler)'
  - 'json.loads(data)'
  - 'ET.tostring(root)'
  - 'minidom.Document()'
  - '# ET.fromstring(data)'
  - 'text = ''ET.fromstring(data)'''
  - |
    import xml.etree.ElementTree as ET

    text = (ET).tostring(root)
invalid:
  - 'xml.sax.parse(fh, handler)'
  - 'xml.sax.parseString(data, handler)'
  - 'xml.sax.make_parser()'
  - 'minidom.parseString(data)'
  - 'xml.dom.minidom.parse(fh)'
  - 'ET.fromstring(data)'
  - 'xml.etree.ElementTree.parse(fh)'
  - 'pulldom.parse(fh)'
  - |
    import xml.etree.ElementTree as ET

    root = (ET).fromstring(data)
