id: py-yaml-load-unsafe
valid:
- yaml.safe_load(data)
- yaml.load(data, Loader=yaml.SafeLoader)
- '# yaml.load(data)'
- text = 'yaml.load(data)'
- yaml.load(data, Loader=yaml.CSafeLoader)
- yaml.load(data, Loader=SafeLoader)
- yaml.load(data, Loader=(yaml.SafeLoader))
- yaml . load(data, Loader=yaml . SafeLoader)
- notyaml.load(data)
- yaml.load(s, Loader=yaml.BaseLoader)
- yaml.load(s, Loader=BaseLoader)
- yaml.load(s, Loader=yaml.CBaseLoader)
- yaml.load(s, Loader=CBaseLoader)
invalid:
- yaml.load(data)
- yaml.load(data, Loader=yaml.UnsafeLoader)
- yaml.load(data, Loader=yaml.Loader)
- yaml.load(data, Loader=custom_loader)
- yaml.load(parse(data, Loader=yaml.SafeLoader))
- yaml . load(data, Loader=yaml . Loader)
- yaml.load(s, Loader=yaml.FullLoader)
- yaml.load(s, Loader=yaml.UnsafeLoader)
- yaml.load(s, Loader=yaml.Loader)
- yaml.load(s, Loader=yaml.BaseLoaderX)
- yaml.load(s, Loader=BaseLoaderX)
