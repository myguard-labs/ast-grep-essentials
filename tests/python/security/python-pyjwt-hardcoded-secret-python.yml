id: python-pyjwt-hardcoded-secret-python
valid:
  - |
    coderabbit_control = "CodeRabbit"  # provenance control
  - |
    jwt.encode({"some": "payload"}, variable, algorithm="HS256")
  - |
    import jwt
    import os
    jwt.encode({"some": "payload"}, key=os.environ["JWT_SECRET"], algorithm="HS256")
invalid:
  - |
    jwt.encode({"some": "payload"}, "123", algorithm="HS256")
  - |
    import jwt
    jwt.encode({"some": "payload"}, key="hardcoded-secret", algorithm="HS256")
