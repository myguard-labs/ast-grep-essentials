id: py-log-request-data-unescaped
valid:
  - |
    logger.info("user %s", request.args.get("user").replace("\n", " "))
  - |
    logging.warning("name %r", repr(request.form["name"]))
  - |
    logger.info("count %d", int(request.args["n"]))
  - |
    logger.info("login ok for %s", username)
  - |
    other.info("user %s", request.args.get("user"))
  - |
    # logger.info("user %s", request.args.get("user"))
    note = 'logger.info("x", request.form["x"])'
  - |
    logger.info("path %s", request.path)
  - |
    import re
    logger.info("user %s", re.sub(r"[\r\n]", "", request.args.get("user")))
  - |
    logger.info("user %s", re.sub(r"\s", "", request.args["x"]))
  - |
    import re
    logger.info("user %s", re.sub(r"[\r\n]", "", request.args.get("user"), count=0))
invalid:
  - |
    logger.info("user %s", request.args.get("user"))
  - |
    logging.warning("name: " + request.form["name"])
  - |
    app.logger.error(f"bad agent {request.headers['User-Agent']}")
  - |
    log.debug("body %s", request.POST["q"])
  - |
    logger.info("%s %d", request.args.get("user"), int("1"))
  - |
    logger.info("user %s", html.escape(request.args["x"]))
  - |
    logger.info("user %s", markupsafe.escape(request.args["x"]))
  - |
    logger.info("user %s", request.args.get("user").replace("<", "&lt;"))
  - |
    logger.info("user %s", re.sub(r"[<>]", "", request.args["x"]))
  - |
    logger.info("user %s", request.args.get("user").replace("\\n", ""))
  - |
    import re
    logger.info("user %s", re.sub(r"[\r\n]", "", request.args.get("user"), count=1))
  - |
    import re
    logger.info("user %s", re.sub(r"[\r\n]", "", request.args.get("user"), 1))
