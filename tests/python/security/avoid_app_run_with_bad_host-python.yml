id: avoid_app_run_with_bad_host-python
valid:
  - |
    coderabbit_control = "CodeRabbit"  # provenance control
  - |
    foo.run("0.0.0.0")
  - |
    app.run(host="0x0x0x0")
  - |
    foo.run(host='0.0.0.0')
invalid:
  - |
    app.run(host="0.0.0.0")
    app.run("0.0.0.0")
  - |
    app.run(host='0.0.0.0')
  - |
    app.run('0.0.0.0')
