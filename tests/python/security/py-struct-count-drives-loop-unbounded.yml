    import struct
    def parse(buf):
        n = struct.unpack('<I', buf[:4])[0]
        if not 0 <= n <= 1000:
            raise ValueError('bad count')
        for i in range(n):
            yield buf[4 + 4 * i:8 + 4 * i]
