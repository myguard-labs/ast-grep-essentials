id: py-tempdir-assigned-without-cleanup-guard
valid:
- |-
  def __enter__(self):
      self.temp_dir = tempfile.TemporaryDirectory()
      try:
          self.setup()
      except Exception:
          self.temp_dir.cleanup()
          raise
      return self.files
