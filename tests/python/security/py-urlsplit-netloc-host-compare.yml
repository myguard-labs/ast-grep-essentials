id: py-urlsplit-netloc-host-compare
valid:
  - |-
    from urllib.parse import urlsplit
    if urlsplit(entered).hostname == urlsplit(site_url).hostname:
        reject()
invalid:
  - |-
    from urllib.parse import urlsplit
    if urlsplit(entered).netloc == urlsplit(site_url).netloc:
        reject()
