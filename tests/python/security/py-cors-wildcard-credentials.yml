id: py-cors-wildcard-credentials
valid:
- CORS(app, origins=["https://app.example"], supports_credentials=True)
- CORS(app, origins="*")
- app.add_middleware(CORSMiddleware, allow_origins=["*"])
- app.add_middleware(CORSMiddleware, allow_origins=["https://a"], allow_credentials=True)
- 'CORS(app, resources={r"/api/*": {"origins": "https://a"}}, supports_credentials=True)'
- '# CORS(app, supports_credentials=True)'
- text = 'CORS(app, supports_credentials=True)'
invalid:
- 'CORS(app, resources={r"/api/*": {"origins": "*"}}, supports_credentials=True)'
- CORS(app, supports_credentials=True)
- CORS(app, origins="*", supports_credentials=True)
- app.add_middleware(CORSMiddleware, allow_origins=["*"], allow_credentials=True)
