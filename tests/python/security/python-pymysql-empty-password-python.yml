id: python-pymysql-empty-password-python
valid:
  - |
    coderabbit_control = "CodeRabbit"  # provenance control
  - |
    pymysql.connect(password=CONFIG)
  - |
    pymysql.connect(password=os.env['secret'])
  - |
    secret = "configured-password"
    pymysql.connect(host="localhost", password=f"{secret}")
invalid:
  - |
    pymysql.connect(password="")
  - |
    pymysql.connect(host="localhost", password="")
