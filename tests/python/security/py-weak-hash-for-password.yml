id: py-weak-hash-for-password
valid:
- hashlib.md5(file_bytes).hexdigest()
- hashlib.sha256(payload).hexdigest()
- hashlib.pbkdf2_hmac("sha256", pw, salt, 600000)
- bcrypt.hashpw(password, bcrypt.gensalt())
- hashes.SHA256()
- argon2.PasswordHasher().hash(password)
- '# hashlib.md5(password)'
- text = 'hashlib.md5(password)'
invalid:
- hashlib.md5(password.encode()).hexdigest()
- hashlib.sha1(passwd).hexdigest()
- hashlib.sha256(pwd.encode()).hexdigest()
- hashlib.sha512(user_secret).digest()
- key.sign(data, padding.PSS(mgf=mgf, salt_length=20), hashes.SHA1())
- hashes.MD5()
