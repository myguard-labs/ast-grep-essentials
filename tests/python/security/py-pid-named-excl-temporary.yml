    import os

    class AtomicWriteError(Exception):
        pass

    def w(p, b):
        t = f"{p}.{os.getpid()}.tmp"
        try:
            fd = os.open(t, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
        except OSError as error:
            raise AtomicWriteError("cannot create temporary") from error
        os.write(fd, b)
