id: py-set-cookie-samesite-none-or-missing
valid:
  - |
    resp.set_cookie("session", sid, samesite="Lax")
  - |
    resp.set_cookie("sessionid", sid, samesite="Strict", secure=True)
  - |
    resp.set_cookie("theme", "dark")
  - |
    resp.set_cookie("session", sid, **opts)
  - |
    resp.set_cookie("session", sid, samesite=SAMESITE)
  - |
    # resp.set_cookie("session", sid, samesite="None")
    s = 'resp.set_cookie("session", sid)'
  - |
    resp.delete_cookie("session")
invalid:
  - |
    resp.set_cookie("session", sid, samesite="None", secure=True)
  - |
    resp.set_cookie("theme", "dark", samesite=None)
  - |
    response.set_cookie("auth_token", tok, httponly=True)
  - |
    resp.set_cookie('csrftoken', t, samesite='none')
  - |
    resp.set_cookie("sid", value=sid, secure=True, httponly=True)
