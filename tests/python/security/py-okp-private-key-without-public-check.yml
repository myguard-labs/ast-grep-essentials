id: py-okp-private-key-without-public-check
valid:
- |-
  def load(jwk):
      d = base64url_decode(jwk['d'])
      key = Ed25519PrivateKey.from_private_bytes(d)
      if key.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw) != base64url_decode(jwk['x']):
          raise InvalidKeyError('mismatch')
      return key
