id: py-urllib-opener-default-proxy
valid:
- 'opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))'
- 'opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), RedirectHandler())'
- 'opener = urllib.request.build_opener(RedirectHandler(), ProxyHandler({}))'
- 'opener = build_opener(ProxyHandler({}))'
- 'opener = request.build_opener(request.ProxyHandler({"https": PROXY_URL}))'
- 'opener = build_opener(HTTPSHandler(context=ctx), ProxyHandler(proxies))'
- 'opener = build_opener(*handlers)'
- 'opener = build_opener(RedirectHandler(), *handlers)'
- 'opener = self.build_opener(RedirectHandler())'
- 'opener = factory.build_opener()'
- 'opener = urllib.request.install_opener(opener)'
- '# opener = urllib.request.build_opener(RedirectHandler())'
- 'note = "urllib.request.build_opener(RedirectHandler())"'
invalid:
- 'opener = urllib.request.build_opener()'
- 'opener = urllib.request.build_opener(RedirectHandler())'
- 'opener = urllib.request.build_opener(HTTPSHandler(context=ctx), RedirectHandler())'
- 'opener = request.build_opener(RedirectHandler())'
- 'opener = build_opener()'
- 'opener = build_opener(HTTPCookieProcessor(jar))'
- 'opener = urllib.request.build_opener(proxy_handler)'
