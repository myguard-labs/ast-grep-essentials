id: py-subprocess-env-whole-environ
valid:
- 'subprocess.run(cmd, check=True)'
- 'subprocess.run(cmd, env={"PATH": "/usr/bin", "LANG": "C"})'
- 'subprocess.run(cmd, env=worker_environment(job))'
- 'subprocess.Popen(cmd, env=scrubbed_env())'
- 'subprocess.run(cmd, env={k: v for k, v in os.environ.items() if k in ALLOWED})'
- 'subprocess.check_output(cmd, env={k: os.environ[k] for k in ("PATH", "HOME")})'
- 'subprocess.run(cmd, env={"PATH": os.environ["PATH"]})'
- 'subprocess.run(cmd, env=os.environ.get("CHILD_ENV"))'
- 'subprocess.run(cmd, env=minimal_env)'
- 'run(cmd, env=os.environ)'
- 'self.run(cmd, env=os.environ)'
- 'launcher.Popen(cmd, env=os.environ)'
- 'log(subprocess.run(cmd), env=os.environ)'
- 'env = os.environ.copy()'
- '# subprocess.run(cmd, env=os.environ)'
- 'note = "subprocess.run(cmd, env=os.environ)"'
invalid:
- 'subprocess.run(cmd, env=os.environ)'
- 'subprocess.run(cmd, env=dict(os.environ))'
- 'subprocess.run(cmd, env=os.environ.copy())'
- 'subprocess.run(cmd, env={**os.environ, "X": "1"})'
- 'subprocess.Popen(cmd, env=os.environ)'
- 'subprocess.check_output(cmd, env=os.environ.copy())'
- 'subprocess.check_call(cmd, env={**os.environ})'
- 'subprocess.call(cmd, shell=False, env=dict(os.environ, X="1"))'
- 'Popen(cmd, stdout=PIPE, env=os.environ)'
- 'check_output(cmd, env=dict(environ))'
- 'subprocess.run(cmd, env=environ.copy())'
- 'proc = subprocess.Popen(cmd, env={"X": "1", **os.environ})'
- 'subprocess.run(cmd, env=environ)'
