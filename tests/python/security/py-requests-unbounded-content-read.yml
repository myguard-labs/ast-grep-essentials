id: py-requests-unbounded-content-read
valid:
  - |-
    import requests


    def fetch(url):
        return requests.get(url, timeout=5).status_code
  - |-
    import requests


    def fetch(url, cap):
        resp = requests.get(url, timeout=5, stream=True)
        return resp.raw.read(cap + 1)
