id: py-log-credential-variable
valid:
  - |
    logger.info("user logged in")
  - |
    logger.info("pw length %d", len(password))
  - |
    logger.info("token %s", mask(token))
  - |
    logger.info("count %d", token_count)
  - |
    other_thing.info("pw %s", password)
  - |
    # logger.info("pw %s", password)
    note = 'logger.info(password)'
  - |
    logger.info("page token %s", next_page_token)
invalid:
  - |
    logger.info("pw %s", password)
  - |
    log.debug(f"login with {user.password}")
  - |
    logging.error("bad key " + api_key)
  - |
    self.log.warning("t=%s" % access_token)
  - |
    logger.info("secret", self.client_secret)
