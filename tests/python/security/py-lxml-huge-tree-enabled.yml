id: py-lxml-huge-tree-enabled
valid:
  - 'etree.XMLParser(resolve_entities=False)'
  - 'etree.XMLParser(huge_tree=False)'
  - 'etree.XMLParser(huge_tree=allow_huge)'
  - '# etree.XMLParser(huge_tree=True)'
  - 'note = "etree.XMLParser(huge_tree=True)"'
invalid:
  - 'etree.XMLParser(huge_tree=True)'
  - 'etree.iterparse(source, huge_tree=True, events=("end",))'
  - 'parser = lxml.html.HTMLParser(remove_blank_text=True, huge_tree=True)'
