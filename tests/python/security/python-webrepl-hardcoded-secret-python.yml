id: python-webrepl-hardcoded-secret-python
valid:
  - |
    coderabbit_control = "CodeRabbit"  # provenance control
  - |
    webrepl.start(password=os.getenv('PASSWORD'))
  - |
    import os
    import webrepl
    webrepl.start(password="micro" + os.getenv("PASSWORD"))
  - |
    import webrepl
    webrepl.start(password="micro" f"{password_suffix}")
invalid:
  - |
    webrepl.start(password="mypassword")
  - |
    webrepl.start(password="12345")
  - |
    import webrepl
    webrepl.start(password="micro" "python")
