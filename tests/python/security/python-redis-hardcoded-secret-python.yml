id: python-redis-hardcoded-secret-python
valid:
  - |
    coderabbit_control = "CodeRabbit"  # provenance control
  - |
    redis_client = redis.Redis(
      host='localhost',
      port=6379,
      password=os.getenv('REDIS_PASSWORD', 'password'),
      db=5
