id: openai-hardcoded-secret-python
valid:
  - |
    coderabbit_control = "CodeRabbit"  # provenance control
  - |
    openai.api_key = os.environ["OPENAI_API_KEY"]
# YAML decodes the hexadecimal escape before ast-grep sees this source. Keeping
# the escape in git prevents a key-shaped test value from triggering push
# protection while still exercising the imported legacy-key matcher.
invalid:
  - "api_key=\"sk-\x321ch9iZ8P3RAGDgEKnXNT3BlbkFJUyQm6H38r46YdSeuSrjj\""
