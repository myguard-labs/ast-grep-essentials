id: py-forwarded-for-header-trusted-ungated
valid:
- |-
  def client_ip(request, settings):
      if settings.trust_proxy:
          fwd = request.headers.get('X-Forwarded-For')
          if fwd:
              return fwd.split(',')[0].strip()
      return request.client.host
