id: py-hardcoded-tempfile
valid:
- '# p = "/tmp/build.lock"'
- f = tempfile.NamedTemporaryFile()
- d = tempfile.mkdtemp()
- p = os.path.join(d, "out.log")
- p = "/var/log/app.log"
- p = "/tmpfiles/data"
- p = "relative/tmp/x"
invalid:
- p = "/tmp/build.lock"
- open("/tmp/session.pid", "w")
- p = '/var/tmp/cache.db'
- p = f"/tmp/{name}.json"
