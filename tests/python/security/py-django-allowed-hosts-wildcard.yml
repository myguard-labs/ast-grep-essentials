id: py-django-allowed-hosts-wildcard
valid:
  - 'ALLOWED_HOSTS = ["app.example.com"]'
  - 'ALLOWED_HOSTS = env.list("ALLOWED_HOSTS")'
  - 'ALLOWED_HOSTS = []'
  - 'ALLOWED_HOSTS = [".example.com", "localhost"]'
  - 'CORS_ORIGINS = ["*"]'
  - '# ALLOWED_HOSTS = ["*"]'
  - 'text = ''ALLOWED_HOSTS = ["*"]'''
  - 'ALLOWED_HOSTS = ["""*.example.com"""]'
  - 'CORS_ORIGINS = ["""*"""]'
invalid:
  - 'ALLOWED_HOSTS = ["*"]'
  - 'ALLOWED_HOSTS = ("*",)'
  - 'ALLOWED_HOSTS = ["app.example.com", "*"]'
  - 'ALLOWED_HOSTS = ["""*"""]'
  - 'ALLOWED_HOSTS = (''''''*'''''',)'
