id: insecure-binaryformatter-deserialization-csharp
valid:
  - |
    class CodeRabbitControl { string Text = "CodeRabbit"; }
  - |
    namespace Application
    {
        class BinaryFormatter { }
        class Example
        {
            public object CreateFormatter()
            {
                return new Application.BinaryFormatter();
            }
        }
    }
invalid:
  - |
    using System.Runtime.Serialization.Formatters.Binary;
    namespace InsecureDeserialization
    {
     public class InsecureBinaryFormatterDeserialization
     {
        public void BinaryFormatterDeserialization(string json)
        {
            try
            {
                BinaryFormatter binaryFormatter = new BinaryFormatter();

                MemoryStream memoryStream = new MemoryStream(Encoding.UTF8.GetBytes(json));
                binaryFormatter.Deserialize(memoryStream);
                memoryStream.Close();
            }
            catch (Exception e)
            {
                Console.WriteLine(e);
            }
        }
    }
    }
  - |
    class Example
    {
        public object CreateFormatter()
        {
            return new System.Runtime.Serialization.Formatters.Binary.BinaryFormatter();
        }
    }
