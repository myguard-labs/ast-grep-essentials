id: httponly-false-csharp
valid:
  - |
    class CodeRabbitControl { string Text = "CodeRabbit"; }
  - |
    myHttpOnlyCookie.HttpOnly = true;
  - |
    options.Cookie.HttpOnly = true;
  - |
    class Example {
        void Configure() {
            var options = new Microsoft.AspNetCore.Http.CookieOptions { HttpOnly = true };
        }
    }
  - |
    class Example {
        void Configure() {
            isReady = false;
            options.Cookie.SecurePolicy = false;
        }
    }
invalid:
  - |
    options.Cookie.HttpOnly = false;
  - |
    class Example {
        void Configure() {
            var options = new Microsoft.AspNetCore.Http.CookieOptions { HttpOnly = false };
        }
    }
  - |
    class Example {
        void Configure() {
            isReady = false;
            options.Cookie.HttpOnly = false;
        }
    }
