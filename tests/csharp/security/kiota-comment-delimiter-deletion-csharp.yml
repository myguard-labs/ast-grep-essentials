id: kiota-comment-delimiter-deletion-csharp
valid:
  - 'string text = description.Replace("*/", "* /");'
  - '// string text = description.Replace("*/", string.Empty);'
  - >-
    class AstgrepFixture { string value = "string text =
    description.Replace(\"*/\", string.Empty);"; }
  - 'string text = description.Replace("*/", "x");'
  - 'string text = description.Replace("**/", "");'
invalid:
  - 'string text = description.Replace("*/", string.Empty);'
  - 'string text = description.Replace("*/", "");'
