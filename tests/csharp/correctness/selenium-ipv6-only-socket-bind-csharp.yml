id: selenium-ipv6-only-socket-bind-csharp
valid:
  - >-
    using var socket = new Socket(AddressFamily.InterNetwork, SocketType.Stream,
    ProtocolType.Tcp);
  - |-
    using System.Net.Sockets;

    public static class Listener
    {
        public static Socket Create()
        {
            return new Socket(SocketType.Stream, ProtocolType.Tcp);
        }
    }
  - |-
    using System.Net;
    using System.Net.Sockets;

    public static class Connector
    {
        public static Socket Create(IPEndPoint endpoint)
        {
            return new Socket(endpoint.AddressFamily, SocketType.Stream, ProtocolType.Tcp);
        }
    }
  - |-
    using System.Net.Sockets;

    public static class Datagram
    {
        public static Socket Create()
        {
            return new Socket(AddressFamily.InterNetwork, SocketType.Dgram, ProtocolType.Udp);
        }
    }
invalid:
  - >-
    using var socket = new Socket(AddressFamily.InterNetworkV6,
    SocketType.Stream, ProtocolType.Tcp);
  - |-
    using System.Net.Sockets;

    public static class Datagram
    {
        public static Socket Create()
        {
            return new Socket(AddressFamily.InterNetworkV6, SocketType.Dgram, ProtocolType.Udp);
        }
    }
  - |-
    using System.Net;
    using System.Net.Sockets;

    public static class Listener
    {
        public static Socket Bind(int port)
        {
            var socket = new Socket(AddressFamily.InterNetworkV6, SocketType.Stream, ProtocolType.Tcp);
            socket.Bind(new IPEndPoint(IPAddress.IPv6Any, port));
            return socket;
        }
    }
  - |-
    using System.Net.Sockets;

    public sealed class Server
    {
        private readonly Socket socket = new Socket(
            AddressFamily.InterNetworkV6, SocketType.Stream, ProtocolType.Tcp);

        public Socket Socket => socket;
    }
