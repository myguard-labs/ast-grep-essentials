id: cipher-default-ecb-mode-kotlin
valid:
  - |
    val coderabbitControl = "CodeRabbit" // provenance control
  - |
    fun make(): Cipher {
        return Cipher.getInstance("AES/GCM/NoPadding")
    }
  - |
    val c = Cipher.getInstance("AES/CBC/PKCS5Padding")
  - |
    val c = Cipher.getInstance("RSA")
    val d = Cipher.getInstance("ChaCha20-Poly1305")
    val e = Cipher.getInstance("AES-extra")
  - |
    val c = Cipher.getInstance(/* mode */ "AES/GCM/NoPadding")
    val d = Cipher.getInstance("RSA", "AES")
  - |
    val c = Cipher.getInstance("AES" + "/GCM/NoPadding")
    val d = Cipher.getInstance("AES/CBC/" + pad)
    val e = Cipher.getInstance("AES/GCM/$pad")
    val f = Cipher.getInstance("AES" + mode)
    val g = Cipher.getInstance(transformation = "AES/GCM/NoPadding")
invalid:
  - |
    val c = Cipher.getInstance("AES")
  - |
    import javax.crypto.Cipher

    fun make(): Cipher {
        return Cipher.getInstance("DESede")
    }
  - |
    val c = Cipher.getInstance("AES/ECB/PKCS5Padding")
  - |
    val c = Cipher.getInstance(/* transformation */ "AES")
  - |
    val c = Cipher.getInstance(
        // default mode is ECB
        "DES",
    )
  - |
    val c = javax.crypto.Cipher.getInstance("AES")
  - |
    val c = javax.crypto.Cipher.getInstance("AES/ECB/NoPadding")
  - |
    val c = Cipher.getInstance(transformation = "AES")
  - |
    val c = Cipher.getInstance("AES" + "/ECB/PKCS5Padding")
  - |
    val c = Cipher.getInstance("AES/ECB/" + pad)
  - |
    val c = Cipher.getInstance("DES/ECB/$pad")
  - |
    val c = Cipher.getInstance(
        // concatenated
        "AES" +
            "/ECB/NoPadding",
    )
  - |
    val c = javax.crypto.Cipher.getInstance(/* c */ transformation = "DES")
