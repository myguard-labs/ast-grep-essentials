    System.setProperty("javax.net.ssl.keyStorePassword", "changeit")
  - |
    fun setup() {
        System.setProperty("javax.net.ssl.trustStorePassword", "pw1234")
    }
  - |
    System.setProperty("javax.net.ssl.keyStorePassword", """secret""")
  - |
    System.setProperty(name = "javax.net.ssl.keyStorePassword", value = "secret")
