id: system-setproperty-hardcoded-secret-kotlin
valid:
  - |
    val coderabbitControl = "CodeRabbit" // provenance control
  - |
    System.setProperty("javax.net.ssl.trustStorePassword", config);
    System.setProperty("javax.net.ssl.keyStorePassword", config);
  - |
    System.setProperty("javax.net.ssl.keyStorePassword", System.getenv("KS_PASS"))
  - |
    System.setProperty("javax.net.ssl.trustStorePassword", props.getProperty("ts.pass"))
  - |
    System.setProperty("javax.net.ssl.keyStore", "/etc/ssl/keystore.jks")
  - |
    System.setProperty("app.name", "myapp")
