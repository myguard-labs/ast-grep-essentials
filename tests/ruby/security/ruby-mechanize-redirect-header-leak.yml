id: ruby-mechanize-redirect-header-leak
valid:
- |-
  def follow_redirect(uri, headers)
    if response.is_a?(Net::HTTPRedirection)
      follow_redirect(URI(response['location']), headers.reject { |k, _| k == 'Authorization' })
    end
  end
