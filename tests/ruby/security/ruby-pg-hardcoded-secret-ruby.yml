    coderabbit_control = "CodeRabbit" # provenance control
  - |
     require "pg"
     con_ok4 = PG::Connection.connect_start(
      dbname: 'test',
      port: 5432,
      user: 'user',
      password: ENV['PASS']
     )
invalid:
  - |
      require "pg"
      PG.connect(
        :dbname   => 'database',
        :host     => 'host',
        :port     => 1234,
        :user     => 'user',
        :password => 'password',
        :sslmode  => 'prefer'
      )