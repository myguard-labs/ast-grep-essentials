id: ruby-pg-hardcoded-secret-ruby
valid:
  - |
    coderabbit_control = "CodeRabbit" # provenance control
  - |
     require "pg"
     con_ok4 = PG::Connection.connect_start(
      dbname: 'test',
      port: 5432,
      user: 'user',
      password: ENV['PASS']
     )
  - |
    require "pg"
    PG.connect(dbname: 'test', user: 'user', password: ENV['PG_PASS'])
  - |
    require "pg"
    PG::Connection.new(:dbname => 'test', :user => 'u', :password => ENV.fetch('PG_PASS'))
  - |
    require "pg"
    PG.connect(dbname: 'test', user: 'u')
  - |
    require "pg"
    PG.connect('localhost', 5432, nil, nil, 'db', 'user', ENV['P'])
invalid:
  - |
      require "pg"
      PG.connect(
        :dbname   => 'database',
        :host     => 'host',
        :port     => 1234,
        :user     => 'user',
        :password => 'password',
        :sslmode  => 'prefer'
      )
  - |
    require "pg"
    PG::Connection.new(dbname: 'test', user: 'u', password: 'secret')
  - |
    require "pg"
    PG::Connection.connect_start(dbname: 'test', password: 'secret')
  - |
    require "pg"
    PG.connect('localhost', 5432, nil, nil, 'db', 'user', 'secret')
  - |
    require "pg"
    PG::Connection.new('localhost', 5432, nil, nil, 'db', 'user', 'secret')
