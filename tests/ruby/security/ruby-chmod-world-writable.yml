id: ruby-chmod-world-writable
valid:
  - |
    File.chmod(0600, path)
  - |
    FileUtils.chmod(0755, dir)
  - |
    File.chmod(mode, path)
  - |
    FileUtils.chmod("u+rw", path)
  - |
    Other.chmod(0777, path)
  - |
    # File.chmod(0777, path)
    s = "File.chmod(0777, path)"
  - |
    File.chmod(0644, path)
invalid:
  - |
    File.chmod(0777, path)
  - |
    FileUtils.chmod_R(0666, dir)
  - |
    File.chmod(0o757, path, other)
  - |
    FileUtils.chmod(0777, [a, b])
