id: ruby-html-safe-non-literal
valid:
  - |
    label = "<b>bold</b>".html_safe
  - |
    out = sanitize(params[:bio]).html_safe
  - |
    out = raw("<hr>")
  - |
    out = raw(h(params[:bio]))
  - |
    out = raw(sanitize(params[:body]))
  - |
    out = ERB::Util.html_escape(x).html_safe
  - |
    # raw(params[:bio])
    note = "params[:bio].html_safe"
  - |
    out = raw sanitize(params[:body])
  - |
    out = sanitize(params[:bio])&.html_safe
  - |
    out = view.raw(params[:bio])
invalid:
  - |
    out = params[:bio].html_safe
  - |
    out = raw(@comment.body)
  - |
    out = "<b>#{name}</b>".html_safe
  - |
    out = raw(sanitize(title) + params[:body])
  - |
    out = (h(name) + params[:x]).html_safe
  - |
    out = params[:bio]&.html_safe
  - |
    out = raw params[:bio]
  - |
    out = raw(# note
      params[:bio])
