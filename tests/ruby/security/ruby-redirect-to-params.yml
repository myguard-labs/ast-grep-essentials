id: ruby-redirect-to-params
valid:
  - |
    redirect_to root_path
  - |
    redirect_to user_path(params[:id])
  - |
    redirect_to "/home"
  - |
    # redirect_to params[:url]
    note = "redirect_to params[:url]"
invalid:
  - |
    redirect_to params[:url]
  - |
    redirect_to(params[:return_to])
  - |
    redirect_to params.fetch(:next), allow_other_host: true
  - |
    redirect_to(# note
      params[:url])
