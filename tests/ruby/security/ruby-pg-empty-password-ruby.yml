id: ruby-pg-empty-password-ruby
valid:
  - |
    coderabbit_control = "CodeRabbit" # provenance control
  - |
    con1 = PG.connect(
     :dbname   => 'database',
     :host     => 'host',
     :port     => 1234,
     :user     => 'user',
     :password => 'password',
     :sslmode  => 'prefer'
    )
  - |
    connection = PG.connect(dbname: 'database', user: 'user', password: "#{ENV.fetch('PGPASSWORD')}")
invalid:
  - |
    con1 = PG.connect(
     :dbname   => 'database',
     :host     => 'host',
     :port     => 1234,
     :user     => 'user',
     :password => '',
     :sslmode  => 'prefer'
    )
  - |
    connection = PG.connect(dbname: 'database', user: 'user', password: "")
