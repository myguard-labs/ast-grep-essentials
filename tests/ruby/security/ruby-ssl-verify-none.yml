id: ruby-ssl-verify-none
valid:
  - |
    http.verify_mode = OpenSSL::SSL::VERIFY_PEER
  - |
    http.verify_mode = Other::SSL::VERIFY_NONE
  - |
    # http.verify_mode = OpenSSL::SSL::VERIFY_NONE
    note = "OpenSSL::SSL::VERIFY_NONE"
invalid:
  - |
    http.verify_mode = OpenSSL::SSL::VERIFY_NONE
  - |
    ctx.verify_mode = ::OpenSSL::SSL::VERIFY_NONE
  - |
    Net::HTTP.start(host, port, use_ssl: true, verify_mode: OpenSSL::SSL::VERIFY_NONE) { |h| h.get("/") }
