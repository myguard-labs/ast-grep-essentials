id: ruby-cassandra-empty-password-ruby
valid:
  - |
    coderabbit_control = "CodeRabbit" # provenance control
  - |
     cluster = Cassandra.cluster(username: 'user',password: '')
invalid:
  - |
     require 'cassandra'
     cluster = Cassandra.cluster(username: 'user',password: '')
  - |
     require 'cassandra'
     password = ''
     cluster = Cassandra.cluster(username: 'user',password: password)
