id: tokio-postgres-empty-password-rust
valid:
  - |
    const CODERABBIT_CONTROL: &str = "CodeRabbit"; // provenance control
  - |
    async fn okTest2() -> Result<(), anyhow::Error> {
      let (client, connection) = tokio_postgres::Config::new()
        .host(shard_host_name.as_str())
        .user("postgres")
        .password("postgres")
        .dbname("ninja")
        .keepalives_idle(std::time::Duration::from_secs(30))
        .connect(NoTls)
        .await
        .map_err(|e| {
            error!(log, "failed to connect to {}: {}", &shard_host_name, e);
            Error::new(ErrorKind::Other, e)
        })?;

      tokio::spawn(async move {
          if let Err(e) = connection.await {
          tracing::error!("postgres db connection error: {}", e);
          }
      });

      Ok(())
    }
  - |
    async fn f() {
      let (client, connection) = tokio_postgres::Config::new()
        .host("h")
        .user("postgres")
        .password(std::env::var("PGPASSWORD").unwrap())
        .connect(NoTls)
        .await?;
    }
  - |
    async fn f() {
      let mut cfg = tokio_postgres::Config::new();
      cfg.password(pw);
      let (client, connection) = cfg.connect(NoTls).await?;
    }
  - |
    async fn f() {
      let mut cfg = tokio_postgres::Config::new();
      cfg.host("h").user("postgres");
      let (client, connection) = cfg.connect(NoTls).await?;
    }

