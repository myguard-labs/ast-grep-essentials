  - |-
    use core::fmt;

    struct W(Vec<u8>);

    impl W {
        fn append_within_capacity(&mut self, s: &[u8]) -> Result<(), ()> {
            if self.0.capacity() - self.0.len() < s.len() {
                return Err(());
            }
            self.0.extend_from_slice(s);
            Ok(())
        }
    }

    impl fmt::Write for W {
        fn write_str(&mut self, s: &str) -> fmt::Result {
            match self.append_within_capacity(s.as_bytes()) {
                Ok(()) => Ok(()),
                Err(()) => Err(fmt::Error),
            }
        }
    }
