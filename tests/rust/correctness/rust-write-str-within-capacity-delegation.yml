id: rust-write-str-within-capacity-delegation
valid:
  - |-
    use core::fmt;
    struct W(Vec<u8>);
    impl fmt::Write for W {
        fn write_str(&mut self, s: &str) -> fmt::Result {
            self.try_append(s).map_err(|_| fmt::Error)
        }
    }
  - |-
    use core::fmt;

    struct W(Vec<u8>);

    impl fmt::Write for W {
        fn write_str(&mut self, s: &str) -> fmt::Result {
            self.0.try_reserve(s.len()).map_err(|_| fmt::Error)?;
            self.0.extend_from_slice(s.as_bytes());
            Ok(())
        }
    }
  - |-
    use core::fmt;

    struct W(String);

    impl fmt::Write for W {
        fn write_str(&mut self, s: &str) -> fmt::Result {
            self.0.push_str(s);
            Ok(())
        }
    }
  - |-
    use core::fmt;
    use std::io::Write as _;

    struct W(Vec<u8>);

    impl fmt::Write for W {
        fn write_str(&mut self, s: &str) -> fmt::Result {
            self.0.write_all(s.as_bytes()).map_err(|_| fmt::Error)
        }
    }
invalid:
  - |-
    use core::fmt;
    struct W(Vec<u8>);
    impl fmt::Write for W {
        fn write_str(&mut self, s: &str) -> fmt::Result {
            self.append_within_capacity(s).map_err(|_| fmt::Error)
        }
    }
  - |-
    use core::fmt;

    struct W(Vec<u8>);

    impl W {
        fn append_within_capacity(&mut self, s: &[u8]) -> Result<(), ()> {
            if self.0.capacity() - self.0.len() < s.len() {
                return Err(());
            }
            self.0.extend_from_slice(s);
            Ok(())
        }
    }

    impl fmt::Write for W {
        fn write_str(&mut self, s: &str) -> fmt::Result {
            self.append_within_capacity(s.as_bytes()).map_err(|_| fmt::Error)
        }
    }
  - |-
    use core::fmt;

    struct W(Vec<u8>);

    impl W {
        fn append_within_capacity(&mut self, s: &[u8]) -> Result<(), ()> {
            if self.0.capacity() - self.0.len() < s.len() {
                return Err(());
            }
            self.0.extend_from_slice(s);
            Ok(())
        }
    }

    impl fmt::Write for W {
        fn write_str(&mut self, s: &str) -> fmt::Result {
            let r = self.append_within_capacity(s.as_bytes());
            r.map_err(|_| fmt::Error)
        }
    }
  - |-
    use core::fmt;

    struct W(Vec<u8>);

    impl W {
        fn append_within_capacity(&mut self, s: &[u8]) -> Result<(), ()> {
            if self.0.capacity() - self.0.len() < s.len() {
                return Err(());
            }
            self.0.extend_from_slice(s);
            Ok(())
        }
