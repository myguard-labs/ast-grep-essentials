id: missing-return-value-cpp
valid:
  - |-
    int f(int x) {
      x++;
      return x;
    }
  - 'struct S { S() = default; };'
  - |-
    int sign(int x) {
      if (x < 0) {
        return -1;
      }
      if (x > 0) {
        return 1;
      }
      return 0;
    }
  - |-
    int apply_once(int x) {
      auto add = [](int a) { return a + 1; };
      return add(x);
    }
  - |-
    struct Counter {
      int count_ = 0;
      int get() const { return count_; }
      int next() { return ++count_; }
    };
invalid:
  - |-
    int f(int x) {
      x++;
    }
  - |-
    #include <string>
    std::string label(int x) {
      std::string s = "n";
      s += std::to_string(x);
    }
  - |-
    struct Counter {
      int count_ = 0;
      int bump() {
        count_++;
      }
    };
  - |-
    bool is_positive(int x) {
      if (x > 0) {
        x--;
      }
    }
  - |-
    struct Counter {
      int count_ = 0;
      int get() const;
    };
    int Counter::get() const {
      int copy = count_;
      copy++;
    }
