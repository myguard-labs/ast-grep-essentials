id: missing-return-value-cpp
valid:
  - |-
    int f(int x) {
      x++;
      return x;
    }
  - 'struct S { S() = default; };'
  - |-
    int sign(int x) {
      if (x < 0) {
        return -1;
      }
      if (x > 0) {
        return 1;
      }
      return 0;
    }
  - |-
    int apply_once(int x) {
      auto add = [](int a) { return a + 1; };
      return add(x);
    }
  - |-
    struct Counter {
      int count_ = 0;
      int get() const { return count_; }
      int next() { return ++count_; }
    };
  - |-
    static int total = 0;
    void add(int x) {
      total += x;
    }
  - |-
    struct Box {
      int v_ = 0;
      void set(int v) {
        v_ = v;
      }
    };
  - |-
    auto reset(int &x) -> void {
      x = 0;
    }
  - |-
    struct Res {
      int *p_;
      Res() : p_(new int(0)) {
        *p_ = 1;
      }
      ~Res() {
        delete p_;
      }
      Res(const Res &) = delete;
      Res &operator=(const Res &) = delete;
    };
  - |-
    struct Flag {
      int v_ = 0;
      explicit Flag(int v) { v_ = v; }
      operator bool() const {
        if (v_ > 0) {
          return true;
        }
        return false;
      }
    };
    struct Wrap {
      int v_ = 0;
      operator int() const;
    };
    Wrap::operator int() const {
      int copy = v_;
      return copy;
    }
  - |-
    int main(int argc, char **argv) {
      argc += 1;
      argv[0] = nullptr;
    }
  - |-
    auto bump(int &x) {
      x++;
    }
  - |-
    template <class T>
    void clear(T &v) {
      v = T();
    }
invalid:
  - |-
    int f(int x) {
      x++;
    }
  - |-
    #include <string>
    std::string label(int x) {
      std::string s = "n";
      s += std::to_string(x);
    }
  - |-
    struct Counter {
      int count_ = 0;
      int bump() {
        count_++;
      }
    };
  - |-
    bool is_positive(int x) {
      if (x > 0) {
        x--;
      }
    }
  - |-
    struct Counter {
      int count_ = 0;
      int get() const;
    };
    int Counter::get() const {
      int copy = count_;
      copy++;
    }
  - |-
    void *raw(int n) {
      n++;
    }
  - |-
    template <class T>
    T first(T a, T b) {
      a = b;
    }
  - |-
    struct Cfg {
      int level_ = 0;
      void set(int v) {
        level_ = v;
      }
      int get() const {
        int copy = level_;
        copy++;
      }
    };
  - |-
    auto width(int x) -> int {
      x++;
    }
