id: file-stat-before-action-cpp
valid:
  - |
    void coderabbit_control() { const char *text = "CodeRabbit"; }
  - 'void f(const char *p) { int fd = open(p, O_RDONLY); struct stat st; if (fd >= 0 && fstat(fd, &st) == 0) { read(fd, buf, st.st_size); } }'
  - 'void f(const char *p) { struct stat st; if (stat(p, &st) == 0) { log_size(st.st_size); } }'
  - 'void f(const char *p) { FILE *fp = fopen(p, "r"); if (fp) { int fd = fileno(fp); struct stat st; fstat(fd, &st); fclose(fp); } }'
invalid:
  - |
    if (stat(file.c_str(), &buf) == 0){
      // Open the file for reading
      fp = fopen(file.c_str(), "r");
      if (fp == NULL)
      {
        char message[2560];
        sprintf(message, "File '%s' Could Not be Opened", file.c_str());
        // DISPLAY_MSG_ERROR( this, message, "GetFileContents", "System" );
        throw message;
      }

      // Read the file
      MvString s, ss;
      while (fgets(data, sizeof(data), fp) != (char *)0)
      {
        s = data;
        s.trimBoth();
        if (s.compare(0, 5, "GROUP") == 0)
        {
          // size_t t = s.find_last_of( ":" );
          size_t t = s.find(":");
          if (t != string::npos)
          {
            ss = s.substr(t + 1).c_str();
            ss.trimBoth();
            ss = ss.substr(1, ss.length() - 3).c_str();
            group_list.push_back(ss);
          }
        }
      }

      // Close the file
      fclose(fp);
    }
  - 'void f(const char *p) { struct stat st; if (stat(p, &st) == 0) { int fd = open(p, O_RDONLY); } }'
  - 'void f(const char *p) { struct stat st; if (lstat(p, &st) == 0) { remove(p); } }'
  - 'void f(const char *p) { struct stat st; if (stat(p, &st) == 0) { rename(p, "x"); } }'
  - 'void f(const std::string &p) { struct stat st; if (stat(p.c_str(), &st) == 0) { chdir(p.c_str()); } }'
