id: string-constructor-swapped-args-cpp
valid:
  - "void f() { std::string s(50, 'x'); }"
  - "void f() { std::string s{'x', 50}; }"
  - "void f(int n) { std::string s(n, 'x'); }"
  - "void f() { std::vector<char> v('x', 50); }"
  - "void f() { foo('x', 50); }"
  - "void f() { std::string s = std::string(50, 'x'); }"
invalid:
  - "void f() { std::string s('x', 50); }"
  - "void f() { std::string t = std::string('x', 50); }"
  - "void f() { std::wstring w('x', 8); }"
  - "void f() { auto t = string('-', 20); }"
