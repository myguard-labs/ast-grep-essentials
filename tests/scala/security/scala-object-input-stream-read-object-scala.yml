id: scala-object-input-stream-read-object-scala
valid:
  - |
    object A {
      def ok(in: java.io.InputStream) = {
        val stream = new ObjectInputStream(in)
        stream.close()
      }
    }
  - |
    object A {
      def ok(reader: Reader) = {
        val r = new BufferedReader(reader)
        r.readObject()
      }
    }
  - |
    object A {
      def ok(in: java.io.InputStream) = {
        val stream = new ObjectInputStream(in) {
          override def resolveClass(d: ObjectStreamClass): Class[_] = checked(d)
        }
        stream.readObject()
      }
    }
  - |
    object A {
      def ok(in: java.io.InputStream) = new ValidatingObjectInputStream(in).readObject()
    }
  - |
    object A {
      def ok(json: Json) = json.readObject()
    }
  - |
    object A {
      def ok(in: java.io.InputStream) =
        Using(new BufferedReader(in)) { o => o.readObject() }
    }
  - |
    object A {
      def ok(in: java.io.InputStream) =
        Using.resource(new BufferedReader(in)) { o => o.readObject() }
    }
  - |
    object A {
      def ok(in: java.io.InputStream, j: Json) = {
        {
          val s = new ObjectInputStream(in)
          s.close()
        }
        {
          val s = j.reader()
          s.readObject()
        }
      }
    }
  - |
    object A {
      def ok(in: java.io.InputStream, j: Json) = {
        val s = new ObjectInputStream(in)
        s.close()
        {
          val s = j.reader()
          s.readObject()
        }
      }
    }
  - |
    object A {
      def ok(in: java.io.InputStream) = {
        val s = new ObjectInputStream(in)
        def other(s: Json) = s.readObject()
        other(null)
      }
    }
  - |
    object A {
      def ok(in: java.io.InputStream, items: List[Json]) = {
        val s = new ObjectInputStream(in)
        items.map(s => s.readObject())
      }
    }
  - |
    object A {
      def ok(in: java.io.InputStream, items: List[Json]) = {
        val s = new ObjectInputStream(in)
        items.map((s: Json) => s.readObject())
      }
    }
  - |
    object A {
      def ok(in: java.io.InputStream, items: List[Int]) =
        Using(new ObjectInputStream(in)) { o => items.map(o => o.readObject()) }
    }
  - |
    object A {
      def ok(in: java.io.InputStream, json: Json) =
        Using(new ObjectInputStream(in)) { o => { val o = json.reader(); o.readObject() } }
    }
  - |
    object A {
      def ok(in: java.io.InputStream) =
        Using(new ObjectInputStream(in)) { o => def other(o: Json) = o.readObject(); other(null) }
    }
  - |
    object A {
      def ok(in: java.io.InputStream, y: Option[Json]) =
        Using(new ObjectInputStream(in)) { o => y match { case Some(o) => o.readObject() } }
    }
  - |
    object A {
      def ok(in: java.io.InputStream, y: Option[Json]) = {
        val o = new ObjectInputStream(in)
        y match { case Some(o) => o.readObject() }
      }
    }
  - |
    object A {
      def ok(in: java.io.InputStream, json: Json) = {
        val o = new ObjectInputStream(in)
        var other = 1
        def run(n: Int, o: Json) = o.readObject()
        run(1, null)
      }
    }
  - |
    object A {
      def ok(in: java.io.InputStream, in2: java.io.InputStream) = {
        val o = new ObjectInputStream(in)
        def run(o: Json) = {
          val p = new ObjectInputStream(in2)
          o.readObject()
        }
        run(null)
      }
    }
  - |
    object A {
      def ok(in: java.io.InputStream, in2: java.io.InputStream) = {
        val o = new ObjectInputStream(in)
        def run(o: Json) = Using(new ObjectInputStream(in2)) { p => o.readObject() }
        run(null)
      }
    }
  - |
    object A {
      def ok(in: java.io.InputStream, in2: java.io.InputStream) =
        Using(new ObjectInputStream(in)) { o =>
          def run(o: Json) = Using(new ObjectInputStream(in2)) { p => o.readObject() }
          run(null)
        }
    }
invalid:
