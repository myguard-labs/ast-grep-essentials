          s.readObject()
        } else null
      }
    }
  - |
    object A {
      def bad(in: java.io.InputStream) =
        Using(new ObjectInputStream(in)) { (o: ObjectInputStream) => o.readObject() }
    }
  - |
    object A {
      def bad(in: java.io.InputStream, o2: Json) =
        Using(new ObjectInputStream(in)) { o => { val other = o2.reader(); o.readObject() } }
    }
  - |
    object A {
      def bad(in: java.io.InputStream) = {
        val o = new ObjectInputStream(in)
        def run(n: Int = o.hashCode, t: List[o.type] = Nil) = o.readObject()
        run()
