    object A {
      def bad(in1: java.io.InputStream, in2: java.io.InputStream) =
        Using(new ObjectInputStream(in1)) { o =>
          Using(new ObjectInputStream(in2)) { o => o.readObject() }
        }
    }
  - |
    object A {
      val o = new ObjectInputStream(in1)
      def f(o: Json, in2: java.io.InputStream) = {
        val o = new ObjectInputStream(in2)
        o.readObject()
      }
    }
  - |
    object A {
      def bad(a: java.io.InputStream, b: java.io.InputStream) =
        Using(new ObjectInputStream(a)) { o =>
          {
            val o = json.reader()
            Using(new ObjectInputStream(b)) { o => o.readObject() }
          }
        }
    }
  # Known residual, pinned: a shadowed `o.readObject()` that sits in a block
  # also reading its own differently named source `p` is still reported
  # (the stop rule only ties a source to a readObject() call on its own name
  # somewhere below it, not to this very call).
  - |
    object A {
      def bad(in: java.io.InputStream, in2: java.io.InputStream) = {
        val o = new ObjectInputStream(in)
        def run(o: Json) = {
          val p = new ObjectInputStream(in2)
          p.readObject()
          o.readObject()
        }
        run(null)
      }
    }
  - |
    object A {
      def bad(in1: java.io.InputStream, in2: java.io.InputStream, j: Json) = {
        val o = new ObjectInputStream(in1)
        locally {
          val o = j.reader()
          locally {
            val o = new ObjectInputStream(in2)
            o.readObject()
          }
        }
      }
    }
  # A type pattern that names the stream counts as a rebinding, but the
  # nearer Using source of another name stops the search before it.
  - |
    object A {
      def bad(in: java.io.InputStream, in2: java.io.InputStream, x: Any) = {
        val o = new ObjectInputStream(in)
        x match {
          case _: o.type =>
            Using(new ObjectInputStream(in2)) { p =>
              o.readObject()
              p.readObject()
            }
        }
      }
    }
  # The same with a Using source and a nearer val source of another name.
  - |
    object A {
      def bad(in: java.io.InputStream, in2: java.io.InputStream, x: Any) =
        Using(new ObjectInputStream(in)) { o =>
          x match {
            case _: o.type => {
              val p = new ObjectInputStream(in2)
              o.readObject()
              p.readObject()
            }
          }
        }
    }
