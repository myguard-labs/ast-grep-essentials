    object A {
      def bad(in: java.io.InputStream) = new ObjectInputStream(in).readObject()
    }
  - |
    object A {
      def bad(p: String) = {
        val stream = new java.io.ObjectInputStream(new FileInputStream(p))
        try { stream.readObject() } finally stream.close()
      }
    }
  - |
    object A {
      def bad(in: java.io.InputStream) =
        Using(new ObjectInputStream(in)) { o => o.readObject() }
    }
  - |
    object A {
      def bad(in: java.io.InputStream) =
        Using(/* untrusted stream */ new ObjectInputStream(in)) { o => o.readObject() }
    }
