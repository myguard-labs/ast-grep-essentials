id: go-xml-decoder-strict-off
valid:
- 'package p; func f() { d := xml.NewDecoder(r.Body); d.Decode(&v) }'
- 'package p; func f() { d.Strict = true }'
- 'package p; func f() { d.Entity = myEntities }'
- 'package p; func f() { d.Enabled = false }'
- 'package p; func f() { cfg.Verbose = false }'
- 'package p; // d.Strict = false'
- 'package p; var s = "d.Strict = false"'
invalid:
- 'package p; func f() { d.Strict = false }'
- 'package p; func f() { dec.Strict = false }'
- 'package p; func f() { d.Entity = xml.HTMLEntity }'
