id: go-math-rand
valid:
- 'package p

  import "crypto/rand"'
- 'package p

  var name = "math/rand"'
- // package p import "math/rand"
- 'package p

  var text = "package p\nimport \"math/rand\""'
invalid:
- 'package p

  import "math/rand"'
- 'package p

  import "math/rand/v2"'
- 'package p

  import `math/rand`'
- 'package p

  import `math/rand/v2`'
