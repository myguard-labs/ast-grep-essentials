id: go-log-credential-variable
valid:
  - |
    func f() { log.Println("user logged in") }
  - |
    func f(password string) { log.Printf("len %d", len(password)) }
  - |
    func f(token string) { log.Println(mask(token)) }
  - |
    func f(tokenCount int) { log.Printf("n %d", tokenCount) }
  - |
    func f(password string) { other.Println("pw", password) }
  - |
    func f() {
    	// log.Println(password)
    	s := "log.Println(password)"
    	_ = s
    }
  - |
    func f(nextPageToken string) { log.Printf("page %s", nextPageToken) }
invalid:
  - |
    func f(password string) { log.Printf("pw %s", password) }
  - |
    func f(cfg Config) { logger.Info("key " + cfg.APIKey) }
  - |
    func f(c Config) { slog.Warn("secret", c.ClientSecret) }
  - |
    func f(accessToken string) { log.Println("t", accessToken) }
