id: go-loop-overflow-check-after-accumulate
valid:
  - >-
    func colNum(name string) (int, error) { col, multi := 0, 1; for i :=
    len(name) - 1; i >= 0; i-- { col += int(name[i]-'A'+1) * multi; if col >
    16384 { return -1, errBad }; multi *= 26 }; return col, nil }
  - "func f(name string) (int, error) { col, multi := 0, 1; for i := len(name) - 1; i >= 0; i-- { if col > 16384 || multi > 16384 { return -1, errBad }; col += int(name[i]-'A'+1) * multi; multi *= 26 }; return col, nil }"
  - "func f(s string) int { v, m := 0, 1; for { v += m; m *= 2; if v > 100 { break } }; return v }"
  - "func f(name string) int { col := 0; for i := 0; i < 4; i++ { col += int(name[i]) }; return col }"
  - "func f() int { m := 1; for i := 0; i < 3; i++ { m *= 26 }; return m }"

invalid:
  - >-
    func colNum(name string) (int, error) { col, multi := 0, 1; for i :=
    len(name) - 1; i >= 0; i-- { col += int(name[i]-'A'+1) * multi; multi *= 26
    }; if col > 16384 { return -1, errBad }; return col, nil }
  - "func f(name string) int { col, multi := 0, 1; for _, c := range name { col += int(c-'A'+1) * multi; multi *= 26 }; return col }"
  - "func f(s string) int { v, scale := 0, 1; for i := 0; i < len(s); i++ { v += int(s[i]-'0') * scale; scale *= 10 }; return v }"
  - "func f(s string) int { v, m := 0, 1; for len(s) > 0 { v += m; m *= 3; s = s[1:] }; return v }"
