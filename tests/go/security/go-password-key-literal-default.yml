id: go-password-key-literal-default
valid:
- 'func cfg() Config { return Config{AdminPassword: os.Getenv("ADMIN_PASSWORD")} }'
- '// func cfg() Config { return Config{AdminPassword: "sipcapture"} }'
- 'var astgrepFixture = "func cfg() Config { return Config{AdminPassword: \"sipcapture\"} }"'
- "func cfg() Config { return Config{AdminPassword: \"\"} }"
- "func cfg() Config { return Config{AdminPassword: defaultPassword} }"

invalid:
- 'func cfg() Config { return Config{AdminPassword: "sipcapture"} }'
- "func defaults() Config { return Config{AdminPassword: \"sipcapture\"} }"
- "func cfg() Config { return Config{\n\tAdminPassword: \"sipcapture\",\n} }"
- "func cfg() Config { return Config{AdminPassword:    \"sipcapture\"} }"
