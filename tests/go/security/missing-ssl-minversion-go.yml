id: missing-ssl-minversion-go
valid:
  - |
    package main

    var coderabbitControl = "CodeRabbit"
  - |
      TLSClientConfig: &tls.Config{
      KeyLogWriter:       w,
      MinVersion:         tls.VersionSSL30,
      Rand:               zeroSource{},
      InsecureSkipVerify: true,
      },

invalid:
   - |
     server.TLS = &tls.Config{ Rand: zeroSource{}, }
