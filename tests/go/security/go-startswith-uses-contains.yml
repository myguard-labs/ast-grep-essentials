id: go-startswith-uses-contains
valid:
  - "package p\n\nimport \"strings\"\n\nfunc htmlEncodeHasSubstring(a, b string) bool {\n\treturn strings.Contains(b, a)\n}\n"
invalid:
  - "package p\n\nimport \"strings\"\n\nfunc htmlEncodeStartsWith(a, b string) bool {\n\treturn strings.Contains(b, a)\n}\n"
