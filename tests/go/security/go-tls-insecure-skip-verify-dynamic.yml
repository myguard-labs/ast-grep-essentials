id: go-tls-insecure-skip-verify-dynamic
valid:
- "package p\n\nimport \"crypto/tls\"\n\nfunc newTLS(cfg Config) *tls.Config {\n\treturn &tls.Config{InsecureSkipVerify: false}\n}"
- "// package p\n// \n// import \"crypto/tls\"\n// \n// func newTLS(cfg Config) *tls.Config {\n// \treturn &tls.Config{InsecureSkipVerify: cfg.Skip}\n// }"
- 'var astgrepFixture = "package p\n\nimport \"crypto/tls\"\n\nfunc newTLS(cfg Config) *tls.Config {\n\treturn &tls.Config{InsecureSkipVerify: cfg.Skip}\n}"'
- "package p\n\nimport \"crypto/tls\"\n\nfunc n() *tls.Config {\n\treturn &tls.Config{MinVersion: tls.VersionTLS12}\n}"
- "package p\n\nimport \"crypto/tls\"\n\nfunc n(host string) *tls.Config {\n\treturn &tls.Config{ServerName: host, InsecureSkipVerify: false}\n}"

invalid:
- "package p\n\nimport \"crypto/tls\"\n\nfunc newTLS(cfg Config) *tls.Config {\n\treturn &tls.Config{InsecureSkipVerify: cfg.Skip}\n}"
- "package p\n\nimport \"crypto/tls\"\n\nfunc n(skip bool) *tls.Config {\n\treturn &tls.Config{InsecureSkipVerify: skip}\n}"
- "package p\n\nimport \"crypto/tls\"\n\nfunc n(o Opts) *tls.Config {\n\treturn &tls.Config{InsecureSkipVerify: o.TLS.Skip}\n}"
- "package p\n\nimport \"crypto/tls\"\n\nfunc n(insecure bool) *tls.Config {\n\treturn &tls.Config{\n\t\tMinVersion: tls.VersionTLS12,\n\t\tInsecureSkipVerify: insecure,\n\t}\n}"
- "package p\n\nimport \"crypto/tls\"\n\nfunc n(skip bool) *http.Transport {\n\treturn &http.Transport{TLSClientConfig: &tls.Config{InsecureSkipVerify: skip}}\n}"
