id: go-strings-split-index-one-unchecked
valid:
  - "package p\n\nimport \"strings\"\n\nfunc rel(file string) string {\n\treturn strings.Split(file, \"/agent/\")[0]\n}\n"
  - "package p\n\nimport \"strings\"\n\nfunc rel(s string) string {\n\tparts := strings.Split(s, \"/\")\n\tif len(parts) > 1 {\n\t\treturn parts[1]\n\t}\n\treturn \"\"\n}\n"
  - "package p\n\nimport \"strings\"\n\nfunc rel(s string) string {\n\t_, after, _ := strings.Cut(s, \"/\")\n\treturn after\n}\n"

invalid:
  - "package p\n\nimport \"strings\"\n\nfunc rel(file string) string {\n\treturn strings.Split(file, \"/agent/\")[1]\n}\n"
  - "func f(line string) string {\n\tv := strings.Split(line, \"=\")[1]\n\treturn v\n}"
  - "func f(line string) string {\n\treturn strings.Split(strings.TrimSpace(line), \"=\")[1]\n}"
  - "func f(h string) bool {\n\tif strings.Split(h, \" \")[1] == \"x\" {\n\t\treturn true\n\t}\n\treturn false\n}"
  - "func f(a string) {\n\tuse(strings.Split(a, \",\")[1])\n}"
