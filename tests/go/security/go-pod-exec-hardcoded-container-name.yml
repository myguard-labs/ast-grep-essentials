id: go-pod-exec-hardcoded-container-name
valid:
  - "package main\n\nfunc run(dc *Collector, ns string, pod Pod, container Container, cmd []string, ctx context.Context) {\n\tdc.PodExecutor(ns, pod.Name, container.Name, cmd, ctx)\n}"
invalid:
  - "package main\n\nfunc run(dc *Collector, ns string, pod Pod, cmd []string, ctx context.Context) {\n\tdc.PodExecutor(ns, pod.Name, \"nginx-ingress\", cmd, ctx)\n}"
