id: go-http-no-timeout
valid:
- 'package m; func f() { c := &http.Client{Timeout: 10 * time.Second} }'
- 'package m; func f() { c := &http.Client{Timeout: 0x1} }'
- 'package m; func f() { c := &http.Client{Timeout: 0.1} }'
- 'package m; func f() { s := &http.Server{ReadHeaderTimeout: 5 * time.Second, WriteTimeout: 5 * time.Second} }'
- 'package m; func f() { s := &http.Server{ReadTimeout: 5 * time.Second, WriteTimeout: 5 * time.Second} }'
- 'package m; func f() { s := &http.Server{ReadTimeout: 5 * time.Second, ReadHeaderTimeout: 0, WriteTimeout: 5 * time.Second} }'
- 'package m; func f() { s := &http.Server{ReadTimeout: 5 * time.Second, ReadHeaderTimeout: 0x0, WriteTimeout: 5 * time.Second} }'
- 'package m; func f() { s := &http.Server{ReadHeaderTimeout: 5 * time.Second, WriteTimeout: 5 * time.Second, IdleTimeout: 0} }'
- 'package m; func f() { t := &http.Transport{MaxIdleConns: 10} }'
- 'package m; // c := &http.Client{}'
- 'package m; func f() { c := Client{Name: "x"} }'
- 'package m; func f() { s := &grpc.Server{} }'
invalid:
- 'package m; func f() { c := &http.Client{} }'
- 'package m; func f() { c := &http.Client{Timeout: 0} }'
- 'package m; func f() { c := &http.Client{Timeout: -time.Second} }'
- 'package m; func f() { c := &http.Client{Timeout: (0)} }'
- 'package m; func f() { c := &http.Client{Timeout: +0} }'
- 'package m; func f() { c := &http.Client{Timeout: 0x0} }'
- 'package m; func f() { c := &http.Client{Timeout: 0.0} }'
- 'package m; func f() { c := &http.Client{Timeout: (/* disabled */ 0)} }'
- 'package m; func f() { c := &http.Client{Timeout: (-time.Second)} }'
- 'package m; func f() { s := &http.Server{ReadHeaderTimeout: 0, WriteTimeout: time.Second} }'
- 'package m; func f() { s := &http.Server{ReadHeaderTimeout: time.Second} }'
- 'package m; func f() { s := &http.Server{WriteTimeout: time.Second} }'
- 'package m; func f() { s := &http.Server{IdleTimeout: time.Second} }'
- 'package m; func f() { s := &http.Server{ReadHeaderTimeout: -time.Second, WriteTimeout: time.Second} }'
- 'package m; func f() { s := &http.Server{ReadTimeout: time.Second, ReadHeaderTimeout: -time.Second, WriteTimeout: time.Second} }'
- 'package m; func f() { s := &http.Server{ReadHeaderTimeout: time.Second, WriteTimeout: 0} }'
- 'package m; func f() { s := &http.Server{ReadHeaderTimeout: time.Second, WriteTimeout: -time.Second} }'
- 'package m; func f() { s := &http.Server{ReadTimeout: time.Second, ReadHeaderTimeout: (-time.Second), WriteTimeout: time.Second} }'
- 'package m; func f() { s := &http.Server{ReadHeaderTimeout: time.Second, WriteTimeout: (0)} }'
- 'package m; func f() { s := &http.Server{ReadHeaderTimeout: 0x0, WriteTimeout: time.Second} }'
- 'package m; func f() { s := &http.Server{ReadHeaderTimeout: time.Second, WriteTimeout: (/* disabled */ 0.0)} }'
- 'package m; func f() { s := &http.Server{Addr: ":8080", Handler: mux} }'
- 'package m; func f() { c := http.Client{Transport: tr} }'
- 'package m; func f() { c := &http.Client{Transport: &http.Transport{ResponseHeaderTimeout: time.Second}} }'
