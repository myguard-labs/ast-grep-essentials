id: openai-hardcoded-secret-go
valid:
  - |
    package main

    var coderabbitControl = "CodeRabbit"
  - "import (\n\t\"os\"\n\t\"github.com/sashabaranov/go-openai\"\n)\nfunc main() {\n\tclient := openai.NewClient(os.Getenv(\"OPENAI_API_KEY\"))\n\t_ = client\n}"
  - "import (\n\t\"os\"\n\t\"github.com/sashabaranov/go-openai\"\n)\nfunc main() {\n\ttoken := os.Getenv(\"OPENAI_API_KEY\")\n\tclient := openai.NewClient(token)\n\t_ = client\n}"
invalid:
  - |
    import (
      "github.com/sashabaranov/go-openai"
    )
    func main() {
      client := openai.NewClient("my-openai-token")
    }
  - "import (\n\t\"os\"\n\t\"github.com/sashabaranov/go-openai\"\n)\nfunc main() {\n\tvar token = \"placeholder-token\"\n\tclient := openai.NewClient(token)\n\t_ = client\n}"
  - "import (\n\t\"os\"\n\t\"github.com/sashabaranov/go-openai\"\n)\nvar token = \"placeholder-token\"\nfunc main() {\n\tclient := openai.NewClient(token)\n\t_ = client\n}"
  - "import (\n\t\"os\"\n\t\"github.com/sashabaranov/go-openai\"\n)\nfunc newC() *openai.Client {\n\treturn openai.NewClient(\"placeholder-token\")\n}"
