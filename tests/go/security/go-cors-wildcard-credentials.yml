id: go-cors-wildcard-credentials
valid:
- 'package p; var o = cors.Options{AllowedOrigins: []string{"https://app.example"}, AllowCredentials: true}'
- 'package p; var o = cors.Options{AllowedOrigins: []string{"*"}, AllowCredentials: false}'
- 'package p; var o = cors.Options{AllowedOrigins: []string{"*"}}'
- 'package p; var o = cors.Config{AllowAllOrigins: true}'
- 'package p; var o = cors.Config{AllowAllOrigins: false, AllowCredentials: true}'
- 'package p; var o = cors.Config{AllowOriginFunc: func(o string) bool { return o == "https://app.example" }, AllowCredentials: true}'
- 'package p; var o = other.Options{Name: "*", Enabled: true}'
- 'package p; // cors.Options{AllowedOrigins: []string{"*"}, AllowCredentials: true}'
- 'package p; var s = "cors.Options{AllowedOrigins: []string{\"*\"}, AllowCredentials: true}"'
invalid:
- 'package p; var o = cors.Options{AllowedOrigins: []string{"*"}, AllowCredentials: true}'
- 'package p; var o = cors.Config{AllowOrigins: "*", AllowCredentials: true}'
- 'package p; var o = cors.Config{AllowAllOrigins: true, AllowCredentials: true}'
- 'package p; var o = cors.Config{AllowOriginFunc: func(o string) bool { return true }, AllowCredentials: true}'
- 'package p; var o = mw.Settings{Origins: []string{"*"}, AllowCredentials: true}'
