id: go-weak-hash-import
valid:
- 'package p

  import "crypto/sha256"'
- 'package p

  var name = "crypto/md5"'
- // package p import "crypto/md5"
- 'package p

  var text = "package p\nimport \"crypto/md5\""'
invalid:
- 'package p

  import "crypto/md5"'
- 'package p

  import ("crypto/sha1")'
- 'package p

  import `crypto/md5`'
- 'package p

  import `crypto/sha1`'
