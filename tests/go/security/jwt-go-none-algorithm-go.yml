id: jwt-go-none-algorithm-go
valid:
  - |
    package main

    var coderabbitControl = "CodeRabbit"
  - |
    import (
      "fmt"
      "github.com/dgrijalva/jwt-go"
    )
    func ok1(key []byte){
      claims = jwt.StandardClaims{
        ExpiresAt:15000,
        Issuer:"test"
      }
      token = jwt.NewWithClaims(jwt.SigningMethodHS256, claims)
      ss, err = token.SignedString(key)
      fmt.Printf("%v %v\n", ss, err)
    }
  - |
    package main

    import "github.com/dgrijalva/jwt-go"

    func main() {
      _ = jwt.SigningMethodHS256
      myjwt := struct{ SigningMethodNone string }{SigningMethodNone: "ordinary data"}
      _ = myjwt.SigningMethodNone
    }
invalid:
  - |
    import (
      "fmt"
      "github.com/dgrijalva/jwt-go"
    )
    func bad1(key []byte) {
      claims := jwt.StandardClaims{
        ExpiresAt:15000,
        Issuer:"test"
      }
      token := jwt.NewWithClaims(jwt.SigningMethodNone, claims)
      ss, err := token.SignedString(jwt.UnsafeAllowNoneSignatureType)
      fmt.Printf("%v %v\n", ss, err)
    }
  - |
    package main

    import "github.com/dgrijalva/jwt-go"

    var method = jwt.SigningMethodNone

    func main() {
      _ = method
    }
