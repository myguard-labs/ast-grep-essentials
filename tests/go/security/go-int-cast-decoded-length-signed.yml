id: go-int-cast-decoded-length-signed
valid:
  - "func f(buf []byte, off int) int {\n\tn := uint32(buf[off])<<24 | uint32(buf[off+1])<<16 | uint32(buf[off+2])<<8 | uint32(buf[off+3])\n\treturn int(n)\n}"
invalid:
  - "func f(buf []byte, off int) int {\n\tn := int(uint32(buf[off])<<24 | uint32(buf[off+1])<<16 | uint32(buf[off+2])<<8 | uint32(buf[off+3]))\n\treturn n\n}"
