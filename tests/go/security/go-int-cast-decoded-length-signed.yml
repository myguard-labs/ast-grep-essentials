id: go-int-cast-decoded-length-signed
valid:
  - "func f(buf []byte, off int) int {\n\tn := uint32(buf[off])<<24 | uint32(buf[off+1])<<16 | uint32(buf[off+2])<<8 | uint32(buf[off+3])\n\treturn int(n)\n}"
  - "func f(b []byte) int { return int(uint16(b[0])<<8 | uint16(b[1])) }"
  - "func f(b []byte) int64 { return int64(uint32(b[0])<<24 | uint32(b[1])<<16 | uint32(b[2])<<8 | uint32(b[3])) }"
invalid:
  - "func f(buf []byte, off int) int {\n\tn := int(uint32(buf[off])<<24 | uint32(buf[off+1])<<16 | uint32(buf[off+2])<<8 | uint32(buf[off+3]))\n\treturn n\n}"
  - "func f(b []byte) int { return int(uint32(b[0])<<24 | uint32(b[1])) }"
  - "func f(b []byte) int {\n\tn := int((uint32(b[0]) << 24) | uint32(b[1])<<16)\n\treturn n\n}"
  - "func f(b []byte) bool { return int(uint32(b[0])<<24|uint32(b[1])<<16|uint32(b[2])<<8|uint32(b[3])) > 1024 }"
