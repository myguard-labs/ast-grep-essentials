id: go-raw-string-literal-newline-escape
valid:
  - |
    package p

    var defaultResponse = "HTTP/1.1 200 OK\nContent-length: 2\n\nOk"
  - |-
    package p

    import "regexp"

    var version = regexp.MustCompile(`^\d+\.\d+$`)
  - |-
    package p

    var banner = `line1
    line2`
  - |-
    package p

    var homeDir = `C:\Users\admin`
  - "var s = \"HTTP/1.1 200 OK\\nContent-length: 2\""
  - "package p\n\ntype S struct {\n\tName string `json:\"name\"`\n}"
invalid:
  - |
    package p

    var defaultResponse = `HTTP/1.1 200 OK\nContent-length: 2\n\nOk`
  - |-
    package p

    import "strings"

    func lines(s string) []string {
    	return strings.Split(s, `\n`)
    }
  - |-
    package p

    import "strings"

    func norm(s string) string {
    	return strings.ReplaceAll(s, `\r\n`, "\n")
    }
  - |-
    package p

    import "fmt"

    func hello() {
    	fmt.Print(`GET / HTTP/1.1\r\nHost: example.com\r\n\r\n`)
    }
  - "var s = `HTTP/1.1 200 OK\\nContent-length: 2`"
  - "package p\n\nimport \"strings\"\n\nfunc trim(s string) string {\n\treturn strings.TrimSuffix(s, `\\r`)\n}"
  - "package p\n\nimport (\n\t\"fmt\"\n\t\"io\"\n)\n\nfunc hello(w io.Writer) {\n\tfmt.Fprint(w, `HTTP/1.1 200 OK\\r\\nContent-Length: 0\\r\\n\\r\\n`)\n}"
  - "package p\n\nvar defaultResponse = `HTTP/1.1 200 OK\\nContent-length: 2\\n\\nOk`"
