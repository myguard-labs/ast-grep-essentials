id: go-or-assign-short-circuit-skips-call
valid:
  - |-
    package p

    func f(attached bool, bind func() bool) bool {
        attached = bind() || attached
        return attached
    }
  - |-
    package p

    func f(attached bool, flag bool) bool {
    	attached = attached || flag
    	return attached
    }
  - |-
    package p

    func f(attached bool, bind func() bool) bool {
    	if bind() {
    		attached = true
    	}
    	return attached
    }
  - |-
    package p

    type state struct{ ok, flag bool }

    func f(s *state) bool {
    	s.ok = s.ok || s.flag
    	return s.ok
    }
invalid:
  - |-
    package p

    func f(attached bool, bind func() bool) bool {
        attached = attached || bind()
        return attached
    }
  - |-
    package p

    type checker struct{ bound int }

    func (c *checker) bind() bool {
    	c.bound++
    	return true
    }

    func f(c *checker, ok bool) bool {
    	ok = ok || c.bind()
    	return ok
    }
  - |-
    package p

    func f(attached bool, bind func(int, string) bool) bool {
    	attached = attached || bind(1, "x")
    	return attached
    }
  - |-
    package p

    import "bufio"

    func flush(w *bufio.Writer) bool {
    	return w.Flush() == nil
    }

    func f(done bool, w *bufio.Writer) bool {
    	done = done || flush(w)
    	return done
    }
