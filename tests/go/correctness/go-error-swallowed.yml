id: go-error-swallowed
valid:
- 'package m; func f() { v, err := g(); if err != nil { return err } }'
- 'package m; func f() { if err := g(); err != nil { return err } }'
- 'package m; func f() { v := g() }'
- 'package m; func f() { x = g() }'
- 'package m; func f() { _, err := g(); return err }'
- 'package m; func f() { _, err = g(); return err }'
- 'package m; func f() { defer func() { _ = f.Close() }() }'
- 'package m; func f() { _ = conn.SetReadDeadline(t) }'
- 'package m; func f() { _ = f.Close() }'
- 'package m; func f() { _, _ = file.Close(), conn.SetDeadline(t) }'
- 'package m; func f() { _, ok := c.Get(k); use(ok) }'
- 'package m; func f() { _, ok1 := c.Get(k); use(ok1) }'
- 'package m; func f() { _, okJSON := c.Get(k); use(okJSON) }'
- 'package m; func f() { _, e = io.Copy(dst, src); return e }'
- 'package m; // _ = g()'
invalid:
- 'package m; func f() { _ = strconv.Atoi(s) }'
- 'package m; func f() { v, _ := strconv.Atoi(s) }'
- 'package m; func f() { _, _ = w.Write(b) }'
- 'package m; func f() { _ = consume(file.Close()) }'
- 'package m; func f() { _, _ = risky(), file.Close() }'
- 'package m; func f() { _, _ = file.Close(), <-ch }'
