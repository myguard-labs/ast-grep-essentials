id: go-address-of-range-value-variable
valid:
  - "package p\n\nfunc f(ings []Ing) {\n\tfor i := range ings {\n\t\tprocess(&ings[i])\n\t}\n}"
  - |
    package p

    type Ing struct{ Name string }

    func process(p *Ing) { _ = p.Name }

    func f(ptrs []*Ing) {
    	for _, ing := range ptrs {
    		process(ing)
    	}
    }
  - |
    package p

    type Ing struct{ Name string }

    func process(p *Ing) { _ = p.Name }

    func f(ings []Ing) {
    	for i := range ings {
    		p := &ings[i]
    		process(p)
    	}
    }
  - |
    package p

    type Ing struct{ Name string }

    func process(p *Ing) { _ = p.Name }

    func f(ings []Ing) {
    	for _, ing := range ings {
    		cp := ing
    		cp.Name += "-x"
    		process(&cp)
    	}
    }
  - |
    package p

    type Ing struct{ Name string }

    func process(p *Ing) { _ = p.Name }

    var ptrs []*Ing
    var byName = map[string]*Ing{}

    func use(p *Ing) { ptrs = append(ptrs, p) }

    func f(ings []Ing) {
    	for _, v := range ings {
    		v := v
    		ptrs = append(ptrs, &v)
    	}
    }
  - |
    package p

    type Ing struct{ Name string }

    func process(p *Ing) { _ = p.Name }

    var ptrs []*Ing
    var byName = map[string]*Ing{}

    func use(p *Ing) { ptrs = append(ptrs, p) }

    func f(ing Ing) {
    	process(&ing)
    }
invalid:
  - "package p\n\nfunc f(ings []Ing) {\n\tfor _, ing := range ings {\n\t\tprocess(&ing)\n\t}\n}"
  - |
    package p

    type Ing struct{ Name string }

    func process(p *Ing) { _ = p.Name }

    var ptrs []*Ing
    var byName = map[string]*Ing{}

    func use(p *Ing) { ptrs = append(ptrs, p) }

    func f(ings []Ing) {
    	for _, v := range ings {
    		ptrs = append(ptrs, &v)
    	}
    }
  - |
    package p

    type Ing struct{ Name string }

    func process(p *Ing) { _ = p.Name }

    var ptrs []*Ing
    var byName = map[string]*Ing{}

    func use(p *Ing) { ptrs = append(ptrs, p) }

    func f(ings []Ing) {
    	for i, v := range ings {
    		if v.Name != "" {
    			byName[ings[i].Name] = &v
    		}
    	}
    }
  - |
    package p

    type Ing struct{ Name string }

    func process(p *Ing) { _ = p.Name }

    var ptrs []*Ing
    var byName = map[string]*Ing{}

    func use(p *Ing) { ptrs = append(ptrs, p) }

    func f(ings []Ing) {
    	for _, v := range ings {
    		go func() { use(&v) }()
    	}
    }
  - |
    package p

    type Ing struct{ Name string }

    func process(p *Ing) { _ = p.Name }

    var ptrs []*Ing
    var byName = map[string]*Ing{}

    func use(p *Ing) { ptrs = append(ptrs, p) }

    func f(ings []Ing) {
    	for _, v := range ings {
    		switch v.Name {
    		case "keep":
    			use(&v)
    		}
    	}
    }
  - |
    package p

    type Ing struct{ Name string }

    func process(p *Ing) { _ = p.Name }

    var ptrs []*Ing
    var byName = map[string]*Ing{}

    func use(p *Ing) { ptrs = append(ptrs, p) }

    func f(ings []Ing) {
    	for _, v := range ings {
    		ptrs = append(ptrs, &v)
    	}
    	for i := range ings {
    		ptrs = append(ptrs, &ings[i])
    	}
    }
