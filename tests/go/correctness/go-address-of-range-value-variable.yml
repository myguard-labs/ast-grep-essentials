id: go-address-of-range-value-variable
valid:
  - "package p\n\nfunc f(ings []Ing) {\n\tfor i := range ings {\n\t\tprocess(&ings[i])\n\t}\n}"
  - |
    package p

    type Ing struct{ Name string }

    func process(p *Ing) { _ = p.Name }

    func f(ptrs []*Ing) {
    	for _, ing := range ptrs {
    		process(ing)
    	}
    }
  - |
    package p

    type Ing struct{ Name string }

    func process(p *Ing) { _ = p.Name }

    func f(ings []Ing) {
    	for i := range ings {
    		p := &ings[i]
    		process(p)
    	}
    }
  - |
    package p

    type Ing struct{ Name string }

    func process(p *Ing) { _ = p.Name }

    func f(ings []Ing) {
    	for _, ing := range ings {
    		cp := ing
    		cp.Name += "-x"
    		process(&cp)
    	}
    }
invalid:
  - "package p\n\nfunc f(ings []Ing) {\n\tfor _, ing := range ings {\n\t\tprocess(&ing)\n\t}\n}"
