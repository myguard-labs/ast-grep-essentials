  - "package p\n\nimport \"github.com/containernetworking/plugins/pkg/ns\"\n\nfunc f() error {\n\torig, err := ns.GetCurrentNS()\n\tif err != nil {\n\t\treturn err\n\t}\n\treturn orig.Do(func(_ ns.NetNS) error { return nil })\n}\n"
  - "package p\n\nimport \"github.com/containernetworking/plugins/pkg/ns\"\n\nfunc f(path string) error {\n\tcur, err := ns.GetCurrentNS()\n\tif err != nil {\n\t\treturn err\n\t}\n\ttarget, err := ns.GetNS(path)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer target.Close()\n\treturn target.Do(func(_ ns.NetNS) error { return cur.Set() })\n}"
