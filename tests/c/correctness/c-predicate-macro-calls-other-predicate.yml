id: c-predicate-macro-calls-other-predicate
valid:
  - '#define isinf(x) _isinf(x)'
  - '#define isnan(x) _isnan(x)'
  - '#define isinf(x) __builtin_isinf(x)'
  - '#define isinf(x) isinf_impl(x)'
invalid:
  - '#define isinf(x) _isnan(x)'
  - '#define isinf(x) isnan(x)'
  - '#define isinf(x) isnan (x)'
