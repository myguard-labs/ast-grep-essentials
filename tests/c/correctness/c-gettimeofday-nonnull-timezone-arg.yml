id: c-gettimeofday-nonnull-timezone-arg
valid:
  - 'struct timeval tp; gettimeofday(&tp, NULL);'
  - 'int f(void) { struct timeval tv; return gettimeofday(&tv, NULL); }'
  - 'int f(void) { struct timeval tv; return gettimeofday(&tv, 0); }'
  - 'int f(struct timeval *tv) { return gettimeofday(tv, NULL); }'
invalid:
  - 'struct timezone tz; gettimeofday(&tp, &tz);'
  - 'int f(void) { struct timeval tv; struct timezone tz; return gettimeofday(&tv, &tz); }'
  - 'int f(struct timeval *tv) { struct timezone tz; if (gettimeofday(tv, &tz) != 0) return -1; return 0; }'
  - 'struct timezone gtz; int f(struct timeval *tv) { return gettimeofday(tv, &gtz); }'
