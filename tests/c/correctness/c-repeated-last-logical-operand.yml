id: c-repeated-last-logical-operand
valid:
  - >-
    int f(const int *s) { if (s[0] < 0 && s[1] > 0 && s[2] > 0) return 1; return
    0; }
  - |-
    int f(int x, int y, int z) {
      if (x > 0 && y > 0 && z > 0) return 1;
      return 0;
    }
  - |-
    int f(const int *p, int max) {
      if (p && p[0] > 0 && p[0] < max) return 1;
      return 0;
    }
  - |-
    int f(int a, int b, int c, int d) {
      if (a < 0 && b < 0 && c < 0 && d < 0) return 1;
      return 0;
    }
invalid:
  - >-
    int f(const int *s) { if (s[0] < 0 && s[1] > 0 && s[1] > 0) return 1; return
    0; }
  - |-
    int f(int x, int y) {
      if (x > 0 && y > 0 && y > 0) return 1;
      return 0;
    }
  - |-
    int f(int a, int b, int c) {
      if (a < 0 && b < 0 && c < 0 && c < 0) return 1;
      return 0;
    }
  - |-
    int f(const int *p, const int *q) {
      while (p != NULL && q != NULL && q != NULL) {
        return 1;
      }
      return 0;
    }
