id: c-openssl-version-guard-no-libressl
valid:
  - |-
    #if OPENSSL_VERSION_NUMBER < 0x10100000L || defined (LIBRESSL_VERSION_NUMBER)
    int g(void) { return 0; }
    #endif
  - |-
    #if OPENSSL_VERSION_NUMBER < 0x10100000L && !defined(LIBRESSL_VERSION_NUMBER)
    int g(void) { return 0; }
    #endif
  - |-
    #if OPENSSL_VERSION_NUMBER < 0x10100000L || (defined(LIBRESSL_VERSION_NUMBER) && LIBRESSL_VERSION_NUMBER < 0x2070000fL)
    int g(void) { return 0; }
    #endif
  - |-
    #if OPENSSL_VERSION_NUMBER >= 0x10100000L
    int g(void) { return 0; }
    #endif
invalid:
  - |-
    #if OPENSSL_VERSION_NUMBER < 0x10100000L
    int g(void) { return 0; }
    #endif
  - |-
    #if OPENSSL_VERSION_NUMBER < 0x10002000L
    int g(void) { return 0; }
    #endif
  - |-
    #if defined(OPENSSL_VERSION_NUMBER) && OPENSSL_VERSION_NUMBER < 0x10100000L
    int g(void) { return 0; }
    #endif
  - |-
    #if OPENSSL_VERSION_NUMBER<0x10100000L || defined(HAVE_OLD_SSL)
    int g(void) { return 0; }
    #else
    int g(void) { return 1; }
    #endif
