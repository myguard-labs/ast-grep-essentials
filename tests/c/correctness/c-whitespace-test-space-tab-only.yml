id: c-whitespace-test-space-tab-only
valid:
  - >-
    static int f(const char *p) { if (*p != ' ' && *p != 'x') { return 0; }
    return 1; }
  - |-
    #include <ctype.h>
    static const char *skip_blank(const char *p) {
        while (*p != '\0' && isspace((unsigned char) *p)) {
            p++;
        }
        return p;
    }
  - |-
    static int not_space(int c) {
        return !(c == ' ' || c == '\t' || c == '\n' || c == '\r' || c == '\v' || c == '\f');
    }
  - |-
    #include <stddef.h>
    #include <string.h>
    static int is_other(int c) {
        return c != 0 && strchr(" \t\r\n\v\f", c) == NULL;
    }
invalid:
  - >-
    static int f(const char *p) { if (*p != ' ' && *p != '\t') { return 0; }
    return 1; }
  - |-
    static int not_blank(int c) {
        if (c != ' ' && c != '\t') {
            return 1;
        }
        return 0;
    }
  - |-
    static const char *find_blank(const char *p) {
        while (*p != ' ' && *p != '\t' && *p != '\0') {
            p++;
        }
        return p;
    }
  - |-
    static int first_word_len(const char *s, int n) {
        int i = 0;
        while (i < n && (s[i] != ' ' && s[i] != '\t')) {
            i++;
        }
        return i;
    }
