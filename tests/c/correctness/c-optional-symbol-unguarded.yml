id: c-optional-symbol-unguarded
valid:
  - |-
    #ifdef HAVE_RAND_EGD
    int seed_pool(const char *path) { return RAND_egd(path); }
    #endif
  - |-
    #if defined(HAVE_RAND_EGD)
    int seed_pool(const char *path) { return RAND_egd(path); }
    #endif
  - |-
    #ifndef LIBRESSL_VERSION_NUMBER
    int seed_pool(const char *path) {
      int r = RAND_egd(path);
      return r;
    }
    #endif
  - |-
    int seed_pool(const char *path) {
    #ifdef HAVE_RAND_EGD
      return RAND_egd(path);
    #else
      return -1;
    #endif
    }
invalid:
  - 'int seed_pool(const char *path) { return RAND_egd(path); }'
  - |-
    int seed_pool(const char *path) {
      int r = RAND_egd(path);
      return r;
    }
  - |-
    int seed_pool(const char *path) {
      if (RAND_egd(path) < 0) {
        return -1;
      }
      return 0;
    }
  - |-
    #ifdef HAVE_RAND_EGD
    int a(void) { return 1; }
    #endif
    int seed_pool(const char *path) { return RAND_egd(path); }
