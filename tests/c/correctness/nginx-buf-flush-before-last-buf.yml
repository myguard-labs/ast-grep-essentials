id: nginx-buf-flush-before-last-buf
valid:
- void f(void) { if (in->last_buf) { ctx->last = 1; } else if (in->flush) { ctx->flush = 1; } }
- void f(void) { if (in->flush) { ctx->flush = 1; } if (in->last_buf) { ctx->last = 1; } }
- void f(void) { if (in->flush) { ctx->flush = 1; } else if (other->last_buf) { ctx->last = 1; } }
- void f(void) { if (in->flush) { ctx->flush = 1; } else { ctx->last = in->last_buf; } }
- void f(void) { if (in->flush && !in->last_buf) { ctx->flush = 1; } else if (in->last_buf) { ctx->last = 1; } }
- /* void f(void) { if (in->flush) { ctx->flush = 1; } else if (in->last_buf) { ctx->last = 1; } } */
- void f(void) { const char *t = "if (in->flush) { } else if (in->last_buf) { }"; }
invalid:
- void f(void) { if (in->flush) { ctx->flush = 1; } else if (in->last_buf) { ctx->last = 1; } }
- void f(void) { if (ctx->in_buf->flush) ctx->flush = 1; else if (ctx->in_buf->last_buf) ctx->last = 1; }
- void f(void) { if (b.flush) { x(); } else if (b.last_buf) { y(); } }
