id: c-dtor-call-commented-out
valid:
  - |-
    void f(zval *v) {
      zval_ptr_dtor(&v);
    }
  - |-
    void f(zval *v) {
      // zval_ptr_dtor releases the value in the caller
      g(v);
    }
  - |-
    // zval_ptr_dtor(&v);
    void f(zval *v) {
      g(v);
    }
  - |-
    void f(zval *v) {
      g(v);
      zval_ptr_dtor(v); // release
    }
