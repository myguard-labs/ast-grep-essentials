id: c-empty-translation-unit-guard
valid:
  - |-
    #ifndef FOO_X
    int f_x(void);
    #endif
    int g(void);
  - |-
    #include <stdio.h>
    #ifdef FOO
    int a;
    #endif
  - |-
    int g(void);
    #ifdef FOO
    int a;
    #endif
  - |-
    #ifdef FOO
    int a;
    #endif
    int g(void) { return 0; }
  - |-
    #ifndef FOO_H
    #define FOO_H
    int f(void);
    #endif
  - |-
    #ifdef A
    int a;
    #else
    int b;
    #endif
invalid:
  - |-
    #ifndef FOO_X
    int f_x(void);
    #endif
  - |-
    #ifdef A
    #ifdef B
    int a;
    #endif
    #endif
  - |-
    #ifdef FOO
    int a;
    int b;
    #endif
  - |-
    #ifndef FOO
    void f(void) { }
    #endif
  - |-
    #ifdef A
    #define F(x) (x)
    #else
    int b;
    #endif
