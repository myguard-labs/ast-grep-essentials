id: c-prototype-bare-identifier-params
valid:
  - 'int php_sys_readlink(const char *link, char *target, size_t target_len);'
  - 'int f(void);'
  - 'void cb(int, char *);'
  - 'int f(int a, unsigned b);'
invalid:
  - 'int php_sys_readlink(link, target, target_len);'
  - 'int f(a);'
  - 'int f(fd, flags);'
  - 'static int f(path, mode);'
