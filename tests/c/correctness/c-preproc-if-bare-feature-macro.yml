id: c-preproc-if-bare-feature-macro
valid:
  - |-
    #ifdef HAVE_FOO
    int x;
    #endif
  - |-
    #if defined(HAVE_FOO)
    int x;
    #endif
  - |-
    #ifndef HAVE_FOO
    int x;
    #endif
invalid:
  - |-
    #if HAVE_FOO
    int x;
    #endif
  - |-
    #if HAVE_SYS_SELECT_H
    int x;
    #endif
  - |-
    #if HAVE_LIBGD20
    int x;
    #else
    int y;
    #endif
