id: c-css-important-after-semicolon
valid:
  - 'char *css = "td { color: red !important; }";'
  - "char *css = \"a { color: red; }\";"
  - "char *css = \"p { margin: 0 !important; padding: 0 !important; }\";"
  - "char *css = \"a { color: red;\" \" color: blue !important; }\";"
invalid:
  - 'char *css = "td { color: red; !important }";'
  - "char *css = \"a { margin: 0;!important }\";"
  - "char *css = \"a { margin: 0;  !important; }\";"
  - "void f(void) { puts(\"b { color: blue; !important }\"); }"
