id: c-arg-info-duplicate-parameter-name
valid:
  - |-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_f, 0, 0, 2)
        ZEND_ARG_INFO(0, context)
        ZEND_ARG_INFO(0, stream_context)
    ZEND_END_ARG_INFO()
  - |-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_a, 0, 0, 1)
        ZEND_ARG_INFO(0, context)
    ZEND_END_ARG_INFO()

    ZEND_BEGIN_ARG_INFO_EX(arginfo_b, 0, 0, 1)
        ZEND_ARG_INFO(0, context)
    ZEND_END_ARG_INFO()
  - |-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_one, 0, 0, 1)
        ZEND_ARG_INFO(0, context)
    ZEND_END_ARG_INFO()
  - |-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_typed, 0, 0, 2)
        ZEND_ARG_TYPE_INFO(0, name, IS_STRING, 0)
        ZEND_ARG_INFO(0, context)
    ZEND_END_ARG_INFO()
  - |-
    ZEND_BEGIN_ARG_WITH_RETURN_TYPE_INFO_EX(arginfo_a, 0, 1, IS_STRING, 0)
        ZEND_ARG_TYPE_INFO(0, context, IS_STRING, 0)
    ZEND_END_ARG_INFO()

    ZEND_BEGIN_ARG_WITH_RETURN_TYPE_INFO_EX(arginfo_b, 0, 1, IS_STRING, 0)
        ZEND_ARG_TYPE_INFO(0, context, IS_STRING, 0)
    ZEND_END_ARG_INFO()
  - |-
    ZEND_BEGIN_ARG_INFO(arginfo_c, 0)
        ZEND_ARG_INFO(0, x)
    ZEND_END_ARG_INFO()

    ZEND_BEGIN_ARG_INFO(arginfo_d, 0)
        ZEND_ARG_INFO(0, x)
    ZEND_END_ARG_INFO()
invalid:
  - |-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_f, 0, 0, 2)
        ZEND_ARG_INFO(0, context)
        ZEND_ARG_INFO(0, context)
    ZEND_END_ARG_INFO()
  - |-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_g, 0, 0, 3)
        ZEND_ARG_INFO(0, context)
        ZEND_ARG_INFO(0, options)
        ZEND_ARG_INFO(0, context)
    ZEND_END_ARG_INFO()
  - |-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_h, 0, 0, 2)
        ZEND_ARG_INFO(0, name)
        ZEND_ARG_TYPE_INFO(0, name, IS_STRING, 0)
    ZEND_END_ARG_INFO()
  - |-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_ok, 0, 0, 1)
        ZEND_ARG_INFO(0, context)
    ZEND_END_ARG_INFO()

    ZEND_BEGIN_ARG_INFO_EX(arginfo_bad, 0, 0, 2)
        ZEND_ARG_TYPE_INFO(0, flags, IS_LONG, 0)
        ZEND_ARG_TYPE_INFO(1, flags, IS_LONG, 0)
    ZEND_END_ARG_INFO()
  - |-
    ZEND_BEGIN_ARG_WITH_RETURN_TYPE_INFO_EX(arginfo_e, 0, 2, IS_STRING, 0)
        ZEND_ARG_TYPE_INFO(0, y, IS_STRING, 0)
        ZEND_ARG_INFO(0, y)
    ZEND_END_ARG_INFO()
