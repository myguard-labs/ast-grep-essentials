id: c-arg-info-duplicate-parameter-name
valid:
  - >-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_f, 0, 0, 2)\nZEND_ARG_INFO(0,
    context)\nZEND_ARG_INFO(0, stream_context)\nZEND_END_ARG_INFO()
  - 'ZEND_BEGIN_ARG_INFO_EX(arginfo_f, 0, 0, 1)\nZEND_ARG_INFO(0, a)\nZEND_END_ARG_INFO()'
  - 'ZEND_BEGIN_ARG_INFO_EX(arginfo_f, 0, 0, 3)\nZEND_ARG_INFO(0, a)\nZEND_ARG_INFO(0, b)\nZEND_ARG_INFO(0, c)\nZEND_END_ARG_INFO()'
  - 'ZEND_BEGIN_ARG_INFO_EX(arginfo_f, 0, 0, 2)\nZEND_ARG_INFO(1, a)\nZEND_ARG_INFO(0, b)\nZEND_END_ARG_INFO()'
  - 'ZEND_BEGIN_ARG_INFO_EX(arginfo_f, 0, 0, 2)\nZEND_ARG_INFO(0, a)\nZEND_ARG_INFO(0, ab)\nZEND_END_ARG_INFO()'
invalid:
  - >-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_f, 0, 0, 2)\nZEND_ARG_INFO(0,
    context)\nZEND_ARG_INFO(0, context)\nZEND_END_ARG_INFO()
  - 'ZEND_BEGIN_ARG_INFO_EX(arginfo_f, 0, 0, 2)\nZEND_ARG_INFO(0, a)\nZEND_ARG_INFO(1, a)\nZEND_END_ARG_INFO()'
  - 'ZEND_BEGIN_ARG_INFO_EX(arginfo_f, 0, 0, 3)\nZEND_ARG_INFO(0, a)\nZEND_ARG_INFO(0, b)\nZEND_ARG_INFO(0, a)\nZEND_END_ARG_INFO()'
  - 'ZEND_BEGIN_ARG_INFO_EX(arginfo_f, 0, 0, 3)\nZEND_ARG_INFO(0, a)\nZEND_ARG_INFO(0, a)\nZEND_ARG_INFO(0, a)\nZEND_END_ARG_INFO()'
