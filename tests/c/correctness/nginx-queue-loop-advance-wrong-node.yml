id: nginx-queue-loop-advance-wrong-node
valid:
  - >-
    ngx_queue_t *q; for (q = ngx_queue_head(&h->pushing); q !=
    ngx_queue_sentinel(&h->pushing); q = ngx_queue_next(q)) { ; }
  - 'void f(ngx_queue_t *h) { ngx_queue_t *q, *n; for (q = ngx_queue_head(&h->pushing); q != ngx_queue_sentinel(&h->pushing); q = n) { n = ngx_queue_next(q); ngx_queue_remove(q); } }'
  - 'void f(ngx_queue_t *h, int cnt) { ngx_queue_t *q; for (q = ngx_queue_head(&h->waiting); q != ngx_queue_sentinel(&h->waiting); q = ngx_queue_next(q)) { cnt++; } }'
  - 'void f(ngx_queue_t *h) { ngx_queue_t *q; for (q = ngx_queue_head(&h->pushing); q != ngx_queue_sentinel(&h->pushing); q = ngx_queue_next(q)) { if (q == NULL) { break; } } }'

invalid:
  - >-
    ngx_queue_t *q; for (q = ngx_queue_head(&h->pushing); q !=
    ngx_queue_sentinel(&h->pushing); q = ngx_queue_next(&h->pushing)) { ; }
  - 'void f(ngx_queue_t *h) { ngx_queue_t *q; for (q = ngx_queue_head(&h->pushing); q != ngx_queue_sentinel(&h->pushing); q = ngx_queue_next(&h->pushing)) { ngx_queue_remove(q); } }'
  - 'void f(ngx_queue_t *h) { ngx_queue_t *q; for (q = ngx_queue_head(&h->pushing); q != ngx_queue_sentinel(&h->pushing); q = ngx_queue_next(&h->pushing)); }'
  - 'void f(ngx_queue_t *h) { ngx_queue_t *q; for (q = ngx_queue_head(&h->pushing); q != ngx_queue_sentinel(&h->pushing); q = ngx_queue_next(&h->pushing)) { if (q == NULL) { break; } } }'
