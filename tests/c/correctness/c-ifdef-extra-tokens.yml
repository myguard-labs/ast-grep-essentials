id: c-ifdef-extra-tokens
valid:
  - |-
    #ifdef FOO
    int x;
    #endif
  - |-
      #ifndef FOO_H
      #define FOO_H
      int x;
      #endif
  - |-
      #ifdef FOO /* why */
      int x;
      #endif
  - |-
      #ifdef FOO // why
      int x;
      #endif
  - |-
      #if defined(FOO) && defined(BAR)
      int x;
      #endif
  - |-
    #if PHP_WIN32 && ZTS
    #endif
  - |-
    #ifdef PHP_WIN32
    #endif
  - |-
    #ifndef FOO
    int x;
    #endif
  - |-
    #ifdef A
    int x = a && b;
    #endif
  - |-
    #ifdef A
    int x;
    #else
    int y = a || b;
    #endif
  - |-
    #if defined(A) && defined(B)
    int x;
    #endif
  - |-
    #ifdef HAVE_IMAP_KRB
    int x;
    #endif
  - |-
    #ifdef FOO // note
    int x;
    #endif
  - |-
    #ifndef FOO /* note */
    int x;
    #endif
  - |-
    #ifndef FOO
    #define FOO 1 2
    #endif
  - |-
    #ifdef A0
    int x;
    #endif
  - |-
    #ifdef A0 // note
    int x;
    #endif
  - |-
    #ifndef A0 /* note */
    int x;
    #endif
  - |-
    #  ifdef A0
    int x = 1 && 2;
    #endif
  - |-
    #ifdef PHP_DEBUG
    int x;
    #endif
  - |-
    #if !(WIN32||WINNT)
    #define X 1
    #endif
  - |-
    #if !defined(A) && !defined(B)
    int x;
    #endif
  - |-
    #ifndef FOO // a || b
    int x;
    #endif
  - |-
    #ifndef FOO
    int x = a || b;
    #endif
invalid:
  - |-
    #ifdef FOO && BAR
    int x;
    #endif
  - |-
      #ifndef FOO && BAR
      int x;
      #endif
  - |-
      #ifdef FOO BAR
      int x;
      #endif
  - |-
      #  ifdef FOO || BAR
      int x;
      #endif
  - |-
      #ifdef A
      #ifndef FOO BAR
      int x;
      #endif
      #endif
  - |-
      void f(void) {
      #ifdef FOO && BAR
        g();
      #endif
      }
  - |-
    #ifdef PHP_WIN32 && ZTS
    #endif
  - |-
    #ifndef A || B
    int x;
    #endif
  - |-
    #ifdef FOO == 1
    int x;
    #endif
  - |-
    #ifdef FOO&&BAR
    int x;
    #endif
  - |-
    #ifdef FOO(X)
    int x;
    #endif
  - |-
    #ifndef FOO || BAR
    int x;
    #endif
  - |-
    #ifdef A||B
    int x;
    #endif
  - |-
    #  ifdef A && B
    int x;
    #endif
  - |-
    #ifdef HAVE_IMAP_KRB && defined(HAVE_IMAP_AUTH_GSS)
    int x;
    #endif
  - |-
    #ifdef FOO (BAR)
    int x;
    #endif
  - |-
    #ifndef FOO && defined(BAR)
    int x;
    #endif
  - |-
    #ifndef FOO	&& defined(BAR)
    int x;
    #endif
  - |-
    #ifdef A0 && MYSQL_USE_MYSQLND
    int x;
    #endif
  - |-
    #ifndef A0 || B0
    int x;
    #endif
  - |-
    #ifdef A0 B0
    int x;
    #endif
  - |-
    #ifdef A0&&B0
    int x;
    #endif
  - |-
    #ifdef PHP_DEBUG || defined(MYSQLND_THREADED)
    int x;
    #endif
  - |-
    #ifdef FOO defined(BAR)
    int x;
    #endif
  - |-
    #ifndef WIN32||WINNT
    #define X 1
    #endif
  - |-
    #ifndef A && B
    int x;
    #endif
  - |-
    #  ifndef A || B
    int x;
    #endif
  - |-
    #ifndef A	&& B
    int x;
    #endif
