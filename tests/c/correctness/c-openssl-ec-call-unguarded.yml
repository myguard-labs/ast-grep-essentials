id: c-openssl-ec-call-unguarded
valid:
  - |-
    #ifndef OPENSSL_NO_EC
    int f(EVP_PKEY *k) { return EC_KEY_can_sign(EVP_PKEY_get0_EC_KEY(k)); }
    #endif
  - |-
    int f(EVP_PKEY *k) {
    #ifndef OPENSSL_NO_EC
        return EC_KEY_can_sign(EVP_PKEY_get0_EC_KEY(k));
    #else
        return 0;
    #endif
    }
  - |-
    #ifdef OPENSSL_NO_EC
    int f(EVP_PKEY *k) { return 0; }
    #else
    int f(EVP_PKEY *k) { return EC_KEY_can_sign(EVP_PKEY_get0_EC_KEY(k)); }
    #endif
  - 'int f(EVP_PKEY *k) { return EVP_PKEY_id(k); }'
invalid:
  - 'int f(EVP_PKEY *k) { return EC_KEY_can_sign(EVP_PKEY_get0_EC_KEY(k)); }'
  - 'void g(EC_KEY *e) { EC_KEY_free(e); }'
  - 'int f(const EC_GROUP *g) { return EC_GROUP_get_degree(g); }'
  - |-
    #ifndef OPENSSL_NO_RSA
    int f(EVP_PKEY *k) { return EC_KEY_can_sign(EVP_PKEY_get0_EC_KEY(k)); }
    #endif
  - 'EC_KEY *f(EVP_PKEY *k) { return EVP_PKEY_get0_EC_KEY(k); }'
