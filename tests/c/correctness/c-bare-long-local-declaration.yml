id: c-bare-long-local-declaration
valid:
  - 'void f(void) { zend_long elements; }'
  - "void f(void) { double elements; }"
  - "void f(void) { uint64_t mask; }"
  - "void f(void) { int64_t elements; }"
  - "void f(void) { short s; char c; }"
invalid:
  - 'void f(void) { long elements; }'
  - "void f(int c) { if (c) { long elements; } }"
  - "void f(int c) { while (c--) { long n; } }"
  - "int f(void) { long a; long b; return 0; }"
  - "void f(int c) { switch (c) { case 1: { long n; break; } } }"
