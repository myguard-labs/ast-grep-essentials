id: c-init-macro-enum-mismatch
valid:
  - '#define AP_INIT_TAKE3(d, f, m, w, h) { d, { .take3 = f }, m, w, TAKE3, h }'
  - '#define AP_INIT_TAKE2(d, f, m, w, h) { d, { .take2 = f }, m, w, TAKE2, h }'
  - '#define AP_INIT_TAKE23(d, f, m, w, h) { d, { .take2 = f }, m, w, TAKE23, h }'
  - '#define CMD_TAKE3(d, f, m, w, h) { d, { .take3 = f }, m, w, TAKE3, h }'
invalid:
  - '#define AP_INIT_TAKE3(d, f, m, w, h) { d, { .take3 = f }, m, w, TAKE23, h }'
  - '#define AP_INIT_TAKE3(d, f, m, w, h) { d, { .take3 = f }, m, w, TAKE1, h }'
  - '#define CMD_TAKE3(d, f, m, w, h) { d, { .take3 = f }, m, w, TAKE2, h }'
  - '#define AP_INIT_TAKE3(d, f, m, w, h) { d, { .take3 = f }, m, w, TAKE13, h }'
