id: c-label-before-closing-brace
valid:
  - 'void f(int s) { switch (s) { case 0: ; } }'
  - 'void f(int s) { switch (s) { case 0: break; default: ; } }'
  - 'void f(int s) { switch (s) { case 0: { } } }'
  - 'int f(int s) { switch (s) { case 0: return 1; default: return 0; } }'
  - 'void f(int s) { switch (s) { case 0: case 1: s++; break; } }'
  - 'void f(int s) { switch (s) { case 0: default: s++; } }'
