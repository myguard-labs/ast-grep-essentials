  - |-
    void f(int s) {
      while (s) {
        switch (s) {
        case 3:
          break;
        default:
        }
      }
    }
  - 'void f(int s) { switch (s) { case 0: case 1: } }'
  - 'void f(int s) { switch (s) { case 0: s++; break; case 1: case 2: } }'
  - 'void f(int s) { switch (s) { case 0: switch (s) { case 1: case 2: s++; } break; case 3: } }'
