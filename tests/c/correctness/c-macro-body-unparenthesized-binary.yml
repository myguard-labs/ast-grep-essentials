id: c-macro-body-unparenthesized-binary
valid:
  - '#define CONV(l) (((l & 0xff) << 24) + ((l & 0xff) >> 8))'
  - "#define SUM(a, b) ((a) + (b))"
  - "#define BIT(n) (1U << (n))"
  - "#define CAST_ID(x) ((unsigned) (x))"
invalid:
  - '#define CONV(l) ((l & 0xff) << 24) + ((l & 0xff) >> 8)'
  - "#define SUM(a, b) (a) + (b)"
  - "#define SHL(a, n) (a) << (n)"
  - "#define MASK_OR(a) ((a) & 0xff) | 0x100"
