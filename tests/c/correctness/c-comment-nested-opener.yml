id: c-comment-nested-opener
valid:
  - |-
    int a;
    /* deprecated */
    int b;
    /* end */
  - |-
    int a; /* first */ int b; /* second */
  - |-
    int a;
    /*
     * multi-line comment
     * without a nested opener
     */
    int b;
  - |-
    char *s = "/* a /* b */";
    int a; // see /* here /* there
invalid:
  - |-
    int a;
    /* deprecated /*
    int b;
    /* end */
  - |-
    int a;
    /* old /* new */
    int b;
  - |-
    int a; /* x /* y */ int b;
  - |-
    int a;
    /* start of block /* inner
       more */
    int b;
