id: c-unaligned-wide-load-through-byte-pointer
valid:
  - >-
    unsigned long long f(const unsigned char *p) { unsigned long long v;
    memcpy(&v, p, sizeof v); return v; }
  - |-
    unsigned long long f(const unsigned char *p) { return ((unsigned long long)p[0]) | ((unsigned long long)p[1] << 8) | ((unsigned long long)p[2] << 16) | ((unsigned long long)p[3] << 24) | ((unsigned long long)p[4] << 32) | ((unsigned long long)p[5] << 40) | ((unsigned long long)p[6] << 48) | ((unsigned long long)p[7] << 56); }
  - |-
    unsigned long long f(const unsigned long long *q, int i) { return q[i]; }
  - |-
    unsigned char f(const unsigned char *p) { return *(unsigned char *)p; }
invalid:
  - >-
    unsigned long long f(const unsigned char *p) { return *(unsigned long long
    *)p; }
  - |-
    unsigned long long f(const unsigned char *p, int off) { return *(unsigned long long *)(p + off); }
  - |-
    unsigned long long f(const unsigned char *p, int n) { unsigned long long x = 0; while (n >= 8) { x ^= *(unsigned long long *)p; p += 8; n -= 8; } return x; }
  - |-
    int f(const unsigned char *p, unsigned long long key) { return *(unsigned long long *)p == key; }
