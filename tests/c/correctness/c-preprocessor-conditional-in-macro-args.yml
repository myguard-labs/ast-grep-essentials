id: c-preprocessor-conditional-in-macro-args
valid:
  - |-
    void f(void) {
    #ifdef FOO
     REGISTER_LONG_CONSTANT("X", 1, CONST_CS);
    #else
     REGISTER_LONG_CONSTANT("X", 0, CONST_CS);
    #endif
    }
  - |-
    #define SUM(a, b) ((a) + (b))
    int g(int x) {
        int r = SUM(x, 1);
    #ifdef FOO
        r += 1;
    #endif
        return r;
    }
  - |-
    #define SUM(a, b) ((a) + (b))
    int g(int x) {
    #ifdef FOO
        int v = 1;
    #else
        int v = 0;
    #endif
        return SUM(x,
                   v);
    }
  - |-
    int unbraced_if(int x) {
        if (x)
    #ifdef FOO
            x++;
    #endif
        return x;
    }
  - |-
    int unbraced_while(int x) {
        while (x > 0)
    #if defined(FOO)
            x--;
    #else
            x -= 2;
    #endif
        return x;
    }
  - |-
    int double_paren_if(int x) {
        if ((x))
    #if defined(FOO)
            x++;
    #endif
        return x;
    }
  - |-
    int paren_char_if(int c) {
        if (c == '(')
    #ifdef FOO
            c++;
    #endif
        return c;
    }
  - |
    #ifdef FOO
    int f(int a, int b) { return g(a, b); }
    #endif
  - |
    int f(unsigned a)
    {
        unsigned r = a;
    #ifdef FOO
        r += 1;
    #endif
        return (int) r;
    }
  - |
    int g(int);
    int h(int);
    #if defined(FOO)
    int f(int a) { return g(a); }
    #else
    int f(int a) { return h(a); }
    #endif
  - |
    #define CALL(a, b) ((a) + (b))
    #ifdef FOO
    #define EXTRA 1
    #else
    #define EXTRA 0
    #endif
    int f(int a) { return CALL(a, EXTRA); }
invalid:
  - |-
    void f(void) { REGISTER_LONG_CONSTANT("X",
    #ifdef FOO
     1
    #else
     0
    #endif
    , CONST_CS); }
  - |-
    #define SUM(a, b) ((a) + (b))
    int g(int x) {
        return SUM(x,
    #ifndef BIG
                   1
    #else
                   2
    #endif
                   );
    }
  - |-
    #define SUM(a, b) ((a) + (b))
    int g(int x) {
        return SUM(x,
      #  if defined(FOO)
                   1
      #  elif defined(BAR)
                   2
      #  else
                   3
      #  endif
                   );
    }
  - |-
    int add(int a, int b) { return a + b; }
    int neg(int a) { return -a; }
    int nested_arg(int x) {
        return add(neg(x),
    #ifdef BIG
                   1
    #else
                   2
    #endif
                   );
    }
  - |-
    int add(int a, int b) { return a + b; }
    int else_branch(int x) {
    #ifdef BIG
        return add(x,
    #else
        return add(x + 1,
    #endif
                   2);
    }
  - |-
    int add(int a, int b) { return a + b; }
    int elif_branch(int x) {
    #ifdef BIG
        return add(x,
    #elif defined(SMALL)
        return add(x + 1,
    #else
        return add(x + 2,
    #endif
                   2);
    }
  - |-
    int add(int a, int b) { return a + b; }
    int clean(int x) {
        if (x)
    #ifdef FOO
            x++;
    #endif
        return x;
    }
    int mixed(int x) {
        return add(x,
    #ifdef FOO
                   1
    #else
                   2
    #endif
                   );
    }
  - |-
    #include <stdio.h>
    #define LOG(...) printf(__VA_ARGS__)
    void paren_in_string(int x) {
        LOG("%d)\n", x
    #ifdef VERBOSE
            , 1
    #endif
            );
    }
  - |-
    #include <stdio.h>
    #define LOG(...) printf(__VA_ARGS__)
    void paren_in_comment(int x) {
        LOG("%d\n", x /* ) */
    #ifdef VERBOSE
            , 1
    #endif
            );
    }
  - |
    int f(int a, int b) { return g(a,
    #ifdef FOO
     b
    #endif
     ); }
  - |
    #define CALL(a, b) ((a) + (b))
    int f(int a)
    {
        return CALL(a,
    #ifndef FOO
            1
    #else
            2
    #endif
        );
    }
  - |
    #define CALL(a, b) ((a) + (b))
    int f(int a)
    {
        return CALL(a,
    # if defined(FOO)
            1
    # else
            2
    # endif
        );
    }
  - |
    #define CALL(a, b) ((a) + (b))
    int f(int a, int b)
    {
        return CALL(
    #ifdef FOO
            a,
    #else
            0,
    #endif
            b);
    }
