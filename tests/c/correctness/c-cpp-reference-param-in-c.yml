id: c-cpp-reference-param-in-c
valid:
  - 'void win32_utf8argv(int *argc, char **argv[]) { return; }'
  - "void f(int (*cb)(int *, int *), int n) { return; }"
  - "void f(const char *name, size_t len) { return; }"
  - "void f(int mask) { int x = mask & 1; return; }"
invalid:
  - 'void win32_utf8argv(int &argc, char **argv[]) { return; }'
  - "void f(char &c) { return; }"
  - "void f(const struct foo &p, int n) { return; }"
  - "int g(int n, unsigned long &out) { return n; }"
