id: c-adjacent-same-destination-overwrite
valid:
  - |-
    SET_RESULT(result, data);
    SET_RESULT(op1, &zv);
  - |-
    SET_RESULT(op1, a);
    SET_RESULT(op2, b);
    SET_RESULT(op3, c);
  - |-
    SET_RESULT(r->x, v);
    SET_RESULT(r->y, v);
  - |-
    SET_RESULT(result, data);
    SET_RESULT(op1, result);
invalid:
  - |-
    SET_RESULT(result, data);
    SET_RESULT(result, &zv);
  - |-
    SET_RESULT(r->v, a);
    SET_RESULT(r->v, b);
  - |-
    SET_RESULT(out[0], a);
    SET_RESULT(out[0], b);
  - |-
    SET_RESULT(op1, a);
    SET_RESULT(result, b);
    SET_RESULT(result, c);
