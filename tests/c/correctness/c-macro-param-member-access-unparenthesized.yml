id: c-macro-param-member-access-unparenthesized
valid:
  - '#define GET_CODE(x) (x).code'
  - "#define NEXT(p) ((p)->next)"
  - "#define HDR_LEN(p) ((struct hdr *) (p))->len"
  - "#define ELEM_K(v) (v)[0].k"
invalid:
  - '#define GET_CODE(x) x.code'
  - "#define GET_NEXT(n) n->next"
  - "#define SZ(v) (1 + v.size)"
  - "#define BOTH(a, b) ((a).x + b->y)"
