id: c-inline-without-static
valid:
  - |-
    static inline int twice(int v) {
        return v * 2;
    }
  - |-
    extern inline int twice(int v) {
        return v * 2;
    }
  - |-
    inline static int twice(int v) {
        return v * 2;
    }
  - |-
    int twice(int v) {
        return v * 2;
    }
invalid:
  - |-
    inline int twice(int v) {
        return v * 2;
    }
  - |-
    int inline twice(int v) {
        return v * 2;
    }
  - |-
    inline int *pick(int *a) {
        return a;
    }
  - |-
    inline int add(int a, int b)
    {
        return a + b;
    }
