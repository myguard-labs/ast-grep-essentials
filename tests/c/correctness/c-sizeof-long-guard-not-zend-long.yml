id: c-sizeof-long-guard-not-zend-long
valid:
  - |-
    #if SIZEOF_ZEND_LONG == 8
    #endif
  - |-
    #if defined(SIZEOF_INT) && SIZEOF_INT == 4
    #endif
  - |-
    #ifdef SIZEOF_ZEND_LONG
    #endif
  - |-
    #if SIZEOF_ZEND_LONG == 4
    int x;
    #else
    long x;
    #endif
invalid:
  - |-
    #if SIZEOF_LONG == 8
    #endif
  - |-
    #if defined(SIZEOF_LONG) && SIZEOF_LONG == 8
    #endif
  - |-
    #if SIZEOF_LONG == 4
    int x;
    #else
    long x;
    #endif
  - |-
    #if SIZEOF_LONG > 4
    long y;
    #endif
