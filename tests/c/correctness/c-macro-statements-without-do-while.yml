id: c-macro-statements-without-do-while
valid:
  - >-
    #define SET_LVAL(d, l) do { if ((d) > 0) { (l) = 1; } else { (l) = 0; } }
    while (0)
  - '#define INC(x) ((x)++)'
  - '#define SET2(a, b) ((a) = 1, (b) = 2)'
  - '#define MIN(a, b) ((a) < (b) ? (a) : (b))'
  - '#define SWAP(a, b) do { int t_ = (a); (a) = (b); (b) = t_; } while (0)'
invalid:
  - '#define SET_LVAL(d, l) if ((d) > 0) { (l) = 1; } else { (l) = 0; }'
  - '#define SWAP(a, b) int t_ = (a); (a) = (b); (b) = t_;'
  - '#define CHECK(x) if (!(x)) return -1'
  - '#define LOG2(a, b) log_msg(a); log_msg(b);'
