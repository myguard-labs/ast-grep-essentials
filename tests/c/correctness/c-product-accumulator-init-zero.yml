id: c-product-accumulator-init-zero
valid:
  - >-
    long f(long *a, int n) { long p = 1; int i; for (i = 0; i < n; i++) { p *=
    a[i]; } return p; }
  - |-
    long f(long *a, int n) {
      long s = 0;
      long p = 1;
      int i;
      for (i = 0; i < n; i++) {
        s += a[i];
        p *= a[i];
      }
      return s + p;
    }
  - |-
    double f(double *a, int n) {
      double prod = 1.0;
      int i;
      for (i = 0; i < n; i++) {
        prod *= a[i];
      }
      return prod;
    }
  - |-
    long f(long *a, int n) {
      long sum = 0;
      int i;
      for (i = 0; i < n; i++) {
        sum += a[i];
      }
      return sum;
    }
invalid:
