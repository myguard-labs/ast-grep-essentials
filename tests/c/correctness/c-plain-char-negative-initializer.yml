id: c-plain-char-negative-initializer
valid:
  - 'static const signed char tag[] = { -1, 0 };'
  - |-
    static const unsigned char tag[] = { 0xff, 0 };
  - |-
    int delta = -1;
  - |-
    char c = 'a' - 1;
invalid:
  - 'static const char tag[] = { -1, 0 };'
  - |-
    char c = -1;
  - |-
    static char delta = - 1;
  - |-
    char a = 1, b = -1;
