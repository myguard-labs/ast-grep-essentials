id: c-apr-log-status-passed-null
valid:
  - >-
    apr_status_t status; if ((status = f(p, u)) != APR_SUCCESS) {
    ap_log_rerror(APLOG_MARK, APLOG_ERR, status, r, fmt); }
  - 'void f(void) { apr_status_t rv; if ((rv = g(p)) != APR_SUCCESS) { ap_log_rerror(APLOG_MARK, APLOG_ERR, rv, r, "x"); return; } }'
  - 'void f(void) { apr_status_t rv; if ((rv = g(p)) == APR_SUCCESS) { ap_log_rerror(APLOG_MARK, APLOG_DEBUG, NULL, r, "ok"); } }'
  - 'void f(void) { apr_status_t rv; if ((rv = g(p)) != APR_SUCCESS) { ap_log_rerror(APLOG_MARK, APLOG_ERR, APR_FROM_OS_ERROR(errno), r, "x"); } }'
invalid:
  - >-
    apr_status_t status; if ((status = f(p, u)) != APR_SUCCESS) {
    ap_log_rerror(APLOG_MARK, APLOG_ERR, NULL, r, fmt); }
  - 'void f(void) { apr_status_t rv; if ((rv = g(p)) != APR_SUCCESS) { ap_log_rerror(APLOG_MARK, APLOG_ERR, NULL, r, "x"); return; } }'
  - 'void f(void) { apr_status_t rv; if ((rv = g(p)) != APR_SUCCESS) { if (verbose) { ap_log_rerror(APLOG_MARK, APLOG_ERR, NULL, r, "open %s", path); } } }'
  - 'void f(void) { if ((status = apr_file_open(&fd, path, flags, 0, pool)) != APR_SUCCESS) { ap_log_rerror(APLOG_MARK, APLOG_WARNING, NULL, r, "e"); } }'
  - 'void f(void) { apr_status_t rv; if ((rv = g(p)) != APR_SUCCESS) { cleanup(); ap_log_rerror(APLOG_MARK, APLOG_ERR, NULL, r, "x"); } }'
