id: c-hex-nibble-unguarded
valid:
  - >-
    static int hexval(char c) { if (!isxdigit((int) c)) { return -1; } return c
    >= 'A' ? c - 0x37 : c - 0x30; }
  - |-
    static int hexpair(const unsigned char *s) {
        int hi, lo;
        if (!isxdigit(s[0]) || !isxdigit(s[1])) {
            return -1;
        }
        hi = s[0] >= 'a' ? s[0] - 0x57 : s[0] >= 'A' ? s[0] - 0x37 : s[0] - '0';
        lo = s[1] >= 'a' ? s[1] - 0x57 : s[1] >= 'A' ? s[1] - 0x37 : s[1] - '0';
        return hi * 16 + lo;
    }
  - |-
    static int hexval(int c) {
        c = toupper(c);
        if (!isxdigit(c)) {
            return -1;
        }
        return c >= 'A' ? c - 0x37 : c - '0';
    }
  - |-
    static int hexdec(const char *s, int n, unsigned char *out) {
        int i, v = 0;
        for (i = 0; i < n; i++) {
            if (!isxdigit((unsigned char) s[i])) {
                return -1;
            }
            v = v * 16 + (s[i] >= 'a' ? s[i] - 0x57 : s[i] >= 'A' ? s[i] - 0x37 : s[i] - '0');
        }
        *out = (unsigned char) v;
        return 0;
    }
invalid:
  - 'static int hexval(char c) { return c >= ''A'' ? c - 0x37 : c - 0x30; }'
  - |-
    static int hexval(char c) {
        return (c >= 'A') ? c - 0x37 : c - 0x30;
    }
  - |-
    static int hexval(int c) {
        if (!isalnum(c)) {
            return -1;
        }
        return c >= 'A' ? c - 0x37 : c - 0x30;
    }
  - |-
    static int hexdec(const char *s, int n) {
        int i, v = 0;
        for (i = 0; i < n; i++) {
            v = v * 16 + (s[i] >= 'A' ? s[i] - 0x37 : s[i] - '0');
        }
        return v;
    }
