id: c-nonvoid-switch-tail-no-return
valid:
  - "static int f(int x) {\n\tswitch (x) {\n\t\tcase 1: return 1;\n\t}\n\treturn 0;\n}"
  - |-
    static int f(int x) { switch (x) { case 1: return 1; default: return 0; } }
  - |-
    static void f(int x) { switch (x) { case 1: x++; break; } }
  - |-
    static int f(int x) { switch (x) { case 1: return 1; default : return 9; } }
invalid:
  - "static int f(int x) {\n\tswitch (x) {\n\t\tcase 1: return 1;\n\t}\n}"
  - |-
    static int f(int x) { int v = 0; switch (x) { case 1: v = 1; break; } }
  - |-
    static char *f(int x) { switch (x) { case 1: return "a"; } }
  - |-
    static long f(int x) { x++; switch (x) { case 3: return 1; case 4: return 2; } }
