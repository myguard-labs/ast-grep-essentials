id: c-range-check-reversed-lower-bound
valid:
  - 'int in_range(int offset) { return (offset >= 15) && (offset <= 23); }'
  - |-
    int in_range(int offset) { return (15 <= offset) && (offset <= 23); }
  - |-
    int in_range(int offset) { return (offset >= 15) && (23 >= offset); }
  - |-
    int in_range(int offset) { if ((offset >= 15) && (offset <= 23)) { return 1; } return 0; }
invalid:
  - 'int in_range(int offset) { return (15 >= offset) && (offset <= 23); }'
  - |-
    int in_range(int offset)
    {
        if ((15 >= offset) && (offset <= 23)) { return 1; }
        return 0;
    }
  - |-
    int in_range(int offset)
    {
        int ok = (15 >= offset) && (offset <= 23);
        return ok;
    }
  - |-
    int in_range(int offset)
    {
        while ((15 >= offset) && (offset <= 23)) { offset++; }
        return offset;
    }
