id: c-hex-decode-missing-lowercase
valid:
  - >-
    static int hexval(unsigned char c) { return c >= 'a' ? c - 0x57 : (c >= 'A'
    ? c - 0x37 : c - 0x30); }
  - |-
    static int hexval(unsigned char c) {
        return c >= 'a' ? c - 0x57 : c >= 'A' ? c - 0x37 : c - 0x30;
    }
  - |-
    static int hexval(unsigned char c) {
        return c >= 'A' ? (c | 0x20) - 0x57 : c - 0x30;
    }
  - |-
    static int hexval(int c) {
        c = tolower(c);
        return c >= 'a' ? c - 0x57 : c - 0x30;
    }
invalid:
  - >-
    static int hexval(unsigned char c) { return c >= 'A' ? c - 0x37 : c - 0x30;
    }
  - |-
    static int hexval(unsigned char c) {
        int d = c >= 'A' ? c - 0x37 : c - 0x30;
        return d;
    }
  - |-
    static int g(unsigned char ch) {
        return ch >= 'A' ? ch - 0x37 : ch - '0';
    }
  - |-
    static int g(const unsigned char *s) {
        int hi = s[0] >= 'A' ? s[0] - 0x37 : s[0] - '0';
        return hi;
    }
