id: c-defined-predefined-macro-missing-underscores
valid:
  - |-
    #if defined(__STDC_VERSION__) && __STDC_VERSION__ >= 199901L
    #define HAVE_C99
    #endif
  - |-
    #if defined(__LINE__)
    #endif
  - |-
    #if defined __FILE__
    #endif
  - |-
    #if defined(__STDC_HOSTED__)
    #endif
  - |-
    #if defined(__cplusplus)
    extern "C" {
    #endif
  - |-
    #if defined __cplusplus
    #endif
  - |-
    #if defined(__STDC__) && defined(__GNUC__) && !defined(_WIN32)
    #endif
invalid:
  - |-
    #if defined(__STDC_VERSION) && __STDC_VERSION__ >= 199901L
    #define HAVE_C99
    #endif
  - |-
    #if defined __STDC_VERSION
    #endif
  - |-
    #if !defined(__LINE)
    #endif
  - |-
    #if defined(__STDC_IEC_559)
    #endif
