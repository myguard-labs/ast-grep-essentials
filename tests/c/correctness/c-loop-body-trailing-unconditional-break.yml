id: c-loop-body-trailing-unconditional-break
valid:
  - 'void f(int n) { while (n > 0) { if (n == 3) break; n--; } }'
  - |-
    void f(int n) { while (n > 0) { n--; if (n < 0) break; n++; } }
  - |-
    void f(int n) { while (n > 0) { switch (n) { case 1: n--; break; default: n -= 2; } } }
  - |-
    void f(int n) { while (n > 0) { if (n == 3) { n--; break; } n--; } }
  - |-
    void f(int n) { do { n--; break; } while (0); }
invalid:
  - 'void f(int n) { while (n > 0) { n--; break; } }'
  - |-
    void f(int *p) { while (p) { process(p); break; } }
  - |-
    void f(int n) { int total = 0; while (n--) { total += n; break; } }
  - |-
    void f(void) { while (1) { if (poll()) handle(); break; } }
  - |-
    void f(int n) { while (n > 0) { break; } }
