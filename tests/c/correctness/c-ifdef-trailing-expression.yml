id: c-ifdef-trailing-expression
valid:
  - |-
    #ifdef A0
    int x;
    #endif
  - |-
    #ifdef A0 // note
    int x;
    #endif
  - |-
    #ifndef A0 /* note */
    int x;
    #endif
  - |-
    #  ifdef A0
    int x = 1 && 2;
    #endif
  - |-
    #if defined(A) && defined(B)
    int x;
    #endif
invalid:
  - |-
    #ifdef A0 && MYSQL_USE_MYSQLND
    int x;
    #endif
  - |-
    #ifndef A0 || B0
    int x;
    #endif
  - |-
    #ifdef A0 B0
    int x;
    #endif
  - |-
    #ifdef A0&&B0
    int x;
    #endif
