id: c-include-sys-errno-header
valid:
  - '#include <errno.h>'
  - '#include <sys/types.h>'
  - |-
    #include <errno.h>
    #include <sys/stat.h>
invalid:
  - '#include <sys/errno.h>'
  - |-
    #include <stdio.h>
    #include <sys/errno.h>
    #include <string.h>
  - '# include <sys/errno.h>'
  - '#include <sys/errno.h> /* errno values */'
