id: c-utctime-year-pivot-70
valid:
  - >-
    static int f(const char *buff1) { int i = (buff1[0]-'0')*10+(buff1[1]-'0');
    if (i < 50) i+=100; return i; }
  - |-
    static int f(const char *s) { int i = (s[0]-'0')*10+(s[1]-'0'); if (i < 50) { i += 100; } return i; }
  - |-
    static int f(struct tm *t) { if (t->tm_year < 50) t->tm_year += 100; return t->tm_year; }
  - |-
    static int f(int yy) { if (yy < 50) yy += 100; return yy; }
invalid:
  - >-
    static int f(const char *buff1) { int i = (buff1[0]-'0')*10+(buff1[1]-'0');
    if (i < 70) i+=100; return i; }
  - |-
    static int f(const char *s) { int yr = (s[0]-'0')*10+(s[1]-'0'); if (yr < 70) yr += 100; return yr; }
  - |-
    static int f(int yy) { if (yy < 70) yy += 100; return yy; }
