id: c-ifdef-compound-condition
valid:
  - |-
    #if PHP_WIN32 && ZTS
    #endif
  - |-
      #ifndef FOO_H
      #define FOO_H
      int x;
      #endif
  - |-
      #ifdef FOO /* why */
      int x;
      #endif
  - |-
      #ifdef FOO // why
      int x;
      #endif
  - |-
      #if defined(FOO) && defined(BAR)
      int x;
      #endif
invalid:
  - |-
    #ifdef PHP_WIN32 && ZTS
    #endif
  - |-
      #ifndef FOO && BAR
      int x;
      #endif
  - |-
      #ifdef FOO BAR
      int x;
      #endif
  - |-
      #  ifdef FOO || BAR
      int x;
      #endif
  - |-
      #ifdef FOO == 1
      int x;
      #endif
  - |-
      void f(void) {
      #ifdef FOO && BAR
        g();
      #endif
      }
