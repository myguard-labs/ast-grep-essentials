id: c-string-literal-unknown-escape
valid:
  - 'const char *re = "a\\.b";'
  - |-
    const char *re = "\\d+\\.\\d+";
  - |-
    const char *s = "\a\b\f\n\r\t\v\\\'\"\?";
  - |-
    const char *s = "\x41\101\0";
invalid:
  - 'const char *re = "a\.b";'
  - |-
    const char *re = "\d+\.\d+";
  - |-
    const char *p = "a\\\.b";
  - |-
    const char *s = "100\%";
