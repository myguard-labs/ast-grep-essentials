id: c-or-guard-drops-partial-credentials
valid:
  - >-
    void connect(char *ds, char *user, char *pass) { char *conn; if (!user &&
    !pass) { conn = ds; } else if (user) { conn = ds; } }
  - |-
    void connect(char *ds, char *user, char *pass)
    {
        char *conn;
        if (!user && !pass) {
            conn = ds;
        } else if (user && pass) {
            conn = user;
        } else {
            return;
        }
        (void)conn;
    }
  - |-
    int connect(char *ds, char *user, char *pass)
    {
        if (!user || !pass) {
            return -1;
        } else if (user[0] == '\0') {
            return -2;
        }
        return 0;
    }
  - |-
    int connect(char *ds, char *user, char *pass, int verbose)
    {
        if (!user || !pass) {
            return -1;
        } else if (verbose) {
            return 1;
        }
        return 0;
    }
invalid:
  - >-
    void connect(char *ds, char *user, char *pass) { char *conn; if (!user ||
    !pass) { conn = ds; } else if (user) { conn = ds; } }
  - |-
    int connect(char *ds, char *host, char *port)
    {
        int r = 0;
        if (!host || !port) {
            r = -1;
        } else if (host) {
            r = 1;
        }
        return r;
    }
  - |-
    int connect(struct cfg *c)
    {
        int r = 0;
        if (!c->user || !c->pass) {
            r = -1;
        } else if (c->user) {
            r = 1;
        }
        return r;
    }
  - |-
    int connect(char *user, char *pass)
    {
        int r = 0;
        if (!user || !pass) {
            r = -1;
            log_it(r);
        } else if (user) {
            r = 1;
            log_it(r);
        } else {
            r = 2;
        }
        return r;
    }
