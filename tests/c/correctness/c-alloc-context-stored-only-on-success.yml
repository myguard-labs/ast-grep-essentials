id: c-alloc-context-stored-only-on-success
valid:
  - >-
    int f(void *ctx) { struct buf *ret = alloc_out(); if (ret != NULL) {
    ret->context = ctx; } else { release(ctx); } return 0; }
  - 'int f(void *ctx) { struct buf *ret = alloc_out(); if (ret != NULL) { ret->context = ctx; } else { free(ctx); } return 0; }'
  - 'int f(void *ctx) { struct buf *ret = alloc_out(); if (ret == NULL) { ctx_put(ctx); return -1; } else { ret->context = ctx; } return 0; }'
  - 'int f(void *ctx) { struct buf *ret = alloc_out(); if (ret == NULL) { release(ctx); return -1; } ret->context = ctx; return 0; }'
invalid:
  - >-
    int f(void *ctx) { struct buf *ret = alloc_out(); if (ret != NULL) {
    ret->context = ctx; } return 0; }
  - 'int f(void *ctx) { struct buf *ret = alloc_out(); if (ret != NULL) { ret->name = 0; if (ctx) { ret->context = ctx; } } return 0; }'
  - 'int f(struct in *i) { struct buf *ret = alloc_out(); if (ret != NULL) { ret->context = i->ctx; ret->n = 1; } return 0; }'
  - 'int f(void *ctx) { struct buf *ret = alloc_out(); if (ret != NULL) { for (int k = 0; k < 2; k++) { ret->context = ctx; } } return 0; }'
