id: c-equality-ternary-precedence
valid:
  - 'int f(int a, int b) { return a == (b ? 1 : 2); }'
  - 'int f(int a, int b) { return (a == b) ? 1 : 2; }'
  - 'int f(int a, int b) { int eq = (a == b); return eq ? 1 : 2; }'
  - 'int f(int a, int b) { return a ? 1 : 2; }'
invalid:
  - 'int f(int a, int b) { return a == b ? 1 : 2; }'
  - 'int f(int a, int b) { return a != b ? 1 : 2; }'
  - 'int f(int a, int b) { int x = a == b ? 1 : 2; return x; }'
  - 'int f(int a, int b) { return g(a != b ? 1 : 2); }'
