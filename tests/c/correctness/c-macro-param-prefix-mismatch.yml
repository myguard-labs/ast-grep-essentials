id: c-macro-param-prefix-mismatch
valid:
  - '#define LOOKUP(_ht, _h) (_ht->arData[_h])'
  - '#define HT_COUNT(_ht) ((_ht)->nNumOfElements)'
  - '#define HT_USED(_ht) (_ht->nNumUsed)'
  - '#define HT_SIZE(ht) (ht->nTableSize)'
invalid:
  - '#define LOOKUP(_ht, _h) (ht->arData[_h])'
  - '#define HT_FIRST(_ht) (ht->arData[0])'
  - '#define HT_USED(_ht) ( ht->nNumUsed)'
  - '#define BUCKET_AT(_ht, _i) (( ht ->arData)[_i])'
