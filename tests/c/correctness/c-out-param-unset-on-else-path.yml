id: c-out-param-unset-on-else-path
valid:
  - >-
    int f(char **out, int n) { if (n) { *out = malloc(n); } else { *out = NULL;
    } return 0; }
  - |-
    int f(char **out, int n) {
      if (n == 0) {
        *out = NULL;
        return 0;
      } else {
        *out = malloc(n);
      }
      return 0;
    }
  - |-
    int f(char **out, int n, int m) {
      if (n) {
        *out = malloc(n);
      } else if (m) {
        *out = malloc(m);
      } else {
        *out = NULL;
      }
      return 0;
    }
  - |-
    int f(char **out, int n) {
      char *tmp = NULL;
      if (n) {
        tmp = malloc(n);
      }
      *out = tmp;
      return 0;
    }
invalid:
  - 'int f(char **out, int n) { if (n) { *out = malloc(n); } return 0; }'
  - |-
    int f(char **out, int n) {
      if (n) *out = malloc(n);
      return 0;
    }
  - |-
    int f(char **out, int n, int m) {
      if (n) {
        *out = malloc(n);
      } else if (m) {
        *out = malloc(m);
      }
      return 0;
    }
  - |-
    int f(char **out, int n, int m) {
      if (n) {
        if (m) {
          *out = malloc(m);
        }
      } else {
        return -1;
      }
      return 0;
    }
