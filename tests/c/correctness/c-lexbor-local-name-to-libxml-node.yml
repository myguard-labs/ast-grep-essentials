id: c-lexbor-local-name-to-libxml-node
valid:
  - |-
    const lxb_char_t *name = lxb_dom_element_qualified_name(el, NULL);
    xmlNodePtr n = xmlNewDocNode(doc, NULL, name, NULL);
  - |-
    const lxb_char_t *name = lxb_dom_element_qualified_name(el, &len);
    xmlNodePtr n = xmlNewDocNode(doc, ns, name, NULL);
  - |-
    const lxb_char_t *name = lxb_dom_element_local_name(el, NULL);
    size_t n = strlen((const char *) name);
invalid:
  - |-
    const lxb_char_t *name = lxb_dom_element_local_name(el, NULL);
    xmlNodePtr n = xmlNewDocNode(doc, NULL, name, NULL);
  - |-
    const lxb_char_t *tag = lxb_dom_element_local_name(el, &len);
    xmlNodePtr n = xmlNewDocNode(doc, ns, tag, text);
  - |-
    xmlNodePtr build(xmlDocPtr doc, lxb_dom_element_t *el) {
        size_t len = 0;
        const lxb_char_t *name = lxb_dom_element_local_name(el, &len);
        int copied = 0;
        xmlNodePtr n = xmlNewDocNode(doc, NULL, name, NULL);
        return n;
    }
