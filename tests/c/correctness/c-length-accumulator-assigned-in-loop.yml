id: c-length-accumulator-assigned-in-loop
valid:
  - |-
    size_t len = 0;
    while (p != NULL) {
        len += p->value.len + 2;
        p = p->next;
    }
  - |-
    size_t f(node *p) {
      size_t len = 0;
      while (p != NULL) {
        len = len + p->value.len + 2;
        p = p->next;
      }
      return len;
    }
  - |-
    size_t f(node *p) {
      size_t len;
      len = p->value.len + 2;
      return len;
    }
  - |-
    size_t f(node *p) {
      size_t total = 0;
      while (p != NULL) {
        size_t n = p->value.len + 2;
        total += n;
        p = p->next;
      }
      return total;
    }
invalid:
  - |-
    size_t len = 0;
    while (p != NULL) {
        len = p->value.len + 2;
        p = p->next;
    }
  - |-
    size_t f(node *p) {
      size_t len = 0;
      while (p != NULL) {
        if (p->value.len) {
          len = p->value.len + 2;
        }
        p = p->next;
      }
      return len;
    }
  - |-
    size_t f(node *p) {
      size_t len = 0;
      while (1) {
        len = p->key.len + 2;
        if (!p->next) break;
        p = p->next;
      }
      return len;
    }
  - |-
    size_t f(node *e, size_t n) {
      size_t len = 0;
      while (n-- > 0) {
        len = e[n].len + 2;
      }
      return len;
    }
