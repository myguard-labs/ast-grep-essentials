id: c-literal-range-tautological-disjunction
valid:
  - 'int f(int code) { return code >= 0 && code <= 65535; }'
  - 'int f(int x) { return x >= 0 && x <= 9; }'
  - 'int f(int code) { return code < 0x20 || code > 0x7e; }'
invalid:
  - 'int f(int code) { return code >= 0 || code <= 65535; }'
  - 'int f(int code) { return code >= 0x20 || code <= 0x7e; }'
  - 'int f(int n) { return n >= 1 || n <= 9; }'
