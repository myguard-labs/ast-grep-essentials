id: c-two-digit-year-plus-1900
valid:
  - 'int f(int y) { if (y < 0) y += 1900; return y; }'
  - |-
    #include <time.h>
    int full_year(const struct tm *t) { int year = t->tm_year + 1900; return year; }
  - |-
    int window(int y) {
      if (y < 70) y += 2000;
      else if (y >= 70 && y < 100) y += 1900;
      return y;
    }
  - |-
    int to_tm_year(int y) { if (y >= 1900) y -= 1900; return y; }
invalid:
  - 'int f(int y) { if (y < 100) y += 1900; return y; }'
  - |-
    struct date { int year; };
    int fix(struct date *t) { if (t->year < 100) t->year += 1900; return t->year; }
  - |-
    long fix(long yr) { if (yr < 100) yr += 1900; return yr; }
  - |-
    void fix_all(int *ys, int n) {
      for (int i = 0; i < n; i++) {
        if (ys[i] < 100) ys[i] += 1900;
      }
    }
