id: c-count-division-plus-one-overcount
valid:
  - 'ncx = sx / cs;'
  - "void f(void) { ncx = (sx + cs - 1) / cs; }"
  - "void f(void) { ncx = sx / cs + (sx % cs != 0); }"
  - "void f(void) { ncx = sx / (cs + 1); }"
invalid:
  - 'ncx = sx / cs + 1;'
  - "void f(void) { nbytes = len / 8 + 1; }"
  - "void f(void) { pages = total / per_page + 1; }"
  - "void f(struct g *g) { g->cols = width / cellw + 1; }"
