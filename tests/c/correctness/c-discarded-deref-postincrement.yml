id: c-discarded-deref-postincrement
valid:
  - 'void f(char *p) { p++; }'
  - 'void f(char *p) { *p++ = 0; }'
  - 'void f(char *p) { (*p)++; }'
  - 'char f(char *p) { return *p++; }'
  - 'void f(char *p) { char c = *p++; (void)c; }'
invalid:
  - 'void f(char *p) { *p++; }'
  - 'void f(char *p, int n) { while (n--) *p++; }'
  - 'void f(char *p, int n) { for (int i = 0; i < n; i++) { *p++; } }'
  - 'void f(char *p) { if (p) { *p++; } }'
  - 'void f(char *p) { *p = 0; *p++; }'
