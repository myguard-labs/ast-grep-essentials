id: c-string-array-missing-comma
valid:
  - 'void f(void) { puts("one" "two"); }'
  - 'static const char *const names[] = { "one", "two", "three" };'
  - 'static const char *n[] = { "UTCTIME", "GENERALIZEDTIME", "IA5STRING" };'
invalid:
  - 'static const char *const names[] = { "one", "two" "three" };'
  - 'static const char *n[] = { "UTCTIME" "GENERALIZEDTIME", "IA5STRING" };'
