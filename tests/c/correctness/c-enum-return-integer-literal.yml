id: c-enum-return-integer-literal
valid:
  - >-
    enum R { R_CONTINUE, R_ERROR }; enum R f(int x) { if (x) return R_CONTINUE;
    return R_ERROR; }
  - |-
    enum R { R_A, R_B };
    enum R f(void) { return R_A; }
  - |-
    enum R { R_A, R_B };
    enum R f(int x) { return x ? R_A : R_B; }
  - 'int f(int x) { return 1; }'
invalid:
  - >-
    enum R { R_CONTINUE, R_ERROR }; enum R f(int x) { if (x) return 1; return
    R_ERROR; }
  - |-
    enum R { R_A, R_B };
    enum R f(void) { return 0; }
  - |-
    enum R { R_A, R_B };
    enum R f(int x) { if (x) return R_A; return 2; }
  - |-
    enum R { R_A, R_B };
    static enum R f(void) { return 1; }
