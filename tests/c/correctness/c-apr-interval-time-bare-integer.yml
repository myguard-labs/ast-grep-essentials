id: c-apr-interval-time-bare-integer
valid:
  - 'apr_interval_time_t to = apr_time_from_sec(10);'
  - 'apr_interval_time_t to = 0;'
  - 'apr_interval_time_t to = APR_USEC_PER_SEC;'
  - 'apr_interval_time_t to = apr_time_from_msec(250);'
invalid:
  - 'apr_interval_time_t to = 10;'
  - 'apr_interval_time_t to = 500;'
  - 'void f(void) { apr_interval_time_t to = 30; }'
  - 'apr_interval_time_t to = 0x10;'
  - 'apr_interval_time_t to = 5000000;'
  - 'apr_interval_time_t to = 01;'
