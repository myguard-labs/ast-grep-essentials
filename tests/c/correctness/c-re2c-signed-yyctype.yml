id: c-re2c-signed-yyctype
valid:
  - '#define YYCTYPE unsigned char'
  - |-
    #include <stdint.h>
    #define YYCTYPE uint8_t
  - |-
    #define YYCTYPE unsigned char
    #define YYCURSOR cur
  - |-
    #define YYCHAR char
invalid:
  - '#define YYCTYPE char'
  - |-
    #ifndef YYCTYPE
    #define YYCTYPE char
    #endif
  - |-
    #define YYCURSOR cur
    #define YYCTYPE char
  - |-
    #  define YYCTYPE char
