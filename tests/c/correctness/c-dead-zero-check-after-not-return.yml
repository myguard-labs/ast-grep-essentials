id: c-dead-zero-check-after-not-return
valid:
  - >-
    int f(int i, int opt) { if (!i) return 0; if (i == 1 && !opt) return -1;
    return i; }
  - 'int f(int i) { if (i == 0) return 1; return i; }'
  - 'int f(int i, int j) { if (!i) return 0; if (j == 0) return 1; return i; }'
  - 'int f(int i) { if (i == 0) return 1; if (!i) return 0; return i; }'
invalid:
  - >-
    int f(int i, int opt) { if (!i) return 0; if (i == 0 && !opt) return -1;
    return i; }
  - 'int f(int *p) { if (!p) return -1; if (p == 0) return 1; return 0; }'
  - 'int f(int n, int m) { if (!n) return -1; if (m > 2 || n == 0) return 1; return 0; }'
  - 'int f(int n) { if (!n) return -1; log(); if (n == 0) { return 1; } return 0; }'
