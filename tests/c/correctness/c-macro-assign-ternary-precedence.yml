id: c-macro-assign-ternary-precedence
valid:
  - >-
    #define DVAL_TO_LVAL(d, l) (l) = (((d) > LONG_MAX) ? (unsigned long) (d) :
    (long) (d))
  - "#define SET_MAX(l, d) (l) = (((d) >= LIM) ? (unsigned long) (d) : (long) (d))"
  - "#define MAXV(a, b) ((a) > (b) ? (a) : (b))"
  - "#define IS_EQ(a, b) ((a) == (b) ? 1 : 0)"
invalid:
  - >-
    #define DVAL_TO_LVAL(d, l) ((l) = (d)) > LONG_MAX ? (unsigned long) (d) :
    (long) (d)
  - "#define DVAL_TO_LVAL(d, l) ((l) = (d)) >= LONG_MAX ? (unsigned long) (d) : (long) (d)"
  - "#define CLAMP(d, l) ((l) = (d)) < LIMIT ? (long) (l) : (long) LIMIT"
  - "#define STORE_CMP(v, r) ((r) = (v)) <= THRESH ? (v) : 0"
