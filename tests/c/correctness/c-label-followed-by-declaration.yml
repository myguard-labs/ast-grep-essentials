id: c-label-followed-by-declaration
valid:
  - 'void f(int x){switch(x){case 1: { int y = 0; (void)y; break; }}}'
  - 'void f(int n){switch(n){case 1: n++; int x = n; (void)x; break;}}'
invalid:
  - 'void f(int x){switch(x){case 1: int y = 0; (void)y; break;}}'
  - 'void f(int n){switch(n){default: int y = n; (void)y; break;}}'
