    static int f(zval *a, zend_fcall_info *fci, zend_fcall_info_cache *fcc
    TSRMLS_DC) { return zend_fcall_info_init(a, fci, fcc TSRMLS_CC); }
  - |-
    void fn(void *a, void *b, void *c);
