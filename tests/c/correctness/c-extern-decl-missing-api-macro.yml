id: c-extern-decl-missing-api-macro
valid:
  - 'void f(void) { extern ZEND_API zend_class_entry *zend_ce_closure; }'
  - |-
    extern ZEND_API zend_class_entry *zend_ce_closure;
  - |-
    void f(void) { extern ZEND_API int zend_dtrace_enabled; }
  - |-
    void f(void) { extern ZEND_API const char *zend_version_string; }
invalid:
  - 'void f(void) { extern zend_class_entry *zend_ce_closure; }'
  - |-
    void f(void) { extern int zend_dtrace_enabled; }
  - |-
    void f(void) { extern const char *zend_version_string; }
  - |-
    void f(void) {
        use(1);
        extern struct _zend_executor_globals executor_globals;
    }
