id: c-address-of-member-in-condition
valid:
  - 'int f(struct s *p) { if (p->timeout) { return 1; } return 0; }'
  - 'int f(struct s *p, int *q) { if (q == &p->timeout) { return 1; } return 0; }'
  - 'int f(struct s *p) { if (check(&p->timeout)) { return 1; } return 0; }'
  - 'int f(struct s *p) { if (p != NULL && p->timeout) { return 1; } return 0; }'
invalid:
  - 'int f(struct s *p) { if (&p->timeout) { return 1; } return 0; }'
  - 'int f(int *arr, int i) { if (&arr[i]) { return 1; } return 0; }'
  - 'int f(struct s *p) { if (&p->a.b) { return 1; } return 0; }'
  - 'int f(struct s *p) { if (p == NULL) { return 0; } else if (&p->timeout) { return 1; } return 2; }'
