id: c-bare-return-in-nonvoid-function
valid:
  - |-
    static void f(int x) {
      if (x) return;
    }
  - 'static void compute(void) { return; }'
invalid:
  - |-
    static int f(int x) {
      if (x) return;
      return 0;
    }
  - 'static int compute(void) { return; }'
  - 'char *name(void) { return; }'
