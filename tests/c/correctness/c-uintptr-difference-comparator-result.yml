id: c-uintptr-difference-comparator-result
valid:
  - >-
    static int cmp(void *a, void *b) { return ((uintptr_t) a > (uintptr_t) b) -
    ((uintptr_t) a < (uintptr_t) b); }
  - |-
    #include <stdint.h>
    #include <stddef.h>
    #include <string.h>
    int cmp(const void *a, const void *b) {
      return (uintptr_t) a < (uintptr_t) b ? -1 : (uintptr_t) a > (uintptr_t) b;
    }
  - |-
    #include <stdint.h>
    #include <stddef.h>
    #include <string.h>
    int cmp(const void *a, const void *b) {
      uintptr_t x = (uintptr_t) a;
      uintptr_t y = (uintptr_t) b;
      if (x < y) return -1;
      if (x > y) return 1;
      return 0;
    }
  - |-
    #include <stdint.h>
    #include <stddef.h>
    #include <string.h>
    int same(const void *a, const void *b) { return (uintptr_t) a == (uintptr_t) b; }
invalid:
  - 'static int cmp(void *a, void *b) { return (uintptr_t) a - (uintptr_t) b; }'
  - |-
    #include <stdint.h>
    #include <stddef.h>
    #include <string.h>
    struct item { void *key; };
    int cmp(const void *pa, const void *pb) {
      const struct item *a = pa;
      const struct item *b = pb;
      return (uintptr_t) a->key - (uintptr_t) b->key;
    }
  - |-
    #include <stdint.h>
    #include <stddef.h>
    #include <string.h>
    int cmp(const void *pa, const void *pb) {
      void *const *a = pa;
      void *const *b = pb;
      return (uintptr_t) *a - (uintptr_t) *b;
    }
  - |-
    #include <stdint.h>
    #include <stddef.h>
    #include <string.h>
    int cmp(const void *a, const void *b) { return (uintptr_t)a-(uintptr_t)b; }
