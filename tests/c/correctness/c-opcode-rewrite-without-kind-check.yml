id: c-opcode-rewrite-without-kind-check
valid:
  - >-
    if (last_op->opcode == ZEND_FETCH_OBJ_R) { last_op->opcode =
    ZEND_INIT_METHOD_CALL; }
  - 'void f(zend_op *op) { if (op->opcode == ZEND_NOP) { op->opcode = ZEND_JMP; } else { skip(); } }'
  - 'void f(zend_op *op) { if (op->opcode == ZEND_FETCH_OBJ_R || op->opcode == ZEND_FETCH_OBJ_W) op->opcode = ZEND_INIT_METHOD_CALL; }'
  - 'void f(zend_op *op) { if (op->opcode != ZEND_NOP) { return; } else { op->opcode = ZEND_JMP; } }'
invalid:
  - 'last_op->opcode = ZEND_INIT_METHOD_CALL;'
  - 'void f(zend_op *opline) { opline->opcode = ZEND_NOP; }'
  - 'void f(zend_op **ops, int n) { int i; for (i = 0; i < n; i++) { ops[i]->opcode = ZEND_NOP; } }'
  - 'void f(zend_op *op) { while (op) { op->opcode = ZEND_NOP; op = op->next; } }'
