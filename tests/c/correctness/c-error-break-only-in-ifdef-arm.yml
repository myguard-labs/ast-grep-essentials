    }
  - |-
    int w(char *p, int n) {
        while (n > 0) {
            int r = read_it(p, n);
            if (r < 0) {
                log_err();
    #ifdef HAVE_STOP
                break;
    #else
                retry();
    #endif
            }
            p += r; n -= r;
        }
        return 0;
    }
