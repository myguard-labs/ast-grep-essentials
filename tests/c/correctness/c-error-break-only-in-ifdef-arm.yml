id: c-error-break-only-in-ifdef-arm
valid:
  - |-
    int w(char *p, int n) { while (n > 0) { int r = write_it(p, n); if (!r) {
    #ifdef WIN32_NO_CONSOLE
    handle_abort_win();
    #else
    handle_abort();
    #endif
    break;
    } p += r; n -= r; } return 0; }
  - |-
    int w(char *p, int n) {
        while (n > 0) {
            int r = write_it(p, n);
            if (!r) {
    #ifdef WIN32_NO_CONSOLE
                handle_abort_win();
    #else
                handle_abort();
    #endif
            }
            if (r < 0)
                break;
            p += r; n -= r;
        }
        return 0;
    }
  - |-
    int w(char *p, int n) {
        while (n > 0) {
            int r = write_it(p, n);
            if (!r) {
    #ifdef WIN32_NO_CONSOLE
                log_win();
    #else
                log_unix();
    #endif
                break;
            }
            p += r; n -= r;
        }
        return 0;
    }
