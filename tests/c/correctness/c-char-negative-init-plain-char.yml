id: c-char-negative-init-plain-char
valid:
  - 'void f(void) { signed char width = -1; }'
  - "void f(void) { unsigned char c = 255; }"
  - "void f(void) { int c = -1; }"
  - "void f(void) { char c = 0; }"
invalid:
  - 'void f(void) { char width = -1; }'
  - "char gate = -1;"
  - "void f(void) { for (char c = -1; c < 3; c++) { } }"
