id: c-empty-function-like-macro
valid:
  - >-
    #define NS_NAMED_FE(ns, zend_name, name, arg_info) NS_FENTRY(ns, zend_name,
    name, arg_info, 0)
  - '#define MAX(a, b) ((a) > (b) ? (a) : (b))'
  - '#define LOG(fmt, ...) fprintf(stderr, fmt, __VA_ARGS__)'
  - |-
    #define CHECK(x) \
      do { if (!(x)) abort(); } while (0)
invalid:
  - '#define NS_NAMED_FE(ns, zend_name, name, arg_info)'
  - '#define NOP()'
  - '#define TRACE(fmt, ...)'
  - '#define DEBUG_LOG(x)   '
