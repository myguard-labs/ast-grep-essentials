id: c-comment-contains-nested-opener
valid:
  - |-
    /* libxml2 includes unicode.h files */
    int x;
  - "/* a / b */\nint x;"
  - "// line comment with /* inside\nint x;"
  - "/** doxygen */\nint x;"
  - "/* a */ int x; /* b */"
invalid:
  - |-
    /* libxml2 includes unicode/*.h files */
    int x;
  - "/* see src/*.c for details */\nint x;"
  - "/* first line\n   second /* line */\nint x;"
