id: c-llist-dtor-cast-hides-signature
valid:
  - |-
    static void dtor(void *p) { (void)p; }
    void f(zend_llist *l) { zend_llist_init(l, sizeof(int), dtor, 0); }
  - 'void f(zend_llist *l) { zend_llist_init(l, sizeof(int), NULL, 0); }'
  - |-
    static void dtor(void *p) { (void)p; }
    void f(zend_llist *l, int n) { zend_llist_init(l, (size_t) n, dtor, 0); }
invalid:
  - |-
    static void dtor(void *p) { (void)p; }
    void f(zend_llist *l) { zend_llist_init(l, sizeof(int), (llist_dtor_func_t) dtor, 0); }
  - 'void f(zend_llist *l) { zend_llist_init(l, sizeof(zval *), (llist_dtor_func_t) zval_ptr_dtor, 0); }'
  - 'void f(zend_llist *l) { zend_llist_init(l, sizeof(zend_string *), (llist_dtor_func_t) zend_string_release, 0); }'
