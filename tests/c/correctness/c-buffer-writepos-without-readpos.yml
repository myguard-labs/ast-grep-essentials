id: c-buffer-writepos-without-readpos
valid:
  - "struct s { int writepos; int readpos; };\nint f(struct s *stream) {\n\treturn (stream->writepos - stream->readpos) > 0;\n}"
  - "struct s { int writepos; int readpos; };\nint f(struct s *stream) {\n\treturn stream->writepos != stream->readpos;\n}"
  - "struct s { int writepos; int readpos; };\nint f(struct s *stream) {\n\treturn stream->readpos < stream->writepos;\n}"
  - "struct s { int writepos; int readpos; };\nint f(struct s *stream) {\n\treturn stream->writepos - stream->readpos > 0;\n}"
invalid:
  - "struct s { int writepos; int readpos; };\nint f(struct s *stream) {\n\treturn stream->writepos > 0;\n}"
  - "struct s { int writepos; int readpos; };\nint f(struct s *stream, int ok) {\n\tif (stream->writepos > 0) { return ok; }\n\treturn 0;\n}"
  - "struct s { int writepos; int readpos; };\nint f(struct s *stream, int ok) {\n\treturn stream->writepos > 0 && ok;\n}"
  - "struct o { struct s *buf; };\nstruct s { int writepos; int readpos; };\nint f(struct o *o) {\n\tint has = o->buf->writepos > 0;\n\treturn has;\n}"
