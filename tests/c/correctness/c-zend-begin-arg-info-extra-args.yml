id: c-zend-begin-arg-info-extra-args
valid:
  - "ZEND_BEGIN_ARG_INFO_EX(arginfo_nl2br, 0, 0, 1)\n\tZEND_ARG_INFO(0, str)\nZEND_END_ARG_INFO()"
  - |-
    ZEND_BEGIN_ARG_INFO(arginfo_nl2br, 0)
        ZEND_ARG_INFO(0, str)
    ZEND_END_ARG_INFO()
  - |-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_trim, 0, 0, 2)
        ZEND_ARG_INFO(0, str)
        ZEND_ARG_INFO(0, chars)
    ZEND_END_ARG_INFO()
  - |-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_sort, 0, 1, 1)
        ZEND_ARG_INFO(1, arr)
    ZEND_END_ARG_INFO()
invalid:
  - "ZEND_BEGIN_ARG_INFO(arginfo_nl2br, 0, 0, 1)\n\tZEND_ARG_INFO(0, str)\nZEND_END_ARG_INFO()"
  - |-
    ZEND_BEGIN_ARG_INFO(arginfo_trim, 0, 0, 2)
        ZEND_ARG_INFO(0, str)
        ZEND_ARG_INFO(0, chars)
    ZEND_END_ARG_INFO()
  - |-
    ZEND_BEGIN_ARG_INFO(arginfo_sort, 0, 1, 1)
        ZEND_ARG_INFO(1, arr)
    ZEND_END_ARG_INFO()
  - |-
    ZEND_BEGIN_ARG_INFO(arginfo_noargs, 0, 0, 0)
    ZEND_END_ARG_INFO()
