id: c-literal-range-empty-conjunction
valid:
  - 'int f(int ch) { return ch < 33 || ch > 127; }'
  - 'int f(int x) { return x > 2 && x < 10; }'
  - 'int f(int x) { return x >= 2 && x <= 10; }'
invalid:
  - 'int f(int ch) { return ch < 33 && ch > 127; }'
  - 'int f(int x) { if (x < 5 && x > 10) { return 1; } return 0; }'
  - 'int f(int n) { return n < 4 && n > 3; }'
