id: c-enum-member-windows-macro-name
valid:
  - 'enum mode { ACTION_ERROR, OK };'
  - 'enum mode { OK, ERRORS };'
  - 'enum mode { error, OK };'
  - 'enum mode { ERROR_CODE = 1 };'
invalid:
  - 'enum mode { ERROR, OK };'
  - 'enum mode { OK, ERROR };'
  - 'enum mode { OK, ERROR = 3 };'
  - 'typedef enum { ERROR = -1, OK } mode_t;'
