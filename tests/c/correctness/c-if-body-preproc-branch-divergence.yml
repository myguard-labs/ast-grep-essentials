id: c-if-body-preproc-branch-divergence
valid:
  - |-
    if (md == NULL) {
    #ifndef FIPS
        md = EVP_sha1();
    #else
        return 0;
    #endif
    }
  - |-
    int f(int a) {
        g(a);
    #ifdef DEBUG
        log_value(a);
    #endif
        return a;
    }
  - |-
    int f(const EVP_MD *md) {
    #ifdef FIPS
        if (md == NULL) {
            return 0;
        }
    #else
        if (md == NULL) {
            md = EVP_sha1();
        }
    #endif
        return md != NULL;
    }
  - |-
    int f(const EVP_MD *md) {
        if (md == NULL) {
            md = EVP_sha256();
        }
    #ifdef FIPS
        md = EVP_sha384();
    #endif
        return md != NULL;
    }
invalid:
