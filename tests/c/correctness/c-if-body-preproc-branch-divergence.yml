    #else
            md = EVP_sha1();
    #endif
        return md != NULL;
    }
  - |-
    int f(int rc) {
        if (rc != 0)
    #ifdef DEBUG
            log_error(rc);
    #endif
        return rc;
    }
  - |-
    int f(int a, int b) {
        if (a)
            b = 1;
        else if (b)
    #ifndef NDEBUG
            b = 2;
    #else
            b = 3;
    #endif
        return b;
    }
