id: c-file-scope-underscore-identifier
valid:
  - 'static void helper(void) { }'
  - 'void helper(void) { }'
  - 'static int calc_total(int a) { return a; }'
  - 'void f(void) { _inner(); }'
invalid:
  - 'static void _helper(void) { }'
  - 'void _helper(void) { }'
  - 'int _calc(int a) { return a; }'
  - 'static inline int __priv(void) { return 0; }'
