id: c-chained-assign-constant-index-in-loop
valid:
  - |-
    static void init(unsigned char t[2][256], int i, int n) {
        for (; i < n; ++i)
            t[0][i] = t[1][i] = 0;
    }
  - 'static void f(unsigned char a[256], unsigned char b[256], int n) { for (int i = 0; i < n; i++) a[i] = b[n - 1 - i] = 0; }'
  - 'static void f(unsigned char a[256], unsigned char b[256], int n) { for (int i = 0; i + 1 < n; i++) a[i] = b[i + 1] = 0; }'
  - 'static void f(unsigned char a[256], unsigned char b[256], int i) { a[i] = b[0] = 0; }'
invalid:
  - |-
    static void init(unsigned char t[2][256], int i, int n) {
        for (; i < n; ++i)
            t[0][i] = t[1][0] = 0;
    }
  - 'static void f(unsigned char a[256], unsigned char b[256], int n) { for (int i = 0; i < n; i++) { a[i] = b[0] = 0; } }'
  - 'static void f(unsigned char a[256], unsigned char b[256], int n) { for (int i = 0; i < n; i++) { for (int j = 0; j < n; j++) a[j] = b[0] = i; } }'
  - 'static void f(unsigned char a[256], unsigned char b[256], unsigned char c[256], int n) { for (int i = 0; i < n; i++) a[i] = b[0] = c[i]; }'
