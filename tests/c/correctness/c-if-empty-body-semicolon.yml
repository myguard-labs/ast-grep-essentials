id: c-if-empty-body-semicolon
valid:
  - |-
    int f(int a) {
        if (a) return 1;
        return 1;
    }
  - |-
    int f(int a) {
        int x = 0;
        if (a) {
            x++;
        }
        return x;
    }
  - |-
    int f(int a) {
        int x;
        if (a)
            x = 1;
        else
            x = 2;
        return x;
    }
  - |-
    int f(int a) {
        if (a)
            goto out;
        return 1;
    out:
        return 0;
    }
invalid:
  - |-
    int f(int a) {
        if (a);
        return 1;
    }
  - |-
    int f(int a, int b) {
        if (a == b);
        return 1;
    }
  - |-
    int f(void) {
        int *p;
        if ((p = get_ptr()) != NULL);
        return *p;
    }
  - |-
    int f(int a, int b) {
        if (a)
            b = 1;
        else if (b);
        return b;
    }
