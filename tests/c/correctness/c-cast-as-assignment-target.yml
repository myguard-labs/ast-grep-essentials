id: c-cast-as-assignment-target
valid:
  - 'void f(char *p, unsigned long n) { p += n; }'
  - 'void f(long a, long b) { long c = (long)a + b; (void)c; }'
  - 'void f(char *p, unsigned long n) { *(char *)p += n; }'
  - 'void f(long a, long b) { a = (long)(a ^ b); }'
  - 'void f(long a, long b) { a ^= (long)b; }'
  - 'void f(long a, long b) { long c = (long)a ^ b; (void)c; }'
  - 'void f(long a, long b) { *(long *)&a ^= b; }'
invalid:
  - 'void f(char *p, unsigned long n) { (char *)p += n; }'
  - 'void f(long a, long b) { (long)a -= b; }'
  - 'void f(unsigned *p) { (unsigned)*p <<= 2; }'
  - 'void f(char c) { (char)c |= 1; }'
  - 'void f(const char *a, const char *b) { (long)a ^= (long)b; }'
  - 'void f(char c) { (char)c ^= 1; }'
  - 'void f(unsigned *p) { (unsigned)*p ^= 7; }'
  - 'void f(int *a, int i) { (int)a[i] ^= 1; }'
  - 'void f(int a, int b) { (int)a += b; }'
  - 'void f(long a) { (long)a <<= 2; }'
  - 'void f(int a, int b) { (int)a |= b; }'
