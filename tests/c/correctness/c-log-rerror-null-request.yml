id: c-log-rerror-null-request
valid:
  - 'ap_log_rerror(APLOG_MARK, APLOG_DEBUG, 0, r, "msg");'
  - |-
    void f(request_rec *r) {
        ap_log_rerror(APLOG_MARK, APLOG_ERR, 0, r, "failed: %s", "x");
    }
  - |-
    void f(request_rec *r) {
        ap_log_rerror(APLOG_MARK, APLOG_INFO, APR_SUCCESS, r->main, "sub request done");
    }
  - |-
    void f(server_rec *s) {
        ap_log_error(APLOG_MARK, APLOG_ERR, 0, NULL, "no server context");
    }
  - |-
    void f(apr_pool_t *p) {
        ap_log_perror(APLOG_MARK, APLOG_ERR, 0, p, "pool log");
    }
invalid:
  - 'ap_log_rerror(APLOG_MARK, APLOG_DEBUG, 0, NULL, "msg");'
  - |-
    void f(apr_status_t status) {
        ap_log_rerror(APLOG_MARK, APLOG_ERR, status, NULL, "failed: %s", "x");
    }
  - |-
    void f(void) {
        ap_log_rerror(APLOG_MARK, APLOG_NOTICE, APR_SUCCESS, NULL, "no args");
    }
  - |-
    int f(request_rec *r) {
        if (!r->filename) {
            ap_log_rerror(APLOG_MARK, APLOG_WARNING, 0, NULL, "missing filename for %s", r->uri);
        }
        return DECLINED;
    }
  - |-
    void f(apr_status_t rv, int n) {
        ap_log_rerror(APLOG_MARK, APLOG_DEBUG | APLOG_TOCLIENT, rv, NULL, "n=%d", n);
    }
