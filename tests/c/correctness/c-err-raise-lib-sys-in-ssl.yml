id: c-err-raise-lib-sys-in-ssl
valid:
  - 'ERR_raise(ERR_LIB_SSL, ERR_R_INTERNAL_ERROR);'
  - |-
    int f(void) {
        ERR_raise_data(ERR_LIB_SSL, SSL_R_BAD_LENGTH, "len=%d", n);
        return 0;
    }
  - |-
    int f(void) {
        ERR_raise(ERR_LIB_EVP, ERR_R_PASSED_NULL_PARAMETER);
        return 0;
    }
invalid:
  - 'ERR_raise(ERR_LIB_SYS, ERR_R_INTERNAL_ERROR);'
  - |-
    int f(void) {
        ERR_raise_data(ERR_LIB_SYS, errno, "fopen('%s')", name);
        return 0;
    }
  - |-
    int f(int fd) {
        if (fd < 0) {
            ERR_raise(ERR_LIB_SYS, errno);
            return -1;
        }
        return 0;
    }
  - |-
    void f(void) {
        ERR_raise(ERR_LIB_SYS, ERR_R_INTERNAL_ERROR);
        ERR_raise(ERR_LIB_SSL, ERR_R_MALLOC_FAILURE);
    }
