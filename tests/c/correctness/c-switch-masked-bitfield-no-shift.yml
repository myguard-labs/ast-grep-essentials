id: c-switch-masked-bitfield-no-shift
valid:
  - >-
    int f(unsigned v) { switch ((v & 0xf00) >> 8) { case 6: return 1; } return
    0; }
  - |-
    int f(unsigned v) {
      switch ((v & 0xf0) >> 4) {
        case 2: return 1;
        default: return 0;
      }
    }
  - |-
    int f(unsigned v) {
      switch (v >> 12) {
        case 1: return 10;
        default: return 0;
      }
    }
  - |-
    int f(unsigned v) {
      unsigned field = (v & 0xf00) >> 8;
      switch (field) {
        case 6: return 1;
        default: return 0;
      }
    }
invalid:
  - 'int f(unsigned v) { switch (v & 0xf00) { case 6: return 1; } return 0; }'
  - |-
    int f(unsigned flags) {
      switch (flags & 0xf0) {
        case 2: return 1;
        default: return 0;
      }
    }
  - |-
    struct hdr { unsigned type; };
    int f(const struct hdr *h) {
      switch (h->type & 0xff00) {
        case 1: return 1;
        default: return 0;
      }
    }
  - |-
    int f(unsigned v) {
      switch (v & 0xF000) {
        case 3: return 1;
        case 4: return 2;
      }
      return 0;
    }
