id: c-openssl-dual-error-check
valid:
- int f(unsigned long e) { if (ERR_GET_LIB(e) == ERR_LIB_PEM && ERR_GET_REASON(e) == PEM_R_NO_START_LINE) { return 1; } return 0; }
- int f(unsigned long e) { if (ERR_GET_REASON(e) == PEM_R_NO_START_LINE && ERR_GET_LIB(e) == ERR_LIB_PEM) { return 1; } return 0; }
- int f(unsigned long e) { if (ERR_GET_LIB(e) != ERR_LIB_PEM || ERR_GET_REASON(e) != PEM_R_NO_START_LINE) { return 0; } return 1; }
- int f(unsigned long e) { if ((ERR_GET_LIB(e) == ERR_LIB_X509) && (ERR_GET_REASON(e) == X509_R_KEY_VALUES_MISMATCH)) { return 1; } return 0; }
- '// Near miss: ERR_R_* reasons are library-independent.

  int f(unsigned long e) { if (ERR_GET_REASON(e) == ERR_R_MALLOC_FAILURE) { return 1; } return 0; }'
- '// Near miss: reason is not compared to a library-specific constant.

  int f(unsigned long e, int x) { if (ERR_GET_REASON(e) == x) { return 1; } return 0; }'
- '// Near miss: only the library class is tested.

  int f(unsigned long e) { if (ERR_GET_LIB(e) == ERR_LIB_PEM) { return 1; } return 0; }'
- // if (ERR_GET_REASON(e) == PEM_R_NO_START_LINE) { ... }
- const char *s = "if (ERR_GET_REASON(e) == PEM_R_NO_START_LINE) { }";
- int f(int a) { return a == 1; }
invalid:
- int f(unsigned long e) { if (ERR_GET_REASON(e) == PEM_R_NO_START_LINE) { return 1; } return 0; }
- int f(unsigned long e) { if (ERR_GET_REASON(e) != PEM_R_NO_START_LINE) { return 0; } return 1; }
- int f(void) { if (ERR_GET_REASON(ERR_peek_last_error()) == PEM_R_NO_START_LINE) { ERR_clear_error(); } return 0; }
- int f(unsigned long e, int ok) { if (ok && ERR_GET_REASON(e) == X509_R_KEY_VALUES_MISMATCH) { return 1; } return 0; }
- int f(unsigned long e) { if (ERR_GET_REASON(e) == SSL_R_UNINITIALIZED || ERR_GET_REASON(e) == SSL_R_PROTOCOL_IS_SHUTDOWN) { return 1; } return 0; }
