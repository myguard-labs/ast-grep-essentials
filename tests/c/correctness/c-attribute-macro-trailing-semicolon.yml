id: c-attribute-macro-trailing-semicolon
valid:
  - '#define ZEND_HOT __attribute__((hot))'
  - '#define ZEND_COLD __attribute__((cold, noinline))'
  - '#define PACKED __attribute__((packed, aligned(4)))'
invalid:
  - '#define ZEND_HOT __attribute__((hot));'
  - '#define ZEND_ALIGNED __attribute__((aligned(16)));'
  - '#define ZEND_PURE __attribute__((pure, nothrow)); '
