id: c-bitmask-equals-one
valid:
  - 'int f(int o) { return (o & 1) == 1; }'
  - "int f(int o) { return (o & 8) == 8; }"
  - "int f(int o) { return (o & 8) != 0; }"
  - "int f(int o) { return (o & 1) == 0; }"
  - "int f(int o) { return (o & 8) == 1 << 3; }"
invalid:
  - 'int f(int o) { return (o & 8) == 1; }'
  - "int f(int o) { if ((o & 0x10) == 1) return 1; return 0; }"
  - "int f(unsigned flags) { return (flags & 4) == 1; }"
  - "int f(struct s *p) { return (p->flags & 2) == 1; }"
  - "int f(int o) { return (o&8)==1; }"
