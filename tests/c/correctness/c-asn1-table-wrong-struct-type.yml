id: c-asn1-table-wrong-struct-type
valid:
  - >-
    ASN1_SEQUENCE(CMS_OriginatorInfo) = {
    ASN1_IMP_SET_OF_OPT(CMS_OriginatorInfo, certificates,
    CMS_CertificateChoices, 0) } ASN1_SEQUENCE_END(CMS_OriginatorInfo)
  - 'ASN1_SEQUENCE(CMS_OriginatorInfo) = { ASN1_IMP_SET_OF_OPT(CMS_OriginatorInfo, crls, CMS_RevocationInfoChoice, 1) } ASN1_SEQUENCE_END(CMS_OriginatorInfo)'
  - 'ASN1_SEQUENCE(CMS_SignedData) = { ASN1_IMP_SET_OF_OPT(CMS_SignedData, certificates, CMS_CertificateChoices, 0) } ASN1_SEQUENCE_END(CMS_SignedData)'
invalid:
  - >-
    ASN1_SEQUENCE(CMS_OriginatorInfo) = { ASN1_IMP_SET_OF_OPT(CMS_SignedData,
    certificates, CMS_CertificateChoices, 0) }
    ASN1_SEQUENCE_END(CMS_OriginatorInfo)
  - 'ASN1_SEQUENCE(CMS_OriginatorInfo) = { ASN1_IMP_SET_OF_OPT(CMS_SignedData, crls, CMS_RevocationInfoChoice, 1) } ASN1_SEQUENCE_END(CMS_OriginatorInfo)'
  - 'ASN1_SEQUENCE(CMS_SignedData) = { ASN1_IMP_SET_OF_OPT(CMS_OriginatorInfo, certificates, CMS_CertificateChoices, 0) } ASN1_SEQUENCE_END(CMS_SignedData)'
