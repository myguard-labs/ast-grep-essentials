id: c-macro-unparenthesized-param-arith
valid:
  - '#define F(n) (sizeof(int) + (n) * 4)'
  - '#define AREA(w, h) ((w) * (h) * 2)'
  - '#define OFFSET(base, i) (sizeof(int) - (i) - 1)'
  - '#define BYTES_TO_BITS(n) ((n) * 8)'
invalid:
  - '#define F(n) (sizeof(int) + n * 4)'
  - '#define AREA(w, h) (w * h * 2)'
  - '#define HALF_SUM(a, b) (a + b / 2)'
  - '#define OFFSET(base, i) (sizeof(int) - i - 1)'
