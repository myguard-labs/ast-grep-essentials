id: c-empty-parens-prototype
valid:
  - 'int f(void);'
  - 'int f(int a);'
  - 'int f(int a, ...);'
  - 'int f(void) { return 0; }'
  - 'int f() { return 0; }'
  - 'int (*fp)();'
  - 'int g(char *s);'
  - 'DECLARE_HANDLER();'
invalid:
  - 'int f();'
  - |-
    int f();
    int main(void) { return f(); }
  - 'void g(void) { int f(); }'
  - 'int f(); /* legacy */'
  - 'int g();'
  - 'extern int f();'
  - 'static int f();'
  - 'static char *name();'
  - |-
    void h(void) {
      extern unsigned long count();
    }
