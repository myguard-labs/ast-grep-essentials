id: c-int-literal-missing-ll-suffix
valid:
  - 'long long x = 116444736000000000LL;'
  - 'long long x = 2147483647;'
  - 'long x = 10000000000L;'
  - 'unsigned long long x = 18446744073709551615ULL;'
invalid:
  - 'long long x = 116444736000000000;'
  - 'long long f(long long y) { return y * 100000000000; }'
  - 'static const long long K = 922337203685477580;'
  - 'long long a[2] = { 1, 12345678901 };'
