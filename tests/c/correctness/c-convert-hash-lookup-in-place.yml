id: c-convert-hash-lookup-in-place
valid:
  - >-
    zval *z = zend_hash_str_find(ht, KEY, KEYLEN); if (z) { zend_string *s =
    zval_get_string(z); }
  - >-
    void f(zval *z) { convert_to_string(z); }
  - >-
    void g(zval *z) { zval *y = zend_hash_find(ht, key); convert_to_long(z); }
invalid:
  - >-
    zval *z = zend_hash_str_find(ht, KEY, KEYLEN); if (z) {
    convert_to_string(z); }
  - "void f(HashTable *ht) { zval *z = zend_hash_str_find(ht, KEY, KEYLEN); if (z) { convert_to_long(z); } }"
  - "void f(HashTable *ht) { zval *z = zend_hash_str_find(ht, KEY, KEYLEN); if (z) { convert_to_array(z); } }"
  - "void f(HashTable *ht) { zval *z = zend_hash_str_find(ht, KEY, KEYLEN); while (z) { convert_to_boolean(z); break; } }"
