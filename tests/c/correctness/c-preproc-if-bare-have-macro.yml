id: c-preproc-if-bare-have-macro
valid:
  - |-
    #if defined(HAVE_LIBXML)
    int libxml_enabled;
    #endif
  - |-
    #ifdef ZTS
    static int f(void);
    #endif
  - |-
    #ifdef HAVE_STRUCT_TM_TM_GMTOFF
    int x;
    #endif
  - |-
    #if defined(HAVE_FOO)
    int x;
    #endif
  - |-
    #if HAVE_FOO > 0
    int x;
    #endif
  - |-
    #ifdef HAVE_FOO
    int x;
    #endif
  - |-
    #ifndef HAVE_FOO
    int x;
    #endif
  - |-
    #ifdef HAVE_MMAP
    int mmap_enabled;
    #endif
  - |-
    #if defined(HAVE_MMAP)
    int mmap_enabled;
    #endif
  - |-
    #ifndef HAVE_MMAP
    int mmap_enabled;
    #endif
  - |-
    #if HAVE_MMAP > 0
    int mmap_enabled;
    #endif
invalid:
  - |-
    #if HAVE_LIBXML
    int libxml_enabled;
    #endif
  - |-
    #if ZTS
    static int f(void);
    #endif
  - |-
    #if HAVE_STRUCT_TM_TM_GMTOFF
    int x;
    #endif
  - |-
    #if HAVE_FOO
    int x;
    #endif
  - |-
    #if HAVE_SYS_SELECT_H
    int x;
    #endif
  - |-
    #if HAVE_LIBGD20
    int x;
    #else
    int y;
    #endif
  - |-
    #if HAVE_MMAP
    int mmap_enabled;
    #endif
  - |-
    #if HAVE_SYS_MMAN_H
    int mmap_enabled;
    #endif
  - |-
    #  if HAVE_FORK
    int can_fork;
    #endif
  - |-
    int f(void) {
    #if HAVE_POLL
      return 1;
    #else
      return 0;
    #endif
    }
