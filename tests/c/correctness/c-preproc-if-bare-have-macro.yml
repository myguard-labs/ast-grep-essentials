id: c-preproc-if-bare-have-macro
valid:
  - |-
    #ifdef HAVE_MMAP
    int mmap_enabled;
    #endif
  - |-
    #if defined(HAVE_MMAP)
    int mmap_enabled;
    #endif
  - |-
    #ifndef HAVE_MMAP
    int mmap_enabled;
    #endif
  - |-
    #if HAVE_MMAP > 0
    int mmap_enabled;
    #endif
invalid:
  - |-
    #if HAVE_MMAP
    int mmap_enabled;
    #endif
  - |-
    #if HAVE_SYS_MMAN_H
    int mmap_enabled;
    #endif
  - |-
    #  if HAVE_FORK
    int can_fork;
    #endif
  - |-
    int f(void) {
    #if HAVE_POLL
      return 1;
    #else
      return 0;
    #endif
    }
