id: c-ifndef-extra-tokens-ignored
valid:
  - |-
    #ifndef FOO
    int x;
    #endif
  - |-
    #ifdef FOO // note
    int x;
    #endif
  - |-
    #ifndef FOO /* note */
    int x;
    #endif
  - |-
    #if defined(A) && defined(B)
    int x;
    #endif
  - |-
    #ifndef FOO
    #define FOO 1 2
    #endif
invalid:
  - |-
    #ifndef FOO && defined(BAR)
    int x;
    #endif
  - |-
    #ifdef FOO BAR
    int x;
    #endif
  - |-
    #ifndef FOO || BAR
    int x;
    #endif
  - |-
    #ifndef FOO	&& defined(BAR)
    int x;
    #endif
