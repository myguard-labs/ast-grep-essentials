id: c-type-punned-deref-cast
valid:
  - 'void g(int *buf, int fd) { *buf = fd; }'
  - |-
    #include <stdint.h>
    #include <stddef.h>
    #include <string.h>
    float to_float(uint32_t u) { float x; memcpy(&x, &u, sizeof x); return x; }
  - |-
    #include <stdint.h>
    #include <stddef.h>
    #include <string.h>
    float to_float(uint32_t u) {
      union { uint32_t u; float f; } c;
      c.u = u;
      return c.f;
    }
  - |-
    int next(int *p) { return *(p + 1); }
  - 'void clear(void *p) { *(unsigned char *) p = 0; }'
  - 'unsigned char first(const void *p) { return *(const unsigned char *) p; }'
  - 'char peek(void *p) { return *(char *) p; }'
  - 'signed char peek_signed(void *p) { return *(signed char *) p; }'
invalid:
  - 'void g(char *buf, int fd) { *(int *) buf = fd; }'
  - |-
    float to_float(unsigned u) { return *(float *) &u; }
  - |-
    #include <stdint.h>
    #include <stddef.h>
    #include <string.h>
    uint64_t load(char *buf) { return *(uint64_t *) buf; }
  - |-
    void store(char *p) { *(short *) p = 1; }
  - |-
    #include <wchar.h>
    wchar_t widen(void) { unsigned short s = 1; return *(wchar_t *) &s; }
  - |-
    #include <uchar.h>
    char16_t narrow(void) { unsigned int u = 1; return *(char16_t *) &u; }
  - 'char *as_ptr(void) { long l = 0; return *(char **) &l; }'
  - 'unsigned bits(float x) { return *(unsigned *) &x; }'
  - |-
    int mixed(float f, void *p) {
      unsigned char c = *(unsigned char *) p;
      return c + *(int *) &f;
    }
