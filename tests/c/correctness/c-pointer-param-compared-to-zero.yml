id: c-pointer-param-compared-to-zero
valid:
  - |-
    static int f(int *recurrences, int end) {
     if (end == 0 && *recurrences == 0) return 1;
     return 0;
    }
  - |-
    static int f(char *buf, size_t len) {
      return len == 0 || buf[0] == 0;
    }
  - |-
    static int f(struct node *p, int n) {
      if (p->len == 0 && n) return 1;
      return 0;
    }
invalid:
  - |-
    static int f(int *recurrences, int end) {
     if (end == 0 && recurrences == 0) return 1;
     return 0;
    }
  - |-
    static int done(int *remaining) {
      while (remaining == 0) {
        poll();
      }
      return 1;
    }
  - |-
    static void clamp(unsigned *count, unsigned max) {
      if (count == 0 && max) max--;
      *count = max;
    }
