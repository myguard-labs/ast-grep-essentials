id: c-param-buffer-nul-write-in-place
valid:
  - >-
    static void trim(const char *s, size_t n) { char t[64]; memcpy(t, s, n); t[n
    - 1] = '\0'; }
  - |-
    static void trim(size_t n) {
      char t[64];
      if (n == 0 || n > sizeof t) return;
      memset(t, 'x', n);
      t[n - 1] = '\0';
    }
  - |-
    static void trim(const char *s, size_t n) {
      char *t;
      if (n == 0) return;
      t = malloc(n);
      if (!t) return;
      memcpy(t, s, n);
      t[n - 1] = '\0';
      free(t);
    }
invalid:
  - 'static void trim(char *s, size_t n) { s[n - 1] = ''\0''; }'
  - |-
    static void chomp(char *s) {
      size_t n = strlen(s);
      if (n > 0) s[n - 1] = '\0';
    }
  - |-
    static void lastline(char *buf, size_t len) {
      if (len > 0) buf[len - 1] = '\0';
    }
