id: c-contradictory-negated-mask-conjunction
valid:
  - 'if (!(flags & FLAG_A) && (other & FLAG_A)) return 1;'
  - "if (!(flags & FLAG_A) && (flags & FLAG_B)) return 1;"
  - "if (!(flags & FLAG_A) && !(flags & FLAG_B)) return 1;"
  - "if (!(a->flags & FLAG_A) && (b->flags & FLAG_A)) return 1;"
invalid:
  - 'if (!(flags & FLAG_A) && (flags & FLAG_A)) return 1;'
  - "if (!(st->flags & F_OPEN) && (st->flags & F_OPEN)) return 1;"
  - "int f(int mode) { return !(mode & 0x4) && (mode & 0x4); }"
  - "void g(int f) { while (!(f & M_BUSY) && (f & M_BUSY)) { f = 0; } }"
