id: c-nested-block-comment-open
valid:
  - |-
    /* outer inner */
    int x;
  - |-
    /** doc comment */
    int x;
  - |-
    /*
     * line one
     * line two
     */
    int x;
  - |-
    int x; /* a */ /* b */
    // line /* not a block comment
invalid:
  - |-
    /* outer /* inner */
    int x;
  - |-
    void f(void) {
        int x; /* outer /* inner */
    }
  - |-
    /** doc /* inner */
    int x;
  - |-
    /* start /* middle /* end */
    int x;
  - |-
    /*/* x */
    int x;
