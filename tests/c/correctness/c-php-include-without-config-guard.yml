id: c-php-include-without-config-guard
valid:
  - |
    #ifdef HAVE_CONFIG_H
    #include "config.h"
    #endif
    #include "php.h"
  - |-
    #ifdef HAVE_CONFIG_H
    #include <config.h>
    #endif
    #include <string.h>
    #include "php.h"
    #include "ext/standard/info.h"
  - |-
    #include "php_myext.h"
    #include <string.h>
invalid:
  - |
    #include "php.h"
  - |-
    #include <php.h>
  - |-
    #include "php.h"
    #ifdef HAVE_CONFIG_H
    #include "config.h"
    #endif
  - |-
    #ifdef HAVE_STDLIB_H
    #include <stdlib.h>
    #endif
    #include "php.h"
