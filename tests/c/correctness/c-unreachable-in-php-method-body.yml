id: c-unreachable-in-php-method-body
valid:
  - "PHP_METHOD(Dom_Node, __construct)\n{\n\tZEND_PARSE_PARAMETERS_NONE();\n}"
  - |-
    PHP_METHOD(Dom_Node, isConnected)
    {
    	ZEND_PARSE_PARAMETERS_NONE();
    	zend_throw_error(NULL, "Cannot call isConnected() on an abstract node");
    	RETURN_THROWS();
    }
  - |-
    PHP_METHOD(Dom_Node, hasChildNodes)
    {
    	ZEND_PARSE_PARAMETERS_NONE();
    	RETURN_BOOL(1);
    }
  - |-
    static void classify(int kind)
    {
    	switch (kind) {
    	case 1:
    		return;
    	default:
    		ZEND_UNREACHABLE();
    	}
    }
  - |-
    PHP_METHOD(Dom_Node, kindName)
    {
    	zend_long kind = 1;

    	ZEND_PARSE_PARAMETERS_NONE();
    	switch (kind) {
    	case 1:
    		RETURN_STRING("element");
    	default:
    		ZEND_UNREACHABLE();
    	}
    }
  - |-
    PHP_METHOD(Dom_Node, childCount)
    {
    	zend_long count = 0;

    	ZEND_PARSE_PARAMETERS_NONE();
    	RETURN_LONG(count);
    	ZEND_UNREACHABLE();
    }
invalid:
  - "PHP_METHOD(Dom_Node, __construct)\n{\n\tZEND_UNREACHABLE();\n}"
  - |-
    PHP_METHOD(Dom_Element, remove)
    {
    	ZEND_UNREACHABLE();
    }
  - |-
    PHP_METHOD(Dom_Node, normalize)
    {
    	ZEND_PARSE_PARAMETERS_NONE();
    	ZEND_UNREACHABLE();
    }
  - |-
    PHP_METHOD(Dom_Node, trim)
    {
    	zend_parse_parameters_none();
    	ZEND_UNREACHABLE();
    }
  - |-
    PHP_METHOD(Dom_Node, label)
    {
    	/* implemented by subclasses */
    	ZEND_UNREACHABLE();
    }
  - |-
    PHP_METHOD(Dom_Node, setDepth)
    {
    	zend_long depth;
    	bool strict = 0;

    	ZEND_PARSE_PARAMETERS_START(1, 2)
    		Z_PARAM_LONG(depth)
    		Z_PARAM_OPTIONAL
    		Z_PARAM_BOOL(strict)
    	ZEND_PARSE_PARAMETERS_END();
    	ZEND_UNREACHABLE();
    }
  - |-
    static void classify(int kind)
    {
    	switch (kind) {
    	case 1:
    		return;
    	default:
    		ZEND_UNREACHABLE();
    	}
    }

    PHP_METHOD(Dom_Node, serialize)
    {
    	ZEND_UNREACHABLE();
    }
