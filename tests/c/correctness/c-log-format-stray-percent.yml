id: c-log-format-stray-percent
valid:
  - 'ngx_log_error(NGX_LOG_ERR, log, 0, "out of 100%%, now");'
  - |-
    void f(ngx_log_t *log, int n) {
        ngx_log_error(NGX_LOG_ERR, log, 0, "%s took %d ms", "op", n);
    }
  - |-
    void f(ngx_log_t *log, double r) {
        ngx_log_error(NGX_LOG_INFO, log, 0, "ratio %-10s|%5.2f%%", "x", r);
    }
  - |-
    void f(ngx_log_t *log) {
        ngx_log_error(NGX_LOG_ERR, log, 0, "%s", "50% off");
    }
  - |-
    void f(ngx_log_t *log, ngx_str_t *s) {
        ngx_log_error(NGX_LOG_ERR, log, 0, "bad value \"%V\" at %uz%%", s, (size_t) 3);
    }
invalid:
  - 'ngx_log_error(NGX_LOG_ERR, log, 0, "out of 100%, now");'
  - |-
    void f(ngx_log_t *log) {
        ngx_log_error(NGX_LOG_ERR, log, 0, "disk at 100% (full)");
    }
  - |-
    void f(ngx_log_t *log) {
        ngx_log_error(NGX_LOG_WARN, log, 0, "usage is 90%");
    }
  - |-
    void f(ngx_log_t *log, int n) {
        ngx_log_error(NGX_LOG_ERR, log, 0, "100% sure, got %d", n);
    }
  - |-
    void f(ngx_log_t *log, ngx_err_t err) {
        ngx_log_error(NGX_LOG_CRIT, log, err, "quota 5%, closing");
    }
