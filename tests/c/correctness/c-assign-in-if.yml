id: c-assign-in-if
valid:
- void f(void) { if (x == f()) {} }
- void f(void) { if ((x = f())) {} }
- /* void f(void) { if (x = f()) {} } */
- void f(void) { const char *text = "void f(void) { if (x = f()) {} }"; }
invalid:
- void f(void) { if (x = f()) {} }
- void f(void) { while (x = f()) {} }
- void f(void) { if (x /* comment */ = f()) {} }
- void f(void) { while (/* before */ x = f() /* after */) {} }
- void f(void) { if (x += f()) {} }
- void f(void) { while (x <<= shift) {} }
