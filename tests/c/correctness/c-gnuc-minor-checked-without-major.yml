id: c-gnuc-minor-checked-without-major
valid:
  - |-
    #if __GNUC__>4 || (__GNUC__>=4 && __GNUC_MINOR__>=4)
    #endif
  - |-
    #if (__GNUC__ >= 4 && __GNUC_MINOR__ >= 4) || __GNUC__ > 4
    int x;
    #endif
  - |-
    #if (__GNUC__ == 4 && __GNUC_MINOR__ >= 4) || __GNUC__ >= 5
    int x;
    #endif
  - |-
    #if __GNUC__ > 3 && (__GNUC__ > 4 || __GNUC_MINOR__ >= 4)
    int x;
    #endif
invalid:
  - |-
    #if __GNUC__>=4 && __GNUC_MINOR__>=4
    #endif
  - |-
    #if __GNUC__ >= 3 && __GNUC_MINOR__ >= 1
    int x;
    #endif
  - |-
    #if __GNUC__ >= 4 && __GNUC_MINOR__ >= 4 && defined(__linux__)
    int x;
    #endif
  - |-
    #if __GNUC__ >= 4 && __GNUC_MINOR__ >= 4
    # define HAVE_X 1
    #endif
