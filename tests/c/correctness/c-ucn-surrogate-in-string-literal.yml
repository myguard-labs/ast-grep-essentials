id: c-ucn-surrogate-in-string-literal
valid:
  - 'const char *s = "\u00f6";'
  - |-
    const char *s = "\ud7ff";
  - |-
    const char *s = "\ue000";
  - |-
    const char *s = "\U0001F600";
invalid:
  - 'const char *s = "\udcf6";'
  - |-
    const char *s = "\ud800";
  - |-
    const char *s = "\udfff";
  - |-
    const char *s = "x\uD83D\uDE00";
