id: c-decimal-literal-exceeds-int
valid:
  - 'static const long t = 0x967b1ec0;'
  - 'static const long t = 999999999;'
  - 'static const long t = 2524651200UL;'
  - 'static const long t = 4294967296L;'
invalid:
  - 'static const long t = 2524651200;'
  - 'static const long t = 2147483648;'
  - 'unsigned long v = 18446744073709551615;'
  - 'long f(long y) { return 3000000000 + y; }'
