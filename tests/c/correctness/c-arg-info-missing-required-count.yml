id: c-arg-info-missing-required-count
valid:
  - >-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_x, 0, 0, 1) ZEND_ARG_INFO(0, index)
    ZEND_END_ARG_INFO();
  - 'ZEND_BEGIN_ARG_INFO_EX(arginfo_y, 0, 0, 0) ZEND_END_ARG_INFO();'
  - 'ZEND_BEGIN_ARG_WITH_RETURN_TYPE_INFO_EX(arginfo_y, 0, 1, IS_LONG, 0) ZEND_ARG_INFO(0, a) ZEND_END_ARG_INFO();'
  - 'ZEND_BEGIN_ARG_INFO_EX(arginfo_y, 1, 0, 1) ZEND_ARG_INFO(0, a) ZEND_END_ARG_INFO();'
invalid:
  - >-
    ZEND_BEGIN_ARG_INFO(arginfo_x, 0) ZEND_ARG_INFO(0, index)
    ZEND_END_ARG_INFO();
  - 'ZEND_BEGIN_ARG_INFO(arginfo_y, 1) ZEND_ARG_INFO(0, a) ZEND_END_ARG_INFO();'
  - 'ZEND_BEGIN_ARG_INFO(arginfo_y, 0) ZEND_ARG_INFO(0, a) ZEND_ARG_INFO(0, b) ZEND_END_ARG_INFO()'
