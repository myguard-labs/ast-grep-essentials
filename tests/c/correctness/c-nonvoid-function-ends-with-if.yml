id: c-nonvoid-function-ends-with-if
valid:
  - "int f(int x)\n{\n\tif (x) {\n\t\treturn 1;\n\t}\n\treturn 0;\n}"
  - |-
    int f(int x) { if (x) return 1; else return 0; }
  - |-
    int f(int a, int b) { if (a) { return 1; } else if (b) { return 2; } else { return 3; } }
  - |-
    void f(int x) { if (x) { x++; } }
invalid:
  - "int f(int x)\n{\n\tif (x) {\n\t\treturn 1;\n\t}\n}"
  - |-
    int f(int x) { if (x) return 1; }
  - |-
    static char *pick(char *p, int x) { x++; if (x > 2) { return p; } }
  - |-
    static int g(int a) { if (a < 0) { return -1; } if (a > 9) { return 9; } }
