id: c-same-expr-equal-two-constants-and
valid:
  - 'int f(int x) { if (x == 1 || x == 2) { return 1; } return 0; }'
  - 'int f(int x) { if (x == 1 && x == 1) { return 1; } return 0; }'
  - 'int f(int x, int y, int z) { return x == y && x == z; }'
invalid:
  - 'int f(int x) { if (x == 1 && x == 2) { return 1; } return 0; }'
  - 'int f(int mode) { return mode == 0 && mode == 7; }'
