id: c-block-comment-star-slash-split
valid:
  - |-
    /* a
     * b
     */
  - "/* a\n * path/to/file\n */"
  - "/* a\n */"
  - "// a\n// * /\nint x;"
  - "/* single line */"
invalid:
  - |-
    /* a
     * /
     */
  - "/* a\n * /\n * more\n */"
  - "/* a\n\t* /\n*/"
  - "/*\n * /  \n */"
  - "/* a\r\n * /\r\n */"
