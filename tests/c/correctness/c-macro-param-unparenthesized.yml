id: c-macro-param-unparenthesized
valid:
  - '#define IS_LAST(stat) ((stat) != STAT_LAST)'
  - '#define IS_NEG(x) ((x) < 0)'
  - '#define LOW_BYTE(v) ((v) & 0xff)'
  - '#define FIRST(a) ((a)[0])'
  - '#define TWICE(x) (2 * (x))'
invalid:
  - '#define IS_LAST(stat) (stat != STAT_LAST)'
  - '#define IS_NEG(x) (x < 0)'
  - '#define LOW_BYTE(v) (v & 0xff)'
  - '#define FIRST(a) (a[0])'
