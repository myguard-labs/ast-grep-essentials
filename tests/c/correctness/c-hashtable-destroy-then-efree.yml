id: c-hashtable-destroy-then-efree
valid:
  - |-
    zend_hash_destroy(h);
    FREE_HASHTABLE(h);
  - |-
    void f(HashTable *h, char *buf) {
      zend_hash_destroy(h);
      efree(buf);
    }
  - |-
    void f(obj_t *obj) {
      zend_hash_destroy(&obj->ht);
      efree(obj);
    }
invalid:
  - |-
    zend_hash_destroy(h);
    efree(h);
  - |-
    void f(obj_t *obj) {
      zend_hash_destroy(obj->props);
      efree(obj->props);
    }
  - |-
    void f(HashTable *h, int own) {
      if (own) {
        zend_hash_destroy(h);
        efree(h);
      }
    }
  - |-
    void f(HashTable **h) {
      zend_hash_destroy(*h);
      efree(*h);
    }
