id: c-libc-macro-struct-member
valid:
  - 'struct scheme_handlers { zval *sh_open; zval *sh_close; };'
  - 'struct io_ops { int (*do_read)(int fd); int (*do_write)(int fd); };'
  - 'struct file_info { int opened; int closed; char *getter; };'
invalid:
  - 'struct scheme_handlers { zval *open; zval *close; };'
  - 'struct io_ops { int (*read)(int fd); int (*write)(int fd); };'
  - 'union stat_or_get { long stat; char *get; };'
