id: c-deref-paren-post-increment
valid:
  - 'void f(char *in, char *out) { *out++ = *in++; }'
  - 'void f(char *in, char *out, int n) { while (n--) *out++ = *in++; }'
  - 'void f(char *in, char *out) { *out++ = *in; in++; }'
  - 'void f(char *in, char *out) { *out++ = (*in) + 1; }'
  - 'void f(char *in, char *out) { *out++ = (*in); in++; }'
invalid:
  - 'void f(char *in, char *out) { *out++ = (*in)++; }'
  - 'void f(char *in, char *out, int n) { while (n--) *out++ = (*in)++; }'
  - 'void f(char *in, char *out, int n) { for (int i = 0; i < n; i++) { *out++ = (*in)++; } }'
  - 'void f(char *s, char *d) { if (s) { *d++ = (*s)++; } }'
  - 'void f(struct b *b, char *out) { *out++ = (*b->p)++; }'
