id: c-keyform-option-type-char
valid:
  - '{"CAkeyform", OPT_CAKEYFORM, ''f'', "CA key format"},'
  - |-
    {"certform", OPT_CERTFORM, 'F', "Certificate format"},
  - |-
    {"keyform", OPT_KEYFORM, 'f', "Key format"},
  - |-
    static const OPTIONS opts[] = {
      {"signkeyform", OPT_SIGNKEYFORM, 'f', "Sign key format"},
      {NULL}
    };
invalid:
  - '{"CAkeyform", OPT_CAKEYFORM, ''F'', "CA key format"},'
  - |-
    {"keyform", OPT_KEYFORM, 'F', "Key format"},
  - |-
    static const OPTIONS opts[] = {
      {"signkeyform", OPT_SIGNKEYFORM, 'F', "Sign key format"},
      {NULL}
    };
  - |-
    {"CAkeyform", OPT_CAKEYFORM, 'F', "CA key format (DER/PEM/ENGINE)"},
