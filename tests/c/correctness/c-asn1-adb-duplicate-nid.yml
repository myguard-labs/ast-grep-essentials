id: c-asn1-adb-duplicate-nid
valid:
  - >-
    ASN1_ADB(T) = { ADB_ENTRY(NID_a, ASN1_EXP(T, v.a, ASN1_OCTET_STRING, 0)),
    ADB_ENTRY(NID_b, ASN1_EXP(T, v.b, ASN1_OCTET_STRING, 0)), } ASN1_ADB_END(T,
    0, type, 0, &def, NULL);
  - 'ASN1_ADB(T) = { ADB_ENTRY(NID_a, ASN1_EXP(T, v.a, ASN1_OCTET_STRING, 0)), ADB_ENTRY(NID_a2, ASN1_EXP(T, v.b, ASN1_OCTET_STRING, 0)), ADB_ENTRY(NID_b, ASN1_EXP(T, v.c, ASN1_OCTET_STRING, 0)), } ASN1_ADB_END(T, 0, type, 0, &def, NULL);'
  - 'ASN1_ADB(T) = { ADB_ENTRY(NID_a, ASN1_EXP(T, v.a, ASN1_OCTET_STRING, 0)), } ASN1_ADB_END(T, 0, type, 0, &def, NULL); ASN1_ADB(U) = { ADB_ENTRY(NID_a, ASN1_EXP(U, v.a, ASN1_OCTET_STRING, 0)), } ASN1_ADB_END(U, 0, type, 0, &def, NULL);'
invalid:
  - >-
    ASN1_ADB(T) = { ADB_ENTRY(NID_a, ASN1_EXP(T, v.a, ASN1_OCTET_STRING, 0)),
    ADB_ENTRY(NID_a, ASN1_EXP(T, v.b, ASN1_OCTET_STRING, 0)), } ASN1_ADB_END(T,
    0, type, 0, &def, NULL);
  - 'ASN1_ADB(T) = { ADB_ENTRY(NID_a, ASN1_EXP(T, v.a, ASN1_OCTET_STRING, 0)), ADB_ENTRY(NID_b, ASN1_EXP(T, v.b, ASN1_OCTET_STRING, 0)), ADB_ENTRY(NID_a, ASN1_EXP(T, v.c, ASN1_OCTET_STRING, 0)), } ASN1_ADB_END(T, 0, type, 0, &def, NULL);'
  - 'ASN1_ADB(T) = { ADB_ENTRY(NID_a, ASN1_EXP(T, v.a, ASN1_OCTET_STRING, 0)), ADB_ENTRY(NID_a, ASN1_SIMPLE(T, v.a, ASN1_INTEGER)), } ASN1_ADB_END(T, 0, type, 0, &def, NULL);'
