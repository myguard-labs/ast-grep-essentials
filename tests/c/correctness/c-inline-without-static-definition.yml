id: c-inline-without-static-definition
valid:
  - 'static inline int helper(int x) { return x + 1; }'
  - 'extern inline int helper(int x) { return x + 1; }'
  - 'inline static void note(void) { }'
  - 'int helper(int x) { return x + 1; }'
invalid:
  - 'inline int helper(int x) { return x + 1; }'
  - 'inline void note(void) { }'
  - 'inline long wide(long x) { return x + 1; }'
  - 'inline struct node *first(struct node *n) { return n; }'
