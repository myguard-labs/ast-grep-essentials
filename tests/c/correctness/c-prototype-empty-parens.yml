id: c-prototype-empty-parens
valid:
  - 'int sapi_flush(void);'
  - |-
    void reset(void);
  - |-
    int add(int a, int b);
  - |-
    char *name_of(int id);
invalid:
  - 'int sapi_flush();'
  - |-
    void reset();
  - |-
    #include <stddef.h>
    size_t used();
  - |-
    double now();
  - |-
    struct foo make();
