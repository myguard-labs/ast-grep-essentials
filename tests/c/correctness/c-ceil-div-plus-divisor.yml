id: c-ceil-div-plus-divisor
valid:
  - 'size_t blocks = (inlen + 7) / 8;'
  - 'size_t f(size_t n) { return (n + 15) / 16; }'
  - 'size_t f(size_t n) { return (n + 8) / 16; }'
  - 'size_t f(size_t n) { return (n + 7u) / 8; }'
invalid:
  - 'size_t blocks = (inlen + 8) / 8;'
  - 'size_t blocks = (a * 2 + b + 8) / 8;'
  - 'size_t f(size_t n) { return (n + 8) / 8; }'
  - 'void f(size_t n) { buf = alloc((n + 8) / 8); }'
