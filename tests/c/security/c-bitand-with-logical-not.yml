id: c-bitand-with-logical-not
valid:
  - 'int f(int a, int b) { return a && !b; }'
  - 'int f(int a, int b) { return a & ~b; }'
  - 'int f(int a, int b, int c) { return (a & b) && !c; }'
  - 'int f(int a, int b) { return a & b; }'

invalid:
  - 'int f(int a, int b) { return a & !b; }'
  - 'int f(struct s *p, int x) { return p->flags & !x; }'
  - 'int f(int a, int b) { if (a & !b) { return 1; } return 0; }'
  - 'int f(int a, int b) { return a & !check(b); }'
