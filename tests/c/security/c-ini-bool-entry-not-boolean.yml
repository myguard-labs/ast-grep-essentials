id: c-ini-bool-entry-not-boolean
valid:
  - "PHP_INI_BEGIN()\n\tSTD_PHP_INI_BOOLEAN(\"x.flag\", \"0\", PHP_INI_SYSTEM, OnUpdateBool, flag, zend_x_globals, x_globals)\nPHP_INI_END()"
invalid:
  - "PHP_INI_BEGIN()\n\tSTD_PHP_INI_ENTRY(\"x.flag\", \"0\", PHP_INI_SYSTEM, OnUpdateBool, flag, zend_x_globals, x_globals)\nPHP_INI_END()"
