id: c-nul-index-read-without-length-guard
valid:
  - >-
    int f(const char *salt) { if (salt[0] == '$' && salt[1] == '2' && salt[2] !=
    0 && salt[3] == '$') { return 1; } return 0; }
invalid:
  - >-
    int f(const char *salt) { if (salt[0] == '$' && salt[1] == '2' && salt[3] ==
    '$') { return 1; } return 0; }
