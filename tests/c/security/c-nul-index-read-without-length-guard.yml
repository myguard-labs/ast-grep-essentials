id: c-nul-index-read-without-length-guard
valid:
  - >-
    int f(const char *salt) { if (salt[0] == '$' && salt[1] == '2' && salt[2] !=
    0 && salt[3] == '$') { return 1; } return 0; }
  - "int f(const char *s) { return s[0] == '$' && s[1] == '2' && s[2] == 'a' && s[3] == '$'; }"
  - "int f(const char *s) { return s[0] == '$' && s[1] == '2'; }"
invalid:
  - >-
    int f(const char *salt) { if (salt[0] == '$' && salt[1] == '2' && salt[3] ==
    '$') { return 1; } return 0; }
  - "int f(const char *p) { return p[1] == 'x' && p[3] == 'y'; }"
  - "int f(const char *h) { while (h[0] == '$' && h[1] == 'a' && h[3] == ':') h++; return 0; }"
