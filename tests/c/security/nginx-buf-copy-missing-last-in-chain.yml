id: nginx-buf-copy-missing-last-in-chain
valid:
  - >-
    void cp(ngx_buf_t *dst, ngx_buf_t *src) { dst->flush = src->flush;
    dst->last_buf = src->last_buf; dst->last_in_chain = src->last_in_chain; }
invalid:
  - >-
    void cp(ngx_buf_t *dst, ngx_buf_t *src) { dst->flush = src->flush;
    dst->last_buf = src->last_buf; }
