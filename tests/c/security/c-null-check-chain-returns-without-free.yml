id: c-null-check-chain-returns-without-free
valid:
  - |-
    buf_t *p = alloc(), *q = alloc();
    if (!p || !q) {
      buf_free(p);
      buf_free(q);
      return 0;
    }
  - |-
    char *p = alloc();
    if (!p) {
      return -1;
    }
  - |-
    buf_t *p = alloc(), *q = alloc();
    if (!p || !q) {
      free(p);
      free(q);
      return -1;
    }
  - |-
    buf_t *p = alloc(), *q = alloc();
    if (!p || !q) {
      goto fail;
    }
invalid:
  - |-
    buf_t *p = alloc(), *q = alloc();
    if (!p || !q) {
      return 0;
    }
  - |-
    buf_t *a = alloc(), *b = alloc(), *c = alloc();
    if (!a || !b || !c) {
      return NULL;
    }
  - |-
    buf_t *p = alloc(), *q = alloc();
    if (!p || !q) {
      if (verbose) {
        log_error("alloc");
      }
      return -1;
    }
  - |-
    buf_t *p = alloc(), *q = alloc();
    if ( ! p || ! q ) {
      log_error("alloc");
      return -1;
    }
