id: c-printf-d-format-with-zval-long
valid:
  - >-
    void f(void *w, int o, zval **v) { php_stream_wrapper_log_error(w, o
    TSRMLS_CC, "Unable to resume from offset %ld", Z_LVAL_PP(v)); }
invalid:
  - >-
    void f(void *w, int o, zval **v) { php_stream_wrapper_log_error(w, o
    TSRMLS_CC, "Unable to resume from offset %d", Z_LVAL_PP(v)); }
