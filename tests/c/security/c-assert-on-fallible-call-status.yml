id: c-assert-on-fallible-call-status
valid:
  - >-
    rc = apr_procattr_error_check_set(attr, 1); if (rc != APR_SUCCESS) return
    rc;
  - 'ap_assert(ptr != NULL);'
  - 'rv = apr_pool_create(&p, NULL); if (rv != APR_SUCCESS) { return rv; }'
invalid:
  - 'rc = apr_procattr_error_check_set(attr, 1); ap_assert(rc == APR_SUCCESS);'
  - 'ap_assert(status == APR_SUCCESS);'
  - 'ap_assert(apr_pool_create(&p, NULL) == APR_SUCCESS);'
