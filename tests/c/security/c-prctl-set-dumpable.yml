id: c-prctl-set-dumpable
valid:
- void f(void) { prctl(PR_SET_DUMPABLE, 0); }
- void f(void) { prctl(PR_GET_DUMPABLE); }
- /* void f(void) { prctl(PR_SET_DUMPABLE, 1); } */
- void f(void) { const char *text = "void f(void) { prctl(PR_SET_DUMPABLE, 1); }"; }
invalid:
- void f(void) { prctl(PR_SET_DUMPABLE, 1); }
- void f(void) { prctl(PR_SET_DUMPABLE, 1, 0, 0, 0); }
