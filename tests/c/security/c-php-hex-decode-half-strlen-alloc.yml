id: c-php-hex-decode-half-strlen-alloc
valid:
  - >-
    if (strlen((char*)s->children->content) % 2 != 0) return NULL; str =
    zend_string_alloc(strlen((char*)s->children->content) / 2, 0);
  - 'if (strlen(hex) % 2) { return NULL; } log(); str = zend_string_alloc(strlen(hex) / 2, 0);'
  - 'if ((strlen(hex) % 2) == 1) return NULL; str = zend_string_alloc(strlen(hex) / 2, 0);'
  - 'str = zend_string_alloc(strlen(hex), 0);'
  - 'if (strlen(hex) & 1) return NULL; str = zend_string_alloc(strlen(hex) / 2, 0);'
  - 'void f(char *hex) { size_t len = strlen(hex); if (len % 2) return; str = zend_string_alloc(strlen(hex) / 2, 0); }'
  - 'void f(char *hex) { size_t len; len = strlen(hex); if (len & 1) return; str = zend_string_alloc(strlen(hex) / 2, 0); }'
invalid:
  - 'str = zend_string_alloc(strlen((char*)s->children->content) / 2, 0);'
  - 'str = zend_string_alloc(strlen(hex) / 2 + 1, 0);'
  - 'void f(char *hex) { str = zend_string_alloc(strlen(hex) / 2, 0); }'
  - 'str = zend_string_alloc(strlen(hex) /* c */ / 2, 0);'
  - 'if (ok && 1 < n) return NULL; str = zend_string_alloc(strlen(hex) / 2, 0);'
  - 'if (strlen(hex) & 16) return NULL; str = zend_string_alloc(strlen(hex) / 2, 0);'
  - 'if (strlen(hex) % 20) return NULL; str = zend_string_alloc(strlen(hex) / 2, 0);'
  - 'if (flags & 1) return NULL; str = zend_string_alloc(strlen(hex) / 2, 0);'
  - 'if (strlen(a) % 2) return NULL; str = zend_string_alloc(strlen(b) / 2, 0);'
  - 'void f(char *hex) { size_t len = strlen(hex); if (flags & 1) return; str = zend_string_alloc(strlen(hex) / 2, 0); }'
  - 'void f(char *hex, char *o) { size_t len = strlen(o); if (len % 2) return; str = zend_string_alloc(strlen(hex) / 2, 0); }'
  - 'void f(char *hex) { size_t len = strlen(hex); if (debug) log(len % 2); str = zend_string_alloc(strlen(hex) / 2, 0); }'
  - 'if (debug) { log(strlen(hex) % 2); } str = zend_string_alloc(strlen(hex) / 2, 0);'
  - 'void f(char *hex) { size_t len = strlen(hex); len = 0; if (len % 2) return; str = zend_string_alloc(strlen(hex) / 2, 0); }'
  - 'void f(char *hex) { size_t len; len = strlen(hex); len += 2; if (len & 1) return; str = zend_string_alloc(strlen(hex) / 2, 0); }'
