id: c-printf-wrapper-missing-format-attribute
valid:
  - >-
    void log_line(int level, const char *fmt, ...)
    __attribute__((format(printf,2,3)));
  - "void log_line(int level, const char *fmt, ...) __attribute__((format(printf, 2, 3)));"
  - "void log_line(int level, const char *fmt, ...) __attribute__ ((format (printf, 2, 3)));"
  - "void log_line(int level, const char *fmt);"
invalid:
  - 'void log_line(int level, const char *fmt, ...);'
  - "void log_line(int level, const char *fmt, ...) __attribute__((nonnull(2)));"
  - "void   log_line(int   level,\n    const char *fmt,\n    ...);"
  - "void log_line(int level, const char* fmt, ...);"
  - "void log_line(int level, const char *fmt, ...) __attribute__((noreturn));"
