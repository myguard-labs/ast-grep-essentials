id: c-index-bound-uses-greater-than
valid:
  - |-
    #define N 8
    int f(const int *t, int i) {
     if (i >= N) return -1;
     return t[i];
    }
  - 'int f(const int *t, int i) { if (i < N) return t[i]; return -1; }'
  - 'int f(const int *t, int i) { if (i < 0 || i >= N) return -1; return t[i]; }'

invalid:
  - |-
    #define N 8
    int f(const int *t, int i) {
     if (i > N) return -1;
     return t[i];
    }
  - 'void f(const int *t, int i) { if (i > N) return; use(t[i]); }'
  - 'int f(const int *t, int i) { if (i > N) return -1; else return t[i]; }'
  - 'int f(const int *t, int i, int n) { if (i > n) return NULL; return t[i]; }'
