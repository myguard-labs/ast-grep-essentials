id: c-fixed-buffer-pointer-write-unbounded
valid:
  - >-
    static int f(const char *p) { char buf[18]; char *p2 = buf; while (*p) { if
    (p2 - buf >= sizeof(buf)) { return -1; } *p2 = *p; p2++; p++; } return 0; }
invalid:
  - >-
    static int f(const char *p) { char buf[18]; char *p2 = buf; while (*p) { *p2
    = *p; p2++; p++; } return 0; }
