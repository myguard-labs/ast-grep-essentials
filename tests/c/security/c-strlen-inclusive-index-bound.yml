id: c-strlen-inclusive-index-bound
valid:
  - >-
    size_t n; char *s; int f(size_t off) { if (off < n) { return s[off]; }
    return 0; }
  - "size_t n; char *s; int f(size_t off) { if (off <= n) { return 0; } return 1; }"
  - "size_t n; char *s; int f(size_t off, size_t k) { if (off <= n) { return s[k]; } return 0; }"
invalid:
  - >-
    size_t n; char *s; int f(size_t off) { if (off <= n) { return s[off]; }
    return 0; }
  - "char *buf; int f(size_t i, size_t len) { if (i <= len) { x = buf[i]; y = 1; } return 0; }"
  - "char *s; int f(size_t pos) { if (pos <= strlen(s)) { c = s[pos]; } return 0; }"
