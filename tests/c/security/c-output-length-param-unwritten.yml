id: c-output-length-param-unwritten
valid:
  - >-
    static int f(char *v, int val_len, int *new_val_len) { *new_val_len =
    val_len; return 1; }
  - 'static int f(char *v, int val_len, int *new_val_len) { if (val_len < 0) { *new_val_len = 0; return -1; } *new_val_len = val_len; return 0; }'
  - 'static int f(char *v, int val_len) { return val_len; }'
  - 'static int f(char *v, int *new_val_len) { *new_val_len = (int)strlen(v); return 0; }'
  - 'static int f(char *v, int val_len, int *new_val_len) { /* new_val_len is written below */ *new_val_len = val_len; return 1; }'
invalid:
  - 'static int f(char *v, int val_len, int *new_val_len) { return val_len; }'
  - 'static int f(char *v, unsigned long *new_val_len) { if (!v) { return -1; } return 0; }'
  - 'static int f(char *v, int* new_val_len) { return 1; }'
  - 'static int f(char *v, int *new_val_len) { if (*new_val_len > 0) { return 1; } return 0; }'
