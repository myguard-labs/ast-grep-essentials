id: c-unescape-backslash-read-past-end
valid:
  - 'if (*src++ == ''\\'' && src < end) { *dst = *src++; }'
  - 'void f(const char *p, const char *end, char *dst) { if (p + 1 < end && *p++ == ''\\'') { *dst = *p++; } }'
  - 'void f(const char *p, const char *end, char *dst) { if (*p == ''\\'' && p + 1 < end) { p++; *dst = *p++; } }'
  - 'void f(const char *p, const char *end, char *dst) { if (p + 1 < end && *p == ''\\'') { p++; *dst = *p; } }'
  - 'void f(const char *p, char *dst) { if (*p++ == ''\\'') { *dst = 0; } }'
  - 'void f(const char *p, char *dst) { if (*p++ == ''\\'') { if (*p) { *dst = *p++; } } }'
  - 'void f(const char *p, const char *end, char *dst) { if (*p++ == ''\\'') { if (p < end) { *dst = *p++; } } }'
invalid:
  - 'if (*src++ == ''\\'') { *dst = *src++; }'
  - 'void f(const char *p, char *dst) { if (*p++ == ''\\'') { *dst++ = *p++; } }'
  - 'void f(const char *p, char *dst) { if (*p++ == ''\\'') { c = *p++; } }'
  - 'void f(const char *p, char *dst) { if (*p++ == ''\\'') { switch (*p++) { case ''n'': *dst = 10; break; } } }'
  - 'void f(const char *p, char *dst) { while (*p) { if (*p++ == ''\\'') { *dst++ = *p++; } } }'
  - 'void f(const char *p, const char *q, char *dst) { if (*p++ == ''\\'') { if (*q) { *dst = *p++; } } }'
  - 'void f(const char *p, char *dst) { if (*p++ == ''\\'') { *dst = *p++; if (*p) { *dst = 0; } } }'
