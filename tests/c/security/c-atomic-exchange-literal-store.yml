id: c-atomic-exchange-literal-store
valid:
  - >-
    static bool s_exchange(zend_atomic_bool *obj, bool desired) { bool prev =
    obj->value; obj->value = desired; return prev; }
invalid:
  - >-
    static bool s_exchange(zend_atomic_bool *obj, bool desired) { bool prev =
    obj->value; obj->value = true; return prev; }
