id: c-digit-backref-index-unbounded
valid:
  - >-
    static int f(const char *w, int *subs, int n) { if ('0' <= w[1] && '9' >=
    w[1] && w[1] - '0' <= n && subs[w[1] - '0'] > -1) { return 1; } return 0; }
  - "static int f(const char *p, int *map, int max) { if ('0' <= *p && *p <= '9' && *p - '0' <= max && map[*p - '0'] != 0) { return 1; } return 0; }"
  - "static int f(const char *w, int *subs, int n) { int idx = w[1] - '0'; if (idx < 0 || idx >= n) return 0; return subs[idx] > -1; }"
  - "static int f(const char *w, int *subs) { return subs[0] > -1; }"
invalid:
  - >-
    static int f(const char *w, int *subs) { if ('0' <= w[1] && '9' >= w[1] &&
    subs[w[1] - '0'] > -1) { return 1; } return 0; }
  - "static int f(const char *c, int *tab) { if ('0' <= *c && *c <= '9' && tab[*c - '0']) { return 1; } return 0; }"
  - "static int f(const char *p, int *tab) { while ('0' <= *p && tab[*p - '0'] > 0) { p++; } return 0; }"
  - "static int f(char c, int *tab) { if ('0' <= c && c <= '9' && tab[c - '0'] > -1 && c != 'x') { return 1; } return 0; }"
