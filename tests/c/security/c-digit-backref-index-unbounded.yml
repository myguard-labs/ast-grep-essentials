id: c-digit-backref-index-unbounded
valid:
  - >-
    static int f(const char *w, int *subs, int n) { if ('0' <= w[1] && '9' >=
    w[1] && w[1] - '0' <= n && subs[w[1] - '0'] > -1) { return 1; } return 0; }
invalid:
  - >-
    static int f(const char *w, int *subs) { if ('0' <= w[1] && '9' >= w[1] &&
    subs[w[1] - '0'] > -1) { return 1; } return 0; }
