id: c-guard-after-minus-one-index
valid:
  - 'void f(const char *p, size_t n) { while (n > 1 && p[n - 1] == ''/'') n--; }'
  - |-
    int g(const char *buf, size_t len) { return len >= 2 && buf[len - 1] == 10; }
  - |-
    void f(const char *p, size_t n) { if (n > 1 && p[n - 2] == 47 && p[n - 1] == 47) n--; }
invalid:
  - 'void f(const char *p, size_t n) { while (p[n - 1] == ''/'' && n > 1) n--; }'
  - |-
    int g(const char *buf, size_t len) { if (buf[len - 1] == 10 && len > 1) return 1; return 0; }
  - |-
    int g(const char *s, size_t n) { return s[n - 1] == 0 && s[0] == 1 && n > 1; }
