id: c-ctor-parse-params-no-eh-throw
valid:
  - |-
    PHP_METHOD(PDO, dbh_constructor) {
     zend_replace_error_handling(EH_THROW, pdo_exception_ce, &zeh);
     if (FAILURE == zend_parse_parameters(ZEND_NUM_ARGS(), "s", &dsn)) {
     ZEND_CTOR_MAKE_NULL();
     return;
     }
    }
  - "PHP_METHOD(A, b) { if (zend_parse_parameters(ZEND_NUM_ARGS(), \"s\", &dsn) == FAILURE) { return; } }"
  - "PHP_METHOD(A, b) { if (obj == NULL) { ZEND_CTOR_MAKE_NULL(); return; } }"
  - "PHP_METHOD(A, b) { zend_replace_error_handling(EH_THROW, ce, &zeh); setup(); if (zend_parse_parameters(ZEND_NUM_ARGS(), \"s\", &dsn) == FAILURE) { ZEND_CTOR_MAKE_NULL(); return; } }"
invalid:
  - |-
    PHP_METHOD(PDO, dbh_constructor) {
     if (FAILURE == zend_parse_parameters(ZEND_NUM_ARGS(), "s", &dsn)) {
     ZEND_CTOR_MAKE_NULL();
     return;
     }
    }
  - "PHP_METHOD(A, b) { zend_replace_error_handling(EH_NORMAL, NULL, &zeh); if (zend_parse_parameters(ZEND_NUM_ARGS(), \"s\", &dsn) == FAILURE) { ZEND_CTOR_MAKE_NULL(); return; } }"
  - "PHP_METHOD(A, b) { if (zend_parse_parameters(ZEND_NUM_ARGS(), \"s\", &dsn) != SUCCESS) { ZEND_CTOR_MAKE_NULL(); return; } }"
  - "PHP_METHOD(A, b) { if (zend_parse_parameters(ZEND_NUM_ARGS(), \"s\", &dsn) == FAILURE) { ZEND_CTOR_MAKE_NULL(); return; } else { go(); } }"
  - "PHP_METHOD(A, b) { if (zend_parse_parameters(ZEND_NUM_ARGS(), \"s\", &dsn) == FAILURE) { ZEND_CTOR_MAKE_NULL(); return; } zend_replace_error_handling(EH_THROW, ce, &zeh); }"
