id: c-cast-member-pointer-deref-unchecked
valid:
  - >-
    long read_value(const struct any *pSource) { long *p_value = (long
    *)pSource->_value; if (p_value) { return *p_value; } return 0; }
invalid:
  - >-
    long read_value(const struct any *pSource) { long *p_value = (long
    *)pSource->_value; return *p_value; }
