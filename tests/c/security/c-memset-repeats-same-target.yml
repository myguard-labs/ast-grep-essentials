id: c-memset-repeats-same-target
valid:
  - >-
    struct a { int x; }; struct b { int y; }; void f(void) { struct a x; struct
    b y; memset(&x, 0, sizeof(x)); memset(&y, 0, sizeof(y)); }
invalid:
  - >-
    struct a { int x; }; struct b { int y; }; void f(void) { struct a x; struct
    b y; memset(&x, 0, sizeof(x)); memset(&x, 0, sizeof(y)); }
