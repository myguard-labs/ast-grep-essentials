id: c-sprintf-strlen-sum-heap-overflow
valid:
  - >-
    cmd = malloc(strlen(a) + strlen(b) + 4); snprintf(cmd, strlen(a) + strlen(b)
    + 4, "%s /c %s", a, b);
  - "cmd = malloc(n); snprintf(cmd, n, \"%s\", a);"
  - "cmd = malloc(n); snprintf(cmd, n, \"%s/%s\", a, b);"
  - "void g(void){ char *cmd = malloc(strlen(a) + 1); } void f(size_t n){ cmd = malloc(n); sprintf(cmd, \"%s\", a); } void h(size_t n){ sprintf(cmd, \"%s\", a); }"
invalid:
  - 'cmd = malloc(strlen(a) + strlen(b) + 4); sprintf(cmd, "%s /c %s", a, b);'
  - 'cmd = malloc(strlen(a) + 1); sprintf(cmd, "%s", a);'
  - 'void f(void) { char *cmd = malloc(strlen(a) + 4); sprintf(cmd, "%s", a); }'
