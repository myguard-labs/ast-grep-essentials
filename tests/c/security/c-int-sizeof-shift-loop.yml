id: c-int-sizeof-shift-loop
valid:
  - 'void f(size_t n) { size_t j = sizeof(long); for (; j < n; j <<= 1) {} }'
  - "void f(void) { int j = sizeof(long); for (int i = 0; i < 8; i++) { j += 1; } }"
  - "void f(size_t n) { uint64_t j = sizeof(long); for (; j < n; j <<= 1) {} }"
  - "void f(void) { int j = sizeof(long); j <<= 1; }"
invalid:
  - 'void f(size_t n) { int j = sizeof(long); for (; j < n; j <<= 1) {} }'
  - "void f(size_t n) { int j = sizeof(struct stat); for (; j < n; j <<= 1) {} }"
  - "void f(size_t n) { int j = sizeof n; for (; j < n; j <<= 1) {} }"
  - "void f(size_t n) { int j = sizeof(long); for (int i = 0; i < 8; i++) { j <<= 1; } }"
