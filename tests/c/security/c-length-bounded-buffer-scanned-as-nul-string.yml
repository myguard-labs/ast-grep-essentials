id: c-length-bounded-buffer-scanned-as-nul-string
valid:
  - >-
    static int f(const char *buf, size_t len) { const char *p = buf; while
    (len-- > 0 && *p) p++; return len > 0; }
invalid:
  - >-
    static int f(const char *buf, size_t len) { const char *p = buf; while (*p)
    p++; return len > 0; }
