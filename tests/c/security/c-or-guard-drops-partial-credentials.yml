id: c-or-guard-drops-partial-credentials
valid:
  - >-
    void connect(char *ds, char *user, char *pass) { char *conn; if (!user &&
    !pass) { conn = ds; } else if (user) { conn = ds; } }
invalid:
  - >-
    void connect(char *ds, char *user, char *pass) { char *conn; if (!user ||
    !pass) { conn = ds; } else if (user) { conn = ds; } }
