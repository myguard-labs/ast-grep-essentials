id: c-xor-as-exponent-literal
valid:
  - 'int m = 255 * 2;'
  - "int m = 1 << 8;"
  - "int f(int a) { int m = a ^ 2; return m; }"
  - "int f(int mask) { int m = 0xFF ^ mask; return m; }"
invalid:
  - 'int m = 255 ^ 2;'
  - "int m = 2 ^ 8;"
  - "unsigned x = 10 ^ 3;"
  - "int f(void) { return 0x10 ^ 0x01; }"
