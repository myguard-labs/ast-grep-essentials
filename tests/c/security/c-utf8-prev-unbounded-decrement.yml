id: c-utf8-prev-unbounded-decrement
valid:
  - |-
    static const u_char *
    prev(const u_char *p, const u_char *start)
    {
        u_char c;
        do {
            p--;
            if (p < start) {
                break;
            }
            c = *p;
        } while ((c & 0xc0) == 0x80);
        return p;
    }
  - "const u_char *prev(const u_char *p, u_char c) { do { c = *p; p++; } while ((c & 0xc0) == 0x80); return p; }"
  - "const u_char *prev(const u_char *p, const u_char *start) { do { p--; if (p < start) { return NULL; } } while ((*p & 0xc0) == 0x80); return p; }"
invalid:
  - |-
    static const u_char *
    prev(const u_char *p, const u_char *start)
    {
        u_char c;
        do {
            p--;
            c = *p;
        } while ((c & 0xc0) == 0x80);
        return p;
    }
  - "const u_char *prev(const u_char *p) { do { p--; } while ((*p & 0xc0) == 0x80); return p; }"
  - "const u_char *prev(const u_char *p, u_char c) { do { p--; c = *p; } while (c >= 0x80 && c < 0xc0); return p; }"
