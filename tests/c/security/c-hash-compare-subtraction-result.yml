id: c-hash-compare-subtraction-result
valid:
  - 'if (p1->h != p2->h) return p1->h > p2->h ? 1 : -1;'
  - |-
    result = (p1->h > p2->h) - (p1->h < p2->h);
  - |-
    result = strcmp(p1->name, p2->name);
invalid:
  - |-
    result = p1->h - p2->h;
    if (result != 0) return result;
  - |-
    result = a->hash - b->hash;
  - |-
    result = (*pa)->len - (*pb)->key;
