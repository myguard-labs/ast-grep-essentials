- void f(void) { ngx_free(buf); buf = NULL; }
- void f(void) { free(p); other(); p = NULL; }
- void f(void) { free((p)); p = NULL; }
- void f(void) { free(((p))); p = NULL; }
- void f(void) { free((void *) p); p = NULL; }
- void f(void) { char *q = ngx_palloc(pool, n); use(q); }
