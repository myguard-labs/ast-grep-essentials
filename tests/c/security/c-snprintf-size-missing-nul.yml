id: c-snprintf-size-missing-nul
valid:
  - 'void f(const char *v) { int n = snprintf(NULL, 0, "%s", v); char *b = malloc(n + 1); }'
  - 'void f(const char *v) { int n = snprintf(NULL, 0, "%s", v); char *b = malloc(1 + n); }'
  - 'void f(const char *v) { int n = snprintf(NULL, 0, "%s", v); char *b = malloc((size_t)n + 1); }'
  - 'void f(const char *v) { int n; n = snprintf(NULL, 0, "%s", v); char *b = malloc(n + 1); }'
  - 'void f(const char *v, char *buf, size_t sz) { int n = snprintf(buf, sz, "%s", v); char *b = malloc(n); }'
  - 'void f(const char *v) { int n = snprintf(NULL, 1, "%s", v); char *b = malloc(n); }'
  - 'void f(const char *v) { int n = measure(NULL, 0, "%s", v); char *b = malloc(n); }'
  - 'void f(const char *v, int m) { int n = snprintf(NULL, 0, "%s", v); char *b = malloc(m); }'
  - 'void f(const char *v) { int n = snprintf(NULL, 0, "%s", v); char *b = my_malloc(n); }'
  - 'void f(const char *v) { char *b = malloc(n); }'
  - 'void f(const char *v) { int n = snprintf(NULL, 0, "%s", v); n = n + 1; char *b = malloc(n); }'
  - 'void f(const char *v) { int n = snprintf(NULL, 0, "%s", v); ++n; char *b = malloc(n); }'
  - 'void f(const char *v) { int n = snprintf(NULL, 0, "%s", v); n++; char *b = malloc(n); }'
  - 'void f(const char *v) { int n = snprintf(NULL, 0, "%s", v); char *b = pemalloc(4096, n); }'
  - 'void f(const char *v) { { int n = snprintf(NULL, 0, "%s", v); char *a = malloc(n + 1); } { size_t n = 4096; char *b = malloc(n); } }'
  - 'void f(const char *v) { /* int n = snprintf(NULL, 0, "%s", v); char *b = malloc(n); */ }'
  - 'const char *s = "int n = snprintf(NULL, 0, \"%s\", v); char *b = malloc(n);";'
invalid:
  - 'void f(const char *v) { int n = snprintf(NULL, 0, "%s", v); char *b = malloc(n); }'
  - 'void f(const char *v) { int n; n = snprintf(NULL, 0, "%s", v); char *b = malloc(n); }'
  - 'void f(const char *f, va_list ap) { int n = vsnprintf(NULL, 0, f, ap); char *b = malloc(n); }'
  - 'void f(const char *v) { int n = snprintf(NULL, 0, "%s", v); char *b = emalloc(n); }'
  - 'void f(const char *v) { int n = snprintf(NULL, 0, "%s", v); char *b = xmalloc(n); }'
  - 'void f(const char *v) { int n = snprintf(NULL, 0, "%s", v); char *b = alloca(n); }'
  - 'void f(const char *v) { int n = snprintf(NULL, 0, "%s", v); char *b = pemalloc(n); }'
