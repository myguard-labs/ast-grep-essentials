id: c-capacity-minus-offset-guard-underflow
valid:
  - 'if (sizeof(buf) < (len + (p - buf))) return -1;'
  - 'if ((size_t)(p - buf) > sizeof(buf) || len > sizeof(buf) - (size_t)(p - buf)) return -1;'
  - 'if (p - buf >= (ptrdiff_t) sizeof(buf)) return -1;'
  - 'if (sizeof(buf) < len) return -1;'
invalid:
  - 'if ((sizeof(buf) - (p - buf)) < len) return -1;'
  - 'if ((sizeof(s->buf) - (p - s->buf)) < s->len) return -1;'
  - 'if ((sizeof(out) - (cur - out)) < n + 1) return -1;'
