id: nginx-use-after-finalize
valid:
  - 'void f(ngx_http_request_t *r) { ngx_http_finalize_request(r, 400); return; }'
  - 'void f(ngx_http_request_t *r) { ngx_http_finalize_request(r, 400); }'
  - 'void f(ngx_http_request_t *r) { ngx_log_t *log = r->connection->log; ngx_http_finalize_request(r, 400); ngx_log_error(1, log, 0, "bad"); }'
  - 'void f(ngx_http_request_t *r, ngx_http_request_t *sr) { ngx_http_finalize_request(r, 400); ngx_log_error(1, sr->connection->log, 0, "bad"); }'
  - 'void f(ngx_http_request_t *r) { my_finalize_request(r, 400); ngx_log_error(1, r->connection->log, 0, "bad"); }'
  - 'void f(void) { /* ngx_http_finalize_request(r, 400); r->count = 0; */ }'
  - 'const char *s = "ngx_http_finalize_request(r, rc); r->count;";'
invalid:
  - 'void f(ngx_http_request_t *r) { ngx_http_finalize_request(r, 400); ngx_log_error(1, r->connection->log, 0, "bad"); }'
  - 'void g(ngx_http_request_t *r, ngx_int_t rc) { ngx_http_finalize_request(r, rc); r->count = 0; }'
