  - 'void f(const u_char *src) { u_char name[32]; ngx_cpystrn(name, src, sizeof(name)); }'
  - 'void f(const char *src) { char name[32]; snprintf(name, sizeof(name), "%s", src); }'
  - 'void f(void) { /* strncpy(name, src, sizeof(name)); */ }'
  - 'const char *s = "strncpy(name, src, sizeof(name))";'
invalid:
  - 'void f(const char *src) { char buf[64]; strncpy(buf, src, sizeof(buf)); }'
