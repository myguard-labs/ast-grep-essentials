id: c-getenv-result-to-format-s
valid:
  - 'void f(void) { const char *h = getenv("HOME"); printf("%s\n", h ? h : ""); }'
  - 'void f(void) { const char *h = getenv("HOME"); if (h) { printf("%s\n", h); } }'
  - 'void f(void) { printf("%s", getenv("X") ? getenv("X") : "-"); }'
  - 'void f(void) { printf("%d\n", atoi(getenv("N"))); }'
  - 'void f(void) { printf("%p\n", (void *)getenv("X")); }'
  - 'void f(void) { printf("%s", my_getenv("X")); }'
  - 'void f(void) { printf("plain\n"); }'
  - 'void f(const char *v) { printf("%s\n", v); }'
  - 'void f(void) { getenv("HOME"); }'
  - 'void f(void) { /* printf("%s", getenv("HOME")); */ }'
  - 'const char *s = "printf(\"%s\", getenv(\"HOME\"));";'
invalid:
  - 'void f(void) { printf("%s\n", getenv("HOME")); }'
  - 'void f(void) { fprintf(stderr, "path=%s\n", getenv("PATH")); }'
  - 'void f(char *b, size_t n) { snprintf(b, n, "%s", getenv("X")); }'
  - 'void f(char *b) { sprintf(b, "%s", getenv("X")); }'
  - 'void f(char **b) { asprintf(b, "%s", getenv("X")); }'
  - 'void f(int fd) { dprintf(fd, "%s", getenv("X")); }'
  - 'void f(void) { syslog(LOG_INFO, "%s", getenv("X")); }'
  - 'void f(void) { printf("%s", secure_getenv("X")); }'
  - 'void f(int n) { printf("count=%d and %s\n", n, getenv("X")); }'
  - 'void f(void) { printf("%-20s|", getenv("X")); }'
  - 'void f(void) { printf("%.8s", getenv("X")); }'
