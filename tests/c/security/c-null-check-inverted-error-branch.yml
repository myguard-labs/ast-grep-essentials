id: c-null-check-inverted-error-branch
valid:
  - |-
    int f(char *buf, int len) {
      if (!buf) {
        return 0;
      } else {
        return len + buf[0];
      }
    }
invalid:
  - |-
    int f(char *buf, int len) {
      if (buf) {
        return 0;
      } else {
        return len + buf[0];
      }
    }
