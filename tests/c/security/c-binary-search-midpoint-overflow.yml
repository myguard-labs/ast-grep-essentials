id: c-binary-search-midpoint-overflow
valid:
  - >-
    int tz_mid(int left, int right) { int mid = left + (right - left) / 2;
    return mid; }
  - 'int mid = lo + (hi - lo) / 2;'
  - 'int mid = (hi - lo) / 2 + lo;'
  - 'int half = (hi - lo) / 2;'

invalid:
  - >-
    int tz_mid(int left, int right) { int mid = (left + right) / 2; return mid;
    }
  - 'while (lo < hi) { size_t mid = (lo + hi) / 2; if (a[mid] < k) lo = mid + 1; else hi = mid; }'
  - 'int mid = (low + high) / 2;'
  - 'return (a + b) / 2;'
