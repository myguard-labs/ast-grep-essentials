id: c-getenv-result-strtok-mutates
valid:
  - 'char *p = strdup(getenv("PATH")); char *t = strtok(p, ":");'
  - |-
    char *p = getenv("PATH"); char *q = strdup(p); char *t = strtok(q, ":");
  - |-
    char *p = getenv("PATH"); char *t = strtok(buf, ":");
invalid:
  - 'char *p = getenv("PATH"); char *t = strtok(p, ":");'
  - |-
    char *p = getenv("HOME"); char *t = strtok(p, "/");
  - |-
    char *dirs = getenv(name);
    char *first = strtok(dirs, delim);
