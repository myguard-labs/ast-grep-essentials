id: c-lookahead-index-without-length-guard
valid:
  - >-
    int f(const char *s, size_t n, size_t i) { if (s[i] == ';' && i + 1 < n &&
    s[i + 1] != ';') { return 1; } return 0; }
invalid:
  - >-
    int f(const char *s, size_t n, size_t i) { if (s[i] == ';' && s[i + 1] !=
    ';') { return 1; } return 0; }
