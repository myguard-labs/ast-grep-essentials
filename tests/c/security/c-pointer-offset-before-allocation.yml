id: c-pointer-offset-before-allocation
valid:
  - 'char *b = malloc(n); char *e = b + n;'
  - 'b = malloc(n); char *e = b + n;'
  - 'char *e = other + n; b = malloc(n);'
  - 'char *b = malloc(n); if (!b) { return; } char *e = b + n;'
  - 'int f(size_t n) { /* char *b = NULL; char *e = b + n; b = malloc(n); */ return 0; }'
invalid:
  - 'char *b = NULL; char *e = b + n; b = malloc(n);'
  - 'char *base = NULL; char *end = base + len; base = malloc(len);'
  - 'char *b = NULL; char *e = b + 1; log_it(); b = malloc(n);'
  - 'char *b = NULL; char *e = (b + n); b = malloc(n);'
