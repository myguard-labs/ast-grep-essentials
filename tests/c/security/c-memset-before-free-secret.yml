id: c-memset-before-free-secret
valid:
  - 'void f(unsigned char *key, size_t n) { explicit_bzero(key, n); free(key); }'
  - 'void f(unsigned char *key, size_t n) { OPENSSL_cleanse(key, n); free(key); }'
  - 'void f(unsigned char *key, size_t n) { memset(key, 0, n); use(key); free(key); }'
  - 'void f(unsigned char *key, unsigned char *o, size_t n) { memset(key, 0, n); free(o); }'
  - 'void f(unsigned char *key, size_t n) { memset(key, 1, n); free(key); }'
  - 'void f(unsigned char *key, size_t n) { /* memset(key, 0, n); free(key); */ }'
  - 'const char *s = "memset(key, 0, n); free(key);";'
invalid:
  - 'void f(unsigned char *key, size_t n) { memset(key, 0, n); free(key); }'
  - 'void f(ngx_pool_t *p, u_char *key, size_t n) { ngx_memzero(key, n); ngx_pfree(p, key); }'
  - 'void f(ngx_pool_t *p, u_char *key, size_t n) { memset(key, 0, n); ngx_pfree(p, key); }'
  - 'void f(u_char *key, size_t n) { ngx_memzero(key, n); free(key); }'
