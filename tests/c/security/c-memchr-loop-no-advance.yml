id: c-memchr-loop-no-advance
valid:
  - |-
    char *p = s;
    while ((p = memchr(p, '\\', end - p)) != NULL) {
        *p++ = '/';
    }
  - |-
    void f(char *p, char *end) { while ((p = memchr(p, 92, end - p)) != NULL) { *p = 47; p++; } }
  - |-
    void f(char *p, char *end, int *cnt) { while ((p = memchr(p, 92, end - p)) != NULL) { (*cnt)++; p++; } }
  - |-
    void f(char *p, char *q, char *end) { while ((q = memchr(p, 92, end - p)) != NULL) { *q = 47; p = q + 1; } }
invalid:
  - |-
    char *p = s;
    while ((p = memchr(p, '\\', end - p)) != NULL) {
        *p = '/';
    }
  - |-
    void f(char *p, char *end) { while ((p = memchr(p, 0, end - p)) != NULL) { *p = 47; } }
  - |-
    void f(char *p, char *end) { while (p = memchr(p, 92, end - p)) { *p = 47; } }
  - |-
    void f(char *p, char *end, int *n) { while ((p = memchr(p, 92, end - p)) != 0) { (*n)++; *p = 47; } }
