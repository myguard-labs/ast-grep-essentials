id: c-narrowing-cast-sum-u-short
valid:
  - >-
    void f(u_short *test, int key, int sz) { int len = test[key] + sz; if (len
    <= 65535) test[key] = (u_short) len; }
  - |-
    void f(u_short *t, int a, int b) { t[0] = (u_short) (a & 0xffff); }
  - |-
    void f(u_long *t, int a, int b) { t[0] = (u_long) (a + b); }
  - |-
    void f(u_short *t, int a, int b) { unsigned len = a + b; if (len > 65535) return; t[0] = (u_short) len; }
invalid:
  - >-
    void f(u_short *test, int key, int sz) { test[key] = (u_short) (test[key] +
    sz); }
  - |-
    void f(u_short *t, int a, int b) { u_short n; n = (u_short) (a + b); }
  - |-
    void f(struct s *p, int x) { p->len = (u_short) (x + 1); }
  - |-
    void f(u_short *t, int a, int b, int c) { t[0] = (u_short) (a + b + c); }
