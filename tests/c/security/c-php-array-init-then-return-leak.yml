id: c-php-array-init-then-return-leak
valid:
  - >-
    array_init(return_value); if (n == 0) { zval_dtor(return_value);
    RETURN_FALSE; }
  - 'if (n == 0) { RETURN_FALSE; } array_init(return_value);'
  - 'array_init(return_value); if (n == 0) { zval_ptr_dtor(return_value); RETURN_NULL; }'
  - 'array_init(return_value); if (n == 0) { return; }'
invalid:
  - 'array_init(return_value); if (n == 0) { RETURN_FALSE; }'
  - 'array_init(return_value); n = count(ht); if (!ht) { RETURN_FALSE; }'
  - 'PHP_FUNCTION(f) { array_init(return_value); if (zend_parse_parameters(ZEND_NUM_ARGS(), "l", &n) == FAILURE) { RETURN_FALSE; } }'
