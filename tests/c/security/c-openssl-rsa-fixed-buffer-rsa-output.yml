id: c-openssl-rsa-fixed-buffer-rsa-output
valid:
  - 'unsigned char decoded[256]; memcpy(decoded, buf, n);'
  - 'void f(void) { RSA_size(rsa); }'
  - 'void f(void) { EVP_PKEY_decrypt(ctx, out, &outlen, in, inlen); }'
  - 'void f(void) { my_RSA_private_decrypt(n, buf, out, rsa, p); }'
invalid:
  - >-
    unsigned char decoded[256]; RSA_private_decrypt(n, buf, decoded, rsa,
    RSA_PKCS1_PADDING);
  - 'void f(void) { RSA_public_encrypt(n, buf, out, rsa, RSA_PKCS1_OAEP_PADDING); }'
  - 'void f(void) { int r = RSA_private_decrypt(n, buf, out, rsa, p); }'
  - 'void f(void) { if (RSA_public_encrypt(n, buf, out, rsa, p) < 0) {} }'
