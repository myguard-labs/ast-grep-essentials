id: c-cast-after-subtract-length-check
valid:
  - >-
    int f(size_t inlen, unsigned char *tmp) { if (inlen < 4 + (size_t)tmp[0]) {
    return 1; } return 0; }
  - >-
    int f(unsigned char *p, unsigned char *last) { if ((size_t) (last - p) <
    96) { return 1; } return 0; }
  - >-
    int f(size_t inlen, unsigned char *tmp, size_t hdr) { if (inlen <
    (size_t)(tmp[0] - hdr)) { return 1; } return 0; }
invalid:
  - >-
    int f(size_t inlen, unsigned char *tmp) { if (inlen < (size_t)(tmp[0] - 4))
    { return 1; } return 0; }
  - >-
    int f(int len) { if ((size_t)(len - 1) < 96) { return 1; } return 0; }
