id: c-asn1-table-wrong-struct-type
valid:
  - >-
    ASN1_SEQUENCE(CMS_OriginatorInfo) = {
    ASN1_IMP_SET_OF_OPT(CMS_OriginatorInfo, certificates,
    CMS_CertificateChoices, 0) } ASN1_SEQUENCE_END(CMS_OriginatorInfo)
invalid:
  - >-
    ASN1_SEQUENCE(CMS_OriginatorInfo) = { ASN1_IMP_SET_OF_OPT(CMS_SignedData,
    certificates, CMS_CertificateChoices, 0) }
    ASN1_SEQUENCE_END(CMS_OriginatorInfo)
