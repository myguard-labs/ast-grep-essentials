id: c-openssl-meth-get-callback-unchecked
valid:
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) {
        if (pinit == NULL)
            EVP_PKEY_meth_get_paramgen(base, &pinit, NULL);
        return pinit != NULL ? pinit(ctx) : 1;
    }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) { EVP_PKEY_meth_get_paramgen(base, &pinit, NULL); return other(ctx); }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) { EVP_PKEY_meth_get_paramgen(base, &pinit, NULL); return (pinit == NULL) ? 1 : pinit(ctx); }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) { EVP_PKEY_meth_get_paramgen(base, &pinit, NULL); return pinit ? pinit(ctx) : 0; }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) {
        EVP_PKEY_meth_get_paramgen(base, &pinit, NULL);
        if (pinit != NULL)
            return pinit(ctx);
        return 1;
    }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) {
        EVP_PKEY_meth_get_paramgen(base, &pinit, NULL);
        if (pinit) { return pinit(ctx); }
        return 1;
    }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) {
        EVP_PKEY_meth_get_paramgen(base, &pinit, NULL);
        if (ok && pinit) { return pinit(ctx); }
        return 1;
    }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) {
        EVP_PKEY_meth_get_paramgen(base, &pinit, NULL);
        if (NULL != pinit) { return pinit(ctx); }
        return 1;
    }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) {
        EVP_PKEY_meth_get_paramgen(base, &pinit, NULL);
        if (pinit != 0) { return pinit(ctx); }
        return 1;
    }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) {
        EVP_PKEY_meth_get_paramgen(base, &pinit, NULL);
        if (pinit && ok) { return pinit(ctx); }
        return 1;
    }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) {
        EVP_PKEY_meth_get_paramgen(base, &pinit, NULL);
        if (pinit) pinit(ctx);
        return 1;
    }
invalid:
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) {
        if (pinit == NULL)
            EVP_PKEY_meth_get_paramgen(base, &pinit, NULL);
        return pinit(ctx);
    }
  - |-
    static int (*pkg)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) { EVP_PKEY_meth_get_keygen(base, &pkg, NULL); return pkg(ctx); }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) { EVP_PKEY_meth_get_paramgen(base, &pinit, NULL); pinit(ctx); return 1; }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) { EVP_PKEY_meth_get_paramgen(base, &pinit, NULL); return wrap(pinit(ctx)); }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) {
        EVP_PKEY_meth_get_paramgen(base, &pinit, NULL);
        if (pinit != NULL) { return 1; } else { return pinit(ctx); }
    }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) {
        EVP_PKEY_meth_get_paramgen(base, &pinit, NULL);
        if (pinit == NULL) { return pinit(ctx); }
        return 1;
    }
  - |-
    static int (*pinit)(EVP_PKEY_CTX *);
    static int f(EVP_PKEY_CTX *ctx, EVP_PKEY_METHOD *base) {
        EVP_PKEY_meth_get_paramgen(base, &pinit, NULL);
        if (ok || pinit) { return pinit(ctx); }
        return 1;
    }
