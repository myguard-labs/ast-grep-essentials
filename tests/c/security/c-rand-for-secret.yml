id: c-rand-for-secret
valid:
  - 'int f(unsigned char *nonce, size_t n) { return RAND_bytes(nonce, (int) n) == 1 ? 0 : -1; }'
  - 'void f(void) { unsigned int delay = rand(); use(delay); }'
  - 'void f(unsigned int *delay) { *delay = random(); }'
  - 'void f(void) { unsigned int token = my_rand(); use(token); }'
  - 'void f(unsigned char *key, size_t n) { getrandom(key, n, 0); }'
  - 'void f(void) { /* unsigned int key = rand(); */ }'
  - 'const char *s = "unsigned int key = rand();";'
  - 'void f(void) { int key_index = rand(); }'
  - 'void f(void) { long session_retry_delay_ms = random(); }'
invalid:
  - 'void f(void) { unsigned int key = rand(); use(key); }'
  - 'void f(unsigned int *token) { *token = random(); }'
  - 'void f(u_char *nonce, size_t i) { nonce[i] = (u_char) ngx_random(); }'
  - 'void f(void) { long salt = lrand48(); use(salt); }'
  - 'void f(long *iv) { *iv = mrand48(); }'
  - 'void f(void) { double session = drand48(); use(session); }'
