id: c-bitwise-and-truth-in-equality-chain
valid:
  - >-
    int f(unsigned char *buf) { return (buf[0] & 0x80) == 0x80 || buf[0] ==
    0x16; }
  - 'int f(int x, int y) { return x & 1 || y == 2; }'
  - 'int f(int x) { return (x & 1) != 0 || x == 2; }'
  - 'int f(int x) { return x && 1 || x == 2; }'

invalid:
  - 'int f(unsigned char *buf) { return buf[0] & 0x80 || buf[0] == 0x16; }'
  - 'int f(int x) { return x & 1 || x == 2; }'
  - 'int f(struct s *p) { return p->f & 4 || p->f == 7; }'
  - 'int f(int flags) { if (flags & MASK || flags == 3) { return 1; } return 0; }'
