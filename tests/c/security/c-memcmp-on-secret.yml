id: c-memcmp-on-secret
valid:
  - 'int f(const unsigned char *hmac, const unsigned char *e, size_t n) { return CRYPTO_memcmp(hmac, e, n) == 0; }'
  - 'int f(const char *a, const char *b) { return strcmp(a, b); }'
  - 'int f(const unsigned char *hmac, const unsigned char *e, size_t n) { return my_memcmp(hmac, e, n); }'
  - 'int f(const char *name, const char *b) { return ngx_strcmp(name, b); }'
  - 'void f(void) { /* memcmp(hmac, expected, n); */ }'
  - 'const char *s = "memcmp(hmac, expected, n)";'
invalid:
  - 'int f(const unsigned char *hmac, const unsigned char *e, size_t n) { return memcmp(hmac, e, n) == 0; }'
  - 'int f(const char *a, const char *token) { return strcmp(a, token); }'
  - 'int f(const char *password, const char *b, size_t n) { return strncmp(password, b, n); }'
  - 'int f(const u_char *digest, const u_char *b, size_t n) { return ngx_memcmp(digest, b, n); }'
  - 'int f(const u_char *secret, const u_char *b) { return ngx_strcmp(secret, b); }'
  - 'int f(const u_char *signature, const u_char *b, size_t n) { return ngx_strncmp(signature, b, n); }'
