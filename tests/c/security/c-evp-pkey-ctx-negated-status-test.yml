id: c-evp-pkey-ctx-negated-status-test
valid:
  - |-
    #include <openssl/evp.h>
    int f(EVP_PKEY_CTX *ctx, int *s) {
        if (EVP_PKEY_CTX_get_rsa_pss_saltlen(ctx, s) <= 0)
            return 0;
        return 1;
    }
invalid:
  - |-
    #include <openssl/evp.h>
    int f(EVP_PKEY_CTX *ctx, int *s) {
        if (!EVP_PKEY_CTX_get_rsa_pss_saltlen(ctx, s))
            return 0;
        return 1;
    }
