id: c-asn1-utf8-len-unchecked
valid:
  - >-
    int len; unsigned char *buf; len = ASN1_STRING_to_UTF8(&buf, str); if (len
    != -1) { add_next_index_stringl(sub, (char *)buf, len, 1); }
  - 'int n; unsigned char *buf; n = ASN1_STRING_to_UTF8(&buf, s); if (n < 0) return; use(buf, n, 1);'
  - 'int len; unsigned char *buf; len = ASN1_STRING_to_UTF8(&buf, s); if (len < 0) { return; } use(buf, len);'
invalid:
  - >-
    int len; unsigned char *buf; len = ASN1_STRING_to_UTF8(&buf, str);
    add_next_index_stringl(sub, (char *)buf, len, 1);
  - 'int n; unsigned char *buf; n = ASN1_STRING_to_UTF8(&buf, s); use(buf, n, 1);'
  - 'void f(void) { int n; n = ASN1_STRING_to_UTF8(&buf, s); use(n, buf); }'
