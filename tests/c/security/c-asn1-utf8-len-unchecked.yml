id: c-asn1-utf8-len-unchecked
valid:
  - >-
    int len; unsigned char *buf; len = ASN1_STRING_to_UTF8(&buf, str); if (len
    != -1) { add_next_index_stringl(sub, (char *)buf, len, 1); }
invalid:
  - >-
    int len; unsigned char *buf; len = ASN1_STRING_to_UTF8(&buf, str);
    add_next_index_stringl(sub, (char *)buf, len, 1);
