id: c-hash-iterator-slot-reset-without-del
valid:
  - >-
    void f(spl_array_object *intern) { if (intern->ht_iter != (uint32_t)-1) {
    zend_hash_iterator_del(intern->ht_iter); } intern->ht_iter = (uint32_t)-1; }
invalid:
  - 'void f(spl_array_object *intern) { intern->ht_iter = (uint32_t)-1; }'
