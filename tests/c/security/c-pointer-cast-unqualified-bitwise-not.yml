id: c-pointer-cast-unqualified-bitwise-not
valid:
  - '#define FREE_LIST_END ((zval_gc_info*)(~(zend_uintptr_t)GC_COLOR))'
  - '#define M ((void*)(~(uintptr_t)FLAG))'
  - '#define M (~FLAG)'
  - '#define M ((void*)((uintptr_t)~FLAG))'
invalid:
  - '#define FREE_LIST_END ((zval_gc_info*)(~GC_COLOR))'
  - '#define MASK ((char*)(~FLAGS))'
  - '#define M ((void *)(~ mask))'
  - '#define M ((unsigned char **)(~mask))'
