id: c-dotdot-check-offset-by-one
valid:
  - >-
    int f(const char *user) { if (user[0] == '\0' || (user[0] == '.' && user[1]
    == '\0')) return 0; return 1; }
  - "int f(const char *user) { if (user[0] == '\\0' || (user[0] == '.' && user[1] == '.' && user[2] == '\\0')) return 0; return 1; }"
  - "int f(const char *user) { if (strcmp(user, \".\") == 0 || strcmp(user, \"..\") == 0) return 0; return 1; }"
invalid:
  - >-
    int f(const char *user) { if (user[0] == '\0' || (user[1] == '.' && user[2]
    == '\0')) return 0; return 1; }
  - "int f(const char *name) { if (name[0] == 0 || (name[1] == '.' && name[2] == 0)) return 0; return 1; }"
  - "int f(struct req *req) { if (req->path[0] == '/' || (req->path[1] == '.' && req->path[2] == '/')) return 0; return 1; }"
  - "int f(const char *s) { return s[0] == '\\0' || (s[1] == '.' && s[2] == '\\0'); }"
