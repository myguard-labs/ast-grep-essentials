id: c-member-access-after-free
valid:
  - "struct s { int len; void *magic; };\nvoid f(struct s *p) {\n\tuse(p->len);\n\tfree(p);\n}"
  - "void f(struct s *a, struct s *b) { free(a); use(b->len); }"
  - "void f(struct s *p) { free(p); p = NULL; use(q->len); }"
  - "void f(struct s *p) { g_free(p); use(p->len); }"
invalid:
  - "struct s { int len; void *magic; };\nvoid f(struct s *p) {\n\tfree(p);\n\tuse(p->len);\n}"
  - "void f(struct s *p) { free(p); log(\"gone\"); use(p->len); }"
  - "void f(struct s *p) { free(p); p->len = 0; }"
  - "void f(struct s *p) { free(p); /* stale */ use(p->len); }"
