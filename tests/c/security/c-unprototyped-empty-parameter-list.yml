id: c-unprototyped-empty-parameter-list
valid:
  - "static void show_info(void)\n{\n}"
  - "static int is_running(void) { return 0; }"
  - "static int f(void) { return 0; }"
  - "int clean(void);"
  - "const char *zlog_get_level_name(void);"
  - "int start_accel_module(void);"
  - "void php_base64_init(void) { }"
  - "int f(void) { return 0; }"
  - "static int handshake_mac(void);"
  - "void php_closelog(void) { }"
  - "int timelib_time_ctor(void);"
  - "int f(int a);"
  - "int f(int a, ...);"
  - "void (*fp)();"
  - "struct S { int (*cb)(); };"
  - "int f(a, b) int a; int b; { return 0; }"
  - "void g(void (*cb)(void));"
invalid:
  - "static void show_info()\n{\n}"
  - "static int is_running() { return 0; }"
  - "static int f() { return 0; }"
  - "int clean();"
  - "const char *zlog_get_level_name();"
  - "int start_accel_module();"
  - "void php_base64_init() { }"
  - "int f() { return 0; }"
  - "static int handshake_mac();"
  - "void php_closelog() { }"
  - "int timelib_time_ctor();"
  - "int f();"
  - "int *f();"
  - "int f(), g();"
  - "void h(void) { int x = 0; int k(); (void)x; }"
  - "int main() { return 0; }"
  - "void g(void (*cb)(int)); int f();"
