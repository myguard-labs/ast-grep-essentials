id: c-null-check-and-deref-same-ptr
valid:
  - >-
    void f(struct t *trait) { if (!trait || !(trait->ce_flags & 1)) { return; }
    }
  - |-
    void f(struct t *p) { if (p == NULL || !(p->flags & 1)) { return; } }
  - |-
    void f(struct t *p) { if (p && !(p->flags & 1)) { return; } }
  - |-
    void f(struct t *p, int quiet) { if (!p && !quiet) { return; } }

invalid:
  - >-
    void f(struct t *trait) { if (!trait && !(trait->ce_flags & 1)) { return; }
    }
  - |-
    void f(struct t *p) { if (!p && !(p->flags & 2)) { return; } }
  - |-
    void f(struct t *p) { if (!p && !(p->kind == 1)) { log_it(); return; } g(); }
  - |-
    void f(struct t *p) { if (p == NULL && !(p->flags & 1)) { return; } }
  - |-
    void f(struct t *p) { if (NULL == p && !(p->flags & 1)) { return; } }
