id: c-free-null-result-after-self-reassign
valid:
  - |-
    rnode = xmlAddChild(copy, node);
    if (rnode == NULL) {
        xmlFreeNode(node);
    }
  - |-
    if (node != NULL) {
        xmlFreeNode(node);
    }
  - |-
    tmp = xmlAddChild(copy, node);
    if (tmp == NULL) {
        return NULL;
    }
invalid:
  - |-
    node = xmlAddChild(copy, node);
    if (node == NULL) {
        xmlFreeNode(node);
    }
  - |-
    cur = xmlAddChild(parent, cur);
    if (cur == NULL) {
        xmlFreeNode(cur);
    }
  - |-
    ctx->node = xmlAddChild(parent, ctx->node);
    if (ctx->node == NULL) {
        xmlFreeNode(ctx->node);
    }
