id: c-uint-cast-of-length-difference
valid:
  - 'size_t n = (size_t) (req->content_length - req->read_bytes);'
  - 'void f(size_t a, size_t b) { size_t n; if (a > b) { n = (size_t)(a - b); } }'
  - 'void f(size_t a, size_t b) { uint64_t n = (uint64_t)(a - b); }'
  - 'void f(size_t a) { unsigned int n = (unsigned int)(a % 16); }'
invalid:
  - 'unsigned int n = (unsigned int) (req->content_length - req->read_bytes);'
  - 'void f(size_t a, size_t b) { unsigned int n; n = (unsigned int)(a - b); }'
  - 'unsigned f(size_t a, size_t b) { return (unsigned int)(a - b); }'
  - 'void f(void) { g((unsigned int)(end - start)); }'
  - 'void f(struct s *p) { unsigned int n = (unsigned int)(p->a - p->b); }'
