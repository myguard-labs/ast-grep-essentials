id: c-printf-conversions-exceed-arguments
valid:
  - 'php_error_docref(NULL, E_NOTICE, " %s(): Old API is used", "pg_lo_export");'
  - "php_error_docref(NULL, E_WARNING, \"100%% done\");"
  - "php_error_docref(NULL, E_WARNING, \"%%s is escaped\");"
  - "php_error_docref(NULL, E_WARNING, \"Path %s at %d\", path, line);"
invalid:
  - 'php_error_docref(NULL, E_NOTICE, " %s(): Old API is used");'
  - "php_error_docref(NULL, E_WARNING, \"Value is %d\");"
  - "php_error_docref(NULL, E_WARNING, \"ratio %.2f\");"
  - "php_error_docref(\"ref\", E_NOTICE, \"len %zu\");"
  - "php_error_docref(NULL, E_WARNING, \"a %d b %s\");"
