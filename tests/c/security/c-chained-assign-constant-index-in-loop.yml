id: c-chained-assign-constant-index-in-loop
valid:
  - |-
    static void init(unsigned char t[2][256], int i, int n) {
        for (; i < n; ++i)
            t[0][i] = t[1][i] = 0;
    }
invalid:
  - |-
    static void init(unsigned char t[2][256], int i, int n) {
        for (; i < n; ++i)
            t[0][i] = t[1][0] = 0;
    }
