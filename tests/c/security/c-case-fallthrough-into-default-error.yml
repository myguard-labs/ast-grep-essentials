id: c-case-fallthrough-into-default-error
valid:
  - |-
    switch (t) { case 1: if (!f()) goto err; break;
     default: goto err; }
  - 'void f(int t) { switch (t) { case 1: a(); case 2: b(); break; default: goto err; } err: return; }'
  - 'void f(int t) { switch (t) { case 1: a(); break; case 2: b(); break; default: goto err; } err: return; }'
  - 'void f(int t) { switch (t) { case 1: a(); break; default: return; } }'
  - 'void f(int t) { switch (t) { case 1: return; default: goto err; } err: return; }'
  - 'void f(int t) { switch (t) { case 1: { a(); break; } default: goto err; } err: return; }'
  - 'void f(int t) { for (;;) { switch (t) { case 1: a(); continue; default: goto err; } } err: return; }'
invalid:
  - |-
    switch (t) { case 1: if (!f()) goto err;
     default: goto err; }
  - 'void f(int t) { switch (t) { case 1: a(); default: goto err; } err: return; }'
  - 'void f(int t) { switch (t) { case 1: a(); break; case 2: b(); default: goto fail; } fail: return; }'
  - 'void f(int t) { switch (t) { case 1: a(); b(); c(); default: goto err; } err: return; }'
