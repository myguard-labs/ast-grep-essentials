id: c-length-plus-const-guard-overflow
valid:
  - 'if (entry_len > end - buf - 20) return -1;'
  - "int f(size_t len, size_t max) { if (max < 20 || len > max - 20) return -1; return 0; }"
  - "int f(uint32_t len, uint64_t max) { uint64_t total = (uint64_t) len + 20; if (total > max) return -1; return 0; }"
  - "int f(size_t len, size_t max) { size_t t; if (__builtin_add_overflow(len, 20, &t) || t > max) return -1; return 0; }"
  - "int f(size_t len, size_t max) { if (len > max || max - len < 20) return -1; return 0; }"
invalid:
  - 'if (entry_len + 20 > end - buf) return -1;'
  - "int f(size_t len, size_t max) { if (len + 20 > max) { return -1; } return 0; }"
  - "int f(struct h *p, size_t max) { if (p->len + 20 > max) return -1; return 0; }"
  - "int f(size_t len, size_t max) { if (len + 20 > max) { return -1; } else { max = 0; } return 0; }"
  - "int f(size_t len, size_t max) { if (len + 20 > max - 4) return -1; return 0; }"
  - "int f(size_t len, size_t max) { if (len + 20 > max) goto fail; return 0; fail: return -1; }"
