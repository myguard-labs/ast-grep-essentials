    void f(long o, long l, long n) { if (((unsigned long) o + (unsigned long) l)
    > (unsigned long) n) { } }
  - |-
    int f(struct r *r, unsigned long lim) { return ((unsigned long) r->off + (unsigned long) r->len) > (unsigned long) lim; }
