id: c-map-foreach-on-properties-table
valid:
  - >-
    HashTable *properties = Z_OBJ_HT_P(obj)->get_properties(Z_OBJ_P(obj));
    ZEND_HASH_FOREACH_STR_KEY(properties, prop_name) { }
invalid:
  - >-
    HashTable *properties = Z_OBJ_HT_P(obj)->get_properties(Z_OBJ_P(obj));
    ZEND_HASH_MAP_FOREACH_STR_KEY(properties, prop_name) { }
