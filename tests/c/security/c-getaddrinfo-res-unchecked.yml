id: c-getaddrinfo-res-unchecked
valid:
  - |-
    #include <netdb.h>
    int f(const char *host) {
     struct addrinfo hints, *res;
     if (getaddrinfo(host, NULL, &hints, &res) || res == NULL) {
     return 0;
     }
     return res->ai_family;
    }
  - |-
    int f(const char *h) { if (getaddrinfo(h, NULL, &hints, &res) != 0 || res == NULL) { return 0; } return res->ai_family; }
  - |-
    int f(const char *h) { if (getaddrinfo(h, NULL, &hints, &res) == 0 && res != NULL) { return res->ai_family; } return 0; }
  - |-
    int f(const char *h) { if (getnameinfo(sa, len, host, sizeof host, NULL, 0, 0)) { return 0; } return 1; }
  - |-
    int f(const char *h) { int rc = getaddrinfo(h, NULL, &hints, &res); if (rc != 0 || !res) { return 0; } return res->ai_family; }
invalid:
  - |-
    #include <netdb.h>
    int f(const char *host) {
     struct addrinfo hints, *res;
     if (getaddrinfo(host, NULL, &hints, &res)) {
     return 0;
     }
     return res->ai_family;
    }
  - |-
    int f(const char *h) { if (getaddrinfo(h, NULL, &hints, &res)) { return 0; } else { log(); } return res->ai_family; }
  - |-
    int f(const char *h) { if (getaddrinfo(h, NULL, &hints, &res)) { } return res->ai_family; }
  - |-
    int f(const char *h) { while (n--) { if (getaddrinfo(h, NULL, NULL, &res)) { continue; } use(res->ai_addr); } return 0; }
  - |-
    int f(const char *h) { if (getaddrinfo(h, NULL, &hints, &res)) { /* fail */ return 0; } return res->ai_family; }
  - |-
    int f(const char *h) { if (getaddrinfo(
     h, NULL,
     &hints, &res)) { return res->ai_family; } return 1; }
