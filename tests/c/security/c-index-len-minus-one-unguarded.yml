id: c-index-len-minus-one-unguarded
valid:
  - 'if (n && s[n - 1] != ''/'') { }'
  - "int f(char *s, size_t n) { if (s[n] != '/') { return 1; } return 0; }"
  - "int f(char *s, size_t n) { if (s[n - 2] != '/') { return 1; } return 0; }"
  - "int f(char *s, size_t n) { if (n > 0 && s[n - 1] != '/') { return 1; } return 0; }"
invalid:
  - 'if (s[n - 1] != ''/'') { }'
  - "int f(char *s, size_t n) { if (s[n - 1] != '/') { return 1; } return 0; }"
  - "int f(char *s, size_t n) { if ((s[n - 1]) != '/') { return 1; } return 0; }"
  - "int f(char *s, size_t n) { if (s[n - 1] /* last */ != '/') { return 1; } return 0; }"
