id: c-pqcancel-result-tested-negative
valid:
  - "int rc = PQcancel(c, err, sizeof(err));\nif (rc == 0) {\n\tzend_error(E_WARNING, \"cannot cancel the query: %s\", err);\n}"
invalid:
  - "int rc = PQcancel(c, err, sizeof(err));\nif (rc < 0) {\n\tzend_error(E_WARNING, \"cannot cancel the query: %s\", err);\n}"
