id: c-local-sockaddr-uninitialized-passed
valid:
  - >-
    static void f(const char *ip) { struct sockaddr_in6 sa6 = {0};
    inet_pton(AF_INET6, ip, &sa6.sin6_addr); }
  - "static void f(void) { struct sockaddr_in6 sa = { .sin6_family = AF_INET6 }; connect(fd, (struct sockaddr *)&sa, sizeof sa); }"
  - "static void f(void) { struct stat st; stat(\"x\", &st); }"
  - "static void f(void) { struct sockaddr_in6 sa; other(1); }"
  - "static void f(void) { struct sockaddr_storage ss; socklen_t l = sizeof ss; accept(fd, (struct sockaddr *)&ss, &l); }"
  - "static void f(int fd) { struct sockaddr sa; memset(&sa, 0, sizeof sa); connect(fd, &sa, sizeof sa); }"
  - "static void f(int fd) { struct sockaddr_in6 sa; socklen_t l = sizeof sa; getsockname(fd, (struct sockaddr *)&sa, &l); use(&sa); }"
  - "static void f(int fd) { struct sockaddr_in sa; bzero(&sa, sizeof sa); bind(fd, (struct sockaddr *)&sa, sizeof sa); }"
invalid:
  - >-
    static void f(const char *ip) { struct sockaddr_in6 sa6; inet_pton(AF_INET6,
    ip, &sa6.sin6_addr); }
  - "static void f(int fd) { struct sockaddr_in6 sa; sa.sin6_family = AF_INET6; connect(fd, (struct sockaddr *)&sa, sizeof sa); }"
  - "static void f(int fd) { struct sockaddr_in6 sa; bind(fd, (struct sockaddr *)&sa, sizeof(sa)); }"
  - "static void f(int fd) { struct sockaddr sa; sendto(fd, buf, 1, 0, &sa, sizeof sa); }"
  - "static void f(int fd) { struct sockaddr_in6 sa; if (x) { connect(fd, (struct sockaddr *)&sa, sizeof sa); } }"
  - "static void f(int fd) { struct sockaddr_in sa; connect(fd, (struct sockaddr *)&sa, sizeof sa); }"
  - "static void f(int fd) { struct sockaddr sa; if (x) { memset(&sa, 0, sizeof sa); } bind(fd, &sa, 1); }"
  - "static void f(int fd) { struct sockaddr sa; bind(fd, &sa, sizeof sa); memset(&sa, 0, sizeof sa); }"
  - "static void f(int fd) { struct sockaddr sa; bind(fd, &sa, sizeof sa); memset(&sa, 0, sizeof sa); connect(fd, &sa, sizeof sa); }"
