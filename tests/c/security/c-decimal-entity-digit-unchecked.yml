id: c-decimal-entity-digit-unchecked
valid:
  - >-
    static int f(const char *buf, int n) { int ent = 0; for (int pos = 0; pos <
    n; pos++) { if (buf[pos] < '0' || buf[pos] > '9') return -1; ent = ent * 10
    + (buf[pos] - '0'); } return ent; }
invalid:
  - >-
    static int f(const char *buf, int n) { int ent = 0; for (int pos = 0; pos <
    n; pos++) ent = ent * 10 + (buf[pos] - '0'); return ent; }
