    ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (so && so->type ==
    16) return 1;
  - 'ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (so && (so->type == 16)) return 1;'
  - 'ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (so) { if (so->type == 16) return 1; }'
  - 'ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if ((so && so->type == 16) || fallback) return 1;'
  - 'ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (so != NULL && so->type == 16) return 1;'
  - 'ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (!so) return 0; if (so->type == 16) return 1;'
  - 'ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (!so || so->type != 16) return 0;'
  - 'int f(PKCS7_SIGNER_INFO *si) { ASN1_TYPE *so; int x; so = PKCS7_get_signed_attribute(si, 1); if (!so) return 0; x = 1; if (so->type == 16) return x; return 0; }'
  - 'int f(PKCS7_SIGNER_INFO *si) { ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (!so) goto err; if (so->type == 16) return 1; err: return 0; }'
  - 'int f(PKCS7_SIGNER_INFO *si) { ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (!so) return 0; so = PKCS7_get_signed_attribute(si, 2); if (!so) return 0; if (so->type == 4) return 1; return 0; }'
  - 'int f(PKCS7_SIGNER_INFO *si) { ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (!so) return 0; if (so->type == 4) return 1; so = PKCS7_get_signed_attribute(si, 2); if (!so) goto err; if (so->type == 5) return 1; err: return 0; }'
