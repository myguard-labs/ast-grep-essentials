id: c-pkcs7-signed-attr-deref-unchecked
valid:
  - >-
    ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (so && so->type ==
    16) return 1;
  - 'ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (so && (so->type == 16)) return 1;'
  - 'ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (so) { if (so->type == 16) return 1; }'
  - 'ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if ((so && so->type == 16) || fallback) return 1;'
invalid:
  - >-
    ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (so->type == 16)
    return 1;
  - 'ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if ((so->type) == 16) return 1;'
  - 'ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (16 == so->type) return 1;'
  - 'ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (so->type == 16 && so) return 1;'
