  - 'int f(PKCS7_SIGNER_INFO *si) { ASN1_TYPE *so; so = PKCS7_get_signed_attribute(si, 1); if (!so) return 0; if (so->type == 4) return 1; so = PKCS7_get_signed_attribute(si, 2); if (so->type == 5) return 1; return 0; }'
