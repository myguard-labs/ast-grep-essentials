id: c-digit-accumulate-unbounded-int
valid:
  - >-
    static int rd(const unsigned char *p) { int min = 0; while (*p >= '0' && *p
    <= '9') { if (min > 6553) break; min = min * 10 + *p++ - '0'; } return min;
    }
invalid:
  - >-
    static int rd(const unsigned char *p) { int min = 0; while (*p >= '0' && *p
    <= '9') min = min * 10 + *p++ - '0'; return min; }
