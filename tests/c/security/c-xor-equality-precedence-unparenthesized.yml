id: c-xor-equality-precedence-unparenthesized
valid:
  - >-
    int f(unsigned char *d, unsigned char *m) { if ((d[0] ^ m[0]) != 0xFF)
    return 0; return 1; }
  - "int f(int a, int b) { return (a ^ b) == 0; }"
  - "int f(int a, int b, int c) { return a ^ (b != c); }"
  - "int f(int a, int b) { int x = a ^ b; return x; }"
invalid:
  - >-
    int f(unsigned char *d, unsigned char *m) { if (d[0] ^ m[0] != 0xFF) return
    0; return 1; }
  - "int f(int a, int b) { return a ^ b != 0; }"
  - "void f(int a, int b, int r) { r |= a ^ b != 0; }"
  - "int f(int a, int b) { while (a ^ b != 0) { a++; } return 0; }"
