id: c-null-guard-deref-in-null-branch
valid:
  - 'void f(int *found) { if (found) { *found = 0; } }'
  - |-
    void f(int *found) { if (!found) { return; } *found = 0; }
  - |-
    int f(int *p) { if (!p) { return -1; } return *p; }
  - |-
    void f(int rate, int *count) { if (!count) { total = rate * 2; } }
  - |-
    void f(int *found) { if (!found) { x = 0; } else { *found = 1; } }
  - |-
    void f(int *found) { if (found == NULL) { x = 0; } else { *found = 1; } }

invalid:
  - 'void f(int *found) { if (!found) { *found = 0; } }'
  - |-
    int f(int *p) { if (!p) { return *p; } return 0; }
  - |-
    void f(int *p) { if (!p) { log_it(); g(*p); } }
  - |-
    void f(int *p) { if (!p) { *p += 1; } }
  - |-
    void f(int *p) { if (!p) { *p = 0; } else { g(); } }
  - |-
    void f(int *p) { if (p == NULL) { *p = 0; } }
  - |-
    void f(int *p) { if (NULL == p) { *p = 0; } }
