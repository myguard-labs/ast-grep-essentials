id: c-pointer-postincrement-as-condition
valid:
  - 'static int f(char *scope) { if (scope) { scope++; return 1; } return 0; }'
  - 'static int f(char *scope) { if (scope != NULL) { scope++; return 1; } return 0; }'
  - 'static int f(char *scope) { char *q = scope; if (q) { q++; } return 0; }'
  - 'static int f(char *scope) { if (scope == NULL) { return 0; } scope++; return 1; }'
invalid:
  - 'static int f(char *scope) { if (scope++) { return 1; } return 0; }'
  - 'static int f(char *scope) { if (s->p++) { return 1; } return 0; }'
  - 'static int f(char *scope) { if (scope /* c */ ++) { return 1; } return 0; }'
  - 'static int f(char *scope) { if (x) { return 1; } else if (scope++) { return 2; } return 0; }'
