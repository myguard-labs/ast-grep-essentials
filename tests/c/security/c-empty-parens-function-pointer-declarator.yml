id: c-empty-parens-function-pointer-declarator
valid:
  - 'void (*fun)(void);'
  - 'int (*cmp)(const void *, const void *);'
  - 'struct ops { void (*cb)(void); };'
  - 'int f();'
invalid:
  - 'void (*fun)();'
  - 'int (*handler)();'
  - 'struct ops { void (*cb)(); };'
  - 'typedef void (*cb_t)();'
