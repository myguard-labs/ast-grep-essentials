id: c-empty-parens-function-pointer-declarator
valid:
  - 'void (*fun)(void);'
  - 'int (*cmp)(const void *, const void *);'
  - 'struct ops { void (*cb)(void); };'
  - 'int f();'
  - 'void (*arr[3])(void);'
  - 'void (*fp)(int);'
  - '// void (*arr[3])();'
  - 'const char *s = "void (*fp)();";'
invalid:
  - 'void (*fun)();'
  - 'int (*handler)();'
  - 'struct ops { void (*cb)(); };'
  - 'typedef void (*cb_t)();'
  - 'void (*arr[3])();'
  - 'void (*(*nested)[2])();'
  - 'struct ops { void (*cbs[2])(); };'
