id: c-bitwise-and-equality-precedence
valid:
  - |-
    int f(int flags) {
      return (flags & 4) == 0;
    }
  - 'int f(int a, int b) { return (a | b) == 0; }'
  - 'int f(int a, int b, int c) { return a && b == c; }'
  - 'int f(int a, int b, int c) { return a || b != c; }'

invalid:
  - |-
    int f(int flags) {
      return flags & 4 == 0;
    }
  - 'int f(int flags) { return flags & 4 != 0; }'
  - 'int f(int a, int b, int c) { return a & b == c; }'
  - 'int f(int flags) { if (flags & 4 == 4) { return 1; } return 0; }'
