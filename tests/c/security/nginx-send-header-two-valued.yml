- void f(void) { if (rc == NGX_ERROR || rc > NGX_OK) { return rc; } }
- /* void f(void) { if (ngx_http_send_header(r) != NGX_OK) { return NGX_ERROR; } } */
- void f(void) { const char *text = "void f(void) { if (ngx_http_send_header(r) != NGX_OK) { return NGX_ERROR;
  } }"; }
- void f(void) { other = ngx_http_send_header(r); if (rc != NGX_OK) return NGX_ERROR; }
- void f(void) { rc = unrelated(r); if (rc != NGX_OK) return NGX_ERROR; }
invalid:
