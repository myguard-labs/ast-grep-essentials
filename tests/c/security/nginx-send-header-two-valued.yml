- void f(void) { if (ngx_http_output_filter(r, chain) != NGX_OK) { return NGX_ERROR; } }
- void f(void) { if (ngx_http_send_header(r) != NGX_OK) return NGX_ERROR; }
- void f(void) { if (ngx_http_output_filter(r, chain) != NGX_OK) return NGX_ERROR; }
