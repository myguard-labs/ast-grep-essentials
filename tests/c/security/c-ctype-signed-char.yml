id: c-ctype-signed-char
valid:
- void f(void) { isdigit((unsigned char)c); }
- void f(void) { toupper((unsigned char)c); }
- /* void f(void) { isdigit(c); } */
- void f(void) { const char *text = "void f(void) { isdigit(c); }"; }
- void f(void) { isdigit((unsigned  char)c); }
invalid:
- void f(void) { isdigit(c); }
- void f(void) { toupper(c); }
- void f(void) { isdigit((int)c); }
- void f(void) { isdigit((signed char)c); }
- void f(void) { isdigit((unsigned int)c); }
- void f(void) { isdigit(c + (unsigned char)d); }
- void f(void) { isdigit((unsigned char)c + d); }
