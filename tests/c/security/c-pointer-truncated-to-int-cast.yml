id: c-pointer-truncated-to-int-cast
valid:
  - 'intptr_t f(void *p) { return (intptr_t)p; }'
  - "uintptr_t f(void *p) { return (uintptr_t)p; }"
  - "long f(void *p) { return (long)p; }"
  - "size_t f(void *p) { return (size_t)p; }"
  - 'unsigned long f(void *p) { return (unsigned long)p; }'
  - 'long f(void *p) { /* return (int)p; */ return 0; }'
invalid:
  - 'int f(void *p) { return (int)p; }'
  - "int f(void *p) { return (int32_t)p; }"
  - "unsigned f(void *p) { return (unsigned int)p; }"
  - "unsigned f(void *p) { return (uint32_t)p; }"
