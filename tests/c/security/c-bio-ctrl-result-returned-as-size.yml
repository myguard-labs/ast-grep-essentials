id: c-bio-ctrl-result-returned-as-size
valid:
  - >-
    size_t pending(BIO *bio) { long ret = BIO_ctrl(bio, BIO_CTRL_PENDING, 0,
    NULL); if (ret < 0) ret = 0; return (size_t)ret; }
  - 'size_t pending(BIO *bio) { return BIO_ctrl_pending(bio); }'
  - 'int ok(BIO *bio) { if (BIO_ctrl(bio, BIO_CTRL_FLUSH, 0, NULL) <= 0) return 0; return 1; }'
  - 'size_t pending(BIO *bio) { long r = BIO_ctrl(bio, BIO_CTRL_WPENDING, 0, NULL); return r > 0 ? (size_t)r : 0; }'

invalid:
  - >-
    size_t pending(BIO *bio) { return BIO_ctrl(bio, BIO_CTRL_PENDING, 0, NULL);
    }
  - 'size_t wpending(BIO *bio) { return BIO_ctrl(bio, BIO_CTRL_WPENDING, 0, NULL); }'
  - 'unsigned long ctl(BIO *b, int cmd, long larg, void *parg) { return BIO_ctrl(b, cmd, larg, parg); }'
  - 'int get_fd(BIO *b) { if (b == NULL) { return -1; } return BIO_ctrl(b, BIO_C_GET_FD, 0, NULL); }'
