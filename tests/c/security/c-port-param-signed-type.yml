id: c-port-param-signed-type
valid:
  - >-
    int phpdbg_open_socket(const char *interface, unsigned short port) { return
    0; }
  - "int open_socket(const char *host, uint16_t port) { return 0; }"
  - "int open_socket(const char *host, unsigned int port) { return 0; }"
  - '/* int open_socket(const char *host, short port) { return 0; } */ int open_socket(const char *host, uint16_t port) { return 0; }'
invalid:
  - 'int phpdbg_open_socket(const char *interface, short port) { return 0; }'
  - "int open_socket(const char *host, int port) { return 0; }"
  - "int open_socket(const char *host, signed int port) { return 0; }"
  - "int open_socket(const char *host, short int port) { return 0; }"
  - "int open_socket(const char *host, const int port) { return 0; }"
