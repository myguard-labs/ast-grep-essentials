id: c-macro-unparenthesized-param
valid:
  - '#define BN_GE0(m) ((m) >= 0)'
  - "#define M(m) ((m) * (2))"
  - "#define M(a, b) ((a) < (b) ? (a) : (b))"
  - "#define M(m) ((m) - 1)"
invalid:
  - '#define BN_GE0(m) (m >= 0)'
  - "#define M(m) (m + 1)"
  - "#define M(m) (m-1)"
  - "#define M(m) (m == 0)"
