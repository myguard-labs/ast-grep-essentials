id: c-string-offset-le-bound-off-by-one
valid:
  - |-
    int f(char *s, long i, long n) {
      return i < n && s[i] != '0';
    }
  - "int f(char *s, long i, long n, long j) { return i <= n && s[j] != '0'; }"
  - "int f(char *s, long i, long n) { return i <= n || s[i] != '0'; }"
invalid:
  - |-
    int f(char *s, long i, long n) {
      return i <= n && s[i] != '0';
    }
  - "int f(char *s, long i, long n) { if (i <= n && s[i] != '0') { return 1; } return 0; }"
  - "int f(char *buf, long off, long len) { while (off <= len && buf[off] != '0') off++; return off; }"
