id: c-char-array-no-nul-slot
valid:
  - 'static const char hexits[17] = "0123456789abcdef";'
  - 'static const char hexits[] = "0123456789abcdef";'
  - 'static const char hexits[32] = "0123456789abcdef";'
  - 'static const char *hexits = "0123456789abcdef";'
invalid:
  - 'static const char hexits[16] = "0123456789abcdef";'
  - 'char hexits[16] = "0123456789abcdef";'
  - 'void f(void) { char h[16] = "0123456789abcdef"; use(h); }'
  - 'const char hexits[16] = "0123456789abcdef";'
  - 'static unsigned char hexits[16] = "0123456789abcdef";'
