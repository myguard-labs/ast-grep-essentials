id: c-and-or-precedence-guard-bypass
valid:
  - >-
    int f(char *s, size_t n) { return n > 1 && (s[n - 1] == 'a' || s[n - 1] ==
    'b'); }
  - 'int r = (a && b) || c;'
  - 'int r = a && (b || c);'
invalid:
  - >-
    int f(char *s, size_t n) { return n > 1 && s[n - 1] == 'a' || s[n - 1] ==
    'b'; }
  - 'int f(char *p) { if (p && p[0] == ''a'' || p[1] == ''b'') return 1; return 0; }'
  - 'int r = a && b || c;'
