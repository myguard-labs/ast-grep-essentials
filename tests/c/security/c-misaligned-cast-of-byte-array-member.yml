id: c-misaligned-cast-of-byte-array-member
valid:
  - >-
    struct node { unsigned short key_len; unsigned char data[1]; }; unsigned
    char *ring(struct node *n) { return (unsigned char *) (n->data +
    n->key_len); }
  - |-
    char *f(struct node *n) { return (char *) (n->data + n->key_len); }
  - |-
    void *f(struct node *n, int off) { return (void *) (n->data + off); }
  - |-
    long f(struct node *n, int off) { long v; memcpy(&v, n->data + off, sizeof v); return v; }
invalid:
  - >-
    struct node { unsigned short key_len; unsigned char data[1]; }; long
    *ring(struct node *n) { return (long *) (n->data + n->key_len); }
  - |-
    long *f(struct node *n) { return (long *) (n->data + 4); }
  - |-
    long *f(struct hdr *h, int i) { return (long *) (h->data + (i * 8)); }
  - |-
    long f(struct node *n, int off) { return *(long *) (n->data + off); }
