id: c-sprintf-into-fixed-array
valid:
  - |-
    char b[4];
    snprintf(b, sizeof b, "%d", n);
  - "char b[16]; snprintf(b, sizeof(b), \"%s\", s);"
  - "char b[4]; if (x) snprintf(b, sizeof b, \"%d\", n);"
invalid:
  - |-
    char b[4];
    sprintf(b, "%d", n);
  - "char b[4]; sprintf(b, \"%s\", s);"
  - "char b[4]; sprintf(b + off, \"%d\", n);"
