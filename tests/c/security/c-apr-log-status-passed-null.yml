id: c-apr-log-status-passed-null
valid:
  - >-
    apr_status_t status; if ((status = f(p, u)) != APR_SUCCESS) {
    ap_log_rerror(APLOG_MARK, APLOG_ERR, status, r, fmt); }
invalid:
  - >-
    apr_status_t status; if ((status = f(p, u)) != APR_SUCCESS) {
    ap_log_rerror(APLOG_MARK, APLOG_ERR, NULL, r, fmt); }
