id: c-int-accumulate-times-ten-loop
valid:
  - >-
    int parse(const char *p) { int exp = 0; while (*p >= '0' && *p <= '9') { if
    (exp < (INT_MAX - 9) / 10) { exp = exp * 10 + (*p - '0'); } p++; } return
    exp; }
invalid:
  - >-
    int parse(const char *p) { int exp = 0; while (*p >= '0' && *p <= '9') { exp
    = exp * 10 + (*p - '0'); p++; } return exp; }
