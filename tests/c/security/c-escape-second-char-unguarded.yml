id: c-escape-second-char-unguarded
valid:
  - |-
    static unsigned char hex2c(const char *p) {
      const char c1 = p[1];
      const char c2 = p[1] ? p[2] : '\0';
      return (unsigned char)(c1 | c2);
    }
  - "static unsigned char hex2c(const char *p) { const char c2 = p[2]; return (unsigned char)c2; }"
  - "static unsigned char hex2c(const char *p) { const char c1 = p[1]; const char c3 = p[3]; return (unsigned char)(c1 | c3); }"
  - "static unsigned char hex2c(const char *p) { const char c1 = p[1]; unsigned char c2 = p[2]; return (unsigned char)(c1 | c2); }"
invalid:
  - |-
    static unsigned char hex2c(const char *p) {
      const char c1 = p[1];
      const char c2 = p[2];
      return (unsigned char)(c1 | c2);
    }
  - "static unsigned char hex2c(const char *p) { const char c1 = p[1]; /* second */ const char c2 = p[2]; return (unsigned char)(c1 | c2); }"
  - "static unsigned char hex2c(const char *p) { int c1 = p[1]; const char c2 = p[2]; return c1 | c2; }"
  - "static unsigned char hex2c(const char *p) { const char c2 = p[2]; return c2 | p[1]; }"
