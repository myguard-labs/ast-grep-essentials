id: c-pcre-anchor-missing-dollar-endonly
valid:
  - 'static const char re[] = "/^[a-z]+$/D";'
  - 'static const char re[] = "/^[a-z]+$/uD";'
  - 'static const char re[] = "/^cost\\$/";'
  - 'static const char re[] = "/^[a-z]+/";'
invalid:
  - 'static const char re[] = "/^[a-z]+$/";'
  - 'static const char re[] = "/^(a|b)$/";'
  - 'int r = preg_match("/^id-[0-9]+$/", s);'
  - 'static const char *res[] = { "/^ok$/D", "/^[0-9]{3}$/" };'
