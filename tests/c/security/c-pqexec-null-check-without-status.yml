id: c-pqexec-null-check-without-status
valid:
  - >-
    PGresult *res; if ((res = PQexec(conn, "select oid,typname from pg_type"))
    == NULL || PQresultStatus(res) != PGRES_TUPLES_OK) { return NULL; } n =
    PQntuples(res);
  - "PGresult *res; res = PQexec(conn, q); if (res == NULL || PQresultStatus(res) != PGRES_TUPLES_OK) { return NULL; } n = PQntuples(res);"
  - "PGresult *res; if ((res = PQexec(conn, q)) == NULL || PQresultStatus(res) != PGRES_COMMAND_OK) { PQclear(res); return NULL; }"
invalid:
  - >-
    PGresult *res; if ((res = PQexec(conn, "select oid,typname from pg_type"))
    == NULL) { return NULL; } n = PQntuples(res);
  - "PGresult *res; if ((res = PQexec(conn, q)) == NULL) return NULL; n = PQntuples(res);"
  - "PGresult *res; if ((res = PQexec(conn, q)) == NULL) { return NULL; } else { n = PQntuples(res); }"
  - "PGresult *res; if ((res = PQexec(conn, \"select 1\")) == NULL) { goto fail; } n = PQntuples(res);"
