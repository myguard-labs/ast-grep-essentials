id: c-openssl-add-all-without-library-init
valid:
  - 'void init(void) { SSL_library_init(); OpenSSL_add_all_ciphers(); }'
  - 'void init(void) { SSL_library_init(); OpenSSL_add_all_digests(); }'
  - 'void init(void) { SSL_library_init(); OpenSSL_add_all_ciphers(); OpenSSL_add_all_digests(); }'
  - 'void init(void) { SSL_library_init(); SSL_load_error_strings(); }'
  - 'void init(void) { /* SSL_library_init() runs in the caller */ use(); }'
invalid:
  - 'void init(void) { OpenSSL_add_all_ciphers(); }'
  - 'void init(void) { OpenSSL_add_all_digests(); }'
  - 'void init(int fips) { if (fips) { OpenSSL_add_all_ciphers(); } }'
  - 'void init(void) { OpenSSL_add_all_ciphers(); OpenSSL_add_all_digests(); }'
