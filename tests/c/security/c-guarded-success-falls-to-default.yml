id: c-guarded-success-falls-to-default
valid:
  - >-
    int f(int how, void **ret) { switch (how) { case 1: if (ret) { *ret = 0; }
    return 0; default: return -1; } }
invalid:
  - >-
    int f(int how, void **ret) { switch (how) { case 1: if (ret) { *ret = 0;
    return 0; } default: return -1; } }
