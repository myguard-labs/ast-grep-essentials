id: c-unsigned-int-sum-bounds-check
valid:
  - >-
    int in_range(unsigned int from, unsigned int len, unsigned int n) { return
    (size_t)from + (size_t)len > n; }
invalid:
  - >-
    int in_range(unsigned int from, unsigned int len, unsigned int n) { return
    (unsigned int)from + (unsigned int)len > n; }
