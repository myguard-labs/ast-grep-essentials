id: c-backslash-scan-without-dbcs-guard
valid:
  - |-
    void strip(char *p, int i) {
        if (p[i] == '\\' && !IsDBCSLeadByte(p[i - 1])) {
            p[i] = '\0';
        }
    }
  - 'void f(char *p, int i) { if (p[i] == ''a'') { p[i] = 0; } }'
  - 'void f(char *p, int i) { if (p[i] != ''\\'') { p[i] = 0; } }'
invalid:
  - |-
    void strip(char *p, int i) {
        if (p[i] == '\\') {
            p[i] = '\0';
        }
    }
  - 'void f(char *s, int k) { if (s[k] == ''\\'') { s[k] = ''/''; } }'
  - 'void f(char *p, int n) { for (int i = 0; i < n; i++) { if (p[i] == ''\\'') { p[i] = ''/''; } } }'
