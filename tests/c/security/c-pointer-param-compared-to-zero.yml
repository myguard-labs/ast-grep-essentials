id: c-pointer-param-compared-to-zero
valid:
  - |-
    static int f(int *recurrences, int end) {
     if (end == 0 && *recurrences == 0) return 1;
     return 0;
    }
invalid:
  - |-
    static int f(int *recurrences, int end) {
     if (end == 0 && recurrences == 0) return 1;
     return 0;
    }
