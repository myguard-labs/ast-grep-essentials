id: c-loop-index-unbounded-subscript
valid:
  - >-
    void f(char *start, int len, char *resp, size_t j) { int i = 0; while (j-- >
    0 && i < len) { *resp++ = start[i++]; } }
  - 'void f(char *s, char *r, size_t j) { int i = 0; while (j-- > 0 && i < 8) { *r++ = s[i++]; } }'
  - 'void f(char *s, char *r, size_t j) { int i = 0; while (i < 8) { *r++ = s[i++]; } }'
  - 'void f(char *s, char *r, size_t j, int len) { int i = 0; while (j-- > 0) { if (i >= len) break; *r++ = s[i++]; } }'
invalid:
  - 'void f(char *s, char *r, size_t j, int len) { int i = 0; while (j-- > 0) { if (i == 3) break; *r++ = s[i++]; } }'
  - 'void f(char *s, char *r, size_t j, int len) { int i = 0; while (j-- > 0) { if (s[i] > 0) break; *r++ = s[i++]; } }'
  - >-
    void f(char *start, int len, char *resp, size_t j) { int i = 0; while (j-- >
    0) { *resp++ = start[i++]; } }
  - 'void f(char *s, char *r, size_t j) { int i = 0; while (j > 0) { r[j] = s[i++]; j--; } }'
  - 'void f(char *s, char *r, size_t j) { int i = 0; while (j-- > 0) *r++ = s[i++]; }'
