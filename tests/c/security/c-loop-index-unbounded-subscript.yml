id: c-loop-index-unbounded-subscript
valid:
  - >-
    void f(char *start, int len, char *resp, size_t j) { int i = 0; while (j-- >
    0 && i < len) { *resp++ = start[i++]; } }
invalid:
  - >-
    void f(char *start, int len, char *resp, size_t j) { int i = 0; while (j-- >
    0) { *resp++ = start[i++]; } }
