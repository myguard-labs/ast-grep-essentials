id: c-arg-info-duplicate-parameter-name
valid:
  - >-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_f, 0, 0, 2)\nZEND_ARG_INFO(0,
    context)\nZEND_ARG_INFO(0, stream_context)\nZEND_END_ARG_INFO()
invalid:
  - >-
    ZEND_BEGIN_ARG_INFO_EX(arginfo_f, 0, 0, 2)\nZEND_ARG_INFO(0,
    context)\nZEND_ARG_INFO(0, context)\nZEND_END_ARG_INFO()
