id: c-while-deref-ignores-length-param
valid:
  - >-
    int handle(const char *buf, size_t len) { const char *p = buf; while (len &&
    *p) { p++; len--; } return 0; }
  - "int h(const char *buf, size_t len) { const char *p = buf; const char *end = buf + len; while (p < end && *p) { p++; } return 0; }"
  - "int h(const char *buf, size_t len) { size_t i = 0; while (i < len && buf[i]) { i++; } return 0; }"
  - "int h(const char *buf, size_t len) { const char *p = buf; while (p != buf + len && *p != '\\n') { p++; } return 0; }"
invalid:
  - >-
    int handle(const char *buf, size_t len) { const char *p = buf; while (*p) {
    p++; } return 0; }
  - "int h(const char *buf, size_t len) { const char *p = buf; while (*p) p++; return 0; }"
  - "int h(const char *buf, size_t len) { const char *s = buf; size_t n = 0; while (*s) { s++; n++; } return n; }"
  - "int h(const char *buf, size_t len) { const char *cur = buf; int cnt = 0; while (*cur) { if (*cur == ',') cnt++; cur++; } return cnt; }"
