id: c-inclusive-bound-index-check
valid:
  - >-
    int f(int color) { if (color >= 0 && color < gdMaxColors) { return
    table[color]; } return 0; }
  - 'int f(int i) { if (i < MAX_ITEMS) { return table[i]; } return 0; }'
  - 'int f(int i, int j) { if (i <= MAX_ITEMS) { return 0; } return table[j]; }'

invalid:
  - >-
    int f(int color) { if (color >= 0 && color <= gdMaxColors) { return
    table[color]; } return 0; }
  - 'int f(int i) { if (i >= 0 && i <= COUNT) return table[i]; return 0; }'
  - 'int f(struct s *p, int i) { if (i <= MAX_ITEMS) { p->arr[i] = 0; } return 0; }'
