id: c-float-expr-assigned-to-int
valid:
  - 'void f(size_t len) { int n = len + len / 100 + 600; }'
  - 'void f(size_t len) { double d = len * 0.01; }'
  - 'void f(size_t len) { int n = len / 100; }'
invalid:
  - 'void f(size_t len) { int n = len + 0.01 * len + 600; }'
  - 'int n = 3.14;'
  - 'void f(size_t len) { int n = (len + 1) * .5; }'
  - 'void f(size_t len) { int n = 2.0f * len; }'
