id: c-address-of-member-minus-one
valid:
  - >-
    struct t { int a; }; struct o { int m; struct t op; }; const struct t
    *f(struct o *p) { return &p->op; }
  - 'const struct t *f(struct o *p) { return &p->op + 1; }'
  - 'int f(struct o *p) { return p->m - 1; }'
invalid:
  - >-
    struct t { int a; }; struct o { int m; struct t op; }; const struct t
    *f(struct o *p) { return &p->op - 1; }
  - 'const struct t *f(struct o *p) { struct t *q = &p->op - 1; return q; }'
  - 'void *f(struct h *hdr) { return &hdr->data - 1; }'
