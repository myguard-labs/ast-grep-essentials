id: c-digit-accumulate-unchecked-overflow
valid:
  - >-
    static long parse(const char *p) { long n = 0; while (*p >= '0' && *p <=
    '9') { if (n > 922337203685477580) return -1; n = n * 10 + *p++ - '0'; }
    return n; }
invalid:
  - >-
    static long parse(const char *p) { long n = 0; while (*p >= '0' && *p <=
    '9') { n = n * 10 + *p++ - '0'; } return n; }
