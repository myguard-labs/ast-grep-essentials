id: c-digit-accumulate-unchecked-overflow
valid:
  - >-
    static long parse(const char *p) { long n = 0; while (*p >= '0' && *p <=
    '9') { if (n > 922337203685477580) return -1; n = n * 10 + *p++ - '0'; }
    return n; }
  - "static int f(const char *p) { int n = 0; while (*p >= '0' && *p <= '9') { int d = *p++ - '0'; if (n > 214748363) return -1; n = n * 10 + d; } return n; }"
  - "static unsigned f(const char *p) { unsigned n = 0; while (*p >= '0' && *p <= '9') { if (n > (0xffffffffu - (*p - '0')) / 10) break; n = n * 10 + (*p++ - '0'); } return n; }"
  - "static int f(const char *p) { int n = 0; while (*p) { n = n + 1; p++; } return n; }"
invalid:
  - >-
    static long parse(const char *p) { long n = 0; while (*p >= '0' && *p <=
    '9') { n = n * 10 + *p++ - '0'; } return n; }
  - "static int f(const char *p) { int n = 0; while (*p) { int d = *p++ - '0'; n = n * 10 + d; } return n; }"
  - "static int f(const char *p, int c) { int n = 0; while (c) n = n * 10 + c; return n; }"
  - "static int f(const char *p) { int n = 0; while (*p) { n = n * 10 + *p++ - '0'; if (n > 99999) break; } return n; }"
