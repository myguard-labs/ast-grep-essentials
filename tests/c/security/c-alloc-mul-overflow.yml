id: c-alloc-mul-overflow
valid:
- void f(void) { calloc(n, size); }
- void f(void) { malloc(size); }
- /* void f(void) { malloc(n * size); } */
- void f(void) { const char *text = "void f(void) { malloc(n * size); }"; }
invalid:
- "void f(void) { p = ngx_palloc(pool, (n * size)); }"
- "void f(void) { p = ngx_pnalloc(pool, (n * size)); }"
- "void f(void) { p = ngx_pcalloc(pool, (n * size)); }"
- void f(void) { malloc(n * size); }
- void f(void) { ngx_palloc(pool, n * size); }
- void f(void) { malloc((n * size)); }
- void f(void) { ngx_pnalloc(pool, n * size); }
- void f(void) { ngx_pcalloc(pool, n * size); }
