id: c-signed-shift-into-sign-bit
valid:
  - 'unsigned int m = 1u<<31;'
  - 'int m = 1 << 30;'
  - 'uint32_t m = (uint32_t)1 << 31;'
  - 'unsigned long long m = 1ULL << 31;'
invalid:
  - 'int m = 1<<31;'
  - 'int m = 1 << 31;'
  - 'void f(int *flags) { *flags |= 1 << 31; }'
  - 'int f(int x) { if (x & (1 << 31)) { return 1; } return 0; }'
