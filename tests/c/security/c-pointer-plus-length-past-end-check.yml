id: c-pointer-plus-length-past-end-check
valid:
  - |-
    int f(unsigned char *data, unsigned char *dataend) {
        if (2 > dataend - data)
            return 0;
        return 1;
    }
invalid:
  - |-
    int f(unsigned char *data, unsigned char *dataend) {
        if (data + 2 > dataend)
            return 0;
        return 1;
    }
