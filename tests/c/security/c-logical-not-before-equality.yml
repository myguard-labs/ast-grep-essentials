id: c-logical-not-before-equality
valid:
  - 'int f(int t) { if (!(t == 3)) return 1; return 0; }'
  - "int f(int t) { if (t != 3) return 1; return 0; }"
  - "int f(int t) { if ((!t) == 3) return 1; return 0; }"
  - "int f(int t, int x) { if (!t && x == 3) return 1; return 0; }"
invalid:
  - 'int f(int t) { if (!t == 3) return 1; return 0; }'
  - "int f(int t) { return !t == 0; }"
  - "int f(struct o *p) { if (!p->flags == 1) return 1; return 0; }"
  - "int f(int t, int u) { if (!t == u) return 1; return 0; }"
  - "int f(int *p) { if (!*p == 3) return 1; return 0; }"
