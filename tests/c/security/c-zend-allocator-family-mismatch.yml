id: c-zend-allocator-family-mismatch
valid:
  - 'void f(void) { char *p = emalloc(10); efree(p); }'
  - 'void f(void) { char *p = malloc(10); free(p); }'
  - 'void f(void) { char *p = ecalloc(1, 10); efree(p); }'
  - 'void f(void) { char *p = estrdup(s); efree(p); }'
  - 'void f(void) { char *p; p = emalloc(10); efree(p); }'
  - 'void f(void) { char *p = pemalloc(10, 1); pefree(p, 1); }'
  - 'void f(void) { char *p = emalloc(10); efree(p); p = malloc(20); free(p); }'
  - 'void f(void) { char *p = emalloc(10); efree(p); p = NULL; free(p); }'
  - 'void f(void) { char *p = emalloc(10); { char *p = NULL; free(p); } efree(p); }'
  - 'void f(char *p) { free(p); p = emalloc(10); efree(p); }'
  - 'void f(char *p) { efree(p); p = malloc(10); free(p); }'
  - 'void f(char *o) { char *p = emalloc(10); efree(p); p = o; free(p); }'
  - 'void f(void) { { char *p = emalloc(10); efree(p); } { char *p = malloc(10); free(p); } }'
  - 'void f(void) { char *p = malloc(10); pefree(p, 1); }'
  - 'void f(void) { char *p = pemalloc(10, 0); free(p); }'
  - 'void f(void) { char *p = my_emalloc(10); free(p); }'
  - 'void f(void) { char *p = zend_custom_alloc(10); free(p); }'
  - 'void f(char *q) { char *p = emalloc(10); free(q); }'
  - 'void f(char *q) { char *p = malloc(10); efree(q); }'
  - 'void f(void) { char *p = emalloc(10); }'
  - 'void f(void) { /* char *p = emalloc(10); free(p); */ }'
  - 'const char *s = "char *p = emalloc(10); free(p);";'
invalid:
  - 'void f(void) { char *p = emalloc(10); free(p); }'
  - 'void f(void) { char *p = ecalloc(1, 10); free(p); }'
  - 'void f(void) { char *p = estrdup(s); free(p); }'
  - 'void f(void) { char *p = estrndup(s, 4); free(p); }'
  - 'void f(void) { char *p = safe_emalloc(2, 4, 0); free(p); }'
  - 'void f(char *o) { char *p = erealloc(o, 20); free(p); }'
  - 'void f(void) { char *p; p = emalloc(10); free(p); }'
  - 'void f(void) { char *p = malloc(10); efree(p); }'
  - 'void f(void) { char *p = calloc(1, 10); efree(p); }'
  - 'void f(void) { char *p = strdup(s); efree(p); }'
  - 'void f(void) { char *p = strndup(s, 4); efree(p); }'
  - 'void f(char *o) { char *p = realloc(o, 20); efree(p); }'
  - 'void f(void) { char *p; p = malloc(10); efree(p); }'
