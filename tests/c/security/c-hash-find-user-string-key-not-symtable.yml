id: c-hash-find-user-string-key-not-symtable
valid:
  - |-
    zval **tmp;
    if (zend_symtable_find(ht, Z_STRVAL_P(offset), Z_STRLEN_P(offset)+1, (void **)&tmp) == SUCCESS) {
        use(tmp);
    }
invalid:
  - |-
    zval **tmp;
    if (zend_hash_find(ht, Z_STRVAL_P(offset), Z_STRLEN_P(offset)+1, (void **)&tmp) == SUCCESS) {
        use(tmp);
    }
