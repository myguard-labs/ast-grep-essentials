id: c-bitmap-words-div-plus-one
valid:
  - >-
    void f(unsigned long number, unsigned long *tried) { unsigned long i, n; n =
    (number + (8 * sizeof(unsigned long) - 1)) / (8 * sizeof(unsigned long));
    for (i = 0; i < n; i++) { tried[i] = 0; } }
invalid:
  - >-
    void f(unsigned long number, unsigned long *tried) { unsigned long i, n; n =
    number / (8 * sizeof(unsigned long)) + 1; for (i = 0; i < n; i++) { tried[i]
    = 0; } }
