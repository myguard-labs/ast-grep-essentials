id: c-last-char-check-indexes-length
valid:
  - >-
    int g(const char *buf, size_t len) { if (len > 0 && buf[len - 1] != '\n')
    return 1; return 0; }
  - "int g(const char *buf, size_t len) { if (len > 0 && buf[len - 2] != '\\n') return 1; return 0; }"
  - "int g(const char *buf, size_t len, size_t k) { if (len > 0 && buf[k] != '\\n') return 1; return 0; }"
  - "int g(const char *buf, size_t len) { if (len > 0 || buf[len] != '\\n') return 1; return 0; }"
invalid:
  - >-
    int g(const char *buf, size_t len) { if (len > 0 && buf[len] != '\n') return
    1; return 0; }
  - "int g(const char *buf, size_t len) { if (len > 0 && buf[len] != '\\0') return 1; return 0; }"
  - "int g(struct b *b, size_t len) { if (len > 0 && b->data[len] != c) return 1; return 0; }"
  - "int g(const char *buf, size_t len) { return len > 0 && buf[len] != '\\n'; }"
