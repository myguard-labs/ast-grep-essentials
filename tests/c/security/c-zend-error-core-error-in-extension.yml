id: c-zend-error-core-error-in-extension
valid:
  - >-
    ZEND_METHOD(exception, __construct) { if (zend_parse_parameters_ex(0, argc
    TSRMLS_CC, "|sl", &m, &l, &c) == FAILURE) { zend_error(E_ERROR, "Wrong
    parameter count"); } }
invalid:
  - >-
    ZEND_METHOD(exception, __construct) { if (zend_parse_parameters_ex(0, argc
    TSRMLS_CC, "|sl", &m, &l, &c) == FAILURE) { zend_error(E_CORE_ERROR, "Wrong
    parameter count"); } }
