id: c-openssl-legacy-hmac-with-libctx
valid:
  - >-
    typedef struct ossl_lib_ctx_st OSSL_LIB_CTX; typedef struct hmac_ctx_st
    HMAC_CTX; HMAC_CTX *HMAC_CTX_new(void); int HMAC_Init_ex(HMAC_CTX *c, const
    void *k, int l, const void *md, void *e); int f(void *libctx) { HMAC_CTX *h
    = HMAC_CTX_new(); return HMAC_Init_ex(h, 0, 0, 0, 0); }
invalid:
  - >-
    typedef struct ossl_lib_ctx_st OSSL_LIB_CTX; typedef struct hmac_ctx_st
    HMAC_CTX; HMAC_CTX *HMAC_CTX_new(void); int HMAC_Init_ex(HMAC_CTX *c, const
    void *k, int l, const void *md, void *e); int f(OSSL_LIB_CTX *libctx) {
    HMAC_CTX *h = HMAC_CTX_new(); return HMAC_Init_ex(h, 0, 0, 0, 0); }
