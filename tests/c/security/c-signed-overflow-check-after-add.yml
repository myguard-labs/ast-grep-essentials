  - 'int f(int off) { return off + 4 < off; }'
  - 'int f(int x) { if ((int)x + 100 < (int)x) { return 0; } return 1; }'
  - 'int f(int x, unsigned u) { if ((unsigned)u > 5) { return 2; } if (x + 100 < x) { return 0; } return 1; }'
  - 'int f(int x) { if ((long)x + 100 < x) { return 0; } return 1; }'
