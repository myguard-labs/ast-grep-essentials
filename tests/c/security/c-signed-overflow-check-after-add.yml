  - 'int f(int x) { if (x > INT_MAX - 100) { return 0; } return 1; }'
  - 'int f(int len) { if (len < 0 || len > INT_MAX - 4) { return -1; } return len + 4; }'
  - 'int f(int x) { int r; if (__builtin_add_overflow(x, 1, &r)) { return 0; } return r; }'
  - 'int f(unsigned x) { if ((unsigned)x + 100 < (unsigned)x) { return 0; } return 1; }'
  - 'int f(unsigned x) { if ((unsigned int)x + 100 < x) { return 0; } return 1; }'
  - 'int f(long x) { if ((unsigned long)x + 100 < x) { return 0; } return 1; }'
  - 'int f(long x) { if ((size_t)x + 100 < x) { return 0; } return 1; }'
  - 'int f(int x) { if ((uint32_t)x + 100 < x) { return 0; } return 1; }'
  - 'int f(int x) { if ((uintptr_t)x + 100 < x) { return 0; } return 1; }'
