    int f(struct t *p) { if (!p || p->bad) { return -1; } else { g(p->id); } return 0; }
  - |-
    int f(struct t *p, int c) { if (p && c) { p->x = 0; } return 0; }
  - |-
    int f(struct t *p, int c) { if (!p || c) { g(0); } return 0; }

invalid:
  - 'struct tp_s *tp; void f(void) { if (!tp || tp->start) { g(tp->end); } }'
