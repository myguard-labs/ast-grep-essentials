id: c-lexbor-local-name-to-libxml-node
valid:
  - |-
    const lxb_char_t *name = lxb_dom_element_qualified_name(el, NULL);
    xmlNodePtr n = xmlNewDocNode(doc, NULL, name, NULL);
invalid:
  - |-
    const lxb_char_t *name = lxb_dom_element_local_name(el, NULL);
    xmlNodePtr n = xmlNewDocNode(doc, NULL, name, NULL);
