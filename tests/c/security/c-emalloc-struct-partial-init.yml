id: c-emalloc-struct-partial-init
valid:
  - >-
    ctx = ecalloc(1, sizeof(io_ctx)); ctx->put_c = put_c; ctx->put_buf =
    put_buf;
  - 'buf = emalloc(len + 1);'
  - 'ctx = ecalloc(1, sizeof(*ctx));'
invalid:
  - 'ctx = emalloc(sizeof(io_ctx)); ctx->put_c = put_c; ctx->put_buf = put_buf;'
  - 'p = emalloc(sizeof(*p));'
  - 'ctx->next = emalloc(sizeof(node_t));'
  - '*pp = emalloc(sizeof(node_t));'
