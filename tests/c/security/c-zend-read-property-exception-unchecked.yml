id: c-zend-read-property-exception-unchecked
valid:
  - |-
    zval *pzdata = zend_read_property(NULL, obj, "data", 4, false, &rv);
    if (EG(exception)) { return; }
    ZVAL_DEREF(pzdata);
invalid:
  - |-
    zval *pzdata = zend_read_property(NULL, obj, "data", 4, false, &rv);
    ZVAL_DEREF(pzdata);
