id: c-loop-counter-array-write-unbounded
valid:
  - >-
    int f(const char *p, const char *last) { int lv[3]; int n = 0; while (p <
    last && n < 3) { lv[n] = *p++ - '0'; n++; } return lv[0]; }
  - 'int f(const char *p) { int lv[3]; int n = 0; while (n < 3) { lv[n] = *p - ''0''; p++; n++; } return lv[0]; }'
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) { total += *p - ''0''; p++; n++; } return n; }'
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) { if (3 <= n) break; lv[n] = *p++; n++; } return lv[0]; }'
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) { if (n >= 3) break; lv[n] = *p - ''0''; p++; n++; } return lv[0]; }'
invalid:
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) { if (n == 3) break; lv[n] = *p - ''0''; p++; n++; } return lv[0]; }'
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) { if (lv[n] > 0) break; lv[n] = *p - ''0''; p++; n++; } return lv[0]; }'
  - >-
    int f(const char *p, const char *last) { int lv[3]; int n = 0; while (p <
    last) { lv[n] = *p++ - '0'; n++; } return lv[0]; }
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) { lv[n] = *p - ''0''; p++; n++; /* c */ } return lv[0]; }'
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) lv[n] = *p++ - ''0'', n++; return lv[0]; }'
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) { if (n < 0) break; lv[n] = *p++; n++; } return lv[0]; }'
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) { if (0 > n) break; lv[n] = *p++; n++; } return lv[0]; }'
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) { if (n < -1) break; lv[n] = *p++; n++; } return lv[0]; }'
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) { if (n < 0U) break; lv[n] = *p++; n++; } return lv[0]; }'
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) { if (n < 0L) break; lv[n] = *p++; n++; } return lv[0]; }'
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) { if (n < 0x0) break; lv[n] = *p++; n++; } return lv[0]; }'
  - 'int f(const char *p) { int lv[3]; int n = 0; while (*p) { if (n < ''\0'') break; lv[n] = *p++; n++; } return lv[0]; }'
