id: c-format-string
valid:
- void f(void) { printf("%s", fmt); }
- void f(void) { printf(("%s"), input); }
- void f(void) { fprintf(stream, "%s", fmt); }
- /* void f(void) { printf(fmt); } */
- void f(void) { const char *text = "void f(void) { printf(fmt); }"; }
- void f(void) { syslog(priority, "%s", text); }
- void f(void) { printf("prefix " "%s", text); }
- void f(void) { vprintf("prefix " "%s", text); }
- void f(void) { fprintf(stream, "prefix " "%s", text); }
- void f(void) { dprintf(fd, "prefix " "%s", text); }
- void f(void) { vfprintf(stream, "prefix " "%s", text); }
- void f(void) { syslog(priority, "prefix " "%s", text); }
- void f(void) { vsyslog(priority, "prefix " "%s", text); }
invalid:
# Minimal v* calls below deliberately omit va_list: these parseable but
# API-arity-invalid snippets cover the existing minimal-arity matcher arms.
- "void f(void) { vprintf(fmt); }"
- "void f(void) { dprintf(fd, fmt); }"
- "void f(void) { vfprintf(stream, fmt); }"
- "void f(void) { syslog(priority, fmt); }"
- "void f(void) { vsyslog(priority, fmt); }"
- void f(void) { printf(fmt); }
- void f(void) { printf((fmt), input); }
- void f(void) { fprintf(stream, fmt); }
- void f(void) { printf(fmt, "text"); }
- void f(void) { fprintf(stream, fmt, "text"); }
- void f(void) { syslog(priority, fmt, "text"); }
- void f(void) { printf("%" FORMAT, value); }
- void f(void) { vprintf(fmt, args); }
- void f(void) { dprintf(fd, fmt, value); }
- void f(void) { vfprintf(stream, fmt, args); }
- void f(void) { vsyslog(priority, fmt, args); }
