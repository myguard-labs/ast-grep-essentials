id: nginx-thread-pool-get-null-name
valid:
  - 'void f(void) { ngx_thread_pool_get(cycle, &name); }'
  - 'void f(void) { ngx_thread_pool_add(cf, NULL); }'
  - '/* void f(void) { ngx_thread_pool_get(cycle, NULL); } */'
  - >-
    void f(void) { const char *text = "void f(void) { ngx_thread_pool_get(cycle,
    NULL); }"; }
  - 'void f(void) { ngx_thread_pool_get(cycle, (ngx_str_t *) &name); }'
  - 'void f(void) { ngx_thread_pool_add(cf, (ngx_str_t *) NULL); }'
invalid:
  - 'void f(void) { ngx_thread_pool_get(cycle, NULL); }'
  - 'void f(void) { ngx_thread_pool_get(cycle, (NULL)); }'
  - 'void f(void) { ngx_thread_pool_get(cycle, (ngx_str_t *) NULL); }'
