id: c-unsigned-predecrement-wrap-guard
valid:
  - 'size_t n = len; while (n > 0) { --n; if (IS_SLASH(p[n])) break; }'
  - "void f(const char *p, size_t n) { while (n > 0 && !IS_SLASH(p[n - 1])) { n--; } }"
  - "void f(const char *p, size_t n) { for (size_t i = n; i > 0; i--) { if (IS_SLASH(p[i - 1])) break; } }"
  - "void f(const char *p, size_t n) { while (n != 0) { n--; if (p[n] == '/') break; } }"
invalid:
  - 'size_t n = len; while ((--n < SIZE_MAX) && !IS_SLASH(p[n])) { }'
  - "void f(const char *p, size_t n, int c) { while ((--n < SIZE_MAX) && p[n] != '/') { c++; } }"
  - "void f(struct s *s) { while ((--s->n < SIZE_MAX) && s->p[s->n] != '/') { s->c++; } }"
  - "void f(const char *p, size_t i) { while ((--i < SIZE_MAX) && i > 5) { g(p[i]); } }"
