id: c-null-check-after-deref-in-or
valid:
  - >-
    int f(struct s *object, int op) { if (!object || object->type != 1) return
    -1; return 0; }
  - |-
    int f(struct s *p, struct s *q) { if (!p || p->a == 1 || !q) return -1; return 0; }
  - |-
    int f(struct s *p, int x) { if (x == 0 || !p) return -1; return 0; }
  - |-
    int f(struct s *p, struct s *q) { if (!p) return -1; if (p->a || !q) return -1; return 0; }

invalid:
  - >-
    int f(struct s *object, int op) { if (object->type != 1 || !object) return
    -1; return 0; }
  - |-
    int f(struct s *p) { if (p->a == 1 || p->b == 2 || !p) return -1; return 0; }
  - |-
    int f(struct s *p) { return p->ok || !p; }
