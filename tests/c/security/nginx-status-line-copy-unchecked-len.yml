id: nginx-status-line-copy-unchecked-len
valid:
  - |-
    u->headers_in.status_n = status;
    if (status_line->len > 3) {
        u->headers_in.status_line = *status_line;
    }
  - "if (status_line->len > 3 && ok) { u->headers_in.status_line = *status_line; }"
  - "if (status_line->len > 3) { if (x) { u->headers_in.status_line = *status_line; } }"
invalid:
  - |-
    u->headers_in.status_n = status;
    u->headers_in.status_line = *status_line;
  - "if (status_line->len > 0) { u->headers_in.status_line = *status_line; }"
  - "h.status_line = *status_line;"
