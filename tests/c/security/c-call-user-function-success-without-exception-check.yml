id: c-call-user-function-success-without-exception-check
valid:
  - >-
    int res = call_user_function_ex(a, b, c, d, 0, 0, 1, NULL); if (res ==
    SUCCESS && !EG(exception)) { use(d); }
invalid:
  - >-
    int res = call_user_function_ex(a, b, c, d, 0, 0, 1, NULL); if (res ==
    SUCCESS) { use(d); }
