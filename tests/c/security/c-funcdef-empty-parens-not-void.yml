id: c-funcdef-empty-parens-not-void
valid:
  - "int fuzzer_shutdown_php(void)\n{\n\treturn 0;\n}"
  - "static void f(void) { }"
  - "static int run(void) {\n    return 0;\n}"
  - "static int f(void) {\n  return 1;\n}"
  - "static int f(void) { return 0; }"
  - "int fpm_status_handle_request(void) { return 0; }"
  - "int load_funcs(void)\n{\n\treturn 0;\n}\n"
  - "static void prime_field_tests(void)\n{\n}"
  - "static inline int has_crc32_insn(void) { return 0; }"
  - "int f(int a) { return a; }"
  - "int f(int a, ...) { return a; }"
  - "int f(a, b) int a; int b; { return 0; }"
  - "int f(void);"
  - "int f();"
invalid:
  - "int fuzzer_shutdown_php()\n{\n\treturn 0;\n}"
  - "static void f() { }"
  - "static int run() {\n    return 0;\n}"
  - "static int f() {\n  return 1;\n}"
  - "static int f() { return 0; }"
  - "int fpm_status_handle_request() { return 0; }"
  - "int load_funcs()\n{\n\treturn 0;\n}\n"
  - "static void prime_field_tests()\n{\n}"
  - "static inline int has_crc32_insn() { return 0; }"
  - "int main() { return 0; }"
  - "static inline int g() { return 1; }"
