id: c-zval-string-from-unguarded-member
valid:
  - 'if (MyG(error_msg)) { ZVAL_STRING(retval, MyG(error_msg), 1); }'
  - 'if (MyG(error_msg) != NULL) { ZVAL_STRING(retval, MyG(error_msg), 1); }'
  - 'ZVAL_STRING(retval, "literal", 1);'
  - 'void f(zval *retval) { ZVAL_STRING(retval, MyG(error_msg) ? MyG(error_msg) : "", 1); }'
  - 'void f(zval *retval) { if (!MyG(error_msg)) { return; } ZVAL_STRING(retval, MyG(error_msg), 1); }'
  - 'void f(zval *retval) { if (!MyG(error_msg)) { return; } MyG(other) = NULL; ZVAL_STRING(retval, MyG(error_msg), 1); if (x) { MyG(error_msg) = NULL; } }'
  - 'void f(zval *retval) { if (!MyG(error_msg)) return; MyG(error_msg) = fetch_message(); if (!MyG(error_msg)) return; ZVAL_STRING(retval, MyG(error_msg), 1); }'
  - 'void f(zval *retval) { if (MyG(error_msg) == NULL) { return; } ZVAL_STRING(retval, MyG(error_msg), 1); }'
  - 'void f(zval *retval) { if (!MyG(error_msg)) return; MyG(error_msg) = fetch_message(); if (MyG(error_msg) == NULL) return; ZVAL_STRING(retval, MyG(error_msg), 1); }'
  - 'void f(zval *retval) { if (!MyG(error_msg)) return; MyG(error_msg) = fetch_message(); if (!MyG(error_msg)) { return; } ZVAL_STRING(retval, MyG(error_msg), 1); }'
invalid:
  - 'ZVAL_STRING(retval, MyG(error_msg), 1);'
  - 'void f(zval *retval) { ZVAL_STRING(retval, MyG(error_msg) /* c */, 1); }'
  - 'void f(zval *retval) { if (x) { return; } ZVAL_STRING(retval, MyG(error_msg), 1); }'
  - 'void f(zval *retval) { while (n--) { ZVAL_STRING(retval, MyG(error_msg), 1); } }'
  - 'void f(zval *retval) { if (!MyG(other_msg)) { return; } ZVAL_STRING(retval, MyG(error_msg), 1); }'
  - 'void f(zval *retval) { if (!MyG(error_msg)) { log_it(); } ZVAL_STRING(retval, MyG(error_msg), 1); }'
  - 'void f(zval *retval) { if (!MyG(error_msg)) { if (x) { return; } } ZVAL_STRING(retval, MyG(error_msg), 1); }'
  - 'void f(zval *retval) { if (!MyG(error_msg)) { return; } MyG(error_msg) = NULL; ZVAL_STRING(retval, MyG(error_msg), 1); }'
  - 'void f(zval *r) { if (!MyG(e)) return; ZVAL_STRING(r, MyG(e), 1); MyG(e) = NULL; ZVAL_STRING(r, MyG(e), 1); }'
