id: world-writable-file-c
valid:
  - |
    void coderabbit_control(void) { const char *text = "CodeRabbit"; }
  - |
    void test_symbol_direct_good() {
      chmod("/tmp/foo", S_IRUSR | S_IWUSR | S_IRGRP | S_IWGRP | S_IROTH);
      int fd = open_log();
      fchmod(fd, S_IRUSR | S_IWUSR | S_IRGRP | S_IWGRP | S_IROTH);
      int dirfd = open_log_dir();
      fchmodat(dirfd, "log", S_IRUSR | S_IWUSR | S_IRGRP | S_IWGRP | S_IROTH, AT_SYMLINK_NOFOLLOW);
      open("log", O_CREAT, mode);
      openat(fd, "log", O_CREAT, mode);
      creat("log", mode);
    }
  - |
    void test_octal_good_0755(const char *p) { chmod(p, 0755); }
  - |
    void test_octal_good_0750(const char *p) { chmod(p, 0750); }
  - |
    void test_octal_good_0751(const char *p) { chmod(p, 0751); }
  - |
    void test_octal_good_0644(const char *p) { chmod(p, 0644); }
  - |
    void test_decimal_good_493(const char *p) { chmod(p, 493); }
  - |
    void test_decimal_good_16(const char *p) { chmod(p, 16); }
invalid:
  - |
    void test_octal_bad() {
      mode_t mode = 0666;
      chmod("/tmp/foo", mode);
      int fd = open_log();
      fchmod(fd, mode);
      int dirfd = open_log_dir();
      fchmodat(dirfd, "log", mode, AT_SYMLINK_NOFOLLOW);
      open("log", O_CREAT, mode);
      openat(fd, "log", O_CREAT, mode);
      creat("log", mode);
    }
  - |
    void test_symbol_direct_bad() {
      chmod("/tmp/foo", S_IRUSR | S_IWUSR | S_IRGRP | S_IWGRP | S_IROTH | S_IWOTH);
      int fd = open_log();
      fchmod(fd, S_IROTH | S_IWOTH | S_IRUSR | S_IWUSR);
      int dirfd = open_log_dir();
      fchmodat(dirfd, "log", S_IWOTH);
      open("log", O_CREAT, S_IWUSR | S_IWOTH);
      openat(fd, "log", O_CREAT, S_IWOTH | S_IUSR | S_IGRP);
      creat("log", S_IWOTH);
    }
  - |
    void test_octal_0777(const char *p) { chmod(p, 0777); }
  - |
    void test_octal_0707(const char *p) { chmod(p, 0707); }
  - |
    void test_mode_var_0666(const char *p) { mode_t mode = 0666; chmod(p, mode); }
  - |
    void test_decimal_438(const char *p) { chmod(p, 438); }
  - |
    void test_decimal_18(const char *p) { chmod(p, 18); }
