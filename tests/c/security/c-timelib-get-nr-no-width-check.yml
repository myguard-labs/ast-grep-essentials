id: c-timelib-get-nr-no-width-check
valid:
  - >-
    int f; char *tptr = ptr; if ((f = timelib_get_nr((char **) &ptr, 6)) ==
    TIMELIB_UNSET || ptr - tptr != 6) { error(); }
  - 'int f; if ((f = timelib_get_nr((char **) &ptr, 2)) == TIMELIB_UNSET || ptr - tptr != 2) { error(); }'
  - 'int f; if ((f = timelib_get_nr((char **) &ptr, 6)) == TIMELIB_UNSET || ptr - tptr != 6) { error(); }'
  - 'int f; char *tptr = ptr; f = timelib_get_nr((char **) &ptr, 6); if (f == TIMELIB_UNSET || ptr - tptr != 6) { error(); }'
invalid:
  - >-
    int f; if ((f = timelib_get_nr((char **) &ptr, 6)) == TIMELIB_UNSET) {
    error(); }
  - 'int f; if ((f = timelib_get_nr((char **) &ptr, 6)) == TIMELIB_UNSET) { error(); } else { use(f); }'
  - 'int f; if (( f = timelib_get_nr( (char **) &ptr, 6 ) ) == TIMELIB_UNSET) { error(); }'
  - 'int f; if ((f = timelib_get_nr((char **) &ptr, 6)) == TIMELIB_UNSET || ptr - tptr != 6) { error(); } if ((f = timelib_get_nr((char **) &ptr, 6)) == TIMELIB_UNSET) { error(); }'
