id: c-int32-cast-of-difference
valid:
  - 'void f(size_t a, size_t b) { int64_t s = (int64_t) (a - b); (void) s; }'
  - "void f(size_t a, size_t b) { int64_t d = (int64_t) a - (int64_t) b; (void) d; }"
  - "void f(size_t a, size_t b) { uint32_t s = (uint32_t) (a - b); (void) s; }"
  - "void f(int a, int b) { int32_t s = (int32_t) a - b; (void) s; }"
invalid:
  - 'void f(size_t a, size_t b) { int32_t s = (int32_t) (a - b); (void) s; }'
  - "int32_t f(int64_t a, int64_t b) { return (int32_t) (a - b); }"
  - "void f(char *a, char *b) { int32_t s = (int32_t) (a - b); (void) s; }"
  - "void f(uint64_t a) { int32_t s = (int32_t) (a - 1); (void) s; }"
  - "void f(size_t a, size_t b) { int32_t s; s = (int32_t) (a - b); (void) s; }"
