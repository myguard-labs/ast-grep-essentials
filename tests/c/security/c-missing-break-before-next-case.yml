id: c-missing-break-before-next-case
valid:
  - >-
    void f(int x, int y) { switch (x) { case 1: y = 1; break; case 2: y = 2;
    break; } }
  - |-
    void f(int t, int *x) { switch (t) { case 1: *x = 1; return; case 2: *x = 2; break; } }
  - |-
    void f(int t, int *x) { switch (t) { case 1: *x = 1; goto out; case 2: break; } out: return; }
  - |-
    void f(int t, int *x) { switch (t) { case 1: case 2: *x = 2; break; } }
invalid:
  - 'void f(int x, int y) { switch (x) { case 1: y = 1; case 2: y = 2; break; } }'
  - |-
    void f(int t, int *x) { switch (t) { case 1: *x = 1; default: *x = 2; } }
  - |-
    void f(int t, int *x) { switch (t) { case 1: g(x); case 2: break; } }
  - |-
    void f(int t, int *x) { switch (t) { case 1: if (t) *x = 1; case 2: break; } }
