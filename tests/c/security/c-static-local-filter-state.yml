id: c-static-local-filter-state
valid:
  - >-
    static int ap_filter_fn(ap_filter_t *f, ap_bucket_brigade *b) { int done =
    0; if (done) { return 0; } done++; return 0; }
invalid:
  - >-
    static int ap_filter_fn(ap_filter_t *f, ap_bucket_brigade *b) { static int
    done = 0; if (done) { return 0; } done++; return 0; }
