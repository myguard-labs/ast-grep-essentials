id: c-unbounded-char-copy-loop
valid:
  - 'while (*p > 32 && n++ < sizeof(buf) - 1) *q++ = *p++;'
  - "while (n-- > 0 && *p > 32) *q++ = *p++;"
  - "while (*p > 32 && q < end) *q++ = *p++;"
invalid:
  - 'while (*p > 32) *q++ = *p++;'
  - "while (*src > 0) *dst++ = *src++;"
  - "while (*p > ' ') *q++ = *p++;"
