id: c-comparison-result-discarded
valid:
  - 'void f(int *a, int *b) { a[0] = b[0]; }'
  - 'void f(int *a, int m) { count(a, m == 1); }'
  - 'void f(int *a, int m) { count(a, m == 1), count(a, m == 2); }'
invalid:
  - 'void f(int *a, int *b) { a[0] == b[0]; }'
  - 'void f(int *a, int m) { a[m] == count(a, m); }'
