id: c-advance-bounds-check-fails-open
valid:
  - >-
    int f(char *p, char *end) { if (++p >= end || *p == '\n') { return -1; }
    return 0; }
  - "int f(char *p, char *end) { if (p++ < end && *p == 'x') { return -1; } return 0; }"
  - "int f(char *p, char *end) { if (p < end && *++p == 'x') { return -1; } return 0; }"
  - "int f(char *p, char *end) { if (++p < end || *p == 'x') { return -1; } return 0; }"
invalid:
  - >-
    int f(char *p, char *end) { if (++p < end && (*p == '\n')) { return -1; }
    return 0; }
  - "int f(char *p, char *end) { if (++p < end && *p == 'x') return -1; return 0; }"
  - "int f(char *p, char *end) { if (++p < end && isalpha(*p)) { use(p); } return 0; }"
  - "int f(struct t *t, char *end) { if (++t->p < end && *t->p == 'x') { return -1; } return 0; }"
