id: c-foreach-value-type-test-no-deref
valid:
  - >-
    ZEND_HASH_FOREACH_VAL_IND(ht, tmp) { ZVAL_DEREF(tmp); if (Z_TYPE_P(tmp) ==
    IS_OBJECT) { f(); } } ZEND_HASH_FOREACH_END();
  - 'ZEND_HASH_FOREACH_VAL_IND(ht, tmp) { ZVAL_DEREF(tmp); if (Z_OBJCE_P(tmp) == ce) { f(); } } ZEND_HASH_FOREACH_END();'
  - 'void f(zval *tmp) { if (x == 1) { g(); } }'
invalid:
  - >-
    ZEND_HASH_FOREACH_VAL_IND(ht, tmp) { if (Z_TYPE_P(tmp) == IS_OBJECT) { f();
    } } ZEND_HASH_FOREACH_END();
  - 'void f(zval *tmp) { if (Z_OBJCE_P(tmp) == ce) { g(); } }'
  - 'void f(zval *tmp) { if (Z_TYPE_P(tmp) != IS_STRING) { continue; } }'
  - 'void f(zval *tmp) { if (Z_TYPE_P(tmp) == IS_ARRAY && n > 0) { g(); } }'
