id: c-foreach-value-type-test-no-deref
valid:
  - >-
    ZEND_HASH_FOREACH_VAL_IND(ht, tmp) { ZVAL_DEREF(tmp); if (Z_TYPE_P(tmp) ==
    IS_OBJECT) { f(); } } ZEND_HASH_FOREACH_END();
invalid:
  - >-
    ZEND_HASH_FOREACH_VAL_IND(ht, tmp) { if (Z_TYPE_P(tmp) == IS_OBJECT) { f();
    } } ZEND_HASH_FOREACH_END();
