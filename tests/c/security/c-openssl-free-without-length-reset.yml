id: c-openssl-free-without-length-reset
valid:
  - |-
    struct s { unsigned char *alpn_selected; size_t alpn_selected_len; };
    static void reset(struct s *s) {
        OPENSSL_free(s->alpn_selected);
        s->alpn_selected = NULL;
        s->alpn_selected_len = 0;
    }
invalid:
  - |-
    struct s { unsigned char *alpn_selected; size_t alpn_selected_len; };
    static void reset(struct s *s) {
        OPENSSL_free(s->alpn_selected);
        s->alpn_selected = NULL;
    }
