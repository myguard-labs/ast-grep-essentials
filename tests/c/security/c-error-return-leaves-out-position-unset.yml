id: c-error-return-leaves-out-position-unset
valid:
  - >-
    int f(int x, long *newpos, int *status) { *newpos = x; *status = 1; return
    0; }
  - 'int f(int *status) { *status = 1; return 0; }'
  - 'int f(int x, long *newpos, int *status) { *status = 0; *newpos = x; return 0; }'
invalid:
  - 'int f(int x, long *newpos, int *status) { *status = 1; return 0; }'
  - 'static int f(int x, size_t *newpos, int *status) { if (x < 0) { *status = -1; return -1; } return 0; }'
  - 'int f(int *status, long *newpos) { *status = 1; return 0; }'
  - 'int f(int x, long *newpos, int *status) { *status = x; return x; }'
