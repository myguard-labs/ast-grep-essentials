id: c-llist-dtor-cast-hides-signature
valid:
  - |-
    static void dtor(void *p) { (void)p; }
    void f(zend_llist *l) { zend_llist_init(l, sizeof(int), dtor, 0); }
invalid:
  - |-
    static void dtor(void *p) { (void)p; }
    void f(zend_llist *l) { zend_llist_init(l, sizeof(int), (llist_dtor_func_t) dtor, 0); }
