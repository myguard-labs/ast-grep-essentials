id: c-object-store-bucket-unchecked
valid:
  - >-
    if (IS_OBJ_VALID(EG(objects_store).object_buckets[h])) {
    use(EG(objects_store).object_buckets[h]); }
  - "void f(void) { zend_object *o = EG(other_store).object_buckets[h]; use(o); }"
  - "void f(void) { use(EG(objects_store).object_buckets[h]); }"
  - "void f(void) { zend_object *o = EG(objects_store).object_buckets[h]; (void)o; }"
invalid:
  - 'zend_object *o = EG(objects_store).object_buckets[h]->obj; use(o);'
  - "void f(void) { int n = EG(objects_store).object_buckets[h]->handle; use(n); }"
  - "void f(void) { use(EG(objects_store).object_buckets[h + 1]->obj); }"
  - "void f(void) { if (h) { use(EG(objects_store).object_buckets[h]->obj); } }"
