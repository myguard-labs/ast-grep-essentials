id: c-hash-find-out-param-single-pointer
valid:
  - 'pval **attr; zend_hash_index_find(ht, i, (void **) &attr);'
  - |-
    pval *other; pval **attr; zend_hash_index_find(ht, i, (void **) &attr);
  - |-
    pval *attr; attr = zend_hash_index_find(ht, i);
invalid:
  - 'pval *attr; zend_hash_index_find(ht, i, (void **) &attr);'
  - |-
    void f(HashTable *ht, ulong i) { pval *attr; zend_hash_index_find(ht, i, (void **) &attr); }
  - |-
    pval *attr; zend_hash_quick_find(ht, key, (void **) &attr);
