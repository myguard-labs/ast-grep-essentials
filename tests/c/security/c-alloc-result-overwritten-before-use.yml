id: c-alloc-result-overwritten-before-use
valid:
  - 'p->data = malloc(1); memcpy(p->data, "", 1);'
  - 'p = malloc(n); q = malloc(n);'
  - 'p = malloc(n); free(p); p = NULL;'
  - 'p = malloc(n); p = realloc(p, m);'
invalid:
  - 'p->data = malloc(1); p->data = "";'
  - 's->p = malloc(8); s->p = NULL;'
  - '*pp = malloc(n); *pp = q;'
  - 'p = malloc(n); p = realloc(q, m);'
