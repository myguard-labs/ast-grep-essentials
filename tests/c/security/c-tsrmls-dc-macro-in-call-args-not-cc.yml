id: c-tsrmls-dc-macro-in-call-args-not-cc
valid:
  - >-
    void php_implode(int a, void *b, void *c); void f(int a, void *b, void *c) {
    php_implode(a, b, c TSRMLS_CC); }
invalid:
  - >-
    void php_implode(int a, void *b, void *c); void f(int a, void *b, void *c) {
    php_implode(a, b, c TSRMLS_DC); }
