id: c-nonvoid-switch-falls-off-end
valid:
  - |-
    static int f(int k) {
      switch (k) {
        case 1: return 0;
        case 2: return 1;
      }
      return -1;
    }
invalid:
  - |-
    static int f(int k) {
      switch (k) {
        case 1: return 0;
        case 2: return 1;
      }
    }
