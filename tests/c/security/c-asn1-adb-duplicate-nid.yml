id: c-asn1-adb-duplicate-nid
valid:
  - >-
    ASN1_ADB(T) = { ADB_ENTRY(NID_a, ASN1_EXP(T, v.a, ASN1_OCTET_STRING, 0)),
    ADB_ENTRY(NID_b, ASN1_EXP(T, v.b, ASN1_OCTET_STRING, 0)), } ASN1_ADB_END(T,
    0, type, 0, &def, NULL);
invalid:
  - >-
    ASN1_ADB(T) = { ADB_ENTRY(NID_a, ASN1_EXP(T, v.a, ASN1_OCTET_STRING, 0)),
    ADB_ENTRY(NID_a, ASN1_EXP(T, v.b, ASN1_OCTET_STRING, 0)), } ASN1_ADB_END(T,
    0, type, 0, &def, NULL);
