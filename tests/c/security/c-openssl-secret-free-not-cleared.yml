id: c-openssl-secret-free-not-cleared
valid:
  - >-
    void f(void) { unsigned char *buf = OPENSSL_malloc(32); /* use */
    OPENSSL_free(buf); }
  - 'void f(unsigned char *key, size_t n) { OPENSSL_clear_free(key, n); }'
  - 'void f(unsigned char *cert_der) { OPENSSL_free(cert_der); }'
  - 'void f(unsigned char *token, size_t n) { OPENSSL_cleanse(token, n); OPENSSL_clear_free(token, n); }'
invalid:
  - >-
    void f(void) { unsigned char *token_key = OPENSSL_malloc(32); /* use */
    OPENSSL_free(token_key); }
  - 'void f(unsigned char *nonce) { OPENSSL_free(nonce); }'
  - 'void f(char *user_password) { OPENSSL_free(user_password); }'
  - 'void f(char *SECRET) { OPENSSL_free(SECRET); }'
