id: c-subscript-write-at-declared-size
valid:
  - |-
    char buf[8];
    buf[7] = '\0';
  - 'void f(void) { char buf[8]; x = buf[8]; }'
  - 'void f(void) { char buf[8]; buf[0] = buf[8]; }'
invalid:
  - |-
    char buf[8];
    buf[8] = '\0';
  - 'void f(void) { char buf[8]; buf[8] = 0; }'
  - 'void f(void) { char buf[8]; buf[ 8 ] = ''x''; }'
