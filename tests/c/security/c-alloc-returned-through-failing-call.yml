id: c-alloc-returned-through-failing-call
valid:
  - >-
    void *p = pemalloc(n, 0); if (!zend_hash_add_ptr(ht, key, p)) { pefree(p,
    0); } return p;
  - 'void *p = malloc(n); use(p); return 0;'
  - 'void *p = get(); return init(p);'
invalid:
  - 'void *p = pemalloc(n, 0); return zend_hash_add_ptr(ht, key, p);'
  - 'void *p = malloc(n); return register_ptr(ctx, p);'
  - 'char *b = pemalloc(n, 1); x = 1; return g(b);'
