id: c-asprintf-result-discarded
valid:
  - 'char *s; if (asprintf(&s, "%s", t) < 0) { return; } use(s);'
  - 'char *s; int n = asprintf(&s, "%s", t); if (n < 0) return;'
  - 'char *s; rc = asprintf(&s, "x");'
invalid:
  - 'char *s; asprintf(&s, "%s", t); use(s);'
  - 'void f(void) { char *s; if (x) { asprintf(&s, "%d", n); } }'
  - 'void f(void) { for (;;) { asprintf(&s, "%d", i); } }'
