id: c-openssl-verify-eq-zero-misses-error
valid:
  - |-
    int j = EVP_DigestVerify(mctx, data, len, hdata, hdatalen);
    if (j <= 0) {
        return 0;
    }
  - |-
    int j = EVP_DigestVerify(mctx, data, len, hdata, hdatalen);
    if (j != 1) {
        return 0;
    }
  - |-
    int j = EVP_DigestVerify(mctx, data, len, hdata, hdatalen);
    if (j < 0 || j == 0) {
        return 0;
    }
  - |-
    int j = EVP_DigestVerify(mctx, data, len, hdata, hdatalen);
    if (j < 1) return 0;
invalid:
  - |-
    int j = EVP_DigestVerify(mctx, data, len, hdata, hdatalen);
    if (j == 0) {
        return 0;
    }
  - |-
    int j = EVP_DigestVerify(mctx, data, len, hdata, hdatalen);
    if (j == 0) return 0;
  - |-
    long r = EVP_DigestVerify(mctx, data, len, hdata, hdatalen);
    if (r == 0) {
        goto err;
    }
  - |-
    int j = EVP_DigestVerify(mctx, data, len, hdata, hdatalen);
    if (j == 0) {
        log_error("bad signature");
        return -1;
    }
