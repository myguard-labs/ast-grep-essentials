id: c-backward-lookback-without-start-bound
valid:
  - >-
    int f(char *buf, char *p, int state) { if (state == 2 && p > buf+2 && *(p-1)
    == 'm' && *(p-2) == 'x') return 1; return 0; }
  - >-
    void f(unsigned char *start, unsigned char *end) { unsigned char *p; for (p
    = end; p > start; p--) { if (*(p - 1) == ',') { start = p; break; } } }
  - >-
    void f(unsigned char *start, unsigned char *p) { while (start < p) { if (*(p
    - 1) == ' ') return; p--; } }
  - >-
    void f(unsigned char *start, unsigned char *p) { while (p != start) { if
    (*(p - 1) == ' ') return; p--; } }
invalid:
  - >-
    int f(char *buf, char *p, int state) { if (state == 2 && *(p-1) == 'm' &&
    *(p-2) == 'x') return 1; return 0; }
  - >-
    void f(unsigned char *start, unsigned char *end, unsigned char *p) { for (p
    = end; end > start; p--) { if (*(p - 1) == ',') return; } }
  - >-
    void f(unsigned char *p, int n) { while (n > 0) { if (*(p - 1) == ',')
    return; n--; } }
