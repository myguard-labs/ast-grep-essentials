id: c-insecure-temp-name
valid:
  - 'void f(char *t) { int fd = mkstemp(t); }'
  - 'void f(void) { FILE *fp = tmpfile(); }'
  - 'void f(char *t) { my_tmpnam(t); }'
  - 'void f(void) { /* tmpnam(NULL); */ }'
  - 'const char *s = "mktemp(template)";'
invalid:
  - 'void f(char *t) { mktemp(t); }'
  - 'void f(char *t) { tmpnam(t); }'
  - 'void f(char *t) { tmpnam_r(t); }'
  - 'void f(void) { char *p = tempnam("/tmp", "app"); }'
