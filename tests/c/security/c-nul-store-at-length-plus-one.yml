id: c-nul-store-at-length-plus-one
valid:
  - 'recv_buf[retval] = ''\0'';'
  - 'void f(void) { recv_buf[retval - 1] = ''\0''; }'
  - 'void f(void) { recv_buf[retval] = ''x''; }'
invalid:
  - 'recv_buf[retval + 1] = ''\0'';'
  - 'void f(void) { recv_buf[retval+1]=''\0''; }'
  - 'void f(void) { recv_buf[ retval /* len */ + 1 ] = ''\0''; }'
