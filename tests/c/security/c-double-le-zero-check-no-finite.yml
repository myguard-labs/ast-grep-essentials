id: c-double-le-zero-check-no-finite
valid:
  - |-
    int scale(double gamma) {
        if (!isfinite(gamma)) {
            return -1;
        }
        if (gamma <= 0.0) {
            return -1;
        }
        return 0;
    }
  - |-
    int scale(double gamma) {
        if (gamma <= 0.0) {
            return -1;
        }
        if (!isfinite(gamma)) {
            return -1;
        }
        return 0;
    }
  - 'int scale(double gamma) { if (gamma > 0.0 && isfinite(gamma)) { return 0; } return -1; }'
  - 'int scale(double gamma) { if (!isfinite(gamma) || gamma <= 0.0) { return -1; } return 0; }'
  - 'int scale(double gamma) { if (isnan(gamma) || isinf(gamma)) { return -1; } if (gamma <= 0.0) { return -1; } return 0; }'
invalid:
  - |-
    int scale(double gamma) {
        if (gamma <= 0.0) {
            return -1;
        }
        return 0;
    }
  - 'int scale(double gamma) { if ((gamma) <= 0.0) { return -1; } return 0; }'
  - 'int scale(double gamma) { return gamma <= 0.0 ? -1 : 0; }'
  - 'int scale(double gamma) { if (gamma /* c */ <= 0.0) { return -1; } return 0; }'
  - 'int scale(double gamma, double other) { if (isnan(other) || isinf(other)) { return -1; } if (gamma <= 0.0) { return -1; } return 0; }'
