id: c-double-le-zero-check-no-finite
valid:
  - |-
    int scale(double gamma) {
        if (!isfinite(gamma)) {
            return -1;
        }
        if (gamma <= 0.0) {
            return -1;
        }
        return 0;
    }
invalid:
  - |-
    int scale(double gamma) {
        if (gamma <= 0.0) {
            return -1;
        }
        return 0;
    }
