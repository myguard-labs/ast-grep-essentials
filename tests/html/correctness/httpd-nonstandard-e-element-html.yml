id: httpd-nonstandard-e-element-html
valid:
  - >-
    <p><strong>Default:</strong> <em>Unset; uses operating system
    defaults</em></p>
  - '<p><code>e</code> is the Euler number, written <span class="e">e</span></p>'
  - '<p>See <embed src="diagram.svg" type="image/svg+xml"> and <em>text</em>.</p>'
invalid:
  - >-
    <p><strong>Default:</strong> <e>Unset; uses operating system
    defaults</e></p>
  - '<ul><li><e>Unset</e></li></ul>'
  - '<p><e class="default">Unset</e></p>'
  - '<dl><dd><e>on</e> or <e>off</e></dd></dl>'
