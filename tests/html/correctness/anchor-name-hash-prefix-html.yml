id: anchor-name-hash-prefix-html
valid:
  - '<a name="customlog">directive</a>'
  - '<a name="customlog">CustomLog</a><a href="#customlog">back to CustomLog</a>'
  - '<a name="custom#log">CustomLog</a>'
  - '<a id="customlog" name="customlog">CustomLog</a>'
invalid:
  - '<a name="#customlog">directive</a>'
  - '<a name="#customlog" id="customlog">CustomLog</a>'
  - '<a href="x.html" name="#customlog">CustomLog</a>'
  - '<a name="#custom-log"><h3>CustomLog</h3></a>'
