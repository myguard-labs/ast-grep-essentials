id: coraza-external-script-missing-sri-html
valid:
  - >-
    <script src="https://cdn.example.com/lib/json2html.min.js"
    integrity="sha384-AAAA" crossorigin="anonymous"></script>
  - '<script src="/static/js/app.js"></script>'
  - '<script>window.cfg = { debug: false };</script>'
  - '<script integrity="sha384-AAAA" crossorigin="anonymous" src="https://cdn.example.com/lib/a.min.js"></script>'
  - '<script src="https://cdn.example.com/lib/a.min.js" integrity=''sha384-AAAA'' crossorigin="anonymous"></script>'
invalid:
  - '<script src="https://cdn.example.com/lib/json2html.min.js"></script>'
  - '<script src="http://cdn.example.com/lib/a.min.js"></script>'
  - '<script src="https://cdn.example.com/lib/a.min.js?v=3"></script>'
  - '<html><head><script src="https://cdn.example.com:8443/lib/a.min.js"></script></head></html>'
