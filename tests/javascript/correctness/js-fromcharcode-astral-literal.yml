id: js-fromcharcode-astral-literal
valid:
  - 'var s = String.fromCodePoint( 0x1F3F3 );'
  - 'var s = String.fromCodePoint(0x1F3F3);'
  - 'var s = String.fromCharCode(0xFFFF);'
  - 'var s = String.fromCharCode(0x41);'
  - 'var s = String.fromCharCode(65);'
  - 'var s = String.fromCharCode(0xD83C, 0xDFF3);'
invalid:
  - 'var s = String.fromCharCode( 0x1F3F3 );'
  - 'var s = String.fromCharCode(0x1f3f3);'
  - 'var s = String.fromCharCode(0X1F3F3);'
  - 'var s = String.fromCharCode(0x10FFFF);'
  - 'var s = `${String.fromCharCode(0x1F600)} ok`;'
