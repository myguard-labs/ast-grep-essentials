    if ( ui.item.hasClass('ui-draggable') && ui.item.data('draggable') )
    ui.item.draggable('destroy');
  - 'if ( el.data( ''draggable'' ) ) el.draggable( ''destroy'' );'
  - 'if ( el.hasClass( ''ui-draggable'' ) ) el.addClass( ''x'' );'
  - 'if ( el.hasClass( ''ui-draggable'' ) && el.data( ''draggable'' ) ) { el.draggable( ''destroy'' ); }'
invalid:
