  - 'if ( a.hasClass( ''ui-draggable'' ) ) { a.draggable( ''destroy'' ); }'
  - 'if ( el.hasClass( ''ui-draggable'' ) && visible ) el.draggable( ''destroy'' );'
  - 'if ( this.hasClass( ''ui-draggable'' ) ) this.draggable( ''destroy'' ); else other();'
