id: js-backbone-route-param-free-text
valid:
  - 'var routes = { ''search/*query'': ''search'' };'
  - "var routes = { 'files/*path': 'file' };"
  - "var routes = { '': 'home', 'about': 'about' };"
  - "var routes = { 'users/:id/*rest': 'user' };"
invalid:
  - 'var routes = { ''search/:query'': ''search'' };'
  - "var routes = { 'users/:id/posts/:slug': 'post' };"
  - "var routes = { \"search/:query\": \"search\" };"
  - "var routes = { 'tag/:name': 'tag', 'help': 'help' };"
