id: js-jquery-empty-parent-node
valid:
  - '$( node ).empty().append( ''<br>'' );'
  - "$( node ).empty();"
  - "$( node.firstChild ).empty();"
  - "node.parentNode.removeChild( node );"
invalid:
  - '$( node.parentNode ).empty().append( ''<br>'' );'
  - "$( a.parentNode ).empty();"
  - "$( this.parentNode ).empty();"
  - "$( a.b.parentNode ).empty();"
  - "$( self.element.parentNode ).empty().append( x );"
