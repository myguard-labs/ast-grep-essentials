id: js-instanceof-negated-left-operand
valid:
  - 'function run(o) { if (!(this instanceof o)) { return 1; } }'
  - "const ok = !(this instanceof o);"
  - "const ok = a instanceof B;"
  - "if (!a.b) { return 1; }"
invalid:
  - 'function run(o) { if (!this instanceof o) { return 1; } }'
  - "const r = !a instanceof B;"
  - "const r = !a.b instanceof C;"
  - "if (!obj instanceof Array) { return 1; }"
  - "const r = !!a instanceof B;"
