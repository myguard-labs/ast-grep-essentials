id: js-jquery-attr-boolean-property
valid:
  - '$(this).prop(''checked'', function() { return true; });'
  - "$(x).prop('checked', true);"
  - "$(x).attr('aria-checked', 'true');"
  - "$(x).is(':checked');"
invalid:
  - '$(this).attr(''checked'', function() { return true; });'
  - "$(x).attr('checked', 'checked');"
  - "$('#a').parent().attr('checked', false);"
  - "$x.attr('checked', true).show();"
