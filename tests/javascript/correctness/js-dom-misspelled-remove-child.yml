id: js-dom-misspelled-remove-child
valid:
  - 'node.parentNode.removeChild(node.nextSibling);'
  - 'parent.removeChild(child);'
  - 'var removedChild = parent.removeChild(child);'
  - 'this.removedChild = null;'
  - 'list.removedChildren.push(child);'
invalid:
  - 'node.parentNode.removedChild(node.nextSibling);'
  - 'parent.removedChild(child);'
  - 'this.el.removedChild();'
  - 'document.body.removedChild(div);'
  - '$(x).get(0).removedChild(y);'
