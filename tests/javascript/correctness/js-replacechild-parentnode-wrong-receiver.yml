id: js-replacechild-parentnode-wrong-receiver
valid:
  - >-
    node.parentNode.parentNode.replaceChild( document.createElement( 'p' ),
    node.parentNode );
  - |-
    parent.replaceChild( newEl, node );
  - |-
    node.parentNode.replaceChild( newEl, node );
  - |-
    list.replaceChild( newEl, list.firstChild );
invalid:
  - >-
    editor.getBody().replaceChild( document.createElement( 'p' ),
    node.parentNode );
  - |-
    this.el.replaceChild( newEl, node.parentNode );
  - |-
    node.replaceChild( newEl, node.parentNode );
  - |-
    node.parentNode.replaceChild( newEl, node.parentNode );
