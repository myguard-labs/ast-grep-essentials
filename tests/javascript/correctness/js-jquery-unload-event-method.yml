id: js-jquery-unload-event-method
valid:
  - 'jQuery( ''#TB_window'' ).on( ''tb_unload'', function () { cleanup(); } );'
  - '$( window ).on( ''unload'', function () { cleanup(); } );'
  - 'window.onunload = function () { cleanup(); };'
  - 'unload( function () { cleanup(); } );'
invalid:
  - 'jQuery( ''#TB_window'' ).unload( function () { cleanup(); } );'
  - '$( window ).unload( function () { cleanup(); } );'
  - '$( window ).unload();'
  - 'jQuery( window ).unload( handler ).resize( other );'
