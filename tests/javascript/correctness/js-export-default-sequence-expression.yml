id: js-export-default-sequence-expression
valid:
  - 'export default (10, 11);'
  - 'export default 10;'
  - 'export default function () {}'
  - 'export default { a: 1, b: 2 };'
  - 'export default [10, 11];'
invalid:
  - 'export default 10, 11;'
  - 'export default a, b;'
  - 'export default x = 1, y = 2;'
  - 'export default ''a'', ''b'';'
  - 'export default fn, other;'
