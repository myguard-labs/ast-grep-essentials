id: js-jquery-bare-focus-call
valid:
  - '$( ''#image-undo'' ).focus( handler );'
  - "$(x).trigger('focus');"
  - "$(x).on('focus', h);"
  - "$(x).focus(h);"
  - "el.focus();"
  - "input.focus();"
  - "document.getElementById('x').focus();"
  - "this.inputRef.current.focus();"
invalid:
  - '$( ''#image-undo'' ).focus();'
  - "$(x).focus();"
  - "this.$input.focus();"
  - "$('a').find('b').focus().select();"
  - "$('#x').focus();"
  - "jQuery('#x').focus();"
  - "$('#f').find('input').first().focus();"
  - "$el.focus();"
