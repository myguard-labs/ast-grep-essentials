id: js-trailing-comma-object-literal-legacy
valid:
  - 'var o = { close: function () {} };'
  - |-
    var o = { close: function () {}, open: 1 };
  - |-
    foo({ close: function () {} });
invalid:
  - 'var o = { close: function () {}, };'
  - |-
    foo({ close: function () {}, });
  - |-
    var o = {
      close: function () {},
    };
