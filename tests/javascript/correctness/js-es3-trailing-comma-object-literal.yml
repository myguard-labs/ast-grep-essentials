id: js-es3-trailing-comma-object-literal
valid:
  - 'var view = { render: function () {} };'
  - 'var view = {};'
  - 'var view = { a: 1, b: 2 };'
  - 'var view = { a: { b: 1 }, c: [1, 2] };'
  - 'foo({ a: 1 });'
invalid:
  - 'var view = { render: function () {}, };'
  - 'var view = { a: 1, };'
  - 'var view = { a: { b: 1, } };'
  - 'foo({ a: 1, });'
  - |-
    var view = {
      a: 1,
    };
