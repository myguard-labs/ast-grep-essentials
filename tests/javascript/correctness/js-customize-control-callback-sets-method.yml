id: js-customize-control-callback-sets-method
valid:
  - >-
    api('background_color', function (setting) { setting.method = 'postMessage';
    });
  - "api.control( 'x', function ( control ) { control.setting.method = 'postMessage'; } );"
  - "api.control( 'x', function ( control ) { control.params.label = 'Label'; } );"
  - "api.control( 'x', function ( control ) { control.setting.set( 'v' ); } );"
invalid:
  - >-
    api.control('background_color', function (control) { control.method =
    'postMessage'; });
  - "api.control( id, function ( c ) { c.method = 'refresh'; } );"
  - "api.control( 'x', function ( control ) { control.method = opts.method; } );"
  - "api.control(\n  'x',\n  function ( control ) {\n    control.method = 'postMessage';\n  }\n);"
