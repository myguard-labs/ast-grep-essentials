id: js-jquery-removed-browser-api
valid:
  - 'if ( $.support.msie ) { run(); }'
  - 'var s = $.browserSupport.msie;'
  - 'var s = window.browser.msie;'
  - 'if ( $.support.opacity ) { run(); }'
invalid:
  - 'if ( $.browser.msie ) { run(); }'
  - 'var v = $.browser.version;'
  - 'if ( $.browser.msie && x ) { run(); }'
  - 'var w = $.browser.webkit;'
