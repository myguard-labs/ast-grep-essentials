id: js-jquery-attr-disabled-boolean
valid:
  - 'this.$el.attr( ''disabled'', ''disabled'' );'
  - "$(x).prop('disabled', flag);"
  - "$(x).attr('disabled');"
  - "$(x).attr('title', model.title);"
  - "$(x).attr('data-disabled', flag);"
invalid:
  - 'this.$el.attr( ''disabled'', model.disabled );'
  - "$(x).attr('disabled', true);"
  - "$(x).attr(\"disabled\", false);"
  - "$(x).attr( 'disabled', !ok );"
  - "$(x).attr('disabled', cond ? 'disabled' : null);"
