id: js-keyup-direct-search-handler-no-debounce
valid:
  - >-
    inputs.search.keyup( function() { window.clearTimeout( t ); t =
    window.setTimeout( run, 500 ); } );
  - 'inputs.search.keyup( debounce( wpLink.searchInternalLinks, 300 ) );'
  - 'inputs.search.on( ''input'', wpLink.searchInternalLinks );'
  - 'inputs.title.keyup( function () { save(); } );'
invalid:
  - 'inputs.search.keyup( wpLink.searchInternalLinks );'
  - 'this.inputs.search.keyup( app.onSearch );'
  - 'panel.search.keyup( ctrl.run );'
  - 'form.search.keyup( a.b.c );'
