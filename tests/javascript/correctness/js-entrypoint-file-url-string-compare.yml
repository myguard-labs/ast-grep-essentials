id: js-entrypoint-file-url-string-compare
valid:
  - 'if (fileURLToPath(import.meta.url) === resolve(process.argv[1])) { main(); }'
  - 'if (import.meta.url === pathToFileURL(process.argv[1]).href) { main(); }'
  - 'if (fileURLToPath(import.meta.url) === process.argv[1]) { main(); }'
  - 'if (import.meta.url === pathToFileURL(realpathSync(process.argv[1])).href) { main(); }'
invalid:
  - 'if (import.meta.url === `file://${process.argv[1]}`) { main(); }'
  - 'const isMain = import.meta.url === `file://${process.argv[1]}`;'
  - 'const run = import.meta.url === `file://${process.argv[1]}` ? main : noop;'
  - 'if (ok && import.meta.url === `file://${process.argv[1]}`) { main(); }'
