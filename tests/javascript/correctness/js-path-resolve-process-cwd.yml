id: js-path-resolve-process-cwd
valid:
  - >-
    import path from 'node:path'; const cfg = path.resolve(import.meta.dirname,
    'package.json')
  - |-
    const cfg = path.resolve(__dirname, 'package.json')
  - |-
    const rel = path.relative(process.cwd(), file)
  - |-
    const name = path.basename(process.cwd())
invalid:
  - >-
    import path from 'node:path'; const cfg = path.resolve(process.cwd(),
    'package.json')
  - |-
    const p = path.join(process.cwd(), 'a', 'b')
  - |-
    const p = fs.readFileSync(path.resolve(process.cwd(), file))
  - |-
    const cfg = require(path.join(process.cwd(), '..', 'config.json'))
