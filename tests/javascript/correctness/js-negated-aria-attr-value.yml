id: js-negated-aria-attr-value
valid:
  - >-
    $this.attr( 'aria-expanded', 'false' === $this.attr( 'aria-expanded' ) ?
    'true' : 'false' );
  - |-
    $this.attr( 'aria-expanded', 'true' );
  - |-
    $this.attr( 'aria-expanded', String( ! expanded ) );
  - |-
    $this.attr( 'aria-hidden', $other.attr( 'aria-hidden' ) );
invalid:
  - '$this.attr( ''aria-expanded'', ! $this.attr( ''aria-expanded'' ) );'
  - |-
    el.attr( 'aria-hidden', ! el.attr( 'aria-hidden' ) );
  - |-
    $( '#menu' ).attr( 'aria-pressed', ! $( '#menu' ).attr( 'aria-pressed' ) );
  - |-
    this.$toggle.attr( 'aria-checked', !this.$toggle.attr( 'aria-checked' ) );
