id: js-keycode-plus-minus-missing-numpad
valid:
  - >-
    if (e.keyCode == 61 || e.keyCode == 107 || e.keyCode == 187)
    api.dfw_width(25);
  - 'if (e.keyCode == 61 || e.keyCode == 107) api.dfw_width(25);'
  - 'if (e.keyCode == 13 || e.keyCode == 187) api.go();'
  - 'if (e.which == 61) api.dfw_width(25);'
invalid:
  - 'if (e.keyCode == 61 || e.keyCode == 187) api.dfw_width(25);'
  - 'if (ev.keyCode == 61 || ev.keyCode == 187) { api.dfw_width(25); }'
  - 'var plus = this.keyCode == 61 || this.keyCode == 187;'
  - 'handler = function (event) { return event.keyCode == 61 || event.keyCode == 187; };'
