id: js-jquery-attr-boolean-disabled
valid:
  - '$( ''input[type="submit"]'' ).prop( ''disabled'', true );'
  - "$(x).attr('disabled');"
  - "$(x).attr('title', 'disabled');"
  - "$(x).removeAttr('disabled');"
invalid:
  - '$( ''input[type="submit"]'' ).attr( ''disabled'', ''disabled'' );'
  - "$(x).attr('disabled', '');"
  - "$(a).find('b').attr('disabled','true');"
