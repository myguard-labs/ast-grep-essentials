id: js-mixed-logical-operators-no-parens
valid:
  - 'var ok = a || (b && c);'
  - 'var ok = ( a || b ) && c;'
  - 'var ok = a || b || c;'
  - 'var ok = a && b && c;'
invalid:
  - 'var ok = a || b && c;'
  - 'if ( a || b && c ) { run(); }'
  - 'function f() { return a || b && c; }'
  - 'var ok = a || b && c && d;'
