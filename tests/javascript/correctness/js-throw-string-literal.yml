id: js-throw-string-literal
valid:
  - 'function fail(err) { throw err }'
  - 'function fail() { throw (''parenthesized string'') }'
  - |-
    function fail() { throw new Error('plain') }
invalid:
  - 'function fail() { throw ''this is a string error'' }'
  - |-
    throw "bad value";
  - |-
    const f = () => { throw 'nope'; };
