id: js-getattribute-extra-argument
valid:
  - 'el.getAttribute(''onclick'');'
  - "el?.getAttribute('data-x');"
  - "const v = el.getAttribute(name);"
  - "node.firstChild.getAttribute(\"id\");"
invalid:
  - 'el.getAttribute(''onclick'', 2);'
  - "el.getAttribute('a', 1, 2);"
  - "document.getElementById('x').getAttribute('a', null);"
  - "const v = a.b.getAttribute(name, fallback);"
