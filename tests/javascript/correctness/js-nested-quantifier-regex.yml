id: js-nested-quantifier-regex
valid:
  - 'const re = /^(?:\s|x)*$/'
  - |-
    const re = /^(?:\s|x)+$/
  - |-
    const re = /^(\d+)$/
  - |-
    const re = /(\+)+/
invalid:
  - 'const re = /^(?:\s+|x)*$/'
  - |-
    const re = /^(\d+)+$/
  - |-
    const re = /(a*)*b/
  - |-
    const re = /^(?:a|b*)+c/i
