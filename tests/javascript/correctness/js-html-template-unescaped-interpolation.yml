id: js-html-template-unescaped-interpolation
valid:
  - 'const s = `<title>${encodeHtml(t)}</title>`;'
  - "const s = `Hello ${name}`;"
  - "const s = `<p>static text</p>`;"
  - "const s = `<li>${escapeHtml(item.name)}</li>`;"
invalid:
  - 'const s = `<title>${t}</title>`;'
  - "const s = `<a href=\"${url}\">x</a>`;"
  - "const s = `<li>${item.name}</li>`;"
  - "const s = `<div>${ x }</div>`;"
  - "const s = `<td>${row.cells.name}</td>`;"
