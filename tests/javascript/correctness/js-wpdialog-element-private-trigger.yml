id: js-wpdialog-element-private-trigger
valid:
  - 'this._trigger(''refresh'');'
  - |-
    this.element.trigger('focus');
  - |-
    that._trigger('focus', event, data);
  - |-
    this.element.on('focus', handler);
invalid:
  - 'this.element._trigger(''focus'');'
  - |-
    this.element._trigger('focus', event, data);
  - |-
    var r = this.element._trigger('close');
