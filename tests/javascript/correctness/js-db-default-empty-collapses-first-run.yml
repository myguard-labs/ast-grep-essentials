    const seenIds = this.db.get("seenIds");
    const firstRun = seenIds === undefined;
  - "const seenIds = this.db.get('seenIds') ?? null;\nconst firstRun = seenIds === null;"
  - "const seenIds = this.db.get('seenIds');\nif (seenIds === undefined) { this.db.set('seenIds', []); }"
