id: js-typeof-wraps-comparison
valid:
  - 'if ( typeof( window.heartbeatSettings ) != ''undefined'' ) { run(); }'
  - |-
    if (typeof x !== 'undefined') { run(); }
  - |-
    var t = typeof (a == b ? 1 : 2);
invalid:
  - 'if ( typeof( window.heartbeatSettings != ''undefined'' ) ) { run(); }'
  - var t = typeof (a != b);
  - |-
    if (typeof(x.y != null)) { run(); }
