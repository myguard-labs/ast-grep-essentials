id: js-regex-plus-empty-block-body
valid:
  - 'text.replace( /<(pre|script)[^>]*>[\s\S]*?<\/\1>/g, fn );'
  - |-
    text.replace( /<(pre|script)[^>]*>[\s\S]*?<\/\1>/gi, fn );
  - |-
    text.replace( /<(pre|script)>[\s\S]*<\/\1>/g, fn );
  - |-
    text.replace( /<(pre|script)[^>]*>[^<]*<\/\1>/g, fn );
invalid:
  - 'text.replace( /<(pre|script)[^>]*>[\s\S]+?<\/\1>/g, fn );'
  - |-
    text.replace( /<(pre|script)[^>]*>[\s\S]+?<\/\1>/gi, fn );
  - |-
    text.replace( /<(pre|script)>[\s\S]+?<\/\1>/g, fn );
  - |-
    const m = html.match( /<(pre|script)[^>]*>[\s\S]+?<\/\1>/s );
