id: js-run-plain-error-for-input
valid:
  - |-
    async run({ $ }) {
      if (typeof this.domain !== "string") {
        throw new ConfigurationError("Domain must be a valid JSON array.");
      }
      return {};
    }
  - |-
    async run({ $ }) {
      throw new TypeError("Domain must be a string.");
    }
  - |-
    async run({ $ }) {
      try { await go(); } catch (err) { throw err; }
    }
  - |-
    async run({ $ }) {
      if (!this.id) {
        throw new ConfigurationError(`Missing id`);
      }
    }
invalid:
  - |-
    async run({ $ }) {
      if (typeof this.domain !== "string") {
        throw new Error("Domain must be a valid JSON array.");
      }
      return {};
    }
  - |-
    async run({ $ }) {
      throw new Error();
    }
  - |-
    async run({ $ }) {
      throw new Error(`Invalid domain ${this.domain}`);
    }
  - |-
    const fail = () => { throw new Error("bad", { cause: err }); };
