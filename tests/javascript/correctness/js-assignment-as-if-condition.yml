id: js-assignment-as-if-condition
valid:
  - 'if (PHP_VCI == "yes") {}'
  - "if (a === b) {}"
  - "if ((m = re.exec(s))) { use(m); }"
  - "if (PHP_VCI != 'yes') {}"
invalid:
  - 'if (PHP_VCI = "yes") {}'
  - "if (match = re.exec(str)) { use(match); }"
  - "if (a = b) x(); else y();"
  - "if (ok) {} else if (node = node.parent) {}"
