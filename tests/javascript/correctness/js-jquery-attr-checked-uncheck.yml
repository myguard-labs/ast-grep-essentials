id: js-jquery-attr-checked-uncheck
valid:
  - 'el.find('':checkbox'').prop(''checked'', false);'
  - "el.attr('checked');"
  - "el.attr('data-checked', x);"
  - "el.prop('checked', true);"
invalid:
  - 'el.find('':checkbox'').attr(''checked'', '''');'
  - "el.attr('checked', 'checked');"
  - "el.attr('checked', null);"
  - "el.attr('checked', isOn);"
