id: js-empty-negated-char-class-regex
valid:
  - 'var re = /a[^\]]b/;'
  - 'var re = /[^a]/;'
  - 'var re = /[\^]/;'
  - 'var re = /[^\s]+/g;'
  - 'var re = /[a^]/;'
invalid:
  - 'var re = /a[^]b/;'
  - 'var re = /[^]/g;'
  - 'var re = /x[^]*y/s;'
  - 'var re = /(?:[^])+/u;'
  - 'var re = /a[^]b/i;'
