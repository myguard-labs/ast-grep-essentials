id: js-run-plain-error-for-input
valid:
  - |-
    async run({ $ }) {
      if (typeof this.domain !== "string") {
        throw new ConfigurationError("Domain must be a valid JSON array.");
      }
      return {};
    }
invalid:
  - |-
    async run({ $ }) {
      if (typeof this.domain !== "string") {
        throw new Error("Domain must be a valid JSON array.");
      }
      return {};
    }
