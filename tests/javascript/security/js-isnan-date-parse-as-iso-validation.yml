id: js-isnan-date-parse-as-iso-validation
valid:
  - >-
    if (!ISO_REGEX.test(this.startAt)) { throw new ConfigurationError("Start At
    is not a valid ISO 8601 date."); }
invalid:
  - >-
    if (isNaN(new Date(this.startAt).getTime())) { throw new
    ConfigurationError("Start At is not a valid ISO 8601 date."); }
