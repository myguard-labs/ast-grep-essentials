id: js-at-least-one-truthy-guard
valid:
  - >-
    async run({ $ }) { if (this.percentile === undefined &&
    this.funnelAggregation === undefined) { throw new ConfigurationError('need
    one'); } }
invalid:
  - >-
    async run({ $ }) { if (!this.percentile && !this.funnelAggregation) { throw
    new ConfigurationError('need one'); } }
