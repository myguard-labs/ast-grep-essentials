id: js-express-open-redirect
valid:
  - 'res.redirect("/dashboard");'
  - 'res.redirect(302, "/dashboard");'
  - 'res.redirect(allowlist[req.query.next]);'
  - 'res.render(req.query.next);'
  - 'res.redirect(next);'
  - 'const text = "res.redirect(req.query.next)";'
  - '// res.redirect(req.query.next);'
invalid:
  - 'res.redirect(req.query.next);'
  - 'res.redirect(302, `${req.query.returnTo}`);'
  - 'res.redirect(request.body.target);'
  - 'res.redirect(`${req.params.slug}/done`);'
