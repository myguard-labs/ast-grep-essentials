id: js-express-reflected-response
valid:
  - 'res.json({ name: req.query.name });'
  - 'res.send("<h1>Hello</h1>");'
  - 'res.send(name);'
  - 'res.send(`Hello ${name}`);'
  - 'res.send("Hello " + name);'
  - 'res.sendFile(req.params.id);'
  - 'const text = "res.send(`x ${req.query.q}`)";'
  - '// res.send("x" + req.query.q);'
invalid:
  - 'res.send(`Not found: ${req.params.id}`);'
  - 'res.send("<h1>Hello " + req.query.name + "</h1>");'
  - 'res.write(`<p>${req.body.comment}</p>`);'
  - 'res.end("id=" + req.headers.referer);'
