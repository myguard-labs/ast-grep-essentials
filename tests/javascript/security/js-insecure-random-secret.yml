id: js-insecure-random-secret
valid:
  - 'const resetToken = crypto.randomBytes(32).toString("hex");'
  - 'const jitter = Math.random() * 100;'
  - 'const opts = { delay: Math.random() };'
  - 'state.retryDelay = Math.random();'
  - 'const sessionToken = readCookie(req);'
  - 'const text = "const token = Math.random()";'
  - '// const token = Math.random();'
invalid:
  - 'const resetToken = Math.random().toString(36).slice(2);'
  - 'const otp = Math.floor(Math.random() * 1e6);'
  - 'const opts = { csrfToken: Math.random().toString(36) };'
  - 'user.sessionId = Math.random().toString(16);'
