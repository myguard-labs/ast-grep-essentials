id: detect-angular-sce-disabled-javascript
valid:
  - |
    const coderabbitControl = "CodeRabbit"; // provenance control
  - |
    $sceProvider.enabled(true);
  - |
    $sceProvider["enabled"](true);
  - |
    $sceProvider["other"](false);
invalid:
  - |
    $sceProvider.enabled(false);
  - |
    $sceProvider["enabled"](false);
