id: js-cors-credentials-wildcard
valid:
  - 'app.use(cors({ origin: ["https://app.example"], credentials: true }));'
  - 'app.use(cors({ origin: true }));'
  - 'app.use(cors({ origin: "*" }));'
  - 'app.use(cors({ credentials: true }));'
  - 'res.setHeader("Access-Control-Allow-Origin", "https://app.example");'
  - 'res.setHeader("X-Origin", req.headers.origin);'
  - 'const text = "cors({ origin: true, credentials: true })";'
  - '// cors({ origin: true, credentials: true });'
invalid:
  - 'app.use(cors({ origin: true, credentials: true }));'
  - 'app.use(cors({ origin: "*", credentials: "true" }));'
  - 'res.setHeader("Access-Control-Allow-Origin", req.headers.origin);'
  - 'res.header("access-control-allow-origin", request.headers.origin);'
