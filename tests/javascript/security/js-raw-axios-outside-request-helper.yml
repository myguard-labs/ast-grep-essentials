id: js-raw-axios-outside-request-helper
valid:
  - |-
    export default {
      methods: {
        async _makeRequest($, id) {
          return axios($, { url: `https://api.example.com/v1/${id}` });
        },
      },
    };
invalid:
  - |-
    export default {
      methods: {
        async getResult($, id) {
          return axios($, { url: `https://api.example.com/v1/${id}` });
        },
      },
    };
