id: js-dynamic-code-execution
valid:
  - 'const value = JSON.parse(text);'
  - 'object.eval(code);'
  - 'evaluate(code);'
  - 'eval();'
  - 'new Function();'
  - 'eval(/* no source */);'
  - "eval(// no source\n);"
  - 'new Function(/* no source */);'
  - 'Function(/* no source */);'
  - 'const text = "eval(code)";'
  - '// eval(code);'
invalid:
  - 'eval(code);'
  - 'eval("1 + 1");'
  - 'new Function(source);'
  - 'Function(source);'
  - 'const fn = new Function("a", "return a + 1");'
