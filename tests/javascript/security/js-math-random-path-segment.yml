id: js-math-random-path-segment
valid:
  - 'const gen = `${dir}/fs_test_${unique++}`;'
  - "const p = `${dir}/fs_${crypto.randomUUID()}`;"
  - "const p = `${dir}/${crypto.randomBytes(8).toString('hex')}`;"
  - "const label = `item_${Math.random()}`;"
  - "const p = `${dir}/fs_${counter++}`;"
invalid:
  - 'const gen = `${dir}/fs_test_${Math.round(Math.random() * 1000000)}`;'
  - "const p = `/tmp/upload_${Math.random()}`;"
  - "const name = `${dir}/${Math.random().toString(36).slice(2)}.tmp`;"
  - "const f = `/var/tmp/${prefix}-${Date.now()}-${Math.floor(Math.random() * 1e9)}`;"
