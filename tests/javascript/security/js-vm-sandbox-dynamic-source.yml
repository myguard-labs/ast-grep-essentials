id: js-vm-sandbox-dynamic-source
valid:
  - 'vm.runInNewContext("1 + 1");'
  - 'vm.runInThisContext(`return 1;`);'
  - 'const s = new vm.Script("1 + 1");'
  - 'const v = new VM({ timeout: 100 });'
  - 'runner.runInNewContext(code);'
  - 'isolate.compileScript(userScript);'
  - 'new VM({ timeout: 100 }).run("1 + 1");'
  - 'const text = "vm.runInNewContext(code)";'
  - '// vm.runInNewContext(code);'
invalid:
  - 'vm.runInNewContext(req.body.code, { console });'
  - 'vm.runInThisContext(source);'
  - 'vm.runInContext(source, ctx);'
  - 'vm.compileFunction(body, ["a"]);'
  - 'const s = new vm.Script(source);'
  - 'const v = new VM(userScript);'
  - 'new VM({ timeout: 100 }).run(userScript);'
  - 'new NodeVM({}).run(userScript, "vm.js");'
