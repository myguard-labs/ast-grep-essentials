id: js-express-static-dotfiles
valid:
  - 'app.use(express.static("public"));'
  - 'app.use(express.static("public", { dotfiles: "deny" }));'
  - 'app.use(express.static("public", { dotfiles: "ignore", index: false }));'
  - 'const opts = { dotfiles: "allow" };'
  - 'configure({ index: true });'
  - 'const text = "express.static(dir, { dotfiles: \"allow\" })";'
  - '// express.static(dir, { dotfiles: "allow" });'
invalid:
  - 'app.use(express.static("public", { dotfiles: "allow" }));'
  - 'app.use(serveStatic("public", { index: true }));'
