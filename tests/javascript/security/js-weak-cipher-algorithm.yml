id: js-weak-cipher-algorithm
valid:
  - 'crypto.createCipheriv("aes-256-gcm", key, iv);'
  - 'crypto.createDecipheriv("aes-256-cbc", key, iv);'
  - 'crypto.createCipheriv(algorithm, key, iv);'
  - 'makeCipher("des");'
  - 'crypto.createHash("md5");'
  - 'const text = "crypto.createCipher(\"aes\", secret)";'
  - '// crypto.createCipher("aes", secret);'
invalid:
  - 'crypto.createCipher("aes-256-cbc", secret);'
  - 'createDecipher("aes-256-cbc", secret);'
  - 'crypto.createCipheriv("aes-128-ecb", key, null);'
  - 'crypto.createDecipheriv("des-ede3-cbc", key, iv);'
  - 'createCipheriv("rc4", key, iv);'
