id: js-svg-extension-only-sanitize
valid:
  - |-
    if (req.file.ext === '.svg' || req.file.type === 'image/svg+xml') {
      await sanitizeSvg(req.file.path, false)
    }
invalid:
  - |-
    if (req.file.ext === '.svg' || req.file.ext === '.svgz') {
      await sanitizeSvg(req.file.path, false)
    }
