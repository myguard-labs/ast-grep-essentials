id: js-svg-extension-only-sanitize
valid:
  - |-
    if (req.file.ext === '.svg' || req.file.type === 'image/svg+xml') {
      await sanitizeSvg(req.file.path, false)
    }
  - |-
    if (req.file.ext === '.svg' && req.file.type === 'image/svg+xml') { await sanitizeSvg(req.file.path, false) }
  - |-
    if (req.file.type === 'image/svg+xml') { await sanitizeSvg(req.file.path, false) }
  - |-
    if (req.file.ext === '.png') { await storeRaster(req.file.path) }
  - |-
    if (req.file.ext === '.svg') { if (req.file.type !== 'image/svg+xml') { reject() } }
invalid:
  - |-
    if (req.file.ext === '.svg' || req.file.ext === '.svgz') {
      await sanitizeSvg(req.file.path, false)
    }
  - |-
    if (req.file.ext === '.svg') { await sanitizeSvg(req.file.path, false) }
  - |-
    if (/* svg only */ req.file.ext === '.svg') { await sanitizeSvg(req.file.path, false) } else { await store(req.file.path) }
  - |-
    if ((req.file.ext === '.svg')) { await sanitizeSvg(req.file.path, false) }
  - |-
    if (req.file.ext === '.svgz' || req.file.ext === '.svg') { await sanitizeSvg(req.file.path, false) }
  - |-
    if (ok) { await a() } else if (req.file.ext === '.svg') { await sanitizeSvg(req.file.path, false) }
