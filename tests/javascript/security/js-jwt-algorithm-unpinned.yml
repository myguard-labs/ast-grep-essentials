id: js-jwt-algorithm-unpinned
valid:
  - 'jwt.verify(token, pubKey, { algorithms: ["RS256"] });'
  - 'jwt.verify(token, pubKey, { algorithms: ["ES256", "RS256"], issuer: iss });'
  - 'verifier.verify(token, pubKey);'
  - 'jwt.sign(payload, key);'
  - 'const opts = { algorithm: "none" };'
  - 'const text = "jwt.verify(token, key)";'
  - '// jwt.verify(token, key);'
invalid:
  - 'jwt.verify(token, pubKey);'
  - 'jsonwebtoken.verify(token, secret, { issuer: "app" });'
  - 'const opts = { algorithms: ["RS256", "none"] };'
  - 'const opts = { algorithms: ["NONE"] };'
