id: js-number-isnan-only-id-validation
valid:
  - |-
    const numericRowId = Number(rowId);
    if (!Number.isInteger(numericRowId) || numericRowId <= 0) {
      throw new ConfigurationError("invalid rowId");
    }
invalid:
  - |-
    const numericRowId = Number(rowId);
    if (!rowId || Number.isNaN(numericRowId)) {
      throw new ConfigurationError("invalid rowId");
    }
