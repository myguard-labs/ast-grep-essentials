id: js-number-isnan-only-id-validation
valid:
  - |-
    const numericRowId = Number(rowId);
    if (!Number.isInteger(numericRowId) || numericRowId <= 0) {
      throw new ConfigurationError("invalid rowId");
    }
  - |-
    const n = Number(rowId);
    if (Number.isNaN(n) || !Number.isInteger(n) || n <= 0) { throw new Error("invalid"); }
  - |-
    const n = Number(rowId);
    if (Number.isInteger(n) && n > 0) { use(n); }
invalid:
  - |-
    const numericRowId = Number(rowId);
    if (!rowId || Number.isNaN(numericRowId)) {
      throw new ConfigurationError("invalid rowId");
    }
  - 'if (Number.isNaN(n)) throw new Error("invalid");'
  - 'if (Number.isNaN(n) || n <= 0) { throw new Error("invalid"); }'
  - 'if (Number.isNaN(Number(rowId))) { throw new Error("invalid"); }'
