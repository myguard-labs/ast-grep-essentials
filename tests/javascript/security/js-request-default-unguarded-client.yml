id: js-request-default-unguarded-client
valid:
  - 'this.request = request ?? require(''./request-external'');'
  - 'this.request = request ?? require(''../request-external'');'
  - 'this.request = request ?? guardedRequest;'
invalid:
  - 'this.request = request ?? require(''@tryghost/request'');'
  - 'const client = opts.request ?? require(''got'');'
  - 'this.http = options?.request ?? require(''axios'');'
