id: js-regex-double-dotstar-backtracking
valid:
  - 'const ok = /.*T[+-]\d\d$/.test(value);'
  - "const ok = /a.*b/.test(line);"
  - "const ok = /^[^,]*,[^,]*$/.test(row);"
  - "const ok = /^\\d+$/.test(value);"
  - "const ok = /^.*suffix$/.test(value);"
invalid:
  - 'const ok = /.*T.*[+-]\d\d$/.test(value);'
  - "if (/.*foo.*/.test(input)) { reject() }"
  - "const ok = /^.*a.*b$/.test(line);"
  - "const ok = /(.*),(.*),(.*)/.test(row);"
