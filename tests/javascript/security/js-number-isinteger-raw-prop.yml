id: js-number-isinteger-raw-prop
valid:
  - |-
    const maxResults = Number(this.maxResults);
    if (!Number.isInteger(maxResults)) {
      throw new Error("bad");
    }
invalid:
  - |-
    const maxResults = this.maxResults;
    if (!Number.isInteger(maxResults)) {
      throw new Error("bad");
    }
