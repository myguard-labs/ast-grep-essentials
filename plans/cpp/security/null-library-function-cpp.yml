version: 1
id: null-library-function-cpp
language: cpp
category: security
severity: warning
comments:
  - 'MyGuard rule: https://github.com/myguard-labs/ast-grep-essentials | https://deb.myguard.nl'
  - 'CodeRabbit source repository: https://github.com/coderabbitai/ast-grep-essentials'
  - 'CodeRabbit source file: https://github.com/coderabbitai/ast-grep-essentials/blob/73120109bf45c284d0cd8a37bdd7082e80e92e87/rules/cpp/security/null-library-function-cpp.yml'
  - 'Original author (Git): ESS-ENN'
  - 'License: Apache License 2.0 (https://www.apache.org/licenses/LICENSE-2.0)'
  - 'Modified by MyGuard: provenance metadata preserved; Refine outcome records field-aware function matching, literal diagnostics, and defended matcher paths.'
extensions:
  ast-grep-essentials: true
mutation_exclusions:
  constraints.OPERAND.any[1].has.field: 'A valid C++ assignment cannot place a null-returning call on the non-assignable left side; the field selector documents that only the assigned right value is consumed.'
  rule.all[1].any[0].has.field: 'The field selector documents the subscript operand; the C++ contrast has only one direct call child.'
  rule.all[1].any[1].has.field: 'The field selector documents the member object; the C++ contrast has only one direct call child.'
  rule.all[1].any[2].has.field: 'The field selector documents the unary operand; the C++ contrast has only one direct call child.'
  rule.all[1].any[3].all[1].has.field: 'A call has one direct callee child; the field selector documents that the fprintf contract applies to the callee.'
  rule.all[1].any[4].all[1].has.field: 'A call has one direct callee child; the field selector documents that the variadic fprintf contract applies to the callee.'
  rule.all[1].any[5].all[1].has.field: 'A call has one direct callee child; the field selector documents that the fwrite contract applies to the callee.'
  rule.all[1].any[6].all[1].has.field: 'A call has one direct callee child; the field selector documents that the exact second-position contract applies to the callee.'
  rule.all[1].any[7].all[1].has.field: 'A call has one direct callee child; the field selector documents that the variadic second-position contract applies to the callee.'
  rule.all[1].any[8].all[1].has.field: 'A call has one direct callee child; the field selector documents that the exact first-position contract applies to the callee.'
  rule.all[1].any[9].all[1].has.field: 'A call has one direct callee child; the field selector documents that the variadic first-position contract applies to the callee.'
  utils.null-return-call.has.field: 'A call has one direct callee child; the field selector prevents arguments from becoming function names.'
  utils.null-return-paren-one.has.stopBy: 'Neighbor is the engine default here; spelling it pins the transparent single-wrapper boundary.'
  utils.null-return-paren-two.has.stopBy: 'Neighbor is the engine default here; spelling it pins the transparent double-wrapper boundary.'
  utils.percent-s-format.any[1].has.stopBy: 'Neighbor is the engine default here; spelling it pins the transparent single-wrapper format boundary.'
  utils.percent-s-format.any[2].has.stopBy: 'Neighbor is the engine default here; spelling it pins the transparent double-wrapper format boundary.'
  utils.percent-s-format.any[2].has.has.stopBy: 'Neighbor is the engine default here; spelling it pins the nested transparent format boundary.'
  utils.percent-s-literal.any[0].kind: 'The leading ordinary quote already excludes raw literals, while the identical concatenated arm intentionally accepts the same first ordinary segment; the kind records the direct-literal CST contract without changing results.'
  utils.percent-s-literal.any[0].regex-anchor: 'A direct ordinary string-literal node starts at its only opening quote, and the matcher does not cross another quote; the anchor documents that inherent node boundary.'
  utils.percent-s-literal.any[1].kind: 'The anchored R-string prefix already excludes ordinary and concatenated literal nodes; the kind documents the intended raw-string CST contract.'
  utils.percent-s-literal.any[1].regex-anchor: 'A raw-string literal contains its R-string introducer only at the node start, so the literal prefix already supplies the same boundary; the explicit anchor documents it.'
  utils.percent-s-literal.any[2].kind: 'The first ordinary-segment regex is shared with the direct-literal arm, so deleting this kind only makes that arm duplicate the intended concatenated match; the kind records the CST contract.'
  utils.percent-s-literal.any[3].kind: 'The embedded ordinary quote boundary cannot occur in a direct string-literal node, so the regex already confines this arm to concatenated literals; the kind records that CST contract.'
message: >-
  A library function that may return NULL is dereferenced or passed directly
  to a library function that requires a valid pointer, without a NULL check.
note: >-
  [CWE-476] NULL Pointer Dereference.
  [REFERENCES]
      - https://wiki.sei.cmu.edu/confluence/display/c/EXP34-C.+Do+not+dereference+null+pointers
rule:
  all:
    - not:
        inside:
          stopBy: end
          kind: ERROR
    - any:
        - kind: subscript_expression
          has:
            field: argument
            matches: null-return-operand
        - kind: field_expression
          has:
            field: argument
            matches: null-return-operand
        - kind: pointer_expression
          has:
            field: argument
            matches: null-return-operand
        - all:
            - pattern:
                context: void f() { $FPRINTF_ONLY($_, $FORMAT, $OPERAND); }
                selector: call_expression
            - has:
                field: function
                regex: '^\(*\s*(?:(?:std\s*)?::\s*)?fprintf\s*\)*$'
        - all:
            - pattern:
                context: void f() { $FPRINTF_REST($_, $FORMAT, $OPERAND, $$$REST); }
                selector: call_expression
            - has:
                field: function
                regex: '^\(*\s*(?:(?:std\s*)?::\s*)?fprintf\s*\)*$'
        - all:
            - pattern:
                context: void f() { $FWRITE($_, $_, $_, $OPERAND); }
                selector: call_expression
            - has:
                field: function
                regex: '^\(*\s*(?:(?:std\s*)?::\s*)?fwrite\s*\)*$'
        - all:
            - pattern:
                context: void f() { $SECOND_ONLY($_, $OPERAND); }
                selector: call_expression
            - has:
                field: function
                regex: '^\(*\s*(?:(?:std\s*)?::\s*)?(?:fprintf|bcopy|memccpy|memcpy|memmove|stpncpy|strcat|strcpy|strlcat|strlcpy|strncat|stpcpy|wcpcpy|wcpncpy)\s*\)*$'
        - all:
            - pattern:
                context: void f() { $SECOND_REST($_, $OPERAND, $$$REST); }
                selector: call_expression
            - has:
                field: function
                regex: '^\(*\s*(?:(?:std\s*)?::\s*)?(?:bcopy|memccpy|memcpy|memmove|stpncpy|strcat|strcpy|strlcat|strlcpy|strncat|stpcpy|wcpcpy|wcpncpy)\s*\)*$'
        - all:
            - pattern:
                context: void f() { $FIRST_ONLY($OPERAND); }
                selector: call_expression
            - has:
                field: function
                regex: '^\(*\s*(?:(?:std\s*)?::\s*)?(?:atof|atoi|atol_l|atol|atoll_l|atoll|getc|fprintf|fgetpos|fseek|fseeko|fsetpos|ftell|ftello|rewind|strlen|strtoimax|strtod|strtol|strtoul|strtoll|strtoq|bcopy|memccpy|memcpy|memmove|stpncpy|strcat|strcpy|strlcat|strlcpy|strncat|stpcpy|wcpcpy|wcpncpy|fwrite)\s*\)*$'
        - all:
            - pattern:
                context: void f() { $FIRST_REST($OPERAND, $$$REST); }
                selector: call_expression
            - has:
                field: function
                regex: '^\(*\s*(?:(?:std\s*)?::\s*)?(?:atof|atoi|atol_l|atol|atoll_l|atoll|getc|fgetpos|fseek|fseeko|fsetpos|ftell|ftello|rewind|strlen|strtoimax|strtod|strtol|strtoul|strtoll|strtoq|fwrite)\s*\)*$'
constraints:
  FORMAT:
    matches: percent-s-format
  OPERAND:
    any:
      - matches: null-return-operand
      - kind: assignment_expression
        has:
          field: right
          matches: null-return-operand
labels:
  OPERAND:
    style: secondary
utils:
  null-return-call:
    kind: call_expression
    has:
      field: function
      regex: '^\(*\s*(?:(?:::\s*|std\s*::\s*)?(?:fgets|fopen|getenv|getgrent|getgrgid|getgrnam|getlogin|getpwent|getpwnam|getpwuid|getpwuuid|gets|inet_ntop|realpath|tempnam|tmpfile|tmpnam|memchr|strcasestr_l|strcasestr|strchr|strnstr|strpbrk|strrchr|strstr|strtok_r|strtok))\s*\)*$'
  null-return-paren-one:
    kind: parenthesized_expression
    has:
      stopBy: neighbor
      matches: null-return-call
  null-return-paren-two:
    kind: parenthesized_expression
    has:
      stopBy: neighbor
      matches: null-return-paren-one
  null-return-operand:
    any:
      - matches: null-return-call
      - matches: null-return-paren-one
      - matches: null-return-paren-two
  percent-s-format:
    any:
      - matches: percent-s-literal
      - kind: parenthesized_expression
        has:
          stopBy: neighbor
          matches: percent-s-literal
      - kind: parenthesized_expression
        has:
          stopBy: neighbor
          kind: parenthesized_expression
          has:
            stopBy: neighbor
            matches: percent-s-literal
  percent-s-literal:
    any:
      - kind: string_literal
        regex: '^"(?:[^%"\\]|%%)*%(?:[0-9]+)?(?:\.[0-9]+)?s'
      - kind: raw_string_literal
        regex: '^R"[^()\\\s]{0,16}\((?:[^%)]|%%)*%(?:[0-9]+)?(?:\.[0-9]+)?s'
      - kind: concatenated_string
        regex: '^"(?:[^%"\\]|%%)*%(?:[0-9]+)?(?:\.[0-9]+)?s'
      - kind: concatenated_string
        regex: '^"(?:[^%"\\]|%%)*%"\s*"s'
