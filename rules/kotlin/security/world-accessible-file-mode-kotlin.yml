# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: world-accessible-file-mode-kotlin
language: kotlin
severity: warning
message: >-
  MODE_WORLD_READABLE and MODE_WORLD_WRITEABLE make a file readable or writable
  by every app on the device. Both are removed or throw on current Android
  versions. Use the private mode and share data through a FileProvider or a
  content provider with explicit permissions.
note: >-
  Matches any reference to the Context constants MODE_WORLD_READABLE or
  MODE_WORLD_WRITEABLE, qualified or bare. Whether the value reaches a file or
  preferences API is not resolved.
rule:
  kind: simple_identifier
  regex: '^MODE_WORLD_(READABLE|WRITEABLE)$'
  not:
    inside: {kind: import_header, stopBy: end}
metadata:
  rule_modified_at: '2026-11-16'
  ast_grep_tested_version: 0.45.2
  validated_at: '2026-11-16'
  created_at: '2026-11-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-276'
  owasp: 'A01:2025|A01:2021'
  category: 'security'
  subcategory: 'file-permissions'
  references: 'https://developer.android.com/reference/android/content/Context#MODE_WORLD_READABLE'
