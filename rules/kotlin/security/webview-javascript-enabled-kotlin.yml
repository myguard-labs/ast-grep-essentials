id: webview-javascript-enabled-kotlin
language: kotlin
severity: warning
message: >-
  JavaScript is enabled on a WebView. Any script the page loads then runs
  inside the app, so XSS or a hostile page can reach app data and bridges.
  Enable it only for content you control, and keep the allowed origins narrow.
note: >-
  Matches the assignment settings.javaScriptEnabled = true, the bare
  javaScriptEnabled = true used inside settings.apply, and the call
  setJavaScriptEnabled(true). The receiver type is not resolved, and a WebView
  that only loads trusted bundled pages still matches.
rule:
  any:
    - kind: assignment
      all:
        - has:
            kind: directly_assignable_expression
            regex: '(^|\.|\?\.)javaScriptEnabled$'
        - has:
            kind: boolean_literal
            regex: '^true$'
    - pattern: $S.setJavaScriptEnabled(true)
