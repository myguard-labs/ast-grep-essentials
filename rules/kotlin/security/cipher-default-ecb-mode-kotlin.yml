# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: cipher-default-ecb-mode-kotlin
language: kotlin
severity: warning
message: >-
  This Cipher transformation uses ECB, either implicitly (a bare algorithm name
  such as "AES" falls back to ECB with PKCS5 padding) or explicitly. ECB leaks
  plaintext patterns and gives no integrity. Use an authenticated mode such as
  "AES/GCM/NoPadding".
note: >-
  Matches Cipher.getInstance with a literal block-cipher name that has no mode,
  or the same name with an explicit ECB mode, including an ECB padding built
  with a string template or a concatenation, a comment before the argument and a
  named argument. Receivers other than Cipher or javax.crypto.Cipher are not
  resolved. Known misses: a bare algorithm name concatenated with a variable
  ("AES" + mode) and a transformation held in a variable or built entirely
  from templates.
rule:
  kind: call_expression
  all:
    - has:
        kind: navigation_expression
        regex: '^(javax\.crypto\.)?Cipher\.getInstance$'
    - has:
        kind: call_suffix
        has:
          kind: value_arguments
          has:
            kind: value_argument
            nthChild: {position: 1, ofRule: {kind: value_argument}}
            has:
              any:
                - kind: string_literal
                  regex: '(?s)^"(AES|AES_128|AES_192|AES_256|DES|DESede|TripleDES|Blowfish|RC2|Camellia|SEED|ARIA)(/ECB/.*)?"$'
                - kind: additive_expression
                  regex: '(?s)^"(AES|AES_128|AES_192|AES_256|DES|DESede|TripleDES|Blowfish|RC2|Camellia|SEED|ARIA)"\s*\+\s*"/ECB/[^"]*"|^"(AES|AES_128|AES_192|AES_256|DES|DESede|TripleDES|Blowfish|RC2|Camellia|SEED|ARIA)/ECB/[^"]*"\s*\+'
