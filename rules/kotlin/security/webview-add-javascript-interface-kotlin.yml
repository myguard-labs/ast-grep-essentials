id: webview-add-javascript-interface-kotlin
language: kotlin
severity: warning
message: >-
  addJavascriptInterface exposes a Kotlin object to every script in the page.
  A page that is attacker-influenced, or any injected script, can call its
  @JavascriptInterface methods. Expose only what the page needs, load trusted
  origins only, and prefer WebMessagePort or WebViewCompat message listeners.
note: >-
  Matches any addJavascriptInterface call with at least one argument. The
  call can be a safe call (?.), a non-null-asserted call, or a bare call inside
  a scope function such as apply. The receiver type is not resolved, and
  content the app fully controls still matches.

  [CWE-749] [A05:2025] [A03:2021]

  [REFERENCES]
      - https://developer.android.com/reference/android/webkit/WebView#addJavascriptInterface(java.lang.Object,%20java.lang.String)
rule:
  kind: call_expression
  all:
    - has:
        any:
          - kind: simple_identifier
            regex: '^addJavascriptInterface$'
          - kind: navigation_expression
            has:
              kind: navigation_suffix
              has: {kind: simple_identifier, regex: '^addJavascriptInterface$'}
    - has:
        kind: call_suffix
        has:
          kind: value_arguments
          has: {kind: value_argument}
