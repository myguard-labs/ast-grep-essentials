# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: runtime-exec-dynamic-command-kotlin
language: kotlin
severity: warning
message: >-
  Runtime.getRuntime().exec receives a command built from a string template or
  a concatenation. If any part comes from user, network or intent data, the
  caller controls the command that runs. Pass a fixed program with a separate
  argument array, and validate each argument against an allow-list.
note: >-
  Matches Runtime.getRuntime().exec whose first argument is a string template
  with an interpolation or an additive expression, however long the chain, that mixes a string literal with a non-literal operand.
  A bare variable is not matched because it can be a String or a String array.
  Runtime may be written java.lang.Runtime. A Runtime held in a local variable
  is not resolved.
rule:
  any:
    - pattern: Runtime.getRuntime().exec($CMD)
    - pattern: Runtime.getRuntime().exec($CMD, $$$REST)
    - pattern: java.lang.Runtime.getRuntime().exec($CMD)
    - pattern: java.lang.Runtime.getRuntime().exec($CMD, $$$REST)
constraints:
  CMD:
    kind: value_argument
    has:
      stopBy: neighbor
      any:
        - kind: string_literal
          has:
            stopBy: end
            any:
              - kind: interpolated_expression
              - kind: interpolated_identifier
        - kind: additive_expression
          all:
            - has: {kind: string_literal, stopBy: end}
            - has:
                stopBy: end
                any:
                  - kind: simple_identifier
                  - kind: interpolated_identifier
                  - kind: interpolated_expression
