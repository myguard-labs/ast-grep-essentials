id: rsa-no-padding-kotlin
language: kotlin
severity: warning
message: A literal RSA transformation explicitly selects NoPadding.
note: >-
  Matches only getInstance calls with the shown literal transformation;
  receiver identity, runtime behavior, and nonliteral values are not resolved.
rule:
  pattern: '$YST.getInstance($MODE)'
constraints:
  MODE:
    regex: '^"RSA/([Nn][Oo][Nn][Ee]|ECB)/NoPadding"$'
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
  created_at: '2026-09-11'
  source: 'CodeRabbit'
  modified_by: MyGuard
  license: Apache-2.0
ast-grep-essentials: true
