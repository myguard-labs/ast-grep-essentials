# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: trust-manager-empty-check-kotlin
language: kotlin
severity: error
message: >-
  A TrustManager check method has an empty body, so every certificate chain is
  accepted without validation and a machine-in-the-middle can read and rewrite
  the connection. Validate against a trust store, or throw CertificateException
  for an untrusted chain.
note: >-
  Matches a function named checkServerTrusted or checkClientTrusted whose body
  is an empty block, with only whitespace or comments inside. A body that only
  logs, or that delegates to another manager, is not empty and is not matched.
rule:
  kind: function_declaration
  all:
    - has: {kind: simple_identifier, regex: '^check(Server|Client)Trusted$'}
    - has:
        kind: function_body
        regex: '(?s)^\{(\s|//[^\n]*|/\*.*?\*/)*\}$'
