id: reqwest-accept-invalid-rust
language: rust
severity: warning
message: Dangerously accepting invalid TLS
note: >-
  Matches literal true passed to either dangerous TLS option on receivers
  syntactically beginning with reqwest::Client::builder(), including
  parenthesized receivers and chained calls. Does not verify receiver types or
  runtime TLS behavior.
rule:
  kind: call_expression
  pattern: '$CLIENT.$METHOD(true)'
constraints:
  METHOD:
    regex: '^danger_accept_invalid_(hostnames|certs)$'
  CLIENT:
    regex: '^\(*\s*reqwest::Client::builder\(\)'
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
  created_at: '2026-09-11'
  source: 'CodeRabbit'
  modified_by: MyGuard
  license: Apache-2.0
ast-grep-essentials: true
