id: rust-path-exists-swallows-io-errors
language: rust
severity: warning
message: >-
  Path::exists() returns false on I/O errors; use try_exists() to distinguish
  a missing path from an inaccessible one.
note: >-
  Matches the literal method-call syntax `.exists()` with no arguments. It
  does not resolve the receiver type, so non-Path types with an exists()
  method would also match.
rule:
  pattern: '$RECV.exists()'
