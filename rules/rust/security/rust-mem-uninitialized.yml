id: rust-mem-uninitialized
language: rust
severity: error
message: >-
  mem::uninitialized is deprecated and produces a value that is immediately
  undefined behavior for most types, even if it is never read. Use
  MaybeUninit and write every field before assume_init.
note: >-
  [CWE-908]: Use of Uninitialized Resource
  [REFERENCES]
      - https://cwe.mitre.org/data/definitions/908.html
      - https://doc.rust-lang.org/std/mem/fn.uninitialized.html
  Matches a call to std::mem::uninitialized, core::mem::uninitialized or
  mem::uninitialized, with or without a turbofish. A bare uninitialized(...)
  imported with a use declaration, an alias, a method named uninitialized and
  MaybeUninit::uninit are not matched. mem::zeroed is deliberately not covered
  because it is valid for integer and other plain-data types.
rule:
  kind: call_expression
  has:
    field: function
    regex: '(?s)^(?:(?:std|core)::)?mem::uninitialized\s*(?:::\s*<.*>)?$'
