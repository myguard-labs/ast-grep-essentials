# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: rust-child-wait-skipped-after-copy-error
language: rust
severity: warning
message: >-
  A stdin copy with `?` runs before child.wait(); an early error return skips
  reaping the child.
note: >-
  Syntactic check only. It matches a `std::io::copy(...)?;` statement inside a
  block that also contains a `child.wait()?` statement after it. It does not
  verify that the child was spawned, that the error path actually returns, or
  that no other cleanup runs.
rule:
  all:
    - pattern: 'std::io::copy($$$ARGS)?;'
    - follows:
        pattern: 'let mut stdin = child.stdin.take().unwrap();'
        stopBy: neighbor
    - precedes:
        pattern: 'let status = child.wait()?;'
        stopBy: neighbor
