# CodeRabbit source repository: https://github.com/coderabbitai/ast-grep-essentials
# CodeRabbit source file: https://github.com/coderabbitai/ast-grep-essentials/blob/73120109bf45c284d0cd8a37bdd7082e80e92e87/rules/rust/security/secrets-reqwest-hardcoded-auth-rust.yml
