# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: rust-static-mut-item
language: rust
severity: warning
message: >-
  Global `static mut` item: its uses require unsafe access; consider a safer
  alternative such as a Mutex, RwLock, OnceLock, or atomic.
note: >-
  Single-file syntactic check only. It flags any static_item whose direct
  child is a mutable specifier. It cannot tell whether the static is required
  by FFI or otherwise justified, so treat matches as review hints.
rule:
  kind: static_item
  has:
    kind: mutable_specifier
    stopBy: neighbor
