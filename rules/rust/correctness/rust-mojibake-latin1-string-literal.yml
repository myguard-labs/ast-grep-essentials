id: rust-mojibake-latin1-string-literal
language: rust
severity: warning
message: >-
  This string literal contains Latin-1 mojibake characters, which usually
  means UTF-8 text was decoded as Windows-1252 and stored again.
note: >-
  Matches ordinary and raw string literals containing the mojibake lead
  characters â, Ã, or ï purely by their literal characters; it does not verify
  the original encoding, runtime values, or whether the text is intentional.
rule:
  all:
    - any:
        - kind: string_literal
        - kind: raw_string_literal
    - regex: 'â|Ã|ï'
