# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: rust-needless-impl-lifetime
language: rust
severity: warning
message: >-
  This impl declares a named lifetime that appears only in the header;
  consider using '_ instead.
note: >-
  Syntactic check on a single impl header only; it does not prove the lifetime
  is unused in the body via types, macros, or where clauses outside the shown
  syntax.
rule:
  kind: impl_item
  pattern: 'impl<$LT> $TRAIT for $SELF {}'
metadata:
  known_false_positives: 'impl<T> Marker for Pair<T> {} (a type parameter, no lifetime) is flagged because $LT binds any single generic parameter; impl<''a> Link<''a> for Holder<''a> {} (the lifetime also ties the trait argument to the self type, so ''_ would change meaning) is flagged'
  todo_cases:
    - |-
      struct Holder<'a>(&'a u8);
      trait Marker { const X: u8; }
      impl<'a> Marker for Holder<'a> { const X: u8 = 0; }
    - 'impl<''a, T> Marker for (Holder<''a>, T) {}'
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
