id: rust-reqwest-client-without-timeout
language: rust
severity: warning
message: >-
  reqwest Client built without a .timeout() call; a stalled upstream can hang
  the request indefinitely.
note: >-
  Syntactic check only. It flags a `.build()` call on a
  `reqwest::Client::builder()` chain with no `.timeout(` anywhere in that
  chain. It does not see per-request timeouts, builders split across
  variables, imported or aliased `Client` paths, or `Client::new()`.
rule:
  pattern: '$C.build()'
  has:
    stopBy: end
    pattern: 'reqwest::Client::builder()'
  not:
    has:
      stopBy: end
      kind: field_identifier
      regex: '^timeout$'
