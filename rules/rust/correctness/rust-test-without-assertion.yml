# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: rust-test-without-assertion
language: rust
severity: warning
message: 'Test function contains no assert!, assert_eq!, or assert_ne! invocation.'
note: >-
  Syntactic check only. It looks only at the attribute immediately before the
  function, so other attributes in between hide the test attribute. It does
  not count assertions made through helper functions, other macros, or panics
  such as unwrap as checks.
rule:
  kind: function_item
  follows:
    kind: attribute_item
    regex: '^#\[(tokio::)?test\]$'
  all:
    - not:
        has:
          kind: macro_invocation
          regex: '^assert(_eq|_ne)?!'
          stopBy: end
    - not:
        all:
          - has:
              field: return_type
              kind: generic_type
              regex: '^([A-Za-z_][A-Za-z_0-9]*::)*Result\s*<'
          - has:
              kind: try_expression
              stopBy: end
              not:
                any:
                  - inside:
                      any:
                        - kind: closure_expression
                        - kind: async_block
                      stopBy:
                        kind: function_item
                  - inside:
                      kind: function_item
                      stopBy: end
                      inside:
                        kind: function_item
                        stopBy: end
    - not:
        follows:
          kind: attribute_item
          regex: '^#\[should_panic([(\s=]|\]$)'
          stopBy:
            not:
              kind: attribute_item
metadata:
  todo_cases:
    - '#[should_panic] then a line comment then #[test] is still flagged: the attribute walk passes only through attribute_item siblings and a comment ends it (1 match)'
    - 'a Result test inside an enclosing fn (a test fn nested in another fn body) is still flagged even with a ? in its own body, since a ? counts only when no outer function_item encloses the test (1 match)'
    - '#[test] fn t() -> TestResult { parse("1")?; Ok(()) } with a type alias for Result is still flagged, since the return type must be spelled Result<..> (1 match)'
    - '#[test] fn t() -> Result<(), String> { let v = vec![parse("1")?]; Ok(()) } whose only ? sits inside a macro argument is still flagged (1 match)'
  rule_modified_at: '2026-10-09'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-09'
  created_at: '2026-10-09'
