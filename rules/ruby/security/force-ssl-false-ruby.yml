id: force-ssl-false-ruby
language: ruby
severity: warning
message: >-
  Explicitly assigning false to config.force_ssl disables this HTTPS
  enforcement setting.
note: >-
  This rule checks only direct single-file assignments of a false literal,
  optionally enclosed in one pair of parentheses; it does not determine
  effective configuration or runtime HTTPS enforcement.
rule:
  pattern: 'config.force_ssl = $VALUE'
constraints:
  VALUE:
    regex: '^\s*(?:false|\(\s*false\s*\))\s*$'
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
  created_at: '2026-09-11'
  source: 'CodeRabbit'
  modified_by: MyGuard
  license: Apache-2.0
ast-grep-essentials: true
