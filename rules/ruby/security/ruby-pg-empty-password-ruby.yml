id: ruby-pg-empty-password-ruby
language: ruby
severity: warning
message: A PostgreSQL connection call contains a literal empty password.
note: >-
  This rule checks only explicit password pairs in the shown call syntax. It
  does not resolve runtime values, aliases, or authentication behavior.
rule:
  kind: call
  all:
    - regex: '^(?:PG\.connect|PG::Connection\.(?:new|connect_start))\b'
    - has:
        stopBy: neighbor
        kind: argument_list
        has:
          stopBy: neighbor
          kind: pair
          all:
            - regex: '^(?:password\s*:|:password\s*=>)'
            - has:
                stopBy: neighbor
                kind: string
                all:
                  - not:
                      has:
                        stopBy: neighbor
                        kind: string_content
                  - not:
                      has:
                        stopBy: neighbor
                        kind: interpolation
