id: ruby-redirect-to-params
language: ruby
severity: warning
message: >-
  redirect_to sends the browser to a location read straight from params, which
  allows an open redirect to an attacker-chosen site.
note: >-
  Fires on redirect_to whose first argument is params[...] or params.fetch or
  params.dig. A named route helper, a fixed path and a redirect built by a
  helper that receives params are not matched. A value validated against an
  allow-list or forced to a local path earlier is the routine dismissal. It does not cover hash-form url: or controller: arguments or params.permit(...)[:url].

  [CWE-601] [A01:2025] [A01:2021]

  [REFERENCES]
      - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
rule:
  kind: call
  all:
    - has:
        field: method
        regex: '^redirect_to$'
    - has:
        field: arguments
        kind: argument_list
        has:
          nthChild:
            position: 1
            ofRule:
              not:
                kind: comment
          regex: '^params\s*(\[|\.(fetch|dig)\b)'
metadata:
  created_at: '2026-11-16'
