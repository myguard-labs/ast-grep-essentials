id: ruby-faraday-hardcoded-secret-ruby
language: ruby
severity: warning
message: >-
  A secret is hard-coded in the application. Secrets stored in source
  code, such as credentials, identifiers, and other types of sensitive data,
  can be leaked and used by internal or external malicious actors. Use
  environment variables to securely provide credentials and other secrets or
  retrieve them from a secure vault or Hardware Security Module (HSM).
note: >-
  [CWE-798] Use of Hard-coded Credentials.
  [REFERENCES]
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

ast-grep-essentials: true

utils:
  UPSTREAM_UTIL_001:
    kind: call
    all:
      - has:
          kind: identifier
          nthChild: 2
          regex: ^request$
      - has:
         kind: argument_list
         nthChild: 3
         all:
          - has:
              regex: ^:authorization$
              nthChild:
               position: 1
               ofRule:
                not:
                 kind: comment
          - has:
              regex: ^:basic$
              nthChild:
               position: 2
               ofRule:
                not:
                 kind: comment
          - has:
             any:
             - kind: chained_string
               has:
                 kind: string
                 has:
                  kind: string_content
                 nthChild:
                  position: 4
                  ofRule:
                   not:
                    kind: comment
             - kind: string
               has:
                kind: string_content
               nthChild:
                position: 4
                ofRule:
                 not:
                  kind: comment
          - not:
              has:
               nthChild:
                position: 5
                ofRule:
                 not:
                  kind: comment
      - any:
        - inside:
           stopBy: end
           follows:
            stopBy: end
            kind: call
            pattern: require "faraday"
        - follows:
           stopBy: end
           kind: call
           pattern: require "faraday"

  UPSTREAM_UTIL_002:
    kind: call
    all:
      - has:
          kind: identifier
          nthChild: 2
