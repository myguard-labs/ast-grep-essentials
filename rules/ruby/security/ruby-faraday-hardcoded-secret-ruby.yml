              kind: identifier
              nthChild:
               position: 4
               ofRule:
                not:
                 kind: comment
          - not:
              has:
                nthChild:
                  position: 5
                  ofRule:
                    not:
                      kind: comment
      - any:
        - inside:
           stopBy: end
           follows:
            stopBy: end
            kind: call
            pattern: require "faraday"
        - follows:
           stopBy: end
           kind: call
           pattern: require "faraday"
      - any:
          - follows:
              stopBy: end
              kind: assignment
              pattern: $STRING = $PASSWORD
          - inside:
              stopBy: end
              follows:
               stopBy: end
               kind: assignment
               pattern: $STRING = $PASSWORD

