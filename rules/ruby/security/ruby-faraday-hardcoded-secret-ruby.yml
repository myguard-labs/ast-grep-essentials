rule:
  kind: call
  any:
    - matches: UPSTREAM_UTIL_001
    - matches: UPSTREAM_UTIL_002
    - matches: UPSTREAM_UTIL_003
    - matches: UPSTREAM_UTIL_004
    - matches: UPSTREAM_UTIL_005
    - matches: UPSTREAM_UTIL_006
    - matches: UPSTREAM_UTIL_007
    - matches: UPSTREAM_UTIL_008
  all:
      - not:
         has:
          stopBy: end
          kind: ERROR
      - not:
         inside:
          stopBy: end
          kind: ERROR
constraints:
  PASSWORD:
    kind: string
    has:
      kind: string_content
