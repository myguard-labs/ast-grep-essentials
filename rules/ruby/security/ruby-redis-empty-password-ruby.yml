id: ruby-redis-empty-password-ruby
language: ruby
severity: warning
message: >-
  The application creates a database connection with an empty password.
  This can lead to unauthorized access by either an internal or external
  malicious actor. To prevent this vulnerability, enforce authentication
  when connecting to a database by using environment variables to securely
  provide credentials or retrieving them from a secure vault or HSM
  (Hardware Security Module).
note: >-
  [CWE-287] Improper Authentication.
  [REFERENCES]
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

ast-grep-essentials: true

utils:
  UPSTREAM_UTIL_001:
    # Redis.new(..., password: "", ...)
   kind: call
   all:
    - has:
       stopBy: neighbor
       kind: constant
       regex: ^Redis$
    - has:
        stopBy: neighbor
        regex: ^.$
    - has:
        stopBy: neighbor
        kind: identifier
        regex: ^new$
    - has:
        stopBy: neighbor
        kind: argument_list
        has:
          stopBy: neighbor
          kind: pair
          all:
            - has:
                  stopBy: neighbor
                  any:
                    - regex: ^password$
                      not:
                        precedes:
                          regex: ^=>$
                    - regex: ^:password$
            - has:
                stopBy: neighbor
                kind: string
                not:
                  has:
                    stopBy: neighbor
                    kind: string_content
    - any:
      - inside:
         stopBy: end
         follows:
          stopBy: end
          kind: call
          pattern: require "redis"
      - follows:
          stopBy: end
          kind: call
          pattern: require "redis"
rule:
  kind: call
  matches: UPSTREAM_UTIL_001
  all:
    - not:
        has:
          stopBy: end
          kind: ERROR
    - not:
        inside:
          stopBy: end
          kind: ERROR
