id: ruby-send-user-controlled-method
language: ruby
severity: warning
message: >-
  send, public_send or __send__ is called with a method name taken from params.
  A request can then invoke any method the receiver responds to.
note: >-
  Fires on a call to send, public_send or __send__ whose first argument starts
  with params, including params[:x] and params[:x].to_sym. A fixed symbol, an
  allow-list lookup such as ALLOWED[params[:x]] and a variable that merely has
  params in its name are not matched. The value may be checked against an
  allow-list before the call, which is the routine dismissal.

  [CWE-470] [A05:2025] [A03:2021]

  [REFERENCES]
      - https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
rule:
  kind: call
  all:
    - has:
        field: method
        regex: '^(send|public_send|__send__)$'
    - has:
        field: arguments
        kind: argument_list
        has:
          nthChild:
            position: 1
            ofRule:
              not:
                kind: comment
          regex: '^params\s*[\[.]'
metadata:
  created_at: '2026-11-16'
