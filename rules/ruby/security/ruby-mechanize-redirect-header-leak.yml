id: ruby-mechanize-redirect-header-leak
language: ruby
severity: warning
message: A Ruby method passes its own headers argument unchanged into a recursive
  call to itself inside a redirect-handling branch.
note: Redirect hops can forward credential headers to a new host when the header set
  is rebuilt per hop. Whether the header is withheld depends on state set in other
  functions, so a single-function syntactic match cannot decide it. Recorded so it
  is not re-mined.
rule:
  all:
    - pattern: $METHOD($$$ARGS, headers)
    - inside:
        kind: method
        stopBy: end
        has:
          field: name
          pattern: $METHOD
    - inside:
        kind: method
        stopBy: end
        has:
          field: parameters
          regex: '\bheaders\b'
    - inside:
        kind: if
        stopBy: end
        has:
          field: condition
          regex: '(?i)redirect|\b(?:code|status|status_code|http_status|statuscode)\b(?:\.to_s)?\.start_with\?\(?\s*[''\"]3|\b(?:code|status|status_code|http_status|statuscode)\b[''"]?(?:\([^()]*\)|[\])])?(?:\.to_[is])?\s*(?:===?|!=|<=>|>=?|<=?)\s*[''"]?3[0-9][0-9]\b|[''"]?\b3[0-9][0-9]\b[''"]?\s*(?:===?|!=|<=>|>=?|<=?)\s*[@\w.]*\b(?:code|status|status_code|http_status|statuscode)\b|\b3[0-9][0-9]\b[^\])]*[\])]\s*===\s*[@\w.\[:''"]*\b(?:code|status|status_code|http_status|statuscode)\b|\b3[0-9][0-9]\b[^\])]*[\])]\.(?:include|cover|member)\?\(?\s*[@\w.\[:''"]*\b(?:code|status|status_code|http_status|statuscode)\b|\b3[0-9][0-9]\b\.\.\.?[0-9]+\.(?:include|cover)\?\(?\s*[@\w.\[:''"]*\b(?:code|status|status_code|http_status|statuscode)\b|\binclude\?\(?\s*3[0-9][0-9]\b|\b(?:code|status|status_code|http_status|statuscode)\b[''"]?(?:\([^()]*\)|[\])])?(?:\.to_[is])?\.(?:between|in)\?\(?\s*[\[(]*3[0-9][0-9]\b'
metadata:
  cwe: 'CWE-200'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/200.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A01:2025'
  todo_cases:
    - 'A non-status include?(3xx) condition (retry_codes.include?(300)) is still matched.'
    - 'Unusual spacing inside the status operand (include?(response . code)) is not matched.'
    - 'Receiver-qualified recursion (self.follow_redirect(uri, headers)) is not matched.'
