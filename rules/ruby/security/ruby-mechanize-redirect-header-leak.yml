id: ruby-mechanize-redirect-header-leak
language: ruby
severity: warning
message: A Ruby method passes its own headers argument unchanged into a recursive
  call to itself inside a redirect-handling branch.
note: Redirect hops can forward credential headers to a new host when the header set
  is rebuilt per hop. Whether the header is withheld depends on state set in other
  functions, so a single-function syntactic match cannot decide it. Recorded so it
  is not re-mined.
rule:
  all:
    - pattern: $METHOD($$$ARGS, headers)
    - inside:
        kind: method
        stopBy: end
        has:
          field: name
          pattern: $METHOD
    - inside:
        kind: method
        stopBy: end
        has:
          field: parameters
          regex: '\bheaders\b'
    - inside:
        kind: if
        stopBy: end
        has:
          field: condition
          regex: '(?i)redirect|\b(code|status)\b(\.to_s)?\.start_with\?\(\s*[''"]3|(\b(code|status)\b|include\?).*\b3[0-9][0-9]\b|\b3[0-9][0-9]\b.*(\b(code|status)\b|include\?)'
metadata:
  cwe: 'CWE-200'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/200.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A01:2025'
  known_false_positives: 'a non-status include?(3xx) condition (retry_codes.include?(300)) is still matched; a non-redirect status test next to an unrelated 3xx number (if response.status == 200 && attempts < 300) still reports; narrowing the condition regex lost real redirect forms (c94), so the loose match stays'
  todo_cases:
    - |-
      def follow_redirect(uri, headers)
        if response . code . start_with?('3')
          follow_redirect(uri, headers)
        end
      end
    - |-
      def follow_redirect(uri, headers)
        if response.code.start_with?('3')
          self.follow_redirect(uri, headers)
        end
      end
