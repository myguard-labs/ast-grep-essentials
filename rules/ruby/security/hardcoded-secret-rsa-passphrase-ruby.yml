id: hardcoded-secret-rsa-passphrase-ruby
language: ruby
severity: warning
message: RSA serialization uses a string literal as its passphrase argument.
note: >-
  This rule checks only direct serialization calls on syntactic
  OpenSSL::PKey::RSA.new receivers with a string literal in the second
  argument position. It does not establish runtime values, receiver types, or
  variable dataflow.
rule:
  kind: call
  all:
    - has:
        stopBy: neighbor
        kind: call
        pattern: 'OpenSSL::PKey::RSA.new($$$)'
    - has:
        stopBy: neighbor
        kind: identifier
        regex: '^(to_pem|export)$'
    - has:
        stopBy: neighbor
        kind: argument_list
        has:
          stopBy: neighbor
          kind: string
          nthChild:
            position: 2
            ofRule:
              not:
                kind: comment
          not:
            precedes:
              stopBy: end
              nthChild: 3
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
  created_at: '2026-09-11'
  source: 'CodeRabbit'
  modified_by: MyGuard
  license: Apache-2.0
ast-grep-essentials: true
