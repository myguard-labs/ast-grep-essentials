id: ruby-chmod-world-writable
language: ruby
severity: warning
message: >-
  File mode that grants write access to every local user. Any account on the
  host can then replace the file, so a configuration file, a script or a socket
  read back by this process becomes an injection point, and 0777 also makes it
  executable. Use 0600 for private data and 0644 or 0755 when other users only
  need to read.
note: >-
  Fires on File.chmod, File.lchmod, FileUtils.chmod and FileUtils.chmod_R whose
  first argument is an integer literal with the other-write bit set, such as
  0777 or 0666. A mode held in a variable, a symbolic string mode, and the
  process umask clearing the bit at runtime are outside the shape. A
  deliberately shared spool directory is a legitimate dismissal.

  [CWE-276] [A01:2025] [A01:2021]

  [REFERENCES]
      - https://cwe.mitre.org/data/definitions/276.html
rule:
  kind: call
  all:
    - has: {field: receiver, regex: '^(File|FileUtils)$'}
    - has: {field: method, regex: '^(chmod|lchmod|chmod_R)$'}
    - has:
        field: arguments
        kind: argument_list
        has:
          nthChild:
            position: 1
            ofRule: {not: {kind: comment}}
          kind: integer
          regex: '^0[oO]?[0-7]*[2367]$'
metadata:
  created_at: '2026-11-16'
  source: 'MyGuard'
  modified_by: 'MyGuard'
  license: 'MyGuard Internal Use License 1.0'
  cwe: 'CWE-276'
  owasp: 'A01:2025|A01:2021'
  category: 'security'
  references: 'https://cwe.mitre.org/data/definitions/276.html'
