id: insufficient-rsa-key-size-ruby
language: ruby
severity: warning
message: RSA key size literals below 2048 indicate insufficient key strength.
note: >-
  This rule checks only direct first-argument numeric syntax in calls spelled
  OpenSSL::PKey::RSA.new or OpenSSL::PKey::RSA.generate. It does not resolve
  receiver identity, variables, types, or runtime values.
rule:
  kind: call
  all:
    - has:
        stopBy: neighbor
        kind: scope_resolution
        regex: '^OpenSSL::PKey::RSA$'
    - has:
        stopBy: neighbor
        regex: '^.$'
    - has:
        stopBy: neighbor
        kind: identifier
        regex: '^(new|generate)$'
    - has:
        stopBy: neighbor
        kind: argument_list
        has:
          stopBy: neighbor
          pattern: '$SIZE'
          regex: >-
            ^(-?(0|[1-9][0-9]?|[1-9][0-9]{2}|1[0-9]{3}|20[0-3][0-9]|204[0-7])(\.[0-9]+)?|-[1-9][0-9]*|-\d+(\.\d+)?(/(\d+(\.\d+)?))?|0[xX]0*([0-9a-fA-F]{1,2}|[0-7][0-9a-fA-F]{2}))$
          nthChild:
            position: 1
            ofRule:
              not:
                kind: comment
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
  created_at: '2026-09-11'
