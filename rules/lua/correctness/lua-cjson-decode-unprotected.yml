# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: lua-cjson-decode-unprotected
language: lua
severity: warning
message: >-
  A cjson.decode or cjson.encode call appears outside an anonymous callback
  passed to pcall or xpcall. Calls evaluated while constructing protected-call
  arguments execute before protection begins.
note: >-
  This is a single-file syntactic check for calls spelled cjson.decode or
  cjson.encode. It excludes calls within anonymous functions supplied directly
  as pcall or xpcall arguments. It does not resolve module bindings,
  distinguish cjson.safe, or establish protection through named callbacks or
  enclosing callers.
rule:
  kind: function_call
  all:
    - has:
        field: name
        regex: '^cjson\.(decode|encode)$'
    - not:
        inside:
          stopBy: end
          kind: function_definition
          inside:
            stopBy: neighbor
            kind: arguments
            inside:
              stopBy: neighbor
              kind: function_call
              has:
                field: name
                regex: '^x?pcall$'
