id: lua-exit-without-return
language: lua
severity: warning
message: >-
  Bare ngx.exit, ngx.redirect or ngx.exec call. Use a return statement when
  the intent is to return from the current function.
note: >-
  Matches syntactically bare termination calls. Return ancestry is checked
  only within the current function definition, so a return enclosing that
  definition does not suppress calls in its body. This rule does not determine
  runtime termination behavior, execution phase, or whether subsequent code
  executes; final bare calls are also reported.
rule:
  kind: function_call
  all:
    - has:
        field: name
        regex: '^ngx\.(exit|redirect|exec)$'
    - not:
        inside:
          kind: return_statement
          stopBy:
            kind: function_definition
    - not:
        inside:
          kind: arguments
    - not:
        inside:
          kind: expression_list
    - not:
        inside:
          kind: binary_expression
