id: lua-exit-without-return
language: lua
severity: warning
message: >-
  Request terminated by ngx.exit, ngx.redirect or ngx.exec written as a bare
  statement instead of a return. Control continues to the next statement in the
  same block, so a deny branch that was meant to stop the request keeps running
  handler code and can fail open. Write the call as a return statement.
note: >-
  Matches an ngx.exit, ngx.redirect or ngx.exec call that is an expression
  statement rather than part of a return statement. A bare call as the last
  statement of a handler behaves the same as a return in most phases, so such a
  call is reported even though it is harmless there. Which phase the code runs in
  is not visible to this matcher.
rule:
  kind: function_call
  all:
    - has: {field: name, regex: '^ngx\.(exit|redirect|exec)$'}
    - not: {inside: {kind: return_statement, stopBy: end}}
    - not: {inside: {kind: arguments}}
    - not: {inside: {kind: expression_list}}
    - not: {inside: {kind: binary_expression}}
