id: lua-uri-args-unbounded
language: lua
severity: warning
message: >-
  Request argument or header table read with an unlimited literal limit. Pass
  an explicit small maximum and handle the truncated error it returns.
note: >-
  Matches ngx.req.get_uri_args, get_post_args and get_headers with the literal
  number spelling 0 or 0.0 as the first argument. This is a single-file
  syntactic check; it does not resolve aliases or variables, evaluate other
  numeric expressions, or check handling of the truncated return value.
rule:
  kind: function_call
  all:
    - has:
        field: name
        regex: '^ngx\.req\.get_(uri_args|post_args|headers)$'
    - has:
        stopBy: neighbor
        kind: arguments
        has:
          nthChild: 1
          kind: number
          regex: '^0(\.0)?$'
