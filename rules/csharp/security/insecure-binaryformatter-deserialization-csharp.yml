id: insecure-binaryformatter-deserialization-csharp
language: csharp
severity: warning
message: >-
  BinaryFormatter construction is insecure and should be replaced with a safer
  serialization API.
note: >-
  This rule detects constructor syntax in a single file. It does not resolve
  types, verify namespace binding, or determine whether deserialization
  occurs.
rule:
  all:
    - pattern: 'new $TYPE()'
    - not:
        all:
          - pattern: 'new BinaryFormatter()'
          - not:
              inside:
                stopBy: end
                follows:
                  stopBy: end
                  kind: using_directive
                  pattern: 'using System.Runtime.Serialization.Formatters.Binary;'
    - not:
        all:
          - pattern: 'new BinaryFormatter()'
          - inside:
              kind: object_creation_expression
              stopBy: end
              not:
                inside:
                  kind: variable_declarator
                  stopBy: end
constraints:
  TYPE:
    regex: '^(System\.Runtime\.Serialization\.Formatters\.Binary\.)?BinaryFormatter$'
metadata:
  rule_modified_at: '2026-10-05'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-05'
  created_at: '2026-09-11'
  source: 'CodeRabbit'
  modified_by: MyGuard
  license: Apache-2.0
ast-grep-essentials: true
