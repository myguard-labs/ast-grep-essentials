id: jwt-decode-without-verify-csharp
severity: warning
language: csharp
message: >-
  Detected the decoding of a JWT token without a verify step. JWT tokens
  must be verified before use, otherwise the token's integrity is unknown.
  This means a malicious actor could forge a JWT token with any claims.
  Validate the token before using it.
note: >-
  [CWE-345] Insufficient Verification of Data Authenticity.
  [REFERENCES]
      - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures

ast-grep-essentials: true

utils:
  UPSTREAM_UTIL_001:
    kind: invocation_expression
    all:
      - has:
          nthChild: 1
          kind: member_access_expression
          all:
            - has:
                nthChild: 1
                pattern: $INST
            - has:
                nthChild: 2
                kind: identifier
                regex: ^Decode$
      - has:
          nthChild: 2
          kind: argument_list
          has:
            kind: argument
            not:
              nthChild: 1
            all:
              - has:
                  nthChild: 1
                  kind: identifier
                  regex: ^verify$
              - has:
                  nthChild: 2
                  kind: boolean_literal
                  regex: ^false$
      - inside:
          stopBy: end
          follows:
            stopBy: end
            kind: using_directive
            any:
              - pattern: using JWT;
              - pattern: using JWT.Builder;
              - pattern: using Microsoft.IdentityModel.Tokens;
      - inside:
          stopBy: end
          follows:
            stopBy: end
            kind: local_declaration_statement
            has:
              kind: variable_declaration
              all:
                - has:
                    kind: identifier
                    regex: ^(IJwtDecoder|JwtDecoder)$
                - has:
                    kind: variable_declarator
                    has:
                      kind: identifier
                      pattern: $INST

  UPSTREAM_UTIL_002:
    kind: invocation_expression
    all:
      - has:
          nthChild: 1
          kind: member_access_expression
          all:
            - has:
                nthChild: 1
                pattern: $INST
            - has:
                nthChild: 2
                kind: identifier
                regex: ^Decode$
      - has:
          nthChild: 2
          kind: argument_list
          has:
            kind: argument
            has:
              kind: boolean_literal
              regex: ^false$
            any:
              - nthChild: 2
              - nthChild: 3
      - inside:
          stopBy: end
          follows:
            stopBy: end
            kind: using_directive
            any:
              - pattern: using JWT;
              - pattern: using JWT.Builder;
              - pattern: using Microsoft.IdentityModel.Tokens;
      - inside:
          stopBy: end
          follows:
            stopBy: end
            kind: local_declaration_statement
            has:
              kind: variable_declaration
              all:
                - has:
                    kind: identifier
                    regex: ^(IJwtDecoder|JwtDecoder)$
                - has:
                    kind: variable_declarator
                    has:
                      kind: identifier
                      pattern: $INST

