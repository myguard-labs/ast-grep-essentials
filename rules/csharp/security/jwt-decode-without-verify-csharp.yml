          kind: member_access_expression
          all:
            - has:
                nthChild: 1
                pattern: $INST
            - has:
                nthChild: 2
                kind: identifier
                regex: ^Decode$
      - has:
          nthChild: 2
          kind: argument_list
          has:
            kind: argument
            not:
              nthChild: 1
            all:
              - has:
                  nthChild: 1
                  kind: identifier
                  regex: ^verify$
              - has:
                  nthChild: 2
                  kind: boolean_literal
                  regex: ^false$
      - inside:
          stopBy: end
          follows:
            stopBy: end
            kind: using_directive
            any:
              - pattern: using JWT;
              - pattern: using JWT.Builder;
              - pattern: using Microsoft.IdentityModel.Tokens;
      - inside:
          stopBy: end
          follows:
            stopBy: end
            any:
              - kind: local_declaration_statement
                has:
                  stopBy: end
                  kind: variable_declarator
                  all:
                    - has:
                        kind: identifier
                        pattern: $INST
                    - has:
                        kind: object_creation_expression
                        has:
                          kind: identifier
                          regex: ^JwtDecoder$
              - kind: expression_statement
                all:
                  - has:
                      kind: assignment_expression
                      all:
                        - has:
                            nthChild: 1
                            pattern: $INST
                        - has:
                            kind: object_creation_expression
                            has:
                              kind: identifier
                              regex: ^JwtDecoder$

  UPSTREAM_UTIL_004:
    kind: invocation_expression
    all:
      - has:
          nthChild: 1
          kind: member_access_expression
          all:
            - has:
                nthChild: 1
                pattern: $INST
            - has:
                nthChild: 2
                kind: identifier
                regex: ^Decode$
      - has:
          nthChild: 2
          kind: argument_list
          has:
            kind: argument
            has:
              kind: boolean_literal
              regex: ^false$
            any:
              - nthChild: 2
              - nthChild: 3
      - inside:
          stopBy: end
          follows:
            stopBy: end
            kind: using_directive
            any:
              - pattern: using JWT;
              - pattern: using JWT.Builder;
              - pattern: using Microsoft.IdentityModel.Tokens;
      - inside:
          stopBy: end
          follows:
            stopBy: end
            any:
              - kind: local_declaration_statement
                has:
                  stopBy: end
                  kind: variable_declarator
                  all:
                    - has:
                        kind: identifier
                        pattern: $INST
                    - has:
                        kind: object_creation_expression
                        has:
                          kind: identifier
                          regex: ^JwtDecoder$
              - kind: expression_statement
                all:
                  - has:
                      kind: assignment_expression
                      all:
                        - has:
                            nthChild: 1
                            pattern: $INST
                        - has:
                            kind: object_creation_expression
                            has:
                              kind: identifier
                              regex: ^JwtDecoder$

  UPSTREAM_UTIL_005:
    kind: invocation_expression
    all:
      - not:
          precedes:
            stopBy: end
            has:
              stopBy: end
              kind: member_access_expression
              has:
                kind: identifier
                regex: ^MustVerifySignature$
              precedes:
                kind: argument_list
      - has:
          nthChild: 1
          kind: member_access_expression
          all:
            - has:
                stopBy: end
                kind: identifier
                regex: ^JwtBuilder$
            - not:
                has:
                  stopBy: end
                  kind: invocation_expression
                  all:
                    - has:
                        kind: member_access_expression
                        nthChild: 1
                        has:
                          nthChild: 2
                          kind: identifier
                          regex: ^MustVerifySignature$
                    - has:
                        kind: argument_list
                        nthChild: 2
            - has:
                nthChild: 2
                kind: identifier
                regex: ^Decode$
      - has:
          nthChild: 2
          kind: argument_list
      - inside:
          stopBy: end
          follows:
            stopBy: end
            kind: using_directive
            any:
              - pattern: using JWT;
              - pattern: using JWT.Builder;
              - pattern: using Microsoft.IdentityModel.Tokens;

  UPSTREAM_UTIL_006:
    kind: invocation_expression
    all:
      - has:
          nthChild: 1
          kind: member_access_expression
          all:
            - has:
                stopBy: end
                kind: identifier
                pattern: $INST
            - not:
                has:
                  stopBy: end
                  kind: invocation_expression
                  all:
