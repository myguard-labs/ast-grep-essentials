                    - has:
                        kind: argument_list
                        nthChild: 2
            - has:
                nthChild: 2
                kind: identifier
                regex: ^Decode$
      - has:
          nthChild: 2
          kind: argument_list
      - inside:
          stopBy: end
          follows:
            stopBy: end
            kind: using_directive
            any:
              - pattern: using JWT;
              - pattern: using JWT.Builder;
              - pattern: using Microsoft.IdentityModel.Tokens;
      - any:
          - inside:
              stopBy: end
              follows:
                stopBy: end
                any:
                  - kind: expression_statement
                    has:
                      kind: assignment_expression
                      all:
                        - has:
                            kind: identifier
                            nthChild: 1
                        - has:
                            kind: invocation_expression
                            pattern: JwtBuilder.Create()
                  - kind: local_declaration_statement
                    # not:
                    #   precedes:
                    #     stopBy: end
                    #     has:
                    #       stopBy: end
                    #       kind: member_access_expression
                    #       has:
                    #         kind: identifier
                    #         regex: ^MustVerifySignature$
                    #       precedes:
                    #         kind: argument_list
                    has:
                      stopBy: end
                      kind: variable_declarator
                      all:
                        - has:
                            nthChild: 1
                            kind: identifier
                            pattern: $INST
                        - has:
                            stopBy: end
                            kind: invocation_expression
                            pattern: JwtBuilder.Create()
          - inside:
              stopBy: end
              follows:
                stopBy: end
                kind: expression_statement
                not:
                  precedes:
                    stopBy: end
                    has:
                      stopBy: end
                      kind: member_access_expression
                      has:
                        kind: identifier
                        regex: ^MustVerifySignature$
                      precedes:
                        kind: argument_list
                has:
                  kind: assignment_expression
                  all:
                    - has:
                        nthChild: 1
                        kind: identifier
                        pattern: $INST
                    - has:
                        stopBy: end
                        kind: invocation_expression
                        pattern: JwtBuilder.Create()
      - not:
          any:
            - inside:
                stopBy: end
                follows:
                  stopBy: end
                  kind: expression_statement
                  any:
                    - has:
                        stopBy: end
                        pattern: MustVerifySignature()
                    - has:
                        stopBy: end
                        kind: member_access_expression
                        all:
                          - has:
                              kind: identifier
                              pattern: $INST
                          - has:
                              kind: identifier
                              regex: ^MustVerifySignature$
                        precedes:
                          kind: argument_list
            - inside:
                kind: member_access_expression
                all:
                  - has:
                      stopBy: end
                      kind: identifier
                      regex: ^MustVerifySignature$
                  - precedes:
                      kind: argument_list

  UPSTREAM_UTIL_007:
    kind: object_creation_expression
    all:
      - inside:
