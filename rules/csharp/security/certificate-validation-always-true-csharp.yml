  owasp: 'A02:2025|A02:2021'
  category: 'security'
  subcategory: 'certificate-validation'
  references: 'https://cwe.mitre.org/data/definitions/295.html|https://learn.microsoft.com/en-us/dotnet/api/system.net.servicepointmanager.servercertificatevalidationcallback'
