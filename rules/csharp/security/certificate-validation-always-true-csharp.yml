# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: certificate-validation-always-true-csharp
language: csharp
severity: warning
message: >-
  A TLS certificate validation callback unconditionally accepts every
  certificate, which disables server authentication and allows
  man-in-the-middle attacks.
note: >-
  Matches assignment or += (not -=, which unsubscribes) of a lambda or anonymous method whose body is only
  `true` or `return true;`, or of DangerousAcceptAnyServerCertificateValidator,
  to a member named ServerCertificateValidationCallback,
  ServerCertificateCustomValidationCallback or
  RemoteCertificateValidationCallback. The same callbacks wrapped in explicit delegate construction, such as
  `new RemoteCertificateValidationCallback((s, c, ch, e) => true)`, are
  matched too. Callbacks that inspect their arguments
  are not flagged. This is a single-file syntactic check; it does not follow
  callbacks defined as named methods. Known misses: callbacks passed as
  constructor arguments, such as `new SslStream(stream, false, (s, c, ch, e) =>
  true)`, and `static` lambdas are not matched.
utils:
  always-true-callback:
    any:
      - kind: lambda_expression
        regex: '(?s)^(?:async\s+)?(?:\([^()]*\)|\w+)\s*=>\s*(?:true|\{\s*return\s+true\s*;\s*\})$'
      - kind: anonymous_method_expression
        regex: '(?s)^delegate\s*(?:\([^()]*\))?\s*\{\s*return\s+true\s*;\s*\}$'
rule:
  kind: assignment_expression
  all:
    - has:
        field: operator
        regex: '^\+?=$'
    - has:
        field: left
        regex: '(?:^|\.)(?:ServerCertificateValidationCallback|ServerCertificateCustomValidationCallback|RemoteCertificateValidationCallback)$'
    - has:
        field: right
        any:
          - matches: always-true-callback
          - kind: object_creation_expression
            has:
              kind: argument_list
              has:
                kind: argument
                has:
                  matches: always-true-callback
          - kind: member_access_expression
            regex: '(?:^|\.)DangerousAcceptAnyServerCertificateValidator$'
