# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: process-start-dynamic-arguments-csharp
language: csharp
severity: warning
message: >-
  Process arguments are built with string concatenation, interpolation or
  string.Format. Untrusted input can inject extra arguments or shell commands.
note: >-
  Matches Process.Start(file, args) and new ProcessStartInfo(file, args) where
  args (or an argument named `arguments` in any position), and an Arguments initializer inside new ProcessStartInfo { ... } whose
  value, is an interpolated string with an interpolation, a + concatenation
  containing a non-literal operand, or a string.Format call. Literal-only
  arguments are not flagged. This is a single-file syntactic check; it does
  not follow arguments assigned in an earlier statement, assignments to
  psi.Arguments outside an initializer, or sanitization of the values.
utils:
  dynamic-arg-text:
    any:
      - kind: interpolated_string_expression
        has:
          kind: interpolation
      - kind: binary_expression
        all:
          - has:
              field: operator
              regex: '^\+$'
          - has:
              stopBy: end
              any:
                - kind: identifier
                - kind: member_access_expression
                - kind: invocation_expression
                - kind: element_access_expression
      - kind: invocation_expression
        has:
          field: function
          regex: '^(?:string|String|System\.String)\.Format$'
rule:
  any:
    - kind: invocation_expression
      all:
        - has:
            field: function
            regex: '^(?:System\.Diagnostics\.)?Process\.Start$'
        - has:
            field: arguments
            kind: argument_list
            has:
              kind: argument
              has:
                matches: dynamic-arg-text
              any:
                - nthChild:
                    position: 2
                    ofRule:
                      not:
                        kind: comment
                - has:
                    field: name
                    kind: identifier
                    regex: '^arguments$'
    - kind: object_creation_expression
      all:
        - has:
            field: type
            regex: '^(?:System\.Diagnostics\.)?ProcessStartInfo$'
        - has:
            field: arguments
            kind: argument_list
            has:
              kind: argument
              has:
                matches: dynamic-arg-text
              any:
                - nthChild:
                    position: 2
                    ofRule:
                      not:
                        kind: comment
                - has:
                    field: name
                    kind: identifier
                    regex: '^arguments$'
    - kind: assignment_expression
      all:
        - has:
            field: left
            regex: '^Arguments$'
        - has:
            field: right
            matches: dynamic-arg-text
        - inside:
            kind: initializer_expression
            inside:
              kind: object_creation_expression
              has:
                field: type
                regex: '^(?:System\.Diagnostics\.)?ProcessStartInfo$'
