# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: process-start-dynamic-arguments-csharp
language: csharp
severity: warning
message: >-
  Process arguments are built with string concatenation, interpolation or
  string.Format. Untrusted input can inject extra arguments or shell commands.
note: >-
  Matches Process.Start(file, args) (exactly two positional arguments, or an
  argument named `arguments`) and new ProcessStartInfo(file, args) where
  args is an interpolated string with an interpolation, a + concatenation
  containing a non-literal operand, or a string.Format call. Also matches an
  Arguments initializer inside new ProcessStartInfo { ... }, a
  `.StartInfo.Arguments = ...` assignment, and `x.Arguments = ...` only when
  x is a variable declared with new ProcessStartInfo(...) in the same method.
  A positional second argument is skipped when it carries another name or the
  call has more than two arguments (the Process.Start(file, user, password,
  domain) overload). Literal-only arguments are not flagged. This is a
  single-file syntactic check; it does not follow arguments assigned in
  another method, a ProcessStartInfo received as a parameter or field, or
  sanitization of the values. Known limitation: `x.Arguments` links to any
  variable named x declared with new ProcessStartInfo(...) anywhere in the
  enclosing method, so a same-named variable in a sibling block or lambda
  is not told apart from the one actually assigned.

  [CWE-78] [A05:2025] [A03:2021]

  [REFERENCES]
      - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
      - https://cwe.mitre.org/data/definitions/78.html
utils:
  dynamic-arg-text:
    any:
      - kind: interpolated_string_expression
        has:
          kind: interpolation
      - kind: binary_expression
        all:
          - has:
              field: operator
              regex: '^\+$'
          - has:
              stopBy: end
              any:
                - kind: identifier
                - kind: member_access_expression
                - kind: invocation_expression
                - kind: element_access_expression
      - kind: invocation_expression
        has:
          field: function
          regex: '^(?:global::)?(?:string|String|System\.String)\.Format$'
rule:
  any:
    - kind: invocation_expression
      all:
        - has:
            field: function
            regex: '^(?:global::)?(?:System\.Diagnostics\.)?Process\.Start$'
        - has:
            field: arguments
            kind: argument_list
            has:
              kind: argument
              has:
                matches: dynamic-arg-text
              any:
                - all:
                    - nthChild:
                        position: 2
                        ofRule:
                          not:
                            kind: comment
                    - not:
                        has:
                          field: name
                          kind: identifier
                    - inside:
                        kind: argument_list
                        not:
                          has:
                            kind: argument
                            nthChild:
                              position: 3
                              ofRule:
                                not:
                                  kind: comment
                - has:
                    field: name
                    kind: identifier
                    regex: '^arguments$'
    - kind: object_creation_expression
      all:
        - has:
            field: type
            regex: '^(?:global::)?(?:System\.Diagnostics\.)?ProcessStartInfo$'
        - has:
            field: arguments
            kind: argument_list
            has:
              kind: argument
              has:
                matches: dynamic-arg-text
              any:
                - all:
                    - nthChild:
                        position: 2
                        ofRule:
                          not:
                            kind: comment
                    - not:
                        has:
                          field: name
                          kind: identifier
                    - inside:
                        kind: argument_list
                        not:
                          has:
                            kind: argument
                            nthChild:
                              position: 3
                              ofRule:
                                not:
                                  kind: comment
                - has:
                    field: name
                    kind: identifier
                    regex: '^arguments$'
    - kind: assignment_expression
      all:
        - has:
            field: left
            kind: member_access_expression
            regex: '\.StartInfo\.Arguments$'
        - has:
            field: right
            matches: dynamic-arg-text
    - kind: assignment_expression
      all:
        - pattern: $X.Arguments = $V
        - has:
            field: right
            matches: dynamic-arg-text
        - inside:
            stopBy: end
            any:
              - kind: method_declaration
              - kind: constructor_declaration
              - kind: local_function_statement
            has:
              stopBy: end
              kind: variable_declarator
              all:
                - has:
                    field: name
                    pattern: $X
                - has:
                    kind: object_creation_expression
                    has:
                      field: type
                      regex: '^(?:global::)?(?:System\.Diagnostics\.)?ProcessStartInfo$'
    - kind: assignment_expression
      all:
        - has:
            field: left
            regex: '^Arguments$'
        - has:
            field: right
            matches: dynamic-arg-text
        - inside:
            kind: initializer_expression
            inside:
              kind: object_creation_expression
              has:
                field: type
                regex: '^(?:global::)?(?:System\.Diagnostics\.)?ProcessStartInfo$'
