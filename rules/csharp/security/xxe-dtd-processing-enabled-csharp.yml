id: xxe-dtd-processing-enabled-csharp
language: csharp
severity: warning
message: >-
  XML DTD processing or an external entity resolver is enabled, which exposes
  the parser to XML external entity (XXE) attacks on untrusted input.
note: >-
  Matches assignment (statement or object initializer) of DtdProcessing.Parse,
  of ProhibitDtd = false, or of a new XmlUrlResolver to a member named
  DtdProcessing, ProhibitDtd or XmlResolver. DtdProcessing.Prohibit, Ignore
  and XmlResolver = null are not flagged. This is a single-file syntactic
  check; it does not resolve types or follow settings passed in from elsewhere.
rule:
  kind: assignment_expression
  any:
    - all:
        - has:
            field: left
            regex: '(?:^|\.)DtdProcessing$'
        - has:
            field: right
            regex: '(?:^|\.)DtdProcessing\.Parse$'
    - all:
        - has:
            field: left
            regex: '(?:^|\.)ProhibitDtd$'
        - has:
            field: right
            regex: '^false$'
    - all:
        - has:
            field: left
            regex: '(?:^|\.)XmlResolver$'
        - has:
            field: right
            kind: object_creation_expression
            has:
              field: type
              regex: '^(?:global::)?(?:System\.Xml\.)?XmlUrlResolver$'
metadata:
  rule_modified_at: '2026-11-16'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-11-16'
