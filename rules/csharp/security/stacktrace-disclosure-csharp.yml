id: stacktrace-disclosure-csharp
language: csharp
severity: warning
message: >-
  Developer exception middleware appears outside the then block of an
  IsDevelopment check.
note: >-
  This rule checks only single-file syntax. It does not establish the runtime
  environment, resolve method identities, or prove that stack traces are
  disclosed.
rule:
  kind: expression_statement
  pattern: '$APP.UseDeveloperExceptionPage($$$);'
  all:
    - not:
        inside:
          stopBy: end
          kind: block
          nthChild: 2
          inside:
            kind: if_statement
            has:
              nthChild: 1
              pattern: '$ENV.IsDevelopment()'
    - not:
        has:
          stopBy: end
          kind: ERROR
    - not:
        inside:
          stopBy: end
          kind: ERROR
metadata:
  rule_modified_at: '2026-10-05'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-05'
  created_at: '2026-09-11'
