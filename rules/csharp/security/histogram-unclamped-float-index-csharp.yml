id: histogram-unclamped-float-index-csharp
language: csharp
severity: warning
message: >-
  An integer cast of MathF.Round applied to a float product is used directly
  as an array index with no Math.Clamp inside the index expression.
note: >-
  Floating-point pixel formats can hold values outside the normalized range,
  so an unclamped float-to-index conversion writes out of bounds. The same
  pattern recurs in any histogram or lookup table indexed by a computed float.
  This is a single-file syntactic check; it does not prove the computed value
  is outside the valid index range.
rule:
  pattern: '$H[(int)MathF.Round(Vector4.Dot($V0, $V1) * 255)]++;'
metadata:
  rule_modified_at: '2026-10-11'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-11'
