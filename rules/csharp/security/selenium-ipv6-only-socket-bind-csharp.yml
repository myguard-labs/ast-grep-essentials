# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: selenium-ipv6-only-socket-bind-csharp
language: csharp
severity: warning
message: >-
  Socket is constructed with AddressFamily.InterNetworkV6 and no IPv4
  fallback; this can break on hosts without IPv6 support.
note: >-
  Matches the literal AddressFamily.InterNetworkV6 argument in a Socket
  constructor call. It does not check whether a bind occurs, whether an IPv4
  path or fallback exists, or whether dual-mode IPv6 is intended, and it does
  not resolve types or runtime values.
rule:
  pattern: 'new Socket(AddressFamily.InterNetworkV6, $$$ARGS)'
