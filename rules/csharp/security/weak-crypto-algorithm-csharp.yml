# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: weak-crypto-algorithm-csharp
language: csharp
severity: warning
message: >-
  A broken or weak cryptographic algorithm (MD5, SHA1, DES, TripleDES or RC2)
  is created. Use SHA-256 or stronger for hashing and AES-GCM for encryption.
note: >-
  Matches Create or HashData calls on MD5, SHA1, DES, TripleDES and RC2, and
  construction of their CryptoServiceProvider, Managed and Cng
  implementations. It does not decide whether the use is security relevant
  (for example a non-security checksum), and does not resolve types.
rule:
  any:
    - kind: invocation_expression
      has:
        field: function
        kind: member_access_expression
        regex: '^(?:System\.Security\.Cryptography\.)?(?:MD5|SHA1|DES|TripleDES|RC2)\.(?:Create|HashData)$'
    - kind: object_creation_expression
      has:
        field: type
        regex: '^(?:System\.Security\.Cryptography\.)?(?:MD5|SHA1|DES|TripleDES|RC2)(?:CryptoServiceProvider|Managed|Cng)$'
