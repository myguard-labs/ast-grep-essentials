  owasp: 'A08:2025|A08:2021'
  category: 'security'
  subcategory: 'insecure-deserialization'
  references: 'https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html|https://www.newtonsoft.com/json/help/html/SerializationSettings.htm#TypeNameHandling'
