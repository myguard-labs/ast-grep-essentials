  owasp: 'A05:2025|A03:2021'
  category: 'security'
  subcategory: 'sql-injection'
  references: 'https://cheatsheetseries.owasp.org/cheatsheets/Query_Parameterization_Cheat_Sheet.html|https://cwe.mitre.org/data/definitions/89.html'
