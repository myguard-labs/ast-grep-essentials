id: httponly-false-csharp
language: csharp
severity: warning
message: >-
  Explicitly disabled HttpOnly flag on Cookie configuration or a CookieOptions
  initializer.
note: >-
  Matches literal false assignments to a member ending in .Cookie.HttpOnly or
  to HttpOnly directly within a fully qualified
  Microsoft.AspNetCore.Http.CookieOptions initializer. This is a single-file
  syntactic check; it does not resolve types, runtime policy, or omitted
  flags.
rule:
  all:
    - pattern: '$TARGET = false'
    - not:
        all:
          - has:
              field: left
              regex: '^HttpOnly$'
          - not:
              inside:
                kind: initializer_expression
                inside:
                  kind: object_creation_expression
                  regex: '^new\s+Microsoft\.AspNetCore\.Http\.CookieOptions\s*(?:\(\s*\))?\s*\{'
constraints:
  TARGET:
    regex: '^(?:HttpOnly|.+\.Cookie\.HttpOnly)$'
metadata:
  rule_modified_at: '2026-10-05'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-05'
  created_at: '2026-09-11'
