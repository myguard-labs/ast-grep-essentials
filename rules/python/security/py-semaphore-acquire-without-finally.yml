id: py-semaphore-acquire-without-finally
language: python
severity: warning
message: >-
  An awaited .acquire() on a limiter-like object is not inside an async with
  block or a try statement that has a finally clause.
note: >-
  Syntactic check only. It matches a literal limiter.acquire() statement
  directly followed by any awaited call in the same async function body. It
  does not resolve types, confirm the object is a semaphore, or prove a
  release on other paths.
rule:
  pattern: |
    async def $V0($V1):
        await limiter.acquire()
        await $C
metadata:
  rule_modified_at: '2026-10-13'
  ast_grep_tested_version: 0.50.0
