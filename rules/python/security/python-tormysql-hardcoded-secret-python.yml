                has:
                  kind: assignment
                  all:
                    - has:
                        kind: identifier
                        nthChild: 1
                        pattern: $PASSWORD
                    - has:
                        kind: string
                        has:
                          kind: string_content
          - follows:
              stopBy: end
              kind: expression_statement
              has:
                kind: assignment
                all:
                  - has:
                      kind: identifier
                      nthChild: 1
                      pattern: $PASSWORD
                  - has:
                      kind: string
                      has:
                        kind: string_content
      - any:
          - inside:
              stopBy: end
