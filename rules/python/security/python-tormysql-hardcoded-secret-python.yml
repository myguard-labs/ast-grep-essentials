  UPSTREAM_UTIL_003:
    kind: call
    all:
      - has:
          kind: identifier
          nthChild: 1
          pattern: $VAR
      - has:
          kind: argument_list
          has:
            kind: keyword_argument
            all:
              - has:
                  kind: identifier
                  nthChild: 1
                  regex: ^(password|passwd)$
              - has:
                  kind: string
                  has:
                    kind: string_content
      - any:
          - inside:
              stopBy: end
              follows:
                stopBy: end
                kind: import_from_statement
                pattern: from tormysql import ConnectionPool as $VAR
          - follows:
              stopBy: end
              kind: import_from_statement
              pattern: from tormysql import ConnectionPool as $VAR

  UPSTREAM_UTIL_004:
    kind: call
    all:
      - has:
          kind: identifier
          nthChild: 1
          pattern: $VAR
      - has:
          kind: argument_list
          has:
            kind: keyword_argument
