id: python-tormysql-hardcoded-secret-python
language: python
severity: warning
message: >-
  A secret is hard-coded in the application. Secrets stored in source
  code, such as credentials, identifiers, and other types of sensitive data,
  can be leaked and used by internal or external malicious actors. Use
  environment variables to securely provide crede ntials and other secrets or
  retrieve them from a secure vault or Hardware Security Module (HSM).
note: >-
  [CWE-798]: Use of Hard-coded Credentials
  [OWASP A07:2021]: Identification and Authentication Failures
  [REFERENCES]
       https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

ast-grep-essentials: true

utils:
  python-tormysql-hardcoded-secret:
    kind: call
    all:
      - has:
          kind: attribute
          all:
            - has:
                kind: identifier
                nthChild: 1
                regex: ^tormysql$
            - has:
                kind: identifier
                nthChild: 2
                regex: ^ConnectionPool$
      - has:
          kind: argument_list
          has:
            kind: keyword_argument
            all:
              - has:
                  kind: identifier
                  nthChild: 1
                  regex: ^(password|passwd)$
              - has:
                  kind: string
                  has:
                    kind: string_content

  python-tormysql-hardcoded-secret_INSTANCE:
    kind: call
    all:
      - has:
          kind: attribute
          all:
            - has:
                kind: identifier
                nthChild: 1
                regex: ^tormysql$
            - has:
                kind: identifier
                nthChild: 2
                regex: ^ConnectionPool$
      - has:
          kind: argument_list
          has:
            kind: keyword_argument
            all:
              - has:
                  kind: identifier
                  nthChild: 1
                  regex: ^(password|passwd)$
              - has:
                  kind: identifier
                  nthChild: 2
                  pattern: $PASSWORD
      - any:
          - inside:
              stopBy: end
              follows:
                stopBy: end
                kind: expression_statement
                has:
                  kind: assignment
                  all:
                    - has:
                        kind: identifier
                        nthChild: 1
                        pattern: $PASSWORD
                    - has:
                        kind: string
                        has:
                          kind: string_content
          - follows:
              stopBy: end
              kind: expression_statement
              has:
                kind: assignment
                all:
                  - has:
                      kind: identifier
                      nthChild: 1
                      pattern: $PASSWORD
                  - has:
                      kind: string
                      has:
                        kind: string_content

  UPSTREAM_UTIL_001:
    kind: call
    all:
      - has:
          kind: identifier
          nthChild: 1
          regex: ^ConnectionPool$
      - has:
          kind: argument_list
          has:
            kind: keyword_argument
            all:
              - has:
                  kind: identifier
                  nthChild: 1
                  regex: ^(password|passwd)$
              - has:
                  kind: string
                  has:
                    kind: string_content
      - any:
          - inside:
              stopBy: end
              follows:
                stopBy: end
                kind: import_from_statement
                pattern: from tormysql import ConnectionPool
          - follows:
              stopBy: end
              kind: import_from_statement
              pattern: from tormysql import ConnectionPool

