          - inside:
              stopBy: end
              follows:
                stopBy: end
                kind: expression_statement
                has:
                  kind: assignment
                  all:
                    - has:
                        kind: identifier
                        nthChild: 1
                        pattern: $PASSWORD
                    - has:
                        kind: string
                        has:
                          kind: string_content
          - follows:
              stopBy: end
              kind: expression_statement
              has:
                kind: assignment
                all:
                  - has:
                      kind: identifier
                      nthChild: 1
                      pattern: $PASSWORD
                  - has:
                      kind: string
                      has:
                        kind: string_content
      - any:
          - inside:
              stopBy: end
              follows:
                stopBy: end
                kind: import_from_statement
                pattern: from tormysql import ConnectionPool as $VAR
          - follows:
              stopBy: end
              kind: import_from_statement
              pattern: from tormysql import ConnectionPool as $VAR

rule:
  any:
    - matches: python-tormysql-hardcoded-secret
    - matches: python-tormysql-hardcoded-secret_INSTANCE
    - matches: UPSTREAM_UTIL_001
    - matches: UPSTREAM_UTIL_002
    - matches: UPSTREAM_UTIL_003
    - matches: UPSTREAM_UTIL_004
