id: py-lstat-before-read-bytes
language: python
severity: warning
message: Path metadata is checked before a separate read_bytes call.
note: >-
  This matches the shown function syntax with repeated receiver expressions;
  it does not establish runtime path identity, method behavior, or
  exploitability.
rule:
  pattern: |
    def $FUNC($$$PARAMS) -> $RETURN:
        $META = $PATH.lstat()
        if not $STAT.S_ISREG($META.st_mode):
            $$$REJECTION
        return $PATH.read_bytes()
