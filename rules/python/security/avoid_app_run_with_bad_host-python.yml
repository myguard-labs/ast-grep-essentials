id: avoid_app_run_with_bad_host-python
language: python
severity: warning
message: Running app.run with a literal 0.0.0.0 host may expose the server publicly.
note: >-
  This rule checks only app.run call syntax with a direct positional or host
  keyword string literal; it does not establish Flask identity or runtime
  exposure.
utils:
  app_run:
    kind: call
    has:
      stopBy: neighbor
      kind: attribute
      all:
        - has:
            stopBy: neighbor
            kind: identifier
            regex: '^app$'
        - has:
            stopBy: neighbor
            kind: identifier
            regex: '^run$'
  wildcard_host:
    kind: string
    regex: '^("0\.0\.0\.0"|''0\.0\.0\.0'')$'
rule:
  all:
    - matches: app_run
    - has:
        stopBy: neighbor
        kind: argument_list
        any:
          - has:
              stopBy: neighbor
              matches: wildcard_host
          - has:
              stopBy: neighbor
              kind: keyword_argument
              all:
                - has:
                    stopBy: neighbor
                    kind: identifier
                    regex: '^host$'
                - has:
                    stopBy: neighbor
                    matches: wildcard_host
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
  created_at: '2026-09-11'
