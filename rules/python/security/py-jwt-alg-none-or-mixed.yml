id: py-jwt-alg-none-or-mixed
language: python
severity: error
message: >-
  JWT algorithm list accepts the none algorithm or mixes symmetric with
  asymmetric families. With none the signature is skipped entirely; with HMAC
  accepted alongside RSA or ECDSA the public key doubles as an HMAC secret and a
  caller who has it forges tokens. Pin exactly one algorithm on both encode and
  decode.
note: >-
  Fires on an algorithms list or an algorithm keyword containing the string none,
  and on an algorithms list containing both an HS entry and an RS, ES or PS
  entry. A list assembled from configuration or a constant defined elsewhere is
  not seen. A deliberate rollover window that accepts two algorithms of the same
  family is not matched and is the routine dismissal for two-entry lists.
utils:
  alg-none:
    kind: string
    regex: '^["'']\s*[Nn][Oo][Nn][Ee]\s*["'']$'
  alg-hmac:
    kind: string
    regex: '^["'']HS(256|384|512)["'']$'
  alg-asymmetric:
    kind: string
    regex: '^["''](RS|ES|PS)(256|384|512)["'']$'
rule:
  kind: keyword_argument
  all:
    - has: {field: name, regex: '^algorithms?$'}
    - has:
        field: value
        any:
          - matches: alg-none
          - kind: list
            has: {matches: alg-none}
          - kind: list
            all:
              - has: {matches: alg-hmac}
              - has: {matches: alg-asymmetric}
