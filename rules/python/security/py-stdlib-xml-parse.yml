id: py-stdlib-xml-parse
language: python
severity: warning
message: >-
  XML parser call detected. Review whether document input is untrusted and
  whether a hardened XML parser is required.
note: >-
  Matches parser calls through the listed receiver names, including
  parenthesized receivers. This is a single-file syntactic check: receiver
  names do not establish module identity, input trust, parser configuration,
  or vulnerability. Calls explicitly qualified through defusedxml are
  excluded.
rule:
  kind: call
  has:
    field: function
    all:
      - kind: attribute
      - regex: >-
          ^\(*\s*([A-Za-z_][A-Za-z0-9_]*\.)*((sax|minidom|pulldom)\s*\)*\.(parse|parseString|make_parser)|(ElementTree|ET)\s*\)*\.(parse|fromstring|XMLParser))$
      - not:
          regex: '^\(*\s*defusedxml\.'
