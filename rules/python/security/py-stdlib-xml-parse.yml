id: py-stdlib-xml-parse
language: python
severity: warning
message: >-
  Standard-library XML parser used on document input. xml.sax and xml.dom.pulldom
  resolve external entities, and every stdlib parser expands nested entities, so
  untrusted XML yields local-file disclosure or a billion-laughs memory blowup.
  Parse untrusted documents with the defusedxml equivalents instead.
note: >-
  Fires on a qualified xml.sax, minidom, pulldom or ElementTree parse, parseString,
  fromstring or make_parser call. A defusedxml module bound to the same short
  name, such as an ElementTree alias, is indistinguishable here; a call written
  through the defusedxml prefix is excluded, as is a document
  the deployment generated itself, which is the routine dismissal.
utils:
  stdlib-xml-parse-call:
    kind: attribute
    any:
      - all:
          - has:
              field: object
              regex: '(^|\.)(sax|minidom|pulldom)$'
          - has: {field: attribute, regex: '^(parse|parseString|make_parser)$'}
      - all:
          - has:
              field: object
              regex: '(^|\.)(ElementTree|ET)$'
          - has: {field: attribute, regex: '^(parse|fromstring|XMLParser)$'}
rule:
  kind: call
  has:
    field: function
    all:
      - matches: stdlib-xml-parse-call
      - not:
          regex: '^defusedxml\.'
