id: py-jinja2-autoescape-off
language: python
severity: warning
message: >-
  Environment construction lacks autoescape=True or a call whose function is
  named select_autoescape. Review autoescaping when rendering HTML.
note: >-
  This is a single-file syntactic check of constructor and helper names. It
  does not resolve imports, verify helper behavior, determine output format,
  or track later configuration.
utils:
  autoescape-enabled:
    kind: keyword_argument
    all:
      - has:
          field: name
          regex: '^autoescape$'
      - has:
          field: value
          not:
            all:
              - not:
                  regex: '^True$'
              - not:
                  kind: call
                  has:
                    field: function
                    not:
                      all:
                        - not:
                            kind: identifier
                            regex: '^select_autoescape$'
                        - not:
                            kind: attribute
                            has:
                              field: attribute
                              regex: '^select_autoescape$'
rule:
  kind: call
  all:
    - has:
        field: function
        not:
          all:
            - not:
                kind: identifier
                regex: '^(Environment|SandboxedEnvironment|NativeEnvironment)$'
            - not:
                kind: attribute
                has:
                  field: attribute
                  regex: '^(Environment|SandboxedEnvironment|NativeEnvironment)$'
    - not:
        has:
          field: arguments
          has:
            matches: autoescape-enabled
metadata:
  rule_modified_at: '2026-10-06'
