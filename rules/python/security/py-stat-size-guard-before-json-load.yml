  taxonomy_source: 'https://cwe.mitre.org/data/definitions/770.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - |-
      def load(path) -> dict:
          if path.stat().st_size >= LIMIT:
              raise
          with path.open('rb') as stream:
              return json.load(stream)
