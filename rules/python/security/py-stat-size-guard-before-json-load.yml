# https://deb.myguard.nl/ast-grep-security-rules-pack | https://github.com/myguard-labs/ast-grep-essentials

id: py-stat-size-guard-before-json-load
language: python
severity: warning
message: A stat size check before json.load does not impose a read-time byte limit.
note: >-
  This matches only the shown function syntax with repeated receiver and
  stream expressions; it does not establish runtime identities, types, or file
  growth.
rule:
  pattern: |
    def $FUNC($$$PARAMS):
        if $PATH.stat().st_size > $LIMIT:
            raise $ERROR
        with $PATH.open("rb") as $STREAM:
            return json.load($STREAM)
