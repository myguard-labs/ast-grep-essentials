id: py-django-debug-true
language: python
severity: warning
message: >-
  Module-level DEBUG is assigned literal True. Disable debug mode in
  production to avoid exposing diagnostic details.
note: >-
  Matches a direct module-level assignment to bare DEBUG with literal True,
  including chains through bare ASCII identifiers ending in literal True. This
  is a single-file syntax check; it does not establish that Django loads this
  module or that the deployment is production.
rule:
  kind: assignment
  all:
    - has:
        field: left
        kind: identifier
        regex: '^DEBUG$'
    - has:
        field: right
        regex: '^(?:[A-Za-z_][A-Za-z0-9_]*\s*=\s*)*True$'
    - inside:
        kind: expression_statement
        inside:
          kind: module
