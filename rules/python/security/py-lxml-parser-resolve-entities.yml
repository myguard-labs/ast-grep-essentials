id: py-lxml-parser-resolve-entities
language: python
severity: warning
message: >-
  XMLParser construction lacks a literal False or 'internal' value for
  resolve_entities. For untrusted XML, configure entity handling explicitly.
note: >-
  Matches bare or qualified XMLParser and ETCompatXMLParser calls without
  resolve_entities set to literal False, including whitespace-separated
  parentheses around False, or an unparenthesized 'internal' string.
  Standard-library-style ElementTree receivers are excluded. This is a
  single-file syntactic check; it does not establish import identity, input
  trust, runtime configuration, or entity expansion behavior.
rule:
  kind: call
  all:
    - has:
        field: function
        all:
          - not:
              all:
                - not:
                    kind: identifier
                - not:
                    kind: attribute
          - regex: '(^|\.)(XMLParser|ETCompatXMLParser)$'
          - not:
              has:
                field: object
                regex: '(?i)(^|\.)(ET|ElementTree|xml\.etree\.ElementTree|cElementTree)$'
    - not:
        has:
          field: arguments
          has:
            kind: keyword_argument
            all:
              - has:
                  field: name
                  regex: '^resolve_entities$'
              - has:
                  field: value
                  regex: '^(False|["\x27]internal["\x27]|\(\s*(\(\s*)*False\s*(\)\s*)*\))$'
