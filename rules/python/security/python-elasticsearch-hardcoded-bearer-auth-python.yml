id: python-elasticsearch-hardcoded-bearer-auth-python
language: python
severity: warning
message: >-
  A literal bearer token is supplied directly to elasticsearch.Elasticsearch.
  Provide credentials through secure configuration.
note: >-
  This rule detects only direct bearer_auth keyword arguments with a
  string_content node in their string value. It does not establish whether the
  value is a secret or resolve aliases, types, or runtime values.
utils:
  UPSTREAM_UTIL_001:
    kind: call
    all:
      - has:
          stopBy: neighbor
          kind: attribute
          regex: '^elasticsearch\.Elasticsearch$'
      - has:
          stopBy: neighbor
          kind: argument_list
          all:
            - has:
                stopBy: neighbor
                kind: keyword_argument
                all:
                  - has:
                      stopBy: neighbor
                      kind: identifier
                      regex: '^bearer_auth$'
                  - has:
                      stopBy: neighbor
                      kind: string
                      has:
                        stopBy: end
                        kind: string_content
            - not:
                has:
                  stopBy: neighbor
                  kind: keyword_argument
                  all:
                    - has:
                        stopBy: neighbor
                        kind: identifier
                        regex: '^bearer_auth$'
                    - has:
                        stopBy: neighbor
                        kind: string
                        not:
                          has:
                            stopBy: end
                            kind: string_content
rule:
  kind: call
  matches: UPSTREAM_UTIL_001
  not:
    all:
      - has:
          stopBy: end
          kind: ERROR
      - inside:
          stopBy: end
          kind: ERROR
