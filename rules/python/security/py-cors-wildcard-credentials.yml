id: py-cors-wildcard-credentials
language: python
severity: warning
message: >-
  Cross-origin credentials enabled next to a wildcard origin. Any site the
  victim visits can then issue authenticated requests to this API and read the
  responses, which is a full session-riding read of the user's data. List the
  exact origins allowed to send credentials.
note: >-
  Fires on a CORS or CORSMiddleware configuration that both enables credentials
  and either names the wildcard origin, directly or nested inside a Flask-CORS
  resources mapping, or omits the origin setting, where the library default is
  the wildcard. An origin list built from configuration is
  not seen. A deployment whose configured origins are all first-party is the
  routine dismissal, provided the wildcard cannot reach the value.
utils:
  credentials-enabled:
    kind: keyword_argument
    all:
      - has: {field: name, regex: '^(supports_credentials|allow_credentials)$'}
      - has: {field: value, regex: '^True$'}
  origin-setting:
    kind: keyword_argument
    has: {field: name, regex: '^(origins|allow_origins|resources)$'}
  wildcard-origin:
    kind: keyword_argument
    all:
      - has: {field: name, regex: '^(origins|allow_origins|resources)$'}
      - has:
          field: value
          any:
            - kind: string
              regex: '^["'']\*["'']$'
            - has:
                stopBy: end
                kind: string
                regex: '^["'']\*["'']$'
rule:
  kind: call
  all:
    - has:
        field: function
        regex: '(^|\.)(CORS|add_middleware)$'
    - has:
        field: arguments
        has: {matches: credentials-enabled}
    - has:
        field: arguments
        any:
          - has: {matches: wildcard-origin}
          - not:
              has: {matches: origin-setting}
