id: py-cors-wildcard-credentials
language: python
severity: warning
message: >-
  Cross-origin credentials enabled next to a wildcard origin. Any site the
  victim visits can then issue authenticated requests to this API and read the
  responses, which is a full session-riding read of the user's data. List the
  exact origins allowed to send credentials.
note: >-
  Fires on a CORS or CORSMiddleware configuration that both enables credentials
  and either names the wildcard origin, directly or under an origins key nested inside a
  Flask-CORS resources mapping, or, for Flask-CORS only, omits the origin setting, where the
  library default is the wildcard. Starlette and FastAPI default allow_origins
  to the empty tuple, so add_middleware requires an explicit wildcard and a
  configuration using only allow_origin_regex is not matched. An origin list built from configuration is
  not seen. A deployment whose configured origins are all first-party is the
  routine dismissal, provided the wildcard cannot reach the value.
utils:
  credentials-enabled:
    kind: keyword_argument
    all:
      - has: {field: name, regex: '^(supports_credentials|allow_credentials)$'}
      - has: {field: value, regex: '^True$'}
  origin-setting:
    kind: keyword_argument
    has: {field: name, regex: '^(origins|allow_origins|resources)$'}
  wildcard-origin:
    kind: keyword_argument
    all:
      - any:
          - all:
              - has: {field: name, regex: '^(origins|allow_origins)$'}
              - has:
                  field: value
                  any:
                    - kind: string
                      regex: '^["'']\*["'']$'
                    - has:
                        stopBy: end
                        kind: string
                        regex: '^["'']\*["'']$'
          - all:
              - has: {field: name, regex: '^resources$'}
              - has:
                  field: value
                  has:
                    stopBy: end
                    kind: pair
                    all:
                      - has:
                          field: key
                          regex: '^["''](origins|allow_origins)["'']$'
                      - has:
                          field: value
                          any:
                            - kind: string
                              regex: '^["'']\*["'']$'
                            - has:
                                stopBy: end
                                kind: string
                                regex: '^["'']\*["'']$'
rule:
  any:
    - kind: call
      all:
        - has: {field: function, regex: '(^|\.)CORS$'}
        - has: {field: arguments, has: {matches: credentials-enabled}}
        - has:
            field: arguments
            any:
              - has: {matches: wildcard-origin}
              - not: {has: {matches: origin-setting}}
    - kind: call
      all:
        - has: {field: function, regex: '(^|\.)add_middleware$'}
        - has: {field: arguments, has: {matches: credentials-enabled}}
        - has: {field: arguments, has: {matches: wildcard-origin}}
