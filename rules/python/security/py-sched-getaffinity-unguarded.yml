id: py-sched-getaffinity-unguarded
language: python
severity: warning
message: >-
  os.sched_getaffinity(...) is called outside a try block; it can raise
  OSError on some kernels and containers.
note: >-
  Syntactic check only. Matches a literal os.sched_getaffinity call not nested
  in any try block; it does not verify whether an enclosing handler catches
  OSError, nor resolve the os alias or runtime platform support.
rule:
  all:
    - pattern: 'os.sched_getaffinity($$$ARGS)'
    - not:
        inside:
          kind: try_statement
          stopBy: end
