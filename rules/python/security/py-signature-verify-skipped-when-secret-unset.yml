id: py-signature-verify-skipped-when-secret-unset
language: python
severity: warning
message: >-
  Signature verification is inside an if-guard on a secret with no else
  branch, so it is skipped when the secret is unset.
note: >-
  Syntactic check only. Matches a verify_signature call nested under an if
  statement whose condition is the bare name secret and that has no else
  clause in that if statement; it does not resolve types, values, or whether
  the guard is reachable.
rule:
  all:
    - pattern: 'verify_signature($$$ARGS)'
    - inside:
        kind: if_statement
        stopBy: end
        has:
          field: condition
          regex: '^secret$'
    - not:
        inside:
          kind: if_statement
          stopBy: end
          has:
            kind: else_clause
            stopBy: end
