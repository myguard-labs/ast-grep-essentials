id: py-tempdir-assigned-without-cleanup-guard
language: python
severity: warning
message: >-
  An __enter__ method assigns tempfile.TemporaryDirectory() to an attribute
  and contains no try statement.
note: >-
  Syntactic only. Matches any function whose text starts with def __enter__(
  and contains a self attribute assigned from tempfile.TemporaryDirectory()
  with no try statement anywhere in the body. Does not check class context,
  whether later statements can fail, or cleanup elsewhere such as __exit__. An
  unrelated try in the method suppresses the match.
rule:
  all:
    - kind: function_definition
    - regex: '^def __enter__\('
    - has:
        pattern: 'self.$ATTR = tempfile.TemporaryDirectory()'
        stopBy: end
    - not:
        has:
          kind: try_statement
          stopBy: end
metadata:
  rule_modified_at: '2026-10-13'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-13'
