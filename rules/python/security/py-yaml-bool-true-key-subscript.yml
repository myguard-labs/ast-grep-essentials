id: py-yaml-bool-true-key-subscript
language: python
severity: warning
message: >-
  Subscript with literal True key on a mapping; YAML 1.1 bare on: loads as
  True, so lookups by 'on' miss this key.
note: >-
  Single-file syntactic check for a literal True subscript key. It does not
  verify that the receiver is a YAML-loaded mapping, nor resolve types,
  aliases, or runtime values.
rule:
  pattern: '$X[True]'
