id: py-flask-hardcoded-secret-key
language: python
severity: warning
message: >-
  Session signing key assigned from a string literal. Anyone who reads the
  source or the image can mint valid session cookies and signed tokens, so the
  key is an authentication bypass the moment the repository leaves the team.
  Read it from the environment or a secret store and rotate the committed value.
note: >-
  Fires on an assignment to secret_key, to a SECRET_KEY subscript or to a bare
  SECRET_KEY name, where the right-hand side is a plain string literal with no
  interpolation. A key read from the environment, a call or a variable is not
  matched. A placeholder in an example or test module is the routine dismissal;
  the value still must not be the one a deployment falls back to.
utils:
  plain-string-literal:
    kind: string
    not:
      has:
        kind: interpolation
  secret-key-target:
    any:
      - kind: attribute
        has: {field: attribute, regex: '^secret_key$'}
      - kind: subscript
        has:
          field: subscript
          regex: '^["'']SECRET_KEY["'']$'
      - kind: identifier
        regex: '^SECRET_KEY$'
rule:
  kind: assignment
  all:
    - has: {field: left, matches: secret-key-target}
    - has: {field: right, matches: plain-string-literal}
