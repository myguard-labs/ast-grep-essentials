# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-eval-exec
language: python
severity: warning
message: >-
  eval()/exec() call requires review. It executes Python code and can allow
  code execution when its argument carries external input. Use a
  format-specific parser with input limits for untrusted data, or a dispatch
  table for commands. Recommend ast.literal_eval only for trusted,
  resource-bounded input; it can exhaust memory, stack, or CPU.
note: >-
  Fires on direct eval/exec calls and on builtins.eval/builtins.exec attribute
  calls. Syntactic only: names are not resolved, so aliased imports such as
  'import builtins as b' are not matched and a shadowed non-builtin name with
  the same spelling would still be flagged. Attribute calls on any other
  receiver (e.g. runner.eval, ast.literal_eval) are not matched. Dismiss only
  if the argument is a hardcoded literal and provably never derives from
  input.
rule:
  any:
    - kind: call
      has:
        field: function
        kind: identifier
        regex: '^(eval|exec)$'
    - kind: call
      has:
        field: function
        all:
          - kind: attribute
          - has:
              field: attribute
              regex: '^(eval|exec)$'
          - has:
              field: object
              regex: '^builtins$'
