id: py-eval-exec
language: python
severity: warning
message: >-
  eval()/exec() call requires review. It executes Python code and can allow code
  execution when its argument carries external input. Prefer a narrow parser
  such as ast.literal_eval for data or a dispatch table for commands.
note: >-
  Fires on eval/exec with any argument. Dismiss only if the argument is a
  hardcoded literal and provably never derives from input.
rule:
  kind: call
  has:
    field: function
    regex: ^(eval|exec)$
