id: py-sql-string-build
language: python
severity: error
message: >-
  SQL statement assembled by string interpolation, concatenation or format.
  Whatever the interpolated value contains becomes statement syntax, so a caller
  who controls it reads or rewrites any table the connection can reach. Pass a
  fixed statement with placeholders and hand the values to the driver as
  parameters.
note: >-
  Fires when execute, executemany, executescript, raw or a SQLAlchemy text call
  receives a first argument that is an f-string with an interpolation, a
  concatenation or a percent expression involving a string literal, or a format
  call on a string literal. A statement built into a variable one statement
  earlier is not seen. Interpolating an identifier the code itself chose from a
  fixed set is the routine dismissal, and it still deserves a comment saying so.
utils:
  runtime-built-sql:
    any:
      - kind: string
        has:
          kind: interpolation
      - kind: binary_operator
        has:
          stopBy: end
          kind: string
      - kind: call
        has:
          field: function
          kind: attribute
          all:
            - has: {field: object, kind: string}
            - has: {field: attribute, regex: '^format$'}
rule:
  kind: call
  all:
    - has:
        field: function
        any:
          - kind: identifier
            regex: '^(text|RawSQL)$'
          - kind: attribute
            has:
              field: attribute
              regex: '^(execute|executemany|executescript|raw)$'
    - has:
        field: arguments
        has:
          nthChild:
            position: 1
            ofRule:
              not: {kind: comment}
          matches: runtime-built-sql
