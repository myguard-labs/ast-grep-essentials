# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-urllib-opener-default-proxy
language: python
severity: warning
message: >-
  build_opener() keeps the default ProxyHandler, which reads the HTTP_PROXY,
  HTTPS_PROXY and ALL_PROXY environment variables, so this opener sends its
  requests, and any credentials or tokens on them, through whatever proxy the
  environment names. An attacker who controls the environment can read or alter
  the traffic or steer it past an SSRF guard. Pass ProxyHandler({}) as one of
  the handlers to disable proxy discovery, or an explicit
  ProxyHandler({'https': PROXY_URL}) to pin a trusted proxy.
note: >-
  Fires on build_opener(...), urllib.request.build_opener(...) and
  request.build_opener(...) (also through a dotted prefix such as
  six.moves.urllib.request) unless an argument holds a ProxyHandler call given a
  mapping, in any position or wrapped in another call (including one branch of a
  conditional expression, a known false negative). ProxyHandler() and
  ProxyHandler(None) still read the environment, so they are reported. A direct
  *handlers splat argument is not reported because its contents are unknown. A
  method called build_opener on any other object is not reported; a bare
  build_opener is assumed to be the urllib function, as an import cannot be
  checked here. Code that honours the proxy environment on purpose, such as a
  client for a corporate network, is the routine dismissal.
rule:
  kind: call
  all:
    - has:
        field: function
        any:
          - kind: identifier
            regex: '^build_opener$'
          - kind: attribute
            all:
              - has: {field: attribute, regex: '^build_opener$'}
              - has: {field: object, regex: '^((\w+\.)*urllib\.request|request)$'}
    - not:
        has:
          field: arguments
          has:
            kind: list_splat
    - not:
        has:
          field: arguments
          has:
            stopBy: end
            kind: call
            all:
              - has:
                  field: function
                  regex: 'ProxyHandler$'
              - has:
                  field: arguments
                  has:
                    any:
                      - kind: dictionary
                      - kind: dictionary_comprehension
                      - kind: identifier
                      - kind: attribute
                      - kind: subscript
                      - kind: call
                      - kind: keyword_argument
                        has:
                          field: value
                          not:
                            kind: none
metadata:
  cwe: 'CWE-441|CWE-200'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/441.html|https://cwe.mitre.org/data/definitions/200.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A01:2025'
  known_false_positives: 'A ProxyHandler built earlier and passed by variable, a ProxyHandler subclass whose name does not end in ProxyHandler, and an opener that deliberately honours the proxy environment are reported'
  known_false_negatives: 'A build_opener bound to another name or reached through an aliased module (import urllib.request as ur), a method on another object, any call carrying a direct *handlers splat, and an argument that only holds a ProxyHandler mapping in one branch of a conditional expression are not reported'
  rule_modified_at: '2026-11-19'
  ast_grep_tested_version: 0.51.3
  validated_at: '2026-11-19'
  created_at: '2026-11-19'
  source: 'MyGuard'
  modified_by: MyGuard
