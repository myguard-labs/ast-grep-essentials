id: py-zipfile-extractall
language: python
severity: warning
message: >-
  Archive extracted wholesale. A crafted archive can carry parent-directory
  entries or absolute paths that land outside the destination, or expand to
  orders of magnitude more than its own size and fill the disk. Iterate the
  member list, reject names that escape the destination, cap the declared sizes,
  and extract members one at a time.
note: >-
  Fires on an extractall call and on shutil.unpack_archive. A receiver named for
  a tar archive is excluded because py-tarfile-extractall owns that case and
  prescribes the tar-specific extraction filter; a tar receiver under any other
  name still matches here and gets the generic advice. The matcher cannot
  otherwise tell a zip, tar or wheel receiver apart, nor whether the archive came
  from a user. An archive the deployment produced and stores under a path no
  caller controls is the routine dismissal.
rule:
  kind: call
  has:
    field: function
    kind: attribute
    any:
      - all:
          - has: {field: attribute, regex: '^extractall$'}
          - not: {has: {field: object, regex: '(?i)(^|\.)(tar|tarfile|tf|tgz)$'}}
      - all:
          - has: {field: object, regex: '^shutil$'}
          - has: {field: attribute, regex: '^unpack_archive$'}
