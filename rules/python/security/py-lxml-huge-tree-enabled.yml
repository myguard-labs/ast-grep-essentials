# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-lxml-huge-tree-enabled
language: python
severity: warning
message: >-
  huge_tree=True lifts the libxml2 limits on tree depth, text size and entity
  expansion, so a crafted document can exhaust memory. Leave it off for
  untrusted XML.
note: >-
  Matches a call with the keyword argument huge_tree=True, as used by lxml
  XMLParser, HTMLParser and iterparse. huge_tree=False, a variable value and
  calls without the keyword are not matched. A parser fed only trusted,
  size-limited files is the routine dismissal.

  [CWE-776] [A02:2025] [A05:2021]

  [REFERENCES]
      - https://lxml.de/parsing.html#parser-options
rule:
  kind: keyword_argument
  all:
    - has:
        field: name
        regex: '^huge_tree$'
    - has:
        field: value
        kind: 'true'
    - inside:
        kind: argument_list
        inside:
          kind: call
metadata:
  created_at: '2026-11-16'
