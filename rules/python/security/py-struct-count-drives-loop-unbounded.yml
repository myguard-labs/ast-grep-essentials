# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-struct-count-drives-loop-unbounded
language: python
severity: warning
message: >-
  Count from struct.unpack is used as a range() bound in a function with no
  comparison; validate the count before looping.
note: >-
  Single-file syntactic heuristic. It matches range() calls inside a function
  that contains a struct.unpack call and no comparison operator anywhere in
  that function. It does not track which value flows into range(), does not
  confirm attacker control, and does not check reachability or guards outside
  the shown syntax.
rule:
  all:
    - pattern: 'range($N)'
    - inside:
        kind: function_definition
        stopBy: end
        all:
          - has:
              pattern: 'struct.unpack($$$ARGS)'
              stopBy: end
          - not:
              has:
                kind: comparison_operator
                stopBy: end
