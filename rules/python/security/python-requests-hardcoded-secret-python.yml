id: python-requests-hardcoded-secret-python
language: python
severity: warning
message: >-
  A recognized authentication constructor receives a nonempty string literal
  as its second positional argument.
note: >-
  This rule checks constructor spelling, literal syntax, and preceding import
  syntax in one file. It does not establish runtime identity, secret
  sensitivity, or binding resolution.
utils:
  literal_arguments:
    kind: argument_list
    not:
      has:
        nthChild: 3
    has:
      stopBy: neighbor
      kind: string
      nthChild: 2
      has:
        stopBy: end
        kind: string_content
  qualified:
    kind: call
    all:
      - has:
          stopBy: neighbor
          kind: attribute
          regex: '^requests\.auth\.HTTP(Basic|Digest|Proxy)Auth$'
      - has:
          stopBy: neighbor
          matches: literal_arguments
  basic:
    kind: call
    all:
      - has:
          stopBy: neighbor
          kind: identifier
          regex: '^HTTPBasicAuth$'
      - has:
          stopBy: neighbor
          matches: literal_arguments
      - not:
          all:
            - not:
                follows:
                  stopBy: end
                  kind: import_from_statement
                  pattern: from requests.auth import HTTPBasicAuth
            - not:
                inside:
                  stopBy: end
                  follows:
                    stopBy: end
                    kind: import_from_statement
                    pattern: from requests.auth import HTTPBasicAuth
  proxy:
    kind: call
    all:
      - has:
          stopBy: neighbor
          kind: identifier
          regex: '^HTTPProxyAuth$'
      - has:
          stopBy: neighbor
          matches: literal_arguments
      - not:
          all:
            - not:
                follows:
                  stopBy: end
                  kind: import_from_statement
                  pattern: from requests.auth import HTTPDigestAuth
            - not:
                inside:
                  stopBy: end
                  follows:
                    stopBy: end
                    kind: import_from_statement
                    pattern: from requests.auth import HTTPProxyAuth
  digest:
    kind: call
    all:
      - has:
          stopBy: neighbor
          kind: identifier
          regex: '^HTTPDigestAuth$'
      - has:
          stopBy: neighbor
          matches: literal_arguments
      - not:
          all:
            - not:
                follows:
                  stopBy: end
                  kind: import_from_statement
                  pattern: from requests.auth import HTTPDigestAuth
            - not:
                inside:
                  stopBy: end
                  follows:
                    stopBy: end
                    kind: import_from_statement
                    pattern: from requests.auth import HTTPDigestAuth
rule:
  kind: call
  all:
    - not:
        all:
          - not:
              matches: qualified
          - not:
              matches: basic
          - not:
              matches: proxy
          - not:
              matches: digest
    - not:
        all:
          - has:
              stopBy: end
              kind: ERROR
          - inside:
              stopBy: end
              kind: ERROR
