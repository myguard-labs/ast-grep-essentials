id: py-jinja-environment-autoescape-false
language: python
severity: warning
message: 'Review this jinja2 Environment call that passes autoescape=False.'
note: >-
  Matches the literal syntax Environment(...) with an autoescape=False keyword
  argument in this file. It does not resolve imports, aliases, or runtime
  values, and does not verify whether templates are safe.
rule:
  pattern: 'Environment(autoescape=False)'
