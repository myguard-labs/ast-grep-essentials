# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-jinja-environment-autoescape-false
language: python
severity: warning
message: 'Review this jinja2 Environment call that passes autoescape=False.'
note: >-
  Matches the literal syntax Environment(...) with an autoescape=False keyword
  argument in this file. It does not resolve imports, aliases, or runtime
  values, and does not verify whether templates are safe.
rule:
  pattern: 'Environment(autoescape=False)'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-79'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/79.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  todo_cases:
    - |-
      import jinja2
      env = jinja2.Environment(autoescape=False)
    - |-
      from jinja2 import Environment
      env = Environment(autoescape=False, loader=loader)
    - |-
      from jinja2 import Environment
      env = Environment(loader=loader, autoescape=False)
