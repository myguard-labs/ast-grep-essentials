id: python-pyjwt-hardcoded-secret-python
language: python
severity: warning
message: >-
  A literal string is supplied as the JWT key. Retrieve secrets from an
  appropriate external source.
note: >-
  This rule detects only calls spelled jwt.encode or jwt.decode with a string
  literal as the second positional argument or the key keyword argument. It
  does not resolve imports, aliases, types, runtime values, or whether the
  literal is sensitive.
rule:
  kind: call
  all:
    - has:
        kind: attribute
        all:
          - has:
              kind: identifier
              regex: '^jwt$'
          - has:
              kind: identifier
              regex: '^(encode|decode)$'
    - has:
        kind: argument_list
        not:
          all:
            - not:
                has:
                  kind: string
                  nthChild: 2
            - not:
                has:
                  kind: keyword_argument
                  all:
                    - has:
                        kind: identifier
                        regex: '^key$'
                    - has:
                        kind: string
    - not:
        has:
          stopBy: end
          kind: ERROR
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
