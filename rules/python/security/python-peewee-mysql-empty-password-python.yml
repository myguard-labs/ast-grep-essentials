id: python-peewee-mysql-empty-password-python
severity: warning
language: python
message: >-
      The application creates a database connection with an empty password.
      This can lead to unauthorized access by either an internal or external
      malicious actor. To prevent this vulnerability, enforce authentication
      when connecting to a database by using environment variables to securely
      provide credentials or retrieving them from a secure vault or HSM
      (Hardware Security Module).
note: >-
  [CWE-287] Improper Authentication.
  [REFERENCES]
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

ast-grep-essentials: true

utils:
  UPSTREAM_UTIL_001:
    # $DB(..., password="...",...)
    kind: call
    all:
    - has:
        stopBy: neighbor
        pattern: $DB
        regex: ^MySQLDatabase$|^peewee.MySQLDatabase$|^MySQLConnectorDatabase$|^playhouse.mysql_ext.MySQLConnectorDatabase$|^MariaDBConnectorDatabase$|^playhouse.mysql_ext.MariaDBConnectorDatabase$|^PooledMySQLDatabase$|^playhouse.pool.PooledMySQLDatabase$
    - has:
        stopBy: neighbor
        kind: argument_list
        has:
          stopBy: neighbor
          kind: keyword_argument
          all:
            - has:
                stopBy: neighbor
                kind: identifier
                regex: ^password$|^passwd$
            - has:
                stopBy: neighbor
                kind: string
                not:
                  has:
                   stopBy: neighbor
                   kind: string_content
rule:
  kind: call
  matches: UPSTREAM_UTIL_001
  not:
    all:
      - has:
          stopBy: end
          kind: ERROR
      - inside:
          stopBy: end
          kind: ERROR
