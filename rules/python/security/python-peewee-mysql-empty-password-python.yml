id: python-peewee-mysql-empty-password-python
language: python
severity: warning
message: A database constructor is called with a syntactically empty password string.
note: >-
  This rule checks only the shown constructor names and literal password or
  passwd arguments in one file. It excludes strings containing interpolation
  and does not establish resolved constructor identities or runtime
  authentication behavior.
utils:
  EMPTY_PASSWORD_CALL:
    kind: call
    all:
      - has:
          stopBy: neighbor
          pattern: '$DB'
          regex: >-
            ^MySQLDatabase$|^peewee.MySQLDatabase$|^MySQLConnectorDatabase$|^playhouse.mysql_ext.MySQLConnectorDatabase$|^MariaDBConnectorDatabase$|^playhouse.mysql_ext.MariaDBConnectorDatabase$|^PooledMySQLDatabase$|^playhouse.pool.PooledMySQLDatabase$
      - has:
          stopBy: neighbor
          kind: argument_list
          has:
            stopBy: neighbor
            kind: keyword_argument
            all:
              - has:
                  stopBy: neighbor
                  kind: identifier
                  regex: '^password$|^passwd$'
              - has:
                  stopBy: neighbor
                  kind: string
                  all:
                    - not:
                        has:
                          stopBy: neighbor
                          kind: string_content
                    - not:
                        has:
                          stopBy: neighbor
                          kind: interpolation
rule:
  kind: call
  matches: EMPTY_PASSWORD_CALL
  not:
    all:
      - has:
          stopBy: end
          kind: ERROR
      - inside:
          stopBy: end
          kind: ERROR
