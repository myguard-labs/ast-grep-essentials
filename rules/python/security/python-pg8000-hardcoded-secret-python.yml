id: python-pg8000-hardcoded-secret-python
severity: warning
language: python
message: >-
  A secret is hard-coded in the application. Secrets stored in source code can
  be leaked and used by internal or external malicious actors. Retrieve the
  credential from a secure configuration source, vault, or HSM.
note: >-
  [CWE-798] Use of Hard-coded Credentials.
  [REFERENCES]
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

ast-grep-essentials: true

utils:
  UPSTREAM_UTIL_001:
    # pg8000.dbapi.connect(..., password="...",...)
    kind: call
    pattern: $CALL
    all:
    - has:
        stopBy: neighbor
        pattern: $DB
        regex: ^pg8000.dbapi.connect$|^pg8000.native.Connection$
    - has:
        stopBy: neighbor
        kind: argument_list
        all:
        - has:
           stopBy: neighbor
           kind: keyword_argument
           all:
            - has:
                stopBy: neighbor
                kind: identifier
                regex: ^password$
            - has:
                stopBy: neighbor
                kind: string
                has:
                   stopBy: neighbor
                   kind: string_content
        - not:
           has:
            stopBy: neighbor
            kind: keyword_argument
            all:
            - has:
                stopBy: neighbor
                kind: identifier
                regex: ^password$
            - has:
                stopBy: neighbor
                kind: string
                not:
                  has:
                   stopBy: end
                   kind: string_content
rule:
  kind: call
  matches: UPSTREAM_UTIL_001
  all:
      - not:
            has:
                stopBy: end
                kind: ERROR
      - not:
            inside:
                stopBy: end
                kind: ERROR
