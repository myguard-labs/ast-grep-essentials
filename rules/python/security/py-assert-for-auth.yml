id: py-assert-for-auth
language: python
severity: warning
message: >-
  Assert condition contains an authorization-related name. Python removes
  assert statements under optimization; use an explicit permission check when
  this assertion enforces authorization.
note: >-
  This single-file syntax heuristic matches authorization-related text in
  assert conditions, including owner_id ownership comparisons. It does not
  establish that an assertion enforces authorization, and it excludes text
  appearing only in the assertion message.
rule:
  kind: assert_statement
  has:
    nthChild: 1
    regex: >-
      (?i)(is_admin|is_staff|is_superuser|is_authenticated|has_perm|permission|authoriz|is_allowed|\brole\b|is_owner|owner_id|logged_in|current_user)
