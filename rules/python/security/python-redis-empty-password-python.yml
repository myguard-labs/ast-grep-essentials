id: python-redis-empty-password-python
language: python
severity: warning
message: Redis constructor call supplies an empty password string.
note: >-
  This rule checks only the syntax of redis.Redis calls with empty password
  strings; it does not establish runtime authentication behavior or resolve
  aliases.
rule:
  kind: call
  all:
    - has:
        stopBy: neighbor
        kind: attribute
        pattern: redis.Redis
    - has:
        stopBy: neighbor
        kind: argument_list
        all:
          - has:
              stopBy: neighbor
              kind: keyword_argument
              all:
                - has:
                    stopBy: neighbor
                    kind: identifier
                    regex: '^password$'
                - has:
                    stopBy: neighbor
                    kind: string
                    all:
                      - not:
                          has:
                            stopBy: end
                            kind: string_content
                      - not:
                          has:
                            stopBy: end
                            kind: interpolation
          - not:
              has:
                stopBy: neighbor
                kind: keyword_argument
                all:
                  - has:
                      stopBy: neighbor
                      kind: identifier
                      regex: '^password$'
                  - has:
                      stopBy: neighbor
                      kind: string
                      has:
                        stopBy: end
                        kind: string_content
    - not:
        has:
          stopBy: end
          kind: ERROR
    - not:
        inside:
          stopBy: end
          kind: ERROR
