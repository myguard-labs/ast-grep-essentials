# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-random-for-secret
language: python
severity: warning
message: >-
  Security-related assignment contains a call to the random module. Use
  secrets for security-sensitive randomness.
note: >-
  Matches security-related identifiers in assignment targets when the
  right-hand side is a call containing a listed random method, or an
  arithmetic binary expression containing such a call. This is a single-file
  syntax check using the literal random prefix; it does not resolve imports,
  types, aliases, runtime values, or whether the assigned value is actually
  security-sensitive.
utils:
  security-name:
    kind: identifier
    regex: '(?i)(token|secret|key|nonce|salt|password|passwd|otp|session)'
  random-call:
    kind: call
    has:
      stopBy: end
      kind: attribute
      all:
        - has:
            field: object
            regex: '^random$'
        - has:
            field: attribute
            regex: >-
              ^(random|randint|randrange|choice|choices|sample|shuffle|getrandbits|randbytes|uniform)$
rule:
  kind: assignment
  all:
    - has:
        field: left
        not:
          all:
            - not:
                matches: security-name
            - not:
                has:
                  stopBy: end
                  matches: security-name
    - has:
        field: right
        not:
          all:
            - not:
                matches: random-call
            - not:
                all:
                  - kind: binary_operator
                  - has:
                      stopBy: end
                      matches: random-call
