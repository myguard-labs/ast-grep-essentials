id: py-random-for-secret
language: python
severity: warning
message: >-
  Security value drawn from the random module. Its Mersenne Twister is
  deterministic and its state is recoverable from a modest number of outputs, so
  an observer who collects a few tokens predicts the rest. Use the secrets module
  for tokens, keys, nonces and one-time passwords, or os.urandom for raw bytes.
note: >-
  Fires when a name matching token, secret, key, nonce, salt, password, passwd,
  otp or session is assigned a value produced by a random module call. It
  recognises the module by the literal random prefix, so an aliased import is
  not resolved, and random.SystemRandom is excluded because it draws from the
  operating system. A value used only for jitter or sampling that happens to
  carry such a name is the routine dismissal.
utils:
  security-name:
    kind: identifier
    regex: '(?i)(token|secret|key|nonce|salt|password|passwd|otp|session)'
  random-call:
    kind: call
    has:
      stopBy: end
      kind: attribute
      all:
        - has: {field: object, regex: '^random$'}
        - has:
            field: attribute
            regex: '^(random|randint|randrange|choice|choices|sample|shuffle|getrandbits|randbytes|uniform)$'
rule:
  kind: assignment
  all:
    - has:
        field: left
        any:
          - matches: security-name
          - has:
              stopBy: end
              matches: security-name
    - has:
        field: right
        matches: random-call
