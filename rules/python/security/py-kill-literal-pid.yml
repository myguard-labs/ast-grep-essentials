# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-kill-literal-pid
language: python
severity: warning
message: >-
  Hard-coded process id passed to os.kill or os.killpg. A fixed positive pid
  names whichever process holds that number when the code runs, so the signal
  can hit an unrelated process after a restart or pid reuse. Use the pid of a
  process this program started, such as proc.pid, or os.getpid().
note: >-
  Fires on os.kill or os.killpg whose first argument is a bare positive decimal
  integer literal from 1 to 4194304, the Linux pid_max ceiling. Zero, negative
  values, larger literals, variables and calls such as os.getpid() are not
  matched. A pid held in a variable first (child_pid = 1234) is not seen. A
  test that signals a pid known to be dead or fake is the routine dismissal.
utils:
  pid-literal:
    kind: integer
    regex: '^(?:[1-9][0-9]{0,5}|[1-3][0-9]{6}|40[0-9]{5}|41[0-8][0-9]{4}|419[0-3][0-9]{3}|4194[0-2][0-9]{2}|419430[0-4])$'
rule:
  kind: call
  all:
    - has:
        field: function
        kind: attribute
        all:
          - has: {field: object, regex: '^os$'}
          - has: {field: attribute, regex: '^(kill|killpg)$'}
    - has:
        field: arguments
        has:
          nthChild:
            position: 1
            ofRule:
              not: {kind: comment}
          matches: pid-literal
metadata:
  created_at: '2026-11-15'
  source: 'MyGuard'
