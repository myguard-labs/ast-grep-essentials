id: py-subprocess-timeout-except-misses-timeout
language: python
severity: warning
message: >-
  This try block calls subprocess.run with timeout= but its except clause
  catches only OSError, so subprocess.TimeoutExpired is not handled.
note: >-
  Purely syntactic single-file match on the literal subprocess.run receiver,
  the timeout= keyword, and the literal except OSError clause text; it does
  not resolve imports, aliases, or exception class hierarchies, and it may
  miss other timeout-raising calls.
rule:
  pattern: |
    try:
        $$$BODY
    except OSError:
        $$$HANDLER
  has:
    pattern: 'subprocess.run($$$ARGS, timeout=$T)'
    stopBy: end
