id: python-peewee-pg-hardcoded-secret-python
severity: warning
language: python
message: >-
      A secret is hard-coded in the application. Secrets stored in source
      code, such as credentials, identifiers, and other types of sensitive data,
      can be leaked and used by internal or external malicious actors. Use
      environment variables to securely provide credentials and other secrets or
      retrieve them from a secure vault or Hardware Security Module (HSM).
note: >-
  [CWE-798] Use of Hard-coded Credentials.
  [REFERENCES]
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

ast-grep-essentials: true

utils:
  UPSTREAM_UTIL_001:
    # $DB(..., password="...",...)
    kind: call
    all:
    - has:
        stopBy: neighbor
        pattern: $DB
        regex: ^(PostgresqlDatabase|peewee\.PostgresqlDatabase|PostgresqlExtDatabase|playhouse\.postgres_ext\.PostgresqlExtDatabase|PooledPostgresqlDatabase|playhouse\.pool\.PooledPostgresqlDatabase|CockroachDatabase|playhouse\.cockroachdb\.CockroachDatabase|PooledCockroachDatabase|playhouse\.cockroachdb\.PooledCockroachDatabase)$
    - has:
        stopBy: neighbor
        kind: argument_list
        has:
          stopBy: neighbor
          kind: keyword_argument
          all:
            - has:
                stopBy: neighbor
                kind: identifier
                regex: ^password$|^passwd$
            - has:
                stopBy: neighbor
                kind: string
                has:
                   stopBy: neighbor
                   kind: string_content
rule:
  kind: call
  matches: UPSTREAM_UTIL_001
  all:
    - not:
        has:
          stopBy: end
          kind: ERROR
    - not:
        inside:
          stopBy: end
          kind: ERROR
