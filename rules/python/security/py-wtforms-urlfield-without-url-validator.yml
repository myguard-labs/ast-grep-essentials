id: py-wtforms-urlfield-without-url-validator
language: python
severity: warning
message: A URLField declared with a validator list that has no URL() validator.
note: DataRequired only checks presence, so any string is accepted as a link target.
  The commit adds URL() to each link field. The same omission can recur in any wtforms
  form that stores a URL from user input.
rule:
  pattern: $V0 = URLField('URL', [DataRequired()])
