id: py-dynamic-import-request
language: python
severity: warning
message: >-
  Module or attribute selected by the incoming request. importlib and getattr
  reach anything importable or any attribute on the object, so a caller who
  names os or an internal method gets code execution or writes to fields the
  view never exposed. Look the value up in a fixed dictionary of allowed names.
note: >-
  Fires when import_module, __import__, getattr or setattr receives a
  request-derived expression in its name position. A compile call is out of
  scope. A name copied into a variable first, and a
  loop that spreads a request dictionary over setattr, are not seen. A name the
  framework already restricted to a known set is the routine dismissal.
utils:
  request-root:
    any:
      - kind: identifier
        regex: '^request$'
      - kind: attribute
        has:
          field: object
          matches: request-root
      - kind: subscript
        has:
          field: value
          matches: request-root
      - kind: call
        has:
          field: function
          matches: request-root
  request-derived:
    all:
      - matches: request-root
      - not: {kind: identifier}
rule:
  kind: call
  any:
    - all:
        - has:
            field: function
            regex: '(^|\.)(import_module|__import__)$'
        - has:
            field: arguments
            has:
              nthChild:
                position: 1
                ofRule:
                  not: {kind: comment}
              matches: request-derived
    - all:
        - has:
            field: function
            regex: '(^|\.)(getattr|setattr)$'
        - has:
            field: arguments
            has:
              nthChild:
                position: 2
                ofRule:
                  not: {kind: comment}
              matches: request-derived
