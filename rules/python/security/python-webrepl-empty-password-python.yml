id: python-webrepl-empty-password-python
language: python
severity: warning
message: WebREPL is started with an empty password literal.
note: >-
  This rule detects only an explicit empty string literal, optionally enclosed
  in parentheses, in the password keyword of a syntactic webrepl.start call.
  It does not resolve names or runtime password values.
rule:
  kind: call
  all:
    - has:
        stopBy: neighbor
        kind: attribute
        regex: '^webrepl.start$'
    - has:
        stopBy: neighbor
        kind: argument_list
        has:
          stopBy: neighbor
          kind: keyword_argument
          all:
            - regex: '^password\s*=\s*(?:\(\s*)*[rRuUbBfF]*(?:""|''''|""""""|'''''''''''')(?:\s*\))*\s*$'
            - has:
                stopBy: end
                kind: string
                not:
                  has:
                    stopBy: end
                    kind: string_content
  not:
    all:
      - has:
          stopBy: end
          kind: ERROR
      - inside:
          stopBy: end
          kind: ERROR
