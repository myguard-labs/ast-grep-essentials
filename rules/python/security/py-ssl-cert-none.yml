id: py-ssl-cert-none
language: python
severity: warning
message: >-
  Assigning ssl.CERT_NONE to verify_mode disables peer-certificate validation
  when the receiver is an SSL context.
note: >-
  Matches direct verify_mode assignments whose right-hand side is
  ssl.CERT_NONE, allowing parentheses around ssl and the complete expression.
  This single-file syntax check cannot establish receiver types, resolve the
  ssl name, distinguish client and server policy, or detect aliased constants.
rule:
  kind: assignment
  all:
    - has:
        field: left
        kind: attribute
        has:
          field: attribute
          regex: '^verify_mode$'
    - has:
        field: right
        regex: >-
          (?s)^(?:\s|\(|#[^\n]*(?:\n|$))*ssl(?:\s|\)|#[^\n]*(?:\n|$))*\.(?:\s|#[^\n]*(?:\n|$))*CERT_NONE(?:\s|\)|#[^\n]*(?:\n|$))*$
