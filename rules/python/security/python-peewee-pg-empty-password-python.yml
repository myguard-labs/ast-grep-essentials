id: python-peewee-pg-empty-password-python
language: python
severity: warning
message: A database constructor receives an explicitly empty password argument.
note: >-
  This rule checks only the listed constructor spellings and password or
  passwd arguments containing empty ordinary string literals, including
  implicit concatenation. It does not resolve imports, aliases, runtime
  values, or authentication behavior.
rule:
  kind: call
  all:
    - has:
        stopBy: neighbor
        pattern: '$DB'
        regex: >-
          ^(PostgresqlDatabase|peewee\.PostgresqlDatabase|PostgresqlExtDatabase|playhouse\.postgres_ext\.PostgresqlExtDatabase|PooledPostgresqlDatabase|playhouse\.pool\.PooledPostgresqlDatabase|CockroachDatabase|playhouse\.cockroachdb\.CockroachDatabase|PooledCockroachDatabase|playhouse\.cockroachdb\.PooledCockroachDatabase)$
    - has:
        stopBy: neighbor
        kind: argument_list
        has:
          stopBy: neighbor
          kind: keyword_argument
          all:
            - has:
                stopBy: neighbor
                kind: identifier
                regex: '^(password|passwd)$'
            - has:
                stopBy: neighbor
                regex: '^(?:(?:[rRuU])?(?:''''|""|''''''''''''|"""""")\s*)+$'
    - not:
        has:
          stopBy: end
          kind: ERROR
    - not:
        inside:
          stopBy: end
          kind: ERROR
