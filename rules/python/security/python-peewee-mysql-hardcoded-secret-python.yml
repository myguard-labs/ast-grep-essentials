id: python-peewee-mysql-hardcoded-secret-python
language: python
severity: warning
message: >-
  A database password is written as a literal in source code. Retrieve
  credentials from an environment variable or secret store.
note: >-
  This rule recognizes constructor spellings and password or passwd arguments
  composed entirely of adjacent non-interpolated string literals. It does not
  resolve imports, aliases, types, or runtime values.
rule:
  kind: call
  all:
    - has:
        stopBy: neighbor
        pattern: '$DB'
        regex: >-
          ^(MySQLDatabase|peewee\.MySQLDatabase|MySQLConnectorDatabase|playhouse\.mysql_ext\.MySQLConnectorDatabase|MariaDBConnectorDatabase|playhouse\.mysql_ext\.MariaDBConnectorDatabase|PooledMySQLDatabase|playhouse\.pool\.PooledMySQLDatabase)$
    - has:
        stopBy: neighbor
        kind: argument_list
        has:
          stopBy: neighbor
          kind: keyword_argument
          regex: >-
            ^(?:password|passwd)\s*=\s*(?:(?:[rRuUbB]|[bB][rR]|[rR][bB])?(?:'''(?:[^'\\]|\\[\s\S]|'[^']|''[^'])*'''|"""(?:[^"\\]|\\[\s\S]|"[^"]|""[^"])*"""|'(?:[^'\\\r\n]|\\[\s\S])*'|"(?:[^"\\\r\n]|\\[\s\S])*")\s*)+$
  not:
    all:
      - has:
          stopBy: end
          kind: ERROR
      - inside:
          stopBy: end
          kind: ERROR
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
  created_at: '2026-09-11'
