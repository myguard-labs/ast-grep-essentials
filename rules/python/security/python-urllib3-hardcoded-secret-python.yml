id: python-urllib3-hardcoded-secret-python
language: python
severity: warning
message: >-
  A non-empty credential string is embedded in a make_headers authentication
  argument.
note: >-
  This rule checks explicit supported function spellings and literal syntax in
  one file; it does not resolve aliases, evaluate credentials, or establish
  runtime behavior.
rule:
  kind: call
  all:
    - has:
        stopBy: neighbor
        kind: attribute
        regex: >-
          ^(urllib3\.util\.make_headers|urllib3\.make_headers|requests\.packages\.urllib3\.make_headers|requests\.packages\.urllib3\.util\.make_headers)$
    - has:
        stopBy: neighbor
        kind: argument_list
        has:
          stopBy: neighbor
          kind: keyword_argument
          all:
            - has:
                stopBy: neighbor
                kind: identifier
                regex: '^(basic_auth|proxy_basic_auth)$'
            - has:
                stopBy: neighbor
                all:
                  - not:
                      all:
                        - not:
                            kind: string
                        - not:
                            kind: concatenated_string
                  - has:
                      stopBy: end
                      kind: string_content
                      regex: '[\s\S]+'
                  - not:
                      has:
                        stopBy: end
                        kind: interpolation
  not:
    all:
      - has:
          stopBy: end
          kind: ERROR
      - inside:
          stopBy: end
          kind: ERROR
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
  created_at: '2026-09-11'
