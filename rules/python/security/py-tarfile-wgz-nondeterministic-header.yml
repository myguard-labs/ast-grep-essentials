id: py-tarfile-wgz-nondeterministic-header
language: python
severity: warning
message: >-
  tarfile.open with mode 'w:gz' writes a gzip header timestamp, so the output
  may not be byte-stable across runs.
note: >-
  Matches only the literal receiver syntax tarfile.open(...) with a keyword
  argument mode='w:gz' in the same call. It does not resolve whether tarfile
  is the standard library module, does not track aliases or imports, and does
  not check whether the timestamp matters to the output.
rule:
  pattern: 'tarfile.open($$$ARGS, mode=''w:gz'')'
