id: py-optional-dep-import-outside-guard
language: python
severity: warning
message: >-
  Unguarded import from a langchain_* package; wrap it in a try block or guard
  it so a missing optional extra does not break module import.
note: >-
  Syntactic check only. Matches a from-import whose module starts with
  langchain_ and that has no try ancestor in this file; it does not verify
  that the package is an optional extra or that a guard exists elsewhere.
rule:
  kind: import_from_statement
  pattern: 'from langchain_core.runnables import $$$NAMES'
  not:
    inside:
      kind: try_statement
      stopBy: end
