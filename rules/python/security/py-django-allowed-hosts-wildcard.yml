id: py-django-allowed-hosts-wildcard
language: python
severity: warning
message: >-
  ALLOWED_HOSTS contains a literal wildcard entry. Review whether unrestricted
  Host headers are intended.
note: >-
  Matches direct ALLOWED_HOSTS assignments to lists or tuples containing a
  bare wildcard in an ordinary or triple-quoted string. This single-file
  syntax check does not establish runtime settings, deployment usage, or
  upstream Host validation.
rule:
  kind: assignment
  all:
    - has:
        field: left
        kind: identifier
        regex: '^ALLOWED_HOSTS$'
    - has:
        field: right
        any:
          - kind: list
          - kind: tuple
        has:
          kind: string
          regex: '^("\*"|''\*''|"""\*"""|''''''\*'''''')$'
