id: py-re-search-chained-attribute-access
language: python
severity: warning
message: >-
  Attribute access is chained directly onto a re.search/re.match/re.fullmatch
  result, which may be None when the pattern does not match.
note: >-
  Purely syntactic check on a literal re.search/re.match/re.fullmatch receiver
  chained to start, end, span, or group. It does not resolve imports, aliases,
  compiled patterns, or whether a prior None check exists, so it may flag
  guarded code paths.
rule:
  pattern: 're.search($$$ARGS).start($$$A)'
