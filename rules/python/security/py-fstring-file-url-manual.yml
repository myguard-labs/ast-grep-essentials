# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-fstring-file-url-manual
language: python
severity: warning
message: >-
  This f-string builds a file:// URL by hand; prefer Path.as_uri() for correct
  encoding.
note: >-
  Syntactic match only. Flags f-strings whose literal text starts with file://
  and that interpolate a value; does not verify that the interpolated value is
  a path or resolve types.
rule:
  pattern: 'f"file://{$P}"'
