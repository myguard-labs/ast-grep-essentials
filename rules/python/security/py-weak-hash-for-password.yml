# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-weak-hash-for-password
language: python
severity: warning
message: >-
  Password-like input passed to a plain hashlib hash, or an MD5 or SHA1
  cryptography constructor used. Review password hashing and weak hash use.
note: >-
  This is a single-file syntax and argument-name heuristic. It does not
  establish password storage, resolve aliases, or evaluate runtime values.
  Hashlib calls with the explicit keyword usedforsecurity=False are excluded;
  cryptography MD5 and SHA1 constructors remain matched.
utils:
  password-like-argument:
    regex: '(?i)(password|passwd|passphrase|pwd|secret|token|credential)'
rule:
  kind: call
  not:
    all:
      - not:
          all:
            - has:
                field: function
                kind: attribute
                all:
                  - has:
                      field: object
                      regex: '^hashlib$'
                  - has:
                      field: attribute
                      regex: '^(md5|sha1|sha224|sha256|sha384|sha512)$'
            - has:
                field: arguments
                has:
                  stopBy: end
                  matches: password-like-argument
            - not:
                has:
                  field: arguments
                  has:
                    kind: keyword_argument
                    all:
                      - has:
                          field: name
                          regex: '^usedforsecurity$'
                      - has:
                          field: value
                          kind: 'false'
      - not:
          has:
            field: function
            kind: attribute
            all:
              - has:
                  field: object
                  regex: '^hashes$'
              - has:
                  field: attribute
                  regex: '^(MD5|SHA1)$'
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
