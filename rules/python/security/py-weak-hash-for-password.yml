id: py-weak-hash-for-password
language: python
severity: warning
message: >-
  Password or secret run through a plain cryptographic hash. MD5 and SHA-1 are
  broken outright, and even SHA-256 is fast enough that a stolen table is
  brute-forced at billions of guesses per second because there is no salt and no
  work factor. Store passwords with argon2, bcrypt, scrypt or pbkdf2_hmac at a
  current iteration count.
note: >-
  Fires on a hashlib md5, sha1, sha224, sha256, sha384 or sha512 call whose
  argument text mentions a password, passphrase, secret, token or credential,
  and on the MD5 and SHA1 hash constructors of the cryptography library. It is a
  name heuristic over the argument source. Hashing a value that merely carries
  such a name but is a lookup key or a file checksum is the routine dismissal,
  as is a hash marked usedforsecurity=False, which this matcher does not check.
utils:
  password-like-argument:
    regex: '(?i)(password|passwd|passphrase|pwd|secret|token|credential)'
rule:
  any:
    - kind: call
      all:
        - has:
            field: function
            kind: attribute
            all:
              - has: {field: object, regex: '^hashlib$'}
              - has: {field: attribute, regex: '^(md5|sha1|sha224|sha256|sha384|sha512)$'}
        - has:
            field: arguments
            has:
              stopBy: end
              matches: password-like-argument
    - kind: call
      has:
        field: function
        kind: attribute
        all:
          - has: {field: object, regex: '^hashes$'}
          - has: {field: attribute, regex: '^(MD5|SHA1)$'}
