id: py-requests-unbounded-content-read
language: python
severity: warning
message: >-
  Reading .content on a requests.get(...) result buffers the whole response
  body without a size limit.
note: >-
  Matches the literal syntax requests.get(...) followed directly by .content;
  it does not resolve imports, aliases, or streaming configuration.
rule:
  pattern: 'requests.get($$$ARGS).content'
