id: py-mutable-class-attr-without-classvar
language: python
severity: warning
message: >-
  Mutable dict or list literal assigned as a class attribute without a
  ClassVar annotation; this value is shared across instances.
note: >-
  Single-file syntactic match on a bare class-body assignment of a dict or
  list literal directly in the class body; assignments inside a method,
  nested function or lambda are ignored. It does not resolve types, imports, or whether the attribute
  is later mutated or reassigned per instance.
rule:
  kind: expression_statement
  all:
    - has:
        kind: assignment
        all:
          - has:
              field: left
              pattern: '$NAME'
          - has:
              field: right
              kind: dictionary
    - inside:
        kind: class_definition
        stopBy: end
    - not:
        inside:
          any:
            - kind: function_definition
            - kind: lambda
          stopBy:
            kind: class_definition
