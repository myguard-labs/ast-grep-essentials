id: py-mutable-class-attr-without-classvar
language: python
severity: warning
message: >-
  Mutable dict, list or set literal assigned as a class attribute without a
  ClassVar annotation; this value is shared across instances.
note: >-
  Single-file syntactic match on a bare class-body assignment of a dict,
  list or set literal, a list, set or dict comprehension, or a call of the
  bare builtin name list(), set() or dict() (not tuples, frozenset(),
  generator expressions or attribute calls such as x.list()). Bindings are
  not resolved: a module that rebinds list, set or dict is still matched.
  An annotation of ClassVar, typing.ClassVar or a quoted
  ClassVar forward reference is not flagged. The assignment must not sit
  inside a function (a method or a nested def) between it and its nearest enclosing class; assignments in
  if, try or with blocks of the class body still match. It does not resolve
  types, imports, or whether the attribute is later mutated or reassigned
  per instance.
rule:
  kind: expression_statement
  all:
    - has:
        kind: assignment
        all:
          - has:
              field: left
              pattern: '$NAME'
          - has:
              field: right
              any:
                - kind: dictionary
                - kind: list
                - kind: set
                - kind: list_comprehension
                - kind: set_comprehension
                - kind: dictionary_comprehension
                - kind: call
                  has:
                    field: function
                    kind: identifier
                    regex: '^(list|set|dict)$'
          - not:
              has:
                field: type
                regex: '^["'']?(\w+\s*\.\s*)*ClassVar\s*(\[|["'']?$)'
    - inside:
        kind: class_definition
        stopBy: end
    - not:
        inside:
          kind: function_definition
          stopBy:
            kind: class_definition
