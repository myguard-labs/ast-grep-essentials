id: py-pickle-loads
language: python
severity: warning
message: >-
  Pickle load and loads calls can execute arbitrary code when deserializing
  untrusted data.
note: >-
  Matches calls to load or loads on the literal name pickle, including
  parenthesized references. This single-file syntactic rule does not resolve
  imports, shadowing, aliases, or whether the input is trusted.
rule:
  kind: call
  has:
    field: function
    kind: attribute
    all:
      - has:
          field: object
          regex: '^\s*(\(\s*)*pickle(\s*\))*\s*$'
      - has:
          field: attribute
          regex: '^loads?$'
