id: python-ldap3-empty-password-python
severity: warning
language: python
message: >-
      The application creates a database connection with an empty password.
      This can lead to unauthorized access by either an internal or external
      malicious actor. To prevent this vulnerability, enforce authentication
      when connecting to a database by using environment variables to securely
      provide credentials or retrieving them from a secure vault or HSM
      (Hardware Security Module).
note: >-
  [CWE-287] Improper Authentication.
  [REFERENCES]
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

ast-grep-essentials: true

utils:
  UPSTREAM_UTIL_001:
   kind: call
   all:
     - has:
         stopBy: neighbor
         kind: attribute
         regex: ^ldap3.Connection$
     - has:
         stopBy: neighbor
         kind: argument_list
         has:
           stopBy: neighbor
           kind: keyword_argument
           all:
            - has:
                stopBy: neighbor
                kind: identifier
                regex: ^password$
                nthChild: 1
            - has:
                stopBy: neighbor
                kind: identifier
                pattern: $INST
                nthChild: 2
     - inside:
         stopBy: end
         follows:
          stopBy: end
          kind: expression_statement
          has:
            kind: assignment
            all:
              - has:
                  kind: identifier
                  pattern: $INST
                  nthChild: 1
              - has:
                  kind: string
                  not:
                    has:
                      kind: string_content

  UPSTREAM_UTIL_002:
   kind: call
   all:
     - has:
         stopBy: neighbor
         kind: attribute
         regex: ^ldap3.Connection$
     - has:
         stopBy: neighbor
         kind: argument_list
         has:
           stopBy: neighbor
           kind: keyword_argument
           all:
            - has:
                stopBy: neighbor
                kind: identifier
                regex: ^password$
            - has:
                stopBy: neighbor
                kind: string
                not:
                  has:
                   stopBy: end
                   kind: string_content

rule:
  kind: call
  any:
    - matches: UPSTREAM_UTIL_001
    - matches: UPSTREAM_UTIL_002
  not:
    all:
      - has:
          stopBy: end
          kind: ERROR
      - inside:
          stopBy: end
          kind: ERROR
