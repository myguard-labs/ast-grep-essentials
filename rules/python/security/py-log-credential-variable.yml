# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-log-credential-variable
language: python
severity: warning
message: >-
  A credential-like value is passed to a logging call. A password, secret, token or
  API key written to a log file is readable by everyone with log access and
  survives in backups and log shippers. Log a fixed message or a masked form
  instead, never the credential itself.
note: >-
  Fires on a debug, info, warning, warn, error, critical or exception call on logging,
  logger, log, LOG or LOGGER (also reached through an attribute chain such as self.log)
  whose argument is, directly or inside an f-string interpolation or a
  concatenation or percent-format expression, a variable or attribute with
  a name ending in password, passwd, secret, api_key or apikey, in accesstoken, authtoken, refreshtoken, bearertoken, sessiontoken, jwttoken or idtoken (with or without an underscore), or exactly token, in any letter case. The name is matched, not the value, so a
  boolean flag such as has_password or a masked copy under a matching name is
  a false positive; a call such as len(password) or mask(token) is not matched,
  and a credential read through a subscript or another name is not seen.
  A fixture or masked value is the routine dismissal.

  [CWE-532] [A09:2025] [A09:2021]

  [REFERENCES]
      - https://cwe.mitre.org/data/definitions/532.html
rule:
  kind: call
  all:
    - has:
        field: function
        kind: attribute
        regex: '^(?:\w+\.)*(?:logging|logger|log|LOG|LOGGER)\.(?:debug|info|warning|warn|error|critical|exception)$'
    - has:
        field: arguments
        kind: argument_list
        has:
          any:
            - kind: identifier
              regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
            - kind: attribute
              regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
            - kind: string
              has:
                kind: interpolation
                has:
                  field: expression
                  regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
            - kind: binary_operator
              has:
                any:
                  - kind: identifier
                    regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
                  - kind: attribute
                    regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
metadata:
  created_at: '2026-11-16'
  source: 'MyGuard'
  modified_by: 'MyGuard'
  license: 'MyGuard Internal Use License 1.0'
  cwe: 'CWE-532'
  owasp: 'A09:2025|A09:2021'
  category: 'security'
  references: 'https://cwe.mitre.org/data/definitions/532.html'
