id: py-rsa-pkcs1v15-encrypt
language: python
severity: warning
message: >-
  RSA encrypt or decrypt call uses PKCS#1 v1.5 padding. Use OAEP padding
  instead.
note: >-
  [CWE-780] [OWASP A02:2021] PKCS#1 v1.5 encryption padding is
  vulnerable to Bleichenbacher padding-oracle attacks. This is a syntactic
  check: an encrypt or decrypt method call with a direct PKCS1v15() argument
  or a padding= keyword argument holding PKCS1v15().
  It does not resolve the receiver type or aliases of the constructor, and
  PKCS1v15 used for signing is not matched.
rule:
  kind: call
  all:
    - has:
        field: function
        kind: attribute
        has:
          field: attribute
          regex: '^(encrypt|decrypt)$'
    - has:
        field: arguments
        any:
          - has:
              kind: call
              has:
                field: function
                regex: '(^|\.)PKCS1v15$'
          - has:
              kind: keyword_argument
              all:
                - has:
                    field: name
                    regex: '^padding$'
                - has:
                    field: value
                    kind: call
                    has:
                      field: function
                      regex: '(^|\.)PKCS1v15$'
