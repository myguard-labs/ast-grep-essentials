id: python-redis-hardcoded-secret-python
language: python
severity: warning
message: >-
  A non-empty literal password appears in a redis.Redis call. Supply
  credentials through configuration or a secret store.
note: >-
  This rule checks single-file syntax only. It excludes strings containing
  interpolation and does not resolve redis bindings or determine whether a
  literal is an actual credential.
utils:
  literal_password_call:
    kind: call
    all:
      - has:
          stopBy: neighbor
          kind: attribute
          pattern: redis.Redis
      - has:
          stopBy: neighbor
          kind: argument_list
          all:
            - has:
                stopBy: neighbor
                kind: keyword_argument
                all:
                  - has:
                      stopBy: neighbor
                      kind: identifier
                      regex: '^password$'
                  - has:
                      stopBy: neighbor
                      kind: string
                      all:
                        - has:
                            stopBy: end
                            kind: string_content
                        - not:
                            has:
                              stopBy: end
                              kind: interpolation
            - not:
                has:
                  stopBy: neighbor
                  kind: keyword_argument
                  all:
                    - has:
                        stopBy: neighbor
                        kind: identifier
                        regex: '^password$'
                    - has:
                        stopBy: neighbor
                        kind: string
                        not:
                          has:
                            stopBy: end
                            kind: string_content
rule:
  kind: call
  matches: literal_password_call
  all:
    - not:
        has:
          stopBy: end
          kind: ERROR
    - not:
        inside:
          stopBy: end
          kind: ERROR
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
  created_at: '2026-09-11'
