id: py-urlsplit-netloc-host-compare
language: python
severity: warning
message: >-
  Host identity is compared using urlsplit(...).netloc on both sides; netloc
  keeps port and userinfo, so equivalent hosts may compare unequal.
note: >-
  Syntactic match only on a literal urlsplit(...).netloc ==
  urlsplit(...).netloc comparison in one file. It does not resolve imports,
  aliases, or runtime values, and cannot confirm that the compared values are
  used for host identity.
rule:
  pattern: 'urlsplit($A).netloc == urlsplit($B).netloc'
