id: python-requests-empty-password-python
language: python
severity: warning
message: Requests authentication constructor receives an explicitly empty password.
note: >-
  This rule checks only fully qualified constructor syntax and literal empty
  passwords in the second positional argument or the password keyword
  argument. It does not resolve aliases, types, runtime values, or
  authentication behavior.
utils:
  empty_password:
    kind: call
    all:
      - has:
          stopBy: neighbor
          kind: attribute
          regex: '^requests\.auth\.(HTTPBasicAuth|HTTPDigestAuth|HTTPProxyAuth)$'
      - has:
          stopBy: neighbor
          kind: argument_list
          not:
            all:
              - not:
                  has:
                    stopBy: neighbor
                    kind: string
                    nthChild: 2
                    not:
                      has:
                        stopBy: end
                        kind: string_content
              - not:
                  has:
                    stopBy: neighbor
                    kind: keyword_argument
                    all:
                      - has:
                          stopBy: neighbor
                          kind: identifier
                          regex: '^password$'
                      - has:
                          stopBy: neighbor
                          kind: string
                          not:
                            has:
                              stopBy: end
                              kind: string_content
rule:
  kind: call
  matches: empty_password
  not:
    all:
      - has:
          stopBy: end
          kind: ERROR
      - inside:
          stopBy: end
          kind: ERROR
