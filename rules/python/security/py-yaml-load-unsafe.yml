id: py-yaml-load-unsafe
language: python
severity: warning
message: >-
  yaml.load() without a recognized safe Loader requires API and security review.
  Modern PyYAML versions require an explicit Loader; unsafe loaders can construct
  arbitrary Python objects. Prefer yaml.safe_load() for untrusted input.
note: >-
  Candidate: accepts the recognized SafeLoader/CSafeLoader spellings only.
  Loader aliases and positional loaders require review. Modern PyYAML requires
  an explicit Loader argument; missing Loader may be an API error rather than
  unsafe deserialization. Prefer yaml.safe_load for untrusted input.
rule:
  kind: call
  all:
    - has:
        field: function
        kind: attribute
        all:
          - has: {field: object, regex: ^yaml$}
          - has: {field: attribute, regex: ^load$}
    - not:
        has:
          kind: argument_list
          has:
            kind: keyword_argument
            all:
              - has: {field: name, regex: ^Loader$}
              - has:
                  field: value
                  matches: safe-loader-value
utils:
  safe-loader:
    any:
      - kind: identifier
        regex: ^C?SafeLoader$
      - kind: attribute
        all:
          - has: {field: object, regex: ^yaml$}
          - has: {field: attribute, regex: '^C?SafeLoader$'}
  safe-loader-value:
    any:
      - matches: safe-loader
      - kind: parenthesized_expression
        has:
          matches: safe-loader
