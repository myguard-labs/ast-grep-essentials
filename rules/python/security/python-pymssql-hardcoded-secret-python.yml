id: python-pymssql-hardcoded-secret-python
language: python
severity: warning
message: >-
  A pymssql connection call contains a nonempty string literal password.
  Supply credentials through secure configuration.
note: >-
  This rule checks syntax only. For _mssql.connect, it requires a preceding
  from pymssql import _mssql statement in an enclosing statement sequence; it
  does not resolve bindings, shadowing, runtime values, or whether the literal
  is an actual secret.
rule:
  kind: call
  all:
    - has:
        stopBy: neighbor
        kind: attribute
        regex: '^(pymssql\.connect|pymssql\._mssql\.connect|_mssql\.connect)$'
    - has:
        stopBy: neighbor
        kind: argument_list
        has:
          stopBy: neighbor
          kind: keyword_argument
          all:
            - has:
                stopBy: neighbor
                kind: identifier
                regex: '^password$'
            - has:
                stopBy: neighbor
                kind: string
                has:
                  stopBy: end
                  kind: string_content
    - not:
        all:
          - has:
              stopBy: neighbor
              kind: attribute
              regex: '^_mssql\.connect$'
          - not:
              inside:
                stopBy: end
                follows:
                  stopBy: end
                  kind: import_from_statement
                  pattern: from pymssql import _mssql
  not:
    all:
      - has:
          stopBy: end
          kind: ERROR
      - inside:
          stopBy: end
          kind: ERROR
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
