id: python-pymssql-hardcoded-secret-python
language: python
severity: warning
message: >-
  A secret is hard-coded in the application. Secrets stored in source
  code, such as credentials, identifiers, and other types of sensitive data,
  can be leaked and used by internal or external malicious actors. Use
  environment variables to securely provide credentials and other secrets or
  retrieve them from a secure vault or Hardware Security Module (HSM).
note: >-
  [CWE-798]: Use of Hard-coded Credentials
  [OWASP A07:2021]: Identification and Authentication Failures
  [REFERENCES]
       https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

ast-grep-essentials: true

utils:
  UPSTREAM_UTIL_001:
    kind: call
    all:
      - has:
          stopBy: neighbor
          kind: attribute
          regex: ^pymssql.connect$|^pymssql._mssql.connect$
      - has:
          stopBy: neighbor
          kind: argument_list
          has:
            stopBy: neighbor
            kind: keyword_argument
            all:
              - has:
                  stopBy: neighbor
                  kind: identifier
                  regex: ^password$
              - has:
                  stopBy: neighbor
                  kind: string
                  has:
                    stopBy: end
                    kind: string_content
  # $mssql.connect(..., password="",...):
  #  kind: call
  #  all:
  #    - has:
  #        stopBy: neighbor
  #        kind: attribute
  #        regex: ^_mssql.connect$
  #    - has:
  #        stopBy: neighbor
  #        kind: argument_list
  #        has:
  #          stopBy: neighbor
  #          kind: keyword_argument
  #          all:
  #           - has:
  #               stopBy: neighbor
  #               kind: identifier
  #               regex: ^password$
  #           - has:
  #               stopBy: neighbor
  #               kind: string
  #               has:
  #                  stopBy: end
  #                  kind: string_content
  #    - inside:
  #        stopBy: end
  #        follows:
  #          stopBy: end
  #          kind: import_from_statement
  #          pattern: from pymssql import _mssql
rule:
  kind: call
  any:
    - matches: UPSTREAM_UTIL_001
  # - matches: $mssql.connect(..., password="",...)
  not:
    all:
      - has:
          stopBy: end
          kind: ERROR
      - inside:
          stopBy: end
          kind: ERROR
