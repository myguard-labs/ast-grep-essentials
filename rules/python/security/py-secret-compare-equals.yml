id: py-secret-compare-equals
language: python
severity: warning
message: >-
  Secret compared with == or !=. String and bytes equality returns as soon as
  two positions differ, so the time it takes leaks how much of the prefix was
  right and a caller can recover the value byte by byte. Compare with
  hmac.compare_digest, which takes the same time regardless of where the values
  diverge.
note: >-
  Fires on an equality comparison where one side is a digest or hexdigest call,
  or a name matching signature, hmac, digest, token, api_key, secret or
  password. It is a name and shape heuristic: a comparison of a value that only
  looks secret, or one already behind a rate limit and a constant-time framework
  check, is the routine dismissal. A comparison against a stored password hash
  from a slow KDF verifier is not a timing problem.
utils:
  secret-operand:
    any:
      - kind: identifier
        regex: '(?i)^(.*_)?(signature|sig|hmac|digest|token|api_key|apikey|secret|password|passwd)(_.*)?$'
      - kind: call
        has:
          field: function
          kind: attribute
          has: {field: attribute, regex: '^(digest|hexdigest)$'}
      - kind: attribute
        has:
          field: attribute
          regex: '(?i)^(signature|sig|hmac|digest|token|api_key|secret|password)$'
rule:
  kind: comparison_operator
  all:
    - regex: '(==|!=)'
    - has: {matches: secret-operand}
    - not:
        inside:
          stopBy: end
          kind: call
          has:
            field: function
            regex: 'compare_digest$'
