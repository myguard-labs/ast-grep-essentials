id: py-asyncio-mark-on-sync-def
language: python
severity: warning
message: >-
  This pytest.mark.asyncio decorator is on a synchronous def; the test should
  be async def.
note: >-
  Syntactic match only. It flags a decorated function whose definition is a
  plain def, and does not check whether the function is a test, whether the
  marker is applied through other means, or runtime pytest-asyncio behavior.
rule:
  all:
    - pattern: |
        @pytest.mark.asyncio($$$ARGS)
        def $NAME($$$PARAMS):
          $$$BODY
    - not:
        pattern: |
          @pytest.mark.asyncio($$$ARGS)
          async def $NAME($$$PARAMS):
            $$$BODY
