id: python-webrepl-hardcoded-secret-python
language: python
severity: warning
message: A literal password is embedded directly in a webrepl.start call.
note: >-
  This rule identifies only direct, syntactically literal password arguments,
  including implicit concatenation; it does not resolve aliases or determine
  runtime credential values.
rule:
  kind: call
  all:
    - has:
        stopBy: neighbor
        kind: attribute
        regex: '^webrepl\.start$'
    - has:
        stopBy: neighbor
        kind: argument_list
        has:
          stopBy: neighbor
          kind: keyword_argument
          all:
            - has:
                stopBy: neighbor
                kind: identifier
                regex: '^password$'
            - has:
                stopBy: neighbor
                regex: '(?s)^(?:[rRuUbB]{0,2}(?:"(?:\\.|[^"\\])*"|''(?:\\.|[^''\\])*'')\s*)+$'
  not:
    all:
      - has:
          stopBy: end
          kind: ERROR
      - inside:
          stopBy: end
          kind: ERROR
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
