# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-pid-named-excl-temporary
language: python
severity: info
message: >-
  This exclusively creates a temporary whose name is built from os.getpid()
  (os.open with O_EXCL, or open in mode "x"). Process IDs are reused, so an
  orphan temporary left by a crashed process wedges a later process that gets
  the same PID: the create fails with FileExistsError, which escapes untyped
  because no enclosing try catches OSError or FileExistsError. Use a random
  name (secrets.token_hex, tempfile.mkstemp) or catch FileExistsError and
  raise a typed error.
note: >-
  Advisory, so info severity like the other low-precision python/security
  advisories. Fires on os.open(path, flags) where the flags argument (or a
  flags= keyword) mentions O_EXCL (os.O_EXCL or a bare O_EXCL), and on the
  builtin open(path, mode) where the mode (or a mode= keyword) is a string
  literal containing x. The path must contain a call to os.getpid() inline
  (f-string, str.format, % formatting, concatenation) or be a local name
  assigned such an expression in the same function (assignments in nested
  functions do not count). Not reported when the call
  is in the body of a try whose except clause catches OSError or
  FileExistsError (alone or in a tuple) or is a bare except. A handler for an
  unrelated exception such as ValueError does not suppress the report, and
  only the handler's exception types count, never its as binding name. The
  try must be in the same function: a create inside a nested def within a
  handled try is still reported.
rule:
  kind: call
  all:
    - any:
        - all:
            - has:
                field: function
                pattern: os.open
            - has:
                field: arguments
                has:
                  any:
                    - all:
                        - nthChild: 2
                        - regex: 'O_EXCL'
                    - all:
                        - kind: keyword_argument
                        - has:
                            field: name
                            regex: '^flags$'
                        - regex: 'O_EXCL'
        - all:
            - has:
                field: function
                kind: identifier
                regex: '^open$'
            - has:
                field: arguments
                has:
                  any:
                    - all:
                        - nthChild: 2
                        - kind: string
                        - regex: '^[a-zA-Z]*["''][rwabt+]*x[rwabt+]*["'']$'
                    - all:
                        - kind: keyword_argument
                        - has:
                            field: name
                            regex: '^mode$'
                        - has:
                            field: value
                            kind: string
                            regex: '^[a-zA-Z]*["''][rwabt+]*x[rwabt+]*["'']$'
    - has:
        field: arguments
        has:
          nthChild: 1
          any:
            - has:
                stopBy: end
                kind: call
                pattern: os.getpid()
            - all:
                - kind: identifier
                - pattern: $T
                - inside:
                    stopBy:
                      kind: function_definition
                    kind: function_definition
                    has:
                      stopBy:
                        kind: function_definition
                      kind: assignment
                      all:
                        - has:
                            field: left
                            pattern: $T
                        - has:
                            field: right
                            has:
                              stopBy: end
                              kind: call
                              pattern: os.getpid()
    - not:
        has:
          field: arguments
          has:
            nthChild: 1
            has:
              stopBy: end
              kind: call
              regex: '^(secrets\.(token_hex|token_urlsafe|token_bytes)|(uuid\.)?uuid4|os\.urandom)\('
    - not:
        inside:
          stopBy:
            kind: function_definition
          kind: block
          inside:
            kind: try_statement
            has:
              kind: except_clause
              any:
                - kind: except_clause
                  not:
                    has:
                      field: value
                      regex: '\S'
                - has:
                    field: value
                    not:
                      kind: as_pattern
                    regex: '\b(OSError|FileExistsError)\b'
                - has:
                    field: value
                    kind: as_pattern
                    has:
                      nthChild: 1
                      regex: '\b(OSError|FileExistsError)\b'
metadata:
  known_false_positives: 'A temporary in a per-process private directory is still reported; a local name assigned a name that mixes os.getpid() with a random token is still reported (only the inline name expression is excluded, so the assignment is not followed); so is a create whose FileExistsError is caught by a handler further up the call chain or by except Exception, BaseException, IOError or EnvironmentError, which are not recognised (only OSError, FileExistsError and a bare except count); a local name assigned from os.getpid() anywhere in the same function counts even when it is rebound before the open'
  known_false_negatives: 'Syntactic. os import aliases (from os import open, import os as o, from os import getpid) are not resolved; a path built by a helper or in another function (cross-function builders) is not reported; a path name assigned from a name that itself came from os.getpid() (two-step) is not reported; a nested function that opens a name assigned in its enclosing function is not reported; flags held in a variable (flags = os.O_WRONLY | os.O_EXCL; os.open(p, flags)) are not reported, nor are modes held in a variable; pathlib Path.open("x") and Path.touch(exist_ok=False) are not covered; os.open with the flags as a keyword other than flags= is not reported; a try that catches the error only in its else or finally block, or a handler in the except clause body, does not count'
  cwe: 'CWE-377'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/377.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A01:2025'
  rule_modified_at: '2026-11-22'
  ast_grep_tested_version: 0.51.3
  validated_at: '2026-11-22'
  created_at: '2026-11-21'
