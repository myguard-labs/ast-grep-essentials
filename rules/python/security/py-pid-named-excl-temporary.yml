# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-pid-named-excl-temporary
language: python
severity: info
message: >-
  This exclusively creates a temporary whose name is built from os.getpid()
  (os.open with O_EXCL, or open in mode "x"). Process IDs are reused, so an
  orphan temporary left by a crashed process wedges a later process that gets
  the same PID: the create fails with FileExistsError, which escapes untyped
  because no enclosing try catches OSError or FileExistsError. Use a random
  name (secrets.token_hex, tempfile.mkstemp) or catch FileExistsError and
  raise a typed error.
note: >-
  Advisory, so info severity like the other low-precision python/security
  advisories. Fires on os.open(path, flags) where the flags argument (or a
  flags= keyword) mentions O_EXCL (os.O_EXCL or a bare O_EXCL), and on the
  builtin open(path, mode) where the mode (or a mode= keyword) is a string
  literal containing x. The path is the first positional argument or a
  path= / file= keyword, in any position; a leading keyword argument (such
  as flags= or mode=) is never read as the positional path. path= and file=
  are accepted for both os.open and open on purpose: a mismatched keyword
  (os.open(file=...), open(path=...)) raises TypeError at runtime, so the
  wider match only covers code that cannot run. It must contain a call to
  os.getpid() inline (f-string, str.format, % formatting, concatenation); a
  local name assigned such an expression in the same function also counts
  for the positional path only (assignments in nested functions do not
  count). A random token from the exclusion list in the rule, in the path (positional
  or path= / file= keyword), suppresses the report. Allow-list decision: the
  random sources are secrets.token_hex, token_urlsafe, token_bytes,
  secrets.randbits, uuid4, os.urandom and random.SystemRandom().getrandbits,
  all drawn from the OS CSPRNG or a random UUID. uuid1 is NOT allowed: it is
  derived from the host identifier and a timestamp, so it is predictable
  across restarts of the same host. secrets.choice is NOT allowed: it returns
  one element of the caller's sequence, so its entropy depends on a length
  this rule cannot inspect. Not reported when the call
  is in the body of a try whose except clause catches OSError or
  FileExistsError (alone or in a tuple) or is a bare except. A handler for an
  unrelated exception such as ValueError does not suppress the report, and
  only the handler's exception types count, never its as binding name. The
  try must be in the same function: a create inside a nested def within a
  handled try is still reported.
rule:
  kind: call
  all:
    - any:
        - all:
            - has:
                field: function
                pattern: os.open
            - has:
                field: arguments
                has:
                  any:
                    - all:
                        - nthChild: 2
                        - regex: 'O_EXCL'
                    - all:
                        - kind: keyword_argument
                        - has:
                            field: name
                            regex: '^flags$'
                        - regex: 'O_EXCL'
        - all:
            - has:
                field: function
                kind: identifier
                regex: '^open$'
            - has:
                field: arguments
                has:
                  any:
                    - all:
                        - nthChild: 2
                        - kind: string
                        - regex: '^[a-zA-Z]*["''][rwabt+]*x[rwabt+]*["'']$'
                    - all:
                        - kind: keyword_argument
                        - has:
                            field: name
                            regex: '^mode$'
                        - has:
                            field: value
                            kind: string
                            regex: '^[a-zA-Z]*["''][rwabt+]*x[rwabt+]*["'']$'
    - has:
        field: arguments
        has:
          any:
            - nthChild: 1
              not:
                kind: keyword_argument
              any:
                - has:
                    stopBy: end
                    kind: call
                    pattern: os.getpid()
                - all:
                    - kind: identifier
                    - pattern: $T
                    - inside:
                        stopBy:
                          kind: function_definition
                        kind: function_definition
                        has:
                          stopBy:
                            kind: function_definition
                          kind: assignment
                          all:
                            - has:
                                field: left
                                pattern: $T
                            - has:
                                field: right
                                has:
                                  stopBy: end
                                  kind: call
                                  pattern: os.getpid()
            - all:
                - kind: keyword_argument
                - has:
                    field: name
                    regex: '^(path|file)$'
                - has:
                    field: value
                    has:
                      stopBy: end
                      kind: call
                      pattern: os.getpid()
    - not:
        has:
          field: arguments
          has:
            any:
              - nthChild: 1
                not:
                  kind: keyword_argument
                has:
                  stopBy: end
                  kind: call
                  regex: '^((secrets\.)?(token_hex|token_urlsafe|token_bytes)|secrets\.randbits|(uuid\.)?uuid4|os\.urandom|random\.SystemRandom\(\)\.getrandbits)\('
              - all:
                  - kind: keyword_argument
                  - has:
                      field: name
                      regex: '^(path|file)$'
                  - has:
                      field: value
                      has:
                        stopBy: end
                        kind: call
                        regex: '^((secrets\.)?(token_hex|token_urlsafe|token_bytes)|secrets\.randbits|(uuid\.)?uuid4|os\.urandom|random\.SystemRandom\(\)\.getrandbits)\('
    - not:
        inside:
          stopBy:
            kind: function_definition
          kind: block
          inside:
            kind: try_statement
            has:
              kind: except_clause
              any:
                - kind: except_clause
                  not:
                    has:
                      field: value
                      regex: '\S'
                - has:
                    field: value
                    not:
                      kind: as_pattern
                    regex: '\b(OSError|FileExistsError)\b'
                - has:
                    field: value
                    kind: as_pattern
                    has:
                      nthChild: 1
                      regex: '\b(OSError|FileExistsError)\b'
metadata:
  known_false_positives: 'A temporary in a per-process private directory is still reported; a local name assigned a name that mixes os.getpid() with a random token is still reported (only the inline name expression is excluded, so the assignment is not followed); so is a create whose FileExistsError is caught by a handler further up the call chain or by except Exception, BaseException, IOError or EnvironmentError, which are not recognised (only OSError, FileExistsError and a bare except count); a local name assigned from os.getpid() anywhere in the same function counts even when it is rebound before the open'
  known_false_negatives: 'Breadth trade-off (documented): any call whose text starts with a listed name (secrets.token_hex/token_urlsafe/token_bytes, secrets.randbits, random.SystemRandom().getrandbits, bare token_hex/token_urlsafe/token_bytes, uuid4 or uuid.uuid4, os.urandom) anywhere inside the name expression suppresses the finding, even one whose output does not reach the name text (for example wrapped in len()). The rule does not check imports, so a function of one of these names from any source (local, third-party, even one returning a predictable value) also suppresses it. Syntactic: a method call on another object (obj.token_hex(8), myuuid.uuid4()) is not matched and still reports. os import aliases (from os import open, import os as o, from os import getpid) are not resolved; a path built by a helper or in another function (cross-function builders) is not reported; a path name assigned from a name that itself came from os.getpid() (two-step) is not reported; a nested function that opens a name assigned in its enclosing function is not reported; a path= or file= keyword whose value is a local name assigned from os.getpid() is not followed (only the inline expression and the positional path are); flags held in a variable (flags = os.O_WRONLY | os.O_EXCL; os.open(p, flags)) are not reported, nor are modes held in a variable; pathlib Path.open("x") and Path.touch(exist_ok=False) are not covered; os.open with the flags as a keyword other than flags= is not reported; a try that catches the error only in its else or finally block, or a handler in the except clause body, does not count'
  cwe: 'CWE-377'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/377.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A01:2025'
