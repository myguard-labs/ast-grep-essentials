id: py-nonlocal-unguarded-file-read-rebind
language: python
severity: warning
message: >-
  A nonlocal variable is rebound from a file read without an enclosing
  if-guard.
note: >-
  Syntactic single-file match only. It looks for a function containing a
  nonlocal declaration and a direct assignment from a literal
  Path(...).read_bytes() call; it does not verify that the guard tests the
  assigned variable or model runtime control flow.
rule:
  all:
    - kind: function_definition
    - has:
        pattern: 'nonlocal $VAR'
        stopBy: end
    - has:
        pattern: '$VAR = Path($PATH).read_bytes()'
        stopBy: end
    - not:
        has:
          pattern: 'if $COND: $$$IFBODY'
          stopBy: end
