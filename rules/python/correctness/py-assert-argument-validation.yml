id: py-assert-argument-validation
language: python
severity: warning
message: >-
  Validation written as an assert statement is removed under python -O; raise
  an explicit exception instead.
note: >-
  Syntactic only. The rule matches any assert whose condition is a comparison
  inside a function, except an `is None` or `is not None` check, which is
  usually type narrowing rather than validation. It cannot tell whether the
  compared name is a parameter or the other side is a constant, so asserts on
  locals or internal invariants are also flagged and need triage.
rule:
  kind: assert_statement
  has:
    kind: comparison_operator
    not:
      any:
        - pattern: '$A is not None'
        - pattern: '$A is None'
  inside:
    kind: function_definition
    stopBy: end
