# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-resource-warning-before-finally-in-del
language: python
severity: warning
message: ResourceWarning is emitted before a subsequent try/finally in __del__.
note: >-
  This matches only a direct warning statement and a later sibling try/finally
  in __del__; it does not resolve names, determine warning filters, or prove
  runtime cleanup behavior.
rule:
  all:
    - kind: expression_statement
    - has:
        pattern: 'warnings.warn($MESSAGE, ResourceWarning)'
    - inside:
        kind: block
        inside:
          all:
            - kind: function_definition
            - regex: '^def\s+__del__\s*\('
    - precedes:
        stopBy: end
        all:
          - kind: try_statement
          - has:
              kind: finally_clause
metadata:
  rule_modified_at: '2026-09-22'
