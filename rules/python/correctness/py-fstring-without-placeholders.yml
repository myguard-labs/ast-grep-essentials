# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-fstring-without-placeholders
language: python
severity: warning
message: f-string literal contains no replacement field
note: >-
  Syntactic check only. Flags f-string literals whose source node has no
  interpolation child. Escaped braces written as {{ }} are not interpolations.
  Does not analyze types, dataflow, or implicit concatenation across literals.
rule:
  kind: string
  regex: '^([rR][fF]|[fF][rR]?)["'']'
  not:
    has:
      kind: interpolation
      stopBy: end
