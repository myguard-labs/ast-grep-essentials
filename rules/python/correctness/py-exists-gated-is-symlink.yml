id: py-exists-gated-is-symlink
language: python
severity: warning
message: >-
  An exists() check gates is_symlink(); for pathlib paths, this misses
  dangling symlinks.
note: >-
  Matches only the syntactic conjunction on the same receiver expression. It
  does not establish that the receiver is a pathlib path or verify runtime
  behavior.
rule:
  pattern: '$P.exists() and $P.is_symlink()'
