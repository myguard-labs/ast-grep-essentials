id: py-inclusive-span-count-upper-bound
language: python
severity: warning
message: >-
  Chained range check uses an inclusive upper bound of start plus count; a
  span of count items ends at start plus count minus one.
note: >-
  Matches only the syntactic shape `lo <= x <= lo + n` with the same lo text.
  It cannot tell whether n is a count or an inclusive end, so some correct
  inclusive ranges may be flagged.
rule:
  pattern: '$LO <= $X <= $LO + $N'
