id: py-is-literal-compare
language: python
severity: error
message: >-
  Identity comparison against a literal. `is` asks whether two names point at the
  same object, which for strings, numbers and containers depends on interning and
  on how the value was produced, so the branch fires or does not fire for reasons
  the code does not state. Compare with == instead; keep `is` for None, True and
  False.
note: >-
  Fires on an `is` or `is not` comparison whose right operand is a string,
  number, list, tuple, set or dictionary literal. CPython interns small integers
  and some strings, so such a comparison can appear to work in a REPL and fail
  on longer values or another interpreter. There is no routine dismissal; the
  fix is always ==.
rule:
  kind: comparison_operator
  all:
    - regex: '\bis\b'
    - has:
        nthChild: 2
        any:
          - kind: string
          - kind: integer
          - kind: float
          - kind: list
          - kind: tuple
          - kind: set
          - kind: dictionary
          - kind: concatenated_string
