id: py-ml-model-no-explicit-device
language: python
severity: warning
message: >-
  CrossEncoder or SentenceTransformer is constructed without an explicit
  device keyword argument; the device is auto-selected per host.
note: >-
  Syntactic check only. It matches direct calls named CrossEncoder or
  SentenceTransformer whose argument list has no literal device= keyword. It
  cannot see a device passed via **kwargs or positionally, aliased imports, or
  attribute-qualified calls such as module.CrossEncoder.
rule:
  kind: call
  has:
    field: function
    kind: identifier
    regex: '^(CrossEncoder|SentenceTransformer)$'
  not:
    has:
      field: arguments
      has:
        kind: keyword_argument
        has:
          field: name
          regex: '^device$'
