id: py-lancedb-deprecated-table-names
language: python
severity: warning
message: >-
  table_names() is deprecated in LanceDB and may return only some table names.
  Use list_tables() instead.
note: >-
  This is a syntactic match only. It flags any zero-argument call to a method
  named table_names(). It cannot tell whether the receiver is a LanceDB
  connection, so other libraries that have a table_names method will also
  match.
rule:
  pattern: '$DB.table_names()'
