# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-regex-built-by-string-replace
language: python
severity: warning
message: >-
  Regex pattern is built by calling .replace() on a string that is not wrapped
  in re.escape(); other metacharacters stay live.
note: >-
  Syntactic signal only. The rule matches only a direct .replace() call as the
  first argument to re.compile, re.match, re.search or re.fullmatch, where the
  receiver is not a direct re.escape(...) call. It cannot tell whether the
  input is trusted or constant, and it does not follow values through
  variables or aliases.
rule:
  pattern: 're.$F($$$ARGS)'
  has:
    field: arguments
    has:
      nthChild: 1
      pattern: '$S.replace($$$A)'
constraints:
  F:
    regex: '^(compile|match|search|fullmatch)$'
  S:
    not:
      pattern: 're.escape($$$E)'
