id: py-splitext-extension-lookup
language: python
severity: warning
message: >-
  A mapping lookup is keyed only on the lower-cased file extension from
  os.path.splitext, so full-name and multi-part suffix matches are lost.
note: >-
  Syntactic match only. It flags a .get() call whose sole argument is
  os.path.splitext(...)[1].lower(). It cannot tell whether the receiver is
  really a mapping or whether full-name and multi-part suffixes are handled
  somewhere else.
rule:
  pattern: '$MAP.get(os.path.splitext($NAME)[1].lower())'
