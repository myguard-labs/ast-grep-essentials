id: py-replace-url-path-segment
language: python
severity: warning
message: >-
  Deleting a path-prefix literal with str.replace removes every occurrence,
  not only a leading prefix; prefer removeprefix or an explicit startswith
  check.
note: >-
  Syntactic only. Matches .replace calls that substitute a string literal
  starting with '/' by an empty string literal. It cannot tell whether the
  receiver is a URL or path string, or whether replacing every occurrence is
  actually intended.
rule:
  pattern: '$S.replace($P, $E)'
constraints:
  P:
    kind: string
    regex: '^[rRuU]?[''"]/'
  E:
    regex: '^(''''|"")$'
