id: py-or-literals-membership-test
language: python
severity: warning
message: >-
  Parenthesized boolean `or` of two string literals is the left operand of an
  `in` / `not in` test, so only the first literal is checked.
note: >-
  Syntactic match only: it requires a comparison whose text starts with a
  parenthesized `"..." or "..."` (single or double quoted string literals)
  followed by `in` or `not in`. It does not verify types, runtime values, or
  that the author intended a tuple; it does not match tuples or non-literal
  operands.
rule:
  all:
    - kind: comparison_operator
    - regex: >-
        ^\(\s*(?:"[^"\n]*"|'[^'\n]*')\s+or\s+(?:"[^"\n]*"|'[^'\n]*')\s*\)\s+(?:not\s+)?in\s
