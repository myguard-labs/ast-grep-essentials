id: py-recovery-limit-check-only-in-except
language: python
severity: warning
message: >-
  Loop index limit check appears inside an except clause, so successful
  iterations never reach it.
note: >-
  Syntactic only. It flags an `if <loop index> > <limit>` check nested in an
  except clause within the for loop that binds the index. It does not verify
  whether another check elsewhere in the loop already enforces the limit.
rule:
  kind: if_statement
  has:
    field: condition
    pattern: '$I > $L'
  inside:
    kind: except_clause
    stopBy: end
    inside:
      kind: for_statement
      stopBy: end
      has:
        field: left
        pattern: '$I'
