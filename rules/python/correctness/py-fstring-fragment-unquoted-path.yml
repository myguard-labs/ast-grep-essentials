# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-fstring-fragment-unquoted-path
language: python
severity: warning
message: >-
  f-string builds a '#L' URL fragment from a bare variable without
  percent-encoding it.
note: >-
  Syntactic only. This flags an f-string interpolation whose expression is a
  bare identifier and that comes right after literal text ending in '#L'. It
  cannot tell whether the variable was already percent-encoded earlier, or
  whether its value could ever contain reserved characters.
rule:
  kind: interpolation
  has:
    field: expression
    kind: identifier
  follows:
    kind: string_content
    regex: '#L$'
