# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-invalid-escape-sequence
language: python
severity: warning
message: >-
  Invalid escape sequence in a non-raw string literal; use a raw string or
  escape the backslash.
note: >-
  Syntactic check of string content text only; it does not handle
  bytes-specific escape rules such as \N or \u being invalid in bytes
  literals.
rule:
  kind: string_content
  regex: '(^|[^\\])(\\\\)*\\[^\\\n\r''"abfnrtv0-7xNuU]'
  not:
    inside:
      kind: string
      has:
        kind: string_start
        regex: '[rR]'
