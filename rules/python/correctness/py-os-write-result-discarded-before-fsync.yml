id: py-os-write-result-discarded-before-fsync
language: python
severity: warning
message: >-
  The return value of os.write is discarded before os.fsync on the same
  descriptor. os.write may write fewer bytes than requested; loop until all
  bytes are written, or check the returned count, before calling os.fsync.
note: >-
  This checks adjacent statements with syntactically identical descriptor
  arguments. It does not resolve os bindings or prove descriptor identity,
  short writes, or incomplete contents.
rule:
  pattern:
    context: 'os.write($FD, $DATA)'
    selector: expression_statement
  precedes:
    stopBy: neighbor
    pattern:
      context: 'os.fsync($FD)'
      selector: expression_statement
metadata:
  known_false_positives: 'A write whose completeness is checked another way after the fsync (for example by comparing the os.fstat size) is still reported when the adjacent statement is os.fsync on the same descriptor. A descriptor that is a pipe or socket, where fsync fails and the write is not a durability point, is still reported.'
  known_false_negatives: 'Not reported: a write whose return value is bound (n = os.write(...)); an os.write not immediately followed by os.fsync on the same descriptor (followed by os.close, another statement, a comment line, or fsync on a different name); f.write followed by os.fsync(f.fileno()). Descriptor identity is textual, so an alias (fd2 = fd) is not matched. os bindings are not resolved: a from-import or renamed os module is not covered.'
  rule_modified_at: '2026-11-21'
  ast_grep_tested_version: 0.51.3
  validated_at: '2026-11-21'
  created_at: '2026-11-21'
