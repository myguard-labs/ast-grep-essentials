# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-zip-parallel-no-strict
language: python
severity: 'off'
message: >-
  Deprecated rule ID; use py-zip-without-strict. A zip() call over parallel
  sequences without strict=True silently truncates mismatched lengths.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use py-zip-without-strict and do not emit this rule.
rule:
  all:
    - kind: call
    - has:
        field: function
        kind: identifier
        regex: ^zip$
    - has:
        field: arguments
        any:
          - has:
              nthChild:
                position: 2
                ofRule:
                  not:
                    any:
                      - kind: keyword_argument
                      - kind: dictionary_splat
                      - kind: comment
          - has:
              kind: list_splat
    - not:
        has:
          field: arguments
          has:
            kind: keyword_argument
            has:
              field: name
              regex: ^strict$
metadata:
  deprecated_alias_of: py-zip-without-strict
  created_at: '2026-09-05'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
