# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-pwrite-result-discarded-after-truncate
language: python
severity: warning
message: The return value of os.pwrite is discarded immediately after os.ftruncate.
note: >-
  This checks adjacent statements with syntactically identical descriptor
  arguments. It does not resolve os bindings or prove descriptor identity,
  short writes, or incomplete contents.
rule:
  pattern:
    context: 'os.pwrite($FD, $DATA, $OFFSET)'
    selector: expression_statement
  follows:
    stopBy: neighbor
    pattern:
      context: 'os.ftruncate($FD, $SIZE)'
      selector: expression_statement
