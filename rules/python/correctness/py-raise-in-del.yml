id: py-raise-in-del
language: python
severity: warning
message: >-
  __del__ directly raises an exception; destructor exceptions are ignored and
  cannot reliably report failure.
note: >-
  Matches only a function named __del__ directly in a class body with a
  raise_statement directly in its function body. Module-level functions,
  conditional raises, nested-callable raises, and locally handled raises are
  outside this single-file syntactic boundary.
rule:
  all:
    - kind: function_definition
    - inside:
        kind: block
        inside:
          kind: class_definition
    - has:
        field: name
        regex: '^__del__$'
    - has:
        field: body
        kind: block
        has:
          kind: raise_statement
