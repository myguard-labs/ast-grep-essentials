id: py-blocking-open-before-regular-file-check
language: python
severity: warning
message: >-
  Opening with os.O_RDONLY alone may block when the path is a FIFO without a
  writer.
note: >-
  This matches only the literal os.open call syntax. It does not establish the
  path type, binding of os, runtime blocking, or a subsequent regular-file
  check.
rule:
  pattern: 'os.open($PATH, os.O_RDONLY)'
