id: py-git-b-path-none-filename
language: python
severity: warning
message: >-
  GitPython diff .b_path is None for deleted files; use a fallback such as
  `.b_path or .a_path`.
note: >-
  Syntactic only. Matches any `.b_path` attribute access whose direct parent
  is not an `or` expression. It cannot check that the receiver is a GitPython
  Diff, that the file is never deleted, or that a None check happens
  elsewhere.
rule:
  pattern: '$X.b_path'
  not:
    inside:
      pattern: '$A or $B'
