# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-assert-after-tempdir-exit
language: python
severity: warning
message: >-
  assertFalse(os.path.exists(...)) on a TemporaryDirectory name runs after the
  with block has exited. The directory is always removed on exit, so the
  assertion can never fail. Move it inside the with block, or assert on state
  the code under test produced.
note: >-
  Fires on an expression statement self.assertFalse(os.path.exists(T)) that
  follows, in the same block, a with statement binding T through
  tempfile.TemporaryDirectory() or TemporaryDirectory() (as T). T must be the
  same name in both. A derived path (base = os.path.join(T, ...)), a name
  rebound by plain or augmented assignment between the with block and the
  assertion (the scan for the rebinding stops at the TemporaryDirectory with
  statement, so unrelated with blocks in between do not end it), other
  assertion forms and a with statement in an enclosing block are not matched. Only the
  argument-less call is matched: TemporaryDirectory(prefix=...), dir=... and
  delete=... forms are not. Rebinding by for T in ..., a later with ... as T or
  a tuple target is not handled (the rule still fires). An assertion that
  deliberately checks the cleanup itself is the routine dismissal.
rule:
  all:
    - kind: expression_statement
    - has:
        pattern: $S.assertFalse(os.path.exists($T))
    - follows:
        stopBy: end
        kind: with_statement
        has:
          kind: with_clause
          has:
            kind: with_item
            has:
              kind: as_pattern
              all:
                - has:
                    kind: call
                    regex: '^(tempfile\.)?TemporaryDirectory\(\)$'
                - has:
                    kind: as_pattern_target
                    pattern: $T
    - not:
        follows:
          stopBy:
            kind: with_statement
            has:
              kind: with_clause
              has:
                kind: with_item
                has:
                  kind: as_pattern
                  all:
                    - has:
                        kind: call
                        regex: '^(tempfile\.)?TemporaryDirectory\(\)$'
                    - has:
                        kind: as_pattern_target
                        pattern: $T
          kind: expression_statement
          has:
            any:
              - kind: assignment
              - kind: augmented_assignment
            has:
              field: left
              pattern: $T
metadata:
  created_at: '2026-11-15'
