id: py-except-missing-attributeerror-extension
language: python
severity: warning
message: >-
  This except clause guards a call to enable_load_extension but does not catch
  AttributeError, which is raised when Python is built without
  loadable-extension support.
note: >-
  This is a syntax-only check. It flags typed except clauses that do not name
  AttributeError in a try statement whose body calls
  .enable_load_extension(...). Bare except clauses are skipped. It does not
  resolve aliases or base classes such as Exception. It does not check whether
  the receiver is really a sqlite3 connection or look at other except clauses
  in the same try statement.
rule:
  kind: except_clause
  regex: '^except\s*[^\s:]'
  not:
    has:
      kind: identifier
      regex: '^AttributeError$'
      stopBy: end
  inside:
    kind: try_statement
    has:
      field: body
      has:
        pattern: '$CONN.enable_load_extension($$$ARGS)'
        stopBy: end
