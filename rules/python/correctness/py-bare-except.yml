# Generated from: plans/python/correctness/py-bare-except.yml
id: py-bare-except
language: python
severity: warning
message: >-
  Bare `except:` catches BaseException subclasses such as KeyboardInterrupt and SystemExit,
  so a shutdown signal can be treated as a routine error (OWASP A10:2025, CWE-396).
  Catch `Exception` when you mean ordinary failures, or name the specific errors you
  can handle.
note: >-
  Fires on a clause with no exception type. A bare clause that re-raises with a direct
  bare `raise`, and contains no return or competing non-bare raise, is treated as
  the documented cleanup idiom. This conservative syntax check does not prove control
  flow. A clause that can return or raise a different exception still matches. PEP
  760 proposed removing this form from the language.
utils:
  terminal-bare-reraise:
    regex: ^raise$
  nonbare-raise:
    all:
    - kind: raise_statement
    - not:
        regex: ^raise$
rule:
  all:
  - kind: except_clause
  - not:
      has:
        field: value
        regex: .
  - not:
      has:
        kind: block
        all:
        - has:
            matches: terminal-bare-reraise
        - not:
            has:
              kind: return_statement
              stopBy:
                kind: function_definition
        - not:
            has:
              matches: nonbare-raise
              stopBy:
                kind: function_definition
