# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-assert-string-literal-test
language: python
severity: warning
message: >-
  Assert test is a string literal, so it always passes; the condition and
  message look swapped.
note: >-
  Syntactic only. It matches a two-part assert whose test is a single plain
  string literal. It does not catch implicitly concatenated strings, f-strings
  stored in variables, or other always-truthy tests. An empty string literal
  would actually fail, but that is still flagged as suspicious.
rule:
  pattern: 'assert $TEST, $MSG'
constraints:
  TEST:
    kind: string
