id: py-dotenv-bare-module-level-load-call
language: python
severity: warning
message: >-
  Bare load_dotenv() call at module scope reads a .env file as an import-time
  side effect.
note: >-
  Syntactic only. This matches a call to a name spelled load_dotenv with no
  arguments, written as a statement directly at module scope. It does not
  check what load_dotenv refers to or follow aliases, and it misses calls that
  are nested in module-level if, try, or with blocks.
rule:
  pattern: 'load_dotenv()'
  inside:
    kind: expression_statement
    inside:
      kind: module
