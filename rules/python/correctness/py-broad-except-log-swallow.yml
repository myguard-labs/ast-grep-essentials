id: py-broad-except-log-swallow
language: python
severity: warning
message: >-
  Broad `except Exception` handler only logs the error and swallows it without
  re-raising.
note: >-
  Syntactic only. It matches handlers that start with `except Exception` whose
  block holds nothing but `logger.<method>(...)` calls (and comments) and has
  no `raise`. It does not resolve which object the logger name refers to or
  check whether swallowing is intentional, so some hits will be benign.
rule:
  kind: except_clause
  regex: '^except\s+Exception\b'
  has:
    kind: block
    all:
      - has:
          kind: expression_statement
          has:
            pattern: 'logger.$M($$$A)'
      - not:
          has:
            kind: raise_statement
            stopBy: end
      - not:
          has:
            all:
              - not:
                  kind: comment
              - not:
                  kind: expression_statement
                  has:
                    pattern: 'logger.$M2($$$A2)'
