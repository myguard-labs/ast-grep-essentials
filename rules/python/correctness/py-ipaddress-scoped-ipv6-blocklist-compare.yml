# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: py-ipaddress-scoped-ipv6-blocklist-compare
language: python
severity: warning
message: >-
  A parsed ipaddress.ip_address(...) result is tested for membership directly.
  An IPv6 zone identifier changes equality and hashing, so a scoped address
  can get past the blocklist.
note: >-
  This is a syntactic match only. It flags a direct `ipaddress.ip_address(...)
  in <collection>` comparison. It does not check whether the collection is a
  blocklist, whether the input can contain a zone identifier, or whether the
  code normalizes the address somewhere else.
rule:
  pattern: 'ipaddress.ip_address($ADDR) in $COLLECTION'
