id: py-acceptance-named-temp-delete-false
language: python
severity: warning
message: >-
  NamedTemporaryFile with literal delete=False leaves a temporary path
  requiring deliberate cleanup.
note: >-
  Syntactic check only: matches tempfile.NamedTemporaryFile calls or bare
  NamedTemporaryFile calls in a file containing an explicit unaliased from
  tempfile import NamedTemporaryFile statement, with literal delete=False. It
  does not establish name binding, import execution, runtime API identity, or
  cleanup, and does not detect aliases or dynamically supplied arguments.
rule:
  all:
    - kind: call
    - has:
        field: function
        regex: '^(tempfile\.NamedTemporaryFile|NamedTemporaryFile)$'
    - has:
        field: arguments
        has:
          kind: keyword_argument
          all:
            - has:
                field: name
                regex: '^delete$'
            - has:
                field: value
                pattern: 'False'
    - not:
        all:
          - has:
              field: function
              regex: '^NamedTemporaryFile$'
          - not:
              inside:
                kind: module
                stopBy: end
                has:
                  pattern: from tempfile import NamedTemporaryFile
                  stopBy: end
