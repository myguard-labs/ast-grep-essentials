id: wp-request-index-unguarded
language: php
severity: warning
message: >-
  Request superglobal element (POST or GET) is passed directly as a call
  argument without an isset or array_key_exists guard.
note: >-
  Syntactic check only. It matches a direct superglobal subscript used as a
  call argument outside isset or array_key_exists calls and does not detect
  guards elsewhere in the file.
rule:
  all:
    - kind: subscript_expression
    - regex: '^\$_(POST|GET)\['
    - inside:
        kind: argument
    - not:
        inside:
          stopBy: end
          regex: '^(isset|array_key_exists)\s*\('
