id: php-is-array-unguarded-superglobal-read
language: php
severity: warning
message: >-
  is_array() is applied directly to a POST or GET superglobal index read with
  no isset() or empty() guard in the same condition.
note: >-
  Syntactic only. It checks for an isset or empty call inside an enclosing
  binary expression and does not track guards elsewhere or runtime key
  presence.
rule:
  all:
    - pattern: 'is_array($ARG)'
    - not:
        inside:
          stopBy: end
          kind: binary_expression
          has:
            stopBy: end
            kind: function_call_expression
            regex: '^(isset|empty)\s*\('
constraints:
  ARG:
    regex: '^\$_(POST|GET)\s*\['
