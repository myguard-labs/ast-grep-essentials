id: php-ob-get-level-unbounded-loop
language: php
severity: warning
message: >-
  This while loop is conditioned on ob_get_level() and calls ob_end_clean() in
  its body without a bound, so it may never terminate if a buffer cannot be
  removed.
note: >-
  Syntactic single-file match only. It matches a literal while statement whose
  condition is ob_get_level() and whose body contains an ob_end_clean() call;
  it does not verify that a buffer can fail to be removed at runtime or check
  for any other exit path.
rule:
  pattern: 'while (ob_get_level()) { $$$BODY }'
  inside:
    kind: program
    stopBy: end
  has:
    pattern: 'ob_end_clean($$$ARGS)'
    stopBy: end
