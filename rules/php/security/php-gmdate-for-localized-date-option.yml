id: php-gmdate-for-localized-date-option
language: php
severity: warning
message: >-
  gmdate() is called with get_option('date_format') as its format, so the
  displayed date is not localized. Consider date_i18n().
note: >-
  Matches only the literal syntax gmdate(get_option(...), ...) in a single
  file. It does not resolve function identity, aliases, or whether the output
  is displayed.
rule:
  pattern: 'gmdate(get_option($$$ARGS), $$$REST)'
