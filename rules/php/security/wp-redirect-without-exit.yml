id: wp-redirect-without-exit
language: php
severity: warning
message: >-
  wp_redirect() is not followed by exit or die in the same block; execution
  continues after the redirect.
note: >-
  Single-file syntactic check only. It looks at the next sibling statement in
  the same block and does not verify control flow, reachability, or whether a
  later call exits.
rule:
  all:
    - kind: expression_statement
    - has:
        pattern: 'wp_redirect($$$ARGS)'
        stopBy: end
    - not:
        follows:
          pattern: 'exit;'
          stopBy: end
    - not:
        precedes:
          kind: exit_statement
          stopBy: end
    - not:
        follows:
          pattern: 'die;'
          stopBy: end
    - not:
        precedes:
          pattern: 'die;'
          stopBy: end
