id: php-trigger-error-user-error
language: php
severity: warning
message: >-
  trigger_error() is called with E_USER_ERROR, which halts the script and
  cannot be caught. Consider throwing an exception instead.
note: >-
  Matches the literal call trigger_error(..., E_USER_ERROR) by syntax only; it
  does not resolve namespaces, aliases, or whether the constant is redefined.
rule:
  pattern: 'trigger_error($MSG, E_USER_ERROR)'
