id: php-array-keys-option-unguarded
language: php
severity: warning
message: >-
  array_keys() is called directly on a get_option() result without a cast or
  is_array() guard.
note: >-
  Matches only the literal call shape array_keys(get_option(...)) in one file.
  It does not resolve function identity, confirm the option value type, or
  detect guards applied elsewhere.
rule:
  pattern: 'array_keys(get_option($$$ARGS))'
