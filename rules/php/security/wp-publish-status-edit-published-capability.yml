id: wp-publish-status-edit-published-capability
language: php
severity: warning
message: >-
  Publishing is gated by an edit_published_* capability check, which is likely
  the wrong capability (publish_* is expected).
note: >-
  Matches literal syntax only; it does not verify that the status is
  downgraded or resolve the capability's runtime meaning.
rule:
  kind: if_statement
  has:
    field: condition
    stopBy: end
    all:
      - has:
          pattern: '''publish'''
          stopBy: end
      - has:
          pattern: '!current_user_can($CAP)'
          stopBy: end
constraints:
  CAP:
    regex: '^[''"]edit_published_'
metadata:
  rule_modified_at: '2026-10-19'
