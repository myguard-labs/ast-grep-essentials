id: php-server-key-unguarded-read
language: php
severity: warning
message: >-
  Server superglobal key is read inside strlen() without an isset() guard; the
  key may be missing.
note: >-
  Syntactic only; it does not check whether the key is guarded elsewhere or
  whether the host sets it. Only the strlen() form is matched, and the guard
  check is a text match on an enclosing ternary.
rule:
  all:
    - kind: subscript_expression
    - regex: '^\$_SERVER\['
    - inside:
        stopBy: end
        kind: function_call_expression
        regex: '^strlen\s*\('
    - not:
        inside:
          stopBy: end
          kind: conditional_expression
          regex: 'isset\(\s*\$_SERVER'
