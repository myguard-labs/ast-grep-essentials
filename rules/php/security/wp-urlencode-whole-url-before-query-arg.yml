id: wp-urlencode-whole-url-before-query-arg
language: php
severity: warning
message: >-
  A urlencode() call is passed directly as the URL argument of a query-arg
  helper, so the whole URL is percent-encoded before parsing.
note: >-
  Single-file syntactic match on literal remove_query_arg( calls whose second
  argument is directly a urlencode( call. It does not resolve function
  identity, imports, or runtime values, and does not cover add_query_arg.
rule:
  pattern: 'remove_query_arg($KEY, urlencode($URL))'
