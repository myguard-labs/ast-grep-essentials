id: wp-rewrite-php-file-anchor
language: php
severity: warning
message: >-
  Rewrite-map key string ends in a PHP filename anchor, so a trailing path
  after the file is not matched.
note: >-
  Syntactic match on a single array-literal key string whose text ends in
  \.php$ with no trailing path group. Does not resolve runtime rewrite
  behavior, WP_Rewrite handling, or whether the key is used for security
  decisions.
rule:
  kind: string
  regex: '\\\.php\$''$'
  inside:
    kind: array_element_initializer
    stopBy: end
    has:
      kind: string
      stopBy: end
      regex: '\\\.php\$''$'
