id: wp-date-without-timestamp
language: php
severity: warning
message: >-
  date() called with only a format argument reads the default timezone;
  confirm the output is acceptable or pass a timestamp.
note: >-
  Syntactic match on a bare date(format) call with exactly one argument. It
  does not resolve namespaces, prove the call targets the global date()
  function, or determine whether timezone-dependent output matters in context.
rule:
  pattern: 'date($FORMAT)'
