id: php-error-suppressed-include
language: php
severity: warning
message: >-
  This include is prefixed with the @ error-suppression operator, which hides
  errors from the included file.
note: >-
  Matches the literal syntax of an @ prefix directly on an include or
  include_once expression. It does not check whether the suppression is
  intentional, nor resolve included paths or runtime error handling.
rule:
  pattern: '@include_once($$$ARGS)'
