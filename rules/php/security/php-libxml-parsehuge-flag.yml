id: php-libxml-parsehuge-flag
language: php
severity: warning
message: >-
  LIBXML_PARSEHUGE lifts the libxml2 limits on tree depth, text size and entity
  expansion, so a crafted document can exhaust memory. Drop the flag for
  untrusted XML.
note: >-
  Matches the LIBXML_PARSEHUGE constant name in any argument of
  simplexml_load_string, simplexml_load_file, or a DOMDocument or XMLReader
  load, loadXML, loadHTML or XML call. A flag held in a variable is not seen,
  and a document from a trusted, size-limited source is the routine dismissal.
  Entity flags are covered by php-libxml-entity-loading-enabled.

  [CWE-776] [A02:2025] [A05:2021]

  [REFERENCES]
      - https://www.php.net/manual/en/libxml.constants.php
rule:
  kind: name
  regex: '^LIBXML_PARSEHUGE$'
  inside:
    kind: arguments
    inside:
      any:
        - kind: function_call_expression
          has:
            field: function
            regex: '(?i)^\\?(simplexml_load_string|simplexml_load_file)$'
        - kind: member_call_expression
          has:
            field: name
            regex: '(?i)^(loadXML|loadHTML|load|XML)$'
    stopBy: end
metadata:
  created_at: '2026-11-16'
  source: 'MyGuard'
  modified_by: 'MyGuard'
  license: 'MyGuard Internal Use License 1.0'
  cwe: 'CWE-776'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/776.html'
  owasp: 'A02:2025|A05:2021'
  category: 'security'
  references: 'https://www.php.net/manual/en/libxml.constants.php'
