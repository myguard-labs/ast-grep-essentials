# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-umask-without-decoct
language: php
severity: warning
message: >-
  umask() result is used without decoct(); the raw integer is not an octal
  mode string.
note: >-
  Syntactic check only. Matches a bare umask() call with no arguments whose
  parent is not a decoct() call; it does not track where the value flows or
  resolve function identity.
rule:
  all:
    - pattern: 'umask()'
    - not:
        inside:
          pattern: 'decoct($$$ARGS)'
          stopBy: end
