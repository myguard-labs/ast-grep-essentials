id: php-html-href-raw-ampersand
language: php
severity: warning
message: >-
  This href string appears to contain a raw ampersand in its query string;
  encode it as &amp;.
note: >-
  Single-file syntactic match on a PHP string literal whose text contains
  href= followed later by a raw ampersand. Uses a regex without look-around,
  so the not-followed-by-amp check is approximated by a separate pattern arm;
  it does not resolve whether the string is emitted as HTML or whether the URL
  is otherwise valid.
rule:
  kind: string
  regex: 'href=[^>]*\?[^"]*&[^a]'
