id: php-paginate-links-hash-in-base
language: php
severity: warning
message: >-
  The paginate_links() base argument uses add_query_arg() with a %#%
  placeholder; put %_% in the base URL and pass the page pattern via format
  instead.
note: >-
  Syntactic match only on a literal paginate_links(array(...)) call whose
  'base' value is an add_query_arg(...) call containing a '%#%' string
  argument. It does not resolve function identity, imports, or runtime values.
rule:
  pattern: 'paginate_links(array(''base'' => add_query_arg($$$ARGS), $$$REST))'
