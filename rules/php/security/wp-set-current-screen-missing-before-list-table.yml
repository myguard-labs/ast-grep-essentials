id: wp-set-current-screen-missing-before-list-table
language: php
severity: warning
message: >-
  get_list_table() is called in a function that never calls
  set_current_screen() before it.
note: >-
  Syntactic same-function check only. It does not resolve whether
  set_current_screen() runs through another function, hook, or include, and
  does not verify runtime screen state.
rule:
  all:
    - pattern: 'get_list_table($$$ARGS)'
    - inside:
        kind: function_definition
        stopBy: end
        all:
          - not:
              has:
                pattern: 'set_current_screen($$$SARGS)'
                stopBy: end
