id: php-debug-log-call-left-in
language: php
severity: warning
message: >-
  Call to debug_log() looks like a debugging leftover; remove it or replace it
  with a real logging call.
note: >-
  Matches the literal bare function name debug_log at a direct call site. It
  does not verify that debug_log is undefined, resolve namespaces or imports,
  or check whether a project defines its own debug_log helper.
rule:
  pattern: 'debug_log($$$ARGS)'
