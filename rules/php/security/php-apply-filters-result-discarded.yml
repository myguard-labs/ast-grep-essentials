id: php-apply-filters-result-discarded
language: php
severity: warning
message: >-
  The return value of apply_filters is discarded, so the filter result never
  takes effect.
note: >-
  Matches a syntactic expression statement calling apply_filters directly with
  a literal function name; it does not verify the filtered value is unused
  through dataflow or aliasing.
rule:
  all:
    - pattern: 'apply_filters($$$ARGS)'
    - inside:
        kind: expression_statement
        stopBy: neighbor
    - not:
        inside:
          kind: return_statement
          stopBy: end
