id: php-page-count-division-without-ceil
language: php
severity: warning
message: >-
  Division assigned to max_num_pages is not wrapped in ceil(); the last page
  may be dropped.
note: >-
  Syntactic match only. It flags a literal assignment to $this->max_num_pages
  whose right-hand side is a plain division expression, without checking
  types, runtime values, or whether the assignment is reachable.
rule:
  pattern: '$this->max_num_pages = $A / $B'
