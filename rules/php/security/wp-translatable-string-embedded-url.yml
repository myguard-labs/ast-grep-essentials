id: wp-translatable-string-embedded-url
language: php
severity: warning
message: >-
  Translatable string embeds a hardcoded http URL in markup; move the URL into
  a placeholder so it can be localized.
note: >-
  Syntactic match only. Flags a single-quoted string literal passed directly
  to __() whose text contains an http:// URL; it does not resolve function
  identity, imports, or whether the call is a WordPress translation function.
  Only __() is covered by this proposal.
rule:
  pattern: '__(''$A'')'
  has:
    regex: 'http://'
    kind: string_content
    stopBy: end
