# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-log-credential-variable
language: php
severity: warning
message: >-
  A logging call receives a variable whose name contains 'pass'; review
  whether a credential is written to the log.
note: >-
  Syntactic only. Matches logIO calls with a variable argument whose name
  contains 'pass' by text; does not verify the value is a password or resolve
  types, aliases, or runtime values.
rule:
  pattern: 'logIO($$$ARGS)'
  has:
    regex: '\$\w*[Pp][Aa][Ss][Ss]\w*'
