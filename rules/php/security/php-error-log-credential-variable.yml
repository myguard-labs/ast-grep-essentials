# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-error-log-credential-variable
language: php
severity: warning
message: >-
  A credential-like value is passed to a logging call. A password, secret, token or
  API key written to a log file is readable by everyone with log access and
  survives in backups and log shippers. Log a fixed message or a masked form
  instead, never the credential itself.
note: >-
  Fires on an error_log call whose argument is, directly or inside a double-quoted
  string or a concatenation, a variable, a property or a string-keyed array element
  with a name ending in password, passwd, secret, api_key or apikey, in accesstoken, authtoken, refreshtoken, bearertoken, sessiontoken, jwttoken or idtoken (with or without an underscore), or exactly token, in any letter case, for example $password,
  $user->token or $_POST['password']. The name is matched, not the value, so a
  boolean flag such as $has_password or a masked copy under a matching name is a
  false positive; a call such as strlen($password) or md5($token) is not matched,
  and a credential reached through another name is not seen. The WordPress
  logIO helper is covered by php-log-credential-variable. A fixture or masked
  value is the routine dismissal.

  [CWE-532] [A09:2025] [A09:2021]

  [REFERENCES]
      - https://cwe.mitre.org/data/definitions/532.html
rule:
  kind: function_call_expression
  all:
    - has:
        field: function
        regex: '^error_log$'
    - has:
        field: arguments
        has:
          kind: argument
          has:
            any:
              - kind: variable_name
                regex: '(?i)^\$(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
              - kind: subscript_expression
                regex: '(?i)\[\s*[''"](?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)[''"]\s*\]$'
              - kind: member_access_expression
                has: {field: name, regex: '(?i)^(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'}
              - kind: encapsed_string
                has:
                  any:
                    - kind: variable_name
                      regex: '(?i)^\$(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
                    - kind: subscript_expression
                      regex: '(?i)\[\s*[''"](?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)[''"]\s*\]$'
                    - kind: member_access_expression
                      has: {field: name, regex: '(?i)^(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'}
              - kind: binary_expression
                has:
                  any:
                    - kind: variable_name
                      regex: '(?i)^\$(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
                    - kind: subscript_expression
                      regex: '(?i)\[\s*[''"](?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)[''"]\s*\]$'
                    - kind: member_access_expression
                      has: {field: name, regex: '(?i)^(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'}
