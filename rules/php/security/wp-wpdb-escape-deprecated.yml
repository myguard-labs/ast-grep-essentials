id: wp-wpdb-escape-deprecated
language: php
severity: warning
message: >-
  Deprecated $wpdb->escape() call; use $wpdb->prepare() with placeholders
  instead.
note: >-
  Matches the literal receiver syntax $wpdb->escape(...) only. It does not
  resolve that $wpdb is the WordPress global, does not check aliasing or
  dataflow, and does not prove the call is reachable.
rule:
  pattern: '$wpdb->escape($$$ARGS)'
