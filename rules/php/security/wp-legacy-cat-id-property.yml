id: wp-legacy-cat-id-property
language: php
severity: warning
message: 'Property read of legacy category field cat_ID; use term_id instead.'
note: >-
  Matches only literal property reads of cat_ID on a receiver named $category
  in a single file. It does not verify that the object came from a legacy
  category API and does not resolve types or aliases.
rule:
  pattern: '$category->cat_ID'
