id: wp-get-results-row-array-access
language: php
severity: warning
message: >-
  Array-style access on a $wpdb->get_results() result reads a stdClass row as
  an array; use property access or get_row().
note: >-
  Syntactic match only. It flags a literal $wpdb->get_results(...) call
  directly indexed with [..]; it does not track variables assigned from
  get_results or confirm the returned type at runtime.
rule:
  pattern: '$wpdb->get_results($$$ARGS)[$KEY]'
