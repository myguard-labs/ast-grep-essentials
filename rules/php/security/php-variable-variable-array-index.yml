id: php-variable-variable-array-index
language: php
severity: warning
message: >-
  Unbraced variable-variable used as an array index base; write ${$name}[...]
  to make the target explicit.
note: >-
  Single-file syntactic match on a variable-variable whose subscript is
  applied directly to the bare $$name form. It does not resolve what $name
  holds or verify the PHP version in use.
rule:
  pattern: '$$name[$KEY]'
