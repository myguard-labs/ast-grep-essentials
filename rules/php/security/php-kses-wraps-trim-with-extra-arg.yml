id: php-kses-wraps-trim-with-extra-arg
language: php
severity: warning
message: >-
  wp_kses() receives a trim() call with two arguments, so the allowed-tags
  value is passed to trim() as a character mask.
note: >-
  Single-file syntactic match on the literal wp_kses(trim(..., ...)) shape
  only. It does not resolve function identity, imports, or runtime values.
rule:
  pattern: 'wp_kses(trim($A, $B))'
