id: php-server-superglobal-unguarded-read
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-superglobal-index-unguarded. A key of the server
  superglobal is read by subscript without an isset, empty or ?? guard.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-superglobal-index-unguarded and do not emit this rule.
rule:
  all:
    - kind: subscript_expression
    - regex: '^\$_(ENV|SERVER|GET|POST|COOKIE|REQUEST)\s*\['
    - not:
        inside:
          kind: binary_expression
          regex: '\?\?'
          field: left
    - not:
        inside:
          kind: parenthesized_expression
          inside:
            kind: binary_expression
            regex: '\?\?'
            field: left
    - not:
        inside:
          any:
            - kind: assignment_expression
            - kind: augmented_assignment_expression
              has:
                field: operator
                regex: '^\?\?=$'
          field: left
    - not:
        inside:
          regex: '^(isset|empty)\s*\('
          stopBy: end
metadata:
  deprecated_alias_of: php-superglobal-index-unguarded
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.51.0
