id: php-server-superglobal-unguarded-read
language: php
severity: warning
message: >-
  Assignment reads a key of the server superglobal by subscript; confirm the
  key is guarded with isset or empty.
note: >-
  Purely syntactic; it does not detect isset or empty guards elsewhere in the
  function, so guarded reads also match.
rule:
  kind: subscript_expression
  regex: '^\$_SERVER\['
  inside:
    kind: assignment_expression
    stopBy: end
