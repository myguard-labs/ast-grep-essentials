id: wp-echo-template-tag-as-value
language: php
severity: warning
message: >-
  A WordPress echo-style template tag is used as an argument value; it prints
  output directly and returns nothing. Use the get_the_* variant instead.
note: >-
  Syntactic match only on a direct call to a literal the_* function name used
  as an argument inside a printf call. It does not verify that the function is
  a WordPress template tag or resolve namespaces, imports, or runtime
  identity.
rule:
  pattern: 'printf($$$ARGS, the_title())'
