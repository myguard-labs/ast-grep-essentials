# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-ie-conditional-endif-malformed
language: php
severity: warning
message: >-
  This string contains a malformed closing IE conditional comment
  '<!endif-->'; browsers will ignore it.
note: >-
  Matches the literal string syntax '<!endif-->' only; it does not check
  whether the string is emitted as HTML or resolve any runtime value.
rule:
  kind: string_content
  regex: '^<!endif-->$'
