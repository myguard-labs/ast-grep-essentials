id: wp-home-url-request-uri
language: php
severity: warning
message: >-
  home_url() is called with the REQUEST_URI superglobal as its path argument;
  this can duplicate the base path on subdirectory installs.
note: >-
  Matches the literal call syntax only; it does not resolve aliases, wrappers,
  or whether the value is sanitized.
rule:
  all:
    - kind: function_call_expression
    - has:
        field: function
        regex: '^home_url$'
    - has:
        field: arguments
        has:
          kind: argument
          regex: '^\$_SERVER\[[''"]REQUEST_URI[''"]\]$'
