id: php-unserialize
language: php
severity: warning
message: >-
  unserialize() can instantiate objects and invoke loading hooks. Never pass
  request or other untrusted data; use a standard data format such as JSON.
note: >-
  Fires on every unserialize call. allowed_classes=false is only an additional
  restriction for independently trusted or authenticated serialized data; it
  does not make untrusted input safe. See
  https://www.php.net/manual/en/function.unserialize.php.
rule:
  kind: function_call_expression
  has:
    field: function
    regex: '(?i)^\\?unserialize$'
