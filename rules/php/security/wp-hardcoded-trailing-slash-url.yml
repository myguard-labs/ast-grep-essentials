id: wp-hardcoded-trailing-slash-url
language: php
severity: warning
message: >-
  Page URL appends a hardcoded slash after a dynamic segment; pass the number
  through user_trailingslashit() instead.
note: >-
  Single-file syntactic match on a concatenation whose final operand is a
  literal string beginning with '/' following a variable. It does not resolve
  whether the variable is a page number or whether the site uses a
  trailing-slash setting.
rule:
  pattern: '$OUT . $N . ''/">'''
