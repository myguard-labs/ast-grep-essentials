# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-md5-email-without-lowercase
language: php
severity: warning
message: >-
  md5() is applied directly to $email without strtolower(); mixed-case
  addresses will hash differently from their normalised form.
note: >-
  Single-file syntactic match on a direct md5() call whose sole argument is
  the literal variable $email. It does not resolve types, aliases, or whether
  normalisation happens elsewhere before the call.
rule:
  pattern: 'md5($email)'
