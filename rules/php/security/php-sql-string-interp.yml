id: php-sql-string-interp
language: php
severity: warning
message: >-
  A supported database function receives an interpolated string in its query
  position. Review it as a SQL-injection candidate; use a prepared statement
  with bound parameters (?, :name) instead of interpolation in SQL text.
note: >-
  The matcher recognizes explicit function names and their query positions; it
  does not resolve aliases or member calls. Dismiss only if every interpolated
  value is hardcoded or validated to a fixed enum.
rule:
  all:
    - kind: function_call_expression
    - any:
        - all:
            - has:
                field: function
                regex: '(?i)^\\?(query|prepare|exec|get_results|get_row|get_var)$'
            - has:
                field: arguments
                kind: arguments
                has:
                  all:
                    - kind: argument
                    - nthChild:
                        position: 1
                        ofRule: {kind: argument}
                    - has:
                        stopBy:
                          any:
                            - kind: anonymous_function
                            - kind: arrow_function
                        all:
                          - kind: variable_name
                          # Check ancestry without adding its range a second time.
                          - not:
                              not:
                                inside:
                                  kind: encapsed_string
                                  stopBy: end
        - all:
            - has:
                field: function
                regex: >-
                  (?i)^\\?(mysqli_query|mysqli_real_query|mysqli_multi_query|mysqli_execute_query)$
            - has:
                field: arguments
                kind: arguments
                has:
                  all:
                    - kind: argument
                    - nthChild:
                        position: 2
                        ofRule: {kind: argument}
                    - has:
                        stopBy:
                          any:
                            - kind: anonymous_function
                            - kind: arrow_function
                        all:
                          - kind: variable_name
                          # Check ancestry without adding its range a second time.
                          - not:
                              not:
                                inside:
                                  kind: encapsed_string
                                  stopBy: end
