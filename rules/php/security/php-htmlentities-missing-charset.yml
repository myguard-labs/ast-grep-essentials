id: php-htmlentities-missing-charset
language: php
severity: warning
message: >-
  htmlentities() is called with a single argument; pass ENT_* flags and
  'UTF-8' explicitly.
note: >-
  Syntactic check only. Matches a direct htmlentities() call with exactly one
  argument; it does not verify the runtime default_charset or PHP version.
rule:
  pattern: 'htmlentities($ARG)'
