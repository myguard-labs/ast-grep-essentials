# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-legacy-gravatar-avatar-php-url
language: php
severity: warning
message: >-
  This string names the retired Gravatar avatar.php endpoint; use the
  /avatar/<hash> endpoint instead.
note: >-
  Purely syntactic check on a string literal containing
  gravatar.com/avatar.php with a gravatar_id parameter. It does not resolve
  how the string is used at runtime or whether the URL is reached.
rule:
  kind: string
  regex: 'gravatar\.com/avatar\.php\?gravatar_id='
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
