id: php-isset-superglobal-always-true
language: php
severity: warning
message: >-
  isset() on a bare superglobal array is always true; test a specific key
  instead.
note: >-
  Matches literal isset() calls whose single argument is the bare POST, GET or
  REQUEST superglobal variable; it does not resolve scope, aliasing, or
  whether the code runs in a web request.
rule:
  pattern: 'isset($ARG)'
constraints:
  ARG:
    regex: '^\$_(POST|GET|REQUEST)$'
