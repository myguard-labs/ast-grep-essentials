id: wp-xmlrpc-url-uses-home-bloginfo
language: php
severity: warning
message: >-
  This builds an xmlrpc.php URL from get_bloginfo('url'); xmlrpc.php lives
  under the WordPress install URL, so use get_bloginfo('wpurl').
note: >-
  Syntactic match only on a literal get_bloginfo('url') concatenated with
  '/xmlrpc.php'. It does not resolve whether the install's home and WordPress
  URLs differ at runtime.
rule:
  pattern: 'get_bloginfo(''url'') . ''/xmlrpc.php'''
