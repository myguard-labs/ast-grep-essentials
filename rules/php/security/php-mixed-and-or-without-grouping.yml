# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-mixed-and-or-without-grouping
language: php
severity: warning
message: >-
  This boolean expression mixes && and || without parentheses; review the
  intended grouping.
note: >-
  Purely syntactic check on a binary expression whose operator is || and whose
  left operand is an unparenthesized && expression. It does not resolve types,
  runtime values, or operator intent, and it may flag intentional code.
rule:
  kind: binary_expression
  pattern: '$A || $C'
  all:
    - has:
        kind: binary_expression
        pattern: '$X && $Y'
        stopBy: neighbor
