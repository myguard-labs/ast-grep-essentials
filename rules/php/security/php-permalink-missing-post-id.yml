id: php-permalink-missing-post-id
language: php
severity: warning
message: >-
  get_permalink() is called with no argument inside a function that declares a
  $post_id parameter, so the parameter is ignored.
note: >-
  Purely syntactic check for a literal zero-argument get_permalink() call. It
  does not verify that the enclosing function declares $post_id or resolve the
  WordPress function at runtime.
rule:
  pattern: 'get_permalink()'
