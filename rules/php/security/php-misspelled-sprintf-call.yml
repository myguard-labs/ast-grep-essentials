# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-misspelled-sprintf-call
language: php
severity: warning
message: 'Call to ''sprinf'', which is not a PHP function; use sprintf instead.'
note: >-
  Matches only the literal function name sprinf in a direct call syntax. It
  does not resolve namespaces, user-defined functions, or runtime function
  lookup.
rule:
  pattern: 'sprinf($$$ARGS)'
