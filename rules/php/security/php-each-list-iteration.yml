id: php-each-list-iteration
language: php
severity: warning
message: >-
  Legacy each() iteration in a while condition; each() was removed in PHP 8.0.
  Replace with foreach.
note: >-
  Syntactic match on a while condition that assigns list(...) from a direct
  each(...) call. Does not verify the runtime PHP version or that each is the
  built-in function.
rule:
  pattern: 'while ( list($$$KEYS) = each($$$ARGS) ) $$$BODY'
