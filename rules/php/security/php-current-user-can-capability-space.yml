id: php-current-user-can-capability-space
language: php
severity: warning
message: >-
  Capability name passed to current_user_can() contains a space; capability
  slugs use underscores, so this check may never match.
note: >-
  Matches only a literal single-quoted or double-quoted string argument
  containing a space inside a direct current_user_can() call. It does not
  verify the capability registry, types, or runtime values.
rule:
  all:
    - pattern: 'current_user_can($CAP)'
    - regex: '^current_user_can\(\s*[''"][^''"]*\s[^''"]*[''"]'
