# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-script-language-attribute
language: php
severity: warning
message: >-
  This string literal emits a script tag with the deprecated language
  attribute. Use type instead.
note: >-
  Matches only a single PHP string literal whose text contains a script tag
  with a language attribute. It does not check whether the string is output as
  HTML, and it does not resolve concatenation or variables.
rule:
  kind: string
  regex: '<script[^>]*language\s*='
