id: wp-cache-key-ambient-post-id
language: php
severity: warning
message: >-
  Cache write keys on the ambient $post->ID instead of the function's own id
  argument.
note: >-
  Syntactic match only. Flags a wp_cache_add call whose key is literally
  $post->ID inside a function; it does not resolve whether $id differs from
  the current post or whether the function has an $id parameter.
rule:
  pattern: 'wp_cache_add($post->ID, $$$ARGS)'
