id: wp-direct-user-blog-count-query
language: php
severity: warning
message: >-
  Direct COUNT query on the users or blogs table; consider the cached
  get_user_count() or get_blog_count() helpers.
note: >-
  Syntactic match only. It flags a $wpdb->get_var call whose literal SQL
  string contains COUNT and the literal {$wpdb->users} or {$wpdb->blogs} table
  reference. It does not verify runtime values, query caching, or whether the
  helper is appropriate.
rule:
  pattern: '$wpdb->get_var("$$$SQL")'
  has:
    regex: 'COUNT\(.*FROM \{\$wpdb->(users|blogs)\}'
