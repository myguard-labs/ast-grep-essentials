id: php-unserialize-nonliteral-argument
language: php
severity: warning
message: >-
  unserialize() is called with a non-literal argument; review for PHP object
  injection.
note: >-
  Syntactic check only. Matches bare unserialize() calls whose single argument
  is a variable or expression rather than a single-quoted string literal; it
  does not verify the data source, type, or whether the input is actually
  attacker-controlled.
rule:
  pattern: 'unserialize($ARG)'
  not:
    pattern: 'unserialize(''$LIT'')'
