id: wp-ternary-guard-base-mismatch
language: php
severity: warning
message: >-
  The ternary guard reads a property from one base variable while the
  else-branch reads the same property name from a different base variable;
  verify this is not a stale variable.
note: >-
  Purely syntactic check on identifier comparison within one ternary
  expression. It does not resolve types, aliases, or runtime values, so it
  cannot confirm the two bases refer to different objects.
rule:
  pattern: 'empty( $BASE1->$PROP ) ? $$$THEN : $$$ELSE'
  all:
    - has:
        pattern: '$ELSE_BASE->$PROP'
        stopBy: end
        inside:
          kind: binary_expression
    - not:
        has:
          pattern: '$BASE1->$PROP'
          stopBy: end
          inside:
            kind: binary_expression
