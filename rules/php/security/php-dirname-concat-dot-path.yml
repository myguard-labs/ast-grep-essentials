id: php-dirname-concat-dot-path
language: php
severity: warning
message: >-
  Concatenating a dirname(...) result with a relative literal starting with
  "." produces a malformed path; review this concatenation.
note: >-
  Syntactic match only. Checks a literal dirname(...) call concatenated on the
  left with a string literal whose text starts with a dot; does not resolve
  function identity, aliasing, or runtime path values.
rule:
  all:
    - kind: binary_expression
    - has:
        pattern: 'dirname($$$ARGS)'
        stopBy: end
    - has:
        kind: string
        regex: '^[''"]\.'
        stopBy: end
    - pattern: 'dirname($$$ARGS) . $LIT'
