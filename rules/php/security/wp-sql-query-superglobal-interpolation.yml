# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-sql-query-superglobal-interpolation
language: php
severity: warning
message: >-
  A wpdb query call receives a double-quoted SQL string that interpolates POST
  or GET request data directly. Use the prepare method instead.
note: >-
  Matches only literal syntax, a double-quoted string argument containing a
  POST or GET superglobal. It does not resolve aliases or check sanitization.
rule:
  all:
    - kind: member_call_expression
    - has:
        field: object
        regex: '^\$wpdb$'
    - has:
        field: name
        regex: '^query$'
    - has:
        field: arguments
        has:
          kind: argument
          has:
            kind: encapsed_string
            regex: '\$_(POST|GET)'
