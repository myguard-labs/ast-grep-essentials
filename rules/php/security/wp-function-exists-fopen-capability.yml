id: wp-function-exists-fopen-capability
language: php
severity: warning
message: >-
  function_exists() with the literal 'fopen' is used as a remote-fetch
  capability guard; verify allow_url_fopen or URL wrapper support instead.
note: >-
  Syntactic match only on a literal function_exists('fopen') call. It does not
  verify allow_url_fopen, URL wrapper availability, or any runtime capability.
rule:
  pattern: 'function_exists(''fopen'')'
