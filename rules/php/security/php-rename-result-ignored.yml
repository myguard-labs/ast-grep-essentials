# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-rename-result-ignored
language: php
severity: warning
message: 'The boolean result of rename() is discarded; a failed rename goes unnoticed.'
note: >-
  Syntactic single-file check only. Matches a bare rename(...) call written as
  its own expression statement; it does not verify the return value is unused
  by types or dataflow, nor resolve whether rename is the global PHP function.
rule:
  kind: expression_statement
  has:
    kind: function_call_expression
    pattern: 'rename($$$ARGS)'
    stopBy: end
metadata:
  rule_modified_at: '2026-10-15'
