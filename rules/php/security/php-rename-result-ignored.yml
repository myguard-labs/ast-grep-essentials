# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-rename-result-ignored
language: php
severity: warning
message: 'The boolean result of rename() is discarded; a failed rename goes unnoticed.'
note: >-
  Syntactic single-file check only. Matches a bare rename(...) call written as
  its own expression statement; it does not verify the return value is unused
  by types or dataflow, nor resolve whether rename is the global PHP function.
rule:
  kind: expression_statement
  has:
    kind: function_call_expression
    pattern: 'rename($$$ARGS)'
    stopBy:
      not:
        any:
          - kind: parenthesized_expression
          - kind: error_suppression_expression
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-252'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/252.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A10:2025'
  todo_cases:
    - "FN (namespaced call): \\rename($temp_file, $cache_file); is not matched."
