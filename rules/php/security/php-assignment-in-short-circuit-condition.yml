id: php-assignment-in-short-circuit-condition
language: php
severity: warning
message: >-
  Assignment as the right operand of || or && inside an if condition may never
  execute.
note: >-
  Syntactic match only. Flags an assignment expression that is the right
  operand of a logical operator inside an if condition; it does not prove the
  variable is read later or resolve runtime short-circuit behavior.
rule:
  all:
    - kind: assignment_expression
    - inside:
        kind: if_statement
        stopBy: end
    - inside:
        kind: binary_expression
        stopBy: end
        has:
          field: right
          kind: assignment_expression
    - pattern: '$VAR = $B'
