id: wp-scripts-add-string-deps
language: php
severity: warning
message: >-
  This scripts add call passes a string literal where the dependency array
  belongs; the version string lands in the deps slot.
note: >-
  Matches the literal receiver syntax $scripts->add with a string literal
  third argument without resolving the receiver type or runtime values.
rule:
  pattern: '$scripts->add($HANDLE, $SRC, $STR)'
