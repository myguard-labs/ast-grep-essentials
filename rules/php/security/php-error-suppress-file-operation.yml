id: php-error-suppress-file-operation
language: php
severity: warning
message: >-
  Error suppression with @ on a filesystem call hides the failure; check the
  return value or handle errors explicitly.
note: >-
  Syntactic match only. It flags a direct @-prefixed call to rename, unlink or
  copy with a literal function name; it does not resolve aliases, wrappers, or
  whether the callee actually touches the filesystem.
rule:
  pattern: '@rename($$$ARGS)'
