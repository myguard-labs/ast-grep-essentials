id: php-custom-column-filter-missing-value-arg
language: php
severity: warning
message: >-
  This manage_*_custom_column apply_filters() call passes exactly two
  arguments, so the column name occupies the value-argument position.
note: >-
  Syntactic check only. It matches a literal manage_*_custom_column filter
  name followed by exactly two arguments; it does not verify the callback, the
  filter's runtime value, or that the call is the intended WordPress hook.
rule:
  pattern: 'apply_filters(''manage_users_custom_column'', $COL, $ID)'
