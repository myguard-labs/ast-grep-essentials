id: wp-filter-kses-callback
language: php
severity: warning
message: >-
  This add_filter call registers 'wp_filter_kses' as the callback; review
  whether this filter is appropriate.
note: >-
  Syntactic match only. Matches a literal add_filter call whose arguments
  include the string 'wp_filter_kses'; it does not resolve hook names,
  callback identity, or whether the call runs on display or input hooks.
rule:
  pattern: 'add_filter($FILTER, ''wp_filter_kses'')'
