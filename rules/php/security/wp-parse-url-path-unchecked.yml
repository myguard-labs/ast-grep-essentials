id: wp-parse-url-path-unchecked
language: php
severity: warning
message: 'Guard the parse_url() ''path'' subscript before passing it to pathinfo().'
note: >-
  Single-file syntactic match on a bare $var['path'] subscript passed directly
  to pathinfo(). It does not check whether parse_url() returned a path, and
  does not resolve types or aliasing.
rule:
  pattern: 'pathinfo($VAR[''path''], $$$ARGS)'
