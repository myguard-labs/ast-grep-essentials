id: php-gmdate-of-strtotime-local-date
language: php
severity: warning
message: >-
  gmdate() is given a strtotime() timestamp; strtotime() parses local time, so
  the GMT value may be shifted. Review the input source or use a GMT-aware
  conversion.
note: >-
  Syntactic match only on a literal gmdate() call whose second argument is a
  literal strtotime() call. It does not verify that the input string is local
  time, nor resolve aliases or wrappers.
rule:
  pattern: 'gmdate($FMT, strtotime($$$ARGS))'
