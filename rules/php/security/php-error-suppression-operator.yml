# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-error-suppression-operator
language: php
severity: warning
message: >-
  The @ operator silences all warnings and notices from this call; check the
  result explicitly instead.
note: >-
  Single-file syntactic match on a call expression prefixed by the @ silencing
  operator. Does not resolve function identity, types, or whether the call's
  failures are handled elsewhere.
rule:
  pattern: '@$CALL'
  inside:
    kind: expression_statement
    stopBy: end
