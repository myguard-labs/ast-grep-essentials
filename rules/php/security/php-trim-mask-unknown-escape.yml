# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-trim-mask-unknown-escape
language: php
severity: warning
message: >-
  This trim mask uses an unrecognized escape in a double-quoted string, so the
  backslash and letter are treated as literal mask characters.
note: >-
  Syntactic check only. It flags trim, ltrim, or rtrim calls whose second
  argument is a double-quoted string literal containing a backslash followed
  by a letter that is not a recognized PHP escape. It does not resolve
  function identity, imports, or runtime values.
rule:
  pattern: 'trim($SRC, "$MASK")'
  regex: '\\[ces-zCEGHIJKLMNOPQRSUVWXYZ]'
