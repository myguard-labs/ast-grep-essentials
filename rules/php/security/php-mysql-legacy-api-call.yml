# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-mysql-legacy-api-call
language: php
severity: warning
message: >-
  Direct call to a removed mysql_* procedural function; this is a fatal error
  on PHP 7 and later.
note: >-
  Matches a direct call whose callee is a literal mysql_-prefixed function
  name written in the source. It does not verify that the function is defined
  or resolve namespaces, aliases, or runtime identity.
rule:
  kind: function_call_expression
  has:
    field: function
    regex: '^mysql_[a-z_]+$'
