id: php-request-stripslashes-unguarded
language: php
severity: warning
message: >-
  stripslashes() is applied directly to a request superglobal subscript
  without an isset() guard in the same expression.
note: >-
  Syntactic only; it does not prove the key is absent or guarded by earlier
  statements, and it treats any enclosing ternary containing isset( as a
  guard.
rule:
  all:
    - kind: function_call_expression
    - regex: '^stripslashes\s*\(\s*\$_REQUEST\s*\['
    - not:
        inside:
          kind: conditional_expression
          regex: 'isset\s*\('
          stopBy: end
