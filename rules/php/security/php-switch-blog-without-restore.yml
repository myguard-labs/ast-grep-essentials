id: php-switch-blog-without-restore
language: php
severity: warning
message: >-
  This function calls switch_to_blog() without a restore_current_blog() call
  in the same function body.
note: >-
  Single-file syntactic check only. It looks for a switch_to_blog() call and
  the absence of a restore_current_blog() call within the enclosing function;
  it does not prove that a return path is reached after the switch, nor check
  control flow, aliasing, or runtime blog state.
rule:
  all:
    - kind: function_definition
    - has:
        pattern: 'switch_to_blog($$$ARGS)'
        stopBy: end
    - not:
        has:
          pattern: 'restore_current_blog()'
          stopBy: end
