id: wp-html-anchor-unclosed
language: php
severity: warning
message: 'This string literal contains an opening <a> tag but no closing </a> tag.'
note: >-
  Matches only a single PHP string literal whose text contains an opening
  anchor tag and lacks the literal text </a>. It does not inspect the rest of
  the file, concatenated strings, or runtime output.
rule:
  kind: string
  regex: '<a[ >]'
  not:
    regex: '</a>'
