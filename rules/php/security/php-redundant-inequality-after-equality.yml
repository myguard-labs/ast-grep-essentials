# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-redundant-inequality-after-equality
language: php
severity: warning
message: >-
  This conjunction compares the same variable with === to one literal and !==
  to a different literal; the inequality is redundant.
note: >-
  Single-file syntactic match on a literal string compared with === and the
  same variable compared with !== to a different literal inside an &&
  conjunction, written in that order. Does not resolve variable values,
  aliasing, or reachability.
rule:
  pattern: '''http'' === $scheme && ''https'' !== $scheme'
