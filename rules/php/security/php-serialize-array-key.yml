id: php-serialize-array-key
language: php
severity: warning
message: >-
  A serialize() call is used directly as an array key; the key depends on the
  serialized form of the value.
note: >-
  Purely syntactic match on a serialize(...) call used as a subscript index.
  It does not check whether the argument is an object or closure, nor resolve
  types, aliasing, or runtime values.
rule:
  pattern: '$ARR[serialize($$$ARGS)]'
