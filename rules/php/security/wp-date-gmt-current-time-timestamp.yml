id: wp-date-gmt-current-time-timestamp
language: php
severity: warning
message: >-
  date() is given a GMT timestamp from current_time('timestamp', true); use
  date_i18n() to format in the site time zone.
note: >-
  Syntactic match only. Matches a literal date() call whose second argument is
  a literal current_time('timestamp', true) call; does not resolve functions,
  time zones, or runtime values.
rule:
  pattern: 'date($FMT, current_time(''timestamp'', true))'
