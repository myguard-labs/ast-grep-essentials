id: wp-role-object-request-index-call
language: php
severity: warning
message: >-
  Method called directly on a role_objects element indexed by request data; an
  unknown role yields null.
note: >-
  Matches literal syntax only; it does not detect guards such as isset() or
  get_role() elsewhere.
rule:
  pattern: '$O->role_objects[$KEY]->$M($$$ARGS)'
constraints:
  KEY:
    regex: '^\$_(REQUEST|POST)\s*\['
