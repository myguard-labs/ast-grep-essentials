id: wp-admin-url-concatenated-query
language: php
severity: warning
message: >-
  Build admin URL query parameters with add_query_arg instead of concatenating
  a variable into the path string.
note: >-
  Single-file syntactic match on a call to network_admin_url whose first
  argument is a string literal containing a literal query part, followed by
  concatenation with a variable. Does not resolve whether the callee is the
  WordPress function or whether the variable is user-controlled.
rule:
  pattern: 'network_admin_url("themes.php?deleted=" . $VAR)'
