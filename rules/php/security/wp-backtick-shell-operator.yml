# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-backtick-shell-operator
language: php
severity: warning
message: >-
  PHP backtick operator runs a shell command; review the command string for
  injection risk.
note: >-
  Matches the literal backtick shell-execution syntax only. It does not
  resolve whether the command string is attacker-controlled, and it does not
  match shell_exec() or other function calls.
rule:
  pattern: '`$$$CMD`'
