id: php-current-user-can-legacy-edit-themes
language: php
severity: warning
message: >-
  current_user_can() is checked against the literal capability 'edit_themes';
  verify the gate matches the menu or link that leads to it.
note: >-
  Matches only the literal string 'edit_themes' passed directly to a
  current_user_can() call in this file. It does not resolve the function at
  runtime, check the capability registry, or confirm that the gate and menu
  are consistent.
rule:
  pattern: 'current_user_can(''edit_themes'')'
