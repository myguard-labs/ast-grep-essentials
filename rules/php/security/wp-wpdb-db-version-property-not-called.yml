id: wp-wpdb-db-version-property-not-called
language: php
severity: warning
message: >-
  $wpdb->db_version is read without calling it; db_version is a method and
  needs parentheses.
note: >-
  Matches the literal receiver syntax $wpdb->db_version without a following
  call; it does not resolve runtime types or confirm that $wpdb is a wpdb
  instance.
rule:
  pattern: '$wpdb->db_version'
  not:
    inside:
      kind: member_call_expression
      stopBy: neighbor
      has:
        field: name
        regex: '^db_version$'
