id: wp-post-type-object-direct-dereference
language: php
severity: warning
message: >-
  Property fetch directly on the result of get_post_type_object() without a
  null check.
note: >-
  Syntactic match only. Flags a property access chained directly onto a
  get_post_type_object() call; it does not check guards, types, or variable
  flow elsewhere in the file.
rule:
  pattern: 'get_post_type_object($ARG)->$PROP'
