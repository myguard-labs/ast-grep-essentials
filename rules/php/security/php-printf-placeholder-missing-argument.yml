id: php-printf-placeholder-missing-argument
language: php
severity: warning
message: >-
  This printf() call has a %s placeholder in its format string but no value
  argument after the format.
note: >-
  Matches only a literal printf call whose sole argument is a single string
  literal containing %s; it does not resolve runtime format strings or verify
  argument counts beyond this syntax.
rule:
  pattern: 'printf(''$FMT'')'
  regex: '%s'
