id: wp-direct-flush-rules-method
language: php
severity: warning
message: >-
  Direct call to $wp_rewrite->flush_rules(); prefer the flush_rewrite_rules()
  wrapper.
note: >-
  Matches the literal receiver syntax $wp_rewrite->flush_rules(...) without
  resolving whether the variable is the WordPress global rewrite object,
  aliasing, or runtime values.
rule:
  pattern: '$wp_rewrite->flush_rules($$$ARGS)'
