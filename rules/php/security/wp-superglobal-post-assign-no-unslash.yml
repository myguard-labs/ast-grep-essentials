# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-superglobal-post-assign-no-unslash
language: php
severity: warning
message: 'Superglobal POST element is assigned directly without wp_unslash().'
note: >-
  Matches the literal assignment syntax only; it does not track later
  unslashing or other sanitization of the variable.
rule:
  kind: assignment_expression
  has:
    field: right
    kind: subscript_expression
    regex: '^\$_POST\['
