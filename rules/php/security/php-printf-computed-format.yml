# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-printf-computed-format
language: php
severity: warning
message: >-
  printf is called with a computed format string; keep the format literal and
  pass values as arguments.
note: >-
  Single-file syntactic check on the literal call shape only; it does not
  resolve whether the argument is user-controlled or whether printf is the PHP
  builtin.
rule:
  pattern: 'printf($ARG)'
constraints:
  ARG:
    kind: argument
    not:
      has:
        any:
          - kind: string
          - kind: name
          - kind: encapsed_string
            not:
              has:
                not:
                  any:
                    - kind: string_content
                    - kind: escape_sequence
                    - regex: '^"$'
          - kind: function_call_expression
            all:
              - has:
                  field: function
                  regex: '^__$'
              - has:
                  field: arguments
                  has:
                    kind: argument
                    nthChild: 1
                    has:
                      any:
                        - kind: string
                        - kind: encapsed_string
                          not:
                            has:
                              not:
                                any:
                                  - kind: string_content
                                  - kind: escape_sequence
                                  - regex: '^"$'
              - not:
                  has:
                    field: arguments
                    has:
                      kind: argument
                      nthChild: 2
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-134'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/134.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'a translated literal __(''Hello'') is treated as a constant format and skipped; the rule matches any function named __, not only the WordPress translation helper'
  todo_cases:
    - "<?php printf($fmt, $a);"
    - "<?php \\printf($fmt);"
