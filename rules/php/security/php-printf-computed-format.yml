id: php-printf-computed-format
language: php
severity: warning
message: >-
  printf is called with a computed format string; keep the format literal and
  pass values as arguments.
note: >-
  Single-file syntactic check on the literal call shape only; it does not
  resolve whether the argument is user-controlled or whether printf is the PHP
  builtin.
rule:
  pattern: 'printf($ARG)'
  not:
    kind: string
