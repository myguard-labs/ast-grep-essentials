id: php-get-category-by-path-query-var
language: php
severity: warning
message: >-
  get_category_by_path() receives get_query_var() directly without a null or
  emptiness check in the same expression.
note: >-
  Syntactic match only on the literal nested call
  get_category_by_path(get_query_var(...)); it does not check whether the
  query var can be empty at runtime, and it does not follow values stored in
  variables or guards applied elsewhere.
rule:
  pattern: 'get_category_by_path(get_query_var($$$ARGS))'
