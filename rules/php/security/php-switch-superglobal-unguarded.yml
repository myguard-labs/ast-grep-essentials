# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-switch-superglobal-unguarded
language: php
severity: warning
message: >-
  Switch subject reads the GET superglobal directly without an isset guard or
  default value.
note: >-
  Syntactic check only; matches a switch whose parenthesized subject begins
  with a direct GET superglobal subscript and does not detect guards performed
  elsewhere.
rule:
  all:
    - kind: parenthesized_expression
    - regex: '^\(\s*\$_GET\s*\['
    - inside:
        kind: switch_statement
    - not:
        has:
          kind: binary_expression
          has:
            kind: subscript_expression
            precedes:
              regex: '^\?\?$'
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
  created_at: '2026-10-18'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-20'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/20.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  todo_cases:
    - "false negative: switch ($_GET[\"b\"] ?? $_GET[\"a\"]) is no longer reported although the right operand is unguarded; the ?? exclusion covers the whole subject."
