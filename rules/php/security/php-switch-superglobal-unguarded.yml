id: php-switch-superglobal-unguarded
language: php
severity: warning
message: >-
  Switch subject reads the GET superglobal directly without an isset guard or
  default value.
note: >-
  Syntactic check only; matches a switch whose parenthesized subject begins
  with a direct GET superglobal subscript and does not detect guards performed
  elsewhere.
rule:
  kind: parenthesized_expression
  regex: '^\(\s*\$_GET\s*\['
  inside:
    kind: switch_statement
