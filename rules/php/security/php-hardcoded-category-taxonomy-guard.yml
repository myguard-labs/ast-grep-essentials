id: php-hardcoded-category-taxonomy-guard
language: php
severity: warning
message: >-
  Hard-coded 'category' taxonomy comparison gates behaviour; check a
  capability instead.
note: >-
  Syntactic match only on a literal 'category' string compared with != or !==
  inside an if condition. It does not resolve types, taxonomy registration, or
  runtime values.
rule:
  pattern: 'if ( ''category'' != $X ) $$$BODY'
