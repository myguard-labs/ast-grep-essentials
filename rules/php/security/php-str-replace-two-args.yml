id: php-str-replace-two-args
language: php
severity: warning
message: >-
  str_replace is called with two arguments; it requires a third subject
  argument and will throw ArgumentCountError on PHP 8.
note: >-
  Purely syntactic match on a literal str_replace call with exactly two
  arguments. It does not resolve namespaces, function aliases, or runtime
  argument handling.
rule:
  pattern: 'str_replace($A, $B)'
