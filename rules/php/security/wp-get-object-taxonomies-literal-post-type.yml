id: wp-get-object-taxonomies-literal-post-type
language: php
severity: warning
message: >-
  get_object_taxonomies() is called with the literal 'post' type; confirm this
  should not use the handled object's post type.
note: >-
  Single-file syntactic match on a literal 'post' string argument only. It
  does not resolve the object's actual post type, runtime values, or whether
  posts-only behavior is intended.
rule:
  pattern: 'get_object_taxonomies(''post'')'
