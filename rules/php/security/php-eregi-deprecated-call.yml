# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-eregi-deprecated-call
language: php
severity: warning
message: >-
  eregi() was removed in PHP 7; migrate this call to preg_match with the /i
  flag.
note: >-
  Matches a literal eregi( call syntax only. It does not verify the PHP
  version, resolve namespaces or aliases, or confirm that eregi is the global
  function rather than a user-defined one.
rule:
  pattern: 'eregi($$$ARGS)'
