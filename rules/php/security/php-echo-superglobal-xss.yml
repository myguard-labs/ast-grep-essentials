id: php-echo-superglobal-xss
language: php
severity: error
message: >-
  Request data echoed without escaping — reflected XSS (CWE-79, rank 1 in the
  2025 CWE Top 25). The browser parses the response as HTML, so an attacker
  supplying markup runs script in the victim's session. Wrap the value in
  htmlspecialchars($v, ENT_QUOTES, "UTF-8"), or a templating layer that escapes
  by default.
note: >-
  Fires on echo/print of a superglobal, directly or interpolated, unless
  that value is wrapped in htmlspecialchars, htmlentities, urlencode,
  rawurlencode or intval; an encoder around a different operand of the same
  statement does not count. In an HTML attribute-like concatenation,
  htmlspecialchars/htmlentities with a literal flag mask that omits the quote
  escaping required by the surrounding delimiter still matches. `ENT_QUOTES`
  protects either delimiter; `ENT_COMPAT` protects only double-quoted
  attributes. Decimal, hexadecimal, binary, and octal integer masks are checked
  by the same quote bits (bit 0 for single quotes, bit 1 for double quotes);
  valid PHP digit separators between digits are ignored for that check.
  Those masks remain sufficient for ordinary element text. json_encode is not an
  HTML encoder (it leaves < alone without JSON_HEX_TAG), so it does not suppress the match. A value echoed
  into a non-HTML response (JSON with the right Content-Type) is the routine
  dismissal; escaping is still the safer default.
utils:
  encoder:
    kind: function_call_expression
    has:
      field: function
      regex: '(?i)^\\?(htmlspecialchars|htmlentities|urlencode|rawurlencode|intval)$'
  double-quoted-attribute-fragment:
    any:
      - kind: encapsed_string
        regex: '(?i)<[^>]*\b[A-Za-z_:][A-Za-z0-9_:.-]*\s*=\s*\\?"["'']$'
      - kind: string
        regex: '(?i)<[^>]*\b[A-Za-z_:][A-Za-z0-9_:.-]*\s*=\s*\\?"["'']$'
  single-quoted-attribute-fragment:
    any:
      - kind: encapsed_string
        regex: '(?i)<[^>]*\b[A-Za-z_:][A-Za-z0-9_:.-]*\s*=\s*\\?\x27["'']$'
      - kind: string
        regex: '(?i)<[^>]*\b[A-Za-z_:][A-Za-z0-9_:.-]*\s*=\s*\\?\x27["'']$'
  single-quote-protective-flag:
    any:
      - kind: name
        regex: '^ENT_QUOTES$'
      - kind: integer
        # Bit 0 is set: odd decimal/hex/octal, or a binary literal ending in 1.
        regex: '^(?:[13579]|[1-9](?:_?[0-9])*_?[13579]|0[xX](?:[0-9A-Fa-f]_?)*[13579bBdDfF]|0[bB](?:[01]_?)*1|0[oO](?:[0-7]_?)*[1357]|0(?:_?[0-7])*_?[1357])$'
  double-quote-protective-flag:
    any:
      - kind: name
        regex: '^(ENT_QUOTES|ENT_COMPAT)$'
      - kind: integer
        # Bit 1 is set. Decimal alternatives encode value modulo four.
        regex: '^(?:[2367]|[2468]_?[2367]|[13579]_?[014589]|[1-9](?:_?[0-9])*_?(?:[02468]_?[2367]|[13579]_?[014589])|0[xX](?:[0-9A-Fa-f]_?)*[2367aAbBeEfF]|0[bB](?:[01]_?)*1_?[01]|0[oO](?:[0-7]_?)*[2367]|0(?:_?[0-7])*_?[2367])$'
rule:
  any:
    # Start at the unsafe flags argument and prove it is the value appended
    # directly after an attribute-opening literal.
    - all:
        - kind: argument
        - any:
            - all:
                - nthChild:
                    position: 2
                    ofRule: {not: {kind: comment}}
                - not: {regex: '^\s*flags\s*:'}
                - regex: '(?s)^(?:\s|[()]|/\*.*?\*/)*(?:ENT_[A-Z0-9_]+|0[xX][0-9A-Fa-f](?:_?[0-9A-Fa-f])*|0[bB][01](?:_?[01])*|0[oO][0-7](?:_?[0-7])*|0(?:_?[0-7])+|[1-9](?:_?[0-9])*|0)(?:(?:\s|[()]|/\*.*?\*/)*\|(?:\s|[()]|/\*.*?\*/)*(?:ENT_[A-Z0-9_]+|0[xX][0-9A-Fa-f](?:_?[0-9A-Fa-f])*|0[bB][01](?:_?[01])*|0[oO][0-7](?:_?[0-7])*|0(?:_?[0-7])+|[1-9](?:_?[0-9])*|0))*(?:\s|[()]|/\*.*?\*/)*$'
            - all:
                - has: {field: name, regex: '^flags$'}
                - regex: '(?s)^\s*flags\s*:(?:\s|[()]|/\*.*?\*/)*(?:ENT_[A-Z0-9_]+|0[xX][0-9A-Fa-f](?:_?[0-9A-Fa-f])*|0[bB][01](?:_?[01])*|0[oO][0-7](?:_?[0-7])*|0(?:_?[0-7])+|[1-9](?:_?[0-9])*|0)(?:(?:\s|[()]|/\*.*?\*/)*\|(?:\s|[()]|/\*.*?\*/)*(?:ENT_[A-Z0-9_]+|0[xX][0-9A-Fa-f](?:_?[0-9A-Fa-f])*|0[bB][01](?:_?[01])*|0[oO][0-7](?:_?[0-7])*|0(?:_?[0-7])+|[1-9](?:_?[0-9])*|0))*(?:\s|[()]|/\*.*?\*/)*$'
        - any:
            # Single-quoted attributes require ENT_QUOTES.
            - all:
                - not:
                    has:
                      stopBy: end
                      matches: single-quote-protective-flag
                - inside:
                    stopBy: neighbor
                    kind: arguments
                    inside:
                      stopBy: neighbor
                      kind: function_call_expression
                      all:
                        - has:
                            field: function
                            regex: '(?i)^\\?(htmlspecialchars|htmlentities)$'
                        - has:
                            stopBy: end
                            kind: variable_name
                            regex: '^\$_(GET|POST|REQUEST|COOKIE|SERVER)$'
                      inside:
                        stopBy: neighbor
                        kind: binary_expression
                        all:
                          - has: {field: operator, regex: '^\.$'}
                          - has: {field: left, matches: single-quoted-attribute-fragment}
                        inside:
                          stopBy: end
                          any:
                            - kind: echo_statement
                            - kind: print_intrinsic
            # ENT_COMPAT is sufficient only for a double-quoted attribute.
            - all:
                - not:
                    has:
                      stopBy: end
                      matches: double-quote-protective-flag
                - inside:
                    stopBy: neighbor
                    kind: arguments
                    inside:
                      stopBy: neighbor
                      kind: function_call_expression
                      all:
                        - has:
                            field: function
                            regex: '(?i)^\\?(htmlspecialchars|htmlentities)$'
                        - has:
                            stopBy: end
                            kind: variable_name
                            regex: '^\$_(GET|POST|REQUEST|COOKIE|SERVER)$'
                      inside:
                        stopBy: neighbor
                        kind: binary_expression
                        all:
                          - has: {field: operator, regex: '^\.$'}
                          - has: {field: left, matches: double-quoted-attribute-fragment}
                        inside:
                          stopBy: end
                          any:
                            - kind: echo_statement
                            - kind: print_intrinsic
    - all:
        - any:
            - kind: echo_statement
            - kind: print_intrinsic
        # The request value itself must sit outside any approved encoder; an
        # encoder elsewhere in the statement does not cover it.
        - has:
            stopBy: end
            kind: variable_name
            regex: '^\$_(GET|POST|REQUEST|COOKIE|SERVER)$'
            not:
              inside:
                stopBy: end
                matches: encoder
