id: php-phpunit-misspelled-assert-array-has-key
language: php
severity: warning
message: >-
  Call to $this->arrayHasKey(); PHPUnit helpers use the assert prefix, so this
  method is likely missing.
note: >-
  Matches the literal $this member call named arrayHasKey by syntax only; it
  does not verify the test class hierarchy or whether a custom helper with
  that name exists.
rule:
  pattern: '$this->arrayHasKey($$$ARGS)'
