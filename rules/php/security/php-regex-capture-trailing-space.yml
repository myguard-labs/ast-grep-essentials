# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-regex-capture-trailing-space
language: php
severity: warning
message: >-
  This preg_match pattern has a space just before the closing parenthesis of a
  capture group, so the group only matches when that space is present.
note: >-
  Syntactic check of a literal preg_match pattern only. It does not verify the
  subject string, flags, or runtime behavior, and it does not prove the
  trailing space is unintended.
rule:
  pattern: 'preg_match(''|Name:(.* )|i'', $D, $M)'
