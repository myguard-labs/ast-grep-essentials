  taxonomy_source: 'https://cwe.mitre.org/data/definitions/183.html|https://cwe.mitre.org/data/definitions/346.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A06:2025|A07:2025'
  todo_cases:
    - 'Observed miss: a double-quoted replacement is not reported (str_replace( ''\*'', ".+", preg_quote( $host, ''/'' ) )).'
