# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-wildcard-host-regex-dot-plus
language: php
severity: warning
message: >-
  This str_replace turns a wildcard into the regex '.+' for a host pattern, so
  the wildcard can match dots and slashes and may accept unintended hosts.
note: >-
  Purely syntactic match on a str_replace call whose replacement argument is
  the literal '.+' and whose subject is a preg_quote call. It does not verify
  that the result is used as a host allowlist or bypass check, and it does not
  resolve types or runtime values.
rule:
  pattern: 'str_replace($SEARCH, ''.+'', preg_quote($$$ARGS))'
