id: php-ternary-unguarded-array-read
language: php
severity: warning
message: >-
  Ternary reads the same array key in its condition and then-branch without an
  isset() guard.
note: >-
  Purely syntactic match on a literal subscript repeated in the ternary
  condition and then-branch; it does not verify the array type, key existence
  at runtime, or that the key is not set elsewhere.
rule:
  kind: conditional_expression
  all:
    - has:
        pattern: '$_REQUEST[''_ajax_nonce'']'
        stopBy: end
    - pattern: '$_REQUEST[''_ajax_nonce''] ? $_REQUEST[''_ajax_nonce''] : $$$REST'
