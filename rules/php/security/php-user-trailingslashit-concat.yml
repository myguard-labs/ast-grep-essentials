id: php-user-trailingslashit-concat
language: php
severity: warning
message: >-
  A bare variable is concatenated with user_trailingslashit(...) output
  without trailingslashit(); the joined URL may lack a separator slash.
note: >-
  Purely syntactic match on a bare variable left operand of '.' whose right
  operand is a direct user_trailingslashit call, excluding a left operand that
  is a trailingslashit call. It does not resolve whether the variable holds a
  URL, whether user_trailingslashit is the WordPress function, or whether a
  slash is actually missing at runtime.
rule:
  all:
    - pattern: '$LEFT . user_trailingslashit($$$ARGS)'
    - not:
        pattern: 'trailingslashit($$$INNER) . user_trailingslashit($$$ARGS)'
