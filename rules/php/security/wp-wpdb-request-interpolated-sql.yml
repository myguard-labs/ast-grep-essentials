id: wp-wpdb-request-interpolated-sql
language: php
severity: warning
message: >-
  Request superglobal is interpolated directly into a SQL string passed to a
  wpdb query method.
note: >-
  Matches literal wpdb receiver syntax and a double-quoted first argument
  containing a GET, POST, REQUEST or COOKIE superglobal; does not resolve
  aliasing or sanitization.
rule:
  kind: member_call_expression
  regex: >-
    ^\$wpdb->(get_row|get_results|get_var|get_col|query)\s*\(\s*"[^"]*\$_(GET|POST|REQUEST|COOKIE)\b
