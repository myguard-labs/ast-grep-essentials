id: php-comparator-self-subtraction
language: php
severity: warning
message: >-
  This return subtracts an expression from an identical copy of itself, so the
  comparator always returns zero.
note: >-
  Matches the literal same-text operands of a binary subtraction in a return
  statement. It does not confirm the expression is a comparator or resolve
  runtime values, types, or aliasing.
rule:
  pattern: 'return $X - $X;'
