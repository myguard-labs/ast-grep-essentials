id: wp-comment-pages-nav-without-page-comments-guard
language: php
severity: warning
message: >-
  Comment pagination navigation is gated only by get_comment_pages_count() > 1
  without checking the page_comments option.
note: >-
  Single-file syntactic match on the literal get_comment_pages_count() call
  compared with > 1 inside an if-condition. It does not resolve whether
  get_option('page_comments') is checked elsewhere in the template, and does
  not verify runtime values.
rule:
  pattern: 'if ( get_comment_pages_count() > 1 ) { $$$BODY }'
