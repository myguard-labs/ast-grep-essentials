id: php-request-isset-flag
language: php
severity: warning
message: >-
  isset() on a request-superglobal element is assigned to a variable; this
  flag can be set from GET, POST or cookies, and is true for any value.
note: >-
  Matches the literal request-superglobal isset assignment syntax only; it
  does not resolve whether the variable is used as a security-sensitive flag.
rule:
  kind: assignment_expression
  has:
    field: right
    regex: '^isset\s*\('
    has:
      kind: variable_name
      regex: '^\$_REQUEST$'
      stopBy: end
