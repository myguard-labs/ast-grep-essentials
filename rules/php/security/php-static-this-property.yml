id: php-static-this-property
language: php
severity: warning
message: >-
  Static property named $this is accessed via self::; this is likely a typo
  for the instance access $this->.
note: >-
  Matches the literal syntax self::$this-> without resolving types or runtime
  class state; it does not prove the intended target was an instance property.
rule:
  pattern: 'self::$this->$PROP'
