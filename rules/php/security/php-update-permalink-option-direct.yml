id: php-update-permalink-option-direct
language: php
severity: warning
message: >-
  Direct update_option() call writes permalink_structure; use
  WP_Rewrite::set_permalink_structure() so rewrite rules are handled.
note: >-
  Syntactic match on a direct update_option call whose first argument is the
  literal 'permalink_structure'. Does not resolve function identity, imports,
  or whether the call is in a WordPress context; it cannot confirm the write
  is unsafe at runtime.
rule:
  pattern: 'update_option(''permalink_structure'', $$$ARGS)'
