# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-realpath-unchecked-define
language: php
severity: warning
message: >-
  A define() value is a direct realpath() call with no false check; realpath()
  can return false.
note: >-
  Syntactic match only. Matches a literal define() call whose second argument
  is a direct realpath() call; it does not verify that no surrounding check
  exists or resolve runtime values.
rule:
  pattern: 'define($NAME, realpath($$$ARGS))'
