# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-discarded-concat-statement
language: php
severity: warning
message: >-
  This string concatenation is an expression statement and its result is
  discarded; check for a missing assignment.
note: >-
  Syntactic match only. Matches a bare binary concatenation with '.' used as a
  whole expression statement; it does not resolve types, variables, or runtime
  behavior.
rule:
  kind: expression_statement
  has:
    kind: binary_expression
    pattern: '$A . $B'
