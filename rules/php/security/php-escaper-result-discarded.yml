# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-escaper-result-discarded
language: php
severity: warning
message: >-
  The return value of this escaping call is discarded, so it has no effect.
  Did you mean to echo it?
note: >-
  Matches only a literal bare call to esc_url, esc_html or esc_attr used as an
  expression statement. Does not resolve function identity, namespaces, or
  aliases, and does not check whether the result is used elsewhere.
rule:
  pattern: 'esc_url($$$ARGS)'
  inside:
    kind: expression_statement
    stopBy: neighbor
