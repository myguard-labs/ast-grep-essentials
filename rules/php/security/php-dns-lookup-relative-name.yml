id: php-dns-lookup-relative-name
language: php
severity: warning
message: >-
  gethostbyname is called with a concatenated hostname ending in a domain
  without a trailing dot, so the resolver may append search domains.
note: >-
  Syntactic match only. It flags a gethostbyname call whose argument is a
  binary concatenation ending in a literal string ending in '.org'; it does
  not resolve the resolver configuration, search domains, or runtime values.
rule:
  pattern: 'gethostbyname($A . ''.opm.example.org'')'
