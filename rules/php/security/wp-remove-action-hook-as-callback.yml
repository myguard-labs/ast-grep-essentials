id: wp-remove-action-hook-as-callback
language: php
severity: warning
message: >-
  remove_action is called with the same variable as hook name and callback;
  this removal likely matches nothing.
note: >-
  Single-file syntactic check only. It matches a literal remove_action call
  whose first two arguments are the same metavariable; it does not resolve
  registered callbacks or runtime values.
rule:
  pattern: 'remove_action($HOOK, $HOOK, $$$ARGS)'
