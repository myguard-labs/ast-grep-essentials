id: php-function-exists-dynamic-argument
language: php
severity: warning
message: >-
  function_exists() receives a non-literal argument; review whether the
  dynamic callable check is correct.
note: >-
  Syntactic check only. Matches a function_exists call whose single argument
  is a variable, without resolving runtime values, types, or whether the
  argument is a callable array or class method.
rule:
  pattern: 'function_exists($ARG)'
  has:
    kind: variable_name
    stopBy: end
