id: wp-current-user-can-meta-cap-no-object
language: php
severity: warning
message: >-
  current_user_can() is called with an object-scoped capability name but no
  object ID argument.
note: >-
  Syntactic match only. It checks a literal single-string-argument call to
  current_user_can() with the capability 'resume_plugin' and does not verify
  the capability set, runtime values, or whether the call is reachable.
rule:
  pattern: 'current_user_can(''resume_plugin'')'
