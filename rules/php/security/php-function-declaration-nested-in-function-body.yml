id: php-function-declaration-nested-in-function-body
language: php
severity: warning
message: >-
  Named function declared inside another function body; check for a missing
  closing brace.
note: >-
  Syntactic check only. Matches a named function_definition whose nearest
  enclosing function body is another function; it does not verify intent or
  runtime behavior.
rule:
  kind: function_definition
  inside:
    kind: compound_statement
    inside:
      kind: function_definition
      stopBy: end
