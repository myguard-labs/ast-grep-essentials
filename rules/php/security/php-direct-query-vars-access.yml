id: php-direct-query-vars-access
language: php
severity: warning
message: >-
  Read the query var through its public accessor instead of indexing
  $wp_query->query_vars directly.
note: >-
  Matches the literal syntax $wp_query->query_vars[...] with a string-literal
  subscript. It does not resolve types, aliases, or whether the accessor
  exists for that key.
rule:
  pattern: '$wp_query->query_vars[''$KEY'']'
