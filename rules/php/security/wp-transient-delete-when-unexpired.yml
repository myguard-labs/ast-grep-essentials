id: wp-transient-delete-when-unexpired
language: php
severity: warning
message: >-
  This branch deletes an option-backed transient while its timeout has not yet
  expired.
note: >-
  Single-file syntactic match on a literal get_option() call compared with
  time() using > inside an if condition whose body calls delete_option(). It
  does not resolve function identity, option semantics, or runtime values.
rule:
  kind: if_statement
  all:
    - has:
        pattern: 'get_option($ARG) > time()'
        stopBy: end
    - has:
        pattern: 'delete_option($$$ARGS)'
        stopBy: end
