id: php-wpdb-prepare-in-list-percent-s
language: php
severity: warning
message: >-
  This $wpdb->prepare() call puts a %s placeholder inside an IN( ) list; a
  single quoted value will not match each ID separately.
note: >-
  Syntactic match only on a literal $wpdb->prepare call whose query string
  contains IN(%s). It does not resolve types, runtime values, or whether the
  query is otherwise safe.
rule:
  pattern: '$wpdb->prepare($QUERY, $$$ARGS)'
  has:
    regex: 'IN\(%s\)'
    stopBy: end
