# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-class-brace-without-space
language: php
severity: warning
message: >-
  Class opening brace should be separated from the preceding identifier by a
  space.
note: >-
  Purely lexical check on the literal source text of a single class
  declaration; it does not verify coding-standard configuration, comments, or
  formatting produced by other tools.
rule:
  kind: class_declaration
  regex: 'extends\s+\w+\{'
