id: wp-get-terms-child-of-without-hide-empty
language: php
severity: warning
message: >-
  This get_terms() call passes child_of without hide_empty, so empty
  descendant terms are hidden by default.
note: >-
  Syntactic check only. It matches a literal get_terms call whose array
  literal contains child_of and lacks a hide_empty key; it does not resolve
  the taxonomy, runtime argument values, or whether empty terms matter to the
  caller.
rule:
  all:
    - pattern: 'get_terms($TAX, $ARGS)'
    - has:
        pattern: '''child_of'' => $V'
        stopBy: end
    - not:
        has:
          pattern: '''hide_empty'' => $H'
          stopBy: end
