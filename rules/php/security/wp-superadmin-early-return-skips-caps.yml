id: wp-superadmin-early-return-skips-caps
language: php
severity: warning
message: >-
  Early return for multisite super admins skips map_meta_cap, so a
  do_not_allow result is never honoured.
note: >-
  Syntactic match only. It flags a literal if-condition is_multisite() &&
  is_super_admin() whose body returns true without checking map_meta_cap
  output; it does not resolve function identity, types, or runtime values.
rule:
  pattern: |
    if (is_multisite() && is_super_admin()) { return true; }
