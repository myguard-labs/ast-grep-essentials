# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-translation-hardcoded-url
language: php
severity: warning
message: >-
  Move the URL out of the translatable string so translators do not
  re-translate the whole sentence when the link changes.
note: >-
  Single-file syntactic match on a literal string argument to __() or _e()
  whose text contains http:// or https://. Does not resolve whether the
  function is the WordPress translation function, nor verify runtime string
  values.
rule:
  pattern: '__($STR)'
  regex: 'https?://'
