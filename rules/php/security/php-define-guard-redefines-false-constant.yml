id: php-define-guard-redefines-false-constant
language: php
severity: warning
message: >-
  This guard redefines a constant when it is already defined with a falsy
  value.
note: >-
  Syntactic match only on the literal guard shape !defined('NAME') || !NAME
  wrapping a define call; it does not resolve runtime constant values,
  includes, or aliasing.
rule:
  pattern: 'if ( !defined(''FOO'') || !FOO ) define(''FOO'', $$$ARGS)'
