id: wp-current-theme-support-typo
language: php
severity: warning
message: >-
  Call to current_theme_support is misspelled; the WordPress function is
  current_theme_supports.
note: >-
  Matches only the literal function name current_theme_support in a direct
  call. It does not verify that the function is a WordPress API or resolve
  namespaces, imports, or aliases.
rule:
  pattern: 'current_theme_support($$$ARGS)'
