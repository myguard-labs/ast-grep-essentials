id: wp-discarded-translation-call
language: php
severity: warning
message: >-
  Translation call used as a bare statement; its returned string is discarded
  and nothing is printed. Wrap it in echo if output was intended.
note: >-
  Purely syntactic match on a bare __() call expression statement. It does not
  resolve the function identity, imports, or whether the surrounding context
  expects output; echo, return, and assignment forms are not matched.
rule:
  kind: expression_statement
  has:
    kind: function_call_expression
    pattern: '__($$$ARGS)'
