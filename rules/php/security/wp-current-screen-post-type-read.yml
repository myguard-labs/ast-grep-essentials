id: wp-current-screen-post-type-read
language: php
severity: warning
message: >-
  Reading post_type directly from a get_current_screen() call may yield an
  empty value during AJAX requests.
note: >-
  Matches only the literal inline chain get_current_screen()->post_type in a
  single file. It does not track assignments, types, or whether the code runs
  during AJAX.
rule:
  pattern: 'get_current_screen()->post_type'
