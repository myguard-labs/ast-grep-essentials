id: wp-register-deprecated-url-literal
language: php
severity: warning
message: >-
  This string literal names the deprecated wp-register.php path; build the
  registration link with wp-login.php?action=register instead.
note: >-
  Single-file syntactic check for a string literal containing the text
  wp-register.php. It does not resolve whether the literal is actually emitted
  into a URL at runtime, and does not check imports, types, or dynamic values.
rule:
  kind: string
  regex: 'wp-register\.php'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
