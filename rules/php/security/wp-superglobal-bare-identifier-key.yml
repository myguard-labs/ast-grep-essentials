# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-superglobal-bare-identifier-key
language: php
severity: warning
message: Superglobal array key is a bare identifier instead of a quoted string.
note: >-
  Matches syntax only; it does not check whether the identifier is a defined
  constant.
rule:
  kind: subscript_expression
  all:
    - has:
        kind: variable_name
        regex: '^\$_(GET|POST|REQUEST|COOKIE|SERVER)$'
    - has:
        kind: name
