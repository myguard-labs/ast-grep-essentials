id: wp-mb-internal-encoding-error-suppressed
language: php
severity: warning
message: >-
  Error suppression (@) on mb_internal_encoding() hides failures such as an
  invalid charset; check the return value instead.
note: >-
  Purely syntactic match on a literal @-prefixed call to mb_internal_encoding;
  it does not resolve the function identity, imports, or whether the call
  actually fails at runtime.
rule:
  pattern: '@mb_internal_encoding($$$ARGS)'
