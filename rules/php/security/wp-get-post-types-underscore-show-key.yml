id: wp-get-post-types-underscore-show-key
language: php
severity: warning
message: >-
  This get_post_types() array uses the misspelled key '_show'; the intended
  key is 'show_ui'.
note: >-
  Matches only a literal get_post_types() call whose array literal has a
  '_show' key in the same call syntax. It does not resolve the function
  identity, imports, or runtime argument values.
rule:
  pattern: 'get_post_types(array(''_show'' => $VAL))'
