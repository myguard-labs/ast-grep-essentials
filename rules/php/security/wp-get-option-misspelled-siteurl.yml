id: wp-get-option-misspelled-siteurl
language: php
severity: warning
message: >-
  get_option() is called with the literal option name 'url', which is not a
  WordPress core option. Did you mean 'siteurl' or 'home'?
note: >-
  Matches only a literal 'url' argument to a direct get_option() call. It does
  not verify the full list of WordPress core option names or resolve whether
  the call targets WordPress.
rule:
  pattern: 'get_option(''url'')'
