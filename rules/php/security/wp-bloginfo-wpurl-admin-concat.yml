id: wp-bloginfo-wpurl-admin-concat
language: php
severity: warning
message: >-
  Building an admin URL by concatenating get_bloginfo('wpurl') with an admin
  path; consider admin_url().
note: >-
  Purely syntactic match on a binary concatenation whose left operand is a
  literal get_bloginfo('wpurl') call and whose right operand is a string
  literal starting with /wp-admin/. Does not resolve function identity,
  imports, or runtime values, and does not check other concatenation shapes.
rule:
  kind: binary_expression
  all:
    - has:
        field: left
        pattern: 'get_bloginfo(''wpurl'')'
    - has:
        field: right
        regex: '^[''"]/wp-admin/'
