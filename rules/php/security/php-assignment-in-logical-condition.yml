id: php-assignment-in-logical-condition
language: php
severity: warning
message: >-
  Assignment used as an operand of && or || inside an if condition; a
  comparison may have been intended.
note: >-
  Purely syntactic match on a plain assignment expression that is a direct
  operand of && or || within an if condition. It does not resolve types,
  runtime values, or whether the assignment is intentional, so review each
  match.
rule:
  all:
    - kind: parenthesized_expression
      inside:
        kind: if_statement
        stopBy: end
    - has:
        kind: binary_expression
        stopBy: end
        all:
          - has:
              kind: assignment_expression
              stopBy: end
          - regex: '&&|\|\|'
