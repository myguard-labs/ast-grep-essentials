# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-strpos-unguarded-user-agent
language: php
severity: warning
message: >-
  strpos() reads the HTTP_USER_AGENT server key directly without an isset()
  check in the same condition.
note: >-
  Syntactic only; it does not detect guards outside the enclosing binary
  expression, such as earlier statements or early returns.
rule:
  all:
    - kind: function_call_expression
    - regex: '^strpos\(\s*\$_SERVER\[\s*[''"]HTTP_USER_AGENT[''"]\s*\]\s*,'
    - not:
        inside:
          stopBy: end
          kind: binary_expression
          regex: 'isset\(\s*\$_SERVER\[\s*[''"]HTTP_USER_AGENT[''"]\s*\]\s*\)'
