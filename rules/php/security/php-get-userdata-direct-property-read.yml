id: php-get-userdata-direct-property-read
language: php
severity: warning
message: >-
  Property read directly on the result of get_userdata(); the call can return
  false, so guard the result before reading the property.
note: >-
  Syntactic check only. Matches a literal get_userdata(...) call followed
  directly by a property access. It does not resolve types or check whether a
  guard exists elsewhere.
rule:
  pattern: 'get_userdata($$$ARGS)->$PROP'
