# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-gmdate-echoed-unlocalized
language: php
severity: warning
message: >-
  A gmdate() or date() call is echoed directly; consider a localized formatter
  such as date_i18n().
note: >-
  Syntactic match only. Matches a literal gmdate() or date() call used as a
  direct echo argument; it does not resolve function identity, aliases, or
  whether the output is actually displayed.
rule:
  pattern: 'echo gmdate($$$ARGS);'
