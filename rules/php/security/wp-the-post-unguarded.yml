id: wp-the-post-unguarded
language: php
severity: warning
message: >-
  the_post() is called as a bare top-level statement with no enclosing guard;
  verify a have_posts() check protects it.
note: >-
  Syntactic approximation only. Matches a bare the_post() expression statement
  that has no enclosing if, loop, or block in the shown syntax; it does not
  verify that a guard exists elsewhere or that posts are present.
rule:
  all:
    - pattern: 'the_post();'
    - not:
        inside:
          kind: if_statement
    - not:
        inside:
          kind: while_statement
    - not:
        inside:
          kind: foreach_statement
    - not:
        inside:
          kind: compound_statement
