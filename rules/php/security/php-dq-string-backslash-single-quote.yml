id: php-dq-string-backslash-single-quote
language: php
severity: warning
message: >-
  Double-quoted PHP string contains a backslash before a single quote; the
  backslash is kept literally, not treated as an escape.
note: >-
  Purely syntactic match on the literal text of a double-quoted string
  containing backslash followed by single quote. It does not resolve runtime
  values, string usage, or whether the backslash was intended.
rule:
  kind: encapsed_string
  regex: '\\'
