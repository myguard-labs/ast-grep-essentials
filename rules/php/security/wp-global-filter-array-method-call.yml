id: wp-global-filter-array-method-call
language: php
severity: warning
message: >-
  Method called directly on a $wp_filter array element; this fails when no
  filter is registered for the hook. Use has_filter() first.
note: >-
  Matches the literal syntax of a method call on a subscripted $wp_filter
  variable. It does not resolve whether the hook is registered at runtime, and
  does not check for guards outside the shown expression.
rule:
  pattern: '$wp_filter[$HOOK]->$METHOD($$$ARGS)'
