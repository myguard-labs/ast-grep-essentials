id: wp-title-attr-escaped-without-tag-strip
language: php
severity: warning
message: >-
  Post title passed through esc_attr() without wp_strip_all_tags(); tags in
  the title stay as literal text in the attribute.
note: >-
  Syntactic match only on the literal esc_attr(apply_filters('the_title',
  ...)) nesting in one expression. It does not resolve variables, aliases, or
  whether the value reaches an attribute.
rule:
  pattern: 'esc_attr( apply_filters( ''the_title'', $ARG ) )'
