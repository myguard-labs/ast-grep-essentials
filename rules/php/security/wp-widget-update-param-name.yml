id: wp-widget-update-param-name
language: php
severity: warning
message: >-
  The update() method in a WP_Widget subclass names its second parameter
  $instance instead of $old_instance, diverging from the parent signature.
note: >-
  Single-file syntactic check only. It matches a method named update inside a
  class with a WP_Widget extends clause whose second parameter is literally
  $instance. It does not resolve inheritance, imports, or runtime binding.
rule:
  all:
    - kind: method_declaration
    - has:
        field: name
        regex: '^update$'
    - inside:
        kind: class_declaration
        has:
          field: name
          kind: name
          regex: '.*'
        stopBy: end
    - has:
        kind: formal_parameters
        has:
          kind: simple_parameter
          nthChild: 2
          has:
            kind: variable_name
            pattern: '$instance'
          stopBy: end
    - not:
        has:
          kind: variable_name
          pattern: '$old_instance'
          stopBy: end
