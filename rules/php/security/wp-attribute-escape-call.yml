# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-attribute-escape-call
language: php
severity: warning
message: 'Call to deprecated attribute_escape(); replace with esc_attr().'
note: >-
  Matches a bare call to the function name attribute_escape only by literal
  syntax. It does not verify that the function is the WordPress core
  definition, that it resolves at runtime, or that the call is in a single
  file context.
rule:
  pattern: 'attribute_escape($$$ARGS)'
