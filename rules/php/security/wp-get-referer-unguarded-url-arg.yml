# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-get-referer-unguarded-url-arg
language: php
severity: warning
message: >-
  wp_get_referer() may return false; passing it directly into
  remove_query_arg() without a fallback can build a URL from false.
note: >-
  Single-file syntactic match on a literal wp_get_referer() call as the direct
  second argument of remove_query_arg(). It does not resolve function
  identity, runtime referrer values, or whether a guard exists elsewhere in
  the function.
rule:
  pattern: 'remove_query_arg($KEYS, wp_get_referer())'
