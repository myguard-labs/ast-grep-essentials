id: wp-screen-icon-call
language: php
severity: warning
message: 'Call to deprecated screen_icon() with no arguments.'
note: >-
  Matches the literal unqualified call syntax screen_icon() with zero
  arguments; does not verify that the function resolves to WordPress core or
  check for namespaced or aliased definitions.
rule:
  pattern: 'screen_icon()'
