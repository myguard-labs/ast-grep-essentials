# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-or-same-operand-inequality-tautology
language: php
severity: warning
message: >-
  This || condition compares the same operand with != against two different
  literals, so it is always true.
note: >-
  Syntactic check only. Matches a single || of two != comparisons whose
  operand text is identical and whose other operands are string literals; does
  not resolve runtime values, aliases, or types.
rule:
  pattern: '''$L'' != $X || ''$R'' != $X'
