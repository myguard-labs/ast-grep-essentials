id: php-error-suppression-static-call
language: php
severity: warning
message: >-
  Error-suppression operator @ is applied to a static method call, which hides
  warnings and notices from that call.
note: >-
  Matches only the literal syntax of @ applied directly to a
  Class::method(...) call. It does not resolve class types, method staticness,
  or runtime errors, so it cannot confirm that a diagnostic is actually
  raised.
rule:
  pattern: '@$CLASS::$METHOD($$$ARGS)'
