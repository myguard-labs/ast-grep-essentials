id: php-author-link-without-author-guard
language: php
severity: warning
message: >-
  This conditional wraps the Author value in an anchor tag but only checks
  AuthorURI; an empty Author can produce an empty link.
note: >-
  Syntactic single-file match only. It checks for an if statement whose
  condition tests AuthorURI with empty() and whose body assigns an anchor
  built from Author without a matching empty() check on Author; it does not
  resolve runtime values or aliasing.
rule:
  pattern: >-
    if ( ! empty($d['AuthorURI']) ) $d['Author'] = '<a href="' . $d['AuthorURI']
    . '">' . $d['Author'] . '</a>';
