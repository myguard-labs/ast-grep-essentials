id: php-falsy-guard-bare-variable-return
language: php
severity: warning
message: >-
  Bare negated variable guard returns a literal; a valid value such as the
  string '0' is falsy and would take this branch.
note: >-
  Purely syntactic. Matches an if whose condition is a bare negated variable
  and whose body only returns a literal. Whether the variable can hold '0' or
  other falsy values depends on types and runtime values, which this rule does
  not check, so some reports may be false positives.
rule:
  pattern: 'if ( ! $VAR ) return $LIT;'
