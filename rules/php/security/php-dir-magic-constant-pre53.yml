# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-dir-magic-constant-pre53
language: php
severity: warning
message: '__DIR__ is a PHP 5.3+ magic constant; it fails to parse on PHP 5.2 code.'
note: >-
  Syntactic check only. Matches the literal __DIR__ name node and does not
  determine the configured PHP version or whether PHP 5.2 support is required.
rule:
  kind: name
  regex: '^__DIR__$'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
