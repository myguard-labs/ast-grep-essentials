id: php-get-posts-number-key
language: php
severity: warning
message: >-
  get_posts() array argument sets the 'number' key, which WordPress ignores;
  use 'numberposts' to limit the post count.
note: >-
  Syntactic match only. Matches a direct get_posts() call whose literal array
  argument contains a 'number' key; it does not resolve aliases, imports, or
  runtime argument values, and does not check WP_User_Query or
  WP_Comment_Query.
rule:
  pattern: 'get_posts($$$ARGS)'
  has:
    pattern: '''number'' => $VAL'
    stopBy: end
