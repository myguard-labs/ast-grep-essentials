id: wp-esc-attr-on-href-url
language: php
severity: warning
message: 'A URL attribute value is escaped with esc_attr() instead of esc_url().'
note: >-
  Matches only a literal string ending in href=" concatenated directly with an
  esc_attr() call in the same expression. It does not check variable values,
  attribute context, or whether the output is actually used in an href.
rule:
  pattern: ''' href="'' . esc_attr($$$ARGS)'
