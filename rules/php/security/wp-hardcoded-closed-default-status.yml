# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-hardcoded-closed-default-status
language: php
severity: warning
message: >-
  This assigns the literal 'closed' to a comment or ping status key instead of
  reading the site default option.
note: >-
  Matches only the literal syntax of an assignment of the string 'closed' to a
  comment_status or ping_status array key inside this file. It does not
  resolve whether the key is unset at runtime, what the site default option
  is, or whether the surrounding code path runs.
rule:
  pattern: '$DATA[''comment_status''] = ''closed'''
