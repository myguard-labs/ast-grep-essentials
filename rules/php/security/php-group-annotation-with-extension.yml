# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-group-annotation-with-extension
language: php
severity: warning
message: >-
  This @group annotation value ends in a file extension, so the test runner
  may treat it as a literal group name instead of a logical group.
note: >-
  Syntactic match on comment text only. It flags a comment containing a @group
  tag whose value ends in a dot followed by letters, without checking whether
  the value is intended as a real file name or how the test runner resolves
  groups.
rule:
  kind: comment
  regex: '@group\s+\S+\.[A-Za-z]+'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
