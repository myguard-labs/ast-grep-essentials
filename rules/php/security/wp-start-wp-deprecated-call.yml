id: wp-start-wp-deprecated-call
language: php
severity: warning
message: >-
  Call to the deprecated start_wp() loop-setup function; use setup_postdata()
  instead.
note: >-
  Matches the literal unqualified call start_wp(...) by syntax only; it does
  not resolve function identity, namespaces, or whether the function is
  defined at runtime.
rule:
  pattern: 'start_wp($$$ARGS)'
