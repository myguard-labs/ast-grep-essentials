id: php-printf-untranslated-literal
language: php
severity: warning
message: >-
  Untranslated format string passed directly to printf; wrap user-visible
  prose in a translation function.
note: >-
  Matches a printf call whose first argument is a literal single-quoted string
  node. It does not resolve runtime values, imports, or whether the output is
  user-visible, so review non-UI formatting matches.
rule:
  kind: function_call_expression
  pattern: 'printf(''$FMT'', $$$ARGS)'
