id: php-add-query-arg-url-first
language: php
severity: warning
message: >-
  add_query_arg() appears to receive a URL-producing call as its first
  argument, which reverses the (key, value, url) order.
note: >-
  Purely syntactic check. It matches a direct add_query_arg call whose first
  argument is a function call and whose second argument is a string literal.
  It does not resolve the callee's return value, types, or whether the call is
  the WordPress function.
rule:
  pattern: 'add_query_arg($URL, $KEY, $$$REST)'
  has:
    kind: function_call_expression
    field: arguments
    stopBy: end
  all:
    - pattern: 'add_query_arg($CALL($$$CARGS), $STR, $$$REST)'
    - pattern: 'add_query_arg($CALL($$$CARGS), ''preview'', $$$REST)'
