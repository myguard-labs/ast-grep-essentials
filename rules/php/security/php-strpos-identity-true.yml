# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-strpos-identity-true
language: php
severity: warning
message: >-
  strpos() is compared with identity to true, which can never hold because
  strpos returns an int offset or false. Review this comparison.
note: >-
  Single-file syntactic match on a literal strpos(...) call compared with ===
  true. It does not resolve whether strpos is the global PHP function or a
  namespaced/user-defined function, and it does not check runtime values.
rule:
  pattern: 'strpos($$$ARGS) === true'
