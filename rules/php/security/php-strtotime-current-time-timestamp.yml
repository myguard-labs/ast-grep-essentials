id: php-strtotime-current-time-timestamp
language: php
severity: warning
message: >-
  strtotime() is called with current_time('timestamp'), which returns an
  integer timestamp rather than a date string.
note: >-
  Matches the literal nested call strtotime(current_time('timestamp')) only;
  it does not resolve function identity, types, or aliases, and does not check
  other timestamp-producing calls.
rule:
  pattern: 'strtotime(current_time(''timestamp''))'
