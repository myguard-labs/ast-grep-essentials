id: php-tempnam-hardcoded-tmp
language: php
severity: warning
message: >-
  tempnam() is called with a hardcoded '/tmp' directory; use a configurable
  temp directory helper instead.
note: >-
  Single-file syntactic match on a literal '/tmp' first argument to tempnam().
  It does not resolve aliases, wrappers, or runtime values, and does not check
  whether the directory exists or is writable.
rule:
  pattern: 'tempnam(''/tmp'', $$$ARGS)'
