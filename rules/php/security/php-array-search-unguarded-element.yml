id: php-array-search-unguarded-element
language: php
severity: warning
message: >-
  array_search() receives a subscript expression as haystack without a ??
  fallback; a missing key passes null.
note: >-
  Syntactic check only. Matches array_search calls whose haystack argument is
  a subscript expression with no ?? operator; it does not verify that the key
  is actually unset at runtime or resolve types.
rule:
  all:
    - pattern: 'array_search($$$ARGS, $ARR[$KEY])'
    - not:
        pattern: 'array_search($$$ARGS, $ARR[$KEY] ?? $FALLBACK)'
