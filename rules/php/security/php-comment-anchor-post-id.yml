id: php-comment-anchor-post-id
language: php
severity: warning
message: >-
  Comment row DOM id is built from comment_post_ID; the comment's own
  comment_ID is expected.
note: >-
  Syntactic match only on a string literal containing the literal property
  access $comment->comment_post_ID inside a comment- anchor. It does not
  verify the variable's type or that the value is a comment object, and it
  does not check runtime values.
rule:
  pattern: '"<tr id=''comment-$comment->comment_post_ID''>"'
