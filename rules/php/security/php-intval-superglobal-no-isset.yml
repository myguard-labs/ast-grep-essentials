id: php-intval-superglobal-no-isset
language: php
severity: warning
message: >-
  intval() is applied directly to a request superglobal index without an
  isset()/empty() guard in the same expression.
note: >-
  Syntactic only; a guard in a separate statement is not recognized, and the
  check only looks for isset/empty text inside an enclosing ternary.
rule:
  all:
    - pattern: 'intval($A[$K])'
    - not:
        inside:
          kind: conditional_expression
          stopBy: end
          regex: '(isset|empty)\s*\('
constraints:
  A:
    regex: '^\$_(REQUEST|GET|POST)$'
