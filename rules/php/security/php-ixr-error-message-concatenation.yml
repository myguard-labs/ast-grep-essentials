id: php-ixr-error-message-concatenation
language: php
severity: warning
message: >-
  IXR_Error message is built by concatenation, which may leak request or user
  data into the XML-RPC fault text.
note: >-
  Matches the literal constructor syntax new IXR_Error(code, 'literal' . $var)
  with a concatenation as the second argument. It does not resolve types,
  aliases, or whether the variable holds sensitive data.
rule:
  pattern: 'new IXR_Error($CODE, $A . $B)'
