id: php-ixr-error-message-concatenation
language: php
severity: warning
message: >-
  IXR_Error message is built by concatenation, which may leak request or user
  data into the XML-RPC fault text.
note: >-
  Matches the literal constructor syntax new IXR_Error(code, 'literal' . $var)
  with a concatenation as the second argument. It does not resolve types,
  aliases, or whether the variable holds sensitive data.
rule:
  pattern: 'new IXR_Error($CODE, $A . $B)'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-209'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/209.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A10:2025'
  todo_cases:
    - 'interpolated message new IXR_Error(403, "Bad $u") and sprintf("Bad %s", $u) are not flagged'
    - 'parenthesised concatenation and a leading-backslash class (new \IXR_Error(403, "a" . $u)) are not flagged'
