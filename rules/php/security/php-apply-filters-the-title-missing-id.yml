id: php-apply-filters-the-title-missing-id
language: php
severity: warning
message: >-
  apply_filters('the_title') is called with only the title argument; the post
  ID third argument is missing.
note: >-
  Purely syntactic match on a literal 'the_title' hook name with exactly two
  arguments. It does not resolve the hook's callbacks or confirm they require
  a third argument.
rule:
  pattern: 'apply_filters(''the_title'', $ARG)'
