# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-hardcoded-http-scheme-href
language: php
severity: warning
message: >-
  This sprintf format string hardcodes an http:// scheme inside an href
  attribute; build the scheme from the current request or site URL instead.
note: >-
  Matches only string literals containing an href attribute with a literal
  http:// scheme passed as a sprintf format argument. It is purely syntactic
  and does not resolve the value at runtime or check whether the site is
  served over HTTPS.
rule:
  pattern: 'sprintf(''$FMT'', $$$ARGS)'
  has:
    regex: 'href=\\?"http://'
