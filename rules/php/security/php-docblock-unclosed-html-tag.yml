# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-docblock-unclosed-html-tag
language: php
severity: warning
message: This docblock opens a tt tag that is not closed within the same comment.
note: >-
  Single-file syntactic check on the comment text only. It matches a docblock
  comment containing a literal opening tt tag and no literal closing tt tag,
  without verifying how generated documentation renders the HTML or inspecting
  tags closed outside the comment.
rule:
  all:
    - kind: comment
    - regex: '^/\*\*[\s\S]*<tt>'
    - not:
        regex: '</tt>'
