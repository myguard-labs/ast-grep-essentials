id: php-preg-required-attr-char
language: php
severity: warning
message: >-
  This preg_match pattern requires at least one character between the tag name
  and '>' via '.+?', so it will not match a plain tag without attributes.
note: >-
  Syntactic check on a single preg_match regex literal only. It does not
  verify runtime input, the regex flags, or whether any matching tag actually
  carries attributes.
rule:
  pattern: 'preg_match(''|<guid.+?>(.*?)</guid>|is'', $POST, $GUID)'
