id: php-require-under-defined-guard
language: php
severity: warning
message: >-
  A require under a defined() guard has no file_exists() check on the required
  path.
note: >-
  Syntactic single-file match only. It matches an if whose condition is a
  direct defined() call and whose body is a require of the literal ABSPATH
  path; it does not resolve constants, files, or runtime values, and does not
  verify that the file exists.
rule:
  pattern: |
    if ( defined($CONST) ) require (ABSPATH . 'wp-content/advanced-cache.php');
