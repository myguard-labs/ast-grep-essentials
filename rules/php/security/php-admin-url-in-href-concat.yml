id: php-admin-url-in-href-concat
language: php
severity: warning
message: >-
  admin_url() is concatenated into an href string; consider self_admin_url()
  for admin links.
note: >-
  Syntactic match only. It flags a direct admin_url( call inside a binary
  concatenation whose literal sibling contains href=. It does not resolve
  functions, context, or runtime values.
rule:
  pattern: 'admin_url($$$ARGS)'
  inside:
    kind: binary_expression
    has:
      kind: string
      regex: 'href='
