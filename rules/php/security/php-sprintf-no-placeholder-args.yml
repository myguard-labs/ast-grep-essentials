id: php-sprintf-no-placeholder-args
language: php
severity: warning
message: >-
  sprintf() receives extra arguments but its translated format string literal
  has no % placeholders; the arguments are ignored.
note: >-
  Matches only a literal sprintf call whose first argument is a literal __()
  string with no % characters and at least one further argument. It does not
  inspect runtime translations, verify the gettext catalog, or resolve the
  function identity.
rule:
  pattern: 'sprintf(__($FMT), $$$ARGS)'
  not:
    has:
      regex: '%'
