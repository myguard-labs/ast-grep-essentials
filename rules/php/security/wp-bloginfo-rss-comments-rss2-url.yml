id: wp-bloginfo-rss-comments-rss2-url
language: php
severity: warning
message: >-
  bloginfo_rss() is called with 'comments_rss2_url'; consider
  comments_rss_link() instead.
note: >-
  Matches only a literal single-quoted 'comments_rss2_url' argument in a
  direct bloginfo_rss() call. It does not verify the call is in a theme
  template or resolve the function at runtime.
rule:
  pattern: 'bloginfo_rss(''comments_rss2_url'')'
