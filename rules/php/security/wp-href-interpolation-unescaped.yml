# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-href-interpolation-unescaped
language: php
severity: warning
message: Plain variable interpolated into an href attribute without an escape call.
note: >-
  Single-file syntactic match on a double-quoted PHP string containing
  href='...' with a bare $variable inside. It does not resolve types,
  sanitization upstream, or whether the value is actually unsafe.
rule:
  kind: encapsed_string
  regex: 'href=''\$[A-Za-z_][A-Za-z0-9_]*'''
