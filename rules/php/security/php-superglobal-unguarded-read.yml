id: php-superglobal-unguarded-read
language: php
severity: warning
message: >-
  A request superglobal element is used directly as an if condition without an
  isset guard.
note: >-
  Syntactic only; matches an if condition that is directly a GET superglobal
  subscript. It does not check for guards elsewhere or runtime values.
rule:
  kind: subscript_expression
  regex: '^\$_GET\['
  inside:
    kind: parenthesized_expression
    inside:
      kind: if_statement
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
