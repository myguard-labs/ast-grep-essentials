id: php-elseif-negated-condition-dead-branch
language: php
severity: warning
message: >-
  This elseif tests the negation of the variable already tested by the
  preceding if, so the branch is dead or misleading.
note: >-
  Single-file syntactic match on a literal variable tested by an if and
  negated in the following elseif; it does not resolve types, aliasing, or
  runtime values.
rule:
  pattern: |
    if ($VAR) { $$$BODY1 } elseif (! $VAR) { $$$BODY2 }
