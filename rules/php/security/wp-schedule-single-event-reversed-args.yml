id: wp-schedule-single-event-reversed-args
language: php
severity: warning
message: >-
  wp_schedule_single_event() is called with a string literal as its first
  argument, which should be the timestamp; the hook name belongs in the second
  argument.
note: >-
  Syntactic check only. Matches a direct wp_schedule_single_event call whose
  first argument is a string literal; it does not resolve the function
  identity, imports, or runtime argument values.
rule:
  pattern: 'wp_schedule_single_event(''$HOOK'', $$$ARGS)'
