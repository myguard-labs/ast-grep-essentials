id: php-manual-timezone-offset-time-arithmetic
language: php
severity: warning
message: >-
  This date() call builds its timestamp by adding time() to a hand-computed
  hour offset; timezone offsets computed this way ignore DST and the site
  timezone setting.
note: >-
  Syntactic match on a date() call whose first argument is time() plus a
  product with 3600. It does not resolve the offset source or confirm the
  value is a timezone setting; it cannot tell whether a timezone helper is
  used elsewhere.
rule:
  pattern: 'date($FMT, time() + ($OFFSET * 3600))'
