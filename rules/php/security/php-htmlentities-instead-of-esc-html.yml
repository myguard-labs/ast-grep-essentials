# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-htmlentities-instead-of-esc-html
language: php
severity: warning
message: 'Use WordPress esc_html() instead of calling htmlentities() directly.'
note: >-
  Syntactic match on a literal htmlentities(...) call only; does not resolve
  whether the call is a WordPress context or whether the result is used for
  output.
rule:
  pattern: 'htmlentities($$$ARGS)'
