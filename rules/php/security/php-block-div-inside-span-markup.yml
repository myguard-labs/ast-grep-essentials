id: php-block-div-inside-span-markup
language: php
severity: warning
message: >-
  A <div> element appears inside a <span> opening tag in a string literal;
  this is invalid inline-in-block nesting.
note: >-
  Syntactic string-content heuristic only. It matches literal text containing
  a span start tag followed later by a div start tag in the same string; it
  does not verify the generated HTML, runtime values, or whether the string is
  rendered.
rule:
  kind: string
  regex: '<span[^>]*>.*<div'
