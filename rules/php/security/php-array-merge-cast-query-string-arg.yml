id: php-array-merge-cast-query-string-arg
language: php
severity: warning
message: >-
  Casting a parameter to array inside array_merge keeps a query string as a
  single element instead of parsing it; review this call.
note: >-
  Syntactic match only on a direct array_merge call whose argument is an
  (array) cast. It does not verify that the cast value may be a string at
  runtime, and does not resolve types, aliases, or dataflow.
rule:
  pattern: 'array_merge($DEFAULTS, (array) $PARAM)'
