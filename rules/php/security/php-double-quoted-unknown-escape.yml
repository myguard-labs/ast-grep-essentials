id: php-double-quoted-unknown-escape
language: php
severity: warning
message: >-
  Double-quoted PHP string contains a backslash escape that is not a valid PHP
  escape sequence; use single quotes or a valid escape.
note: >-
  Syntactic check only. It matches double-quoted string literals containing a
  backslash followed by a letter that is not a PHP escape letter (n, t, r, v,
  e, f, $, ", \, u, x, 0-7). It does not verify runtime values, interpolation
  context, or intent.
rule:
  kind: encapsed_string
  regex: '\\[a-zA-Z]'
  not:
    regex: '\\[ntrvef$"\\\\u x0-7]'
