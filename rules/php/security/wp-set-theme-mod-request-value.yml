id: wp-set-theme-mod-request-value
language: php
severity: warning
message: 'set_theme_mod() stores a raw request superglobal element; sanitize it first.'
note: >-
  Matches only a literal request superglobal element (REQUEST, GET or POST) as
  the second argument. It does not track values through variables or resolve a
  shadowed set_theme_mod.
rule:
  kind: function_call_expression
  all:
    - has:
        field: function
        regex: '^set_theme_mod$'
    - has:
        field: arguments
        has:
          kind: argument
          nthChild: 2
          has:
            kind: subscript_expression
            regex: '^\$_(REQUEST|GET|POST)\s*\['
