id: php-global-set-after-callback
language: php
severity: warning
message: >-
  A branch invokes call_user_func and returns, and a later statement assigns a
  GLOBALS key, so the callback runs before the global is set.
note: >-
  Syntactic ordering check only; it does not verify the callback reads the
  global or that the later assignment is reachable on the same path.
rule:
  kind: if_statement
  all:
    - has:
        pattern: 'call_user_func($$$ARGS)'
        stopBy: end
    - has:
        kind: return_statement
        stopBy: end
    - precedes:
        stopBy: end
        kind: expression_statement
        has:
          kind: assignment_expression
          regex: '^\$GLOBALS\['
