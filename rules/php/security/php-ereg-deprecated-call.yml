# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-ereg-deprecated-call
language: php
severity: warning
message: 'Call to removed POSIX regex function ereg(); replace with preg_match().'
note: >-
  Matches the literal function name ereg at a direct call site by syntax only.
  It does not resolve namespaces, imports, or whether a user-defined function
  shadows ereg.
rule:
  pattern: 'ereg($$$ARGS)'
