id: wp-redirect-concat-query-string
language: php
severity: warning
message: >-
  Build redirect query strings with add_query_arg() instead of concatenating a
  '?key=value' literal onto the URL.
note: >-
  Syntactic match only. It flags a wp_redirect call whose first argument is a
  binary concatenation whose right operand is a string literal starting with
  '?'. It does not resolve whether the left operand already contains a query
  string or whether add_query_arg is shadowed.
rule:
  pattern: 'wp_redirect($A . ''?added=true'')'
