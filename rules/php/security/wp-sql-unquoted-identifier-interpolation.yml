id: wp-sql-unquoted-identifier-interpolation
language: php
severity: warning
message: >-
  Table or column name interpolated unquoted into a double-quoted SQL string;
  wrap the identifier in backticks.
note: >-
  Syntactic match only. It flags a double-quoted PHP string containing INSERT
  INTO, UPDATE or FROM followed directly by a variable with no backtick; it
  does not resolve whether the variable holds tainted or reserved-word input.
rule:
  kind: encapsed_string
  regex: '(?i)(INSERT\s+INTO|UPDATE|FROM)\s+\$[A-Za-z_][A-Za-z0-9_]*\s'
  not:
    regex: '(?i)(INSERT\s+INTO|UPDATE|FROM)\s+`'
