id: wp-deprecated-file-version-zero
language: php
severity: warning
message: >-
  _deprecated_file() is called with the placeholder version '0.0', so the
  notice cannot name the release that dropped the file.
note: >-
  Purely syntactic check of a direct _deprecated_file call whose second
  argument is the literal string '0.0'. It does not resolve the function
  identity, imports, or runtime values.
rule:
  pattern: '_deprecated_file($$$ARGS, ''0.0'', $$$REST)'
