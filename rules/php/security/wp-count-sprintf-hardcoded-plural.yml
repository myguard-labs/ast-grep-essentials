id: wp-count-sprintf-hardcoded-plural
language: php
severity: warning
message: >-
  Hard-coded plural noun in a count sprintf() format string; wrap it in _n()
  for translation.
note: >-
  Single-file syntactic check on a literal sprintf format string containing %s
  followed by a plural-looking word in parentheses. It does not resolve the
  function, verify the count is numeric, or check translation context.
rule:
  pattern: 'sprintf(''(%s comments)'', $$$ARGS)'
