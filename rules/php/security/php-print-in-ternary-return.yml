# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-print-in-ternary-return
language: php
severity: warning
message: >-
  print is used as a branch of a conditional expression; it outputs and yields
  1 instead of the intended value.
note: >-
  Syntactic match only. Detects a ternary whose true or false branch is a
  print expression; does not verify runtime behavior, types, or intent.
rule:
  kind: conditional_expression
  has:
    kind: print_intrinsic
    stopBy: end
