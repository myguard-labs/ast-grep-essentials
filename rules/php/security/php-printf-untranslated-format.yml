# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-printf-untranslated-format
language: php
severity: warning
message: 'Format string passed to printf() is not wrapped in a translation function.'
note: >-
  Syntactic check only. Matches a direct printf call whose first argument is a
  literal string; it does not verify the callee resolves to PHP's built-in
  printf or check the string's content beyond the literal shape.
rule:
  pattern: 'printf(''$FMT'', $$$ARGS)'
