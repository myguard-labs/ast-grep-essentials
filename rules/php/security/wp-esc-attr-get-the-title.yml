id: wp-esc-attr-get-the-title
language: php
severity: warning
message: >-
  esc_attr() wraps get_the_title(); the title may contain inline HTML that is
  escaped rather than stripped. Consider the_title_attribute().
note: >-
  Single-file syntactic match on the literal call esc_attr(get_the_title()).
  It does not resolve functions, imports, or runtime values, and does not
  check whether the result is used in an attribute.
rule:
  pattern: 'esc_attr(get_the_title())'
