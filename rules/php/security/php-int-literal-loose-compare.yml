# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-int-literal-loose-compare
language: php
severity: warning
message: >-
  Loose == comparison between an integer literal and a variable; review for
  type juggling.
note: >-
  Matches only the literal syntax of an integer literal on one side of == and
  a plain variable on the other. It does not resolve runtime types of the
  variable, and does not check for strict comparison or context.
rule:
  pattern: '0 == $VAR'
