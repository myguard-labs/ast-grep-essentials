id: wp-wpdb-fetch-row-call
language: php
severity: warning
message: >-
  Call to $wpdb->fetch_row(), a method the wpdb class does not define; use
  get_row() instead.
note: >-
  Matches the literal receiver syntax $wpdb->fetch_row(...) in a single file
  without resolving types, imports, or runtime values.
rule:
  pattern: '$wpdb->fetch_row($$$ARGS)'
