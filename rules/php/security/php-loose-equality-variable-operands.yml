# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-loose-equality-variable-operands
language: php
severity: warning
message: >-
  Loose == comparison between two variables; consider strict === to avoid PHP
  type juggling.
note: >-
  Syntactic only. Matches a binary == whose left and right operands are both
  variables or array accesses. It does not check operand types, taint, or
  whether values are untrusted, so it over-reports.
rule:
  pattern: '$A == $B'
  all:
    - has:
        kind: variable_name
        pattern: '$A'
        stopBy: end
    - not:
        has:
          kind: string
          stopBy: end
