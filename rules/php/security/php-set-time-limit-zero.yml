id: php-set-time-limit-zero
language: php
severity: warning
message: >-
  A call to set_time_limit() with the literal 0 removes the execution time
  limit.
note: >-
  Matches the literal set_time_limit(0) call syntax only; it does not verify
  the runtime context (CLI versus web entry point) or any type or alias
  information.
rule:
  pattern: 'set_time_limit(0)'
