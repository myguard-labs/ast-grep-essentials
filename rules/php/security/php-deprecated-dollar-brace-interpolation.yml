# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-deprecated-dollar-brace-interpolation
language: php
severity: warning
message: >-
  Replace the simple ${name} interpolation with the {$name} form, which PHP
  8.2 deprecates.
note: >-
  Matches the literal text of a double-quoted string whose content contains a
  simple ${name} interpolation with a plain variable name; it does not resolve
  variable types or runtime values and does not check heredoc-specific
  parsing.
rule:
  pattern: '"${$NAME}"'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
