id: php-exec-sink
language: php
severity: warning
message: >-
  Execution-related call:
  system/exec/passthru/shell_exec/popen/proc_open/eval/assert. Review shell
  use and input trust for execution APIs; never evaluate request-derived code.
  assert evaluated string arguments only before PHP 8.0; modern assertions are
  not string-evaluation sinks.
note: >-
  Candidate inventory, not a verdict. Inspect each API and PHP version: fixed
  commands and ordinary assertions can match. Prefer direct argument arrays
  where supported over composing shell commands. Assertion-based validation
  also needs review because assertions can be disabled.
rule:
  kind: function_call_expression
  has:
    field: function
    regex: '(?i)^\\?(system|exec|passthru|shell_exec|popen|proc_open|eval|assert)$'
