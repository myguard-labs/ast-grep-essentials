id: php-exec-sink
language: php
severity: warning
message: >-
  Command/code-execution sink — system/exec/passthru/shell_exec/popen/proc_open/
  eval. If any part of the argument derives from request input it is command or
  code injection. Use escapeshellarg/escapeshellcmd for shell args, or avoid the
  shell entirely; never eval request-derived strings.
note: >-
  Fires on every call to these functions — a candidate, not a verdict. Dismiss
  when the whole argument is a trusted constant. eval() is almost never justified.
rule:
  kind: function_call_expression
  has:
    field: function
    regex: '(?i)^(system|exec|passthru|shell_exec|popen|proc_open|eval|assert)$'
