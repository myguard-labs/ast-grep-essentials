id: php-single-quoted-interpolation-placeholder
language: php
severity: warning
message: >-
  A single-quoted string literal contains a {$variable} placeholder that PHP
  will not interpolate.
note: >-
  Syntactic check only. Matches single-quoted string literals whose text
  contains a {$...} placeholder; it does not resolve whether the string is
  later used as a hook name or key, and does not check types or runtime
  values.
rule:
  pattern: '''$$$TEXT'''
  regex: '\{\$[A-Za-z_][A-Za-z0-9_]*\}'
