id: php-bloginfo-return-value
language: php
severity: warning
message: >-
  bloginfo() echoes its value and returns nothing; use get_bloginfo() when
  assigning the result.
note: >-
  Syntactic match on a literal bloginfo( call used as an assignment right-hand
  side. Does not resolve function identity, namespaces, or whether the call is
  shadowed; it does not check runtime return values.
rule:
  kind: assignment_expression
  all:
    - has:
        field: right
        pattern: 'bloginfo($$$ARGS)'
    - pattern: '$VAR = bloginfo($$$ARGS)'
