id: php-fread-filesize-zero-length
language: php
severity: warning
message: >-
  fread() length comes from filesize(), which is 0 for empty files; PHP 8
  throws a ValueError on a zero length.
note: >-
  Matches the literal fread(_, filesize(...)) call syntax only. It does not
  resolve the file handle, check whether the file is empty, or track the size
  value through variables.
rule:
  pattern: 'fread($F, filesize($P))'
