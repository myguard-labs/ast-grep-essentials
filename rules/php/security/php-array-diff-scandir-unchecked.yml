id: php-array-diff-scandir-unchecked
language: php
severity: warning
message: >-
  The return value of scandir() is passed directly to array_diff() without a
  check; a failed scandir() returns false.
note: >-
  Single-file syntactic match on a direct scandir(...) call nested as the
  first argument of array_diff(...). It does not verify the directory path,
  resolve aliases, or detect guards elsewhere in the function, so it may
  report cases that are already checked.
rule:
  pattern: 'array_diff(scandir($$$SCANARGS), $$$REST)'
