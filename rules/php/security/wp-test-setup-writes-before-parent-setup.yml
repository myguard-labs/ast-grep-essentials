id: wp-test-setup-writes-before-parent-setup
language: php
severity: warning
message: >-
  Option write in setUp() appears before parent::setUp(), so it may run
  outside the test transaction.
note: >-
  Syntactic ordering check only. It flags an update_option() statement that
  textually precedes a parent::setUp() call inside the same setUp method; it
  does not resolve types, inheritance, or runtime transaction behavior.
rule:
  pattern: 'update_option($$$ARGS);'
  inside:
    kind: method_declaration
    regex: setUp
    stopBy: end
    has:
      pattern: 'parent::setUp();'
      stopBy: end
      follows:
        pattern: 'update_option($$$ARGS);'
        stopBy: end
