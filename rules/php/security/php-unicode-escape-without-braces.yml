# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-unicode-escape-without-braces
language: php
severity: warning
message: >-
  Double-quoted PHP string uses a \uXXXX escape without braces; PHP keeps this
  as literal text, not a code point. Use \u{XXXX} instead.
note: >-
  Syntactic check only. Matches double-quoted string literals whose text
  contains a backslash-u followed by four hex digits and no opening brace; it
  does not evaluate runtime values or resolve string concatenation.
rule:
  kind: encapsed_string
  regex: '\\u[0-9a-fA-F]{4}'
