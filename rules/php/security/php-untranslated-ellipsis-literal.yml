# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-untranslated-ellipsis-literal
language: php
severity: warning
message: >-
  This HTML string hardcodes an ellipsis in a span without a translation
  wrapper.
note: >-
  Syntactic match only. It flags a literal string node containing a bare
  three-dot ellipsis span and does not verify that the string is displayed to
  users, resolve translation wrappers across files, or check the surrounding
  expression.
rule:
  kind: string
  regex: '<span class=\"page-numbers dots\">\.\.\.</span>'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
