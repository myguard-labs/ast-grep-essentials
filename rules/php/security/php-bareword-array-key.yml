id: php-bareword-array-key
language: php
severity: warning
message: >-
  Array literal key is a bare identifier; use a quoted string key if a string
  key was intended.
note: >-
  Syntactic only. Matches a bare identifier used as the key of an array(...)
  element before =>; it does not check whether a constant with that name
  exists or resolve types or runtime values.
rule:
  kind: array_element_initializer
  has:
    kind: name
    stopBy: neighbor
  not:
    has:
      kind: string
      stopBy: neighbor
