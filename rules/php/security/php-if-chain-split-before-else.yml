id: php-if-chain-split-before-else
language: php
severity: warning
message: >-
  This if statement follows another if with no else between them, so its
  trailing else pairs only with this second if; the first branch's action also
  runs on the else path.
note: >-
  Single-file syntactic match on a literal if statement with an else directly
  after a preceding sibling if. It does not resolve the compared values,
  types, or runtime control flow.
rule:
  kind: if_statement
  all:
    - has:
        field: alternative
        kind: else_clause
    - follows:
        kind: if_statement
        stopBy: neighbor
