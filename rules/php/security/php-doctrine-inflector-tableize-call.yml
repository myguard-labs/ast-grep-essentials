id: php-doctrine-inflector-tableize-call
language: php
severity: warning
message: >-
  Direct static call to Inflector::tableize(); this Doctrine helper is
  deprecated and removed from doctrine/inflector, so review this call before
  upgrading.
note: >-
  Matches the literal receiver syntax Inflector::tableize(...) in a single
  file without resolving imports, aliases, or the actual class the name refers
  to.
rule:
  pattern: 'Inflector::tableize($$$ARGS)'
