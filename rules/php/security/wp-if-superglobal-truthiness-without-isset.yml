id: wp-if-superglobal-truthiness-without-isset
language: php
severity: warning
message: >-
  The if condition tests a bare POST superglobal index without isset or empty;
  an absent key raises an undefined-index notice.
note: >-
  Matches only the literal syntax of a POST superglobal subscript as the whole
  if condition; it does not check for earlier guards or other superglobals.
rule:
  all:
    - kind: subscript_expression
    - regex: '^\$_POST\s*\['
    - inside:
        kind: parenthesized_expression
        inside:
          kind: if_statement
