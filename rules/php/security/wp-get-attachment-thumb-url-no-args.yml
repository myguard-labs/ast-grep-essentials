id: wp-get-attachment-thumb-url-no-args
language: php
severity: warning
message: >-
  wp_get_attachment_thumb_url() is called with no arguments, so the required
  attachment ID is missing.
note: >-
  Matches only a direct, unqualified call with zero arguments in this file. It
  does not resolve whether the function is the WordPress core function or
  check runtime values.
rule:
  pattern: 'wp_get_attachment_thumb_url()'
