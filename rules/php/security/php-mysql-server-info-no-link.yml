id: php-mysql-server-info-no-link
language: php
severity: warning
message: >-
  mysql_get_server_info() is called without a link handle, so it uses the most
  recently opened connection.
note: >-
  Single-file syntactic match on a zero-argument call to
  mysql_get_server_info(). It does not resolve connection identity, imports,
  or runtime values.
rule:
  pattern: 'mysql_get_server_info()'
