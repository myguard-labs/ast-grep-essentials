id: php-strlen-truthiness-ternary
language: php
severity: warning
message: >-
  A bare strlen() call is used as the condition of a ternary; review whether
  the string itself should be the truthiness test.
note: >-
  Syntactic match only. Truthiness of strlen() differs from the string's
  truthiness (for example '0' is falsy but strlen('0') is 1), so this is
  advisory and not auto-fixed.
rule:
  pattern: 'strlen($$$ARGS) ? $$$THEN : $$$ELSE'
