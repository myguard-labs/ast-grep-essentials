id: php-ternary-assignment-statement
language: php
severity: warning
message: >-
  Ternary used as a statement with assignments in its arms; use an if/else
  statement or assign the ternary result instead.
note: >-
  Single-file syntactic match on an expression statement whose top-level
  ternary has assignment expressions in its consequence and alternative arms.
  It does not resolve types, aliasing, or runtime values.
rule:
  kind: expression_statement
  has:
    kind: conditional_expression
    all:
      - has:
          field: body
          kind: assignment_expression
      - has:
          field: alternative
          kind: assignment_expression
