id: wp-add-query-args-misspelled-call
language: php
severity: warning
message: >-
  Call to add_query_args(), which is not a WordPress function; the intended
  function is add_query_arg().
note: >-
  Matches the literal function name syntax only; it does not verify that the
  function is undefined at runtime or resolve namespaces, imports, or
  definitions in other files.
rule:
  pattern: 'add_query_args($$$ARGS)'
