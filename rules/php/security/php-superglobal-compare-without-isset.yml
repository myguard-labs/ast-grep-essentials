id: php-superglobal-compare-without-isset
language: php
severity: warning
message: >-
  Superglobal element is compared directly without an isset() check in the
  same condition.
note: >-
  Syntactic only; it does not verify that the isset() guards the same key or
  that the key is otherwise guaranteed to exist.
rule:
  all:
    - pattern: '$A == $B'
    - has:
        kind: subscript_expression
        has:
          kind: variable_name
          regex: '^\$_(GET|POST|REQUEST|COOKIE)$'
    - not:
        inside:
          stopBy: end
          kind: binary_expression
          has:
            stopBy: end
            pattern: 'isset($$$ARGS)'
