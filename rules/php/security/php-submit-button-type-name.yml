id: php-submit-button-type-name
language: php
severity: warning
message: >-
  The second (type) argument of submit_button() is the string 'submit', which
  looks like a button name copied into the style type slot.
note: >-
  Purely syntactic match on a literal 'submit' as the second argument of a
  direct submit_button call. Does not verify the call's semantics or resolve
  the function identity.
rule:
  pattern: 'submit_button($A, ''submit'', $$$ARGS)'
