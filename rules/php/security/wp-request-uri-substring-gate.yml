# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-request-uri-substring-gate
language: php
severity: warning
message: Substring test on attacker-controlled request path should not gate behavior.
note: >-
  Matches a literal strstr call on the REQUEST_URI or PHP_SELF server entry
  directly inside a return statement only; does not cover boolean-condition
  uses or resolve aliasing.
rule:
  kind: function_call_expression
  regex: '^strstr\(\s*\$_SERVER\[\s*[''"](REQUEST_URI|PHP_SELF)[''"]\s*\]'
  inside:
    kind: return_statement
