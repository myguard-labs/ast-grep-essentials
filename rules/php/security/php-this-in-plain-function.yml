# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-this-in-plain-function
language: php
severity: warning
message: >-
  $this is used inside a plain function that is not nested in a class; $this
  is undefined here.
note: >-
  Syntactic check only. Matches a $this-> member access inside a function
  declaration with no class declaration ancestor; it does not verify runtime
  binding, closures, or traits.
rule:
  all:
    - pattern: '$this->get_var($$$ARGS)'
    - inside:
        kind: function_definition
        stopBy: end
    - not:
        inside:
          kind: class_declaration
          stopBy: end
