id: php-admin-page-untranslated-title
language: php
severity: warning
message: >-
  Admin menu page title is a bare string literal; wrap user-visible menu text
  in __() or _e() for translation.
note: >-
  Single-file syntactic check. Matches a literal first argument to
  add_theme_page() only; it does not resolve the function's origin, other
  add_*_page wrappers, or whether the string is already translated elsewhere.
rule:
  pattern: 'add_theme_page(''$TITLE'', $$$ARGS)'
