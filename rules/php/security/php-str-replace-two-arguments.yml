id: php-str-replace-two-arguments
language: php
severity: warning
message: >-
  str_replace() is called with only two arguments; it requires a subject as
  the third argument and will raise an ArgumentCountError.
note: >-
  Matches the literal two-argument call syntax to str_replace without
  resolving namespaces, function aliases, or runtime definitions.
rule:
  pattern: 'str_replace($A, $B)'
