id: php-magic-call-property-passthrough
language: php
severity: warning
message: >-
  This __call() body reads a dynamically named property on $this using the
  method name, so undefined method calls silently read properties.
note: >-
  Matches the literal syntax of a __call method whose body returns
  $this->$name using the first parameter; it does not resolve runtime values,
  inheritance, or whether the property exists.
rule:
  pattern: 'return $this->$CALLEE;'
  inside:
    kind: method_declaration
    regex: __call
    stopBy: end
