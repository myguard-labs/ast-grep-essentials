id: wp-translation-concatenation
language: php
severity: warning
message: >-
  Translation call is concatenated with '.'; pass the full sentence as a
  format string to printf or sprintf so translators can reorder words.
note: >-
  Syntactic single-file check only. Matches a literal translation function
  call written directly as an operand of '.' concatenation; it does not
  resolve imports, aliases, or runtime values.
rule:
  pattern: '__($$$ARGS) . $RIGHT'
