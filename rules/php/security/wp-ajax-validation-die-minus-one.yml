id: wp-ajax-validation-die-minus-one
language: php
severity: warning
message: >-
  die('-1') is used after a failed preg_match validation; -1 signals an
  authentication failure to admin-ajax clients.
note: >-
  Syntactic match only; it does not verify that the preg_match input comes
  from request data or that the handler is an AJAX handler.
rule:
  all:
    - pattern: 'die(''-1'')'
    - inside:
        kind: if_statement
        stopBy: end
        has:
          field: condition
          has:
            pattern: 'preg_match($$$ARGS)'
            stopBy: end
