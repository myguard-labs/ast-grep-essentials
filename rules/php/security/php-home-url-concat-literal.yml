id: php-home-url-concat-literal
language: php
severity: warning
message: >-
  home_url() with no arguments is concatenated with a string; pass the path to
  home_url() instead.
note: >-
  Syntactic match only. It flags a zero-argument home_url() call used as the
  left operand of a concatenation. It does not resolve the function identity,
  imports, or runtime values.
rule:
  pattern: 'home_url() . $RIGHT'
