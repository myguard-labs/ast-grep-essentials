id: php-suppressed-dl-call
language: php
severity: warning
message: >-
  A dl() call is prefixed with the @ error-suppression operator, hiding load
  failures.
note: >-
  Matches the literal syntax of an @-prefixed dl() call only. It does not
  verify that dl() is available in the SAPI or that the extension actually
  loaded; guard with function_exists() and extension_loaded() instead.
rule:
  pattern: '@dl($$$ARGS)'
