id: php-silenced-parse-url
language: php
severity: warning
message: >-
  parse_url() is called with the @ error-suppression operator, hiding warnings
  about malformed or missing input.
note: >-
  Matches the literal syntax of an @-prefixed parse_url call with any
  arguments. It does not resolve whether parse_url is the built-in function,
  nor check whether the result is validated afterwards.
rule:
  pattern: '@parse_url($$$ARGS)'
