# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-array-search-index-truthiness
language: php
severity: warning
message: >-
  array_search() result is used directly as a truthiness condition; index 0 is
  a valid match but evaluates as false. Compare with false using a strict
  check.
note: >-
  Single-file syntactic match on a bare array_search() call used directly as
  an if condition. Does not resolve types, aliasing, or whether the result is
  stored in a variable first.
rule:
  pattern: 'if ( array_search($$$ARGS) ) { $$$BODY }'
