# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-http-vars-legacy-superglobal
language: php
severity: warning
message: >-
  Legacy HTTP_*_VARS arrays were removed in PHP 5.4; use the modern
  superglobals such as _GET, _POST, _COOKIE, _SERVER, _ENV or _SESSION
  instead.
note: >-
  Matches the literal variable name syntactically; it does not distinguish
  reads from writes or detect user-defined variables of the same name.
rule:
  kind: variable_name
  regex: '^\$?HTTP_(GET|POST|COOKIE|SERVER|ENV|SESSION)_VARS$'
