id: php-secret-compare-not-hash-equals
language: php
severity: warning
message: >-
  A request-supplied secret such as a token, signature or API key is compared with
  an equality operator. String comparison returns as soon as it finds a differing
  byte, which leaks the correct prefix through response timing, and the loose form
  also type-juggles. Compare with hash_equals, which is constant time.
note: >-
  Matches an equality or inequality comparison where one side is a superglobal
  subscript whose key names a secret, matching token, secret, signature, sig,
  hmac, api key, auth, password or nonce. Strict comparison is included on
  purpose because it is still timing-variable. A comparison against a string
  literal is excluded: with no secret on the other side there is nothing to
  recover byte by byte. It cannot tell how many requests
  an attacker can make, so a value compared once behind strict rate limiting is
  the routine dismissal; php-hash-loose-compare covers the hash-function shapes.
utils:
  secret-request-value:
    kind: subscript_expression
    all:
      - has:
          nthChild: 1
          kind: variable_name
          regex: '^\$_(GET|POST|REQUEST|COOKIE|SERVER|HEADERS)$'
      - has:
          nthChild: 2
          any:
            - kind: string
            - kind: encapsed_string
          regex: '(?i)(token|secret|signature|_sig|hmac|api[_-]?key|apikey|auth|passw|nonce|license)'
rule:
  kind: binary_expression
  all:
    - has:
        field: operator
        regex: '^(==|===|!=|!==|<>)$'
    - any:
        - all:
            - has: {field: left, matches: secret-request-value}
            - not: {has: {field: right, kind: string}}
            - not: {has: {field: right, kind: encapsed_string}}
        - all:
            - has: {field: right, matches: secret-request-value}
            - not: {has: {field: left, kind: string}}
            - not: {has: {field: left, kind: encapsed_string}}
