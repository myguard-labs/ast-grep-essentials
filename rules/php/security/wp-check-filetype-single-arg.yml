id: wp-check-filetype-single-arg
language: php
severity: warning
message: >-
  wp_check_filetype() is called with only one argument, so the default
  mime-type map and any custom types are ignored.
note: >-
  Syntactic single-file match on a literal wp_check_filetype call with exactly
  one argument. It does not resolve whether the function is the WordPress core
  function, nor whether a filter or other caller supplies the mime map.
rule:
  pattern: 'wp_check_filetype($ARG)'
