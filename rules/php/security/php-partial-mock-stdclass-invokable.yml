id: php-partial-mock-stdclass-invokable
language: php
severity: warning
message: >-
  createPartialMock() is given 'stdClass' as the class to mock; stdClass has
  no __invoke method, so use a dedicated class instead.
note: >-
  Matches the literal string 'stdClass' passed as the first argument of a
  createPartialMock call. It does not resolve receivers, imports, or runtime
  class identity.
rule:
  pattern: '$THIS->createPartialMock(''stdClass'', $$$ARGS)'
