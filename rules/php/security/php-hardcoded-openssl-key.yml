id: php-hardcoded-openssl-key
language: php
severity: warning
message: >-
  openssl_encrypt or openssl_decrypt is called with a string literal as the
  key. Load keys from a secret store or the environment, or derive them with
  a key derivation function.
note: >-
  [CWE-321] [OWASP A02:2021] A key embedded in source is exposed to
  everyone with the code. This is a syntactic check: the third argument is a
  plain single-quoted or double-quoted string without variable interpolation.
  Keys from variables, constants or function calls are not matched.
rule:
  kind: function_call_expression
  all:
    - has:
        field: function
        any:
          - kind: name
          - kind: qualified_name
        regex: '^\\?openssl_(encrypt|decrypt)$'
    - has:
        field: arguments
        has:
          kind: argument
          nthChild:
            position: 3
            ofRule:
              not:
                kind: comment
          has:
            any:
              - kind: string
              - kind: encapsed_string
                not:
                  has:
                    kind: variable_name
                    stopBy: end
