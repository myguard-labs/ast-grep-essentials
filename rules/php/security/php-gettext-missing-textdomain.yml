# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-gettext-missing-textdomain
language: php
severity: warning
message: >-
  This gettext call has a single string argument and no text domain; pass the
  theme or plugin text domain as the second argument.
note: >-
  Syntactic check only. It matches literal __() or _e() calls whose sole
  argument is one string literal and does not verify the file is theme or
  plugin code, resolve the active text domain, or check aliased gettext
  functions.
rule:
  pattern: '__( $STR )'
