id: php-html-id-from-class-arg
language: php
severity: warning
message: >-
  A value named like a class argument is concatenated into an id attribute;
  check whether class was intended.
note: >-
  Matches only a literal single-quoted string fragment ending in id="
  concatenated with a subscript whose key contains class. It does not resolve
  variable names, types, or runtime values, and does not check other markup
  builders.
rule:
  pattern: '''<div id="'' . $ARR[''menu_class''] . ''">'''
