id: wp-http-empty-body-check-drops-zero
language: php
severity: warning
message: >-
  empty() on a body variable treats the string "0" as absent and drops the
  payload; check for absence explicitly instead.
note: >-
  Single-file syntactic match on a literal empty($body) call. It does not
  resolve types, aliasing, or whether $body can actually hold "0" at runtime.
rule:
  pattern: 'empty($body)'
