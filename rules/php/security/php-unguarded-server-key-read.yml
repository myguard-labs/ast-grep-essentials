id: php-unguarded-server-key-read
language: php
severity: warning
message: >-
  Server superglobal key is read as a function argument without an isset()
  guard in the same expression.
note: >-
  Syntactic only; does not track guards in earlier statements, key identity,
  or runtime presence of the key.
rule:
  all:
    - kind: subscript_expression
    - has:
        kind: variable_name
        regex: '^\$_SERVER$'
    - inside:
        kind: argument
    - not:
        inside:
          kind: conditional_expression
          stopBy: end
          has:
            kind: function_call_expression
            regex: '^isset\s*\('
            stopBy: end
