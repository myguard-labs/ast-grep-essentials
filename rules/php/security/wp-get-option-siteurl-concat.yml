id: wp-get-option-siteurl-concat
language: php
severity: warning
message: >-
  get_option('siteurl') is concatenated into a hand-built URL path; consider
  site_url() instead.
note: >-
  Single-file syntactic match on a literal get_option('siteurl') call as the
  left operand of a concatenation. It does not resolve function identity,
  imports, or runtime values, and does not judge whether the concatenated path
  is actually a URL.
rule:
  pattern: 'get_option(''siteurl'') . $_'
