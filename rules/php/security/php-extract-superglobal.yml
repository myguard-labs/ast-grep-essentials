id: php-extract-superglobal
language: php
severity: warning
message: >-
  extract() on a superglobal ($_GET/$_POST/$_REQUEST/$_COOKIE/$_SERVER) — lets a request
  overwrite arbitrary local variables (including flags that gate auth/logic).
  Read the specific keys you need explicitly; never bulk-extract request data.
note: >-
  Fires only when a superglobal is the extract source. extract() on a curated
  local array is lower risk but still discouraged.
rule:
  any:
    - pattern: $FUNC($SOURCE)
    - pattern: $FUNC($SOURCE, $$$REST)
constraints:
  FUNC:
    regex: '(?i)^\\?extract$'
  SOURCE:
    any:
      - regex: '^\$_(GET|POST|REQUEST|COOKIE|SERVER)$'
      - has:
          kind: parenthesized_expression
          has:
            kind: variable_name
            regex: '^\$_(GET|POST|REQUEST|COOKIE|SERVER)$'
