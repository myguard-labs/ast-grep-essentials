id: php-attr-interpolated-post-title
language: php
severity: warning
message: >-
  post_title is interpolated into a double-quoted string that builds an HTML
  title attribute without an escaping call.
note: >-
  Syntactic check only. Matches a double-quoted PHP string containing a title
  attribute and a {$...post_title} interpolation; it does not resolve types,
  data flow, or whether escaping happens elsewhere.
rule:
  kind: encapsed_string
  pattern: '"<a title=''{$post->post_title}''>x</a>"'
