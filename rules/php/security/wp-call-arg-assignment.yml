# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-call-arg-assignment
language: php
severity: warning
message: >-
  Assignment inside a call argument list overwrites a variable as a side
  effect; review this call.
note: >-
  Syntactic only. Matches a method call whose argument list directly contains
  an assignment expression. Does not resolve receiver types, function
  identity, or whether the assignment is intentional.
rule:
  kind: argument
  has:
    kind: assignment_expression
    stopBy: end
  inside:
    kind: arguments
    stopBy: end
    inside:
      kind: member_call_expression
