id: php-next-post-link-previous-arrow-default
language: php
severity: warning
message: >-
  Function named with 'next' has a default $format containing the
  previous-arrow entity &laquo;; check the arrow direction.
note: >-
  Single-file syntactic match on a function declaration whose name contains
  'next' and whose default string contains the literal &laquo; entity. It does
  not verify that the function is a WordPress adjacent-post helper or that the
  arrow is wrong for its output.
rule:
  all:
    - kind: function_definition
    - has:
        field: name
        regex: next
    - has:
        kind: string
        regex: '&laquo;'
        stopBy: end
