# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-absint-positive-guard
language: php
severity: warning
message: >-
  This comparison uses absint() before a greater-than-zero check, so negative
  inputs are converted to positive and pass the guard.
note: >-
  Matches the literal syntax absint(X) > 0 in a single file without resolving
  types, dataflow, or whether the argument is user input.
rule:
  pattern: 'absint($X) > 0'
