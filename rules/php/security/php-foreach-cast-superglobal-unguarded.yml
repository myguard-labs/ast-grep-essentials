id: php-foreach-cast-superglobal-unguarded
language: php
severity: warning
message: >-
  foreach iterates an (array) cast of a request superglobal subscript with no
  ?? fallback.
note: >-
  Syntactic only; it does not check for an earlier isset or other guard
  outside the shown foreach.
rule:
  kind: foreach_statement
  has:
    kind: cast_expression
    regex: '^\(\s*array\s*\)'
    has:
      kind: subscript_expression
      regex: '^\$_(POST|GET|REQUEST|COOKIE)\['
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
