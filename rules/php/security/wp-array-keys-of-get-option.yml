id: wp-array-keys-of-get-option
language: php
severity: warning
message: >-
  Array function applied directly to get_option() result without an array
  guard.
note: >-
  Syntactic match only; does not verify the option type at runtime or detect
  guards elsewhere in the file.
rule:
  pattern: 'array_keys(get_option($$$ARGS))'
