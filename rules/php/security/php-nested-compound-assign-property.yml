id: php-nested-compound-assign-property
language: php
severity: warning
message: >-
  Compound assignment to a property is used as the value of another
  assignment; review the hidden side effect.
note: >-
  Syntactic match only. Matches a literal property receiver with a compound .=
  assignment nested as the right-hand value of an assignment; it does not
  resolve types, aliasing, or whether the side effect is intended.
rule:
  kind: assignment_expression
  pattern: '$VAR = $OBJ->$PROP .= $VALUE'
