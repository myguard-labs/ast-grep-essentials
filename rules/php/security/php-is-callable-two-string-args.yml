id: php-is-callable-two-string-args
language: php
severity: warning
message: >-
  is_callable() receives two string arguments; the second string is read as
  the syntax_only flag, not as a method name.
note: >-
  Syntactic check only. Matches a direct is_callable call whose first two
  arguments are both string literals; it does not resolve classes, methods, or
  runtime values.
rule:
  pattern: 'is_callable($C, $D)'
  kind: function_call_expression
  has:
    field: arguments
    kind: arguments
    has:
      kind: argument
      pattern: '$C'
