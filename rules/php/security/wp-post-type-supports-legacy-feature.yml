id: wp-post-type-supports-legacy-feature
language: php
severity: warning
message: >-
  post_type_supports() is called with a feature name that is not a registered
  support key, so the check always returns false.
note: >-
  Matches only the literal feature-name strings 'excerpts' and
  'post-thumbnails' in a direct post_type_supports() call. It does not resolve
  the function, runtime values, or registered feature keys.
rule:
  pattern: 'post_type_supports($_, ''excerpts'')'
