id: wp-wpdb-escape-deprecated-call
language: php
severity: warning
message: >-
  Avoid the deprecated $wpdb->escape(); use $wpdb->prepare() or esc_sql()
  instead.
note: >-
  Matches the literal receiver syntax $wpdb->escape with one argument; it does
  not resolve types, aliases, or whether $wpdb is the WordPress wpdb instance.
rule:
  pattern: '$wpdb->escape($ARG)'
