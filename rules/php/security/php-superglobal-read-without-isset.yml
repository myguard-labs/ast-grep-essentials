id: php-superglobal-read-without-isset
language: php
severity: warning
message: >-
  Superglobal element is compared without an isset() or array_key_exists()
  check in the same expression.
note: >-
  Syntactic only; it does not verify that an enclosing isset() guards the same
  key, or any guard outside the enclosing expression.
rule:
  all:
    - kind: binary_expression
    - regex: '(==|!=)'
    - has:
        kind: subscript_expression
        regex: '^\$_(GET|POST)\['
    - not:
        inside:
          stopBy: end
          kind: binary_expression
          regex: 'isset\s*\(|array_key_exists\s*\('
