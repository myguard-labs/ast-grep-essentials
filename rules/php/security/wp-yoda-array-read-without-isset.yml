id: wp-yoda-array-read-without-isset
language: php
severity: warning
message: >-
  String literal compared with == against an array subscript read; confirm the
  key is guaranteed to exist or guard it with isset.
note: >-
  Syntactic single-file match only. It flags a literal-on-left == comparison
  with a subscript read inside an if condition and cannot prove the key is
  absent or present at runtime, nor resolve aliases or types.
rule:
  pattern: '''publish'' == $C[$K]'
  inside:
    kind: if_statement
    stopBy: end
    not:
      has:
        pattern: 'isset( $C[$K] )'
        stopBy: end
