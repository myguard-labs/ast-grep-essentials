id: php-assign-literal-in-or-condition
language: php
severity: warning
message: >-
  Assignment inside a boolean || chain of literal comparisons; use == or a
  switch if a comparison was intended.
note: >-
  Purely syntactic match on an assignment_expression whose right-hand side is
  a binary || expression with a string literal operand, inside an if
  condition. It does not resolve types, values, or runtime behaviour.
rule:
  all:
    - kind: assignment_expression
    - has:
        kind: binary_expression
        pattern: '$A || $B'
        stopBy: end
    - inside:
        kind: if_statement
        stopBy: end
