id: php-savequeries-bare-constant
language: php
severity: warning
message: >-
  SAVEQUERIES is read as a bare constant in a condition without a
  defined('SAVEQUERIES') guard; the constant may be undefined.
note: >-
  Syntactic check only. It matches a bare SAVEQUERIES name used as a whole
  if-condition and does not resolve whether the constant is defined at runtime
  or track guards elsewhere in the file.
rule:
  pattern: 'if (SAVEQUERIES) { $$$BODY }'
