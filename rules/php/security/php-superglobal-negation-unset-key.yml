id: php-superglobal-negation-unset-key
language: php
severity: warning
message: >-
  Unary not applied directly to a subscripted SERVER superglobal entry may
  raise an undefined-index notice when the key is absent. Consider isset() or
  empty().
note: >-
  Matches only the literal syntax of a negated subscript on the SERVER
  superglobal; it cannot tell whether the key is actually unset at runtime,
  and other superglobals are not covered.
rule:
  kind: unary_op_expression
  regex: '^!\s*\$_SERVER\s*\['
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
