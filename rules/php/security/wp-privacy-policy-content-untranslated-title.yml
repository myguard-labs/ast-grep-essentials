id: wp-privacy-policy-content-untranslated-title
language: php
severity: warning
message: >-
  The privacy policy section title passed to wp_add_privacy_policy_content()
  is a bare string literal and will not be translated.
note: >-
  Matches only a direct wp_add_privacy_policy_content call whose first
  argument is a literal string node. It does not resolve the function
  namespace, imports, or runtime values, and it does not inspect the content
  argument.
rule:
  pattern: 'wp_add_privacy_policy_content(''$LIT'', $$$ARGS)'
