id: wp-gettext-singular-with-plural-args
language: php
severity: warning
message: >-
  __() is called with three arguments; the extra plural-form argument is not
  handled by the singular gettext function.
note: >-
  Syntactic single-file match on a bare __() call with exactly three
  arguments. It does not verify the WordPress function context, the plural
  string content, or whether a text domain is intended.
rule:
  pattern: '__($A, $B, $C)'
