id: wp-truthy-post-superglobal-request-check
language: php
severity: warning
message: >-
  Bare POST superglobal used as a truth value to detect form submission; check
  REQUEST_METHOD instead.
note: >-
  Matches only the literal bare POST superglobal as the whole if condition. It
  does not resolve aliases or runtime values.
rule:
  kind: parenthesized_expression
  regex: '^\(\s*\$_POST\s*\)$'
  inside:
    kind: if_statement
    field: condition
