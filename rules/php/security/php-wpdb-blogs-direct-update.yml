id: php-wpdb-blogs-direct-update
language: php
severity: warning
message: >-
  Direct $wpdb->update() on the blogs table bypasses update_blog_details();
  use the blog-details API instead.
note: >-
  Single-file syntactic match on a literal $wpdb->blogs table argument in a
  $wpdb->update() call. It does not resolve receiver identity, imports, or
  whether a wrapper already handles cache and hooks.
rule:
  pattern: '$WPDB->update($wpdb->blogs, $$$ARGS)'
