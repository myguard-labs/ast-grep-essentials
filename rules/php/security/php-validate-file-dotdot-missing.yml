id: php-validate-file-dotdot-missing
language: php
severity: warning
message: >-
  This file validator checks for './' but does not reject '..'
  parent-directory segments.
note: >-
  Syntactic single-file match on a literal strpos call with the './' needle
  inside an if condition whose body returns; it does not verify that the
  function is a path validator, that the value reaches a file operation, or
  that no other '..' check exists elsewhere.
rule:
  all:
    - pattern: 'strpos($FILE, ''./'')'
    - inside:
        kind: if_statement
        stopBy: end
    - not:
        inside:
          kind: function_definition
          stopBy: end
          has:
            pattern: 'strpos($FILE2, ''..'')'
            stopBy: end
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-22'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/22.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A01:2025'
  todo_cases:
    - 'FP (str_contains ''..'' check): function v( $f ) { if ( str_contains( $f, ''..'' ) || strpos( $f, ''./'' ) !== false ) { return 1; } } is still matched; only strpos ''..'' counts as the parent-directory check.'
    - 'FP (class method with ''..'' check): a method_declaration holding strpos( $f, ''..'' ) and strpos( $f, ''./'' ) is still matched; the exclusion only scans function_definition.'
    - 'FN (double-quoted needle): if ( strpos( $f, "./" ) !== false ) { return 1; } is not matched because the pattern needs a single-quoted ''./'' literal.'
