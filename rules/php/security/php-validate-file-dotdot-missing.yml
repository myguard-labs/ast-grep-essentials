id: php-validate-file-dotdot-missing
language: php
severity: warning
message: >-
  This file validator checks for './' but does not reject '..'
  parent-directory segments.
note: >-
  Syntactic single-file match on a literal strpos call with the './' needle
  inside an if condition whose body returns; it does not verify that the
  function is a path validator, that the value reaches a file operation, or
  that no other '..' check exists elsewhere.
rule:
  all:
    - pattern: 'strpos($FILE, ''./'')'
    - inside:
        kind: if_statement
        stopBy: end
    - not:
        inside:
          kind: function_definition
          stopBy: end
          has:
            pattern: 'strpos($FILE2, ''..'')'
            stopBy: end
