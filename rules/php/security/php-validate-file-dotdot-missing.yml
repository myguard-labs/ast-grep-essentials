id: php-validate-file-dotdot-missing
language: php
severity: warning
message: >-
  This file validator checks for './' but does not reject '..'
  parent-directory segments.
note: >-
  Syntactic single-file match on a literal strpos call with the './' needle
  inside an if condition whose body returns; it does not verify that the
  function is a path validator, that the value reaches a file operation, or
  that no other '..' check exists elsewhere. The '..' check may be a
  strpos, stripos or str_contains call anywhere in the enclosing function,
  method or closure; it is not tied to the same variable.
rule:
  all:
    - pattern: 'strpos($FILE, ''./'')'
    - inside:
        kind: if_statement
        stopBy: end
    - not:
        inside:
          any:
            - kind: function_definition
            - kind: method_declaration
            - kind: anonymous_function
            - kind: arrow_function
          stopBy: end
          has:
            any:
              - pattern: 'strpos($FILE2, ''..'')'
              - pattern: 'strpos($FILE2, "..")'
              - pattern: 'stripos($FILE2, ''..'')'
              - pattern: 'stripos($FILE2, "..")'
              - pattern: 'str_contains($FILE2, ''..'')'
              - pattern: 'str_contains($FILE2, "..")'
            stopBy: end
