id: wp-apply-filter-bypasses-accessor
language: php
severity: warning
message: >-
  This applies the intermediate_image_sizes filter with a hardcoded default
  list; call get_intermediate_image_sizes() instead so registered custom sizes
  are included.
note: >-
  Matches only the literal hook name 'intermediate_image_sizes' passed to a
  direct apply_filters call. It does not resolve whether the hook is wrapped,
  aliased, or whether the default list is intended.
rule:
  pattern: 'apply_filters( ''intermediate_image_sizes'', $_ )'
