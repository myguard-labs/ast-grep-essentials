id: php-int-division-literal-count-arg
language: php
severity: warning
message: >-
  Integer literal division inside the count argument of array_fill() yields a
  float; use intdiv() instead.
note: >-
  Syntactic only. Matches a parenthesized literal-by-literal `/` expression
  anywhere inside the second argument of a direct array_fill() call; it does
  not resolve types, imports, or runtime values, and it does not check other
  int-typed builtins.
rule:
  pattern: 'array_fill($A, $$$BEFORE, ($B / $C) + $D, $$$AFTER)'
