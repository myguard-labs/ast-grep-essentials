# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-roles-hardcoded-index
language: php
severity: warning
message: >-
  Avoid reading the first role with a hard-coded [0] index on a roles
  property; role arrays may be keyed by role name.
note: >-
  Matches the literal syntax of a ->roles property subscripted with [0] only.
  It does not verify the value is a WP_User roles array, resolve types or
  aliases, or check whether key 0 exists at runtime.
rule:
  pattern: '$X->roles[0]'
