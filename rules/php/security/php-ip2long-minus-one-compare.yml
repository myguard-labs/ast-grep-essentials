id: php-ip2long-minus-one-compare
language: php
severity: warning
message: >-
  Comparing ip2long() output with -1 misses the false return used for invalid
  addresses; check for false instead.
note: >-
  Syntactic match on a literal ip2long($...) call compared strictly with -1.
  It does not resolve the function identity, imports, or PHP version, and does
  not check whether the result is used safely elsewhere.
rule:
  kind: binary_expression
  all:
    - has:
        pattern: 'ip2long($ARG)'
        stopBy: end
    - pattern: 'ip2long($ARG) === -1'
