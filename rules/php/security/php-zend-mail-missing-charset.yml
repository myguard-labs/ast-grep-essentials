id: php-zend-mail-missing-charset
language: php
severity: warning
message: >-
  This new Zend_Mail() call passes no charset argument, so the message body
  may not be encoded as UTF-8.
note: >-
  Matches only the literal bare constructor syntax new Zend_Mail() with no
  arguments; it does not resolve types, imports, aliases, or whether a charset
  is set later on the object.
rule:
  pattern: 'new Zend_Mail()'
