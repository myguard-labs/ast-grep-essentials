id: wp-redirect-raw-http-referer
language: php
severity: warning
message: >-
  wp_redirect() is called with the raw HTTP_REFERER server value, which is
  client-controlled and enables an open redirect. Use wp_get_referer()
  instead.
note: >-
  Matches only the literal superglobal HTTP_REFERER subscript as the first
  argument; it does not track aliased variables or sanitization elsewhere.
rule:
  all:
    - pattern: 'wp_redirect($$$ARGS)'
    - has:
        kind: arguments
        has:
          kind: argument
          nthChild: 1
          regex: '^\$_SERVER\[[''"]HTTP_REFERER[''"]\]$'
