id: wp-bloginfo-concat-echo
language: php
severity: warning
message: >-
  bloginfo() echoes its value and returns nothing; using it as a concatenation
  operand yields a null operand and prints output out of order.
note: >-
  Single-file syntactic match on a literal bloginfo( call used as a direct
  operand of the concatenation operator. It does not resolve function
  identity, namespaces, or whether bloginfo is redefined elsewhere.
rule:
  pattern: '$A . bloginfo($$$ARGS)'
