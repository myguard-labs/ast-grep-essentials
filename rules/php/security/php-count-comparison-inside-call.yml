id: php-count-comparison-inside-call
language: php
severity: warning
message: >-
  count() is called with a comparison expression as its argument; the
  comparison should be applied to the count result instead.
note: >-
  Purely syntactic check on the literal call shape count(<comparison>). It
  does not resolve count() identity, imports, or runtime types, and it does
  not verify the surrounding guard logic.
rule:
  pattern: 'count($A <= $B)'
