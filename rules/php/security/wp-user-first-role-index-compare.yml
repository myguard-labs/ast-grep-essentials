id: wp-user-first-role-index-compare
language: php
severity: warning
message: >-
  Comparing the first element of a roles array only checks one role; check
  capabilities or iterate all roles instead.
note: >-
  Syntactic match on a literal ->roles[0] comparison with ==. It does not
  resolve types or confirm the object is a WP_User, and it does not track
  aliases or reassignments.
rule:
  pattern: '$X->roles[0] == $ROLE'
