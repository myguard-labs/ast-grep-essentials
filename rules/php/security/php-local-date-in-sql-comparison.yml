id: php-local-date-in-sql-comparison
language: php
severity: warning
message: >-
  date() result is concatenated into an SQL string passed to a $wpdb query
  method; date() uses the server timezone, so compare with gmdate() for GMT
  columns.
note: >-
  Syntactic match only. Detects a literal date(...) call inside a binary
  concatenation within a $wpdb method call argument; it does not verify the
  column type, the timezone configuration, or the runtime value.
rule:
  pattern: '$wpdb->get_results($$$ARGS)'
  has:
    pattern: 'date($$$D)'
    stopBy: end
