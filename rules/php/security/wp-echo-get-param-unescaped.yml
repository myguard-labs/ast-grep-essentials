# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-echo-get-param-unescaped
language: php
severity: warning
message: >-
  Echoing a request GET value through concatenation without an escaping call
  can cause reflected XSS.
note: >-
  Syntactic only; matches a GET superglobal subscript used directly as a
  concatenation operand inside an echo statement. It does not check
  sanitization elsewhere or aliasing.
rule:
  kind: subscript_expression
  regex: '^\$_GET\['
  inside:
    kind: binary_expression
    inside:
      kind: echo_statement
      stopBy: end
