id: php-map-deep-str-replace-unguarded
language: php
severity: warning
message: >-
  str_replace() is called inside a map_deep() callback without an is_string()
  guard; non-string leaves may reach a string function.
note: >-
  Syntactic match only. It looks for a map_deep() call whose closure body
  contains a str_replace() call and no is_string() check in the same closure.
  It does not resolve types, aliases, or whether the callback is reached with
  non-string values at runtime.
rule:
  all:
    - pattern: 'map_deep($$$ARGS)'
    - has:
        pattern: 'str_replace($$$STR_ARGS)'
        stopBy: end
    - not:
        has:
          pattern: 'is_string($$$CHECK_ARGS)'
          stopBy: end
