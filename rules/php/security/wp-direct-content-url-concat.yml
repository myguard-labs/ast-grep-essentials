id: wp-direct-content-url-concat
language: php
severity: warning
message: >-
  Build content URLs with content_url( $path ) instead of concatenating
  WP_CONTENT_URL with a path.
note: >-
  Purely syntactic check for a literal WP_CONTENT_URL constant as a direct
  operand of a binary concatenation. It does not resolve constants, filters,
  or runtime values.
rule:
  pattern: '$A . WP_CONTENT_URL . $B'
