# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-preg-unescaped-dot-before-extension
language: php
severity: warning
message: >-
  preg_match pattern has an unescaped dot before a file extension; the dot
  matches any character.
note: >-
  Checks only literal string text inside a preg_match call for a dot not
  preceded by a backslash before "php"; it does not resolve variables,
  concatenation, argument position, or regex context such as character
  classes.
rule:
  all:
    - kind: string
    - regex: '(^|[^\\])\.php'
    - inside:
        pattern: 'preg_match($$$ARGS)'
        stopBy: end
