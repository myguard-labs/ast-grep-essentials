id: php-strpos-bare-truthy-condition
language: php
severity: warning
message: >-
  strpos() used as a bare truthy condition; a match at offset 0 is treated as
  no match. Compare with !== false instead.
note: >-
  Syntactic match only. Flags an if condition whose whole expression is a
  strpos() call with no comparison. It does not check the function's
  namespace, resolve aliases, or verify the result is used as a presence test.
rule:
  pattern: 'if (strpos($$$ARGS)) $$$BODY'
