id: wp-negated-did-action-init-user-load
language: php
severity: warning
message: >-
  This negated did_action('init') guard wraps a wp_get_current_user() call;
  review whether the user refresh runs before init has fired.
note: >-
  Syntactic single-block check only. It matches a literal negated
  did_action('init') if-condition enclosing a wp_get_current_user() call in
  the same block; it does not resolve function identity, control flow beyond
  the block, or runtime hook timing.
rule:
  pattern: |
    if ( ! did_action('init') ) {
      $$$BODY
    }
  has:
    pattern: 'wp_get_current_user()'
    stopBy: end
