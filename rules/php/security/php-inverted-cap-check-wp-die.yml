id: php-inverted-cap-check-wp-die
language: php
severity: warning
message: >-
  A positive current_user_can() check directly guards wp_die(), which may deny
  access to users who hold the capability. Review whether the check is
  inverted.
note: >-
  Purely syntactic single-statement match on a bare current_user_can() if
  condition whose body calls wp_die(). It does not resolve capabilities,
  roles, or runtime user state, and some legitimate uses may need manual
  review.
rule:
  all:
    - pattern: |
        if ( current_user_can( $CAP ) ) { wp_die( $$$ARGS ); }
    - not:
        pattern: |
          if ( ! current_user_can( $CAP ) ) { wp_die( $$$ARGS ); }
