# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-useragent-phpversion-disclosure
language: php
severity: warning
message: >-
  A phpversion() call is concatenated into a User-Agent header string,
  disclosing the PHP version to remote hosts.
note: >-
  Matches only a literal string containing User-Agent that is concatenated
  with a direct phpversion() call in the same expression. It does not prove
  the string is sent in an outbound request and does not track values through
  variables or helper functions.
rule:
  all:
    - pattern: '"User-Agent: WordPress PHP/" . phpversion()'
