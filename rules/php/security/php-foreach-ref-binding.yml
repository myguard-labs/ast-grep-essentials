id: php-foreach-ref-binding
language: php
severity: warning
message: >-
  This foreach binds its value variable by reference; the variable stays
  aliased to the last array element after the loop.
note: >-
  Syntactic match only. Matches a foreach whose value binding is written as a
  reference (&$var) in the loop header; it does not check whether the variable
  is reused later or whether the alias is ever unset.
rule:
  kind: foreach_statement
  has:
    kind: by_ref
    pattern: '&$VAR'
    stopBy: end
