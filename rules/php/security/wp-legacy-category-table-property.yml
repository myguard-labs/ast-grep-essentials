id: wp-legacy-category-table-property
language: php
severity: warning
message: >-
  Read of a legacy WordPress category table property; these tables are absent
  from current schemas.
note: >-
  Matches the literal property access $wpdb->categories, $wpdb->post2cat or
  $wpdb->link2cat by syntax only; it does not resolve the receiver's type or
  check whether the code runs in an upgrade routine, so exclusion of upgrade
  files is left to the harness.
rule:
  kind: member_access_expression
  all:
    - has:
        field: object
        pattern: '$wpdb'
    - has:
        field: name
        regex: '^(categories|post2cat|link2cat)$'
