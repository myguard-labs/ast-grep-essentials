id: wp-img-alt-attr-unescaped-interpolation
language: php
severity: warning
message: >-
  Interpolated variable placed in an img alt attribute without escaping; wrap
  it in esc_attr().
note: >-
  Syntactic match only. It flags double-quoted PHP strings containing an img
  alt='...' attribute followed by a {$var} interpolation; it does not resolve
  variable types, dataflow, or whether the value is already escaped elsewhere.
rule:
  kind: encapsed_string
  regex: 'alt=''\{\$'
