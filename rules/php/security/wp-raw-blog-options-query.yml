id: wp-raw-blog-options-query
language: php
severity: warning
message: >-
  Raw $wpdb query reads an options table directly; use get_blog_option() or
  get_option() instead.
note: >-
  Matches only a literal $wpdb get_var call whose SQL string text contains the
  word options and option_value. It does not resolve table prefixes, runtime
  SQL values, or whether the call is in multisite code.
rule:
  pattern: '$wpdb->get_var($SQL)'
  has:
    regex: 'option_value.*options'
    stopBy: end
