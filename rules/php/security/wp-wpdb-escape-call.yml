id: wp-wpdb-escape-call
language: php
severity: warning
message: >-
  Direct call to the removed $wpdb->escape() method; use $wpdb->prepare() with
  placeholders instead.
note: >-
  Matches the literal receiver syntax $wpdb->escape(...) in a single file
  without resolving types, aliases, or whether the object is actually a
  WordPress wpdb instance.
rule:
  pattern: '$wpdb->escape($$$ARGS)'
