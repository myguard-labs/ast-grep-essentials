id: php-by-ref-array-func-on-call-result
language: php
severity: warning
message: >-
  A by-reference array function is called on a call result; assign the result
  to a variable first.
note: >-
  Syntactic check only. Matches a literal array_pop call whose single argument
  is a method call on a variable. It does not verify that the function is a
  by-reference array function at runtime, nor resolve namespaces or aliases.
rule:
  pattern: 'array_pop( $OBJ->$METHOD($$$ARGS) )'
