id: php-ob-gzhandler-output-buffer
language: php
severity: warning
message: >-
  ob_start() is called with the ob_gzhandler callback, which enables
  application-level gzip output buffering; review whether the web server or
  proxy should handle compression instead.
note: >-
  Purely syntactic match on a direct ob_start call whose first argument is the
  single-quoted or double-quoted literal 'ob_gzhandler'. It does not resolve
  function identity, namespaces, runtime configuration, or whether
  server-level encoding is also active.
rule:
  pattern: 'ob_start(''ob_gzhandler'')'
