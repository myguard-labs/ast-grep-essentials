id: wp-did-action-extra-argument
language: php
severity: warning
message: >-
  did_action() takes only the hook name; the extra argument is ignored. Review
  this call.
note: >-
  Matches a literal did_action call with two or more arguments by syntax only.
  It does not resolve whether did_action refers to the WordPress function, and
  it does not check runtime argument values or other files.
rule:
  pattern: 'did_action($HOOK, $$$REST)'
