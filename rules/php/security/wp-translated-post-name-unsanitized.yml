id: wp-translated-post-name-unsanitized
language: php
severity: warning
message: >-
  Translated string assigned to 'post_name' without sanitize_title() wrapping
  it.
note: >-
  Single-file syntactic check for a literal 'post_name' array key whose value
  is a direct _x(), __() or _e() call. It does not resolve imports, types, or
  runtime values, and does not verify that the translated string is sanitized
  elsewhere.
rule:
  kind: array_element_initializer
  all:
    - has:
        kind: string
        regex: '^[''"]post_name[''"]$'
    - has:
        kind: function_call_expression
        pattern: '_x($$$ARGS)'
