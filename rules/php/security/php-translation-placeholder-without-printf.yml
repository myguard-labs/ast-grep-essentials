id: php-translation-placeholder-without-printf
language: php
severity: warning
message: >-
  Translated string contains a %s placeholder but is output directly by _e()
  without printf or sprintf.
note: >-
  Syntactic check only. Matches a direct _e() call whose first argument is a
  single-quoted literal containing %s; it does not resolve function aliases or
  verify the string is never formatted elsewhere.
rule:
  pattern: '_e(''$$$LIT'')'
  regex: '%s'
