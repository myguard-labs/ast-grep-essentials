id: php-unquoted-array-key-bareword
language: php
severity: warning
message: 'Array subscript uses an unquoted bare name as its key; quote it as a string.'
note: >-
  Syntactic match only; it does not check whether the bare name is a defined
  constant or whether the array is a request superglobal.
rule:
  kind: subscript_expression
  has:
    kind: name
