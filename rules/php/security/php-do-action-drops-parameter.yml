id: php-do-action-drops-parameter
language: php
severity: warning
message: >-
  This function declares a parameter but its do_action() call passes only the
  hook name, so listeners never receive it.
note: >-
  Single-file syntactic check only. It matches a do_action call with a single
  string-literal hook name and does not verify that the enclosing function
  declares a parameter or that listeners expect one.
rule:
  pattern: 'do_action($HOOK)'
  inside:
    kind: function_definition
    stopBy: end
  has:
    kind: string
    stopBy: end
