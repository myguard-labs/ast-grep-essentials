# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-leftover-var-dump
language: php
severity: warning
message: 'Leftover var_dump() call leaves debug output in code.'
note: >-
  Matches literal var_dump or var_Dump calls by syntax only; does not verify
  runtime reachability or whether output reaches production.
rule:
  pattern: 'var_dump($$$ARGS)'
