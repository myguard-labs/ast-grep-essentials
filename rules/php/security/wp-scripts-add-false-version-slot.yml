id: wp-scripts-add-false-version-slot
language: php
severity: warning
message: >-
  A five-argument add() call passes literal false as the fourth argument,
  placing a version value in the args slot.
note: >-
  Purely syntactic match on a literal receiver and method name add with five
  arguments whose fourth argument is literal false. It does not verify that
  the receiver is WP_Scripts or resolve types, aliases, or imports.
rule:
  pattern: '$RECV->add($A, $B, $C, false, $E)'
