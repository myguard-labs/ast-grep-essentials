# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-server-https-lowercase-key
language: php
severity: warning
message: >-
  The server superglobal is indexed with lowercase 'https'; the server
  variable key is 'HTTPS'.
note: >-
  Matches only the literal superglobal subscript text with a lowercase https
  key; does not resolve aliasing or whether the key is set elsewhere.
rule:
  kind: subscript_expression
  regex: '^\$_SERVER\[\s*[''"]https[''"]\s*\]$'
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
