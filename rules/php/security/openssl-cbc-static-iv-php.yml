id: openssl-cbc-static-iv-php
language: php
severity: warning
message: >-
  Static IV used with AES in CBC mode. Static IVs enable chosen-plaintext
  attacks against encrypted data.
note: >-
  [CWE-329] Generation of Predictable IV with CBC Mode.
  [REFERENCES]
      - https://csrc.nist.gov/publications/detail/sp/800-38a/final
ast-grep-essentials: true
utils:
  Match_pattern_directly_with_prefix_openssl_encryptpart2:
    kind: function_call_expression
    all:
      - has:
            kind: name
            regex: ^(openssl_decrypt|openssl_encrypt)$
      - has:
            stopBy: end
            kind: arguments
            all:
              - has:
                  stopBy: end
                  kind: argument
                  nthChild:
                    position: 2
                    ofRule:
                       not:
                          kind: comment
                  has:
                   stopBy: end
                   kind: encapsed_string
                   regex: ".*-CBC"
              - has:
                  stopBy: end
                  kind: argument
                  nthChild:
                    position: 5
                    ofRule:
                       not:
                          kind: comment
                  has:
                   stopBy: end
                   kind: encapsed_string
      - any:
        - follows:
           stopBy: end
           kind: expression_statement
           has:
            stopBy: end
            kind: assignment_expression
            all:
            - has:
               stopBy: end
               kind: variable_name
               pattern: $T
            - has:
               stopBy: end
               kind: encapsed_string
        - inside:
             stopBy: end
             follows:
              stopBy: end
              kind: expression_statement
              has:
               stopBy: end
               kind: assignment_expression
               all:
               - has:
                  stopBy: end
                  kind: variable_name
                  pattern: $T
               - has:
                  stopBy: end
                  kind: encapsed_string
      - not:
           inside:
              stopBy: end
              kind: conditional_expression

