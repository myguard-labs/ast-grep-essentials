id: wp-hardcoded-plugins-path
language: php
severity: warning
message: >-
  Hardcoded 'wp-content/plugins/' path after ABSPATH; use the PLUGINDIR
  constant instead.
note: >-
  Matches only the literal concatenation ABSPATH . 'wp-content/plugins/'
  syntactically; it does not resolve constants, imports, or runtime values.
rule:
  pattern: 'ABSPATH . ''wp-content/plugins/'' . $PLUGIN'
