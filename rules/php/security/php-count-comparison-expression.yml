# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-count-comparison-expression
language: php
severity: warning
message: >-
  count() is given a comparison expression as its argument; the comparison
  runs inside the call instead of on the count.
note: >-
  Syntactic check only. Matches a count() call whose single argument is a
  binary comparison (>, <, >=, <=, ==, !=, ===, !==) written literally in the
  call. Does not resolve types or confirm the argument is an array.
rule:
  pattern: 'count($A > $B)'
