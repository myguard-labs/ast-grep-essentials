id: wp-is-writeable-deprecated-alias
language: php
severity: warning
message: >-
  Replace the misspelled is_writeable() alias with the canonical
  is_writable().
note: >-
  Matches only a direct, unqualified call spelled is_writeable with any
  arguments. It does not resolve namespaces, aliases, or whether the function
  is defined elsewhere.
rule:
  pattern: 'is_writeable($$$ARGS)'
