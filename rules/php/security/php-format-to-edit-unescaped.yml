id: php-format-to-edit-unescaped
language: php
severity: warning
message: >-
  Value passed through format_to_edit() in an edit-context branch; review
  whether escaping is needed for the output context.
note: >-
  Syntactic match on a direct call to format_to_edit() only; it does not
  resolve function identity, imports, or the output context, so legitimate
  uses may be flagged and need review.
rule:
  pattern: 'format_to_edit($$$ARGS)'
