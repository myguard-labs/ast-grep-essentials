# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-superglobal-index-unguarded
language: php
severity: warning
message: >-
  Superglobal element is read without an isset, empty or null-coalescing
  guard.
note: >-
  Purely syntactic; does not detect guards elsewhere in control flow (e.g. a
  prior isset check in an if condition) and cannot know whether the key is
  always present at runtime. A direct assignment target is a write and is
  not reported, but in a nested write such as $_X['a']['b'] = 1 the inner
  $_X['a'] read still is. Only the left operand of ?? (also inside one pair
  of parentheses) counts as guarded, so the right operand of
  $_X['a'] ?? $_X['b'] is reported.
rule:
  all:
    - kind: subscript_expression
    - regex: '^\$_(ENV|SERVER|GET|POST|COOKIE|REQUEST)\s*\['
    - not:
        inside:
          kind: binary_expression
          regex: '\?\?'
          field: left
    - not:
        inside:
          kind: parenthesized_expression
          inside:
            kind: binary_expression
            regex: '\?\?'
            field: left
    - not:
        inside:
          any:
            - kind: assignment_expression
            - kind: augmented_assignment_expression
          field: left
    - not:
        inside:
          regex: '^(isset|empty)\s*\('
          stopBy: end
metadata:
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
  created_at: '2026-10-18'
