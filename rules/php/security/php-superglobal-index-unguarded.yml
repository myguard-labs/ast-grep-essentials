id: php-superglobal-index-unguarded
language: php
severity: warning
message: >-
  Superglobal element is read without an isset, empty or null-coalescing
  guard.
note: >-
  Purely syntactic; does not detect guards elsewhere in control flow (e.g. a
  prior isset check in an if condition) and cannot know whether the key is
  always present at runtime.
rule:
  all:
    - kind: subscript_expression
    - regex: '^\$_(ENV|SERVER|GET|POST|COOKIE|REQUEST)\s*\['
    - not:
        inside:
          kind: binary_expression
          regex: '\?\?'
    - not:
        inside:
          regex: '^(isset|empty)\s*\('
          stopBy: end
