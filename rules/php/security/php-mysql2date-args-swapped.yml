id: php-mysql2date-args-swapped
language: php
severity: warning
message: >-
  mysql2date() appears to receive its arguments in reversed order; the format
  string should be the first argument.
note: >-
  Matches the literal call shape mysql2date(X, get_option(...)) in a single
  file without resolving function identity, types, or runtime values.
rule:
  pattern: 'mysql2date($DATE, get_option($$$ARGS))'
