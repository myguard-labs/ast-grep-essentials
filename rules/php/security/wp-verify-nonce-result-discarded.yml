id: wp-verify-nonce-result-discarded
language: php
severity: error
message: >-
  The result of a standalone wp_verify_nonce call is discarded. Use its result
  in a condition that rejects a failed nonce check.
note: >-
  Matches expression statements consisting of a wp_verify_nonce call,
  optionally wrapped in parentheses. This is a single-file syntactic check; it
  does not establish request reachability or whether other nonce checks exist.
  Assignments, returns, and conditional uses are excluded.
rule:
  kind: expression_statement
  has:
    kind: function_call_expression
    stopBy:
      not:
        kind: parenthesized_expression
    has:
      field: function
      regex: '(?i)^\\?wp_verify_nonce$'
