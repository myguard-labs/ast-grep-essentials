# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-ngettext-noop-deprecated-alias
language: php
severity: warning
message: 'Call to deprecated __ngettext_noop(); replace it with _n_noop().'
note: >-
  Matches the literal function-name syntax of a direct __ngettext_noop(...)
  call. It does not verify that the call resolves to WordPress core or check
  the function's runtime behavior.
rule:
  pattern: '__ngettext_noop($$$ARGS)'
