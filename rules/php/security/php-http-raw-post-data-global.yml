# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-http-raw-post-data-global
language: php
severity: warning
message: >-
  The HTTP_RAW_POST_DATA global variable was removed in PHP 7; read
  php://input instead.
note: >-
  Matches the literal variable name only; it does not resolve scope, aliasing,
  or whether the variable is the real global.
rule:
  kind: variable_name
  regex: '^\$HTTP_RAW_POST_DATA$'
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
