id: php-bitwise-and-boolean-operands
language: php
severity: warning
message: >-
  Bitwise & is used with a negation operand inside an if condition; check
  whether logical && was intended.
note: >-
  Purely syntactic check. It matches a binary & whose right operand is a
  direct ! negation, inside an if statement, without resolving types, runtime
  values, or whether the operands are booleans.
rule:
  all:
    - kind: binary_expression
      pattern: '$LEFT & !$X'
      inside:
        kind: if_statement
        stopBy: end
