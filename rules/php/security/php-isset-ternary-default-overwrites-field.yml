id: php-isset-ternary-default-overwrites-field
language: php
severity: warning
message: >-
  Assignment defaults an absent input to an empty string through an isset
  ternary, which can overwrite an existing field value.
note: >-
  Syntactic match only. It cannot confirm that the target field already holds
  a value or that the input is absent at runtime; no types, dataflow, or
  aliasing are resolved.
rule:
  pattern: '$A[$B] = isset( $C[$D] ) ? $C[$D] : '''';'
