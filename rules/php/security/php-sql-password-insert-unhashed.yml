# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-sql-password-insert-unhashed
language: php
severity: warning
message: >-
  This SQL INSERT writes user_pass with a bare interpolated variable instead
  of a hash call.
note: >-
  Single-file syntactic check on the literal string text only. It matches
  double-quoted PHP strings containing INSERT INTO users with user_pass and a
  bare quoted $variable in the VALUES clause; it does not resolve types,
  imports, or whether the value is hashed elsewhere.
rule:
  all:
    - kind: encapsed_string
    - regex: >-
        (?i)INSERT\s+INTO\s+users\s*\(.*user_pass.*\)\s*VALUES\s*\(.*'\$[A-Za-z_][A-Za-z0-9_]*'.*\)
    - not:
        regex: '(?i)MD5\s*\('
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-256'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/256.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A06:2025'
  todo_cases:
    - "FN (braced interpolation): \"INSERT INTO users (user_login, user_pass) VALUES ('admin', '{$pw}')\" is not matched."
    - "FN (single-quoted escapes): 'INSERT INTO users (user_login, user_pass) VALUES (\\'admin\\', \\'$pw\\')' is not matched (kind is string, not encapsed_string)."
    - "FP (weak hash only): \"... VALUES ('admin', SHA2('$pw', 256))\" is reported although a hash call is present (only MD5 is excluded)."
