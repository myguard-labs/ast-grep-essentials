id: php-sql-password-insert-unhashed
language: php
severity: warning
message: >-
  This SQL INSERT writes user_pass with a bare interpolated variable instead
  of a hash call.
note: >-
  Single-file syntactic check on the literal string text only. It matches
  double-quoted PHP strings containing INSERT INTO users with user_pass and a
  bare quoted $variable in the VALUES clause; it does not resolve types,
  imports, or whether the value is hashed elsewhere.
rule:
  all:
    - kind: encapsed_string
    - regex: >-
        (?i)INSERT\s+INTO\s+users\s*\(.*user_pass.*\)\s*VALUES\s*\(.*'\$[A-Za-z_][A-Za-z0-9_]*'.*\)
    - not:
        regex: '(?i)MD5\s*\('
