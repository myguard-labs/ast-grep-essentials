id: php-ternary-unguarded-index-read
language: php
severity: warning
message: >-
  Ternary tests an array element and then reads the same element without an
  isset() or array_key_exists() guard.
note: >-
  Single-file syntactic match on a literal variable subscript in a ternary
  condition and true branch. It does not resolve types, aliasing, or whether
  the key can be absent at runtime, and it does not recognise other guard
  forms.
rule:
  pattern: '$ARR[$KEY] ? $ARR[$KEY] : $FALLBACK'
