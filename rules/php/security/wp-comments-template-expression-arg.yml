id: wp-comments-template-expression-arg
language: php
severity: warning
message: >-
  comments_template() is called with a function call result as its template
  argument; pass a template file path instead.
note: >-
  Syntactic single-file check only. It matches a literal comments_template
  call whose first argument is a function call; it does not resolve runtime
  values or confirm the call's return type.
rule:
  pattern: 'comments_template(is_single())'
