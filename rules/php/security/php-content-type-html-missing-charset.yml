id: php-content-type-html-missing-charset
language: php
severity: warning
message: >-
  This header() call sets Content-Type to text/html without a charset
  parameter; add an explicit charset such as utf-8.
note: >-
  Matches only a literal header() argument containing text/html with no
  charset in the same string. It does not inspect runtime values, other header
  calls, ini settings, or meta tags.
rule:
  pattern: 'header(''Content-Type: text/html'')'
