id: wp-manual-main-site-check
language: php
severity: warning
message: >-
  Hand-rolled main-site comparison of site and blog domain plus path; consider
  is_main_site().
note: >-
  Purely syntactic match on the literal concatenated receiver expressions
  $current_site->domain.$current_site->path compared with
  $current_blog->domain.$current_blog->path using ==. It does not resolve
  types, aliases, or whether the values come from the multisite lookup, so it
  may flag equivalent checks written differently.
rule:
  pattern: >-
    $current_site->domain.$current_site->path ==
    $current_blog->domain.$current_blog->path
