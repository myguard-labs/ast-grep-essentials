# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-string-cast-filtered-locale
language: php
severity: warning
message: >-
  A (string) cast on get_locale() hides a possibly filtered non-string value
  before it is used.
note: >-
  Matches the literal syntax of a (string) cast wrapping a direct get_locale()
  call. It does not resolve filter callbacks, runtime return types, or whether
  the value reaches a cache key.
rule:
  pattern: '(string) get_locale()'
