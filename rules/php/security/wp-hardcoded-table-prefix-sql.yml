id: wp-hardcoded-table-prefix-sql
language: php
severity: warning
message: >-
  SQL string uses a hardcoded wp_ table name; use $wpdb->prefix or a $wpdb
  table property instead.
note: >-
  Syntactic single-file match only. It flags PHP string literals whose text
  contains FROM or JOIN followed by a literal wp_ table name; it does not
  resolve $wpdb, table prefixes, or runtime SQL construction.
rule:
  kind: string
  regex: '(?i)\b(FROM|JOIN)\s+wp_[A-Za-z0-9_]+'
