id: php-underscore-translate-call
language: php
severity: warning
message: >-
  Bare _() call found; WordPress translation should use __() with a text
  domain.
note: >-
  Purely syntactic match on the literal call name _ with one string literal
  argument. It does not resolve whether gettext alias _() exists or check text
  domains, imports, or runtime values.
rule:
  pattern: '_($STR)'
  kind: function_call_expression
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
