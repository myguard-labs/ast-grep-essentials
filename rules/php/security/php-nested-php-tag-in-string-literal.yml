# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-nested-php-tag-in-string-literal
language: php
severity: warning
message: >-
  A string literal inside PHP code contains a nested "<?php" open tag, which
  will be emitted as literal markup.
note: >-
  Purely syntactic check on a single file. It matches any string literal whose
  text contains "<?php" inside PHP code and does not verify runtime output,
  template context, or whether the string is ever rendered.
rule:
  kind: string
  pattern: '$STR'
  regex: '<\?php'
