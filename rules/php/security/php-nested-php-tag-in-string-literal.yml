id: php-nested-php-tag-in-string-literal
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-embedded-php-tag-in-string-literal. A string
  literal inside PHP code contains a nested "<?php" open tag.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-embedded-php-tag-in-string-literal and do not emit this
  rule.
rule:
  kind: string
  regex: '<\?php'
metadata:
  deprecated_alias_of: php-embedded-php-tag-in-string-literal
  rule_modified_at: '2026-11-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
