# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-http-get-vars-deprecated-superglobal
language: php
severity: warning
message: >-
  Removed HTTP_GET_VARS, HTTP_POST_VARS or HTTP_SERVER_VARS variable name is
  used; use the current superglobals instead.
note: >-
  Matches the literal variable name only; it does not check whether the
  variable is a local assignment or shadows the removed superglobal.
rule:
  all:
    - kind: variable_name
    - regex: '^\$HTTP_(GET|POST|SERVER)_VARS$'
