# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-split-call
language: php
severity: warning
message: >-
  Call to split(), a POSIX-regex function removed in PHP 7; use explode() or
  preg_split().
note: >-
  Matches the literal function-call syntax split(...) by name only; it does
  not resolve namespaces, user-defined functions, or runtime identity.
rule:
  pattern: 'split($$$ARGS)'
