id: php-preg-replace-eval-modifier
language: php
severity: warning
message: >-
  A literal pattern in the first argument of preg_replace contains the legacy
  e modifier. Remove the modifier and use preg_replace_callback where needed.
note: >-
  Detects quoted pattern syntax with an e modifier using slash, hash, tilde,
  bang, percent, brace, parenthesis, or at-sign delimiters. This is a
  single-file syntactic check; it does not resolve computed patterns,
  interpolation values, function bindings, PHP versions, or whether
  replacement code executes.
rule:
  kind: function_call_expression
  all:
    - has:
        field: function
        regex: '(?i)^\\?preg_replace$'
    - has:
        field: arguments
        has:
          kind: argument
          nthChild:
            position: 1
            ofRule:
              kind: argument
          has:
            stopBy: end
            regex: >-
              ^["\x27](/(?:\\.|[^/])*/|#(?:\\.|[^#])*#|~(?:\\.|[^~])*~|!(?:\\.|[^!])*!|%(?:\\.|[^%])*%|@(?:\\.|[^@])*@|\{.*\}|\(.*\))[imsxuADSUXJ]*e[imsxuADSUXJ]*["\x27]$
