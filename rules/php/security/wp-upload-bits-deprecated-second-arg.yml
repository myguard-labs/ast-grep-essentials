id: wp-upload-bits-deprecated-second-arg
language: php
severity: warning
message: >-
  The second argument to wp_upload_bits() is deprecated and ignored; remove
  the mime-type value.
note: >-
  Matches a literal wp_upload_bits call whose second argument is a non-null
  expression. It does not check WordPress version, imports, or whether the
  function is resolved at runtime.
rule:
  pattern: 'wp_upload_bits($A, $B, $$$REST)'
  not:
    pattern: 'wp_upload_bits($A, null, $$$REST)'
