id: wp-filter-post-kses-unslashed-input
language: php
severity: warning
message: >-
  Direct call to wp_filter_post_kses() whose argument is not wrapped in
  addslashes(); review whether the input is slashed.
note: >-
  Syntactic check only. Matches a literal wp_filter_post_kses call whose
  single argument is a plain variable; it does not resolve values, aliasing,
  or whether the data is already slashed.
rule:
  pattern: 'wp_filter_post_kses($ARG)'
  not:
    has:
      pattern: 'addslashes($$$ARGS)'
      stopBy: end
