id: php-gettext-concatenated-translation
language: php
severity: warning
message: >-
  A string literal is concatenated with a translation call, splitting one
  translatable sentence into fragments. Pass the full sentence to a single
  translation call.
note: >-
  Single-file syntactic check for a binary concatenation whose left operand is
  a string literal and whose right operand is a direct __() call. It does not
  resolve whether the called function is gettext or confirm the translation
  domain at runtime.
rule:
  kind: binary_expression
  all:
    - has:
        field: left
        kind: string
        stopBy: end
    - has:
        field: right
        pattern: '__($$$ARGS)'
        stopBy: end
