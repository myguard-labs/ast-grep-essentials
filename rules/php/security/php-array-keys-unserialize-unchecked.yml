id: php-array-keys-unserialize-unchecked
language: php
severity: warning
message: >-
  array_keys() is applied directly to unserialize() output without checking
  that the result is an array.
note: >-
  Matches only the literal nesting array_keys(unserialize(...)) in a single
  file. It does not resolve types, check for a later is_array() guard, or
  track values through variables.
rule:
  pattern: 'array_keys(unserialize($ARG))'
