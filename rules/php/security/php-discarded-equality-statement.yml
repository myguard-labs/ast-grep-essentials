# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-discarded-equality-statement
language: php
severity: warning
message: >-
  This equality comparison is an expression statement whose result is
  discarded; an assignment may have been intended.
note: >-
  Syntactic statement-level check only. It flags a bare == expression
  statement and does not verify intent, types, or runtime behavior.
rule:
  pattern: '$A == $B;'
