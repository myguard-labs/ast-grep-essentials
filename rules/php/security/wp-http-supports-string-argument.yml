id: wp-http-supports-string-argument
language: php
severity: warning
message: >-
  wp_http_supports expects an array of capability names; a bare string literal
  is passed here.
note: >-
  Syntactic check only. Matches a direct wp_http_supports call whose first
  argument is a single string literal; does not resolve the function identity
  or verify runtime behavior.
rule:
  pattern: 'wp_http_supports(''$S'')'
