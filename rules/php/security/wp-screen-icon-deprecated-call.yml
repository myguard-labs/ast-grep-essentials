# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-screen-icon-deprecated-call
language: php
severity: warning
message: 'Direct call to the deprecated screen_icon() helper; review and remove it.'
note: >-
  Matches only the literal unqualified call syntax screen_icon(...) in a
  single file; it does not resolve function identity, namespaces, or whether
  the function is defined by core.
rule:
  pattern: 'screen_icon($$$ARGS)'
