id: wp-zero-date-compare-local-field
language: php
severity: warning
message: >-
  Comparing the zero-date sentinel against post_date (local time) is
  suspicious; the sentinel belongs to post_date_gmt.
note: >-
  Syntactic match only on a literal '0000-00-00 00:00:00' compared with a
  ->post_date property access. It does not resolve receiver types, aliasing,
  or runtime values, and does not verify draft semantics.
rule:
  pattern: '''0000-00-00 00:00:00'' == $X->post_date'
