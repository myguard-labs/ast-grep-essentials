id: php-ini-get-safe-mode-dead-check
language: php
severity: warning
message: >-
  ini_get('safe_mode') reads a directive removed in PHP 5.4, so this check is
  always dead.
note: >-
  Matches the literal call ini_get('safe_mode') syntactically; it does not
  verify the PHP version or runtime configuration.
rule:
  pattern: 'ini_get(''safe_mode'')'
