id: php-filter-callback-missing-return
language: php
severity: warning
message: >-
  This add_filter() callback has no return statement, so the filtered value
  becomes null.
note: >-
  Syntactic check only. Matches a literal add_filter call whose
  second-argument closure body contains no return statement; does not resolve
  named callbacks, nested closures, or runtime filter values.
rule:
  pattern: 'add_filter($HOOK, static function ($$$PARAMS) { $$$BODY })'
  not:
    has:
      kind: return_statement
      stopBy: end
