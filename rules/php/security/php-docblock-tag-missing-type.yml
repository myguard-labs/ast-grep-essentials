id: php-docblock-tag-missing-type
language: php
severity: warning
message: 'This docblock @param or @return tag has a variable where the type should be.'
note: >-
  Matches comment text syntactically by regex on the docblock tag followed
  directly by a $variable; it does not verify the docblock is attached to a
  function or check type semantics.
rule:
  kind: comment
  regex: '@(param|return)\s+\$'
