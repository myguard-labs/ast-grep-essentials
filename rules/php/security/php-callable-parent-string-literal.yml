id: php-callable-parent-string-literal
language: php
severity: warning
message: >-
  is_callable() is given a 'parent::' string literal, a deprecated callable
  form resolved against the calling scope.
note: >-
  Matches only a literal first argument to is_callable() that starts with
  parent:: in the shown syntax. It does not verify the calling class,
  inheritance, or runtime callability.
rule:
  pattern: 'is_callable(''parent::setExpectedException'')'
