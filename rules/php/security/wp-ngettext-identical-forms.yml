# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-ngettext-identical-forms
language: php
severity: warning
message: >-
  The singular and plural arguments of __ngettext() are identical, so
  translators get no distinct plural string.
note: >-
  Syntactic check only. It matches a literal __ngettext call whose first two
  arguments are the same metavariable; it does not resolve the function or
  verify that the strings are literal in every case.
rule:
  pattern: '__ngettext($SAME, $SAME, $$$ARGS)'
