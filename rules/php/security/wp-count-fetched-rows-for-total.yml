id: wp-count-fetched-rows-for-total
language: php
severity: warning
message: >-
  count() wraps a get_*() query call inline, so all matching rows are loaded
  only to be counted. Consider a COUNT query instead.
note: >-
  Syntactic match only. It flags count() directly wrapping a get_*() call with
  a literal function name. It does not verify the callee is a WordPress query
  function, its return type, or whether the result is used elsewhere.
rule:
  pattern: 'count($GET_CALL)'
  has:
    pattern: 'get_terms($$$ARGS)'
    stopBy: end
