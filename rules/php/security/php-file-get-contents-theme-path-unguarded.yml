# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-file-get-contents-theme-path-unguarded
language: php
severity: warning
message: >-
  file_get_contents() reads a get_theme_file_path() result without a visible
  file_exists() guard.
note: >-
  Purely syntactic check for a direct get_theme_file_path() argument inside
  file_get_contents(). It does not verify that the file exists, resolve the
  path at runtime, or see guards in other functions or files.
rule:
  pattern: 'file_get_contents(get_theme_file_path($$$ARGS))'
