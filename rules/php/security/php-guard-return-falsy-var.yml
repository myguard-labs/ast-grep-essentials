id: php-guard-return-falsy-var
language: php
severity: warning
message: >-
  This guard returns the same falsy variable it tested; confirm callers accept
  that value instead of an error.
note: >-
  Purely syntactic. Matches an if whose condition is a negated variable and
  whose body is a bare return of that same variable. It does not check the
  function's documented contract, types, or whether null or false is an
  accepted return value, so review is needed before treating matches as
  defects.
rule:
  pattern: |
    if ( !$VAR ) return $VAR;
