id: wp-post-type-literal-gate
language: php
severity: warning
message: >-
  Template gate compares get_post_type() to a literal 'post'; consider
  checking taxonomy support instead.
note: >-
  Matches only the literal comparison shape between the 'post' string and a
  direct get_post_type() call in either order. It does not resolve runtime
  post types, custom post types, or taxonomy support.
rule:
  pattern: '''post'' == get_post_type()'
