id: php-date-offset-time-shift
language: php
severity: warning
message: >-
  date() receives a time() expression with a manual hour offset, which can
  shift the timezone twice.
note: >-
  Syntactic match only: flags a literal date(...) call whose second argument
  is a time() call plus a product. It does not verify the server timezone or
  runtime values.
rule:
  pattern: 'date($FMT, time() + $OFFSET)'
