# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-embedded-php-open-tag-in-string
language: php
severity: warning
message: >-
  This double-quoted string contains a PHP open tag, so the embedded PHP code
  will be output literally instead of executed.
note: >-
  Syntactic match only. It checks that a double-quoted string literal's text
  contains a php open tag; it does not verify how the string is output or
  whether it is reached at runtime.
rule:
  kind: encapsed_string
  regex: '<\?php'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
