id: wp-submit-button-name-not-id
language: php
severity: warning
message: >-
  submit_button() is given a non-false name as its third argument; review
  whether the button should carry an id via other_attributes instead.
note: >-
  Single-file syntactic check on a literal submit_button call with a non-false
  third argument. It does not verify whether scripts depend on the name or
  whether the call is WordPress core's function.
rule:
  pattern: 'submit_button($A, $B, $C, $D)'
  not:
    pattern: 'submit_button($A, $B, false, $D)'
