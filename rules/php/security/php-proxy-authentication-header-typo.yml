id: php-proxy-authentication-header-typo
language: php
severity: warning
message: >-
  This string literal uses the misspelled header name 'Proxy-Authentication';
  the HTTP header is 'Proxy-Authorization'.
note: >-
  Matches string literals whose text begins with the literal prefix
  'Proxy-Authentication:'. This is a syntactic check only and does not verify
  how the string is used at runtime.
rule:
  kind: string
  regex: '^[''"]Proxy-Authentication:'
