id: wp-the-title-filter-missing-post-id
language: php
severity: warning
message: >-
  apply_filters('the_title') is called with only the title value; pass the
  post ID as the additional argument.
note: >-
  Syntactic match on the literal hook name 'the_title' with exactly one value
  argument. It does not resolve whether the call is a WordPress filter
  invocation or verify callback expectations.
rule:
  pattern: 'apply_filters(''the_title'', $VALUE)'
