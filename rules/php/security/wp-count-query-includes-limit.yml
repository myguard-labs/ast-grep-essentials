# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-count-query-includes-limit
language: php
severity: warning
message: >-
  This COUNT query passed to get_var interpolates a LIMIT clause variable, so
  the total may reflect only one page of rows.
note: >-
  Syntactic match only. It flags a single-quoted SQL string containing
  COUNT(*) and the literal text query_limit; it does not resolve runtime
  values or confirm the variable holds a LIMIT fragment.
rule:
  pattern: '$wpdb->get_var(''SELECT COUNT(*) FROM $wpdb->users $this->query_limit'')'
