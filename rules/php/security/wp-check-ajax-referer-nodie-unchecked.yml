id: wp-check-ajax-referer-nodie-unchecked
language: php
severity: error
message: >-
  A bare check_ajax_referer call supplies literal false for stop and discards
  the return value. Check the result or enable termination on failure.
note: >-
  Matches only bare call statements with literal false as the third positional
  argument or as the named stop argument. This syntactic check does not
  establish whether another guard protects the handler or resolve the called
  function.
rule:
  kind: expression_statement
  has:
    nthChild: 1
    kind: function_call_expression
    all:
      - has:
          field: function
          regex: '(?i)^\\?check_ajax_referer$'
      - has:
          field: arguments
          has:
            kind: argument
            regex: '^(?:stop\s*:\s*)?(?i:false)$'
            not:
              all:
                - regex: '^(?i:false)$'
                - not:
                    nthChild:
                      position: 3
                      ofRule:
                        kind: argument
