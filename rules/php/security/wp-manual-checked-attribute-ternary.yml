id: wp-manual-checked-attribute-ternary
language: php
severity: warning
message: 'Hand-built checked attribute in a ternary; use the checked() helper instead.'
note: >-
  Syntactic match only on an echo of a ternary whose true branch is the
  literal string ' checked="checked"'. Does not resolve runtime values,
  variable identity, or whether the template is WordPress core code.
rule:
  pattern: 'echo ($COND ? '' checked="checked"'' : '''');'
