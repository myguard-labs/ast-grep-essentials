id: php-discarded-pure-return-value
language: php
severity: warning
message: >-
  The return value of this pure string-returning helper is discarded, so the
  call has no effect.
note: >-
  Syntactic check only. It matches a bare call statement to add_query_arg and
  does not verify the helper's purity or resolve the function at runtime.
rule:
  pattern: 'add_query_arg($$$ARGS);'
