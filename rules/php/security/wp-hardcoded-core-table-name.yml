id: wp-hardcoded-core-table-name
language: php
severity: warning
message: >-
  SQL string hard-codes a core WordPress table name; use the $wpdb table
  property instead.
note: >-
  Syntactic check only. Matches string literals containing a bare wp_ core
  table name after FROM; does not resolve the table prefix, multisite context,
  or whether the string is executed as SQL.
rule:
  kind: string_content
  regex: >-
    FROM
    wp_(users|posts|options|usermeta|comments|terms|term_taxonomy|postmeta)\b
