id: php-get-page-in-foreach
language: php
severity: warning
message: >-
  A get_page() call runs inside a foreach loop, so one lookup executes per
  iteration.
note: >-
  Single-file syntactic match on a literal get_page() call inside a foreach
  body; it does not verify that the call is a database lookup, that the loop
  is hot, or that the call cannot be hoisted.
rule:
  pattern: 'get_page($$$ARGS)'
  inside:
    kind: foreach_statement
    stopBy: end
