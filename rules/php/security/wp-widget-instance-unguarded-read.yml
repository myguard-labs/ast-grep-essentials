id: wp-widget-instance-unguarded-read
language: php
severity: warning
message: >-
  Subscript read of $instance used directly as a ternary condition without an
  empty() or isset() guard.
note: >-
  Purely syntactic match on a literal $instance subscript used as a ternary
  condition; it does not verify that the key is absent at runtime, the array
  type, or any guard established elsewhere in the function.
rule:
  kind: conditional_expression
  has:
    pattern: '$instance[$KEY]'
    field: condition
