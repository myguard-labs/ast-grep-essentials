id: php-update-meta-fallback-add
language: php
severity: warning
message: >-
  This if-not update_post_meta() call falls back to add_post_meta() for the
  same key; a no-op update returns false, so review whether the add is
  correct.
note: >-
  Syntactic match only. It checks for an if-not update_post_meta() call whose
  body directly calls add_post_meta() and does not verify the key or value
  match, unique flags, return-value semantics, or runtime state.
rule:
  pattern: |
    if ( ! update_post_meta( $ID, $KEY, $VAL ) ) add_post_meta( $ID, $KEY, $VAL, $$$REST );
