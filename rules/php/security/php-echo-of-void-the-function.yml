id: php-echo-of-void-the-function
language: php
severity: warning
message: >-
  Do not wrap a WordPress the_*() template tag in echo; it already echoes its
  output and returns nothing.
note: >-
  Matches only a literal direct call to the_attachment_link inside an echo
  statement by name. It does not verify the function is WordPress core or
  resolve aliases, imports, or other the_* functions; those need semantic
  analysis.
rule:
  pattern: 'echo the_attachment_link($$$ARGS)'
