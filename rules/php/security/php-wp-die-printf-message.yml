id: php-wp-die-printf-message
language: php
severity: warning
message: >-
  wp_die() receives a printf() call as its message; printf() returns a byte
  count, not the formatted string. Use sprintf() instead.
note: >-
  Matches the literal syntax wp_die(printf(...)) with a direct printf call as
  the first argument. It does not verify that wp_die or printf are the
  WordPress functions, nor resolve aliases, namespaces, or runtime values.
rule:
  pattern: 'wp_die(printf($$$ARGS))'
