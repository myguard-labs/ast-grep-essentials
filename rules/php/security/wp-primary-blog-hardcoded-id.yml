id: wp-primary-blog-hardcoded-id
language: php
severity: warning
message: >-
  update_usermeta() sets primary_blog to a literal integer; use the ID
  captured from $wpdb->insert_id.
note: >-
  Syntactic single-node check only. It matches a literal integer third
  argument to update_usermeta() with key 'primary_blog' and does not verify
  that a $wpdb->insert() call exists in the same function or that the integer
  is wrong at runtime.
rule:
  pattern: 'update_usermeta($UID, ''primary_blog'', 1)'
