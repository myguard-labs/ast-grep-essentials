id: php-referer-strpos-authorization
language: php
severity: warning
message: >-
  strpos() is applied to wp_get_referer(), a client-controlled header; do not
  branch on it.
note: >-
  Syntactic match only. It flags a strpos() call whose first argument is a
  literal wp_get_referer() call. It does not verify how the result is used or
  whether any other check exists.
rule:
  pattern: 'strpos(wp_get_referer(), $NEEDLE)'
