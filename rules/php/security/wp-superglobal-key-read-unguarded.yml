id: wp-superglobal-key-read-unguarded
language: php
severity: warning
message: >-
  Request array element is read directly as a condition without an isset or
  empty guard.
note: >-
  Syntactic heuristic only. It does not see guards placed earlier in the
  function, and it only matches a subscript that is the whole parenthesized
  condition.
rule:
  all:
    - kind: subscript_expression
    - regex: '^\$_(GET|POST)\['
    - inside:
        kind: parenthesized_expression
