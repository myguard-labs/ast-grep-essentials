id: wp-schedule-event-once-recurrence
language: php
severity: warning
message: >-
  wp_schedule_event is called with the recurrence 'once', which is not a
  recurring schedule; use wp_schedule_single_event for one-off events.
note: >-
  Single-file syntactic match on a direct wp_schedule_event call whose second
  argument is the literal string 'once'. Does not resolve function identity,
  imports, or runtime values.
rule:
  pattern: 'wp_schedule_event($A, ''once'', $B)'
