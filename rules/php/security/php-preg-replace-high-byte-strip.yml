id: php-preg-replace-high-byte-strip
language: php
severity: warning
message: >-
  preg_replace strips a high-byte \xHH escape from a non-UTF-8 pattern; this
  can corrupt multibyte text.
note: >-
  Syntactic match only. Checks a literal single-quoted pattern containing a
  \xHH escape with HH >= 80 and no u modifier, and an empty replacement. Does
  not determine whether the input is multibyte or whether the pattern is
  applied to such input.
rule:
  pattern: 'preg_replace(''$PAT'', '''', $$$ARGS)'
  has:
    kind: string_content
    regex: '\\x[89a-fA-F][0-9a-fA-F]'
    stopBy: end
