id: php-trigger-error-user-error-level
language: php
severity: warning
message: >-
  This trigger_error() call passes E_USER_ERROR as its error level, which
  halts execution.
note: >-
  Matches the literal trigger_error call with E_USER_ERROR as a syntactic
  argument; it does not verify the function is the built-in or resolve
  constant values or aliases.
rule:
  pattern: 'trigger_error($$$ARGS, E_USER_ERROR)'
