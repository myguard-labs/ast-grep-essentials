id: php-xml-prolog-without-encoding
language: php
severity: warning
message: >-
  This XML declaration has no encoding attribute, so the response charset is
  left implicit.
note: >-
  Matches the literal single-quoted string syntax of an XML declaration with
  only version="1.0" and no encoding attribute. It does not verify the
  response charset, the runtime value, or how the string is used.
rule:
  pattern: '''<?xml version="1.0"?>'''
