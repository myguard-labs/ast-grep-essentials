id: php-strpos-literal-haystack
language: php
severity: warning
message: >-
  strpos() receives a string literal as haystack and a non-literal needle;
  check that the arguments are not reversed.
note: >-
  Purely syntactic check on a literal first argument and a non-literal second
  argument in a single call; it does not resolve types, runtime values, or
  whether the call is reachable.
rule:
  pattern: 'strpos("$LIT", $NEEDLE)'
  inside:
    kind: program
    stopBy: end
