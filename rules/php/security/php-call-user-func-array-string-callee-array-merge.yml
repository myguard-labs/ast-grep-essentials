id: php-call-user-func-array-string-callee-array-merge
language: php
severity: warning
message: >-
  call_user_func_array is called with the string literal 'array_merge' and an
  array argument; string-keyed arrays spread into named parameters and raise
  ArgumentCountError on PHP 8. Review and pass array_values() if needed.
note: >-
  Syntactic single-file match on a literal 'array_merge' callee and any second
  argument. It does not resolve types, runtime array keys, or whether the
  array is string-keyed.
rule:
  pattern: 'call_user_func_array(''array_merge'', $ARG)'
