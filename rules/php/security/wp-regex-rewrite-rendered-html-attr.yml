id: wp-regex-rewrite-rendered-html-attr
language: php
severity: warning
message: >-
  This preg_replace call has a literal pattern naming an HTML attribute, so it
  may rewrite markup already produced by a render function; pass the option to
  that function instead.
note: >-
  Syntactic match only: flags preg_replace calls whose literal pattern string
  contains the src= fragment. It does not verify that the subject is
  WordPress-rendered output or resolve types, imports, or aliases.
rule:
  pattern: 'preg_replace(''/src=[^ ]+/'', $REPL, $SUBJ)'
