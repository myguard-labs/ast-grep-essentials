id: wp-create-user-literal-password
language: php
severity: warning
message: >-
  wp_create_user is called with a string literal password, so created accounts
  share a known password.
note: >-
  Single-file syntactic match on a direct wp_create_user call whose second
  argument is a string literal. It does not resolve the function identity,
  imports, or runtime values, and does not check other password-setting paths.
rule:
  pattern: 'wp_create_user($USER, ''$LIT'')'
