# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-permalink-concat-missing-trailingslash
language: php
severity: warning
message: >-
  get_permalink() result is concatenated directly without trailingslashit();
  review the joined URL.
note: >-
  Syntactic match only. Flags a literal get_permalink() call used as the left
  operand of a concatenation; it does not resolve types, aliases, or whether
  the result already ends in a slash, and may also flag query-string joins.
rule:
  pattern: 'get_permalink() . $I'
