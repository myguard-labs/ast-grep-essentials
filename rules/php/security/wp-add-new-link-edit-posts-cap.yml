id: wp-add-new-link-edit-posts-cap
language: php
severity: warning
message: >-
  This current_user_can() check gates the add-new link on edit_posts; creating
  posts needs create_posts.
note: >-
  Syntactic match only on a literal $obj->cap->edit_posts argument inside
  current_user_can(); it does not resolve runtime capability values or confirm
  the guarded body is an add-new link.
rule:
  pattern: |
    if ( current_user_can( $OBJ->cap->edit_posts ) ) { $$$BODY }
  inside:
    pattern: 'function $F( $$$ARGS ) { $$$FBODY }'
    stopBy: end
