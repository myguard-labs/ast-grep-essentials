# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-deprecated-split-call
language: php
severity: warning
message: 'Call to removed ereg-family function split(); use preg_split() instead.'
note: >-
  Matches the literal unqualified call split(...) syntactically; does not
  resolve namespaces or confirm the function is the global PHP built-in.
rule:
  pattern: 'split($$$ARGS)'
