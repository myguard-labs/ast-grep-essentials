id: wp-legacy-user-id-global-check
language: php
severity: warning
message: >-
  Legacy $user_ID truthiness test used for logged-in state; prefer
  is_user_logged_in().
note: >-
  Syntactic match on a bare $user_ID variable used as an if condition. It does
  not resolve globals, imports, or runtime values, and does not verify that
  the variable holds a user ID.
rule:
  pattern: 'if ( $user_ID ) : $$$BODY endif;'
