id: php-test-expect-not-to-perform-assertions
language: php
severity: warning
message: >-
  This test calls expectNotToPerformAssertions(); review whether it checks
  output or only that no exception is thrown.
note: >-
  Syntactic match on a literal $this->expectNotToPerformAssertions() call
  inside a method. It does not verify that the method has no other assertions
  or resolve inheritance, so it cannot confirm the test is unsound.
rule:
  pattern: '$this->expectNotToPerformAssertions()'
