id: wp-pagenow-compare-unguarded
language: php
severity: warning
message: >-
  Global $pagenow is compared with a string literal in an if-condition without
  an isset($pagenow) guard.
note: >-
  Purely syntactic single-file match on a literal string compared with
  $pagenow inside an if condition. It does not verify that the global is
  absent at runtime, that no earlier guard exists outside the condition, or
  the variable's scope.
rule:
  pattern: '''$LIT'' == $pagenow'
  inside:
    kind: if_statement
    stopBy: end
    not:
      has:
        pattern: 'isset($pagenow)'
        stopBy: end
