id: wp-unguarded-widget-factory-callable
language: php
severity: warning
message: >-
  Array callable takes its object from a direct array-index read on a
  property; a missing key yields null.
note: >-
  Matches only the literal shape of an array literal whose first element is a
  direct index read on a property. It does not check isset guards, type
  information, or whether the key is registered at runtime.
rule:
  pattern: 'array($OBJ->$PROP[$KEY], $METHOD)'
