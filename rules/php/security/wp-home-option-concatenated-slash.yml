id: wp-home-option-concatenated-slash
language: php
severity: warning
message: >-
  The home option is concatenated with a string literal without
  trailingslashit(); a stored trailing slash will produce a double slash.
note: >-
  Syntactic check only. Matches a literal get_option('home') call directly
  concatenated with a string literal; it does not resolve the option value or
  confirm it lacks a trailing slash.
rule:
  pattern: 'get_option( ''home'' ) . $LIT'
  inside:
    kind: function_definition
    stopBy: end
