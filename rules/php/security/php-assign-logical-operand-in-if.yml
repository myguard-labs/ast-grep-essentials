id: php-assign-logical-operand-in-if
language: php
severity: warning
message: >-
  An assignment inside an if condition is combined with && or || without
  parentheses, so the variable receives a boolean instead of the call result.
note: >-
  Single-file syntactic match on an assignment whose right operand is a bare
  && or || expression inside an if condition, with no parentheses around the
  assignment. It does not resolve types, dataflow, or whether the assigned
  function result is used later.
rule:
  kind: if_statement
  has:
    kind: parenthesized_expression
    has:
      stopBy: end
      kind: assignment_expression
      pattern: '$VAR = $CALL && $RIGHT'
