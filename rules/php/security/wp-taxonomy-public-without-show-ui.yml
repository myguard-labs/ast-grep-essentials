id: wp-taxonomy-public-without-show-ui
language: php
severity: warning
message: >-
  This taxonomy guard skips on public alone without checking show_ui, so
  public-false taxonomies with show_ui enabled may be missed.
note: >-
  Single-file syntactic match on a bare negated $t['public'] guard; it does
  not resolve taxonomy registration, types, or runtime values, and cannot
  confirm show_ui semantics.
rule:
  pattern: 'if ( ! $t[''public''] ) continue;'
