id: php-foreach-return-unrelated-element
language: php
severity: warning
message: >-
  This foreach returns a value built from a non-loop variable inside a branch
  that tests the loop value variable; verify the returned element is the
  intended one.
note: >-
  Purely syntactic check on a literal foreach/if/return shape in one file. It
  does not resolve types, aliasing, or runtime values, so it cannot confirm
  the returned value is wrong.
rule:
  pattern: 'return [$FROM[0]];'
  inside:
    kind: if_statement
    stopBy: end
    inside:
      kind: foreach_statement
      stopBy: end
      has:
        pattern: '$TOV'
        stopBy: end
