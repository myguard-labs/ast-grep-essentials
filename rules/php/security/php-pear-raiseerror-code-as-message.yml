id: php-pear-raiseerror-code-as-message
language: php
severity: warning
message: >-
  PEAR raiseError receives an ALL_CAPS constant as the message and null as the
  code; the error code appears to be passed in the message slot.
note: >-
  Single-file syntactic check on literal call shape only. It does not resolve
  PEAR::raiseError or raiseError to the PEAR library, and it does not verify
  the constant's value or runtime behavior.
rule:
  pattern: 'PEAR::raiseError($CONST, null, $$$REST)'
constraints:
  CONST:
    regex: '^[A-Z][A-Z0-9_]*$'
