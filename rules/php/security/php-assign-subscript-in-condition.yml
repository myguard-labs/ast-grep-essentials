id: php-assign-subscript-in-condition
language: php
severity: warning
message: >-
  Assignment into an array element is used as an if-condition; move the
  assignment out of the condition.
note: >-
  Purely syntactic match on an if-condition whose top-level parenthesized
  expression is an assignment to a subscript target. It does not check whether
  the array is shared, read later, or whether the assignment is actually
  buggy.
rule:
  kind: if_statement
  pattern: 'if ( $ARR[$KEY] = $VAL ) { $$$BODY }'
