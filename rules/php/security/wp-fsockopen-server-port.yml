id: wp-fsockopen-server-port
language: php
severity: warning
message: >-
  fsockopen() is called with the inbound request's SERVER_PORT as the port
  argument; derive the port from the target URL or use a fixed default.
note: >-
  Matches the literal fsockopen call whose second argument is the literal
  SERVER_PORT superglobal subscript; it does not resolve aliases, namespaces,
  or values assigned through variables.
rule:
  pattern: 'fsockopen($HOST, $PORT, $$$REST)'
constraints:
  PORT:
    regex: '^\$_SERVER\[\s*[''"]SERVER_PORT[''"]\s*\]$'
