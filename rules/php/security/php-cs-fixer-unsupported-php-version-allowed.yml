# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-cs-fixer-unsupported-php-version-allowed
language: php
severity: warning
message: >-
  This call disables php-cs-fixer's unsupported PHP version guard. Review
  whether this bypass is intended.
note: >-
  Matches only the literal method name setUnsupportedPhpVersionAllowed called
  with a literal true argument on any receiver. It does not resolve the
  receiver type, imports, aliases, or runtime configuration.
rule:
  pattern: '$RECV->setUnsupportedPhpVersionAllowed(true)'
