id: php-superglobal-index-read-unguarded
language: php
severity: warning
message: >-
  Request superglobal index is read as an operand of a binary expression; the
  key may be absent.
note: >-
  Syntactic only; matches a GET, POST or REQUEST superglobal subscript that is
  a direct operand of a binary expression. It does not detect isset or other
  guards elsewhere and does not check the operator.
rule:
  all:
    - kind: subscript_expression
    - regex: '^\$_(GET|POST|REQUEST)\s*\['
    - inside:
        kind: binary_expression
