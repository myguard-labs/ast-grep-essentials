id: php-str-replace-float-placeholder
language: php
severity: warning
message: >-
  str_replace() is called with the bare printf-style placeholder '%f' as the
  search string, which also rewrites escaped '%%f' sequences.
note: >-
  Single-file syntactic match on a direct str_replace call whose first
  argument is the literal '%f'. It does not resolve aliases, wrappers, or
  runtime values, and does not check whether the subject string contains
  '%%f'.
rule:
  pattern: 'str_replace(''%f'', $$$ARGS)'
