id: php-taxonomy-object-property-unguarded
language: php
severity: warning
message: >-
  Property read directly on the return value of get_taxonomy() or
  get_post_type_object() without a null or false check.
note: >-
  Syntactic single-file match only. It flags a literal get_taxonomy(...) or
  get_post_type_object(...) call whose result is immediately
  property-accessed; it does not resolve types or detect guards elsewhere in
  the function.
rule:
  pattern: 'get_taxonomy($$$ARGS)->$PROP'
