id: php-i18n-context-comment-percent
language: php
severity: warning
message: >-
  A printf-style %s conversion appears after the pipe context separator in a
  _c() string, so it lands in the translator comment rather than as a format
  argument.
note: >-
  Syntactic match only. Flags any _c() call whose literal argument contains a
  pipe followed by a %s conversion; it does not resolve the function's
  definition or verify how the translation tooling interprets the string.
rule:
  pattern: '_c($STR)'
  has:
    regex: '\|.*%s'
    stopBy: end
