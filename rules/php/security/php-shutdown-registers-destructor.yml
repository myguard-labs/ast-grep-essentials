id: php-shutdown-registers-destructor
language: php
severity: warning
message: >-
  Shutdown callback registers __destruct, so the destructor may run a second
  time at shutdown.
note: >-
  Matches the literal syntax of a register_shutdown_function call whose array
  argument contains the string '__destruct'. It does not resolve the callee,
  the class hierarchy, or whether the destructor's effects are actually
  repeated.
rule:
  pattern: 'register_shutdown_function(array($$$A, ''__destruct''))'
