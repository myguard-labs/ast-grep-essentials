id: wp-manual-gmt-offset-time
language: php
severity: warning
message: 'Manual gmt_offset arithmetic ignores DST; use current_time() instead.'
note: >-
  Matches only the literal single-file syntax time() + ( get_option(
  'gmt_offset' ) * 3600 ). It does not resolve types, imports, or runtime
  option values, and it does not check other offset computations.
rule:
  pattern:
    context: '<?php time() + ( get_option( ''gmt_offset'' ) * 3600 );'
    selector: binary_expression
