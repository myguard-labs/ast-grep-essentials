id: wp-esc-wraps-printf
language: php
severity: warning
message: >-
  An esc_* call wraps a printf() call, so the output is printed unescaped and
  the escaper receives printf's byte count.
note: >-
  Purely syntactic check for a literal esc_attr call whose direct argument is
  a printf() call. It does not resolve function identity, imports, or runtime
  values.
rule:
  pattern: 'esc_attr(printf($$$ARGS))'
