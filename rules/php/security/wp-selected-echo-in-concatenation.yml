id: wp-selected-echo-in-concatenation
language: php
severity: warning
message: >-
  selected() or checked() called with two arguments echoes by default; using
  its return value in string concatenation emits the markup twice. Pass false
  as the third argument to get the return value only.
note: >-
  Syntactic match only. Matches a literal selected or checked call with
  exactly two arguments written directly as an operand of a concatenation. It
  does not resolve function identity, imports, or runtime values.
rule:
  all:
    - kind: function_call_expression
    - pattern: 'selected($A, $B)'
    - inside:
        kind: binary_expression
        stopBy: end
