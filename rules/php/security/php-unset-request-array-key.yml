id: php-unset-request-array-key
language: php
severity: warning
message: >-
  unset() uses a request superglobal (GET, POST or REQUEST) directly as the
  array key.
note: >-
  Matches only the literal superglobal syntax in the index expression; it does
  not track values assigned through variables or aliases.
rule:
  pattern: 'unset($ARR[$IDX])'
constraints:
  IDX:
    regex: '^\$_(GET|POST|REQUEST)\['
