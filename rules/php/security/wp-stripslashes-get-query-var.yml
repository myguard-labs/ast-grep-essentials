id: wp-stripslashes-get-query-var
language: php
severity: warning
message: >-
  stripslashes() is applied to get_query_var(), which may already be unslashed
  by WordPress; review for double unslashing.
note: >-
  Single-file syntactic match on a direct stripslashes(get_query_var(...))
  call with a literal function name. It does not verify that the query var is
  unslashed upstream, resolve aliases, or track values through variables.
rule:
  pattern: 'stripslashes(get_query_var($$$ARGS))'
