id: php-http-response-header-unglobaled-read
language: php
severity: warning
message: >-
  This function reads $http_response_header without a global declaration in
  the same function body.
note: >-
  Single-file syntactic check. It looks only for a function body that contains
  the $http_response_header variable and no global statement naming it in that
  function; it does not verify local assignments, reachability, or the runtime
  scope that the HTTP stream wrapper uses.
rule:
  all:
    - kind: function_definition
    - has:
        pattern: '$http_response_header'
        stopBy: end
    - not:
        has:
          pattern: 'global $http_response_header;'
          stopBy: end
