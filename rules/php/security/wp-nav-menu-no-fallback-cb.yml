id: wp-nav-menu-no-fallback-cb
language: php
severity: warning
message: >-
  This wp_nav_menu() call passes an argument array without a 'fallback_cb'
  key, so an empty or missing menu may fall back to the default page list.
note: >-
  Syntactic check only. It flags a literal wp_nav_menu(array(...)) call whose
  array literal has no 'fallback_cb' key; it does not resolve runtime menu
  values, arguments built elsewhere, or whether the menu is actually empty.
rule:
  all:
    - pattern: 'wp_nav_menu(array($$$ARGS))'
    - not:
        has:
          pattern: '''fallback_cb'' => $_'
          stopBy: end
