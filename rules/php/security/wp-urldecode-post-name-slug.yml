id: wp-urldecode-post-name-slug
language: php
severity: warning
message: >-
  urldecode() is applied directly to a post_name property; WordPress slugs are
  already stored decoded, so this may double-decode.
note: >-
  Purely syntactic match on a direct urldecode call whose sole argument is a
  property access named post_name. It does not verify the object is a
  WordPress post, resolve aliases, or check runtime values.
rule:
  pattern: 'urldecode($X->post_name)'
