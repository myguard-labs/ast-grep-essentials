id: php-gettext-concat-translation
language: php
severity: warning
message: >-
  Avoid concatenating a translated string with a variable; pass the variable
  through sprintf with a %s placeholder.
note: >-
  Syntactic match only. Detects a literal-argument __() call as the left
  operand of a '.' concatenation with any right operand; it does not verify
  that the call is a gettext translation function or that the concatenated
  value is runtime-only.
rule:
  pattern: '__($STR) . $VAR'
