id: php-entity-decode-before-truncate
language: php
severity: warning
message: >-
  html_entity_decode() output is passed directly into a byte-count truncation;
  the cut can split a decoded entity.
note: >-
  Syntactic single-file match only. It matches a literal html_entity_decode()
  call nested directly as the first argument of mb_strcut or substr; it does
  not track variables, aliases, or whether the decoded value is later
  re-encoded.
rule:
  pattern: 'mb_strcut(html_entity_decode($$$DECODE_ARGS), $$$CUT_ARGS)'
