id: php-is-predicate-returns-empty
language: php
severity: warning
message: >-
  A function named is_* returns empty() on an array element, which inverts the
  predicate. Review the return value.
note: >-
  Syntactic check only. Matches a method whose name starts with is_ and whose
  body contains a return of empty() applied to a subscript expression. It does
  not resolve types, aliases, or runtime values.
rule:
  all:
    - kind: method_declaration
    - has:
        field: name
        regex: '^is_'
    - has:
        pattern: 'return empty($ARG[$KEY]);'
        stopBy: end
