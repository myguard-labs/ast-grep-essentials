id: php-regex-slash-star-quantifier
language: php
severity: warning
message: >-
  Regex literal ends with "/*", so the star quantifies the slash rather than
  matching any tail. Use "/.*" if an arbitrary suffix was intended.
note: >-
  Purely syntactic check on a single-quoted PHP string literal whose content
  ends in "/*" before the closing delimiter. It does not verify that the
  string is used as a regex or that the slash was meant as a quantified
  any-tail.
rule:
  kind: string
  regex: '^''#.*/\*#[a-zA-Z]*''$'
