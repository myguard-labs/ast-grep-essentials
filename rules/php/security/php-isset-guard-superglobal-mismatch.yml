id: php-isset-guard-superglobal-mismatch
language: php
severity: warning
message: >-
  This GET superglobal read sits inside an if whose condition checks isset on
  the POST superglobal with the same key, so the guard and the read use
  different request arrays.
note: >-
  Purely syntactic. It matches literal GET and POST superglobal subscripts
  with the same key text inside one if statement. It does not check else
  branches, aliasing, or runtime values.
rule:
  all:
    - pattern: '$G[$K]'
    - inside:
        stopBy: end
        kind: if_statement
        has:
          field: condition
          has:
            stopBy: end
            pattern: 'isset($P[$K])'
constraints:
  G:
    regex: '^\$_GET$'
  P:
    regex: '^\$_POST$'
