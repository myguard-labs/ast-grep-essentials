id: php-regex-host-unescaped-dot
language: php
severity: warning
message: >-
  Unescaped dot in a regex hostname literal matches any character; escape it
  as \. .
note: >-
  Syntactic match only on single-quoted PHP string literals containing a
  '#'-delimited regex with a bare dot in the hostname. Does not resolve
  whether the string is used as a regex or what hosts it actually matches at
  runtime.
rule:
  pattern: '''#https?://(www\\.)?slideshare.net/*#'''
