id: php-redirect-to-arg-not-urlencoded
language: php
severity: warning
message: >-
  The 'redirect_to' array entry is assigned a bare variable without urlencode;
  query characters in the URL may not be encoded.
note: >-
  Single-file syntactic check for an assignment of a bare variable to the
  'redirect_to' array key. It does not resolve types, aliasing, or whether the
  value is encoded elsewhere.
rule:
  pattern: '$args[''redirect_to''] = $VAR'
  not:
    has:
      kind: function_call_expression
      stopBy: end
