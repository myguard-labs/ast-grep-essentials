# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-server-php-self-comparison
language: php
severity: warning
message: >-
  Comparing a string literal to the PHP_SELF server entry is a fragile
  script-identity check.
note: >-
  Matches the literal syntax only; it does not resolve whether the variable is
  the real superglobal or how the result is used.
rule:
  all:
    - kind: binary_expression
    - has:
        kind: subscript_expression
        regex: '^\$_SERVER\[[''"]PHP_SELF[''"]\]$'
    - has:
        kind: string
