id: wp-has-post-format-missing-post-arg
language: php
severity: warning
message: >-
  has_post_format() is called with a single argument inside a function that
  declares a $post parameter; the check may fall back to the global post
  instead of the local one.
note: >-
  Single-file syntactic match on a one-argument has_post_format() call only.
  It does not verify that the function signature declares $post, resolve the
  WordPress function signature, or check whether the global fallback is
  intended.
rule:
  all:
    - pattern: 'has_post_format($ARG)'
    - not:
        pattern: 'has_post_format($ARG, $$$REST)'
