id: wp-site-url-result-discarded
language: php
severity: warning
message: >-
  The return value of site_url(...) is discarded here; echo it or remove the
  call.
note: >-
  Syntactic match only on a bare site_url(...) expression statement with a
  literal function name; it does not resolve runtime identity, imports, or
  whether the function is WordPress's.
rule:
  pattern: 'site_url($$$ARGS);'
