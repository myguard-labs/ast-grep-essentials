id: php-str-replace-quote-entity-attr
language: php
severity: warning
message: >-
  Hand-rolled attribute escaping with str_replace for double quotes; use
  esc_attr() or an equivalent HTML attribute escaper.
note: >-
  Matches the literal call shape str_replace('"', '&quot;', ...)
  syntactically. It does not verify that the result is used in an HTML
  attribute, and does not resolve types, aliases, or whether str_replace is
  the PHP built-in.
rule:
  pattern: 'str_replace(''"'', ''&quot;'', $$$ARGS)'
