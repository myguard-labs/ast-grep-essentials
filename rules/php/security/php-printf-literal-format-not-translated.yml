id: php-printf-literal-format-not-translated
language: php
severity: warning
message: >-
  Untranslated printf format string literal; wrap it in a translation function
  such as __().
note: >-
  Syntactic check only. Matches a direct printf call whose first argument is a
  string literal containing a % placeholder. Does not resolve whether the call
  is user-facing, whether printf is the global function, or whether an
  allowlist applies.
rule:
  pattern: 'printf(''$FMT'', $$$ARGS)'
  regex: '%'
