# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-mixed-type-pre80-compat
language: php
severity: warning
message: >-
  The mixed type is not valid before PHP 8.0; review this property declaration
  for version compatibility.
note: >-
  Matches a literal public property declared with the mixed type syntax. It
  does not check the project's target PHP version, parameters, or other
  declaration forms.
rule:
  kind: property_declaration
  has:
    kind: primitive_type
    field: type
    regex: '^mixed$'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
