# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-phpinfo-call
language: php
severity: warning
message: >-
  Direct call to phpinfo() publishes server configuration; remove it or
  restrict it.
note: >-
  Matches the literal unqualified call syntax phpinfo(...) only. It does not
  resolve namespaces, aliases, or whether the page is reachable by visitors.
rule:
  pattern: 'phpinfo($$$ARGS)'
