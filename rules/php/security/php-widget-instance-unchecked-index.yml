id: php-widget-instance-unchecked-index
language: php
severity: warning
message: >-
  Reads a key of $instance inside form() without an isset or array_key_exists
  guard.
note: >-
  Purely syntactic single-file match on a function named form() with a direct
  $instance['key'] read; it does not verify that the key is absent at runtime,
  that the function is a widget method, or that any guard exists elsewhere in
  the code.
rule:
  all:
    - kind: function_definition
    - has:
        pattern: form
        stopBy: end
    - has:
        pattern: '$instance[$KEY]'
        stopBy: end
    - not:
        has:
          pattern: 'isset($instance[$KEY])'
          stopBy: end
