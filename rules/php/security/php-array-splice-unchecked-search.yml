# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-array-splice-unchecked-search
language: php
severity: warning
message: >-
  array_splice() receives a direct array_search() result as its offset without
  a false check; a missing needle splices at position 0.
note: >-
  Syntactic match on a literal array_splice call whose second argument is
  directly an array_search call. It does not resolve types or verify that no
  false check guards the call elsewhere in the code.
rule:
  pattern: 'array_splice($ARR, array_search($$$ARGS), $$$REST)'
