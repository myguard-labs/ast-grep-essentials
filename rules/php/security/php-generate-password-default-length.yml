id: php-generate-password-default-length
language: php
severity: warning
message: >-
  wp_generate_password() is called with no length argument, so it uses the
  short default length.
note: >-
  Single-file syntactic match on a direct wp_generate_password() call with
  zero arguments assigned to a variable. It does not check whether the
  variable holds a secret or salt, and does not resolve aliases or imports.
rule:
  kind: assignment_expression
  all:
    - has:
        kind: function_call_expression
        pattern: 'wp_generate_password()'
    - pattern: '$VAR = wp_generate_password()'
