id: php-count-minus-index-unguarded
language: php
severity: warning
message: >-
  Array read at an index computed as count(...) minus a constant; an empty or
  short array may trigger an undefined-index notice.
note: >-
  Syntactic match only on a literal array read whose index is count(...) minus
  a constant. It does not check for a bounds comparison elsewhere in the
  function, does not resolve types, and cannot prove the array is non-empty.
rule:
  pattern: '$ARR[count($X) - $N]'
