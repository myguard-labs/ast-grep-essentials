# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-split-deprecated-call
language: php
severity: warning
message: >-
  Call to split(), a function removed in PHP 7.0; use explode() or
  preg_split() instead.
note: >-
  Matches the literal unqualified call syntax split(...) only. It does not
  verify that split is the global function rather than a namespaced or
  user-defined function of the same name.
rule:
  pattern: 'split($$$ARGS)'
