id: wp-array-literal-bare-key
language: php
severity: warning
message: >-
  Array literal key is a bare identifier next to quoted string keys; it will
  be read as a constant name, not a string.
note: >-
  Syntactic check only. Matches an array(...) literal containing a bare name
  key followed by "=>" next to a quoted string key. It does not resolve
  whether the identifier is a defined constant.
rule:
  pattern: 'array($$$A, ids => $$$B)'
