# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-dead-false-and-branch
language: php
severity: warning
message: >-
  This if condition starts with a literal false && operand, so the guarded
  branch can never run.
note: >-
  Single-file syntactic match on a literal false as the left operand of a
  top-level && in an if condition. Does not evaluate runtime values,
  reachability, or side effects of the right operand.
rule:
  pattern: 'if ( false && $R ) $BODY'
