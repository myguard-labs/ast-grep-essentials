# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-foreach-value-shadows-iterable
language: php
severity: warning
message: >-
  The foreach value variable reuses the iterated variable name, overwriting
  the collection during iteration.
note: >-
  Single-file syntactic check. Matches a foreach whose key-value target
  variable has the same name as the iterated variable; it does not resolve
  aliasing, references, or runtime values.
rule:
  pattern: 'foreach ($ARR as $K => $ARR) { $$$BODY }'
