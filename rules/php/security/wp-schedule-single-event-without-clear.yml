id: wp-schedule-single-event-without-clear
language: php
severity: warning
message: >-
  wp_schedule_single_event() is called in a function body with no preceding
  wp_clear_scheduled_hook() for the same hook.
note: >-
  Syntactic single-file check only. It looks for a literal
  wp_schedule_single_event call inside a function with no
  wp_clear_scheduled_hook call anywhere in that function body; it does not
  check argument equality, call order, control flow, or runtime cron state.
rule:
  all:
    - pattern: 'wp_schedule_single_event($$$ARGS)'
    - inside:
        kind: function_definition
        stopBy: end
    - not:
        inside:
          kind: function_definition
          stopBy: end
          has:
            pattern: 'wp_clear_scheduled_hook($$$CLEAR)'
            stopBy: end
