id: php-echo-string-embeds-php-open-tag
language: php
severity: warning
message: >-
  Double-quoted string echoed with an embedded PHP open tag; the tag will be
  printed as text instead of executed.
note: >-
  Syntactic check only. Matches an echo statement whose double-quoted string
  literal text contains the characters "<?php". It does not verify runtime
  output, template context, or whether the string is ever reached.
rule:
  all:
    - kind: echo_statement
    - has:
        kind: encapsed_string
        regex: '<\?php'
        stopBy: end
