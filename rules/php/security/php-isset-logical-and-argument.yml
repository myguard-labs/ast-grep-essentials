id: php-isset-logical-and-argument
language: php
severity: warning
message: >-
  isset() is given a logical && expression; use separate isset() calls joined
  by &&.
note: >-
  Matches the literal isset( X && Y ) syntax only. It does not evaluate
  runtime values, types, or aliasing.
rule:
  pattern: 'isset($A && $B)'
