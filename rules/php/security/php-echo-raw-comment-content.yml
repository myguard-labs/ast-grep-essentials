id: php-echo-raw-comment-content
language: php
severity: warning
message: >-
  Raw echo of comment_content; wrap the value in an escaping function such as
  esc_textarea().
note: >-
  Syntactic single-node check. It matches an echo statement whose operand is a
  literal $x->comment_content property read, without resolving types,
  sanitisation earlier in the flow, or whether the value was already escaped.
rule:
  pattern: 'echo $OBJ->comment_content;'
