# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-bare-php-self-global
language: php
severity: warning
message: >-
  Bare PHP_SELF global variable is read; use the PHP_SELF key of the server
  superglobal array instead.
note: >-
  Matches the literal variable name PHP_SELF syntactically; it does not check
  whether the variable is assigned locally or defined elsewhere.
rule:
  kind: variable_name
  regex: '^\$PHP_SELF$'
