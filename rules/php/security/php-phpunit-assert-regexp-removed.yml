id: php-phpunit-assert-regexp-removed
language: php
severity: warning
message: >-
  assertRegExp was removed in PHPUnit 10; use assertMatchesRegularExpression
  instead.
note: >-
  Matches the literal $this->assertRegExp(...) call syntax only; it does not
  verify that the enclosing class is a PHPUnit test case or resolve types or
  inheritance.
rule:
  pattern: '$this->assertRegExp($$$ARGS)'
