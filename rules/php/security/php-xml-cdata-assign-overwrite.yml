id: php-xml-cdata-assign-overwrite
language: php
severity: warning
message: >-
  Assigning trimmed character data overwrites earlier chunks; append with .=
  instead.
note: >-
  Single-file syntactic match on an element assignment of trim($data) inside a
  function whose second parameter is $data. It does not verify the callback is
  registered with an XML parser or that earlier chunks exist.
rule:
  all:
    - pattern: '$X[$K] = trim($data)'
    - inside:
        kind: function_definition
        has:
          field: parameters
          pattern: '$XP'
          stopBy: end
        stopBy: end
