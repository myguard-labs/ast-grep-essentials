# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-preg-match-unquoted-concat
language: php
severity: warning
message: >-
  preg_match pattern concatenates a variable without preg_quote();
  metacharacters in the value can alter the regex.
note: >-
  Syntactic only. Matches a preg_match call whose first argument is a binary
  concatenation containing a variable and no preg_quote call in that argument.
  Does not check whether the value is attacker-controlled or resolve types or
  taint.
rule:
  pattern: 'preg_match($PAT, $S)'
  has:
    kind: binary_expression
    stopBy: end
    has:
      kind: variable_name
      stopBy: end
    not:
      has:
        pattern: 'preg_quote($$$ARGS)'
        stopBy: end
