id: wp-enqueue-media-upload-handle
language: php
severity: warning
message: >-
  Enqueuing the bare 'media-upload' handle with wp_enqueue_script does not set
  up the media modal; call wp_enqueue_media() instead.
note: >-
  Matches only the literal wp_enqueue_script call with the string
  'media-upload' as its first argument. It does not resolve function identity,
  imports, or aliases, and does not check whether wp_enqueue_media() is also
  called.
rule:
  pattern: 'wp_enqueue_script(''media-upload'' $$$ARGS)'
