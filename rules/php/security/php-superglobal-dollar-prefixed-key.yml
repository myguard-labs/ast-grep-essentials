# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-superglobal-dollar-prefixed-key
language: php
severity: warning
message: >-
  Superglobal key starts with a dollar sign inside single quotes; this is
  likely a typo for a variable.
note: >-
  Matches the literal subscript text only; it does not check whether the form
  actually sends such a key or resolve any variables.
rule:
  kind: subscript_expression
  regex: '^[$]_(POST|GET|REQUEST)\s*\[\s*''[$]'
