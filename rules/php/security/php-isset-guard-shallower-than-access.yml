id: php-isset-guard-shallower-than-access
language: php
severity: warning
message: >-
  The isset() guard checks a shallower subscript than the value read in the
  true branch.
note: >-
  Purely syntactic single-expression check. It compares literal subscript
  depth within one ternary and does not resolve runtime values, types, or
  aliasing.
rule:
  kind: conditional_expression
  all:
    - has:
        kind: function_call_expression
        pattern: 'isset($A[$K])'
        stopBy: end
    - has:
        pattern: '$A[$K][$K2]'
        stopBy: end
    - not:
        has:
          pattern: 'isset($A[$K][$K2])'
          stopBy: end
