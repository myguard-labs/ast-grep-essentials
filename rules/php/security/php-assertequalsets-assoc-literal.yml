id: php-assertequalsets-assoc-literal
language: php
severity: warning
message: >-
  assertEqualSets ignores array keys; this associative array literal's keys
  are not checked.
note: >-
  Syntactic match only on a literal assertEqualSets call whose first argument
  is an array(...) literal containing a key => value pair. It does not verify
  the assertion helper's identity, inheritance, or whether keys are actually
  meant to matter.
rule:
  pattern: '$this->assertEqualSets(array($$$BEFORE, $K => $V, $$$AFTER), $$$ARGS)'
