id: wp-foreach-self-concat-accumulates
language: php
severity: warning
message: >-
  A variable inside this foreach is reassigned as a concatenation that
  includes its own previous value, so it accumulates across iterations.
note: >-
  Single-file syntactic match on a literal assignment inside a foreach body
  whose right-hand side concatenates the same variable name that is assigned
  on the left. It does not check whether the variable is reset elsewhere in
  the loop, its type, or runtime values.
rule:
  all:
    - kind: foreach_statement
    - has:
        kind: assignment_expression
        pattern: '$X = $$$LEFT . $X'
        stopBy: end
