# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-get-post-result-read-other-variable
language: php
severity: warning
message: >-
  A property is read from a variable that is never assigned in this function,
  although another variable is assigned from get_post().
note: >-
  Syntactic approximation within one function body; does not resolve globals,
  scope imports, references, or dataflow.
rule:
  kind: function_definition
  all:
    - has:
        pattern: '$A = get_post($$$ARGS)'
        stopBy: end
    - has:
        pattern: '$B->$P'
        stopBy: end
    - not:
        has:
          pattern: '$B = $$$V'
          stopBy: end
