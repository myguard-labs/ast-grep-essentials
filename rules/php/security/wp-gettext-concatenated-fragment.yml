id: wp-gettext-concatenated-fragment
language: php
severity: warning
message: >-
  A translation call is concatenated with other strings, so the translatable
  sentence is split into fragments.
note: >-
  Matches a literal __() call that is directly an operand of a '.'
  concatenation. It does not resolve whether __ is the WordPress gettext
  function or check types, imports, or dataflow.
rule:
  pattern: '__($$$ARGS)'
  inside:
    kind: binary_expression
    has:
      field: operator
      regex: '^\.$'
