id: wp-file-exists-abspath-htaccess
language: php
severity: warning
message: >-
  This file_exists() check builds a rules-file path from ABSPATH; the rewrite
  file may live at the home path instead.
note: >-
  Single-file syntactic match on a file_exists() call whose first argument is
  a binary concatenation with a literal ABSPATH on the left and a '.htaccess'
  or 'web.config' string on the right. It does not resolve constants, home
  paths, or runtime values.
rule:
  pattern: 'file_exists( ABSPATH . ''.htaccess'' )'
