id: php-new-without-parentheses
language: php
severity: warning
message: Add explicit parentheses to this new expression.
note: >-
  Matches a new expression whose class name is a bare name with no argument
  list in the literal syntax; does not resolve class identity or runtime
  behavior.
rule:
  kind: object_creation_expression
  not:
    has:
      kind: arguments
