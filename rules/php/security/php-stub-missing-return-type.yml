id: php-stub-missing-return-type
language: php
severity: warning
message: >-
  Function declaration with an empty body and no native return type; add a
  native return type declaration.
note: >-
  Single-file syntactic match on a function declaration with an empty body and
  no return type node. It does not know whether the file is a stub or resolve
  types, and it does not check PHPDoc.
rule:
  pattern: 'function $NAME($$$PARAMS) {}'
  not:
    has:
      field: return_type
      kind: union_type
