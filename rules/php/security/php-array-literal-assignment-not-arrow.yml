id: php-array-literal-assignment-not-arrow
language: php
severity: warning
message: >-
  An array() element is an assignment expression; a key => value pair was
  probably intended.
note: >-
  Syntactic check only. It flags an assignment expression written directly as
  an element of an array() literal and does not verify runtime intent or
  resolve variables, types, or aliases.
rule:
  kind: assignment_expression
  inside:
    kind: array_creation_expression
    stopBy: end
