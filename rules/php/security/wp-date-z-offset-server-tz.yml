id: wp-date-z-offset-server-tz
language: php
severity: warning
message: >-
  date('Z') returns the server timezone offset; avoid deriving a GMT offset
  from it.
note: >-
  Syntactic match only on a literal date('Z') call used as the left operand of
  a division. It does not verify the server timezone configuration or runtime
  values.
rule:
  pattern: 'date(''Z'') / $DIV'
