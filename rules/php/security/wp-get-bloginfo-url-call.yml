id: wp-get-bloginfo-url-call
language: php
severity: warning
message: >-
  get_bloginfo('url') reads the site URL without the home_url() filter chain;
  consider home_url() instead.
note: >-
  Matches only a direct get_bloginfo call whose first argument is the literal
  string 'url'. It does not resolve whether get_bloginfo is the WordPress
  function or whether any filters apply at runtime.
rule:
  pattern: 'get_bloginfo(''url'')'
