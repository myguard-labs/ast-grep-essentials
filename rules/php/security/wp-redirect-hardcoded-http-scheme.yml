id: wp-redirect-hardcoded-http-scheme
language: php
severity: warning
message: >-
  wp_redirect() is given a hardcoded http:// URL built by concatenation;
  consider deriving the scheme from home_url() or network_home_url().
note: >-
  Purely syntactic check for a wp_redirect call whose first argument is a
  binary concatenation starting with a literal 'http://' string. It does not
  resolve variables, verify the site scheme, or confirm the redirect target at
  runtime.
rule:
  pattern: 'wp_redirect($A . $$$REST)'
