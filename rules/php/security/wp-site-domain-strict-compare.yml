id: wp-site-domain-strict-compare
language: php
severity: warning
message: >-
  Strict === comparison on a domain property; hostnames are case-insensitive,
  so use a case-insensitive comparison.
note: >-
  Syntactic match only. Flags a strict === whose left operand is a literal
  ->domain property access; it does not resolve types or confirm the value is
  a hostname.
rule:
  pattern: '$X->domain === $Y'
