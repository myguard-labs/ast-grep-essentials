id: wp-hardcoded-error-reporting
language: php
severity: warning
message: >-
  Hard-coded numeric error_reporting() level overrides site debug settings;
  remove the literal so core defaults apply.
note: >-
  Matches a direct error_reporting() call whose single argument is an integer
  literal. Does not resolve runtime values, constants, or whether the call is
  overridden elsewhere.
rule:
  kind: function_call_expression
  all:
    - has:
        field: function
        regex: '^error_reporting$'
    - has:
        field: arguments
        has:
          kind: integer
          stopBy: end
