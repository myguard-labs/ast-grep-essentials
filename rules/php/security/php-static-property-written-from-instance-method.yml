id: php-static-property-written-from-instance-method
language: php
severity: warning
message: >-
  Instance method assigns to a static property via self:: or static::, storing
  per-object state in class-wide state.
note: >-
  Syntactic only; matches literal self::/static:: property assignment inside a
  non-static method and does not resolve whether the property is actually
  static or intended to be shared.
rule:
  all:
    - kind: assignment_expression
    - has:
        field: left
        kind: scoped_property_access_expression
        regex: '^(self|static)::'
    - inside:
        kind: method_declaration
        stopBy: end
        not:
          has:
            kind: static_modifier
