id: wp-abspath-langdir-concat
language: php
severity: warning
message: >-
  Build language file paths with WP_LANG_DIR instead of the legacy LANGDIR
  constant concatenated onto ABSPATH.
note: >-
  Purely syntactic match on a literal ABSPATH . LANGDIR binary concatenation;
  it does not resolve constant definitions, runtime values, or whether LANGDIR
  is defined.
rule:
  pattern: ABSPATH . LANGDIR
