id: php-commented-out-assertion
language: php
severity: warning
message: >-
  A commented-out PHPUnit assertion disables test coverage; restore or remove
  it deliberately.
note: >-
  Matches comment text containing a $this->assert...( call by literal text; it
  does not verify the comment is inside a test method or that the assertion
  was intentionally disabled.
rule:
  kind: comment
  regex: '\$this->assert\w*\('
