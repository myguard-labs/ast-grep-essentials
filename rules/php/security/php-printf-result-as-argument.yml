id: php-printf-result-as-argument
language: php
severity: warning
message: >-
  printf() is nested as an argument to another call, so its echoed output and
  integer return value are passed along as the message.
note: >-
  Single-file syntactic match on a literal printf call directly inside another
  call's argument list. It does not resolve whether the outer function is
  wp_die or whether the output is otherwise unsafe.
rule:
  pattern: '$FUNC(printf($$$ARGS))'
