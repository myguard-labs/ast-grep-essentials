id: php-ssh2-sftp-call-with-session-link
language: php
severity: warning
message: >-
  This ssh2_sftp_* call passes $this->link, which is the SSH2 session resource
  rather than the SFTP subsystem resource from ssh2_sftp().
note: >-
  Syntactic check only. Matches a direct ssh2_sftp_* call whose first argument
  is the literal $this->link; it does not resolve what $this->link holds at
  runtime or confirm the property's assigned value.
rule:
  pattern: 'ssh2_sftp_rename($this->link, $$$ARGS)'
