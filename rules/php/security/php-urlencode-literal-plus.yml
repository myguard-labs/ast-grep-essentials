id: php-urlencode-literal-plus
language: php
severity: warning
message: >-
  urlencode() is called on a string literal containing '+'; this yields %2B.
  Check whether the '+' was meant as a space substitute.
note: >-
  Purely syntactic match on a direct urlencode() call whose argument is a
  string literal containing a literal '+'. It does not resolve whether
  urlencode is the PHP builtin, whether the '+' is intentional, or whether the
  value was already encoded.
rule:
  pattern: 'urlencode(''$$$S'')'
  regex: '\+'
