id: php-page-post-type-literal-ternary
language: php
severity: warning
message: >-
  Ternary compares a post type variable to the literal 'page'; check the
  hierarchical flag instead.
note: >-
  Matches only the literal syntax of a ternary whose condition is an equality
  comparison of a variable against the string 'page'. It does not resolve
  runtime post type values, imports, or whether the variable holds a post type
  object.
rule:
  pattern: '$C == ''page'' ? $A : $B'
