id: php-single-quoted-var-in-string
language: php
severity: warning
message: >-
  A single-quoted PHP string contains a $variable token that PHP will not
  interpolate; the literal text is emitted instead.
note: >-
  Syntactic check only. Flags single-quoted string literals whose text
  contains a $identifier token; it does not confirm the variable exists or
  that the literal is intended as plain text.
rule:
  all:
    - kind: string
    - regex: '^''[^'']*\$[A-Za-z_][A-Za-z0-9_]*[^'']*''$'
