# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-ord-multiple-arguments
language: php
severity: warning
message: 'ord() is called with more than one argument; ord() accepts exactly one.'
note: >-
  Matches a literal ord() call whose argument list contains a top-level comma.
  It is a purely syntactic arity check and does not resolve whether ord refers
  to the PHP builtin, a namespaced function, or a user-defined function.
rule:
  pattern: 'ord($A, $$$REST)'
