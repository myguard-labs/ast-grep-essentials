# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-legacy-http-vars-superglobal
language: php
severity: warning
message: >-
  Legacy HTTP_*_VARS arrays were removed in PHP 5.4; use the modern
  superglobal instead.
note: >-
  Matches the variable names syntactically; it does not distinguish reads from
  writes or resolve scope.
rule:
  kind: variable_name
  has:
    kind: name
    regex: '^HTTP_(GET|POST|SERVER|COOKIE|ENV)_VARS$'
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
