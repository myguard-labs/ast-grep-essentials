# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-suppressed-closedir
language: php
severity: warning
message: >-
  A closedir() call is prefixed with the @ error-suppression operator; review
  whether the handle is known to be valid.
note: >-
  Matches the literal syntax of an @ prefix applied directly to a
  closedir(...) call. It does not verify handle validity, runtime values, or
  whether warnings are actually raised.
rule:
  pattern: '@closedir($$$ARGS)'
