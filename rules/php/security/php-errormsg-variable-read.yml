# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-errormsg-variable-read
language: php
severity: warning
message: >-
  Reading $php_errormsg relies on the removed track_errors setting and will
  not contain the failure message on PHP 8.
note: >-
  Matches the literal variable name $php_errormsg syntactically; it does not
  verify the runtime PHP version or whether track_errors is set.
rule:
  pattern: '$php_errormsg'
