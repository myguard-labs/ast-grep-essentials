id: wp-get-option-no-default-in-parse-args
language: php
severity: warning
message: >-
  get_option() is called with no default and its result is passed directly to
  wp_parse_args(); a missing option yields false instead of an array.
note: >-
  Syntactic check only. Matches a literal wp_parse_args call whose first
  argument is a single-argument get_option call; it does not verify the option
  value, runtime type, or whether get_option is the WordPress function.
rule:
  pattern: 'wp_parse_args(get_option($ARG), $$$REST)'
