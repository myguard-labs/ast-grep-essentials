id: php-rsa-pkcs1-padding
language: php
severity: warning
message: >-
  RSA encryption or decryption uses OPENSSL_PKCS1_PADDING. Use
  OPENSSL_PKCS1_OAEP_PADDING instead.
note: >-
  [CWE-780] [OWASP A02:2021] PKCS#1 v1.5 encryption padding is
  vulnerable to Bleichenbacher padding-oracle attacks. This is a syntactic
  check: openssl_public_encrypt, openssl_private_decrypt,
  openssl_private_encrypt or openssl_public_decrypt called with the explicit
  OPENSSL_PKCS1_PADDING constant. Calls that omit the padding argument (which
  defaults to PKCS#1 v1.5) and values held in variables are not matched.
rule:
  kind: function_call_expression
  all:
    - has:
        field: function
        any:
          - kind: name
          - kind: qualified_name
        regex: '^\\?(openssl_public_encrypt|openssl_private_decrypt|openssl_private_encrypt|openssl_public_decrypt)$'
    - has:
        field: arguments
        has:
          kind: argument
          has:
            kind: name
            regex: '^OPENSSL_PKCS1_PADDING$'
