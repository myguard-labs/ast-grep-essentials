id: wp-query-post-status-published
language: php
severity: warning
message: >-
  The post_status value 'published' is not a registered WordPress post status;
  use 'publish'.
note: >-
  Single-file syntactic match on a literal 'post_status' key paired with the
  literal string 'published' inside an array literal. It does not resolve
  WP_Query types, aliases, or runtime argument values.
rule:
  kind: array_creation_expression
  has:
    kind: array_element_initializer
    all:
      - has:
          kind: string
          regex: '^[''"]post_status[''"]$'
      - has:
          kind: string
          regex: '^[''"]published[''"]$'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
