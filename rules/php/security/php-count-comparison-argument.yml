# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-count-comparison-argument
language: php
severity: warning
message: >-
  count() is given a comparison expression as its argument; the comparison
  yields a bool, not a countable value.
note: >-
  Syntactic match only: a call count(x op y) with a binary comparison operator
  directly inside the parentheses. Does not verify the operand types or
  runtime values.
rule:
  pattern: 'count($A > $B)'
