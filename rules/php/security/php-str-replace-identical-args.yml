id: php-str-replace-identical-args
language: php
severity: warning
message: >-
  str_replace() is called with identical search and replacement string
  literals, so the call does nothing.
note: >-
  Syntactic check only. Matches a direct str_replace call whose first two
  arguments are the same single-quoted string literal; does not resolve the
  function identity, imports, or runtime values.
rule:
  pattern: 'str_replace( ''$S'', ''$S'', $$$ARGS )'
