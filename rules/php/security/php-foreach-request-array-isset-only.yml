id: php-foreach-request-array-isset-only
language: php
severity: warning
message: >-
  foreach iterates a request array element guarded only by isset(); consider
  also checking is_array().
note: >-
  Syntactic only; matches an enclosing if whose condition uses isset() without
  is_array(), and does not track aliasing, earlier checks, or other guards
  outside that condition.
rule:
  all:
    - kind: foreach_statement
    - has:
        kind: subscript_expression
        regex: '^\$_(POST|GET|REQUEST)\['
    - inside:
        kind: if_statement
        stopBy: end
        has:
          field: condition
          kind: parenthesized_expression
          all:
            - has:
                pattern: 'isset($$$ARGS)'
                stopBy: end
            - not:
                has:
                  pattern: 'is_array($$$ARGS)'
                  stopBy: end
