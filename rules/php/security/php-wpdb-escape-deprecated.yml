id: php-wpdb-escape-deprecated
language: php
severity: warning
message: >-
  Replace the deprecated wpdb escape() call with $wpdb->prepare() or
  esc_sql().
note: >-
  Matches the literal receiver syntax $wpdb->escape(...) without resolving
  runtime type, imports, or aliases; other objects with an escape method are
  not reported.
rule:
  pattern: '$wpdb->escape($$$ARGS)'
