id: wp-switch-theme-nonce-uses-template
language: php
severity: warning
message: >-
  The switch-theme nonce action is keyed on $template instead of $stylesheet;
  child theme activation will fail.
note: >-
  Purely syntactic match on a wp_nonce_url call whose action is a
  'switch-theme_' string concatenated with a $template variable. Does not
  verify that the call is a switch-theme link or resolve variable values.
rule:
  pattern: 'wp_nonce_url($$$ARGS, ''switch-theme_'' . $template)'
