id: php-strlen-substr-byte-truncate
language: php
severity: warning
message: >-
  Byte-based substr truncation after a strlen guard can split a multibyte
  UTF-8 character; consider mb_strcut.
note: >-
  Syntactic match only. Checks a ternary whose condition is a strlen()
  comparison and whose true branch calls substr(..., 0, N). Does not verify
  the value is UTF-8 text, does not resolve aliases or types, and does not
  confirm the cut lands inside a character.
rule:
  pattern: '($COND) ? substr($STR, 0, $N) . $SUFFIX : $ELSE'
