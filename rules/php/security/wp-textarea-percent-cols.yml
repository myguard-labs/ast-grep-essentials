id: wp-textarea-percent-cols
language: php
severity: warning
message: >-
  textarea cols attribute uses a percentage value; HTML requires an integer
  for cols.
note: >-
  Matches the literal textarea tag text with a cols attribute whose value ends
  in a percent sign. It does not parse HTML or PHP semantics and cannot
  confirm the markup is emitted at runtime.
rule:
  kind: string_content
  regex: '<textarea[^>]*\scols=''[0-9]+%''[^>]*>'
