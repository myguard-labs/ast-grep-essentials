# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-commented-out-return
language: php
severity: warning
message: >-
  A commented-out return statement is present; the intended early return is
  disabled.
note: >-
  Syntactic match only. Matches PHP line comments whose text begins with the
  return keyword; it does not check whether the comment sits in a reachable or
  intended code path.
rule:
  kind: comment
  regex: '^//\s*return\b'
