id: php-xpath-attr-predicate-case-sensitive
language: php
severity: warning
message: An XPath query whose predicate selects elements by a literal attribute name,
  such as [@href], is used to find security-relevant references in parsed markup.
note: XPath attribute names are case sensitive, so mixed-case names such as HrEf are
  skipped by the predicate, even though a later step normalises them to href. This
  generalises to any attribute-name predicate followed by normalisation.
rule:
  pattern: $xpath->query('//use[@href or @xlink:href]', $$V0);
metadata:
  todo_cases:
    - 'Not reported: result assigned or iterated, $nodes = $xpath->query(''//use[@href or @xlink:href]'', $node);'
    - 'Not reported: a receiver other than the literal variable $xpath, $xp->query(''//use[@href or @xlink:href]'', $node);'
    - 'Not reported: a third argument, $xpath->query(''//use[@href or @xlink:href]'', $node, false);'
    - 'Not reported: the query call with one argument, $xpath->query(''//use[@href or @xlink:href]'');'
    - 'Not reported: the evaluate method, $xpath->evaluate(''//use[@href or @xlink:href]'', $node);'
    - 'Not reported: a double-quoted query string, $xpath->query("//use[@href or @xlink:href]", $node);'
    - 'Not reported: reversed predicate order, $xpath->query(''//use[@xlink:href or @href]'', $node);'
  cwe: 'CWE-178'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/178.html'
  taxonomy_cited_keys: 'cwe'
