id: wp-bulk-force-delete-in-insert-path
language: php
severity: warning
message: >-
  Function calls wp_insert_post and also runs a foreach loop calling
  wp_delete_post with force-delete true; move bulk permanent deletion out of
  the record-creation path.
note: >-
  Single-file syntactic match on literal wp_insert_post and wp_delete_post
  calls inside one function with a foreach loop. Does not resolve imports,
  aliases, runtime values, or whether the force flag is truly true.
rule:
  all:
    - kind: function_definition
    - has:
        pattern: 'wp_insert_post($$$ARGS)'
        stopBy: end
    - has:
        kind: foreach_statement
        stopBy: end
        has:
          pattern: 'wp_delete_post($$$DARGS, true)'
          stopBy: end
