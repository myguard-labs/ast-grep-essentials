# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-single-quote-backslash-escape
language: php
severity: warning
message: >-
  Single-quoted string contains a backslash before ] or [, which PHP keeps
  literally; check whether an escape was intended.
note: >-
  Matches only the literal text of single-quoted strings containing a
  backslash directly before ] or [. It does not resolve whether the string is
  interpolated, used as a regex, or otherwise intended.
rule:
  kind: string
  regex: '^''[^'']*\\[\[\]][^'']*''$'
