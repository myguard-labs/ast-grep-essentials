id: php-variable-class-static-call
language: php
severity: warning
message: >-
  Static call through a variable class name ($var::method()) fails to parse on
  PHP 5.2; use call_user_func with an array callable if the project targets
  PHP 5.2.
note: >-
  Matches the literal syntax of a scoped call whose receiver is a single
  variable and whose method name is a plain identifier; it does not resolve
  the variable's runtime value, the PHP version targeted, or whether the
  method is static.
rule:
  kind: scoped_call_expression
  all:
    - has:
        field: scope
        kind: variable_name
    - has:
        field: name
        kind: name
