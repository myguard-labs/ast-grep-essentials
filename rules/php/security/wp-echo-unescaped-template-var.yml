id: wp-echo-unescaped-template-var
language: php
severity: warning
message: >-
  Bare echo of a variable inside an inline PHP tag in template output; review
  whether it needs an esc_* wrapper.
note: >-
  Purely syntactic. Matches an echo statement whose argument is a plain
  variable, with no esc_* call wrapping it. It cannot tell trusted values from
  request-derived ones, so hits require review.
rule:
  kind: echo_statement
  has:
    kind: variable_name
    pattern: '$VAR'
  not:
    has:
      kind: function_call_expression
