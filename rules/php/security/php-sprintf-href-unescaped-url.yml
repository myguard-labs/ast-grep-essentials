id: php-sprintf-href-unescaped-url
language: php
severity: warning
message: >-
  URL-producing call passed unescaped into an href sprintf format; wrap it in
  esc_url().
note: >-
  Syntactic only. Matches a sprintf call whose format string literally
  contains href=%s and whose URL argument is a direct get_permalink() call
  with no esc_url() wrapper. Does not resolve function identity, aliases, or
  runtime values.
rule:
  all:
    - pattern: 'sprintf( $FMT, get_permalink( $$$A ) )'
    - has:
        kind: string
        regex: 'href=%s'
        stopBy: end
