id: php-stream-context-hyphen-user-agent-key
language: php
severity: warning
message: >-
  The stream context http option uses the hyphenated key 'user-agent'; PHP
  expects the underscored option name user_agent, so the value may be silently
  ignored.
note: >-
  Purely syntactic match on a literal 'user-agent' string key whose value sits
  inside an array literal nested directly under an 'http' key within array().
  It does not resolve whether the array is passed to a stream context function
  and does not check runtime option handling.
rule:
  all:
    - kind: array_creation_expression
    - has:
        pattern: '''user-agent'' => $VAL'
        stopBy: end
    - inside:
        pattern: 'array(''http'' => array($$$ARGS))'
        stopBy: end
    - not:
        has:
          pattern: '''user_agent'' => $VAL2'
          stopBy: end
