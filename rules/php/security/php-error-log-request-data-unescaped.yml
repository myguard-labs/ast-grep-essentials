# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-error-log-request-data-unescaped
language: php
severity: warning
message: >-
  Request data is passed to error_log without escaping. A caller who sends
  carriage-return or line-feed characters in the value can forge extra log
  lines and hide their own activity. Strip or encode CR and LF in the value
  (for example with json_encode or str_replace) before logging it.
note: >-
  Fires on an error_log call whose arguments, including double-quoted string
  interpolation, read $_GET, $_POST, $_REQUEST or $_COOKIE. The finding is
  suppressed only when the request-data value itself is wrapped in str_replace
  or str_ireplace whose search argument holds a double-quoted \r or \n (or
  PHP_EOL, chr(10), chr(13)), preg_replace whose pattern names \r, \n or \s,
  addcslashes whose charlist holds \r, \n or a range from \0, filter_var with
  a validating or CR/LF-stripping filter (FILTER_VALIDATE_INT, FILTER_SANITIZE_SPECIAL_CHARS,
  FILTER_FLAG_STRIP_LOW and similar), json_encode, wp_json_encode, urlencode,
  rawurlencode, ctype_*, sanitize_text_field, sanitize_key, sanitize_title,
  sanitize_file_name, sanitize_email, intval, floatval, absint, strlen, count,
  a hash or encoding function, or a numeric or boolean cast; a sanitizer on
  another argument does not suppress it. A chained replace of only \r is accepted as a sanitizer on purpose (precision over recall). A replace of other characters,
  var_export and the esc_* family (esc_html, esc_attr) do not strip CR or LF
  and are still reported. $_SERVER keys such as HTTP_USER_AGENT or REQUEST_URI are excluded
  deliberately (precision over recall). A value copied into a variable
  first is not seen. A log sink that already escapes line breaks is the
  routine dismissal.

  [CWE-117] [A09:2025] [A09:2021]

  [REFERENCES]
      - https://owasp.org/www-community/attacks/Log_Injection
rule:
  kind: function_call_expression
  all:
    - has:
        field: function
        regex: '^error_log$'
    - has:
        field: arguments
        has:
          stopBy: end
          kind: variable_name
          regex: '^\$_(GET|POST|REQUEST|COOKIE)$'
          not:
            inside:
              stopBy:
                kind: function_call_expression
                has:
                  field: function
                  regex: '^error_log$'
              any:
                - kind: cast_expression
                  has:
                    field: type
                    regex: '^(int|integer|float|double|bool|boolean)$'
                - kind: function_call_expression
                  has:
                    field: function
                    regex: '^(json_encode|wp_json_encode|urlencode|rawurlencode|ctype_\w+|sanitize_(text_field|key|title|file_name|email)|intval|floatval|absint|strlen|count|bin2hex|base64_encode|md5|sha1|crc32)$'
                - kind: function_call_expression
                  all:
                    - has:
                        field: function
                        regex: '^(str_replace|str_ireplace)$'
                    - has:
                        field: arguments
                        has:
                          nthChild: 1
                          regex: '"[^"]*(\\[rn]|\\x0[adAD])|PHP_EOL|chr\(\s*(10|13)\s*\)'
                - kind: function_call_expression
                  all:
                    - has:
                        field: function
                        regex: '^preg_replace$'
                    - has:
                        field: arguments
                        has:
                          nthChild: 1
                          regex: '\\[rns]|\\x0[adAD]|\[:space:\]'
                - kind: function_call_expression
                  all:
                    - has:
                        field: function
                        regex: '^addcslashes$'
                    - has:
                        field: arguments
                        has:
                          nthChild: 2
                          regex: '"[^"]*(\\[rn]|\\x0[adAD]|\\0\.\.)'
                - kind: function_call_expression
                  all:
                    - has:
                        field: function
                        regex: '^filter_var$'
                    - has:
                        field: arguments
                        has:
                          any:
                            - nthChild: 2
                              regex: 'FILTER_VALIDATE_(INT|FLOAT|BOOL(EAN)?|IP|EMAIL|URL|MAC)|FILTER_SANITIZE_(NUMBER_INT|NUMBER_FLOAT|SPECIAL_CHARS|ENCODED)|FILTER_FLAG_STRIP_LOW'
                            - nthChild: 3
                              regex: 'FILTER_FLAG_STRIP_LOW'
metadata:
  created_at: '2026-11-16'
  source: 'MyGuard'
  modified_by: 'MyGuard'
  license: 'MyGuard Internal Use License 1.0'
  cwe: 'CWE-117'
  owasp: 'A09:2025|A09:2021'
  category: 'security'
  references: 'https://owasp.org/www-community/attacks/Log_Injection'
