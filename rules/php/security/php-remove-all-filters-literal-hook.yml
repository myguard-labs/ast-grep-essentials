id: php-remove-all-filters-literal-hook
language: php
severity: warning
message: >-
  remove_all_filters() with a literal hook name strips every callback on that
  hook, including those registered by other plugins or core. Narrow the
  removal to a named callback with remove_filter().
note: >-
  Purely syntactic match on a direct remove_all_filters call whose first
  argument is a string literal. It does not resolve function identity,
  imports, or whether the hook has other callbacks at runtime.
rule:
  pattern: 'remove_all_filters($HOOK)'
