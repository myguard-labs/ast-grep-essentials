id: wp-tag-branch-uses-cat-title
language: php
severity: warning
message: >-
  Tag-archive branch calls the category-specific title helper
  single_cat_title().
note: >-
  Purely syntactic match on a direct is_tag() guard whose body calls
  single_cat_title(); it does not resolve WordPress runtime state, template
  context, or whether the branch is reachable.
rule:
  pattern: |
    if (is_tag()) { single_cat_title(); }
