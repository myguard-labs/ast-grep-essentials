# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-isset-guard-reads-other-request-key
language: php
severity: warning
message: An isset guard tests one POST key but the branch reads a different POST key.
note: >-
  Syntactic only; compares literal key text and does not track aliasing, other
  guards, or dataflow.
rule:
  kind: if_statement
  all:
    - has:
        field: condition
        stopBy: end
        all:
          - kind: subscript_expression
          - regex: '^\$_POST\['
          - has:
              kind: string
              pattern: '$K'
    - has:
        field: condition
        stopBy: end
        pattern: 'isset($$$A)'
    - has:
        field: body
        stopBy: end
        all:
          - kind: subscript_expression
          - regex: '^\$_POST\['
          - has:
              kind: string
              not:
                pattern: '$K'
