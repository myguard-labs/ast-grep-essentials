id: wp-global-post-id-in-nonce
language: php
severity: warning
message: >-
  Nonce action interpolates a global $post_ID; pass the post ID explicitly
  instead.
note: >-
  Syntactic only. Matches a wp_create_nonce call whose double-quoted action
  string interpolates $post_ID inside a function that declares global
  $post_ID. It does not resolve runtime values or confirm the global is the
  one used at call time.
rule:
  all:
    - pattern: 'wp_create_nonce("set_post_thumbnail-$post_ID")'
    - inside:
        pattern: 'function $F() { global $post_ID; $$$BODY }'
        stopBy: end
