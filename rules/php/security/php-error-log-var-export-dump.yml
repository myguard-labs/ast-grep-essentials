# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-error-log-var-export-dump
language: php
severity: warning
message: >-
  Logging a whole variable dump with error_log() may write sensitive fields
  such as passwords to the log. Log only the named fields needed.
note: >-
  Purely syntactic match on a literal error_log call whose sole argument is a
  var_export or print_r call. It does not resolve function identity, aliases,
  or the runtime contents of the dumped variable.
rule:
  pattern: 'error_log(var_export($VAR, $$$ARGS))'
