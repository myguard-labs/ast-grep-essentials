id: wp-rest-schema-key-underscore-capital
language: php
severity: warning
message: >-
  Array key uses an underscore before a capital letter; schema property names
  are expected to be snake_case.
note: >-
  Matches only single-quoted string literals whose text starts with a
  lowercase letter and contains an underscore followed by an uppercase letter.
  Does not check whether the array is a REST schema or resolve types.
rule:
  kind: string
  regex: '^''[a-z][A-Za-z0-9]*_[A-Z][A-Za-z0-9_]*''$'
  inside:
    kind: array_element_initializer
    stopBy: end
