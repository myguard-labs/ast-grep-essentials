id: php-array-filter-intval-drops-zero
language: php
severity: warning
message: >-
  array_filter over array_map('intval', ...) with no callback drops elements
  converted to 0; confirm zero values should be discarded.
note: >-
  Matches only the literal syntax array_filter(array_map('intval', ...)) with
  a single argument. It does not resolve types, confirm the values are IDs, or
  check whether zeros are intentionally removed.
rule:
  pattern: 'array_filter(array_map(''intval'', $X))'
