id: php-require-not-once-in-function
language: php
severity: warning
message: >-
  Plain require of an ABSPATH-based file inside a function body; a repeated
  call may re-include a file that declares functions or classes.
note: >-
  Syntactic match only. Matches a plain require whose argument starts with
  ABSPATH inside any function body. It does not check whether the included
  file declares functions or classes, whether the function can run more than
  once, or whether an include guard exists, so review hits by hand.
rule:
  all:
    - pattern: 'require $PATH'
    - inside:
        kind: function_definition
        stopBy: end
    - has:
        pattern: 'ABSPATH . $REST'
        stopBy: end
