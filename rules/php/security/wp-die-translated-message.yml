id: wp-die-translated-message
language: php
severity: warning
message: >-
  Use wp_die() instead of a bare die() or exit() when passing a translated
  message.
note: >-
  Matches only the literal syntax die(__(...)) in a single file; it does not
  verify that the call is inside WordPress code or resolve the __() function
  identity.
rule:
  pattern: 'die(__($$$ARGS))'
