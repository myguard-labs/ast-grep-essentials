id: php-error-suppressed-constant
language: php
severity: warning
message: >-
  Error-suppressed constant() call hides an undefined-constant notice; check
  with defined() instead.
note: >-
  Matches the literal syntax of an @ operator applied directly to a constant(
  ) call. It does not resolve whether the constant is defined or whether the
  call is a user-defined function.
rule:
  pattern: '@constant($$$ARGS)'
