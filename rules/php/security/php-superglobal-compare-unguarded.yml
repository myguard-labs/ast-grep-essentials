id: php-superglobal-compare-unguarded
language: php
severity: warning
message: >-
  POST superglobal index is compared in an if condition without an isset or
  array_key_exists check in the same condition.
note: >-
  Syntactic only; it checks the condition text for isset or array_key_exists
  and does not track guards elsewhere, aliasing, or which key is checked.
rule:
  kind: if_statement
  has:
    field: condition
    all:
      - has:
          stopBy: end
          kind: binary_expression
          all:
            - has:
                field: operator
                regex: '^(==|!=|===|!==|<>|<|>|<=|>=)$'
            - has:
                kind: subscript_expression
                regex: '^\$_POST\s*\['
      - not:
          regex: 'isset\s*\(|array_key_exists\s*\('
