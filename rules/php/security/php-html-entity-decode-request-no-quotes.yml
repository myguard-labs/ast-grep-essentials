# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-html-entity-decode-request-no-quotes
language: php
severity: warning
message: >-
  Review unsafe HTML entity decoding of untrusted input; missing ENT_QUOTES
  flag causes quotes to not be decoded.
note: >-
  Matches the syntactic pattern of html_entity_decode() on request globals
  without a second argument; does not validate security implications or
  downstream sanitization.
rule:
  pattern: 'html_entity_decode($VAR)'
  not:
    any:
      - pattern: 'html_entity_decode($VAR, $$$)'
