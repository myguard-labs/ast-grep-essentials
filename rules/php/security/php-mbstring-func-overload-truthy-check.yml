id: php-mbstring-func-overload-truthy-check
language: php
severity: warning
message: >-
  ini_get('mbstring.func_overload') is used as a plain boolean; this treats
  any nonzero bitmask as enabled. Test the specific bit with a bitwise & flag
  check.
note: >-
  Syntactic single-file match on a bare ini_get call with a literal
  single-quoted option name used directly as an if condition. It does not
  resolve aliases, wrappers, or runtime ini values, and does not verify which
  overload bits are set.
rule:
  pattern: 'if ( ini_get( ''mbstring.func_overload'' ) ) $$$BODY'
