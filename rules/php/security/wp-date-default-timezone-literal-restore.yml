id: wp-date-default-timezone-literal-restore
language: php
severity: warning
message: >-
  date_default_timezone_set is restored to a hard-coded 'UTC' literal; save
  the prior value from date_default_timezone_get and restore that instead.
note: >-
  Single-file syntactic match on a literal 'UTC' argument to
  date_default_timezone_set. It does not verify that a timezone change
  preceded the call, that the function is the same at runtime, or that the
  prior zone was not already UTC.
rule:
  all:
    - pattern: 'date_default_timezone_set(''UTC'')'
    - inside:
        kind: function_definition
        stopBy: end
