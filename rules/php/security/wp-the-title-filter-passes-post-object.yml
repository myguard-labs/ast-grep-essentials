id: wp-the-title-filter-passes-post-object
language: php
severity: warning
message: >-
  apply_filters('the_title') receives a bare $post variable as its third
  argument; pass $post->ID if the filter expects a post ID.
note: >-
  Syntactic match only on a literal apply_filters call with the hook
  'the_title' and a bare $post variable as the third argument. It does not
  resolve types, aliasing, or whether the variable actually holds a post
  object.
rule:
  pattern: 'apply_filters(''the_title'', $A, $post)'
