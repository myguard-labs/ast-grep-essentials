# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-escape-wraps-echoing-tag-function
language: php
severity: warning
message: >-
  An esc_* function wraps a template tag that echoes its output, so the
  escaping receives no value.
note: >-
  Matches the literal call header_image() nested directly inside an esc_url
  call. It does not verify that header_image echoes rather than returns; the
  known-tag list is a syntactic approximation.
rule:
  pattern: 'esc_url(header_image())'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-116'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/116.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  todo_cases:
    - "FN: esc_attr( header_image() ) is not matched; the pattern only covers esc_url."
    - "FN (leading backslash): esc_url( \\header_image() ) is not matched."
    - '<?php ?><img src="<?php echo esc_url( header_image() ); ?>">'
