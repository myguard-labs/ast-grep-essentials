# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-escape-wraps-echoing-tag-function
language: php
severity: warning
message: >-
  An esc_* function wraps a template tag that echoes its output, so the
  escaping receives no value.
note: >-
  Matches the literal call header_image() nested directly inside an esc_url
  call. It does not verify that header_image echoes rather than returns; the
  known-tag list is a syntactic approximation.
rule:
  pattern: 'esc_url(header_image())'
