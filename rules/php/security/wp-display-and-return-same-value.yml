id: wp-display-and-return-same-value
language: php
severity: warning
message: >-
  This function echoes a value in an if-branch and also returns the same value
  at function level, so callers that echo the result will output it twice.
note: >-
  Single-file syntactic match only. It flags a function whose body contains an
  if-statement with an echo of an expression and a later function-level return
  of that same expression text. It does not resolve call sites, types, or
  runtime control flow.
rule:
  kind: function_definition
  all:
    - has:
        kind: compound_statement
        has:
          kind: if_statement
          has:
            kind: echo_statement
            pattern: 'echo $X;'
    - has:
        kind: compound_statement
        has:
          kind: return_statement
          pattern: 'return $X;'
