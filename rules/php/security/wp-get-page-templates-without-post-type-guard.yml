id: wp-get-page-templates-without-post-type-guard
language: php
severity: warning
message: >-
  This if condition calls get_page_templates() without a post_type comparison
  in the same condition.
note: >-
  Syntactic single-node check only. It looks for an if statement whose
  condition contains a get_page_templates() call and no post_type comparison
  in that condition; it does not resolve types, dataflow, or whether a guard
  exists elsewhere.
rule:
  all:
    - kind: if_statement
    - has:
        pattern: 'get_page_templates()'
        stopBy: end
    - not:
        has:
          pattern: '$POST->post_type'
          stopBy: end
