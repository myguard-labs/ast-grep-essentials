id: wp-echo-attribute-comma-args
language: php
severity: warning
message: >-
  This echo statement has comma-separated arguments inside an HTML attribute
  value, so the pieces are emitted with no separator.
note: >-
  Syntactic check only. It matches a PHP echo with two or more comma-separated
  arguments written inside an HTML tag attribute in the same template text; it
  does not verify the attribute semantics or runtime output.
rule:
  pattern: 'echo $A, $B'
