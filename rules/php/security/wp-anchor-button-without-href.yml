id: wp-anchor-button-without-href
language: php
severity: warning
message: >-
  Anchor element with onclick but no href is not keyboard-focusable; use a
  button element instead.
note: >-
  Single-file syntactic check on literal string content only. It looks for an
  anchor tag containing onclick and lacking href in the string text; it does
  not resolve runtime HTML or verify that the string is output.
rule:
  kind: string
  regex: '<a\s[^>]*onclick='
  not:
    regex: '<a\s[^>]*href='
