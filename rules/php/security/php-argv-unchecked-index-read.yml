id: php-argv-unchecked-index-read
language: php
severity: warning
message: >-
  Direct $argv index read assigned without a default; a missing trailing
  argument yields null or a notice.
note: >-
  Syntactic match on an assignment whose right side is a direct $argv[...]
  read with no ?? operator. It does not check isset guards, surrounding
  control flow, or whether the index is in range at runtime.
rule:
  kind: assignment_expression
  all:
    - has:
        field: right
        kind: subscript_expression
        pattern: '$argv[$IDX]'
    - not:
        has:
          kind: binary_expression
          pattern: '$argv[$IDX] ?? $DEF'
