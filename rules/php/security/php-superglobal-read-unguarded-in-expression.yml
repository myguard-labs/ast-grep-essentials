id: php-superglobal-read-unguarded-in-expression
language: php
severity: warning
message: >-
  Superglobal element is read directly in a call without an isset() guard in
  the same expression.
note: >-
  Syntactic only; a guard in an earlier statement or via another construct is
  not recognized, and only in_array is matched.
rule:
  all:
    - pattern: 'in_array($SG[$K], $$$ARGS)'
    - not:
        inside:
          kind: binary_expression
          stopBy: end
          has:
            stopBy: end
            pattern: 'isset($$$GUARD)'
constraints:
  SG:
    regex: '^\$_(GET|POST)$'
