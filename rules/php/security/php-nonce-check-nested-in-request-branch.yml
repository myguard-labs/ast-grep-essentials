id: php-nonce-check-nested-in-request-branch
language: php
severity: warning
message: >-
  Nonce check is nested in an if body whose condition tests a POST or REQUEST
  superglobal key; requests omitting the key skip the check.
note: >-
  Heuristic syntactic match only; it does not verify the nonce check is
  actually bypassed or that another check exists elsewhere.
rule:
  kind: function_call_expression
  regex: '^check_(admin|ajax)_referer\s*\('
  inside:
    kind: compound_statement
    stopBy: end
    inside:
      kind: if_statement
      has:
        field: condition
        has:
          kind: subscript_expression
          regex: '^\$_(POST|REQUEST)\s*\['
          stopBy: end
