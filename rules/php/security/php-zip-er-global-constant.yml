# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-zip-er-global-constant
language: php
severity: warning
message: >-
  Unqualified ZIP_ER_* constant; ZipArchive error codes must be written as
  ZipArchive::ER_*.
note: >-
  Syntactic match on the bare constant name ZIP_ER_ only; does not resolve
  namespaces, imports, or runtime values.
rule:
  kind: name
  regex: '^ZIP_ER_'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
