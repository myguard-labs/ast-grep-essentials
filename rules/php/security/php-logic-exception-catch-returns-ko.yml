id: php-logic-exception-catch-returns-ko
language: php
severity: warning
message: >-
  This catch clause for LogicException returns a fixed failure response, which
  may hide configuration or programming errors.
note: >-
  Single-file syntactic match on a literal LogicException catch clause whose
  body returns new Response('ko'). It does not resolve namespaces, aliases, or
  the exception types thrown in the try body.
rule:
  pattern: |
    try { $$$BODY } catch (\LogicException) { return new Response('ko'); }
