# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-hardcoded-protocol-list
language: php
severity: warning
message: >-
  Hardcoded URL scheme list found; consider taking the allowed protocols from
  wp_allowed_protocols().
note: >-
  Single-file syntactic match on a variable assigned an array literal whose
  first two elements are the literal strings 'http' and 'https'. It does not
  resolve runtime values, filters, or whether the array is actually used for
  URL validation.
rule:
  kind: assignment_expression
  all:
    - has:
        field: left
        kind: variable_name
    - has:
        field: right
        kind: array_creation_expression
        has:
          kind: array_element_initializer
          has:
            kind: string
            regex: '^''http''$'
    - has:
        field: right
        kind: array_creation_expression
        has:
          kind: array_element_initializer
          has:
            kind: string
            regex: '^''https''$'
metadata:
  rule_modified_at: '2026-10-15'
