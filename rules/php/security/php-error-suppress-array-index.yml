# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-error-suppress-array-index
language: php
severity: warning
message: >-
  Error suppression (@) is applied to an array subscript read; check the key
  explicitly instead of hiding errors.
note: >-
  Syntactic match only. Detects an @ suppression operator directly wrapping a
  subscript expression; does not verify the array type, key existence, or
  runtime behavior.
rule:
  pattern: '@$ARR[$KEY]'
