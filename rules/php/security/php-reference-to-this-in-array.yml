id: php-reference-to-this-in-array
language: php
severity: warning
message: >-
  Array literal takes a reference to $this, which is a compile-time error in
  PHP 7.1 and later.
note: >-
  Matches the literal syntax of a reference to $this inside an array literal.
  It does not check whether the code runs under a PHP version where this
  matters or resolve aliasing or runtime values.
rule:
  pattern: 'array($$$A, &$this, $$$B)'
