id: wp-unzip-file-request
language: php
severity: error
message: >-
  An archive extraction reads its source or its destination from request data, so
  a caller supplies both the entries and where they land and can drop a PHP file
  into the webroot. Extract only archives the site itself produced, into a
  generated directory, and reject entries whose resolved path escapes it.
note: >-
  Matches a GET, POST, REQUEST, COOKIE or FILES superglobal in any argument of
  unzip_file, in an argument of an extractTo method call, or in an extract call
  that also passes a PCLZIP_ option constant. A bare extract method with no
  PclZip constant is not matched: the name is used by many unrelated parser and
  DOM APIs and carries no archive semantics on its own. Even a
  fixed destination is unsafe when entry names are not filtered, so a match with
  a literal target still needs review rather than dismissal. An archive path held
  in a variable is not seen.
utils:
  request-superglobal:
    kind: variable_name
    regex: '^\$_(GET|POST|REQUEST|COOKIE|FILES)$'
rule:
  any:
    - kind: function_call_expression
      all:
        - has:
            field: function
            regex: '(?i)^\\?unzip_file$'
        - has:
            field: arguments
            has:
              stopBy: end
              matches: request-superglobal
    - kind: member_call_expression
      all:
        - any:
            - has: {field: name, regex: '(?i)^extractTo$'}
            - all:
                - has: {field: name, regex: '(?i)^extract$'}
                - has:
                    field: arguments
                    has:
                      stopBy: end
                      kind: name
                      regex: '^PCLZIP_'
        - has:
            field: arguments
            has:
              stopBy: end
              matches: request-superglobal
