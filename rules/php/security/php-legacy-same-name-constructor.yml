id: php-legacy-same-name-constructor
language: php
severity: warning
message: >-
  Method has the same name as its enclosing class, which is a PHP 4-style
  constructor deprecated and removed in PHP 8. Use __construct instead.
note: >-
  Single-file syntactic check only. It matches a method whose name equals the
  literal enclosing class name; it does not resolve inheritance, namespaces,
  or whether the class is a test fixture.
rule:
  all:
    - kind: method_declaration
    - has:
        field: name
        regex: '^[A-Za-z_][A-Za-z0-9_]*$'
    - inside:
        kind: class_declaration
        stopBy: end
        has:
          field: name
          pattern: '$CLASS'
    - has:
        field: name
        pattern: '$CLASS'
