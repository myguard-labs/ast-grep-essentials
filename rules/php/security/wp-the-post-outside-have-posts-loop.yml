id: wp-the-post-outside-have-posts-loop
language: php
severity: warning
message: >-
  the_post() is called outside a while (have_posts()) loop; review whether the
  query can be empty.
note: >-
  Syntactic single-file check only. It flags a direct the_post() call with no
  enclosing while loop in the same file; it does not resolve whether the query
  is empty or whether the call is guarded elsewhere.
rule:
  all:
    - pattern: 'the_post()'
    - not:
        inside:
          kind: while_statement
          stopBy: end
