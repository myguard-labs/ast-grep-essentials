# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-negated-is-callable-guard-calls-target
language: php
severity: warning
message: >-
  This negated is_callable() guard's body calls the same function it just
  checked is not callable.
note: >-
  Syntactic single-file match only. It matches a literal is_callable('f')
  string argument negated in an if condition and a direct call to f in the
  body; it does not resolve runtime definitions, fallback definitions, or
  aliasing.
rule:
  kind: if_statement
  pattern: 'if ( ! is_callable( ''$NAME'' ) ) { $$$BODY }'
