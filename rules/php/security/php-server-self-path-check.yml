# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-server-self-path-check
language: php
severity: warning
message: >-
  An if condition calls strpos on the PHP_SELF server variable; prefer an
  explicit constant or flag.
note: >-
  Matches the literal strpos call over the PHP_SELF server array entry inside
  an if condition by text; it does not resolve aliasing or whether the value
  is attacker-controlled.
rule:
  kind: function_call_expression
  regex: '^strpos\(\s*\$_SERVER\[\s*[''"]PHP_SELF[''"]\s*\]'
  inside:
    kind: parenthesized_expression
    stopBy: end
    inside:
      kind: if_statement
