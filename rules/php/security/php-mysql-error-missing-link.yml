id: php-mysql-error-missing-link
language: php
severity: warning
message: >-
  mysql_error() is called without a connection handle, so it reads the error
  of the default link rather than the link that ran the query.
note: >-
  Matches the literal zero-argument mysql_error() call syntax only. It does
  not resolve which connection ran the query, whether a default link exists,
  or any runtime state.
rule:
  pattern: 'mysql_error()'
