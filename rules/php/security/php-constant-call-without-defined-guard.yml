id: php-constant-call-without-defined-guard
language: php
severity: warning
message: >-
  constant() called with a non-literal name without a defined() guard for the
  same name.
note: >-
  Single-file syntactic check only. It matches constant() calls with a
  non-literal argument inside an if condition and does not verify whether the
  name is defined at runtime, resolve aliases, or check guards outside the
  shown expression.
rule:
  pattern: 'constant($NAME)'
  inside:
    kind: if_statement
    stopBy: end
  not:
    inside:
      kind: binary_expression
      has:
        pattern: 'defined($NAME)'
        stopBy: end
