id: wp-login-action-raw-credential
language: php
severity: warning
message: >-
  The wp_login action receives a value read from a credentials array; pass the
  authenticated user's login and the user object instead.
note: >-
  Syntactic match only. Flags do_action calls for 'wp_login' whose first
  argument is a subscript expression; it does not verify runtime values,
  aliasing, or what the array contains.
rule:
  pattern: 'do_action(''wp_login'', $ARR[$KEY])'
