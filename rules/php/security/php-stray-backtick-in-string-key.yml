# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-stray-backtick-in-string-key
language: php
severity: warning
message: >-
  This single-quoted string begins with a backtick, which is usually a stray
  character that changes the array key or value.
note: >-
  Matches a single-quoted PHP string literal whose content starts with a
  backtick. This is a lexical check only; it does not confirm the literal is
  an array key or value or that the backtick is unintended.
rule:
  kind: string
  regex: '^''`'
