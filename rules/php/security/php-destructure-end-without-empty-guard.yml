id: php-destructure-end-without-empty-guard
language: php
severity: warning
message: >-
  Destructuring the result of end() without an emptiness check can silently
  produce null values when the array is empty.
note: >-
  Syntactic match only. Detects list() destructuring assigned directly from
  end(...) in the same assignment; it does not resolve types, verify the
  argument is an array, or check for guards elsewhere in the function.
rule:
  pattern: 'list($$$LEFT) = end($$$ARGS)'
