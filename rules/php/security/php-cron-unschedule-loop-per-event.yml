id: php-cron-unschedule-loop-per-event
language: php
severity: warning
message: >-
  wp_unschedule_event() is called inside a foreach loop, removing cron events
  one at a time. Review whether the cron array can be edited in a single pass.
note: >-
  Syntactic match only. It flags a wp_unschedule_event() call nested inside a
  foreach loop and does not verify the loop iterates cron data, resolve types,
  or prove performance impact.
rule:
  all:
    - pattern: 'wp_unschedule_event($$$ARGS)'
    - inside:
        pattern: 'foreach ($ITER as $K => $V) { $$$BODY }'
        stopBy: end
