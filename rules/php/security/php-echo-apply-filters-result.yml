id: php-echo-apply-filters-result
language: php
severity: warning
message: >-
  This echoes the direct result of apply_filters() instead of assigning it, so
  the filtered value is not captured.
note: >-
  Matches a literal apply_filters() call whose result is echoed directly. It
  does not resolve whether apply_filters is the WordPress function or check
  how callers use the output.
rule:
  pattern: 'echo apply_filters($$$ARGS);'
