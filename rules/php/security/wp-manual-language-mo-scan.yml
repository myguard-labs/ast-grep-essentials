# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-manual-language-mo-scan
language: php
severity: warning
message: >-
  This compares a filename suffix to '.mo' while hand-scanning language files;
  consider calling get_available_languages() instead.
note: >-
  Single-file syntactic match on a substr( ..., -3 ) comparison against the
  literal '.mo' using the == operator only. It does not verify that the value
  comes from a language directory scan or resolve types, aliases, or runtime
  values.
rule:
  pattern:
    context: '<?php substr($LANG_FILE, -3) == ''.mo'';'
    selector: binary_expression
