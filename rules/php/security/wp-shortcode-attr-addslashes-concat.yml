id: wp-shortcode-attr-addslashes-concat
language: php
severity: warning
message: >-
  addslashes() output is concatenated into a double-quoted shortcode
  attribute; use an attribute-escaping function instead.
note: >-
  Single-file syntactic match on a string literal that starts with a
  double-quoted attribute and concatenates addslashes( $x ) directly after it.
  It does not resolve whether the string is a shortcode at runtime, whether
  the value is later escaped, or the data flow of the variable.
rule:
  pattern: '''[caption caption="'' . addslashes( $VAR ) . ''"]'''
