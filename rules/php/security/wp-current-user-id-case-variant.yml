id: wp-current-user-id-case-variant
language: php
severity: warning
message: 'Use the canonical lowercase spelling get_current_user_id() for consistency.'
note: >-
  Matches the literal call spelling get_current_user_ID() only; PHP function
  names are case-insensitive, so this is a style signal and does not check
  runtime behavior or resolve the called function.
rule:
  pattern: 'get_current_user_ID()'
