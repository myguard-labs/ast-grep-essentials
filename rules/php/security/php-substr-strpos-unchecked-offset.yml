# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-substr-strpos-unchecked-offset
language: php
severity: warning
message: >-
  strpos() result is used directly as the length argument of substr(); a
  missing needle returns false and yields a wrong substring.
note: >-
  Syntactic match only. Detects a literal substr() call whose third argument
  is a direct strpos() call; it does not check whether the strpos() result is
  validated elsewhere or whether the value can be false at runtime.
rule:
  pattern: 'substr($S, $OFF, strpos($$$ARGS))'
