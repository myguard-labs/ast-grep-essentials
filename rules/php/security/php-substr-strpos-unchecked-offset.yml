id: php-substr-strpos-unchecked-offset
language: php
severity: warning
message: >-
  strpos() result is used directly as the length argument of substr(); a
  missing needle returns false and yields a wrong substring.
note: >-
  Syntactic match only. Detects a literal substr() call whose third argument
  is a direct strpos() call; it does not check whether the strpos() result is
  validated elsewhere or whether the value can be false at runtime.
rule:
  pattern: 'substr($S, $OFF, strpos($$$ARGS))'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-252'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/252.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A10:2025'
  todo_cases:
    - "FN (namespaced call): <?php $h = \\substr($s, 0, strpos($s, '/')); is not matched."
    - "FN (strrpos): $h = substr($s, 0, strrpos($s, '/')); is not matched although strrpos() also returns false."
