id: php-translate-wrapped-sprintf
language: php
severity: warning
message: >-
  Translation function receives a sprintf() result, so the formatted string
  cannot be extracted for translation. Use printf(__('...'), ...) instead.
note: >-
  Single-file syntactic check for a literal sprintf() call passed directly as
  the first argument to _e() or __(). It does not resolve whether these
  functions are gettext or whether sprintf is the global function.
rule:
  any:
    - pattern: '_e(sprintf($$$ARGS))'
