id: php-get-bloginfo-siteurl-key
language: php
severity: warning
message: 'get_bloginfo() is called with the legacy ''siteurl'' key; use ''url'' instead.'
note: >-
  Single-file syntactic match on a literal 'siteurl' first argument to a
  direct get_bloginfo() call. It does not resolve the function's namespace or
  confirm runtime behavior.
rule:
  pattern: 'get_bloginfo(''siteurl'')'
