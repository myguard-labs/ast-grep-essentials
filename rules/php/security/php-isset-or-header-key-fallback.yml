id: php-isset-or-header-key-fallback
language: php
severity: warning
message: >-
  Two negated isset() checks on the same array with different literal keys are
  joined by ||; review whether a differently cased header can be overwritten.
note: >-
  Purely syntactic match on literal receiver and key spellings within one if
  condition. It does not resolve array aliasing, case-insensitive header
  semantics, runtime values, or whether the fallback is intentional.
rule:
  pattern: >-
    if ( ! isset($ARR['user-agent']) || ! isset($ARR['User-Agent']) ) { $$$BODY
    }
