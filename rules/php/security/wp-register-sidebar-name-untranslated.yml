id: wp-register-sidebar-name-untranslated
language: php
severity: warning
message: >-
  The sidebar 'name' is a bare string literal; wrap it in __() so it can be
  translated.
note: >-
  Single-file syntactic match on a register_sidebar( array( 'name' =>
  'literal' ) ) call. It does not resolve whether register_sidebar is the
  WordPress function or check types, imports, or runtime values.
rule:
  pattern: 'register_sidebar(array(''name'' => $NAME, $$$REST))'
  has:
    pattern: '''name'' => ''$LIT'''
    stopBy: end
