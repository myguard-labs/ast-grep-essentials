id: php-assign-comparison-precedence
language: php
severity: warning
message: >-
  An assignment's right operand is a comparison, so the variable stores a
  boolean instead of the call result.
note: >-
  Purely syntactic check. Matches an assignment expression whose right operand
  is a comparison with !==, !=, ===, or ==. It does not resolve the called
  function or verify runtime values.
rule:
  kind: assignment_expression
  has:
    field: right
    kind: binary_expression
    pattern: '$L !== $R'
