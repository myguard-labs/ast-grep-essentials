id: wp-update-user-option-empty-delete
language: php
severity: warning
message: >-
  update_user_option() is called with a literal empty string value; consider
  delete_user_option() to remove the option.
note: >-
  Matches only the literal call shape with a literal empty string as the third
  argument. It does not resolve WordPress functions, verify the option is
  meant to be removed, or check imports, aliases, or runtime values.
rule:
  pattern: 'update_user_option($USER, $KEY, '''')'
