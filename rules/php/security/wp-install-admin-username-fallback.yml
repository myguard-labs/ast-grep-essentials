id: wp-install-admin-username-fallback
language: php
severity: warning
message: 'Ternary with isset() falls back to the guessable literal ''admin''.'
note: >-
  Matches only the literal isset() ternary syntax with 'admin' as the
  alternative; it does not verify the value is used as a username or resolve
  runtime behavior.
rule:
  pattern:
    context: '$X = isset($$$ARGS) ? $A : ''admin'';'
    selector: conditional_expression
