id: php-discarded-gettext-return
language: php
severity: warning
message: >-
  A gettext call is used as a bare statement, so its translated return value
  is discarded.
note: >-
  Syntactic match only. It flags a bare call to __ or _x as an expression
  statement and does not resolve function identity, imports, or whether the
  value is used elsewhere.
rule:
  all:
    - kind: expression_statement
    - has:
        kind: function_call_expression
        pattern: '$CALL'
        regex: '^_(x|_)\('
