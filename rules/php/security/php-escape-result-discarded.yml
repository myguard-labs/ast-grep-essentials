# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-escape-result-discarded
language: php
severity: warning
message: 'The escaping call''s return value is discarded here, so nothing is output.'
note: >-
  Matches a bare esc_url call used as a statement with no echo or print. It is
  purely syntactic and does not resolve function identity, imports, or runtime
  output.
rule:
  pattern: 'esc_url($$$ARGS);'
