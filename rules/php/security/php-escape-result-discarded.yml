# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-escape-result-discarded
language: php
severity: warning
message: 'The escaping call''s return value is discarded here, so nothing is output.'
note: >-
  Matches a bare esc_url call used as a statement with no echo or print. It is
  purely syntactic and does not resolve function identity, imports, or runtime
  output.
rule:
  pattern: 'esc_url($$$ARGS);'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-116'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/116.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  todo_cases:
    - "<?php \\esc_url( $x );"
