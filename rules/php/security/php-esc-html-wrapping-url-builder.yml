id: php-esc-html-wrapping-url-builder
language: php
severity: warning
message: 'esc_html() is wrapping a URL-building call; use esc_url() for URLs.'
note: >-
  Purely syntactic check for a direct esc_html() call whose single argument is
  a direct add_query_arg or *_url call. It does not resolve function identity,
  imports, or runtime return values, and does not track URLs assigned to
  variables first.
rule:
  pattern: 'esc_html(add_query_arg($$$ARGS))'
