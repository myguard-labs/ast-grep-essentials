id: php-gettext-unnumbered-placeholders
language: php
severity: warning
message: >-
  Translatable string passed to sprintf() uses unnumbered placeholders; use
  positional placeholders such as %1$d so translators can reorder arguments.
note: >-
  Single-file syntactic match on a literal sprintf(__('...'), ...) call whose
  string literal contains an unnumbered %d or %s. It does not resolve the __
  function identity, verify the placeholder count against arguments, or check
  for positional placeholders beyond the literal text.
rule:
  pattern: 'sprintf(__($STR), $$$ARGS)'
  has:
    regex: '%[ds]'
    stopBy: end
  not:
    has:
      regex: '%[0-9]+\$'
      stopBy: end
