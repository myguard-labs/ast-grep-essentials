id: wp-list-cats-deprecated-call
language: php
severity: warning
message: 'Call to wp_list_cats(), an old name; use wp_list_categories() instead.'
note: >-
  Matches the literal function-call syntax wp_list_cats(...) only; it does not
  verify that the function is defined or resolved at runtime.
rule:
  pattern: 'wp_list_cats($$$ARGS)'
