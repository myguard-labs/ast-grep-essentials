id: php-intval-base-two-literal
language: php
severity: warning
message: >-
  intval() is called with a literal base of 2, so the value is parsed as
  binary; check that binary parsing is intended.
note: >-
  Purely syntactic match on a direct intval call whose second argument is the
  literal 2. It does not verify the first argument's contents or whether the
  value is meant to be binary; it does not resolve aliases or imports.
rule:
  pattern: 'intval($ARG, 2)'
