id: php-or-inequality-same-operand-tautology
language: php
severity: warning
message: >-
  This `||` joins two `!=` checks of the same operand against different
  literals, so the condition is always true.
note: >-
  Syntactic check only. Matches a literal variable compared with != against
  two different string literals joined by ||. It does not resolve aliasing,
  types, or runtime values.
rule:
  all:
    - kind: binary_expression
    - pattern: '$A || $B'
    - has:
        pattern: '$X != ''http'''
        stopBy: end
    - has:
        pattern: '$X != ''https'''
        stopBy: end
