id: php-error-log-var-export-debug
language: php
severity: warning
message: >-
  Avoid logging variable dumps via error_log(); this may write
  request-controlled data to the server log.
note: >-
  Syntactic match only: flags error_log() whose sole argument is a literal
  var_export(...) or print_r(...) call. It does not check whether the dumped
  value is sensitive, reachable, or whether the call is in debug-only code.
rule:
  pattern: 'error_log(var_export($$$ARGS))'
