id: php-extension-strrpos-unchecked-offset
language: php
severity: warning
message: >-
  substr() is given a strrpos() offset without checking for false; a dotless
  name yields a wrong extension slice.
note: >-
  Syntactic match only. Matches a literal substr call whose second argument is
  a literal strrpos call; it does not verify that the strrpos result is
  unchecked elsewhere or resolve types or aliases.
rule:
  pattern: 'substr($S, strrpos($S, $D))'
