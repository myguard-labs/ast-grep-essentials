id: php-hook-name-surrounding-whitespace
language: php
severity: warning
message: >-
  Hook name string literal has leading or trailing whitespace, so callbacks
  registered under it will never fire.
note: >-
  Purely syntactic check on a single-file string literal passed directly as
  the first argument to apply_filters or do_action. It does not resolve
  whether the hook is actually registered or whether the call is the WordPress
  function.
rule:
  kind: function_call_expression
  all:
    - has:
        field: function
        regex: '^(apply_filters|do_action)$'
    - has:
        field: arguments
        has:
          kind: argument
          has:
            kind: string
            regex: '^[''"][^''"]*\s[''"]$'
