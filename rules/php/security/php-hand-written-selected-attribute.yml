id: php-hand-written-selected-attribute
language: php
severity: warning
message: >-
  Hand-written selected attribute; consider using the selected() helper
  instead.
note: >-
  Single-file syntactic match on a ternary whose true branch is the literal
  string ' selected="selected"'. It does not verify that the operands are form
  values or that the comparison is an option selection.
rule:
  kind: conditional_expression
  all:
    - has:
        kind: string
        regex: 'selected="selected"'
    - not:
        has:
          kind: string
          regex: 'class='
