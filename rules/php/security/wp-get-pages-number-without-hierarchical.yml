id: wp-get-pages-number-without-hierarchical
language: php
severity: warning
message: >-
  get_pages() call sets a 'number' limit without an explicit 'hierarchical'
  key; review whether the limit should apply to the flat page list.
note: >-
  Single-file syntactic check only. It matches a literal get_pages call whose
  array literal has a 'number' key and no 'hierarchical' key; it does not
  resolve the function, evaluate values, or know the WordPress default at
  runtime.
rule:
  all:
    - pattern: 'get_pages($$$ARGS)'
    - has:
        pattern: '''number'' => $_'
        stopBy: end
    - not:
        has:
          pattern: '''hierarchical'' => $_'
          stopBy: end
