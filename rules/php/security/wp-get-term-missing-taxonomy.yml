id: wp-get-term-missing-taxonomy
language: php
severity: warning
message: >-
  get_term() is called with only a term id and no taxonomy argument; pass the
  taxonomy so the term resolves within the intended taxonomy.
note: >-
  Syntactic check only. Matches a literal get_term() call with exactly one
  argument; it does not resolve types, aliases, or whether the argument is an
  id.
rule:
  pattern: 'get_term($ARG)'
