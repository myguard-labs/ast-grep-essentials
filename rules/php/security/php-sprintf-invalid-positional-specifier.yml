id: php-sprintf-invalid-positional-specifier
language: php
severity: warning
message: >-
  Format string uses an invalid positional specifier; the valid positional
  form is N$ after the digits.
note: >-
  Matches only the literal string shape containing a percent sign, a dollar
  sign, digits, and a conversion letter in that order. It does not check
  whether the string is passed to a printf-style function or resolve runtime
  values.
rule:
  kind: string_content
  regex: '%\$[0-9]+[a-zA-Z]'
