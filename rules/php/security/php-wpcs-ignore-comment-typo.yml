# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-wpcs-ignore-comment-typo
language: php
severity: warning
message: >-
  Found 'wpcs:ignore', did you mean 'phpcs:ignore'? PHPCS does not recognize
  this typo.
note: >-
  Syntactically matches the literal typo 'wpcs:ignore'; it does not verify
  that PHPCS will process it.
rule:
  kind: comment
  regex: '(?m)^//\s+wpcs:ignore'
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
