# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-embedded-php-tag-in-string-literal
language: php
severity: warning
message: >-
  This PHP string literal contains a literal PHP opening tag, so the markup
  may be emitted as text instead of being evaluated.
note: >-
  Single-file syntactic check that a string literal's text contains the
  substring "<?php". It does not resolve whether the string is output,
  evaluated, or reaches a template.
rule:
  kind: string
  regex: '<\?php'
