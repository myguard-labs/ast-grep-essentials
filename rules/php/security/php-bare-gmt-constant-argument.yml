# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-bare-gmt-constant-argument
language: php
severity: warning
message: >-
  A bare GMT identifier is passed as a call argument; use a quoted string
  'GMT' instead.
note: >-
  Matches the literal bare identifier GMT as a direct call argument
  syntactically; does not resolve constants, imports, or runtime values.
rule:
  pattern: 'iso8601_to_datetime($A, GMT)'
