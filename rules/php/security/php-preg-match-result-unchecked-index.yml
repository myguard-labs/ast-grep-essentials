# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-preg-match-result-unchecked-index
language: php
severity: warning
message: >-
  preg_match() is used as a bare statement; its match array is not checked
  before use.
note: >-
  Syntactic approximation only. Matches a bare preg_match() expression
  statement with a literal call shape; it does not prove the match array is
  indexed later, resolve function identity, or analyze control flow beyond the
  enclosing statement.
rule:
  kind: expression_statement
  has:
    kind: function_call_expression
    pattern: 'preg_match($$$ARGS)'
  not:
    inside:
      kind: if_statement
      stopBy: end
