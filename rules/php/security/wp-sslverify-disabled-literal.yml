# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-sslverify-disabled-literal
language: php
severity: warning
message: >-
  This array pair sets 'sslverify' to false, which disables TLS certificate
  verification for the HTTP request.
note: >-
  Matches only a single-file syntactic array pair with the key 'sslverify' and
  the literal false value. It does not resolve whether the array is passed to
  an HTTP call, whether the value is overridden later, or any runtime or
  filter behavior.
rule:
  kind: array_element_initializer
  pattern: $ELEMENT
  all:
    - has:
        kind: string
        regex: '^[''"]sslverify[''"]$'
    - has:
        kind: boolean
        regex: '^(?i)false$'
transform:
  FIXED:
    rewrite:
      rewriters: [sslverify-false-to-true]
      source: $ELEMENT
rewriters:
  - id: sslverify-false-to-true
    rule:
      kind: boolean
      regex: '^(?i)false$'
      inside:
        kind: array_element_initializer
      follows:
        stopBy: end
        kind: string
        regex: '^[''"]sslverify[''"]$'
    fix: 'true'
fix: $FIXED
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
