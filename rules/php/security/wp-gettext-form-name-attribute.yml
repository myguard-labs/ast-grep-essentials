id: wp-gettext-form-name-attribute
language: php
severity: warning
message: >-
  A translated value is concatenated into an HTML name attribute, so the form
  field name changes with locale.
note: >-
  Single-file syntactic match on a string literal ending in name="
  concatenated with a __() call. It does not resolve whether __ is gettext or
  check markup context beyond the literal text.
rule:
  pattern: '''<input type="submit" name="'' . __($$$ARGS)'
