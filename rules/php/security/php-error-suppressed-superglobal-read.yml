id: php-error-suppressed-superglobal-read
language: php
severity: warning
message: >-
  Superglobal read is prefixed with the @ error-suppression operator; use an
  explicit isset guard instead.
note: >-
  Matches only the literal at-sign prefix on a GET, POST or REQUEST
  superglobal subscript; it does not check whether the key is guarded
  elsewhere.
rule:
  all:
    - kind: error_suppression_expression
    - regex: '^@\s*\$_(GET|POST|REQUEST)\s*\['
metadata:
  rule_modified_at: '2026-10-18'
