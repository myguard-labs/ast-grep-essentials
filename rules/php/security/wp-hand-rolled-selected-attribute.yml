id: wp-hand-rolled-selected-attribute
language: php
severity: warning
message: >-
  Build the selected attribute with selected() instead of a hand-rolled
  ternary using loose ==.
note: >-
  Syntactic match only. It flags a ternary whose condition is a literal ==
  comparison and whose true branch is the literal string "
  selected='selected'". It does not resolve types or values, so it cannot
  confirm the comparison is actually wrong.
rule:
  pattern: '$A == $B ? " selected=''selected''" : '''''
