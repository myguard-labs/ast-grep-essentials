id: php-datetime-constructor-unguarded-input
language: php
severity: warning
message: >-
  new DateTime() with a variable argument outside a try block can throw on
  malformed input; validate the input or use date_create().
note: >-
  Syntactic single-file check only. It flags a literal new DateTime($var) call
  with a bare variable argument that is not nested inside any try statement;
  it does not resolve types, dataflow, or whether the input is actually
  malformed or validated earlier.
rule:
  all:
    - pattern: 'new DateTime($ARG)'
    - not:
        inside:
          kind: try_statement
          stopBy: end
