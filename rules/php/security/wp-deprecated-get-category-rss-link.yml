id: wp-deprecated-get-category-rss-link
language: php
severity: warning
message: >-
  get_category_rss_link() is deprecated; migrate this call to
  get_category_feed_link().
note: >-
  Matches the literal function-name call syntax get_category_rss_link(...)
  only; it does not resolve namespaces, imports, or whether the function is
  defined or invoked at runtime.
rule:
  pattern: 'get_category_rss_link($$$ARGS)'
