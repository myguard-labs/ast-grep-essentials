id: php-ini-get-all-unguarded
language: php
severity: warning
message: >-
  Call to ini_get_all() without a function_exists('ini_get_all') guard; hosts
  may disable this function.
note: >-
  Syntactic check only. It treats any enclosing if statement as a guard
  without verifying that its condition is exactly
  function_exists('ini_get_all'), and it does not resolve aliases, namespaces,
  or runtime disable_functions settings.
rule:
  all:
    - pattern: 'ini_get_all($$$ARGS)'
    - not:
        inside:
          kind: if_statement
          stopBy: end
