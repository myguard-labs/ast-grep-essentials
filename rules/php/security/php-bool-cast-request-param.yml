id: php-bool-cast-request-param
language: php
severity: warning
message: >-
  Boolean cast applied directly to a param() result; review how the value is
  validated.
note: >-
  Syntactic match only. Detects a (bool) cast whose operand is directly a
  ->param(...) call; does not resolve the receiver type or verify that param()
  reads request data.
rule:
  pattern: '(bool) $THIS->param($$$ARGS)'
