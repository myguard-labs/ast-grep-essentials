id: php-i18n-missing-text-domain
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-gettext-missing-textdomain. This gettext call
  has a single string argument and no text domain.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-gettext-missing-textdomain and do not emit this rule.
rule:
  pattern: '__( $STR )'
metadata:
  deprecated_alias_of: php-gettext-missing-textdomain
