# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-i18n-missing-text-domain
language: php
severity: warning
message: Translation call is missing a text-domain argument.
note: >-
  Matches the literal single-argument __() call syntax only; it does not
  resolve whether the function is WordPress i18n or verify the default text
  domain at runtime.
rule:
  pattern: '__($STR)'
