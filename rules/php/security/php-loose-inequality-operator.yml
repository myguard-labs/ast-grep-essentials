# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-loose-inequality-operator
language: php
severity: warning
message: >-
  Loose inequality operator != may coerce types; review whether strict !== is
  intended.
note: >-
  Single-file syntactic match on the literal != operator in a binary
  expression. It does not resolve operand types or determine whether coercion
  actually changes the result.
rule:
  pattern: '$A != $B'
