id: wp-theme-thumbnail-check-without-post-type
language: php
severity: warning
message: >-
  Thumbnail UI is gated on theme support without a post_type_supports(...,
  'thumbnail') check in the same condition.
note: >-
  Syntactic single-expression check only. It matches a literal
  current_theme_supports('post-thumbnails', ...) call inside an if condition
  with no post_type_supports call in that condition; it does not resolve
  types, aliases, or runtime post type support.
rule:
  all:
    - pattern: 'current_theme_supports(''post-thumbnails'', $$$ARGS)'
    - inside:
        kind: if_statement
        stopBy: end
    - not:
        inside:
          kind: binary_expression
          has:
            pattern: 'post_type_supports($$$P)'
            stopBy: end
