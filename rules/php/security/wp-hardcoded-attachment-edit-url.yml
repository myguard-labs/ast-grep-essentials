id: wp-hardcoded-attachment-edit-url
language: php
severity: warning
message: >-
  Hand-built media edit URL; use get_edit_post_link() so filters and admin
  routing apply.
note: >-
  Matches only the literal single-quoted string syntax
  'media.php?action=edit&attachment_id=' concatenated with a value. It does
  not resolve runtime values, imports, or whether the string is used as an
  admin URL.
rule:
  pattern: '''media.php?action=edit&attachment_id='' . $POST'
