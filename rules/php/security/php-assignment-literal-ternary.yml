id: php-assignment-literal-ternary
language: php
severity: warning
message: >-
  Assignment uses a ternary whose condition is a bare string literal, so the
  condition is always truthy.
note: >-
  Syntactic single-file check only. Matches an assignment whose right-hand
  side is a ternary with a string literal condition; it does not resolve
  runtime values or types.
rule:
  kind: assignment_expression
  all:
    - has:
        kind: conditional_expression
        field: right
        pattern: '''Y'' ? $A : $B'
    - has:
        field: right
        kind: conditional_expression
