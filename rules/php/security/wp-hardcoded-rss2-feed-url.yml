id: wp-hardcoded-rss2-feed-url
language: php
severity: warning
message: >-
  get_bloginfo() is called with the literal 'rss2_url' instead of deriving the
  feed name from get_default_feed().
note: >-
  Matches only a literal get_bloginfo('rss2_url') call in this file. It does
  not resolve whether the default_feed setting changed or whether the call is
  a feed comparison; those need runtime or semantic review.
rule:
  pattern: 'get_bloginfo(''rss2_url'')'
