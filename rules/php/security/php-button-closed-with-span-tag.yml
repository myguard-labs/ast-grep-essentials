# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-button-closed-with-span-tag
language: php
severity: warning
message: This HTML string opens a button element but closes it with a span tag.
note: >-
  Matches literal single-quoted PHP strings whose text contains an opening
  button tag and a closing span tag. It is a purely syntactic check on the
  literal text and does not evaluate runtime values, concatenation, or
  template output.
rule:
  kind: string
  regex: '^''<button[^>]*>.*</span>''$'
