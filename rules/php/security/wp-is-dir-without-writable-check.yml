id: wp-is-dir-without-writable-check
language: php
severity: warning
message: >-
  A directory checked only with is_dir() is used without an is_writable()
  check in the same condition.
note: >-
  Single-file syntactic match only. It flags an if condition whose sole check
  is is_dir($x) with no is_writable() call; it does not resolve runtime
  values, aliasing, or whether writability is checked elsewhere.
rule:
  all:
    - pattern: 'if (is_dir($DIR)) $$$BODY'
    - not:
        has:
          pattern: 'is_writable($$$ARGS)'
          stopBy: end
