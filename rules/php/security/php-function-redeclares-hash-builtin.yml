id: php-function-redeclares-hash-builtin
language: php
severity: warning
message: >-
  This top-level function is named hash, which redeclares the ext/hash
  builtin.
note: >-
  Matches only a top-level function declaration whose literal name is hash. It
  does not check namespaces, whether ext/hash is loaded, or any other file;
  namespaced declarations are not excluded by this syntax alone.
rule:
  kind: function_definition
  has:
    field: name
    regex: '^hash$'
  not:
    inside:
      kind: compound_statement
      stopBy: end
      has:
        kind: function_definition
        stopBy: end
        pattern: '$X'
