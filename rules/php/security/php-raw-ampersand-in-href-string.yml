id: php-raw-ampersand-in-href-string
language: php
severity: warning
message: >-
  Raw '&' in an href query string inside an HTML anchor literal; use '&amp;'
  for HTML-escaped output.
note: >-
  Syntactic match on a PHP string literal containing an anchor href with a raw
  '&' in its query string. It does not resolve whether the string is rendered
  as HTML, reachable, or escaped elsewhere.
rule:
  kind: string
  regex: '<a[^>]*href="[^"]*\?[^"&]*&[^"&;]*='
