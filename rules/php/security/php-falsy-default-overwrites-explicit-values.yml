id: php-falsy-default-overwrites-explicit-values
language: php
severity: warning
message: >-
  This falsy check assigns a default to the same array key, which can
  overwrite explicitly supplied 0 or empty-string values.
note: >-
  Matches the literal syntax of a negated array-element test followed by
  assignment to the same key in an if statement. It does not resolve runtime
  values, types, or whether the key was supplied; review the surrounding code
  to confirm.
rule:
  pattern: |
    if (!$ARR[$KEY]) $ARR[$KEY] = $DEFAULT;
