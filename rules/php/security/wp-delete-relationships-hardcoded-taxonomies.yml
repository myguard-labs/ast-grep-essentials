id: wp-delete-relationships-hardcoded-taxonomies
language: php
severity: warning
message: >-
  wp_delete_object_term_relationships() is given a literal array of taxonomy
  names; custom taxonomies may be skipped.
note: >-
  Syntactic match only. Matches a direct call whose second argument is a
  literal array(...) literal; it does not check which taxonomies are
  registered, whether the array is complete, or whether the call is reachable.
rule:
  pattern: 'wp_delete_object_term_relationships($ID, array($$$TAXS))'
