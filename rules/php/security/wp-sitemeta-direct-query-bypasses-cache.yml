# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-sitemeta-direct-query-bypasses-cache
language: php
severity: warning
message: >-
  Direct $wpdb get_row query on the sitemeta table; consider get_site_option
  instead.
note: >-
  Syntactic match only. Flags a $wpdb->get_row call whose direct argument is a
  $wpdb->prepare call containing the literal $wpdb->sitemeta reference; it
  does not verify runtime cache behavior, variable values, or filters.
rule:
  all:
    - pattern: '$WPDB->get_row($$$ARGS)'
    - has:
        pattern: '$WPDB->prepare($$$PARGS)'
        stopBy: end
    - has:
        pattern: '$wpdb->sitemeta'
        stopBy: end
