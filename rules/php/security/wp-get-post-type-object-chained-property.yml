id: wp-get-post-type-object-chained-property
language: php
severity: warning
message: >-
  Property read directly on get_post_type_object() result without a null
  check.
note: >-
  Syntactic match only. Flags a literal get_post_type_object(...)->property
  access in one file; it does not verify that the type is unregistered, nor
  track null checks stored in variables.
rule:
  pattern: 'get_post_type_object($ARG)->$PROP'
