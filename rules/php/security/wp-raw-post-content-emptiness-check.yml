id: wp-raw-post-content-emptiness-check
language: php
severity: warning
message: >-
  strlen() is applied to the raw post_content property as an emptiness check;
  filtered output may differ.
note: >-
  Syntactic match only on the literal $post->post_content receiver inside
  strlen() compared with zero. It does not resolve types, filters, or whether
  the value is a WordPress post object, and does not check reachability.
rule:
  pattern: 'strlen($post->post_content) > 0'
