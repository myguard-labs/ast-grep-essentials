id: wp-direct-mail-call
language: php
severity: warning
message: 'Direct mail() call bypasses wp_mail and its filters; use wp_mail() instead.'
note: >-
  Matches the literal global mail( call syntax only. It does not resolve
  namespaces, aliases, or whether a user-defined mail function exists, and
  does not check runtime transport behavior.
rule:
  pattern: 'mail($$$ARGS)'
