id: php-raw-post-title-property-in-output
language: php
severity: warning
message: >-
  Raw post_title property is passed to an escaping function; consider
  get_the_title() so title filters apply.
note: >-
  Matches the literal syntax of a direct post_title property read inside an
  esc_attr call. It does not resolve whether the receiver is a WordPress post
  object, and does not check runtime filters or other escaping paths.
rule:
  pattern: 'esc_attr($OBJ->post_title)'
