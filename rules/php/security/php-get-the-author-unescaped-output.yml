id: php-get-the-author-unescaped-output
language: php
severity: warning
message: >-
  get_the_author() output is echoed without an escaping wrapper such as
  esc_html().
note: >-
  Matches the literal syntax echo get_the_author(); with no escaping call
  around it. It does not resolve the function at runtime, does not check
  printf arguments, and does not track data through variables or other
  escaping helpers.
rule:
  pattern: 'echo get_the_author();'
