id: php-hardcoded-admin-ajax-path
language: php
severity: warning
message: >-
  Hardcoded admin-ajax.php path used as a request URL; build it with
  admin_url() or use ajaxurl instead.
note: >-
  Single-file syntactic match on a string literal containing admin-ajax.php.
  It does not resolve whether the string is actually used as a request URL or
  whether a different admin path is in effect.
rule:
  kind: string
  regex: 'admin-ajax\.php'
