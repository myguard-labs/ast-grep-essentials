id: php-pathinfo-extension-key-access
language: php
severity: warning
message: >-
  Direct ['extension'] access on pathinfo() may raise an undefined-key warning
  when the path has no extension; use pathinfo($path, PATHINFO_EXTENSION)
  instead.
note: >-
  Matches only the literal syntax pathinfo(...)['extension'] applied directly
  to a pathinfo call. It does not resolve types, aliases, or values assigned
  to variables first.
rule:
  pattern: 'pathinfo($$$ARGS)[''extension'']'
