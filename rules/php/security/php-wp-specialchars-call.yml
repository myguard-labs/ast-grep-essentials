id: php-wp-specialchars-call
language: php
severity: warning
message: >-
  Call to removed wp_specialchars() helper; use esc_html() or esc_attr()
  instead.
note: >-
  Matches the literal function name syntax wp_specialchars(...) in a single
  file. It does not resolve namespaces, imports, or whether the function is
  defined by a plugin or theme.
rule:
  pattern: 'wp_specialchars($$$ARGS)'
