id: wp-gettext-nonliteral-sprintf
language: php
severity: warning
message: >-
  The first argument of this translation call is a sprintf() call, so the
  message cannot be extracted for translation. Wrap the literal in the
  translation call and apply sprintf() outside it.
note: >-
  Single-file syntactic match on a direct __() call whose first argument is a
  direct sprintf() call, written as a literal function name with an
  unqualified call. It does not resolve whether __ is the WordPress gettext
  function or check imports or aliases.
rule:
  pattern: '__(sprintf($$$ARGS))'
