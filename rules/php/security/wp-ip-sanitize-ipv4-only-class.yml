id: wp-ip-sanitize-ipv4-only-class
language: php
severity: warning
message: >-
  IPv4-only character class strips ':' from REMOTE_ADDR, truncating IPv6
  addresses.
note: >-
  Syntactic only; matches a literal negated class without ':' in the first
  argument and does not resolve aliasing or other regex semantics.
rule:
  pattern: 'preg_replace($PAT, $REP, $_SERVER[''REMOTE_ADDR''])'
  has:
    kind: arguments
    has:
      kind: argument
      nthChild: 1
      regex: '^.\/\[\^[^\]:]*\]\/'
