id: php-usermeta-unserialize-meta-key
language: php
severity: warning
message: >-
  unserialize() is called on a meta_key property; the serialized payload
  should come from meta_value.
note: >-
  Matches the literal syntax unserialize($x->meta_key) on a direct property
  access. It does not verify that the receiver is a meta row or resolve types
  or aliases.
rule:
  pattern: 'unserialize($RECV->meta_key)'
