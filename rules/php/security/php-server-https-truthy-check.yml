# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-server-https-truthy-check
language: php
severity: warning
message: >-
  The server HTTPS entry is used as a bare truthy if condition; compare it to
  the string on instead.
note: >-
  Matches only the literal superglobal subscript as the whole if condition; it
  does not track aliases or other truthiness forms.
rule:
  kind: subscript_expression
  regex: '^\$_SERVER\[\s*[''"]HTTPS[''"]\s*\]$'
  inside:
    kind: parenthesized_expression
    inside:
      kind: if_statement
metadata:
