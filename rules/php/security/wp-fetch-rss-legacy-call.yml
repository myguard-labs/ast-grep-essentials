id: wp-fetch-rss-legacy-call
language: php
severity: warning
message: 'Direct call to the legacy fetch_rss() function; use fetch_feed() instead.'
note: >-
  Matches the literal unqualified call syntax fetch_rss(...) only; it does not
  verify that the function is the WordPress legacy function or resolve
  namespaces, aliases, or runtime definitions.
rule:
  pattern: 'fetch_rss($$$ARGS)'
