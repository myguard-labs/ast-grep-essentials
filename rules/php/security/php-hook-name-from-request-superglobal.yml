id: php-hook-name-from-request-superglobal
language: php
severity: warning
message: >-
  do_action() hook name is built by concatenating a request superglobal value;
  review whether callers can fire unintended hooks.
note: >-
  Syntactic match only. Detects a do_action() call whose first argument is a
  binary concatenation with a literal left operand and a request superglobal
  subscript on the right. Does not resolve runtime values, aliasing, or
  whether the hook is registered.
rule:
  pattern: 'do_action($PREFIX . $_GET[$KEY])'
