id: php-hook-name-from-request-superglobal
language: php
severity: warning
message: >-
  do_action() hook name is built by concatenating a request superglobal value;
  review whether callers can fire unintended hooks.
note: >-
  Syntactic match only. Detects a do_action() call whose first argument is a
  binary concatenation with a literal left operand and a request superglobal
  subscript on the right. Does not resolve runtime values, aliasing, or
  whether the hook is registered.
rule:
  pattern: 'do_action($PREFIX . $OBJ[$KEY])'
constraints:
  OBJ:
    regex: '^\$(_GET|_POST|_REQUEST|_COOKIE|_SERVER|_FILES)(\W|$)'
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
  created_at: '2026-10-18'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-470'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/470.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  todo_cases:
    - "<?php do_action( 'pfx_' . $_GET['a'], $arg1 );"
    - "<?php do_action( $_GET['a'] );"
    - "<?php do_action( 'x_' . $_GET['a'] . '_end' );"
