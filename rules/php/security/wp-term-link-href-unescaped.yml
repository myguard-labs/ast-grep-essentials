id: wp-term-link-href-unescaped
language: php
severity: warning
message: >-
  get_term_link() output is concatenated into an HTML string without an
  escaping wrapper such as esc_attr or esc_url.
note: >-
  Syntactic check only. It matches a literal get_term_link( ... ) call used as
  a direct operand of string concatenation and does not verify the surrounding
  HTML context, resolve the function identity, or track values through
  variables.
rule:
  all:
    - pattern: '''<a href="'' . get_term_link($$$ARGS)'
    - not:
        inside:
          pattern: 'esc_attr($$$INNER)'
          stopBy: end
