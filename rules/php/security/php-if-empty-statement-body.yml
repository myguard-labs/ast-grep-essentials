id: php-if-empty-statement-body
language: php
severity: warning
message: >-
  This if statement has an empty body (a stray semicolon after the condition),
  so the following statement runs unconditionally.
note: >-
  Syntactic check only. Matches an if whose condition is directly followed by
  an empty statement; it does not verify runtime behavior or intent.
rule:
  pattern: 'if ( $X ) ;'
