id: php-defined-constant-truthiness
language: php
severity: warning
message: >-
  This defined() check is used as a bare condition, so the constant counts as
  enabled whenever it exists, even if its value is false.
note: >-
  Syntactic check only. It matches a bare defined('NAME') call inside a
  parenthesized condition that is not combined with a further && operand in
  the same expression. It does not evaluate the constant's value, resolve
  definitions, or track aliasing.
rule:
  all:
    - pattern: 'defined(''FTP_SSL'')'
    - inside:
        kind: parenthesized_expression
        stopBy: end
    - not:
        inside:
          kind: binary_expression
          stopBy: end
          has:
            pattern: FTP_SSL
