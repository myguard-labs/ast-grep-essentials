id: php-error-suppress-header-call
language: php
severity: warning
message: >-
  This header() call is prefixed with the @ error-suppression operator, which
  hides headers-already-sent warnings.
note: >-
  Matches the literal syntax of an @ operator applied directly to a header()
  call. It does not resolve whether headers were actually already sent or
  whether the function is namespaced or aliased.
rule:
  pattern: '@header($$$ARGS)'
