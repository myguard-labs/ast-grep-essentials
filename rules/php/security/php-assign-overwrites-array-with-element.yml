id: php-assign-overwrites-array-with-element
language: php
severity: warning
message: >-
  This assignment overwrites a variable with an element read from that same
  variable, discarding the array.
note: >-
  Syntactic single-file match only. It flags an assignment whose right-hand
  side is a call with one argument that is an index read of the same literal
  variable name, and does not resolve whether the array is used later,
  aliased, or reassigned.
rule:
  kind: assignment_expression
  all:
    - has:
        field: left
        kind: variable_name
        pattern: '$EXCERPT'
    - has:
        field: right
        kind: function_call_expression
        pattern: 'trim($EXCERPT[1])'
