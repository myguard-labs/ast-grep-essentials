id: php-shortcode-atts-raw-attr-read
language: php
severity: warning
message: >-
  This reads a shortcode attribute from the raw $attr array; use the extracted
  local variable instead so defaults apply.
note: >-
  Syntactic match on a literal $attr['key'] subscript inside a function that
  calls extract(shortcode_atts(...)). It does not resolve whether the key is
  in the defaults array or verify runtime values.
rule:
  pattern: '''file'' === $attr[''link'']'
