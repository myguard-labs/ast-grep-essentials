id: wp-sprintf-untranslated-format-literal
language: php
severity: warning
message: >-
  This sprintf format string is a bare string literal with a % specifier and
  is not wrapped in a translation call; consider wrapping it in __().
note: >-
  Syntactic check only. Matches a direct sprintf call whose first argument is
  a bare string literal containing a % specifier, and skips calls where that
  literal is the direct argument of __(). It does not know whether the output
  is user-visible or whether the format is translated elsewhere.
rule:
  pattern: 'sprintf($FMT, $$$ARGS)'
  all:
    - has:
        kind: string
        regex: '%'
        stopBy: end
    - not:
        has:
          pattern: '__($$$_)'
          stopBy: end
