id: php-preg-replace-anchored-negated-class
language: php
severity: warning
message: >-
  This preg_replace call uses an anchored negated character class with an
  empty replacement, so it removes characters only when the whole subject is
  invalid and can pass mixed-content input through.
note: >-
  Purely syntactic match on a literal preg_replace call whose first argument
  is a single-quoted pattern starting with ^ and ending with $ before the
  closing delimiter, with an empty single-quoted replacement. It does not
  resolve the call target, the subject value, or runtime behavior.
rule:
  kind: function_call_expression
  all:
    - pattern: 'preg_replace($PAT, '''', $SUBJ)'
    - has:
        kind: string
        regex: '^''/\^\[\^.*\]\+\$/i''$'
        stopBy: end
