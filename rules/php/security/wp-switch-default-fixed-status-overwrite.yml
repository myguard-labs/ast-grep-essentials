id: wp-switch-default-fixed-status-overwrite
language: php
severity: warning
message: >-
  A switch default arm overwrites an array element with a fixed string
  literal, discarding the caller-supplied value.
note: >-
  Purely syntactic match on a default arm assigning a string literal to a
  subscript element inside a switch default. It does not check whether the
  existing value was valid or resolve types, aliasing, or guards outside the
  shown syntax.
rule:
  all:
    - pattern: '$ARR[$KEY] = ''draft'';'
    - inside:
        kind: default_statement
        stopBy: end
    - not:
        inside:
          kind: if_statement
          stopBy: end
