id: php-tostring-missing-return-type
language: php
severity: warning
message: >-
  The __toString method is declared without a return type; declare the string
  return type explicitly.
note: >-
  Syntactic check only. Matches a method_declaration named __toString with no
  return_type child; it does not verify class hierarchy, Stringable
  implementation, or runtime behavior.
rule:
  all:
    - kind: method_declaration
    - has:
        field: name
        regex: '^__toString$'
    - not:
        has:
          field: return_type
          kind: primitive_type
