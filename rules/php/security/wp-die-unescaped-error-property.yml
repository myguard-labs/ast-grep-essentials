id: wp-die-unescaped-error-property
language: php
severity: warning
message: >-
  wp_die receives a ->ERROR property directly as its message without an
  escaping function.
note: >-
  Single-file syntactic check on the literal call shape wp_die($x->ERROR). It
  does not resolve the receiver's type or prove the value is server-supplied,
  and it does not track values through variables.
rule:
  pattern: 'wp_die($OBJ->ERROR)'
