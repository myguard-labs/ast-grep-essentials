  taxonomy_source: 'https://cwe.mitre.org/data/definitions/79.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  todo_cases:
    - 'FN (extra wp_die arguments): wp_die( $pop3->ERROR, ''Error'' ) is not matched; the pattern allows one argument.'
