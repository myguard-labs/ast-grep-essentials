id: php-wpdb-escape-call
language: php
severity: warning
message: 'Call to deprecated $wpdb->escape(); use $wpdb->prepare() instead.'
note: >-
  Matches the literal receiver syntax $wpdb->escape(...) without resolving
  types, imports, or aliases; it does not verify that $wpdb is the WordPress
  database object.
rule:
  pattern: '$wpdb->escape($$$ARGS)'
