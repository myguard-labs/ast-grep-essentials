# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-unittest-setup-missing-parent-call
language: php
severity: warning
message: >-
  This setUp method in a WP_UnitTestCase subclass does not call
  parent::setUp().
note: >-
  Single-file syntactic check. It matches a literal setUp method inside a
  class whose text declares extends WP_UnitTestCase and whose body has no
  parent::setUp() call text; it does not resolve inheritance, aliases, or
  runtime behavior.
rule:
  all:
    - kind: method_declaration
    - has:
        field: name
        regex: '^setUp$'
        stopBy: end
    - inside:
        kind: class_declaration
        stopBy: end
        has:
          kind: base_clause
          regex: '^extends\s+WP_UnitTestCase$'
          stopBy: end
    - not:
        has:
          pattern: 'parent::setUp()'
          stopBy: end
