# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-single-quoted-curly-interpolation
language: php
severity: warning
message: >-
  Single-quoted PHP string contains a {$ sequence that will not be
  interpolated; use double quotes or concatenation if interpolation was
  intended.
note: >-
  Syntactic check only. Matches single-quoted string literals containing the
  text {$ and does not verify that interpolation was intended or inspect
  runtime values.
rule:
  kind: string
  regex: '^''[^'']*\{\$'
