id: wp-show-tables-enumeration
language: php
severity: warning
message: >-
  This wpdb get_col() call runs a SHOW TABLES enumeration, which scans every
  table in the database.
note: >-
  Syntactic match only on a literal wpdb receiver and a literal 'SHOW TABLES'
  string argument. It does not resolve types, aliases, or whether the call is
  reachable or costly in context.
rule:
  pattern: '$wpdb->get_col(''SHOW TABLES'')'
