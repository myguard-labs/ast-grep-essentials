id: php-strpos-truthiness-as-boolean
language: php
severity: warning
message: >-
  strpos() result used as a boolean; a match at position 0 is falsy. Compare
  with !== false.
note: >-
  Syntactic only. Matches a strpos() call appearing directly as an
  if-condition. It does not check whether the result is compared elsewhere,
  resolve the function identity, or track values through variables.
rule:
  all:
    - pattern: 'strpos($$$ARGS)'
    - inside:
        kind: parenthesized_expression
        inside:
          kind: if_statement
          stopBy: end
    - not:
        inside:
          kind: binary_expression
          stopBy: end
