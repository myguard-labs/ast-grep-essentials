# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-wpdb-query-result-discarded
language: php
severity: warning
message: >-
  The result of $wpdb->query() is discarded; check it for false to detect
  database failures.
note: >-
  Matches a literal $wpdb->query(...) call used as a bare expression
  statement. It does not resolve the receiver's runtime type or check whether
  the result is handled elsewhere.
rule:
  all:
    - kind: expression_statement
    - has:
        pattern: '$wpdb->query($$$ARGS)'
        stopBy: end
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-252'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/252.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A10:2025'
  todo_cases:
    - 'FP: $r = $wpdb->query("DELETE FROM t"); and $ok = (bool) $wpdb->query(...); are reported although the result is stored or cast (any expression_statement containing the call matches)'
    - 'FP: $wpdb->query("DELETE FROM t") or die("fail"); and ... ?: error_log("fail"); are reported although the failure is handled'
    - 'FN: $this->wpdb->query("DELETE FROM t"); and $GLOBALS[''wpdb'']->query(...) as a bare statement are not matched (literal $wpdb receiver only)'
