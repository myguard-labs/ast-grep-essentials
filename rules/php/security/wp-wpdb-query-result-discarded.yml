id: wp-wpdb-query-result-discarded
language: php
severity: warning
message: >-
  The result of $wpdb->query() is discarded; check it for false to detect
  database failures.
note: >-
  Matches a literal $wpdb->query(...) call used as a bare expression
  statement. It does not resolve the receiver's runtime type or check whether
  the result is handled elsewhere.
rule:
  all:
    - kind: expression_statement
    - has:
        pattern: '$wpdb->query($$$ARGS)'
        stopBy: end
