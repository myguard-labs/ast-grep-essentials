# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-wpdb-query-result-discarded
language: php
severity: warning
message: >-
  The result of $wpdb->query() is discarded; check it for false to detect
  database failures.
note: >-
  Matches a literal $wpdb->query(...) call that is the whole expression
  statement, optionally under the @ operator or parentheses. Stored, cast, compared or
  or/?:-handled results are not matched. It does not resolve the receiver's runtime type or check whether
  the result is handled elsewhere.
rule:
  all:
    - kind: expression_statement
    - has:
        any:
          - pattern: '$wpdb->query($$$ARGS)'
          - any:
              - kind: error_suppression_expression
              - kind: parenthesized_expression
            has:
              pattern: '$wpdb->query($$$ARGS)'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-252'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/252.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A10:2025'
  todo_cases:
    - 'FN: $this->wpdb->query("DELETE FROM t"); and $GLOBALS[''wpdb'']->query(...) as a bare statement are not matched (literal $wpdb receiver only)'
    - 'FN: (@$wpdb->query("DELETE FROM t")); (nested @ inside parentheses) as a bare statement is not matched (only one wrapper level is accepted)'
