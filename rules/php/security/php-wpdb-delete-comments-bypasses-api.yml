id: php-wpdb-delete-comments-bypasses-api
language: php
severity: warning
message: >-
  Raw DELETE against the comments table via wpdb query() bypasses the comment
  delete API and its meta cleanup; use wp_delete_comment() instead.
note: >-
  Matches only a literal $wpdb->query() call whose first argument is a
  double-quoted string literal beginning with DELETE FROM $wpdb->comments. It
  does not resolve variables, aliases, or runtime SQL, so dynamically built or
  differently named queries are not detected.
rule:
  all:
    - pattern: '$wpdb->query($SQL)'
    - has:
        kind: encapsed_string
        regex: '^"DELETE FROM \$wpdb->comments\b'
        stopBy: end
