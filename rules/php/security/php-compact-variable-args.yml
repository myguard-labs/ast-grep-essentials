# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-compact-variable-args
language: php
severity: warning
message: >-
  compact() is called with bare variable arguments; pass quoted variable names
  instead.
note: >-
  Purely syntactic match on a compact() call whose arguments are plain
  variables. It does not resolve runtime values, types, or whether the
  variables are defined.
rule:
  pattern: 'compact($$$ARGS)'
  has:
    kind: variable_name
    stopBy: end
