id: php-dir-concat-missing-separator
language: php
severity: warning
message: >-
  __DIR__ is concatenated with a string literal that does not start with a
  slash; the path may resolve to the wrong file.
note: >-
  Syntactic check only. It matches a literal __DIR__ . "..." concatenation
  whose string literal does not begin with a slash; it does not verify
  intentional suffixes, runtime values, or how the path is used.
rule:
  pattern: '__DIR__ . "$LIT"'
  not:
    regex: '^(?:__DIR__ \. "/)'
