id: wp-url-query-unencoded-interpolation
language: php
severity: warning
message: >-
  Variable interpolated into a hand-built URL query string without encoding;
  wrap it in urlencode() or build the query with http_build_query().
note: >-
  Syntactic match only. Flags double-quoted PHP strings containing a literal
  ?name=$var pattern with an interpolated variable; it does not resolve
  whether the value is already encoded, sanitized, or built elsewhere.
rule:
  kind: encapsed_string
  regex: '\?[A-Za-z_][A-Za-z0-9_]*=\$[A-Za-z_]'
