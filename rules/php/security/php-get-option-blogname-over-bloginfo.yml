id: php-get-option-blogname-over-bloginfo
language: php
severity: warning
message: >-
  get_option('blogname') is used for the site name; consider
  get_bloginfo('name') instead.
note: >-
  Matches the literal call shape get_option with the string key 'blogname'
  only. It does not resolve function identity, namespaces, or whether a
  filter-aware accessor is intended at runtime.
rule:
  pattern: 'get_option(''blogname'')'
