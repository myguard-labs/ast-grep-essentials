id: wp-template-stylesheet-path-compare
language: php
severity: warning
message: >-
  Comparing TEMPLATEPATH with STYLESHEETPATH to detect a child theme is
  fragile; use is_child_theme() instead.
note: >-
  Matches only the literal equality comparison of the TEMPLATEPATH and
  STYLESHEETPATH constants syntactically inside an if condition. It does not
  resolve runtime values, constant definitions, or whether the code is a child
  theme check.
rule:
  pattern: 'if ( TEMPLATEPATH == STYLESHEETPATH ) $$$BODY'
