# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-hardcoded-http-scheme-literal
language: php
severity: warning
message: >-
  A hardcoded 'http://' scheme literal is concatenated into a URL; derive the
  scheme from site configuration instead.
note: >-
  Syntactic match only on a string literal beginning with 'http://' used as
  the left operand of a concatenation. It does not resolve whether the result
  is a site URL or whether the scheme is configured elsewhere.
rule:
  pattern: '''http://'' . $X'
