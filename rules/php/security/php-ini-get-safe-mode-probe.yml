# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-ini-get-safe-mode-probe
language: php
severity: warning
message: >-
  This reads the removed 'safe_mode' PHP directive, which is always unset on
  current PHP.
note: >-
  Matches a literal ini_get call with the single string argument 'safe_mode'
  by syntax only; does not resolve function identity, namespaces, or runtime
  configuration.
rule:
  pattern: 'ini_get(''safe_mode'')'
