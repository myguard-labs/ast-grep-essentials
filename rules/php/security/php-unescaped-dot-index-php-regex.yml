# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-unescaped-dot-index-php-regex
language: php
severity: warning
message: >-
  This preg_replace() pattern hardcodes index.php with an unescaped dot, so
  the dot matches any character.
note: >-
  Syntactic match on a literal preg_replace() pattern string containing
  index.php with an unescaped dot. It does not resolve runtime values,
  variables, or whether the pattern is used for paths.
rule:
  pattern: 'preg_replace(''|/index.php$|'', $$$ARGS)'
