id: php-magic-quotes-escape-without-stripslashes
language: php
severity: warning
message: >-
  Escaping function wraps a direct request superglobal element without
  stripslashes.
note: >-
  Matches only the literal text of an esc_attr or esc_html call whose sole
  argument is a direct POST or GET subscript. It does not resolve aliases,
  prior sanitization, or runtime magic-quotes state.
rule:
  kind: function_call_expression
  regex: '^esc_(attr|html)\(\s*\$_(POST|GET)\[[^\]]*\]\s*\)$'
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
