id: php-error-suppress-array-access
language: php
severity: warning
message: >-
  Error suppression (@) is applied to an array element access; check the key
  with isset() instead.
note: >-
  Purely syntactic match on a literal @ applied to a variable array subscript.
  It does not resolve whether the key is missing, the variable's type, or
  whether other errors are being hidden.
rule:
  pattern: '@$ARR[$KEY]'
