id: wp-admin-bar-add-menu-without-id
language: php
severity: warning
message: >-
  This add_menu() array literal has no 'id' key; add a stable id so the item
  can be targeted later.
note: >-
  Syntactic check only. Matches a literal $wp_admin_bar->add_menu() call whose
  array argument lacks an 'id' key by text; it does not resolve the receiver
  type or verify the array contents beyond the shown pattern.
rule:
  all:
    - pattern: '$wp_admin_bar->add_menu(array($$$ARGS))'
    - not:
        has:
          pattern: '''id'' => $$$V'
          stopBy: end
