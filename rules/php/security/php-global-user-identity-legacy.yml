id: php-global-user-identity-legacy
language: php
severity: warning
message: >-
  This global statement declares the legacy variable $user_identity, which
  core no longer sets; the value may be undefined or stale.
note: >-
  Matches only the literal global statement naming $user_identity in this
  file. It does not verify that core stopped populating the variable or check
  any runtime value, type, or alias.
rule:
  pattern: 'global $user_identity;'
