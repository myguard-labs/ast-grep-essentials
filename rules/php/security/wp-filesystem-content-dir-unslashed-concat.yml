id: wp-filesystem-content-dir-unslashed-concat
language: php
severity: warning
message: >-
  The wp_content_dir() return value is concatenated directly without
  trailingslashit().
note: >-
  Syntactic single-file check only. It matches a literal
  $wp_filesystem->wp_content_dir() receiver with no arguments used as the left
  operand of a concatenation; it does not resolve types or confirm the
  returned path lacks a trailing slash.
rule:
  pattern: '$wp_filesystem->wp_content_dir() . $RHS'
