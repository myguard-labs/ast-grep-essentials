id: php-this-in-static-closure
language: php
severity: warning
message: >-
  A static closure references $this in its body, which is unavailable at
  runtime.
note: >-
  Matches syntactically a static closure node containing a $this variable
  anywhere in its body; does not resolve nested closures, bindings, or runtime
  behaviour.
rule:
  kind: anonymous_function
  all:
    - has:
        kind: static_modifier
    - has:
        pattern: '$this'
        stopBy: end
