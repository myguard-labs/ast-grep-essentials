id: wp-sql-unqualified-id-concat
language: php
severity: warning
message: >-
  Unqualified ID column in a concatenated SQL WHERE fragment; qualify it with
  the table name to avoid ambiguity in joined queries.
note: >-
  Purely syntactic check for a string literal ending in an unqualified " AND
  ID = " concatenated with a variable. It does not resolve joins, schema, or
  runtime values, so it cannot confirm that the query is actually joined or
  that ambiguity occurs.
rule:
  pattern: ''' AND ID = '' . $VAR'
