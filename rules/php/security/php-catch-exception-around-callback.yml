id: php-catch-exception-around-callback
language: php
severity: warning
message: >-
  This catch clause catches Exception but not Error, so a PHP Error thrown by
  the callback can escape the handler. Consider catching Throwable.
note: >-
  Purely syntactic match on a literal catch (Exception $e) clause; it does not
  resolve types, namespaces, or whether the try body can actually throw an
  Error, and it does not inspect the callback.
rule:
  pattern: |
    try { $$$BODY } catch ( Exception $E ) { $$$HANDLER }
