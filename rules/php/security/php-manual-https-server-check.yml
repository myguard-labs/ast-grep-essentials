id: php-manual-https-server-check
language: php
severity: warning
message: >-
  Hand-rolled HTTPS detection via strtolower on the HTTPS server variable;
  consider is_ssl() instead.
note: >-
  Matches only the literal strtolower call on the HTTPS superglobal element;
  it does not verify the comparison to 'on' or whether is_ssl() is available.
rule:
  all:
    - kind: function_call_expression
    - regex: '^strtolower\(\s*\$_SERVER\[\s*[''"]HTTPS[''"]\s*\]\s*\)$'
metadata:
