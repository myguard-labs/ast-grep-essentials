id: php-concat-result-discarded
language: php
severity: warning
message: This string concatenation result is computed and then discarded.
note: >-
  Syntactic check only. It matches a bare expression statement whose top-level
  expression is a '.' concatenation; it does not verify runtime values, types,
  or whether a side effect exists elsewhere.
rule:
  kind: expression_statement
  has:
    kind: binary_expression
    pattern: '$A . $B'
