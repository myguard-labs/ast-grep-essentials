id: wp-deprecated-version-float-literal
language: php
severity: warning
message: >-
  The version argument of _deprecated_function() is a numeric literal; pass it
  as a quoted string.
note: >-
  Matches a literal numeric second argument syntactically. It does not verify
  the function is the WordPress core function or resolve aliases, imports, or
  runtime values.
rule:
  kind: function_call_expression
  all:
    - has:
        field: function
        regex: '^_deprecated_function$'
    - has:
        field: arguments
        has:
          kind: argument
          nthChild: 2
          has:
            kind: float
