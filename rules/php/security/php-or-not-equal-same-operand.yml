id: php-or-not-equal-same-operand
language: php
severity: warning
message: >-
  Two inequality checks on the same operand against different literals are
  joined by '||', so the condition is always true.
note: >-
  Purely syntactic single-file match on a parenthesized if condition with a
  '$var' operand compared with '!=' against two string literals joined by
  '||'. Does not resolve types, values, aliasing, or reachability.
rule:
  pattern: 'if ( ''$A'' != $X || ''$B'' != $X ) { $$$BODY }'
