id: php-self-closing-div-markup
language: php
severity: warning
message: >-
  Self-closing div tag found in a PHP string; div is not a void element, so
  use an explicit closing tag.
note: >-
  Matches only a single-quoted PHP string literal whose text starts with a div
  start tag and ends with "/>". It does not parse HTML, resolve whether the
  string is output, or verify context such as comments.
rule:
  kind: string
  regex: '^''<div\b[^'']*/>''$'
