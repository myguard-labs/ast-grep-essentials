# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-mysql-ext-removed-function-call
language: php
severity: warning
message: 'Direct call to a removed mysql_* function; ext/mysql was removed in PHP 7.0.'
note: >-
  Matches the literal function-name syntax mysql_query( and similar direct
  calls only. It does not verify that the called function is defined by
  ext/mysql, resolve namespaces or aliases, or check runtime PHP version.
rule:
  pattern: 'mysql_query($$$ARGS)'
