id: php-date-format-literal-untranslated
language: php
severity: warning
message: >-
  Date format literal passed to get_the_date() inside a translated label; wrap
  the format in _x() for translator context.
note: >-
  Syntactic match only. Flags a get_the_date() call with a bare string-literal
  first argument nested inside a printf(__()) call. Does not resolve function
  identity, imports, or whether the label is actually translated at runtime.
rule:
  pattern: 'get_the_date(''$FMT'')'
  inside:
    pattern: 'printf(__($$$LABEL), $$$ARGS)'
    stopBy: end
