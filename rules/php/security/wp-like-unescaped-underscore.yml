id: wp-like-unescaped-underscore
language: php
severity: warning
message: >-
  Unescaped underscore in a SQL LIKE pattern matches any single character;
  escape it as \_.
note: >-
  Single-file syntactic match on a string literal containing LIKE followed by
  a bare underscore. It does not resolve whether the string reaches a database
  query or whether escaping is applied elsewhere.
rule:
  kind: string_content
  regex: 'LIKE\s+''_'
