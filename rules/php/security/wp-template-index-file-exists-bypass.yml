id: wp-template-index-file-exists-bypass
language: php
severity: warning
message: >-
  Hardcoded TEMPLATEPATH index.php check bypasses the get_index_template()
  lookup that honours child themes.
note: >-
  Matches only the literal TEMPLATEPATH . '/index.php' concatenation inside a
  file_exists() call. It does not resolve runtime values, child-theme state,
  or whether the path is used as a template.
rule:
  pattern: 'file_exists(TEMPLATEPATH . ''/index.php'')'
