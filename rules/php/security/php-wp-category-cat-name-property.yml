id: php-wp-category-cat-name-property
language: php
severity: warning
message: 'Deprecated ->cat_name property read; use ->name instead.'
note: >-
  Single-file syntactic match on a literal receiver with the property name
  cat_name. It does not verify that the receiver is a WordPress category or
  term object and does not resolve types or aliases.
rule:
  pattern: '$OBJ->cat_name'
