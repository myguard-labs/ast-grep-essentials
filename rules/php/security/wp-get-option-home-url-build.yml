id: wp-get-option-home-url-build
language: php
severity: warning
message: >-
  Building a URL by concatenating get_option('home') bypasses home_url(); use
  home_url() instead.
note: >-
  Syntactic match only on a literal get_option('home') call used as the left
  operand of string concatenation. It does not resolve runtime values,
  filters, or whether the concatenated result is actually a URL.
rule:
  pattern: 'get_option(''home'') . $_'
