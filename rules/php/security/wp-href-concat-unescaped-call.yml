# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-href-concat-unescaped-call
language: php
severity: warning
message: >-
  A direct function call result is concatenated after an href attribute
  literal without esc_url().
note: >-
  Purely syntactic single-file match on a single-quoted literal ending in
  href=" followed by a concatenated direct call; it does not resolve what the
  called function returns or whether the value is already safe.
rule:
  pattern: '''<link rel="alternate" href="'' . $CALL'
  not:
    pattern: '''<link rel="alternate" href="'' . esc_url($$$ARGS)'
