id: php-deprecated-mysql-function-call
language: php
severity: warning
message: >-
  Direct call to a removed or deprecated mysql_* function; migrate to mysqli
  or PDO.
note: >-
  Matches only a direct bare call whose function name starts with mysql_ in
  the shown syntax. It does not resolve namespaces, imports, aliases, or
  whether the function exists at runtime.
rule:
  kind: function_call_expression
  has:
    field: function
    regex: '^mysql_'
