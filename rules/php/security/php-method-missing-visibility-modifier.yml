id: php-method-missing-visibility-modifier
language: php
severity: warning
message: >-
  Class method is declared without an explicit visibility modifier; add
  public, protected, or private.
note: >-
  Purely syntactic check for a method declaration with no visibility_modifier
  child. It does not resolve inheritance, traits, or runtime behaviour, and
  does not verify the implicit public default's effect on the API.
rule:
  kind: method_declaration
  not:
    has:
      kind: visibility_modifier
      stopBy: end
