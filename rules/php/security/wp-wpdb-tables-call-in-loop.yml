id: wp-wpdb-tables-call-in-loop
language: php
severity: warning
message: >-
  This $wpdb->tables() call with a constant argument is inside a loop; hoist
  it out so the list is not rebuilt on every iteration.
note: >-
  Syntactic check only. It matches a literal $wpdb->tables( ... ) call inside
  a foreach body and does not verify the receiver's type, the argument's
  runtime value, or that the result is unchanged across iterations.
rule:
  pattern: '$wpdb->tables($ARG)'
  inside:
    kind: foreach_statement
    stopBy: end
