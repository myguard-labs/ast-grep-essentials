id: wp-function-post-without-global
language: php
severity: warning
message: >-
  This function reads $post without declaring global $post or receiving it as
  a parameter.
note: >-
  Syntactic single-file check only. It flags any function whose body contains
  a $post variable without a global $post statement or a $post parameter in
  the function header; it does not verify runtime scope, assignments, or
  whether the function is called in a WordPress context.
rule:
  all:
    - pattern: '$post'
    - inside:
        kind: function_definition
        stopBy: end
    - not:
        inside:
          kind: function_definition
          stopBy: end
          has:
            pattern: 'global $post'
            stopBy: end
