id: wp-hand-built-delete-post-url
language: php
severity: warning
message: >-
  Build the delete-post link with get_delete_post_link() instead of
  hand-assembling it with add_query_arg() and wp_nonce_url().
note: >-
  Syntactic match only. Flags a wp_nonce_url() call whose first argument is a
  direct add_query_arg() call; it does not verify the action names, the post
  ID source, or runtime values.
rule:
  pattern: 'wp_nonce_url(add_query_arg($$$ARGS), $NONCE)'
