id: php-single-quoted-backslash-double-quote
language: php
severity: warning
message: >-
  Single-quoted PHP string contains a backslash before a double quote, so the
  backslash is kept literally. Check for a stray escape in emitted markup.
note: >-
  Syntactic match only on single-quoted string literal text containing
  backslash followed by double quote. It does not verify that the string is
  emitted as HTML or that the backslash is unintended.
rule:
  kind: string
  pattern: '''$$$'''
  regex: '^''.*\\".*''$'
