id: php-byref-function-returns-call
language: php
severity: warning
message: >-
  A function declared to return by reference returns a function-call result
  directly; assign it to a variable first.
note: >-
  Syntactic single-file check only. Matches a by-reference function whose
  return statement directly returns a call expression; it does not resolve
  whether the callee actually returns by reference or inspect runtime values.
rule:
  all:
    - kind: function_definition
    - has:
        kind: reference_modifier
        stopBy: end
    - has:
        kind: return_statement
        stopBy: end
        has:
          kind: function_call_expression
          stopBy: end
