id: php-error-suppression-operator-call
language: php
severity: warning
message: >-
  This function call is prefixed with the @ error-suppression operator, which
  hides its warnings and errors. Consider an explicit check instead.
note: >-
  Matches the literal @ operator applied directly to a call syntactically; it
  does not resolve the callee, check whether errors are handled elsewhere, or
  account for runtime behavior.
rule:
  pattern: '@error_log($$$ARGS)'
