# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-array-key-dollar-literal
language: php
severity: warning
message: >-
  Single-quoted array key starts with a dollar sign; this reads a literal key
  named with '$' and may be a typo for a variable.
note: >-
  Purely syntactic check on a single-quoted string literal key beginning with
  $ inside a subscript. Does not verify the array's contents, runtime keys, or
  whether the key is intentionally literal.
rule:
  kind: subscript_expression
  has:
    kind: string
    regex: '^''\$'
