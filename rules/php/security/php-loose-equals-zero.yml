# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-loose-equals-zero
language: php
severity: warning
message: >-
  Loose comparison with integer 0 may match false, null or empty values;
  consider a strict comparison.
note: >-
  Matches the literal syntax of a binary == comparison whose right operand is
  the integer literal 0. It does not resolve types or runtime values, so it
  cannot confirm that the left operand can actually be false or null.
rule:
  pattern: '$A == 0'
