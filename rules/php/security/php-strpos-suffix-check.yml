id: php-strpos-suffix-check
language: php
severity: warning
message: >-
  Loose comparison of strpos() with strlen() minus a constant is used as an
  end-of-string test; strpos returns the first match, so this can be wrong.
note: >-
  Purely syntactic check on the literal shape strpos(H, N) == strlen(H) - K.
  It does not resolve types, values, or whether the comparison is loose at
  runtime beyond the written operator.
rule:
  pattern: 'strpos($H, $N) == strlen($H) - $K'
