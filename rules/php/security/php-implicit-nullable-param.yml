id: php-implicit-nullable-param
language: php
severity: warning
message: >-
  Typed parameter with a null default lacks an explicit nullable type; add a
  leading ? to the type.
note: >-
  Syntactic check only. Matches a literal array type hint with a null default
  on a parameter; it does not resolve class types, unions, or runtime
  behavior.
rule:
  pattern: 'function $NAME( array $ARG = null ) {}'
