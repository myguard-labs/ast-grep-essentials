# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-bitwise-or-between-boolean-calls
language: php
severity: warning
message: >-
  Bitwise | between two preg_match() calls in a condition; logical || was
  likely intended.
note: >-
  Single-file syntactic match on a binary | expression whose both operands are
  preg_match() calls. Does not verify return types or runtime values.
rule:
  pattern: 'preg_match($$$A) | preg_match($$$B)'
