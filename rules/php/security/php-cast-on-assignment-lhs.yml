id: php-cast-on-assignment-lhs
language: php
severity: warning
message: >-
  A cast is applied to the left-hand side of an assignment; move the cast to
  the right-hand side expression.
note: >-
  Syntactic check only. It matches an assignment whose left operand is a
  parenthesized cast node and does not evaluate types, aliasing, or runtime
  behavior.
rule:
  kind: assignment_expression
  has:
    field: left
    kind: cast_expression
