# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-mktime-substr-argument-uncast
language: php
severity: warning
message: 'A bare substr() call is passed to mktime() without an (int) cast.'
note: >-
  Matches only the literal syntax mktime(substr(...), ...) with a direct
  substr call as an argument; it does not resolve function identity, types, or
  whether the cast is applied elsewhere.
rule:
  pattern: 'mktime(substr($$$SUBARGS), $$$REST)'
