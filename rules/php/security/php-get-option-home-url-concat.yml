id: php-get-option-home-url-concat
language: php
severity: warning
message: >-
  Hand-joining the home option with a path string builds a URL that bypasses
  site_url()/home_url() filters.
note: >-
  Matches the literal syntax of a binary concatenation whose left operand is a
  single-quoted get_option('home') call. It does not resolve runtime values,
  aliases, or whether the option is the home option at runtime, and does not
  check that the result is used as a URL.
rule:
  pattern: 'get_option(''home'') . $RIGHT'
