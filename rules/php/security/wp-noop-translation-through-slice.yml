id: wp-noop-translation-through-slice
language: php
severity: warning
message: >-
  A _n_noop() call is passed directly to wp_array_slice_assoc(), so its
  strings are not translated at this call site.
note: >-
  Matches the literal call syntax wp_array_slice_assoc(_n_noop(...)) only. It
  does not resolve function identity, imports, or runtime values, and does not
  check whether the strings are later translated elsewhere.
rule:
  pattern: 'wp_array_slice_assoc(_n_noop($$$ARGS), $$$REST)'
