id: wp-sql-get-post-types-unfiltered
language: php
severity: warning
message: >-
  get_post_types() is called with no arguments and its result is concatenated
  into a SQL IN list; pass explicit arguments to make the post type set
  deliberate.
note: >-
  Single-file syntactic match on a zero-argument get_post_types() call
  concatenated into a string literal. It does not resolve types, aliases, or
  whether the query is reachable or sanitized elsewhere.
rule:
  pattern: 'join( "'', ''", get_post_types() )'
