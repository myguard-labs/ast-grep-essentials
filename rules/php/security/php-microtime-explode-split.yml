# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-microtime-explode-split
language: php
severity: warning
message: >-
  This splits microtime() output on a space to compute elapsed time;
  microtime(true) returns a float directly.
note: >-
  Matches only the literal call shape explode(' ', microtime()) with no
  argument to microtime. It does not resolve types, aliases, or whether the
  parts are later used for timing.
rule:
  pattern: 'explode('' '', microtime())'
