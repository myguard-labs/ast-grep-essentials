# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-unquoted-bare-array-key
language: php
severity: warning
message: >-
  Array subscript uses a bare identifier as its key; this is a constant
  lookup, not a string key. Quote the key if a string was intended.
note: >-
  Syntactic match only on a subscript whose index is a bare name. It cannot
  tell whether a constant of that name is intentionally defined, and does not
  resolve types or scope.
rule:
  pattern: '$Q[s]'
