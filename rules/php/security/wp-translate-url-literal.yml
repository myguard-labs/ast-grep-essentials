id: wp-translate-url-literal
language: php
severity: warning
message: >-
  Avoid wrapping a URL string literal in a translation call; translators may
  alter or break the link.
note: >-
  This is a single-file syntactic match on a literal call to __() whose first
  argument is a string literal beginning with http:// or https://. It does not
  resolve whether the function is WordPress's translation function or whether
  the string is later used as a link.
rule:
  pattern: '__( $URL )'
  all:
    - has:
        kind: string
        regex: '^[''"]https?://'
        stopBy: end
