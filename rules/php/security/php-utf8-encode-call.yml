id: php-utf8-encode-call
language: php
severity: warning
message: >-
  Call to deprecated utf8_encode(); it assumes ISO-8859-1 input and
  double-encodes data already in UTF-8.
note: >-
  Matches the literal direct call syntax utf8_encode(...) only; it does not
  resolve namespaces, aliases, or whether the argument is actually Latin-1.
rule:
  pattern: 'utf8_encode($$$ARGS)'
