id: php-ob-end-clean-after-ob-get-clean
language: php
severity: warning
message: >-
  ob_end_clean() directly follows ob_get_clean(), so it targets a buffer that
  was already closed.
note: >-
  Single-file syntactic match on a literal ob_end_clean() expression statement
  whose immediately preceding sibling statement is a literal ob_get_clean()
  call. Does not resolve runtime buffer state, nested buffers, or whether the
  calls share a scope.
rule:
  pattern: 'ob_end_clean()'
  inside:
    kind: expression_statement
    follows:
      kind: expression_statement
      has:
        pattern: 'ob_get_clean()'
        stopBy: end
    stopBy: neighbor
