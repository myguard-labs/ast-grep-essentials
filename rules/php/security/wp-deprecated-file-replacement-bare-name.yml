id: wp-deprecated-file-replacement-bare-name
language: php
severity: warning
message: >-
  The replacement argument of _deprecated_file() is a bare filename string;
  use a full path built from WPINC.
note: >-
  Syntactic check only. Matches a _deprecated_file call whose third argument
  is a plain string literal; it does not resolve constants, includes, or
  runtime values.
rule:
  pattern: '_deprecated_file($A, $B, ''$REPLACEMENT'')'
