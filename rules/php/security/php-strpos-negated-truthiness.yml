id: php-strpos-negated-truthiness
language: php
severity: warning
message: >-
  Negating a strpos() result with ! treats a match at position 0 as not found;
  compare explicitly with false instead.
note: >-
  Syntactic match only. Flags a unary ! applied directly to a strpos() call
  with a literal function name; does not resolve namespaces, aliases, or
  runtime values, and does not check whether the position can be 0.
rule:
  pattern: '! strpos($$$ARGS)'
