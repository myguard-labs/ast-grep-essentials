id: php-plugindir-legacy-constant
language: php
severity: warning
message: Use WP_PLUGIN_DIR instead of the legacy PLUGINDIR constant.
note: >-
  Matches the literal constant name PLUGINDIR syntactically; does not verify
  that the constant is defined or resolve namespaces or aliases.
rule:
  pattern: PLUGINDIR
