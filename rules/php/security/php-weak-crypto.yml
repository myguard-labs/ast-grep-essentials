# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-weak-crypto
language: php
severity: warning
message: >-
  Weak hash, salt-dependent crypt call, or predictable random-value generator
  requires security review. Use password_hash/password_verify for passwords
  and random_bytes/random_int for security tokens.
note: >-
  Matches direct function-call syntax only, including hash calls whose first
  argument is a literal md5 or sha1 algorithm. Does not establish password or
  token use, resolve function names, or evaluate dynamic algorithm arguments.
  Non-secret checksums can be legitimate, and crypt strength depends on its
  salt-selected algorithm and cost.
rule:
  all:
    - kind: function_call_expression
    - has:
        field: function
        regex: '(?i)^\\?(md5|sha1|crypt|mt_rand|rand|uniqid|hash)$'
    - not:
        all:
          - has:
              field: function
              regex: '(?i)^\\?hash$'
          - not:
              has:
                field: arguments
                has:
                  nthChild: 1
                  regex: '(?i)^["''](md5|sha1)["'']$'
