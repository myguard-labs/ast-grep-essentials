id: wp-wpdb-prepare-concatenated-query
language: php
severity: warning
message: >-
  $wpdb->prepare() is called with a concatenated query string instead of a
  literal template; review for SQL injection.
note: >-
  Purely syntactic check on a literal $wpdb receiver. It does not resolve
  types, aliases, or whether the concatenated parts are actually
  user-controlled.
rule:
  pattern: '$wpdb->prepare($A . $$$REST)'
