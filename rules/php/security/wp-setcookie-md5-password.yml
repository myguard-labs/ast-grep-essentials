# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-setcookie-md5-password
language: php
severity: warning
message: >-
  A cookie value is set to md5() of a variable; review whether a credential
  hash is stored client-side.
note: >-
  Syntactic match only. Matches a direct setcookie() call whose second
  argument is a direct md5() call on a variable; does not verify that the
  variable holds a credential or resolve aliases or types.
rule:
  pattern: 'setcookie($NAME, md5($VAR), $$$REST)'
