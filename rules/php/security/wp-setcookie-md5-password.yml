# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-setcookie-md5-password
language: php
severity: warning
message: >-
  A cookie value is set to md5() of a variable; review whether a credential
  hash is stored client-side.
note: >-
  Syntactic match only. Matches a direct setcookie() call whose second
  argument is a direct md5() call on a variable; does not verify that the
  variable holds a credential or resolve aliases or types.
rule:
  pattern: 'setcookie($NAME, md5($VAR), $$$REST)'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-328|CWE-315'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/328.html|https://cwe.mitre.org/data/definitions/315.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A02:2025|A04:2025'
  todo_cases:
    - "<?php setcookie('wp_pass', md5($pass));"
    - "<?php setcookie(name: 'wp_pass', value: md5($pass));"
