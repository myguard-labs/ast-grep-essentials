# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-unquoted-server-key
language: php
severity: warning
message: >-
  The server superglobal is indexed with a bare identifier instead of a quoted
  string key.
note: >-
  Matches only the literal superglobal subscript syntax with a bare name as
  the key; it does not check whether a constant with that name is defined.
rule:
  kind: subscript_expression
  all:
    - has:
        kind: variable_name
        regex: '^\$_SERVER$'
    - has:
        kind: name
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
