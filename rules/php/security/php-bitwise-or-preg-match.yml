id: php-bitwise-or-preg-match
language: php
severity: warning
message: >-
  Two preg_match() calls are joined with bitwise | instead of logical ||; both
  regexes always run and the result is an integer.
note: >-
  Purely syntactic check for a binary | whose operands are both direct
  preg_match() calls. It does not resolve functions, types, or runtime values,
  and does not check the surrounding if-condition beyond the operator shape.
rule:
  kind: binary_expression
  all:
    - has:
        kind: function_call_expression
        pattern: 'preg_match($$$ARGS)'
    - pattern: '$A | $B'
    - has:
        pattern: 'preg_match($$$X)'
        stopBy: end
