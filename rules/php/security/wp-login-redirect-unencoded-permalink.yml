id: wp-login-redirect-unencoded-permalink
language: php
severity: warning
message: >-
  The redirect_to query value is concatenated with a permalink return value
  without urlencode().
note: >-
  Syntactic check only. It matches a literal get_permalink() or
  the_permalink() call concatenated directly after a redirect_to= string in a
  single expression; it does not resolve variables, aliases, or runtime
  values.
rule:
  pattern: '$A . ''/wp-login.php?redirect_to='' . get_permalink()'
