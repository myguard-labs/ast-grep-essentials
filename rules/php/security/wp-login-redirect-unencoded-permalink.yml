# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-login-redirect-unencoded-permalink
language: php
severity: warning
message: >-
  The redirect_to query value is concatenated with a permalink return value
  without urlencode().
note: >-
  Syntactic check only. It matches a literal get_permalink() or
  the_permalink() call concatenated directly after a redirect_to= string in a
  single expression; it does not resolve variables, aliases, or runtime
  values.
rule:
  pattern: '$A . ''/wp-login.php?redirect_to='' . get_permalink()'
metadata:
  todo_cases:
    - 'Not reported: the_permalink() after redirect_to=, $b . ''/wp-login.php?redirect_to='' . the_permalink();'
    - 'Not reported: get_permalink with an argument, $b . ''/wp-login.php?redirect_to='' . get_permalink($id);'
    - 'Not reported: no left operand, ''/wp-login.php?redirect_to='' . get_permalink();'
    - 'Not reported: a double-quoted login string, $b . "/wp-login.php?redirect_to=" . get_permalink();'
    - 'Not reported: redirect_to after another query parameter, $b . ''/wp-login.php?action=register&redirect_to='' . get_permalink();'
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
