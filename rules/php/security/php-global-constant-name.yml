id: php-global-constant-name
language: php
severity: warning
message: 'A global statement names a bare identifier instead of a $variable.'
note: >-
  Text-based syntactic match on a function or block body containing a line
  that starts with global followed by a bare identifier; it does not check
  whether the identifier is a defined constant, may also match text inside
  strings or comments, and only covers the first name in the statement.
rule:
  kind: compound_statement
  regex: '(?m)^\s*global\s+[A-Za-z_]'
