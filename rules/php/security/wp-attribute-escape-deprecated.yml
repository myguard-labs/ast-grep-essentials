id: wp-attribute-escape-deprecated
language: php
severity: warning
message: 'Replace the deprecated attribute_escape() call with esc_attr().'
note: >-
  Matches only the literal unqualified call syntax attribute_escape(...) in a
  single file; it does not resolve whether the function is the WordPress alias
  at runtime.
rule:
  pattern: 'attribute_escape($$$ARGS)'
