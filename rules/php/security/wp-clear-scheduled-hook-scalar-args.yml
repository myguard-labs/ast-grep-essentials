id: wp-clear-scheduled-hook-scalar-args
language: php
severity: warning
message: >-
  wp_clear_scheduled_hook() second argument is not an array literal; the args
  may not match the scheduled event.
note: >-
  Syntactic check only. Flags any second argument that is not written as an
  array( ) literal, so a variable that already holds an array will also be
  flagged. Does not resolve types or values.
rule:
  pattern: 'wp_clear_scheduled_hook($HOOK, $ARG)'
  not:
    pattern: 'wp_clear_scheduled_hook($HOOK, array($$$ITEMS))'
