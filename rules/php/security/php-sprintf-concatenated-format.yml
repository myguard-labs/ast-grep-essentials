# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-sprintf-concatenated-format
language: php
severity: warning
message: >-
  A sprintf/printf format string is built by concatenating a variable into the
  literal; % sequences in that value will be parsed as format directives.
note: >-
  Syntactic match only. It flags a sprintf or printf call whose first argument
  is a binary concatenation involving a string literal and a variable. It does
  not resolve types, runtime values, or whether the variable is
  user-controlled.
rule:
  pattern: 'sprintf($A . $B)'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-134'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/134.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "FP: $m = sprintf('abc' . 'def'); is reported although both operands are string literals and no variable is concatenated."
    - "FN (printf): printf('Error: ' . $cmd); is not matched although the note names printf."
    - "FN (namespaced call): $m = \\sprintf($prefix . '%d items'); is not matched."
