id: php-sprintf-concatenated-format
language: php
severity: warning
message: >-
  A sprintf/printf format string is built by concatenating a variable into the
  literal; % sequences in that value will be parsed as format directives.
note: >-
  Syntactic match only. It flags a sprintf or printf call whose first argument
  is a binary concatenation involving a string literal and a variable. It does
  not resolve types, runtime values, or whether the variable is
  user-controlled.
rule:
  pattern: 'sprintf($A . $B)'
