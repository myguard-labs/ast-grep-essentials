# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-phpinfo-call
language: php
severity: warning
message: >-
  Direct call to phpinfo() renders full server configuration; do not expose it
  from request code.
note: >-
  Matches the literal unqualified call syntax phpinfo(...) only; does not
  resolve namespaces, aliases, or whether the call is reachable from a
  request.
rule:
  pattern: 'phpinfo($$$ARGS)'
