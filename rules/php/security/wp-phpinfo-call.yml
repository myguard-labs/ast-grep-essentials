# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-phpinfo-call
language: php
severity: warning
message: >-
  Direct call to phpinfo() renders full server configuration; do not expose it
  from request code.
note: >-
  Matches the literal unqualified call syntax phpinfo(...) only; does not
  resolve namespaces, aliases, or whether the call is reachable from a
  request.
rule:
  pattern: 'phpinfo($$$ARGS)'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-215|CWE-200'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/215.html|https://cwe.mitre.org/data/definitions/200.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A01:2025|A10:2025'
  todo_cases:
    - "<?php PHPINFO();"
    - "<?php \\phpinfo();"
