# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-discarded-mail-send-result
language: php
severity: warning
message: >-
  The boolean result of a Send() call on a mailer object is discarded; check
  or return it.
note: >-
  Matches the literal receiver syntax $x->Send() used as a bare expression
  statement. It does not resolve types, confirm the object is a mailer, or
  prove the result is unused in every context.
rule:
  all:
    - pattern: '$RECV->Send()'
    - inside:
        kind: expression_statement
        stopBy: end
    - not:
        inside:
          kind: return_statement
          stopBy: end
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-252'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/252.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A10:2025'
  known_false_positives: '$ok = $mail->Send(); is reported although the result is stored in $ok (any expression statement ancestor matches)'
  todo_cases:
    - "FN (case): $mail->send(); is not matched; PHP method names are case-insensitive."
    - "FN (nullsafe): $mail?->Send(); is not matched."
