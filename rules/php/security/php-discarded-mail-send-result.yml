id: php-discarded-mail-send-result
language: php
severity: warning
message: >-
  The boolean result of a Send() call on a mailer object is discarded; check
  or return it.
note: >-
  Matches the literal receiver syntax $x->Send() used as a bare expression
  statement. It does not resolve types, confirm the object is a mailer, or
  prove the result is unused in every context.
rule:
  all:
    - pattern: '$RECV->Send()'
    - inside:
        kind: expression_statement
        stopBy: end
    - not:
        inside:
          kind: return_statement
          stopBy: end
