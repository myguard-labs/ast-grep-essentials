id: php-include-error-suppressed
language: php
severity: warning
message: >-
  Error suppression (@) on an include expression hides load failures; check
  the file explicitly instead.
note: >-
  Syntactic match only. It flags an include or include_once expression
  directly wrapped by the @ operator; it does not resolve whether the included
  file is missing or whether errors are handled elsewhere.
rule:
  pattern: '@include_once $ARG'
