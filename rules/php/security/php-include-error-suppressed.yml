id: php-include-error-suppressed
language: php
severity: warning
message: >-
  Error suppression (@) on an include expression hides load failures; check
  the file explicitly instead.
note: >-
  Syntactic match only. It flags an include or include_once expression
  directly wrapped by the @ operator; it does not resolve whether the included
  file is missing or whether errors are handled elsewhere.
rule:
  pattern: '@include_once $ARG'
metadata:
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-390'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/390.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A10:2025'
  todo_cases:
    - "<?php $ok = @include $classfile;"
    - "<?php $ok = @require_once $classfile;"
