id: php-plugin-path-abspath-plugindir
language: php
severity: warning
message: >-
  Plugin path built from ABSPATH and PLUGINDIR concatenation; use the
  WP_PLUGIN_DIR constant instead.
note: >-
  Syntactic match on a literal ABSPATH . PLUGINDIR concatenation only; does
  not resolve constants, includes, or runtime values, and does not check
  whether the path is otherwise validated.
rule:
  pattern: 'ABSPATH . PLUGINDIR . $$$REST'
