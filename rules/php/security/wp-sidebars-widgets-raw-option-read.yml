id: wp-sidebars-widgets-raw-option-read
language: php
severity: warning
message: >-
  Reading the sidebars_widgets option with get_option() bypasses
  normalization; use wp_get_sidebars_widgets() instead.
note: >-
  Matches only a literal get_option call whose first argument is the string
  'sidebars_widgets'. It does not resolve function identity, imports, or
  namespaces, and cannot see indirect or dynamic option names.
rule:
  pattern: 'get_option(''sidebars_widgets'', $$$ARGS)'
