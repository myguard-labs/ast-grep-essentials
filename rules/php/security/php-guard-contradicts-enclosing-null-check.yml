id: php-guard-contradicts-enclosing-null-check
language: php
severity: warning
message: 'Nested guard on the same variable contradicts the enclosing is_null() check.'
note: >-
  Syntactic match only. Matches an if whose condition is a direct is_null()
  call on a variable with a nested if testing the same variable under a
  negated is_string() call. Does not resolve types, aliasing, or runtime
  values.
rule:
  pattern: |
    if (is_null($VAR)) { if (! is_string($VAR)) { $$$BODY } }
