# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-interpolated-attr-object-property-unescaped
language: php
severity: warning
message: >-
  Object property interpolated into a single-quoted attribute inside a
  double-quoted string without an escape call.
note: >-
  Purely syntactic match on a double-quoted PHP string containing a
  single-quoted attribute whose value contains an interpolated $var->prop. It
  does not verify that the output is XML or HTML, that the property is
  untrusted, or that no escaping happens elsewhere.
rule:
  kind: encapsed_string
  regex: '=''\$[A-Za-z_][A-Za-z0-9_]*->[A-Za-z_][A-Za-z0-9_]*'''
