# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-superglobal-read-unguarded
language: php
severity: warning
message: >-
  Superglobal GET, POST or REQUEST subscript is read without an isset(),
  empty() or ternary guard.
note: >-
  Syntactic only; it skips any read inside a ternary or isset()/empty() call
  and does not check for guards elsewhere, such as earlier isset() checks outside
  a braced if (isset(same key)) block. A null-coalescing left operand is skipped, and so is a read to the
  right of an && (or and) whose left side holds isset() of the same superglobal key.
rule:
  all:
    - kind: subscript_expression
    - regex: '^\$_(GET|POST|REQUEST)\['
    - not:
        inside:
          stopBy: end
          kind: conditional_expression
    - not:
        inside:
          stopBy: end
          all:
            - kind: function_call_expression
            - regex: '(?i)^(isset|empty)\b'
    - not:
        any:
          - precedes:
              regex: '^\?\?=?$'
          - inside:
              kind: parenthesized_expression
              precedes:
                regex: '^\?\?$'
    - not:
        all:
          - pattern: $R[$K]
          - inside:
              kind: compound_statement
              stopBy: end
              inside:
                kind: if_statement
                has:
                  field: condition
                  has:
                    kind: function_call_expression
                    regex: '^isset\(\s*\$_(GET|POST|REQUEST)\['
                    has:
                      stopBy: end
                      all:
                        - pattern: $R[$K]
                        - regex: '^\$_(GET|POST|REQUEST)\['
    - not:
        all:
          - pattern: $R[$K]
          - inside:
              stopBy: end
              kind: binary_expression
              all:
                - has:
                    regex: '(?i)^(&&|and)$'
                - has:
                    field: left
                    any:
                      - kind: function_call_expression
                        regex: '^isset\(\s*\$_(GET|POST|REQUEST)\['
                        has:
                          stopBy: end
                          all:
                            - pattern: $R[$K]
                            - regex: '^\$_(GET|POST|REQUEST)\['
                      - kind: binary_expression
                        all:
                          - has:
                              regex: '(?i)^(&&|and)$'
                          - has:
                              kind: function_call_expression
                              regex: '^isset\(\s*\$_(GET|POST|REQUEST)\['
                              has:
                                stopBy: end
                                all:
                                  - pattern: $R[$K]
                                  - regex: '^\$_(GET|POST|REQUEST)\['
metadata:
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
  created_at: '2026-10-18'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-20'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/20.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  todo_cases:
    - "A spaced subscript ($_GET [ \"a\" ]) is not matched."
    - "FP: an isset guard written in another case (ISSET(...)) or with the superglobal after the first argument (isset($x, $_GET[\"a\"]) && $_GET[\"a\"]) is not recognised, so the read is still reported."
    - "FP: a read in a braceless if (isset($_GET[\"a\"])) echo $_GET[\"a\"]; body, or under a compound condition (isset(a) || $x, isset(a) && isset(b)), still reports; only a braced if whose condition is a single isset of the same key is recognised."
    - "false negative: a read used only to compute the isset key (if (isset($_GET[$_GET[\"key\"]])) { echo $_GET[\"key\"]; }) is treated as guarded."
