id: php-superglobal-read-unguarded
language: php
severity: warning
message: >-
  Superglobal GET or POST subscript is read without an isset(), empty() or
  ternary guard.
note: >-
  Syntactic only; it skips any read inside a ternary or isset()/empty() call
  and does not check for guards elsewhere, such as earlier isset() checks or
  null coalescing.
rule:
  all:
    - kind: subscript_expression
    - regex: '^\$_(GET|POST)\['
    - not:
        inside:
          stopBy: end
          kind: conditional_expression
    - not:
        inside:
          stopBy: end
          all:
            - kind: function_call_expression
            - regex: '(?i)^(isset|empty)\b'
