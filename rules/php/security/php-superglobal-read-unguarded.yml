# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-superglobal-read-unguarded
language: php
severity: warning
message: >-
  Superglobal GET, POST or REQUEST subscript is read without an isset(),
  empty() or ternary guard.
note: >-
  Syntactic only; it skips any read inside a ternary or isset()/empty() call
  and does not check for guards elsewhere, such as earlier isset() checks outside
  a braced if (isset(same key)) block. A null-coalescing left operand is skipped, and so is a read to the
  right of an && (or and) whose left side holds isset() of the same superglobal key.
rule:
  all:
    - kind: subscript_expression
    - regex: '^\$_(GET|POST|REQUEST)\['
    - not:
        inside:
          stopBy: end
          kind: conditional_expression
    - not:
        inside:
          stopBy: end
          all:
            - kind: function_call_expression
            - regex: '(?i)^(isset|empty)\b'
    - not:
        any:
          - precedes:
              regex: '^\?\?=?$'
          - inside:
              kind: parenthesized_expression
              precedes:
                regex: '^\?\?$'
    - not:
        all:
          - pattern: $R[$K]
          - inside:
              kind: compound_statement
              stopBy: end
              inside:
                kind: if_statement
                has:
                  field: condition
                  has:
                    kind: function_call_expression
                    regex: '^isset\(\s*\$_(GET|POST|REQUEST)\['
                    has:
                      stopBy: end
                      all:
                        - pattern: $R[$K]
                        - regex: '^\$_(GET|POST|REQUEST)\['
    - not:
        all:
          - pattern: $R[$K]
          - inside:
              stopBy: end
              kind: binary_expression
              all:
                - has:
                    regex: '(?i)^(&&|and)$'
                - has:
                    field: left
                    any:
                      - kind: function_call_expression
                        regex: '^isset\(\s*\$_(GET|POST|REQUEST)\['
                        has:
                          stopBy: end
                          all:
                            - pattern: $R[$K]
                            - regex: '^\$_(GET|POST|REQUEST)\['
                      - kind: binary_expression
                        all:
                          - has:
                              regex: '(?i)^(&&|and)$'
                          - has:
                              kind: function_call_expression
                              regex: '^isset\(\s*\$_(GET|POST|REQUEST)\['
                              has:
                                stopBy: end
                                all:
                                  - pattern: $R[$K]
                                  - regex: '^\$_(GET|POST|REQUEST)\['
metadata:
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
  created_at: '2026-10-18'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-20'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/20.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  known_false_positives: 'in an && chain of four or more terms a same-key isset() more than two operands before the read (isset($_GET["s"]) && $a && $b && $_GET["s"]) is not found; an isset guard in another case (ISSET(...)) or with the superglobal after the first argument (isset($x, $_GET["a"]) && $_GET["a"]) is not recognised; a braceless if (isset($_GET["a"])) echo $_GET["a"]; or a compound condition (isset(a) || $x, isset(a) && isset(b)) still reports; only a braced single same-key isset is recognised'
  todo_cases:
    - "<?php function f() { return $_GET [ \"a\" ]; }"
    - "<?php function f() { return $_GET[\"s\"] && isset($_GET[\"s\"]) && $x; }"
    - "<?php if (isset($_GET[$_GET[\"key\"]])) { echo $_GET[\"key\"]; }"
