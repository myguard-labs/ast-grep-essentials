# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-superglobal-read-unguarded
language: php
severity: warning
message: >-
  Superglobal GET or POST subscript is read without an isset(), empty() or
  ternary guard.
note: >-
  Syntactic only; it skips any read inside a ternary or isset()/empty() call
  and does not check for guards elsewhere, such as earlier isset() checks outside
  a braced if (isset(same key)) block. A null-coalescing left operand is skipped.
rule:
  all:
    - kind: subscript_expression
    - regex: '^\$_(GET|POST)\['
    - not:
        inside:
          stopBy: end
          kind: conditional_expression
    - not:
        inside:
          stopBy: end
          all:
            - kind: function_call_expression
            - regex: '(?i)^(isset|empty)\b'
    - not:
        any:
          - precedes:
              regex: '^\?\?=?$'
          - inside:
              kind: parenthesized_expression
              precedes:
                regex: '^\?\?$'
    - not:
        all:
          - pattern: $R[$K]
          - inside:
              kind: compound_statement
              stopBy: end
              inside:
                kind: if_statement
                has:
                  field: condition
                  has:
                    kind: function_call_expression
                    regex: '^isset\(\s*\$_(GET|POST)\['
                    has:
                      stopBy: end
                      all:
                        - pattern: $R[$K]
                        - regex: '^\$_(GET|POST)\['
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
  created_at: '2026-10-18'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-20'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/20.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  todo_cases:
    - "A spaced subscript ($_GET [ \"a\" ]) is not matched."
    - "FP: a read in a braceless if (isset($_GET[\"a\"])) echo $_GET[\"a\"]; body, or under a compound condition (isset(a) || $x, isset(a) && isset(b)), still reports; only a braced if whose condition is a single isset of the same key is recognised."
