id: wp-wpdb-blogid-as-current-blog
language: php
severity: warning
message: >-
  Reading $wpdb->blogid does not give the current blog ID; use
  get_current_blog_id() instead.
note: >-
  Matches the literal property read $wpdb->blogid only. It does not resolve
  that $wpdb is the WordPress global or check runtime values.
rule:
  pattern: '$wpdb->blogid'
