id: wp-deprecated-get-links-list
language: php
severity: warning
message: >-
  get_links_list() is deprecated in WordPress; consider wp_list_bookmarks()
  instead.
note: >-
  Single-file syntactic match on the literal call name get_links_list(); it
  does not verify that the function is actually WordPress core or resolve
  namespaces, imports, or aliases.
rule:
  pattern: 'get_links_list($$$ARGS)'
