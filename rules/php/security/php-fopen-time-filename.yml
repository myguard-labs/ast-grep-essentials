id: php-fopen-time-filename
language: php
severity: warning
message: >-
  fopen() is given a file name built from time(), which is predictable; use an
  unpredictable unique name instead.
note: >-
  Syntactic match only on a direct fopen call whose path argument concatenates
  a time() call. It does not verify the path is writable, reachable, or shared
  with another party, and does not resolve aliases or wrappers.
rule:
  pattern: 'fopen($A . time(), $MODE)'
