id: php-is-array-unguarded-index
language: php
severity: warning
message: >-
  is_array() is called on an array index without an isset() or
  array_key_exists() guard in the same condition; a missing index may emit an
  undefined-index notice.
note: >-
  Single-file syntactic check only. It matches a literal is_array() call whose
  argument is a literal $x[0] index and does not look for isset() or
  array_key_exists() guards elsewhere in the condition or resolve whether the
  index can be absent at runtime.
rule:
  pattern: 'is_array($ARR[0])'
  not:
    inside:
      pattern: 'isset($ARR[0]) && $$$_'
      stopBy: end
