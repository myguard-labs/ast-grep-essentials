# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-strpos-truthy-condition
language: php
severity: warning
message: >-
  strpos() used as a bare if-condition treats a match at offset 0 as false;
  compare the result explicitly with false.
note: >-
  Syntactic check only. It matches an if-condition whose whole expression is a
  strpos() call with no comparison operator. It does not verify the haystack
  type or runtime values, and it does not inspect calls wrapped in other
  expressions.
rule:
  pattern: |
    if ( strpos($$$ARGS) ) {
      $$$BODY
    }
