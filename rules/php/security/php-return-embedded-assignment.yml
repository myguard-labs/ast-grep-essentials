id: php-return-embedded-assignment
language: php
severity: warning
message: >-
  Return statement contains an embedded assignment; assign the value to a
  variable first and return it separately.
note: >-
  Syntactic single-file check only. It matches a return statement whose
  returned expression is literally an assignment expression; it does not
  resolve types, aliasing, or runtime values.
rule:
  kind: return_statement
  has:
    kind: assignment_expression
    stopBy: end
