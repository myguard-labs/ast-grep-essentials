id: php-preview-link-missing-filter
language: php
severity: warning
message: >-
  Preview URL built with add_query_arg and get_permalink is not passed through
  the preview_post_link filter.
note: >-
  This is a single-file syntactic check for the literal
  add_query_arg('preview', 'true', get_permalink(...)) call shape. It does not
  resolve whether a preview_post_link hook exists or whether the call is
  reached at runtime.
rule:
  pattern: 'add_query_arg(''preview'', ''true'', get_permalink($$$ARGS))'
  not:
    inside:
      pattern: 'apply_filters(''preview_post_link'', $$$_)'
      stopBy: end
