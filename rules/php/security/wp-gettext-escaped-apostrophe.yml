id: wp-gettext-escaped-apostrophe
language: php
severity: warning
message: >-
  Single-quoted translation string contains a backslash-escaped apostrophe;
  the backslash becomes part of the msgid.
note: >-
  Matches the literal syntax of a single-quoted string argument containing \'
  passed directly to a translation function call by name. It does not resolve
  function identity, imports, or aliases, and does not check whether the call
  is actually a gettext call.
rule:
  all:
    - kind: string
      regex: '^''.*\\''.*''$'
    - inside:
        kind: function_call_expression
        stopBy: end
        has:
          kind: name
          regex: '^(__|_e|esc_html__|esc_html_e|esc_attr__|esc_attr_e|_x|_n|_ex)$'
