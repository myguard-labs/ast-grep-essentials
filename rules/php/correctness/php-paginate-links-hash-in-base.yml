id: php-paginate-links-hash-in-base
language: php
severity: warning
message: >-
  The paginate_links() base argument uses add_query_arg() with a %#%
  placeholder; put %_% in the base URL and pass the page pattern via format
  instead.
note: >-
  Syntactic match only on a literal paginate_links(array(...)) call whose
  'base' value is an add_query_arg(...) call containing a '%#%' string
  argument. It does not resolve function identity, imports, or runtime values.
rule:
  pattern: 'paginate_links(array(''base'' => add_query_arg($$$ARGS), $$$REST))'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'Observed false positive: add_query_arg() in base without any %#% placeholder is reported although the note claims a %#% argument (paginate_links(array(''base'' => add_query_arg(''foo'', ''bar''), ''format'' => ''?paged=%#%'', ''total'' => 3));).'
    - 'Observed miss: an array whose only key is base is not reported ($links = paginate_links(array(''base'' => add_query_arg(''paged'', ''%#%'')));).'
    - 'Observed miss: the short array syntax is not reported (paginate_links([''base'' => add_query_arg(''paged'', ''%#%''), ''format'' => '''']);).'
    - 'Observed miss: base placed after another key is not reported (paginate_links(array(''format'' => '''', ''base'' => add_query_arg(''paged'', ''%#%'')));).'
    - 'Observed miss: add_query_arg() wrapped in another call is not reported (paginate_links(array(''base'' => esc_url(add_query_arg(''paged'', ''%#%'')), ''format'' => ''''));).'
