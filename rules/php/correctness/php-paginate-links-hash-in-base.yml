id: php-paginate-links-hash-in-base
language: php
severity: warning
message: >-
  The paginate_links() base argument uses add_query_arg() with a %#%
  placeholder; put %_% in the base URL and pass the page pattern via format
  instead.
note: >-
  Syntactic match only on a literal paginate_links(array(...)) call whose
  'base' value is an add_query_arg(...) call containing a '%#%' string
  argument. It does not resolve function identity, imports, or runtime values.
rule:
  pattern: 'paginate_links(array(''base'' => add_query_arg($$$ARGS), $$$REST))'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  known_false_positives: 'add_query_arg() in base without any %#% placeholder, paginate_links(array(''base'' => add_query_arg(''foo'', ''bar''), ''format'' => ''?paged=%#%'', ''total'' => 3));, is reported'
  todo_cases:
    - "<?php $links = paginate_links(array('base' => add_query_arg('paged', '%#%')));"
    - "<?php paginate_links(['base' => add_query_arg('paged', '%#%'), 'format' => '']);"
    - "<?php paginate_links(array('format' => '', 'base' => add_query_arg('paged', '%#%')));"
    - "<?php paginate_links(array('base' => esc_url(add_query_arg('paged', '%#%')), 'format' => ''));"
