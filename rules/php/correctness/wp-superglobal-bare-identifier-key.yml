# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-superglobal-bare-identifier-key
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-unquoted-array-key-bareword. Superglobal array
  key is a bare identifier instead of a quoted string.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-unquoted-array-key-bareword and do not emit this rule.
rule:
  kind: subscript_expression
  has:
    kind: name
    follows:
      regex: '^\[$'
metadata:
  deprecated_alias_of: php-unquoted-array-key-bareword
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
  created_at: '2026-10-19'
