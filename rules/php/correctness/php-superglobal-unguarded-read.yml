# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-superglobal-unguarded-read
language: php
severity: warning
message: >-
  A request superglobal element is used directly as an if condition without an
  isset guard.
note: >-
  Syntactic only; matches an if condition that is directly a GET superglobal
  subscript. It does not check for guards elsewhere or runtime values.
rule:
  kind: subscript_expression
  regex: '^\$_GET\['
  inside:
    kind: parenthesized_expression
    inside:
      kind: if_statement
metadata:
  todo_cases:
    - 'FN: `if ( $x ) {} elseif ( $_GET[''s''] ) {}` is not reported (elseif condition is not an if_statement parenthesized_expression).'
    - 'FN: `if ( ! $_GET[''s''] )` and `if ( $_GET[''s''] && $x )` are not reported (subscript is not the direct condition).'
    - 'FN: `if ( $_POST[''s''] )` and `while ( $_GET[''s''] )` are not reported.'
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
  created_at: '2026-10-18'
