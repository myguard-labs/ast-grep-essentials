# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-count-comparison-inside-call
language: php
severity: warning
message: >-
  count() is called with a comparison expression as its argument; the
  comparison should be applied to the count result instead.
note: >-
  Purely syntactic check on the literal call shape count($A <= $B), the
  less-than-or-equal operator only; other comparison operators are not matched. It
  does not resolve count() identity, imports, or runtime types, and it does
  not verify the surrounding guard logic.
rule:
  pattern: 'count($A <= $B)'
metadata:
  todo_cases:
    - 'FN: `count($a <= $b, COUNT_RECURSIVE)` (mode argument present) is not reported'
    - 'FN: `\count($a <= $b)` (fully qualified call) and `sizeof($a <= $b)` are not reported'
