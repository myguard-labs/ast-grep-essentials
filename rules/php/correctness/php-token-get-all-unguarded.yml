# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-token-get-all-unguarded
language: php
severity: warning
message: >-
  token_get_all() is called in a function with no earlier
  function_exists('token_get_all') guard in that function.
note: >-
  Single-file syntactic check only. It looks for a literal token_get_all( call
  inside a function body and a missing function_exists guard earlier in the
  same function; it does not resolve namespaces, aliases, or runtime extension
  state.
rule:
  pattern: 'token_get_all($$$ARGS)'
  inside:
    kind: function_definition
    stopBy: end
    all:
      - not:
          has:
            pattern: 'function_exists(''token_get_all'')'
            stopBy: end
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - "FP: a double-quoted guard `if (function_exists(\"token_get_all\")) { return token_get_all($c); }` is still reported (guard pattern is single-quoted)."
    - "FN: guard after the call `$t = token_get_all($c); if (function_exists('token_get_all')) {...}` is not reported (guard need not be earlier)."
    - "FN: `\\token_get_all($c)` and a call inside a class method are not reported."
    - "FP: an `extension_loaded('tokenizer')` guard `if (extension_loaded('tokenizer')) { return token_get_all($c); }` is still reported, although token_get_all() is part of that extension."
