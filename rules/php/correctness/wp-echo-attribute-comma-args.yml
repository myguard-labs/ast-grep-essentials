# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-echo-attribute-comma-args
language: php
severity: warning
message: >-
  This echo statement has comma-separated arguments inside an HTML attribute
  value, so the pieces are emitted with no separator.
note: >-
  Syntactic check only. It matches a PHP echo with two or more comma-separated
  arguments whose PHP block opens inside an HTML tag attribute value (the
  template text before the opening tag ends in an open attribute value), and
  skips an argument list that alternates values with whitespace-only string
  literals; it does not verify the attribute semantics or runtime output.
utils:
  attr-php-block:
    any:
      - follows:
          stopBy:
            kind: php_end_tag
          kind: php_tag
          follows:
            kind: ERROR
            regex: '(?s)<[A-Za-z][^>]*=\s*("[^"]*|''[^'']*|[^\s"''>]*)$'
      - follows:
          stopBy:
            kind: php_end_tag
          kind: ERROR
          regex: '(?s)<[A-Za-z][^>]*=\s*("[^"]*|''[^'']*|[^\s"''>]*)<\?php\s*$'
rule:
  kind: echo_statement
  any:
    - matches: attr-php-block
    - inside:
        stopBy: end
        matches: attr-php-block
  has:
    kind: sequence_expression
    any:
      - all:
          - has:
              nthChild: 1
              not:
                regex: '^(''\s+''|"\s+")$'
          - any:
              - has:
                  nthChild: 2
                  not:
                    any:
                      - regex: '^(''\s+''|"\s+")$'
                      - kind: sequence_expression
              - has:
                  nthChild: 2
                  kind: sequence_expression
                  has:
                    nthChild: 1
                    not:
                      regex: '^(''\s+''|"\s+")$'
      - has:
          stopBy: end
          kind: sequence_expression
          all:
            - has:
                nthChild: 1
                not:
                  regex: '^(''\s+''|"\s+")$'
            - any:
                - has:
                    nthChild: 2
                    not:
                      any:
                        - regex: '^(''\s+''|"\s+")$'
                        - kind: sequence_expression
                - has:
                    nthChild: 2
                    kind: sequence_expression
                    has:
                      nthChild: 1
                      not:
                        regex: '^(''\s+''|"\s+")$'
metadata:
  todo_cases:
    - "<div class=\"row <?php echo $a, $b; ?>\">"
    - "<input value=\"<?php echo $a, $b; ?>\">"
    - "<a href=\"http://<?php echo $a, $b; ?>\">x</a>"
    - "<div class = \"<?php echo $a, $b; ?>\">"
