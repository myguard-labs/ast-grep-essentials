id: php-error-suppressed-include
language: php
severity: warning
message: >-
  This include is prefixed with the @ error-suppression operator, which hides
  errors from the included file.
note: >-
  Matches the literal syntax of an @ prefix directly on an include or
  include_once expression. It does not check whether the suppression is
  intentional, nor resolve included paths or runtime error handling.
rule:
  pattern:
    context: '<?php @include_once($$$ARGS);'
    selector: error_suppression_expression
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - '@include and @require_once with parentheses (@include( $f ); @require_once( $f );) are not flagged although the note covers include expressions'
    - '@include_once $file; without parentheses is not flagged'
    - '@include_once( $f ) or die(); is not flagged'
