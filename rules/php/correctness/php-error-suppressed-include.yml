id: php-error-suppressed-include
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-include-error-suppressed. An @ prefix on an
  include hides errors from the included file.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-include-error-suppressed and do not emit this rule.
rule:
  pattern: '@include_once $ARG'
metadata:
  deprecated_alias_of: php-include-error-suppressed
  rule_modified_at: '2026-11-18'
  created_at: '2026-10-15'
