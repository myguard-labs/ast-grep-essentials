id: php-srand-microtime-seed
language: php
severity: warning
message: >-
  srand() or mt_srand() is seeded from microtime(), so the PRNG sequence is
  predictable from the request time.
note: >-
  Single-file syntactic check only. Matches a srand or mt_srand call whose
  single seed argument contains a microtime() call anywhere in its subtree. It
  does not resolve namespaces, prove the seed reaches security-sensitive
  output, or track seeds assigned to variables from microtime() earlier.
rule:
  pattern: '$FN($SEED)'
constraints:
  FN:
    regex: '^(srand|mt_srand)$'
  SEED:
    has:
      pattern: 'microtime($$$ARGS)'
      stopBy: end
