id: php-string-curly-brace-offset
language: php
severity: error
message: >-
  String offset written with curly braces is removed in PHP 8; use square
  brackets instead.
note: >-
  Syntactic match only: flags an error-recovery node whose text contains a
  variable subscript in square brackets followed by a brace-enclosed index,
  the curly-brace string-offset form. It does not check types, so it cannot
  confirm the base holds a string, and it does not analyse reachability or
  runtime values.
rule:
  kind: ERROR
  regex: '\$\w+\[[^\[\]{}]*\]\{[^{}]*\}'
