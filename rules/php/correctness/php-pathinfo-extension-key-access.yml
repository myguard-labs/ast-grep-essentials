id: php-pathinfo-extension-key-access
language: php
severity: warning
message: >-
  Direct ['extension'] access on pathinfo() may raise an undefined-key warning
  when the path has no extension; use pathinfo($path, PATHINFO_EXTENSION)
  instead.
note: >-
  Matches only the literal syntax pathinfo(...)['extension'] applied directly
  to a pathinfo call. It does not resolve types, aliases, or values assigned
  to variables first.
rule:
  all:
    - pattern: 'pathinfo($$$ARGS)[''extension'']'
    - not:
        inside:
          kind: binary_expression
          field: left
          has:
            field: operator
            regex: '^\?\?$'
          stopBy:
            not:
              kind: parenthesized_expression
    - not:
        inside:
          kind: argument
          inside:
            kind: arguments
            inside:
              kind: function_call_expression
              has:
                field: function
                regex: '(?i)^\\?(isset|empty)$'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'Observed false positive: an error-suppressed read is reported although @ silences the warning ($ext = @pathinfo($f)[''extension''];).'
    - 'Observed miss: a double-quoted key is not reported ($ext = pathinfo($f)["extension"];).'
