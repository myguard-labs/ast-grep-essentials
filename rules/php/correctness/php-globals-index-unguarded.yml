# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-globals-index-unguarded
language: php
severity: warning
message: >-
  Element of the GLOBALS array is read in an if condition without an isset()
  guard.
note: >-
  Syntactic check only; it looks for isset text in the same if condition,
  and accepts an empty() argument, the left operand of ??, and the right
  operand of an && whose direct left operand is array_key_exists() of the same
  key on GLOBALS. It does not track earlier guards, aliasing, or runtime values.
rule:
  all:
    - kind: subscript_expression
    - pattern: $S[$K]
    - regex: '^\$GLOBALS\s*\['
    - inside:
        kind: parenthesized_expression
        stopBy: end
        inside:
          kind: if_statement
    - not:
        inside:
          kind: parenthesized_expression
          stopBy: end
          regex: 'isset\s*\('
    - not:
        inside:
          kind: argument
          inside:
            kind: arguments
            inside:
              kind: function_call_expression
              has:
                field: function
                regex: '^empty$'
    - not:
        inside:
          kind: binary_expression
          field: left
          has:
            field: operator
            regex: '^\?\?$'
    - not:
        inside:
          kind: binary_expression
          field: right
          all:
            - has:
                field: operator
                regex: '^&&$'
            - has:
                field: left
                all:
                  - kind: function_call_expression
                  - has:
                      field: function
                      regex: '^array_key_exists$'
                  - has:
                      field: arguments
                      all:
                        - has:
                            kind: argument
                            has:
                              pattern: $K
                        - has:
                            kind: argument
                            has:
                              kind: variable_name
                              regex: '^\$GLOBALS$'
constraints:
  S:
    regex: '^\$GLOBALS(\s*\[[^\]]*\])*$'
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
  created_at: '2026-10-18'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  known_false_positives: 'a guard that is not the left && operand (if ( $a && array_key_exists( ''x'', $GLOBALS ) && $GLOBALS[''x''] ) { }) or \array_key_exists is not recognised; a guarded read in a comparison or negation (array_key_exists( ''x'', $GLOBALS ) && $GLOBALS[''x''] === 1, or && !$GLOBALS[''x'']) is still reported; a nested read (empty( $GLOBALS[''x''][''y''] ) or $GLOBALS[''x''][''y''] ?? 0) is reported once; guards cover only the outer subscript; array_key_exists( "x", $GLOBALS ) && $GLOBALS[''x''] (key quoted differently) is reported'
  todo_cases:
    - "<?php if ( isset( $GLOBALS['x'] ) || $GLOBALS['y'] ) { }"
