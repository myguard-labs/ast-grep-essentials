# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-widget-instance-unchecked-index
language: php
severity: warning
message: >-
  Reads a key of $instance inside form() without an isset or array_key_exists
  guard.
note: >-
  Purely syntactic single-file match on a function named form() with a direct
  $instance['key'] read; it does not verify that the key is absent at runtime,
  that the function is a widget method, or that any guard exists elsewhere in
  the code.
rule:
  all:
    - kind: function_definition
    - has:
        pattern: form
        stopBy: end
    - has:
        pattern: '$instance[$KEY]'
        stopBy: end
    - not:
        has:
          pattern: 'isset($instance[$KEY])'
          stopBy: end
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FP: form() reading $instance[''title''] only after an array_key_exists( ''title'', $instance ) ternary is still reported (only isset is recognised as a guard).'
    - 'FN: a widget form() declared as a class method (method_declaration, not function_definition) with an unguarded $instance[''title''] read is not reported.'
    - 'FN: form() that guards one key with isset( $instance[''a''] ) but reads $instance[''b''] unguarded is not reported (any isset anywhere in the function suppresses the match).'
