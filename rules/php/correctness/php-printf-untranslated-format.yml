id: php-printf-untranslated-format
language: php
severity: warning
message: 'Format string passed to printf() is not wrapped in a translation function.'
note: >-
  Syntactic check only. Matches a direct printf call whose first argument is a
  literal string; it does not verify the callee resolves to PHP's built-in
  printf or check the string's content beyond the literal shape.
rule:
  pattern: 'printf(''$FMT'', $$$ARGS)'
metadata:
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: printf( "Maximum size: %s", $size ) with a double-quoted format and printf( ''Maximum size: %s'' . ''!'', $size ) with a concatenated format are not reported'
    - 'FN: printf( ''Maximum size: 10MB'' ) with a one-argument literal format is not reported (pattern requires a comma and further arguments)'
