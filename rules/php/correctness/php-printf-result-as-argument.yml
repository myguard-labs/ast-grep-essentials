id: php-printf-result-as-argument
language: php
severity: warning
message: >-
  printf() is passed directly as an argument (in any position) to another call,
  so its echoed output and integer return value are passed along as the
  value. Use sprintf() instead.
note: >-
  Single-file syntactic match on a literal printf call that is itself one
  argument of another call (any position, one finding per printf argument). It
  does not resolve whether the outer function is wp_die or whether the output
  is otherwise unsafe.
rule:
  pattern: 'printf($$$ARGS)'
  inside:
    kind: argument
metadata:
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: wp_die( ''x'' . printf( ''%s'', $msg ) ) is not reported (printf must be a direct argument, not an operand of another expression)'
    - 'FN: echo printf( ''%s'', $msg ); prints the integer return value of printf and is not reported'
