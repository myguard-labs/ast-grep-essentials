id: wp-schedule-single-event-reversed-args
language: php
severity: warning
message: >-
  wp_schedule_single_event() is called with a string literal as its first
  argument, which should be the timestamp; the hook name belongs in the second
  argument.
note: >-
  Syntactic check only. Matches a direct wp_schedule_single_event call whose
  first argument is a string literal; it does not resolve the function
  identity, imports, or runtime argument values.
rule:
  pattern: 'wp_schedule_single_event(''$HOOK'', $$$ARGS)'
metadata:
  todo_cases:
    - "Observed miss: `wp_schedule_single_event( \"my_hook\", time() )` (double-quoted hook) and `\\wp_schedule_single_event( 'my_hook', time() )` are not reported (probed: no match)."
    - "Observed false positive: `wp_schedule_single_event( '1700000000', 'my_hook' )` (numeric timestamp passed as a string, hook in the second argument) is reported although the argument order is correct (probed: match on 0.51.3 and 0.45.2)."
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
