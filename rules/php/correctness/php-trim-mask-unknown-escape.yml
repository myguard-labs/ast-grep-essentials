# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-trim-mask-unknown-escape
language: php
severity: warning
message: >-
  This trim mask uses an unrecognized escape in a double-quoted string, so the
  backslash and letter are treated as literal mask characters.
note: >-
  Syntactic check only. It flags trim, ltrim, or rtrim calls whose second
  argument is a double-quoted string literal containing a backslash followed
  by a letter that is not a recognized PHP escape. It does not resolve
  function identity, imports, or runtime values.
rule:
  any:
    - pattern: 'trim($SRC, $MASK)'
    - pattern: 'ltrim($SRC, $MASK)'
    - pattern: 'rtrim($SRC, $MASK)'
constraints:
  MASK:
    kind: argument
    has:
      kind: encapsed_string
      regex: '(?:^|[^\\])(?:\\\\)*\\(?:[a-dg-mo-qswyzA-Z]|x[^0-9A-Fa-f]|u[^{])'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  known_false_positives: 'the regex reads the whole double-quoted mask, so an interpolated expression such as trim($s, "{$map[''\s'']}") is reported although the key is a single-quoted string'
  todo_cases:
    - 'FN: namespaced \trim($a, "\s") is not reported.'
