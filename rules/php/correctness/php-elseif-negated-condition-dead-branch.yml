id: php-elseif-negated-condition-dead-branch
language: php
severity: warning
message: >-
  This elseif tests the negation of the variable already tested by the
  preceding if, so the branch is dead or misleading.
note: >-
  Single-file syntactic match on a literal variable tested by an if and
  negated in the following elseif; it does not resolve types, aliasing, or
  runtime values.
rule:
  pattern: |
    if ($VAR) { $$$BODY1 } elseif (! $VAR) { $$$BODY2 }
metadata:
  todo_cases:
    - '<?php if (!$a) { f(); } elseif ($a) { g(); } observed 0 matches: reversed polarity (negated if, plain elseif) is not flagged'
    - '<?php if ($a) { f(); } else if (!$a) { g(); } observed 0 matches: two-word else if is not flagged'
    - '<?php if ($a) { f(); } elseif ($b) { g(); } elseif (!$a) { h(); } observed 0 matches: negation in a later elseif of a chain is not flagged'
    - '<?php if ($a) f(); elseif (!$a) g(); observed 0 matches: brace-less bodies are not flagged'
