# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-get-user-meta-missing-single-compare
language: php
severity: warning
message: >-
  get_user_meta() called with two arguments returns an array; comparing it
  with == to a scalar will not behave as intended. Pass true as the third
  argument.
note: >-
  Syntactic check only. It matches a two-argument get_user_meta call written
  directly as the left operand of ==; it does not resolve the function, check
  types, or verify the comparison value at runtime.
rule:
  all:
    - kind: binary_expression
    - has:
        pattern: 'get_user_meta($$$ARGS)'
        field: left
    - pattern: 'get_user_meta($A, $B) == $C'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  known_false_positives: 'get_user_meta( $u, ''k'' ) == array() is flagged although it compares array to array on purpose'
  todo_cases:
    - 'get_user_meta( $u, ''k'' ) != ''x'' is not flagged: the pattern only matches ==, so the != form of the same array-vs-scalar comparison is missed (probed 0.51.3 and 0.45.2)'
    - 'get_user_meta( $u, ''k'', false ) == ''x'' is not flagged: the pattern requires exactly two arguments, so an explicit false third argument (still an array) is missed (probed 0.51.3 and 0.45.2)'
