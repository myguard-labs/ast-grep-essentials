# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-translation-concatenation
language: php
severity: warning
message: >-
  Translation call is concatenated with '.'; pass the full sentence as a
  format string to printf or sprintf so translators can reorder words.
note: >-
  Syntactic single-file check only. Matches a literal translation function
  call written directly as an operand of '.' concatenation; it does not
  resolve imports, aliases, or runtime values.
rule:
  pattern: '__($$$ARGS) . $RIGHT'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - "Translation call as the right operand, `echo $name . __( 'x' )`, is not matched (0 matches; only a left-hand __() operand is matched)."
    - "`echo esc_html__( 'a' ) . $y` is not matched (0 matches; only __() is matched)."
