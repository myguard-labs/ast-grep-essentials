# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-split-deprecated-call
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-split-call. Call to split(), a function removed in
  PHP 7.0; use explode() or preg_split() instead.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-split-call and do not emit this rule.
rule:
  pattern: 'split($$$ARGS)'
metadata:
  deprecated_alias_of: php-split-call
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'Fully-qualified global call `\split('','', $s)` is not matched (0 matches on 0.51.3 and 0.45.2).'
