id: php-hardcoded-admin-ajax-path
language: php
severity: warning
message: >-
  Hardcoded admin-ajax.php path used as a request URL; build it with
  admin_url() or use ajaxurl instead.
note: >-
  Single-file syntactic match on a string literal containing admin-ajax.php.
  It does not resolve whether the string is actually used as a request URL or
  whether a different admin path is in effect. A literal that is the first
  (path) argument of admin_url(), network_admin_url() or self_admin_url(), or
  an argument named path, is the recommended form and is not reported; so is
  a literal concatenated into such an argument. Known limitation: a literal
  concatenated into a first argument that is not a path is also not reported.
rule:
  any:
    - kind: string
    - kind: encapsed_string
  regex: 'admin-ajax\.php'
  not:
    inside:
      stopBy:
        not:
          kind: binary_expression
      kind: argument
      all:
        - any:
            - nthChild: 1
            - has:
                field: name
                regex: '^path$'
        - inside:
            kind: arguments
            inside:
              kind: function_call_expression
              has:
                field: function
                regex: '^\\?(admin_url|network_admin_url|self_admin_url)$'
