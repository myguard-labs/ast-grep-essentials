# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-yoda-array-read-without-isset
language: php
severity: warning
message: >-
  String literal compared with == against an array subscript read; confirm the
  key is guaranteed to exist or guard it with isset.
note: >-
  Syntactic single-file match only. It flags a literal-on-left == comparison
  with a subscript read inside an if condition and cannot prove the key is
  absent or present at runtime, nor resolve aliases or types. A same-array,
  same-key isset( $C[$K] ) or ! empty( $C[$K] ) guard silences the report only
  when it protects the read: joined only through && or and before the
  read, or through && or and in the condition of an enclosing if whose body holds the read. A negated guard
  joined with || or or before the read also protects it. A guard compared
  with a literal (isset( ... ) == false), or nested in a ternary, call
  argument or assignment, never counts.
rule:
  all:
    - pattern: '''publish'' == $C[$K]'
    - inside:
        kind: if_statement
        stopBy: end
    - not:
        inside:
          stopBy: end
          kind: parenthesized_expression
          inside:
            field: condition
            any:
              - kind: if_statement
              - kind: else_if_clause
          has:
            stopBy: end
            all:
              - any:
                  - pattern: 'isset( $C[$K] )'
                  - pattern: '! empty( $C[$K] )'
              - not:
                  inside:
                    stopBy:
                      any:
                        - kind: if_statement
                        - kind: else_if_clause
                    not:
                      any:
                        - kind: parenthesized_expression
                        - kind: binary_expression
                        - kind: unary_op_expression
                        - kind: if_statement
                        - kind: else_if_clause
              - not:
                  inside:
                    stopBy: end
                    kind: binary_expression
                    has:
                      field: left
                      any:
                        - pattern: '''publish'' == $C[$K]'
                        - has:
                            stopBy: end
                            pattern: '''publish'' == $C[$K]'
              - any:
                  - all:
                      - not:
                          inside:
                            stopBy: end
                            kind: unary_op_expression
                            regex: '^!'
                      - not:
                          inside:
                            stopBy: end
                            kind: binary_expression
                            has:
                              field: operator
                              not:
                                regex: '^(&&|and)$'
                  - all:
                      - inside:
                          stopBy: end
                          kind: unary_op_expression
                          regex: '^!'
                      - inside:
                          stopBy: end
                          kind: binary_expression
                          has:
                            field: operator
                            regex: '^(\|\||or)$'
    - not:
        inside:
          stopBy: end
          inside:
            kind: if_statement
            field: body
            has:
              field: condition
              has:
                stopBy: end
                all:
                  - any:
                      - pattern: 'isset( $C[$K] )'
                      - pattern: '! empty( $C[$K] )'
                  - not:
                      inside:
                        stopBy:
                          any:
                            - kind: if_statement
                            - kind: else_if_clause
                        not:
                          any:
                            - kind: parenthesized_expression
                            - kind: binary_expression
                            - kind: unary_op_expression
                            - kind: if_statement
                            - kind: else_if_clause
                  - not:
                      inside:
                        stopBy: end
                        any:
                          - kind: unary_op_expression
                            regex: '^!'
                          - kind: binary_expression
                            has:
                              field: operator
                              not:
                                regex: '^(&&|and)$'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - "FP: `if ( array_key_exists( 'post_status', $c ) && 'publish' == $c['post_status'] )` (also as an enclosing if guard) is reported although the key is checked: the argument metavariables bind `argument` nodes and cannot be unified with the subscript operands on 0.45.2 and 0.51.3"
    - "Known limitation: an early-return guard (`if ( ! isset( $c['post_status'] ) ) { return; } if ( 'publish' == $c['post_status'] ) { ... }`) is reported; only a guard in the same condition or an enclosing if is recognised"
    - "FP: `if ( empty( $c['post_status'] ) || 'publish' == $c['post_status'] )` and an else body of `if ( ! isset( $c['post_status'] ) ) { } else { if ( read ) }` are reported although the read cannot run with the key absent: only isset and ! empty are recognised as guards"
    - "FN: `if ( ! ( ! isset( $c['post_status'] ) ) || 'publish' == $c['post_status'] )` is not reported: negation parity is not counted, so a doubly negated guard under || counts as protecting"
    - "FN: `if ( ( ! isset( $c['post_status'] ) || $y ) && 'publish' == $c['post_status'] )` is not reported: a negated guard under any || ancestor counts, even when the || does not join it to the read"
    - "FN: `$ok = 'publish' == $c['post_status'];` outside an if condition and `if ( 'publish' === $c['post_status'] )` (identical comparison) are not reported"
    - "FN: `if ( $c['post_status'] == 'publish' )` (literal on the right) is not reported"
