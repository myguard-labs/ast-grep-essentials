id: wp-yoda-array-read-without-isset
language: php
severity: warning
message: >-
  String literal compared with == against an array subscript read; confirm the
  key is guaranteed to exist or guard it with isset.
note: >-
  Syntactic single-file match only. It flags a literal-on-left == comparison
  with a subscript read inside an if condition and cannot prove the key is
  absent or present at runtime, nor resolve aliases or types.
rule:
  pattern: '''publish'' == $C[$K]'
  inside:
    kind: if_statement
    stopBy: end
    not:
      has:
        pattern: 'isset( $C[$K] )'
        stopBy: end
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - "FP: `if ( array_key_exists( 'post_status', $c ) && 'publish' == $c['post_status'] )` is reported although the key is checked (only an isset( $c[$K] ) guard is recognised)"
    - "FP: `if ( ! empty( $c['post_status'] ) && 'publish' == $c['post_status'] )` is reported although the key is checked"
    - "FP: `if ( isset( $c['post_status'] ) ) { if ( 'publish' == $c['post_status'] ) { ... } }` is reported: the inner if has no isset and the stopBy end walk matches it"
    - "FN: `$ok = 'publish' == $c['post_status'];` outside an if condition and `if ( 'publish' === $c['post_status'] )` (identical comparison) are not reported"
    - "FN: `if ( $c['post_status'] == 'publish' )` (literal on the right) is not reported"
