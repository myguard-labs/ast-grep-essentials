# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-yoda-array-read-without-isset
language: php
severity: warning
message: >-
  String literal compared with == against an array subscript read; confirm the
  key is guaranteed to exist or guard it with isset.
note: >-
  Syntactic single-file match only. It flags a literal-on-left == comparison
  with a subscript read inside an if condition and cannot prove the key is
  absent or present at runtime, nor resolve aliases or types. A same-array,
  same-key isset( $C[$K] ) or ! empty( $C[$K] ) guard silences the report only
  when it protects the read: joined only through && or and before the read,
  or through && or and in the condition of an enclosing if whose body holds
  the read. A negated guard joined to the read only through || or or also
  protects it. A guard compared with a literal (isset( ... ) == false), or
  nested in a ternary, call argument or assignment, never counts.
rule:
  all:
    - pattern: '''publish'' == $C[$K]'
    - inside:
        kind: if_statement
        stopBy: end
    - not:
        inside:
          stopBy: end
          kind: parenthesized_expression
          inside:
            field: condition
            any:
              - kind: if_statement
              - kind: else_if_clause
          has:
            stopBy: end
            all:
              - any:
                  - pattern: 'isset( $C[$K] )'
                  - pattern: '! empty( $C[$K] )'
              - not:
                  inside:
                    stopBy:
                      any:
                        - kind: if_statement
                    not:
                      any:
                        - kind: parenthesized_expression
                        - kind: binary_expression
                        - kind: unary_op_expression
                        - kind: if_statement
                        - kind: else_if_clause
              - not:
                  inside:
                    stopBy:
                      kind: binary_expression
                      has:
                        stopBy: end
                        pattern: '''publish'' == $C[$K]'
                    kind: binary_expression
                    has:
                      field: left
                      any:
                        - pattern: '''publish'' == $C[$K]'
                        - has:
                            stopBy: end
                            pattern: '''publish'' == $C[$K]'
              - any:
                  - all:
                      - not:
                          inside:
                            stopBy: end
                            kind: unary_op_expression
                            regex: '^!'
                      - not:
                          inside:
                            stopBy: end
                            kind: binary_expression
                            has:
                              field: operator
                              not:
                                regex: '^(&&|and)$'
                  - all:
                      - inside:
                          stopBy: end
                          kind: unary_op_expression
                          regex: '^!'
                      - inside:
                          stopBy: end
                          kind: binary_expression
                          all:
                            - has:
                                field: operator
                                regex: '^(\|\||or)$'
                            - has:
                                stopBy: end
                                pattern: '''publish'' == $C[$K]'
                      - not:
                          inside:
                            stopBy:
                              kind: binary_expression
                              has:
                                stopBy: end
                                pattern: '''publish'' == $C[$K]'
                            kind: binary_expression
                            has:
                              field: operator
                              not:
                                regex: '^(\|\||or)$'
    - not:
        inside:
          stopBy: end
          inside:
            kind: if_statement
            field: body
            has:
              field: condition
              has:
                stopBy: end
                all:
                  - any:
                      - pattern: 'isset( $C[$K] )'
                      - pattern: '! empty( $C[$K] )'
                  - not:
                      inside:
                        stopBy:
                          any:
                            - kind: if_statement
                        not:
                          any:
                            - kind: parenthesized_expression
                            - kind: binary_expression
                            - kind: unary_op_expression
                            - kind: if_statement
                  - not:
                      inside:
                        stopBy: end
                        any:
                          - kind: unary_op_expression
                            regex: '^!'
                          - kind: binary_expression
                            has:
                              field: operator
                              not:
                                regex: '^(&&|and)$'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  known_false_positives: 'array_key_exists( ''post_status'', $c ) && ''publish'' == $c[''post_status''] (also as an enclosing if guard) is reported; early-return guard if ( ! isset( $c[''post_status''] ) ) { return; } before the read is reported; empty( $c[''post_status''] ) || ''publish'' == $c[''post_status''] and the else body of if ( ! isset( $c[''post_status''] ) ) { } else { read } are reported; guards joined with uppercase AND / OR are not recognised; a guard in an elseif condition enclosing the read is not recognised'
  todo_cases:
    - "<?php if ( ! ( ! isset( $c['post_status'] ) ) || 'publish' == $c['post_status'] ) { }"
    - "<?php $ok = 'publish' == $c['post_status'];"
    - "<?php if ( 'publish' === $c['post_status'] ) { }"
    - "<?php if ( $c['post_status'] == 'publish' ) { }"
    - "<?php if ( array_filter( $c, function ( $x ) use ( $c ) { if ( isset( $c['post_status'] ) ) { return true; } return false; } ) ) { if ( 'publish' == $c['post_status'] ) { } }"
