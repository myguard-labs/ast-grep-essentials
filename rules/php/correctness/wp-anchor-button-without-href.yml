id: wp-anchor-button-without-href
language: php
severity: warning
message: >-
  Anchor element with onclick but no href is not keyboard-focusable; use a
  button element instead.
note: >-
  Single-file syntactic check on literal string content only. It looks for an
  anchor tag containing onclick and lacking href in the string text; it does
  not resolve runtime HTML or verify that the string is output.
rule:
  kind: string
  regex: '<a\s[^>]*onclick='
  not:
    regex: '<a\s[^>]*href='
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'A double-quoted string such as "<a class=''x'' onclick=''go();''>Go</a>" is not reported (only kind string is matched)'
    - '''<a data-href="/x" onclick="go();">Go</a>'' is not reported: the href regex also matches data-href='
    - '''<a onclick="go();">Go</a> <a href="/y">Y</a>'' is not reported: a later anchor''s href suppresses the whole-string match'
