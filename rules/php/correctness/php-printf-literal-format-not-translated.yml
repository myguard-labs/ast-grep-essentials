id: php-printf-literal-format-not-translated
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-printf-untranslated-format. Untranslated printf
  format string literal; wrap it in a translation function such as __().
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-printf-untranslated-format and do not emit this rule.
rule:
  any:
    - pattern: 'printf(''$FMT'', $$$ARGS)'
    - pattern: 'printf($DQ, $$$ARGS)'
constraints:
  DQ:
    kind: argument
    has:
      kind: encapsed_string
      not:
        has:
          not:
            any:
              - kind: string_content
              - kind: escape_sequence
              - regex: '^"$'
metadata:
  deprecated_alias_of: php-printf-untranslated-format
  todo_cases:
    - "<?php \\printf( 'Revisions: %s', $count );"
    - "<?php printf( 'Revisions: %s' . \"\\n\", $count );"
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
