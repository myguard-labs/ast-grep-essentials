id: php-explode-destructure-unbounded
language: php
severity: warning
message: >-
  list() destructures exactly two targets from an explode() call with no limit
  argument; a value containing extra separators loses its tail.
note: >-
  Syntactic check only. Matches list() with two targets assigned from
  explode() with exactly two arguments. It cannot verify that the separator
  can occur in the data, that explode is the global PHP function, or value
  types, and it does no dataflow or reachability analysis.
rule:
  pattern: 'list($A, $B) = explode($SEP, $STR)'
