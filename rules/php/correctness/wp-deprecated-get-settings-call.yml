id: wp-deprecated-get-settings-call
language: php
severity: warning
message: 'Call to deprecated get_settings(); use get_option() instead.'
note: >-
  Syntactic name match only: flags any function call written as
  get_settings(...). It does not check that the call resolves to the WordPress
  core function, a namespaced or user-defined function, or any runtime or type
  condition.
rule:
  pattern: 'get_settings($$$ARGS)'
