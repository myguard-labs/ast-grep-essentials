# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-scripts-add-string-deps
language: php
severity: warning
message: >-
  This scripts add call passes a string literal where the dependency array
  belongs; the version string lands in the deps slot.
note: >-
  Matches the literal receiver syntax $scripts->add with a string literal
  third argument without resolving the receiver type or runtime values.
rule:
  pattern: '$scripts->add($HANDLE, $SRC, $STR)'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  known_false_positives: '$scripts->add( ''a'', ''/a.js'', array() ); and $scripts->add( ''a'', ''/a.js'', $deps ); are matched although the third argument is an array or variable, not a string literal'
  todo_cases:
    - 'Observed miss: the receiver is the literal $scripts, so $wp_scripts->add( ''a'', ''/a.js'', ''1.5.4'' ); and $this->add( ''a'', ''/a.js'', ''2.0'' ); are not matched.'
