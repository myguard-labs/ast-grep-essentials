# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-ob-gzhandler-output-buffer
language: php
severity: warning
message: >-
  ob_start() is called with the ob_gzhandler callback, which enables
  application-level gzip output buffering; review whether the web server or
  proxy should handle compression instead.
note: >-
  Purely syntactic match on a direct ob_start call whose first argument is the
  single-quoted or double-quoted literal 'ob_gzhandler'. It does not resolve
  function identity, namespaces, runtime configuration, or whether
  server-level encoding is also active.
rule:
  pattern: 'ob_start(''ob_gzhandler'')'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - "Double-quoted ob_start(\"ob_gzhandler\") is not reported (0 matches on 0.51.3 and 0.45.2) although the note names double-quoted literals."
    - "Namespace-qualified \\ob_start('ob_gzhandler') is not reported (0 matches)."
    - "ob_start('ob_gzhandler', 4096) with a second argument is not reported (0 matches)."
