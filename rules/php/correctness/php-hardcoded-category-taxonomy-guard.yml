# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-hardcoded-category-taxonomy-guard
language: php
severity: warning
message: >-
  Hard-coded 'category' taxonomy comparison gates behaviour; check a
  capability instead.
note: >-
  Syntactic match only on a literal 'category' string compared with != or !==
  inside an if condition. It does not resolve types, taxonomy registration, or
  runtime values.
rule:
  pattern: 'if ( ''category'' != $X ) $$$BODY'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - "FN: `if ( 'category' !== $t ) return;` is not matched although the note names !=="
    - "FN: `if ( $t != 'category' ) return;` (literal on the right) is not matched"
    - "FN: double-quoted `if ( \"category\" != $t ) { return; }` is not matched"
    - "FN: compound condition `if ( 'category' != $t && $x ) { return; }` is not matched"
