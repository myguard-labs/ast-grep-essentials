# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-or-same-operand-inequality-tautology
language: php
severity: warning
message: >-
  This || condition compares the same operand with != against two different
  literals, so it is always true.
note: >-
  Syntactic check only. Matches a single || of two != comparisons whose
  operand text is identical and whose other operands are string literals; does
  not resolve runtime values, aliases, or types.
rule:
  pattern: '''$L'' != $X || ''$R'' != $X'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-571'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/571.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'Observed miss: the same tautology with double-quoted literals is not reported (if ( "a" != $ext || "b" != $ext )).'
    - 'Observed miss: the same tautology with parenthesised comparisons is not reported (if ( ( ''a'' != $ext ) || ( ''b'' != $ext ) )).'
    - 'Observed miss: the same tautology with the low-precedence ''or'' keyword is not reported (if ( ''a'' != $ext or ''b'' != $ext )).'
    - 'Observed miss: the strict form with !== is not reported (if ( ''a'' !== $ext || ''b'' !== $ext )).'
