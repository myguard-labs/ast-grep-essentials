id: php-translation-in-attribute-unescaped
language: php
severity: warning
message: >-
  Translation echo inside a double-quoted HTML attribute should use
  esc_attr_e().
note: >-
  Single-file syntactic approximation. The rule only checks that a bare _e()
  expression statement directly follows an inline PHP open tag whose preceding
  inline HTML text ends with an open attribute quote (="). It does not verify
  that the attribute is still open, that the quote is double-quoted in all
  cases, or that the output is unescaped elsewhere.
rule:
  pattern: '_e($$$ARGS)'
  inside:
    kind: expression_statement
    follows:
      kind: php_tag
      follows:
        regex: '="$'
