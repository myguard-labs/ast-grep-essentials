# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-count-of-comparison-expression
language: php
severity: warning
message: >-
  count() is called on a comparison expression; count the array and then
  compare the result.
note: >-
  Syntactic match only on a count() call whose single argument is a binary
  greater-than comparison ($A > $B); other comparison operators are not matched. Does not verify that the argument is an array or
  resolve types or runtime values.
rule:
  pattern: 'count($A > $B)'
metadata:
  todo_cases:
    - 'FN: `count($a > $b, COUNT_RECURSIVE)` (mode argument present) is not reported'
    - 'FN: `\count($a > 0)` (fully qualified call) and `sizeof($a > $b)` are not reported'
