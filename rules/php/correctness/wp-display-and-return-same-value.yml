id: wp-display-and-return-same-value
language: php
severity: warning
message: >-
  This function echoes a value in an if-branch and also returns the same value
  at function level, so callers that echo the result will output it twice.
note: >-
  Single-file syntactic match only. It flags a function whose body contains an
  if-statement with an echo of an expression and a later function-level return
  of that same expression text. It does not resolve call sites, types, or
  runtime control flow.
rule:
  kind: function_definition
  all:
    - has:
        kind: compound_statement
        has:
          kind: if_statement
          has:
            kind: echo_statement
            pattern: 'echo $X;'
    - has:
        kind: compound_statement
        has:
          kind: return_statement
          pattern: 'return $X;'
metadata:
  todo_cases:
    - "wp-display-and-return-same-value: the braced form `if ( $display ) { echo $name; } return $name;` is not reported (probed: no match on 0.51.3 and 0.45.2); only the brace-less if body matches, so the common braced style is missed."
    - "wp-display-and-return-same-value: the same echo-and-return inside a class method (`public function show( $name, $display = true ) { if ( $display ) echo $name; return $name; }`) is not reported (probed: no match), only function_definition is matched."
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
