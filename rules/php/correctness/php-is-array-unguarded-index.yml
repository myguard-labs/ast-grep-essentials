  todo_cases:
    - "Observed FP: isset() followed by another operand before is_array() (isset( $this->args[0] ) && $flag && is_array( $this->args[0] )) is reported."
    - "Observed FP: an array_key_exists( 0, $args ) && is_array( $args[0] ) guard is reported although the index is checked."
    - "Observed FP: a longer || chain (! isset( $a[0] ) || $x || ! is_array( $a[0] )) is reported because the left-associative parse puts the isset operand outside the matched pattern."
