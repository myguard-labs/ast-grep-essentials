id: php-wp-die-printf-message
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-printf-result-as-argument. wp_die() receives a
  printf() call as its message; printf() returns a byte count, not the formatted
  string. Use sprintf() instead.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-printf-result-as-argument and do not emit this rule.
  Matches the literal syntax wp_die(printf(...)) with a direct printf call as
  the first argument. It does not verify that wp_die or printf are the
  WordPress functions, nor resolve aliases, namespaces, or runtime values.
rule:
  pattern: '$FUNC(printf($$$ARGS))'
metadata:
  deprecated_alias_of: php-printf-result-as-argument
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: wp_die( printf( ''%s'', $a ), ''Title'', array( ''response'' => 403 ) ) with extra wp_die arguments is not reported.'
    - 'FN: namespace-qualified \wp_die( \printf( ''x %s'', $a ) ) is not reported.'
