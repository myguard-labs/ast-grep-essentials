# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-wp-die-printf-message
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-printf-result-as-argument. A printf() call is
  passed as an argument (for example to wp_die()); printf() prints its text and
  returns a byte count, not the formatted string. Use sprintf() instead.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-printf-result-as-argument and do not emit this rule.
  It now matches any call that receives printf() as an argument, not only
  wp_die().
rule:
  pattern: 'printf($$$ARGS)'
  inside:
    kind: argument
metadata:
  deprecated_alias_of: php-printf-result-as-argument
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - "<?php \\wp_die( \\printf( '%s', $msg ) );"
