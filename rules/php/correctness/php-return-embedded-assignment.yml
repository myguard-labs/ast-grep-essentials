# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-return-embedded-assignment
language: php
severity: warning
message: >-
  Return statement contains an embedded assignment; assign the value to a
  variable first and return it separately.
note: >-
  Syntactic single-file check only. It matches a return statement whose
  returned expression is literally an assignment expression; it does not
  resolve types, aliasing, or runtime values.
rule:
  kind: return_statement
  has:
    kind: assignment_expression
    stopBy:
      any:
        - kind: function_definition
        - kind: anonymous_function
        - kind: arrow_function
        - kind: method_declaration
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'return $n += 1; (compound assignment) is not reported; only assignment_expression matches'
    - 'return foo( $x = 1 ); (assignment nested in a call argument, not the returned expression) is reported although the note says the returned expression is literally an assignment'
