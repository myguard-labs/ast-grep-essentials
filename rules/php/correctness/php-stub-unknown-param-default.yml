# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-stub-unknown-param-default
language: php
severity: error
message: >-
  Parameter default UNKNOWN is a stub placeholder, not a valid PHP default
  value.
note: >-
  Single-file syntactic check only. It flags a bare UNKNOWN name used as a
  simple parameter default. It cannot confirm that the file is a .stub.php
  file, that the function is a stub, or that UNKNOWN is not a real constant in
  a given context; file scoping is left to the harness.
rule:
  kind: name
  regex: '^UNKNOWN$'
  inside:
    kind: simple_parameter
    stopBy: end
metadata:
  rule_modified_at: '2026-10-10'
  ast_grep_tested_version: 0.45.3
