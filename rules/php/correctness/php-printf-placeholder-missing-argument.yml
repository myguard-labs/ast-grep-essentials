# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-printf-placeholder-missing-argument
language: php
severity: warning
message: >-
  This printf() call has a %s placeholder in its format string but no value
  argument after the format.
note: >-
  Matches only a literal printf call whose sole argument is a single string
  literal containing %s; it does not resolve runtime format strings or verify
  argument counts beyond this syntax.
rule:
  pattern: 'printf(''$FMT'')'
  regex: '%s'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: printf(''%d items''), printf(''<i>%1$s</i>'') and printf("<b>%s</b>") with %d, positional or double-quoted placeholders and no argument are not reported (pattern needs a single-quoted literal containing %s)'
    - 'FN: printf(__(''<i>%s</i>'')) with a translated format and no value argument is not reported'
