id: wp-untranslated-wp-error-message
language: php
severity: warning
message: >-
  WP_Error message is a bare single-quoted string literal; wrap it in __() or
  another translation function.
note: >-
  Syntactic check only. Matches new WP_Error(code, message) where the second
  argument text is a single-quoted string literal. It cannot tell whether the
  message is user-facing, does not check translation context, and does not
  match double-quoted strings, variables, or other non-literal messages.
rule:
  pattern: 'new WP_Error($CODE, $MSG)'
constraints:
  MSG:
    regex: '^''[^'']*''$'
