# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-array-keys-of-get-option
language: php
severity: warning
message: >-
  Array function applied directly to get_option() result without an array
  guard.
note: >-
  Syntactic match only; does not verify the option type at runtime or detect
  guards elsewhere in the file.
rule:
  pattern: 'array_keys(get_option($$$ARGS))'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - "Observed miss: \\array_keys( \\get_option( 'cron' ) ) (fully qualified calls) is not matched (probed 0.51.3 and 0.45.2)."
    - "Observed miss: array_keys( get_option( 'a' ), 'x' ) with a search-value second argument is not matched."
