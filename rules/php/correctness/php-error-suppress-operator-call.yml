id: php-error-suppress-operator-call
language: php
severity: warning
message: >-
  Error suppression with @ hides warnings from this call; check the return
  value explicitly.
note: >-
  Syntactic match on the @ operator applied directly to a function call used
  as a value. It does not confirm the call fails or that the suppressed
  warning matters, and it does not resolve the called function's identity or
  runtime behavior. Calls to header, rename, parse_url, closedir, dl,
  mb_internal_encoding and constant (exact lowercase, unqualified name) are
  left to their callee-specific rules.
rule:
  pattern: '@$F($$$ARGS)'
constraints:
  F:
    not:
      regex: '^(header|rename|parse_url|closedir|dl|mb_internal_encoding|constant)$'
