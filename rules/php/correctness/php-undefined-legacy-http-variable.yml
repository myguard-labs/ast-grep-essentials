id: php-undefined-legacy-http-variable
language: php
severity: warning
message: >-
  Bare legacy HTTP_ prefixed variable (a register_globals style CGI header
  variable such as $HTTP_USER_AGENT) is read directly; it is undefined in
  modern PHP. Read it from the SERVER superglobal with a subscript instead.
  The removed HTTP_*_VARS arrays and HTTP_POST_FILES are reported by
  php-http-vars-legacy-superglobal.
note: >-
  Matches variable names by literal text only; it does not check whether the
  variable was assigned elsewhere or register_globals semantics.
rule:
  all:
    - kind: variable_name
    - regex: '^\$HTTP_'
    - not:
        regex: '^\$HTTP_(GET|POST|COOKIE|SERVER|ENV|SESSION)_VARS$|^\$HTTP_POST_FILES$'
