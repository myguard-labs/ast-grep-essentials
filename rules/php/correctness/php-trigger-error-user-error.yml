id: php-trigger-error-user-error
language: php
severity: warning
message: >-
  trigger_error() is called with E_USER_ERROR, which halts the script. It
  cannot be caught with try/catch, although set_error_handler() can intercept
  it. Consider throwing an exception instead.
note: >-
  Matches the literal call trigger_error(..., E_USER_ERROR) by syntax only; it
  does not resolve namespaces, aliases, or whether the constant is redefined.
rule:
  pattern: 'trigger_error($MSG, E_USER_ERROR)'
metadata:
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - "<?php \\trigger_error('bad', E_USER_ERROR);"
    - "<?php trigger_error('bad', \\E_USER_ERROR);"
    - "<?php trigger_error(error: 'bad', error_level: E_USER_ERROR);"
    - "<?php user_error('bad', E_USER_ERROR);"
