id: php-error-suppress-array-index
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-error-suppress-array-access. Error suppression (@)
  is applied to an array subscript read; check the key explicitly instead of
  hiding errors.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-error-suppress-array-access and do not emit this rule.
rule:
  pattern: '@$ARR[$KEY]'
metadata:
  deprecated_alias_of: php-error-suppress-array-access
