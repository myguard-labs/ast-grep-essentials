id: php-error-suppression-operator-call
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-error-suppress-operator-call. This function call
  is prefixed with the @ error-suppression operator, which hides its warnings
  and errors. Consider an explicit check instead.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-error-suppress-operator-call and do not emit this rule.
rule:
  pattern: '@$F($$$ARGS)'
metadata:
  deprecated_alias_of: php-error-suppress-operator-call
