id: php-superglobal-read-without-isset
language: php
severity: warning
message: >-
  Superglobal element ($_GET, $_POST, $_REQUEST or $_COOKIE) is compared
  without an isset(), empty() or array_key_exists() check in the same
  expression.
note: >-
  Syntactic only; it does not verify that an enclosing isset() guards the same
  key, or any guard outside the enclosing expression.
rule:
  all:
    - kind: binary_expression
    - has:
        field: operator
        regex: '^(==|!=|===|!==|<>)$'
    - has:
        kind: subscript_expression
        regex: '^\$_(GET|POST|REQUEST|COOKIE)\['
    - not:
        inside:
          stopBy: end
          kind: binary_expression
          has:
            stopBy: end
            kind: function_call_expression
            regex: '^\\?(?i:isset|empty|array_key_exists)\s*\('
metadata:
  todo_cases:
    - 'FN: `if ( isset( $_GET[''b''] ) && $_GET[''a''] == ''x'' )` is not reported (an isset of another key, or one after the read, suppresses it).'
