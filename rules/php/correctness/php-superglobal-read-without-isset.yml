id: php-superglobal-read-without-isset
language: php
severity: warning
message: >-
  A GET, POST, REQUEST or COOKIE superglobal element is compared without an
  isset(), empty() or array_key_exists() check in the same expression.
note: >-
  Syntactic only; it does not verify that an enclosing isset() guards the same
  key, or any guard outside the enclosing expression.
rule:
  all:
    - kind: binary_expression
    - has:
        field: operator
        regex: '^(==|!=|===|!==|<>|<|>|<=|>=|<=>)$'
    - has:
        kind: subscript_expression
        regex: '^\$_(GET|POST|REQUEST|COOKIE)\['
    - not:
        inside:
          stopBy: end
          kind: binary_expression
          has:
            stopBy: end
            kind: function_call_expression
            regex: '^\\?(?i:isset|empty|array_key_exists)\s*\('
metadata:
  todo_cases:
    - "<?php if ( isset( $_GET['b'] ) && $_GET['a'] == 'x' ) { }"
    - "<?php if ( $_GET['a'] == 'x' && isset( $_GET['a'] ) ) { }"
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
  created_at: '2026-10-18'
