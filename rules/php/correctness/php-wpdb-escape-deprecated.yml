# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-wpdb-escape-deprecated
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use wp-wpdb-escape-deprecated. Replace the deprecated
  wpdb escape() call with $wpdb->prepare() or esc_sql().
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use wp-wpdb-escape-deprecated and do not emit this rule.
rule:
  pattern: '$wpdb->escape($$$ARGS)'
metadata:
  deprecated_alias_of: wp-wpdb-escape-deprecated
  rule_modified_at: '2026-11-18'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: a nullsafe call (`$s = $wpdb?->escape( $input );`) is not reported (observed 0 matches on 0.51.3 and 0.45.2).'
    - 'FN: a property receiver (`$s = $this->wpdb->escape( $input );`) is not reported (observed 0 matches on 0.51.3 and 0.45.2).'
