id: wp-tag-branch-uses-cat-title
language: php
severity: warning
message: >-
  Tag-archive branch calls the category-specific title helper
  single_cat_title().
note: >-
  Purely syntactic match on a direct is_tag() guard whose body calls
  single_cat_title(); it does not resolve WordPress runtime state, template
  context, or whether the branch is reachable.
rule:
  pattern: |
    if (is_tag()) { single_cat_title(); }
metadata:
  todo_cases:
    - "Observed miss: the braceless form if (is_tag()) single_cat_title(); is not reported (0 matches on both CLIs)."
    - "Observed miss: single_cat_title( '', false ) with arguments, and echo single_cat_title(); inside an is_tag() branch, are not reported (0 matches)."
    - "Observed miss: a branch that has another statement before the call, if (is_tag()) { prep(); single_cat_title(); }, is not reported (0 matches)."
