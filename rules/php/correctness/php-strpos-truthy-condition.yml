id: php-strpos-truthy-condition
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-strpos-bare-truthy-condition. strpos() used as a
  bare if-condition treats a match at offset 0 as false; compare explicitly
  with false.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-strpos-bare-truthy-condition and do not emit this rule.
rule:
  pattern: 'if (strpos($$$ARGS)) $$$BODY'
metadata:
  deprecated_alias_of: php-strpos-bare-truthy-condition
