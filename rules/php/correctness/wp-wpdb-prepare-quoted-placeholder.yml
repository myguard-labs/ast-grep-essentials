id: wp-wpdb-prepare-quoted-placeholder
language: php
severity: warning
message: >-
  A placeholder inside the SQL passed to wpdb::prepare is wrapped in quotes
  even though this placeholder type should be left unquoted. WordPress strips
  quotes around plain %s placeholders, while numeric and identifier
  placeholders do not need SQL quotes. Remove the surrounding quotes.
note: >-
  Regex-matches a quoted plain %s or a quoted %d, %f or %i placeholder, with
  optional numeric formatting, in the first argument of a prepare call on a
  wpdb-like object. Numbered or formatted string placeholders such as %1$s and
  %05s are the documented compatibility exception and are intentionally not
  reported. The rule reads literal SQL text only, so a query assembled in a
  variable before the call is not seen, and a quoted percent sequence inside
  data rather than a placeholder position would match.
rule:
  kind: member_call_expression
  all:
    - has:
        field: name
        regex: '(?i)^prepare$'
    - has:
        field: object
        kind: variable_name
        regex: '(?i)^\$[a-z_][a-z0-9_]*db$'
    - has:
        field: arguments
        has:
          kind: argument
          nthChild:
            position: 1
            ofRule: {kind: argument}
          has:
            any:
              - kind: string
              - kind: encapsed_string
            regex: "(\x27%(?:s|(?:[1-9][0-9]*\\\\?\\$)?[-+0-9]*(?: |0|\x27.)?[-+0-9]*(?:\\.[0-9]+)?[dfFi])\x27|\"%(?:s|(?:[1-9][0-9]*\\\\?\\$)?[-+0-9]*(?: |0|\x27.)?[-+0-9]*(?:\\.[0-9]+)?[dfFi])\")"
