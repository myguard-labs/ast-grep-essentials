id: wp-echo-template-tag-as-value
language: php
severity: warning
message: >-
  A WordPress echo-style template tag is used as an argument value; it prints
  output directly and returns nothing. Use the get_the_* variant instead.
note: >-
  Syntactic match only on a direct call to a literal the_* function name used
  as an argument inside a printf call. It does not verify that the function is
  a WordPress template tag or resolve namespaces, imports, or runtime
  identity.
rule:
  pattern: 'printf($$$ARGS, the_title())'
metadata:
  todo_cases:
    - "wp-echo-template-tag-as-value: other the_* tags as a printf argument (`printf( '%s', the_content() );`, `printf( '%s', the_permalink() );`) and `sprintf( '%s', the_title() );` are not reported (probed: no match); the pattern is printf(..., the_title()) only, though the note says any the_* name."
    - "wp-echo-template-tag-as-value: `printf( the_title(), 'x' );` (the_title not last) is not reported (probed: no match)."
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
