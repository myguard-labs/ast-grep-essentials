# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-remove-all-filters-literal-hook
language: php
severity: warning
message: >-
  remove_all_filters() with a literal hook name strips every callback on that
  hook, including those registered by other plugins or core. Narrow the
  removal to a named callback with remove_filter().
note: >-
  Purely syntactic match on a direct remove_all_filters call whose first
  argument is a string literal. It does not resolve function identity,
  imports, or whether the hook has other callbacks at runtime.
rule:
  pattern: 'remove_all_filters($HOOK)'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  known_false_positives: 'remove_all_filters( $hook ); (non-literal hook) is reported although the message says literal hook'
  todo_cases:
    - '\remove_all_filters( ''wp_head'' ); (fully qualified call) is not reported'
    - 'remove_all_filters( ''init'', 20 ); (priority argument) is not reported'
    - 'remove_all_actions( ''init'' ); (same strip-everything effect on an action hook) is not reported'
