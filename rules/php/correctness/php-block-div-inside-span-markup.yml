# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-block-div-inside-span-markup
language: php
severity: warning
message: >-
  A <div> element appears inside a <span> opening tag in a string literal;
  this is invalid inline-in-block nesting.
note: >-
  Syntactic string-content heuristic only. It matches literal text containing
  a span start tag followed later by a div start tag in the same string; it
  does not verify the generated HTML, runtime values, or whether the string is
  rendered.
rule:
  kind: string
  regex: '<span[^>]*>.*<div'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: double-quoted markup `"<span class=''a''><div>x</div></span>"` is not reported (encapsed_string, rule matches kind string only)'
    - 'FP: sequential siblings `''<span>a</span><div>b</div>''` are reported although the span is closed before the div (regex only orders the tags)'
