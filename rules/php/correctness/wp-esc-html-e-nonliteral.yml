id: wp-esc-html-e-nonliteral
language: php
severity: warning
message: >-
  esc_html_e() is called with a function call as its only argument instead of
  a literal string.
note: >-
  Single-file syntactic check only. It flags a single function-call argument
  to esc_html_e() and cannot verify what the call returns, resolve types,
  aliases, or dataflow. Multi-argument calls, variables, and other non-call
  expressions are not matched. Because the check is structural, a call nested
  anywhere inside the single argument may also be flagged.
rule:
  pattern: 'esc_html_e($CALL)'
constraints:
  CALL:
    all:
      - kind: argument
      - has:
          kind: function_call_expression
