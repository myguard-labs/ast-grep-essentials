  todo_cases:
    - "Observed FP: a negated isset guard (if ( ! isset( $data['k'] ) || ! is_array( $data['k'] ) ) { return; }) is reported although is_array() only runs when the offset exists."
    - "Observed FP: isset() followed by another operand before is_array() (isset( $data[ $i ] ) && ! empty( $x ) && is_array( $data[ $i ] )) is reported."
