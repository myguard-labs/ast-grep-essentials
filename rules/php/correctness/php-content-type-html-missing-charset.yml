# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-content-type-html-missing-charset
language: php
severity: warning
message: >-
  This header() call sets Content-Type to text/html without a charset
  parameter; add an explicit charset such as utf-8.
note: >-
  Matches only a literal header() argument containing text/html with no
  charset in the same string. It does not inspect runtime values, other header
  calls, ini settings, or meta tags.
rule:
  pattern: 'header(''Content-Type: text/html'')'
metadata:
  todo_cases:
    - 'FN: `header("Content-Type: text/html");` (double-quoted) is not reported'
    - 'FN: `header(''Content-Type: text/html'', true);` and `header(''Content-Type: text/html'', true, 200);` (extra arguments) are not reported'
    - 'FN: `\header(''Content-Type: text/html'');` and lower-case `content-type: text/html` are not reported'
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
