# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-strpos-bare-truthy-condition
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-strpos-truthiness-as-boolean. strpos() used as a
  bare truthy condition treats a match at offset 0 as no match; compare with
  !== false instead.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-strpos-truthiness-as-boolean and do not emit this rule.
rule:
  all:
    - pattern: 'strpos($$$ARGS)'
    - inside:
        kind: parenthesized_expression
        inside:
          kind: if_statement
          stopBy: end
    - not:
        inside:
          kind: binary_expression
          stopBy: end
metadata:
  deprecated_alias_of: php-strpos-truthiness-as-boolean
  rule_modified_at: '2026-11-18'
  created_at: '2026-10-16'
