id: php-error-suppressed-superglobal-read
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-error-suppress-array-access. Superglobal read is
  prefixed with the @ error-suppression operator; use an explicit isset guard
  instead.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-error-suppress-array-access and do not emit this rule.
rule:
  pattern: '@$ARR[$KEY]'
metadata:
  deprecated_alias_of: php-error-suppress-array-access
