# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-parse-str-unguarded-parse-url-query
language: php
severity: warning
message: >-
  parse_str() is called on a parse_url() query element without a visible
  non-empty or set check.
note: >-
  Single-file syntactic match on a literal parse_url()-assigned variable
  indexed by 'query'; it does not resolve types, aliases, or reachability and
  cannot prove the guard is absent on every path.
utils:
  leaves-block:
    any:
      - kind: return_statement
      - kind: exit_statement
      - kind: continue_statement
      - kind: break_statement
      - kind: expression_statement
        has:
          kind: throw_expression
      - kind: expression_statement
        has:
          kind: function_call_expression
          has:
            field: function
            regex: '^(?i:die|exit)$'
rule:
  all:
    - pattern: 'parse_str($PARSED[''query''], $OUT)'
    - not:
        inside:
          kind: if_statement
          stopBy: end
          has:
            any:
              - pattern: 'empty($PARSED[''query''])'
              - all:
                  - pattern: 'isset($PARSED[''query''])'
                  - not:
                      inside:
                        kind: unary_op_expression
                        regex: '^!'
                        stopBy:
                          not:
                            kind: parenthesized_expression
            stopBy: end
    - not:
        inside:
          kind: expression_statement
          follows:
            kind: if_statement
            stopBy: end
            all:
              - has:
                  field: condition
                  has:
                    any:
                      - pattern: 'empty($PARSED[''query''])'
                      - pattern: '! isset($PARSED[''query''])'
              - has:
                  field: body
                  any:
                    - matches: leaves-block
                    - kind: compound_statement
                      has:
                        matches: leaves-block
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'Observed miss: a double-quoted index is not reported (parse_str($p["query"], $q);).'
    - '<?php if ( empty( $p[''query''] ) ) { parse_str($p[''query''], $q); }'
    - '<?php if ( isset( $p[''query''] ) ) { echo 1; } else { parse_str($p[''query''], $q); }'
    - '<?php if ( empty( $p[''query''] ) ) { return; } $p = parse_url($v); parse_str($p[''query''], $q);'
    - '<?php if ( isset( $p[''query''] ) || $force ) { parse_str($p[''query''], $q); }'
