id: php-superglobal-compare-unguarded
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-superglobal-read-without-isset. A POST
  superglobal index is compared without an isset(), empty() or
  array_key_exists() guard in the same condition.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-superglobal-read-without-isset and do not emit this
  rule.
rule:
  all:
    - kind: binary_expression
    - has:
        field: operator
        regex: '^(==|!=|===|!==|<>|<|>|<=|>=|<=>)$'
    - has:
        kind: subscript_expression
        regex: '^\$_(GET|POST|REQUEST|COOKIE)\['
    - not:
        inside:
          stopBy: end
          kind: binary_expression
          has:
            stopBy: end
            kind: function_call_expression
            regex: '^\\?(?i:isset|empty|array_key_exists)\s*\('
metadata:
  deprecated_alias_of: php-superglobal-read-without-isset
