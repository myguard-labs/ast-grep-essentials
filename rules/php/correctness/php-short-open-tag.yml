# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-short-open-tag
language: php
severity: warning
message: 'Short PHP open tag followed by whitespace; use <?php instead.'
note: >-
  Whether a short open tag runs as PHP depends on the short_open_tag ini
  setting, which is runtime configuration. This single-file syntactic rule
  only checks the source text at the start of the file and cannot check the
  server configuration.
rule:
  kind: program
  regex: '^<\?\s'
metadata:
  rule_modified_at: '2026-10-10'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-10'
