id: php-error-suppression-operator
language: php
severity: warning
message: >-
  The @ operator silences all warnings and notices from the expression it
  prefixes; check the result or failure explicitly instead.
note: >-
  Single-file syntactic match on any expression prefixed by the @ silencing
  operator that occurs inside an expression statement, including nested positions
  such as call arguments, operands and assignment right-hand sides (calls, property
  reads, array reads, variables, includes, new). Does not match @ in echo, return
  or if/while conditions, unless that code sits in a closure inside an expression
  statement (array_map(function ($x) { return @foo($x); }, $a); is reported). Does
  not resolve function identity, types, or whether the failure is handled
  elsewhere.
rule:
  pattern: '@$CALL'
  inside:
    kind: expression_statement
    stopBy: end
