id: php-error-suppression-operator
language: php
severity: warning
message: >-
  The @ operator silences all warnings and notices from the expression it
  prefixes; check the result or failure explicitly instead.
note: >-
  Single-file syntactic match on any @-prefixed expression (calls, property
  reads, array reads, variables, includes, new), including nested positions
  such as call arguments, operands, assignment right-hand sides and if/while
  conditions. Deliberately skips @ located inside an echo statement. Does not
  resolve function identity, types, or whether the failure is handled
  elsewhere.
rule:
  pattern: '@$CALL'
  not:
    inside:
      kind: echo_statement
      stopBy: end
