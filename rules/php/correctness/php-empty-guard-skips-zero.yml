id: php-empty-guard-skips-zero
language: php
severity: warning
message: >-
  empty() on an array element treats the string '0' as empty, so a valid
  payload of '0' can be dropped. Use is_null() or a strict comparison for
  string payloads.
note: >-
  Syntactic only: this matches every empty() call whose argument is an array
  element. It cannot determine whether the value is a string, so it may flag
  non-string uses where empty() is intended.
rule:
  pattern: 'empty($ARR[$KEY])'
