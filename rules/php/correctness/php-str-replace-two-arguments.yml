id: php-str-replace-two-arguments
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-str-replace-two-args. str_replace() is called with
  only two arguments and will raise an ArgumentCountError on PHP 8.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-str-replace-two-args and do not emit this rule.
rule:
  pattern: 'str_replace($A, $B)'
metadata:
  deprecated_alias_of: php-str-replace-two-args
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: \str_replace(''a'', ''b'') (leading backslash) is not reported'
    - 'FN: STR_REPLACE(''a'', ''b'') (upper-case call name, case-insensitive in PHP) is not reported'
