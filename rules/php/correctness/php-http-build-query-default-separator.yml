id: php-http-build-query-default-separator
language: php
severity: warning
message: >-
  http_build_query called with a single argument relies on the
  arg_separator.output ini setting for the pair separator; pass the separator
  explicitly as the third argument.
note: >-
  Single-file syntactic check only: it flags any http_build_query call with
  exactly one argument. It does not inspect the arg_separator.output value at
  runtime, the data argument's type, or whether the call site is reachable, so
  a single-argument call may be safe if the ini setting is known to be '&'.
rule:
  pattern: 'http_build_query($DATA)'
