id: php-curl-error-return-without-close
language: php
severity: warning
message: 'Returns from a curl_error() check without closing the curl handle.'
note: >-
  Single-file syntactic approximation. Matches an if statement whose condition
  calls curl_error() and whose body contains a return statement but no
  curl_close() call. It does not verify that the handle variables match,
  reachability, or that the handle is closed elsewhere.
rule:
  all:
    - kind: if_statement
    - has:
        field: condition
        pattern: 'curl_error($H)'
        stopBy: end
    - has:
        kind: return_statement
        stopBy: end
    - not:
        has:
          pattern: 'curl_close($C)'
          stopBy: end
