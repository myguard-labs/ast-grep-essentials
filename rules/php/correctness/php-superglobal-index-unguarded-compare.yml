id: php-superglobal-index-unguarded-compare
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-superglobal-read-without-isset. An equality comparison reads a GET superglobal index without an isset() or empty() guard.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-superglobal-read-without-isset and do not emit this rule.
rule:
  all:
    - kind: binary_expression
    - has:
        field: operator
        regex: '^(==|!=|===|!==|<>)$'
    - has:
        kind: subscript_expression
        regex: '^\$_(GET|POST|REQUEST|COOKIE)\['
    - not:
        inside:
          stopBy: end
          kind: binary_expression
          regex: 'isset\s*\(|empty\s*\(|array_key_exists\s*\('
metadata:
  deprecated_alias_of: php-superglobal-read-without-isset
  rule_modified_at: '2026-11-18'
  created_at: '2026-10-18'
