id: wp-sprintf-untranslated-format-literal
language: php
severity: warning
message: >-
  This sprintf format string is a bare string literal with a % specifier and
  is not wrapped in a translation call; consider wrapping it in __().
note: >-
  Syntactic check only. Matches a direct sprintf call whose first argument is
  a bare string literal containing a % specifier, and skips calls where that
  literal is the direct argument of __(). It does not know whether the output
  is user-visible or whether the format is translated elsewhere.
rule:
  pattern: 'sprintf($FMT, $$$ARGS)'
  all:
    - has:
        kind: string
        regex: '%'
        stopBy: end
    - not:
        has:
          pattern: '__($$$_)'
          stopBy: end
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: sprintf( ''%s: %s'', __( ''Name'', ''td'' ), $n ) has an untranslated literal format but a __() in a later argument suppresses the rule (observed: no report)'
    - 'FP: sprintf( _n( ''%d item'', ''%d items'', $n, ''td'' ), $n ) has a translated format but is reported (observed: report; only __() is exempted)'
    - 'FP: sprintf( esc_html__( ''Created %s'', ''td'' ), $d ) has a translated format but is reported (observed: report; only __() is exempted)'
