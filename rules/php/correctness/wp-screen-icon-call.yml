id: wp-screen-icon-call
language: php
severity: 'off'
message: 'Deprecated rule ID; use wp-screen-icon-deprecated-call. Call to the deprecated screen_icon() helper (deprecated since WordPress 3.8); remove it.'
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use wp-screen-icon-deprecated-call and do not emit this rule.
rule:
  pattern: 'screen_icon($$$ARGS)'
metadata:
  deprecated_alias_of: wp-screen-icon-deprecated-call
  todo_cases:
    - "<?php \\screen_icon();"
  rule_modified_at: '2026-11-18'
  created_at: '2026-10-15'
