id: wp-get-results-row-array-access
language: php
severity: warning
message: >-
  Array-style access on a $wpdb->get_results() result reads a stdClass row as
  an array; use property access or get_row().
note: >-
  Syntactic match only. It flags a literal $wpdb->get_results(...) call
  directly indexed with [..]; it does not track variables assigned from
  get_results or confirm the returned type at runtime.
rule:
  pattern: '$wpdb->get_results($$$ARGS)[$KEY]'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  known_false_positives: '$wpdb->get_results( $q, ARRAY_A )[0][''Type''] is flagged although ARRAY_A rows are arrays; $wpdb->get_results( $q )[0]->Type is flagged although the first index selects a row object and the row is read as an object'
  todo_cases:
    - '$this->wpdb->get_results( $q )[0][''Type''] is not flagged: the pattern needs the literal $wpdb receiver (probed 0.51.3 and 0.45.2)'
