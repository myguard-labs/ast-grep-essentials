# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-content-type-header-unconditional-overwrite
language: php
severity: warning
message: >-
  Unconditional assignment overwrites a Content-Type header that the caller
  may have set.
note: >-
  Syntactic single-file check only. It does not prove the header was
  caller-supplied, does not verify that the enclosing if's isset() tests the
  same element in a way that guards this assignment (including else branches),
  and does not handle array_key_exists() guards.
rule:
  pattern: '$R[''headers''][''Content-Type''] = $V'
  not:
    inside:
      kind: if_statement
      stopBy: end
      has:
        pattern: 'isset($R[''headers''][''Content-Type''])'
        stopBy: end
metadata:
  todo_cases:
    - 'FP: `if ( ! array_key_exists( ''Content-Type'', $r[''headers''] ) ) { $r[''headers''][''Content-Type''] = ''x''; }` is reported (documented in note)'
    - 'FN: `$r[''headers''][''Content-Type''] .= ''; charset=utf-8'';` and lower-case key `content-type` are not reported'
  rule_modified_at: '2026-10-10'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-10'
  created_at: '2026-10-10'
