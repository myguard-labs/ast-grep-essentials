id: php-content-type-header-unconditional-overwrite
language: php
severity: warning
message: >-
  Unconditional assignment overwrites a Content-Type header that the caller
  may have set.
note: >-
  Syntactic single-file check only. It does not prove the header was
  caller-supplied, does not verify that the enclosing if's isset() tests the
  same element in a way that guards this assignment (including else branches),
  and does not handle array_key_exists() guards.
rule:
  pattern: '$R[''headers''][''Content-Type''] = $V'
  not:
    inside:
      kind: if_statement
      stopBy: end
      has:
        pattern: 'isset($R[''headers''][''Content-Type''])'
        stopBy: end
