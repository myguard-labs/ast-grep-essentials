id: php-trigger-error-user-error-level
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-trigger-error-user-error. This trigger_error()
  call passes E_USER_ERROR as its error level, which halts execution.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-trigger-error-user-error and do not emit this rule.
rule:
  pattern: 'trigger_error($MSG, E_USER_ERROR)'
metadata:
  deprecated_alias_of: php-trigger-error-user-error
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - "<?php \\trigger_error('bad', E_USER_ERROR);"
    - "<?php trigger_error('bad', \\E_USER_ERROR);"
    - "<?php trigger_error(error: 'bad', error_level: E_USER_ERROR);"
    - "<?php user_error('bad', E_USER_ERROR);"
