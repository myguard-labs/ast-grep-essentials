# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-count-comparison-argument
language: php
severity: warning
message: >-
  count() is given a comparison expression as its argument; the comparison
  yields a bool, not a countable value.
note: >-
  Syntactic match only: a call count($A > $B) with the greater-than
  operator directly inside the parentheses; other comparison operators are not
  matched. Does not verify the operand types or
  runtime values.
rule:
  pattern: 'count($A > $B)'
metadata:
  todo_cases:
    - "<?php count($a > $b, COUNT_RECURSIVE);"
    - "<?php \\count($a > $b);"
    - "<?php sizeof($a > $b);"
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
