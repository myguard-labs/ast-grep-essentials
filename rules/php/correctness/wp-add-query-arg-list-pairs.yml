id: wp-add-query-arg-list-pairs
language: php
severity: error
message: >-
  add_query_arg() is given a positional two-element list array instead of key
  => value pairs.
note: >-
  Syntactic check only: matches add_query_arg() calls whose first argument is
  a two-element array literal with no '=>' in either element. It does not
  verify the function is WordPress's, does not check types or runtime values,
  and does not catch other list shapes.
rule:
  pattern: 'add_query_arg(array($A, $B), $$$REST)'
constraints:
  A:
    not:
      regex: '=>'
  B:
    not:
      regex: '=>'
