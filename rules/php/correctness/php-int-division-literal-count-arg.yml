id: php-int-division-literal-count-arg
language: php
severity: warning
message: >-
  Integer literal division inside the count argument of array_fill() yields a
  float; use intdiv() instead.
note: >-
  Syntactic only. Matches an integer-literal-by-integer-literal `/` expression
  that is the second (count) argument of a direct array_fill() call, bare,
  parenthesized, or as the left operand of a `+`; it does not resolve types,
  imports, or runtime values, does not flag variable operands, and does not
  check other int-typed builtins.
rule:
  any:
    - pattern: 'array_fill($A, ($B / $C) + $D, $$$AFTER)'
    - pattern: 'array_fill($A, ($B / $C), $$$AFTER)'
    - pattern: 'array_fill($A, $B / $C, $$$AFTER)'
constraints:
  B:
    kind: integer
  C:
    kind: integer
