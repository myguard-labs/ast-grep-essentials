id: php-http-response-header-unglobaled-read
language: php
severity: warning
message: >-
  This function reads $http_response_header without a global declaration in
  the same function body.
note: >-
  Single-file syntactic check. It looks only for a function body that contains
  the $http_response_header variable, no global statement naming it in that
  function, and no direct call to a stream-wrapper reader (file_get_contents,
  fopen, file, readfile, copy) that creates the variable in the local scope.
  It does not verify reachability or the runtime scope that the HTTP stream
  wrapper uses, and it covers function definitions, not methods.
rule:
  all:
    - kind: function_definition
    - has:
        pattern: '$http_response_header'
        stopBy: end
    - not:
        has:
          pattern: 'global $http_response_header;'
          stopBy: end
    - not:
        has:
          kind: function_call_expression
          stopBy: end
          has:
            field: function
            regex: '^(file_get_contents|fopen|file|readfile|copy)$'
