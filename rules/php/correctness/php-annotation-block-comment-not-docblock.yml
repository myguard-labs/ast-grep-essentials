id: php-annotation-block-comment-not-docblock
language: php
severity: warning
message: >-
  Block comment opened with /* carries @-annotation tags before a class
  declaration; only /** docblocks are read by annotation tools, so this
  annotation is ignored.
note: >-
  Syntactic check only. It confirms a comment that starts with /* (not /**),
  contains @tag text, and directly precedes a class declaration in the same
  file. It does not verify that any tool reads the annotation or evaluate
  comment semantics.
rule:
  all:
    - kind: comment
    - regex: '^/\*[^*]'
    - regex: '@[A-Za-z]'
    - precedes:
        kind: class_declaration
        stopBy: neighbor
