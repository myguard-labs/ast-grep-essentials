id: php-implicit-nullable-param
language: php
severity: warning
message: >-
  Typed parameter with a null default lacks an explicit nullable type; add a
  leading ? to the type.
note: >-
  Syntactic check only. Matches a literal array type hint with a null default
  on a parameter; it does not resolve class types, unions, or runtime
  behavior.
rule:
  pattern: 'function $NAME( array $ARG = null ) {}'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'A non-empty function body, a preceding or following parameter, a method or closure, and a by-reference parameter are not matched: function f( array $a = null ) { return 1; } and class C { public function m( array $a = null ) {} } stay silent.'
    - 'False positive: a non-null array default (function f( array $a = [] ) {}) is matched although it needs no leading ?.'
    - 'A non-array type with a null default (function f( int $a = null ) {}) is the same implicit-nullable defect but is not matched.'
