id: php-implicit-nullable-param
language: php
severity: warning
message: >-
  Typed parameter with a null default lacks an explicit nullable type; add a
  leading ? to the type.
note: >-
  Syntactic check only. Matches a literal array type hint with a null default
  on a parameter; it does not resolve class types, unions, or runtime
  behavior.
rule:
  pattern: 'function $NAME( array $ARG = null ) {}'
  has:
    stopBy: end
    kind: simple_parameter
    has:
      field: default_value
      regex: '(?i)^\(*\s*\\?null\s*\)*$'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - "<?php function f( array $a = null ) { return 1; }"
    - "<?php function f( $x, array $a = null ) {}"
    - "<?php function f( array $a = null, $y = 1 ) {}"
    - "<?php class C { public function m( array $a = null ) {} }"
    - "<?php $c = function ( array $a = null ) {};"
    - "<?php function f( array &$a = null ) {}"
    - "<?php function f( int $a = null ) {}"
