id: php-extension-denylist-case-sensitive
language: php
severity: warning
message: >-
  in_array membership test on a raw pathinfo extension is case-sensitive;
  upper-case variants of a denied extension can bypass it. Normalize with
  strtolower first.
note: >-
  Syntactic only. This matches in_array calls whose first argument is written
  directly as pathinfo(..., PATHINFO_EXTENSION). It misses extensions that are
  stored in a variable first or lowercased elsewhere. It does not check
  whether the list is a denylist or whether the server treats file names
  case-insensitively.
rule:
  pattern: 'in_array(pathinfo($NAME, PATHINFO_EXTENSION), $$$REST)'
