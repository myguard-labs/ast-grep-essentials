# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-removed-http-vars-superglobal
language: php
severity: 'off'
message: >-
  Deprecated rule ID; use php-http-vars-legacy-superglobal. Legacy HTTP
  POST, GET and SERVER variable arrays were removed in PHP 5.4.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use php-http-vars-legacy-superglobal and do not emit this rule.
rule:
  kind: variable_name
  regex: '^\$?HTTP_((GET|POST|COOKIE|SERVER|ENV|SESSION)_VARS|POST_FILES)$'
metadata:
  deprecated_alias_of: php-http-vars-legacy-superglobal
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-18'
  created_at: '2026-10-18'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - '$HTTP_COOKIE_VARS[''a''] (also removed in PHP 5.4) is not reported; regex lists only POST, GET and SERVER'
