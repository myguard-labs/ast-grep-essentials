# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-call-time-pass-by-reference
language: php
severity: error
message: >-
  Call-time pass-by-reference (a leading & on a call argument) is a fatal
  error on PHP 5.4 and later; remove the &.
note: >-
  Syntactic single-file match only. It flags a call argument whose source text
  begins with &. It does not check the callee, its signature, types, or
  aliasing, and it does not match a reference inside an array literal because
  those elements are not call arguments.
rule:
  kind: argument
  regex: '^&'
