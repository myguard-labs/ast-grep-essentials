# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: wp-count-query-includes-limit
language: php
severity: warning
message: >-
  This COUNT query passed to get_var interpolates a LIMIT clause variable, so
  the total may reflect only one page of rows.
note: >-
  Syntactic match only. It flags $wpdb->get_var() called with a
  double-quoted or heredoc string that contains COUNT( and interpolates a
  variable or property whose name contains limit ($limit, {$limit},
  $this->query_limit, {$this->query_limit}); it does not resolve runtime
  values or confirm the variable holds a LIMIT fragment. Single-quoted
  literals are not interpolated by PHP and are not reported.
rule:
  kind: member_call_expression
  all:
    - has:
        field: object
        regex: '^\$wpdb$'
    - has:
        field: name
        regex: '^get_var$'
    - has:
        field: arguments
        has:
          kind: argument
          has:
            any:
              - kind: encapsed_string
                all:
                  - regex: '(?i)count\s*\('
                  - has:
                      any:
                        - kind: variable_name
                        - kind: member_access_expression
                      regex: '(?i)limit'
              - kind: heredoc
                has:
                  field: value
                  kind: heredoc_body
                  all:
                    - regex: '(?i)count\s*\('
                    - has:
                        any:
                          - kind: variable_name
                          - kind: member_access_expression
                        regex: '(?i)limit'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  todo_cases:
    - "<?php $total = $wpdb->get_var( \"SELECT COUNT(*) FROM t \" . $limit );"
    - "<?php $total = $wpdb->get_var( \"SELECT COUNT(*) FROM $wpdb->users $opts[limit]\" );"
    - "<?php $total = $wpdb->get_results( \"SELECT COUNT(*) FROM $wpdb->users $this->query_limit\" );"
    - "<?php $total = $wpdb->get_row( \"SELECT COUNT(*) FROM $wpdb->users $this->query_limit\" );"
    - "<?php $total = $wpdb->get_col( \"SELECT COUNT(*) FROM $wpdb->users $this->query_limit\" );"
