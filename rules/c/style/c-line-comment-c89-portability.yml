# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-line-comment-c89-portability
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use nginx-cpp-line-comment. A C++-style line comment
  is used where C89 or old MSVC builds require C comments.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use nginx-cpp-line-comment and do not emit this rule.
rule:
  any:
    - kind: comment
      regex: '^//'
    - kind: preproc_arg
      regex: '^(?:[^"'']|"(?:[^"\\\r\n]|\\[^\r\n])*")*//'
metadata:
  deprecated_alias_of: nginx-cpp-line-comment
  rule_modified_at: '2026-11-15'
  created_at: '2026-10-15'
