id: c-implicit-int-static-function-definition
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-implicit-int-function-definition. Function
  definition has storage-class specifiers but no return type, relying on
  implicit int.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use c-implicit-int-function-definition and do not emit this
  rule. Findings are per function definition, not one per file.
rule:
  kind: function_definition
  all:
    - has:
        kind: storage_class_specifier
        regex: '^(static|extern|inline)$'
    - not:
        has:
          any:
            - kind: primitive_type
            - kind: sized_type_specifier
            - kind: struct_specifier
            - kind: union_specifier
            - kind: enum_specifier
    - not:
        all:
          - has:
              field: type
              kind: type_identifier
          - not:
              all:
                - has:
                    field: declarator
                    kind: parenthesized_declarator
                - has:
                    field: type
                    kind: type_identifier
                    not:
                      regex: '^[A-Z][A-Z0-9_]*$'
metadata:
  deprecated_alias_of: c-implicit-int-function-definition
