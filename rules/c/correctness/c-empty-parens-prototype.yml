id: c-empty-parens-prototype
language: c
severity: warning
message: >-
  Function declared with an empty parameter list () instead of (void);
  arguments are unspecified and prototype checks are disabled.
note: >-
  Syntactic match only on a C function declaration whose parameter list is
  literally empty, written as name(), with any return type, pointer return or
  storage class, at file or block scope. Function definitions, function-pointer
  declarators and call sites are not reported, and declarations are not
  resolved across files.
rule:
  kind: declaration
  has:
    kind: function_declarator
    stopBy:
      not:
        kind: pointer_declarator
    all:
      - has:
          field: declarator
          kind: identifier
      - has:
          field: parameters
          kind: parameter_list
          regex: '^\(\s*\)$'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
