# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-pow2-bittrick-missing-zero-guard
language: c
severity: warning
message: >-
  This power-of-two test x == (x & -x) has no guard excluding zero, so zero
  passes.
note: >-
  Purely syntactic match on the literal expression x == (x & -x) with no
  enclosing zero guard checked; it does not verify that zero is invalid for
  the caller or resolve types, values, or reachability.
rule:
  pattern: '$X == ($X & -$X)'
  not:
    inside:
      pattern: '$Y != 0 && $$$REST'
      stopBy: end
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  known_false_positives: 'int f(unsigned n) { return n > 1 && n == (n & -n); } and int f(unsigned n) { return n && n == (n & -n); } are reported although the left operand already excludes zero; only a != 0 left operand counts as a guard; int f(unsigned n) { return n == (n & -n) && n != 0; } is reported: a != 0 guard after the test does not count'
