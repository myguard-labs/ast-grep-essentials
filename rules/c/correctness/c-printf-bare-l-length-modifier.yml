# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-printf-bare-l-length-modifier
language: c
severity: warning
message: 'Format string contains a bare %l not followed by an integer conversion.'
note: >-
  Regex over the literal text only; does not check that the string is used as
  a printf format. After `l` the accepted conversions are d i u o x X n (and
  a second l) plus f F e E g G a A (l has no effect) and c s (wide char and
  string); any other letter, a space or the end of the string is reported.
rule:
  kind: string_literal
  regex: '(^|[^%])(%%)*%[-+ #0-9.*]*l([^ldiuoxXnfFeEgGaAcs]|$)'
metadata:
  todo_cases:
    - '`printf("%lb\n", n);` is reported although C23 adds the `b` binary conversion, which takes the `l` modifier (false positive for C23 code; `b` is not in the accepted set).'
