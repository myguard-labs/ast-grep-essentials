# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-preprocessor-conditional-in-macro-args
language: c
severity: warning
message: >-
  Preprocessor conditional directive inside call or macro arguments is
  undefined behavior when the callee is a function-like macro (C11 6.10.3p11),
  and hard to read otherwise; split into separate calls.
note: >-
  Textual heuristic over a function body: an open parenthesis preceded by a
  word character, then text with no semicolon or brace and with every nested
  parenthesis group closed (up to two levels of nesting; a parenthesis or
  quote inside a string literal, character literal or comment does not
  count), then a conditional
  directive line. The directive must therefore sit inside a parenthesis list
  that is still open, so `if (x)` followed by `#ifdef` is not reported. Does
  not confirm the callee is a macro.
rule:
  kind: function_definition
  regex: '\w[ \t]*\((?:[^;{}()"'']|"(?:[^"\\\n]|\\.)*"|''(?:[^''\\\n]|\\.)*''|//[^\n]*|/\*(?:[^*]|\*+[^*/])*\*+/|\((?:[^;{}()"'']|"(?:[^"\\\n]|\\.)*"|''(?:[^''\\\n]|\\.)*''|//[^\n]*|/\*(?:[^*]|\*+[^*/])*\*+/|\((?:[^;{}()"'']|"(?:[^"\\\n]|\\.)*"|''(?:[^''\\\n]|\\.)*''|//[^\n]*|/\*(?:[^*]|\*+[^*/])*\*+/)*\))*\))*\n[ \t]*#[ \t]*(if|ifdef|ifndef|else|elif)\b'
metadata:
  known_false_positives: '`/* see f(x */` or `// see f(x` on the line right before a conditional directive is reported (the opening `word(` anchor is not checked against comments)'
  todo_cases:
    - "void f(void) { f(g(h(i(a))),\n#ifdef X\n 1\n#endif\n); }"
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
