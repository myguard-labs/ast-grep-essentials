# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-apr-nonblocking-eagain-terminates
language: c
severity: warning
message: >-
  ap_get_brigade result is checked only for APR_SUCCESS, so APR_EAGAIN from a
  non-blocking read is treated as a fatal error.
note: >-
  Matches only the adjacent statement sequence in the shown syntax. It does
  not follow rv through other statements, aliases, or control flow.
rule:
  pattern: 'if (rv != APR_SUCCESS) { return rv; }'
  follows:
    pattern: 'rv = ap_get_brigade($$$ARGS);'
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
  created_at: '2026-10-19'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'apr_status_t f(ap_filter_t *f, apr_bucket_brigade *bb, ap_input_mode_t mode, apr_read_type_e block, apr_off_t n) { apr_status_t rv; rv = ap_get_brigade(f->next, bb, mode, block, n); log_it(rv); if (rv != APR_SUCCESS) { return rv; } return APR_SUCCESS; }'
