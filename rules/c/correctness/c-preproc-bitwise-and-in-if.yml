# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-preproc-bitwise-and-in-if
language: c
severity: warning
message: 'Bitwise & used in a preprocessor if condition; did you mean &&?'
note: >-
  Syntactic check only; it matches a direct & expression in the if directive
  condition, plus HAVE_ macro pairs joined by & anywhere in an if or elif
  condition (including parenthesized), and does not know the macro values.
rule:
  kind: binary_expression
  any:
    - all:
        - has:
            field: operator
            regex: '^&$'
        - inside:
            kind: preproc_if
    - all:
        - regex: '^HAVE_\w+\s*&\s*HAVE_\w+'
        - inside:
            stopBy: end
            field: condition
            any:
              - kind: preproc_if
              - kind: preproc_elif
metadata:
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: #elif FOO & BAR with non-HAVE_ operands is not reported (generic branch only sees a direct preproc_if parent).'
    - 'FN: #if (A & B) with non-HAVE_ operands inside parentheses is not reported; the generic branch only sees a direct preproc_if parent so that #if (X & MASK) != 0 stays valid.'
