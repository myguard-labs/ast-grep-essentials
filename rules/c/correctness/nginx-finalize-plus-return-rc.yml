id: nginx-finalize-plus-return-rc
language: c
severity: warning
message: >-
  A status identifier passed to ngx_http_finalize_request is also returned
  later in the same block. Check whether the enclosing function's return value
  triggers another finalization.
note: >-
  This syntactic advisory matches a finalize call followed by a sibling return
  of the same identifier, optionally wrapped in redundant parentheses. It does
  not establish handler registration, unchanged status values, reachability,
  or double finalization at runtime.
rule:
  kind: expression_statement
  pattern: 'ngx_http_finalize_request($R, $RC);'
  precedes:
    stopBy: end
    kind: return_statement
    has:
      kind: identifier
      pattern: '$RC'
      stopBy:
        not:
          kind: parenthesized_expression
constraints:
  RC:
    kind: identifier
