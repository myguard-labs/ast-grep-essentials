# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-empty-translation-unit-guard
language: c
severity: warning
message: >-
  This file's only top-level content is a single conditional-compilation
  block, so it may be an empty translation unit when the guard is false.
note: >-
  Matches syntax only. It does not evaluate the macro, so it cannot tell
  whether the guard is actually false in any build.
utils:
  decl-content:
    any:
      - kind: declaration
      - kind: function_definition
      - kind: type_definition
      - kind: preproc_include
      - kind: preproc_ifdef
      - kind: preproc_if
      - kind: linkage_specification
      - kind: struct_specifier
      - kind: enum_specifier
      - kind: union_specifier
rule:
  kind: translation_unit
  all:
    - has:
        kind: preproc_ifdef
        nthChild: 1
    - not:
        has:
          nthChild: 2
    - not:
        has:
          kind: preproc_ifdef
          all:
            - has:
                matches: decl-content
            - has:
                field: alternative
                kind: preproc_else
                has:
                  matches: decl-content
    - not:
        has:
          kind: preproc_ifdef
          all:
            - pattern: |-
                #ifndef $G
                #define $G
                $$$X
                #endif
            - has:
                matches: decl-content
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
  created_at: '2026-10-19'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: `#if defined(FOO) ... #endif` (preproc_if) as the only content is not reported.'
    - 'FP: an `#ifdef A ... #elif defined(B) ... #else ... #endif` chain whose every branch declares something is still reported; only a plain `#else` directly after the `#ifdef` branch is recognised.'
    - 'FN: a branch whose only content is a nested conditional (`#ifdef A / #ifdef B / int a; / #endif / #else / int b; / #endif`) counts as non-empty, although the nested block can be empty.'
    - 'FP: a nested `#ifdef A / #ifdef B ... #else ... #endif / #endif` (else inside the outer block) is still reported although both inner branches declare something.'
