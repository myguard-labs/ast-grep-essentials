# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: nginx-plain-inline
language: c
severity: info
message: Plain inline is used where nginx requires the ngx_inline macro.
note: >-
  This is an nginx portability and style check. It matches the literal C
  storage-class specifier inline without deciding whether the file is part of
  nginx; scope the C rule pack to nginx and nginx-module sources.
rule:
  kind: storage_class_specifier
  regex: '^inline$'
metadata:
  created_at: '2026-09-09'
  source: 'MyGuard'
  modified_by: 'MyGuard'
