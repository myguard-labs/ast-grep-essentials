id: zstd-ifdef-on-enum-constant
language: c
severity: warning
message: >-
  Preprocessor test on a ZSTD_c_*, ZSTD_d_*, or ZSTD_e_* name. Stable
  enumerators are invisible to the preprocessor: defined() and #ifdef are
  false, #ifndef is true, and bare identifiers in #if evaluate as zero unless
  defined as macros. Check the name's status before changing the guard.
  Experimental parameters may be macro aliases available only under
  ZSTD_STATIC_LINKING_ONLY; preserve that availability check rather than
  replacing it with a version-only guard.
note: >-
  This rule detects syntax only: #ifdef/#ifndef names, defined() operands, and
  bare identifier conditions in #if. It does not determine whether a name is a
  stable enumerator, an experimental macro alias, or another macro defined in
  the build. Confirm the specific parameter's status and version availability
  before changing its guard.
rule:
  any:
    - kind: preproc_ifdef
      has:
        field: name
        regex: '^ZSTD_[cde]_'
    - kind: preproc_defined
      has:
        kind: identifier
        regex: '^ZSTD_[cde]_'
    - kind: preproc_if
      has:
        field: condition
        kind: identifier
        regex: '^ZSTD_[cde]_'
