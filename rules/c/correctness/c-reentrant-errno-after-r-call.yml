# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-reentrant-errno-after-r-call
language: c
severity: warning
message: >-
  errno is compared after a POSIX *_r call; these functions return the error
  number directly, so check the return value instead.
note: >-
  Single-file syntactic check: an `if (errno == X)` statement that has an
  earlier sibling statement (same block or translation-unit fragment) containing
  a call whose callee is an identifier ending in `_r`. The earlier statement is
  searched without descending into a compound statement beneath it (an if,
  loop or switch body), so an *_r call in a different function, in the body of
  an earlier if or loop, in an enclosing block only, or after the errno test
  does not count. It does not verify that errno is stale or that the call's
  result is unused.
rule:
  all:
    - pattern: |
        if (errno == $ERR) $$$BODY
    - follows:
        stopBy: end
        has:
          stopBy:
            kind: compound_statement
          kind: call_expression
          has:
            field: function
            kind: identifier
            regex: '_r$'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: an *_r call in an enclosing block only (`getpwnam_r(...); if (k) { ... } else { if (errno == ERANGE) ... }`) or in the body of an earlier if or loop is not reported; the errno test needs an earlier *_r statement in its own block.'
    - 'FN: an *_r call in the same condition (`if (getpwnam_r(...) == 0 && errno == ERANGE)`) and other errno tests (`errno != X`, `X == errno`) are not matched, as on the base rule.'
