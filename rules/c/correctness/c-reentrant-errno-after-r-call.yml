# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-reentrant-errno-after-r-call
language: c
severity: warning
message: >-
  errno is compared after a POSIX *_r call; these functions return the error
  number directly, so check the return value instead.
note: >-
  Single-file syntactic check: an `if (errno == X)` statement that has an
  earlier sibling statement (same block or translation-unit fragment)
  containing a call to a *_r function that returns an error number: the _r
  forms of getpwnam, getpwuid, getpwent, getgrnam, getgrgid, getgrent,
  getspnam, getspent, readdir, strerror, getlogin, ttyname, gethostbyname,
  gethostbyname2, gethostbyaddr, getservbyname, getservbyport, getprotobyname,
  getprotobynumber, getnetbyname and getnetbyaddr. Other *_r functions that
  report failure through errno, such as localtime_r, and project helpers
  ending in `_r` do not count. The earlier statement is searched without
  descending into a compound statement beneath it (a braced if, loop or switch
  body), so a call in a different function, in the braced body of an earlier
  if or loop, in an enclosing block only, or after the errno test does not
  count; a call in an unbraced earlier body or a bare nested block still
  counts. It does not verify that errno is stale, for example after an
  intervening `errno = 0;`, or that the call's result is unused.
rule:
  all:
    - pattern: |
        if (errno == $ERR) $$$BODY
    - follows:
        stopBy: end
        has:
          stopBy:
            kind: compound_statement
          kind: call_expression
          has:
            field: function
            kind: identifier
            regex: '^(getpwnam|getpwuid|getpwent|getgrnam|getgrgid|getgrent|getspnam|getspent|readdir|strerror|getlogin|ttyname|gethostbyname|gethostbyname2|gethostbyaddr|getservbyname|getservbyport|getprotobyname|getprotobynumber|getnetbyname|getnetbyaddr)_r$'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'void f(int k) { getpwnam_r(a, b, c, d, e); if (k) { g(); } else { if (errno == ERANGE) { h(); } } }'
    - 'void g2(void) { if (getpwnam_r(a, b, c, d, e) == 0 && errno == ERANGE) { h(); } }'
