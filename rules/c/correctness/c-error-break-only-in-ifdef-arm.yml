# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-error-break-only-in-ifdef-arm
language: c
severity: warning
message: >-
  A break in the error branch appears only in one preprocessor conditional
  arm; the other configuration may keep looping.
note: >-
  Matches syntax only; it does not evaluate macros, verify the call is a read
  or write, or check the other arm for other exits.
rule:
  kind: break_statement
  all:
    - inside:
        kind: preproc_ifdef
        has:
          kind: preproc_else
    - inside:
        kind: if_statement
        stopBy: end
metadata:
  todo_cases:
    - 'FP: a break in both arms (#ifdef X ... break; #else ... break; #endif) inside the error branch is reported though every configuration leaves the loop; not pinned.'
    - 'FN: a break inside the #else arm of an #ifdef (ifdef with preproc_else, break only in the else arm) inside an if body is not reported; the break is a child of preproc_else, not of preproc_ifdef.'
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
  created_at: '2026-10-19'
