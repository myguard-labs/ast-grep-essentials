# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-openssl-ec-call-unguarded
language: c
severity: warning
message: EC-related call outside an OPENSSL_NO_EC guard may break no-ec builds.
note: >-
  Name-based heuristic on the callee identifier; does not resolve the
  function, and guards are matched by literal OPENSSL_NO_EC text in an
  enclosing ifdef/ifndef or `#if !defined(OPENSSL_NO_EC)` (alone or as an
  `&&` operand). Callee names match `EC_` at the start or after an underscore.
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        kind: identifier
        regex: '(^|_)EC_'
    - not:
        inside:
          stopBy: end
          kind: preproc_ifdef
          has:
            field: name
            regex: OPENSSL_NO_EC
    - not:
        inside:
          stopBy: end
          kind: preproc_if
          has:
            field: condition
            any:
              - kind: unary_expression
                regex: '^!\s*defined\b[\s(]*OPENSSL_NO_EC[\s)]*$'
              - kind: binary_expression
                regex: '^[^|]*&&[^|]*$'
                has:
                  stopBy: end
                  kind: unary_expression
                  regex: '^!\s*defined\b[\s(]*OPENSSL_NO_EC[\s)]*$'
metadata:
  todo_cases:
    - "#ifdef OPENSSL_NO_EC\nvoid f(void) { EC_KEY_new(); }\n#endif"
    - "#if !defined(OPENSSL_NO_EC)\nint a;\n#else\nvoid g(void) { EC_KEY_new(); }\n#endif"
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
