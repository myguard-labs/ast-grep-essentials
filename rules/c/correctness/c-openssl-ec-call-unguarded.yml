# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-openssl-ec-call-unguarded
language: c
severity: warning
message: EC-related call outside an OPENSSL_NO_EC guard may break no-ec builds.
note: >-
  Name-based heuristic on the callee identifier; does not resolve the
  function, and guards are matched by literal OPENSSL_NO_EC text in an
  enclosing ifdef/ifndef.
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        kind: identifier
        regex: 'EC_|_EC_KEY'
    - not:
        inside:
          stopBy: end
          kind: preproc_ifdef
          has:
            field: name
            regex: OPENSSL_NO_EC
metadata:
  todo_cases:
    - 'FP: an EC call inside `#if !defined(OPENSSL_NO_EC)` is reported (guard is preproc_if, not preproc_ifdef): `#if !defined(OPENSSL_NO_EC) int f(EVP_PKEY *k) { return EC_KEY_can_sign(k); } #endif`'
    - 'FN: an EC call inside `#ifdef OPENSSL_NO_EC` (compiled only when EC is absent) is not reported because any OPENSSL_NO_EC name suppresses it, whether ifdef or ifndef side'
    - 'FP: the unanchored regex EC_ matches non-EC callees: `int f(int k) { return SEC_alloc(k); }` is reported'
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
