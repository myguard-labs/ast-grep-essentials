id: nginx-http-version-space-literal
language: c
severity: warning
message: >-
  This string literal names an HTTP version with a space instead of a slash
  (for example "HTTP 1.1" instead of "HTTP/1.1").
note: >-
  Matches string literals, including L, u8, u and U prefixed ones, that
  contain the word HTTP, a space and a single digit not followed by another
  digit (so "HTTP 1.1", L"HTTP 2" and "protocol HTTP 1.x" are reported). A
  multi-digit number such as "HTTP 404 Not Found" is not reported. It is a
  purely syntactic check and does not verify how the string is used at
  runtime.
rule:
  kind: string_literal
  regex: '^(L|u8|u|U)?"(.*[^A-Za-z0-9_])?HTTP [0-9]([^0-9].*)?"$'
