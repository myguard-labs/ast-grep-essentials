id: c-preproc-bitwise-or-in-if
language: c
severity: warning
message: 'Bitwise | used in a #if condition; use logical || to combine feature macros.'
note: >-
  Syntactic only: flags a binary expression containing a lone | inside the condition of a
  #if or #elif directive, not in the directive body. An unterminated directive
  that tree-sitter reports as an error node is matched on its first line. It
  does not expand macros or check whether their values are 0 or 1.
rule:
  kind: binary_expression
  regex: '[^|]\|[^|]'
  has:
    field: operator
    regex: '^\|$'
  any:
    - inside:
        any:
          - kind: preproc_if
          - kind: preproc_elif
        field: condition
        stopBy: end
    - inside:
        kind: ERROR
        regex: '^#[ \t]*(el)?if\b[^\n]*[^|]\|[^|]'
        stopBy: end
metadata:
  known_false_positives: '`#if (FLAGS & (F_A | F_B))` (intended bitwise mask test) is reported'
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
