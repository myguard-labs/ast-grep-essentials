# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-relational-in-bitwise-or-shift-typo
language: c
severity: warning
message: >-
  Relational comparison of a masked value used as a bitwise OR operand; a
  shift may have been intended.
note: >-
  Single-file syntactic match only. Flags a right operand of | written as a
  parenthesized masked value compared with < to an integer literal, e.g. (x &
  MASK) < N. Cannot verify types, operand widths, or the author's intent.
rule:
  pattern: '$A | (($X & $M) < $N)'
constraints:
  'N':
    regex: '^(0[xX][0-9a-fA-F]+|[0-9]+)$'
