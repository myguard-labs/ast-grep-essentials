id: c-openssl-ex-variant-dropped-libctx
language: c
severity: warning
message: >-
  This non-_ex OpenSSL constructor is called in a function that refers to a
  library context (libctx or OSSL_LIB_CTX); consider the _ex variant so the
  library context is passed.
note: >-
  Purely syntactic single-file check. It matches the literal call name
  X509_new with zero arguments, only when the enclosing function definition
  contains an identifier or field name spelled libctx or a type named
  OSSL_LIB_CTX (parameter, local, member access). It does not verify that the
  reference is the same object, that it is in scope at the call, or any runtime
  or type information; a library context behind a macro or another name is
  not recognized.
rule:
  pattern: 'X509_new()'
  inside:
    kind: function_definition
    stopBy: end
    has:
      stopBy: end
      any:
        - kind: identifier
          regex: '^libctx$'
        - kind: field_identifier
          regex: '^libctx$'
        - kind: type_identifier
          regex: '^OSSL_LIB_CTX$'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
