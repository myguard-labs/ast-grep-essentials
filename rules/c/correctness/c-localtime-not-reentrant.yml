id: c-localtime-not-reentrant
language: c
severity: warning
message: >-
  localtime/gmtime/ctime/asctime/getdate return a pointer to shared static
  storage, so a second call anywhere in the process — another thread, a signal
  handler, or a logging helper invoked between the call and the read —
  overwrites the result under the first caller.
note: >-
  Use localtime_r/gmtime_r with a caller-owned struct tm, ctime_r/asctime_r
  with a caller-owned character buffer, or getdate_r with a caller-owned
  struct tm. localtime also reads the process TZ, and getdate also reads
  DATEMSK and sets the global getdate_err, neither of which a library caller
  controls. This is a syntactic check on the callee name only: it does not
  track whether the returned pointer is copied before any further call, and it
  cannot see through function pointers, macros, or aliases that reach the same
  implementation. Dismiss for provably single-threaded startup code. See
  https://man7.org/linux/man-pages/man3/ctime.3.html.
rule:
  kind: call_expression
  has:
    field: function
    regex: '^(localtime|gmtime|ctime|asctime|getdate)$'
