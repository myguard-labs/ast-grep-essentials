id: nginx-strlen-on-ngx-str-data
language: c
severity: warning
message: >-
  strlen or ngx_strlen scans a data member. If this follows the ngx_str_t
  convention, use its accompanying len field instead of scanning for a
  terminator.
note: >-
  Matches an argument that is itself a member named data, optionally enclosed
  in casts or parentheses. Does not verify the member's type, termination, or
  accompanying length field. Unrelated terminated data members may report.
utils:
  data-member:
    kind: field_expression
    has:
      field: field
      regex: '^data$'
  wrapper:
    any:
      - kind: cast_expression
      - kind: parenthesized_expression
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: '^(strlen|ngx_strlen)$'
    - has:
        field: arguments
        has:
          any:
            - matches: data-member
            - all:
                - matches: wrapper
                - has:
                    matches: data-member
                    stopBy:
                      not:
                        matches: wrapper
