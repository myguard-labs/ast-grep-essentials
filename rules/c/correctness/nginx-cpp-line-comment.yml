# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: nginx-cpp-line-comment
language: c
severity: info
message: 'A C++-style line comment is used where nginx requires C comments.'
note: >-
  This single-file nginx source-style check matches comment nodes beginning
  with two slashes and conservative preprocessor replacement shapes, allowing
  closed string literals with escaped characters before the slashes. It does
  not fully tokenize replacements, handle character literals, or establish
  nginx file membership; scope this rule to nginx and nginx-module sources.
rule:
  any:
    - kind: comment
      regex: '^//'
    - kind: preproc_arg
      regex: '^(?:[^"'']|"(?:[^"\\\r\n]|\\[^\r\n])*")*//'
