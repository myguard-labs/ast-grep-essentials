id: c-preprocessor-bare-feature-macro-if
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-preproc-if-bare-identifier. Bare identifier used as the whole
  condition of a preprocessor if.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use c-preproc-if-bare-identifier and do not emit this rule.
rule:
  kind: preproc_if
  has:
    field: condition
    kind: identifier
metadata:
  deprecated_alias_of: c-preproc-if-bare-identifier
  rule_modified_at: '2026-11-15'
  created_at: '2026-10-20'
