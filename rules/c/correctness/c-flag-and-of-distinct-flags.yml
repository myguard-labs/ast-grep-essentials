id: c-flag-and-of-distinct-flags
language: c
severity: warning
message: >-
  A parenthesized bitwise AND combines two flag macros; for disjoint bits the
  result is zero, so the check may never fire.
note: >-
  Purely syntactic match on a parenthesized binary & whose two operands are
  both all-caps macro-style identifiers (^[A-Z_][A-Z0-9_]*$) with different
  names. Lowercase or mixed-case variables and member operands stay silent. It
  cannot resolve macro values, so a macro that expands to a variable is still
  reported or missed, nor confirm that | was intended.
rule:
  kind: parenthesized_expression
  has:
    kind: binary_expression
    pattern: '$A & $B'
    all:
      - has:
          kind: identifier
          pattern: '$A'
          regex: '^[A-Z_][A-Z0-9_]*$'
      - has:
          kind: identifier
          pattern: '$B'
          regex: '^[A-Z_][A-Z0-9_]*$'
      - not:
          pattern: '$A & $A'
