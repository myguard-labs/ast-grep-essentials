id: c-inline-def-external-linkage-in-source
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-inline-nonstatic-function-definition. Function
  defined with inline but without static or extern may lack an external
  definition for linking.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use c-inline-nonstatic-function-definition and do not emit
  this rule.
rule:
  kind: function_definition
  all:
    - has:
        kind: storage_class_specifier
        regex: '^(inline|__inline|__inline__)$'
    - not:
        has:
          kind: storage_class_specifier
          regex: '^(static|extern)$'
metadata:
  deprecated_alias_of: c-inline-nonstatic-function-definition
  rule_modified_at: '2026-11-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
