id: c-macro-statement-no-do-while
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-multistmt-macro-without-do-while. Function-like
  macro body starts with a bare for/if/while statement; wrap it in do { ... }
  while (0).
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use c-multistmt-macro-without-do-while and do not emit this
  rule.
rule:
  kind: preproc_function_def
  has:
    kind: preproc_arg
    regex: '^\s*(for|if|while)\b'
metadata:
  deprecated_alias_of: c-multistmt-macro-without-do-while
  rule_modified_at: '2026-11-15'
  created_at: '2026-10-16'
