id: c-preprocessor-bitwise-or-in-if
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-preproc-bitwise-or-in-if. Preprocessor if condition
  joins macro identifiers with bitwise | instead of logical ||.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID. Normal
  scans use c-preproc-bitwise-or-in-if, which reports each offending expression
  rather than the whole directive line, and do not emit this rule.
rule:
  kind: binary_expression
  regex: '[^|]\|[^|]'
  has:
    field: operator
    regex: '^\|$'
  any:
    - inside:
        any:
          - kind: preproc_if
          - kind: preproc_elif
        field: condition
        stopBy: end
    - inside:
        kind: ERROR
        regex: '^#[ \t]*(el)?if\b[^\n]*[^|]\|[^|]'
        stopBy: end
metadata:
  deprecated_alias_of: c-preproc-bitwise-or-in-if
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
