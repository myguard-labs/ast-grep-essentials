# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-implicit-int-function-definition
language: c
severity: warning
message: >-
  Function definition has a storage class but no return type, so it relies on
  implicit int.
note: >-
  Purely syntactic match on a file-scope static definition with no visible
  return type; it does not check types, macros, or whether the declaration is
  in a header or a call site.
rule:
  kind: function_definition
  all:
    - has:
        kind: storage_class_specifier
        regex: '^static$'
    - not:
        has:
          any:
            - kind: primitive_type
            - kind: type_identifier
            - kind: sized_type_specifier
            - kind: struct_specifier
            - kind: union_specifier
            - kind: enum_specifier
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - "False positive: 'static MACRO(int) f(void) { return 0; }' is reported; macro_type_specifier cannot be excluded because implicit-int definitions such as 'static f(int x)' also parse as macro_type_specifier."
    - "Miss: 'static f(void) { return 0; }' is not reported."
    - "Miss: 'static f(int x, int y) { return x + y; }' is not reported."
