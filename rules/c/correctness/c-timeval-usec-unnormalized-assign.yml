# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-timeval-usec-unnormalized-assign
language: c
severity: warning
message: >-
  Assignment to tv_usec from a non-constant expression without modulo 1000000
  reduction; verify the value is normalized below one million.
note: >-
  Syntactic check only. Matches a literal tv.tv_usec assignment whose
  right-hand side is not a modulo expression; it does not resolve types, prove
  the value is unnormalized, or track upstream normalization.
rule:
  all:
    - pattern: '$TV.tv_usec = $VAL'
    - not:
        pattern: '$TV.tv_usec = $X % 1000000'
metadata:
  known_false_positives: '`tv.tv_usec = u % 1000000L;` matches because the exclusion pattern is the literal `1000000` without the L suffix'
  todo_cases:
    - "FN: arrow form `tv->tv_usec = u;` is not matched (only the dot form `tv.tv_usec = u;`)."
    - "FP: constant assignments `tv.tv_usec = 0;` and `tv.tv_usec = 999999;` match although the message says non-constant."
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
