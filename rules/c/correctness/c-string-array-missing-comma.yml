id: c-string-array-missing-comma
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-adjacent-string-literal-in-initializer. String
  literals are adjacent inside an initializer list with no comma, so C
  concatenates them into one element.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use c-adjacent-string-literal-in-initializer and do not emit
  this rule.
rule:
  all:
    - kind: string_literal
    - follows:
        kind: string_literal
        stopBy: neighbor
    - inside:
        kind: initializer_list
        stopBy: end
metadata:
  deprecated_alias_of: c-adjacent-string-literal-in-initializer
  rule_modified_at: '2026-11-15'
  created_at: '2026-10-15'
