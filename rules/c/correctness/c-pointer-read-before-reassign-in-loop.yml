# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-pointer-read-before-reassign-in-loop
language: c
severity: warning
message: >-
  Pointer member is read before the pointer is reassigned later in the same
  loop body.
note: >-
  Purely syntactic; matches same-named pointer text in sibling statements
  within a for loop and does not check aliasing, control flow, or intent.
rule:
  kind: expression_statement
  all:
    - has:
        stopBy: end
        pattern: '$P->$F'
    - precedes:
        stopBy: end
        all:
          - pattern: '$P = $V;'
          - not:
              pattern: '$P = $P->$G;'
          - not:
              pattern: '$P = $P->$H->$G;'
          - not:
              pattern: '$P = ($T *) $P->$G;'
    - inside:
        kind: compound_statement
        inside:
          kind: for_statement
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'Known limitation: an advance through a helper call (`p = next_of(p);`) or a three-deep member chain (`p = p->a->b->c;`) is still reported after a read of p; only `p = p->f;`, `p = p->a->f;` and a pointer cast of `p->f` are treated as cursor advances.'
    - 'Known limitation: rule scope is for loops only; the same read-then-reassign shape in a while loop is not reported.'
