id: c-trailing-char-scan-underflow
language: c
severity: warning
message: >-
  A while condition pre-decrements an index used to subscript a buffer, with
  no lower-bound test on that index in the same condition. If every byte
  matches, the scan can read before the start of the buffer.
note: >-
  Single-file syntactic check only. It cannot verify runtime values, whether
  the index is actually unsigned or nonzero on entry, or whether a bound is
  enforced elsewhere (in the loop body or an earlier check). Only a literal
  lower-bound test of the form N > 0 inside the same parenthesized condition
  is recognized; other forms such as N >= 1 or N != 0 are not, and a matching
  parenthesized expression in the loop body would also be reported.
rule:
  kind: parenthesized_expression
  has:
    pattern: '$BUF[--$N]'
    stopBy: end
  not:
    has:
      pattern: '$N > 0'
      stopBy: end
  inside:
    kind: while_statement
    stopBy: end
