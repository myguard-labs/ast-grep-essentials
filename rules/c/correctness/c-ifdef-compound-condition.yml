id: c-ifdef-compound-condition
language: c
severity: warning
message: >-
  #ifdef/#ifndef accepts a single identifier; extra tokens or operators on
  this line (with or without a blank before them) are ignored or rejected.
  Use #if defined(A) && defined(B) instead.
note: >-
  Matches only the directive line's text, looking for extra text after the
  first macro name, including operators or parentheses with no blank before them. It does not evaluate macros or check how the preprocessor
  handles the extra tokens.
rule:
  kind: preproc_ifdef
  regex: '^#[ \t]*ifn?def[ \t]+[A-Za-z_][A-Za-z0-9_]*([ \t]+[^ \t\r\n/]|[^ \t\r\n/A-Za-z0-9_])'
metadata:
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - "FN: '#ifdef FOO/2' (slash directly after the name) is not reported; the regex treats '/' as a comment start"
    - "FP risk: a name with '$' (GCC extension, '#ifdef FOO$BAR') is reported"
    - "FP risk: a trailing line continuation '#ifdef FOO \\' is reported"
