id: c-preproc-conditional-inside-call
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-preprocessor-conditional-in-macro-args. A
  preprocessor conditional directive inside a function call argument list.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use c-preprocessor-conditional-in-macro-args and do not emit
  this rule.
rule:
  kind: function_definition
  regex: '\w[ \t]*\((?:[^;{}()"'']|"(?:[^"\\\n]|\\.)*"|''(?:[^''\\\n]|\\.)*''|//[^\n]*|/\*(?:[^*]|\*+[^*/])*\*+/|\((?:[^;{}()"'']|"(?:[^"\\\n]|\\.)*"|''(?:[^''\\\n]|\\.)*''|//[^\n]*|/\*(?:[^*]|\*+[^*/])*\*+/|\((?:[^;{}()"'']|"(?:[^"\\\n]|\\.)*"|''(?:[^''\\\n]|\\.)*''|//[^\n]*|/\*(?:[^*]|\*+[^*/])*\*+/)*\))*\))*\n[ \t]*#[ \t]*(if|ifdef|ifndef|else|elif)\b'
metadata:
  deprecated_alias_of: c-preprocessor-conditional-in-macro-args
  rule_modified_at: '2026-11-18'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
