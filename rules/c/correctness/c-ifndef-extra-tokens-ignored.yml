# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-ifndef-extra-tokens-ignored
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-ifdef-compound-condition. #ifdef/#ifndef tests
  only the first identifier; extra tokens after it are ignored.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use c-ifdef-compound-condition and do not emit this rule. It now
  reports each offending directive instead of the whole file.
rule:
  kind: preproc_ifdef
  regex: '^#[ \t]*ifn?def[ \t]+[A-Za-z_][A-Za-z0-9_]*([ \t]+[^ \t\r\n/]|[^ \t\r\n/A-Za-z0-9_])'
metadata:
  deprecated_alias_of: c-ifdef-compound-condition
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
