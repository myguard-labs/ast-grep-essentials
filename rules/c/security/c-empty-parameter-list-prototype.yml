id: c-empty-parameter-list-prototype
language: c
severity: warning
message: >-
  Function declarator uses an empty parameter list `()`, which in C leaves
  arguments unchecked; use `(void)` or a typed parameter list.
note: >-
  Matches a function declarator whose parameter list is literally empty. It
  does not distinguish definitions from declarations, does not resolve calls,
  and cannot tell whether a call site is actually mismatched; review hits in
  legacy code.
rule:
  kind: function_declarator
  all:
    - has:
        field: declarator
        kind: identifier
    - not:
        has:
          kind: parameter_list
          has:
            kind: parameter_declaration
    - not:
        has:
          kind: parameter_list
          has:
            kind: variadic_parameter
