id: c-decl-after-statement-c89
language: c
severity: warning
message: >-
  Declaration with initializer appears after an executable statement, which
  C89 forbids.
note: >-
  Syntactic only. It matches an initialized declaration that follows an
  expression statement in the same block. It does not detect other statement
  kinds or check which C standard the project targets.
rule:
  kind: declaration
  has:
    kind: init_declarator
  inside:
    kind: compound_statement
  follows:
    stopBy: end
    kind: expression_statement
