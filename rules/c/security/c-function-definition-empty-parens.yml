id: c-function-definition-empty-parens
language: c
severity: warning
message: >-
  Function definition uses an empty parameter list; declare it with (void) to
  keep it prototyped.
note: >-
  Matches function definitions whose parameter list is written literally as an
  empty pair of parentheses. It does not check call sites, types, or whether
  the function is declared elsewhere.
rule:
  kind: function_definition
  has:
    kind: function_declarator
    field: declarator
    has:
      kind: parameter_list
      pattern: '()'
