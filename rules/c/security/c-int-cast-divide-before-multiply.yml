id: c-int-cast-divide-before-multiply
language: c
severity: warning
message: >-
  Integer division of an int-cast operand is multiplied afterward, so the
  fraction is truncated before scaling.
note: >-
  Syntactic match only on the literal shape int-cast divided then multiplied;
  it does not resolve types, value ranges, or whether the truncation is
  intentional.
rule:
  pattern: 'int r = (int) $A / $B * $C;'
