id: c-pow2-bittrick-missing-zero-guard
language: c
severity: warning
message: >-
  This power-of-two test x == (x & -x) has no guard excluding zero, so zero
  passes.
note: >-
  Purely syntactic match on the literal expression x == (x & -x) with no
  enclosing zero guard checked; it does not verify that zero is invalid for
  the caller or resolve types, values, or reachability.
rule:
  pattern: '$X == ($X & -$X)'
  not:
    inside:
      pattern: '$Y != 0 && $$$REST'
      stopBy: end
