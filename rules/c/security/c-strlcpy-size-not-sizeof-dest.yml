id: c-strlcpy-size-not-sizeof-dest
language: c
severity: warning
message: strlcpy size argument does not reference sizeof of the destination buffer.
note: >-
  Syntactic check only. It flags strlcpy calls whose third argument has no
  sizeof(...) subexpression; it does not verify that the sizeof operand is the
  destination or resolve types, macros, or aliases.
rule:
  all:
    - pattern: 'strlcpy($DST, $SRC, $N)'
    - not:
        has:
          kind: sizeof_expression
          stopBy: end
