# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-array-index-assigned-twice
language: c
severity: warning
message: >-
  This array slot was already assigned earlier in the same block; the earlier
  write is overwritten.
note: >-
  Matches repeated literal-index assignments on the same array text among
  sibling statements. It does not check for intervening reads, loops, or
  preprocessor branches.
rule:
  pattern: '$A[$I] = $V;'
  follows:
    pattern: '$A[$I] = $W;'
    stopBy: end
constraints:
  I:
    kind: number_literal
