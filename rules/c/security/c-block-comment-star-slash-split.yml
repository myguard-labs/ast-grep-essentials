# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-block-comment-star-slash-split
language: c
severity: warning
message: >-
  Block comment has a line containing only `* /`, which does not close the
  comment.
note: >-
  Matches comment text syntactically by regex; it cannot tell whether the
  split closer was intentional.
rule:
  kind: comment
  regex: '(?m)\A/\*(?s:.)*^[ \t]*\*[ \t]+/[ \t]*\r?$'
