# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-pkcs7-signed-attr-deref-unchecked
language: c
severity: warning
message: Result of PKCS7_get_signed_attribute is dereferenced without a NULL check.
note: >-
  Syntactic only; matches an if condition using -> on the assigned variable
  unless the condition guards it (`V && ...`, `V != NULL && ...`, `!V || ...`,
  `V == NULL || ...`) or an earlier if tests `!V` / `V == NULL` and returns
  unconditionally (or jumps with `goto L` to a sibling label that follows the dereference; a label in a nested block is not matched), with no reassignment of the variable between that guard and the dereference (a later recheck after a reassignment re-establishes the guard). Only sibling statements are scanned, so a nested reassignment inside an if block is missed. It does not track aliasing or other guards.
rule:
  kind: if_statement
  all:
    - follows:
        stopBy: end
        pattern: '$V = PKCS7_get_signed_attribute($$$A);'
    - has:
        field: condition
        has:
          stopBy: end
          pattern: '$V->$F'
    - not:
        has:
          field: condition
          has:
            stopBy: end
            any:
              - pattern: '$V && $X'
              - pattern: '$V != NULL && $X'
              - pattern: '!$V || $X'
              - pattern: '$V == NULL || $X'
    - not:
        any:
          - all:
              - follows:
                  stopBy: end
                  kind: if_statement
                  all:
                    - has:
                        field: condition
                        has:
                          any:
                            - pattern: '!$V'
                            - pattern: '$V == NULL'
                    - has:
                        field: consequence
                        any:
                          - kind: return_statement
                          - has:
                              kind: return_statement
              - not:
                  follows:
                    stopBy: end
                    all:
                      - pattern: '$V = $B;'
                      - not:
                          precedes:
                            stopBy:
                              kind: if_statement
                              has:
                                field: condition
                                has:
                                  stopBy: end
                                  pattern: '$W->$G'
                            kind: if_statement
                            all:
                              - has:
                                  field: condition
                                  has:
                                    any:
                                      - pattern: '!$V'
                                      - pattern: '$V == NULL'
                              - any:
                                  - has:
                                      field: consequence
                                      any:
                                        - kind: return_statement
                                        - has:
                                            kind: return_statement
                                  - all:
                                      - has:
                                          field: consequence
                                          any:
                                            - pattern: 'goto $L;'
                                            - has:
                                                pattern: 'goto $L;'
                                      - precedes:
                                          stopBy: end
                                          pattern: '$L: $S'
                                          follows:
                                            stopBy:
                                              kind: if_statement
                                              has:
                                                field: condition
                                                has:
                                                  any:
                                                    - pattern: '!$V'
                                                    - pattern: '$V == NULL'
                                            kind: if_statement
                                            has:
                                              field: condition
                                              has:
                                                stopBy: end
                                                pattern: '$V->$G'
                    follows:
                      stopBy: end
                      kind: if_statement
                      has:
                        field: condition
                        has:
                          any:
                            - pattern: '!$V'
                            - pattern: '$V == NULL'
          - all:
              - follows:
                  stopBy: end
                  kind: if_statement
                  all:
                    - has:
                        field: condition
                        has:
                          any:
                            - pattern: '!$V'
                            - pattern: '$V == NULL'
                    - has:
                        field: consequence
                        any:
                          - pattern: 'goto $L;'
                          - has:
                              pattern: 'goto $L;'
              - precedes:
                  stopBy: end
                  pattern: '$L: $S'
              - not:
                  follows:
                    stopBy: end
                    all:
                      - pattern: '$V = $B;'
                      - not:
                          precedes:
                            stopBy:
                              kind: if_statement
                              has:
                                field: condition
                                has:
                                  stopBy: end
                                  pattern: '$W->$G'
                            kind: if_statement
                            all:
                              - has:
                                  field: condition
                                  has:
                                    any:
                                      - pattern: '!$V'
                                      - pattern: '$V == NULL'
                              - any:
                                  - all:
                                      - has:
                                          field: consequence
                                          any:
                                            - pattern: 'goto $L;'
                                            - has:
                                                pattern: 'goto $L;'
                                      - precedes:
                                          stopBy: end
                                          pattern: '$L: $S'
                                          follows:
                                            stopBy:
                                              kind: if_statement
                                              has:
                                                field: condition
                                                has:
                                                  any:
                                                    - pattern: '!$V'
                                                    - pattern: '$V == NULL'
                                            kind: if_statement
                                            has:
                                              field: condition
                                              has:
                                                stopBy: end
                                                pattern: '$V->$G'
                    follows:
                      stopBy: end
                      kind: if_statement
                      has:
                        field: condition
                        has:
                          any:
                            - pattern: '!$V'
                            - pattern: '$V == NULL'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-476'
  owasp: 'A10:2025'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/476.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'FN: if (!so) return 0; if (y) { so = NULL; } if (so->type == 16) return 1; (nested reassignment between guard and dereference is not seen)'
    - 'FN: ASN1_TYPE *so = PKCS7_get_signed_attribute(si, 1); if (so->type == 16) return 1; (declaration initialiser form)'
    - 'FN: `!V ||` / `V == NULL ||` found anywhere in the condition, e.g. if ((!so || a) && so->type == 16)'
    - 'FN: `t = so->type;` (a plain statement dereference between the goto guard and its label) is not counted as the dereference the label must follow'
