# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-pkcs7-signed-attr-deref-unchecked
language: c
severity: warning
message: Result of PKCS7_get_signed_attribute is dereferenced without a NULL check.
note: >-
  Syntactic only; matches an if condition using -> on the assigned variable
  unless the condition guards it (`V && ...`, `V != NULL && ...`, `!V || ...`,
  `V == NULL || ...`) or an earlier if tests `!V` / `V == NULL` and returns or
  jumps unconditionally, with no reassignment of the variable between that guard and the dereference. It does not track aliasing or other guards.
rule:
  kind: if_statement
  all:
    - follows:
        stopBy: end
        pattern: '$V = PKCS7_get_signed_attribute($$$A);'
    - has:
        field: condition
        has:
          stopBy: end
          pattern: '$V->$F'
    - not:
        has:
          field: condition
          has:
            stopBy: end
            any:
              - pattern: '$V && $X'
              - pattern: '$V != NULL && $X'
              - pattern: '!$V || $X'
              - pattern: '$V == NULL || $X'
    - not:
        follows:
          stopBy:
            pattern: '$V = $B;'
          kind: if_statement
          all:
            - has:
                field: condition
                has:
                  any:
                    - pattern: '!$V'
                    - pattern: '$V == NULL'
            - has:
                field: consequence
                any:
                  - kind: return_statement
                  - kind: goto_statement
                  - has:
                      kind: return_statement
                  - has:
                      kind: goto_statement
