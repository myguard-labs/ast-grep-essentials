# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-ffi-backslash-e-escape-literal
language: c
severity: warning
message: >-
  Non-standard escape sequence \e in a string or character literal is a GCC
  extension and is not portable.
note: >-
  Matches the literal escape token \e syntactically; it does not check which
  compiler is used.
rule:
  kind: escape_sequence
  regex: '^\\e$'
