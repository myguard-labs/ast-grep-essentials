id: c-macro-while-zero-no-do
language: c
severity: warning
message: >-
  Function-like macro body begins with a bare while (0) { so the body never
  runs; it was probably meant to be do { ... } while (0).
note: >-
  Matches only the literal text at the start of the macro replacement list; it
  does not expand macros or check how the macro is used.
rule:
  kind: preproc_function_def
  has:
    kind: preproc_arg
    regex: '^\s*while\s*\(\s*0\s*\)\s*\{'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
