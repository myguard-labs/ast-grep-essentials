# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-null-guard-deref-in-null-branch
language: c
severity: warning
message: Pointer is dereferenced inside the branch that runs only when it is NULL.
note: >-
  Single-file syntactic match on a negated pointer test whose body
  dereferences the same identifier; does not check aliasing, reassignment
  inside the body, or reachability.
rule:
  all:
    - pattern: 'if (!$P) { $$$BODY }'
    - has:
        pattern: '*$P'
        stopBy: end
