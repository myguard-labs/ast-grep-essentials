# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-byte-range-upper-bound-exclusive
language: c
severity: warning
message: >-
  This comparison uses a strict less-than against 0xff, which excludes the
  maximum byte value; review whether that exclusion is intended.
note: >-
  Single-file syntactic match on a binary less-than comparison whose right
  operand is the literal 0xff. It does not know the variable's type, whether
  the value is a byte, or whether excluding 0xff is an intentional sentinel,
  so review is required.
rule:
  pattern: '$X < 0xff'
