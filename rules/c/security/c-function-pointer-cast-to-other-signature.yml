# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-function-pointer-cast-to-other-signature
language: c
severity: warning
message: >-
  Review this cast to a function pointer type; calling through a mismatched
  signature is undefined behaviour.
note: >-
  Matches a syntactic cast whose target type is a typedef named cb_t; it does
  not resolve types, aliases, or whether the cast operand actually has a
  different signature, so reviewers must confirm the call is valid.
rule:
  pattern: '(cb_t)$ARG'
