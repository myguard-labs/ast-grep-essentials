id: c-msvc-i64-suffix-split
language: c
severity: error
message: >-
  Integer literal suffix appears split by whitespace (for example 1U I64);
  write it as one token such as UI64.
note: >-
  Textual match on a digit/suffix followed by whitespace and an I64-style
  suffix within the file; it does not check macros or preprocessing.
rule:
  kind: translation_unit
  regex: '[0-9][uUlL]*\s+[iI]64\b'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
