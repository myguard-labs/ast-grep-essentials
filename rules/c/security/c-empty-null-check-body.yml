id: c-empty-null-check-body
language: c
severity: warning
message: 'This NULL check has an empty body, so the failure path is silently dropped.'
note: >-
  Syntactic single-file match on an if statement whose condition is a literal
  negated identifier with an empty compound body. It does not resolve types or
  confirm the identifier is a pointer, and deliberate empty branches will also
  match.
rule:
  pattern: |
    if (!$P) {
    }
