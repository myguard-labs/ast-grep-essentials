# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-repeated-subscript-conjunct
language: c
severity: warning
message: >-
  This && chain compares the same subscripted element to the same literal
  twice; the second index may not have been advanced.
note: >-
  Purely syntactic check on a single && expression whose two operands are
  identical subscript-equals-literal comparisons with the same index text;
  does not verify index intent, types, or aliasing.
rule:
  pattern: '$X[$I] == $L && $X[$I] == $L'
