id: c-macro-param-member-access-unparenthesized
language: c
severity: warning
message: >-
  Macro body uses an identifier directly as the operand of '.' or '->'; if it
  is a parameter, wrap it in parentheses.
note: >-
  Macro bodies are raw text in the C grammar, so this regex cannot confirm the
  identifier is a macro parameter; it may match non-parameter identifiers.
rule:
  kind: preproc_arg
  inside:
    kind: preproc_function_def
  regex: '(^|[^\w.>)\]])\s*[A-Za-z_]\w*\s*(\.|->)'
