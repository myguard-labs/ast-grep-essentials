id: c-null-branch-deref-member-write
language: c
severity: warning
message: >-
  Member assignment through a pointer inside an if (!p) branch dereferences a
  pointer that was just shown to be NULL.
note: >-
  Single-file syntactic match on a literal `if (!p)` test with a `p->field =
  ...` assignment somewhere in its body. It does not resolve types, aliasing,
  reassignment before the write, or reachability, so it may report paths where
  the pointer is not actually NULL.
rule:
  all:
    - kind: if_statement
    - has:
        pattern: '!$P'
        stopBy: end
    - has:
        pattern: '$P->$F = $V'
        stopBy: end
