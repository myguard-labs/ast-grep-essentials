id: c-null-branch-deref-member-write
language: c
severity: warning
message: >-
  Member assignment through a pointer inside the branch of an if (!p), if (p
  == NULL) or if (NULL == p) test dereferences a pointer that was just shown to
  be NULL.
note: >-
  Single-file syntactic match on a literal `if (!p)`, `if (p == NULL)` or
  `if (NULL == p)` test with a `p->field = ...` assignment somewhere in its
  NULL branch (the else branch is not searched). It does not resolve types, aliasing,
  reassignment before the write, or reachability, so it may report paths where
  the pointer is not actually NULL.
rule:
  all:
    - kind: if_statement
    - any:
        - has:
            pattern: '!$P'
            stopBy: end
        - has:
            field: condition
            any:
              - pattern: '($P == NULL)'
              - pattern: '(NULL == $P)'
    - has:
        field: consequence
        stopBy: end
        pattern: '$P->$F = $V'
