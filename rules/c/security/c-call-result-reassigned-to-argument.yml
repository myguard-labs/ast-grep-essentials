id: c-call-result-reassigned-to-argument
language: c
severity: warning
message: >-
  Call result is assigned back to its own argument and then NULL-checked; use
  a separate result variable.
note: >-
  Syntactic only; matches the same identifier text on adjacent statements
  without resolving aliasing or data flow.
rule:
  kind: expression_statement
  pattern: '$X = $F($X);'
  precedes:
    kind: if_statement
    has:
      field: condition
      has:
        pattern: '!$X'
