# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-index-bound-uses-greater-than
language: c
severity: warning
message: >-
  Index is checked with '>' instead of '>=' before an array subscript; the
  index equal to the bound is accepted and reads one element past the end.
note: >-
  Syntactic check only. Matches an if-condition of the literal form identifier
  > identifier followed by a return; it does not resolve array sizes, types,
  or whether the index is used with the same array.
rule:
  pattern: |
    if ($I > $N) return $$$RET;
  inside:
    kind: function_definition
    stopBy: end
constraints:
  'N':
    not:
      any:
        - kind: binary_expression
          all:
            - has:
                field: operator
                regex: '^-$'
            - has:
                field: right
                kind: number_literal
                regex: '^1$'
        - kind: parenthesized_expression
          has:
            kind: binary_expression
            all:
              - has:
                  field: operator
                  regex: '^-$'
              - has:
                  field: right
                  kind: number_literal
                  regex: '^1$'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-193'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/193.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'a doubly parenthesized bound i > ((N - 1)) is still reported'
  todo_cases:
    - "int f(const int *t, int i) { if (i > N) { return -1; } return t[i]; }"
    - "int f(const int *t, int i) { if (i > N) goto out; return t[i]; out: return -1; }"
    - "int f(const int *t, int i) { if (i > N) abort(); return t[i]; }"
    - "int f(const int *t, int i, int len, int mask) { if (i > len & mask - 1) return -1; return t[i]; }"
