id: c-index-bound-uses-greater-than
language: c
severity: warning
message: >-
  Index is checked with '>' instead of '>=' before an array subscript; the
  index equal to the bound is accepted and reads one element past the end.
note: >-
  Syntactic check only. Matches an if-condition of the literal form identifier
  > identifier followed by a return; it does not resolve array sizes, types,
  or whether the index is used with the same array.
rule:
  pattern: |
    if ($I > $N) return $$$RET;
  inside:
    kind: function_definition
    stopBy: end
