id: c-string-literal-to-nonconst-char-ptr
language: c
severity: warning
message: >-
  Non-const char pointer is initialized directly from a string literal;
  consider declaring it const char *.
note: >-
  Syntactic check only. Matches a declarator whose type is a plain char
  pointer initialized with a string literal; it does not resolve types,
  aliases, or whether the pointer is ever written through.
rule:
  pattern: 'char *$VAR = "$$$LIT";'
