id: c-evp-pkey-ctx-negated-status-test
language: c
severity: warning
message: >-
  Negated truth test on an EVP_PKEY_CTX status call treats negative codes such
  as -2 (unsupported operation) as success; compare against <= 0 instead.
note: >-
  Syntactic match only on a literal EVP_PKEY_CTX_ call name under a
  logical-not in an if condition. It does not verify the callee return
  convention, argument types, or whether the call is reached at runtime.
rule:
  pattern: |
    if (!EVP_PKEY_CTX_get_rsa_pss_saltlen($$$ARGS)) $$$BODY
