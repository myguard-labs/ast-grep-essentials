id: c-macro-unparenthesized-shift
language: c
severity: warning
message: >-
  Object-like macro body is an unparenthesized shift expression; wrap it in
  parentheses.
note: >-
  Syntactic match only. Flags object-like preprocessor macros whose body is a
  bare shift expression; it does not check how the macro is used or whether
  the expansion is actually reached.
rule:
  kind: preproc_def
  has:
    field: value
    regex: '<<'
    not:
      regex: '^\s*\('
