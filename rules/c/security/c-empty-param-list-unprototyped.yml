id: c-empty-param-list-unprototyped
language: c
severity: warning
message: >-
  Function declared with an empty parameter list; use (void) to state that it
  takes no arguments.
note: >-
  Matches a function declarator whose parameter list is literally empty. It
  does not check whether the function is actually called with arguments, nor
  resolve declarations in other files.
rule:
  kind: function_declarator
  has:
    field: parameters
    kind: parameter_list
    pattern: '()'
