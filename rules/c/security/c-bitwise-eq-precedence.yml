# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-bitwise-eq-precedence
language: c
severity: warning
message: >-
  Bitwise & has a right operand that is an unparenthesized equality
  comparison; C parses this as a bitwise AND with a boolean result.
note: >-
  Syntactic check only. Matches a binary & whose right operand is a == or !=
  binary expression written without parentheses; does not resolve types or
  verify the operands are flag values.
rule:
  pattern: '$L & $R'
  has:
    field: right
    kind: binary_expression
    pattern: '$A == $B'
