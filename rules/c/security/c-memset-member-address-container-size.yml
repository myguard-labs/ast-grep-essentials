id: c-memset-member-address-container-size
language: c
severity: warning
message: >-
  memset is given the address of a member but sizeof a type name for its size;
  size it with sizeof of the member instead.
note: >-
  Purely syntactic match on a memset call whose first argument is a literal
  &p->f address and whose size argument is a sizeof of a struct type name. It
  does not resolve types, confirm the member's type, or check that the size
  exceeds the member, so it may flag intentional uses.
rule:
  all:
    - pattern: 'memset(&$P->$F, 0, sizeof(struct $T))'
    - not:
        pattern: 'memset(&$P->$F, 0, sizeof($P->$F))'
