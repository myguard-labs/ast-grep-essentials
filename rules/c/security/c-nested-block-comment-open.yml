# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-nested-block-comment-open
language: c
severity: warning
message: This block comment contains a second comment opener inside its body.
note: >-
  Matches comment nodes whose text contains a '/*' after the initial opener,
  purely by syntax; it does not check whether the comment is later closed
  early or whether code is hidden.
rule:
  kind: comment
  regex: '^/\*.*/\*'
