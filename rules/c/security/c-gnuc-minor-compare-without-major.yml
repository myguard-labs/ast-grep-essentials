# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-gnuc-minor-compare-without-major
language: c
severity: warning
message: >-
  __GNUC__ >= N is ANDed with __GNUC_MINOR__ >= M, which wrongly excludes
  later major releases with a lower minor version.
note: >-
  Matches the literal expression syntax only. It does not check that the
  expression is inside a preprocessor condition or resolve macro definitions.
rule:
  pattern: '__GNUC__ >= $N && __GNUC_MINOR__ >= $M'
