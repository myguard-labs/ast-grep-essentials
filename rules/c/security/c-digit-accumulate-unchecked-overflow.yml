# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-digit-accumulate-unchecked-overflow
language: c
severity: warning
message: >-
  Decimal accumulation v = v * 10 + digit without a prior limit check in the
  loop body may overflow.
note: >-
  Syntactic only. Matches the statement shape and the absence of an earlier if
  statement in the same block. It does not verify what the check compares, the
  integer width, or any loop bound.
rule:
  all:
    - pattern: '$V = $E;'
    - has:
        pattern: '$V * 10'
        stopBy: end
    - inside:
        kind: while_statement
        stopBy: end
    - not:
        follows:
          kind: if_statement
          stopBy: end
