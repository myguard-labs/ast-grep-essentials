id: c-zend-error-core-error-in-extension
language: c
severity: warning
message: >-
  Avoid E_CORE_ERROR in extension code; it is reserved for engine startup and
  shutdown failures.
note: >-
  Matches the literal call zend_error(E_CORE_ERROR, ...) syntactically; it
  does not verify that the call lies outside startup or shutdown paths or
  resolve macros or aliases.
rule:
  pattern: 'zend_error(E_CORE_ERROR, $$$ARGS)'
