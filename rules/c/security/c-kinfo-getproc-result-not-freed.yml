# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-kinfo-getproc-result-not-freed
language: c
severity: warning
message: >-
  Result of kinfo_getproc() is stored in a local but no later free() of it is
  visible.
note: >-
  Syntactic only; does not track aliasing, ownership transfer, or frees in
  other functions or via different expressions.
rule:
  all:
    - pattern: '$T *$P = kinfo_getproc($$$ARGS);'
    - not:
        precedes:
          pattern: 'free($P);'
          stopBy: end
