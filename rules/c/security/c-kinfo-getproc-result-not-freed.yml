  cwe: 'CWE-401'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/401.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "FP: a free in both branches of an unrelated condition (if (c) { free(kp); } else { free(kp); }) is reported; FN: a condition that merely mentions the variable (if (c && kp) { free(kp); }) is accepted, and a nested return of the variable under any condition counts as ownership transfer"
