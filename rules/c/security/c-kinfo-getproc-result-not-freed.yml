# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-kinfo-getproc-result-not-freed
language: c
severity: warning
message: >-
  Result of kinfo_getproc() is stored in a local but no later free() of it is
  visible.
note: >-
  Syntactic only; does not track aliasing, ownership transfer, or frees in
  other functions or via different expressions. A free nested in a branch counts only inside an if whose condition mentions the variable.
rule:
  all:
    - pattern: '$T *$P = kinfo_getproc($$$ARGS);'
    - not:
        precedes:
          stopBy: end
          any:
            - pattern: 'free($P);'
            - pattern: 'return $P;'
            - all:
                  - kind: if_statement
                  - has:
                      field: condition
                      stopBy: end
                      pattern: '$P'
                  - has:
                      field: consequence
                      stopBy: end
                      pattern:
                        context: 'void f(void) { free($P); }'
                        selector: call_expression
            - has:
                stopBy: end
                any:
                  - all:
                      - kind: if_statement
                      - has:
                          field: condition
                          stopBy: end
                          pattern: '$P'
                      - has:
                          field: consequence
                          stopBy: end
                          pattern:
                            context: 'void f(void) { free($P); }'
                            selector: call_expression
                  - pattern: 'return $P;'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
