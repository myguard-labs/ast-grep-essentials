id: c-empty-param-list-without-void
language: c
severity: warning
message: >-
  Function definition has an empty parameter list; write (void) to declare it
  takes no arguments.
note: >-
  Matches a function definition whose declarator parameter list is literally
  empty. It is a single-file syntactic check and does not verify call sites or
  other declarations of the function.
rule:
  kind: function_definition
  has:
    kind: function_declarator
    has:
      kind: identifier
      field: declarator
      regex: '.+'
    not:
      has:
        kind: parameter_list
        has:
          kind: parameter_declaration
metadata:
  rule_modified_at: '2026-10-15'
