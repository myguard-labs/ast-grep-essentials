id: c-flush-break-drops-brigade-tail
language: c
severity: warning
message: >-
  Flush bucket branch breaks without splitting off the remaining brigade
  buckets.
note: >-
  Syntactic only; matches an if on APR_BUCKET_IS_FLUSH whose body contains a
  break and no apr_brigade_split call. Does not verify the enclosing loop or
  handling elsewhere.
rule:
  pattern: 'if (APR_BUCKET_IS_FLUSH($E)) $BODY'
  all:
    - has:
        kind: break_statement
        stopBy: end
    - not:
        has:
          kind: identifier
          regex: '^apr_brigade_split$'
          stopBy: end
