id: c-literal-return-bypasses-label-cleanup
language: c
severity: warning
message: >-
  Literal 0/NULL return in a function with a cleanup label may skip the
  cleanup; consider goto.
note: >-
  Purely syntactic. It does not check that the label does cleanup or that
  resources are live at the return.
rule:
  kind: return_statement
  regex: '^return\s+(0|NULL)\s*;$'
  all:
    - inside:
        kind: function_definition
        stopBy: end
        has:
          kind: labeled_statement
          stopBy: end
    - not:
        inside:
          kind: labeled_statement
          stopBy: end
