id: c-addref-before-refcount-decrement-free
language: c
severity: warning
message: >-
  Conditional AddRef runs before a decrement-and-free test; the count is
  incremented even when the reference is freed.
note: >-
  Matches only the adjacent-statement syntax; it does not verify that the
  counters are on different objects or resolve macros.
rule:
  all:
    - kind: if_statement
    - pattern: 'if ($C) Z_ADDREF_P($V);'
    - precedes:
        kind: if_statement
        regex: '--\s*GC_REFCOUNT'
