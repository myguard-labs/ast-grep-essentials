id: c-macro-param-strncmp-unguarded
language: c
severity: warning
message: >-
  Function-like macro calls strcmp/strncmp with no NULL test in its body; a
  NULL argument would crash.
note: >-
  Textual match on the macro definition; it does not verify that the argument
  is a macro parameter or that callers never pass NULL.
rule:
  kind: preproc_function_def
  all:
    - regex: '\bstrn?cmp\s*\(\s*\(?\s*[A-Za-z_]\w*'
    - not:
        regex: 'NULL|\bnullptr\b|!\s*[A-Za-z_(]'
