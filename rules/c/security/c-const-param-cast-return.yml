id: c-const-param-cast-return
language: c
severity: warning
message: >-
  Returning a const char * parameter cast to char * discards const on the
  caller's borrowed input.
note: >-
  Syntactic approximation. It does not link the cast variable to the const
  parameter by name, and it does not check aliasing or reassignment.
rule:
  pattern: 'return (char *)$X;'
  inside:
    stopBy: end
    kind: function_definition
    has:
      stopBy: end
      kind: parameter_declaration
      regex: 'const\s+char\s*\*'
