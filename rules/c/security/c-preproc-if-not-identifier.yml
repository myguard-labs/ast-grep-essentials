id: c-preproc-if-not-identifier
language: c
severity: warning
message: >-
  Preprocessor if with a negated bare identifier; prefer ifndef, since an
  undefined identifier silently evaluates to 0.
note: >-
  Matches only the syntactic form of a negated bare identifier as the if
  condition. It does not check whether the macro is defined or numeric.
rule:
  kind: preproc_if
  has:
    field: condition
    kind: unary_expression
    all:
      - regex: '^!'
      - has:
          field: argument
          kind: identifier
