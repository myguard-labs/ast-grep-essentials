id: c-do-while-trims-first-char
language: c
severity: warning
message: >-
  This do-while body decrements an index before its condition reads the
  element, so the first iteration removes an element unconditionally.
note: >-
  Single-file syntactic match on a do-while whose body contains a decrement of
  an identifier before the loop condition. It does not prove the index is used
  for a trim or that the decrement is unconditional at runtime.
rule:
  kind: do_statement
  has:
    kind: update_expression
    pattern: '$I--'
    stopBy: end
  all:
    - has:
        pattern: '$I--'
        stopBy: end
