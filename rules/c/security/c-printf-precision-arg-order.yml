# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-printf-precision-arg-order
language: c
severity: warning
message: >-
  The %.*s precision argument must come before the string pointer; the
  arguments look swapped.
note: >-
  Name heuristic only. It matches a length-like identifier in the second
  argument slot and does not use types to confirm which argument is the string
  or the length.
rule:
  pattern: 'printf("%.*s", $S, $L)'
constraints:
  L:
    regex: '^(len|length|n|size|count)$'
  S:
    not:
      regex: '^(len|length|n|size|count)$'
