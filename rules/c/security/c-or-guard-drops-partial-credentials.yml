# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-or-guard-drops-partial-credentials
language: c
severity: warning
message: >-
  This else-if tests a condition already implied as unreachable by an earlier
  !a || !b guard; review the credential branch routing.
note: >-
  Syntactic match only. It flags an else-if whose condition is a bare
  identifier following an if guard of the form !a || !b; it does not prove
  reachability, aliasing, or runtime values.
rule:
  pattern: |
    if (!$A || !$B) { $$$BODY1 } else if ($A) { $$$BODY2 }
