id: c-ctype-signed-char
language: c
severity: warning
message: >-
  ctype function (isdigit/isalpha/isspace/toupper/…) called without an explicit
  `(unsigned char)` cast. If the argument is a signed `char` >= 0x80 it becomes
  a negative int, which is undefined behavior for these functions. High-bit
  bytes in hostile input → UB / wrong classification. Cast:
  `isdigit((unsigned char)c)`.
note: >-
  Candidate: excludes a direct unsigned char cast. Values already in the
  unsigned-char range and EOF are also valid, but their types and ranges
  require review.
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: '^(is(digit|alpha|alnum|space|upper|lower|punct|xdigit|cntrl|print|graph)|to(upper|lower))$'
    - not:
        has:
          field: arguments
          has:
            kind: cast_expression
            has:
              field: type
              regex: '^unsigned\s+char$'
