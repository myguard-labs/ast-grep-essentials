id: c-ctype-signed-char
language: c
severity: warning
message: >-
  ctype function called without an explicit unsigned char cast; review whether
  the argument is EOF or representable as unsigned char.
note: >-
  Matches direct and singly parenthesized ctype function names syntactically,
  excluding a direct unsigned char argument cast or that cast inside one
  parenthesized expression. This does not establish function identity,
  argument type, value range, or undefined behavior.
rule:
  kind: call_expression
  all:
    - has:
        field: function
        any:
          - regex: >-
              ^(is(digit|alpha|alnum|space|upper|lower|punct|xdigit|cntrl|print|graph)|to(upper|lower))$
          - kind: parenthesized_expression
            has:
              kind: identifier
              regex: >-
                ^(is(digit|alpha|alnum|space|upper|lower|punct|xdigit|cntrl|print|graph)|to(upper|lower))$
    - not:
        has:
          field: arguments
          kind: argument_list
          has:
            matches: safe-ctype-argument
utils:
  unsigned-char-cast:
    pattern: '(unsigned char)$VALUE'
  safe-ctype-argument:
    any:
      - matches: unsigned-char-cast
      - kind: parenthesized_expression
        has:
          matches: unsigned-char-cast
