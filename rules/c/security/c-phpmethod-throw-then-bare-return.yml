id: c-phpmethod-throw-then-bare-return
language: c
severity: warning
message: >-
  zend_throw_error is followed by a bare return; use RETURN_THROWS() in
  PHP_METHOD bodies.
note: >-
  Syntactic only. Matches a zend_throw_error call statement directly followed
  by a bare return statement; does not verify that the enclosing function is a
  PHP_METHOD body or resolve control flow.
rule:
  all:
    - kind: compound_statement
      has:
        stopBy: end
        pattern: 'zend_throw_error($$$ARGS);'
    - has:
        stopBy: end
        pattern: 'return;'
    - not:
        has:
          stopBy: end
          pattern: 'RETURN_THROWS();'
