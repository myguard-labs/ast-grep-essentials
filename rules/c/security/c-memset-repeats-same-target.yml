# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-memset-repeats-same-target
language: c
severity: warning
message: >-
  Consecutive memset statements take the same address-of target; the second
  may have been meant for a different object.
note: >-
  Matches the literal syntax only. It does not check types, sizeof operands,
  or whether re-zeroing the same object is intentional.
rule:
  all:
    - kind: expression_statement
    - has:
        pattern: 'memset(&$T, $$$A)'
    - follows:
        kind: expression_statement
        has:
          pattern: 'memset(&$T, $$$B)'
