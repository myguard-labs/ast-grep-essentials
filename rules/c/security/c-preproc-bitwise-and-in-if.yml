id: c-preproc-bitwise-and-in-if
language: c
severity: warning
message: 'Bitwise & used in a preprocessor if condition; did you mean &&?'
note: >-
  Syntactic check only; it matches a direct & expression in the if directive
  condition and does not know the macro values.
rule:
  kind: binary_expression
  all:
    - has:
        field: operator
        regex: '^&$'
    - inside:
        kind: preproc_if
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
