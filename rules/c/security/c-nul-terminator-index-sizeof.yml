# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-nul-terminator-index-sizeof
language: c
severity: warning
message: >-
  Subscript write uses sizeof of the same array as its index, which is one
  element past the end.
note: >-
  Syntactic match only. Requires the indexed array and the sizeof operand to
  be the same literal identifier; does not check array types, aliasing, or
  reachability.
rule:
  pattern: '$ARR[sizeof($ARR)] = $VAL'
