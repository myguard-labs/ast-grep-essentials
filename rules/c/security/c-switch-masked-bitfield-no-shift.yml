id: c-switch-masked-bitfield-no-shift
language: c
severity: warning
message: >-
  Switch on a masked bitfield without a right shift; case labels are compared
  against the field's position value.
note: >-
  Single-file syntactic match on a switch whose condition is a literal bitwise
  AND with a hex mask; it does not resolve types, values, or whether the mask
  is a bitfield, and it does not check case label semantics beyond the literal
  shape.
rule:
  pattern: 'switch ($V & $MASK) { $$$BODY }'
