id: c-int-out-param-for-long-format
language: c
severity: warning
message: >-
  An int variable's address is passed to zend_parse_parameters with a format
  containing 'l', which writes a long.
note: >-
  Syntactic only. It does not check scope, the exact position of 'l' within
  the format, or which format character matches this argument.
rule:
  all:
    - pattern: 'zend_parse_parameters($N, $F, &$V);'
    - has:
        stopBy: end
        kind: string_literal
        regex: l
    - follows:
        stopBy: end
        pattern: 'int $V = $I;'
