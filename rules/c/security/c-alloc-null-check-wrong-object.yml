id: c-alloc-null-check-wrong-object
language: c
severity: warning
message: >-
  A pointer field was assigned from an allocator, but the next NULL check
  tests the enclosing object instead of that field.
note: >-
  Single-file syntactic match on literal receiver and field names; it does not
  resolve types, aliasing, or whether the allocator can return NULL.
rule:
  kind: compound_statement
  has:
    stopBy: end
    kind: if_statement
    pattern: 'if (r == NULL) $$$BODY'
metadata:
  rule_modified_at: '2026-10-15'
