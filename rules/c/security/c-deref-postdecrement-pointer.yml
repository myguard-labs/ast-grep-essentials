id: c-deref-postdecrement-pointer
language: c
severity: warning
message: >-
  Dereferenced postfix decrement moves the pointer instead of decrementing the
  pointee; parenthesize as (*p)-- if the pointee was intended.
note: >-
  Purely syntactic check for a unary dereference whose operand is a postfix
  decrement. It does not resolve types or confirm the operand is a pointer,
  and it does not check intent.
rule:
  pattern: '*$P--'
