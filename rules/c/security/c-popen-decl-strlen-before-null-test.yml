# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-popen-decl-strlen-before-null-test
language: c
severity: warning
message: >-
  strlen() is called on a pointer before it is null-tested; move the null
  check above the call.
note: >-
  Syntactic only; matches sibling order of the declaration and the if (!ptr)
  test, without checking that the pointer is a parameter or nullable.
rule:
  pattern: 'int $N = strlen($P);'
  precedes:
    stopBy: end
    pattern: 'if (!$P) $S'
