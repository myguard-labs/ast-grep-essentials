# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-equality-ternary-precedence
language: c
severity: warning
message: >-
  An equality comparison is used directly as the condition of a ?: expression;
  check operator precedence.
note: >-
  Syntactic only; it cannot tell whether the precedence is intentional, and it
  does not check the ternary arms.
rule:
  kind: conditional_expression
  has:
    field: condition
    kind: binary_expression
    all:
      - has:
          field: operator
          regex: '^(==|!=)$'
      - has:
          field: right
          kind: identifier
