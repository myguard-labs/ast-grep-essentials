id: c-void-return-followed-by-dead-code
language: c
severity: warning
message: >-
  A bare return statement is followed by another statement in the same block,
  so the following statements are unreachable.
note: >-
  Matches only a bare return statement that has a following sibling statement
  in the same block. It does not resolve control flow across labels, gotos, or
  nested blocks and does not check the function return type.
rule:
  pattern: 'return;'
  inside:
    kind: compound_statement
    stopBy: end
    has:
      kind: expression_statement
      follows:
        kind: return_statement
        pattern: 'return;'
