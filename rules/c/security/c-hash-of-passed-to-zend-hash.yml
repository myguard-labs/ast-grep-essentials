id: c-hash-of-passed-to-zend-hash
language: c
severity: warning
message: >-
  HASH_OF() result is passed directly to a zend_hash_* API without an
  enclosing NULL check; HASH_OF may return NULL.
note: >-
  Syntactic only. Matches when the first argument of a zend_hash_* call is
  written as HASH_OF(...). An enclosing if whose condition starts with HASH_OF
  counts as a guard. Guards stored in variables, early returns and runtime
  zval types are not tracked.
rule:
  all:
    - kind: call_expression
    - regex: '^zend_hash_\w*\s*\(\s*HASH_OF\s*\('
    - not:
        inside:
          kind: if_statement
          stopBy: end
          regex: '^if\s*\(\s*!?\s*HASH_OF\s*\('
