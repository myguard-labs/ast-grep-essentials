# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-hash-of-passed-to-zend-hash
language: c
severity: warning
message: >-
  HASH_OF() result is passed directly to a zend_hash_* API without an
  enclosing NULL check; HASH_OF may return NULL.
note: >-
  Syntactic only. Matches when the first argument of a zend_hash_* call is
  written as HASH_OF(...). An enclosing if whose condition starts with HASH_OF
  counts as a guard, as does an earlier sibling statement if (!HASH_OF(x))
  that returns, continues or breaks with the same argument x. Guards stored in
  variables and runtime zval types are not tracked.
rule:
  all:
    - kind: call_expression
    - regex: '^zend_hash_\w*\s*\(\s*HASH_OF\s*\('
    - not:
        inside:
          kind: if_statement
          stopBy: end
          regex: '^if\s*\(\s*!?\s*HASH_OF\s*\('
    - has:
        stopBy: end
        pattern:
          context: 'x = HASH_OF($X);'
          selector: call_expression
    - not:
        inside:
          stopBy: end
          follows:
            stopBy: end
            kind: if_statement
            all:
              - has:
                  field: condition
                  all:
                    - has:
                        stopBy: end
                        pattern:
                          context: 'x = !HASH_OF($X);'
                          selector: unary_expression
                    - any:
                        # whole condition is (!HASH_OF(x))
                        - regex: '^\(\s*!\s*HASH_OF\s*\((?:[^()&|?]|\([^()&|?]*\))*\)\s*\)$'
                        # (!HASH_OF(x) || ...): the negation is the first || operand, no &&/?: at top level
                        - regex: '^\(\s*!\s*HASH_OF\s*\((?:[^()&|?]|\([^()&|?]*\))*\)\s*\|\|(?:[^&?()]|\([^&?()]*\))*\)$'
                        # (... || !HASH_OF(x)): the negation is a || operand, no &&/?: at top level
                        - regex: '^\((?:[^&?()]|\([^&?()]*\))*\|\|\s*!\s*HASH_OF\s*\((?:[^()&|?]|\([^()&|?]*\))*\)\s*\)$'
              - has:
                  field: consequence
                  any:
                    - kind: return_statement
                    - kind: continue_statement
                    - kind: break_statement
                    - kind: compound_statement
                      has:
                        any:
                          - kind: return_statement
                          - kind: continue_statement
                          - kind: break_statement
