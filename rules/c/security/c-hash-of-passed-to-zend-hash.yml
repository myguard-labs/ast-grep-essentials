  taxonomy_source: 'https://cwe.mitre.org/data/definitions/476.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A10:2025'
  todo_cases:
    - "FN: second argument HASH_OF(b) of zend_hash_merge is not checked, only the first argument is matched: 'if (!HASH_OF(a)) return; zend_hash_merge(HASH_OF(a), HASH_OF(b), 0);' is not flagged"
