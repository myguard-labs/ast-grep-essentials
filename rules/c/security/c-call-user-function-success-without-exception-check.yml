id: c-call-user-function-success-without-exception-check
language: c
severity: warning
message: >-
  The result of call_user_function_ex is compared only against SUCCESS in this
  if condition; also check EG(exception).
note: >-
  Syntactic single-condition check only. It matches the literal if-condition
  shape and does not prove that EG(exception) is unchecked elsewhere in the
  function, nor resolve types, aliases, or control flow.
rule:
  pattern: 'if ($RES == SUCCESS) { $$$BODY }'
