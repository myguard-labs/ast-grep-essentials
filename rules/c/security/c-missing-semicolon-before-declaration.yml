# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-missing-semicolon-before-declaration
language: c
severity: warning
message: Array declaration lacks a terminating semicolon before the next declaration.
note: >-
  Matches syntax only; it relies on the parser's error recovery and does not
  check preprocessor conditions.
rule:
  kind: declaration
  regex: '\]\s*$'
  has:
    kind: array_declarator
  precedes:
    kind: declaration
    stopBy: neighbor
