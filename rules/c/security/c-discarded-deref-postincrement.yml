id: c-discarded-deref-postincrement
language: c
severity: warning
message: >-
  Discarded dereference of a post-incremented pointer; a bare increment was
  likely intended.
note: >-
  Single-file syntactic match on an expression statement whose top-level
  expression is a dereference of a postfix increment of an identifier. Does
  not resolve types, aliasing, or whether the pointer is at a buffer end.
rule:
  kind: expression_statement
  has:
    kind: pointer_expression
    pattern: '*$X++'
