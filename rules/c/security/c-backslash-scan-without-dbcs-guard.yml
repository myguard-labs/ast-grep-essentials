id: c-backslash-scan-without-dbcs-guard
language: c
severity: warning
message: >-
  Backslash comparison on a byte index without an IsDBCSLeadByte check on the
  preceding byte; DBCS trail bytes can equal 0x5C.
note: >-
  Single-file syntactic match on an if condition comparing an indexed byte to
  a backslash literal. It does not resolve types, encodings, or whether a DBCS
  check exists elsewhere in the function; it can produce noise outside
  multibyte-aware code.
rule:
  all:
    - pattern: 'if ($P[$I] == ''\\'') { $$$BODY }'
    - not:
        inside:
          pattern: 'if ($P[$I] == ''\\'' && !IsDBCSLeadByte($P[$I - 1])) { $$$BODY2 }'
          stopBy: end
