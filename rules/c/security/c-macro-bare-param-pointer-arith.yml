id: c-macro-bare-param-pointer-arith
language: c
severity: warning
message: >-
  Function-like macro dereferences pointer arithmetic on a bare identifier;
  cast the parameter to a byte pointer type first.
note: >-
  Textual match on the macro body; it does not verify the identifier is a
  macro parameter or resolve its type.
rule:
  kind: preproc_function_def
  has:
    kind: preproc_arg
    regex: '\*\s*\(\s*[A-Za-z_]\w*\s*[+-]'
metadata:
  rule_modified_at: '2026-10-20'
