# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-duplicate-or-operand
language: c
severity: warning
message: >-
  This logical OR chain repeats the same operand text, so one operand is
  redundant.
note: >-
  Matches only syntactic text equality of the two operands of a single ||
  expression; it does not resolve identifiers, side effects, macros, or
  runtime values, and does not prove the intended second condition is missing.
rule:
  pattern: '$A || $A'
