id: c-if-empty-body-semicolon
language: c
severity: warning
message: >-
  This if statement has an empty body, so the following statement runs
  unconditionally.
note: >-
  Matches a syntactic if statement whose consequence is a bare empty statement
  ';'. It does not check semantics, macros, or whether the empty body is
  intentional.
rule:
  pattern: 'if ($COND);'
