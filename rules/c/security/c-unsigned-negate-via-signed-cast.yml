# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-unsigned-negate-via-signed-cast
language: c
severity: warning
message: >-
  Unary minus applied to a signed cast of an operand, with the result cast
  back to unsigned; review for signed overflow.
note: >-
  Single-file syntactic match on the literal shape -(long)x inside an unsigned
  cast. It does not resolve operand types or values, so it cannot confirm the
  operand can equal LONG_MIN.
rule:
  pattern: '(unsigned long)(-(long)$X)'
