# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-memcpy-then-nul-at-len-minus-one
language: c
severity: warning
message: >-
  This NUL terminator is written at index N - 1 right after memcpy copied N
  bytes, so it overwrites the last copied byte.
note: >-
  Purely syntactic single-statement match on the literal pattern buf[n - 1] =
  '\0'; it does not verify that the preceding memcpy used the same N, that buf
  is the memcpy destination, or any aliasing, types, or reachability.
rule:
  pattern: '$DST[$N - 1] = ''\0'';'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-193'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/193.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "FP: 'buf[sizeof(buf) - 1] = 0' idiom with a literal NUL is reported though it is the correct bounded terminator"
    - "FP: 'memcpy(buf, src, n - 1); buf[n - 1] = 0' (copy n-1 then terminate) is reported although correct"
    - "FN: 'buf[n - 1] = 0' (plain 0 instead of '\\0') is not reported"
