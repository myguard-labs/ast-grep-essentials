id: c-memcpy-then-nul-at-len-minus-one
language: c
severity: warning
message: >-
  This NUL terminator is written at index N - 1 right after memcpy copied N
  bytes, so it overwrites the last copied byte.
note: >-
  Purely syntactic single-statement match on the literal pattern buf[n - 1] =
  '\0'; it does not verify that the preceding memcpy used the same N, that buf
  is the memcpy destination, or any aliasing, types, or reachability.
rule:
  pattern: '$DST[$N - 1] = ''\0'';'
