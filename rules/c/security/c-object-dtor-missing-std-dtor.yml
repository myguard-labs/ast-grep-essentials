# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-object-dtor-missing-std-dtor
language: c
severity: warning
message: >-
  Function calls efree() but never calls zend_object_std_dtor(); the embedded
  zend_object may leak.
note: >-
  Syntactic check only; does not verify the freed value is a
  zend_object-embedding struct or that the destructor is called in another
  function.
rule:
  kind: function_definition
  all:
    - has:
        stopBy: end
        kind: call_expression
        has:
          field: function
          regex: '^efree$'
    - not:
        has:
          stopBy: end
          kind: call_expression
          has:
            field: function
            regex: '^zend_object_std_dtor$'
