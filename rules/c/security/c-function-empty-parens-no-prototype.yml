id: c-function-empty-parens-no-prototype
language: c
severity: warning
message: >-
  Function declared with empty parentheses has an unprototyped parameter list;
  use (void) to disable argument checking.
note: >-
  Matches the literal syntax of a function whose parameter list is an empty ()
  without resolving whether the function is declared elsewhere or what C
  standard mode is in use.
rule:
  kind: function_declarator
  has:
    field: declarator
    kind: identifier
  not:
    has:
      kind: parameter_list
      has:
        kind: parameter_declaration
