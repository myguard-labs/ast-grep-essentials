id: c-error-return-leaves-out-position-unset
language: c
severity: warning
message: >-
  Function writes *status but never writes *newpos; the out-position may be
  left unset on failure.
note: >-
  Purely syntactic per-function check keyed on the parameter names newpos and
  status; it does not analyze control flow, so a write on some other path is
  not distinguished.
rule:
  kind: function_definition
  all:
    - has:
        kind: pointer_declarator
        regex: newpos
        stopBy: end
    - has:
        pattern: '*status = $V'
        stopBy: end
    - not:
        has:
          pattern: '*newpos = $W'
          stopBy: end
