id: c-normalize-carry-strict-greater
language: c
severity: warning
message: >-
  Carry normalization uses a strict > comparison; a value exactly equal to N
  is left unnormalized. Consider >=.
note: >-
  Matches only the literal syntax of one if statement whose condition and body
  use the same lvalue text and literal text. It does not resolve types,
  aliasing, or surrounding guards.
rule:
  kind: if_statement
  all:
    - has:
        field: condition
        has:
          pattern: '$L > $N'
    - has:
        field: consequence
        has:
          pattern: '$L -= $N'
          stopBy: end
constraints:
  'N':
    kind: number_literal
