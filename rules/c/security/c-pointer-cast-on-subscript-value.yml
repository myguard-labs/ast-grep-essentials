id: c-pointer-cast-on-subscript-value
language: c
severity: warning
message: >-
  Pointer-typed cast applied directly to an array subscript; verify the
  element is meant to be a pointer.
note: >-
  Matches the literal syntax of a pointer cast (T *) applied directly to a
  subscript expression. It does not resolve types, so arrays whose elements
  are genuinely pointers may be legitimate and need review.
rule:
  pattern: '($TYPE *) $ARR[$IDX]'
