# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-loop-body-uses-head-not-cursor
language: c
severity: warning
message: Loop body passes the seed variable to a call instead of the loop cursor.
note: >-
  Syntactic only; it does not check types, aliasing, or whether passing the
  head is intended.
rule:
  kind: for_statement
  all:
    - has:
        field: initializer
        pattern: '$C = $H'
    - has:
        field: update
        pattern: '$C = $C->next'
    - has:
        field: body
        has:
          kind: call_expression
          stopBy: end
          has:
            field: arguments
            has:
              pattern: '$H'
