# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-timeval-usec-unnormalized-assign
language: c
severity: warning
message: >-
  Assignment to tv_usec from a non-constant expression without modulo 1000000
  reduction; verify the value is normalized below one million.
note: >-
  Syntactic check only. Matches a literal tv.tv_usec assignment whose
  right-hand side is not a modulo expression; it does not resolve types, prove
  the value is unnormalized, or track upstream normalization.
rule:
  all:
    - pattern: '$TV.tv_usec = $VAL'
    - not:
        pattern: '$TV.tv_usec = $X % 1000000'
