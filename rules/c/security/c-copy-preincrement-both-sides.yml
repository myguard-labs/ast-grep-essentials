id: c-copy-preincrement-both-sides
language: c
severity: warning
message: >-
  Assignment pre-increments both the destination and source pointers, which
  may skip the first source byte.
note: >-
  Matches the literal syntax of a pre-increment dereference on both sides of a
  single assignment without resolving pointer types, aliasing, or whether the
  pre-advanced cursor is intentional.
rule:
  pattern: '*++$DST = *++$SRC'
