id: c-static-inline-missing-return-type
language: c
severity: warning
message: >-
  This function has static inline storage class but no return type, relying on
  implicit int.
note: >-
  Matches the literal syntax of a static inline function definition with no
  type specifier before the declarator. It does not verify that the code is
  parsed as a function definition by the compiler or resolve macros such as
  ELS_D.
rule:
  pattern: 'static inline $NAME($$$ARGS) { $$$BODY }'
