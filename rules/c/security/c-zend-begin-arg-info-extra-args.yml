id: c-zend-begin-arg-info-extra-args
language: c
severity: warning
message: >-
  ZEND_BEGIN_ARG_INFO is called with extra arguments; use
  ZEND_BEGIN_ARG_INFO_EX when required-args and rest-by-reference fields are
  given.
note: >-
  Matches only the literal macro call syntax with four arguments written as
  ZEND_BEGIN_ARG_INFO(a, b, c, d); it does not verify the macro definition,
  include context, or whether the arginfo table is otherwise correct.
rule:
  pattern: 'ZEND_BEGIN_ARG_INFO($A, $B, $C, $D)'
