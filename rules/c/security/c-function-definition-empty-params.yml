# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-function-definition-empty-params
language: c
severity: warning
message: 'Function definition uses empty parameter parentheses instead of (void).'
note: >-
  Matches a function definition whose declarator has an empty parameter list
  syntactically; does not check whether the function is called with arguments
  or resolve types.
rule:
  kind: function_definition
  has:
    kind: function_declarator
    all:
      - has:
          kind: parameter_list
          not:
            has:
              kind: parameter_declaration
      - not:
          has:
            kind: parameter_declaration
