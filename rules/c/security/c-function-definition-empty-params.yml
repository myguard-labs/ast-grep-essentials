id: c-function-definition-empty-params
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-empty-parameter-list-definition. A named function definition has an
  empty parameter list; use (void) to declare no parameters.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use c-empty-parameter-list-definition and do not emit this rule.
rule:
  kind: function_definition
  has:
    field: declarator
    kind: function_declarator
    has:
      field: parameters
      kind: parameter_list
      pattern: '()'
metadata:
  deprecated_alias_of: c-empty-parameter-list-definition
  rule_modified_at: '2026-11-15'
  created_at: '2026-10-15'
