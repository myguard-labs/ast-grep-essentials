id: c-apr-interval-time-bare-integer
language: c
severity: warning
message: >-
  apr_interval_time_t is in microseconds; wrap integer literals in
  apr_time_from_sec or apr_time_from_msec.
note: >-
  Matches only a declaration initialised with a literal non-zero integer. It
  does not track later assignments, macros, or aliases of the type.
rule:
  pattern: 'apr_interval_time_t $V = $N;'
constraints:
  'N':
    kind: number_literal
    not:
      regex: '^0+$'
