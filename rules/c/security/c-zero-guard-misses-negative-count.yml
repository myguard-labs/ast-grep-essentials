id: c-zero-guard-misses-negative-count
language: c
severity: warning
message: >-
  Ternary guarded by an equality-to-zero check computes n - 1 in its false
  branch; a negative count passes the guard.
note: >-
  Purely syntactic match on a conditional expression whose condition is
  literally n == 0 and whose false branch is n - 1. It does not resolve types,
  value ranges, or whether n can actually be negative at runtime.
rule:
  pattern: '($N == 0 ? $_ : $N - 1)'
