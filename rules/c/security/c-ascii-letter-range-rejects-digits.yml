# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-ascii-letter-range-rejects-digits
language: c
severity: warning
message: >-
  This comparison tests only the uppercase letter range 'A' to 'Z' and may
  reject digits in names that should allow them.
note: >-
  Matches a literal logical-or of a less-than test against 'A' and a
  greater-than test against 'Z' on the same dereferenced operand, inside an if
  condition. This is a syntactic check only and does not establish how the
  surrounding code uses the value.
rule:
  pattern: 'if (*$P < ''A'' || *$P > ''Z'') $$$BODY'
