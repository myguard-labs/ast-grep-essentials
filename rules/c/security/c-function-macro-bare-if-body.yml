id: c-function-macro-bare-if-body
language: c
severity: warning
message: >-
  Function-like macro body is a bare if statement followed by more statements;
  wrap the body in do { ... } while (0) or braces.
note: >-
  Syntactic text match on the raw preprocessor line only; does not verify
  macro expansion, call-site behavior, or whether the body is otherwise safe.
rule:
  kind: preproc_function_def
  regex: '^#define\s+\w+\([^)]*\)\s+if\s*\(.*\)\s*\{.*\}\s*\S.*$'
  not:
    regex: 'do\s*\{'
