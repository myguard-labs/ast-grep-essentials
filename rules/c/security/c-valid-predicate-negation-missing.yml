id: c-valid-predicate-negation-missing
language: c
severity: warning
message: >-
  A call whose name contains "valid" is used as a bare truth test guarding a
  return; verify the predicate polarity.
note: >-
  Syntactic heuristic only. Matches a bare call to a function whose name
  contains "valid" used directly as an if condition with a return in the body;
  it does not resolve the callee, its return semantics, or whether the if is a
  correct guard.
rule:
  all:
    - kind: if_statement
    - has:
        field: condition
        kind: parenthesized_expression
        has:
          kind: call_expression
          pattern: '$CALL'
          has:
            field: function
            regex: valid
    - has:
        kind: compound_statement
        has:
          kind: return_statement
