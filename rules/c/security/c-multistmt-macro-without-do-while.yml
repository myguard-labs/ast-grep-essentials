id: c-multistmt-macro-without-do-while
language: c
severity: warning
message: >-
  Function-like macro body starts with a bare for/if/while statement; wrap it
  in do { ... } while (0).
note: >-
  Matches only the macro body text beginning with for, if, or while. It does
  not analyze whether the body expands to several statements or how the macro
  is used.
rule:
  kind: preproc_function_def
  has:
    kind: preproc_arg
    regex: '^\s*(for|if|while)\b'
