id: c-alloc-mul-overflow
language: c
severity: warning
message: >-
  Allocation argument computed with an unchecked multiplication. For
  malloc/realloc, nginx pool allocators, and unchecked Zend allocators, a
  wrapped product becomes the allocation size. For calloc/reallocarray and
  checked Zend allocators, the nested product is evaluated before their
  overflow checks. Pass raw factors to checked allocators; otherwise use a
  checked multiply or reject the input before allocation.
note: Dismiss if both factors are compile-time constants or provably bounded.
rule:
  any:
    - pattern:
        context: void f(void) { malloc($A * $B); }
        selector: call_expression
    - pattern:
        context: void f(void) { ngx_palloc($POOL, $A * $B); }
        selector: call_expression
    - pattern:
        context: void f(void) { ngx_pnalloc($POOL, $A * $B); }
        selector: call_expression
    - pattern:
        context: void f(void) { ngx_pcalloc($POOL, $A * $B); }
        selector: call_expression
    - pattern:
        context: void f(void) { malloc(($A * $B)); }
        selector: call_expression
    - pattern:
        context: void f(void) { ngx_palloc($POOL, ($A * $B)); }
        selector: call_expression
    - pattern:
        context: void f(void) { ngx_pnalloc($POOL, ($A * $B)); }
        selector: call_expression
    - pattern:
        context: void f(void) { ngx_pcalloc($POOL, ($A * $B)); }
        selector: call_expression
    - pattern:
        context: void f(void) { calloc($A * $B, $_); }
        selector: call_expression
    - pattern:
        context: void f(void) { calloc($_, $A * $B); }
        selector: call_expression
    - pattern:
        context: void f(void) { reallocarray($_, $A * $B, $_); }
        selector: call_expression
    - pattern:
        context: void f(void) { reallocarray($_, $_, $A * $B); }
        selector: call_expression
    - pattern:
        context: void f(void) { ecalloc($A * $B, $_); }
        selector: call_expression
    - pattern:
        context: void f(void) { ecalloc($_, $A * $B); }
        selector: call_expression
    - pattern:
        context: void f(void) { safe_emalloc($A * $B, $_, $_); }
        selector: call_expression
    - pattern:
        context: void f(void) { safe_emalloc($_, $A * $B, $_); }
        selector: call_expression
    - pattern:
