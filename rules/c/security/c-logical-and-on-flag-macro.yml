id: c-logical-and-on-flag-macro
language: c
severity: warning
message: >-
  Logical && is applied to an ALL_CAPS flag macro; a bitwise & may have been
  intended.
note: >-
  Syntactic match only. Matches a binary && whose right operand is an ALL_CAPS
  identifier; it does not verify that the left operand is an integer flags
  variable or that the macro is a bit flag.
rule:
  kind: binary_expression
  all:
    - has:
        field: operator
        regex: '^&&$'
    - has:
        field: right
        kind: identifier
        regex: '^[A-Z][A-Z0-9_]*$'
