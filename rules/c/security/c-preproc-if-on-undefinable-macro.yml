id: c-preproc-if-on-undefinable-macro
language: c
severity: warning
message: '#if tests a bare macro identifier; use #ifdef if the macro may be undefined.'
note: >-
  Syntactic only; it cannot tell whether the macro is always defined by the
  build or configure.
rule:
  kind: preproc_if
  has:
    field: condition
    kind: identifier
