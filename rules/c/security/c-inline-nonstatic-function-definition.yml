id: c-inline-nonstatic-function-definition
language: c
severity: warning
message: >-
  Inline function definition without static or extern may be an inline-only
  definition that leaves the symbol unresolved.
note: >-
  Matches only the specifiers written on the definition; it does not check for
  a separate extern declaration elsewhere or other translation units.
rule:
  kind: function_definition
  all:
    - has:
        kind: storage_class_specifier
        regex: '^(inline|__inline|__inline__)$'
    - not:
        has:
          kind: storage_class_specifier
          regex: '^(static|extern)$'
