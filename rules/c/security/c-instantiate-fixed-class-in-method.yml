id: c-instantiate-fixed-class-in-method
language: c
severity: warning
message: >-
  spl_instantiate_arg_ex2 is called with a fixed spl_ce_* class entry;
  subclasses of $this will not be instantiated.
note: >-
  Matches the call syntax with a literal spl_ce_* first argument; it does not
  verify the enclosing SPL_METHOD body or resolve macros.
rule:
  pattern: 'spl_instantiate_arg_ex2($CE, $$$ARGS)'
constraints:
  CE:
    regex: '^spl_ce_'
