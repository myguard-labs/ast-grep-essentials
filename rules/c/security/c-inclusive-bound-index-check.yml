id: c-inclusive-bound-index-check
language: c
severity: warning
message: >-
  Inclusive upper-bound check guards an array subscript with the same index;
  verify the bound is an element count rather than a last-valid index.
note: >-
  Syntactic match only. Cannot confirm that the macro is an element count or
  that the subscripted array has that size; intended for review, not proof of
  an off-by-one.
rule:
  kind: if_statement
  all:
    - has:
        pattern: '$IDX <= $MAX'
        stopBy: end
    - has:
        pattern: '$ARR[$IDX]'
        stopBy: end
