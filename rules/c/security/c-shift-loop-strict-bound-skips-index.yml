id: c-shift-loop-strict-bound-skips-index
language: c
severity: warning
message: >-
  This downward shift loop uses a strict lower bound, so the element at the
  insertion index is never moved.
note: >-
  Syntactic match on a downward for loop with a strict '>' lower bound and a
  single-index array copy in the body. It does not verify that the bound
  variable is an insertion point or that the skipped slot is actually needed.
rule:
  pattern: 'for ($I = $S; $I > $LOC; $I--) $DST[$I] = $SRC[$I];'
