# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-objects-free-missing-std-dtor
language: c
severity: warning
message: >-
  Object storage is released with efree in a block that never calls
  zend_object_std_dtor.
note: >-
  Syntactic check only. It looks for a zend_object_std_dtor identifier
  anywhere in the enclosing compound statement and does not verify call order,
  the argument, helper functions, or macro expansion.
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        kind: identifier
        regex: '^efree$'
    - inside:
        kind: compound_statement
        stopBy: end
        not:
          has:
            kind: identifier
            regex: '^zend_object_std_dtor$'
            stopBy: end
