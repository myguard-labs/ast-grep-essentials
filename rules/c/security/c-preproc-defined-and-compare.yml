id: c-preproc-defined-and-compare
language: c
severity: warning
message: 'Condition combines !defined(X) with && and then compares the same macro X.'
note: >-
  Matches the literal syntax only; does not evaluate preprocessor semantics or
  other comparison operators.
rule:
  pattern:
    context: |
      #if !defined($X) && $X != $V
      #endif
    selector: binary_expression
