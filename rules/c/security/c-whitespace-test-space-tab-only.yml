# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-whitespace-test-space-tab-only
language: c
severity: warning
message: >-
  This character test accepts only space and tab as whitespace; newline,
  carriage return, vertical tab and form feed are rejected.
note: >-
  Syntactic match on a binary inequality chain comparing a dereferenced
  pointer against ' ' and '\t' only. It does not resolve types, library
  predicates, or whether the surrounding code intends to exclude other
  whitespace.
rule:
  pattern: '$X != '' '' && $X != ''\t'''
