id: c-deref-postfix-increment-discarded
language: c
severity: warning
message: >-
  This expression statement dereferences a postfix increment and discards the
  read value; review whether a plain pointer advance was intended.
note: >-
  Single-file syntactic match on an expression statement whose whole
  expression is a unary dereference of a postfix increment of an identifier.
  Does not check types, aliasing, or whether the discarded value is used
  elsewhere.
rule:
  kind: expression_statement
  has:
    kind: pointer_expression
    pattern: '*$P++'
