id: c-error-break-only-in-ifdef-arm
language: c
severity: warning
message: >-
  A break in the error branch appears only in one preprocessor conditional
  arm; the other configuration may keep looping.
note: >-
  Matches syntax only; it does not evaluate macros, verify the call is a read
  or write, or check the other arm for other exits.
rule:
  kind: break_statement
  all:
    - inside:
        kind: preproc_ifdef
        has:
          kind: preproc_else
    - inside:
        kind: if_statement
        stopBy: end
