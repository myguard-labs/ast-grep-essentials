# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-nested-comment-open-marker
language: c
severity: warning
message: >-
  This block comment contains a nested /* opener, which is ignored by the
  compiler and may hide code or mislead readers.
note: >-
  Matches comment text syntactically by checking for a second /* after the
  opening marker; it does not verify compiler warnings or semantic intent.
rule:
  kind: comment
  regex: '^/\*(?s:.*)/\*'
