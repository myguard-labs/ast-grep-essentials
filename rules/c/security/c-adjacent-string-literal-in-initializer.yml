id: c-adjacent-string-literal-in-initializer
language: c
severity: warning
message: >-
  Adjacent string literals with no comma inside an initializer list are
  concatenated into one element, shifting later indices.
note: >-
  Syntactic check only. Matches two string literals directly adjacent inside
  an initializer list; intentional line-wrapped literals may also match and
  need review.
rule:
  all:
    - kind: string_literal
    - follows:
        kind: string_literal
        stopBy: neighbor
    - inside:
        kind: initializer_list
        stopBy: end
