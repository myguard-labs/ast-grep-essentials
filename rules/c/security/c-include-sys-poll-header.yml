id: c-include-sys-poll-header
language: c
severity: warning
message: >-
  Including <sys/poll.h> unconditionally is non-portable; some platforms only
  provide <poll.h>. Guard the include with a configure feature test.
note: >-
  Matches the literal system_lib_string path <sys/poll.h> in a preprocessor
  include. It does not check whether the header exists or whether a configure
  guard surrounds the include.
rule:
  pattern: '#include <sys/poll.h>'
