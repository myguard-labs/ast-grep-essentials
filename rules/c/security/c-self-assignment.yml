id: c-self-assignment
language: c
severity: warning
message: This assignment copies a value from the same expression it assigns to.
note: >-
  Matches only assignments whose right-hand side is textually identical to the
  left-hand side; it does not resolve aliasing, types, or runtime values.
rule:
  kind: assignment_expression
  all:
    - has:
        field: left
        pattern: '$LHS'
    - has:
        field: right
        pattern: '$LHS'
