id: c-while-deref-ignores-length-param
language: c
severity: warning
message: >-
  This while loop tests only a pointer dereference; the function's length
  parameter is not checked in the loop condition.
note: >-
  Syntactic heuristic only. Matches a while condition that is exactly a
  dereference of an identifier. It does not verify that the function has a
  length parameter, that the buffer is unterminated, or that any bounds check
  exists elsewhere.
rule:
  all:
    - kind: while_statement
    - has:
        field: condition
        pattern: '$COND'
        stopBy: end
    - pattern: 'while (*$P) $$$BODY'
