id: c-openssl-free-without-length-reset
language: c
severity: warning
message: >-
  Pointer member is freed and set to NULL but no sibling length member is
  reset in this block.
note: >-
  Syntactic only; any assignment to a field ending in _len in the block
  suppresses the match, without checking it is the sibling.
rule:
  all:
    - pattern: '$S->$F = NULL;'
    - follows:
        pattern: 'OPENSSL_free($S->$F);'
    - inside:
        kind: compound_statement
        not:
          has:
            kind: assignment_expression
            regex: '_len\s*='
            stopBy: end
