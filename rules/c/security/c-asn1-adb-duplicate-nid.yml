# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-asn1-adb-duplicate-nid
language: c
severity: warning
message: >-
  This ADB_ENTRY repeats the NID of an earlier sibling ADB_ENTRY in the same
  table.
note: >-
  Matches textually identical first arguments among sibling ADB_ENTRY calls;
  it does not resolve macros, aliases, or confirm the entries belong to one
  ASN1_ADB table.
rule:
  pattern: 'ADB_ENTRY($NID, $$$A)'
  follows:
    pattern: 'ADB_ENTRY($NID, $$$B)'
    stopBy: end
