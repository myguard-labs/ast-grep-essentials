id: c-and-or-precedence-guard-bypass
language: c
severity: warning
message: >-
  Unparenthesized && inside || may bypass the length guard before the array
  subscript on the right.
note: >-
  Syntactic check only. Matches a || whose left operand is a bare && binary
  expression and whose right operand contains a subscript expression; it does
  not prove the index is out of bounds or resolve types or values.
rule:
  pattern: '$A && $B || $C'
