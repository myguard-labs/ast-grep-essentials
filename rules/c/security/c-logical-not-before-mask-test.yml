id: c-logical-not-before-mask-test
language: c
severity: warning
message: >-
  Logical ! is applied to the left operand of & in a flag test; the test reads
  (!mask) & FLAG rather than the flag bit.
note: >-
  Single-file syntactic match on a binary_expression whose left operand is a
  unary ! applied to a bare identifier and whose operator is &. It does not
  resolve types or confirm that the identifier is a bitmask.
rule:
  pattern: '! $MASK & $FLAG'
