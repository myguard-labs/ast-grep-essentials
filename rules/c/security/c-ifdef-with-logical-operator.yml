id: c-ifdef-with-logical-operator
language: c
severity: warning
message: >-
  #ifdef/#ifndef takes a single identifier; use #if defined(A) && defined(B)
  instead.
note: >-
  Matches only the directive's first line textually; it does not check macro
  definitions or preprocessor semantics.
rule:
  kind: preproc_ifdef
  regex: '^\s*#\s*if(n)?def[^\n]*(&&|\|\|)'
