id: c-int-cast-address-as-unsigned-out-param
language: c
severity: warning
message: >-
  Address of a variable is cast to an unsigned int pointer and passed as an
  argument; verify the pointed-to type matches the variable.
note: >-
  Matches the literal syntax of a cast of an address-of expression to unsigned
  int * inside a call argument. It does not resolve the variable's declared
  type, aliasing, or whether the callee writes through the pointer.
rule:
  pattern: '(unsigned int *)&$VAR'
