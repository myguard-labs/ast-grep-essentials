id: c-times-error-check-lt-zero
language: c
severity: warning
message: >-
  Error test on times() result uses '< 0', but times() signals failure as
  (clock_t)-1, which an unsigned clock_t never makes negative. Compare against
  -1 instead.
note: >-
  Syntactic match only on an assignment of a times(...) call compared with '<
  0'. Does not resolve clock_t signedness, types, or whether the result is
  used elsewhere.
rule:
  pattern: '($X = times($$$ARGS)) < 0'
