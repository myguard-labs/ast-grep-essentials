id: c-debug-only-return-check
language: c
severity: warning
message: >-
  This error-returning if block is inside a preprocessor guard that release
  builds may compile out.
note: >-
  Single-file syntactic match on an if statement whose body contains a return
  inside a preprocessor block; it does not resolve macro definitions or prove
  that ZEND_DEBUG is undefined in release builds.
rule:
  all:
    - kind: if_statement
    - has:
        pattern: 'return FAILURE;'
        stopBy: end
    - inside:
        kind: preproc_if
        has:
          field: condition
          regex: '^ZEND_DEBUG$'
        stopBy: end
