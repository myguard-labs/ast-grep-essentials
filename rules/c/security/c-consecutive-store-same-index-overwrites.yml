# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-consecutive-store-same-index-overwrites
language: c
severity: warning
message: >-
  This assignment to an array index is immediately followed by another
  assignment to the same index, so the first store appears dead.
note: >-
  Syntactic adjacent-statement check only. It matches two consecutive
  expression statements assigning to the same literal receiver and index text;
  it does not prove the index is unchanged, detect aliasing through pointers,
  or confirm that no read occurs between them.
rule:
  kind: expression_statement
  pattern: '$A[$I] = $V1;'
  follows:
    kind: expression_statement
    pattern: '$A[$I] = $V2;'
