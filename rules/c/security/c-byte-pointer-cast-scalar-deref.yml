# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-byte-pointer-cast-scalar-deref
language: c
severity: warning
message: >-
  Dereferenced cast of a byte pointer to a wider scalar type may be
  misaligned; consider memcpy.
note: >-
  Matches the literal syntax of a unary dereference of a cast to a pointer
  type. It does not resolve types, width of T, alignment guarantees, or
  whether the pointer actually refers to unaligned memory.
rule:
  pattern: '*(double *) $E'
