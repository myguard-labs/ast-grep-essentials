id: nginx-table-missing-sentinel
language: c
severity: error
message: >-
  nginx static table lacks its terminating sentinel. ngx_conf_enum_t and
  ngx_conf_bitmask_t arrays end with { ngx_null_string, 0 }, ngx_command_t
  arrays with ngx_null_command, and ngx_http_variable_t / ngx_stream_variable_t
  arrays with ngx_http_null_variable / ngx_stream_null_variable or the
  expanded { ngx_null_string, NULL, NULL, 0, 0, 0 } it stands for. The slot
  walker and the module loader read past the array otherwise.
note: >-
  Real: nginx-zstd-module 08ef190 (#74), ngx_http_zstd_static[] enum table
  without a sentinel; an unmatched directive value walked into unrelated
  memory. The rule asks only whether a sentinel appears among the initialiser
  elements at any depth, so a preprocessor block between the braces does not
  displace it, not whether it is last, so a sentinel in the middle of a table
  still passes here even though the walker stops there. The sentinel must be
  a real identifier child, so a string or comment merely naming it does not
  satisfy the rule. Only initialised array definitions are checked; a table
  filled at runtime is out of scope.
rule:
  kind: declaration
  any:
    - all:
        - has:
            field: type
            regex: ^ngx_conf_(enum|bitmask)_t$
        - has:
            kind: init_declarator
            all:
              - has:
                  field: declarator
                  kind: array_declarator
              - has:
                  field: value
                  kind: initializer_list
                  not:
                    has:
                      stopBy: end
                      kind: identifier
                      regex: ^ngx_null_string$
    - all:
        - has:
            field: type
            regex: ^ngx_command_t$
        - has:
            kind: init_declarator
            all:
              - has:
                  field: declarator
                  kind: array_declarator
              - has:
                  field: value
                  kind: initializer_list
                  not:
                    has:
                      stopBy: end
                      kind: identifier
                      regex: ^ngx_null_command$
    - all:
        - has:
            field: type
            regex: ^ngx_(http|stream)_variable_t$
        - has:
            kind: init_declarator
            all:
              - has:
                  field: declarator
                  kind: array_declarator
              - has:
                  field: value
                  kind: initializer_list
                  not:
                    has:
                      stopBy: end
                      kind: identifier
                      regex: ^(ngx_(http|stream)_null_variable|ngx_null_string)$
