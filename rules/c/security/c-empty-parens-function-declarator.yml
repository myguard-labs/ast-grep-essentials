id: c-empty-parens-function-declarator
language: c
severity: warning
message: >-
  Function declared with empty parameter list (); use (void) to declare no
  parameters.
note: >-
  Syntactic match on a function declarator whose parameter list is literally
  empty. It does not check whether the function is C23 or whether a call site
  or prototype elsewhere in the translation unit is affected.
rule:
  kind: function_declarator
  has:
    field: parameters
    kind: parameter_list
    not:
      has:
        kind: parameter_declaration
  not:
    has:
      field: parameters
      kind: parameter_list
      regex: void
