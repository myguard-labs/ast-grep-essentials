id: c-preprocessor-bitwise-or-in-if
language: c
severity: warning
message: >-
  Preprocessor if condition joins macro identifiers with bitwise | instead of
  logical ||.
note: >-
  Matches the directive line text only; it does not evaluate macro definitions
  or values, or decide whether bitwise OR was intended.
rule:
  kind: translation_unit
  regex: '(?m)^[ \t]*\x23[ \t]*(?:el)?if\b[^\n]*\w[ \t]*\|[ \t]*\w'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
