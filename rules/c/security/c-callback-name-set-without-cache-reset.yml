# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-callback-name-set-without-cache-reset
language: c
severity: warning
message: >-
  Callback name field is assigned in a function that never assigns a sibling
  fci_cache initialized flag.
note: >-
  Syntactic only; matches by field-name text within one function and does not
  verify that the cache field pairs with the name or is reset elsewhere.
rule:
  all:
    - kind: assignment_expression
    - has:
        field: left
        kind: field_expression
        has:
          field: field
          kind: field_identifier
          regex: '_func_name$'
    - inside:
        kind: function_definition
        stopBy: end
        not:
          has:
            stopBy: end
            kind: assignment_expression
            has:
              field: left
              regex: '_fci_cache\.initialized$'
