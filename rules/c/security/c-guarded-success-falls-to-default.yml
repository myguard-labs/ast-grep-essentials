id: c-guarded-success-falls-to-default
language: c
severity: warning
message: >-
  This case returns only inside an if without else, so a false condition falls
  through into the default case.
note: >-
  Syntactic only; it does not check whether the fall-through is intended or
  what the callee's NULL contract is.
rule:
  all:
    - kind: case_statement
    - regex: '^case'
    - has:
        all:
          - kind: if_statement
          - not:
              has:
                kind: else_clause
          - has:
              kind: return_statement
              stopBy: end
    - not:
        has:
          kind: return_statement
    - precedes:
        kind: case_statement
        regex: '^default'
metadata:
