# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-printf-stray-percent-conversion
language: c
severity: warning
message: >-
  String literal contains a '%' followed by a word, which a printf-style
  function parses as a conversion specifier.
note: >-
  Syntactic check only; it does not verify the string is used as a
  printf-style format and may flag legitimate %-words.
rule:
  kind: string_literal
  regex: '(^|[^%])%[a-zA-Z]{4,}'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-628'
  owasp: 'A06:2025'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/628.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: '`"%d%sword"` (a valid `%s` followed by text) and Windows variables such as `"%PATH%"` are reported because any % followed by four letters matches'
  todo_cases:
    - 'FN: `"%%%word"` (escaped percent then a real stray conversion) and a stray conversion of three letters such as `"%abc"` are not matched.'
