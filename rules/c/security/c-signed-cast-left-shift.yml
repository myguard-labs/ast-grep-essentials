id: c-signed-cast-left-shift
language: c
severity: warning
message: >-
  Left shift applied to an explicit cast to a signed int type; shifting a
  negative value is undefined behaviour.
note: >-
  Syntactic check only. Matches a left shift whose left operand is a literal
  (int) cast expression; it does not resolve types, typedefs, or whether the
  runtime value is negative.
rule:
  pattern: '((int)($X) << $S)'
