id: c-misspelled-preprocessor-directive
language: c
severity: warning
message: >-
  Preprocessor directive name is not a standard directive; it may be
  misspelled.
note: >-
  Matches the directive spelling syntactically against a fixed list of
  standard and common extension directive names; it cannot know
  compiler-specific extensions or whether the block is active.
rule:
  kind: preproc_directive
  not:
    regex: >-
      ^#[
      \t]*(define|undef|include|include_next|import|if|ifdef|ifndef|elif|elifdef|elifndef|else|endif|error|warning|pragma|line|ident|sccs|assert|unassert|embed)$
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
