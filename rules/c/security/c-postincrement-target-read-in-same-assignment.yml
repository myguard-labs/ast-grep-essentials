# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-postincrement-target-read-in-same-assignment
language: c
severity: warning
message: >-
  The left side post-increments a pointer that the right side also reads,
  which is an unsequenced modification.
note: >-
  Syntactic only; it matches the literal *x++ = ... form with the same
  identifier text on the right and does not check aliasing or other
  sequencing.
rule:
  all:
    - pattern: '*$S++ = $R'
    - has:
        field: right
        stopBy: end
        pattern: '$S'
