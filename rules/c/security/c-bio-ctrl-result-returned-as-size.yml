id: c-bio-ctrl-result-returned-as-size
language: c
severity: warning
message: >-
  A BIO_ctrl() call is returned directly from a function; a negative error
  result may wrap when converted to an unsigned type.
note: >-
  Syntactic check only. Matches a return statement whose value is a direct
  BIO_ctrl() call. It does not verify the enclosing return type, the
  BIO_ctrl() result type, or any sign check elsewhere in the function.
rule:
  pattern: 'return BIO_ctrl($$$ARGS);'
