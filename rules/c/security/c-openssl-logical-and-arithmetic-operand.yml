# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-openssl-logical-and-arithmetic-operand
language: c
severity: warning
message: >-
  Arithmetic expression used directly as an && operand; the condition tests
  its truthiness rather than a comparison.
note: >-
  Single-file syntactic match on a logical_expression whose right operand is a
  bare arithmetic binary_expression (+, -, *, /) with no comparison. Does not
  resolve types, values, or whether the result is intentionally truth-tested.
rule:
  kind: binary_expression
  pattern: '$A && $L + $R'
  inside:
    kind: return_statement
