id: c-label-before-closing-brace
language: c
severity: warning
message: >-
  Label is followed by the closing brace with no statement; before C23 this is
  a compile error. Add an empty statement.
note: >-
  Matches syntactically a case/default label whose text ends at the colon; it
  does not check the C standard version in use.
rule:
  kind: case_statement
  regex: ':\s*$'
