id: c-bitwise-or-unparenthesized-in-and-condition
language: c
severity: warning
message: >-
  Bitwise | has an unparenthesized & operand; precedence may group the flag
  test unexpectedly.
note: >-
  Matches only the literal syntax of an unparenthesized & as the left operand
  of |; it does not check whether it is in an if/while condition or the
  intended meaning.
rule:
  pattern: '$A & $B | $C'
