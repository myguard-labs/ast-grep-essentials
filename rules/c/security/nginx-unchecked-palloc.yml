# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: nginx-unchecked-palloc
language: c
severity: info
message: >-
  Pool allocation without a NULL check in the next statement.
  ngx_palloc/ngx_pnalloc/ngx_pcalloc return NULL on failure, so using the
  result without a check like `if (p == NULL) return NGX_ERROR;` can
  dereference NULL when memory is low.
note: >-
  Candidate only. A call is skipped when its result (a plain call or one
  behind a cast) is assigned to an lvalue or initialises a declaration and the
  next sibling statement is an `if` (or, for a run of consecutive plain
  allocation statements, the first other statement after the run is an `if`)
  whose condition contains `!p`,
  `p == NULL` or `NULL == p` for that same lvalue (also as one operand of `||`
  or `&&`, through parentheses only; a comparison nested under a call,
  `sizeof`, `!(...)`, a comma or any other operator does not count). A call inside an `if` condition is skipped when it is assigned
  within `(p = ngx_palloc(...)) == NULL`, `NULL == (p = ...)` or
  `!(p = ...)`. Not recognised, so these are still reported: a check that is
  not the immediately following statement (another non-allocation statement
  or a comment between, or a check in a later or unrelated block), `p != NULL` or a bare
  truthiness test as the guard, a chained `a = p = ngx_palloc(...)`, the call
  passed to another function or returned, and a goto/return label guard
  placed away from the allocation. The rule does not prove that the guard
  returns or that the pointer is unused on the failure path.
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        regex: '^(ngx_palloc|ngx_pnalloc|ngx_pcalloc)$'
    - not:
        any:
          - inside:
              stopBy:
                not:
                  kind: cast_expression
              kind: assignment_expression
              field: right
              all:
                - has:
                    field: left
                    pattern: '$L'
                - inside:
                    kind: expression_statement
                    all:
                      - not:
                          precedes:
                            stopBy:
                              kind: if_statement
                            all:
                              - any:
                                  - kind: expression_statement
                                  - kind: declaration
                              - has:
                                  stopBy: end
                                  kind: call_expression
                                  has:
                                    field: function
                                    regex: '^(ngx_palloc|ngx_pnalloc|ngx_pcalloc)$'
                              - has:
                                  stopBy: end
                                  pattern: '$L'
                      - precedes:
                          stopBy:
                            not:
                              any:
                                - kind: expression_statement
                                  has:
                                    kind: assignment_expression
                                    has:
                                      field: right
                                      any:
                                        - kind: call_expression
                                          has:
                                            field: function
                                            regex: '^(ngx_palloc|ngx_pnalloc|ngx_pcalloc)$'
                                        - kind: cast_expression
                                          has:
                                            field: value
                                            kind: call_expression
                                            has:
                                              field: function
                                              regex: '^(ngx_palloc|ngx_pnalloc|ngx_pcalloc)$'
                                - kind: declaration
                                  has:
                                    kind: init_declarator
                                    has:
                                      field: value
                                      any:
                                        - kind: call_expression
                                          has:
                                            field: function
                                            regex: '^(ngx_palloc|ngx_pnalloc|ngx_pcalloc)$'
                                        - kind: cast_expression
                                          has:
                                            field: value
                                            kind: call_expression
                                            has:
                                              field: function
                                              regex: '^(ngx_palloc|ngx_pnalloc|ngx_pcalloc)$'
                          kind: if_statement
                          has:
                            field: condition
                            stopBy: end
                            all:
                              - any:
                                  - pattern: '$L == NULL'
                                  - pattern: 'NULL == $L'
                                  - pattern: '!$L'
                              - inside:
                                  stopBy:
                                    not:
                                      any:
                                        - kind: parenthesized_expression
                                        - kind: binary_expression
                                          has:
                                            field: operator
                                            regex: '^(\|\||&&)$'
                                  kind: if_statement
                                  field: condition
          - inside:
              stopBy:
                not:
                  kind: cast_expression
              kind: init_declarator
              field: value
              all:
                - has:
                    field: declarator
                    stopBy: end
                    kind: identifier
                    pattern: '$L'
                - inside:
                    kind: declaration
                    all:
                      - not:
                          precedes:
                            stopBy:
                              kind: if_statement
                            all:
                              - any:
                                  - kind: expression_statement
                                  - kind: declaration
                              - has:
                                  stopBy: end
                                  kind: call_expression
                                  has:
                                    field: function
                                    regex: '^(ngx_palloc|ngx_pnalloc|ngx_pcalloc)$'
                              - has:
                                  stopBy: end
                                  pattern: '$L'
                      - precedes:
                          stopBy:
                            not:
                              any:
                                - kind: expression_statement
                                  has:
                                    kind: assignment_expression
                                    has:
                                      field: right
                                      any:
                                        - kind: call_expression
                                          has:
                                            field: function
                                            regex: '^(ngx_palloc|ngx_pnalloc|ngx_pcalloc)$'
                                        - kind: cast_expression
                                          has:
                                            field: value
                                            kind: call_expression
                                            has:
                                              field: function
                                              regex: '^(ngx_palloc|ngx_pnalloc|ngx_pcalloc)$'
                                - kind: declaration
                                  has:
                                    kind: init_declarator
                                    has:
                                      field: value
                                      any:
                                        - kind: call_expression
                                          has:
                                            field: function
                                            regex: '^(ngx_palloc|ngx_pnalloc|ngx_pcalloc)$'
                                        - kind: cast_expression
                                          has:
                                            field: value
                                            kind: call_expression
                                            has:
                                              field: function
                                              regex: '^(ngx_palloc|ngx_pnalloc|ngx_pcalloc)$'
                          kind: if_statement
                          has:
                            field: condition
                            stopBy: end
                            all:
                              - any:
                                  - pattern: '$L == NULL'
                                  - pattern: 'NULL == $L'
                                  - pattern: '!$L'
                              - inside:
                                  stopBy:
                                    not:
                                      any:
                                        - kind: parenthesized_expression
                                        - kind: binary_expression
                                          has:
                                            field: operator
                                            regex: '^(\|\||&&)$'
                                  kind: if_statement
                                  field: condition
          - inside:
              stopBy:
                not:
                  kind: cast_expression
              kind: assignment_expression
              field: right
              inside:
                kind: parenthesized_expression
                inside:
                  any:
                    - pattern: '$_ == NULL'
                    - pattern: 'NULL == $_'
                    - pattern: '!$_'
                  inside:
                    stopBy:
                      not:
                        any:
                          - kind: parenthesized_expression
                          - kind: binary_expression
                            has:
                              field: operator
                              regex: '^(\|\||&&)$'
                    kind: if_statement
                    field: condition
