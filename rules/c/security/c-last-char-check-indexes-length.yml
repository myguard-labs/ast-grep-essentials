# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-last-char-check-indexes-length
language: c
severity: warning
message: >-
  Subscript uses the length itself after a len > 0 check; this reads one past
  the last character. Consider buf[len - 1].
note: >-
  Syntactic only; matches the literal shape `len > 0 && buf[len] != x` and
  does not cover `==` or verify buffer size semantics.
rule:
  pattern: '$LEN > 0 && $BUF[$LEN] != $X'
