# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-pqcancel-result-tested-negative
language: c
severity: warning
message: >-
  PQcancel returns 1 on success and 0 on failure, so testing the result with
  `< 0` never detects failure.
note: >-
  Matches a sibling declaration from PQcancel followed by an if testing the
  same variable with `< 0`. It does not track reassignment or other dataflow.
rule:
  all:
    - pattern: 'if ($RC < 0) $BODY'
    - follows:
        stopBy: end
        pattern: 'int $RC = PQcancel($$$ARGS);'
