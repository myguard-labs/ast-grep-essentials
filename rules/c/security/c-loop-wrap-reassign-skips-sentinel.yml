id: c-loop-wrap-reassign-skips-sentinel
language: c
severity: warning
message: >-
  Loop variable is reassigned in an if-block that falls through to a
  dereference without re-testing the sentinel condition.
note: >-
  Syntactic only; does not verify aliasing, that the assigned value can equal
  the sentinel, or control flow beyond the absence of a continue in the
  if-block.
rule:
  pattern: 'while ($V != $S) $B'
  has:
    stopBy: end
    kind: if_statement
    all:
      - has:
          stopBy: end
          pattern: '$V = $X'
      - not:
          has:
            stopBy: end
            kind: continue_statement
      - precedes:
          stopBy: end
          has:
            stopBy: end
            pattern: '$V->$F'
