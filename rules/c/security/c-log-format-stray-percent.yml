# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-log-format-stray-percent
language: c
severity: warning
message: >-
  Format string passed to ngx_log_error contains a percent sign without a
  valid conversion specifier.
note: >-
  Lexical check on the literal only. It treats a percent followed by a
  non-alphanumeric character other than flag characters as stray. It does not
  validate specifier names or resolve macros.
rule:
  all:
    - kind: string_literal
    - nthChild: 4
    - regex: '^"(?:[^%]|%%)*%[^-+0-9.*a-zA-Z%#]'
    - inside:
        kind: argument_list
        inside:
          kind: call_expression
          has:
            field: function
            regex: '^ngx_log_error$'
