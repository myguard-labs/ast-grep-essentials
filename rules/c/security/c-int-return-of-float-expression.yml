id: c-int-return-of-float-expression
language: c
severity: warning
message: >-
  Return statement in an int-returning function contains a decimal
  floating-point literal; the fractional part will be truncated.
note: >-
  Syntactic approximation only. Matches a return inside a function whose
  declared return type is literally int and whose return expression contains a
  decimal float literal. Does not resolve types, macros, or whether the
  truncation is intended.
rule:
  all:
    - kind: return_statement
    - inside:
        kind: function_definition
        has:
          field: type
          regex: '^int$'
        stopBy: end
    - has:
        kind: number_literal
        regex: '[0-9]\.[0-9]*|\.[0-9]+'
        stopBy: end
