# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-int-return-of-float-expression
language: c
severity: warning
message: >-
  Return statement in an int-returning function contains a decimal
  floating-point literal; the fractional part will be truncated.
note: >-
  Syntactic approximation only. Matches a return inside a function whose
  declared return type is literally int and whose return expression contains a
  decimal float literal. Does not resolve types, macros, or whether the
  truncation is intended.
rule:
  all:
    - kind: return_statement
    - inside:
        kind: function_definition
        has:
          field: type
          regex: '^int$'
        stopBy: end
    - has:
        kind: number_literal
        regex: '[0-9]\.[0-9]*|\.[0-9]+'
        stopBy: end
    - not:
        has:
          kind: cast_expression
          has:
            field: type
            regex: '^(unsigned |signed )?(int|long|short|char|long long)$|^u?int(8|16|32|64)_t$|^size_t$|^ssize_t$'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-681'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/681.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'FN: `unsigned int f()` and exponent literals (`1e3`) are not matched.'
    - 'FP: a comparison `return a > 0.5;` is reported; pointer-returning functions with `int *` type are also matched.'
