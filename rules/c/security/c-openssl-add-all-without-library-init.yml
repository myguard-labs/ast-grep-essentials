# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-openssl-add-all-without-library-init
language: c
severity: warning
message: >-
  OpenSSL_add_all_ciphers/digests is called in a function that never calls
  SSL_library_init.
note: >-
  Syntactic check within one function body only; does not detect
  initialization performed in other functions or files.
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        kind: identifier
        regex: '^OpenSSL_add_all_(ciphers|digests)$'
    - inside:
        kind: function_definition
        stopBy: end
        not:
          has:
            stopBy: end
            kind: call_expression
            has:
              field: function
              kind: identifier
              regex: '^SSL_library_init$'
