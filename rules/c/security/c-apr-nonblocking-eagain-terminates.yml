# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-apr-nonblocking-eagain-terminates
language: c
severity: warning
message: >-
  ap_get_brigade result is checked only for APR_SUCCESS, so APR_EAGAIN from a
  non-blocking read is treated as a fatal error.
note: >-
  Matches only the adjacent statement sequence in the shown syntax. It does
  not follow rv through other statements, aliases, or control flow.
rule:
  pattern: 'if (rv != APR_SUCCESS) { return rv; }'
  follows:
    pattern: 'rv = ap_get_brigade($$$ARGS);'
