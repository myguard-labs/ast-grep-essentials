id: c-preproc-conditional-inside-call
language: c
severity: warning
message: Preprocessor conditional directive inside a function call argument list.
note: >-
  Textual check within a function definition; it does not resolve macros or
  confirm the parenthesis is a real call.
rule:
  kind: function_definition
  regex: '\([^;{}()]*\n[ \t]*#[ \t]*(if|ifdef|ifndef)\b'
