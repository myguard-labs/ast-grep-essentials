# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-attribute-macro-trailing-semicolon
language: c
severity: warning
message: >-
  This macro's replacement list ends in an attribute followed by a semicolon,
  which can break use sites inside declarations and expressions.
note: >-
  Matches the literal preprocessor define shape syntactically; it does not
  expand macros or check how the macro is used at call sites.
rule:
  kind: preproc_def
  regex: '^#define\s+\w+\s+__attribute__\(\(.*\)\);\s*$'
