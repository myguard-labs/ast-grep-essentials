id: c-host-name-max-buffer-no-nul
language: c
severity: warning
message: >-
  Buffer sized exactly HOST_NAME_MAX is used as the gethostname destination;
  it has no room for the terminating NUL.
note: >-
  Matches a local array declared with the literal size HOST_NAME_MAX whose
  declaration is followed by an if-statement calling gethostname on the same
  identifier. It does not verify same-function usage, buffer aliasing, or
  runtime hostname length.
rule:
  pattern: 'char $BUF[HOST_NAME_MAX];'
