# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-pqexec-null-check-without-status
language: c
severity: warning
message: 'PQexec result is checked only against NULL; also check PQresultStatus.'
note: >-
  Syntactic only; matches an if whose entire condition is the NULL comparison,
  and cannot see a PQresultStatus check elsewhere in the function.
rule:
  kind: if_statement
  has:
    field: condition
    kind: parenthesized_expression
    has:
      pattern: '($R = PQexec($$$A)) == NULL'
