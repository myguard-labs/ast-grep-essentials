# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-pqexec-null-check-without-status
language: c
severity: warning
message: 'PQexec result is checked only against NULL; also check PQresultStatus.'
note: >-
  Syntactic only; matches an if whose entire condition is the NULL comparison,
  and cannot see a PQresultStatus check elsewhere in the function.
rule:
  kind: if_statement
  has:
    field: condition
    kind: parenthesized_expression
    has:
      pattern: '($R = PQexec($$$A)) == NULL'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-252'
  owasp: 'A10:2025'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/252.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'a NULL check followed by a separate ''if (PQresultStatus(res) != PGRES_TUPLES_OK)'' statement is reported because the status check sits outside the matched if'
  todo_cases:
    - "PGresult *res; if (NULL == (res = PQexec(conn, q))) return NULL; n = PQntuples(res);"
    - "PGresult *res; if (!(res = PQexec(conn, q))) return NULL; n = PQntuples(res);"
    - "PGresult *res; if ((res = PQexec(conn, q)) == 0) return NULL; n = PQntuples(res);"
    - "PGresult *res; if ((res = PQexecParams(conn, q, 0, NULL, NULL, NULL, NULL, 0)) == NULL) return NULL; n = PQntuples(res);"
    - "PGresult *res; if ((res = PQexecPrepared(conn, nm, 0, NULL, NULL, NULL, 0)) == NULL) return NULL; n = PQntuples(res);"
    - "PGresult *res; res = PQexec(conn, q); if (res == NULL) return NULL; n = PQntuples(res);"
