id: c-fnptr-empty-parens-unprototyped
language: c
severity: warning
message: >-
  Function pointer declarator uses empty parentheses, leaving its parameter
  list unprototyped; write (void) instead.
note: >-
  Syntactic match only. It flags a parenthesized pointer declarator followed
  by an empty parameter list; it does not verify types, aliasing, or how the
  pointer is used.
rule:
  pattern: 'typedef $RET (*$NAME)();'
