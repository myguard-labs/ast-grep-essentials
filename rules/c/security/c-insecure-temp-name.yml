id: c-insecure-temp-name
language: c
severity: warning
message: >-
  Temporary-name API call (mktemp/tmpnam/tmpnam_r/tempnam). Review use of a
  separately generated pathname; prefer atomic creation with mkstemp/mkostemp
  or tmpfile.
note: >-
  Matches listed API identifiers used as callees, including parentheses with
  whitespace. This is a single-file syntactic inventory; it does not resolve
  symbols, wrappers, function-pointer aliases, or subsequent file creation.
  Comments within callee parentheses are not covered.
rule:
  kind: call_expression
  has:
    field: function
    regex: '^\s*(\(\s*)*(mktemp|tmpnam|tmpnam_r|tempnam)(\s*\))*\s*$'
