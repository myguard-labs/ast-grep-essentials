id: c-null-check-wrong-variable-after-call
language: c
severity: warning
message: >-
  NULL check tests a call argument instead of the variable just assigned from
  that call.
note: >-
  Purely syntactic check of the statement directly before the if; it does not
  prove the argument cannot be NULL or that the assigned result is checked
  elsewhere, and it ignores aliasing and macros.
rule:
  all:
    - kind: if_statement
    - has:
        field: condition
        has:
          pattern: '$A == NULL'
    - follows:
        all:
          - pattern: '$X = $F($$$ARGS);'
          - has:
              stopBy: end
              kind: argument_list
              has:
                pattern: '$A'
          - not:
              pattern: '$A = $RHS;'
