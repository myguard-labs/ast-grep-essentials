# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-utf8-four-byte-lead-mask
language: c
severity: warning
message: >-
  This UTF-8 lead-byte test masks with 0xF1, leaving bits 1-3 unchecked; use
  mask 0xF8 instead.
note: >-
  Single-file syntactic match on a literal binary expression comparing a
  bitwise-and with mask 0xF1 against 0xF0. It does not resolve types, values,
  or whether the byte is actually used as a UTF-8 lead byte.
rule:
  pattern: '($X & 0xF1) == 0xF0'
