# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-emalloc-exact-size-then-write-at-size
language: c
severity: warning
message: >-
  Buffer allocated with emalloc(N) is written at index N, one byte past the
  allocation.
note: >-
  Syntactic match on identical size and index text in sibling statements. It
  does not track reassignment, control flow, or aliasing.
rule:
  pattern: '$S[$N] = $V;'
  follows:
    stopBy: end
    pattern: '$T *$S = emalloc($N);'
