# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-emalloc-exact-size-then-write-at-size
language: c
severity: warning
message: >-
  Buffer allocated with emalloc(N) is written at index N, one byte past the
  allocation.
note: >-
  Syntactic match on identical size and index text in sibling statements. A
  later assignment to, or -= / -- of, the size expression between the
  allocation and the write suppresses the match, even a growing one such as
  n = n + 1. It does not track other control flow or aliasing.
rule:
  all:
    - pattern: '$S[$N] = $V;'
    - follows:
        stopBy: end
        pattern: '$T *$S = emalloc($N);'
    - not:
        follows:
          stopBy: end
          all:
            - any:
                - pattern: '$N = $_;'
                - pattern: '$N -= $_;'
                - pattern: '$N--;'
                - pattern: '--$N;'
            - follows:
                stopBy: end
                pattern: '$T *$S = emalloc($N);'
