id: c-type-pun-address-of-cast-deref
language: c
severity: warning
message: >-
  Dereference of a cast address-of expression (*(T *)(&x)) may be a
  type-punned access.
note: >-
  Matches the literal syntax of a dereferenced cast applied to a direct
  address-of expression. It does not resolve types, aliasing, or whether the
  access is intentional punning.
rule:
  pattern: '*($T *)(&$X)'
