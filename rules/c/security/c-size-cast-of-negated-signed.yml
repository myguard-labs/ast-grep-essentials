id: c-size-cast-of-negated-signed
language: c
severity: warning
message: >-
  Casting a negated plain identifier to an unsigned type; negating the
  most-negative signed value is undefined behavior, so review the operand.
note: >-
  Syntactic match only on a cast whose operand is a parenthesized unary
  negation of a plain identifier. Does not check the identifier's type, value
  range, or whether it can be the most-negative value.
rule:
  pattern: '(size_t)(-$ID)'
