id: c-bounds-guard-without-else-table-index
language: c
severity: warning
message: >-
  Index-guarded table dispatch has no else branch reporting the out-of-range
  case.
note: >-
  Syntactic single-file check only. It matches an if statement without an else
  whose body calls an identifier subscript at a guarded index; it does not
  resolve table types, prove the guard covers the index, or check what happens
  after the call.
rule:
  kind: if_statement
  all:
    - has:
        kind: call_expression
        pattern: '$TABLE[$IDX]($$$ARGS)'
        stopBy: end
    - not:
        has:
          kind: else_clause
          stopBy: end
