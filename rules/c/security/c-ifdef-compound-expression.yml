id: c-ifdef-compound-expression
language: c
severity: warning
message: >-
  #ifdef/#ifndef takes a single macro name; trailing operators or defined()
  are ignored. Use #if instead.
note: >-
  Textual line match on the translation unit text. It does not check macro
  definitions or preprocessor semantics, and it may match a directive-looking
  line inside a comment or string.
rule:
  kind: translation_unit
  regex: '(?m)^[ \t]*#[ \t]*ifn?def[ \t]+\w+[ \t]*(\|\||&&|defined\b|[(!=<>+*-])'
