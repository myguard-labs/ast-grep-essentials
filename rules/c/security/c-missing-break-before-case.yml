id: c-missing-break-before-case
language: c
severity: warning
message: >-
  Case body ends with an expression statement and falls through into the next
  case or default label.
note: >-
  Syntactic check only; intentional fallthrough and other terminating
  statements (nested ifs, loops) are not analyzed.
rule:
  kind: case_statement
  all:
    - has:
        kind: expression_statement
        nthChild:
          position: 1
          reverse: true
    - precedes:
        kind: case_statement
