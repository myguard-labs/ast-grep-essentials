# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-mixed-unsigned-cast-bounds-check
language: c
severity: warning
message: >-
  Sum of unsigned long casts is compared against a cast to a different
  unsigned type; review the bounds check.
note: >-
  Matches literal cast syntax only; it does not resolve types, widths, or
  whether the mismatch is actually unsafe.
rule:
  all:
    - pattern: '((unsigned long) $A + (unsigned long) $B) > ($U) $C'
    - not:
        pattern: '((unsigned long) $A + (unsigned long) $B) > (unsigned long) $C'
