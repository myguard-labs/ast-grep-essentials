id: c-null-check-store-outside-guard
language: c
severity: warning
message: >-
  Field store through a pointer that the immediately preceding if null-tested
  sits outside that if, so it runs when the pointer is NULL.
note: >-
  Syntactic only; matches the same pointer text in `P != NULL` in the previous
  sibling if, without checking else branches, early exits, or aliasing.
rule:
  all:
    - pattern: '$P->$F = $V;'
    - follows:
        stopBy:
          not:
            kind: comment
        kind: if_statement
        has:
          field: condition
          stopBy: end
          pattern: '$P != NULL'
        not:
          all:
            - not:
                has:
                  field: consequence
                  has:
                    stopBy: end
                    kind: assignment_expression
                    has:
                      field: left
                      pattern: '$P'
            - has:
                field: condition
                any:
                  - pattern: '($P != NULL)'
                  - pattern: '($P != NULL && $R)'
            - has:
                field: alternative
                kind: else_clause
                has:
                  any:
                    - kind: return_statement
                    - kind: goto_statement
                    - kind: break_statement
                    - kind: continue_statement
                    - all:
                        - kind: compound_statement
                        - has:
                            any:
                              - kind: return_statement
                              - kind: goto_statement
                              - kind: break_statement
                              - kind: continue_statement
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
