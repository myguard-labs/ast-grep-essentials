id: c-null-check-store-outside-guard
language: c
severity: warning
message: >-
  Field store through a pointer that the immediately preceding if null-tested
  sits outside that if, so it runs when the pointer is NULL.
note: >-
  Syntactic only; matches the same pointer text in `P != NULL` in the previous
  sibling if, without checking else branches, early exits, or aliasing.
rule:
  all:
    - pattern: '$P->$F = $V;'
    - follows:
        kind: if_statement
        has:
          field: condition
          stopBy: end
          pattern: '$P != NULL'
