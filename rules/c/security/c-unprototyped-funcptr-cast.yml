# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-unprototyped-funcptr-cast
language: c
severity: warning
message: >-
  Function identifier cast to an unprototyped function pointer type; argument
  checking is disabled.
note: >-
  Syntactic match only on a cast whose target is a function pointer type with
  an empty parameter list. It does not resolve the cast operand's type or
  confirm that the cast hides a real signature mismatch.
rule:
  pattern: '(char *(*)())$X'
