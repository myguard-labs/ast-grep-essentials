id: c-preproc-bitwise-or-in-if
language: c
severity: warning
message: 'Bitwise | used in a #if condition; use logical || to combine feature macros.'
note: >-
  Syntactic only: flags a binary expression containing a lone | inside a #if
  or #elif directive. It does not expand macros or check whether their values
  are 0 or 1.
rule:
  kind: binary_expression
  regex: '[^|]\|[^|]'
  inside:
    regex: '^#[ \t]*(el)?if\b'
    stopBy: end
