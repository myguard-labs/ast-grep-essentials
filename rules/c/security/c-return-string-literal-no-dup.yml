# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-return-string-literal-no-dup
language: c
severity: warning
message: >-
  RETURN_STRING is called with a string literal and duplicate flag 0, so the
  engine may free read-only literal memory.
note: >-
  Syntactic match only on a literal first argument with duplicate flag 0; does
  not verify the macro definition, types, or runtime ownership.
rule:
  pattern: 'RETURN_STRING("$$$LIT", 0)'
