# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-unaligned-cast-deref-wide-int
language: c
severity: warning
message: >-
  Dereferencing a byte pointer cast to a wider integer pointer may perform an
  unaligned load.
note: >-
  Syntactic match only: flags a direct dereference of a cast to a uint32_t
  pointer. It does not resolve types, aliasing, or whether the address is
  actually aligned.
rule:
  pattern: '*(uint32_t *)($BUF)'
