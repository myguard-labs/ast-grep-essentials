id: c-void-ptr-member-implicit-cast
language: c
severity: warning
message: >-
  Member _private (void *) is assigned to a typed pointer without an explicit
  cast.
note: >-
  Syntactic match only. Matches a declarator initialized directly from a
  member access named _private with no cast; it does not verify the member's
  declared type or any type information.
rule:
  pattern:
    context: 'struct t *p = $OBJ->_private;'
    selector: init_declarator
