# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-double-le-zero-check-no-finite
language: c
severity: warning
message: >-
  Value is compared with <= 0.0 but the function never calls isfinite, so NaN
  and +inf can pass.
note: >-
  Syntactic only. It does not check that the compared operand is a double
  parameter, and it does not check that isfinite is applied to that same
  operand.
rule:
  kind: function_definition
  all:
    - has:
        stopBy: end
        pattern: '$X <= 0.0'
    - not:
        has:
          stopBy: end
          kind: call_expression
          has:
            field: function
            kind: identifier
            regex: '^isfinite$'
