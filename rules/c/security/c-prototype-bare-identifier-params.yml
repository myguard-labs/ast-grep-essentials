id: c-prototype-bare-identifier-params
language: c
severity: warning
message: Prototype parameter is a bare identifier with no type specifier.
note: >-
  Syntactic only; a lone typedef name parameter such as size_t in a valid
  prototype looks the same and is not resolved.
rule:
  kind: parameter_declaration
  has:
    field: type
    kind: type_identifier
  not:
    has:
      field: declarator
      regex: '.'
  inside:
    kind: parameter_list
    inside:
      kind: function_declarator
      inside:
        kind: declaration
