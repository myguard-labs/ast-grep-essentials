# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-fcc-called-scope-copies-calling-scope
language: c
severity: warning
message: >-
  This assigns called_scope from the same expression used for calling_scope,
  which may break late static binding.
note: >-
  Matches only the literal receiver syntax fcc.called_scope assigned from the
  identifier obj_ce; it does not resolve types, aliases, or runtime class
  values, and does not check that both assignments occur in the same function.
rule:
  pattern: 'fcc.called_scope = obj_ce;'
