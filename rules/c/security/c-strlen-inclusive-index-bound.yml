id: c-strlen-inclusive-index-bound
language: c
severity: warning
message: >-
  This if condition uses an inclusive bound (<=) before indexing the buffer,
  so an index equal to the length reads one past the end.
note: >-
  Purely syntactic match on an if whose condition is IDX <= LEN with a
  subscript read of BUF[IDX] in the consequence. It does not resolve types,
  aliasing, or whether LEN is the real buffer length, and does not check
  reachability or guards outside the shown syntax.
rule:
  all:
    - pattern: 'if ($IDX <= $LEN) { $$$BODY }'
    - has:
        pattern: '$BUF[$IDX]'
        stopBy: end
