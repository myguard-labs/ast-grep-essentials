# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-cpp-reference-param-in-c
language: c
severity: warning
message: 'C++ reference parameter syntax (&) used in a C parameter list.'
note: >-
  Textual match on a type followed by & and a name inside a parameter list;
  does not check whether the code is conditionally compiled or C++-only.
rule:
  kind: parameter_list
  regex: '[A-Za-z_][\w\s\*]*&\s*[A-Za-z_]\w*\s*[,)\[]'
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
