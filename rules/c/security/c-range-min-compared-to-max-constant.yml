# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-range-min-compared-to-max-constant
language: c
severity: warning
message: >-
  A field named min is compared against ZEND_LONG_MAX. Check for a copy-paste
  field swap.
note: >-
  Purely syntactic match on the literal field name min and the constant
  ZEND_LONG_MAX in an equality test. It does not resolve types, struct
  definitions, or runtime values, so it cannot confirm that the field is a
  range bound.
rule:
  pattern: '$X.min == ZEND_LONG_MAX'
