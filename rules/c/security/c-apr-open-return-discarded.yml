id: c-apr-open-return-discarded
language: c
severity: warning
message: >-
  The status returned by ap_open is discarded; compare it with APR_SUCCESS
  instead of testing the handle.
note: >-
  Matches a bare ap_open call statement syntactically; does not check whether
  the handle is later tested or resolve aliases.
rule:
  pattern: 'ap_open($$$ARGS);'
