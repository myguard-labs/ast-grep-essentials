id: c-prototype-empty-parens
language: c
severity: warning
message: >-
  Function prototype uses an empty parameter list; declare it as (void) when
  it takes no arguments.
note: >-
  Syntactic match on a function declarator with an empty parameter list. It
  does not verify that the function is a prototype in every context or that it
  takes no arguments; types and definitions are not resolved.
rule:
  pattern: '$RET $NAME();'
