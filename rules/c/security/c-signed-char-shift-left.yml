# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-signed-char-shift-left
language: c
severity: warning
message: >-
  Left shift of a subscripted plain char pointer may sign-extend before the
  shift.
note: >-
  Syntactic match only. Matches a left shift whose left operand is a subscript
  of a direct (char *) cast; it does not verify the pointer's signedness,
  aliasing, or actual byte values at runtime.
rule:
  pattern: '((char *)$P)[$I] << $N'
