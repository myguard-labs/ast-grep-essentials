  cwe: 'CWE-194'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/194.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'not flagged: int f(void *p) { return ((const char *)p)[0] << 24; }'
