id: c-backward-scan-unbounded-deref
language: c
severity: warning
message: >-
  Backward scan loop dereferences and decrements a pointer without a
  lower-bound comparison in the loop condition.
note: >-
  Syntactic only; it does not check bounds enforced elsewhere, aliasing, or
  types. Any < or > in the condition suppresses the match.
rule:
  all:
    - kind: while_statement
    - has:
        field: condition
        has:
          stopBy: end
          pattern: '*$P'
    - has:
        field: body
        pattern: '$P--;'
    - not:
        has:
          field: condition
          regex: '[<>]'
