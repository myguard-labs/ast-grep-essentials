# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-backward-scan-unbounded-deref
language: c
severity: warning
message: >-
  Backward scan loop dereferences and decrements a pointer without a
  lower-bound comparison in the loop condition.
note: >-
  Syntactic only; it does not check bounds enforced elsewhere, aliasing, or
  types. Any < or > in the condition suppresses the match.
rule:
  all:
    - kind: while_statement
    - has:
        field: condition
        has:
          stopBy: end
          pattern: '*$P'
    - has:
        field: body
        pattern: '$P--;'
    - not:
        has:
          field: condition
          regex: '[<>]'
metadata:
  todo_cases:
    - "a brace-wrapped body { end--; } is not flagged (body pattern is a bare statement)"
    - "a -> in the condition (cfg->strict) matches the [<>] lower-bound regex and suppresses the match"
