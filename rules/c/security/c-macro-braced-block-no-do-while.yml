id: c-macro-braced-block-no-do-while
language: c
severity: warning
message: >-
  Function-like macro body is a bare brace block; wrap it in do { ... } while
  (0).
note: >-
  Matches the macro body text syntactically (starts with a brace and contains
  a semicolon); it does not analyze usage sites.
rule:
  kind: preproc_function_def
  has:
    kind: preproc_arg
    regex: '(?s)^\s*\{.*;.*\}\s*$'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
