# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-hash-find-out-param-pointer-level
language: c
severity: warning
message: >-
  Address of a single-pointer variable is passed as (void **) out-parameter to
  zend_hash_find; the callee writes a zval** into it.
note: >-
  Syntactic only; matches a preceding sibling declaration with one pointer
  level and the same name, without resolving scopes, shadowing, or types.
rule:
  all:
    - pattern: 'zend_hash_find($$$A, (void **) &$V);'
    - follows:
        stopBy: end
        pattern: '$T *$V;'
