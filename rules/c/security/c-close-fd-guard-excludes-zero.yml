id: c-close-fd-guard-excludes-zero
language: c
severity: warning
message: >-
  This close() call sits under a strict "> 0" guard, so a descriptor value of
  0 is never closed.
note: >-
  Syntactic only. Matches an if-statement whose condition is a literal "> 0"
  comparison around a close() call on the same identifier. It does not resolve
  whether the variable holds a file descriptor, its type, aliasing, or
  reachability.
rule:
  pattern: |
    if ($FD > 0) {
      close($FD);
    }
