id: c-subscript-write-at-declared-size
language: c
severity: warning
message: >-
  Constant subscript assignment writes at the declared element count of the
  array, one past the end.
note: >-
  Syntactic single-file check only. It matches a literal array name and
  literal index written as an assignment target; it does not verify the
  declaration size, scope, aliasing, or whether the index is reachable at
  runtime.
rule:
  pattern: '$BUF[8] = $VAL'
