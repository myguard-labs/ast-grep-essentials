# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-alloc-before-length-guard-leak
language: c
severity: warning
message: >-
  Buffer allocated with emalloc before a later early-return guard; the early
  return may leak it.
note: >-
  Syntactic only; does not verify that the guard checks the same length
  variable or that no free occurs before the return.
rule:
  pattern: '$T *$P = emalloc($$$A);'
  precedes:
    stopBy: end
    kind: if_statement
    has:
      stopBy: end
      kind: return_statement
