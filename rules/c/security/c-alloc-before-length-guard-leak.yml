# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-alloc-before-length-guard-leak
language: c
severity: warning
message: >-
  Buffer allocated with emalloc before a later early-return guard; the early
  return may leak it.
note: >-
  Syntactic only; does not verify that the guard checks the same length
  variable or that no free occurs before the return.
rule:
  pattern: '$T *$P = emalloc($$$A);'
  precedes:
    stopBy: end
    kind: if_statement
    has:
      stopBy: end
      kind: return_statement
    not:
      has:
        field: consequence
        any:
          - pattern: 'efree($P);'
          - pattern: 'free($P);'
          - pattern: 'pefree($P, $$$F);'
          - kind: compound_statement
            has:
              any:
                - pattern: 'efree($P);'
                - pattern: 'free($P);'
                - pattern: 'pefree($P, $$$F);'
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
  created_at: '2026-10-19'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-401'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/401.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "false negative: a direct efree in the guard suppresses the finding even when an earlier return in the same guard skips it (if (bad) { if (abort) return -1; efree(b); return 0; })."
