id: c-hash-of-foreach-value-without-deref
language: c
severity: warning
message: >-
  HASH_OF() is used in a block that has no ZVAL_DEREF() call. A hash value
  wrapped in a reference would be missed.
note: >-
  Purely syntactic. Matches a HASH_OF call expression when none of its
  enclosing compound statements contains a ZVAL_DEREF call. It does not check
  that both calls use the same variable, that ZVAL_DEREF comes before HASH_OF,
  that the argument is the foreach loop value, or the zval's runtime type.
rule:
  all:
    - kind: call_expression
    - has:
        kind: identifier
        regex: '^HASH_OF$'
    - not:
        inside:
          stopBy: end
          kind: compound_statement
          has:
            stopBy: end
            kind: call_expression
            has:
              kind: identifier
              regex: '^ZVAL_DEREF$'
