# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-c89-mixed-decl-after-stmt-block
language: c
severity: warning
message: >-
  Declaration appears after an executable statement in the same block, which
  C89 does not allow.
note: >-
  Syntactic only; it detects a declaration following an expression statement
  among direct block siblings, and does not know whether the project targets
  C89. Other statement kinds are not covered.
rule:
  kind: declaration
  inside:
    kind: compound_statement
    stopBy: neighbor
  follows:
    kind: expression_statement
    stopBy: end
