id: c-loop-deref-before-bound-check
language: c
severity: warning
message: >-
  Array subscript is read in a for-loop condition before the bound on the same
  index is checked.
note: >-
  Syntactic check only. It matches a for-loop condition whose && operands
  place a subscript comparison on the left of a bound comparison; it does not
  prove the array is actually out of bounds or resolve types or aliasing.
rule:
  kind: for_statement
  has:
    field: condition
    kind: binary_expression
    all:
      - pattern: '$A[$I] != ''\0'' && $B'
      - has:
          pattern: '$I < $N'
