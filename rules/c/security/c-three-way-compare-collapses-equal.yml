id: c-three-way-compare-collapses-equal
language: c
severity: warning
message: >-
  This ternary returns -1 for non-positive operands, so equal operands do not
  yield 0.
note: >-
  Syntactic match only on a two-arm ternary whose condition is a greater-than
  test and whose false arm is a literal -1. It does not verify operand types,
  runtime values, or that the function is used as a comparator.
rule:
  pattern: '$X > 0 ? 1 : -1'
