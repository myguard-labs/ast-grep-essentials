id: c-mask-narrower-than-shift
language: c
severity: warning
message: >-
  Right shift applied directly to a masked value; verify the shift amount
  against the mask width, since the result may always be zero.
note: >-
  Syntactic match only. Matches a right shift whose left operand is a
  parenthesized bitwise-and with a literal numeric mask, and a literal numeric
  shift amount. It does not compare the mask bit width with the shift amount
  or resolve types, so it cannot confirm the result is always zero.
rule:
  all:
    - pattern: '($X & $MASK) >> $N'
    - has:
        field: right
        kind: number_literal
        pattern: '$N'
    - has:
        field: left
        kind: parenthesized_expression
