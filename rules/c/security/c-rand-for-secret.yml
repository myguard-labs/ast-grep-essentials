id: c-rand-for-secret
language: c
severity: error
message: >-
  Output of a non-cryptographic pseudorandom generator stored into a variable
  whose name reads as key material. rand, random and ngx_random are linear
  generators seeded from the pid and the clock: an attacker who observes one
  output, or who merely knows roughly when the process started, reconstructs the
  whole sequence and therefore every token, nonce and key derived from it. Draw
  these bytes from the operating system: getrandom, RAND_bytes, or a read of
  /dev/urandom.
note: >-
  The gate is the name of the assignment target, so key material that flows
  through a neutrally named intermediate is missed entirely, and a jitter or
  backoff value that merely happens to carry one of these words is reported. The
  rule does not check whether the value ever reaches a security decision.
utils:
  weak-random-call:
    any:
      - kind: call_expression
        has: {field: function, regex: '^(rand|random|ngx_random|lrand48|mrand48|drand48)$'}
      - has:
          stopBy: end
          kind: call_expression
          has: {field: function, regex: '^(rand|random|ngx_random|lrand48|mrand48|drand48)$'}
rule:
  any:
    - kind: assignment_expression
      all:
        - has:
            field: left
            regex: '(?i)(secret|token|key|nonce|salt|iv|password|passwd|session|cookie|challenge)'
        - has:
            field: right
            matches: weak-random-call
    - kind: init_declarator
      all:
        - has:
            field: declarator
            regex: '(?i)(secret|token|key|nonce|salt|iv|password|passwd|session|cookie|challenge)'
        - has:
            field: value
            matches: weak-random-call
