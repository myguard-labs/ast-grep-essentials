id: c-deref-paren-post-increment
language: c
severity: warning
message: >-
  Post-incremented dereference on the source side of a copy advances the
  pointed-to value, not the source pointer; verify this is intended.
note: >-
  Purely syntactic match on an assignment whose right side is a parenthesized
  dereference of a post-incremented identifier and whose left side is a
  dereference of a post-incremented identifier. Does not resolve types,
  aliasing, or runtime values.
rule:
  pattern: '*$DST++ = (*$SRC)++'
