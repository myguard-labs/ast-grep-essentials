# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-zpp-failure-branch-no-return
language: c
severity: warning
message: >-
  This zend_parse_parameters FAILURE branch has no return, so execution
  continues with unparsed arguments.
note: >-
  Single-file syntactic check for an if-statement comparing a
  zend_parse_parameters call to FAILURE whose consequence block has no return
  statement. It does not verify control flow beyond the block, reachability,
  or whether later code actually reads the outputs.
rule:
  all:
    - pattern: |
        if (zend_parse_parameters($$$ARGS) == FAILURE) { $$$BODY }
    - not:
        has:
          kind: return_statement
          stopBy: end
    - not:
        has:
          field: consequence
          kind: compound_statement
          has:
            any:
              - kind: goto_statement
              - kind: expression_statement
                has:
                  kind: identifier
                  regex: ^(RETURN_(NULL|FALSE|TRUE|THROWS|BOOL|LONG|DOUBLE|STR|STRL|STRING|STRINGL|EMPTY_STRING|EMPTY_ARRAY|ARR|OBJ|RES|ZVAL|COPY|COPY_VALUE|COPY_DEREF|INTERNED_STR|NEW_STR|CHAR)|ZEND_WRONG_PARAM_COUNT)$
              - kind: expression_statement
                has:
                  kind: call_expression
                  has:
                    field: function
                    regex: ^(RETURN_(NULL|FALSE|TRUE|THROWS|BOOL|LONG|DOUBLE|STR|STRL|STRING|STRINGL|EMPTY_STRING|EMPTY_ARRAY|ARR|OBJ|RES|ZVAL|COPY|COPY_VALUE|COPY_DEREF|INTERNED_STR|NEW_STR|CHAR)|ZEND_WRONG_PARAM_COUNT)$
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-457'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/457.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'FP: terminating branches that are not a literal return or a direct `RETURN_*`/`ZEND_WRONG_PARAM_COUNT` statement or `goto` (`abort();`, `zend_error_noreturn(...)`) are reported'
    - 'FP: `if (zpp(...) == FAILURE) { warn(); } else { use(r, s); }` is reported although the use only runs on success'
    - 'FN: unbraced consequence (`if (zpp(...) == FAILURE) warn(); use(r, s);`) and reversed comparison (`FAILURE == zpp(...)`) are not matched'
    - 'FN: a goto whose label precedes the later use of the parsed outputs (`goto resume; } resume: use(r, s);`) is treated as an exit'
    - 'FN: a conditional return inside the branch (`{ if (x) { return; } }`) suppresses the report'
