id: c-zpp-failure-branch-no-return
language: c
severity: warning
message: >-
  This zend_parse_parameters FAILURE branch has no return, so execution
  continues with unparsed arguments.
note: >-
  Single-file syntactic check for an if-statement comparing a
  zend_parse_parameters call to FAILURE whose consequence block has no return
  statement. It does not verify control flow beyond the block, reachability,
  or whether later code actually reads the outputs.
rule:
  all:
    - pattern: |
        if (zend_parse_parameters($$$ARGS) == FAILURE) { $$$BODY }
    - not:
        has:
          kind: return_statement
          stopBy: end
