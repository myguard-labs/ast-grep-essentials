id: c-nonstatic-inline-definition
language: c
severity: warning
message: >-
  File-scope inline function definition without static storage class may cause
  link-time external linkage issues.
note: >-
  Syntactic single-file match only. It flags file-scope function definitions
  whose specifiers include inline and no static; it does not check whether the
  function is declared elsewhere, uses extern, or is defined in a header.
rule:
  kind: function_definition
  all:
    - has:
        kind: storage_class_specifier
        regex: '^inline$'
        stopBy: end
    - not:
        has:
          kind: storage_class_specifier
          regex: '^static$'
          stopBy: end
    - inside:
        kind: translation_unit
        stopBy: end
