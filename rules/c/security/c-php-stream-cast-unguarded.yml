# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-php-stream-cast-unguarded
language: c
severity: warning
message: php_stream_cast is called without an enclosing php_stream_can_cast check.
note: >-
  Syntactic only; looks for the identifier php_stream_cast not inside an if
  whose condition mentions php_stream_can_cast, without matching the same
  stream or target type.
rule:
  kind: identifier
  regex: '^php_stream_cast$'
  not:
    inside:
      stopBy: end
      kind: if_statement
      has:
        field: condition
        has:
          stopBy: end
          kind: identifier
          regex: '^php_stream_can_cast$'
