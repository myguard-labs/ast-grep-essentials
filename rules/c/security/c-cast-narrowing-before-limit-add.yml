id: c-cast-narrowing-before-limit-add
language: c
severity: warning
message: >-
  Compound addition whose right operand is an explicit cast to uint32_t may
  narrow the value before adding, so large values can wrap.
note: >-
  Single-file syntactic match on a literal compound assignment with a
  (uint32_t) cast on the right operand. It does not resolve types, width of
  the cast operand, or whether the sum can actually overflow.
rule:
  pattern: '$LHS += (uint32_t) $RHS'
