# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-raw-inline-keyword
language: c
severity: warning
message: >-
  Raw C99 inline keyword used as a function specifier; use the project's
  portable inline macro instead.
note: >-
  Syntactic match on a literal storage_class_specifier of type inline in a C
  function definition. It does not verify that the project defines a portable
  inline macro or that the file includes its header.
rule:
  kind: storage_class_specifier
  regex: '^inline$'
  inside:
    kind: function_definition
