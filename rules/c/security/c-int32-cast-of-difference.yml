id: c-int32-cast-of-difference
language: c
severity: warning
message: >-
  A subtraction is explicitly cast to a 32-bit signed type, which may truncate
  the difference.
note: >-
  Syntactic match only. Matches a cast to int32_t whose operand is a literal
  subtraction expression; it does not check operand types, unsignedness, or
  value ranges.
rule:
  pattern: '(int32_t) ($A - $B)'
