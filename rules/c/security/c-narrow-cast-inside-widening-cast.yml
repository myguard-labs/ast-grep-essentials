# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-narrow-cast-inside-widening-cast
language: c
severity: warning
message: >-
  A narrowing (int) cast is nested directly inside a widening (long) cast,
  which can drop high bits of a wider dereferenced value.
note: >-
  Purely syntactic single-file match on nested cast expressions whose
  innermost operand is a pointer dereference. It does not check value types,
  sizes, or whether truncation actually occurs at runtime.
rule:
  pattern: '(long) ((int) *$P)'
