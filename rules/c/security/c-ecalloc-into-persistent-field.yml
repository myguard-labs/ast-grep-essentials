id: c-ecalloc-into-persistent-field
language: c
severity: warning
message: >-
  Request-scoped ecalloc/emalloc result is assigned to a struct member; verify
  the allocation lifetime matches the struct's persistence.
note: >-
  Syntactic single-file match on a literal assignment of mnd_ecalloc or
  emalloc to a field access. It does not verify the persistence flag, types,
  aliasing, or runtime lifetime.
rule:
  pattern: '$LHS->$FIELD = mnd_ecalloc($$$ARGS)'
