# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-mixed-declaration-after-statement
language: c
severity: warning
message: >-
  Declaration appears after a statement in the same block; this is rejected by
  C89-mode compilers.
note: >-
  Syntactic only. Matches a declaration that has an earlier expression
  statement as a sibling in the same compound_statement. Does not check the
  project's C standard setting or nested blocks.
rule:
  kind: declaration
  follows:
    kind: expression_statement
    stopBy: end
  inside:
    kind: compound_statement
    stopBy: end
