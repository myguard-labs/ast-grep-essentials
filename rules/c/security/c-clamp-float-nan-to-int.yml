id: c-clamp-float-nan-to-int
language: c
severity: warning
message: >-
  Nested ternary clamp is cast to a type; a NaN passes both comparisons and
  reaches the cast.
note: >-
  Matches a cast containing a conditional whose alternative holds another
  conditional; it does not verify operand types, float literals, or that the
  cast target is an integer type.
rule:
  kind: cast_expression
  has:
    stopBy: end
    kind: conditional_expression
    has:
      field: alternative
      stopBy: end
      kind: conditional_expression
