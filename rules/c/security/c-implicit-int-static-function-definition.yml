id: c-implicit-int-static-function-definition
language: c
severity: warning
message: >-
  Function definition has storage-class specifiers but no return type, relying
  on implicit int.
note: >-
  Purely textual check on the translation unit; it matches storage-class
  keywords followed directly by a name and parameter list then a body. It does
  not detect macro-provided types or resolve typedefs.
rule:
  kind: translation_unit
  regex: >-
    (?m)^\s*(static|inline|extern)(\s+(static|inline|extern))*\s+[A-Za-z_][A-Za-z0-9_]*\s*\([^)]*\)\s*\{
