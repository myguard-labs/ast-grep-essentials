# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-trailing-char-scan-underflow
language: c
severity: warning
message: >-
  A while condition pre-decrements an index used to subscript a buffer, with
  no lower-bound test on that index in the same condition. If every byte
  matches, the scan can read before the start of the buffer.
note: >-
  Single-file syntactic check only. It cannot verify runtime values, whether
  the index is actually unsigned or nonzero on entry, or whether a bound is
  enforced elsewhere. A bound test counts only when it names the same index
  as the decrement (N > 0, N >= 1, N != 0 or a bare N) on the left of an &&
  that precedes the decrement, or when the enclosing while condition tests
  that index and the decrement sits in a braced loop body.
rule:
  kind: parenthesized_expression
  all:
    - has:
        pattern: '$BUF[--$N]'
        stopBy: end
    - inside:
        kind: while_statement
        stopBy: end
    - not:
        has:
          stopBy: end
          kind: binary_expression
          all:
            - has:
                field: operator
                regex: '^&&$'
            - has:
                field: left
                any:
                  - pattern: '$N'
                  - pattern: '$N > 0'
                  - pattern: '$N >= 1'
                  - pattern: '$N != 0'
                  - has:
                      stopBy: end
                      any:
                        - pattern: '$N > 0'
                        - pattern: '$N >= 1'
                        - pattern: '$N != 0'
            - has:
                field: right
                any:
                  - pattern: '$X[--$N]'
                  - has:
                      pattern: '$X[--$N]'
                      stopBy: end
    - not:
        inside:
          kind: compound_statement
          stopBy: end
          inside:
            kind: while_statement
            field: body
            has:
              field: condition
              any:
                - has:
                    pattern: '$N'
                - has:
                    stopBy: end
                    any:
                      - pattern: '$N > 0'
                      - pattern: '$N >= 1'
                      - pattern: '$N != 0'
metadata:
  rule_modified_at: '2026-10-10'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-10'
  created_at: '2026-10-10'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-127'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/127.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'a bare N in a longer && chain is not recognised, e.g. ''while (a && n && s[--n] == '' '')'' is reported; an unbraced loop body is not recognised as guarded, e.g. ''while (n > 0) if (s[--n] != '' '') break;'''
  todo_cases:
    - "int f(const char *s, size_t n, int a) { while (n > 0 || a) { if (s[--n] == ' ') break; } return 0; }"
    - "int f(const char *s, size_t n) { while (n > 0) { while (s[--n] == ' ') { } } return 0; }"
    - "int f(const char *s, size_t n) { while (n > 0 && s[--n] == ' ' && s[--n] == 'x') { } return 0; }"
    - "int f(const char *s, size_t n, int a) { while ((n > 0 || a) && s[--n] == ' ') { } return 0; }"
    - "int f(const char *s, size_t n) { while (!(n > 0) && s[--n] == ' ') { } return 0; }"
    - "int f(const char *s, size_t n) { while (--n > 0 && s[n] == ' ') { } return 0; }"
    - "int f(const char *s, size_t n) { do { } while (s[--n] == ' '); return 0; }"
    - "int f(const char *s, size_t n) { for (; s[--n] == ' ';) { } return 0; }"
