# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-trailing-char-scan-underflow
language: c
severity: warning
message: >-
  A while condition pre-decrements an index used to subscript a buffer, with
  no lower-bound test on that index in the same condition. If every byte
  matches, the scan can read before the start of the buffer.
note: >-
  Single-file syntactic check only. It cannot verify runtime values, whether
  the index is actually unsigned or nonzero on entry, or whether a bound is
  enforced elsewhere (in the loop body or an earlier check). Only a literal
  lower-bound test of the form N > 0 inside the same parenthesized condition
  is recognized; other forms such as N >= 1 or N != 0 are not, and a matching
  parenthesized expression in the loop body would also be reported.
rule:
  kind: parenthesized_expression
  has:
    pattern: '$BUF[--$N]'
    stopBy: end
  not:
    has:
      pattern: '$N > 0'
      stopBy: end
  inside:
    kind: while_statement
    stopBy: end
metadata:
  rule_modified_at: '2026-10-10'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-10'
  created_at: '2026-10-10'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-127'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/127.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'FP: recognised lower bounds only N > 0; safe forms while (n && s[--n] == '' ''), while (n >= 1 && s[--n] == '' '') and while (n != 0 && s[--n] == '' '') are reported'
    - 'FP: safe loop while (n > 0) { if (s[--n] != '' '') break; } is reported because the if condition in the body matches'
    - 'FN: any ''> 0'' test suppresses the report, even on another variable, e.g. while (i > 0 && s[--n] == '' '')'
    - 'FN: while (--n > 0 && s[n] == '' '') { } wraps a size_t n of 0 to SIZE_MAX before the bound test and then reads s[n]; it is not reported because the decrement sits in the bound test, not in the index'
    - 'FN: do { } while (s[--n] == '' ''); and for (; s[--n] == '' '';) are missed (rule requires a while_statement)'
