id: c-empty-parameter-list-not-void
language: c
severity: warning
message: >-
  Function declarator uses an empty parameter list `()`; write `(void)` so the
  prototype is explicit.
note: >-
  Syntactic match only. It flags a function declarator whose parameter list
  has no children, so it does not check types, call sites, or whether the
  declarator is a function pointer or other non-function form.
rule:
  kind: function_declarator
  has:
    field: parameters
    kind: parameter_list
    not:
      has:
        kind: parameter_declaration
