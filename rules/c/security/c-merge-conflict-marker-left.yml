# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-merge-conflict-marker-left
language: c
severity: warning
message: Git merge-conflict marker left in C source.
note: >-
  Matches ERROR nodes whose text begins with a conflict marker; it does not
  verify the file is a merge result or that the marker sits at a line start.
rule:
  all:
    - kind: ERROR
    - regex: '^(<<<<<<<|>>>>>>>|=======)'
