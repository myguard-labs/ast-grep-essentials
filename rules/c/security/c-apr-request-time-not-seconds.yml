id: c-apr-request-time-not-seconds
language: c
severity: warning
message: >-
  Returning a request_time (apr_time_t, microseconds) directly from a time_t
  function; wrap it in apr_time_sec().
note: >-
  Purely syntactic match on a return statement whose value is a literal
  ->request_time member access. It does not check the function return type,
  the member's declared type, or whether a conversion happens elsewhere; it
  may produce false positives on name-based matches.
rule:
  pattern: 'return $R->request_time;'
