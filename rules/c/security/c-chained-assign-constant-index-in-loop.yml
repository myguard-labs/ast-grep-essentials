id: c-chained-assign-constant-index-in-loop
language: c
severity: warning
message: >-
  Chained assignment inside a for loop stores to a constant index instead of
  the loop index.
note: >-
  Syntactic match only. Matches an assignment expression whose right-hand side
  is a chained assignment to a literal index 0 subscript, located inside a for
  statement; does not verify that the loop variable is the intended index or
  resolve array types.
rule:
  kind: assignment_expression
  pattern: '$A[$I] = $B[0] = $V'
  inside:
    kind: for_statement
    stopBy: end
