id: small-key-size-c
language: c
severity: warning
message: >-
  A cryptographic parameter or key-generation call specifies fewer than 2048
  bits.
note: >-
  Matches only direct calls to the listed identifiers whose second argument is
  an unsuffixed decimal integer literal below 2048. This single-file syntactic
  check does not resolve symbols or evaluate expressions.
rule:
  kind: call_expression
  all:
    - has:
        stopBy: neighbor
        kind: identifier
        nthChild: 1
        regex: >-
          ^(DH_generate_parameters_ex|DSA_generate_parameters_ex|EVP_PKEY_CTX_set_dh_paramgen_prime_len|EVP_PKEY_CTX_set_dsa_paramgen_bits|EVP_PKEY_CTX_set_rsa_keygen_bits|RSA_generate_key_ex|RSA_generate_key_fips)$
    - has:
        stopBy: neighbor
        kind: argument_list
        has:
          stopBy: neighbor
          kind: number_literal
          nthChild: 2
          regex: '^(0|[1-9][0-9]{0,2}|1[0-9]{3}|20[0-3][0-9]|204[0-7])$'
    - not:
        has:
          stopBy: end
          kind: ERROR
