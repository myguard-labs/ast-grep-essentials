id: c-comma-expression-as-call-argument
language: c
severity: warning
message: >-
  This call argument is a parenthesized comma expression; only the last value
  is passed.
note: >-
  Syntactic match only. It flags a parenthesized comma expression used
  directly as a sole or listed call argument and does not check types, macro
  expansion, or whether the sequence operator was intended.
rule:
  kind: call_expression
  has:
    kind: argument_list
    has:
      kind: parenthesized_expression
      has:
        kind: comma_expression
