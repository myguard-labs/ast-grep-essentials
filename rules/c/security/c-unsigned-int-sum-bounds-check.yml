id: c-unsigned-int-sum-bounds-check
language: c
severity: warning
message: >-
  Sum of two values cast to unsigned int is used in a comparison and may wrap
  before the bound check.
note: >-
  Syntactic match only. It checks a literal relational expression whose left
  operand adds two (unsigned int) casts; it does not resolve types, value
  ranges, or whether the wrap is reachable.
rule:
  pattern: '$A > $B'
  all:
    - has:
        pattern: '(unsigned int) $X'
        stopBy: end
    - has:
        pattern: '(unsigned int) $Y'
        stopBy: end
    - inside:
        kind: return_statement
        stopBy: end
