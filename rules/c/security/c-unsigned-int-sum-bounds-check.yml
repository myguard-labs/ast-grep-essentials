# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-unsigned-int-sum-bounds-check
language: c
severity: warning
message: >-
  Sum of two values cast to unsigned int is used in a comparison and may wrap
  before the bound check.
note: >-
  Syntactic match only. It checks a literal relational expression whose left
  operand adds two (unsigned int) casts; it does not resolve types, value
  ranges, or whether the wrap is reachable.
rule:
  pattern: '$A > $B'
  all:
    - has:
        pattern: '(unsigned int) $X'
        stopBy: end
    - has:
        pattern: '(unsigned int) $Y'
        stopBy: end
    - inside:
        kind: return_statement
        stopBy: end
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-190'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/190.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'return (unsigned int)a > (unsigned int)b; has no sum but is reported; any > with two unsigned int casts under a return matches'
  todo_cases:
    - "int f(unsigned int a, unsigned int b, unsigned int lim) { if ((unsigned int)a + (unsigned int)b > lim) { return 0; } return 1; }"
    - "int f(unsigned int a, unsigned int b, unsigned int lim) { return (unsigned int)a + (unsigned int)b >= lim; }"
