id: c-tsrmls-fetch-with-tsrmls-param
language: c
severity: warning
message: >-
  This function takes a TSRMLS parameter and also calls TSRMLS_FETCH() in its
  body, which shadows the passed-in thread-safe context.
note: >-
  Purely syntactic check for a function definition containing both a TSRMLS_DC
  parameter token and a TSRMLS_FETCH() call; it does not resolve types, macro
  expansion, or which context is actually in scope.
rule:
  all:
    - kind: function_definition
    - has:
        pattern: 'TSRMLS_FETCH()'
        stopBy: end
    - has:
        pattern: TSRMLS_DC
        stopBy: end
