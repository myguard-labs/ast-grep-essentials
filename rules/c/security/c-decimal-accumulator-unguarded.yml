id: c-decimal-accumulator-unguarded
language: c
severity: warning
message: >-
  Decimal digit accumulation X = 10 * X + expr is not directly guarded by an
  enclosing if; it may overflow.
note: >-
  Syntactic heuristic only. It matches assignments of the form X = 10 * X +
  expr whose statement is not directly inside an if statement. It does not
  verify types, value ranges, or that a bound check exists elsewhere in the
  function.
rule:
  pattern: '$X = 10 * $X + $E'
  not:
    inside:
      kind: if_statement
      stopBy: end
