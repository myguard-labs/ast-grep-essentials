# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-unbounded-char-copy-loop
language: c
severity: warning
message: >-
  This while loop copies bytes with *dst++ = *src++ while the condition tests
  only the source byte; the destination may overflow.
note: >-
  Syntactic match only. It flags a while loop whose condition is a single
  source-byte comparison and whose body is a pointer copy; it does not verify
  the destination buffer size or whether the source is bounded elsewhere.
rule:
  pattern: 'while (*$SRC > $N) *$DST++ = *$SRC++;'
