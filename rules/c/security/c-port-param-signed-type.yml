id: c-port-param-signed-type
language: c
severity: warning
message: 'Parameter named port is declared with a signed narrow type (int or short).'
note: >-
  Matches the parameter name and declared type text only. It does not prove
  the value range or resolve typedefs.
rule:
  kind: parameter_declaration
  all:
    - has:
        field: declarator
        kind: identifier
        regex: '^port$'
    - has:
        field: type
        regex: '^(signed\s+)?(short|int)(\s+int)?$'
