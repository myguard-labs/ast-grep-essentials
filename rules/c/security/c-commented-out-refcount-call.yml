# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-commented-out-refcount-call
language: c
severity: warning
message: >-
  A comment contains a disabled zval reference-count call; verify ownership
  stays balanced.
note: >-
  Matches comment nodes whose text contains zval_add_ref or zval_del_ref
  followed by an open parenthesis, syntactically only; does not verify that
  the surrounding code is live or that the commented call was intended.
rule:
  kind: comment
  regex: 'zval_(add|del)_ref\s*\('
