id: c-php-exception-discarded-not-saved
language: c
severity: warning
message: 'Pending EG(exception) is destroyed and nulled without being saved first.'
note: >-
  Syntactic match only. It does not check whether the exception was saved
  elsewhere or whether a callback runs.
rule:
  pattern: |
    if (EG(exception)) { zval_ptr_dtor(&EG(exception)); EG(exception) = NULL; }
