# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-include-source-file
language: c
severity: warning
message: This preprocessor include names a .c source file instead of a header.
note: >-
  Purely syntactic check on the literal include directive; it does not resolve
  the included file or verify that it is actually a source file or causes
  duplicate definitions.
rule:
  kind: preproc_include
  regex: '\.c[>"]\s*$'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
