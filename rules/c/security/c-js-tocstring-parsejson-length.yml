id: c-js-tocstring-parsejson-length
language: c
severity: warning
message: >-
  Buffer from JS_ToCString() is passed to JS_ParseJSON() with a separate
  length; use JS_ToCStringLen() to obtain the length.
note: >-
  Syntactic only; matches an earlier assignment from JS_ToCString to the same
  variable name and does not check dataflow or the origin of the length.
rule:
  pattern: '$R = JS_ParseJSON($CX, $P, $L, $F);'
  follows:
    stopBy: end
    pattern: '$P = JS_ToCString($$$A);'
