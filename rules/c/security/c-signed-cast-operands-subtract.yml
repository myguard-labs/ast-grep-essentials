id: c-signed-cast-operands-subtract
language: c
severity: warning
message: >-
  Subtraction of operands that are each cast to a signed integer type; cast
  the unsigned difference instead.
note: >-
  Syntactic match only on a binary subtraction whose both operands are
  parenthesized-free cast expressions with a signed integer type name. It does
  not verify operand types, unsignedness, or overflow at runtime. Skips a
  subtraction where both casts are to unsigned types.
rule:
  all:
    - pattern: '(long) $A - (long) $B'
    - not:
        all:
          - has:
              field: left
              kind: cast_expression
              has:
                field: type
                regex: '^unsigned\b'
          - has:
              field: right
              kind: cast_expression
              has:
                field: type
                regex: '^unsigned\b'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-190|CWE-191'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/190.html|https://cwe.mitre.org/data/definitions/191.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'known limitation: mixed casts in either order, e.g. (unsigned long)a - (long)b and (long)a - (unsigned long)b, still report although the subtraction is evaluated in unsigned arithmetic; unsigned spellings that do not start with unsigned (long unsigned) are not recognised'
