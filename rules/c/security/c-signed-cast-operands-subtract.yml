id: c-signed-cast-operands-subtract
language: c
severity: warning
message: >-
  Subtraction of operands that are each cast to a signed integer type; cast
  the unsigned difference instead.
note: >-
  Syntactic match only on a binary subtraction whose both operands are
  parenthesized-free cast expressions with a signed integer type name. It does
  not verify operand types, unsignedness, or overflow at runtime.
rule:
  pattern: '(long) $A - (long) $B'
