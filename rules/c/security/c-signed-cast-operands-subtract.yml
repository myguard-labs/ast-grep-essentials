# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-signed-cast-operands-subtract
language: c
severity: warning
message: >-
  Subtraction of operands that are each cast to a signed integer type; cast
  the unsigned difference instead.
note: >-
  Syntactic match only on a binary subtraction whose both operands are
  parenthesized-free cast expressions with a signed integer type name. It does
  not verify operand types, unsignedness, or overflow at runtime.
rule:
  pattern: '(long) $A - (long) $B'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-190|CWE-191'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/190.html|https://cwe.mitre.org/data/definitions/191.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'false positive (safe code flagged): long f(unsigned long a, unsigned long b) { return (unsigned long)a - (unsigned long)b; }'
