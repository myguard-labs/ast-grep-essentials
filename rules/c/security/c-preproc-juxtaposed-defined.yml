id: c-preproc-juxtaposed-defined
language: c
severity: warning
message: >-
  Two defined operators are adjacent in a conditional directive; a logical
  operator is probably missing.
note: >-
  Text-based match on the directive line inside a preproc_if node; does not
  resolve macros or rely on the condition's parse tree.
rule:
  kind: preproc_if
  regex: >-
    (?m)^[ \t]*#[ \t]*(if|elif)\b[^\n]*?\bdefined[ \t]*(\([ \t]*\w+[ \t]*\)|[
    \t]\w+)[ \t]+defined\b
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
