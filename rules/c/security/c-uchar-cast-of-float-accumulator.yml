id: c-uchar-cast-of-float-accumulator
language: c
severity: warning
message: >-
  Compound assignment accumulates a value truncated by an (unsigned char)
  cast; review for lost precision or wraparound in weighted sums.
note: >-
  Purely syntactic match on a compound assignment whose right-hand side is an
  (unsigned char) cast of a parenthesized product. It does not verify operand
  types, value ranges, or whether the product is actually floating-point.
rule:
  pattern: '$ACC += (unsigned char)($A * $B)'
