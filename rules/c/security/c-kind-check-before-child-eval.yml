# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-kind-check-before-child-eval
language: c
severity: warning
message: >-
  The child's kind is checked, with an early return, before
  zend_eval_const_expr folds that child. Folding may change its kind.
note: >-
  Matches the literal sibling order in one block only. It does not resolve
  aliasing, control flow, or whether the child is modified in between.
rule:
  pattern: 'zend_eval_const_expr(&ast->child[1]);'
  follows:
    pattern: 'if (ast->child[1]->kind != ZEND_AST_ZVAL) return;'
