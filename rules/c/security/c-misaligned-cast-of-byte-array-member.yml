id: c-misaligned-cast-of-byte-array-member
language: c
severity: warning
message: >-
  Cast of a byte-array member plus a variable offset to a non-char pointer
  type may be misaligned.
note: >-
  Purely syntactic match on a cast of the form (T *) (x->member + expr) where
  T is not unsigned char. The member is not checked to be a byte array, and
  the offset is not proven non-constant or aligned; types, alignment, and
  aliasing are not resolved.
rule:
  all:
    - pattern: '(long *) ($RECV->data + $OFF)'
    - any:
        - pattern: '(long *) ($RECV->data + $OFF)'
