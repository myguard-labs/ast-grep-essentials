# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-nonvoid-switch-falls-off-end
language: c
severity: warning
message: >-
  Non-void function ends with a switch that has no default label and no
  trailing return.
note: >-
  Syntactic check only; it does not prove the case labels are non-exhaustive,
  and a default label in a nested switch also suppresses the match.
rule:
  kind: function_definition
  all:
    - not:
        has:
          field: type
          regex: '^void$'
    - has:
        field: body
        kind: compound_statement
        has:
          kind: switch_statement
          nthChild:
            position: 1
            reverse: true
          not:
            has:
              kind: case_statement
              regex: '^default'
              stopBy: end
