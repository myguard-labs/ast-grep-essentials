# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-chroot-without-chdir
language: c
severity: warning
message: >-
  chroot called in a function containing no direct chdir or fchdir call;
  review working-directory handling.
note: >-
  Checks only same-function syntactic co-occurrence, in either order.
  Recognizes bare call names and names wrapped in parentheses with optional
  whitespace. Comments within the parenthesized callee are not recognized.
  Does not resolve symbols, aliases, helpers, execution order, reachability,
  or call success, and does not establish that a jail is secure.
rule:
  kind: call_expression
  has:
    field: function
    regex: '^\s*(\(\s*)*chroot(\s*\))*\s*$'
  inside:
    kind: function_definition
    stopBy: end
    not:
      has:
        stopBy: end
        kind: call_expression
        has:
          field: function
          regex: '^\s*(\(\s*)*(chdir|fchdir)(\s*\))*\s*$'
