id: c-asprintf-result-discarded
language: c
severity: warning
message: >-
  The return value of asprintf is discarded; check it before using the output
  pointer.
note: >-
  Syntactic match on a bare asprintf call that is the whole expression
  statement only. It does not verify that the call is unchecked across control
  flow, that asprintf is the libc function, or that the output pointer is
  used.
rule:
  pattern: 'asprintf($$$ARGS);'
