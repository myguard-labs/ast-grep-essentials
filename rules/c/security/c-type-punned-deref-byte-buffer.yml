# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-type-punned-deref-byte-buffer
language: c
severity: warning
message: >-
  Word-sized type-punned access through a cast of a byte-buffer pointer;
  consider memcpy or a typed union.
note: >-
  Matches the literal syntax of a dereferenced cast to a size_t pointer in an
  expression or assignment. It does not resolve types, aliasing, or whether
  the source pointer really refers to a byte buffer.
rule:
  pattern: '*(size_t *)($P)'
