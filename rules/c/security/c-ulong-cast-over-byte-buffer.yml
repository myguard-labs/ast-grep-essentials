# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-ulong-cast-over-byte-buffer
language: c
severity: warning
message: >-
  This casts a buffer to unsigned long*, whose width is platform-dependent;
  prefer a fixed-width type such as uint32_t.
note: >-
  Matches the literal cast syntax to unsigned long* without checking the
  source buffer's type, the element width, or whether the pointer is ever
  indexed; it does not resolve typedefs or aliases.
rule:
  pattern: '$PTR = (unsigned long*)$BUF'
