id: c-getaddrinfo-res-unchecked
language: c
severity: warning
message: >-
  The getaddrinfo result pointer is used after a failure check that only tests
  the return code; add a res == NULL check before dereferencing.
note: >-
  Syntactic single-file heuristic only. It matches an if-condition calling
  getaddrinfo with a bare return-code test whose body dereferences a pointer
  with the arrow operator; it does not verify that getaddrinfo can return
  success with a NULL result, nor track aliasing or reachability.
rule:
  pattern: |
    if (getaddrinfo($$$ARGS)) {
      $$$BODY
    }
