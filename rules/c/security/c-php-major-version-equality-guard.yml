id: c-php-major-version-equality-guard
language: c
severity: warning
message: >-
  PHP_MAJOR_VERSION is compared with == against a constant; later major
  versions will skip this preprocessor branch.
note: >-
  Matches the literal syntax of a preprocessor condition that compares
  PHP_MAJOR_VERSION with == in the same file. It does not resolve macro
  definitions, included headers, or runtime values.
rule:
  pattern: 'PHP_MAJOR_VERSION == $VER'
