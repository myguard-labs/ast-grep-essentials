# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-null-branch-member-access
language: c
severity: warning
message: Member access on a pointer inside the branch that tested it as NULL.
note: >-
  Matches the same identifier text syntactically in the if (!p) body. It does
  not track reassignment of p or early exits.
rule:
  pattern: 'if (!$P) $BODY'
  has:
    field: consequence
    stopBy: end
    pattern: '$P->$F'
