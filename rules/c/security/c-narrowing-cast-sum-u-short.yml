# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-narrowing-cast-sum-u-short
language: c
severity: warning
message: >-
  A sum is narrowed to u_short with a cast and stored without a visible bound
  check.
note: >-
  Purely syntactic. Matches a cast to u_short of an additive expression
  assigned into an element or variable; it does not check for a preceding
  bound test, resolve types, or track dataflow, so guarded code may still be
  reported.
rule:
  pattern: '$DST = (u_short) ($A + $B)'
