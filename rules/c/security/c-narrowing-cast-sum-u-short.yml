# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-narrowing-cast-sum-u-short
language: c
severity: warning
message: >-
  A sum is narrowed to u_short with a cast and stored without a visible bound
  check.
note: >-
  Purely syntactic. Matches a cast to u_short of an additive expression
  assigned into an element or variable; it does not check for a preceding
  bound test, resolve types, or track dataflow, so guarded code may still be
  reported.
rule:
  pattern: '$DST = (u_short) ($A + $B)'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-197|CWE-190'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/197.html|https://cwe.mitre.org/data/definitions/190.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "void f(u_short a, u_short b) { u_short n = (u_short) (a + b); }"
    - "void f(unsigned short *t, int a, int b) { unsigned short n; n = (unsigned short) (a + b); }"
