# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-guard-flag-never-assigned
language: c
severity: warning
message: >-
  Local flag initialized to zero is used as an if condition but never assigned
  in this function; the branch looks dead.
note: >-
  Syntactic only; it checks for plain assignment expressions to the same name
  and ignores increments, compound assignments, address-taking, and shadowing.
rule:
  all:
    - pattern: 'if ($N) $S'
    - inside:
        stopBy: end
        kind: function_definition
        all:
          - has:
              stopBy: end
              pattern: 'int $N = 0;'
          - not:
              has:
                stopBy: end
                pattern: '$N = $V'
