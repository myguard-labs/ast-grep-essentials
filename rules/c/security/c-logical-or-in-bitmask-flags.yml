# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-logical-or-in-bitmask-flags
language: c
severity: warning
message: >-
  A logical || is used inside a parenthesized operand of a bitwise & test;
  this is likely a typo for |.
note: >-
  Matches the literal syntax of a || binary expression directly inside a
  parenthesized operand of a & binary expression. It does not resolve that the
  operands are flag constants or check types, aliasing, or runtime values.
rule:
  pattern: '$A & ($B || $C)'
