# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-deref-compared-to-string-literal
language: c
severity: warning
message: >-
  A dereferenced pointer is compared with a string literal; a char is being
  compared with a char pointer.
note: >-
  Matches the literal syntax of a pointer dereference compared with a string
  literal using == or !=; it does not resolve types or whether the
  dereferenced value is a char.
rule:
  kind: binary_expression
  all:
    - has:
        field: left
        kind: pointer_expression
        has:
          field: operator
          regex: '^\*$'
    - has:
        field: right
        kind: string_literal
    - has:
        field: operator
        regex: '^(==|!=)$'
