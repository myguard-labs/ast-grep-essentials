# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-float-expr-assigned-to-int
language: c
severity: warning
message: >-
  Integer variable initialised from an expression containing a floating-point
  literal; add an explicit cast to record intent.
note: >-
  Matches only a literal int declaration whose initialiser contains a decimal
  floating literal; it skips an initialiser whose outermost expression is a cast to an integer
  type; it does not detect other integer types, or
  plain assignments.
rule:
  all:
    - pattern: 'int $N = $E'
    - has:
        kind: number_literal
        regex: '^[0-9]*\.[0-9]*'
        stopBy: end
    - not:
        has:
          kind: init_declarator
          has:
            field: value
            kind: cast_expression
            has:
              field: type
              regex: '^\s*(const\s+)?((unsigned|signed)\s+)?((long\s+long|long|short)(\s+int)?|char|int|size_t|ssize_t|ptrdiff_t|u?int(8|16|32|64)_t|unsigned|signed)\s*$'
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
  created_at: '2026-10-19'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-681'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/681.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'int n = (int)(x * 0.5) + 1; and int n = ((int)(x * 0.5)); are reported although the float part is cast'
  todo_cases:
    - "void f(double x) { int a = (int)(x * 0.5), b = x * 0.5; }"
