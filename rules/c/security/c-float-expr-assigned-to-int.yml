id: c-float-expr-assigned-to-int
language: c
severity: warning
message: >-
  Integer variable initialised from an expression containing a floating-point
  literal; add an explicit cast to record intent.
note: >-
  Matches only a literal int declaration whose initialiser contains a decimal
  floating literal; it does not detect explicit casts, other integer types, or
  plain assignments.
rule:
  pattern: 'int $N = $E'
  has:
    kind: number_literal
    regex: '^[0-9]*\.[0-9]*'
    stopBy: end
