id: c-php-hash-foreach-copy-without-deref
language: c
severity: warning
message: >-
  ZVAL_COPY_VALUE copies a value without a preceding ZVAL_DEREF on it; a
  reference wrapper may be copied.
note: >-
  Syntactic only; does not verify the enclosing ZEND_HASH_FOREACH_VAL loop or
  the variable's origin, only that no earlier sibling ZVAL_DEREF on the same
  expression exists.
rule:
  all:
    - pattern: 'ZVAL_COPY_VALUE($D, $P);'
    - not:
        follows:
          pattern: 'ZVAL_DEREF($P);'
          stopBy: end
