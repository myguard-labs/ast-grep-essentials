id: c-deref-postfix-decrement-precedence
language: c
severity: warning
message: >-
  Dereferenced postfix decrement moves the pointer; the pointee is not
  changed. Add parentheses if the pointee was intended.
note: >-
  Matches the literal syntax of a dereference applied to a postfix decrement
  without parentheses. It does not resolve types, aliasing, or whether the
  pointer movement is intended.
rule:
  pattern: '*$P--'
