# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-comment-contains-nested-opener
language: c
severity: warning
message: 'This block comment contains a ''/*'' sequence inside its body.'
note: >-
  Lexical check only. It matches any C comment node whose text contains the
  two characters '/*' after the opening delimiter; it does not verify compiler
  warnings or nesting behavior.
rule:
  kind: comment
  regex: '^/\*[\s\S]*/\*[\s\S]*\*/$'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
