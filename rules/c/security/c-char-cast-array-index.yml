id: c-char-cast-array-index
language: c
severity: warning
message: >-
  Array subscript uses a plain char cast as the index; on targets where char
  is signed, bytes 0x80 and above become negative indices.
note: >-
  Purely syntactic check for a subscript whose index is a direct (char) cast.
  It does not verify that the cast operand is a byte value, that char is
  signed on the target, or that the array is indexed by this expression at
  runtime.
rule:
  pattern: '$ARR[(char) $X]'
