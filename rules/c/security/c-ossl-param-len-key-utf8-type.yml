id: c-ossl-param-len-key-utf8-type
language: c
severity: warning
message: >-
  OSSL_PARAM_utf8_string is used with a key whose name ends in _LEN; use an
  integer or size type instead.
note: >-
  Matches the key macro name syntactically by suffix; it does not resolve
  macro definitions or the actual parameter type.
rule:
  pattern: 'OSSL_PARAM_utf8_string($KEY, $$$REST)'
constraints:
  KEY:
    kind: identifier
    regex: '_LEN$'
