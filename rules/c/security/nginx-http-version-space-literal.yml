# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: nginx-http-version-space-literal
language: c
severity: warning
message: >-
  This string literal names an HTTP version with a space instead of a slash
  (for example "HTTP 1.1" instead of "HTTP/1.1").
note: >-
  Matches only string literals whose text begins with HTTP followed by a space
  and a digit. It is a purely syntactic check and does not verify how the
  string is used at runtime.
rule:
  kind: string_literal
  regex: '^"HTTP [0-9]'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
