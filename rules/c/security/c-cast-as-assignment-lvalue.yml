id: c-cast-as-assignment-lvalue
language: c
severity: warning
message: Compound assignment to a cast expression is not a valid lvalue.
note: >-
  Matches syntax only; it does not check whether the code is compiled or
  disabled by the preprocessor.
rule:
  pattern: '($T)$X ^= $Y'
