id: c-inline-without-static-linkage
language: c
severity: warning
message: >-
  Function definition uses inline without static or extern storage class;
  check its linkage.
note: >-
  Syntactic check only. It matches file-scope function definitions whose
  specifiers contain inline and lack static or extern, without resolving
  linkage, other translation units, or whether an external definition exists
  elsewhere.
rule:
  all:
    - kind: function_definition
    - has:
        kind: storage_class_specifier
        regex: '^inline$'
    - not:
        has:
          kind: storage_class_specifier
          regex: '^(static|extern)$'
    - inside:
        kind: translation_unit
        stopBy: end
