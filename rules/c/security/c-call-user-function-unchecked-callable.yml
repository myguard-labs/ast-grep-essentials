# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-call-user-function-unchecked-callable
language: c
severity: warning
message: >-
  call_user_function is used with no zend_is_callable reference in any
  enclosing block.
note: >-
  Syntactic only; it does not verify that the check guards the same zval or
  dominates the call.
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        kind: identifier
        regex: '^call_user_function$'
    - not:
        inside:
          stopBy: end
          kind: compound_statement
          has:
            stopBy: end
            kind: identifier
            regex: '^zend_is_callable$'
