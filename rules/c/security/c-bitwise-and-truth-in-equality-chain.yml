# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-bitwise-and-truth-in-equality-chain
language: c
severity: warning
message: >-
  Bitwise & used as a truth value next to an == comparison of the same
  expression; the mask test may have been meant as an equality.
note: >-
  Matches only the literal syntax `X & C || X == D` with the same text for X.
  It does not resolve types or check that the operands are constants. It does
  not cover the reversed order or the && form.
rule:
  pattern: '$A & $C || $A == $D'
