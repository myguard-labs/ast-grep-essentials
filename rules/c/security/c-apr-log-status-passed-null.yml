id: c-apr-log-status-passed-null
language: c
severity: warning
message: >-
  ap_log_rerror() is passed NULL as status inside an if that tests an assigned
  apr_status_t result; pass the status instead.
note: >-
  Syntactic match only; it does not check the type of the assigned variable or
  whether the call is reachable.
rule:
  pattern: 'ap_log_rerror($F, $L, NULL, $$$ARGS)'
  inside:
    stopBy: end
    kind: if_statement
    has:
      field: condition
      kind: parenthesized_expression
      has:
        stopBy: end
        kind: binary_expression
        all:
          - has:
              field: operator
              regex: '^!=$'
          - has:
              field: right
              regex: '^APR_SUCCESS$'
          - has:
              field: left
              stopBy: end
              kind: assignment_expression
