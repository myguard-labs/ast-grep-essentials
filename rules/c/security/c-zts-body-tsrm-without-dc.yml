id: c-zts-body-tsrm-without-dc
language: c
severity: warning
message: >-
  Function body uses TSRMLS_CC or TSRMLS_C but the parameter list does not
  include TSRMLS_DC.
note: >-
  Syntactic check on a single function definition only. It matches the literal
  macro names in the body and the absence of TSRMLS_DC in the parameter text;
  it does not resolve macro definitions, types, or whether the body usage is
  reachable.
rule:
  all:
    - kind: function_definition
    - has:
        pattern: TSRMLS_CC
        stopBy: end
    - not:
        has:
          pattern: TSRMLS_DC
          stopBy: end
