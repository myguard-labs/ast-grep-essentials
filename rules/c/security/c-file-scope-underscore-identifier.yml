# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-file-scope-underscore-identifier
language: c
severity: warning
message: >-
  File-scope function name begins with an underscore, which C reserves at file
  scope.
note: >-
  Syntactic only; matches direct translation-unit function definitions with a
  plain identifier declarator starting with underscore, and does not cover
  pointer-returning declarators or macros.
rule:
  kind: function_definition
  inside:
    kind: translation_unit
  has:
    field: declarator
    kind: function_declarator
    has:
      field: declarator
      kind: identifier
      regex: '^_'
