id: c-unprototyped-function-definition
language: c
severity: warning
message: >-
  Function definition has an empty parameter list; declare parameters
  explicitly or use (void).
note: >-
  Syntactic match only: flags function definitions whose parameter list is
  empty parentheses with no parameter_declaration. It does not check
  prototypes elsewhere, call sites, or whether the definition is reached.
rule:
  kind: function_definition
  all:
    - has:
        kind: function_declarator
        has:
          kind: parameter_list
          not:
            has:
              kind: parameter_declaration
    - not:
        has:
          kind: parameter_declaration
