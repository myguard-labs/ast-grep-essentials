id: c-store-indexes-from-destination
language: c
severity: warning
message: >-
  Assignment through a pointer that is post-incremented reads the same pointer
  inside its index expression.
note: >-
  Syntactic check only. Matches a store to *p++ whose right-hand side indexes
  a table with a read of *p, without verifying aliasing, types, or runtime
  values.
rule:
  pattern: '*$P++ = $TAB[*$P & $MASK];'
