id: c-int-cast-before-float-scale
language: c
severity: warning
message: >-
  An integer cast is applied to a floating-point division before the result is
  scaled, so the value is truncated before the range multiplication.
note: >-
  Syntactic match only. It matches a return statement whose expression is an
  integer-cast parenthesised double division multiplied by a parenthesised
  range expression, plus an offset. It does not verify operand types, value
  ranges, or whether truncation is intended.
rule:
  pattern: 'return (int)((double)$A / $B) * ($H - $L + 1) + $OFF;'
