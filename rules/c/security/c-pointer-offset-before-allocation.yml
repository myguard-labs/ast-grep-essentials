# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-pointer-offset-before-allocation
language: c
severity: warning
message: Pointer is offset before the base pointer is assigned by an allocation call.
note: >-
  Matches only same-scope sibling statement order with the same base
  identifier text. It does not check control flow, aliasing, or other
  allocators.
rule:
  all:
    - kind: declaration
    - has:
        stopBy: end
        pattern: '$B + $N'
    - precedes:
        stopBy: end
        pattern: '$B = malloc($$$A);'
