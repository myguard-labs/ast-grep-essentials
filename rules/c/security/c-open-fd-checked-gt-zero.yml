id: c-open-fd-checked-gt-zero
language: c
severity: warning
message: >-
  Descriptor from open() is compared with > 0; descriptor 0 is valid, so use
  >= 0.
note: >-
  Purely syntactic match on a variable compared with a literal 0 using > in an
  if condition. It does not verify that the variable holds an open() result or
  that the descriptor is used as a file descriptor; it cannot track
  assignments or aliasing.
rule:
  pattern: 'if ($FD > 0) { close($FD); }'
