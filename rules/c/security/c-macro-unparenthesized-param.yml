id: c-macro-unparenthesized-param
language: c
severity: warning
message: >-
  Function-like macro body uses an identifier bare next to an operator;
  parameters should be parenthesized.
note: >-
  Token-level approximation on the opaque macro body; it does not check that
  the identifier is actually a macro parameter.
rule:
  kind: preproc_function_def
  has:
    kind: preproc_arg
    regex: '[A-Za-z_][A-Za-z0-9_]*\s*(>=|<=|==|!=|<|>|\+|-|\*|/)'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
