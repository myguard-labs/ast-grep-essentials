id: c-zero-length-local-array
language: c
severity: warning
message: Local array declared with a literal zero length.
note: >-
  Matches the literal syntax of a local array declarator whose size is the
  integer literal 0 inside a function body. It does not check types,
  reachability, or whether the array is written to.
rule:
  kind: array_declarator
  has:
    field: size
    kind: number_literal
    regex: '^0$'
  inside:
    kind: compound_statement
    stopBy: end
