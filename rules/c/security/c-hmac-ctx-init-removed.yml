# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-hmac-ctx-init-removed
language: c
severity: warning
message: >-
  HMAC_CTX_init is a removed OpenSSL API; migrate this call to HMAC_CTX_reset
  or the current HMAC_CTX lifecycle API.
note: >-
  Matches the literal call expression HMAC_CTX_init(...) syntactically; does
  not verify that the callee is the OpenSSL function or check the linked
  library version.
rule:
  kind: call_expression
  has:
    field: function
    regex: '^HMAC_CTX_init$'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
