id: c-int-length-parameter
language: c
severity: warning
message: >-
  Length or size parameter is declared with a 32-bit int type instead of
  size_t.
note: >-
  Syntactic check only. Matches parameter declarations whose identifier ends
  in _len, _length or size and whose type is int, uint or unsigned int; does
  not verify caller values or type aliases.
rule:
  all:
    - kind: parameter_declaration
    - has:
        field: declarator
        regex: '(_len|_length|size)$'
    - has:
        field: type
        regex: '^(int|uint|unsigned int)$'
