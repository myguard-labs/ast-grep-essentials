id: c-member-store-before-null-check
language: c
severity: warning
message: >-
  Pointer field is written before a later if statement checks the same pointer
  against NULL.
note: >-
  Matches syntax only. It does not prove the pointer can be NULL, and it does
  not check for intervening reassignment or other control flow.
rule:
  pattern: '$P->$F = $V;'
  precedes:
    stopBy: end
    kind: if_statement
    has:
      field: condition
      has:
        pattern: '$P != NULL'
