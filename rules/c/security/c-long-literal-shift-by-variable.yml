# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-long-literal-shift-by-variable
language: c
severity: warning
message: >-
  Left shift of an L-suffixed literal by a variable amount has long width and
  may truncate on LLP64 targets.
note: >-
  Matches only the literal syntax of an L-suffixed integer literal shifted
  left by an expression. It does not resolve types, the target data model, or
  whether the shift amount is bounded.
rule:
  pattern: '(1L << $INDEX)'
