# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-long-literal-shift-by-variable
language: c
severity: warning
message: >-
  Left shift of an L-suffixed literal by a variable amount has long width and
  may truncate on LLP64 targets.
note: >-
  Matches only the literal syntax of an L-suffixed integer literal shifted
  left by an expression. It does not resolve types, the target data model, or
  whether the shift amount is bounded.
rule:
  pattern: '(1L << $INDEX)'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-1335'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/1335.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "lowercase suffix (1l << i) is not matched (FN)"
    - "unparenthesized 1L << i is not matched because the pattern requires parentheses (FN)"
    - "(1L << 3) with a constant shift count is also matched although the message says variable amount (FP, low)"
