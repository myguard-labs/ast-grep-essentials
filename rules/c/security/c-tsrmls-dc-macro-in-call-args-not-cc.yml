id: c-tsrmls-dc-macro-in-call-args-not-cc
language: c
severity: warning
message: >-
  TSRMLS_DC is used as a trailing call argument; the call form TSRMLS_CC is
  expected here.
note: >-
  Purely syntactic check for a literal TSRMLS_DC identifier as the last
  argument of a call expression. It does not verify the callee signature,
  macro expansion, or ZTS configuration.
rule:
  pattern: '$F($$$ARGS, TSRMLS_DC)'
