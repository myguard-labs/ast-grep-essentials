id: c-alloc-sizeof-minus-one-count
language: c
severity: warning
message: >-
  Size expression multiplies sizeof by (identifier - 1), which underflows when
  the identifier is zero.
note: >-
  Matches the syntactic shape only; does not determine whether the identifier
  can be zero or whether the result is used for allocation.
rule:
  pattern: '$A * ($N - 1)'
constraints:
  A:
    kind: sizeof_expression
  'N':
    kind: identifier
