id: c-filter-next-guard-passes-outer-pointer
language: c
severity: warning
message: >-
  Macro guards on (x)->next but passes the bare (x) as the filter argument
  instead of (x)->next.
note: >-
  Text-based match on the macro body, which the C grammar leaves opaque. It
  cannot verify that the guarded and passed names are identical.
rule:
  kind: preproc_arg
  regex: '\(\w+\)->next\s*\?\s*\(\w+\)->next->fops->\w+\(\([^()]*\),\s*\(\w+\)\s*[,)]'
