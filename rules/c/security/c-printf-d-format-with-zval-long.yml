id: c-printf-d-format-with-zval-long
language: c
severity: warning
message: >-
  A %d or %i conversion is given a Z_LVAL value, which is a zend_long and may
  be wider than int.
note: >-
  Syntactic only; matches any call with a literal %d/%i format and a direct
  Z_LVAL argument, without checking the callee is printf-like or resolving
  macros.
rule:
  kind: call_expression
  has:
    kind: argument_list
    all:
      - has:
          kind: string_literal
          regex: '%[-+ #0-9.]*[di]'
      - has:
          kind: call_expression
          regex: '^Z_LVAL(_P|_PP)?\('
