id: c-copy-before-fallible-register
language: c
severity: warning
message: >-
  An if statement whose body returns follows a ZVAL_COPY; the failure path may
  keep the stored reference.
note: >-
  Syntactic ordering check only; it does not verify the condition is a
  fallible registration call, or that the reference is released elsewhere.
rule:
  all:
    - kind: if_statement
    - regex: '(RETURN_|return)'
    - has:
        field: condition
        has:
          kind: call_expression
          stopBy: end
    - follows:
        stopBy: end
        regex: '^ZVAL_COPY'
