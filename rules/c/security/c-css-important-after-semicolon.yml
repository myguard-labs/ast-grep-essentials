id: c-css-important-after-semicolon
language: c
severity: warning
message: >-
  This CSS string places !important after a semicolon, so the declaration is
  dropped.
note: >-
  Single-file syntactic regex over one C string literal; it does not parse CSS
  or resolve whether the string is emitted as a stylesheet.
rule:
  kind: string_literal
  regex: ';\s*!important\b'
