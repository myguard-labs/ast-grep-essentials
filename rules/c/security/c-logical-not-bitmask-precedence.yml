# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-logical-not-bitmask-precedence
language: c
severity: warning
message: >-
  Logical not applied to a bare identifier as the left operand of bitwise &;
  parenthesize the mask test.
note: >-
  Syntactic check only. Matches a unary logical-not on a bare identifier
  directly as the unparenthesized left operand of a binary &. It does not
  resolve types or confirm the value is a bitmask.
rule:
  pattern: '!$X & $MASK'
