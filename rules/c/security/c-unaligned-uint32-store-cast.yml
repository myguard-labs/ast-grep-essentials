id: c-unaligned-uint32-store-cast
language: c
severity: warning
message: >-
  Dereferenced cast pointer is written as a uint32_t store; this may be
  misaligned and violate strict aliasing. Consider memcpy.
note: >-
  Syntactic match only on a literal dereference of a (uint32_t *) cast
  assigned to. It does not verify alignment, buffer origin, or aliasing at
  runtime.
rule:
  pattern: '*(uint32_t *)($BUF) = $V'
