# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-unaligned-uint32-store-cast
language: c
severity: warning
message: >-
  Dereferenced cast pointer is written as a uint32_t store; this may be
  misaligned and violate strict aliasing. Consider memcpy.
note: >-
  Syntactic match only on a literal dereference of a (uint32_t *) cast
  assigned to. It does not verify alignment, buffer origin, or aliasing at
  runtime.
rule:
  pattern: '*(uint32_t *)($BUF) = $V'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-843'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/843.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "void put(unsigned char *b, uint32_t v) { *(uint32_t *)b = v; }"
    - "void put(unsigned char *b, uint32_t v) { *(uint32_t *)(b) += v; }"
