id: c-same-identifier-in-and-out-arg
language: c
severity: warning
message: >-
  This call passes the same identifier as its first and second argument, so an
  output buffer may alias its input.
note: >-
  Purely syntactic check for a call whose first two arguments are the same
  plain identifier. It does not resolve types, aliasing, or whether the callee
  actually writes to its second argument, so intentional same-name calls may
  be flagged.
rule:
  pattern: '$F($X, $X)'
