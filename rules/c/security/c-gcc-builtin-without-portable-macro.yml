id: c-gcc-builtin-without-portable-macro
language: c
severity: warning
message: >-
  Direct __builtin_offsetof use; use the portable offsetof macro from
  stddef.h.
note: >-
  Matches the literal __builtin_offsetof identifier syntax only; it does not
  resolve macros, confirm a call parses cleanly, or cover other __builtin_
  intrinsics.
rule:
  kind: identifier
  regex: '^__builtin_offsetof$'
