id: c-loop-counter-array-write-unbounded
language: c
severity: warning
message: >-
  While loop writes an array at a counter incremented in the body, but the
  loop condition does not mention that counter.
note: >-
  Syntactic only; does not verify the array is fixed-size, nor detect bounds
  checks elsewhere in the body.
rule:
  kind: while_statement
  all:
    - has:
        field: body
        has:
          pattern: '$A[$N] = $$$V'
          stopBy: end
    - has:
        field: body
        has:
          pattern: '$N++'
          stopBy: end
    - not:
        has:
          field: condition
          has:
            pattern: '$N'
            stopBy: end
