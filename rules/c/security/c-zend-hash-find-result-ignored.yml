id: c-zend-hash-find-result-ignored
language: c
severity: warning
message: >-
  The return value of zend_hash_index_find is discarded before the out-pointer
  is dereferenced.
note: >-
  Syntactic approximation only. Matches a bare zend_hash_index_find expression
  statement followed by a dereference in the next statement; it does not
  verify types, the hash table semantics, or that the key is absent.
rule:
  all:
    - pattern: 'zend_hash_index_find($$$ARGS);'
    - precedes:
        pattern: '$NEW = *$PTR;'
        stopBy: end
