id: c-brace-initializer-macro-argument
language: c
severity: warning
message: >-
  A brace initializer list with a top-level comma is passed as a call
  argument; this only compiles if the callee is a function-like macro, and the
  comma splits its arguments.
note: >-
  Single-file syntactic match on a call whose direct argument is a brace
  initializer list containing a comma. It does not resolve whether the callee
  is a macro; it flags the shape only.
rule:
  pattern: '$F($$$A, { $$$ITEMS })'
