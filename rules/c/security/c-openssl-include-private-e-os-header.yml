# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-openssl-include-private-e-os-header
language: c
severity: warning
message: >-
  This includes OpenSSL's private e_os.h header, which is not part of the
  public API.
note: >-
  Matches the literal include path syntax only; it does not verify that the
  included header resolves to OpenSSL's source tree or check build
  configuration.
rule:
  pattern: '#include <openssl/e_os.h>'
