# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-adjacent-same-destination-overwrite
language: c
severity: warning
message: >-
  Consecutive calls write the same first argument; the first write may be dead
  or a copy-paste target error.
note: >-
  Single-file syntactic check for two adjacent SET_RESULT calls sharing a
  literal identical first argument. It does not prove the first write is dead,
  and intentional overwrites need review.
rule:
  all:
    - pattern: 'SET_RESULT($DEST, $_);'
    - precedes:
        pattern: 'SET_RESULT($DEST, $_);'
        stopBy: neighbor
