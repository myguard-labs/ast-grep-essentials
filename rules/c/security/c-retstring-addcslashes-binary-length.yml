id: c-retstring-addcslashes-binary-length
language: c
severity: warning
message: >-
  RETURN_STRING wraps a call whose output length is reported via an
  out-parameter; embedded NUL bytes may be truncated. Use RETURN_STRINGL with
  the explicit length.
note: >-
  Purely syntactic match on a RETURN_STRING macro call whose first argument is
  a call with a Z_STRLEN_P out-parameter. Does not verify the helper's
  semantics or types.
rule:
  pattern: 'RETURN_STRING(php_addcslashes($$$ARGS), $$$REST)'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-170'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/170.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "RETVAL_STRING(php_addcslashes(s, n, &l, 0, w, wl), 0);"
    - "RETURN_STRING((php_addcslashes(s, n, &l, 0, w, wl)), 0);"
    - "RETURN_STRING(php_addcslashes(s, n, &l, 0, w, wl));"
    - "r = php_addcslashes(s, n, &l, 0, w, wl); RETURN_STRING(r, 0);"
