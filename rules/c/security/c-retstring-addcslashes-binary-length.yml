id: c-retstring-addcslashes-binary-length
language: c
severity: warning
message: >-
  RETURN_STRING wraps a call whose output length is reported via an
  out-parameter; embedded NUL bytes may be truncated. Use RETURN_STRINGL with
  the explicit length.
note: >-
  Purely syntactic match on a RETURN_STRING macro call whose first argument is
  a call with a Z_STRLEN_P out-parameter. Does not verify the helper's
  semantics or types.
rule:
  pattern: 'RETURN_STRING(php_addcslashes($$$ARGS), $$$REST)'
