# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-openssl-version-check-without-libressl
language: c
severity: warning
message: >-
  OPENSSL_VERSION_NUMBER gate without a LIBRESSL_VERSION_NUMBER exclusion;
  this may break LibreSSL builds.
note: >-
  Syntactic only; it does not check which APIs are used or whether LibreSSL is
  excluded elsewhere in the file.
rule:
  kind: preproc_if
  all:
    - has:
        field: condition
        regex: OPENSSL_VERSION_NUMBER
    - not:
        has:
          stopBy: end
          kind: identifier
          regex: LIBRESSL_VERSION_NUMBER
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
