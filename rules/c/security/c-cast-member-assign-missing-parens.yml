id: c-cast-member-assign-missing-parens
language: c
severity: warning
message: >-
  Cast applied directly to a member access on the left of an assignment; the
  cast binds to the member expression, not the base pointer. Add parentheses
  if the base pointer was meant to be cast.
note: >-
  Syntactic match only. Matches an assignment whose left side is a cast
  expression with a member access operand written without parentheses. Does
  not resolve types or confirm that the parse is invalid for the specific
  compiler.
rule:
  pattern: '($T)$P->$M = $V'
