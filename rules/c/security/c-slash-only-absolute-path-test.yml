# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-slash-only-absolute-path-test
language: c
severity: warning
message: >-
  This compares the first character to '/' as an absolute-path test; Windows
  absolute forms may be missed.
note: >-
  Syntactic match only. It flags a literal first-character comparison against
  '/' without resolving whether the variable is a path or whether '/' is used
  as a path root rather than a delimiter.
rule:
  pattern: '$P[0] == ''/'''
