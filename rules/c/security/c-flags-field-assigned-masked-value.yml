# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-flags-field-assigned-masked-value
language: c
severity: warning
message: >-
  Plain assignment of a bitmask-ANDed value to a flags member overwrites bits
  outside the mask.
note: >-
  Syntactic match only on a literal OG(flags) receiver-style assignment whose
  right side is a bitwise AND. It does not verify types, aliasing, or whether
  the full overwrite is intended.
rule:
  pattern: 'OG(flags) = $A & $B'
