id: c-lexbor-local-name-to-libxml-node
language: c
severity: warning
message: >-
  Result of lxb_dom_element_local_name() is passed to xmlNewDocNode(),
  dropping any namespace prefix.
note: >-
  Matches a same-file declaration from lxb_dom_element_local_name() followed
  by a declaration passing that variable to xmlNewDocNode(); no dataflow,
  reassignment or scope analysis.
rule:
  all:
    - kind: declaration
    - has:
        stopBy: end
        pattern: 'xmlNewDocNode($D, $N, $NAME, $C)'
    - follows:
        stopBy: end
        pattern: 'const lxb_char_t *$NAME = lxb_dom_element_local_name($$$A);'
