id: c-unbounded-string-copy
language: c
severity: warning
message: >-
  Unbounded string copy (strcpy/stpcpy/strcat/sprintf/gets). Verify
  destination capacity against the maximum output size. Use a bounded
  operation with the correct length and return-value contract, such as
  snprintf or an appropriate nginx formatting/copy API.
note: Confirm the destination buffer size vs the max source length before dismissing.
rule:
  any:
    - pattern: strcpy($DST, $SRC)
    - pattern: strcat($DST, $SRC)
    - pattern: sprintf($BUF, $$$)
    - kind: call_expression
      has:
        field: function
        regex: ^gets$
    - pattern: stpcpy($DST, $SRC)
