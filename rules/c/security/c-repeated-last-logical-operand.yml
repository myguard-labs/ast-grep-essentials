# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-repeated-last-logical-operand
language: c
severity: warning
message: >-
  The last two operands of this && chain are identical; one operand may be a
  mistyped copy.
note: >-
  Matches syntactically only when the final && operand is textually identical
  to the operand before it within a flat chain. It does not resolve semantics,
  side effects, or aliasing, and it cannot tell whether the repetition is
  intentional.
rule:
  pattern: '$A && $B && $B'
