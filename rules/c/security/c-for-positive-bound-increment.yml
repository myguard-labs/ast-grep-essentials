id: c-for-positive-bound-increment
language: c
severity: warning
message: >-
  This for loop tests a counter with greater-than-zero but increments it, so
  the loop may never terminate or may index past bounds.
note: >-
  Matches only the literal single-file syntax of a for statement whose
  condition is `i > 0` and whose update is `i++` on the same identifier. It
  does not check types, value ranges, aliasing, or reachability.
rule:
  pattern: 'for ($I = $_; $I > 0; $I++) $BODY'
