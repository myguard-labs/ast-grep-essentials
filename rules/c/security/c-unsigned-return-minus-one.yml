id: c-unsigned-return-minus-one
language: c
severity: warning
message: >-
  Function with an unsigned return type returns literal -1 without an explicit
  cast.
note: >-
  Syntactic check only. It matches a function whose declared return type is
  literally size_t and whose return statement is literally -1; it does not
  resolve typedefs, macros, or other unsigned types.
rule:
  all:
    - pattern: 'return -1;'
    - inside:
        kind: function_definition
        has:
          field: type
          regex: '^size_t$'
        stopBy: end
