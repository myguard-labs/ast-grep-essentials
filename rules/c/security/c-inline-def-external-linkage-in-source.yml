id: c-inline-def-external-linkage-in-source
language: c
severity: warning
message: >-
  Function defined with inline but without static or extern may lack an
  external definition for linking.
note: >-
  Syntactic check only. Flags function definitions whose declaration
  specifiers include inline and no static or extern storage class; it does not
  resolve whether a matching external definition exists elsewhere in the
  program or verify the translation unit's language mode.
rule:
  kind: function_definition
  all:
    - has:
        kind: storage_class_specifier
        regex: '^inline$'
        stopBy: end
    - not:
        has:
          kind: storage_class_specifier
          regex: '^(static|extern)$'
          stopBy: end
