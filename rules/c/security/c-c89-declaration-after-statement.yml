# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-c89-declaration-after-statement
language: c
severity: warning
message: 'Declaration appears after an executable statement; this is not valid in C89.'
note: >-
  Syntactic check only; it matches declarations that follow an expression
  statement in the same block and does not know whether the build targets C89
  or C99.
rule:
  kind: declaration
  inside:
    kind: compound_statement
    stopBy: neighbor
  follows:
    kind: expression_statement
    stopBy: end
