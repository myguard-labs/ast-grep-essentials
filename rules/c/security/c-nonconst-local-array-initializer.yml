id: c-nonconst-local-array-initializer
language: c
severity: warning
message: >-
  Local array initializer contains a binary expression element, which C89
  rejects when non-constant.
note: >-
  Syntactic approximation only. It flags a local array brace initializer with
  a direct binary expression element, without checking whether operands are
  constant, the language standard in use, or any types.
rule:
  kind: init_declarator
  all:
    - has:
        field: declarator
        kind: array_declarator
    - has:
        field: value
        kind: initializer_list
        has:
          kind: binary_expression
