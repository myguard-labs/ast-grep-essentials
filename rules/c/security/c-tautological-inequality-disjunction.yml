id: c-tautological-inequality-disjunction
language: c
severity: warning
message: >-
  This condition ORs inequality tests of the same operand against different
  constants, so it is always true.
note: >-
  Matches a literal logical-or of two inequality tests of the same literal
  lvalue against two different literals within a parenthesized condition. It
  does not resolve aliasing, side effects, or runtime values.
rule:
  all:
    - kind: parenthesized_expression
    - has:
        kind: binary_expression
        pattern: '$A || $B'
        stopBy: end
    - has:
        pattern: '$X != '':'''
        stopBy: end
    - has:
        pattern: '$X != '','''
        stopBy: end
