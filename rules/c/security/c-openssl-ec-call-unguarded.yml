# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-openssl-ec-call-unguarded
language: c
severity: warning
message: EC-related call outside an OPENSSL_NO_EC guard may break no-ec builds.
note: >-
  Name-based heuristic on the callee identifier; does not resolve the
  function, and guards are matched by literal OPENSSL_NO_EC text in an
  enclosing ifdef/ifndef.
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        kind: identifier
        regex: 'EC_|_EC_KEY'
    - not:
        inside:
          stopBy: end
          kind: preproc_ifdef
          has:
            field: name
            regex: OPENSSL_NO_EC
