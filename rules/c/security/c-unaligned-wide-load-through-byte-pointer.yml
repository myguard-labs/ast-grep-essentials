# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-unaligned-wide-load-through-byte-pointer
language: c
severity: warning
message: >-
  Dereference of a byte pointer cast to a wide unsigned integer pointer may be
  an unaligned load.
note: >-
  Purely syntactic match on a unary dereference of a cast to a wide unsigned
  integer pointer type; it does not check alignment, aliasing, or the
  pointer's actual origin, so aligned buffers will produce false positives.
rule:
  pattern: '*(unsigned long long *)$P'
