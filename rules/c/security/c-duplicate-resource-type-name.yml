id: c-duplicate-resource-type-name
language: c
severity: warning
message: >-
  Duplicate resource type name literal passed to
  zend_register_list_destructors_ex in sibling statements.
note: >-
  Matches sibling statements with the same literal text; does not prove same
  function in all cases or resolve macros.
rule:
  pattern: '$A = zend_register_list_destructors_ex($D, $N, $S, $M);'
  precedes:
    stopBy: end
    pattern: '$B = zend_register_list_destructors_ex($D2, $N2, $S, $M2);'
constraints:
  S:
    kind: string_literal
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
  created_at: '2026-10-19'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-694'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/694.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "void f(void) { le_a = zend_register_list_destructors_ex(da, NULL, NAME, m); le_b = zend_register_list_destructors_ex(db, NULL, NAME, m); }"
    - "void f(void) { int le_a = zend_register_list_destructors_ex(d, NULL, \"x\", 1); int le_b = zend_register_list_destructors_ex(d, NULL, \"x\", 1); }"
