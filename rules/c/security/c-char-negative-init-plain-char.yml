id: c-char-negative-init-plain-char
language: c
severity: warning
message: >-
  Plain char declaration initialized with a negative integer literal;
  signedness is implementation-defined. Consider signed char.
note: >-
  Single-file syntactic match on a local declaration whose type is the bare
  char keyword and whose initializer is a unary minus on a number literal.
  Does not resolve typedefs, target signedness, or whether the variable is
  used in a way that matters.
rule:
  all:
    - pattern: 'char $NAME = -1'
    - not:
        has:
          kind: type_qualifier
          stopBy: end
