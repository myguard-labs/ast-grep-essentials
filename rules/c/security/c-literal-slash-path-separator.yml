id: c-literal-slash-path-separator
language: c
severity: warning
message: >-
  Literal '/' written into a buffer; consider using PHP_DIR_SEPARATOR for
  portable path separators.
note: >-
  Purely syntactic match on an assignment of a literal '/' character to a
  subscripted element. It does not verify that the buffer is a path or that
  the write is a path separator; a literal slash used for other purposes will
  also match.
rule:
  pattern: '$BUF[$IDX] = ''/'''
