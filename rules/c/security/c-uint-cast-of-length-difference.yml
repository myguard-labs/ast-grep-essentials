id: c-uint-cast-of-length-difference
language: c
severity: warning
message: >-
  A 32-bit unsigned integer cast is applied directly to a subtraction, which
  may truncate a larger size or length difference.
note: >-
  Syntactic check only. It matches a literal unsigned int cast around a binary
  subtraction and does not verify value ranges, types of the operands, or
  whether the result is guarded before use.
rule:
  pattern: '(unsigned int) ($A - $B)'
