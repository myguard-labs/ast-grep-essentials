id: c-post-loop-counter-index-write
language: c
severity: warning
message: >-
  Array is written at the loop counter right after the loop, which may be one
  past the end.
note: >-
  Syntactic match only. It does not check that the loop bound equals the array
  size or that the counter was declared outside the loop.
rule:
  all:
    - pattern: '$ARR[$I] = $V;'
    - follows:
        pattern: 'for ($I = $A; $I < $N; $I++) $BODY'
