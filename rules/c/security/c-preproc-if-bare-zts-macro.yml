id: c-preproc-if-bare-zts-macro
language: c
severity: warning
message: >-
  #if on a bare identifier silently evaluates to 0 when undefined; consider
  #ifdef.
note: >-
  Matches syntax only; cannot tell whether the macro is intentionally defined
  to 0 or 1.
rule:
  kind: preproc_if
  has:
    field: condition
    kind: identifier
