id: c-sprintf-into-sized-alloc
language: c
severity: warning
message: >-
  sprintf writes into a buffer sized by a separate allocation expression; use
  a bounded or allocation-aware formatter.
note: >-
  Syntactic match only. Matches a literal sprintf call whose destination is a
  variable; it does not verify that the buffer was allocated with emalloc or
  malloc, nor that the computed size is wrong.
rule:
  pattern: 'sprintf($BUF, $$$ARGS)'
