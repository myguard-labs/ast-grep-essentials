id: c-num-args-guard-skips-argc
language: c
severity: warning
message: >-
  This else-if guard tests only !ZEND_NUM_ARGS() and does not consult the
  parsed argc.
note: >-
  Purely syntactic; it does not verify that an argc variable exists in the
  enclosing function or that the counts diverge.
rule:
  all:
    - pattern: 'if (!ZEND_NUM_ARGS()) $S'
    - inside:
        kind: else_clause
