id: c-hash-find-user-string-key-not-symtable
language: c
severity: warning
message: >-
  zend_hash_find is called with a string offset from Z_STRVAL; numeric-string
  keys are not normalised here, so use zend_symtable_find instead.
note: >-
  Purely syntactic match on a zend_hash_find call whose key argument is
  Z_STRVAL_P(...). It does not verify the offset is user-supplied, the hash
  type, or whether normalisation is needed at runtime.
rule:
  pattern: 'zend_hash_find($HT, Z_STRVAL_P($OFF), $$$ARGS)'
