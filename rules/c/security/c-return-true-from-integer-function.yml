id: c-return-true-from-integer-function
language: c
severity: warning
message: >-
  Returning the macro true from a function with a non-bool integer return
  type; verify a boolean value was intended.
note: >-
  Purely syntactic check. It matches a return of the literal identifier true
  inside a function definition whose type specifier text begins with an
  integer keyword. It does not resolve typedefs, macros, or the true
  definition, and it cannot tell whether a 0/1 flag is intended.
rule:
  all:
    - pattern: 'return true;'
    - inside:
        kind: function_definition
        stopBy: end
        has:
          field: type
          regex: '^(unsigned|signed|int|short|long|char)'
