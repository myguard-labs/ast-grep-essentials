id: c-empty-parens-function-definition
language: c
severity: warning
message: >-
  Function definition declares an empty parameter list instead of (void),
  leaving its parameters unprototyped.
note: >-
  Matches a syntactic function definition whose parameter list is literally
  empty; it does not resolve calls, declarations elsewhere, or whether the
  function is intended to take no arguments.
rule:
  kind: function_definition
  has:
    field: declarator
    kind: function_declarator
    has:
      field: parameters
      kind: parameter_list
      not:
        has:
          kind: parameter_declaration
