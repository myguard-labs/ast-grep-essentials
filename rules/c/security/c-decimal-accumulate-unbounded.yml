# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-decimal-accumulate-unbounded
language: c
severity: warning
message: Decimal digit accumulation without a preceding bound check may overflow.
note: >-
  Syntactic only. Any earlier if statement in the same block counts as a
  guard, without checking that it compares this variable or that it bounds it
  correctly.
rule:
  pattern: '$V = $V * 10 + ($C - ''0'');'
  not:
    follows:
      kind: if_statement
      stopBy: end
