id: c-unprototyped-empty-param-decl
language: c
severity: warning
message: >-
  Function declared with an empty parameter list `()` instead of `(void)`;
  pre-C23 this leaves arguments unchecked.
note: >-
  Syntactic match only on function declarations whose parameter list is
  literally empty. It does not resolve types, definitions elsewhere, or the C
  language standard in effect; it cannot confirm whether a declaration is a
  prototype-less function at build time.
rule:
  kind: function_declarator
  all:
    - has:
        field: declarator
        kind: identifier
    - not:
        has:
          kind: parameter_list
          has:
            kind: parameter_declaration
    - has:
        field: parameters
        kind: parameter_list
        not:
          has:
            kind: parameter_declaration
