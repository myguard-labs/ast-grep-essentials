id: c-logical-or-same-operand-unequal-constants
language: c
severity: warning
message: >-
  This logical OR compares the same identifier with != against two different
  number literals, so the condition is always true.
note: >-
  Purely syntactic check on a single C expression. It matches a binary ||
  whose both sides are != comparisons of the same identifier against different
  number literals. It does not resolve types, macros, aliasing, or runtime
  values.
rule:
  kind: binary_expression
  all:
    - has:
        field: operator
        regex: '^\|\|$'
    - has:
        field: left
        kind: binary_expression
        all:
          - has:
              field: operator
              regex: '^!=$'
          - has:
              field: right
              kind: number_literal
    - has:
        field: right
        kind: binary_expression
        all:
          - has:
              field: operator
              regex: '^!=$'
          - has:
              field: right
              kind: number_literal
