# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-advance-bounds-check-fails-open
language: c
severity: warning
message: >-
  Pointer is advanced before a less-than bounds check combined with && to a
  dereference; an advance past the end is not reported as failure.
note: >-
  Purely syntactic match on a pre-increment inside an if-condition with a <
  comparison joined by && to a dereference. It does not resolve types,
  aliasing, or whether the pointer is actually out of range at runtime.
rule:
  pattern: 'if (++$P < $END && $$$REST) $$$BODY'
