id: c-array-count-divides-by-pointer-size
language: c
severity: warning
message: >-
  Element count is computed by dividing sizeof an array by sizeof(void *);
  this is wrong unless the element type is pointer-sized.
note: >-
  Purely syntactic match on a binary division whose left operand is
  sizeof(...) and whose right operand is the literal sizeof(void *). It does
  not resolve the array's element type or types of the operands, so it may
  flag intentional pointer-size computations.
rule:
  pattern: 'sizeof($ARR) / sizeof(void *)'
