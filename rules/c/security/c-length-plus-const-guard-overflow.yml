id: c-length-plus-const-guard-overflow
language: c
severity: warning
message: >-
  Length-plus-constant guard may wrap on attacker-controlled length; compare
  with the constant moved to the other side.
note: >-
  Syntactic match only on an if-condition whose left side is an identifier
  plus an integer literal compared with > (no >= arm). It does not prove the
  length is attacker-controlled or that wrap is reachable; many such guards
  are safe, so review each hit.
rule:
  pattern: 'if ($LEN + 20 > $EXPR) $$$BODY'
