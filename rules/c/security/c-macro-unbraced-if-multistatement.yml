id: c-macro-unbraced-if-multistatement
language: c
severity: warning
message: >-
  Macro body starts with an unbraced if followed by another statement; only
  the first statement is conditional.
note: >-
  Text-based check on the raw macro body. It does not parse the body or check
  how the macro is used.
rule:
  kind: preproc_arg
  regex: '^\s*if\s*\([^{}]*;\s*[^\s\\]'
