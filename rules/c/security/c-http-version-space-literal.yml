# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-http-version-space-literal
language: c
severity: warning
message: >-
  This string literal looks like an HTTP version spelled with a space instead
  of a slash.
note: >-
  Matches only the literal string text shape HTTP followed by a space and a
  digit in a single C string node. It does not check whether the string is
  used as an HTTP version token, and it does not resolve types, aliases, or
  data flow.
rule:
  kind: string_literal
  regex: '^"HTTP [0-9]'
