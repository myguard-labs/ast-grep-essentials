id: c-hash-index-loop-over-count
language: c
severity: warning
message: >-
  Hash entry read by integer key inside a for loop bounded by
  zend_hash_num_elements; iterate by position instead.
note: >-
  Syntactic match only. It checks a for loop whose condition calls
  zend_hash_num_elements on a hash and whose body calls zend_hash_index_find
  on the same hash expression. It does not verify key sequencing, aliasing,
  types, or runtime values.
rule:
  kind: for_statement
  all:
    - has:
        pattern: 'zend_hash_index_find(Z_ARRVAL_P(array), $IDX, $$$REST)'
        stopBy: end
    - has:
        pattern: 'zend_hash_num_elements(Z_ARRVAL_P(array))'
        stopBy: end
