id: c-preprocessor-bare-feature-macro-if
language: c
severity: warning
message: 'Use defined(MACRO) instead of a bare identifier in an if directive.'
note: >-
  Matches only an if directive whose entire condition is a single identifier;
  does not detect bare identifiers inside larger expressions or whether the
  macro is defined.
rule:
  all:
    - kind: preproc_if
    - has:
        field: condition
        kind: identifier
