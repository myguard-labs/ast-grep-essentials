# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-dtor-call-commented-out
language: c
severity: warning
message: >-
  A zval_ptr_dtor() call appears to be commented out; review the disabled
  cleanup.
note: >-
  Matches comment text syntactically inside a function body; it does not
  verify the comment held real code or whether a leak exists.
rule:
  kind: comment
  regex: '^//.*zval_ptr_dtor\s*\('
  inside:
    kind: function_definition
    stopBy: end
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
