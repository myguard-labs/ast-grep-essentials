id: c-error-report-falls-through
language: c
severity: warning
message: 'Error is reported but the if-block does not return; execution falls through.'
note: >-
  Syntactic only; checks direct statements of the block for a named error call
  and no return statement. It does not detect goto or exit and cannot know
  whether continuing is intentional.
rule:
  kind: compound_statement
  inside:
    kind: if_statement
    field: consequence
  all:
    - has:
        kind: expression_statement
        has:
          kind: call_expression
          has:
            field: function
            kind: identifier
            regex: '^(php_error|zend_error|php_error_docref)$'
    - not:
        has:
          kind: return_statement
