id: c-fatal-null-lookup-masks-pending-exception
language: c
severity: warning
message: >-
  A NULL lookup result leads straight to a fatal E_ERROR with no EG(exception)
  check, which may mask a pending exception.
note: >-
  Syntactic only. Matches an assignment from a call immediately followed by if
  (!var) calling zend_error_noreturn(E_ERROR, ...). It cannot tell whether an
  exception is actually pending at runtime.
rule:
  all:
    - pattern: 'if (!$V) { $$$BODY }'
    - has:
        stopBy: end
        pattern: 'zend_error_noreturn(E_ERROR, $$$ARGS)'
    - follows:
        pattern: '$V = $F($$$CALLARGS);'
