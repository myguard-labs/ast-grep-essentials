# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-bounds-sum-compare-overflow
language: c
severity: warning
message: >-
  This bounds check compares a sum of two identifiers with a third identifier;
  the sum can overflow before the comparison, so review the clamp.
note: >-
  Purely syntactic match on an if condition whose parenthesized sum of two
  identifiers is compared with > against a third identifier, with an
  assignment in the body. It does not resolve types, value ranges, or whether
  the operands can actually overflow.
rule:
  pattern: 'if (($A + $B) > $C) $BODY'
