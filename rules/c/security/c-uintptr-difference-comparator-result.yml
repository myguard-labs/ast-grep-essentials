# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-uintptr-difference-comparator-result
language: c
severity: warning
message: >-
  Return value is a difference of uintptr_t casts; unsigned wraparound can
  flip the sign when converted to int. Prefer an ordering expression such as
  (a > b) - (a < b).
note: >-
  Syntactic match only on a return statement whose expression is a subtraction
  of two uintptr_t casts. Does not resolve types, aliases, or whether the
  function is used as a comparator.
rule:
  pattern: 'return (uintptr_t) $A - (uintptr_t) $B;'
