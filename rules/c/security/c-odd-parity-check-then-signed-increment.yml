id: c-odd-parity-check-then-signed-increment
language: c
severity: warning
message: >-
  Parity-gated increment with no bound check in the body can overflow at the
  maximum value.
note: >-
  Purely syntactic. It does not check that the variable is signed, and any
  binary comparison or arithmetic in the body suppresses the match.
rule:
  all:
    - kind: if_statement
    - has:
        field: condition
        pattern: '(($X & 1) == 1)'
    - has:
        field: consequence
        has:
          pattern: '$X++'
          stopBy: end
    - not:
        has:
          field: consequence
          has:
            kind: binary_expression
            stopBy: end
