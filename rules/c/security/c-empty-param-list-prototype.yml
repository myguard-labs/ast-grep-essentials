id: c-empty-param-list-prototype
language: c
severity: warning
message: >-
  Function declared or defined with an empty parameter list; use (void) to
  declare no parameters.
note: >-
  Purely syntactic check for an empty parameter list written as (). It does
  not determine whether a declaration is a prototype elsewhere or resolve
  calls or types.
rule:
  kind: function_declarator
  all:
    - has:
        field: declarator
        regex: '^[A-Za-z_][A-Za-z0-9_]*$'
    - has:
        field: parameters
        kind: parameter_list
        not:
          has:
            kind: parameter_declaration
    - not:
        has:
          field: parameters
          regex: void
