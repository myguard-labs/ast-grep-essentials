id: c-type-punned-deref-cast
language: c
severity: warning
message: >-
  Dereferencing a pointer cast to a different scalar type may break strict
  aliasing; consider memcpy.
note: >-
  Matches the literal syntax *(T *) expr only. It does not check whether the
  pointed-to object actually has type T, nor resolve aliases or types.
rule:
  pattern: '*($T *) $E'
