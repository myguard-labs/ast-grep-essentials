id: c-shift-modulo-precedence
language: c
severity: warning
message: >-
  The shift count is an unparenthesized modulo expression, so % binds before
  >> and the modulo applies to the count.
note: >-
  Single-file syntactic match on a right-shift whose right operand is a bare %
  binary expression. Does not verify operand types, value ranges, or whether
  the author intended this precedence.
rule:
  pattern: '$X >> $A % $B'
