id: c-quote-check-skips-escaping
language: c
severity: warning
message: >-
  This if condition checks both the first and last character for a quote
  before escaping, so an already-quoted value skips escaping.
note: >-
  Purely syntactic single-statement check on the literal condition shape; it
  does not resolve types, aliasing, or runtime values, and does not prove the
  value reaches a connection string unescaped.
rule:
  pattern: 'if ($A && $B) { escape(pw); }'
