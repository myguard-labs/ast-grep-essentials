id: c-asm-ebx-output-constraint
language: c
severity: warning
message: >-
  Inline asm output operand is bound to ebx, which can clobber the PIC GOT
  pointer on i386.
note: >-
  Matches the literal "=b" output constraint syntax only. It does not check
  the target architecture, whether PIC is enabled, or whether ebx is saved and
  restored.
rule:
  kind: gnu_asm_output_operand
  has:
    kind: string_literal
    regex: '^"[=+]&?b"$'
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
