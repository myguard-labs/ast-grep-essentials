id: c-tsrmls-dc-in-call-argument
language: c
severity: warning
message: >-
  TSRMLS_DC is a declaration-form macro used as a call argument; use TSRMLS_CC
  when passing the thread-safe context.
note: >-
  Purely syntactic check for a call whose last argument is the identifier
  TSRMLS_DC. It does not verify macro definitions, types, or whether the call
  is in a ZTS build.
rule:
  pattern: 'g(p TSRMLS_DC)'
