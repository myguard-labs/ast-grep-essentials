# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-size-narrowed-to-int
language: c
severity: warning
message: >-
  strlen() result is stored in a 32-bit int or unsigned int variable, which
  can truncate lengths above 2 GiB.
note: >-
  Syntactic single-file check for a literal strlen(...) call initializing an
  int or unsigned int declaration. It does not resolve typedefs, macros, or
  types beyond the literal spelling, and does not track later assignments or
  casts.
rule:
  pattern: 'int $VAR = strlen($$$ARGS);'
