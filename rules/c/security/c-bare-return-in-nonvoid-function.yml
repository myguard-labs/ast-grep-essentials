id: c-bare-return-in-nonvoid-function
language: c
severity: warning
message: >-
  Bare return statement inside a function whose declared return type is not
  void.
note: >-
  Syntactic match only on a bare return statement inside a function definition
  whose declared type text is not void; it does not resolve typedefs, macros,
  or whether the return is reachable.
rule:
  all:
    - pattern: 'return;'
    - inside:
        kind: function_definition
        stopBy: end
        pattern: 'static int f($$$PARAMS) { $$$BODY }'
