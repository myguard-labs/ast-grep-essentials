id: c-wrapper-method-used-not-inner-ssl
language: c
severity: warning
message: >-
  Method is read from the outer handle instead of the inner object that holds
  the real method table.
note: >-
  Single-file syntactic match on a literal outer receiver member chain ending
  in method->enc->export_keying; it does not verify that the outer and inner
  objects are related or that a local is derived from the outer handle.
rule:
  pattern: '$S->method->enc->export_keying($$$ARGS)'
