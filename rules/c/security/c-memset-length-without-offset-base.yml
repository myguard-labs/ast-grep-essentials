id: c-memset-length-without-offset-base
language: c
severity: warning
message: >-
  memset destination is a bare identifier while its length subtracts offset;
  verify the zeroed range starts at the intended base.
note: >-
  Purely syntactic heuristic on a literal memset call shape. It does not
  resolve types, aliasing, or whether offset is actually the intended base;
  review each match.
rule:
  kind: call_expression
  all:
    - pattern: 'memset($DEST, $VAL, $TOTAL - offset)'
    - has:
        field: arguments
        kind: argument_list
        has:
          kind: identifier
          pattern: '$DEST'
