id: c-function-def-empty-parens
language: c
severity: warning
message: >-
  Function definition uses empty parentheses instead of (void); the parameter
  list is unprototyped.
note: >-
  Single-file syntactic match on function definitions whose declarator has an
  empty parameter list. Does not resolve calls, types, or whether the function
  is declared elsewhere with a prototype.
rule:
  kind: function_definition
  has:
    kind: function_declarator
    field: declarator
    has:
      kind: parameter_list
      field: parameters
      pattern: '()'
