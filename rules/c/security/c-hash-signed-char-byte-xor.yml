# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-hash-signed-char-byte-xor
language: c
severity: warning
message: >-
  XOR with a byte read through a plain char pointer may sign-extend; consider
  unsigned char.
note: >-
  Syntactic only; matches a char pointer parameter in the same function and
  does not resolve aliases, local declarations, or typedefs.
rule:
  all:
    - pattern: '$H ^ (*$P++)'
    - inside:
        stopBy: end
        kind: function_definition
        has:
          stopBy: end
          kind: parameter_declaration
          all:
            - has:
                kind: primitive_type
                regex: '^char$'
            - has:
                kind: pointer_declarator
                has:
                  pattern: '$P'
