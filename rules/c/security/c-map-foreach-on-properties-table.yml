id: c-map-foreach-on-properties-table
language: c
severity: warning
message: >-
  ZEND_HASH_MAP_FOREACH_* is applied to a properties table returned by
  get_properties; this table may be packed, so use a generic iterator.
note: >-
  Syntactic match only on a literal get_properties call result used as the
  HashTable argument of ZEND_HASH_MAP_FOREACH_* in the same
  declaration-iteration shape. It does not resolve types, aliasing, or whether
  the table is actually packed at runtime.
rule:
  pattern: 'ZEND_HASH_MAP_FOREACH_STR_KEY(properties, $KEY)'
