id: c-tsrmls-dc-at-call-site
language: c
severity: warning
message: >-
  TSRMLS_DC (declaration form) is passed as a call argument; use TSRMLS_CC at
  call sites.
note: >-
  Purely syntactic check for a literal TSRMLS_DC identifier appearing as a
  direct argument of a call expression. It does not resolve macros, types, or
  whether the call target is a ZTS-aware function.
rule:
  pattern: '$F($$$ARGS, TSRMLS_DC)'
