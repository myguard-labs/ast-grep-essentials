  owasp: 'A10:2025'
  todo_cases:
    - 'FN: if (!MyG(error_msg)) return; if (y) { MyG(error_msg) = NULL; } ZVAL_STRING(retval, MyG(error_msg), 1); (nested reassignment between guard and call is not seen)'
    - 'FN: ZVAL_STRING(retval, (MyG(error_msg)), 1); (parenthesised source)'
