# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-zval-string-from-unguarded-member
language: c
severity: warning
message: >-
  ZVAL_STRING is given a struct member or global as its source without a
  visible guard; a NULL value will crash.
note: >-
  Syntactic single-file match on a ZVAL_STRING call whose second argument is a
  MyG(...) global call. A call is accepted when an earlier sibling statement
  is `if (!MyG(x))` or `if (MyG(x) == NULL)` and returns unconditionally with no `MyG(x) = ...;` between that guard and the call (sibling statements only; a nested reassignment is missed). It
  does not check enclosing if-tests for the same expression by type or
  dataflow, and cannot prove the value is actually NULL at runtime.
rule:
  all:
    - pattern: 'ZVAL_STRING($RET, MyG($FIELD), $FLAG)'
    - not:
        inside:
          kind: if_statement
          stopBy: end
    - not:
        inside:
          stopBy: end
          all:
            - follows:
                stopBy: end
                kind: if_statement
                all:
                  - has:
                      field: condition
                      has:
                        any:
                          - pattern: '!MyG($FIELD)'
                          - pattern: 'MyG($FIELD) == NULL'
                  - has:
                      field: consequence
                      any:
                        - kind: return_statement
                        - has:
                            kind: return_statement
            - not:
                follows:
                  stopBy:
                    kind: if_statement
                    all:
                      - has:
                          field: condition
                          has:
                            any:
                              - pattern: '!MyG($FIELD)'
                              - pattern: 'MyG($FIELD) == NULL'
                      - has:
                          field: consequence
                          any:
                            - kind: return_statement
                            - has:
                                kind: return_statement
                  pattern: 'MyG($FIELD) = $B;'
