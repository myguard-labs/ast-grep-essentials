id: c-zval-string-from-unguarded-member
language: c
severity: warning
message: >-
  ZVAL_STRING is given a struct member or global as its source without a
  visible guard; a NULL value will crash.
note: >-
  Syntactic single-file match on a ZVAL_STRING call whose second argument is a
  MyG(...) global call. It does not check enclosing if-tests for the same
  expression by type or dataflow, and cannot prove the value is actually NULL
  at runtime.
rule:
  all:
    - pattern: 'ZVAL_STRING($RET, MyG($FIELD), $FLAG)'
    - not:
        inside:
          kind: if_statement
          stopBy: end
