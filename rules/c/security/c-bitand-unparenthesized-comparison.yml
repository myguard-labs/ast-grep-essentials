id: c-bitand-unparenthesized-comparison
language: c
severity: warning
message: >-
  Bitwise-and operand is an unparenthesized equality comparison; the
  comparison binds first in C.
note: >-
  Syntactic check only. Matches a binary & whose right operand is a != or ==
  binary expression written without parentheses; does not resolve types or
  values.
rule:
  kind: binary_expression
  all:
    - has:
        field: operator
        regex: '^&$'
    - has:
        field: right
        kind: binary_expression
        has:
          field: operator
          regex: '^(!=|==)$'
