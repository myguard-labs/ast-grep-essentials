id: c-additive-ternary-precedence
language: c
severity: warning
message: >-
  An unparenthesized ?: conditional is the right operand of an addition, so
  the ternary binds looser than the addition.
note: >-
  Syntactic check only. Matches a compound assignment whose right-hand side is
  an addition with an unparenthesized conditional as its right operand; does
  not verify types or runtime values.
rule:
  pattern: '$L += $A + $COND ? $B : $C'
