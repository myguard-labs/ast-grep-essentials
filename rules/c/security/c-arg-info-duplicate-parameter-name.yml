id: c-arg-info-duplicate-parameter-name
language: c
severity: warning
message: Duplicate parameter name in ZEND_ARG_INFO entries.
note: >-
  Matches an arg-info call that follows an earlier sibling arg-info call with
  the same name argument. It does not verify that both lie in the same
  BEGIN/END block. The optional leading n tolerates literal backslash-n text
  glued to the macro name.
rule:
  pattern: '$F($A, $N)'
  follows:
    pattern: '$G($B, $N)'
    stopBy: end
constraints:
  F:
    regex: '^n?ZEND_ARG_INFO$'
  G:
    regex: '^n?ZEND_ARG_INFO$'
