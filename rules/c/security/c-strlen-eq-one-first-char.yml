id: c-strlen-eq-one-first-char
language: c
severity: warning
message: >-
  This if-chain reads the first byte only when the length equals one, so
  longer values fall through without a value.
note: >-
  Single-file syntactic match on an equality length test (n == 1) guarding an
  index-0 read; it does not verify types, aliasing, or that the else branch is
  absent in all control flows.
rule:
  pattern: |
    if ($N == 1) { $DST = $SRC[0]; } else if ($N == 0) { $$$BODY }
