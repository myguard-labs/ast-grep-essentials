id: c-instanceof-function-zval-deref
language: c
severity: warning
message: >-
  instanceof_function is passed a dereferenced zval expression where a class
  entry pointer is expected.
note: >-
  Matches the literal call shape instanceof_function(*arg, ...) with a unary
  dereference as the first argument. It does not resolve types, so it cannot
  confirm the dereferenced value is a zval or check other call forms.
rule:
  pattern: 'instanceof_function(*$ARG, $$$REST)'
