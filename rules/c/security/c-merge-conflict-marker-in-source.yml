# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-merge-conflict-marker-in-source
language: c
severity: error
message: Merge conflict marker found at the start of a line in C source.
note: >-
  Matches the file text syntactically by line-start marker; it cannot tell
  markers inside comments or string literals from real conflict markers.
rule:
  kind: translation_unit
  regex: '(?m)^(<<<<<<<|=======|>>>>>>>)'
