# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-out-param-clobbered-after-assign
language: c
severity: warning
message: >-
  Output parameter is assigned and later overwritten with NULL in the same
  block.
note: >-
  Matches the same literal dereferenced text in an earlier sibling store and a
  later NULL store. It does not check control flow, aliasing, or intervening
  reads.
rule:
  all:
    - pattern: '*$P = NULL;'
    - follows:
        pattern: '*$P = $V;'
        stopBy: end
