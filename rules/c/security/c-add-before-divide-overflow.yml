# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-add-before-divide-overflow
language: c
severity: warning
message: >-
  This divides a sum of the operand and its remainder by 2, so the addition
  can overflow before the division; consider (X / 2) + (X % 2).
note: >-
  Single-file syntactic match on the literal shape (X + X % 2) / 2 with
  identical operand text. It does not check types, value ranges, or whether
  the operand can actually approach the type maximum.
rule:
  pattern: '($X + $X % 2) / 2'
