id: c-bare-long-local-declaration
language: c
severity: warning
message: >-
  Local variable declared with bare type long; consider a fixed-width type
  such as int64_t or zend_long.
note: >-
  Syntactic match on a local declaration whose type is the literal keyword
  long. Does not check sizes, typedefs, or whether the value receives 64-bit
  API results; it is a single-file syntax claim only.
rule:
  pattern: 'long $NAME;'
  inside:
    kind: compound_statement
