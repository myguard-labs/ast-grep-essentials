id: c-exit-status-read-before-shutdown
language: c
severity: warning
message: >-
  Exit status is read before php_request_shutdown; shutdown handlers may
  change it.
note: >-
  Matches the syntactic ordering in one block only; does not verify that the
  shutdown call is the PHP one or that handlers modify the status.
rule:
  pattern: '$VAR = EG(exit_status);'
  precedes:
    stopBy: end
    pattern: 'php_request_shutdown($$$ARGS);'
