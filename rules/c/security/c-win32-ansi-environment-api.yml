# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-win32-ansi-environment-api
language: c
severity: warning
message: >-
  Call to GetEnvironmentStringsA, the ANSI environment-block API; consider the
  wide GetEnvironmentStringsW variant.
note: >-
  Syntactic match on the literal call name GetEnvironmentStringsA only. It
  does not verify codepage behavior, types, or whether the call is the Win32
  API rather than a user-defined function with the same name.
rule:
  pattern: 'GetEnvironmentStringsA()'
