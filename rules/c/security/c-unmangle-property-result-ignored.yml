id: c-unmangle-property-result-ignored
language: c
severity: warning
message: >-
  The int status of zend_unmangle_property_name is discarded as a bare
  statement; the out-pointer may be unset when the key is not mangled.
note: >-
  Syntactic check only. Matches a bare call expression statement to
  zend_unmangle_property_name; it does not verify the out-pointer is used
  afterwards or resolve types or aliases.
rule:
  pattern: 'zend_unmangle_property_name($$$ARGS);'
