id: c-logical-not-before-equality
language: c
severity: warning
message: >-
  Logical not is applied directly to the left operand of an equality
  comparison; the comparison is made on the boolean result.
note: >-
  Purely syntactic match on a unary logical not as the literal left operand of
  == or != with a right-hand side. It does not resolve types or confirm the
  right-hand side is a constant, and parenthesized forms such as !(t == 3) are
  not matched.
rule:
  pattern: '!$X == $C'
