id: c-loadlibrary-handle-leak-early-return
language: c
severity: warning
message: >-
  Early return after a NULL GetProcAddress result does not call FreeLibrary on
  the loaded library handle.
note: >-
  This is a syntactic check of a NULL-check block that returns and whose text
  never mentions FreeLibrary, placed after a GetProcAddress declaration. It
  does not track the handle's dataflow or aliasing, and it does not see
  cleanup done elsewhere, such as at goto labels or in wrappers.
rule:
  all:
    - pattern: 'if ($P == NULL) { $$$BODY }'
    - has:
        kind: return_statement
        stopBy: end
    - not:
        regex: FreeLibrary
    - follows:
        pattern: 'FARPROC $P = GetProcAddress($$$GARGS);'
        stopBy: end
