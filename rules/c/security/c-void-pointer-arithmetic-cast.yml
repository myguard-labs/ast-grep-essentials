# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-void-pointer-arithmetic-cast
language: c
severity: warning
message: >-
  A void * cast is used directly as the left operand of + or -, which relies
  on GNU pointer arithmetic on void.
note: >-
  Matches the literal syntax of a parenthesized void * cast as the left
  operand of a binary + or -. It does not resolve types, aliases, or whether
  the cast expression is actually a pointer at runtime.
rule:
  pattern: '(void *)$A + $B'
