id: c-prototype-definition-arity-mismatch
language: c
severity: warning
message: >-
  Function definition has parameters but an earlier prototype of the same name
  declares (void).
note: >-
  Syntactic only; covers the (void) prototype versus one-parameter definition
  case, not general arity comparison or macros.
rule:
  all:
    - pattern: '$T $F($P) { $$$B }'
    - follows:
        pattern: 'void $F(void);'
        stopBy: end
constraints:
  P:
    not:
      regex: '^void$'
