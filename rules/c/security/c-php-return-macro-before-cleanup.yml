# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-php-return-macro-before-cleanup
language: c
severity: warning
message: >-
  RETURN_* macro returns immediately, so the later efree call is unreachable
  and leaks.
note: >-
  Syntactic only; matches sibling statements by name and does not verify macro
  expansion or control flow.
rule:
  all:
    - kind: expression_statement
    - has:
        kind: call_expression
        has:
          field: function
          kind: identifier
          regex: '^RETURN_'
    - precedes:
        stopBy: end
        pattern: 'efree($$$ARGS);'
