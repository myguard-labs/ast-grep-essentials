id: c-stream-liveness-zero-timeout
language: c
severity: warning
message: >-
  php_stream_set_option is called with PHP_STREAM_OPTION_CHECK_LIVENESS and a
  literal 0 value, which is a zero timeout.
note: >-
  Syntactic single-call check on the literal argument text only; it does not
  resolve the stream, macro definitions, or runtime values.
rule:
  pattern: 'php_stream_set_option($S, PHP_STREAM_OPTION_CHECK_LIVENESS, 0, $$$REST)'
