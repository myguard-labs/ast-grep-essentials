id: c-left-shift-negative-literal
language: c
severity: warning
message: >-
  Left shift of a negated integer literal is undefined behaviour; use an
  unsigned constant such as ~0U.
note: >-
  Matches only the literal syntax of a negated numeric literal (optionally
  parenthesized) on the left of <<; it does not resolve macros, constants, or
  types.
rule:
  pattern: '$L << $X'
constraints:
  L:
    regex: '^\(*\s*-\s*[0-9][0-9a-zA-Z_.]*\s*\)*$'
