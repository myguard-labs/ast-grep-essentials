# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-address-of-member-minus-one
language: c
severity: warning
message: >-
  Address of a pointer member minus an integer forms a pointer before the
  enclosing object; review this step.
note: >-
  Single-file syntactic match on a literal address-of member access on a
  pointer minus an integer literal. It does not resolve types, member
  array-ness, or whether the resulting pointer is dereferenced.
rule:
  pattern: '&$P->$M - 1'
