id: c-inline-without-static-definition
language: c
severity: warning
message: >-
  File-scope inline function definition has neither static nor extern storage
  class.
note: >-
  Syntactic check only. It looks at the literal declaration specifiers of a
  top-level function definition and does not resolve linkage, other
  declarations of the same function, or compiler-specific inline semantics.
rule:
  all:
    - kind: function_definition
    - inside:
        kind: translation_unit
        stopBy: neighbor
    - has:
        kind: storage_class_specifier
        regex: '^inline$'
    - not:
        has:
          kind: storage_class_specifier
          regex: '^static$'
    - not:
        has:
          kind: storage_class_specifier
          regex: '^extern$'
