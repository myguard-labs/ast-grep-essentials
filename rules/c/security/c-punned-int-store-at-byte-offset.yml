id: c-punned-int-store-at-byte-offset
language: c
severity: warning
message: >-
  Integer store through a cast of a pointer-plus-offset expression may be a
  type-punned write; consider memcpy.
note: >-
  Syntactic match only on a literal cast of a pointer-plus-offset dereference
  assignment. It does not resolve types, aliasing, alignment, or whether the
  pointer really refers to a byte buffer.
rule:
  pattern: '*(int *) ($P + $K) = $V'
