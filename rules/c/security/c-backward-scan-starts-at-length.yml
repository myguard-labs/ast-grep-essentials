id: c-backward-scan-starts-at-length
language: c
severity: warning
message: >-
  This backward loop starts its pointer at base + len, one past the end of the
  buffer; dereferencing it reads out of bounds.
note: >-
  Purely syntactic. Matches a for-loop whose initializer assigns base + len
  (no - 1) to a pointer. Does not verify that len is the buffer length or that
  the pointer is dereferenced at that position at runtime.
rule:
  pattern: |
    for ($P = $BASE + $LEN; $$$HEAD) {
      $$$BODY
    }
