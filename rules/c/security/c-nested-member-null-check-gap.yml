id: c-nested-member-null-check-gap
language: c
severity: warning
message: >-
  A guard tests only the first-level member, but a later statement
  dereferences a deeper member that is not tested.
note: >-
  Syntactic only; it does not track aliasing, intervening assignments, or
  guards outside the shown sibling statements.
rule:
  all:
    - kind: expression_statement
    - follows:
        pattern: 'if (!$P->$A) $S'
        stopBy: end
    - has:
        pattern: '$P->$A->$B'
        stopBy: end
