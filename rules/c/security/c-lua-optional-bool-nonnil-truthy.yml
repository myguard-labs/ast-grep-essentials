id: c-lua-optional-bool-nonnil-truthy
language: c
severity: warning
message: >-
  Non-nil check on a Lua value enables a flag even when the value is an
  explicit false. Consider lua_toboolean.
note: >-
  Matches the literal if (!lua_isnil(...)) syntax only. It does not check that
  the value came from lua_getfield or that it is meant to be a boolean.
rule:
  pattern: 'if (!lua_isnil($L, $IDX)) $BODY'
