# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-line-comment-c89-portability
language: c
severity: warning
message: >-
  Line comment (//) is not legal under C89 or MSVC-old builds; use /* */
  instead.
note: >-
  Purely syntactic check for // line comments in a single C file. It cannot
  determine the build's language standard or target; reporting applies only
  where the project targets C89 or old MSVC.
rule:
  kind: comment
  regex: '^//'
