id: c-alloc-strlen-without-nul
language: c
severity: warning
message: 'Allocation size is exactly strlen(...) with no room for the NUL terminator.'
note: >-
  Matches the literal syntax malloc(strlen(x)) only; it does not check how the
  buffer is filled (e.g. memcpy of exact bytes may be fine) or resolve
  aliases.
rule:
  pattern: 'malloc(strlen($S))'
