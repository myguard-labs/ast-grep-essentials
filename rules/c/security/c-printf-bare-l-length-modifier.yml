# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-printf-bare-l-length-modifier
language: c
severity: warning
message: 'Format string contains a bare %l not followed by an integer conversion.'
note: >-
  Regex over the literal text only; does not check that the string is used as
  a printf format.
rule:
  kind: string_literal
  regex: '(^|[^%])(%%)*%[-+ #0-9.*]*l([^ldiuoxXn]|$)'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
