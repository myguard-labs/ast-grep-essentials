# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-non-void-function-without-return
language: c
severity: warning
message: This non-void function definition has no return statement in its body.
note: >-
  Single-file syntactic check only. It flags any non-void function definition
  whose body contains no return statement textually; it does not analyze
  control flow, reachability, or preprocessor-disabled code, and it cannot
  prove the value is used.
rule:
  all:
    - kind: function_definition
    - not:
        has:
          kind: primitive_type
          pattern: void
          stopBy: neighbor
    - not:
        has:
          kind: return_statement
          stopBy: end
    - has:
        kind: compound_statement
        stopBy: end
