id: c-opcode-rewrite-without-kind-check
language: c
severity: warning
message: >-
  Opcode of a previously emitted op is rewritten without first checking its
  current opcode.
note: >-
  Syntactic only. Matches assignments of the form X->opcode = ... with no
  enclosing if-check in the same file; it does not resolve types, aliasing, or
  whether the guard tests the same op.
rule:
  pattern: '$OP->opcode = $VAL'
  not:
    inside:
      kind: if_statement
      stopBy: end
