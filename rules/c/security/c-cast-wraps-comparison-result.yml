# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-cast-wraps-comparison-result
language: c
severity: warning
message: >-
  A cast is applied to a parenthesized comparison result; check whether the
  cast was meant to apply to the arithmetic operand.
note: >-
  Single-file syntactic match on a cast whose operand is a parenthesized
  relational comparison with an arithmetic left operand. It does not check
  types, value ranges, or intent.
rule:
  pattern: '(long)($A - $B < $C)'
