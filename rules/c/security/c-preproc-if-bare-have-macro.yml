id: c-preproc-if-bare-have-macro
language: c
severity: warning
message: >-
  Bare HAVE_ macro tested with if directive; consider ifdef for feature
  macros.
note: >-
  Syntactic hint only; it cannot tell whether the HAVE_ macro is defined with
  a numeric value.
rule:
  all:
    - kind: preproc_if
    - regex: '\A#\s*if[ \t]+HAVE_\w+[ \t]*\r?\n'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
