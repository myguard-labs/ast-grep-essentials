id: c-pointer-advance-goto-unbounded
language: c
severity: warning
message: >-
  Pointer is advanced by a length and the next statement is a goto, with no
  bounds comparison in between.
note: >-
  Purely syntactic. It checks only that the next sibling statement is a goto,
  and it cannot tell whether a bound was proven earlier or elsewhere. It may
  fire on safe code.
rule:
  all:
    - kind: expression_statement
    - has:
        pattern: '$P += $N'
    - precedes:
        kind: goto_statement
