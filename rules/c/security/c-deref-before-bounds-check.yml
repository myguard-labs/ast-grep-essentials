# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-deref-before-bounds-check
language: c
severity: warning
message: >-
  Pointer is dereferenced before the bounds comparison in a && condition;
  check the bound first.
note: >-
  Syntactic only. Matches a binary && expression whose left operand is a
  pointer dereference and whose right operand contains a less-than comparison;
  does not verify pointer types, aliasing, or that the pointer is actually out
  of range.
rule:
  pattern: '$DEREF && $BOUND'
  all:
    - has:
        pattern: '*$P'
        stopBy: end
        field: left
    - has:
        pattern: '$P < $END'
        stopBy: end
        field: right
