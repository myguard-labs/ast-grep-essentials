id: c-success-flag-set-after-unchecked-call
language: c
severity: warning
message: >-
  ZEND_TRY_ASSIGN_REF_TRUE follows a call assignment whose result is not
  tested, so the out-flag may report success on a failure path.
note: >-
  Syntactic only. Matches a ZEND_TRY_ASSIGN_REF_TRUE statement directly
  preceded by an assignment from a call expression statement, with no
  intervening if. It does not resolve whether the callee can fail or whether
  control flow guards the flag elsewhere.
rule:
  all:
    - pattern: 'ZEND_TRY_ASSIGN_REF_TRUE($$$ARGS);'
    - follows:
        pattern: '$VAR = $CALL($$$CARGS);'
        stopBy: neighbor
