# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: nginx-exit-check-missing-exiting
language: c
severity: warning
message: This exit check tests ngx_terminate and ngx_quit but not ngx_exiting.
note: >-
  Syntactic match on the literal identifiers ngx_terminate || ngx_quit in a
  condition without ngx_exiting; it does not resolve types, values, or whether
  the condition is in a worker loop.
rule:
  pattern: 'ngx_terminate || ngx_quit'
  not:
    inside:
      pattern: 'ngx_terminate || ngx_quit || ngx_exiting'
      stopBy: end
