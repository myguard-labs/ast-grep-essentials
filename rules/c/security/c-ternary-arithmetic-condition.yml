id: c-ternary-arithmetic-condition
language: c
severity: warning
message: >-
  The condition of this ternary is an unparenthesized additive expression, so
  the conditional applies to the whole sum. Verify the precedence is intended.
note: >-
  Single-file syntactic check only. It flags a conditional expression whose
  condition is a binary additive expression without parentheses; it does not
  verify intent, types, or runtime values.
rule:
  pattern: '$A + $B ? $X : $Y'
