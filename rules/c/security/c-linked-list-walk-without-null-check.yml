id: c-linked-list-walk-without-null-check
language: c
severity: warning
message: >-
  This empty-body for-loop walks a pointer via ->next with no NULL test in its
  condition; the search may dereference NULL if the target is absent.
note: >-
  Purely syntactic single-file match on a for-loop whose condition compares a
  pointer member (->tag != value) and whose update advances via ->next. It
  does not prove the pointer can be NULL at runtime, does not check for guards
  elsewhere in the function, and does not resolve types or aliasing.
rule:
  pattern: 'for (; $P->tag != $W; $P = $P->next);'
