id: c-keyform-option-type-char
language: c
severity: warning
message: >-
  Option with a keyform name uses type char 'F'; key formats should use 'f' so
  ENGINE is accepted.
note: >-
  Matches syntactically a 'F' char literal sharing a parent with a string
  literal containing keyform; does not verify the literal is in an OPTIONS
  table or its position.
rule:
  kind: char_literal
  regex: '^''F''$'
  inside:
    has:
      kind: string_literal
      regex: keyform
