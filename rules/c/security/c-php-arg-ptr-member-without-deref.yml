# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-php-arg-ptr-member-without-deref
language: c
severity: warning
message: >-
  Member access on an argN parameter without dereferencing it first; zval**
  needs (*argN)->value.
note: >-
  Name-based heuristic on argN identifiers; it does not check the actual
  declared type.
rule:
  pattern: '$A->value'
constraints:
  A:
    kind: identifier
    regex: '^arg[0-9]+$'
