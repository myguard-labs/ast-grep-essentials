id: c-int-cast-binds-to-product-in-float-sum
language: c
severity: warning
message: >-
  An integer cast applies only to the first operand of this multiplicative
  term inside an additive expression; the sum is truncated term by term.
note: >-
  Syntactic check only. Matches a cast expression that is the left operand of
  a multiplication which is itself a term of a binary addition. It does not
  verify types, that the sum is floating-point, or the runtime values
  involved.
rule:
  pattern: '(int)$A * $B + $C'
