id: c-syscall-ssize-return-in-int
language: c
severity: warning
message: >-
  A ssize_t-returning call result is assigned to a variable of type int, which
  can truncate byte counts.
note: >-
  Single-file syntactic match on a literal call to sendfile assigned to an
  identifier; it does not check the declared type of the variable via symbol
  resolution, so variables declared elsewhere or typedef'd as int are not
  verified.
rule:
  pattern: '$VAR = sendfile($$$ARGS)'
  inside:
    stopBy: end
    has:
      pattern: 'int $VAR;'
      kind: declaration
