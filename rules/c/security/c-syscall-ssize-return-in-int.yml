# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-syscall-ssize-return-in-int
language: c
severity: warning
message: >-
  A ssize_t-returning call result is assigned to a variable of type int, which
  can truncate byte counts.
note: >-
  Single-file syntactic match on a literal call to sendfile assigned to an
  identifier; it does not check the declared type of the variable via symbol
  resolution, so variables declared elsewhere or typedef'd as int are not
  verified.
rule:
  pattern: '$VAR = sendfile($$$ARGS)'
  inside:
    stopBy: end
    has:
      pattern: 'int $VAR;'
      kind: declaration
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-197|CWE-681'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/197.html|https://cwe.mitre.org/data/definitions/681.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'FN: comma declaration is missed, e.g. int n, m; m = sendfile(o, i, NULL, sz); (declaration text is not ''int $VAR;'')'
    - 'FN: initialized int declaration is missed, e.g. int n = 0; n = sendfile(o, i, NULL, sz);'
