id: c-constant-assign-then-contradicting-test
language: c
severity: warning
message: >-
  Variable is assigned a nonzero constant immediately before a condition
  testing its negation; the branch is dead.
note: >-
  Matches only adjacent statements syntactically; it does not track aliasing,
  macros, or other dataflow.
rule:
  all:
    - kind: if_statement
    - follows:
        pattern: '$V = $N;'
    - has:
        field: condition
        has:
          pattern: '!$V'
          stopBy: end
constraints:
  'N':
    regex: '^[1-9][0-9]*$'
