id: c-out-param-assigned-after-early-exit
language: c
severity: warning
message: >-
  Pointer out-parameter is written after an earlier conditional goto that may
  skip the write.
note: >-
  Syntactic only; does not verify that the pointer is a parameter or that the
  goto path is reachable.
rule:
  all:
    - kind: expression_statement
    - pattern: '*$P = $V;'
    - follows:
        stopBy: end
        kind: if_statement
        has:
          stopBy: end
          kind: goto_statement
