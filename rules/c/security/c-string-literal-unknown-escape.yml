# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-string-literal-unknown-escape
language: c
severity: warning
message: >-
  This C string literal has a backslash before a character that is not a valid
  escape letter, so the backslash is silently dropped.
note: >-
  Syntactic check on the literal's bytes only. It flags a backslash followed
  by a non-escape character inside a string literal and does not know whether
  the string is used as a regex or path.
rule:
  kind: string_literal
  regex: '(^|[^\\])(\\\\)*\\[^abfnrtv''"?\\xuU0-7]'
