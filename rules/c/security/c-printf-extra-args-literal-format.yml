id: c-printf-extra-args-literal-format
language: c
severity: warning
message: >-
  Format string literal has no conversion specifiers but extra arguments are
  passed.
note: >-
  Matches only the literal php_error_docref call syntax; it does not resolve
  macros or other printf-style wrappers.
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: identifier
        regex: '^php_error_docref$'
    - has:
        field: arguments
        kind: argument_list
        all:
          - has:
              nthChild: 3
              kind: string_literal
              regex: '^[^%]*$'
          - has:
              nthChild: 4
