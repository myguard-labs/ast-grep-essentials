id: c-cmsg-len-sizeof-buffer
language: c
severity: warning
message: >-
  cmsg_len is assigned a raw sizeof of a control buffer; compute it with
  CMSG_LEN(payload) instead.
note: >-
  Purely syntactic match on a literal cmsg.cm.cmsg_len assignment whose
  right-hand side is a sizeof expression. It does not resolve the struct type,
  the buffer contents, or whether the value is otherwise correct.
rule:
  pattern: 'cmsg.cm.cmsg_len = sizeof($$$ARGS)'
