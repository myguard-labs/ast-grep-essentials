id: nginx-queue-loop-advance-wrong-node
language: c
severity: warning
message: >-
  This queue for-loop advances with ngx_queue_next on an argument other than
  the loop cursor.
note: >-
  Syntactic match only. It checks that a for-loop step assigns the cursor from
  ngx_queue_next applied to a different expression, using the shown syntax. It
  does not resolve types, aliasing, or whether the argument is a list head or
  sentinel.
rule:
  kind: for_statement
  has:
    pattern: 'q = ngx_queue_next(&h->pushing)'
