id: c-abs-ternary-signed-negation
language: c
severity: warning
message: >-
  Ternary absolute value negates a signed operand; negating the type's minimum
  value is undefined behaviour.
note: >-
  Syntactic match only on a conditional X >= 0 ? X : -X with identical operand
  text. It does not check operand types or signedness, so the unsigned-cast
  fix is not distinguished by types and no value range is verified.
rule:
  pattern: '$X >= 0 ? $X : -$X'
