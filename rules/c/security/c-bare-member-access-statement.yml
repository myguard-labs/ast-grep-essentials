# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-bare-member-access-statement
language: c
severity: warning
message: >-
  This statement reads a pointer member and discards the value; it may be a
  half-finished assignment.
note: >-
  Syntactic match only: a expression statement whose sole expression is a `->`
  member access. It does not verify the member type, aliasing, or whether the
  read has side effects through volatile or macros.
rule:
  pattern: '$P->$F;'
