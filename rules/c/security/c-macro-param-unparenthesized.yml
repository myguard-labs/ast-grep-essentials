id: c-macro-param-unparenthesized
language: c
severity: warning
message: >-
  Macro parameter appears to be used bare as an operand; wrap it in
  parentheses.
note: >-
  Text-level heuristic on the raw macro body. It does not verify the
  identifier is actually a macro parameter and only checks the leading
  operand.
rule:
  kind: preproc_function_def
  has:
    kind: preproc_arg
    regex: '^\s*\(\s*[A-Za-z_]\w*\s*(!=|==|<=|>=|[-+*/%<>|&^]|\[)'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
