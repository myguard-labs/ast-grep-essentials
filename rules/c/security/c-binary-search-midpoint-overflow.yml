id: c-binary-search-midpoint-overflow
language: c
severity: warning
message: >-
  Midpoint computed as (a + b) / 2 can overflow before the division; prefer a
  + (b - a) / 2.
note: >-
  Purely syntactic match on a division by 2 of a parenthesized addition. It
  does not verify that operands are indices, signed, or used in a binary
  search, and cannot rule out overflow-safe ranges or types.
rule:
  pattern: '($A + $B) / 2'
