id: c-inline-asm-percent-equals-local-label
language: c
severity: warning
message: >-
  Inline asm template uses the GCC-specific %= operand; prefer portable
  numeric local labels (Nf/Nb).
note: >-
  Matches the literal %= text in a string inside a GNU asm expression; it does
  not check whether the use forms a label.
rule:
  kind: string_literal
  regex: '%='
  inside:
    kind: gnu_asm_expression
    stopBy: end
