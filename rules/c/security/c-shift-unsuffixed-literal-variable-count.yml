id: c-shift-unsuffixed-literal-variable-count
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-shift-signed-literal-one. Left shift of the signed literal 1 by a
  non-constant count may be undefined behavior.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use c-shift-signed-literal-one and do not emit this rule.
rule:
  pattern: '1 << $BIT'
metadata:
  deprecated_alias_of: c-shift-signed-literal-one
  rule_modified_at: '2026-11-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
