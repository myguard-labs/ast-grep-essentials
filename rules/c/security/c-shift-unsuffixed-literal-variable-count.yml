id: c-shift-unsuffixed-literal-variable-count
language: c
severity: warning
message: >-
  Unsuffixed integer literal 1 is shifted by a variable count; the shift is
  performed in int and may overflow or truncate.
note: >-
  Purely syntactic match on a literal 1 as the left operand of a left shift
  with an identifier right operand. Does not resolve types, constness of the
  variable, or whether the result is widened before the shift.
rule:
  pattern: '1 << $I'
