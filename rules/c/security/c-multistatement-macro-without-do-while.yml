id: c-multistatement-macro-without-do-while
language: c
severity: warning
message: >-
  Function-like macro has multiple statements but is not wrapped in do { }
  while (0).
note: >-
  Syntactic only; matches the definition text, not whether any use site is an
  unbraced if or loop body. Semicolons in strings or comments may miscount.
rule:
  kind: preproc_function_def
  all:
    - has:
        field: value
        kind: preproc_arg
        regex: ';[^;]*;'
    - not:
        has:
          field: value
          kind: preproc_arg
          regex: '^\s*do\b'
