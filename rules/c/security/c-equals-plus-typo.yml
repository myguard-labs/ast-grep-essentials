id: c-equals-plus-typo
language: c
severity: warning
message: >-
  Possible typo for += here; this assignment overwrites the left operand with
  a unary plus of the right operand.
note: >-
  Single-file syntactic match on the literal =+ token sequence in an
  assignment whose right operand is a unary plus. It does not resolve types,
  aliasing, or whether the author intended plain assignment.
rule:
  pattern: '$LHS =+ $RHS'
