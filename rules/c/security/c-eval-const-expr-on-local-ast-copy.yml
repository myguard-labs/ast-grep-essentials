# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-eval-const-expr-on-local-ast-copy
language: c
severity: warning
message: >-
  A local copy of an AST child is passed by address to zend_eval_const_expr,
  so the parent's child pointer may become stale.
note: >-
  Matches only the same-block syntactic shape, a local declared from
  ast->child[N] and later passed as &local. It does not check whether the
  result is written back or whether the callee replaces the node.
rule:
  pattern: 'zend_eval_const_expr(&$A);'
  follows:
    pattern: 'zend_ast *$A = ast->child[$I];'
    stopBy: end
