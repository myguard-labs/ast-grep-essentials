id: c-html-literal-bare-ampersand
language: c
severity: warning
message: 'String literal in a table-header print call contains a bare ''&''; use &amp;.'
note: >-
  Syntactic only; flags '&' not followed by an entity-like sequence inside a
  string literal under a php_info_print_table_header call. Does not validate
  entity names or runtime output.
rule:
  kind: string_literal
  regex: '&([^#a-zA-Z0-9]|"$)'
  inside:
    stopBy: end
    regex: '^php_info_print_table_header\s*\('
