id: c-base64-space-remapped-to-plus
language: c
severity: warning
message: >-
  This if-statement remaps a space character to '+', which silently accepts
  input the base64 spec forbids.
note: >-
  Purely syntactic single-file match on an if-statement comparing a identifier
  to a space literal whose body assigns '+' to that same identifier. It does
  not check types, aliasing, or whether the variable is a decoder input.
rule:
  kind: if_statement
  all:
    - has:
        pattern: '$CH == '' '''
        stopBy: end
    - has:
        pattern: '$CH = ''+'''
        stopBy: end
