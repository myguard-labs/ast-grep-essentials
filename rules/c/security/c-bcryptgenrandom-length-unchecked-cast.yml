# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-bcryptgenrandom-length-unchecked-cast
language: c
severity: warning
message: >-
  BCryptGenRandom length argument is a bare identifier; check it is not
  silently truncated to ULONG.
note: >-
  Syntactic only. Matches a literal BCryptGenRandom call whose third argument
  is a bare identifier; the cast-wrapped form is not matched. Does not check
  identifier types, so ULONG-typed variables will also match and need manual
  review.
rule:
  pattern: 'BCryptGenRandom(NULL, $BUF, $LEN, 0)'
  not:
    pattern: 'BCryptGenRandom(NULL, $BUF, ($TYPE)$X, 0)'
