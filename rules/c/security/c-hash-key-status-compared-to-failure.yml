# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-hash-key-status-compared-to-failure
language: c
severity: warning
message: >-
  The return value of zend_hash_get_current_key_ex is compared against
  FAILURE; compare it against HASH_KEY_IS_STRING or the other key type
  constants instead.
note: >-
  Syntactic match only on a literal call with a literal FAILURE comparison;
  does not verify the hash table type, the key usage, or runtime values.
rule:
  pattern: 'zend_hash_get_current_key_ex($$$ARGS) == FAILURE'
