id: c-ctype-call-plain-char-arg
language: c
severity: warning
message: >-
  ctype classification call receives a dereferenced char without an (unsigned
  char) cast.
note: >-
  Matches the literal syntax only; it does not resolve the pointee type, so it
  cannot confirm the expression is a plain char.
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        regex: >-
          ^(isalnum|isalpha|isblank|iscntrl|isdigit|isgraph|islower|isprint|ispunct|isspace|isupper|isxdigit|tolower|toupper)$
    - has:
        field: arguments
        has:
          kind: pointer_expression
          regex: '^\*'
