id: c-bare-inline-external-linkage
language: c
severity: warning
message: >-
  Function definition uses bare inline without static or extern; verify an
  external definition exists elsewhere.
note: >-
  Syntactic check only. Matches a function definition whose specifiers include
  inline and lack static or extern; it cannot see whether an external
  definition exists in another translation unit.
rule:
  kind: function_definition
  all:
    - has:
        kind: storage_class_specifier
        regex: '^inline$'
    - not:
        has:
          kind: storage_class_specifier
          regex: '^static$'
    - not:
        has:
          kind: storage_class_specifier
          regex: '^extern$'
