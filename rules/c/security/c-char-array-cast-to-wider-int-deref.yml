# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-char-array-cast-to-wider-int-deref
language: c
severity: warning
message: >-
  A char array is cast to a wider integer pointer and dereferenced, reading
  its bytes as an integer.
note: >-
  Purely syntactic check for a literal char-array identifier cast to an
  integer pointer and dereferenced; it does not resolve declared types,
  aliasing, alignment, or endianness.
rule:
  pattern: '*(int *) $ARR'
  inside:
    kind: compound_statement
    stopBy: end
    has:
      pattern: 'char $ARR[$$$DIMS];'
