id: c-unprototyped-definition-empty-params
language: c
severity: warning
message: >-
  Function definition has an empty parameter list instead of (void) or typed
  parameters; argument checks are skipped before C23.
note: >-
  Syntactic match only on a function definition whose declarator has an empty
  parameter list. It does not resolve call sites, types, or whether the code
  targets C23.
rule:
  kind: function_definition
  has:
    kind: function_declarator
    field: declarator
    has:
      kind: parameter_list
      field: parameters
      pattern: '()'
