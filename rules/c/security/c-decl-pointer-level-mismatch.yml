id: c-decl-pointer-level-mismatch
language: c
severity: warning
message: >-
  Pointer declaration is initialized from a pointer-to-pointer cast without a
  dereference; verify the pointer level.
note: >-
  Syntactic match only. Matches a declaration whose initializer is a direct
  cast to a double-pointer type without a dereference; it does not resolve
  types, typedefs, or the value's actual pointer level.
rule:
  pattern: 'zval *zv = (zval **)$VALUE;'
