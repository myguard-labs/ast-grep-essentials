# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-dotdot-strstr-path-guard
language: c
severity: warning
message: >-
  This strstr(..., "..") check rejects any name containing two dots, not only
  real traversal segments; review the path validation.
note: >-
  Syntactic match on a literal strstr call with a literal ".." needle used as
  a boolean test. It does not resolve whether the first argument is a path,
  does not normalise paths, and does not establish whether traversal is
  actually possible.
rule:
  pattern: 'strstr($PATH, "..")'
