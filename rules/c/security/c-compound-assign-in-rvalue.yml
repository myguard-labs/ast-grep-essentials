id: c-compound-assign-in-rvalue
language: c
severity: warning
message: >-
  Compound assignment used as the right operand of another assignment; review
  the side effect on the operand.
note: >-
  Syntactic shape only. Matches a compound assignment (such as ^=) appearing
  directly as the right side of a plain assignment in one statement; it does
  not prove the mutated value is read incorrectly or resolve aliasing, types,
  or evaluation order.
rule:
  kind: assignment_expression
  all:
    - has:
        field: right
        kind: assignment_expression
        pattern: '$X ^= $Y'
    - pattern: '$LHS = $RHS'
