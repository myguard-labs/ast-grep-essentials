id: c-success-set-after-error-branch
language: c
severity: warning
message: >-
  An if-block reports an error without exiting, and a success assignment
  follows it.
note: >-
  Syntactic approximation only. Matches an if-block whose body calls
  report_error() with no return, goto, or break, followed by a RETVAL_TRUE;
  statement in the same block. Does not check types, dataflow, or
  reachability; review each hit since log-only branches may be intentional.
rule:
  all:
    - pattern:
        context: |
          if ($COND) {
            report_error();
          }
          RETVAL_TRUE;
        selector: if_statement
    - not:
        has:
          pattern: 'return $$$ARGS'
          stopBy: end
    - not:
        has:
          pattern: 'goto $LABEL'
          stopBy: end
    - not:
        has:
          pattern: break
          stopBy: end
