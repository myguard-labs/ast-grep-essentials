# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-merge-conflict-marker-committed
language: c
severity: error
message: Unresolved git merge conflict marker left in C source.
note: >-
  Relies on the parser producing an ERROR node that begins with a conflict
  marker; it does not detect markers the parser absorbs into valid syntax.
rule:
  kind: ERROR
  regex: '^(<<<<<<<|=======|>>>>>>>)'
