id: c-convert-helper-exception-unchecked
language: c
severity: warning
message: >-
  Conversion helper call is immediately followed by another statement without
  an EG(exception) check.
note: >-
  Syntactic only; it checks that the next sibling statement is a plain
  expression statement and does not verify that it consumes the converted
  value or that an exception check exists elsewhere.
rule:
  all:
    - kind: expression_statement
    - has:
        kind: call_expression
        regex: '^(convert_to_string|convert_to_long|zend_is_true)\s*\('
    - precedes:
        kind: expression_statement
