# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-hardcoded-dso-so-suffix
language: c
severity: warning
message: >-
  Macro value hardcodes the ".so" shared-object suffix; use the platform
  DSO_EXTENSION macro instead.
note: >-
  Matches only raw preprocessor macro values whose text ends in a string
  literal ending with .so. It does not check whether the value is really used
  as a module path. It does not see suffixes built at runtime or through other
  macros.
rule:
  kind: preproc_arg
  regex: '\.so"\s*$'
