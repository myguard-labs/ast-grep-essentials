# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-index-len-minus-one-unguarded
language: c
severity: warning
message: >-
  Index s[n - 1] in a condition with no preceding nonzero test of n in the
  same condition.
note: >-
  Syntactic only. Any enclosing && in the condition suppresses the match
  without checking that its left side tests the same n. Values and earlier
  guards are not analysed.
rule:
  all:
    - pattern: '$S[$N - 1]'
    - inside:
        kind: parenthesized_expression
        stopBy: end
    - not:
        inside:
          pattern: '$A && $B'
          stopBy: end
