# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-posix-unistd-macro-redefined
language: c
severity: warning
message: >-
  This macro definition reuses a POSIX unistd.h access-mode macro name and may
  collide with the system definition.
note: >-
  Matches the literal macro name syntactically; it does not check whether
  unistd.h is included or guarded by an ifndef.
rule:
  kind: preproc_def
  has:
    field: name
    kind: identifier
    regex: '^(X_OK|R_OK|W_OK|F_OK)$'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
