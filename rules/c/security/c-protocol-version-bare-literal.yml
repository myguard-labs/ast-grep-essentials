id: c-protocol-version-bare-literal
language: c
severity: warning
message: >-
  A bare numeric version string is assigned to http_version; use the full
  protocol form such as HTTP/1.1.
note: >-
  Single-file syntactic match on an assignment whose left side is the
  identifier http_version and whose right side is a string literal. The
  literal must be a bare digits-and-dots string, which is checked by a regex
  on the literal text. It does not resolve types, aliases, or runtime values.
rule:
  all:
    - kind: assignment_expression
    - has:
        field: left
        kind: identifier
        regex: '^http_version$'
    - has:
        field: right
        kind: string_literal
        regex: '^"[0-9]+(\.[0-9]+)*"$'
