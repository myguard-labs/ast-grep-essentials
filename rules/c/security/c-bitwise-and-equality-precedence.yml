# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-bitwise-and-equality-precedence
language: c
severity: warning
message: >-
  Bitwise & or | has an unparenthesized ==/!= comparison as its right operand,
  so the comparison is evaluated first.
note: 'Matches syntax only; it does not tell whether the precedence was intended.'
rule:
  all:
    - kind: binary_expression
    - has:
        field: operator
        regex: '^(&|\|)$'
    - has:
        field: right
        kind: binary_expression
        has:
          field: operator
          regex: '^(==|!=)$'
metadata:
