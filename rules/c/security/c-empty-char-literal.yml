# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-empty-char-literal
language: c
severity: warning
message: 'Empty character literal (two adjacent single quotes).'
note: >-
  Matches parse-error nodes whose text contains two adjacent single quotes; it
  does not verify the quotes are outside strings or comments, and the match
  may cover an enclosing error node.
rule:
  kind: ERROR
  regex: ''''''
