# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-memset-before-free-secret
language: c
severity: warning
message: >-
  memset to zero immediately before freeing the same buffer. The compiler is
  allowed to delete a store to memory that is dead at the end of its lifetime,
  and mainstream optimisers do exactly that, so the wipe often does not happen
  and key material survives in the freed chunk. Use explicit_bzero,
  OPENSSL_cleanse, or ngx_explicit_memzero, which are specified not to be
  optimised away.
note: >-
  The match requires the zeroing call and the free of the same identifier text
  to be adjacent sibling statements, which keeps it precise but blind to any
  wipe separated by other statements or hidden in a helper. The fill value
  must be written literally as 0 or the character literal '\0'; a zero passed
  through a macro, constant or variable is not recognised. Whether the buffer
  actually held a secret is not visible to syntax; a scratch buffer being
  cleared for hygiene is a legitimate dismissal, though switching to
  explicit_bzero costs nothing there either.
rule:
  kind: expression_statement
  any:
    - pattern: 'memset($P, 0, $N);'
    - pattern: 'memset($P, ''\0'', $N);'
    - pattern: 'ngx_memzero($P, $N);'
  precedes:
    kind: expression_statement
    any:
      - pattern: 'free($P);'
      - pattern: 'ngx_pfree($POOL, $P);'
