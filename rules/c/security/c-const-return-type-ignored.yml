id: c-const-return-type-ignored
language: c
severity: warning
message: A const qualifier on a by-value return type has no effect.
note: Syntactic only. It does not resolve typedefs that may hide a pointer type.
rule:
  kind: function_definition
  all:
    - has:
        kind: type_qualifier
        regex: '^const$'
    - has:
        field: declarator
        kind: function_declarator
