id: c-hash-apply-function-pointer-cast
language: c
severity: warning
message: >-
  Function is cast to a generic apply callback type in a hash apply call;
  review that the callback signature matches the hash element type.
note: >-
  Syntactic match only on a cast inside zend_hash_apply or
  zend_hash_apply_with_argument calls. It does not verify callback parameter
  types, element types, or whether the cast hides a real mismatch.
rule:
  pattern: '$FN($$$ARGS, (apply_func_arg_t) $CB, $$$REST)'
