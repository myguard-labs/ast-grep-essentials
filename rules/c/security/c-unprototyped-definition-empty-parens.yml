id: c-unprototyped-definition-empty-parens
language: c
severity: warning
message: >-
  Function definition uses an empty parameter list `()`; use `(void)` to
  declare that it takes no arguments.
note: >-
  Syntactic check only. Matches function definitions whose parameter list is
  literally empty; it does not verify calls, prototypes elsewhere in the
  translation unit, or macro-generated declarations.
rule:
  kind: function_definition
  has:
    field: declarator
    kind: function_declarator
    has:
      field: parameters
      kind: parameter_list
      pattern: '()'
