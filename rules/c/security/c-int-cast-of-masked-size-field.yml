id: c-int-cast-of-masked-size-field
language: c
severity: warning
message: >-
  An (int) cast is applied to a bitwise-NOT-masked expression, which may
  truncate large size-derived offsets.
note: >-
  Matches macro body text by regex because the C grammar leaves macro bodies
  unparsed; it does not verify the operand is a struct field or used as a
  block offset.
rule:
  kind: preproc_arg
  regex: '\(int\)\s*\(.*&\s*~'
