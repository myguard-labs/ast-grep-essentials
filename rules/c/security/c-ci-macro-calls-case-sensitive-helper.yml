id: c-ci-macro-calls-case-sensitive-helper
language: c
severity: warning
message: >-
  Macro named *_ci expands to a call to a helper whose name does not end in
  _ci.
note: >-
  Textual check of the macro body's leading call name; does not resolve
  whether the callee has a case-insensitive variant or whether the body is
  otherwise intended.
rule:
  kind: preproc_function_def
  all:
    - has:
        field: name
        regex: '_ci$'
    - has:
        field: value
        kind: preproc_arg
        regex: '^(\s|\\)*\w+\s*\('
    - not:
        has:
          field: value
          kind: preproc_arg
          regex: '^(\s|\\)*\w*_ci\s*\('
