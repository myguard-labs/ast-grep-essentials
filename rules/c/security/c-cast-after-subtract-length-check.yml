id: c-cast-after-subtract-length-check
language: c
severity: warning
message: >-
  A cast of a subtraction is used as a length bound; the subtraction may wrap
  before the cast.
note: >-
  Syntactic match only. It matches a cast applied to a parenthesized
  subtraction of an integer literal from an indexed or plain expression; it
  does not check operand types, value ranges, or whether the check is
  reachable or guarded.
rule:
  pattern: '(size_t)($X - $K)'
  inside:
    kind: binary_expression
    pattern: '$_ < $_'
    stopBy: end
