id: c-err-raise-lib-sys-in-ssl
language: c
severity: warning
message: >-
  ERR_raise or ERR_raise_data reports under ERR_LIB_SYS; review whether the
  library code is misattributed.
note: >-
  Matches the literal call syntax only; it does not check that the file is
  part of the TLS/SSL code or that the sys error is unintended.
rule:
  pattern: '$FN(ERR_LIB_SYS, $$$ARGS)'
constraints:
  FN:
    regex: '^ERR_raise(_data)?$'
