# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-hash-foreach-str-key-null
language: c
severity: warning
message: >-
  ZSTR_VAL or ZSTR_LEN applied to the hash key without a NULL test in an
  enclosing scope.
note: >-
  Syntactic only; it assumes the variable is named key, does not verify it is
  the iterator key, and does not check that a key == NULL guard is ordered
  earlier. Also accepted: a deref inside the consequence of if (key != NULL),
  and a deref following an if (!key) whose consequence returns, continues or
  breaks.
rule:
  all:
    - kind: call_expression
    - regex: '^ZSTR_(VAL|LEN)\(\s*key\s*\)$'
    - not:
        inside:
          stopBy: end
          has:
            stopBy: end
            pattern: 'key == NULL'
    - not:
        inside:
          stopBy: end
          kind: if_statement
          field: consequence
          has:
            field: condition
            regex: '^\(\s*key\s*(!=\s*NULL\s*)?\)$'
    - not:
        inside:
          stopBy: end
          follows:
            stopBy: end
            kind: if_statement
            all:
              - has:
                  field: condition
                  regex: '^\(\s*!\s*key\s*\)$'
              - has:
                  field: consequence
                  any:
                    - kind: return_statement
                    - kind: continue_statement
                    - kind: break_statement
                    - kind: compound_statement
                      has:
                        any:
                          - kind: return_statement
                          - kind: continue_statement
                          - kind: break_statement
