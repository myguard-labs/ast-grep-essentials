id: c-default-falls-through-into-case
language: c
severity: warning
message: >-
  This default group has statements but no break, so it falls into the next
  case.
note: >-
  Syntactic only; it checks direct children of the default group for a break
  and cannot tell intentional fallthrough, return/goto terminators, or nested
  terminators.
rule:
  all:
    - kind: case_statement
    - regex: '^default'
    - has:
        kind: expression_statement
    - precedes:
        kind: case_statement
        stopBy: neighbor
    - not:
        has:
          kind: break_statement
