id: c-member-access-after-free
language: c
severity: warning
message: >-
  Pointer is dereferenced with -> after being passed to free() in an earlier
  statement.
note: >-
  Syntactic statement-order check only; it does not detect reassignment
  between the free and the use, aliasing, or control flow. Only free() is
  matched.
rule:
  kind: expression_statement
  all:
    - has:
        pattern: '$P->$F'
        stopBy: end
    - follows:
        pattern: 'free($P);'
        stopBy: end
