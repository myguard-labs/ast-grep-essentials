# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-digit-accumulate-without-overflow-guard
language: c
severity: warning
message: >-
  Digit accumulation x = x * base + d inside a while loop with no earlier
  if-check in the same block may overflow.
note: >-
  Syntactic only; covers while loops, does not verify the accumulator type or
  that an earlier if actually compares it to a limit.
rule:
  all:
    - pattern: '$X = $X * $B + $D;'
    - inside:
        stopBy: end
        kind: while_statement
    - not:
        follows:
          stopBy: end
          kind: if_statement
