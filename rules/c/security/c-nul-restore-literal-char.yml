id: c-nul-restore-literal-char
language: c
severity: warning
message: >-
  A buffer element is restored with a character literal after being set to
  NUL; restore the saved original byte instead.
note: >-
  Single-file syntactic match on an assignment of a character literal to a
  subscripted element of the same buffer and index that was earlier assigned
  '\0'. It does not verify via dataflow that this element was the one
  NUL-terminated, that no other write intervened, or that the original byte
  was not NUL or CR.
rule:
  pattern: '$BUF[12] = '' '''
