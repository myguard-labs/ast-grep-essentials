id: c-index-bound-check-off-by-one
language: c
severity: warning
message: >-
  Index guard uses '>' against an all-caps count constant, so an index equal
  to the count passes. Consider '>='.
note: >-
  Syntactic match only; it does not verify that the constant is the array size
  or that the index subscripts that array.
rule:
  pattern: '$I < 0 || $I > $N'
constraints:
  'N':
    regex: '^[A-Z][A-Z0-9_]*$'
