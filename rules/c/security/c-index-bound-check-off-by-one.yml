# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-index-bound-check-off-by-one
language: c
severity: warning
message: >-
  Index guard uses '>' against an all-caps count constant, so an index equal
  to the count passes. Consider '>='.
note: >-
  Syntactic match only; it does not verify that the constant is the array size
  or that the index subscripts that array.
rule:
  pattern: '$I < 0 || $I > $N'
constraints:
  'N':
    regex: '^[A-Z][A-Z0-9_]*$'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
