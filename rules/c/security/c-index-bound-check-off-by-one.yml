  cwe: 'CWE-193'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/193.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "void f(int t) { if (t < 0 || t > 7) return; locks[t] = 0; }"
    - "void f(int t) { if (t < 0 || t > num_locks) return; locks[t] = 0; }"
    - "void f(int t) { if (t < 0 || (t > NUM_LOCKS)) return; locks[t] = 0; }"
    - "void f(int t) { if (bad(t) || t < 0 || t > NUM_LOCKS) return; locks[t] = 0; }"
