# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-zval-copy-property-without-deref
language: c
severity: warning
message: >-
  ZVAL_COPY source is a GET_PROPERTY(...) result without ZVAL_DEREF; a stored
  reference may be copied as a reference.
note: >-
  Syntactic match only. It matches a ZVAL_COPY whose second argument is
  directly a GET_PROPERTY call. It does not track variables, confirm that the
  property can hold a reference, or check for dereferencing elsewhere.
rule:
  pattern: 'ZVAL_COPY($DST, GET_PROPERTY($$$ARGS))'
