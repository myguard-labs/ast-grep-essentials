id: c-deref-before-null-check
language: c
severity: warning
message: >-
  Pointer is dereferenced by a member write before a later null check on the
  same pointer.
note: >-
  Syntactic only; matches a sibling statement p->f = v; followed by if (!p)
  with the same identifier text, without checking reassignment or aliasing in
  between.
rule:
  pattern: '$P->$F = $V;'
  precedes:
    stopBy: end
    pattern: 'if (!$P) $S'
