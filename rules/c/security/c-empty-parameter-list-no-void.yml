id: c-empty-parameter-list-no-void
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-empty-param-list-unprototyped. A named function declarator has an
  empty parameter list; use (void) to declare no parameters.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use c-empty-param-list-unprototyped and do not emit this rule.
rule:
  kind: function_declarator
  all:
    - has:
        field: declarator
        kind: identifier
    - has:
        field: parameters
        kind: parameter_list
        pattern: '()'
metadata:
  deprecated_alias_of: c-empty-param-list-unprototyped
  rule_modified_at: '2026-11-15'
  created_at: '2026-10-15'
