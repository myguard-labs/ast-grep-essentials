id: c-empty-parameter-list-no-void
language: c
severity: warning
message: >-
  Function declared with an empty parameter list () is unprototyped; use
  (void) to get argument checking.
note: >-
  Syntactic check only. Matches a function declarator whose parameter list is
  literally empty; it does not verify that the function is never called with
  arguments or resolve declarations across files.
rule:
  kind: function_declarator
  has:
    field: parameters
    kind: parameter_list
    not:
      has:
        kind: parameter_declaration
