# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-buffer-writepos-without-readpos
language: c
severity: warning
message: >-
  Buffered-data check uses writepos alone; buffered byte count is writepos
  minus readpos.
note: >-
  Syntactic check only. Flags a comparison of a writepos member against a
  literal inside a return statement that contains no readpos; it does not
  prove the struct uses readpos or resolve types or aliases.
rule:
  all:
    - pattern: '$OBJ->writepos > 0'
    - not:
        inside:
          kind: binary_expression
          stopBy: end
          has:
            pattern: readpos
            stopBy: end
