id: c-deref-postdecrement-discarded
language: c
severity: warning
message: >-
  Dereferenced pointer with postfix decrement in an expression statement moves
  the pointer and discards the value; parenthesize as (*p)-- if the pointee
  was meant to be decremented.
note: >-
  Syntactic match only on a bare expression statement whose expression is a
  pointer identifier dereferenced with postfix decrement; does not resolve
  types, aliasing, or whether the pointer is intended to advance.
rule:
  pattern: '*$P--;'
