# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-bitand-with-logical-not
language: c
severity: warning
message: 'Bitwise ''&'' with a logical ''!'' right operand; ''&&'' was likely intended.'
note: >-
  Purely syntactic match on a binary '&' whose right operand is a '!'
  expression. It does not resolve types or confirm that short-circuit logic
  was intended.
rule:
  pattern: '$L & !$R'
