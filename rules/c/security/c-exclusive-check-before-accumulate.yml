# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-exclusive-check-before-accumulate
language: c
severity: warning
message: >-
  A mask test appears before a later |= on the same variable, so the test does
  not see the accumulated value.
note: >-
  Syntactic ordering only; it does not verify the variable is a mask, nor
  control flow or aliasing.
rule:
  all:
    - kind: if_statement
    - has:
        stopBy: end
        pattern: '$M & $A'
    - precedes:
        stopBy: end
        pattern: '$M |= $V;'
