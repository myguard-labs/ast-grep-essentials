id: c-openssl-lazy-ex-index-init
language: c
severity: warning
message: >-
  SSL_get_ex_new_index() is assigned inside a negative-index guard; review for
  lazy, possibly unsynchronized ex-data index allocation.
note: >-
  Syntactic match only. It flags an assignment from SSL_get_ex_new_index()
  located inside an if statement whose condition tests a value for being
  negative. It does not verify that the code runs per request, is
  multithreaded, or is unsynchronized.
rule:
  all:
    - pattern: '$VAR = SSL_get_ex_new_index($$$ARGS)'
    - inside:
        kind: if_statement
        has:
          field: condition
          regex: '<\s*0'
        stopBy: end
