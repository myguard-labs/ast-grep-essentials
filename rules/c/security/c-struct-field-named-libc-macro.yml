# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-struct-field-named-libc-macro
language: c
severity: warning
message: >-
  A struct field is named like a libc/CRT function that may be defined as a
  macro, so the member name can be expanded by the preprocessor.
note: >-
  Single-file syntactic check on field declarator names only; it does not
  verify that the platform actually defines the name as a macro, nor resolve
  includes or macro definitions.
rule:
  kind: field_declaration
  has:
    field: declarator
    regex: '\b(mkdir|rmdir)\b'
