# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-getenv-result-strtok-mutates
language: c
severity: warning
message: >-
  The pointer returned by getenv is passed to strtok without being copied
  first.
note: >-
  Matches only the adjacent-declaration syntax, where a variable is
  initialized from getenv and is then the first strtok argument. It does not
  track aliases, reassignments, or non-adjacent flows.
rule:
  pattern: 'char *$T = strtok($P, $$$A);'
  follows:
    pattern: 'char *$P = getenv($$$);'
