id: c-empty-parens-function-declaration
language: c
severity: warning
message: >-
  Function declared with empty parentheses has no prototype; argument count
  and types are not checked against it.
note: >-
  Syntactic match on a function declarator whose parameter list is literally
  empty `()`. It does not check the C standard revision in use (C23 treats ()
  as (void)) and does not verify calls or definitions across files.
rule:
  kind: function_declarator
  has:
    kind: parameter_list
    field: parameters
    not:
      has:
        kind: parameter_declaration
  not:
    has:
      kind: parameter_declaration
