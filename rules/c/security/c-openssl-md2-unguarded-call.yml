# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-openssl-md2-unguarded-call
language: c
severity: warning
message: >-
  Call to EVP_md2() outside a preprocessor feature-test guard; MD2 may be
  absent from the OpenSSL build.
note: >-
  Syntactic check only. It matches a literal EVP_md2 call and does not verify
  OpenSSL build configuration, includes, or types. Calls inside any enclosing
  preprocessor conditional are not reported, but the check does not inspect
  the guard condition itself.
rule:
  all:
    - pattern: 'EVP_md2()'
    - not:
        inside:
          kind: preproc_if
          stopBy: end
    - not:
        inside:
          kind: preproc_ifdef
          stopBy: end
