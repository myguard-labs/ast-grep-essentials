id: c-long-multiply-overflow-via-double
language: c
severity: warning
message: >-
  Integer product computed in double; double's 53-bit mantissa makes this an
  unreliable overflow check for 64-bit multiplication.
note: >-
  Matches the literal syntax of two operands both cast to double and
  multiplied; it does not verify that the result is used for overflow
  detection or resolve operand types.
rule:
  pattern: '(double)$A * (double)$B'
