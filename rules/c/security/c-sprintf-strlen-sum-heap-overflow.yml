# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-sprintf-strlen-sum-heap-overflow
language: c
severity: warning
message: >-
  sprintf writes into a destination with no bound; verify the destination
  allocation covers the formatted output.
note: >-
  Syntactic match on a sprintf call whose format argument is a literal string
  and whose destination identifier was assigned (or initialised) from malloc with a
  strlen-sum size (an arithmetic expression containing a strlen call) in an
  enclosing block of the same function body. It does not verify that the formatted
  output exceeds that allocation; that needs dataflow or type information.
  The allocation lookup is not flow-sensitive: it accepts any matching malloc for the
  destination in the enclosing block, including one in a sibling branch or one assigned
  after the sprintf, so a strlen-sum allocation that does not reach the sprintf still matches.
  A sprintf into a malloc(n) buffer without a strlen sum is not matched here;
  c-sprintf-into-sized-alloc reports any sprintf call with a variable
  destination.
utils:
  strlen-sum-alloc:
    all:
      - any:
          - pattern: '$DST = malloc($SZ)'
          - pattern:
              context: 'char *$DST = malloc($SZ)'
              selector: init_declarator
      - has:
          stopBy: end
          kind: binary_expression
          all:
            - has: {field: operator, regex: '^\+$'}
            - not:
                inside:
                  stopBy: end
                  kind: sizeof_expression
            - has:
                stopBy: end
                kind: call_expression
                has: {field: function, regex: '^strlen$'}
rule:
  all:
    - pattern: 'sprintf($DST, "$$$FMT", $$$ARGS)'
    - any:
        - inside:
            stopBy: end
            kind: compound_statement
            has:
              stopBy: end
              matches: strlen-sum-alloc
        - all:
            - not:
                inside:
                  stopBy: end
                  kind: function_definition
            - inside:
                stopBy: end
                kind: translation_unit
                has:
                  stopBy: end
                  all:
                    - matches: strlen-sum-alloc
                    - not:
                        inside:
                          stopBy: end
                          kind: function_definition
metadata:
  rule_modified_at: '2026-11-16'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-11-16'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-120'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/120.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "FN: concatenated string-literal format 'sprintf(cmd, \"%s\" \"x\", a)' is not matched"
    - "FN: cast allocation 'cmd = (char *)malloc(strlen(a) + 1); sprintf(cmd, \"%s\", a);' is not matched"
    - "FN: strlen-sum without arithmetic 'cmd = malloc(strlen(a)); sprintf(cmd, \"%s\", a);' is not matched"
    - "FN: typedef'd pointer declaration 'cstr cmd = malloc(strlen(a) + 1); sprintf(cmd, \"%s\", a);' is not matched (the init_declarator context requires a literal 'char *' type)"
    - "FP: strlen-sum wrapped in max_len or round_up, e.g. 'cmd = malloc(max_len(strlen(a) + 1, 16)); sprintf(cmd, \"%s\", a);', is reported although the allocation covers the output"
