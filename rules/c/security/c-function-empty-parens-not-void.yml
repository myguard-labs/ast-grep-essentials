id: c-function-empty-parens-not-void
language: c
severity: warning
message: >-
  Function definition declares an empty parameter list; use (void) for a
  prototyped function.
note: >-
  Matches function definitions whose parameter list is literally empty. It
  does not check whether a declaration exists elsewhere or resolve types, and
  it does not inspect call sites.
rule:
  kind: function_definition
  has:
    field: declarator
    kind: function_declarator
    has:
      field: parameters
      kind: parameter_list
      not:
        has:
          kind: parameter_declaration
