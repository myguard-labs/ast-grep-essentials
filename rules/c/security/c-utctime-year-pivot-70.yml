id: c-utctime-year-pivot-70
language: c
severity: warning
message: >-
  Two-digit year is adjusted with pivot 70 instead of the UTCTime pivot 50;
  review the year window.
note: >-
  Matches the literal digit-pair parse followed by an if (i < 70) adjustment
  by 100. It does not resolve data origin, ASN.1 usage, or whether the value
  is a UTCTime field; the pivot may be valid in other contexts.
rule:
  pattern: 'if ($I < 70) $I += 100;'
