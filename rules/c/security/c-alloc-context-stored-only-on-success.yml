id: c-alloc-context-stored-only-on-success
language: c
severity: warning
message: >-
  Context is stored only when allocation succeeds; no else branch releases it
  on the NULL path.
note: >-
  Syntactic match only; does not verify ownership, or whether cleanup happens
  elsewhere in the function.
rule:
  kind: if_statement
  all:
    - has:
        field: condition
        pattern: '($RET != NULL)'
    - has:
        field: consequence
        has:
          pattern: '$RET->context = $CTX;'
          stopBy: end
    - not:
        has:
          field: alternative
          kind: else_clause
