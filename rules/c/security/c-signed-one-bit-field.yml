id: c-signed-one-bit-field
language: c
severity: warning
message: >-
  Named bit-field with signed type int and width 1 can only hold 0 and -1;
  comparisons to 1 are always false.
note: >-
  Matches the literal syntax of a named int bit-field of width 1 inside a
  struct or union declaration. It does not resolve typedefs, type aliases, or
  macros, and does not check how the field is used.
rule:
  kind: field_declaration
  all:
    - has:
        kind: field_identifier
        field: declarator
    - has:
        kind: bitfield_clause
        pattern: ': 1'
    - has:
        pattern: int
        kind: primitive_type
