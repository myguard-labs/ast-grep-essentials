id: c-header-macro-tsrmg-missing-include
language: c
severity: warning
message: Macro expands TSRMG but this file does not include TSRM.h.
note: >-
  Syntactic check only. It looks for a TSRM.h include anywhere in the same
  file. It does not resolve indirect includes or check whether ZTS is defined.
rule:
  kind: preproc_function_def
  regex: 'TSRMG\s*\('
  not:
    inside:
      stopBy: end
      kind: translation_unit
      has:
        stopBy: end
        kind: preproc_include
        regex: 'TSRM\.h'
metadata:
  rule_modified_at: '2026-10-19'
