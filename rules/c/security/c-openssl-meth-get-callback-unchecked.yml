# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-openssl-meth-get-callback-unchecked
language: c
severity: warning
message: >-
  Callback pointer filled by an EVP_PKEY_meth_get_* call is invoked without a
  NULL test.
note: >-
  Syntactic only. Matches a call through an identifier whose address is passed
  to an EVP_PKEY_meth_get_* call in the same function when the call is not
  inside a conditional expression or in the consequence of an if statement
  whose condition is the same identifier, `!= NULL`, `!= 0` or `&& ...` on it.
  It does not track dataflow or other guard forms.
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        kind: identifier
        pattern: '$F'
    - inside:
        kind: function_definition
        stopBy: end
        has:
          stopBy: end
          kind: call_expression
          all:
            - has:
                field: function
                regex: '^EVP_PKEY_meth_get_'
            - has:
                field: arguments
                has:
                  pattern: '&$F'
    - not:
        inside:
          kind: conditional_expression
          stopBy: end
    - not:
        inside:
          stopBy: end
          any:
            - kind: compound_statement
            - kind: return_statement
            - kind: expression_statement
          inside:
            kind: if_statement
            field: consequence
            has:
              field: condition
              has:
                any:
                  - pattern: '$F'
                  - pattern: '$F != NULL'
                  - pattern: 'NULL != $F'
                  - pattern: '$F != 0'
                  - pattern: '$F && $X'
