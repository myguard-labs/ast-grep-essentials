id: c-ifdef-trailing-expression
language: c
severity: warning
message: >-
  #ifdef/#ifndef takes a single macro name; trailing tokens are ignored by the
  preprocessor.
note: >-
  Textual line match on the whole translation unit; it does not check how the
  parser represents the directive or whether the macro is defined.
rule:
  all:
    - kind: translation_unit
    - regex: >-
        (?m)^[ \t]*#[ \t]*(ifdef|ifndef)[ \t]+[A-Za-z_][A-Za-z0-9_]*([ \t]+[^
        \t\r\n/]|[^ \t\r\n/A-Za-z0-9_])
metadata:
