id: c-ternary-after-plus-unparenthesized
language: c
severity: warning
message: >-
  A '+' with a parenthesized right operand directly before '?' makes the whole
  sum the ternary condition.
note: >-
  Syntactic precedence check only; matches a binary sum whose right operand is
  parenthesized and whose parent is a conditional expression, without
  resolving types or values.
rule:
  kind: conditional_expression
  has:
    kind: binary_expression
    field: condition
    all:
      - has:
          field: operator
          regex: '^\+$'
      - has:
          field: right
          kind: parenthesized_expression
