id: c-digit-accumulate-unbounded-int
language: c
severity: warning
message: >-
  Digit accumulation v = v * 10 + digit - '0' in an unguarded while body;
  signed overflow is not checked inside the loop.
note: >-
  Syntactic only; matches a while loop whose body is a single unbraced
  accumulate assignment. It does not check types, signedness, or bounds
  enforced elsewhere.
rule:
  kind: while_statement
  has:
    field: body
    kind: expression_statement
    has:
      pattern: '$V = $V * 10 + $A - $B'
