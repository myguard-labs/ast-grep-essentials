id: c-asn1-table-wrong-struct-type
language: c
severity: warning
message: >-
  ASN1_SEQUENCE template member names a different struct type than the
  template.
note: >-
  Purely syntactic; only checks ASN1_IMP_SET_OF_OPT member type text against
  the ASN1_SEQUENCE name, with no macro expansion or type resolution.
rule:
  all:
    - pattern: 'ASN1_SEQUENCE($T) = { ASN1_IMP_SET_OF_OPT($U, $$$A) }'
    - not:
        pattern: 'ASN1_SEQUENCE($T) = { ASN1_IMP_SET_OF_OPT($T, $$$A) }'
