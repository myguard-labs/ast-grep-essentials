id: c-gmp-global-memory-functions
language: c
severity: warning
message: >-
  Call to mp_set_memory_functions replaces the process-wide GMP allocator;
  review for cross-library allocation mismatches.
note: >-
  Matches the literal call syntax mp_set_memory_functions(...) only; it does
  not check argument values, whether callbacks are non-NULL, or whether the
  call runs in extension startup code, and does not resolve types or linkage.
rule:
  kind: call_expression
  has:
    field: function
    regex: '^mp_set_memory_functions$'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
