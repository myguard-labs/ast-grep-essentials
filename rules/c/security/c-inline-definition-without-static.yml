id: c-inline-definition-without-static
language: c
severity: warning
message: >-
  Inline function definition without static; under C99 semantics it may emit
  no external symbol.
note: >-
  Matches only the specifier syntax of this definition; it does not check for
  an extern declaration elsewhere or resolve macros.
rule:
  kind: function_definition
  all:
    - has:
        kind: storage_class_specifier
        regex: '^inline$'
    - not:
        has:
          kind: storage_class_specifier
          regex: '^static$'
metadata:
  rule_modified_at: '2026-10-20'
