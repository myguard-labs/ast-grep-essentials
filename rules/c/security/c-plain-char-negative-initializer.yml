# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-plain-char-negative-initializer
language: c
severity: warning
message: >-
  Plain char initializer contains a negative integer literal; plain char
  signedness is implementation-defined.
note: >-
  Matches only a declaration whose direct type is the bare primitive char and
  whose initializer text contains a negative numeric literal; it does not
  resolve typedefs or macros, and it does not check the target's char
  signedness.
rule:
  kind: declaration
  all:
    - has:
        kind: primitive_type
        regex: '^char$'
    - has:
        kind: init_declarator
        has:
          stopBy: end
          regex: '^-\s*[0-9]'
