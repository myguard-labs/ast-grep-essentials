id: c-bitfield-non-int-type
language: c
severity: warning
message: >-
  Bit-field declared with a non-int type; C99 only portably allows int,
  unsigned int, signed int, or _Bool.
note: >-
  Syntactic check only. Matches struct field declarations whose type is
  written as unsigned char with a bit-field width; it does not resolve
  typedefs or other integer types.
rule:
  kind: field_declaration
  all:
    - has:
        kind: bitfield_clause
    - has:
        kind: sized_type_specifier
        regex: '^unsigned char$'
