# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-pointer-arith-on-hashtable-struct
language: c
severity: warning
message: >-
  Byte-offset pointer arithmetic is applied to a HashTable member directly
  instead of its arData bucket array.
note: >-
  Purely syntactic match on the literal member access X->static_variables cast
  to char* and offset; does not verify that the receiver is a HashTable or
  that the offset is wrong at runtime.
rule:
  pattern: '(char*)$X->static_variables + $OFF'
