id: c-call-user-function-retval-no-dtor
language: c
severity: warning
message: >-
  Local return zval passed to call_user_function is never destroyed with
  zval_dtor.
note: >-
  Syntactic check only. It matches the literal local name retval and does not
  track aliases, other destructors such as zval_ptr_dtor, or control flow.
rule:
  kind: function_definition
  all:
    - has:
        stopBy: end
        pattern: 'call_user_function($$$A, &retval, $$$B)'
    - not:
        has:
          stopBy: end
          pattern: 'zval_dtor(&retval)'
