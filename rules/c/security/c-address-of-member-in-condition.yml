id: c-address-of-member-in-condition
language: c
severity: warning
message: Address-of expression used directly as a boolean condition is always true.
note: >-
  Syntactic check only. Matches an address-of member or array element used
  directly as an if condition in parentheses. It does not resolve types,
  aliasing, or runtime values.
rule:
  kind: pointer_expression
  pattern: '&$X'
  inside:
    kind: parenthesized_expression
    inside:
      kind: if_statement
      stopBy: end
