# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-evp-md-ctx-new-without-destroy
language: c
severity: warning
message: >-
  EVP_MD_CTX_new result has no later EVP_MD_CTX_destroy or EVP_MD_CTX_free in
  the same scope.
note: >-
  Syntactic only; does not verify the released variable is the same context,
  nor ownership transfer, returns, or cleanup in other functions.
rule:
  all:
    - pattern: 'EVP_MD_CTX *$V = EVP_MD_CTX_new();'
    - not:
        precedes:
          stopBy: end
          regex: 'EVP_MD_CTX_(destroy|free)\s*\('
    - not:
        precedes:
          stopBy: end
          pattern: 'return $V;'
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
  created_at: '2026-10-19'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-772'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/772.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'EVP_MD_CTX *c = EVP_MD_CTX_new(); if (ok) { return c; } is reported although the context is returned'
  todo_cases:
    - "void f(EVP_MD_CTX *other) { EVP_MD_CTX *c = EVP_MD_CTX_new(); EVP_DigestInit_ex(c, EVP_sha256(), NULL); EVP_MD_CTX_free(other); }"
    - "EVP_MD_CTX *f(void) { EVP_MD_CTX *ctx = EVP_MD_CTX_new(); ctx = get(); return ctx; }"
