id: c-empty-parameter-list-definition
language: c
severity: warning
message: >-
  Function definition uses an empty parameter list; declare (void) to get a
  prototype.
note: >-
  Matches a function definition whose parameter list is literally empty. It is
  syntactic only and does not check whether the function is ever called with
  arguments or whether a prior declaration exists.
rule:
  kind: function_definition
  has:
    field: declarator
    kind: function_declarator
    has:
      field: parameters
      kind: parameter_list
      pattern: '()'
