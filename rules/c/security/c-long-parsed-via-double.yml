id: c-long-parsed-via-double
language: c
severity: warning
message: >-
  Integer parsed via a floating-point parser and cast to long; precision is
  lost above 2^53.
note: >-
  Syntactic only; matches a double initialized from strtod/zend_strtod
  followed by a (long) cast of that variable, without checking dataflow or
  intervening reassignment.
rule:
  pattern: 'long $L = (long)$D;'
  follows:
    stopBy: end
    pattern: 'double $D = $F($$$A);'
constraints:
  F:
    regex: '^(zend_strtod|strtod)$'
