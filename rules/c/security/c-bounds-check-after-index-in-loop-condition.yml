# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-bounds-check-after-index-in-loop-condition
language: c
severity: warning
message: >-
  Array element indexed by a variable is read before the bounds comparison on
  that index in a while condition.
note: >-
  Purely syntactic check of the condition's && operand order; it does not
  resolve array sizes, types, aliasing, or whether the index can actually go
  out of range at runtime.
rule:
  pattern: 'while ($ARR[$IDX] != 0 && $IDX < $N) $BODY'
