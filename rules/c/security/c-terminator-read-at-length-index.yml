# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-terminator-read-at-length-index
language: c
severity: warning
message: >-
  Subscript indexes a character buffer at the length identifier, one past the
  last valid element.
note: >-
  Syntactic match only. Matches a subscript whose index is a bare identifier
  named len compared against a NUL character literal; it does not verify that
  len is the buffer size or that the buffer is unrelated to other bounds.
rule:
  all:
    - pattern: '$BUF[len] == ''\0'''
