id: c-null-check-after-deref-in-or
language: c
severity: warning
message: >-
  A pointer is dereferenced in an earlier operand of a || condition than its
  null test.
note: >-
  Syntactic check only. Matches a literal p->field comparison that precedes a
  !p operand in the same || chain; it does not resolve types, aliasing, or
  whether p can actually be null.
rule:
  pattern: '$A || !$P'
  all:
    - has:
        pattern: '$P->$F'
        stopBy: end
