# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-bitwise-and-on-logical-negation
language: c
severity: warning
message: 'Bitwise & between two logical-not operands; did you mean &&?'
note: >-
  Purely syntactic check for a binary & whose both operands are unary !
  expressions. It does not verify intent, types, or evaluation context, and
  may flag deliberate bitwise use.
rule:
  pattern: '!$A & !$B'
