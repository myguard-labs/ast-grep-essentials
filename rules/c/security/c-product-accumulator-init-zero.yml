id: c-product-accumulator-init-zero
language: c
severity: warning
message: >-
  Variable initialized to 0 is later multiplied with *=, so the product stays
  0.
note: >-
  Syntactic only; matches a later sibling statement containing the same name
  with *= and does not check for reassignment in between.
rule:
  all:
    - pattern: '$T $V = 0;'
    - precedes:
        stopBy: end
        has:
          stopBy: end
          pattern: '$V *= $E'
