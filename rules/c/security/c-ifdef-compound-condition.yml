id: c-ifdef-compound-condition
language: c
severity: warning
message: >-
  #ifdef/#ifndef accepts a single identifier; extra tokens or operators on
  this line are ignored or rejected. Use #if defined(A) && defined(B) instead.
note: >-
  Matches only the directive line's text, looking for a second token after the
  first macro name. It does not evaluate macros or check how the preprocessor
  handles the extra tokens.
rule:
  kind: preproc_ifdef
  regex: '^#[ \t]*ifn?def[ \t]+\w+[ \t]+[^ \t\r\n/]'
