# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-wide-int-store-at-byte-offset
language: c
severity: warning
message: >-
  Multi-byte integer access through a pointer cast applied to a char-pointer
  byte offset may be misaligned.
note: >-
  Matches the literal syntax of a cast to a multi-byte unsigned int pointer
  applied to a buf + offset expression. It does not resolve types, alignment,
  or whether the offset is actually unaligned at runtime.
rule:
  pattern: '*(unsigned int *)($BUF + $OFF)'
