id: c-non-static-inline-definition
language: c
severity: warning
message: >-
  Top-level inline function definition without static or extern may emit no
  external symbol.
note: >-
  Matches only the literal syntax of a top-level function definition whose
  declaration specifiers contain the inline keyword and contain neither static
  nor extern. It does not check headers, linkage across files, or whether an
  out-of-line definition exists elsewhere.
rule:
  all:
    - kind: function_definition
    - pattern: 'inline $TYPE $NAME($$$PARAMS) $$$BODY'
    - not:
        pattern: 'static $$$REST'
    - not:
        pattern: 'extern $$$REST'
    - inside:
        kind: translation_unit
        stopBy: end
