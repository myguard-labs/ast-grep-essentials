# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-pointer-param-compared-to-zero
language: c
severity: warning
message: Pointer parameter is compared directly to 0 without a dereference.
note: >-
  Syntactic only; matches a same-named pointer parameter in the enclosing
  function and does not handle shadowing or the != form.
rule:
  all:
    - pattern: '$P == 0'
    - inside:
        stopBy: end
        kind: function_definition
        has:
          stopBy: end
          kind: parameter_declaration
          has:
            kind: pointer_declarator
            has:
              stopBy: end
              pattern: '$P'
