id: c-hash-foreach-wrong-base-after-init
language: c
severity: warning
message: >-
  ZEND_HASH_FOREACH iterates the same hash expression that zend_hash_init just
  initialized, so it walks an empty table.
note: >-
  Matches textually identical expressions only; does not check that no entries
  were added between the init and the loop, nor aliasing.
rule:
  pattern: 'ZEND_HASH_FOREACH_STR_KEY_PTR($H, $$$ARGS)'
  inside:
    kind: expression_statement
    follows:
      stopBy: end
      has:
        pattern: 'zend_hash_init($H, $$$REST)'
