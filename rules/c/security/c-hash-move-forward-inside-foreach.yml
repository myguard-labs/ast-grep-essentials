id: c-hash-move-forward-inside-foreach
language: c
severity: warning
message: >-
  zend_hash_move_forward is called inside a ZEND_HASH_FOREACH loop, which
  already advances the iterator.
note: >-
  Matches a zend_hash_move_forward call expression by syntax when some
  enclosing node's text contains a ZEND_HASH_FOREACH_ macro invocation. It
  does not expand macros, confirm the call is in the loop body, or check which
  hash table is advanced.
rule:
  all:
    - kind: call_expression
    - regex: '^zend_hash_move_forward\s*\('
    - inside:
        regex: 'ZEND_HASH_FOREACH_[A-Z_]*\s*\('
        stopBy: end
