id: c-dh-params-from-file-without-free
language: c
severity: warning
message: >-
  DH loaded by ssl_dh_GetParamFromFile is passed to SSL_CTX_set_tmp_dh without
  a later DH_free on it.
note: >-
  Syntactic only. It checks sibling statements in the same block and does not
  track aliasing, other release paths, or control flow.
rule:
  pattern: 'SSL_CTX_set_tmp_dh($C, $D);'
  all:
    - follows:
        stopBy: end
        pattern: 'DH *$D = ssl_dh_GetParamFromFile($$$A);'
    - not:
        precedes:
          stopBy: end
          pattern: 'DH_free($D);'
