id: c-num-args-return-false
language: c
severity: warning
message: Argument-count check returns false instead of raising WRONG_PARAM_COUNT.
note: >-
  Syntactic match only on an if (ZEND_NUM_ARGS()) block whose body is a
  RETURN_FALSE; statement. It does not verify the enclosing function or
  runtime argument handling.
rule:
  pattern: |
    if (ZEND_NUM_ARGS()) {
      RETURN_FALSE;
    }
