id: c-dead-zero-check-after-not-return
language: c
severity: warning
message: >-
  This (V == 0) test follows an earlier `if (!V) return`, so it can never be
  true.
note: >-
  Syntactic only; does not check that V is unmodified between the two tests,
  nor control flow or aliasing.
rule:
  all:
    - kind: if_statement
    - has:
        field: condition
        has:
          pattern: '$V == 0'
          stopBy: end
    - follows:
        pattern: 'if (!$V) return $A;'
        stopBy: end
