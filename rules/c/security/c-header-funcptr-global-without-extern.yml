id: c-header-funcptr-global-without-extern
language: c
severity: warning
message: >-
  File-scope function-pointer variable without extern or static may be defined
  in every including translation unit.
note: >-
  Single-file syntactic check for a file-scope declaration whose declarator is
  a parenthesized pointer to function with no extern or static storage class;
  it does not verify that the declaration is in a header or resolve linkage
  across files.
rule:
  all:
    - kind: declaration
    - pattern: 'void (*$NAME)($$$ARGS);'
    - not:
        has:
          kind: storage_class_specifier
          regex: '^(extern|static)$'
