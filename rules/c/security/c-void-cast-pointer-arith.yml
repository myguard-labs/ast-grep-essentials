id: c-void-cast-pointer-arith
language: c
severity: warning
message: >-
  Arithmetic applied to a parenthesized (void *) cast; pointer arithmetic on
  void pointers is not ISO C.
note: >-
  Purely syntactic match on a parenthesized void pointer cast used as the left
  operand of an additive operator. It does not resolve types, so it cannot
  confirm that the cast expression is actually a pointer or that the offset is
  applied to it.
rule:
  pattern: '((void *)$X) + $N'
