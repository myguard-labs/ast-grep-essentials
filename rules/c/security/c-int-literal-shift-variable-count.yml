id: c-int-literal-shift-variable-count
language: c
severity: warning
message: >-
  Unsuffixed integer literal 1 is shifted by a variable count in a compound
  bitwise-or assignment; the shift is performed in int.
note: >-
  Purely syntactic match on a compound |= whose right operand is a literal 1
  shifted by a non-constant count. Does not resolve types or verify that the
  count is out of range for int or that the target is wider than int.
rule:
  pattern: '$LHS |= 1 << $COUNT'
