id: c-bitand-bitor-no-parens
language: c
severity: warning
message: >-
  Bitwise & is combined with | in one unparenthesised expression; add
  parentheses to make the precedence explicit.
note: >-
  Syntactic check only. It flags a binary | whose direct operand is an
  unparenthesised binary & in the shown source; it does not verify intent,
  types, or whether a mask is deliberate.
rule:
  pattern: '$A | $B'
  has:
    field: left
    pattern: '$C & $D'
