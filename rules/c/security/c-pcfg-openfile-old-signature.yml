id: c-pcfg-openfile-old-signature
language: c
severity: warning
message: >-
  This call uses the pointer-returning form of ap_pcfg_openfile; the
  status-returning apr_status_t out-parameter form is expected.
note: >-
  Matches the literal call syntax of a direct ap_pcfg_openfile assignment with
  the result tested against NULL in the same snippet. It does not resolve
  types, declarations, or the actual API version of the header in use.
rule:
  pattern: '$FP = ap_pcfg_openfile($P, $F)'
