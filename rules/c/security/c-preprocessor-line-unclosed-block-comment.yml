id: c-preprocessor-line-unclosed-block-comment
language: c
severity: warning
message: >-
  Preprocessor directive line opens a block comment that is not closed on the
  same line.
note: >-
  Textual line-based regex check; it does not model line continuations or
  comments or strings that start earlier in the file.
rule:
  kind: translation_unit
  regex: '(?m)^[ \t]*#[^\n]*/\*([^*\n]|\*+[^*/\n])*\**$'
