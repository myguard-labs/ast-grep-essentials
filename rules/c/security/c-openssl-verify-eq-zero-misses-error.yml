id: c-openssl-verify-eq-zero-misses-error
language: c
severity: warning
message: >-
  EVP_DigestVerify result is compared only with == 0, so a negative error
  return is treated as success.
note: >-
  Matches syntax only. It needs the declaration immediately before the if, and
  it does not follow aliasing or other control flow.
rule:
  all:
    - pattern: 'if ($J == 0) $BODY'
    - follows:
        pattern: '$T $J = EVP_DigestVerify($$$ARGS);'
