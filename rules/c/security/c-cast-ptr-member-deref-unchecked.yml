# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-cast-ptr-member-deref-unchecked
language: c
severity: warning
message: Pointer member is cast and dereferenced in a function with no if-check.
note: >-
  Approximation; any if statement in the function counts as a guard, and it
  does not verify the checked expression is the same pointer.
rule:
  all:
    - pattern: '(($T)$E->$F)->$G'
    - inside:
        kind: function_definition
        stopBy: end
        not:
          has:
            kind: if_statement
            stopBy: end
