# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-php-try-get-string-result-unchecked
language: c
severity: warning
message: Result of zval_try_get_string may be NULL and is used without a NULL check.
note: >-
  Syntactic only; matches a declaration followed directly by an expression
  statement, without tracking whether the variable is used or checked
  elsewhere.
rule:
  all:
    - pattern: '$T *$V = zval_try_get_string($$$ARGS);'
    - precedes:
        stopBy: neighbor
        kind: expression_statement
