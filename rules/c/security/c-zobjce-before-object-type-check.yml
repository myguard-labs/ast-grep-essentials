id: c-zobjce-before-object-type-check
language: c
severity: warning
message: >-
  Z_OBJCE_PP is used in a condition without a preceding Z_TYPE_PP type check
  guarding it with a short-circuit &&.
note: >-
  Syntactic single-file check only; it matches the literal Z_OBJCE_PP(x) call
  inside an instanceof_function call within an if condition and does not
  resolve types, aliasing, or runtime values.
rule:
  pattern: 'instanceof_function(Z_OBJCE_PP($X), $$$ARGS)'
  inside:
    kind: if_statement
    stopBy: end
  not:
    inside:
      kind: binary_expression
      stopBy: end
      has:
        pattern: 'Z_TYPE_PP($X) == IS_OBJECT'
