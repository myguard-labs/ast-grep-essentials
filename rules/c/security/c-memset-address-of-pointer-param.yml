id: c-memset-address-of-pointer-param
language: c
severity: warning
message: >-
  memset is applied to the address of a pointer variable with sizeof of that
  pointer, which clears the pointer rather than the pointee.
note: >-
  Purely syntactic check on a single file. It matches memset(&x, 0, sizeof(x))
  with the same identifier in the address-of and sizeof positions; it reports
  only when x is declared as a pointer (a parameter or local declared `T *x`)
  in the enclosing function. The declaration check ignores block scope, and it
  cannot confirm types or aliasing.
rule:
  all:
    - pattern: 'memset(&$P, 0, sizeof($P))'
    - inside:
        stopBy: end
        kind: function_definition
        has:
          stopBy: end
          kind: pointer_declarator
          has:
            field: declarator
            pattern: $P
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
