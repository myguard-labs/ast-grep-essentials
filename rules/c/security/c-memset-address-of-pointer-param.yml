  cwe: 'CWE-467'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/467.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "FP: 'void f(char *p) { { struct s p; memset(&p, 0, sizeof(p)); } }' is reported; the pointer-declaration check ignores block scope, so an inner redeclaration as a non-pointer still matches"
    - "FN: 'memset(&pi, 0, sizeof pi)' (sizeof without parentheses) is not reported"
    - "FN: 'memset(&(pi), 0, sizeof(pi))' (parenthesised address operand) is not reported"
