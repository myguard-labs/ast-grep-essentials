id: c-memset-address-of-pointer-param
language: c
severity: warning
message: >-
  memset is applied to the address of a pointer variable with sizeof of that
  pointer, which clears the pointer rather than the pointee.
note: >-
  Purely syntactic check on a single file. It matches memset(&x, 0, sizeof(x))
  with the same identifier in the address-of and sizeof positions; it does not
  verify that x is a pointer-typed parameter, so it cannot confirm types or
  aliasing.
rule:
  pattern: 'memset(&$P, 0, sizeof($P))'
