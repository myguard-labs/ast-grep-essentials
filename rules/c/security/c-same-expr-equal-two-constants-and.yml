id: c-same-expr-equal-two-constants-and
language: c
severity: warning
message: >-
  This && joins two equality tests of the same identifier against different
  constants, so the condition can never be true.
note: >-
  Purely syntactic check on a single && expression whose operands are equality
  tests of one identifier against two literal numbers. It does not resolve
  macros, types, aliasing, or runtime values, and it cannot confirm the
  variable is unchanged between the tests.
rule:
  kind: binary_expression
  pattern: '$X == $A && $X == $B'
  all:
    - has:
        pattern: '$X == $A'
        stopBy: end
    - not:
        has:
          kind: identifier
          regex: '^$'
