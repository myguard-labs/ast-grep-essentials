id: c-header-global-definition-without-static
language: c
severity: warning
message: >-
  File-scope object definition without static or extern storage class; each
  includer defines the same symbol.
note: >-
  Purely syntactic single-file check. It matches a top-level declaration with
  a primitive type and no storage-class specifier; it does not verify that the
  file is a header, that the object is defined elsewhere, or that the
  declaration is not an extern/static one written in another form.
rule:
  kind: translation_unit
  has:
    kind: declaration
    pattern: 'long $NAME;'
    not:
      has:
        kind: storage_class_specifier
