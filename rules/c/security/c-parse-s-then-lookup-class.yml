id: c-parse-s-then-lookup-class
language: c
severity: warning
message: >-
  Class name parsed with the s specifier and then looked up by hand; consider
  the C specifier.
note: >-
  Syntactic only; matches a preceding sibling zend_parse_parameters text with
  an "s" specifier and does not verify the variables are linked.
rule:
  pattern: 'zend_lookup_class($$$ARGS);'
  follows:
    stopBy: end
    regex: '^zend_parse_parameters\([^;]*"s"'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
