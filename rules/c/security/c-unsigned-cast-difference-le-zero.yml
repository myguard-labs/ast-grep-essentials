# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-unsigned-cast-difference-le-zero
language: c
severity: warning
message: >-
  An unsigned-cast subtraction is compared with less-than-or-equal zero, which
  only holds for zero, so negative differences are not detected.
note: >-
  Single-file syntactic match on a literal cast of a subtraction to unsigned
  int compared with 0. It does not resolve types, typedefs, or runtime values.
rule:
  pattern: '(unsigned int) ($A - $B) <= 0'
