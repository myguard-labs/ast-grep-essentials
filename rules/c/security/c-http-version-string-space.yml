# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-http-version-string-space
language: c
severity: warning
message: >-
  This string literal uses a space between HTTP and the version number; HTTP
  version text should use the slash form such as HTTP/1.1.
note: >-
  Purely syntactic match on string literal text beginning with HTTP, a space,
  and a digit. It does not check whether the string is used as a protocol
  string at runtime.
rule:
  kind: string_literal
  regex: '^"HTTP [0-9]'
