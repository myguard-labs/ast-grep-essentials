id: c-sprintf-into-fixed-array
language: c
severity: warning
message: >-
  Unbounded sprintf writes into a fixed-size buffer; use snprintf with the
  buffer size.
note: >-
  Purely syntactic match on a direct sprintf call with a plain identifier
  destination. It does not verify that the identifier is a fixed-size char
  array, nor check the formatted output length or aliasing.
rule:
  pattern: 'sprintf($BUF, $$$ARGS)'
