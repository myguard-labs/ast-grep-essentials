id: c-evp-pkey-get-id-switch
language: c
severity: warning
message: >-
  Switch dispatches on EVP_PKEY_get_id; consider EVP_PKEY_get_base_id for
  key-type dispatch.
note: >-
  Single-file syntactic match on a switch whose controlling expression is a
  literal EVP_PKEY_get_id call. Does not resolve types, aliasing, or runtime
  key identity.
rule:
  pattern: |
    switch (EVP_PKEY_get_id($ARG)) {
      $$$BODY
    }
