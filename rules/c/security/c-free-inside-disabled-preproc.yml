id: c-free-inside-disabled-preproc
language: c
severity: warning
message: >-
  Free-family call sits inside a preprocessor block that looks disabled, so
  the release may never run.
note: >-
  Matches condition text only (literal 0 or a macro name ending in _0); it
  does not check whether the macro is actually defined.
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: '^(free|efree|zend_\w*free)$'
    - inside:
        kind: preproc_if
        stopBy: end
        has:
          field: condition
          regex: '^\s*(0|\w*_0)\s*$'
metadata:
  rule_modified_at: '2026-10-19'
