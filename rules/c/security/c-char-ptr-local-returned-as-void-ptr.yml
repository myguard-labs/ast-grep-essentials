id: c-char-ptr-local-returned-as-void-ptr
language: c
severity: warning
message: >-
  A local declared as char * is returned from a function declared to return
  void *.
note: >-
  Single-function syntactic check on the shown declarations only; it does not
  resolve types across files, aliasing, or whether the returned value is the
  same object at runtime.
rule:
  pattern: |
    void *f(void) {
      char *ret = 0;
      return ret;
    }
