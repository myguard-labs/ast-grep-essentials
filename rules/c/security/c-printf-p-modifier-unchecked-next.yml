id: c-printf-p-modifier-unchecked-next
language: c
severity: warning
message: >-
  Format parser advances the format pointer after 'p' without checking the
  next character is a valid conversion.
note: >-
  Syntactic match only. Flags a case 'p' whose body is a bare fmt++ statement;
  it does not verify the parser context, the type of fmt, or whether later
  checks exist elsewhere.
rule:
  pattern: |
    case 'p':
      fmt++;
