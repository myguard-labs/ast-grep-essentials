# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-empty-function-like-macro
language: c
severity: warning
message: >-
  Function-like macro has an empty replacement list; every call expands to
  nothing.
note: >-
  Matches syntax only; intentional no-op macros also match, so treat hits as
  review hints.
rule:
  kind: preproc_function_def
  not:
    has:
      kind: preproc_arg
