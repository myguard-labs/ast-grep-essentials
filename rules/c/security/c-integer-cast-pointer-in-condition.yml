id: c-integer-cast-pointer-in-condition
language: c
severity: warning
message: >-
  A pointer is cast to an integer type and then used as a ternary condition;
  the test checks truncated bits, not whether the pointer is null.
note: >-
  Syntactic match only on a parenthesized cast of any operand used as the
  condition of a ternary expression. It does not verify that the operand is a
  pointer, its type, or the width of the cast type; it cannot confirm
  truncation or intent without type information.
rule:
  pattern: '(unsigned int) $X ? $A : $B'
