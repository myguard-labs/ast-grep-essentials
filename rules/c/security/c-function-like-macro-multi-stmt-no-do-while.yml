id: c-function-like-macro-multi-stmt-no-do-while
language: c
severity: warning
message: >-
  Function-like macro body is a bare brace block with several statements; wrap
  it in do { ... } while (0).
note: >-
  Matches only the textual shape of the macro body (starts with a brace and
  has at least two semicolons); it does not check how the macro is used.
rule:
  kind: preproc_function_def
  has:
    kind: preproc_arg
    regex: '^\s*\{[^;]*;[^;]*;'
