id: c-int-length-out-param
language: c
severity: warning
message: >-
  Address of a plain int local is passed as the length out-argument of a
  ->read() call.
note: >-
  Syntactic only; matches a local literally named len declared as int earlier
  in the same block, without resolving types or other names.
rule:
  kind: expression_statement
  all:
    - has:
        stopBy: end
        pattern: '$B->read($$$A, &len)'
    - follows:
        stopBy: end
        pattern: 'int len;'
