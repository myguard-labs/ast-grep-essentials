id: c-log-macro-without-level-guard
language: c
severity: warning
message: >-
  Variadic logging macro calls the log function directly with no level check,
  so arguments are evaluated even when filtered out.
note: >-
  Matches macro body text only; it does not resolve whether the called
  function checks the level internally.
rule:
  kind: preproc_function_def
  has:
    field: value
    kind: preproc_arg
    all:
      - regex: 'log\s*\(.*__VA_ARGS__'
      - not:
          regex: '\?|enabled|isEnabled|if\s*\('
