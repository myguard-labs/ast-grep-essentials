id: c-c89-local-decl-after-stmt-block
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-c89-decl-after-statement-block. A declaration
  follows an expression statement in the same block, which C89 does not
  allow.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use c-c89-decl-after-statement-block and do not emit this rule.
rule:
  all:
    - kind: declaration
    - follows:
        kind: expression_statement
        stopBy: end
    - inside:
        kind: compound_statement
        stopBy: end
metadata:
  deprecated_alias_of: c-c89-decl-after-statement-block
