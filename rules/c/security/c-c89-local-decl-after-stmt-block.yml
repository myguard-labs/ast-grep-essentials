id: c-c89-local-decl-after-stmt-block
language: c
severity: warning
message: >-
  Local declaration follows an executable statement in the same block; this
  breaks C89 builds.
note: >-
  Purely syntactic single-file check on the shown block order. It does not
  resolve types, scopes, or compiler flags, and it does not account for
  declarations nested in other blocks.
rule:
  kind: declaration
  inside:
    kind: compound_statement
    stopBy: end
  follows:
    kind: expression_statement
    stopBy: end
