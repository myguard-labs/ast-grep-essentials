id: c-brigade-foreach-var-after-loop
language: c
severity: warning
message: >-
  The APR_BRIGADE_FOREACH loop variable is used after the loop; it points at
  the sentinel after normal completion. Capture the bucket inside the loop.
note: >-
  Syntactic only; matches the same identifier text in a later construct and
  cannot tell break paths, reassignment, or shadowing.
rule:
  all:
    - kind: identifier
    - pattern: '$E'
    - inside:
        stopBy: end
        follows:
          stopBy: end
          all:
            - regex: '^APR_BRIGADE_FOREACH'
            - has:
                stopBy: end
                pattern: '$E'
    - not:
        inside:
          stopBy: end
          kind: compound_statement
          follows:
            regex: '^APR_BRIGADE_FOREACH'
