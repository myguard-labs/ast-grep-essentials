id: c-alloc-copy-then-free-outside-null-guard
language: c
severity: warning
message: >-
  free of the memcpy source placed right after the if statement guarding the
  copy, outside the guard.
note: >-
  Syntactic only; does not verify that the destination is a fresh allocation
  or that the guard is a null check.
rule:
  pattern: 'free($S);'
  follows:
    kind: if_statement
    has:
      stopBy: end
      pattern: 'memcpy($D, $S, $$$A)'
