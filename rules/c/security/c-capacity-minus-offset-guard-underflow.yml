id: c-capacity-minus-offset-guard-underflow
language: c
severity: warning
message: >-
  This if-condition subtracts a pointer offset from a sizeof capacity before
  comparing; review for unsigned underflow when the offset passes the end.
note: >-
  Purely syntactic match on a sizeof(X) minus (P - X) comparison inside an if
  condition. It does not resolve types, pointer provenance, or whether the
  offset is bounded, so bounded safe uses may also match.
rule:
  all:
    - pattern: 'if ((sizeof($BUF) - ($P - $BUF)) < $LEN) return -1;'
