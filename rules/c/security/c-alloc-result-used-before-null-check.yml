id: c-alloc-result-used-before-null-check
language: c
severity: warning
message: >-
  Value assigned from a call is passed to another call before it is tested for
  NULL.
note: >-
  Purely syntactic sibling-order check; it does not verify the callee is an
  allocator or that the variable is unchanged between statements.
rule:
  all:
    - kind: expression_statement
    - has:
        kind: call_expression
        has:
          kind: argument_list
          has:
            pattern: '$V'
    - follows:
        stopBy: end
        kind: expression_statement
        has:
          pattern: '$V = $C($$$ARGS)'
    - precedes:
        stopBy: end
        kind: if_statement
        has:
          stopBy: end
          pattern: '!$V'
