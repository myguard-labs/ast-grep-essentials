# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-reentrant-errno-after-r-call
language: c
severity: warning
message: >-
  errno is compared after a POSIX *_r call; these functions return the error
  number directly, so check the return value instead.
note: >-
  Single-file syntactic check for a literal errno comparison in an if
  condition; it does not verify that the compared call is a *_r function or
  that errno is stale, and does not track the call's result across statements.
rule:
  pattern: |
    if (errno == $ERR) $$$BODY
