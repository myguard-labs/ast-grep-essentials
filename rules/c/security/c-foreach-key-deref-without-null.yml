id: c-foreach-key-deref-without-null
language: c
severity: warning
message: >-
  ZSTR_VAL or ZSTR_LEN applied to a key that may be NULL for integer-indexed
  entries; check the key first.
note: >-
  Syntactic only; matches ZSTR_VAL or ZSTR_LEN calls not inside a conditional
  expression. It does not verify the enclosing foreach, the key variable
  identity, or other NULL guards such as if statements.
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        regex: '^(ZSTR_VAL|ZSTR_LEN)$'
    - not:
        inside:
          kind: conditional_expression
          stopBy: end
