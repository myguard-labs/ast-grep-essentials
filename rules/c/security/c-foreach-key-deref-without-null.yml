id: c-foreach-key-deref-without-null
language: c
severity: warning
message: >-
  ZSTR_VAL or ZSTR_LEN applied to a key that may be NULL for integer-indexed
  entries; check the key first.
note: >-
  Syntactic only; matches ZSTR_VAL or ZSTR_LEN calls not inside a conditional
  expression, or inside the consequence of an if statement whose condition
  is exactly the dereferenced variable or a != NULL test of it. It does not
  verify the enclosing foreach, and other guards (early continue, && chains)
  are not recognised.
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        regex: '^(ZSTR_VAL|ZSTR_LEN)$'
    - not:
        inside:
          kind: conditional_expression
          stopBy: end
    - has:
        field: arguments
        has:
          pattern: $K
    - not:
        inside:
          stopBy: end
          kind: if_statement
          field: consequence
          has:
            field: condition
            any:
              - pattern: ($K)
              - pattern: ($K != NULL)
