id: c-null-check-tests-input-not-result
language: c
severity: warning
message: >-
  This NULL check tests an input argument of the preceding allocator call, not
  the assigned result.
note: >-
  Syntactic only; allocator is recognised by name (alloc/dup) and no aliasing
  or type information is resolved.
rule:
  pattern: 'if ($X == NULL) $S'
  follows:
    pattern: '$L = $F($$$A, $X, $$$B);'
constraints:
  F:
    regex: '(alloc|dup)'
