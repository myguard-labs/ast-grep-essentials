id: c-min-timeout-zero-seed-skip
language: c
severity: warning
message: >-
  Minimum-search loop seeds the accumulator on the first iteration, then
  updates only when nswait > 0 && nswait < wait. A zero seed is never
  replaced.
note: >-
  Matches the literal if/else-if shape only; it does not verify the loop
  context, types, or whether the seed can actually be zero.
rule:
  pattern: |
    if ($I == 0) { $W = $N; } else if ($N > 0 && $N < $W) { $W = $N; }
