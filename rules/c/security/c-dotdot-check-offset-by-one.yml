id: c-dotdot-check-offset-by-one
language: c
severity: warning
message: >-
  This || condition checks a buffer at index 0 and then a dot-literal
  comparison at a shifted index on the same buffer; verify the offset is
  intended.
note: >-
  Purely syntactic single-file match on literal subscript indices within a
  logical-or; it does not resolve aliasing, runtime values, or whether the
  buffer is the same object.
rule:
  pattern: '$BUF[0] == $C1 || ($BUF[1] == ''.'' && $BUF[2] == $C2)'
