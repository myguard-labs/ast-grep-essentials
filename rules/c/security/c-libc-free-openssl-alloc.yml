id: c-libc-free-openssl-alloc
language: c
severity: warning
message: >-
  Memory allocated with an OPENSSL_* allocator is released with libc free();
  use OPENSSL_free().
note: >-
  Syntactic only; matches a declaration initialised from
  OPENSSL_malloc/strdup/zalloc followed by free() of the same identifier,
  without checking scope, reassignment or control flow.
rule:
  pattern: 'free($P);'
  follows:
    stopBy: end
    pattern: '$T *$P = $F($$$A);'
constraints:
  F:
    regex: '^OPENSSL_(malloc|strdup|zalloc)$'
