id: c-module-init-early-return-skips-init
language: c
severity: warning
message: >-
  Preprocessor-guarded early return of SUCCESS precedes the initialization
  statement.
note: >-
  Matches syntax only. It does not check that the enclosing function is a
  PHP_MINIT or PHP_MSHUTDOWN hook, and it does not check that the following
  statement is the real initialization call.
rule:
  kind: preproc_ifdef
  has:
    pattern: 'return SUCCESS;'
    stopBy: end
  precedes:
    kind: expression_statement
