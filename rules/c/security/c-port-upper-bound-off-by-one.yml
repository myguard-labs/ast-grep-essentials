# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-port-upper-bound-off-by-one
language: c
severity: warning
message: >-
  Port-like upper bound compares against 65536, one past the largest valid TCP
  port (65535).
note: >-
  Syntactic match only on a port-named identifier compared with literal 65536
  using the greater-than operator; it does not verify the variable holds a
  port or that the check is reachable or correct in context.
rule:
  pattern: '$PORT > 65536'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-193'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/193.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'any identifier compared with 65536, such as a buffer size ''len > 65536'', is reported because $PORT is not constrained to a port name'
  todo_cases:
    - "int f(long port) { return port > 65536L ? -1 : 0; }"
    - "int f(long port) { return port > 0x10000 ? -1 : 0; }"
    - "int f(long port) { return port > 1 << 16 ? -1 : 0; }"
    - "int f(long port) { return port <= 65536 ? 0 : -1; }"
