# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-port-upper-bound-off-by-one
language: c
severity: warning
message: >-
  Port-like upper bound compares against 65536, one past the largest valid TCP
  port (65535).
note: >-
  Syntactic match only on a port-named identifier compared with literal 65536
  using the greater-than operator; it does not verify the variable holds a
  port or that the check is reachable or correct in context.
rule:
  pattern: '$PORT > 65536'
