id: c-postfix-increment-in-comparison
language: c
severity: warning
message: >-
  Postfix increment or decrement used as a direct operand of a relational
  comparison; the comparison sees the pre-update value.
note: >-
  Purely syntactic; intentional idioms such as while (n++ < max) will also
  match, and no data flow is analyzed.
rule:
  kind: binary_expression
  all:
    - has:
        field: operator
        regex: '^(<|>|<=|>=)$'
    - has:
        kind: update_expression
        regex: '(\+\+|--)$'
        has:
          field: argument
          kind: identifier
