id: c-tsrmls-fetch-with-tsrmls-dc-param
language: c
severity: warning
message: >-
  This function takes TSRMLS_DC and also calls TSRMLS_FETCH() in its body,
  which is redundant.
note: >-
  Single-file syntactic check only. Matches a function whose parameter list
  contains TSRMLS_DC and whose body contains a TSRMLS_FETCH() call; it does
  not verify macro expansion, types, or runtime thread-local behavior.
rule:
  all:
    - kind: function_definition
    - has:
        pattern: 'TSRMLS_FETCH()'
        stopBy: end
    - has:
        pattern: TSRMLS_DC
        stopBy: end
