id: c-write-through-pointer-to-const
language: c
severity: warning
message: >-
  Subscript assignment writes through a pointer declared as pointer to const
  char.
note: >-
  Single-file syntactic check. Matches a literal declaration of a const char
  pointer local and a subscript assignment through that same name; it does not
  resolve aliasing, reassignment, or types across files.
rule:
  all:
    - pattern: 'const char *$P = $INIT;'
    - inside:
        kind: compound_statement
        has:
          pattern: '$P[$IDX] = $VAL'
          stopBy: end
