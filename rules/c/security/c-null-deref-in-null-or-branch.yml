# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-null-deref-in-null-or-branch
language: c
severity: warning
message: >-
  Pointer is dereferenced inside a branch where the `!p || ...` test may mean
  it is NULL.
note: >-
  Syntactic only; matches the same identifier text and does not track
  reassignment, aliasing, or longer disjunction chains.
rule:
  pattern: 'if (!$P || $A) $B'
  has:
    field: consequence
    has:
      stopBy: end
      pattern: '$P->$F'
      not:
        inside:
          stopBy: end
          pattern: '$P && $C'
