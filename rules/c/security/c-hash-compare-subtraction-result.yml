# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-hash-compare-subtraction-result
language: c
severity: warning
message: >-
  Subtraction of two fields is assigned to a result that is used as a
  comparison value; the difference can overflow and flip sign.
note: >-
  Matches only the literal syntax of an assignment whose right side is a
  subtraction of two field accesses. It does not check field types, overflow
  ranges, or whether the variable is returned as a comparator; those need
  semantic analysis.
rule:
  pattern: 'result = $A->$F - $B->$G'
