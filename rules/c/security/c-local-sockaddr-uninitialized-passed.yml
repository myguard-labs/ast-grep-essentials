# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-local-sockaddr-uninitialized-passed
language: c
severity: warning
message: >-
  Local sockaddr struct declared without an initializer and later used in a
  call.
note: >-
  Syntactic only; matches a same-block later call mentioning the variable
  name, without dataflow or shadowing. A later sibling memset/bzero/
  explicit_bzero or getsockname/getpeername/accept/recvfrom call taking
  &variable counts as initialization when it comes before the reported use;
  a sibling use that precedes such an initializer is still reported.
rule:
  all:
    - pattern: 'struct $T $V;'
    - inside:
        kind: function_definition
        stopBy: end
    - precedes:
        stopBy: end
        has:
          kind: call_expression
          stopBy: end
          has:
            pattern: '$V'
            stopBy: end
    - any:
        - not:
            precedes:
              stopBy: end
              all:
                - kind: expression_statement
                - has:
                    kind: call_expression
                    all:
                      - has:
                          field: function
                          regex: '^(memset|bzero|explicit_bzero|getsockname|getpeername|accept|recvfrom)$'
                      - has:
                          pattern: '&$V'
                          stopBy: end
                - precedes:
                    stopBy: end
                    has:
                      kind: call_expression
                      stopBy: end
                      has:
                        pattern: '$V'
                        stopBy: end
        - precedes:
            stopBy: end
            all:
              - kind: expression_statement
              - has:
                  kind: call_expression
                  stopBy: end
                  has:
                    pattern: '$V'
                    stopBy: end
              - not:
                  has:
                    kind: call_expression
                    all:
                      - has:
                          field: function
                          regex: '^(memset|bzero|explicit_bzero|getsockname|getpeername|accept|recvfrom)$'
                      - has:
                          pattern: '&$V'
                          stopBy: end
              - precedes:
                  stopBy: end
                  all:
                    - kind: expression_statement
                    - has:
                        kind: call_expression
                        all:
                          - has:
                              field: function
                              regex: '^(memset|bzero|explicit_bzero|getsockname|getpeername|accept|recvfrom)$'
                          - has:
                              pattern: '&$V'
                              stopBy: end
constraints:
  T:
    regex: '^sockaddr(_in6?)?$'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-457'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/457.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'if (x) { memset(&sa, 0, sizeof sa); } connect(...) with a memset/bzero/getsockname initialiser nested in a branch is still reported'
  todo_cases:
    - "static void f(int fd) { struct sockaddr_un sa; connect(fd, (struct sockaddr *)&sa, sizeof sa); }"
    - "static void f(int fd) { struct sockaddr_storage sa; connect(fd, (struct sockaddr *)&sa, sizeof sa); }"
    - "static void f(int fd) { struct sockaddr_in sa; memset(&sa, 0, sizeof(&sa)); connect(fd, (struct sockaddr *)&sa, sizeof sa); }"
