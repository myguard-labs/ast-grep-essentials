id: c-php-hex-decode-half-strlen-alloc
language: c
severity: warning
message: >-
  Allocation sized by strlen(...) / 2 with no preceding parity check;
  odd-length input may not be rejected.
note: >-
  Syntactic heuristic only; it looks for a preceding sibling if statement
  mentioning % 2 and does not verify that it checks the same string or guards
  the allocation.
rule:
  all:
    - kind: expression_statement
    - has:
        pattern: 'strlen($$$A) / 2'
        stopBy: end
    - not:
        follows:
          kind: if_statement
          regex: '%\s*2'
          stopBy: end
