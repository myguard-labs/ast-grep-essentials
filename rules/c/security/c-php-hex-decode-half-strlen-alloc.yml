id: c-php-hex-decode-half-strlen-alloc
language: c
severity: warning
message: >-
  Allocation sized by strlen(...) / 2 with no preceding parity check;
  odd-length input may not be rejected.
note: >-
  Syntactic heuristic only; it looks for a preceding sibling if statement
  containing strlen(X) % 2 or strlen(X) & 1 on the same string X as the
  allocation, and does not verify that the if actually rejects the input.
rule:
  all:
    - kind: expression_statement
    - has:
        pattern: 'strlen($S) / 2'
        stopBy: end
    - not:
        follows:
          kind: if_statement
          stopBy: end
          has:
            stopBy: end
            any:
              - pattern: 'strlen($S) % 2'
              - pattern: 'strlen($S) & 1'
