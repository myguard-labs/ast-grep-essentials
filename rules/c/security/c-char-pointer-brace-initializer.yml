id: c-char-pointer-brace-initializer
language: c
severity: warning
message: >-
  Pointer variable initialized with a brace-enclosed list; use an array
  declaration instead.
note: >-
  Matches the literal syntax of a declaration whose declarator is a pointer
  and whose initializer is a brace list. It does not check types, aliasing, or
  whether the pointer is used elsewhere in the file.
rule:
  kind: init_declarator
  all:
    - has:
        field: declarator
        kind: pointer_declarator
    - has:
        field: value
        kind: initializer_list
    - not:
        has:
          field: declarator
          kind: pointer_declarator
          any:
            - has:
                field: declarator
                kind: array_declarator
            - has:
                field: declarator
                kind: pointer_declarator
                has:
                  field: declarator
                  kind: array_declarator
    - not:
        has:
          field: value
          kind: initializer_list
          regex: '^\{\s*(0|NULL)\s*\}$'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-587'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/587.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'FP: int *p = { 0, }; (trailing comma), { (void *)0 } and { nullptr } null initializers are still reported'
