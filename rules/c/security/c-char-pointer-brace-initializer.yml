id: c-char-pointer-brace-initializer
language: c
severity: warning
message: >-
  Pointer variable initialized with a brace-enclosed list; use an array
  declaration instead.
note: >-
  Matches the literal syntax of a declaration whose declarator is a pointer
  and whose initializer is a brace list. It does not check types, aliasing, or
  whether the pointer is used elsewhere in the file.
rule:
  kind: init_declarator
  all:
    - has:
        field: declarator
        kind: pointer_declarator
    - has:
        field: value
        kind: initializer_list
