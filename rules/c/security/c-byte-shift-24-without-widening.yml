id: c-byte-shift-24-without-widening
language: c
severity: warning
message: >-
  Byte from an unsigned char pointer is shifted left by 24 without a widening
  cast to a 32-bit unsigned type.
note: >-
  Single-file syntactic match on a literal subscript of an identifier shifted
  by 24; it does not resolve types, promotions, or whether the operand is ever
  reached with a high bit set.
rule:
  pattern: '$P[$I] << 24'
