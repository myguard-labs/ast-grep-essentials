id: c-tsrmls-cc-in-parameter-list
language: c
severity: warning
message: >-
  TSRMLS_CC appears as a trailing parameter in a function definition; the
  declaration form TSRMLS_DC is required here.
note: >-
  Syntactic match only. It flags a parameter list whose last identifier is
  TSRMLS_CC after another parameter; it does not verify that the function is a
  definition in a ZTS build or resolve macro definitions.
rule:
  kind: parameter_list
  has:
    kind: identifier
    regex: '^TSRMLS_CC$'
    stopBy: end
  inside:
    kind: function_definition
    stopBy: end
