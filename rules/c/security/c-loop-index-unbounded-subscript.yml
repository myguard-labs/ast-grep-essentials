  cwe: 'CWE-787|CWE-125'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/787.html|https://cwe.mitre.org/data/definitions/125.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'void f(char *s, char *r, size_t j) { int i = 0; while (j-- > 0) { *r++ = s[i]; i++; } }'
    - 'void f(char *s, char *r, size_t j) { int i = 0; while (j-- > 0) { *r++ = s[++i]; } }'
