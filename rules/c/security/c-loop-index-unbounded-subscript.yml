# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-loop-index-unbounded-subscript
language: c
severity: warning
message: >-
  While loop subscripts an array with a post-incremented index that the loop
  condition never mentions; check for buffer overrun.
note: >-
  Syntactic only; does not check whether the index is bounded elsewhere,
  aliasing, or actual buffer sizes. Likely noisy.
rule:
  kind: while_statement
  all:
    - has:
        field: body
        has:
          pattern: '$A[$I++]'
          stopBy: end
    - not:
        has:
          field: condition
          has:
            pattern: '$I'
            stopBy: end
