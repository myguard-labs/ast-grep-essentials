# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-count-division-plus-one-overcount
language: c
severity: warning
message: >-
  A division result plus one is assigned as a count; this overcounts when the
  division is exact.
note: >-
  Syntactic match only. Matches an assignment whose right-hand side is a
  division plus one. Does not verify the operands, types, or whether the
  division can be exact.
rule:
  pattern: '$VAR = $A / $B + 1'
