# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-non-ascii-identifier
language: c
severity: warning
message: >-
  Identifier contains a non-ASCII character and may be a lookalike of an ASCII
  name.
note: >-
  Matches identifier tokens containing any non-ASCII character by text only.
  It does not determine whether a lookalike ASCII symbol exists, and it
  depends on the C grammar tokenizing the identifier.
rule:
  kind: identifier
  regex: '[^\x00-\x7F]'
