# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-alloc-returned-through-failing-call
language: c
severity: warning
message: >-
  Allocated pointer is stored in a local and the function returns a call
  result directly; if that call fails the allocation may leak.
note: >-
  Syntactic only; does not verify the call takes the same local, can fail, or
  that no free occurs elsewhere.
rule:
  kind: return_statement
  has:
    kind: call_expression
  follows:
    stopBy: end
    kind: declaration
    has:
      kind: init_declarator
      has:
        kind: call_expression
        has:
          field: function
          regex: '^(pemalloc|emalloc|malloc)$'
