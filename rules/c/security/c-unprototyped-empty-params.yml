id: c-unprototyped-empty-params
language: c
severity: warning
message: >-
  Function declared with an empty parameter list; use (void) to declare that
  it takes no parameters.
note: >-
  Syntactic match only on a function declarator whose parameter list is
  literally empty. It does not determine whether the function is called with
  arguments or whether a prior prototype exists elsewhere.
rule:
  kind: function_declarator
  has:
    field: declarator
    kind: identifier
    regex: '^[A-Za-z_][A-Za-z0-9_]*$'
  all:
    - has:
        field: parameters
        kind: parameter_list
        not:
          has:
            kind: parameter_declaration
