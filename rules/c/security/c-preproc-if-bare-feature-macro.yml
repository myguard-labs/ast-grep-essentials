# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-preproc-if-bare-feature-macro
language: c
severity: warning
message: 'Bare HAVE_ identifier in an if directive; use ifdef or defined().'
note: >-
  Syntactic only; matches a lone HAVE_ identifier as the whole condition, not
  compound conditions or macro values.
rule:
  all:
    - kind: preproc_if
    - has:
        field: condition
        all:
          - kind: identifier
          - regex: '^HAVE_'
