id: c-php-error-branch-falls-through
language: c
severity: warning
message: >-
  This error branch only warns via php_error_docref and then falls through
  without returning.
note: >-
  Purely syntactic text check on the block; it does not verify that the tested
  value is used later or resolve macros.
rule:
  kind: if_statement
  has:
    field: consequence
    kind: compound_statement
    all:
      - has:
          pattern: 'php_error_docref($$$ARGS)'
          stopBy: end
      - not:
          regex: '\b(return|goto|RETURN_[A-Z_]+)\b'
