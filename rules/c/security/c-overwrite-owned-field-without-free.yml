id: c-overwrite-owned-field-without-free
language: c
severity: warning
message: >-
  Allocator result is assigned to a struct member without freeing its previous
  value first.
note: >-
  Syntactic only. It looks for an earlier efree of the same member among
  preceding sibling statements. It does not track aliasing, initialisation, or
  frees in other blocks.
rule:
  all:
    - pattern: '$OBJ->$F = $ALLOC($$$ARGS);'
    - not:
        follows:
          stopBy: end
          pattern: 'efree($OBJ->$F);'
constraints:
  ALLOC:
    regex: '^(emalloc|estrdup|estrndup|malloc)$'
