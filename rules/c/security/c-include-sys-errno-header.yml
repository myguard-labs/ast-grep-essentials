id: c-include-sys-errno-header
language: c
severity: warning
message: 'Include <errno.h> instead of <sys/errno.h> for the portable errno header.'
note: >-
  Matches the literal preprocessor include text syntactically; it does not
  verify platform availability or header contents.
rule:
  pattern: '#include <sys/errno.h>'
