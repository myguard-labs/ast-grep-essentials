id: c-list-cursor-advance-only-in-if
language: c
severity: warning
message: >-
  Loop cursor is advanced only inside an if branch with no else; the loop may
  never terminate when the condition is false.
note: >-
  Syntactic only; matches a while whose body is solely an if that advances the
  cursor, with no else text in the loop. It does not analyze advances
  elsewhere or other exits.
rule:
  all:
    - pattern: |
        while ($P != NULL) { if ($C) { $P = $P->next; } }
    - not:
        regex: '\belse\b'
