id: c-extern-module-missing-declare-data
language: c
severity: warning
message: >-
  File-scope extern declaration of a module object without
  AP_MODULE_DECLARE_DATA between the module keyword and the name.
note: >-
  Purely syntactic check on a literal extern module declaration; it does not
  resolve whether the name is a module object or verify the platform macro is
  needed or correctly defined.
rule:
  kind: declaration
  all:
    - has:
        kind: storage_class_specifier
        regex: '^extern$'
    - has:
        kind: type_identifier
        regex: '^module$'
    - not:
        has:
          kind: identifier
          regex: '^AP_MODULE_DECLARE_DATA$'
    - pattern: 'extern module $NAME;'
