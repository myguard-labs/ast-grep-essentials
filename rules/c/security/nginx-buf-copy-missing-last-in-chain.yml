id: nginx-buf-copy-missing-last-in-chain
language: c
severity: warning
message: >-
  Buffer copy sets last_buf without copying last_in_chain from the same source
  buffer.
note: >-
  Single-file syntactic check for a literal dst->last_buf = src->last_buf
  assignment inside a compound block with no sibling dst->last_in_chain =
  src->last_in_chain assignment. It does not resolve types, aliasing, or
  whether a later statement copies the flag.
rule:
  all:
    - pattern: '$DST->last_buf = $SRC->last_buf'
    - inside:
        kind: compound_statement
        stopBy: end
    - not:
        inside:
          kind: compound_statement
          stopBy: end
          has:
            pattern: '$DST->last_in_chain = $SRC->last_in_chain'
            stopBy: end
