id: c-null-check-and-deref-same-ptr
language: c
severity: warning
message: >-
  This condition dereferences a pointer with -> on the right of && after
  testing it with !, so the dereference runs when the pointer is NULL.
note: >-
  Matches the literal syntax of a !p test joined by && to a p-> dereference of
  the same identifier. It does not resolve types, aliasing, or runtime values,
  and cannot confirm the pointer is actually NULL at that point.
rule:
  pattern: 'if (!$P && !($P->$F $$$REST)) { $$$BODY }'
