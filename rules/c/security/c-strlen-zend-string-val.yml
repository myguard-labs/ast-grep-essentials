id: c-strlen-zend-string-val
language: c
severity: warning
message: >-
  strlen() is applied to ZSTR_VAL(...) of a zend_string; embedded NUL bytes
  will truncate the measured length. Use ZSTR_LEN instead.
note: >-
  Purely syntactic match on a strlen call whose argument is a literal
  ZSTR_VAL(...) expression. It does not verify that the string can contain
  embedded NULs or that the zend_string is the same one whose length is
  compared.
rule:
  pattern: 'strlen(ZSTR_VAL($S))'
