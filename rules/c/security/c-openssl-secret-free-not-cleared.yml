# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-openssl-secret-free-not-cleared
language: c
severity: warning
message: 'OPENSSL_free on a secret-named buffer; consider OPENSSL_clear_free.'
note: >-
  Name heuristic only; it can miss secrets with neutral names and may flag
  non-secret names containing these words.
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: '^OPENSSL_free$'
    - has:
        field: arguments
        has:
          kind: identifier
          regex: '(?i)(key|secret|token|nonce|password)'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
