# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-ifdef-inside-macro-arguments
language: c
severity: warning
message: >-
  Preprocessor conditional appears inside a macro invocation's argument list;
  define the variant outside the call instead.
note: >-
  Syntactic text match on a call whose argument text contains a conditional
  directive line; it does not verify the callee is a macro.
rule:
  kind: call_expression
  regex: '(?s)^[^(]*\([^;]*\n[ \t]*#[ \t]*(if|ifdef|ifndef)\b'
