id: c-last-char-read-before-length-guard
language: c
severity: warning
message: >-
  Index x[len - 1] is read without an earlier visible check that len is at
  least 1.
note: >-
  Syntactic approximation only. It does not verify that a comparison guards
  the same length variable, and it does not track values or control flow.
rule:
  pattern: '$B[$N - 1]'
  not:
    inside:
      stopBy: end
      kind: binary_expression
      has:
        kind: binary_expression
        regex: '>=|<|>'
