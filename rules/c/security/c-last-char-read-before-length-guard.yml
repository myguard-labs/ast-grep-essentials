  cwe: 'CWE-125'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/125.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "FP (guard in an enclosing if statement is not recognised): int f(const char *b, int n) { if (n > 0) { return b[n - 1]; } return 0; }"
