# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-signed-literal-one-variable-shift
language: c
severity: warning
message: >-
  Unsigned-free literal 1 is shifted by a non-constant amount; use 1u to avoid
  signed overflow.
note: >-
  Syntactic only. Matches a literal 1 without unsigned suffix as the left
  operand of a left shift whose right operand is not a number literal. Does
  not evaluate the shift amount's value or the operand's type context.
rule:
  pattern: '1 << $AMT'
