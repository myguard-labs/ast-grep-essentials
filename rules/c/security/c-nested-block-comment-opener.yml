# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-nested-block-comment-opener
language: c
severity: warning
message: Block comment contains a nested comment opener.
note: >-
  Matches comment text syntactically; it does not decide how a particular
  compiler handles the comment.
rule:
  kind: comment
  regex: '(?s)^/\*.*/\*'
