# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-goto-label-named-boolean-macro
language: c
severity: warning
message: >-
  Label or goto target is named true or false, which breaks when a boolean
  header defines these macros.
note: >-
  Matches the literal label identifier only; it does not check whether
  stdbool.h is actually included.
rule:
  kind: statement_identifier
  regex: '^(true|false)$'
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
