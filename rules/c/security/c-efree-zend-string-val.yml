# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-efree-zend-string-val
language: c
severity: warning
message: >-
  efree is called on a .val field; verify this zend_string storage is not
  released with efree instead of str_efree.
note: >-
  Single-file syntactic match on a literal efree(X.val) call with a
  member-access argument. It does not verify that X is a zend_string or that
  the allocation came from str_efree-compatible storage; reviewers must check
  each hit.
rule:
  pattern: 'efree($X.val)'
