id: c-shift-add-precedence
language: c
severity: warning
message: >-
  Shift count is an unparenthesized additive expression; + binds tighter than
  <<, so verify the intended grouping.
note: >-
  Single-file syntactic match on a shift whose right operand is a bare binary
  + expression. It does not check types, macro expansion, or whether the
  surrounding code intended that grouping.
rule:
  pattern: '$A << $B + $C'
