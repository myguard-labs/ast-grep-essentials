# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-memcpy-fixed-local-array-variable-length
language: c
severity: warning
message: >-
  memcpy length is not a plain sizeof expression; check it cannot exceed the
  destination array size.
note: >-
  Syntactic only; requires the destination identifier to be declared as an
  array in an enclosing block (or at file level for top-level statements),
  skips a constant N * sizeof(T) or sizeof(T) * N length (not
  variable-length, so out of scope) and a copy inside the then-branch of an if
  whose condition is, or has an && operand that is,
  `<len> <= sizeof(dst)` or `sizeof(dst) >= <len>` (sizeof with or without
  parentheses) on the same length expression; a copy in the else branch,
  guarded by a different length, or whose guard is an operand of || or ! still
  matches. Other guards still match; a destination that is a global array used inside a function is not
  matched. The array declaration is looked up by name, so it may match a
  declaration in a sibling block or one that appears later in the scope.
rule:
  all:
    - pattern: 'memcpy($DST, $SRC, $LEN)'
    - any:
        - inside:
            stopBy: end
            kind: compound_statement
            has:
              stopBy: end
              pattern:
                context: 'int $DST[$SZ]'
                selector: array_declarator
        - all:
            - not:
                inside:
                  stopBy: end
                  kind: function_definition
            - inside:
                stopBy: end
                kind: translation_unit
                has:
                  stopBy: end
                  pattern:
                    context: 'int $DST[$SZ]'
                    selector: array_declarator
    - not:
        inside:
          stopBy: end
          inside:
            field: consequence
            kind: if_statement
            has:
              field: condition
              has:
                any:
                  - pattern: '$LEN <= sizeof($DST)'
                  - pattern: '$LEN <= sizeof $DST'
                  - pattern: 'sizeof($DST) >= $LEN'
                  - pattern: 'sizeof $DST >= $LEN'
                  - all:
                      - kind: binary_expression
                      - has: {field: operator, regex: '^&&$'}
                      - has:
                          any:
                            - pattern: '$LEN <= sizeof($DST)'
                            - pattern: '$LEN <= sizeof $DST'
                            - pattern: 'sizeof($DST) >= $LEN'
                            - pattern: 'sizeof $DST >= $LEN'
                            - all:
                                - kind: binary_expression
                                - has: {field: operator, regex: '^&&$'}
                                - has:
                                    any:
                                      - pattern: '$LEN <= sizeof($DST)'
                                      - pattern: '$LEN <= sizeof $DST'
                                      - pattern: 'sizeof($DST) >= $LEN'
                                      - pattern: 'sizeof $DST >= $LEN'
constraints:
  DST:
    kind: identifier
  LEN:
    not:
      any:
        - kind: sizeof_expression
        - all:
            - kind: binary_expression
            - has: {field: operator, regex: '^\*$'}
            - any:
                - all:
                    - has: {field: left, kind: number_literal}
                    - has: {field: right, kind: sizeof_expression}
                - all:
                    - has: {field: left, kind: sizeof_expression}
                    - has: {field: right, kind: number_literal}
metadata:
  rule_modified_at: '2026-11-16'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-11-16'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-120'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/120.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'guards ''if (n < sizeof(buf)) memcpy(buf, src, n);'' and ''if ((n <= sizeof(buf)))'' still match (only a single-parenthesis <= or >= guard is recognised); ''if (n <= sizeof(buf) && a && b && c) memcpy(buf, src, n);'' still matches (the && guard is searched two levels deep); cast guard ''if ((size_t)n <= sizeof(buf)) memcpy(buf, src, n);'' still matches'
  todo_cases:
    - "int buf[2]; memcpy(buf, src, 8 * sizeof(int));"
    - "int g[4]; void f(int *src, size_t n) { memcpy(g, src, n); }"
    - "struct s { int buf[4]; }; void f(struct s *p, int *src, size_t n) { memcpy(p->buf, src, n); }"
