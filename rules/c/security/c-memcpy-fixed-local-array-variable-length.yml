# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-memcpy-fixed-local-array-variable-length
language: c
severity: warning
message: >-
  memcpy length is not a plain sizeof expression; check it cannot exceed the
  destination array size.
note: >-
  Syntactic only; does not verify the destination is a fixed-size local array,
  and guarded copies also match.
rule:
  pattern: 'memcpy($DST, $SRC, $LEN)'
constraints:
  DST:
    kind: identifier
  LEN:
    not:
      kind: sizeof_expression
