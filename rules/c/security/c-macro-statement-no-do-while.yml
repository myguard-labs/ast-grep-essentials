# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-macro-statement-no-do-while
language: c
severity: warning
message: >-
  Function-like macro body is a bare if/else statement not wrapped in do { }
  while (0).
note: >-
  Syntactic check only. It flags function-like preprocessor macros whose
  replacement text begins with a bare if statement; it does not verify the
  macro is used in statement context or that the body is multi-statement.
rule:
  kind: preproc_function_def
  has:
    field: value
    regex: '^\s*if\b'
