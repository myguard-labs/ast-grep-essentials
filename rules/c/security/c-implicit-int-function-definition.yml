id: c-implicit-int-function-definition
language: c
severity: warning
message: >-
  Function definition has a storage class but no return type, so it relies on
  implicit int.
note: >-
  Purely syntactic match on a file-scope static definition with no visible
  return type; it does not check types, macros, or whether the declaration is
  in a header or a call site.
rule:
  kind: function_definition
  all:
    - has:
        kind: storage_class_specifier
        regex: '^static$'
    - not:
        has:
          kind: primitive_type
    - not:
        has:
          kind: type_identifier
