id: c-macro-assign-ternary-precedence
language: c
severity: warning
message: >-
  Function-like macro body mixes an assignment with a bare ?: conditional;
  parenthesize the conditional so operands bind correctly.
note: >-
  Heuristic text match on the opaque macro body; it cannot parse nesting, so
  it only flags an assignment followed by a comparison whose right operand
  directly precedes the ?.
rule:
  kind: preproc_function_def
  has:
    kind: preproc_arg
    regex: '[^=!<>]=[^=].*[<>]=?\s*\w+\s*\?'
