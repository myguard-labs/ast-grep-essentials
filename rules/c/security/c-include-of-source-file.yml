# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-include-of-source-file
language: c
severity: warning
message: Including a .c source file pulls a translation unit into another file.
note: >-
  Matches the quoted include path suffix syntactically; it does not check
  whether the file exists or is guarded.
rule:
  kind: preproc_include
  has:
    field: path
    kind: string_literal
    regex: '\.c"$'
