id: c-pqconnect-bad-no-finish
language: c
severity: warning
message: Connection failure branch returns without calling PQfinish on the handle.
note: >-
  Syntactic only; does not verify the handle came from PQconnectdb or PQsetdb,
  nor that PQfinish targets the same handle, and cleanup elsewhere is not
  tracked.
rule:
  all:
    - pattern: 'if (PQstatus($C) == CONNECTION_BAD) $BODY'
    - has:
        kind: return_statement
        stopBy: end
    - not:
        has:
          kind: call_expression
          regex: '^PQfinish\s*\('
          stopBy: end
