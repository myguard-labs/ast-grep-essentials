# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-pqconnect-bad-no-finish
language: c
severity: warning
message: Connection failure branch returns without calling PQfinish on the handle.
note: >-
  Syntactic only; does not verify the handle came from PQconnectdb or PQsetdb,
  nor that PQfinish targets the same handle, and cleanup elsewhere is not
  tracked.
rule:
  all:
    - pattern: 'if (PQstatus($C) == CONNECTION_BAD) $BODY'
    - has:
        kind: return_statement
        stopBy: end
    - not:
        has:
          kind: call_expression
          regex: '^PQfinish\s*\('
          stopBy: end
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-772'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/772.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'FN: `if (PQstatus(c) != CONNECTION_OK) return -1;`, `if ((PQstatus(c) == CONNECTION_BAD))`, the reversed `CONNECTION_BAD == PQstatus(c)` and a failure branch that only conditionally calls PQfinish (`if (x) { PQfinish(c); } return -1;`) are not reported.'
    - 'FP: an `if` that logs and exits through a cleanup helper `cleanup(c); return -1;` is reported even when the helper calls PQfinish.'
