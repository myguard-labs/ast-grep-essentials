id: c-hash-find-ind-value-no-deref
language: c
severity: warning
message: >-
  Pointer from zend_hash_find_ind is copied without ZVAL_DEREF; it may still
  be a reference wrapper.
note: >-
  Single-file syntactic check only. It matches a ZVAL_COPY of a variable
  assigned from zend_hash_find_ind in an if condition; it does not prove the
  pointer is never dereferenced elsewhere, and does not resolve types or
  aliasing.
rule:
  pattern: |
    if ((v = zend_hash_find_ind($$$ARGS)) != NULL) { ZVAL_COPY($$$COPYARGS, v); }
