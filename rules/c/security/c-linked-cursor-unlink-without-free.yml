id: c-linked-cursor-unlink-without-free
language: c
severity: warning
message: >-
  This assignment advances a pointer-to-pointer cursor by overwriting the list
  link, which unlinks the node without freeing it.
note: >-
  Purely syntactic match on the literal statement *b = (*b)->next; it does not
  verify that the node is unused, aliased, or freed elsewhere, and does not
  check reachability or runtime values.
rule:
  pattern: '*$P = (*$P)->next;'
