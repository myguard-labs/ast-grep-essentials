# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-shift-signed-literal-one
language: c
severity: warning
message: >-
  Left shift of the signed literal 1 by a non-constant count may be undefined
  behavior.
note: >-
  Purely syntactic check on the unsuffixed decimal literal 1 as the left shift
  operand; it does not evaluate the count's runtime value or the operand's
  type context, so small safe counts may be flagged.
rule:
  pattern: '1 << $BIT'
