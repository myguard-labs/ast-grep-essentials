id: c-bitmask-shift-precedence
language: c
severity: warning
message: >-
  Unparenthesized left shift inside a bitwise AND; the shift binds first, so
  the mask applies to the shifted value.
note: >-
  Syntactic check only. It flags a binary & whose operand is an
  unparenthesized left shift; it does not verify operand types, intended
  precedence, or runtime values.
rule:
  pattern: '$A & $B << $C'
