id: c-postfix-increment-assignment-target
language: c
severity: warning
message: >-
  The left side of this assignment is a postfix increment or decrement, not a
  dereference. Did you mean to write through the pointer, as in *q++ = value?
note: >-
  Syntactic text match only. It flags a block that contains a statement
  starting with a plain identifier followed by ++ or -- and a single equals
  sign. It does not check types, macros, or intent, and it ignores member or
  subscript operands.
rule:
  kind: compound_statement
  regex: '(^|[;{}]\s*)[A-Za-z_]\w*\s*(\+\+|--)\s*=([^=]|$)'
