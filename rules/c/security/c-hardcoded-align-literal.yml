id: c-hardcoded-align-literal
language: c
severity: warning
message: >-
  Alignment rounding divides and multiplies by the same integer literal;
  consider sizeof of the aligned type.
note: >-
  Matches the syntactic shape (x / N) * N with a repeated integer literal
  only; it cannot tell whether this is really alignment or what the platform
  alignment is.
rule:
  pattern: '($X / $N) * $N'
constraints:
  'N':
    kind: number_literal
