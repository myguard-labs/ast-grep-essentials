id: c-free-null-result-after-self-reassign
language: c
severity: warning
message: >-
  This variable is assigned the result of a call over its own input and then
  freed inside a NULL check, so the original pointer may be leaked.
note: >-
  Syntactic match only. Matches a literal self-assignment from a call followed
  by an if-NULL branch that frees the same variable; it does not verify types,
  aliasing, or runtime values.
rule:
  pattern: |
    if ($X == NULL) {
      xmlFreeNode($X);
    }
