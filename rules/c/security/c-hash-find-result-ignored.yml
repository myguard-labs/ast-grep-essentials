id: c-hash-find-result-ignored
language: c
severity: warning
message: >-
  The return value of zend_hash_find is discarded; the out-parameter is only
  valid on SUCCESS.
note: >-
  Matches only a bare zend_hash_find call statement. It does not verify that
  the out-parameter is later tested or dereferenced, and it does not resolve
  the callee identity.
rule:
  pattern: 'zend_hash_find($$$ARGS);'
