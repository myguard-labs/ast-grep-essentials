# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-decimal-entity-digit-unchecked
language: c
severity: warning
message: >-
  Character minus '0' is accumulated into a number without a preceding digit
  range check.
note: >-
  Syntactic only. A preceding sibling if statement suppresses the match
  without checking that it validates digits. An enclosing if consequence
  suppresses it only when its condition range-checks or isdigit()-checks the
  same accumulated character expression, either as the whole condition or as
  one && conjunct of it (a || branch does not count).
rule:
  pattern: '$E = $E * 10 + ($C - ''0'');'
  all:
    - not:
        follows:
          kind: if_statement
          stopBy: end
    - not:
        inside:
          stopBy: end
          kind: if_statement
          field: consequence
          has:
            field: condition
            any:
              - has:
                  stopBy:
                    not:
                      any:
                        - kind: parenthesized_expression
                        - all:
                            - kind: binary_expression
                            - has:
                                field: operator
                                regex: '^&&$'
                  any:
                    - pattern:
                        context: 'isdigit($C);'
                        selector: call_expression
                    - pattern:
                        context: 'isdigit((unsigned char)$C);'
                        selector: call_expression
              - all:
                  - has:
                      stopBy: &chain
                        not:
                          any:
                            - kind: parenthesized_expression
                            - all:
                                - kind: binary_expression
                                - has:
                                    field: operator
                                    regex: '^&&$'
                      any:
                        - pattern: '$C >= ''0'''
                        - pattern: '''0'' <= $C'
                  - has:
                      stopBy: *chain
                      any:
                        - pattern: '$C <= ''9'''
                        - pattern: '''9'' >= $C'
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
  created_at: '2026-10-19'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-20'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/20.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  todo_cases:
    - 'FN: ent *= 10; ent += (buf[0] - ''0''); (compound assignment)'
    - 'FN: ent = 10 * ent + (buf[0] - ''0''); (operands swapped)'
    - 'FN: if (x) { y(); } ent = ent * 10 + (buf[0] - ''0''); (an unrelated earlier if suppresses the match)'
