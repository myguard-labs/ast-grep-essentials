# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-decimal-entity-digit-unchecked
language: c
severity: warning
message: >-
  Character minus '0' is accumulated into a number without a preceding digit
  range check.
note: >-
  Syntactic only. It checks for a preceding sibling if statement, not whether
  that check actually validates digits.
rule:
  pattern: '$E = $E * 10 + ($C - ''0'');'
  not:
    follows:
      kind: if_statement
      stopBy: end
