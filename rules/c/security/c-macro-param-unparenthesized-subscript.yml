id: c-macro-param-unparenthesized-subscript
language: c
severity: warning
message: >-
  Function-like macro parameter is used as a subscript base without
  parentheses.
note: >-
  Syntactic match only on a preprocessor macro definition whose replacement
  text has a bare parameter directly before a subscript bracket; it does not
  verify argument expressions, types, or whether the macro is used with
  expression arguments.
rule:
  kind: preproc_function_def
  has:
    field: value
    regex: '\(\s*[A-Za-z_][A-Za-z0-9_]*\['
