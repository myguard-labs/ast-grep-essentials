# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-macro-param-unparenthesized-subscript
language: c
severity: warning
message: >-
  Function-like macro parameter is used as a subscript base without
  parentheses.
note: >-
  Syntactic match only on a preprocessor macro definition whose replacement
  text has a bare parameter directly before a subscript bracket; it does not
  verify argument expressions, types, or whether the macro is used with
  expression arguments.
rule:
  kind: preproc_function_def
  has:
    field: value
    regex: '\(\s*[A-Za-z_][A-Za-z0-9_]*\['
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-783'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/783.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: '#define FIRST(c) (buf[c]) is matched although c is the index, not the base (FP, low)'
  todo_cases:
    - "#define FIRST(c) c[0]"
    - "#define FIRST(c) (c [0])"
