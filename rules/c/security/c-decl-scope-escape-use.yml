# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-decl-scope-escape-use
language: c
severity: warning
message: >-
  A name declared inside an earlier nested block is used after that block
  closes.
note: >-
  Syntactic approximation; matches only sibling statements and does not check
  for outer declarations, shadowing, or other scopes.
rule:
  all:
    - kind: if_statement
    - follows:
        kind: if_statement
        has:
          stopBy: end
          pattern: '$T $X = $V;'
    - has:
        stopBy: end
        all:
          - kind: identifier
          - pattern: '$X'
