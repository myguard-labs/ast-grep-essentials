id: c-bitmap-words-div-plus-one
language: c
severity: warning
message: >-
  Word count computed as N / (8 * sizeof(T)) + 1 may be off by one for
  bitmaps; consider ceiling division.
note: >-
  Matches the literal syntax only; it cannot tell whether the extra word is
  harmless or how the result is used.
rule:
  kind: binary_expression
  all:
    - has:
        field: right
        regex: '^1$'
    - has:
        field: left
        kind: binary_expression
        all:
          - pattern: '$A / $B'
          - has:
              field: right
              kind: parenthesized_expression
              regex: '^\(\s*8\s*\*\s*sizeof\s*\('
