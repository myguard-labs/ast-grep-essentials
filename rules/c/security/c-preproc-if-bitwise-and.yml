# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-preproc-if-bitwise-and
language: c
severity: warning
message: >-
  Preprocessor conditional joins HAVE_ macros with bitwise & instead of
  logical &&.
note: >-
  Purely syntactic; matches the literal HAVE_ identifier shape inside an #if
  and does not check macro values.
rule:
  all:
    - kind: binary_expression
    - regex: '^HAVE_\w+\s*&\s*HAVE_\w+'
    - inside:
        stopBy: end
        kind: preproc_if
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
