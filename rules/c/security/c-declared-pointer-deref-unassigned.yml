# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-declared-pointer-deref-unassigned
language: c
severity: warning
message: >-
  Member write through a local pointer that was declared without an
  initializer and not assigned earlier.
note: >-
  Syntactic, flow-insensitive check on sibling statements only; it does not
  track aliasing, assignments in nested blocks, or address-taking.
rule:
  all:
    - pattern: '$P->$F = $V;'
    - follows:
        pattern: '$T *$P;'
        stopBy: end
    - not:
        follows:
          pattern: '$P = $V2;'
          stopBy: end
