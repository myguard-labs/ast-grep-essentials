id: c-macro-param-unparenthesized-member
language: c
severity: warning
message: >-
  Macro body applies `->` to a bare identifier; parenthesize macro parameters,
  e.g. `(v)->type`.
note: >-
  Text-based match on the function-like macro body; it does not verify that
  the identifier is actually a macro parameter.
rule:
  kind: preproc_arg
  inside:
    kind: preproc_function_def
  regex: '[A-Za-z_][A-Za-z0-9_]*\s*->'
