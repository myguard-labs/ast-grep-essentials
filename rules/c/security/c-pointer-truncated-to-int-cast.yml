id: c-pointer-truncated-to-int-cast
language: c
severity: warning
message: >-
  Cast to a 32-bit integer type may truncate a pointer on LP64 targets; use
  intptr_t or uintptr_t if the operand is a pointer.
note: >-
  Matches any cast to a 32-bit int type syntactically; it cannot verify that
  the operand is a pointer.
rule:
  kind: cast_expression
  has:
    field: type
    regex: '^(unsigned )?int$|^u?int32_t$'
