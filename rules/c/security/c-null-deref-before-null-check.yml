id: c-null-deref-before-null-check
language: c
severity: warning
message: >-
  Pointer is dereferenced with -> before a later if statement tests it for
  NULL.
note: >-
  Syntactic hint only; matches the same identifier text and cannot tell
  whether the pointer can be NULL at runtime without dataflow.
rule:
  kind: expression_statement
  all:
    - has:
        pattern: '$X->$F'
        stopBy: end
    - precedes:
        kind: if_statement
        has:
          field: condition
          has:
            pattern: '$X && $Y'
            stopBy: end
