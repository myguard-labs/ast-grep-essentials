id: c-convert-hash-lookup-in-place
language: c
severity: warning
message: >-
  convert_to_* is called in a scope that also assigns a zval pointer from
  zend_hash_str_find; converting a hash-owned value in place mutates the
  table.
note: >-
  Syntactic only; does not link the converted variable to the lookup result
  and does not check function boundaries, reassignment, or control flow.
rule:
  kind: call_expression
  has:
    field: function
    kind: identifier
    regex: '^convert_to_'
  inside:
    stopBy: end
    has:
      stopBy: end
      kind: init_declarator
      has:
        kind: call_expression
        has:
          field: function
          regex: '^zend_hash_str_find$'
