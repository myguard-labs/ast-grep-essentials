# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-output-length-param-unwritten
language: c
severity: warning
message: >-
  Output length parameter new_val_len is never written in this function that
  returns a value.
note: >-
  Syntactic only; does not detect writes via aliases, helper calls, or other
  forms such as memcpy or new_val_len[0].
rule:
  kind: function_definition
  all:
    - has:
        kind: parameter_declaration
        regex: '\*\s*new_val_len$'
        stopBy: end
    - has:
        kind: return_statement
        pattern: 'return $X;'
        stopBy: end
    - not:
        has:
          pattern: '*new_val_len = $V'
          stopBy: end
