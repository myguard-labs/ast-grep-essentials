# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: nginx-headers-out-push-next
language: c
severity: info
message: >-
  ngx_list_push(&r->headers_out.headers) returns UNZEROED pool memory. Since
  nginx 1.23.0, same-name response headers form a linked list through
  ngx_table_elt_t.next, so every push must set `h->next = NULL`. Core nginx
  does `h->hash = 1; h->next = NULL;` on every push. This function never
  assigns NULL to a `->next` field. An indeterminate `next` becomes a wild
  pointer walk in any consumer that follows the chain (Vary/Cache-Control
  merges, proxy, more_headers).
note: >-
  Syntactic candidate only. The rule stays quiet when the enclosing function
  contains any `X->next = NULL` assignment. It does not check that X is the
  pushed element, that the assignment is reachable, or that it runs before the
  element is used. It also does not treat memzero or a whole-struct assignment
  as clearing `next`. The reviewer should confirm these cases. This bug is
  invisible to ASan because the pool memory is live. Guard with `#if
  (nginx_version >= 1023000)` only where the tree still builds against nginx
  older than 1.23.
rule:
  pattern: 'ngx_list_push(&$R->headers_out.headers)'
  not:
    inside:
      kind: function_definition
      stopBy: end
      has:
        pattern: '$H->next = NULL'
        stopBy: end
