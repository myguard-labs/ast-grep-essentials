id: c-macro-param-prefix-mismatch
language: c
severity: warning
message: >-
  A macro body uses a bare identifier that matches a parameter name with its
  leading underscore removed; the argument is ignored.
note: >-
  Syntactic check only. It matches a bare identifier named like a stripped
  macro parameter inside a macro body; it does not prove that an outer
  variable of that name exists or that the macro is misused.
rule:
  kind: preproc_function_def
  has:
    kind: preproc_params
    regex: _ht
  regex: '\(\s*ht\s*->'
