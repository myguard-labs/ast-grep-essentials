# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-alloc-null-check-empty-branch
language: c
severity: warning
message: >-
  This NULL check has an empty body, so a failed allocation or lookup is
  silently ignored.
note: >-
  Syntactic match only. It flags any if-statement whose condition compares
  against NULL and whose body is an empty compound statement; it does not
  verify that the compared value came from an allocation or lookup, nor that
  execution continues unsafely afterward.
rule:
  pattern: 'if ($X == NULL) {}'
