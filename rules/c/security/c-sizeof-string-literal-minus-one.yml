# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-sizeof-string-literal-minus-one
language: c
severity: warning
message: >-
  sizeof is applied to a string literal minus a constant, which measures
  pointer arithmetic rather than the literal's length.
note: >-
  Matches the literal syntax sizeof(STRING - N) only; it does not resolve
  macros, types, or runtime values and does not check the surrounding code.
rule:
  pattern: 'sizeof("$S" - $N)'
