id: c-unprototyped-empty-parens-decl
language: c
severity: warning
message: >-
  Function has an empty parameter list; write (void) to declare it as a
  prototype.
note: >-
  Syntactic check only. Matches function definitions whose parameter list is
  literally empty, with no parameters or comments inside the parentheses; does
  not resolve macros, typedefs, or declarations in other files.
rule:
  kind: function_definition
  pattern: 'static void init_globals() { }'
