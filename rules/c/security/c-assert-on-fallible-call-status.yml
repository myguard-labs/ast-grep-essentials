id: c-assert-on-fallible-call-status
language: c
severity: warning
message: >-
  Status from an apr_ call is checked with an assert instead of returning the
  error to the caller.
note: >-
  Syntactic match only. Matches an ap_assert call whose argument compares a
  variable with APR_SUCCESS; it does not verify that the variable was assigned
  from an apr_ call or that the assert is in the same function.
rule:
  pattern: 'ap_assert($RC == APR_SUCCESS)'
