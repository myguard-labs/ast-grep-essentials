id: c-header-fold-tab-only-continuation
language: c
severity: warning
message: >-
  Header continuation check accepts only a tab as the folding character; RFC
  7230 obs-fold also allows a space.
note: >-
  Syntactic match on a literal tab-only comparison of a dereferenced byte
  inside a parenthesized condition. It does not prove the byte is in a
  header-folding context and cannot see the surrounding parser; it may flag
  legitimate tab-only code.
rule:
  pattern: 'if ((len > 0) && (*field == ''\t'')) { }'
