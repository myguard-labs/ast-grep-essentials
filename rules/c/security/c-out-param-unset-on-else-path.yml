id: c-out-param-unset-on-else-path
language: c
severity: warning
message: Out-parameter is assigned in an if branch with no else branch assigning it.
note: >-
  Syntactic only; matches the literal name out and does not check earlier
  initialization or other assignments.
rule:
  kind: if_statement
  has:
    field: consequence
    has:
      pattern: '*out = $VAL'
      stopBy: end
  not:
    has:
      field: alternative
      kind: else_clause
