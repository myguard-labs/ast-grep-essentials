# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-fixed-buffer-pointer-write-unbounded
language: c
severity: warning
message: >-
  Loop writes through a pointer without any sizeof bound check in the loop;
  possible buffer overflow.
note: >-
  Syntactic approximation only; does not verify the pointer walks a fixed
  array or resolve aliasing, and other bound forms (e.g. numeric constants)
  are not recognized.
rule:
  kind: while_statement
  all:
    - has:
        stopBy: end
        pattern: '*$P = $V'
    - not:
        has:
          stopBy: end
          kind: sizeof_expression
