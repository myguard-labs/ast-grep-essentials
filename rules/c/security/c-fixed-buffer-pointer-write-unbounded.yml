  taxonomy_source: 'https://cwe.mitre.org/data/definitions/120.html|https://cwe.mitre.org/data/definitions/787.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'int f(const char *p) { char buf[18]; char *q = buf; do { *q = *p; q++; p++; } while (*p); return 0; }'
    - 'int f(const char *p) { char buf[18]; char *q = buf; for (; *p; p++) { *q = *p; q++; } return 0; }'
