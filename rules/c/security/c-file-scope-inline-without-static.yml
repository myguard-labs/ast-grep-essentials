id: c-file-scope-inline-without-static
language: c
severity: warning
message: >-
  File-scope function definition uses inline without static or extern storage
  class.
note: >-
  Purely syntactic check on a single file. It matches top-level function
  definitions whose declaration specifiers include inline and no static or
  extern keyword; it does not resolve linkage, definitions in other
  translation units, or toolchain behavior.
rule:
  kind: function_definition
  inside:
    kind: translation_unit
    stopBy: end
  has:
    kind: storage_class_specifier
    not:
      regex: '^(static|extern)$'
    stopBy: neighbor
  regex: '^inline\b'
