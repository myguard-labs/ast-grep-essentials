id: c-strncpy-manual-nul-use-strlcpy
language: c
severity: warning
message: >-
  This strncpy call is followed by a manual NUL store into the last byte of
  the destination; consider a bounded copy helper such as strlcpy.
note: >-
  Purely syntactic match on a literal strncpy call whose length is sizeof(X) -
  1 and a following statement storing '\0' into X[sizeof(X) - 1]. It does not
  resolve types, aliasing, or whether the destination is actually a fixed-size
  array, and does not check that the NUL store is adjacent or reachable.
rule:
  pattern: 'strncpy($DST, $SRC, sizeof($DST) - 1)'
