# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-unescape-backslash-read-past-end
language: c
severity: warning
message: >-
  This backslash check reads the next byte with no bound check between the two
  reads, which can go past the end of the buffer.
note: >-
  Syntactic match only. It matches an if-condition of the form *p++ == '\\'
  whose braced body reads *p++ again, unless that read sits under an inner
  if testing *p or p < end on the same pointer. It does not verify buffer
  bounds, aliasing, or reachability.
rule:
  pattern: |
    if (*$P++ == '\\') { $$$BODY }
  has:
    field: consequence
    kind: compound_statement
    has:
      pattern: '*$P++'
      stopBy: end
      not:
        inside:
          kind: if_statement
          stopBy: end
          has:
            field: condition
            has:
              stopBy: end
              any:
                - pattern: '*$P'
                - pattern: '$P < $END'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-126'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/126.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - "void f(char *p, char *dst) { if (*p++ == '\\\\') *dst = *p++; }"
    - "void f(char *p, char *dst) { if (*p) { if (*p++ == '\\\\') { *dst = *p++; } } }"
    - "void f(char *p, char *end, char *dst) { if (p < end) { if (*p++ == '\\\\') { *dst = *p++; } } }"
    - "void f(char *p, char *dst) { if (*p) { } else { if (*p++ == '\\\\') { *dst = *p++; } } }"
