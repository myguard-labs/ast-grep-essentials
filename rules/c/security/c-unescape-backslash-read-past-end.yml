id: c-unescape-backslash-read-past-end
language: c
severity: warning
message: >-
  This backslash check reads the next byte with no bound check between the two
  reads, which can go past the end of the buffer.
note: >-
  Syntactic match only. It matches an if-condition of the form *p++ == '\\'
  whose body reads *p++ again, with no bound check in the same condition. It
  does not verify buffer bounds, aliasing, or reachability.
rule:
  pattern: |
    if (*$P++ == '\\') { $$$BODY }
  has:
    pattern: '*$P++'
    stopBy: end
    inside:
      kind: compound_statement
      stopBy: end
