id: c-libxml-dump-guard-size-not-buffer
language: c
severity: warning
message: >-
  Guard after xmlDocDumpFormatMemory tests only the size out-parameter, not
  the buffer pointer.
note: >-
  Syntactic only; matches an if directly after the dump call whose condition
  is just !size. Does not track aliasing or later checks.
rule:
  pattern: 'if (!$S) { $$$B }'
  follows:
    kind: expression_statement
    has:
      pattern: 'xmlDocDumpFormatMemory($D, &$M, &$S, $$$A)'
