# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-else-unbraced-single-statement
language: c
severity: warning
message: >-
  Else branch is an unbraced single expression statement; add braces to avoid
  control-flow mistakes.
note: >-
  Matches syntax only; it does not check indentation or whether a following
  line was meant to belong to the else branch.
rule:
  kind: else_clause
  has:
    kind: expression_statement
    stopBy: neighbor
