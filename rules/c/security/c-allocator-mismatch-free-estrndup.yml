# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-allocator-mismatch-free-estrndup
language: c
severity: warning
message: >-
  Pointer allocated with a PHP emalloc-family allocator is passed to libc
  free(); use efree().
note: >-
  Syntactic same-scope check only. It does not resolve reassignment, aliasing,
  macros, or control flow between the allocation and free.
rule:
  pattern: 'free($P);'
  follows:
    stopBy: end
    pattern: '$T *$P = $F($$$A);'
constraints:
  F:
    regex: '^(estrndup|estrdup|emalloc|ecalloc|erealloc|safe_emalloc)$'
