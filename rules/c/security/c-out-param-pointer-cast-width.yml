id: c-out-param-pointer-cast-width
language: c
severity: warning
message: >-
  Address of a variable is cast to a pointer of a different type when passed
  as an argument; verify the callee writes the variable's declared width.
note: >-
  Matches the literal syntax of a cast applied to the address of an identifier
  inside a call argument. It does not know the variable's declared type or the
  callee's expected width, so it cannot confirm a width mismatch.
rule:
  pattern: '(unsigned int *)&$VAR'
