# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-re2c-signed-yyctype
language: c
severity: warning
message: >-
  YYCTYPE is defined as plain char, which may be signed; high-bit bytes can
  become negative in re2c range checks.
note: >-
  Matches only the literal single-file macro text `#define YYCTYPE char`. It
  does not resolve types, compiler char signedness, or whether the macro is
  used by a re2c scanner.
rule:
  pattern: '#define YYCTYPE char'
