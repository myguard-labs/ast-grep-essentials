id: c-alloc-early-return-without-free
language: c
severity: warning
message: >-
  An if-block returns after the local was assigned an allocation, without
  freeing or referencing it.
note: >-
  Syntactic only; it does not check control flow, aliasing, ownership
  transfer, or whether the if-block is truly on a path after the allocation.
rule:
  kind: if_statement
  all:
    - follows:
        pattern: '$V = $F($$$A);'
        stopBy: end
    - has:
        kind: return_statement
        stopBy: end
    - not:
        has:
          pattern: '$V'
          stopBy: end
constraints:
  F:
    regex: '^(emalloc|malloc|estrdup)$'
