id: c-generate-ex-into-null-initialised-pointer
language: c
severity: warning
message: >-
  Pointer initialised to NULL is passed as the output object of a
  *_generate_parameters_ex call.
note: >-
  Syntactic only; it does not check for intervening assignments or allocations
  between the declaration and the call.
rule:
  all:
    - pattern: '$F($P, $$$ARGS);'
    - follows:
        pattern: '$T *$P = NULL;'
        stopBy: end
constraints:
  F:
    regex: '_generate_parameters_ex$'
