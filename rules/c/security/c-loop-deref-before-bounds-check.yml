id: c-loop-deref-before-bounds-check
language: c
severity: warning
message: >-
  Pointer is dereferenced in a for-loop condition before the bounds comparison
  on the same pointer.
note: >-
  Syntactic single-file match only. It matches a for-loop condition whose
  first && operand dereferences an identifier and whose second operand
  compares that same identifier with >=; it does not resolve types, aliasing,
  or runtime validity.
rule:
  pattern: 'for ($INIT; *$P != $C && $P >= $S; $UPD) $BODY'
