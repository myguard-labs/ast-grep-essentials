id: c-comparison-result-discarded
language: c
severity: warning
message: >-
  This equality or inequality comparison forms a whole expression statement,
  so its result is discarded; check whether an assignment was intended.
note: >-
  Purely syntactic check on a C expression statement whose whole expression is
  a == or != binary expression. A comparison nested in a call argument or
  other subexpression is used, so it is not matched. It does not resolve
  types, values, or side effects, and it cannot confirm intent.
rule:
  all:
    - kind: expression_statement
    - has:
        kind: binary_expression
        pattern: '$A == $B'
    - not:
        has:
          kind: assignment_expression
          stopBy: end
