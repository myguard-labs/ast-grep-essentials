# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-unaligned-wide-load-via-cast
language: c
severity: warning
message: >-
  Dereferencing a wider integer pointer cast of a byte-array element address
  may be an unaligned or aliasing-violating load.
note: >-
  Matches the literal syntax of a dereferenced cast of an address-of subscript
  to an unsigned short pointer. Does not resolve types, alignment, or aliasing
  at runtime; wider casts of other shapes are not matched.
rule:
  pattern: '*((unsigned short *)&$A[$I])'
