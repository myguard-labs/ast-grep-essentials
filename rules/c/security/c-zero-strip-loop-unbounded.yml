# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-zero-strip-loop-unbounded
language: c
severity: warning
message: >-
  This while loop skips zero bytes by stepping a pointer backward with no
  separate length bound in its condition.
note: >-
  Purely syntactic check of a while loop whose condition is only a
  dereferenced zero test and whose body decrements a pointer. It does not
  verify buffer bounds, aliasing, or whether another guard exists outside the
  shown syntax.
rule:
  all:
    - kind: while_statement
    - has:
        kind: unary_expression
        pattern: '!*$P'
        stopBy: end
    - has:
        pattern: '$P--'
        stopBy: end
    - not:
        has:
          kind: binary_expression
          stopBy: end
          pattern: '$A && $B'
