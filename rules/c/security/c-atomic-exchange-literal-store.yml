id: c-atomic-exchange-literal-store
language: c
severity: warning
message: >-
  Exchange-like function stores a boolean literal to a member instead of its
  value parameter.
note: >-
  Matches syntax only. It matches by function name text and does not check
  that the function is atomic or which parameter is the value.
rule:
  kind: assignment_expression
  all:
    - has:
        field: left
        kind: field_expression
    - has:
        field: right
        regex: '^(true|false)$'
    - inside:
        stopBy: end
        kind: function_definition
        has:
          field: declarator
          kind: function_declarator
          has:
            field: declarator
            kind: identifier
            regex: exchange
metadata:
