id: c-bn-carry-add-without-mask
language: c
severity: warning
message: >-
  Assignment of a word plus carry without BN_MASK2 masking; the subsequent
  carry comparison may be incorrect.
note: >-
  Syntactic check only. Matches a plain assignment whose right-hand side is a
  bare addition of tp[num] and c0, with no masking operator in that
  expression. It does not resolve types, verify that the variables are
  BN_ULONG, or confirm the carry is used later.
rule:
  pattern: '$V = tp[num] + c0;'
