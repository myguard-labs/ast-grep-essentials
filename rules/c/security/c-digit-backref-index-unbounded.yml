  taxonomy_source: 'https://cwe.mitre.org/data/definitions/129.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  todo_cases:
    - "FN (>= operand order): if (c >= 48 && t[c - 48]) is not matched because the range test must be written '0' <= c."
    - "FP (strict bound): if ('0' <= c && c - '0' < n && t[c - '0']) is matched because only a <= bound counts as a guard."
