id: c-digit-backref-index-unbounded
language: c
severity: warning
message: >-
  Array indexed by a digit character is guarded only by a digit range test,
  not by the array's count.
note: >-
  Matches syntax only within one parenthesized condition; it does not resolve
  array sizes, aliases, or guards outside that condition.
rule:
  pattern: '$A[$X - ''0'']'
  inside:
    kind: parenthesized_expression
    stopBy: end
    all:
      - has:
          pattern: '''0'' <= $X'
          stopBy: end
      - not:
          has:
            pattern: '$X - ''0'' <= $N'
            stopBy: end
