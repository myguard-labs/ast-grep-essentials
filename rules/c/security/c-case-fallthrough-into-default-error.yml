# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-case-fallthrough-into-default-error
language: c
severity: warning
message: >-
  This case has no direct break and falls through into a default label that
  jumps to an error exit.
note: >-
  Syntactic only. It checks that the case has no direct break statement and
  that the next sibling label is a default containing a direct goto. It does
  not check reachability, and intentional fallthrough is possible.
rule:
  all:
    - kind: case_statement
    - regex: '^case'
    - not:
        has:
          any:
            - kind: break_statement
            - kind: return_statement
            - kind: continue_statement
            - all:
                - kind: goto_statement
                - pattern: 'goto $L;'
                - not:
                    any:
                      - precedes:
                          stopBy: end
                          kind: labeled_statement
                          has:
                            kind: statement_identifier
                            pattern: $L
                      - follows:
                          stopBy: end
                          kind: labeled_statement
                          has:
                            kind: statement_identifier
                            pattern: $L
            - kind: compound_statement
              has:
                nthChild:
                  position: 1
                  reverse: true
                any:
                  - kind: break_statement
                  - kind: return_statement
                  - kind: continue_statement
                  - kind: goto_statement
    - precedes:
        kind: case_statement
        regex: '^default'
        has:
          kind: goto_statement
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
  created_at: '2026-10-19'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-484'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/484.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A10:2025'
  todo_cases:
    - 'FP: case 1: default: goto err; (stacked labels, not shown as invalid; also flagged)'
    - 'FN: case 1: a(); default: if (x) goto err; (goto nested in default if)'
    - 'FN: case 1: { goto L; } L: a(); default: goto err; (goto in a braced case skips the same-case label check)'
