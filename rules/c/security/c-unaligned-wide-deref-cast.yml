# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-unaligned-wide-deref-cast
language: c
severity: warning
message: >-
  Direct dereference of a pointer cast to a wider integer type may read
  unaligned or aliased storage; copy the bytes through a byte-copy accessor
  instead.
note: >-
  Matches only the literal syntax of a dereferenced cast to a uint16_t,
  uint32_t, or uint64_t pointer. It does not verify buffer alignment,
  aliasing, or the pointer's runtime value.
rule:
  pattern: '*((uint32_t *) $P)'
