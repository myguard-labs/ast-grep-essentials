id: c-ifdef-guards-own-define
language: c
severity: warning
message: >-
  #ifdef tests a macro and then defines that same macro; the define only runs
  if it is already defined. Likely meant #ifndef.
note: >-
  Matches the literal directive shape only; it does not check other macro
  definitions, includes, or the build configuration.
rule:
  pattern: |
    #ifdef $NAME
    #define $NAME $VAL
    #endif
