# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-ifdef-multiple-tokens
language: c
severity: warning
message: >-
  #ifdef takes a single macro identifier; extra tokens are ignored. Use #if
  with defined(...) instead.
note: >-
  Textual line match over the translation unit; it does not resolve macros or
  preprocessor behavior, and reports the whole file node.
rule:
  kind: translation_unit
  regex: '(?m)^[ \t]*#[ \t]*ifdef[ \t]+\w+[ \t]+[^\s/]'
