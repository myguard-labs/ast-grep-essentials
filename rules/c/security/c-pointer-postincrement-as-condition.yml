id: c-pointer-postincrement-as-condition
language: c
severity: warning
message: >-
  Post-increment of a pointer is used directly as an if condition, so the
  pointer advances even when it is NULL.
note: >-
  Single-file syntactic match on an if condition whose expression is a
  post-increment of an identifier. It does not resolve types, confirm the
  operand is a pointer, or check reachability or aliasing.
rule:
  kind: if_statement
  has:
    field: condition
    kind: parenthesized_expression
    has:
      kind: update_expression
      pattern: '$X++'
