id: c-null-check-inverted-error-branch
language: c
severity: warning
message: >-
  This if/else tests a bare pointer for truth, returns in the then-branch, and
  dereferences the same pointer in the else-branch; verify the null-check
  branch is not inverted.
note: >-
  Purely syntactic single-file match on a bare identifier condition with a
  return in the then-branch and a read of the same identifier in the
  else-branch. It does not resolve types, aliasing, or whether the pointer can
  actually be NULL at runtime.
rule:
  kind: if_statement
  has:
    field: condition
    kind: parenthesized_expression
    has:
      kind: identifier
      pattern: buf
  any:
    - pattern: 'if (buf) { return $$$A; } else { $$$B }'
