id: c-inline-external-linkage-function
language: c
severity: warning
message: >-
  Function is declared inline without static, so it has external linkage;
  verify an external definition exists.
note: >-
  Syntactic check only. Matches a function definition whose specifiers include
  inline but not static; it cannot verify whether an external definition is
  emitted elsewhere in the program, which needs cross-file and linkage
  analysis.
rule:
  kind: function_definition
  all:
    - has:
        kind: storage_class_specifier
        regex: '^inline$'
        stopBy: end
    - not:
        has:
          kind: storage_class_specifier
          regex: '^static$'
          stopBy: end
