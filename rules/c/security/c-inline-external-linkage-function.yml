id: c-inline-external-linkage-function
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-inline-definition-without-static. Function is
  declared inline without static, so it has external linkage; verify an
  external definition exists.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use c-inline-definition-without-static and do not emit this
  rule.
rule:
  kind: function_definition
  all:
    - has:
        kind: storage_class_specifier
        regex: '^inline$'
    - not:
        has:
          kind: storage_class_specifier
          regex: '^static$'
metadata:
  deprecated_alias_of: c-inline-definition-without-static
  rule_modified_at: '2026-11-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
