id: c-exclusive-loop-bound-minus-one
language: c
severity: warning
message: >-
  Loop bound uses '<' against (x + (n - 1)), which may exclude the last
  element of a span; review the bound.
note: >-
  Single-file syntactic match on a for loop whose condition is a '<' binary
  expression whose right side is a parenthesized sum containing a
  parenthesized subtraction of 1. It does not resolve types, aliasing, or
  whether the exclusion is intentional.
rule:
  kind: for_statement
  has:
    kind: binary_expression
    pattern: '$VAR < ($BASE + ($N - 1))'
