id: c-parse-offset-minus2-without-length-guard
language: c
severity: warning
message: >-
  Indexing buf with a length minus 2 in a condition may underflow when the
  length is less than 2; add a length check first.
note: >-
  Purely syntactic match on an if-condition containing a buf[x - 2] index with
  no length >= 2 test in the same condition. It does not resolve types, value
  ranges, or whether the length is guarded elsewhere in the function.
rule:
  all:
    - pattern: 'if ($COND) $BODY'
    - has:
        pattern: 'buf[total - 2]'
        stopBy: end
    - not:
        has:
          pattern: 'total >= 2'
          stopBy: end
