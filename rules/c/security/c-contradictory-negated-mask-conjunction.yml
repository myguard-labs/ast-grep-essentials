id: c-contradictory-negated-mask-conjunction
language: c
severity: warning
message: >-
  This AND tests the same bitmask both negated and non-negated, so the
  condition is always false.
note: >-
  Syntactic match only. Requires the left and right operands to be textually
  identical bitmask tests with the same variable and mask; does not check
  types, macro values, or aliasing.
rule:
  any:
    - pattern: '!($E & $M) && ($E & $M)'
