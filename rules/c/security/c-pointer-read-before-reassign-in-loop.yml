id: c-pointer-read-before-reassign-in-loop
language: c
severity: warning
message: >-
  Pointer member is read before the pointer is reassigned later in the same
  loop body.
note: >-
  Purely syntactic; matches same-named pointer text in sibling statements
  within a for loop and does not check aliasing, control flow, or intent.
rule:
  kind: expression_statement
  all:
    - has:
        stopBy: end
        pattern: '$P->$F'
    - precedes:
        stopBy: end
        pattern: '$P = $V;'
    - inside:
        kind: compound_statement
        inside:
          kind: for_statement
