id: c-goto-past-initialized-declaration
language: c
severity: warning
message: >-
  Label follows an initialized declaration in the same block; a goto into the
  block from outside would skip the initializer.
note: >-
  Syntactic only; it does not verify that a goto targeting this label exists
  outside the block.
rule:
  kind: labeled_statement
  inside:
    kind: compound_statement
  follows:
    stopBy: end
    kind: declaration
    has:
      kind: init_declarator
