id: c-do-while-macro-trailing-semicolon
language: c
severity: warning
message: >-
  Function-like macro body ends with 'while (0);', leaving a trailing
  semicolon in the expansion.
note: >-
  Matches the literal macro body text only; it does not check that a do
  statement opens the body or how the macro is used.
rule:
  kind: preproc_function_def
  has:
    kind: preproc_arg
    regex: 'while\s*\(\s*0\s*\)\s*;\s*$'
metadata:
