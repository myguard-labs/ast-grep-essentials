id: c-hash-key-index-declared-int
language: c
severity: warning
message: >-
  An int variable receives the index key from zend_hash_get_current_key_ex;
  hash index keys are unsigned long and may truncate.
note: >-
  Matches only a preceding sibling `int` declaration with the same name; it
  does not resolve scopes, shadowing, or aliases.
rule:
  all:
    - pattern: 'zend_hash_get_current_key_ex($H, $KEY, $LEN, &$K, $$$REST);'
    - follows:
        pattern: 'int $K;'
        stopBy: end
