# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-field-write-clobbered-by-later-memcpy
language: c
severity: warning
message: >-
  A field write to this destination is followed by a memcpy into the same
  destination, which overwrites it.
note: >-
  Matches same-named destination text among sibling statements only; it does
  not check aliasing, control flow, or that the memcpy covers the field.
rule:
  all:
    - pattern: 'memcpy($D, $$$A);'
    - follows:
        stopBy: end
        kind: expression_statement
        has:
          kind: assignment_expression
          has:
            field: left
            pattern: '$D->$F'
