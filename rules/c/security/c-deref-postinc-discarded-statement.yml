id: c-deref-postinc-discarded-statement
language: c
severity: warning
message: >-
  Dereferenced post-increment whose value is discarded; confirm the skip is
  intended.
note: >-
  Matches the literal expression statement `*p++;` syntactically. It does not
  prove the pointer is non-null, that the byte is unused on purpose, or
  anything about types or aliasing.
rule:
  pattern: '*$P++;'
