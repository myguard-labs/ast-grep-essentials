id: c-emalloc-struct-partial-init
language: c
severity: warning
message: >-
  Pointer assigned from emalloc(sizeof(T)) is not zeroed; verify all fields
  are initialized.
note: >-
  Syntactic heuristic only; it does not check which fields are assigned,
  memset use, or other initialization in the function.
rule:
  pattern: '$P = emalloc(sizeof($T))'
