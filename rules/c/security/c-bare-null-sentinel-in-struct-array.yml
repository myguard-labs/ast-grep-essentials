# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-bare-null-sentinel-in-struct-array
language: c
severity: warning
message: >-
  Array of structs is terminated by a bare NULL element; use a full struct
  sentinel such as {NULL, 0}.
note: >-
  Matches only the literal syntax of a brace list with a nested brace element
  and a direct bare NULL element; it does not check the element type or how
  loops use the array.
rule:
  kind: initializer_list
  all:
    - has:
        kind: initializer_list
    - has:
        regex: '^NULL$'
