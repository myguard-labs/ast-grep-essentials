id: c-compile-file-hardcoded-include-type
language: c
severity: warning
message: >-
  zend_compile_file is called with the hard-coded ZEND_INCLUDE type instead of
  a caller-supplied type.
note: >-
  Matches the literal call text only; it does not verify that the enclosing
  function has a parameter named type.
rule:
  kind: call_expression
  regex: '^zend_compile_file\s*\([\s\S]*\bZEND_INCLUDE\b'
