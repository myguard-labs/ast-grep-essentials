# https://deb.myguard.nl/ast-grep-security-rules-pack | https://github.com/myguard-labs/ast-grep-essentials

id: nginx-raw-malloc
language: c
severity: info
message: >-
  Raw heap management (malloc/calloc/realloc/free/strdup/strndup) in nginx
  module code. For allocations, verify ownership and cleanup or use an
  appropriate nginx pool. For free, verify the pointer came from a compatible
  heap allocator; do not free pool memory or remove required heap cleanup.
note: >-
  Legitimate for long-lived global state or where an explicit ngx_pool_cleanup is
  registered. Confirm lifetime before dismissing.
rule:
  kind: call_expression
  has:
    field: function
    regex: ^(malloc|calloc|realloc|free|strdup|strndup)$
metadata:
  created_at: '2026-09-04'
  source: 'MyGuard'
  modified_by: 'MyGuard'
  license: 'MyGuard Internal Use License 1.0'
