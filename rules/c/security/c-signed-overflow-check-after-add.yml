# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-signed-overflow-check-after-add
language: c
severity: warning
message: >-
  This relational check compares an additive expression with an integer
  literal; signed overflow in the addition is undefined behaviour and the
  check may be optimized away.
note: >-
  Single-file syntactic match on a binary comparison whose left operand is a
  binary addition with an integer literal. Does not verify that the operands
  are signed, that overflow is possible, or that the check is a range check;
  those need types and value analysis. Skips a match whose left addend is a
  cast to an unsigned type (defined wraparound).
rule:
  all:
    - pattern: '$A + $LIT < $B'
    - not:
        has:
          field: left
          kind: binary_expression
          has:
            field: left
            kind: cast_expression
            has:
              field: type
              regex: '^(unsigned\b|size_t$|uintptr_t$|uint\d+_t$)'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-190'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/190.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'only the left addend is checked, so ''x + (size_t)n < x'' still reports; spellings that do not start with ''unsigned'' (long unsigned, const unsigned long) or aliases such as u64 are not recognised'
  todo_cases:
    - "int f(int x) { if (x + 100 > x) { return 1; } return 0; }"
