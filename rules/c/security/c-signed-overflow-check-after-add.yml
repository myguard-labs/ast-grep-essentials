id: c-signed-overflow-check-after-add
language: c
severity: warning
message: >-
  This relational check compares an additive expression with an integer
  literal; signed overflow in the addition is undefined behaviour and the
  check may be optimized away.
note: >-
  Single-file syntactic match on a binary comparison whose left operand is a
  binary addition with an integer literal. Does not verify that the operands
  are signed, that overflow is possible, or that the check is a range check;
  those need types and value analysis.
rule:
  pattern: '$A + $LIT < $B'
