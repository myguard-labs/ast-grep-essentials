id: c-null-test-inverted-deref-ternary
language: c
severity: warning
message: >-
  This conditional dereferences the pointer in the branch taken when it is
  NULL.
note: >-
  Syntactic match only: it recognizes a ternary whose condition is literally
  `x == NULL` and whose true branch is `x->...`. It does not resolve aliasing,
  types, or reachability.
rule:
  pattern: '($P == NULL) ? $P->$F : $$$REST'
