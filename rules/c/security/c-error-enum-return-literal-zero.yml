id: c-error-enum-return-literal-zero
language: c
severity: warning
message: >-
  Function with an error-enum style return type returns literal 0 instead of a
  named enumerator.
note: >-
  Matches by return type name only (err-style typedef name ending in _t). It
  does not verify that the typedef is an enum or that 0 is not the intended
  enumerator.
rule:
  pattern: 'return 0;'
  inside:
    stopBy: end
    kind: function_definition
    has:
      field: type
      kind: type_identifier
      regex: '^err(or)?[a-z0-9_]*_t$'
