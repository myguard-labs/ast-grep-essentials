# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-convert-then-zval-overwrite
language: c
severity: warning
message: >-
  A zval is converted and then immediately overwritten with
  ZVAL_STRING/LONG/DOUBLE, which may leak the converted value.
note: >-
  Matches only adjacent statements with the same zval expression text. It does
  not resolve macros, aliasing, or control flow.
rule:
  all:
    - pattern: '$F($Z, $$$A);'
    - follows:
        pattern: '$C($Z);'
constraints:
  F:
    regex: '^ZVAL_(STRING|LONG|DOUBLE)$'
  C:
    regex: '^convert_to_(string|long|double)$'
