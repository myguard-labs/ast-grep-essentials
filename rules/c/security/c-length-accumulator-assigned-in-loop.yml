id: c-length-accumulator-assigned-in-loop
language: c
severity: warning
message: >-
  A length variable is assigned from a list element's length inside a loop;
  use += to accumulate the total.
note: >-
  Single-file syntactic match on an assignment with a member-access length
  expression inside a while loop; it does not verify the variable is a size
  accumulator, the loop advances a list, or that the value is used in an
  allocation.
rule:
  kind: assignment_expression
  pattern: 'len = $X.len + 2'
  inside:
    kind: while_statement
    stopBy: end
