id: c-macro-unparenthesized-param-arith
language: c
severity: warning
message: >-
  Macro body uses a bare identifier between arithmetic operators; parenthesize
  macro parameters.
note: >-
  Lexical heuristic on the macro body text; it does not verify the identifier
  is a macro parameter or resolve any semantics.
rule:
  kind: preproc_arg
  inside:
    kind: preproc_function_def
  regex: '[-+*/]\s*[A-Za-z_]\w*\s*[-+*/]'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
