id: c-alignment-literal-round-up
language: c
severity: warning
message: >-
  Round-up-to-alignment uses a hard-coded integer literal instead of sizeof
  the aligned type.
note: >-
  Purely syntactic match on the shape ((E + sizeof(T) - 1) / 4) * 4 + 4 with
  literal 4 as the divisor, multiplier, and addend; it does not resolve types
  or confirm the literal is wrong for the target platform.
rule:
  pattern: '(($E + sizeof($T) - 1) / 4) * 4 + 4'
