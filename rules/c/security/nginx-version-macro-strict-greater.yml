# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: nginx-version-macro-strict-greater
language: c
severity: warning
message: >-
  Strict greater-than comparison against nginx_version excludes the exact
  release named in the test; review whether it should be >=.
note: >-
  Syntactic match on a literal nginx_version identifier compared with >
  against an integer literal inside a preprocessor expression. It does not
  resolve macro definitions or verify intent, so intentional strict tests will
  also be reported.
rule:
  pattern: 'nginx_version > $N'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
