id: c-arg-info-missing-required-count
language: c
severity: warning
message: >-
  ZEND_BEGIN_ARG_INFO has no required-argument count; consider
  ZEND_BEGIN_ARG_INFO_EX.
note: >-
  Matches the literal ZEND_BEGIN_ARG_INFO identifier only; it does not check
  that ZEND_ARG_INFO entries follow or resolve macros.
rule:
  kind: identifier
  regex: '^ZEND_BEGIN_ARG_INFO$'
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
