# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-openssl-sslv3-method-unguarded
language: c
severity: warning
message: SSLv3 method call is not guarded by an OPENSSL_NO_SSL3 preprocessor check.
note: >-
  Syntactic only. Recognizes ifdef or ifndef ancestors naming OPENSSL_NO_SSL3,
  not if defined forms or macro redefinitions.
rule:
  all:
    - kind: call_expression
    - regex: '^SSLv3_(client|server)_method\s*\('
    - not:
        inside:
          stopBy: end
          kind: preproc_ifdef
          has:
            kind: identifier
            regex: '^OPENSSL_NO_SSL3$'
