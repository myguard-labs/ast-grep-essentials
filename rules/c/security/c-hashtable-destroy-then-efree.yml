id: c-hashtable-destroy-then-efree
language: c
severity: warning
message: >-
  efree() directly after zend_hash_destroy() on the same pointer; use
  FREE_HASHTABLE() instead.
note: >-
  Matches only the adjacent literal statements with the same argument text; it
  does not verify the pointer is a HashTable or track aliases.
rule:
  pattern: 'efree($X);'
  follows:
    pattern: 'zend_hash_destroy($X);'
