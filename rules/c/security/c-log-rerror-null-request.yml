# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-log-rerror-null-request
language: c
severity: warning
message: ap_log_rerror is called with a literal NULL request_rec argument.
note: >-
  Matches only the literal NULL token in the fourth argument of a direct
  ap_log_rerror call; it does not resolve whether the variable or macro
  elsewhere is null at runtime.
rule:
  pattern: 'ap_log_rerror($A, $B, $C, NULL, $$$ARGS)'
