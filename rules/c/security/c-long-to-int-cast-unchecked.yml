# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-long-to-int-cast-unchecked
language: c
severity: warning
message: >-
  Cast to int in a function that never references INT_MAX or INT_MIN; check
  the range before narrowing.
note: >-
  Syntactic only; does not verify the cast operand is declared long, and any
  mention of INT_MAX or INT_MIN in the function suppresses the match.
rule:
  all:
    - pattern: '(int)$V'
    - inside:
        stopBy: end
        kind: function_definition
        not:
          has:
            stopBy: end
            kind: identifier
            regex: '^INT_(MAX|MIN)$'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-197'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/197.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'int f(long v) { assert(v == (int)v); return 0; } is matched although the round-trip check is the guard (FP, low)'
  todo_cases:
    - "any INT_MAX or INT_MIN identifier in the function suppresses every (int) cast in it, including a cast in an unrelated branch that is never range-checked (FN)"
