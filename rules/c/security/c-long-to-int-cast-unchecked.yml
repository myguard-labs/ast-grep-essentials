# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-long-to-int-cast-unchecked
language: c
severity: warning
message: >-
  Cast to int in a function that never references INT_MAX or INT_MIN; check
  the range before narrowing.
note: >-
  Syntactic only; does not verify the cast operand is declared long, and any
  mention of INT_MAX or INT_MIN in the function suppresses the match.
rule:
  all:
    - pattern: '(int)$V'
    - inside:
        stopBy: end
        kind: function_definition
        not:
          has:
            stopBy: end
            kind: identifier
            regex: '^INT_(MAX|MIN)$'
