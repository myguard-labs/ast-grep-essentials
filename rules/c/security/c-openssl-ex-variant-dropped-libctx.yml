# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-openssl-ex-variant-dropped-libctx
language: c
severity: warning
message: >-
  This non-_ex OpenSSL constructor is called in a function that refers to
  libctx; consider the _ex variant so the library context is passed.
note: >-
  Purely syntactic single-file check. It matches the literal call name
  X509_new with zero arguments and does not verify that libctx is in scope,
  that the function body actually refers to libctx, or any runtime or type
  information.
rule:
  pattern: 'X509_new()'
