id: c-unreachable-in-php-method-body
language: c
severity: warning
message: >-
  PHP_METHOD body is only ZEND_UNREACHABLE(); review it and raise a proper
  error instead.
note: >-
  Single-file syntactic match on a PHP_METHOD function whose body contains a
  ZEND_UNREACHABLE() call. It does not check reflection visibility,
  reachability, or whether the method is callable from userland.
rule:
  pattern: 'ZEND_UNREACHABLE()'
