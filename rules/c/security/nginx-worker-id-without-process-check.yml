# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: nginx-worker-id-without-process-check
language: c
severity: warning
message: >-
  This function reads the global ngx_worker without a ngx_process check in the
  same function body.
note: >-
  Single-file syntactic check only. It looks for a function body that reads
  ngx_worker and has no ngx_process reference in that function; it does not
  resolve control flow, process type at runtime, or whether the function is
  called only from worker processes.
rule:
  all:
    - pattern: '(ngx_int_t) ngx_worker'
    - inside:
        kind: function_definition
        stopBy: end
    - not:
        inside:
          kind: function_definition
          stopBy: end
          has:
            pattern: ngx_process
            stopBy: end
