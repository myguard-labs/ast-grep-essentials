id: c-cpymem-macro-unparenthesized
language: c
severity: warning
message: >-
  Function-like macro body is an unparenthesized binary expression with a cast
  left operand.
note: >-
  Syntactic match only on a preprocessor define whose body starts with a
  cast-parenthesized expression followed by +. It does not check macro usage
  sites or expansion types.
rule:
  kind: preproc_function_def
  has:
    field: value
    regex: '^\(\s*\(\s*u_char\s*\*\s*\)'
  all:
    - has:
        field: value
        regex: '\)\s*\+\s*\([^()]*\)\s*$'
    - not:
        has:
          field: value
          regex: '^\(\s*\(.*\)\s*\)\s*$'
