# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-nonvoid-function-empty-body
language: c
severity: warning
message: Non-void function has an empty body and no return statement.
note: >-
  Syntactic check only. Matches a function_definition with a non-void declared
  type and an empty compound body; does not resolve types, reachability, or
  callers.
rule:
  kind: function_definition
  all:
    - has:
        field: body
        kind: compound_statement
        regex: '^\{\s*\}$'
    - not:
        has:
          kind: primitive_type
          regex: '^void$'
