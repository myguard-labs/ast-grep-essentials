# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-libc-macro-struct-member
language: c
severity: warning
message: >-
  Struct or union member name matches a libc name that is often defined as a
  macro; feature-test macros may rewrite it.
note: >-
  Matches member names syntactically only. It does not check whether any macro
  is actually defined in the build.
rule:
  kind: field_identifier
  regex: '^(open|close|get|put|read|write|stat)$'
  inside:
    kind: field_declaration
    stopBy: end
