id: c-init-flag-set-outside-guard
language: c
severity: warning
message: >-
  Init flag is set after a preprocessor conditional that wraps the initializer
  call, outside the conditional. When the guard is off the flag is set without
  init work.
note: >-
  Syntactic match only; it does not check that the flag is the one for the
  guarded initializer or what the macro evaluates to.
rule:
  kind: expression_statement
  all:
    - has:
        kind: assignment_expression
        all:
          - has:
              field: left
              kind: identifier
              regex: inited
          - has:
              field: right
              kind: number_literal
    - follows:
        kind: preproc_if
        has:
          stopBy: end
          kind: call_expression
