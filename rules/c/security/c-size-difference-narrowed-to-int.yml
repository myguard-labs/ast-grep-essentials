# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-size-difference-narrowed-to-int
language: c
severity: warning
message: >-
  A difference of size_t operands is cast to int; large unsigned differences
  can wrap to the wrong sign.
note: >-
  Matches the literal syntax of a parenthesized (int) cast applied directly to
  a subtraction. It does not check operand types, so it cannot confirm the
  operands are size_t, and it does not track values stored in variables first.
rule:
  pattern: 'return (int)($A - $B);'
