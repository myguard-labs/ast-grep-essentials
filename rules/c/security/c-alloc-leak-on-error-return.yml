id: c-alloc-leak-on-error-return
language: c
severity: warning
message: >-
  If-block returns after an emalloc allocation without any efree/free in the
  block.
note: >-
  Syntactic only; does not match the freed name to the allocated variable, nor
  prove reachability, aliasing, or ownership transfer.
rule:
  kind: if_statement
  all:
    - follows:
        stopBy: end
        kind: declaration
        regex: 'emalloc\('
    - has:
        field: consequence
        kind: compound_statement
        all:
          - regex: '(return|RETURN_[A-Z_]+)'
          - not:
              regex: '(efree|free)\('
