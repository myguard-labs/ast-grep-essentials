id: c-signed-shift-into-sign-bit
language: c
severity: warning
message: >-
  Left shift of a signed int literal by 31 sets the sign bit; use an unsigned
  literal.
note: >-
  Syntactic match on a literal 1 shifted by literal 31 with no suffix in the
  shown expression; does not resolve types, macros, or whether the result is
  used.
rule:
  pattern: '1 << 31'
