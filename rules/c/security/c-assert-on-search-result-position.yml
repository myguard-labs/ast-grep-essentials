id: c-assert-on-search-result-position
language: c
severity: warning
message: >-
  assert compares a pointer against the start of a buffer; this check compiles
  out in release builds.
note: >-
  Matches the syntax assert(ptr > call(...)) only; it does not verify that the
  pointer came from a search function.
rule:
  pattern: 'assert($P > $CALL($$$ARGS))'
