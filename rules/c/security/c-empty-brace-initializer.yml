# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-empty-brace-initializer
language: c
severity: warning
message: 'Empty brace initializer {} is C23-only; use { 0 } for portability.'
note: >-
  Matches syntactically empty initializer lists only; it does not check the
  type being initialized or the target C standard.
rule:
  kind: initializer_list
  regex: '^\{\s*\}$'
metadata:
  rule_modified_at: '2026-10-19'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-19'
  created_at: '2026-10-19'
