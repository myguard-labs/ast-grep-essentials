id: c-pcre-anchor-missing-dollar-endonly
language: c
severity: warning
message: >-
  This PCRE-style string literal ends with an unescaped $ anchor and no D
  modifier, so $ can also match before a trailing newline.
note: >-
  Purely syntactic match on a C string literal whose content ends in $
  followed by a closing slash delimiter. It does not verify that the string is
  passed to a PCRE API, that the delimiter convention applies, or that the D
  modifier is absent from runtime flags.
rule:
  kind: string_literal
  regex: '^"/.*[^\\]\$/"$'
  not:
    regex: '/D"$'
