id: c-gettimeofday-nonnull-timezone-arg
language: c
severity: warning
message: >-
  gettimeofday is passed a non-NULL timezone argument; the timezone argument
  is obsolete and ignored on most platforms, so pass NULL instead.
note: >-
  Single-file syntactic match on a gettimeofday call whose second argument is
  an address-of expression. It does not resolve the callee's declaration,
  includes, or platform behavior, and does not match a timezone variable
  passed by name.
rule:
  pattern: 'gettimeofday($A, &$B)'
