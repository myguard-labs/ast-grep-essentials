# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-increment-then-negate-signed
language: c
severity: warning
message: >-
  Variable is incremented and then negated in the next statement; the
  increment can overflow. Consider negating first, then decrementing.
note: >-
  Matches only the adjacent statement syntax `v++;` followed by `v = -v;` in
  the same block. It does not check that v has a signed type.
rule:
  pattern: '$V++;'
  precedes:
    pattern: '$V = -$V;'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-190'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/190.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'FN: `++v; v = -v;`, `(*p)++; *p = -*p;`, `v++; v = -(v);` and `v++; use(v); v = -v;` are not matched.'
    - 'FP: a guarded `if (v == INT_MAX) return; v++; v = -v;` and an unsigned v are still reported.'
