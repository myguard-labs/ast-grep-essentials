# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-increment-then-negate-signed
language: c
severity: warning
message: >-
  Variable is incremented and then negated in the next statement; the
  increment can overflow. Consider negating first, then decrementing.
note: >-
  Matches only the adjacent statement syntax `v++;` followed by `v = -v;` in
  the same block. It does not check that v has a signed type.
rule:
  pattern: '$V++;'
  precedes:
    pattern: '$V = -$V;'
