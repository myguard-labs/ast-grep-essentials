id: c-deref-postincrement-discarded
language: c
severity: warning
message: >-
  Dereferenced pointer post-increment is an expression statement whose value
  is discarded; the read may be unintended.
note: >-
  Syntactic match only on a bare expression statement of the form *ident++; it
  does not resolve types, aliasing, or whether the discarded read was
  intended.
rule:
  kind: expression_statement
  has:
    kind: pointer_expression
    pattern: '*$ID++'
