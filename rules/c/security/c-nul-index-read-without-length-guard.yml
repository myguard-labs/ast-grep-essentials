# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-nul-index-read-without-length-guard
language: c
severity: warning
message: >-
  Index 3 is read in an && chain after index 1 was compared, with no check on
  index 2 in the chain.
note: >-
  Syntactic only; matches the literal index 1 then 3 shape and does not verify
  that the subscripted expressions are the same string or know its length.
rule:
  all:
    - pattern: '$L && $S[3] == $C'
    - has:
        field: left
        stopBy: end
        pattern: '$T[1] == $X'
    - not:
        has:
          stopBy: end
          pattern: '$U[2]'
