id: c-apr-table-get-strcmp-null
language: c
severity: warning
message: >-
  The return value of apr_table_get is passed directly to strcmp without a
  NULL check.
note: >-
  Matches the literal syntax strcmp(apr_table_get(...), ...) in one
  expression. It does not verify that the table key is present or that no NULL
  guard exists elsewhere, and it does not resolve types or aliases.
rule:
  pattern: 'strcmp(apr_table_get($$$ARGS), $$$REST)'
