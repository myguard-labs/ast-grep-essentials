# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-always-true-inequality-or
language: c
severity: warning
message: >-
  Condition is always true because the same operand is compared with !=
  against two constants joined by ||.
note: >-
  Matches the literal syntax only. It does not check that the two constants
  differ, or that the operand has no side effects.
rule:
  pattern: '$X != $A || $X != $B'
constraints:
  A:
    kind: number_literal
  B:
    kind: number_literal
