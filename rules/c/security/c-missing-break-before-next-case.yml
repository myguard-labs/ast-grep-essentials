  taxonomy_source: 'https://cwe.mitre.org/data/definitions/484.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A10:2025'
  todo_cases:
    - "FP: 'for (;;) { switch (t) { case 1: g(x); continue; case 2: break; } }' is reported although 'continue' leaves the case"
    - "FN: 'case 1: if (*x) break; *x = 1; case 2:' falls through on the other path but a nested break suppresses the report"
