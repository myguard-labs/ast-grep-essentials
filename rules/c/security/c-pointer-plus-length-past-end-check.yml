id: c-pointer-plus-length-past-end-check
language: c
severity: 'off'
message: >-
  Deprecated rule ID; use c-additive-bounds-check-overflow. A pointer offset
  is added before the comparison against an end pointer, so the sum can wrap.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use c-additive-bounds-check-overflow and do not emit this rule.
rule:
  pattern: '$A + $B > $LEN'
metadata:
  deprecated_alias_of: c-additive-bounds-check-overflow
  rule_modified_at: '2026-11-16'
  created_at: '2026-10-15'
