# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-pointer-plus-length-past-end-check
language: c
severity: warning
message: >-
  Pointer offset compared against an end pointer; compare the length against
  the remaining span instead.
note: >-
  Single-file syntactic match on a literal binary '+' inside a '>' comparison
  with a bare identifier end pointer. It does not verify pointer types,
  aliasing, or that the offset expression is an integer; it may miss other
  forms and may flag non-pointer arithmetic.
rule:
  pattern: '$P + $N > $END'
