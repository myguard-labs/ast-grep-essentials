id: c-malloc-inverted-null-check
language: c
severity: warning
message: >-
  Truthy test on an allocation result exits early, so the failure path may run
  only when allocation succeeded.
note: >-
  Matches syntax only. It checks the immediately preceding statement and does
  not resolve aliasing, types, or control flow.
rule:
  all:
    - pattern: 'if ($P) $BODY'
    - follows:
        pattern: '$P = $F($$$A);'
    - has:
        field: consequence
        has:
          stopBy: end
          regex: '^(return|goto)\b'
constraints:
  F:
    regex: '^(malloc|calloc|realloc)$'
