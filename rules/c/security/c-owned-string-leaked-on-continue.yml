# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-owned-string-leaked-on-continue
language: c
severity: warning
message: >-
  continue after zend_long_to_str without zend_string_release may leak the
  string.
note: >-
  Syntactic only; does not track which variable is released or whether another
  path frees it.
rule:
  kind: continue_statement
  all:
    - inside:
        stopBy: end
        kind: compound_statement
        has:
          stopBy: end
          pattern: '$K = zend_long_to_str($$$A)'
    - not:
        follows:
          stopBy: end
          pattern: 'zend_string_release($$$B);'
metadata:
