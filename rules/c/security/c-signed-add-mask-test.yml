# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-signed-add-mask-test
language: c
severity: warning
message: >-
  Signed addition of an identifier and constant is masked with a negated
  constant; cast the operand to unsigned to avoid undefined overflow.
note: >-
  Purely syntactic match of a parenthesized identifier-plus-constant operand
  under a bitwise AND with a unary-negated constant. It does not verify the
  operand's type or value range, nor whether overflow is actually possible.
rule:
  pattern: 'if (((n + 128) & -256) == 0) { }'
