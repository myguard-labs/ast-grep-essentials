# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-backslash-escape-checks-previous-char
language: c
severity: warning
message: >-
  Comparing the previous byte against a backslash to detect an escaped
  delimiter ignores runs of escaped backslashes; review this check.
note: >-
  Purely syntactic match on a binary comparison of a p[-1] subscript against a
  backslash character literal. It does not resolve pointer types, aliasing, or
  whether the surrounding loop actually detects escapes, so it can
  over-report.
rule:
  pattern: '$P[-1] != ''\\'''
