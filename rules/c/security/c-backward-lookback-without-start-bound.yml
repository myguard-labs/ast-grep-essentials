# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-backward-lookback-without-start-bound
language: c
severity: warning
message: >-
  Backward pointer offset read in an if-condition without a start-bound
  comparison in the same condition.
note: >-
  Syntactic check only. It flags an if-condition containing a dereference of a
  backward offset (p - k) and no comparison in the same condition. It skips an
  if-statement inside a for or while loop whose condition compares the same
  pointer (p > start, start < p, p != start), since the loop bounds the
  lookback. It does not resolve types, buffer bounds, or other guards.
rule:
  all:
    - kind: if_statement
    - has:
        pattern: '*($P - $K)'
        stopBy: end
    - not:
        has:
          kind: binary_expression
          regex: '[<>]'
          stopBy: end
    - not:
        inside:
          any:
            - kind: for_statement
            - kind: while_statement
          has:
            field: condition
            stopBy: end
            any:
              - pattern: '$P > $_'
              - pattern: '$P >= $_'
              - pattern: '$_ < $P'
              - pattern: '$_ <= $P'
              - pattern: '$P != $_'
              - pattern: '$_ != $P'
          stopBy: end
