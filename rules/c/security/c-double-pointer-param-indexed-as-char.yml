id: c-double-pointer-param-indexed-as-char
language: c
severity: warning
message: >-
  Character literal assigned through a subscript of a char ** parameter
  without dereferencing it first.
note: >-
  Syntactic only; matches by identifier name against a char ** parameter in
  the same function and does not check shadowing or intent.
rule:
  all:
    - pattern: '$A[$I] = $V'
    - has:
        field: right
        kind: char_literal
    - inside:
        stopBy: end
        kind: function_definition
        has:
          stopBy: end
          pattern:
            context: 'void f(char **$A) {}'
            selector: parameter_declaration
