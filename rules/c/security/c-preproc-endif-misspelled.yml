id: c-preproc-endif-misspelled
language: c
severity: warning
message: 'Preprocessor directive #end is likely a misspelled #endif.'
note: >-
  Matches the literal directive token only; it does not check whether a
  matching #if block is open.
rule:
  kind: preproc_directive
  regex: '^#[ \t]*end$'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
