id: c-recursion-guard-reset-to-zero
language: c
severity: warning
message: >-
  This recursion guard counter is reset to 0 inside the if-branch after being
  incremented in the condition; decrementing it would restore the outer
  frame's count.
note: >-
  Purely syntactic match on a literal field receiver in an if-condition
  containing ++ and a branch assigning 0 to the same field. It does not verify
  that the field is a recursion counter, resolve aliasing, or check
  reachability.
rule:
  kind: if_statement
  all:
    - has:
        pattern: '++$OBJ->$FIELD'
        stopBy: end
    - has:
        pattern: '$OBJ->$FIELD = 0'
        stopBy: end
