id: c-memcmp-on-secret
language: c
severity: warning
message: >-
  Variable-time comparison applied to an operand whose name reads as key
  material (secret, token, key, hmac, mac, password, digest, signature, hash,
  nonce). memcmp and the str* family stop at the first differing byte, so the
  time they take leaks how long a common prefix the attacker supplied and lets
  a forged authenticator be recovered byte by byte. Compare authenticators with
  a constant-time primitive such as CRYPTO_memcmp or a hand-rolled OR-accumulate
  loop over the full length.
note: >-
  The gate is an identifier-name regex over the argument list, so it reports
  hash-table lookups and configuration string comparisons that merely happen to
  use one of those words, and it misses key material held in a differently named
  buffer. Dismiss when the compared value is not an authenticator the caller
  must not be able to guess; a public hash-table key is the routine case.
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: '^(memcmp|strcmp|strncmp|ngx_memcmp|ngx_strcmp|ngx_strncmp)$'
    - has:
        field: arguments
        has:
          stopBy: end
          kind: identifier
          regex: '(?i)(secret|token|key|hmac|mac|password|passwd|digest|signature|sig|hash|nonce)'
