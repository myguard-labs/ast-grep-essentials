id: c-void-less-function-definition
language: c
severity: warning
message: >-
  Function definition has an empty parameter list; use (void) to declare a
  prototype.
note: >-
  Syntactic match only on a function definition whose declarator has an empty
  parameter list written as (). It does not check whether the function is
  declared elsewhere or whether the parameter list is compiled under a
  particular standard.
rule:
  kind: function_definition
  has:
    kind: function_declarator
    has:
      kind: parameter_list
      not:
        has:
          kind: parameter_declaration
