# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-free-then-deref-same-block
language: c
severity: warning
message: >-
  Pointer is dereferenced via -> after being passed to free() earlier in the
  same block.
note: >-
  Syntactic only; does not detect reassignment of the pointer between the free
  and the use, aliasing, or control flow.
rule:
  all:
    - pattern: 'free($P);'
    - precedes:
        stopBy: end
        has:
          stopBy: end
          pattern: '$P->$F'
