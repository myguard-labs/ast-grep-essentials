id: c-stdio-name-as-member
language: c
severity: warning
message: >-
  Field or variable is named after a stdio macro (stdin, stdout, or stderr),
  which can break member access or expansion on some C libraries.
note: >-
  Purely syntactic check on a field declarator named stdin, stdout, or stderr.
  It does not verify that the target library defines these names as macros,
  and it does not resolve types or uses.
rule:
  kind: field_identifier
  regex: '^(stdin|stdout|stderr)$'
