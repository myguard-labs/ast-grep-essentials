# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-contradictory-char-range-test
language: c
severity: warning
message: >-
  This condition joins a '<' lower-bound test and a '>' upper-bound test on
  the same operand with &&, so it can never be true.
note: >-
  Purely syntactic check of a literal '<' and '>' comparison pair joined by &&
  on the same operand text; it does not resolve types, values, aliasing, or
  reachability.
rule:
  pattern: '$X < $LO && $X > $HI'
