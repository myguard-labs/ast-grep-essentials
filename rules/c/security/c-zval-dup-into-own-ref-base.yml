id: c-zval-dup-into-own-ref-base
language: c
severity: warning
message: >-
  ZVAL_DUP writes its destination into the variable whose reference it
  dereferences; use a temporary instead.
note: >-
  Purely syntactic check that the destination identifier is the same as the
  argument of Z_REFVAL_P in the source; it does not resolve types, aliasing,
  or whether the variable holds a reference at runtime.
rule:
  pattern: 'ZVAL_DUP($X, Z_REFVAL_P($X))'
