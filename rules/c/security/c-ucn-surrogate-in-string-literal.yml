# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-ucn-surrogate-in-string-literal
language: c
severity: warning
message: >-
  This string literal contains a surrogate-range universal-character-name
  escape (D800-DFFF), which is not a valid character in C.
note: >-
  Single-file syntactic check on the literal text only. It matches string
  literals containing a \u escape whose code point falls in D800-DFFF; it does
  not evaluate escapes computed at runtime or verify the source encoding.
rule:
  kind: string_literal
  regex: '\\u[dD][89a-fA-F][0-9a-fA-F]{2}'
