id: c-null-struct-pointer-offset-idiom
language: c
severity: warning
message: >-
  Member access through a null-cast struct pointer computes an offset; use
  offsetof() instead.
note: >-
  Syntactic match only. Matches a member access whose object is a cast of
  literal 0 to a pointer type; does not verify the cast target type, macro
  context, or any runtime value.
rule:
  pattern: '((struct $T *)0)->$M'
