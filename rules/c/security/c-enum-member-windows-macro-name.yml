# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-enum-member-windows-macro-name
language: c
severity: warning
message: >-
  Enumerator named ERROR collides with a macro defined by Windows wingdi.h;
  rename or prefix it.
note: >-
  Syntactic match only on an enumerator whose identifier is exactly ERROR
  inside an enum body. It does not check whether wingdi.h or any Windows
  header is included, and it does not resolve macros or types.
rule:
  kind: enumerator
  has:
    field: name
    regex: '^ERROR$'
