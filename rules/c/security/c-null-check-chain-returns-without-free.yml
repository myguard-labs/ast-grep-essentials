id: c-null-check-chain-returns-without-free
language: c
severity: warning
message: >-
  Early return after a chained NULL check has no free call; earlier
  allocations may leak.
note: >-
  Purely syntactic; does not verify which pointers were allocated or whether
  cleanup happens elsewhere.
rule:
  kind: if_statement
  all:
    - has:
        field: condition
        kind: parenthesized_expression
        regex: '^\(\s*!\s*\w+(\s*\|\|\s*!\s*\w+)+\s*\)$'
    - has:
        field: consequence
        has:
          kind: return_statement
          stopBy: end
    - not:
        has:
          kind: call_expression
          stopBy: end
          has:
            field: function
            regex: 'free$'
