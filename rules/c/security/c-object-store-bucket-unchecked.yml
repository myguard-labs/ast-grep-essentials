# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-object-store-bucket-unchecked
language: c
severity: warning
message: Object bucket is dereferenced in a function that never calls IS_OBJ_VALID.
note: >-
  Syntactic check only. It does not verify that the validity check guards this
  particular bucket or index.
rule:
  all:
    - pattern: 'EG(objects_store).object_buckets[$H]->$F'
    - not:
        inside:
          kind: function_definition
          stopBy: end
          has:
            stopBy: end
            pattern: 'IS_OBJ_VALID($$$A)'
