# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-length-bounded-buffer-scanned-as-nul-string
language: c
severity: warning
message: >-
  Loop scans a pointer until NUL with no length bound in a function that takes
  a size parameter.
note: >-
  Syntactic only; matches while (*p) in a function with a size_t parameter and
  cannot tell whether the data is really NUL-terminated.
rule:
  all:
    - pattern: 'while (*$P) $BODY'
    - inside:
        stopBy: end
        kind: function_definition
        has:
          stopBy: end
          kind: parameter_declaration
          regex: size_t
