# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-printf-conversions-exceed-arguments
language: c
severity: warning
message: >-
  Format string has conversion specifiers but no arguments are supplied after
  it.
note: >-
  Syntactic only; checks php_error_docref with a literal format and no
  variadic arguments, and does not count specifiers against arguments in
  general or resolve wrappers.
rule:
  pattern: 'php_error_docref($A, $B, $FMT)'
constraints:
  FMT:
    kind: string_literal
    regex: '(^|[^%])%[-+ 0-9.*lhzjtL]*[diouxXeEfFgGaAcspn]'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-685'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/685.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'FN: `php_error_docref(NULL, E_WARNING, "%%%s");` (escaped percent followed by a real conversion), a format built from adjacent literals (`"a" "%s"`), `php_error_docref0` and a call with a `TSRMLS_CC` macro argument (parses as an ERROR shape) are not matched.'
    - 'FN: only php_error_docref with exactly three arguments is matched; other printf wrappers and four-argument calls with too few arguments for the conversions (`"%s %d", x`) are not.'
