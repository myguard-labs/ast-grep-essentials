id: c-null-check-before-reassignment
language: c
severity: warning
message: >-
  Pointer is null-checked, reassigned inside the if body, then dereferenced
  after the block without a guard.
note: >-
  Purely syntactic; does not verify the reassigned value may be NULL or that
  no other guard exists.
rule:
  all:
    - pattern: 'if ($P) { $$$A }'
    - has:
        pattern: '$P = $V'
        stopBy: end
    - precedes:
        stopBy: end
        has:
          pattern: '*$P'
          stopBy: end
