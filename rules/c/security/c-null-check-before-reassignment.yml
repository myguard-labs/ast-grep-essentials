# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-null-check-before-reassignment
language: c
severity: warning
message: >-
  Pointer is null-checked, reassigned inside the if body, then dereferenced
  after the block without a guard.
note: >-
  Purely syntactic; does not verify the reassigned value may be NULL or that
  no other guard exists.
rule:
  all:
    - pattern: 'if ($P) { $$$A }'
    - has:
        pattern: '$P = $V'
        stopBy: end
    - precedes:
        stopBy: end
        all:
          - has:
              pattern: '*$P'
              stopBy: end
          - not:
              all:
                - kind: if_statement
                - has:
                    field: condition
                    any:
                      - pattern: '($P)'
                      - pattern: '($P != NULL)'
                      - pattern: '($P && $Y)'
                - not:
                    has:
                      field: alternative
                      kind: else_clause
                - not:
                    has:
                      stopBy: end
                      all:
                        - kind: expression_statement
                        - has:
                            kind: assignment_expression
                            has:
                              field: left
                              pattern: '$P'
                        - precedes:
                            stopBy: end
                            all:
                              - has:
                                  pattern: '*$P'
                                  stopBy: end
                              - not:
                                  all:
                                    - kind: if_statement
                                    - has:
                                        field: condition
                                        any:
                                          - pattern: '($P)'
                                          - pattern: '($P != NULL)'
                                          - pattern: '($P && $Y)'
          - not:
              all:
                - follows:
                    stopBy: end
                    all:
                      - kind: if_statement
                      - any:
                          - pattern: 'if (!$P) $S'
                          - pattern: 'if ($P == NULL) $S'
                      - not:
                          has:
                            field: alternative
                            kind: else_clause
                      - has:
                          field: consequence
                          any:
                            - kind: return_statement
                            - kind: goto_statement
                            - kind: break_statement
                            - kind: continue_statement
                            - all:
                                - kind: compound_statement
                                - has:
                                    any:
                                      - kind: return_statement
                                      - kind: goto_statement
                                      - kind: break_statement
                                      - kind: continue_statement
                      - follows:
                          stopBy: end
                          all:
                            - pattern: 'if ($P) { $$$A }'
                            - has:
                                pattern: '$P = $V'
                                stopBy: end
                - not:
                    follows:
                      stopBy: end
                      all:
                        - kind: expression_statement
                        - has:
                            kind: assignment_expression
                            has:
                              field: left
                              pattern: '$P'
                        - not:
                            precedes:
                              stopBy: end
                              all:
                                - kind: if_statement
                                - not:
                                    follows:
                                      stopBy:
                                        all:
                                          - kind: expression_statement
                                          - has:
                                              kind: assignment_expression
                                              has:
                                                field: left
                                                pattern: '$P'
                                      has:
                                        pattern: '*$P'
                                        stopBy: end
                                - any:
                                    - pattern: 'if (!$P) $S'
                                    - pattern: 'if ($P == NULL) $S'
                                - not:
                                    has:
                                      field: alternative
                                      kind: else_clause
                                - has:
                                    field: consequence
                                    any:
                                      - kind: return_statement
                                      - kind: goto_statement
                                      - kind: break_statement
                                      - kind: continue_statement
                                      - all:
                                          - kind: compound_statement
                                          - has:
                                              any:
                                                - kind: return_statement
                                                - kind: goto_statement
                                                - kind: break_statement
                                                - kind: continue_statement
                                - precedes:
                                    stopBy: end
                                    has:
                                      pattern: '*$P'
                                      stopBy: end
                        - follows:
                            stopBy: end
                            all:
                              - kind: if_statement
                              - any:
                                  - pattern: 'if (!$P) $S'
                                  - pattern: 'if ($P == NULL) $S'
                              - not:
                                  has:
                                    field: alternative
                                    kind: else_clause
                              - has:
                                  field: consequence
                                  any:
                                    - kind: return_statement
                                    - kind: goto_statement
                                    - kind: break_statement
                                    - kind: continue_statement
                                    - all:
                                        - kind: compound_statement
                                        - has:
                                            any:
                                              - kind: return_statement
                                              - kind: goto_statement
                                              - kind: break_statement
                                              - kind: continue_statement
                              - follows:
                                  stopBy: end
                                  all:
                                    - pattern: 'if ($P) { $$$A }'
                                    - has:
                                        pattern: '$P = $V'
                                        stopBy: end
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-476'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/476.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A10:2025'
  known_false_positives: 'a later (p = f()) == NULL return guards the dereference but it is reported: void f(int *p) { if (p) { p = next(p); } if ((p = f()) == NULL) return; use(*p); }'
