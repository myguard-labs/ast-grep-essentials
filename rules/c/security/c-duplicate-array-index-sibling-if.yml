# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-duplicate-array-index-sibling-if
language: c
severity: warning
message: >-
  Adjacent if statements assign the same constant array index; this may be a
  copy-paste bug.
note: >-
  Matches the literal syntax only, with no alias, value, or reachability
  analysis. Intentional overwrites are also matched.
rule:
  kind: if_statement
  has:
    stopBy: end
    pattern: '$X[$I] = $V1'
  follows:
    kind: if_statement
    has:
      stopBy: end
      pattern: '$X[$I] = $V2'
