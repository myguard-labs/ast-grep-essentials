# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-additive-bounds-check-overflow
language: c
severity: warning
message: >-
  Bounds check adds two operands before comparing; the sum can wrap for
  unsigned types. Compare the difference against the limit instead.
note: >-
  Syntactic match only: flags a relational comparison whose left operand is a
  literal addition of two identifiers. It does not check operand types,
  signedness, or whether the sum is guarded elsewhere.
rule:
  pattern: '$A + $B > $LEN'
