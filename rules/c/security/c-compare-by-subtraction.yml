id: c-compare-by-subtraction
language: c
severity: warning
message: >-
  Comparator returns a difference of the same member from two pointers;
  subtraction can overflow or truncate. Use explicit comparisons.
note: >-
  Syntactic match only on a return of a->f - b->f through pointer member
  access with the same member name; does not check types, overflow ranges, or
  whether the function is used as a sort comparator.
rule:
  pattern: 'return $A->$F - $B->$F;'
