# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-null-guard-inverted-deref
language: c
severity: warning
message: Pointer is dereferenced inside a branch where it was just tested to be NULL.
note: >-
  Syntactic only; matches the same identifier in the condition and a
  dereference in the body, without checking reassignment or early exits. Only
  the *p form is matched.
rule:
  all:
    - pattern: 'if (!$P) $BODY'
    - has:
        stopBy: end
        pattern: '*$P'
