id: c-printf-wrapper-missing-format-attribute
language: c
severity: warning
message: 'Variadic function with a const char *fmt parameter lacks a format attribute.'
note: >-
  Syntactic single-file check on the declaration text only; it matches a
  declaration whose fixed parameter list ends with const char *fmt followed by
  variadic arguments, and it does not verify attributes placed elsewhere or
  that fmt is forwarded to a printf-style sink.
rule:
  all:
    - pattern: 'void log_line(int level, const char *fmt, ...);'
    - not:
        pattern: >-
          void log_line(int level, const char *fmt, ...)
          __attribute__((format(printf,2,3)));
