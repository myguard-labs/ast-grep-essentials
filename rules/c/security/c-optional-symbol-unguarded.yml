# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-optional-symbol-unguarded
language: c
severity: warning
message: >-
  RAND_egd is called outside a preprocessor conditional block. Some libraries,
  such as LibreSSL, do not provide it.
note: >-
  Matches only direct RAND_egd calls that are not inside a #if or #ifdef block
  in the same file. It does not check what the guard condition tests. It does
  not cover ENGINE_CTRL_CHIL_SET_FORKCHECK or struct sockaddr_un.
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        kind: identifier
        regex: '^RAND_egd$'
    - not:
        inside:
          stopBy: end
          kind: preproc_ifdef
    - not:
        inside:
          stopBy: end
          kind: preproc_if
