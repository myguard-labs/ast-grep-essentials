id: c-empty-parens-function-pointer-declarator
language: c
severity: warning
message: >-
  Function pointer declarator uses an empty parameter list, leaving parameter
  types unspecified; use (void) or a full prototype.
note: >-
  Syntactic match on a parenthesized pointer declarator with an empty
  parameter list. It does not resolve types, macros, or whether the
  declaration is reachable or used.
rule:
  pattern:
    context: 'void (*$NAME)();'
    selector: function_declarator
