  cwe: 'CWE-195'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/195.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'pointer return type ''size_t *f(void)'' keeps reporting (cast of -1 to pointer)'
  known_false_negatives: 'the unsigned-return exclusion keys on the nearest function_definition only; a same-named shadow or macro-wrapped signature is not resolved'
