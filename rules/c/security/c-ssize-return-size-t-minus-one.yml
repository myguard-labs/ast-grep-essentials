id: c-ssize-return-size-t-minus-one
language: c
severity: warning
message: >-
  Return (ssize_t)-1 as the error sentinel; (size_t)-1 is an unsigned value
  that does not compare equal to -1 at a signed caller.
note: >-
  Purely syntactic match on a return statement whose expression is a cast of
  -1 to size_t. It does not verify that the enclosing function returns
  ssize_t, nor does it resolve types, aliases, or callers.
rule:
  pattern: 'return (size_t)-1;'
