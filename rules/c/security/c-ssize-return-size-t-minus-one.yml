# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-ssize-return-size-t-minus-one
language: c
severity: warning
message: >-
  Return (ssize_t)-1 as the error sentinel; (size_t)-1 is an unsigned value
  that does not compare equal to -1 at a signed caller.
note: >-
  Purely syntactic match on a return statement whose expression is a cast of
  -1 to size_t. Skips functions whose declared return type is size_t or
  another unsigned type (the idiomatic sentinel). It does not resolve type
  aliases or callers.
rule:
  pattern: 'return (size_t)-1;'
  not:
    inside:
      stopBy:
        kind: function_definition
      kind: function_definition
      all:
        - has:
            field: type
            regex: '^(size_t|uintptr_t|uintmax_t|uint(8|16|32|64)_t|unsigned\b.*)$'
        - has:
            field: declarator
            kind: function_declarator
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
