id: c-strlen-end-pointer-as-last-char
language: c
severity: warning
message: >-
  Pointer assigned to one past the end of a string (s + strlen(s));
  dereferencing it reads the NUL terminator, not the last character.
note: >-
  Syntactic match only on the literal assignment of `value + strlen(value)` to
  a pointer. It does not resolve types or aliasing, and legitimate
  one-past-end sentinels also match, so review hits manually.
rule:
  pattern: '$P = $S + strlen($S)'
