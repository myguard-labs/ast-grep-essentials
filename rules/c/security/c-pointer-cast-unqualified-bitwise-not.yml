# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-pointer-cast-unqualified-bitwise-not
language: c
severity: warning
message: >-
  Pointer cast applied to a bitwise-not of an operand with no integer cast;
  result depends on width and sign.
note: >-
  Textual match on macro bodies only; does not resolve types or whether the
  operand is already a wide integer.
rule:
  kind: preproc_arg
  regex: '\(\s*[A-Za-z_][A-Za-z_0-9\s]*\*+\s*\)\s*\(\s*~\s*[A-Za-z_0-9]'
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
