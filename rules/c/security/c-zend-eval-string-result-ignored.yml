id: c-zend-eval-string-result-ignored
language: c
severity: warning
message: >-
  The return value of zend_eval_string() is ignored as a bare expression
  statement; check it for FAILURE.
note: >-
  Syntactic check only. Matches a standalone call statement to
  zend_eval_string with no enclosing comparison, assignment, or return. It
  does not verify the callee identity, the return type, or whether the result
  is checked elsewhere.
rule:
  pattern: 'zend_eval_string($$$ARGS);'
