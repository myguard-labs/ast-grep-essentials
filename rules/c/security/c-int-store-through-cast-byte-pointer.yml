# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-int-store-through-cast-byte-pointer
language: c
severity: warning
message: >-
  Assignment stores an int through a pointer cast, which may violate strict
  aliasing.
note: >-
  Matches the literal `*(int *) expr = value` syntax only; it does not verify
  that the expression points into a byte buffer.
rule:
  pattern: '*(int *) $E = $V'
