id: c-openssl-fetch-legacy-fallback-no-mark
language: c
severity: warning
message: >-
  EVP fetch failure is replaced by a legacy EVP_get_* fallback without a
  preceding ERR_set_mark.
note: >-
  Syntactic only; checks the immediately preceding statement for ERR_set_mark
  and does not track marks set elsewhere or pop them.
rule:
  pattern: 'if ($V == NULL) $V = $G($$$A);'
  follows:
    all:
      - pattern: '$V = $F($$$B);'
      - not:
          follows:
            kind: expression_statement
            regex: ERR_set_mark
constraints:
  F:
    regex: '^EVP_\w+_fetch$'
  G:
    regex: '^EVP_get_\w+$'
