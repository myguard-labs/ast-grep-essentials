# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-param-buffer-nul-write-in-place
language: c
severity: warning
message: >-
  NUL stored at a length-minus-one index in a function taking a writable char
  pointer parameter; this may mutate the caller's buffer.
note: >-
  Syntactic only; does not verify the indexed name is the parameter itself, so
  it can match a different pointer in the same function.
rule:
  all:
    - pattern: '$A[$N - 1] = ''\0'''
    - inside:
        stopBy: end
        kind: function_definition
        has:
          stopBy: end
          kind: parameter_declaration
          all:
            - has:
                field: type
                regex: '^char$'
            - has:
                kind: pointer_declarator
            - not:
                has:
                  kind: type_qualifier
