# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-xor-equality-precedence-unparenthesized
language: c
severity: warning
message: >-
  Bitwise XOR whose right operand is an unparenthesized equality comparison;
  this parses as a ^ (b != k). Add parentheses if XOR was intended.
note: >-
  Single-file syntactic check. Flags a binary XOR whose right operand is a
  bare equality or inequality expression in the shown syntax; does not resolve
  types, operand values, or intent.
rule:
  pattern: '$A ^ $B != $C'
