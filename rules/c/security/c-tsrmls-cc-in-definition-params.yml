id: c-tsrmls-cc-in-definition-params
language: c
severity: warning
message: >-
  TSRMLS_CC appears in a function definition's parameter list where the
  declaration form TSRMLS_DC is required.
note: >-
  Purely syntactic check on a single file. It flags a TSRMLS_CC parameter in a
  function definition regardless of ZTS configuration or macro expansion; it
  does not resolve macros, types, or whether the build is ZTS.
rule:
  all:
    - kind: parameter_declaration
    - has:
        pattern: TSRMLS_CC
        kind: identifier
        stopBy: end
    - inside:
        kind: parameter_list
        stopBy: end
        inside:
          kind: function_definition
          stopBy: end
