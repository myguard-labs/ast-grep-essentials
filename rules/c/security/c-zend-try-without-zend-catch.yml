# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-zend-try-without-zend-catch
language: c
severity: warning
message: >-
  This zend_try block is closed by zend_end_try() without a zend_catch block,
  so cleanup on bailout is skipped.
note: >-
  Purely syntactic check of the macro sequence in a single file. It does not
  verify whether any cleanup is actually needed or whether bailout can occur
  in the body.
rule:
  all:
    - kind: compound_statement
    - has:
        pattern: 'zend_end_try()'
        stopBy: end
    - not:
        has:
          pattern: zend_catch
          stopBy: end
    - inside:
        kind: function_definition
        stopBy: end
