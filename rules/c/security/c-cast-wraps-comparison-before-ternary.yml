id: c-cast-wraps-comparison-before-ternary
language: c
severity: warning
message: >-
  A cast wraps a relational comparison that is used as a ternary condition;
  the cast may have been intended for the whole ternary result.
note: >-
  Purely syntactic match on a cast applied to a relational comparison used as
  a conditional-expression condition. It does not check types, value ranges,
  or whether the author intended the cast on the condition.
rule:
  pattern: '(int) ($A < $B) ? $C : $D'
