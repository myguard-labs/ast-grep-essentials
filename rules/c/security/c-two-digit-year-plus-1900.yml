id: c-two-digit-year-plus-1900
language: c
severity: warning
message: >-
  Review this two-digit year adjustment that adds 1900 to the same variable it
  compares against 100.
note: >-
  Single-file syntactic match on an if statement whose condition is a
  less-than comparison of a variable against 100 and whose body adds 1900 to
  that same variable. It does not resolve types, data flow, or intent;
  legitimate two-digit year parsing may match and needs human review.
rule:
  pattern: 'if ($Y < 100) $Y += 1900;'
