id: c-convert-to-string-mutates-foreach-entry
language: c
severity: warning
message: >-
  convert_to_string rewrites its argument in place; if this is a hash foreach
  entry it mutates the container. Consider zval_get_string.
note: >-
  Matches direct convert_to_string calls syntactically; does not verify the
  argument is a ZEND_HASH_FOREACH_VAL loop variable.
rule:
  kind: call_expression
  has:
    kind: identifier
    regex: '^convert_to_string$'
