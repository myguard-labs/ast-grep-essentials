# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-hash-find-out-param-single-pointer
language: c
severity: warning
message: >-
  zend_hash find call casts the address of a single-level pointer to void **,
  hiding a possible out-parameter type mismatch.
note: >-
  Syntactic only; matches a same-name single-pointer declaration enclosing the
  call without resolving scope, shadowing, or types.
rule:
  all:
    - pattern: '$F($H, $I, (void **)&$X)'
    - inside:
        stopBy: end
        has:
          stopBy: end
          pattern: '$T *$X;'
constraints:
  F:
    regex: '^zend_hash_.*find'
