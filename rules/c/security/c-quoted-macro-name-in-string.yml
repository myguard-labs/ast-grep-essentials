id: c-quoted-macro-name-in-string
language: c
severity: warning
message: >-
  This string literal contains an escaped double quote before an uppercase
  identifier, which may be a macro name printed literally instead of its
  value.
note: >-
  Purely syntactic match on string literal text containing \" followed by an
  uppercase identifier. It does not resolve whether the identifier is a macro
  or verify the intended behavior.
rule:
  kind: string_literal
  regex: '\\"\s*[A-Z][A-Z0-9_]*\s*\\"'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
