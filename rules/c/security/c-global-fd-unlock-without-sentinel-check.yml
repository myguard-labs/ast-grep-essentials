id: c-global-fd-unlock-without-sentinel-check
language: c
severity: warning
message: >-
  fcntl is called on a descriptor variable that is not compared anywhere in
  this function.
note: >-
  Syntactic only. It does not check that the variable is file-scope or
  initialized, and it treats any comparison of the same identifier in the
  function as a guard.
rule:
  all:
    - pattern: 'fcntl($FD, $$$ARGS)'
    - inside:
        stopBy: end
        kind: function_definition
        not:
          has:
            stopBy: end
            kind: binary_expression
            has:
              pattern: '$FD'
constraints:
  FD:
    kind: identifier
