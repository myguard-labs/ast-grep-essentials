id: c-deref-before-length-bound-loop
language: c
severity: warning
message: >-
  Loop condition dereferences a pointer before checking the length bound;
  reorder so the bound is tested first.
note: >-
  Syntactic only; covers for-loop conditions, detects bounds by operand names
  like len, count, size, or n, and does not verify types or buffer sizes.
rule:
  all:
    - kind: binary_expression
    - pattern: '$A && $B'
    - has:
        field: left
        has:
          kind: pointer_expression
          stopBy: end
    - has:
        field: right
        regex: '\b(len|length|count|size|n|nbytes)\b'
    - inside:
        kind: for_statement
        stopBy: end
