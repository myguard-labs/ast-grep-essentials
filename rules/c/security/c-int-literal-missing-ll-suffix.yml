id: c-int-literal-missing-ll-suffix
language: c
severity: warning
message: >-
  Decimal integer literal with 11 or more digits has no U, L, or LL suffix;
  add an explicit LL suffix to fix its width.
note: >-
  Syntactic check only. Matches decimal literals whose text has 11 or more
  digits and no suffix; it does not determine the target type, the compiler's
  typing rules, or whether the value is used in arithmetic.
rule:
  kind: number_literal
  regex: '^[1-9][0-9]{10,}$'
