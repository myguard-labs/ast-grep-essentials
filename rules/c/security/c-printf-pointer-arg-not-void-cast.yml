# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-printf-pointer-arg-not-void-cast
language: c
severity: warning
message: 'Argument for %p should be cast to (void *).'
note: >-
  Matches only two-argument printf calls with a %p in the format literal; does
  not map conversions to arguments or resolve types.
rule:
  pattern: 'printf($FMT, $ARG)'
constraints:
  FMT:
    regex: '%p'
  ARG:
    not:
      kind: cast_expression
