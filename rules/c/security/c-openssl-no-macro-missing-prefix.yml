id: c-openssl-no-macro-missing-prefix
language: c
severity: warning
message: >-
  Preprocessor test of a bare NO_<ALGO> macro; OpenSSL's disable flag is
  OPENSSL_NO_<ALGO>, so this guard may always be true.
note: >-
  Matches only a preprocessor ifndef line whose identifier begins with the
  literal bare NO_ prefix. It does not resolve macro definitions, includes, or
  build configuration.
rule:
  pattern: '#ifndef NO_DSA'
