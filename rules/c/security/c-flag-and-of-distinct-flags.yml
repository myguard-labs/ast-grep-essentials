id: c-flag-and-of-distinct-flags
language: c
severity: warning
message: >-
  A parenthesized bitwise AND combines two flag macros; for disjoint bits the
  result is zero, so the check may never fire.
note: >-
  Purely syntactic match on a parenthesized binary & whose two operands are
  both identifiers. It cannot verify that the macros are distinct flag
  constants, resolve their values, or confirm that | was intended.
rule:
  kind: parenthesized_expression
  has:
    kind: binary_expression
    pattern: '$A & $B'
    all:
      - has:
          kind: identifier
          pattern: '$A'
      - has:
          kind: identifier
          pattern: '$B'
