id: c-preproc-if-bare-identifier
language: c
severity: warning
message: >-
  Bare identifier used as an if directive condition; use defined(NAME) or
  compare to a value.
note: >-
  Matches only an identifier that is the whole condition of a preprocessor if;
  identifiers nested in larger expressions are not covered and macro values
  are not resolved.
rule:
  kind: preproc_if
  has:
    field: condition
    kind: identifier
