# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-narrow-cast-before-wide-shift
language: c
severity: warning
message: >-
  A narrowing cast to an 8-bit unsigned type is applied before a right shift
  by a constant of 8 or more, so the result is always zero.
note: >-
  Syntactic check only. It matches a literal unsigned char cast whose operand
  is a shift expression written without parentheses around the shift; it does
  not check operand types, macro expansion, or the shift amount's value beyond
  the literal digits.
rule:
  kind: binary_expression
  all:
    - has:
        field: left
        kind: cast_expression
        regex: '^\(\s*unsigned\s+char\s*\)'
    - has:
        field: operator
        regex: '^>>$'
    - has:
        field: right
        regex: '^(8|9|[1-9][0-9]+|0x[89a-fA-F][0-9a-fA-F]*)$'
