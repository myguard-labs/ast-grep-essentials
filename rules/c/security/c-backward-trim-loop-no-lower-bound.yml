id: c-backward-trim-loop-no-lower-bound
language: c
severity: warning
message: >-
  Backward-scanning loop dereferences and decrements a pointer without a
  lower-bound comparison in its condition.
note: >-
  Syntactic only; it does not check whether the bound is enforced elsewhere,
  or whether the same pointer is dereferenced and decremented.
rule:
  kind: while_statement
  all:
    - has:
        field: condition
        has:
          pattern: '*$E'
          stopBy: end
    - has:
        field: body
        has:
          pattern: '$E--'
          stopBy: end
    - not:
        has:
          field: condition
          has:
            pattern: '$E >= $A'
            stopBy: end
