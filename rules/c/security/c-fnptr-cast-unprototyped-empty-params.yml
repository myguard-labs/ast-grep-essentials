id: c-fnptr-cast-unprototyped-empty-params
language: c
severity: warning
message: >-
  Function-pointer cast uses an empty parameter list, which disables prototype
  checking.
note: >-
  Matches only the literal syntax of a cast whose function-pointer type has an
  empty parameter list. It does not resolve the cast target's real signature,
  the source expression's type, or whether the call is actually made through
  an incompatible signature.
rule:
  kind: cast_expression
  has:
    kind: abstract_function_declarator
    pattern: '$FN'
    stopBy: end
    all:
      - has:
          kind: parameter_list
          not:
            has:
              kind: parameter_declaration
