id: c-enum-return-integer-literal
language: c
severity: warning
message: >-
  Return an enumerator instead of a bare integer literal from a function
  returning an enum.
note: >-
  Single-file syntactic check. It matches a function_definition whose return
  type is written as an enum specifier and whose return statement directly
  returns a number literal; it does not resolve types, typedefs, or runtime
  values.
rule:
  kind: function_definition
  all:
    - has:
        kind: enum_specifier
        stopBy: end
    - has:
        kind: return_statement
        stopBy: end
        has:
          kind: number_literal
          stopBy: end
