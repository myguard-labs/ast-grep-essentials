id: c-cast-away-const-parameter
language: c
severity: warning
message: >-
  C-style cast removes const from a pointer parameter; review the mutable
  reuse of this pointer.
note: >-
  Matches a syntactic C-style cast of a parameter-named identifier to a
  non-const pointer type. It does not resolve types, aliasing, or whether the
  cast actually discards const at runtime.
rule:
  all:
    - kind: cast_expression
    - pattern: '(int *)p'
