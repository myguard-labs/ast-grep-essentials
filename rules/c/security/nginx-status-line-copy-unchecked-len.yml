id: nginx-status-line-copy-unchecked-len
language: c
severity: warning
message: >-
  Copy of status_line into headers_in without a length guard on
  status_line->len.
note: >-
  Syntactic check only. Matches a status_line struct copy assignment not
  inside an if whose condition text contains status_line->len > 3; it does not
  verify the guard's semantics, aliasing, or reachability.
rule:
  pattern: '$X.status_line = *status_line;'
  not:
    inside:
      kind: if_statement
      stopBy: end
      has:
        pattern: 'status_line->len > 3'
        stopBy: end
