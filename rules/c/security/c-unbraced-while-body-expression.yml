# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-unbraced-while-body-expression
language: c
severity: warning
message: >-
  This while loop has an unbraced body that is a single expression statement;
  review whether following indented statements are outside the loop.
note: >-
  Syntactic check only. It flags a while statement whose body is a single
  expression statement without braces; it cannot tell whether the unbraced
  style is intentional or whether indentation misleads readers.
rule:
  kind: while_statement
  has:
    field: body
    kind: expression_statement
