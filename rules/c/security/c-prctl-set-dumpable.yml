id: c-prctl-set-dumpable
language: c
severity: warning
message: >-
  prctl(PR_SET_DUMPABLE, 1 with optional U/L suffix) re-arms core dumps. The kernel clears the dumpable
  flag when a process changes credentials precisely so a post-drop crash cannot
  write privileged memory into a core a lower-privileged user may read
  (CVE-2025-4598 / CVE-2025-5054 class).
note: >-
  Dismiss only with a stated reason and a verified collector policy: safe
  core_pattern handling and output permissions, or file core dumping disabled
  by an enforced core-size limit. RLIMIT_CORE is ignored for piped collectors.
  Setting dumpability to 0 is hardening and is not matched. See
  https://man7.org/linux/man-pages/man2/PR_SET_DUMPABLE.2const.html and
  https://man7.org/linux/man-pages/man5/core.5.html.
rule:
  any:
    - pattern: prctl(PR_SET_DUMPABLE, $VALUE, $$$)
    - pattern: prctl(PR_SET_DUMPABLE, $VALUE)
constraints:
  VALUE:
    kind: number_literal
    regex: '^1([lL]|[uU]|[uU][lL]|[lL][uU])?$'
