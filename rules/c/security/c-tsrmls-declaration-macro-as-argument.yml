id: c-tsrmls-declaration-macro-as-argument
language: c
severity: warning
message: >-
  TSRMLS_DC is a parameter declaration macro and is used here as a call
  argument; pass TSRMLS_CC instead.
note: >-
  Syntactic match only. Flags a call whose final argument is the literal
  identifier TSRMLS_DC; does not resolve callees, macro definitions, or ZTS
  configuration.
rule:
  pattern: '$F($$$ARGS, TSRMLS_DC)'
