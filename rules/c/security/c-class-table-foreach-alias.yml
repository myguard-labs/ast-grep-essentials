# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-class-table-foreach-alias
language: c
severity: warning
message: Class table iteration dereferences entries without skipping alias entries.
note: >-
  Syntactic only; matches a translation unit containing a
  ZEND_HASH_MAP_FOREACH_PTR over a class_table with no ZEND_IS_ALIAS text
  anywhere in the file, without checking other guards or dataflow.
rule:
  all:
    - kind: translation_unit
    - regex: 'ZEND_HASH_MAP_FOREACH_PTR\(\s*&[^,)]*class_table'
    - not:
        regex: ZEND_IS_ALIAS
