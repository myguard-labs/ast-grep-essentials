id: c-label-followed-by-declaration
language: c
severity: warning
message: >-
  Declaration directly follows a case label; wrap the case body in braces or
  put a statement first.
note: >-
  Purely syntactic; matches only case labels with a direct declaration child
  and does not check the C standard version or ordinary labels.
rule:
  kind: case_statement
  has:
    kind: declaration
