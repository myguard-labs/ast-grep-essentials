id: c-bare-include-directive
language: c
severity: warning
message: 'Line looks like an include directive that is missing the leading ''#''.'
note: >-
  Matches by file text only, so it reports once per file and does not check
  whether a macro named include exists or whether the line sits at top level.
rule:
  all:
    - kind: translation_unit
    - regex: '(?m)^[ \t]*include[ \t]*"[^"\n]*"[ \t]*\r?$'
