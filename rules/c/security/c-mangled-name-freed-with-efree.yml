id: c-mangled-name-freed-with-efree
language: c
severity: warning
message: >-
  Buffer from zend_mangle_property_name() is released with efree(); use
  pefree() with the same persistence flag.
note: >-
  Matches syntactically a preceding sibling statement that mangles into &var
  followed by efree(var); it does not verify control flow, reassignment, or
  the actual flag value.
rule:
  pattern: 'efree($N);'
  follows:
    pattern: 'zend_mangle_property_name(&$N, $$$REST);'
    stopBy: end
