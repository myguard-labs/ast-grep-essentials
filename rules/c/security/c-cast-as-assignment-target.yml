id: c-cast-as-assignment-target
language: c
severity: warning
message: >-
  A cast expression appears directly before a compound assignment operator;
  casts are not lvalues in standard C.
note: >-
  Matches only the literal syntax of a cast followed by a compound assignment
  (parsed as a cast over the assignment); it does not check compiler behavior
  or types.
rule:
  kind: cast_expression
  has:
    field: value
    kind: assignment_expression
    regex: '^[^=]*([-+*/%&|^]|<<|>>)='
