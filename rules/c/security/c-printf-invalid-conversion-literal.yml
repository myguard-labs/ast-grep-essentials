id: c-printf-invalid-conversion-literal
language: c
severity: warning
message: >-
  Format string literal contains a % followed by a long letter run that is not
  a valid conversion.
note: >-
  Purely textual check on the literal in call arguments; it does not verify
  the callee is printf-like or handle %% escapes.
rule:
  kind: string_literal
  regex: '%[a-zA-Z]{4,}'
  inside:
    kind: argument_list
    inside:
      kind: call_expression
