# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-hex-nibble-unguarded
language: c
severity: warning
message: Ternary hex-nibble conversion in a function that never calls isxdigit.
note: >-
  Syntactic only. It checks for a literal isxdigit call in the same function
  and does not prove the input is validated elsewhere.
rule:
  kind: function_definition
  all:
    - has:
        stopBy: end
        kind: conditional_expression
        has:
          stopBy: end
          pattern: '$X - 0x37'
    - not:
        has:
          stopBy: end
          kind: call_expression
          has:
            field: function
            regex: '^isxdigit$'
