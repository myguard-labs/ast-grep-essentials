id: c-subtraction-compared-to-zero
language: c
severity: warning
message: >-
  Parenthesized subtraction compared against 0; with unsigned operands this
  wraps and may not mean the intended ordering.
note: >-
  Syntactic check only. Matches a parenthesized binary subtraction of two
  identifiers compared with literal 0 using a relational operator. Does not
  verify operand types, signedness, or values.
rule:
  kind: parenthesized_expression
  has:
    kind: binary_expression
    pattern: '$A - $B'
    all:
      - has:
          kind: identifier
          pattern: '$A'
      - has:
          kind: identifier
          pattern: '$B'
  inside:
    kind: binary_expression
    has:
      field: right
      kind: number_literal
      regex: '^0$'
metadata:
  rule_modified_at: '2026-10-15'
