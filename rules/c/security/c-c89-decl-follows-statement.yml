id: c-c89-decl-follows-statement
language: c
severity: warning
message: >-
  Declaration with initializer follows an if statement in the same block,
  which C89 forbids.
note: >-
  Matches syntactic ordering only within one compound statement and only after
  an if statement; it does not check which standard the build targets or macro
  expansions.
rule:
  kind: declaration
  has:
    kind: init_declarator
  inside:
    kind: compound_statement
  follows:
    stopBy: end
    kind: if_statement
