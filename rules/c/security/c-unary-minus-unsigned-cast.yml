id: c-unary-minus-unsigned-cast
language: c
severity: warning
message: >-
  Unary minus applied to an unsigned integer cast; consider the explicit 0 -
  form to make the wraparound intent clear.
note: >-
  Purely syntactic match on a unary minus whose operand is a parenthesized
  cast to an unsigned type name. Does not resolve typedefs, macros, or the
  real type of the operand, and does not judge overflow semantics (unsigned
  wraparound is defined).
rule:
  kind: unary_expression
  pattern: '-(unsigned long)$V'
