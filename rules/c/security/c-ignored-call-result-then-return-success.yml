# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-ignored-call-result-then-return-success
language: c
severity: warning
message: Call result is discarded and the next statement unconditionally returns 1.
note: >-
  Matches syntax only. It does not check whether the call can fail or whether
  returning 1 means success, so expect false positives.
rule:
  all:
    - kind: expression_statement
    - has:
        kind: call_expression
    - precedes:
        kind: return_statement
        regex: '^return 1;$'
