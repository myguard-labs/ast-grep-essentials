id: c-path-strip-leading-slash-only
language: c
severity: warning
message: >-
  This strips only a single leading slash from a path; other absolute forms
  are not handled.
note: >-
  Purely syntactic match on an IS_SLASH(path[0]) guard followed by path + 1.
  It does not resolve types, aliasing, or whether other absolute-path checks
  happen elsewhere in the function.
rule:
  pattern: |
    if (IS_SLASH($P[0])) { return $P + 1; }
