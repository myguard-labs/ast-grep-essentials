id: c-empty-parens-prototype
language: c
severity: warning
message: >-
  Function declared with an empty parameter list () instead of (void);
  arguments are unspecified and prototype checks are disabled.
note: >-
  Syntactic match only on a C function declaration whose parameter list is
  literally empty, written as f(). It does not verify call sites or resolve
  declarations across files.
rule:
  pattern: 'int f();'
