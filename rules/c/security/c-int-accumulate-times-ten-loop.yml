id: c-int-accumulate-times-ten-loop
language: c
severity: warning
message: >-
  Decimal accumulation v = v * 10 + d inside a loop with no enclosing guard;
  this may overflow.
note: >-
  Syntactic approximation only. It matches a while loop and an assignment not
  nested in any if statement. It does not check the variable type, the bound,
  or the guard semantics.
rule:
  all:
    - pattern: '$V = $V * 10 + $D'
    - inside:
        kind: while_statement
        stopBy: end
    - not:
        inside:
          kind: if_statement
          stopBy: end
