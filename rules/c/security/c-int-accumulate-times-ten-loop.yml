# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-int-accumulate-times-ten-loop
language: c
severity: warning
message: >-
  Decimal accumulation v = v * 10 + d inside a loop with no enclosing guard;
  this may overflow.
note: >-
  Syntactic approximation only. It matches a while loop and an assignment not
  nested in any if statement. It does not check the variable type, the bound,
  or the guard semantics.
rule:
  all:
    - pattern: '$V = $V * 10 + $D'
    - inside:
        kind: while_statement
        stopBy: end
    - not:
        inside:
          kind: if_statement
          stopBy: end
metadata:
  rule_modified_at: '2026-10-20'
  ast_grep_tested_version: 0.51.0
  validated_at: '2026-10-20'
  created_at: '2026-10-20'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-190'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/190.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'a correct boundary guard written as a sibling early exit (if (v > LIMIT) break; before the accumulation) does not enclose it, so the accumulation is still reported'
  todo_cases:
    - "int parse(const char *p) { int v = 0; for (; *p; p++) { v = v * 10 + (*p - '0'); } return v; }"
    - "int parse(const char *p) { int v = 0; do { v = v * 10 + (*p - '0'); p++; } while (*p); return v; }"
    - "int parse(const char *p) { int v = 0; while (*p) { v = 10 * v + (*p - '0'); p++; } return v; }"
    - "int parse(const char *p) { int v = 0; while (*p) { v = (v * 10) + (*p - '0'); p++; } return v; }"
    - "int parse(const char *p) { int v = 0; while (*p) { v *= 10; v += (*p - '0'); p++; } return v; }"
    - "int parse(const char *p) { int v = 0; while (*p) { v = v * 10 + *p - 48; p++; } return v; }"
