# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-statement-after-goto-unreachable
language: c
severity: warning
message: >-
  This statement directly follows a goto in the same block and cannot be
  reached.
note: >-
  Syntactic check only. It flags a statement immediately after a goto in the
  same compound block; it does not analyze labels reached from elsewhere,
  macros, or control flow beyond this shown syntax.
rule:
  all:
    - kind: expression_statement
    - follows:
        kind: goto_statement
        stopBy: neighbor
