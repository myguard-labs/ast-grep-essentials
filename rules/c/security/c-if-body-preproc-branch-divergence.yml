# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-if-body-preproc-branch-divergence
language: c
severity: warning
message: >-
  Unbraced if body is split by a preprocessor conditional; the controlled
  statement differs by build configuration.
note: >-
  Matches a preprocessor ifdef/ifndef block whose immediately preceding
  sibling ends in a closing parenthesis, as in an unbraced if condition; it
  does not evaluate macros or build configurations and may also match other
  directive placements after parenthesized syntax.
rule:
  all:
    - kind: preproc_ifdef
    - follows:
        regex: '\)$'
