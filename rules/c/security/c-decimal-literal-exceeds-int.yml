id: c-decimal-literal-exceeds-int
language: c
severity: warning
message: >-
  Decimal integer literal has no L or U suffix and may exceed INT_MAX; its
  type is implementation-dependent.
note: >-
  Syntactic check only. Matches decimal integer literals with no suffix and
  does not evaluate the literal's value, so literals at or below INT_MAX and
  hex literals are not distinguished by magnitude here; it does not resolve
  target type sizes or context.
rule:
  pattern: '$LIT'
  kind: number_literal
  regex: '^[1-9][0-9]*$'
  not:
    regex: '^[0-9]{1,9}$'
