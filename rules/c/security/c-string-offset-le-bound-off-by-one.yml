# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-string-offset-le-bound-off-by-one
language: c
severity: warning
message: >-
  Index is compared with <= against a length and then used to subscript the
  same buffer; the index may equal the length, one past the end.
note: >-
  Single-file syntactic match on a binary_expression with <= whose operands
  are the index and length, plus a subscript of the same buffer with the same
  index in the same enclosing expression. Does not resolve types, buffer
  sizes, or runtime values.
rule:
  all:
    - pattern: '$I <= $N && $S[$I] != ''0'''
