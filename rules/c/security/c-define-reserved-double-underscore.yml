# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-define-reserved-double-underscore
language: c
severity: warning
message: >-
  Macro name beginning with a double underscore is reserved for the
  implementation.
note: >-
  Matches the literal macro name syntax only; it does not check whether the
  code is system or implementation code.
rule:
  kind: preproc_def
  has:
    field: name
    kind: identifier
    regex: '^__'
