id: c-unprototyped-empty-parameter-list
language: c
severity: warning
message: >-
  This function declarator has an empty parameter list `()`, so it has no
  prototype and call-site argument checking is disabled. Use `(void)` if no
  parameters are intended.
note: >-
  Single-file syntactic match on a function declarator with an empty parameter
  list. It does not resolve call sites, types, or whether the declaration is a
  prototype in another translation unit, and it does not account for C23
  semantics.
rule:
  kind: function_declarator
  all:
    - has:
        field: declarator
        kind: identifier
    - has:
        field: parameters
        kind: parameter_list
        not:
          has:
            kind: parameter_declaration
    - not:
        has:
          field: parameters
          kind: parameter_list
          regex: void
