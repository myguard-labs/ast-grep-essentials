# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-c89-decl-after-statement-block
language: c
severity: warning
message: >-
  A declaration follows an expression statement in the same block, which C89
  does not allow.
note: >-
  Syntactic only. Matches a declaration whose preceding sibling statement is
  an expression statement inside the same compound block; does not check the
  target language standard, macros, or type information.
rule:
  all:
    - kind: declaration
    - follows:
        kind: expression_statement
        stopBy: neighbor
    - inside:
        kind: compound_statement
        stopBy: end
