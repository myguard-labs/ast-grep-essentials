# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-c89-decl-after-statement-block
language: c
severity: warning
message: >-
  A declaration follows an executable statement in the same block, which C89
  does not allow.
note: >-
  Syntactic only. Matches a declaration, with or without an initializer, that
  follows an expression statement among its siblings, including inside case
  labels and preprocessor conditional blocks within a function body. It does
  not check the target language standard, macros, or type information.
rule:
  all:
    - kind: declaration
    - follows:
        kind: expression_statement
        stopBy: end
    - inside:
        kind: compound_statement
        stopBy: end
