id: c-enum-hex-constant-exceeds-int
language: c
severity: warning
message: >-
  Enumerator initializer is an 8-digit hex literal with a leading digit 8-F,
  so its value exceeds INT_MAX and does not fit int.
note: >-
  Syntactic match on the literal text only; it checks for an 8-digit hex
  literal starting with 8-F inside an enumerator initializer and does not
  evaluate constant values, macros, or types.
rule:
  kind: enumerator
  has:
    field: value
    regex: '^0[xX][89a-fA-F][0-9a-fA-F]{7}$'
