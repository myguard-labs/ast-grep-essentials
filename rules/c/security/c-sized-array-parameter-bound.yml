id: c-sized-array-parameter-bound
language: c
severity: warning
message: >-
  This parameter declares a fixed-size array bound, which decays to a pointer
  and does not enforce the declared size at call sites.
note: >-
  Matches a function parameter declared with a numeric array bound
  syntactically; it does not check what callers actually pass or resolve types
  across files.
rule:
  kind: array_declarator
  all:
    - has:
        field: size
        kind: number_literal
    - inside:
        kind: parameter_declaration
        stopBy: end
