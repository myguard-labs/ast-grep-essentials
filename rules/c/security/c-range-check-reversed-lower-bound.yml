id: c-range-check-reversed-lower-bound
language: c
severity: warning
message: >-
  Lower bound appears inverted in a range check; the constant is on the left
  of a comparison against the same variable.
note: >-
  Single-file syntactic match on a literal constant-first comparison combined
  with a variable-first upper bound in one && chain. It does not resolve
  types, macros, or whether the variable is the intended operand.
rule:
  any:
    - pattern: '(15 >= offset) && (offset <= 23)'
