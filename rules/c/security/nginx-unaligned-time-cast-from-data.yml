# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: nginx-unaligned-time-cast-from-data
language: c
severity: warning
message: >-
  Casting a byte-array member offset to a stricter pointer type may be
  misaligned.
note: >-
  Syntactic match only. Flags a cast to a pointer type of a sum involving the
  data member; it does not verify the target type's alignment requirement or
  the runtime offset.
rule:
  pattern: '(time_t *) ($X->data + $Y)'
