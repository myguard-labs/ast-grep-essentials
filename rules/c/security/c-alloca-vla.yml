id: c-alloca-vla
language: c
severity: warning
message: >-
  alloca() or variable-length array (VLA) — stack overflow / stack clash if the
  size is non-constant and attacker-influenced, and no failure path (alloca
  can't report OOM, VLAs have no error path). Use a heap allocation (in nginx:
  ngx_pnalloc from the request pool) with a bounded size. For VLAs, use
  fixed-size arrays, or allocate on the heap.
note: >-
  Dismiss if the size is a small compile-time constant. The VLA arm is a
  naming heuristic, not a constant-expression analysis: a bare identifier not
  starting with an uppercase letter or underscore (e.g. `buf[n]`, `buf[len]`)
  is matched; so is an expression containing such an identifier in a binary
  operation (e.g. `buf[len + 1]`, `buf[n * 2]`), a function call (e.g.
  `buf[get_len()]`), or field access (e.g. `buf[h->len]`). A size built only from `sizeof` or from
  uppercase-letter identifiers is treated as fixed-size, and the same
  uppercase exemption applies to the callee of a call size and to the object of
  a field-access size, so the conventional fixed-size macros `buf[ARRAY_SIZE(x)]`
  and `buf[CFG.MAX]` are skipped. The callee exemption also allowlists the
  conventional lowercase count spellings `countof`, `nitems`, `nelems`, and
  `lengthof`, so `buf[countof(z)]` is skipped the same way, through the same
  parenthesized/unary wrappers as the uppercase exemption. This lowercase
  allowlist covers a direct call callee only -- the function name itself, or
  the method name of a field-access callee -- and does not extend to the
  object of a field-access callee or to a bare field-access size, so an
  object merely named `countof` still reports, e.g. `buf[countof.get_len()]`.
  The exemption is per identifier, not per
  size: within an arithmetic size each lowercase identifier is skipped only
  when it sits inside `sizeof` or inside a call whose callee is uppercase. So
  `buf[ARRAY_SIZE(x) - 1]` is skipped because its only lowercase identifier is
  the macro argument, while `buf[ARRAY_SIZE(x) - n]` still reports on `n`,
  which is correct -- that size really is variable-length. That is a naming/shape heuristic, not constant-expression analysis --
  a lowercase macro or lowercase `static const` used as or inside a size --
  other than the four allowlisted spellings above -- still reports as a false
  positive. A parenthesized size and a unary size are
  unwrapped before the four shapes are checked, so `buf[(len + 1)]` and
  `buf[-n]` report exactly like their unwrapped form. A field-access or a
  call size may itself nest a field access in its object or callee slot, so
  `buf[a->b->len]` and `buf[ops->get_len()]` report the same as `buf[h->len]`
  and `buf[get_len()]`; the uppercase exemption still applies to the whole
  nested chain, so `buf[CFG.SUB.MAX]` stays skipped. Parameter declarators such as
  `void f(int n, char buf[n])` are excluded because they decay to a pointer
  and allocate nothing. A multidimensional VLA nests one array declarator per
  dimension, so each variable dimension reports separately: `int m[rows][cols]`
  raises two findings for one declaration.
rule:
  any:
    - kind: call_expression
      has:
        field: function
        regex: ^(alloca|__builtin_alloca|_alloca|_malloca)$
    - kind: array_declarator
      all:
        - has:
            field: size
            any:
              - all:
                  - kind: identifier
                  - not:
                      regex: ^[A-Z_]
              - all:
                  - kind: binary_expression
                  - has:
                      stopBy: end
                      kind: identifier
                      all:
                        - not:
                            regex: ^[A-Z_]
                        - not:
                            inside:
                              kind: sizeof_expression
                              stopBy: end
                        - not:
                            inside:
                              stopBy: end
                              kind: call_expression
                              has:
                                field: function
                                kind: identifier
                                regex: ^([A-Z_].*|countof|nitems|nelems|lengthof)$
              - all:
                  - kind: call_expression
                  - has:
                      field: function
                      any:
                        - all:
                            - kind: identifier
                            - not:
                                regex: ^([A-Z_].*|countof|nitems|nelems|lengthof)$
                        - all:
                            - kind: field_expression
                            - has:
                                stopBy: end
                                kind: identifier
                                not:
                                  regex: ^[A-Z_]
              - all:
                  - kind: field_expression
                  - has:
                      field: argument
                      any:
                        - all:
                            - kind: identifier
                            - not:
                                regex: ^[A-Z_]
                        - all:
                            - kind: field_expression
                            - has:
                                stopBy: end
                                kind: identifier
                                not:
                                  regex: ^[A-Z_]
              - all:
                  - kind: parenthesized_expression
                  - has:
                      stopBy: end
                      kind: identifier
                      all:
                        - not:
                            regex: ^[A-Z_]
                        - not:
                            inside:
                              kind: sizeof_expression
                              stopBy: end
                        - not:
                            inside:
                              stopBy: end
                              kind: call_expression
                              has:
                                field: function
                                kind: identifier
                                regex: ^([A-Z_].*|countof|nitems|nelems|lengthof)$
              - all:
                  - kind: unary_expression
                  - has:
                      field: argument
                      kind: identifier
                      not:
                        regex: ^[A-Z_]
        - not:
            inside:
              kind: parameter_declaration
              stopBy: end
