id: c-malloc-leak-on-early-return
language: c
severity: warning
message: >-
  This if-block returns early without calling free, although memory from
  malloc is freed later.
note: >-
  Syntactic approximation only; it does not check that the freed pointer is
  the same variable as the malloc result, or resolve aliases or control flow.
rule:
  any:
    - pattern: 'if ($COND) { return $$$R; }'
  all:
    - follows:
        stopBy: end
        pattern: '$T $V = malloc($$$A);'
    - precedes:
        stopBy: end
        pattern: 'free($$$B);'
    - not:
        has:
          pattern: 'free($$$ARGS)'
          stopBy: end
