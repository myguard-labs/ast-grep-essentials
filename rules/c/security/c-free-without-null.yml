id: c-free-without-null
language: c
severity: info
message: >-
  Pointer freed and left dangling — no assignment clears it before the enclosing
  block ends. A later dereference is a use-after-free (CWE-416, rank 7 in the
  2025 CWE Top 25) and a second free is a double free; both are exploitable
  primitives. Set the pointer to NULL immediately after freeing it.
note: >-
  Hygiene check, not a use-after-free finding: ast-grep sees no dataflow, so it
  cannot tell whether the pointer is used again. A pointer going out of scope on
  the next line, or a local whose function returns immediately, is the routine
  dismissal. nginx pool allocations are freed with the pool and need no free at
  all. Test and fuzz harnesses commonly free at scope end, so scope corpus
  scans to production sources.
utils:
  not-cleared:
    not:
      precedes:
        stopBy: end
        kind: expression_statement
        has:
          kind: assignment_expression
          pattern: $PTR = $_
          not:
            has:
              field: right
              any:
                - pattern: $PTR
                - kind: parenthesized_expression
                  has:
                    pattern: $PTR
                    stopBy:
                      not:
                        kind: parenthesized_expression
rule:
  any:
    # Put specific wrappers first: ast-grep's smart matching can otherwise let
    # the broad form capture the wrapper and fail the identifier constraint.
    - all:
        - pattern:
            context: void f(void) { free((($PTR))); }
            selector: expression_statement
        - matches: not-cleared
    - all:
        - pattern:
            context: void f(void) { free(($TYPE) $PTR); }
            selector: expression_statement
        - matches: not-cleared
    - all:
        - pattern:
            context: void f(void) { free(($PTR)); }
            selector: expression_statement
        - matches: not-cleared
    - all:
        - pattern:
            context: void f(void) { free($PTR); }
            selector: expression_statement
        - matches: not-cleared
    - all:
        - pattern:
            context: void f(void) { ngx_free((($PTR))); }
            selector: expression_statement
        - matches: not-cleared
    - all:
        - pattern:
            context: void f(void) { ngx_free(($TYPE) $PTR); }
            selector: expression_statement
        - matches: not-cleared
    - all:
        - pattern:
            context: void f(void) { ngx_free(($PTR)); }
            selector: expression_statement
        - matches: not-cleared
    - all:
        - pattern:
            context: void f(void) { ngx_free($PTR); }
            selector: expression_statement
        - matches: not-cleared
constraints:
  PTR:
    kind: identifier
