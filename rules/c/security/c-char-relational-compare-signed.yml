# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-char-relational-compare-signed
language: c
severity: warning
message: >-
  Plain char local used in a relational comparison; signedness is
  implementation-defined.
note: >-
  Matches by identifier name within one function only; does not resolve
  shadowing, types, or pointer declarators.
rule:
  all:
    - kind: binary_expression
    - has:
        field: operator
        regex: '^(<|>|<=|>=)$'
    - has:
        kind: identifier
        pattern: '$V'
    - inside:
        kind: function_definition
        stopBy: end
        has:
          stopBy: end
          kind: declaration
          all:
            - has:
                kind: primitive_type
                regex: '^char$'
            - has:
                stopBy: end
                kind: identifier
                pattern: '$V'
