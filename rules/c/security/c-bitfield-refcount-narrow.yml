id: c-bitfield-refcount-narrow
language: c
severity: warning
message: >-
  Counter-named member is declared as a narrow (8-bit or less) unsigned
  bitfield and may overflow.
note: >-
  Syntactic check only. Matches a field declaration whose name contains
  'count' and whose bitfield width is 1-8 literal bits. It does not resolve
  types, verify that the field is a reference counter, or check runtime
  overflow behaviour.
rule:
  kind: field_declaration
  all:
    - has:
        field: declarator
        regex: count
    - has:
        kind: bitfield_clause
        regex: '^:\s*[1-8]$'
metadata:
  rule_modified_at: '2026-10-16'
