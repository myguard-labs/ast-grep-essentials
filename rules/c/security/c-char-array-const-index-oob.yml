# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: c-char-array-const-index-oob
language: c
severity: warning
message: >-
  Constant index is at or beyond the declared element count of this local char
  array.
note: >-
  Syntactic single-file check; matches a literal index assigned in a function
  body against a local char array declared with a literal size in the same
  function, without tracking reassignment, aliasing, or runtime values.
rule:
  all:
    - pattern: '$BUF[4] = $VAL'
    - inside:
        kind: compound_statement
        stopBy: end
        has:
          pattern: 'char $BUF[4];'
