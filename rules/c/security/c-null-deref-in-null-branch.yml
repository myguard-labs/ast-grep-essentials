id: c-null-deref-in-null-branch
language: c
severity: warning
message: >-
  Pointer is dereferenced with -> inside the block entered when that same
  pointer tested null.
note: >-
  Syntactic single-file check only. Matches a literal negated identifier test
  in an if condition and a literal arrow dereference of the same identifier
  inside the consequence block; it does not resolve aliasing, reassignment,
  types, or reachability.
rule:
  all:
    - kind: if_statement
    - has:
        kind: parenthesized_expression
        has:
          kind: unary_expression
          pattern: '!$P'
    - has:
        kind: compound_statement
        has:
          kind: return_statement
          has:
            pattern: '$P->$F'
