id: java-xinclude-aware-without-resolver
language: java
severity: warning
message: >-
  setXIncludeAware(true) is called but no setEntityResolver(...) call appears
  in the same statement sequence.
note: >-
  Syntactic, single-scope check only. It looks at sibling statements in the
  same block and does not see resolvers set in helper methods, on aliased
  objects, or in other scopes. XInclude fetches are not controlled by the
  ACCESS_EXTERNAL_* attributes.
rule:
  kind: expression_statement
  has:
    pattern: '$F.setXIncludeAware(true)'
  all:
    - not:
        precedes:
          stopBy: end
          has:
            pattern: '$B.setEntityResolver($$$)'
            stopBy: end
    - not:
        follows:
          stopBy: end
          has:
            pattern: '$B.setEntityResolver($$$)'
            stopBy: end
