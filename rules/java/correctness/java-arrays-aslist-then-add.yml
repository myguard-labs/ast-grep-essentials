id: java-arrays-aslist-then-add
language: java
severity: warning
message: >-
  A list created directly by Arrays.asList has a fixed size, so calling add on
  it throws UnsupportedOperationException.
note: >-
  This is a syntactic check only. It matches an add(...) statement that comes
  after a sibling local declaration initialized directly with
  Arrays.asList(...) in the same block. It does not track reassignments made
  in between, aliases, add calls inside nested blocks, or List.of.
rule:
  pattern: '$L.add($$$ARGS);'
  follows:
    stopBy: end
    pattern: '$T $L = Arrays.asList($$$ITEMS);'
