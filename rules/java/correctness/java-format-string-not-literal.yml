id: java-format-string-not-literal
language: java
severity: warning
message: >-
  Format string supplied as a variable rather than a literal. Conversion
  specifiers in that value are interpreted, so a stray percent sign throws
  UnknownFormatConversionException at runtime, and a value an attacker
  influences can read unintended arguments or emit newlines that forge log
  records. Pass a literal format and put the variable in an argument slot.
note: >-
  Matches String.format, String.formatted, printf and format calls on a
  PrintStream or writer receiver whose first argument is not a string literal,
  When the first argument is a Locale constant or a variable named locale, the
  second argument is inspected instead, so the locale-first overloads are handled
  rather than reported. A constant format string held in
  a field is also reported, because the matcher cannot resolve it.
rule:
  kind: method_invocation
  all:
    - any:
        - all:
            - has: {field: name, regex: '^format$'}
            - has: {field: object, regex: '^(java\.lang\.)?String$'}
        - all:
            - has: {field: name, regex: '^(printf|format)$'}
            - has: {field: object, regex: '(?i)^(System\.(out|err)|out|err|writer|printWriter|response\.getWriter\(\))$'}
    - has:
        stopBy: neighbor
        kind: argument_list
        any:
          - all:
              - not:
                  has:
                    nthChild: 1
                    regex: '(^|\.)(Locale\.[A-Z_]+|locale)$'
              - has:
                  nthChild: 1
                  not: {kind: string_literal}
          - all:
              - has:
                  nthChild: 1
                  regex: '(^|\.)(Locale\.[A-Z_]+|locale)$'
              - has:
                  nthChild: 2
                  not: {kind: string_literal}
