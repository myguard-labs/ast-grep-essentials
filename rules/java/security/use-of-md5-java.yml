id: use-of-md5-java
language: java
severity: warning
message: >-
  MD5 is not collision resistant and should not be used where collision
  resistance is required.
note: >-
  This rule detects literal MD5 arguments to syntactically named
  MessageDigest.getInstance calls. It does not resolve types, shadowing,
  aliases, or runtime algorithm values.
rule:
  kind: string_literal
  regex: '^"MD5"$'
  nthChild: 1
  inside:
    kind: argument_list
    inside:
      kind: method_invocation
      all:
        - has:
            regex: '^(java\.security\.)?MessageDigest$'
            nthChild: 1
        - has:
            kind: identifier
            regex: '^getInstance$'
            nthChild: 2
        - not:
            all:
              - has:
                  kind: identifier
                  regex: '^MessageDigest$'
                  nthChild: 1
              - not:
                  inside:
                    stopBy: end
                    kind: program
                    has:
                      kind: import_declaration
                      pattern: 'import java.security.MessageDigest;'
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
