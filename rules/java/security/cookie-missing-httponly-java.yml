id: cookie-missing-httponly-java
language: java
severity: warning
message: >-
  Cookie addition lacks a preceding HttpOnly configuration other than literal
  false. Configure HttpOnly with true.
note: >-
  Single-file syntactic check only: preceding calls on the same syntactic
  receiver are considered. Empty-value assignments remain exempt. This rule
  does not determine runtime cookie state, aliases, control flow, or the
  effective order of multiple configurations.
rule:
  pattern: '$RESPONSE.addCookie($COOKIE);'
  all:
    - not:
        follows:
          stopBy: end
          pattern: '$COOKIE.setValue("");'
    - not:
        follows:
          stopBy: end
          all:
            - pattern: '$COOKIE.setHttpOnly($$$);'
            - not:
                pattern: '$COOKIE.setHttpOnly(false);'
