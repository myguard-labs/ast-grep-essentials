id: java-scanner-loop-without-eof-check
language: java
severity: warning
message: A while loop whose condition compares a char variable against a single character
  literal with != and never compares against CharacterIterator.DONE.
note: Hand-written scanners that stop only on a delimiter loop forever on truncated
  input, a DoS shape. The pattern recurs in comment, string and token readers. Expect
  noise where a loop is bounded by other means.
rule:
  all:
    - kind: while_statement
    - has:
        field: condition
        has:
          all:
            - pattern: $X != $Y
            - any:
                - all:
                    - has:
                        field: left
                        kind: identifier
                    - has:
                        field: right
                        kind: character_literal
                - all:
                    - has:
                        field: left
                        kind: character_literal
                    - has:
                        field: right
                        kind: identifier
    - not:
        regex: \bDONE\b
metadata:
  cwe: 'CWE-835'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/835.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'Not matched: a condition that combines the comparison with another test (`c != x && ...`), including an index bound, and a char read through a call or field (`s.charAt(i) != x`), a doubly parenthesised condition `((c != x))`; only a plain identifier compared with a character literal is reported. A loop mentioning DONE anywhere (also in the body) is skipped.'
    - 'Not matched: the read-in-condition idiom `while ((c = in.read()) != ''\n'')` (left operand is a parenthesised assignment) and `do { ... } while (c != x);`; only a `while_statement` with a plain identifier operand is reported.'
