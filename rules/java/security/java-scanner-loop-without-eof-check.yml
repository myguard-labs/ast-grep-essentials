id: java-scanner-loop-without-eof-check
language: java
severity: warning
message: A while loop whose condition compares a char variable against a single character
  literal with != and never compares against CharacterIterator.DONE.
note: Hand-written scanners that stop only on a delimiter loop forever on truncated
  input, a DoS shape. The pattern recurs in comment, string and token readers. Expect
  noise where a loop is bounded by other means.
rule:
  all:
    - kind: while_statement
    - has:
        field: condition
        has:
          all:
            - pattern: $X != $Y
            - any:
                - all:
                    - has:
                        field: left
                        kind: identifier
                    - has:
                        field: right
                        kind: character_literal
                - all:
                    - has:
                        field: left
                        kind: character_literal
                    - has:
                        field: right
                        kind: identifier
    - not:
        regex: \bDONE\b
metadata:
  cwe: 'CWE-835'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/835.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - |-
      class A {
          void f() throws Exception {
              char c = (char) in.read();
              while (c != 'x' && i < n) {
                  c = (char) in.read();
              }
              while (s.charAt(i) != 'x') {
                  i++;
              }
              while (((c != 'x'))) {
                  c = (char) in.read();
              }
          }
      }
    - |-
      class A {
          void f() throws Exception {
              int c;
              while ((c = in.read()) != '\n') {
                  sb.append((char) c);
              }
              do {
                  c = in.read();
              } while (c != 'x');
          }
      }
