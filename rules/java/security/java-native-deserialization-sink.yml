id: java-native-deserialization-sink
language: java
severity: error
message: >-
  Untrusted-capable deserialization sink. Java native deserialization, XMLDecoder,
  XStream and SnakeYAML all instantiate arbitrary classes named in the input, and
  a gadget chain in any library on the classpath turns that into remote code
  execution before the application ever inspects the result. Parse a fixed data
  format instead, or install a strict allowlist filter.
note: >-
  Matches readObject on an ObjectInputStream construction, readObject on an
  XMLDecoder construction, fromXML on an XStream construction, a
  load or loadAll call on a SnakeYAML Yaml constructed with no arguments, and
  the enableDefaultTyping and activateDefaultTyping calls that switch Jackson
  polymorphic typing on. A serialization filter installed on a separate
  statement, or a Yaml built with SafeConstructor, is not seen by this call-site
  matcher, so a filtered stream also matches.
utils:
  no-arg-yaml:
    kind: object_creation_expression
    all:
      - has: {field: type, regex: '^(org\.yaml\.snakeyaml\.)?Yaml$'}
      - has: {field: arguments, regex: '^\(\s*\)$'}
rule:
  kind: method_invocation
  any:
    - all:
        - has: {field: name, regex: '^readObject$'}
        - has:
            field: object
            kind: object_creation_expression
            has: {field: type, regex: '(ObjectInputStream|XMLDecoder)$'}
    - all:
        - has: {field: name, regex: '^fromXML$'}
        - has:
            field: object
            kind: object_creation_expression
            has: {field: type, regex: '(^|\.)XStream$'}
    - all:
        - has: {field: name, regex: '^(load|loadAll)$'}
        - has: {field: object, matches: no-arg-yaml}
    - has: {field: name, regex: '^(enableDefaultTyping|activateDefaultTyping)$'}
