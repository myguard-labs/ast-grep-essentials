# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: java-hardcoded-secretkeyspec
language: java
severity: warning
message: >-
  SecretKeySpec is built from a string literal. Load keys from a key store or
  secret store, or derive them with a key derivation function.
note: >-
  [CWE-321] [OWASP A02:2021] A key embedded in source is exposed to
  everyone with the code or the compiled class. This is a syntactic check:
  new SecretKeySpec("literal".getBytes(...), algorithm) with a plain string
  literal receiver. Keys from variables, fields or method calls are not
  matched, and the algorithm is not resolved.
rule:
  any:
    - pattern: new SecretKeySpec($KEY.getBytes($$$CHARSET), $$$REST)
    - pattern: new javax.crypto.spec.SecretKeySpec($KEY.getBytes($$$CHARSET), $$$REST)
constraints:
  KEY:
    kind: string_literal
