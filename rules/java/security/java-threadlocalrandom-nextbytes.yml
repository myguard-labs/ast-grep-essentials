id: java-threadlocalrandom-nextbytes
language: java
severity: warning
message: A call of the form ThreadLocalRandom.current().nextBytes(...) fills a byte
  array from a non-cryptographic generator.
note: Bytes from ThreadLocalRandom feed security values such as digest cnonces, tokens
  and keys. The same call recurs wherever such values are generated, so the syntax
  is the reusable signal. Reviewers must confirm the value is security-relevant.
rule:
  pattern: class A { void $V0(byte[] $V1) { ThreadLocalRandom.current().nextBytes($V1);
    } }
metadata:
  cwe: 'CWE-338|CWE-330'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/338.html|https://cwe.mitre.org/data/definitions/330.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A04:2025'
  todo_cases:
    - 'Not matched: a method with a modifier (`public static void f(byte[] b)`) or final parameter, a package-qualified `java.util.concurrent.ThreadLocalRandom`, a class other than A, a body with an earlier statement, or a local array filled in the same method; the pattern pins one exact class and method shape.'
