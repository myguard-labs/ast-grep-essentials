id: drivermanager-hardcoded-secret-java
severity: warning
language: java
message: >-
  A secret is hard-coded in the application. Secrets stored in source
  code, such as credentials, identifiers, and other types of sensitive data,
  can be leaked and used by internal or external malicious actors. Use
  environment variables to securely provide credentials and other secrets or
  retrieve them from a secure vault or Hardware Security Module (HSM).
note: >-
  [CWE-798] Use of Hard-coded Credentials.
  [REFERENCES]
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

ast-grep-essentials: true

utils:
  UPSTREAM_UTIL_001:
   kind: method_invocation
   all:
      - has:
          stopBy: neighbor
          kind: identifier
          regex: '^DriverManager$'
      - has:
          stopBy: neighbor
          kind: identifier
          regex: '^getConnection$'
      - has:
          kind: argument_list
          # nthChild: 3
          all:
            - any:
              - has:
                 stopBy: end
                 kind: string_literal
                 nthChild: 3
                 pattern: $I
                 has:
                   stopBy: neighbor
                   kind: string_fragment
              - has:
                  stopBy: end
                  kind: parenthesized_expression
                  has:
                    stopBy: end
                    kind: string_fragment
                    pattern: $I
              - has:
                 nthChild: 3
                 all:
                   - has:
                       stopBy: neighbor
                       kind: string_fragment
                       inside:
                         stopBy: neighbor
                         kind: string_literal
                   - not:
                      has:
                       stopBy: end
                       kind: string_literal
                       not:
                        has:
                         stopBy: neighbor
                         kind: string_fragment
            - not:
               has:
                stopBy: end
                regex: ^-$
            - not:
               has:
                nthChild: 4
      - not:
          has:
            stopBy: end
            kind: ERROR
      - not:
          has:
            stopBy: end
            kind: binary_expression

  MATCH_PATTERN_DriverManagerDataSource:
    kind: object_creation_expression
    all:
      - has:
          stopBy: neighbor
          kind: type_identifier
          regex: '^DriverManagerDataSource$'
      - has:
          kind: argument_list
          # nthChild: 3
          all:
            - any:
              - has:
                 stopBy: neighbor
                 kind: string_literal
                 nthChild: 3
                 pattern: $I
                 has:
                   stopBy: neighbor
                   kind: string_fragment
              - has:
                  stopBy: end
                  kind: parenthesized_expression
                  has:
                    stopBy: end
                    kind: string_fragment
                    pattern: $I
              - has:
                 nthChild: 3
                 all:
                   - has:
                       stopBy: neighbor
                       kind: string_fragment
                       inside:
                         stopBy: neighbor
                         kind: string_literal
                   - not:
                      has:
                       stopBy: end
                       kind: string_literal
                       not:
                        has:
                         stopBy: neighbor
                         kind: string_fragment
            - not:
               has:
                stopBy: end
                regex: ^-$
            - not:
               has:
                nthChild: 4
      - not:
          has:
            stopBy: end
            kind: binary_expression
      - not:
          has:
            stopBy: end
            kind: ERROR

rule:
  any:
    - kind: method_invocation
      matches: UPSTREAM_UTIL_001
    - kind: object_creation_expression
      matches: MATCH_PATTERN_DriverManagerDataSource

constraints:
  I:
    not:
      regex: ^""$
