id: rsa-no-padding-java
language: java
severity: warning
message: RSA transformations using NoPadding omit encryption padding.
note: >-
  This rule matches only syntactic getInstance calls with an explicit
  RSA/None/NoPadding or RSA/ECB/NoPadding string literal. It does not resolve
  the receiver type or evaluate runtime transformations.
rule:
  pattern: '$YST.getInstance($MODE)'
constraints:
  MODE:
    regex: '^"RSA/([Nn][Oo][Nn][Ee]|ECB)/NoPadding"$'
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
  created_at: '2026-09-11'
  source: 'CodeRabbit'
  modified_by: MyGuard
  license: Apache-2.0
ast-grep-essentials: true
