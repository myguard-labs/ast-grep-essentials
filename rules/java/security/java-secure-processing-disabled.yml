id: java-secure-processing-disabled
language: java
severity: warning
message: >-
  FEATURE_SECURE_PROCESSING is set to false, which removes the JAXP limits on
  entity expansion and element depth, so a crafted XML document can exhaust
  memory. Leave secure processing on.
note: >-
  Matches a setFeature call whose first argument names FEATURE_SECURE_PROCESSING
  (bare, XMLConstants-qualified, or the literal feature URI) and whose second
  argument is the literal false. A value of true and a value held in a variable
  are not matched. A parser fed only trusted, size-limited documents is the
  routine dismissal.

  [CWE-776] [A02:2025] [A05:2021]

  [REFERENCES]
      - https://docs.oracle.com/en/java/javase/21/security/java-api-xml-processing-jaxp-security-guide.html
rule:
  kind: method_invocation
  all:
    - has:
        field: name
        regex: '^setFeature$'
    - has:
        field: arguments
        all:
          - has:
              nthChild: 1
              regex: '^\(*\s*(([\w\s.]*\.\s*)?FEATURE_SECURE_PROCESSING|"http://javax\.xml\.XMLConstants/feature/secure-processing")\s*\)*$'
          - has:
              nthChild: 2
              kind: 'false'
