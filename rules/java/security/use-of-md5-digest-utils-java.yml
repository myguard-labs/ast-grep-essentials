id: use-of-md5-digest-utils-java
language: java
severity: warning
message: >-
  Detected a zero-argument DigestUtils.getMd5Digest() call. MD5 is unsuitable
  for uses requiring collision resistance.
note: >-
  This rule matches only the syntax of zero-argument calls written as
  DigestUtils.getMd5Digest(); it does not resolve the receiver type or
  determine how the returned digest is used.
rule:
  pattern: 'DigestUtils.getMd5Digest()'
