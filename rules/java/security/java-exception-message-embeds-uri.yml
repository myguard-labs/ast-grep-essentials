id: java-exception-message-embeds-uri
language: java
severity: warning
message: A throw of a new exception whose message is built by concatenating a variable
  into a string literal.
note: Exception messages get logged and returned. Concatenating an input such as a
  connection URI can leak embedded credentials. Whether the variable holds a secret
  needs dataflow, so the syntax alone is only a candidate.
rule:
  all:
    - kind: throw_statement
    - has:
        kind: object_creation_expression
        stopBy: end
        has:
          kind: binary_expression
          stopBy: end
          all:
            - has:
                kind: string_literal
                stopBy: end
            - has:
                kind: identifier
                stopBy: end

