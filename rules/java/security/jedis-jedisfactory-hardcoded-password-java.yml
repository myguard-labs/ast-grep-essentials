                    - has:
                          stopBy: neighbor
                          kind: variable_declarator
                          all:
                              - has:
                                    stopBy: neighbor
                                    kind: identifier
                                    pattern: $R
                              - has:
                                      stopBy: neighbor
                                      kind: object_creation_expression
            - inside:
                  stopBy: end
                  follows:
                    stopBy: end
                    kind: import_declaration
                    any:
                      - pattern: import redis.clients.jedis.*;
                      - pattern: import redis.clients.jedis;
                      - pattern: import redis.clients.jedis.JedisFactory;
                      - pattern: import redis.clients.jedis.JedisFactory.*;

