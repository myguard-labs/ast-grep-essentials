id: cookie-secure-flag-false-java
language: java
severity: warning
message: >-
  Explicit setSecure(false) disables the secure flag; use setSecure(true) when
  the cookie must be restricted to secure transport.
note: >-
  This rule matches only the syntax of an explicit setSecure(false)
  invocation. It does not establish the receiver's type, cookie sensitivity,
  transport configuration, or later flag changes.
rule:
  pattern:
    context: 'class Example { void configure() { $COOKIE.setSecure(false); } }'
    selector: method_invocation
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
