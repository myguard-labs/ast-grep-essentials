# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: java-log-credential-variable
language: java
severity: warning
message: >-
  A credential-like value is passed to a logging call. A password, secret, token or
  API key written to a log file is readable by everyone with log access and
  survives in backups and log shippers. Log a fixed message or a masked form
  instead, never the credential itself.
note: >-
  Fires on a trace, debug, info, warn, error or fatal call on a receiver named log,
  logger, LOG or LOGGER (also reached through a field chain such as this.log) whose
  argument is, directly or inside a string concatenation, a variable or field
  with a name ending in password, passwd, secret, api_key or apikey, in accesstoken, authtoken, refreshtoken, bearertoken, sessiontoken, jwttoken or idtoken (with or without an underscore), or exactly token, in any letter case, or a call to a getter such as
  getPassword, getSecret, getApiKey or getAccessToken. The name is matched, not
  the value, so a boolean flag such as hasPassword or a masked copy under a
  matching name is a false positive; a call such as mask(token) is not matched,
  and a credential reached through another name is not seen. A fixture or
  masked value is the routine dismissal.

  [CWE-532] [A09:2025] [A09:2021]

  [REFERENCES]
      - https://cwe.mitre.org/data/definitions/532.html
rule:
  kind: method_invocation
  all:
    - has: {field: object, regex: '^(?:\w+\.)*(?:log|logger|LOG|LOGGER)$'}
    - has: {field: name, regex: '^(?:trace|debug|info|warn|error|fatal)$'}
    - has:
        field: arguments
        kind: argument_list
        has:
          any:
            - kind: identifier
              regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
            - kind: field_access
              regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
            - kind: method_invocation
              has: {field: name, regex: '^get(?:Password|Passwd|Secret|ApiKey|AccessToken|AuthToken|RefreshToken|BearerToken|SessionToken|ClientSecret)$'}
            - kind: binary_expression
              has:
                stopBy: {not: {kind: binary_expression}}
                any:
                  - kind: identifier
                    regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
                  - kind: field_access
                    regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
                  - kind: method_invocation
                    has: {field: name, regex: '^get(?:Password|Passwd|Secret|ApiKey|AccessToken|AuthToken|RefreshToken|BearerToken|SessionToken|ClientSecret)$'}
metadata:
  created_at: '2026-11-16'
  source: 'MyGuard'
  modified_by: 'MyGuard'
  license: 'MyGuard Internal Use License 1.0'
  cwe: 'CWE-532'
  owasp: 'A09:2025|A09:2021'
  category: 'security'
  references: 'https://cwe.mitre.org/data/definitions/532.html'
