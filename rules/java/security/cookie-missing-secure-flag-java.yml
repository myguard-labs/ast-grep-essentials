id: cookie-missing-secure-flag-java
language: java
severity: warning
message: >-
  A cookie is added without a preceding setSecure(true) call on the same
  identifier.
note: >-
  This checks only preceding sibling statement syntax and identifier equality;
  it does not establish cookie identity, runtime state, or control flow.
rule:
  pattern: 'response.addCookie($COOKIE);'
  not:
    follows:
      stopBy: end
      pattern: '$COOKIE.setSecure(true);'
constraints:
  COOKIE:
    kind: identifier
