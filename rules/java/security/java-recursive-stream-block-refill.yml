id: java-recursive-stream-block-refill
language: java
severity: warning
message: A method whose body calls itself directly, on a branch taken after a stream
  read, is reported.
note: Recursing once per input record can overflow the stack on long runs of empty
  records. The loop refactor generalises to any record-skipping reader. Reachability
  depends on input data, so this is taint.
rule:
  kind: method_declaration
  all:
    - has:
        field: name
        pattern: $NAME
    - has:
        kind: if_statement
        stopBy: end
        all:
          - has:
              field: condition
              pattern: readBlock($$$)
              stopBy: end
          - has:
              field: consequence
              pattern: $NAME($$$)
              stopBy: end
metadata:
  cwe: 'CWE-674'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/674.html'
  taxonomy_cited_keys: 'cwe'
  todo_cases:
    - 'Not matched: the recursive call in the else branch, as in `void refill() { if (readBlock() > 0) { consume(); } else { refill(); } }`, and a receiver-qualified recursive call such as `this.refill()` in the consequence.'
