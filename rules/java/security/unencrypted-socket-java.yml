id: unencrypted-socket-java
language: java
severity: info
message: >-
  Direct construction of a socket may expose network traffic without transport
  encryption.
note: >-
  This rule identifies constructor syntax only. It does not resolve
  unqualified type names or determine whether traffic is sensitive or
  protected by another layer.
rule:
  pattern: 'new $TYPE($$$ARGS)'
  not:
    has:
      stopBy: end
      kind: ERROR
constraints:
  TYPE:
    regex: '^(Socket|ServerSocket|java\.net\.ServerSocket)$'
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
