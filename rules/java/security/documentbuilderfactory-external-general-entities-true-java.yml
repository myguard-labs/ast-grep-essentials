id: documentbuilderfactory-external-general-entities-true-java
language: java
severity: warning
message: >-
  External general entities are explicitly enabled by this setFeature call.
  Set the boolean argument to false to disable them.
note: >-
  This rule matches only the exact literal feature URI with true or a single
  parenthesized true argument. It does not establish the receiver type,
  resolve variables, or determine runtime XML parser security.
rule:
  pattern: '$RECEIVER.setFeature($FEATURE, $VALUE)'
constraints:
  FEATURE:
    kind: string_literal
    regex: '^"http://xml.org/sax/features/external-general-entities"$'
  VALUE:
    regex: '^(?:true|\(\s*true\s*\))$'
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
  created_at: '2026-09-11'
  source: 'CodeRabbit'
  modified_by: MyGuard
  license: Apache-2.0
ast-grep-essentials: true
