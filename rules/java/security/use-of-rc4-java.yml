id: use-of-rc4-java
language: java
severity: warning
message: 'RC4 cipher selection detected; use a secure cryptographic algorithm.'
note: >-
  This rule detects only getInstance calls on an explicit receiver with one or
  two arguments and the exact string literal "RC4" as the first argument. It
  does not resolve receiver types or evaluate expressions.
rule:
  all:
    - pattern: '$CIPHER.getInstance($$$ARGS)'
    - has:
        kind: argument_list
        all:
          - has:
              kind: string_literal
              nthChild: 1
              regex: '^"RC4"$'
          - not:
              has:
                nthChild: 3
metadata:
