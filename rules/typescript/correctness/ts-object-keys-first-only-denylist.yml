id: ts-object-keys-first-only-denylist
language: typescript
severity: warning
message: >-
  Only the first key from Object.keys(...) is checked against a set. Other
  keys in the same mapping are never checked, so a denied key can get through.
note: >-
  Syntactic only. It matches a const set to Object.keys(...)[0] when a later
  statement in the same block calls .has() with that same name. It does not
  track scope, shadowing, reassignment or aliasing, and it does not check that
  the receiver of .has() is a denylist or allowlist.
rule:
  pattern: 'const $K = Object.keys($O)[0]'
  precedes:
    stopBy: end
    has:
      stopBy: end
      pattern: '$S.has($K)'
