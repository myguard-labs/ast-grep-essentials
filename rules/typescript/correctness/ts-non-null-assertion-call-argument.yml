id: ts-non-null-assertion-call-argument
language: typescript
severity: warning
message: >-
  A non-null assertion on a member expression is passed as a call argument,
  which hides a possibly undefined property at the call site.
note: >-
  This is a syntactic match only. It cannot tell whether the property can
  actually be undefined at runtime or whether a guard elsewhere makes the
  assertion safe, so review each hit.
rule:
  kind: non_null_expression
  has:
    kind: member_expression
  inside:
    kind: arguments
