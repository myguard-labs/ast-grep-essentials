id: ts-logger-fallback-captured-at-creation
language: typescript
severity: warning
message: >-
  This fallback is captured once at creation; the closure will not see later
  changes to the global default.
note: >-
  Syntactic approximation only. Matches a const initialised from a `??
  this.<member>` fallback; it does not verify that the global is reassigned
  later or that the closure is returned from a factory.
rule:
  pattern: 'const $T = $LOGGER ?? this.$GLOBAL;'
metadata:
  todo_cases:
    - 'const t: Logger = logger ?? this.globalLogger; // type annotation'
    - 'const t = logger ?? this.globalLogger // no trailing semicolon'
    - 'let t = logger ?? this.globalLogger; // let declaration'
    - 'const u = logger || this.globalLogger; // || operator'
    - 'const t = logger ?? this.config.globalLogger; // nested member'
  rule_modified_at: '2026-10-17'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-17'
  created_at: '2026-10-17'
