id: ts-let-definite-assignment-assertion
language: typescript
severity: warning
message: >-
  A let binding uses a definite-assignment assertion (`!`), which hides from
  the compiler that the value may be undefined.
note: >-
  This is a syntax-only check for `let name!: Type` with a single declarator.
  It does not check whether the variable is actually assigned before it is
  used. Consider declaring an explicit `| undefined` union and adding a guard.
rule:
  pattern: 'let $NAME!: $TYPE'
