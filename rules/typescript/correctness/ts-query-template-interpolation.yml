id: ts-query-template-interpolation
language: typescript
severity: warning
message: >-
  SQL text passed to .query() is built with a template literal substitution;
  use bound parameters instead.
note: >-
  Syntactic only. Matches a template literal with at least one substitution
  that is the first argument of a .query( member call. It does not check the
  receiver's type, whether interpolated values are trusted, or SQL built
  elsewhere and passed in as a variable.
rule:
  kind: template_string
  nthChild: 1
  has:
    kind: template_substitution
  inside:
    kind: arguments
    inside:
      kind: call_expression
      has:
        field: function
        kind: member_expression
        has:
          field: property
          regex: '^query$'
