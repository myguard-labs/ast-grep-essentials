# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-authz-conditional-missing-deny-branch
language: typescript
severity: warning
message: >-
  authorizeConditional decision is checked only for CONDITIONAL and falls
  through to return undefined without a DENY branch.
note: >-
  Syntactic check only. It flags an if statement testing `.result ===
  AuthorizeResult.CONDITIONAL` that comes after an authorizeConditional call
  and is followed by `return undefined`, with no earlier sibling referencing
  AuthorizeResult.DENY. It does not follow aliases, helpers, or deny handling
  done elsewhere.
rule:
  kind: if_statement
  has:
    field: condition
    regex: '^\(\s*[\w$.]+\.result\s*===\s*AuthorizeResult\.CONDITIONAL\s*\)$'
  precedes:
    stopBy: end
    kind: return_statement
    regex: '^return\s+undefined\s*;?$'
  follows:
    stopBy: end
    has:
      stopBy: end
      pattern: '$S.authorizeConditional($$$)'
  not:
    follows:
      stopBy: end
      regex: 'AuthorizeResult\.DENY'
