id: ts-union-type-duplicate-member
language: typescript
severity: warning
message: Union type repeats the same member type.
note: >-
  Syntactic check only. It matches a type alias whose union has exactly two
  identical type references side by side (X | X). It does not detect repeats
  in other annotation positions, repeats in unions with three or more members,
  or members that are equivalent only through type aliases or resolution.
rule:
  pattern: 'type $NAME = $A | $A'
