id: js-tsdown-renamed-option-typescript
language: typescript
severity: warning
message: >-
  The top-level tsdown options inlineOnly and external were replaced by nested
  deps options. If left in place, they are silently ignored.
note: >-
  This is a syntax-only check. It matches inlineOnly or external keys that sit
  directly in the object literal passed to a call named defineConfig. It does
  not check that defineConfig comes from tsdown, which tsdown version is used,
  or configs built through variables or spreads.
rule:
  kind: pair
  has:
    field: key
    regex: '^[''"]?(inlineOnly|external)[''"]?$'
  inside:
    kind: object
    inside:
      kind: arguments
      inside:
        kind: call_expression
        has:
          field: function
          regex: '^defineConfig$'
