id: ts-existssync-guard-creates-symlink
language: typescript
severity: warning
message: >-
  A negated existsSync check guards symlinkSync on the same path; existsSync
  follows symlinks, so a dangling link reads as absent and the create fails
  with EEXIST. Use an lstat-based check instead.
note: >-
  Syntactic only. It matches an if statement whose condition is exactly
  !existsSync(P) and whose consequence contains symlinkSync(T, P) with the
  same path text P. It does not resolve imports, aliases, or other ways the
  path could be computed.
rule:
  kind: if_statement
  all:
    - has:
        field: condition
        has:
          pattern: '!existsSync($P)'
    - has:
        field: consequence
        stopBy: end
        pattern: 'symlinkSync($T, $P)'
