id: js-default-import-member-default-call-typescript
language: typescript
severity: warning
message: >-
  Calling `.default` on a default-imported binding may call undefined
  (double-default interop mistake).
note: >-
  Syntactic only. This rule flags `X.default(...)` when X comes from a
  top-level `import X from '...'` in the same file. It cannot tell whether the
  module actually provides a nested default export at runtime, so it may
  report correct code.
rule:
  all:
    - pattern: '$X.default($$$ARGS)'
    - inside:
        kind: program
        stopBy: end
        has:
          pattern: 'import $X from $SRC'
