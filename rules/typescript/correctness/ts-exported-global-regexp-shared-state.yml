# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-exported-global-regexp-shared-state
language: typescript
severity: warning
message: >-
  Exported module-level RegExp built with the global flag shares lastIndex
  state across importers.
note: >-
  Syntactic match only on a literal new RegExp(..., 'g'-containing flags)
  inside an exported top-level const declaration. Does not verify that the
  regex is actually used with test or exec, nor resolve imports or runtime
  values.
rule:
  all:
    - pattern: 'export const $NAME = new RegExp($$$ARGS)'
    - has:
        pattern: '''$FLAGS'''
        stopBy: end
        regex: g
metadata:
  known_false_positives: 'export const re = new RegExp(''log'', ''i'') is reported because any string argument containing the letter g satisfies the flags check'
  todo_cases:
    - 'export const re = new RegExp(src, "g"); // double-quoted flags'
    - 'export const re: RegExp = new RegExp(src, ''g''); // type annotation'
    - 'export const re = /x/g; // regex literal with g flag'
    - 'export let re = new RegExp(src, ''g''); // let instead of const'
  rule_modified_at: '2026-10-17'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-17'
  created_at: '2026-10-17'
