id: js-platform-arch-package-name-typescript
language: typescript
severity: warning
message: >-
  Package path is built from process.platform and process.arch with no libc or
  variant segment before the path separator.
note: >-
  Syntactic only. Matches template literals that interpolate process.platform
  and have ${process.arch} immediately followed by '/'. It cannot tell whether
  the package is actually split by libc, or whether the platform is ever Linux
  at runtime.
rule:
  kind: template_string
  all:
    - regex: '\$\{\s*process\.platform\s*\}'
    - regex: '\$\{\s*process\.arch\s*\}/'
