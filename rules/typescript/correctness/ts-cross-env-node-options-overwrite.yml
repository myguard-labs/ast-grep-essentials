id: ts-cross-env-node-options-overwrite
language: typescript
severity: warning
message: >-
  NODE_OPTIONS is set directly in a string literal without referencing the
  existing NODE_OPTIONS value, which can drop options set by the caller.
note: >-
  Single-file syntactic check only. It flags string literals containing
  NODE_OPTIONS= that have no literal reference to the existing variable. It
  does not inspect template literals, runtime environment values, or whether
  the command is actually executed.
rule:
  kind: string
  regex: 'NODE_OPTIONS='
  not:
    regex: '\$\{NODE_OPTIONS\}'
