# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-double-escaped-ansi-literal-typescript
language: typescript
severity: warning
message: >-
  String literal contains an escaped backslash followed by 'e', which yields
  literal backslash-e text rather than an ESC control byte.
note: >-
  Syntactic check only. It matches string literals whose source has an even
  run of backslashes followed by 'e'. It cannot tell whether literal
  backslash-e text was intended, for example when building a regex or shell
  script source.
rule:
  kind: string
  regex: '(^|[^\\])(\\\\)+e'
