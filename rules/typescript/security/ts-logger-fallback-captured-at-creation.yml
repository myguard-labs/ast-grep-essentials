id: ts-logger-fallback-captured-at-creation
language: typescript
severity: warning
message: >-
  This fallback is captured once at creation; the closure will not see later
  changes to the global default.
note: >-
  Syntactic approximation only. Matches a const initialised from a `??
  this.<member>` fallback; it does not verify that the global is reassigned
  later or that the closure is returned from a factory.
rule:
  pattern: 'const $T = $LOGGER ?? this.$GLOBAL;'
