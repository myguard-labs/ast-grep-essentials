# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-regex-digits-match-pop
language: typescript
severity: warning
message: >-
  A global digit regex match is reduced with .pop(), which takes the last
  digit run instead of a known position.
note: >-
  Matches the literal syntax of a global digit regex literal passed to
  .match() followed by .pop(). It does not verify that the matched string is
  the intended value or resolve types or runtime values.
rule:
  pattern: '$X.match(/\d+/g)?.pop()'
