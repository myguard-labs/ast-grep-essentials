id: ts-settings-value-indexed-without-coercion
language: typescript
severity: warning
message: >-
  Value from getSetting(...) is indexed with a computed key without an
  object-type coercion.
note: >-
  Purely syntactic check on a literal getSetting call assigned to a variable
  and then indexed. It cannot tell whether the plugin-supplied value is
  actually a non-object at runtime, and it does not track aliasing,
  reassignment, or type information.
rule:
  pattern: 'const $VAR = getSetting($$$ARGS);'
