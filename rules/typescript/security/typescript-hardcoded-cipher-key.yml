# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: typescript-hardcoded-cipher-key
language: typescript
severity: warning
message: >-
  A string literal is used directly as a cipher key. Load keys from a secret
  store or the environment, or derive them with a key derivation function.
note: >-
  [CWE-321] [OWASP A02:2021] A key embedded in source is exposed to
  everyone with the code or the bundle. This is a syntactic check: a
  createCipheriv or createDecipheriv call whose second argument is a plain
  string or a Buffer.from call on a plain string. Template strings with
  substitutions and values from variables or calls are not matched.
utils:
  plain-literal:
    kind: string
  key-value:
    any:
      - matches: plain-literal
      - kind: call_expression
        all:
          - has:
              field: function
              kind: member_expression
              all:
                - has:
                    field: object
                    regex: '^Buffer$'
                - has:
                    field: property
                    regex: '^from$'
          - has:
              field: arguments
              has:
                nthChild: 1
                matches: plain-literal
rule:
  kind: call_expression
  all:
    - has:
        field: function
        any:
          - kind: identifier
            regex: '^create(Cipheriv|Decipheriv)$'
          - kind: member_expression
            has:
              field: property
              regex: '^create(Cipheriv|Decipheriv)$'
    - has:
        field: arguments
        has:
          nthChild:
            position: 2
            ofRule:
              not:
                kind: comment
          matches: key-value
