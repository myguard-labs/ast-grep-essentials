# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-dataurl-mime-regex-excludes-plus
language: typescript
severity: warning
message: >-
  This data URL regex restricts the image MIME subtype to word characters, so
  subtypes such as svg+xml will not match.
note: >-
  Syntactic match only on a regex literal containing the literal fragment
  image\/\w+;base64. It does not verify that the regex is applied to a data
  URL or inspect runtime values.
rule:
  pattern: '/^data:image\/\w+;base64,/'
