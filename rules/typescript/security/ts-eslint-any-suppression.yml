# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-eslint-any-suppression
language: typescript
severity: warning
message: >-
  An eslint-disable-next-line comment for no-explicit-any precedes a
  declaration annotated with any.
note: >-
  Matches literal adjacent-line syntax only; does not verify that the
  suppressed rule fires, that the annotation is the reported node, or any type
  information.
rule:
  all:
    - pattern: 'const $NAME: any[] = $VALUE'
    - inside:
        kind: program
        stopBy: end
        has:
          kind: comment
          regex: 'eslint-disable-next-line.*no-explicit-any'
          pattern: '// eslint-disable-next-line @typescript-eslint/no-explicit-any'
metadata:
  rule_modified_at: '2026-10-17'
  ast_grep_tested_version: 0.50.0
