id: ts-includes-two-constants-timeout-assertion
language: typescript
severity: warning
message: >-
  This assertion accepts either of two constants; check the one specific
  expected value instead.
note: >-
  Purely syntactic match on an array literal of two identifiers calling
  includes inside an expect(...).toBe(true) chain. It does not resolve
  constant values, types, or runtime behavior.
rule:
  pattern: 'expect($$$ARGS).toBe(true)'
  has:
    pattern: '[$A, $B].includes($C)'
    stopBy: end
