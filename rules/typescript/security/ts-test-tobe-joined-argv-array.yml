# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-test-tobe-joined-argv-array
language: typescript
severity: warning
message: >-
  This expect(...).toBe(...) compares against a joined string; assert the
  exact array elements instead.
note: >-
  Purely syntactic match on a literal expect(...).toBe(x.join(...)) chain; it
  does not verify that the receiver is an array or resolve types or aliases.
rule:
  pattern: 'expect($ACTUAL).toBe($RECV.join($$$ARGS))'
