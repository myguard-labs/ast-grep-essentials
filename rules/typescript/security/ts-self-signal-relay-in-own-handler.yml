id: ts-self-signal-relay-in-own-handler
language: typescript
severity: warning
message: >-
  This signal handler re-sends the same signal to its own process, which can
  re-invoke the handler.
note: >-
  Syntactic match only on a literal process.kill(process.pid, ...) call inside
  a process.on handler. Does not resolve whether the handler is actually
  registered for that signal or whether the call recurses at runtime.
rule:
  pattern: 'process.kill(process.pid, $SIG)'
  inside:
    pattern: 'process.on($SIGNAL, $HANDLER)'
    stopBy: end
