# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-string-replace-literal-first-occurrence
language: typescript
severity: warning
message: >-
  This .replace() call uses a plain string literal as its first argument, so
  only the first occurrence is replaced.
note: >-
  Syntactic check only. Matches a literal string first argument to a
  .replace() member call; it does not verify the receiver is a String, nor
  whether first-occurrence replacement is intended.
rule:
  pattern: '$RECV.replace(''$A'', $B)'
