id: ts-child-process-exec-template
language: typescript
severity: warning
message: >-
  exec called with an interpolated template literal; interpolated values reach
  a shell and may inject commands. Prefer execFile with an argument array.
note: >-
  Syntactic match only on a bare `exec` identifier call whose first argument
  is a template literal with a substitution; it does not verify that exec is
  imported from child_process or whether interpolated values are trusted.
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: identifier
        regex: '^exec$'
    - has:
        field: arguments
        has:
          nthChild: 1
          kind: template_string
          has:
            kind: template_substitution
