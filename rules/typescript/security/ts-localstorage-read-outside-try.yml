id: ts-localstorage-read-outside-try
language: typescript
severity: warning
message: >-
  window.localStorage.getItem is called outside a try statement; storage
  access can throw when storage is disabled.
note: >-
  Purely syntactic check for a literal window.localStorage getItem call with
  no enclosing try statement in the file. It does not resolve types, aliases,
  or runtime storage availability, and it does not check whether the enclosing
  function guards the call by other means.
rule:
  all:
    - pattern: 'window.localStorage?.getItem($$$ARGS)'
    - not:
        inside:
          kind: try_statement
          stopBy: end
