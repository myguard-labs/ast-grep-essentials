# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-gh-api-list-missing-paginate
language: typescript
severity: warning
message: >-
  This gh api call requests a per_page list page without --paginate, so only
  the first page may be returned.
note: >-
  Syntactic approximation only. Matches an array literal containing "api" and
  a template or string with per_page and no --paginate element; it does not
  verify the endpoint is a list endpoint or resolve the gh function.
rule:
  all:
    - pattern: 'gh([$$$ARGS])'
    - has:
        pattern: '"api"'
        stopBy: end
    - has:
        regex: 'per_page='
        stopBy: end
    - not:
        has:
          regex: '--paginate'
          stopBy: end
