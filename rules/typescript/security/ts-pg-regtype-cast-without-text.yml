id: ts-pg-regtype-cast-without-text
language: typescript
severity: warning
message: >-
  SQL string casts an expression to regtype without a following ::text cast;
  the driver returns a non-text value.
note: >-
  Syntactic check on string literal text only. It matches a literal regtype
  cast in the same string and does not resolve types, dataflow, or whether the
  query runs against PostgreSQL.
rule:
  kind: string
  has:
    kind: string_fragment
    regex: '::"regtype"'
  not:
    has:
      kind: string_fragment
      regex: '::"regtype"::text'
