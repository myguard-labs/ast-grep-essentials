# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-playwright-url-substring-query-assert
language: typescript
severity: warning
message: >-
  Asserting a key=value query fragment with toContain on page.url() checks raw
  URL text; parse the URL and assert the query parameter instead.
note: >-
  Syntactic match only. It flags a literal
  expect(...url()).toContain('key=value') call whose string argument contains
  an equals sign. It does not resolve the receiver type, confirm the value is
  a query fragment, or prove a substring false positive at runtime.
rule:
  pattern: 'expect($RECV.url()).toContain($ARG)'
