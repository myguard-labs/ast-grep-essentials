id: ts-layout-effect-mount-without-cleanup
language: typescript
severity: warning
message: >-
  A .mount() call inside a useLayoutEffect if-block is not returned, so its
  unmount cleanup is dropped.
note: >-
  Purely syntactic. Matches a literal useLayoutEffect callback containing an
  if-block with a bare expression-statement .mount() call; does not verify
  that mount returns an unmount function or resolve receiver types.
rule:
  pattern: |
    useLayoutEffect(() => {
      if ($COND) {
        $$$BEFORE
        $RECV.mount($$$ARGS)
        $$$AFTER
      }
    }, $$$DEPS)
