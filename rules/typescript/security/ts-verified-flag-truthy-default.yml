id: ts-verified-flag-truthy-default
language: typescript
severity: warning
message: A member expression reading .verified combined with a literal true through
  || is reported, because an explicit false is replaced with true.
note: Explicit negative verification must be honoured during profile normalisation.
  A literal-true fallback on the flag silently overrides a verified:false value. The
  inference is from the advisory summary and the negative-verification test, not a
  full diff read.
rule:
  pattern: const $V0 = email.verified || true;
