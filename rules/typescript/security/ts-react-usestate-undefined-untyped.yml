id: ts-react-usestate-undefined-untyped
language: typescript
severity: warning
message: >-
  useState(undefined) without a type argument infers the state type as
  undefined; add an explicit generic.
note: >-
  Syntactic only. Matches a direct useState call with the single literal
  undefined argument and no type arguments; does not resolve imports, aliases,
  or whether useState is React's hook.
rule:
  pattern: 'useState(undefined)'
