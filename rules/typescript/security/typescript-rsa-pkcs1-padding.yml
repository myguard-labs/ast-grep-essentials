# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: typescript-rsa-pkcs1-padding
language: typescript
severity: warning
message: >-
  RSA publicEncrypt or privateDecrypt is called with RSA_PKCS1_PADDING. Use
  OAEP padding instead.
note: >-
  [CWE-780] [OWASP A02:2021] PKCS#1 v1.5 encryption padding is
  vulnerable to Bleichenbacher padding-oracle attacks. This is a syntactic
  check: a publicEncrypt or privateDecrypt call, as a member or a plain
  identifier, whose options object sets padding to RSA_PKCS1_PADDING. It does
  not resolve imports or values held in variables. The default padding
  (OAEP) is not matched.
rule:
  kind: call_expression
  all:
    - has:
        field: function
        any:
          - kind: identifier
            regex: '^(publicEncrypt|privateDecrypt)$'
          - kind: member_expression
            has:
              field: property
              regex: '^(publicEncrypt|privateDecrypt)$'
    - has:
        field: arguments
        has:
          kind: object
          has:
            kind: pair
            all:
              - has:
                  field: key
                  regex: "^(padding|\"padding\"|'padding')$"
              - has:
                  field: value
                  any:
                    - kind: identifier
                      regex: '^RSA_PKCS1_PADDING$'
                    - kind: member_expression
                      has:
                        field: property
                        regex: '^RSA_PKCS1_PADDING$'
