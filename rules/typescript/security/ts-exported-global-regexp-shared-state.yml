id: ts-exported-global-regexp-shared-state
language: typescript
severity: warning
message: >-
  Exported module-level RegExp built with the global flag shares lastIndex
  state across importers.
note: >-
  Syntactic match only on a literal new RegExp(..., 'g'-containing flags)
  inside an exported top-level const declaration. Does not verify that the
  regex is actually used with test or exec, nor resolve imports or runtime
  values.
rule:
  all:
    - pattern: 'export const $NAME = new RegExp($$$ARGS)'
    - has:
        pattern: '''$FLAGS'''
        stopBy: end
        regex: g
