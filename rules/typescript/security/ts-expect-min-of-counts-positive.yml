id: ts-expect-min-of-counts-positive
language: typescript
severity: warning
message: >-
  This expect asserts positivity of Math.min over several values, so one value
  can satisfy the check while another is zero. Assert each value separately.
note: >-
  Matches the literal syntax expect(Math.min(...)).toBeGreaterThan(0) only. It
  does not resolve types, imports, aliases, or whether the arguments are
  counts.
rule:
  pattern: 'expect(Math.min($$$ARGS)).toBeGreaterThan(0)'
