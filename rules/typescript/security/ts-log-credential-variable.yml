# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-log-credential-variable
language: typescript
severity: warning
message: >-
  A credential-like value is passed to a logging call. A password, secret, token or
  API key written to a log file is readable by everyone with log access and
  survives in backups and log shippers. Log a fixed message or a masked form
  instead, never the credential itself.
note: >-
  Fires on a log, debug, info, warn, error or trace call on console, logger, log or
  winston (also reached through a property chain such as this.logger) whose
  argument is, directly or inside a template-literal substitution or a
  concatenation, a variable or property with a name ending in password, passwd, secret, api_key or apikey, in accesstoken, authtoken, refreshtoken, bearertoken, sessiontoken, jwttoken or idtoken (with or without an underscore), or exactly token, in any letter case.
  The name is matched, not the value, so a boolean flag such as hasPassword or
  a masked copy under a matching name is a false positive; a call such as
  mask(token) is not matched, and a credential read through an index
  or another name is not seen. A fixture or masked value is the routine
  dismissal.

  [CWE-532] [A09:2025] [A09:2021]

  [REFERENCES]
      - https://cwe.mitre.org/data/definitions/532.html
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: member_expression
        regex: '^(?:\w+\.)*(?:console|logger|log|winston)\.(?:log|debug|info|warn|error|trace)$'
    - has:
        field: arguments
        kind: arguments
        has:
          any:
            - kind: identifier
              regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
            - kind: member_expression
              regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
            - kind: template_string
              has:
                kind: template_substitution
                has:
                  any:
                    - kind: identifier
                      regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
                    - kind: member_expression
                      regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
            - kind: binary_expression
              has:
                stopBy: {not: {kind: binary_expression}}
                any:
                  - kind: identifier
                    regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
                  - kind: member_expression
                    regex: '(?i)^(?:\w+\.)*(?:\w*(?:password|passwd|secret|api_?key|(?:access|auth|refresh|bearer|session|jwt|id)_?token)|token)$'
metadata:
  created_at: '2026-11-16'
  source: 'MyGuard'
  modified_by: 'MyGuard'
  license: 'MyGuard Internal Use License 1.0'
  cwe: 'CWE-532'
  owasp: 'A09:2025|A09:2021'
  category: 'security'
  references: 'https://cwe.mitre.org/data/definitions/532.html'
