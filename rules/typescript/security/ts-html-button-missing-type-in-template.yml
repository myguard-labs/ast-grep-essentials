id: ts-html-button-missing-type-in-template
language: typescript
severity: warning
message: >-
  Button markup in a template literal has no explicit type attribute; add
  type="button" or type="submit" so it does not default to submit inside a
  form.
note: >-
  Purely syntactic match on a literal button start tag inside a template
  string. It does not check whether the template is rendered inside a form,
  whether the tag is a real HTML element at runtime, or whether a type is set
  dynamically.
rule:
  all:
    - kind: template_string
    - has:
        regex: '<button[\s>]'
        stopBy: end
    - not:
        has:
          regex: 'type\s*='
          stopBy: end
