id: ts-object-entries-transformed-key-assignment
language: typescript
severity: warning
message: >-
  Assigning to an object with a transformed key inside a for-of over
  Object.entries can silently overwrite entries when distinct keys map to the
  same output key.
note: >-
  Syntactic match only. It checks for a for-of over Object.entries(...) whose
  body assigns to an index with a call-expression key. It does not verify that
  the transform is lossy, that keys collide, or that the target object is the
  same one being iterated.
rule:
  pattern: |
    for (const [$K, $V] of Object.entries($OBJ)) {
      $OUT[$FN($K)] = $V;
    }
