id: ts-upload-abort-on-limit-false
language: typescript
severity: warning
message: >-
  Object literal sets abortOnLimit to false, so oversized uploads may be
  truncated instead of rejected.
note: >-
  Matches only the literal property pair abortOnLimit: false in a single file.
  It does not verify that the object is passed to an upload parser or that the
  parser honors the option.
rule:
  pattern: '{ abortOnLimit: false, $$$REST }'
