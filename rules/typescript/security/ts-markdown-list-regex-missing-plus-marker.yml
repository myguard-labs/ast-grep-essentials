id: ts-markdown-list-regex-missing-plus-marker
language: typescript
severity: warning
message: >-
  This regex matches Markdown unordered-list markers but omits '+', so lists
  using '+' bullets are missed.
note: >-
  Purely syntactic match on a regex literal containing the character class
  [-*] with no '+'. It does not check whether the regex is used for Markdown
  parsing or whether the surrounding code handles other list forms.
rule:
  pattern: '/^(\s*(?:[-*]\s|\d+[.)]\s))/'
