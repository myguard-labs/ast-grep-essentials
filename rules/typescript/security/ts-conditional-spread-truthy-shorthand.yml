# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-conditional-spread-truthy-shorthand
language: typescript
severity: warning
message: >-
  Conditional spread gated by truthiness of a shorthand property may drop
  valid falsy values such as 0 or empty string. Compare explicitly against
  undefined.
note: >-
  Syntactic match only. It flags a ternary whose condition is a bare
  identifier and whose true branch is an object literal containing that same
  identifier as a shorthand property, spread into an object. It does not check
  value types, so falsy values may be valid or intended in some cases.
rule:
  pattern: '{ ...($VAR ? { $VAR } : {}) }'
