id: ts-weak-mock-calls-stringify-assertion
language: typescript
severity: warning
message: >-
  Asserting on JSON.stringify of mock.calls with toContain is a weak check;
  assert the exact call arguments instead.
note: >-
  Matches the literal syntax
  expect(JSON.stringify(<x>.mock.calls)).toContain(...) only. It does not
  verify the mock's identity, the call routing, or argument positions, and it
  does not resolve types or aliases.
rule:
  pattern: 'expect(JSON.stringify($MOCK.mock.calls)).toContain($$$ARGS)'
