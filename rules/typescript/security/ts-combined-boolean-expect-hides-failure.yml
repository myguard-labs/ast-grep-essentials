id: ts-combined-boolean-expect-hides-failure
language: typescript
severity: warning
message: >-
  This expect call asserts a combined && or || condition to be true, so a
  failure does not show which comparison failed. Split it into separate expect
  calls.
note: >-
  Syntactic check only. It matches a literal expect(...) call whose first
  argument is a binary && or || expression and whose matcher chain ends in
  toBe(true). It does not resolve types, runtime values, or whether the
  assertion is intended.
rule:
  pattern: 'expect($A && $B, $$$ARGS).toBe(true)'
