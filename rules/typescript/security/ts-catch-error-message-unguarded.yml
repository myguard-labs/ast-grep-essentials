id: ts-catch-error-message-unguarded
language: typescript
severity: warning
message: >-
  Catch parameter .message is read without an instanceof Error guard in the
  same catch block.
note: >-
  Purely syntactic check for a catch parameter's .message read inside a catch
  block with no instanceof guard in that block. It does not resolve types,
  confirm the thrown value is an Error, or track aliases, so it may flag safe
  code and miss unsafe reads.
rule:
  all:
    - pattern: 'try { $$$BODY } catch ($E) { $$$CATCHBODY }'
    - has:
        pattern: '$E.message'
        stopBy: end
    - not:
        has:
          pattern: '$E instanceof Error'
          stopBy: end
