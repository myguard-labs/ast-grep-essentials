# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-payload-form-read-any-user
language: typescript
severity: warning
message: >-
  Access predicate only checks that req.user is truthy, so any authenticated
  account is allowed.
note: >-
  Syntactic match only for an arrow function that destructures req.user and
  returns !!user. It cannot tell whether any-user access is intended, whether
  this is a read access predicate, or whether other access controls apply
  elsewhere.
rule:
  pattern: '({ req: { user } }) => !!user'
metadata:
  rule_modified_at: '2026-10-09'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-09'
  created_at: '2026-10-09'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-862|CWE-285'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/862.html|https://cwe.mitre.org/data/definitions/285.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A01:2025'
  todo_cases:
    - 'const c = { read: ({ req: { user } }) => Boolean(user) }'
    - 'const c = { read: ({ req: { user } }) => { return !!user } }'
    - 'const c = { read: async ({ req: { user } }) => !!user }'
