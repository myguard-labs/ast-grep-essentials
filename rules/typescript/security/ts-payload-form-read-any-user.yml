id: ts-payload-form-read-any-user
language: typescript
severity: warning
message: >-
  Access predicate only checks that req.user is truthy, so any authenticated
  account is allowed.
note: >-
  Syntactic match only for an arrow function that destructures req.user and
  returns !!user. It cannot tell whether any-user access is intended, whether
  this is a read access predicate, or whether other access controls apply
  elsewhere.
rule:
  pattern: '({ req: { user } }) => !!user'
