id: ts-scaffolder-permission-decision-discarded
language: typescript
severity: warning
message: An authorizeConditional call is awaited as a bare expression statement, so
  its returned decision is never checked.
note: A computed but dropped permission decision leaves task listing unauthorized.
  The test pair shows a deny decision was ignored. The shape applies to any authorize
  call whose result is discarded.
rule:
  pattern: await permissions.authorizeConditional($V0, $V1);
