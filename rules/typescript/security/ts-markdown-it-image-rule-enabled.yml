id: ts-markdown-it-image-rule-enabled
language: typescript
severity: warning
message: >-
  This MarkdownIt instance is constructed without disabling the image rule;
  review whether untrusted markdown rendered from it can produce remote image
  loads.
note: >-
  Matches only the literal syntax of a new MarkdownIt(...) call with no
  chained .disable('image') directly after it. It does not resolve imports,
  aliases, later instance configuration, or whether rendered HTML reaches the
  DOM.
rule:
  pattern: 'new MarkdownIt($$$ARGS)'
  not:
    inside:
      pattern: 'new MarkdownIt($$$ARGS).disable(''image'')'
      stopBy: end
