# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-namespace-import-process-module
language: typescript
severity: warning
message: 'Namespace import of the Node process module; review this binding.'
note: >-
  Matches the literal namespace import syntax from the module specifier
  "process" only; it does not resolve module identity, aliasing, or runtime
  behavior.
rule:
  pattern: 'import * as $NS from "process"'
