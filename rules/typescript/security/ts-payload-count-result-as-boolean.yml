id: ts-payload-count-result-as-boolean
language: typescript
severity: warning
message: >-
  Awaited count() result is used directly as a conditional test; count results
  are objects and are always truthy.
note: >-
  Syntactic only. Matches a ternary whose test is the exact identifier bound
  by a preceding sibling-scope `const X = await obj.count(...)` declaration;
  it does not verify the receiver type, the actual return shape of count(),
  aliasing, or reassignment.
rule:
  pattern: '$X ? $A : $B'
  inside:
    stopBy: end
    follows:
      stopBy: end
      pattern: 'const $X = await $O.count($$$)'
