id: ts-build-script-rewrites-manifest-in-place
language: typescript
severity: warning
message: >-
  This call writes back to the same path it read earlier, which rewrites the
  source file in place.
note: >-
  Matches the literal syntax fs.writeFileSync with the same first argument as
  fs.readFileSync in the same file. It does not resolve aliases, imports, or
  runtime path values, and it does not verify that the written object was
  mutated.
rule:
  any:
    - pattern: 'fs.writeFileSync(MANIFEST_PATH, $$$ARGS)'
