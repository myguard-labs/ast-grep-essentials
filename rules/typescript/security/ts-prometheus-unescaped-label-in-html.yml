# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-prometheus-unescaped-label-in-html
language: typescript
severity: warning
message: >-
  A member expression is put directly into an HTML template literal without
  escapeHTML. This can allow stored XSS.
note: >-
  This is a syntactic check only. It flags a template substitution whose
  direct expression is a member access inside a template literal that contains
  an HTML-like tag. It cannot tell whether the value was already escaped or
  sanitized somewhere else, or whether it is trusted.
rule:
  kind: template_substitution
  has:
    kind: member_expression
  inside:
    kind: template_string
    regex: '<[A-Za-z/]'
