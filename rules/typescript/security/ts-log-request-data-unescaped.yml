# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: ts-log-request-data-unescaped
language: typescript
severity: warning
message: >-
  Request data is passed to a logging call without escaping. A caller who sends
  carriage-return or line-feed characters in the value can forge extra log
  lines and hide their own activity. Escape or reject CR and LF in the value,
  or log it through JSON.stringify or a structured logger field.
note: >-
  Fires on a log, debug, info, warn, error or trace call on console, logger,
  log or winston whose arguments, including template-literal substitutions,
  read req.query, req.body, req.params, req.headers or req.cookies (also under
  the name request). The finding is suppressed only when the request-data value
  itself is wrapped in a call to replaceAll whose first argument (a string or
  regular expression) names CR, LF or whitespace (\r, \n, \s, \x0a, \x0d), or
  to replace whose first argument is a regular expression literal with the g
  flag that names them (replace with a string or a non-global regular expression
  changes only the first match and is still reported), the global escape, encodeURIComponent, JSON.stringify,
  parseInt, Number or Boolean; a sanitizer on another argument does not
  suppress it. A chained replace of only \r is accepted as a sanitizer on purpose (precision over recall). A replace that targets other characters, String(...) and HTML
  escapers such as _.escape or escapeHtml do not strip CR or LF and are still
  reported. A value copied into a variable
  first, or a logger held under another name, is not seen. A log sink that
  already escapes line breaks is the routine dismissal.

  [CWE-117] [A09:2025] [A09:2021]

  [REFERENCES]
      - https://owasp.org/www-community/attacks/Log_Injection
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: member_expression
        regex: '^(console|logger|log|winston)\.(log|debug|info|warn|error|trace)$'
    - has:
        field: arguments
        kind: arguments
        has:
          stopBy: end
          kind: member_expression
          regex: '^(req|request)\.(query|body|params|headers|cookies)$'
          not:
            inside:
              stopBy:
                kind: call_expression
                has:
                  field: function
                  kind: member_expression
                  regex: '^(console|logger|log|winston)\.(log|debug|info|warn|error|trace)$'
              kind: call_expression
              any:
                - has:
                    field: function
                    regex: '(^|\.)(encodeURIComponent|stringify|parseInt|Number|Boolean)$|^escape$'
                - all:
                    - has:
                        field: function
                        regex: '\.replaceAll$'
                    - has:
                        field: arguments
                        kind: arguments
                        has:
                          nthChild: 1
                          regex: '\\[rns]|\\x0[adAD]|\\u000[adAD]'
                - all:
                    - has:
                        field: function
                        regex: '\.replace$'
                    - has:
                        field: arguments
                        kind: arguments
                        has:
                          nthChild: 1
                          kind: regex
                          regex: '^/.*(\\[rns]|\\x0[adAD]|\\u000[adAD]).*/[a-fh-z]*g[a-z]*$'
metadata:
  created_at: '2026-11-16'
  source: 'MyGuard'
  modified_by: 'MyGuard'
  license: 'MyGuard Internal Use License 1.0'
  cwe: 'CWE-117'
  owasp: 'A09:2025|A09:2021'
  category: 'security'
  references: 'https://owasp.org/www-community/attacks/Log_Injection'
