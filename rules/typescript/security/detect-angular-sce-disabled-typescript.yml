id: detect-angular-sce-disabled-typescript
language: typescript
severity: warning
message: >-
  Calling the SCE provider's enabled method with literal false can disable
  AngularJS Strict Contextual Escaping.
note: >-
  This rule matches only direct calls on the identifier named $sceProvider
  with method enabled and exactly one literal-false argument. It does not
  establish the receiver's identity or runtime security impact.
rule:
  pattern: '$sceProvider.enabled(false)'
