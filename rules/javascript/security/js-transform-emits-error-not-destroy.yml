id: js-transform-emits-error-not-destroy
language: javascript
severity: warning
message: >-
  A _transform method calls this.emit('error', ...) directly instead of
  this.destroy(...).
note: >-
  Syntactic match only. Any X.prototype._transform function whose sole
  statement is this.emit('error', ...) with one argument is reported. It does
  not check that X is a Transform stream or resolve types, aliases, or
  inheritance.
rule:
  pattern: |
    $CLS.prototype._transform = function ($$$ARGS) {
      this.emit('error', $ERR)
    }
metadata:
  rule_modified_at: '2026-10-13'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-13'
