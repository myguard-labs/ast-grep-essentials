id: js-jquery-unload-event-method
language: javascript
severity: warning
message: >-
  The jQuery .unload() event shorthand was removed in jQuery 3; use
  .on('unload', ...) or another supported event API instead.
note: >-
  Matches the literal syntax of a direct .unload(...) call with any arguments
  on any receiver. It does not verify that the receiver is a jQuery object or
  that the code runs against jQuery 3 or later.
rule:
  pattern: '$OBJ.unload($$$ARGS)'
