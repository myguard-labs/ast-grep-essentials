id: js-keyup-direct-search-handler-no-debounce
language: javascript
severity: warning
message: >-
  Direct keyup binding to a search handler fires on every keystroke; consider
  debouncing.
note: >-
  Syntactic match only on a literal receiver ending in .search and a
  member-expression handler; it does not verify the handler performs a search,
  and it cannot see debounce wrappers applied elsewhere.
rule:
  pattern: '$RECV.search.keyup( $HANDLER.$NAME )'
