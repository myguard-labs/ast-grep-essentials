# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-replacechild-parentnode-wrong-receiver
language: javascript
severity: warning
message: >-
  replaceChild receives node.parentNode as the old child but the receiver is
  not that node's parentNode.
note: >-
  Syntactic check only. It matches a literal receiver chain that differs from
  the old child's parentNode expression; it does not resolve runtime DOM
  structure, aliasing, or types.
rule:
  pattern: '$RECV.replaceChild($NEW, $E.parentNode)'
  not:
    pattern: '$E.parentNode.parentNode.replaceChild($NEW, $E.parentNode)'
