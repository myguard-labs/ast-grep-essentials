id: js-jquery-attr-checked-uncheck
language: javascript
severity: warning
message: >-
  Review this jQuery .attr('checked', ...) call; prefer .prop('checked', ...)
  to change checked state.
note: >-
  Syntactic match only on a literal .attr('checked', ...) call shape; it does
  not verify the jQuery version, the element type, or whether the value is
  used to change checked state.
rule:
  pattern: '$RECV.attr(''checked'', $VAL)'
