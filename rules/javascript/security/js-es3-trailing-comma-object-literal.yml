id: js-es3-trailing-comma-object-literal
language: javascript
severity: warning
message: >-
  Object literal has a trailing comma before the closing brace, which breaks
  ES3 engines.
note: >-
  Single-file syntactic check for a trailing comma after the last property of
  an object literal; it does not resolve runtime targets or confirm that ES3
  support is required.
rule:
  kind: object
  pattern: '$$$BEFORE, $LAST,}'
