# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-jquery-attr-disabled-boolean
language: javascript
severity: warning
message: 'Use .prop() instead of .attr() when setting the boolean ''disabled'' property.'
note: >-
  Matches the literal call shape .attr('disabled', <non-string expression>) on
  any receiver without checking that the receiver is a jQuery object or that
  the value is boolean at runtime.
rule:
  all:
    - pattern: '$OBJ.attr($KEY, $VAL)'
    - kind: call_expression
    - has:
        field: arguments
        regex: '^\(\s*[''"]disabled[''"]\s*,'
    - not:
        has:
          field: arguments
          regex: '^\(\s*[''"]disabled[''"]\s*,\s*[''"]'
metadata:
  rule_modified_at: '2026-10-16'
