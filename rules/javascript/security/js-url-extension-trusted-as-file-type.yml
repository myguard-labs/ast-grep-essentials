id: js-url-extension-trusted-as-file-type
language: javascript
severity: warning
message: "A path.extname call applied to a new URL(...).pathname member expression."
note: "An extension taken from a URL path is attacker-chosen and can drive the stored Content-Type. It is a defect only when the value reaches storage or headers, so it needs dataflow."
rule:
  pattern: 'path.extname(new URL($$$ARGS).pathname)'
