id: js-regexp-constructor-unescaped-concat
language: javascript
severity: warning
message: >-
  RegExp constructed from string concatenation with an unescaped dynamic
  operand; escape the value before building the pattern.
note: >-
  Syntactic only. Flags new RegExp(...) whose arguments contain a +
  concatenation with a bare identifier operand; it cannot tell whether the
  identifier was already escaped, is constant, or is trusted.
rule:
  pattern: 'new RegExp($$$ARGS)'
  has:
    field: arguments
    has:
      stopBy: end
      pattern: '$L + $R'
      has:
        kind: identifier
