# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-dom-firstchild-deref-unchecked
language: javascript
severity: warning
message: >-
  This logical-and guard reads firstChild.textContent without checking that
  firstChild is non-null.
note: >-
  Matches the literal syntax of an && guard on a identifier followed by a
  direct .firstChild.textContent read. It does not resolve types, DOM nodes,
  or runtime values, and cannot see guards elsewhere in the file.
rule:
  pattern: '$NODE && $NODE.firstChild.textContent'
