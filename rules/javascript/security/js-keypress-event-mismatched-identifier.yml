id: js-keypress-event-mismatched-identifier
language: javascript
severity: warning
message: >-
  The keypress type check and the keyCode check read different identifiers;
  verify the key check uses the same event object.
note: >-
  Syntactic only. Matches a literal && expression whose left side compares a
  literal 'keypress' with <a>.type and whose right side compares the keyCode
  of a different identifier; does not resolve scope, aliases, or runtime event
  objects.
rule:
  pattern: '''keypress'' == $A.type && $_ != $B.keyCode'
  not:
    pattern: '''keypress'' == $A.type && $_ != $A.keyCode'
