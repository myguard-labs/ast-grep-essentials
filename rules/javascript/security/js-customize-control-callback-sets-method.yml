id: js-customize-control-callback-sets-method
language: javascript
severity: warning
message: >-
  A callback passed to api.control(...) assigns a .method property to its
  parameter; method is a setting property, not a control property, so this
  does not configure the setting.
note: >-
  Single-file syntactic match on the literal receiver api.control(...) with a
  function expression callback whose body assigns to the first parameter's
  .method property. Does not resolve types, imports, or aliases of api.
rule:
  pattern: 'api.control($KEY, function ($P) { $P.method = $VAL; })'
