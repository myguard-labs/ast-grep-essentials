id: js-backbone-route-param-free-text
language: javascript
severity: warning
message: >-
  Backbone route key ends in a single-segment :param; free-text values
  containing '/' will not match.
note: >-
  Syntactic only. Matches a literal object pair whose string key ends in a
  :name segment; it does not verify the object is a Backbone routes hash or
  the handler's runtime behavior.
rule:
  kind: pair
  all:
    - has:
        kind: string
        regex: ':[A-Za-z_][A-Za-z0-9_]*[''"]?$'
    - not:
        has:
          kind: string
          regex: '\*'
