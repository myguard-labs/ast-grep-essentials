id: js-jquery-unquoted-attribute-selector-concat
language: javascript
severity: warning
message: >-
  Attribute selector value is built by concatenation without quotes; values
  containing spaces, brackets or quotes can break the selector.
note: >-
  Syntactic match only. It flags a literal find call whose string argument is
  a concatenation with an unquoted attribute selector value; it does not
  resolve the receiver, the jQuery identity, or whether the concatenated value
  is sanitized.
rule:
  pattern: '$OBJ.find(''option[value='' + $X + '']'')'
