# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-keycode-plus-minus-missing-numpad
language: javascript
severity: warning
message: >-
  This keyCode check for the plus or minus key does not include the numpad
  keyCode (107 or 109).
note: >-
  Matches literal keyCode comparisons syntactically; it does not resolve the
  event type, runtime key values, or whether a numpad code is handled
  elsewhere.
rule:
  pattern: '$E.keyCode == 61 || $E.keyCode == 187'
