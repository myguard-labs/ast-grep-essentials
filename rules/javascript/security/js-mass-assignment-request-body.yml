# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-mass-assignment-request-body
language: javascript
severity: warning
message: >-
  The whole request body is passed to a model create call or copied onto a
  document with Object.assign, so a client can set any field, including roles
  or ownership. Pick the allowed fields explicitly.
note: >-
  Matches Model.create(req.body) or Model.create(request.body) as the first
  argument, and Object.assign(target, req.body) or request.body as a source
  argument. Destructured fields, a picked or validated copy, and other call
  names are not matched. Object.create(req.body) builds a prototype and is
  excluded. Koa ctx.request.body and TypeScript variants are not covered. A body already validated by a strict schema upstream is
  the routine dismissal.

  [CWE-915] [A08:2025] [A08:2021]

  [REFERENCES]
      - https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html
utils:
  request-body:
    kind: member_expression
    regex: '^(req|request)\.body$'
rule:
  kind: call_expression
  any:
    - all:
        - has:
            field: function
            kind: member_expression
            has:
              field: property
              regex: '^create$'
        - not:
            has:
              field: function
              kind: member_expression
              regex: '^Object\.create$'
        - has:
            field: arguments
            has:
              nthChild: 1
              matches: request-body
    - all:
        - has:
            field: function
            kind: member_expression
            regex: '^Object\.assign$'
        - has:
            field: arguments
            has:
              all:
                - matches: request-body
                - not:
                    nthChild: 1
metadata:
  created_at: '2026-11-16'
  source: 'MyGuard'
  modified_by: 'MyGuard'
  license: 'MyGuard Internal Use License 1.0'
  cwe: 'CWE-915'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/915.html'
  owasp: 'A08:2025|A08:2021'
  category: 'security'
  references: 'https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html'
