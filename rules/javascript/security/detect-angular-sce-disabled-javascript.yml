id: detect-angular-sce-disabled-javascript
language: javascript
severity: warning
message: >-
  Disabling AngularJS Strict Contextual Escaping can increase exposure to XSS
  vulnerabilities.
note: >-
  Matches only calls on the syntactically named receiver $sceProvider using
  enabled or the literal computed property "enabled" with the literal argument
  false; does not establish receiver identity or runtime behavior.
rule:
  pattern: '$CALLEE(false)'
constraints:
  CALLEE:
    regex: '^\$sceProvider(?:\s*\.\s*enabled|\s*\[\s*["'']enabled["'']\s*\])$'
metadata:
  rule_modified_at: '2026-10-06'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-06'
  created_at: '2026-09-11'
  source: 'CodeRabbit'
  modified_by: MyGuard
  license: Apache-2.0
ast-grep-essentials: true
