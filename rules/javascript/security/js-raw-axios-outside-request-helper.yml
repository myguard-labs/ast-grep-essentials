id: js-raw-axios-outside-request-helper
language: javascript
severity: warning
message: >-
  Raw axios call with an inline url outside the shared request helper; route
  it through the helper method instead.
note: >-
  Syntactic check only. Matches a direct axios(...) call with an inline url
  property inside a methods entry whose name is not _makeRequest; it does not
  resolve imports, aliases, or runtime values.
rule:
  all:
    - pattern: 'axios($$$ARGS)'
    - inside:
        kind: method_definition
        stopBy: end
        all:
          - not:
              has:
                field: name
                regex: '^_makeRequest$'
    - has:
        pattern: '{ url: $URL }'
        stopBy: end
