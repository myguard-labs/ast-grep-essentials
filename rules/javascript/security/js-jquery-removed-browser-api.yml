id: js-jquery-removed-browser-api
language: javascript
severity: warning
message: >-
  Read of $.browser, a jQuery sniffing property removed in jQuery 1.9, which
  is undefined on modern jQuery.
note: >-
  Matches the literal member read $.browser.<prop> syntactically; it does not
  verify that the jQuery global is in scope or that the runtime jQuery version
  is 1.9 or later.
rule:
  pattern: '$.browser.$PROP'
