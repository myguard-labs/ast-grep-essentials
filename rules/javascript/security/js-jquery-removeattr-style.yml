id: js-jquery-removeattr-style
language: javascript
severity: warning
message: >-
  Review this removeAttr('style') call that clears the whole inline style
  attribute.
note: >-
  Matches the literal receiver.removeAttr('style') call shape only; it does
  not verify that the receiver is a jQuery object or resolve aliases or
  imports.
rule:
  pattern: '$RECV.removeAttr(''style'')'
