id: js-test-failure-only-logged
language: javascript
severity: warning
message: >-
  This if block only logs a failure string and does not fail the run; use
  throw, process exit, or an assertion.
note: >-
  Syntactic match only. Matches an if statement whose consequence block
  contains a console.log call with a string literal argument containing
  'fail'; it does not verify test semantics, runtime exit status, or whether
  the branch is reachable.
rule:
  kind: if_statement
  has:
    field: consequence
    kind: statement_block
    has:
      kind: expression_statement
      has:
        kind: call_expression
        pattern: 'console.log(''failed!'')'
