id: js-forin-key-strict-number-compare
language: javascript
severity: warning
message: >-
  For-in keys are strings; comparing the loop variable to a number literal
  with a strict operator never matches as intended.
note: >-
  Purely syntactic check on a literal numeric comparison inside a for-in body.
  It does not resolve types or confirm the iterated object's keys; the loop
  variable is matched by name only within the loop body.
rule:
  kind: for_in_statement
  has:
    kind: binary_expression
    pattern: '$K === 0'
    stopBy: end
