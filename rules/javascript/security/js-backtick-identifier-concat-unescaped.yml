# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-backtick-identifier-concat-unescaped
language: javascript
severity: warning
message: >-
  A backtick-quoted SQL identifier is built by concatenating a bare variable
  between backtick literals without escaping backticks inside it.
note: >-
  This is a syntactic check only. It matches a plain identifier placed
  directly between single-quoted backtick string literals. It cannot see
  whether the variable was validated or escaped earlier, and it does not cover
  other quote styles, template literals, or member expressions.
rule:
  pattern: '''`'' + $X + ''`'''
constraints:
  X:
    kind: identifier
