# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-backtick-identifier-concat-unescaped
language: javascript
severity: warning
message: >-
  A backtick-quoted SQL identifier is built by concatenating a bare variable
  between backtick literals without escaping backticks inside it.
note: >-
  This is a syntactic check only. It matches a plain identifier placed
  directly between single-quoted backtick string literals. It cannot see
  whether the variable was validated or escaped earlier, and it does not cover
  other quote styles, template literals, or member expressions.
rule:
  pattern: '''`'' + $X + ''`'''
constraints:
  X:
    kind: identifier
metadata:
  rule_modified_at: '2026-10-09'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-09'
  created_at: '2026-10-09'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-89'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/89.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  todo_cases:
    - 'const sql = "`" + key + "`";'
    - 'const sql = ''`'' + obj.key + ''`'';'
    - 'const sql = ''SELECT * FROM '' + ''`'' + name + ''`'';'
    - 'const sql = ''`'' + (key) + ''`'';'
