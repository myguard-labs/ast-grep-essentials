id: js-version-dot-strip-numeric-compare
language: javascript
severity: warning
message: >-
  A version string with dots removed is converted to a number and compared
  with an ordering operator; dot removal makes version ordering ambiguous.
note: >-
  Single-file syntactic match on a literal .replace(/\./g, '') followed by - 0
  used as an operand of an ordering comparison. It does not resolve whether
  the value is a version string or check types, values, or aliasing.
rule:
  pattern: '$X.replace(/\./g, '''') - 0'
