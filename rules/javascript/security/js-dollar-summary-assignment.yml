id: js-dollar-summary-assignment
language: javascript
severity: warning
message: >-
  Assigning to $.summary does not set a Pipedream step summary; use
  $.export("$summary", ...) instead.
note: >-
  Matches the literal syntax of an assignment whose left side is the property
  $.summary. It does not resolve whether the receiver is a Pipedream step
  context or check runtime behavior.
rule:
  pattern: '$.summary = $VALUE'
