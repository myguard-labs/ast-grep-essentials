id: js-mixed-logical-operators-no-parens
language: javascript
severity: warning
message: >-
  Parenthesize the && operand inside this || expression to make precedence
  explicit.
note: >-
  Syntactic check only. Flags a || expression whose direct operand is an
  unparenthesized && expression; it does not evaluate runtime values or
  semantic intent.
rule:
  pattern: '$A || $B && $C'
