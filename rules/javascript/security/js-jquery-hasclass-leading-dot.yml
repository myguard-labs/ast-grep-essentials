id: js-jquery-hasclass-leading-dot
language: javascript
severity: warning
message: >-
  hasClass() receives a class name without a leading dot; this string starts
  with '.' and will never match.
note: >-
  Syntactic check only. Matches a direct .hasClass() call whose first argument
  is a string literal beginning with a dot; it does not resolve the receiver
  type or confirm the call is jQuery.
rule:
  all:
    - pattern: '$OBJ.hasClass($ARG)'
    - kind: call_expression
    - has:
        field: arguments
        kind: arguments
        has:
          kind: string
          regex: '^[''"]\.'
