id: js-entrypoint-file-url-string-compare
language: javascript
severity: warning
message: >-
  Entrypoint check compares import.meta.url with a hand-built file:// string;
  URL percent-encoding can make this comparison fail.
note: >-
  Syntactic match only on a literal `===` comparison between import.meta.url
  and a template literal starting with file:// and interpolating
  process.argv[1]. It does not resolve runtime values, aliases, or whether the
  path needs encoding.
rule:
  pattern: 'import.meta.url === `file://${process.argv[1]}`'
