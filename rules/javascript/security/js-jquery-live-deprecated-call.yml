# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-jquery-live-deprecated-call
language: javascript
severity: warning
message: 'Call to jQuery .live() was removed in jQuery 1.9; use .on() instead.'
note: >-
  Matches any member call named live with a syntactic receiver; does not
  verify that the receiver is jQuery or resolve types or aliases.
rule:
  pattern: '$RECV.live($$$ARGS)'
