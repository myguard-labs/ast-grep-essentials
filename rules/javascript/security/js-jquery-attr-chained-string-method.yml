id: js-jquery-attr-chained-string-method
language: javascript
severity: warning
message: >-
  A string method is called directly on the result of a jQuery .attr() call; a
  missing attribute returns undefined and throws.
note: >-
  Matches only the literal syntax $(x).attr('name').method(...) in a single
  file. It does not resolve jQuery identity, types, or whether the attribute
  exists at runtime.
rule:
  pattern: '$A.attr($$$ARGS).replace($$$B)'
