id: js-isnan-date-parse-as-iso-validation
language: javascript
severity: warning
message: >-
  isNaN on new Date(...).getTime() validates loosely; Date accepts many
  non-ISO strings. Use an ISO 8601 check.
note: >-
  Purely syntactic match on a literal isNaN(new Date(x).getTime()) inside an
  if test. It does not resolve types, aliasing, or whether the surrounding
  code is an ISO validator, so legitimate date checks may match.
rule:
  pattern: |
    if (isNaN(new Date($ARG).getTime())) { $$$BODY }
