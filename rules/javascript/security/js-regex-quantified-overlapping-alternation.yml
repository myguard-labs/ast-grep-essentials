# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-regex-quantified-overlapping-alternation
language: javascript
severity: warning
message: >-
  This quantified regex group has an alternative that overlaps with \s, which
  can cause slow backtracking on non-matching input.
note: >-
  Syntactic check only. It flags a quantified group containing a literal
  \u00a0 escape alongside \s without proving full regex ambiguity or runtime
  backtracking cost.
rule:
  pattern: '/<p>(?:\u00a0|\s)+<\/p>/gi'
