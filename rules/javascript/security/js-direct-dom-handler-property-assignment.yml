id: js-direct-dom-handler-property-assignment
language: javascript
severity: warning
message: >-
  Assigning a function to an element's onblur or onfocus property replaces any
  existing listener for that event; consider addEventListener.
note: >-
  Syntactic match only on a member assignment whose property is onblur or
  onfocus and whose right side is a function expression. It does not resolve
  the receiver's type, detect other listeners, or confirm that a listener
  would be clobbered at runtime.
rule:
  kind: assignment_expression
  all:
    - has:
        field: left
        kind: member_expression
        has:
          field: property
          regex: '^(onblur|onfocus)$'
    - has:
        field: right
        kind: function_expression
