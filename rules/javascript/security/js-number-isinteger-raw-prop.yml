id: js-number-isinteger-raw-prop
language: javascript
severity: warning
message: >-
  Number.isInteger is applied to a raw this.<prop> value without numeric
  coercion.
note: >-
  Purely syntactic check for Number.isInteger(x) where x is a bare identifier;
  it does not track that x was assigned from this.<prop> and does not resolve
  types or runtime values, so string props may still be flagged or missed.
rule:
  pattern: 'Number.isInteger($ARG)'
  inside:
    stopBy: end
    has:
      pattern: 'const $VAR = this.$PROP;'
