# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-jquery-select-on-option-lookup
language: javascript
severity: warning
message: >-
  Calling .select() on a jQuery result looked up by a value attribute
  selector; .select() only affects text inputs, so this likely does nothing
  for option elements.
note: >-
  Syntactic match only. Matches a literal chain of .find() with a single
  string argument followed by .select() and does not resolve element types or
  confirm the found elements are option elements.
rule:
  pattern: '$OBJ.find(''[value="x"]'').select()'
