id: js-run-plain-error-for-input
language: javascript
severity: warning
message: >-
  Plain Error thrown in run() for what looks like invalid input; consider
  ConfigurationError.
note: >-
  Matches the literal syntax `throw new Error(...)` anywhere in the file. It
  does not verify that the error reports invalid user input, nor that the
  throw is inside an action run method, and it cannot resolve types or
  imports.
rule:
  pattern: 'throw new Error($$$ARGS)'
