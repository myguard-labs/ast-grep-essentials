id: js-jquery-bare-focus-call
language: javascript
severity: warning
message: >-
  Zero-argument .focus() on a jQuery object is a deprecated event-trigger
  shorthand; use .trigger('focus') instead.
note: >-
  Matches only the literal zero-argument syntax X.focus() with a literal
  receiver; it does not resolve whether the receiver is a jQuery object or
  check imports or types.
rule:
  pattern: '$OBJ.focus()'
