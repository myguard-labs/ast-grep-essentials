# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-regex-chained-dotstar
language: javascript
severity: warning
message: >-
  Regex literal contains two or more .* quantifiers, which can backtrack
  super-linearly on long inputs.
note: >-
  This check looks only at the text of the regex pattern. It does not check
  whether input length is bounded or whether the match can actually backtrack,
  and it may flag escaped sequences such as \.* or .* inside character
  classes.
rule:
  kind: regex_pattern
  regex: '\.\*.*\.\*'
