id: js-decode-uri-component-unguarded
language: javascript
severity: warning
message: >-
  decodeURIComponent is called outside a try block; a malformed percent-escape
  will throw URIError.
note: >-
  Syntactic check only. Flags a direct decodeURIComponent call with a
  non-literal argument that has no try ancestor in the same file. It does not
  verify whether the input is user-controlled, whether a caller catches the
  error, or whether the value is pre-validated.
rule:
  all:
    - pattern: 'decodeURIComponent($ARG)'
    - not:
        inside:
          kind: try_statement
          stopBy: end
    - not:
        has:
          kind: string
          stopBy: end
