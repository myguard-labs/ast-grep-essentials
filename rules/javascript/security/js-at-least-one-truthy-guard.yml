id: js-at-least-one-truthy-guard
language: javascript
severity: warning
message: >-
  Bare truthiness checks on optional fields treat valid falsy values such as 0
  or false as missing. Compare against undefined explicitly.
note: >-
  Syntactic match only. It flags a negated member-expression pair joined by &&
  in an if-statement condition, without resolving types or whether the fields
  are optional or whether the guarded branch throws a ConfigurationError.
rule:
  all:
    - pattern: 'if (!$A && !$B) { $$$BODY }'
    - not:
        has:
          pattern: '$X === undefined'
          stopBy: end
