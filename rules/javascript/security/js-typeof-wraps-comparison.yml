id: js-typeof-wraps-comparison
language: javascript
severity: warning
message: >-
  typeof is applied to a comparison expression, so its result is always the
  string 'boolean'; review the guard.
note: >-
  Syntactic match only. Flags a typeof unary expression whose operand is a
  parenthesized binary comparison with a literal != operator. Does not resolve
  runtime values or types and does not check intent.
rule:
  kind: unary_expression
  pattern: 'typeof($A != $B)'
