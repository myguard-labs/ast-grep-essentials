id: js-db-default-empty-collapses-first-run
language: javascript
severity: warning
message: >-
  This persisted-state read defaults to an empty array with ??, so an
  uninitialized store looks the same as an empty one when deriving a first-run
  flag.
note: >-
  Single-file syntactic match on a literal this.db.get(...) call followed by
  ?? []. It does not resolve the db type, prove the key is never initialized,
  or check how the flag is used downstream.
rule:
  pattern: 'const $VAR = this.db.get($KEY) ?? [];'
