id: js-jwt-algorithms-none-allowed
language: javascript
severity: warning
message: A verify or createVerifier call whose options object has an algorithms array
  containing the string 'none'.
note: Allowing 'none' lets unsigned tokens verify, and a key passed alongside it is
  ignored or misused. This is a common JWT verifier mistake across libraries, not
  specific to fast-jwt.
rule:
  pattern: 'jwt.verify($V0, $V1, { algorithms: [''none''] })'
