id: js-backbone-model-on-context-arg
language: javascript
severity: warning
message: >-
  Backbone .on with a context argument on this.<prop> registers a handler with
  no teardown; consider this.listenTo(this.<prop>, event, handler) so
  stopListening cleans it up.
note: >-
  Purely syntactic check of a literal this.<prop>.on(event, this.<method>,
  this) call with three arguments; it does not resolve types or confirm the
  receiver is a Backbone object or that teardown is absent.
rule:
  pattern: 'this.$PROP.on($EVENT, this.$METHOD, this)'
