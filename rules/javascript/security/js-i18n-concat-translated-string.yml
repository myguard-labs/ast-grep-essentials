# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-i18n-concat-translated-string
language: javascript
severity: warning
message: >-
  Concatenating a translated fragment with other text breaks word order and
  grammar in other languages; use a placeholder-based message instead.
note: >-
  Matches a binary + whose left operand is a literal menus.<name> member
  access, with any further concatenation. It does not resolve whether menus is
  a localized-strings object, and it does not detect translation calls or
  other concatenation shapes.
rule:
  pattern: 'menus.$NAME + $B'
