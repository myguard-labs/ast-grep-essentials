# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-classname-indexof-substring
language: javascript
severity: warning
message: >-
  Substring search on className can match other class names; use
  classList.contains or an exact token check.
note: >-
  Syntactic match on a literal `.className.indexOf(<string literal>)` call
  only; it does not resolve the receiver's type or runtime value and cannot
  prove the result is used as a class-membership test.
rule:
  pattern: '$X.className.indexOf(''$S'')'
