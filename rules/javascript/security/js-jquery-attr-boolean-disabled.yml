id: js-jquery-attr-boolean-disabled
language: javascript
severity: warning
message: >-
  Use .prop('disabled', true) instead of setting the disabled attribute with
  .attr('disabled', ...).
note: >-
  Purely syntactic match on a literal receiver call .attr('disabled', <string
  literal>). It does not resolve whether the receiver is a jQuery object, nor
  runtime or alias identity.
rule:
  pattern: '$RECV.attr(''disabled'', $VAL)'
constraints:
  VAL:
    kind: string
