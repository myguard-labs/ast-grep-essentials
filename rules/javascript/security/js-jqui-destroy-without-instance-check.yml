id: js-jqui-destroy-without-instance-check
language: javascript
severity: warning
message: >-
  This if-statement checks only a class name before calling
  .draggable('destroy'); confirm a widget instance exists before tearing it
  down.
note: >-
  Syntactic match only. It flags an if-statement whose test is a
  hasClass('ui-draggable') call and whose consequent calls
  .draggable('destroy') on a literal receiver. It does not resolve runtime
  widget state, so a class check paired with data-based checks elsewhere may
  still be safe.
rule:
  kind: if_statement
  all:
    - has:
        pattern: '$RECV.draggable(''destroy'')'
        stopBy: end
    - has:
        pattern: '$X.hasClass(''ui-draggable'')'
        stopBy: end
    - not:
        has:
          pattern: '$Y.data(''draggable'')'
          stopBy: end
