id: js-version-dots-stripped-numeric
language: javascript
severity: warning
message: >-
  Stripping dots from a version string and coercing with minus zero misorders
  multi-digit version components.
note: >-
  Single-file syntactic match on a literal .replace(/\./g, '') call followed
  by - 0 coercion. It does not resolve the receiver's type or confirm the
  value is used for version comparison.
rule:
  pattern: '$RECV.replace(/\./g, '''') - 0'
