id: js-jquery-live-removed-call
language: javascript
severity: warning
message: >-
  Call to jQuery .live(), which was removed in jQuery 1.9 and throws at
  runtime. Use delegated .on() instead.
note: >-
  Purely syntactic match on a call whose member name is live with a literal
  receiver shape; it does not verify that the receiver is jQuery or resolve
  types or aliases.
rule:
  pattern: '$RECV.live($$$ARGS)'
