id: js-math-random-path-segment
language: javascript
severity: warning
message: >-
  Template literal path segment built from Math.random(); use a counter or
  CSPRNG-based name instead.
note: >-
  Single-file syntactic match only. Matches a template literal whose text
  contains a literal slash and whose substitution contains a Math.random()
  call; does not resolve whether the result is used as a file path or whether
  the value is predictable at runtime.
rule:
  kind: template_string
  all:
    - has:
        kind: string_fragment
        regex: '/'
        stopBy: end
    - has:
        kind: template_substitution
        stopBy: end
        has:
          pattern: 'Math.random()'
          stopBy: end
