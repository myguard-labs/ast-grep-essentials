# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-regex-plus-empty-block-body
language: javascript
severity: warning
message: >-
  This regex requires at least one character between the opening and closing
  tag, so empty elements will not match.
note: >-
  Syntactic check on regex literal text only; it does not verify runtime
  string contents, dataflow, or whether the regex is used for HTML processing.
rule:
  kind: regex
  regex: '<\(pre\|script\)'
  all:
    - regex: '\[\\s\\S\]\+\?'
    - regex: '<\\/\\1>'
