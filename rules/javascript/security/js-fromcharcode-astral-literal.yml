id: js-fromcharcode-astral-literal
language: javascript
severity: warning
message: >-
  String.fromCharCode is called with a numeric literal above 0xFFFF; it
  truncates to a UTF-16 code unit. Use String.fromCodePoint instead.
note: >-
  Single-file syntactic match on a literal String.fromCharCode receiver and a
  single hexadecimal numeric literal argument with at least five hex digits.
  Does not resolve imports, aliases, or runtime values, and does not verify
  the numeric value beyond its digit count.
rule:
  kind: call_expression
  all:
    - pattern: 'String.fromCharCode($NUM)'
    - has:
        field: arguments
        kind: arguments
        has:
          kind: number
          regex: '^0[xX][0-9a-fA-F]{5,}$'
