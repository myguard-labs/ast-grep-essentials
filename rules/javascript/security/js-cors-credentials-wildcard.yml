id: js-cors-credentials-wildcard
language: javascript
severity: error
message: >-
  Cross-origin credentials enabled together with a reflected or wildcard origin.
  Any site the victim visits can then issue authenticated requests to this API
  and read the responses, which is a full account takeover from a drive-by page.
  List the exact origins that are allowed to send credentials.
note: >-
  Matches a credentials option set to true or "true" in the same object literal
  as an origin option that is the boolean true or the string star, and a
  setHeader call that sends Access-Control-Allow-Origin from a request origin
  header. It does not follow an origin callback function, which can be either
  safe or unsafe, and it does not correlate the two manual header calls with
  each other.
utils:
  truthy-credentials:
    kind: pair
    all:
      - has: {field: key, regex: '^["'']?credentials["'']?$'}
      - has:
          field: value
          any:
            - kind: 'true'
            - kind: string
              regex: '(?i)^["'']true["'']$'
  reflected-origin:
    kind: pair
    all:
      - has: {field: key, regex: '^["'']?origin["'']?$'}
      - has:
          field: value
          any:
            - kind: 'true'
            - kind: string
              regex: '^["'']\*["'']$'
rule:
  any:
    - kind: object
      all:
        - has: {matches: truthy-credentials}
        - has: {matches: reflected-origin}
    - kind: call_expression
      all:
        - has:
            field: function
            kind: member_expression
            has: {field: property, regex: '^(setHeader|header)$'}
        - has:
            stopBy: neighbor
            kind: arguments
            all:
              - has:
                  nthChild: 1
                  kind: string
                  regex: '(?i)^["'']access-control-allow-origin["'']$'
              - has:
                  nthChild: 2
                  kind: member_expression
                  regex: '^req(uest)?\s*\.\s*headers\b'
