id: js-jquery-is-bare-class-name
language: javascript
severity: warning
message: >-
  This .is() call passes a bare lowercase word with no selector prefix; it is
  parsed as a tag selector, so a class check may silently never match.
note: >-
  Syntactic check only. Matches a literal bare lowercase word string argument
  to a .is() call on a literal receiver; it cannot tell whether the word is
  intended as a tag name, so tag checks may be false positives.
rule:
  all:
    - pattern: '$OBJ.is( $ARG )'
    - kind: call_expression
    - has:
        field: arguments
        kind: arguments
        regex: '^\(\s*''[a-z]+''\s*\)$'
