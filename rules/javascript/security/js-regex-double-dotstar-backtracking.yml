# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-regex-double-dotstar-backtracking
language: javascript
severity: warning
message: >-
  Regex literal with two unbounded .* quantifiers is tested against input and
  may backtrack quadratically.
note: >-
  Syntactic check only. It flags a regex literal whose source text contains
  two .* sequences and is passed directly to .test(). It does not check
  whether the input is attacker-controlled or long, and it does not analyze
  regex semantics such as escaped dots or character classes.
rule:
  pattern: '$RE.test($X)'
constraints:
  RE:
    kind: regex
    regex: '\.\*.*\.\*'
