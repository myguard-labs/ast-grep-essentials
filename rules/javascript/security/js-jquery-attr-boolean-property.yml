id: js-jquery-attr-boolean-property
language: javascript
severity: warning
message: >-
  Use .prop() instead of .attr() for boolean DOM properties such as checked,
  selected, or disabled.
note: >-
  Matches a literal receiver.attr() call whose first argument is the string
  'checked', 'selected', or 'disabled'. It does not resolve whether the
  receiver is a jQuery object or whether the call targets a DOM property at
  runtime.
rule:
  pattern: '$RECV.attr(''checked'', $$$ARGS)'
