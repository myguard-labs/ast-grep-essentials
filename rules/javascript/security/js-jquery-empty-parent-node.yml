id: js-jquery-empty-parent-node
language: javascript
severity: warning
message: >-
  Calling .empty() on a parentNode-derived receiver removes sibling nodes too;
  review this call.
note: >-
  Purely syntactic match on a literal .parentNode member read feeding a
  .empty() call in the same expression. It does not resolve types, aliases, or
  runtime values, so other parent-derived receivers are not detected.
rule:
  pattern: '$RECV.empty()'
  has:
    pattern: '$X.parentNode'
    stopBy: end
