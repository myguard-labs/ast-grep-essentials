id: js-recursive-decoder-no-depth-bound
language: javascript
severity: warning
message: Recursive function with no depth parameter or depth check.
note: >-
  Syntactic heuristic: matches self-calls without 'depth' in parameters or
  body.
rule:
  kind: function_declaration
  all:
    - has:
        field: name
        pattern: '$NAME'
    - has:
        kind: call_expression
        pattern: '$NAME($$$)'
        stopBy: end
    - not:
        has:
          kind: identifier
          regex: depth
          stopBy: end
metadata:
  rule_modified_at: '2026-10-11'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-11'
