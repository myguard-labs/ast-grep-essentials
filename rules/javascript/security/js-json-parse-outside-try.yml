id: js-json-parse-outside-try
language: javascript
severity: warning
message: >-
  JSON.parse is called outside a try statement; malformed input will throw an
  unhandled error.
note: >-
  Syntactic check only. It flags a literal JSON.parse call with no try
  ancestor in the file; it does not verify the input source, trust level, or
  whether a caller handles the error.
rule:
  all:
    - pattern: 'JSON.parse($$$ARGS)'
    - not:
        inside:
          kind: try_statement
          stopBy: end
