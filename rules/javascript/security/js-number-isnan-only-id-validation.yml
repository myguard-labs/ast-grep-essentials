  taxonomy_source: 'https://cwe.mitre.org/data/definitions/20.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  todo_cases:
    - 'FP: if (Number.isNaN(n)) { throw ... } followed by a separate if (!Number.isInteger(n)) { throw ... } is flagged on the first if'
    - 'FN: if (isNaN(n)) throw new Error("invalid"); (global isNaN)'
