id: js-number-isnan-only-id-validation
language: javascript
severity: warning
message: >-
  This id guard only checks Number.isNaN on the converted value; fractional or
  non-positive ids will pass.
note: >-
  Syntactic match only. It flags an if-statement whose condition calls
  Number.isNaN on a value and has no Number.isInteger check in the same
  condition; it does not resolve types, runtime values, or whether the value
  is later validated elsewhere.
rule:
  all:
    - kind: if_statement
    - has:
        pattern: 'Number.isNaN($X)'
        stopBy: end
    - not:
        has:
          pattern: 'Number.isInteger($$$ARGS)'
          stopBy: end
