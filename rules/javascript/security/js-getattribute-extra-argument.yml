id: js-getattribute-extra-argument
language: javascript
severity: warning
message: >-
  getAttribute is called with more than one argument; the extra arguments are
  ignored by the DOM method.
note: >-
  Matches the literal receiver syntax getAttribute with two or more arguments;
  it does not resolve the receiver type or confirm that the call targets a DOM
  element.
rule:
  pattern: '$RECV.getAttribute($ARG1, $$$REST)'
