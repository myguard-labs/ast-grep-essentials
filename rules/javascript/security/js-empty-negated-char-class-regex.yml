# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-empty-negated-char-class-regex
language: javascript
severity: warning
message: >-
  Regex literal contains an empty negated character class [^], which matches
  any character.
note: >-
  Syntactic match on regex literal source only; does not verify regex flags,
  surrounding intent, or whether the literal is used in a match context.
rule:
  regex: '\[\^\]'
  kind: regex
