id: js-insecure-random-secret
language: javascript
severity: error
message: >-
  Security value derived from Math.random. That generator is a fast
  non-cryptographic PRNG whose internal state can be recovered from a handful of
  outputs, so an attacker predicts the next reset token, session identifier or
  one-time code and takes over accounts. Use crypto.randomBytes or
  crypto.randomUUID.
note: >-
  Matches a variable declarator or an object property whose name contains token,
  secret, nonce, otp, session, password, salt, apikey or csrf and whose
  initialiser contains a Math.random call. The name is a heuristic: a security
  value with a neutral name is missed, and a cosmetic identifier that happens to
  contain one of these words is reported.
utils:
  security-name:
    regex: '(?i)(token|secret|nonce|otp|session|passw(or)?d|salt|apikey|api_key|csrf)'
  math-random-init:
    has:
      stopBy: end
      kind: call_expression
      has:
        field: function
        kind: member_expression
        regex: '^Math\s*\.\s*random$'
rule:
  any:
    - kind: variable_declarator
      all:
        - has: {field: name, kind: identifier, matches: security-name}
        - has: {field: value, matches: math-random-init}
    - kind: pair
      all:
        - has: {field: key, matches: security-name}
        - has: {field: value, matches: math-random-init}
    - kind: assignment_expression
      all:
        - has: {field: left, kind: member_expression, has: {field: property, matches: security-name}}
        - has: {field: right, matches: math-random-init}
