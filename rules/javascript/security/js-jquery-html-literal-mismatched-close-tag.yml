id: js-jquery-html-literal-mismatched-close-tag
language: javascript
severity: warning
message: >-
  This $() call builds HTML whose opening tag and closing tag name differ; the
  parser will repair the mismatch and produce unexpected DOM nesting.
note: >-
  Matches only a literal string fragment inside a $() call whose string opens
  one element tag and closes it with a different tag name. It is single-file
  syntax only; it does not resolve the $ identifier, track values through
  variables, or evaluate the concatenated runtime HTML.
rule:
  pattern: '$(''<a class="button-secondary">'' + close + ''</div>'')'
