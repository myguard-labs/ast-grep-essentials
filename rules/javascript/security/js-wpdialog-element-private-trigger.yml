id: js-wpdialog-element-private-trigger
language: javascript
severity: warning
message: >-
  Calling widget-private _trigger on a .element jQuery object will throw; use
  the widget instance or the public event API.
note: >-
  Matches the literal syntax this.element._trigger(...) only; it does not
  resolve whether the receiver is a jQuery object or a widget instance at
  runtime.
rule:
  pattern: 'this.element._trigger($$$ARGS)'
