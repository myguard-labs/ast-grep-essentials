id: js-instanceof-negated-left-operand
language: javascript
severity: warning
message: >-
  Negated left operand of instanceof is a precedence trap; the negation
  applies before instanceof.
note: >-
  Single-file syntactic match on a binary instanceof whose left operand is a
  unary ! expression written without parentheses. Does not resolve types or
  runtime values.
rule:
  kind: binary_expression
  all:
    - has:
        field: operator
        regex: '^instanceof$'
    - has:
        field: left
        kind: unary_expression
        regex: '^!'
metadata:
  rule_modified_at: '2026-10-15'
