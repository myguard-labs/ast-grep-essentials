# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-getelementbyid-chained-call-unguarded
language: javascript
severity: warning
message: >-
  Method or property accessed directly on document.getElementById(...) without
  a null check; a missing element throws a TypeError.
note: >-
  Matches the literal syntax document.getElementById(...).member without
  optional chaining. It does not resolve types, aliases, or variable-indirect
  uses, and does not check whether a guard exists elsewhere in the code.
rule:
  pattern: 'document.getElementById($$$ARGS).$PROP'
