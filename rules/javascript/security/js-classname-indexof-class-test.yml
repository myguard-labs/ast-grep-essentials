id: js-classname-indexof-class-test
language: javascript
severity: warning
message: >-
  Substring test on className with indexOf; use classList.contains for
  whole-token class checks.
note: >-
  Single-file syntactic match on a literal receiver ending in
  className.indexOf with a string literal argument. It does not resolve types,
  aliases, or whether the element is a DOM node.
rule:
  pattern: '$EL.className.indexOf(''$LIT'')'
