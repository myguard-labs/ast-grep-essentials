id: js-static-import-after-runtime-guard
language: javascript
severity: warning
message: >-
  Top-level static import follows a process.exit guard; the import still
  evaluates first because imports are hoisted.
note: >-
  Syntactic check only. It matches a top-level import statement that follows
  an if-statement containing a process.exit call in its own subtree, without
  verifying that the guard is reached or relevant.
rule:
  all:
    - pattern: 'import ''./dist/app.mjs'''
    - inside:
        kind: program
        stopBy: end
    - follows:
        kind: if_statement
        has:
          pattern: 'process.exit($$$ARGS)'
          stopBy: end
        stopBy: end
