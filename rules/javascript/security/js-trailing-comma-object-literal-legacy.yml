id: js-trailing-comma-object-literal-legacy
language: javascript
severity: warning
message: >-
  Object literal has a trailing comma before the closing brace, which legacy
  ES3 engines reject.
note: >-
  Purely syntactic match on an object literal whose last property is followed
  by a comma and closing brace. It does not check the configured ES target,
  and modern ES5+ code permits this comma, so review whether the target still
  requires ES3 compatibility.
rule:
  pattern: '{ close: function () {}, }'
