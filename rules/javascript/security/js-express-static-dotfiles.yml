id: js-express-static-dotfiles
language: javascript
severity: error
message: >-
  Static file server configured to serve dotfiles. That exposes .env, .git and
  .htpasswd under the served directory over plain HTTP, handing out credentials
  and the full source history. Leave the dotfiles option at its default of
  ignore, or set it to deny.
note: >-
  Matches a dotfiles option whose value is the string allow in an express.static
  or serveStatic options object. An index option is not matched: it selects an
  index file rather than enabling a directory listing. It does not check what the
  served directory actually contains, so a purpose-built directory of dotfiles
  also matches.
utils:
  static-call:
    kind: call_expression
    has:
      field: function
      any:
        - kind: identifier
          regex: '^serveStatic$'
        - kind: member_expression
          all:
            - has: {field: property, regex: '^static$'}
            - has: {field: object, regex: '(^|\.)express$'}
rule:
  kind: pair
  all:
    - inside:
        stopBy: end
        matches: static-call
    - has: {field: key, regex: '^["'']?dotfiles["'']?$'}
    - has: {field: value, kind: string, regex: '(?i)^["'']allow["'']$'}
