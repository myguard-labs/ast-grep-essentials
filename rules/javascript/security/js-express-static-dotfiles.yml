id: js-express-static-dotfiles
language: javascript
severity: error
message: >-
  Static file server configured to serve dotfiles. That exposes .env, .git and
  .htpasswd under the served directory over plain HTTP, handing out credentials
  and the full source history. Leave the dotfiles option at its default of
  ignore, or set it to deny.
note: >-
  Matches a dotfiles option whose value is the string allow in an
  express.static or serveStatic options object, and an index option set to true
  in the same APIs, which turns on directory listing. It does not check what the
  served directory actually contains, so a purpose-built directory of dotfiles
  also matches.
utils:
  static-call:
    kind: call_expression
    has:
      field: function
      any:
        - kind: identifier
          regex: '^(serveStatic|static)$'
        - kind: member_expression
          has: {field: property, regex: '^static$'}
rule:
  kind: pair
  all:
    - inside:
        stopBy: end
        matches: static-call
    - any:
        - all:
            - has: {field: key, regex: '^["'']?dotfiles["'']?$'}
            - has: {field: value, kind: string, regex: '(?i)^["'']allow["'']$'}
        - all:
            - has: {field: key, regex: '^["'']?index["'']?$'}
            - has: {field: value, kind: 'true'}
