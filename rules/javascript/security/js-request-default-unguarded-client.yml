id: js-request-default-unguarded-client
language: javascript
severity: warning
message: >-
  Nullish default falls back to a raw required HTTP package instead of an
  injected, guarded client.
note: >-
  Syntactic only. It flags `x ?? require('<bare package>')` where the
  specifier does not start with '.' or '/'. It cannot tell whether the package
  is actually an unguarded HTTP client, or whether some other code applies an
  internal-address guard.
rule:
  pattern: '$CLIENT ?? require($PKG)'
constraints:
  PKG:
    regex: '^[''"][^./]'
