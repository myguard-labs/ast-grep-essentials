# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-placeholder-l10n-value-compare
language: javascript
severity: warning
message: >-
  Comparing an input's value to a localized placeholder string is fragile; use
  a state flag instead.
note: >-
  Single-file syntactic match on an == comparison between a .value member and
  a literal-receiver property access. It does not resolve whether the receiver
  is a localized string object or whether the input is the placeholder target;
  review context.
rule:
  pattern: '$A.value == $B.$KEY'
