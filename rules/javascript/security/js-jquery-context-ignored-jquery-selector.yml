id: js-jquery-context-ignored-jquery-selector
language: javascript
severity: warning
message: >-
  A jQuery $() call wraps a method-chain result and also passes a context
  argument, which jQuery ignores.
note: >-
  Syntactic match only. It flags $() calls whose first argument is a member
  call with a second argument; it does not verify that the first argument is a
  jQuery object, so string-returning calls may be flagged.
rule:
  pattern: '$($RECV.$METHOD($$$ARGS), $CTX)'
