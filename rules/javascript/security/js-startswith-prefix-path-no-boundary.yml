id: js-startswith-prefix-path-no-boundary
language: javascript
severity: warning
message: An if-condition that calls startsWith(X) with no separator test on the character
  after X, whose body slices the same subject by X.length.
note: Raw prefix tests let sibling names such as foo2 pass for an allowlisted foo,
  then the remainder is trusted. The same startsWith-then-slice shape recurs in path,
  module and ID allowlists. Legitimate prefix stripping is a noise risk, so the near-miss
  adds a separator test in the same condition.
rule:
  pattern: function $V0 (path, $V1) { if (path.startsWith(mod.path)) { const $V2 =
    path.slice(mod.path.length); return $V2 } }
metadata:
  cwe: 'CWE-22'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/22.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A01:2025'
  todo_cases:
    - "FN (comment before the slice statement): function check (path, mod) { if (path.startsWith(mod.path)) { /* strip */ const rem = path.slice(mod.path.length); return rem } }"
    - "FN (let instead of const): function check (path, mod) { if (path.startsWith(mod.path)) { let rem = path.slice(mod.path.length); return rem } }"
    - "FN (function expression instead of declaration): const check = function (path, mod) { if (path.startsWith(mod.path)) { const rem = path.slice(mod.path.length); return rem } }"
