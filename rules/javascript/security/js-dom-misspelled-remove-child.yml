# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-dom-misspelled-remove-child
language: javascript
severity: warning
message: >-
  Possible misspelled DOM method removedChild; the correct name is
  removeChild.
note: >-
  Matches the literal member name removedChild on any receiver purely by
  syntax; it does not verify that the receiver is a DOM Node or resolve types
  or imports.
rule:
  pattern: '$RECV.removedChild($$$ARGS)'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
