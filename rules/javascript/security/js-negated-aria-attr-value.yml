id: js-negated-aria-attr-value
language: javascript
severity: warning
message: >-
  This .attr call on an aria-* attribute writes a logical negation of an
  attribute read; jQuery will not write 'true' or 'false' for it.
note: >-
  Single-file syntactic match on a literal receiver with a literal aria-*
  attribute name and a negated .attr read of the same receiver and name. Does
  not resolve receiver identity, aliasing, or runtime values.
rule:
  pattern: '$EL.attr($NAME, !$EL.attr($NAME))'
