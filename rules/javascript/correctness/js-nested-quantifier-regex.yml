id: js-nested-quantifier-regex
language: javascript
severity: warning
message: >-
  Regex literal has a quantified group that contains an inner + or *
  quantifier (nested repetition).
note: >-
  This is a text heuristic on regex literals only. It checks groups that have
  no nested parentheses and an unescaped inner + or * followed by an outer +
  or *. It does not prove that catastrophic backtracking happens. It does not
  check regexes built with RegExp or from strings.
rule:
  kind: regex
  regex: '\([^()]*[^\\][+*][^()]*\)[+*]'
