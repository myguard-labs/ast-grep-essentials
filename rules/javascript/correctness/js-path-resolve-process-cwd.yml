id: js-path-resolve-process-cwd
language: javascript
severity: warning
message: >-
  path.resolve/path.join anchored at process.cwd() builds a path relative to
  the invocation directory, not the module file.
note: >-
  Syntactic review candidate only. It matches calls on an identifier named
  `path` and cannot confirm that `path` is node:path. Using the current
  working directory may be intended, so check what the code is meant to do
  before changing it.
rule:
  pattern: 'path.$METHOD(process.cwd(), $$$REST)'
constraints:
  METHOD:
    regex: '^(resolve|join)$'
