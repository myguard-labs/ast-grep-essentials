# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-match-result-unchecked-index
language: javascript
severity: warning
message: >-
  Direct indexing of a .match() result throws when nothing matches; check the
  result for null before subscripting it.
note: >-
  Syntactic check only. It cannot verify that the receiver is a string, that
  the regex always matches, or that a prior guard protects the access; those
  require types, dataflow, or reachability and are not checked.
rule:
  all:
    - pattern: '$OBJ.match($$$ARGS)[$IDX]'
    - not:
        regex: '\)\?\.\['
