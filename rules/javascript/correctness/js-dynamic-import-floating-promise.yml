id: js-dynamic-import-floating-promise
language: javascript
severity: warning
message: >-
  Dynamic import() is used as a bare statement, so its promise is not awaited
  and has no catch handler. A failed import will become an unhandled
  rejection.
note: >-
  This is a syntactic check only. It flags an import() call that is the entire
  expression statement. It does not track promises assigned to variables or
  returned, and it does not see global unhandled-rejection handlers.
rule:
  kind: expression_statement
  has:
    kind: call_expression
    has:
      field: function
      kind: import
