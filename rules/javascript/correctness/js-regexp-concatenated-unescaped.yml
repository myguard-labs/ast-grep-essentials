id: js-regexp-concatenated-unescaped
language: javascript
severity: 'off'
message: >-
  Deprecated rule ID; use js-regexp-constructor-unescaped-concat. RegExp built
  from a string concatenation containing an unescaped identifier operand.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use js-regexp-constructor-unescaped-concat and do not emit
  this rule.
rule:
  pattern: 'new RegExp($$$ARGS)'
  has:
    field: arguments
    has:
      stopBy: end
      pattern: '$L + $R'
      has:
        kind: identifier
metadata:
  deprecated_alias_of: js-regexp-constructor-unescaped-concat
