id: js-regexp-concatenated-unescaped
language: javascript
severity: warning
message: >-
  RegExp built from a string concatenation containing an unescaped identifier
  operand.
note: >-
  Syntactic only; flags a bare identifier used directly as a + operand inside
  the RegExp arguments. It cannot tell whether the value was escaped somewhere
  else or whether it actually contains metacharacters.
rule:
  kind: new_expression
  all:
    - has:
        field: constructor
        regex: '^RegExp$'
    - has:
        field: arguments
        has:
          stopBy: end
          kind: binary_expression
          regex: '\+'
          has:
            kind: identifier
