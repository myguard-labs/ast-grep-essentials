id: js-export-default-sequence-expression
language: javascript
severity: error
message: >-
  Unparenthesized comma sequence after export default; wrap the expression in
  parentheses or split it into separate statements.
note: >-
  Single-file syntactic check only. Matches a bare two-operand comma
  expression written directly after export default, so a parenthesized
  sequence is not matched. Does not evaluate types, runtime values, or
  reachability.
rule:
  pattern: 'export default $A, $B'
