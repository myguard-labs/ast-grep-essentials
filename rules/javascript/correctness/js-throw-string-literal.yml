id: js-throw-string-literal
language: javascript
severity: warning
message: >-
  Throwing a string literal instead of an Error object loses the message and
  stack properties that handlers expect.
note: >-
  Only reports throw statements whose operand is a plain string literal. It
  does not cover number, boolean, or template literals, and it does not check
  thrown identifiers or expressions whose value is decided at runtime.
rule:
  kind: throw_statement
  has:
    kind: string
