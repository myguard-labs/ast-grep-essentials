id: js-assignment-as-if-condition
language: javascript
severity: warning
message: >-
  Assignment used as the condition of an if statement; did you mean a
  comparison?
note: >-
  Single-file syntactic check only. It flags an if statement whose
  parenthesized condition is directly an assignment expression. It cannot tell
  whether the assignment was intended, and it does not inspect nested
  expressions, types, or runtime values.
rule:
  kind: if_statement
  has:
    kind: parenthesized_expression
    has:
      kind: assignment_expression
