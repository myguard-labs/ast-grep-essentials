id: js-script-tag-without-nonce
language: javascript
severity: warning
message: >-
  Template literal emits a script tag with a src attribute but no nonce;
  strict CSP will block it.
note: >-
  Syntactic check only. It looks for a template literal that contains
  '<script' followed by whitespace and a src attribute, and that never
  mentions 'nonce'. It cannot tell whether a nonce is added later, at runtime,
  or through an aliased variable.
rule:
  kind: template_string
  all:
    - regex: '<script\s+src='
    - not:
        regex: nonce
