# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: js-unreplaced-build-placeholder
language: javascript
severity: warning
message: >-
  String literal contains an unreplaced build-template placeholder token of
  the form @@name@@.
note: >-
  Syntactic check only: flags string literals whose text contains an @@name@@
  token. It does not verify the build step, runtime values, or whether the
  token is intentional.
rule:
  kind: string
  regex: '@@[A-Za-z_][A-Za-z0-9_]*@@'
metadata:
  rule_modified_at: '2026-10-10'
  ast_grep_tested_version: 0.45.3
