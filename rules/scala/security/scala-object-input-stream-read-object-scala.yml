# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: scala-object-input-stream-read-object-scala
language: scala
severity: warning
message: >-
  readObject() is called on a plain java.io.ObjectInputStream. Java
  deserialization instantiates whatever class the stream names, so bytes from
  an attacker can run gadget-chain code in the application. Do not
  deserialize untrusted data; use a data format such as JSON, or filter the
  accepted classes with an ObjectInputFilter or a resolveClass allow-list.
note: >-
  [CWE-502]: Deserialization of Untrusted Data
  [OWASP A08:2025] [A08:2021]: Software or Data Integrity Failures
  [REFERENCES]
      - https://cwe.mitre.org/data/definitions/502.html
      - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures
  Matches readObject() on `new ObjectInputStream(...)` directly, on a val
  bound to one in the nearest enclosing block that declares that name, and on the lambda parameter of
  `Using(new ObjectInputStream(...)) { ... }`, `Using.resource(...)` and
  `scala.util.Using(...)`. An anonymous subclass with a body, which is the
  usual place for a resolveClass allow-list, and other stream types are not
  reported. A fully qualified or `_root_` qualified
  `java.io.ObjectInputStream` is reported like the short name; an alias
  import such as `import java.io.{ObjectInputStream => Stream}` is a known miss. A `var`, a pattern binding or a class member
  receiver is not a source. A nested val or Using lambda of the same name
  that is itself such a source is reported on its own and never hides an
  outer source. Between the source and the call, a val or var in a
  nested block, a `def` parameter (not its default value), a lambda parameter
  or a case pattern of the same name hides the source, for the val and the
  `Using` form alike; a rebinding hides only a source that encloses it with no
  other source in between, so a deeper source of the same name nested inside
  the rebinding is still reported. A `case` pattern that mentions the stream
  name anywhere, including a stable identifier or backticked reference, is
  treated as a rebinding. A binding that comes after the call in the same block is
  a known miss.
  The rule cannot tell whether the stream carries untrusted bytes, so review
  each hit for the data source.
utils:
  # A block with a val bound to a plain ObjectInputStream, named like $STREAM.
  val-source:
    kind: block
    has:
      kind: val_definition
      all:
        - has:
            field: pattern
            kind: identifier
            pattern: $STREAM
        - has:
            field: value
            matches: plain-ois-instance
  # The single-parameter lambda of Using(new ObjectInputStream(...)) { ... },
  # Using.resource and scala.util.Using, with the parameter named like $STREAM.
  using-source:
    kind: lambda_expression
    all:
      - has:
          field: parameters
          any:
            - kind: identifier
              pattern: $STREAM
            - kind: bindings
              all:
                - has:
                    kind: binding
                    has:
                      field: name
                      kind: identifier
                      pattern: $STREAM
                - not:
                    has:
                      kind: binding
                      nthChild:
                        position: 2
                        ofRule:
                          kind: binding
      - inside:
          any:
            - kind: block
            - kind: arguments
          inside:
            field: arguments
            kind: call_expression
            has:
              field: function
              kind: call_expression
              all:
                - has:
                    field: function
                    any:
                      - kind: identifier
                        regex: ^Using$
                      - kind: field_expression
                        regex: ^((_root_\.)?scala\.util\.)?Using(\.(resource|apply))?$
                - has:
                    field: arguments
                    has:
                      nthChild:
                        position: 1
                        ofRule:
                          not:
                            any:
                              - kind: comment
                              - kind: block_comment
                      matches: plain-ois-instance
  # Nodes that bind the name captured as $STREAM again, shared by both source
  # kinds. A hit is dropped when such a node sits between the use and its
  # source: strictly inside the source and an ancestor of the use. The name
  # cannot go in a stopBy: ast-grep matches a stopBy rule with a fresh
  # metavariable environment, so $STREAM there matches any identifier; a
  # `not: inside` keeps the environment. Scope boundaries (tree-sitter-scala):
  # block: a direct val/var child whose `pattern` field is the name;
  # function_definition: a `parameter` whose `name` field is the name (the
  # default_value and type fields are not inspected); lambda_expression: an
  # identifier parameter or a `binding` named like it; case_clause: the name
  # anywhere in the `pattern` field. A binding after the use in the same block,
  # a class parameter and a for generator are known misses.
  scope-rebinds-stream:
    any:
      - kind: block
        has:
          any:
            - kind: val_definition
              not:
                has:
                  field: value
                  matches: plain-ois-instance
            - kind: var_definition
          has:
            field: pattern
            kind: identifier
            pattern: $STREAM
      - kind: function_definition
        has:
          field: parameters
          kind: parameters
          has:
            kind: parameter
            has:
              field: name
              kind: identifier
              pattern: $STREAM
      - kind: lambda_expression
        not:
          matches: using-source
        has:
          field: parameters
          any:
            - kind: identifier
              pattern: $STREAM
            - kind: bindings
              has:
                kind: binding
                has:
                  field: name
                  kind: identifier
                  pattern: $STREAM
      - kind: case_clause
        has:
          field: pattern
          has:
            stopBy: end
            kind: identifier
            pattern: $STREAM
  plain-ois-instance:
    kind: instance_expression
    all:
      - has:
          nthChild:
            position: 1
            ofRule:
              not:
                any:
                  - kind: comment
                  - kind: block_comment
          any:
            - kind: type_identifier
            - kind: stable_type_identifier
          regex: (^|\.)ObjectInputStream$
      - not:
          has:
            kind: template_body
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: field_expression
        all:
          - has:
              field: field
              kind: identifier
              regex: ^readObject$
          - has:
              field: value
              any:
                - matches: plain-ois-instance
                - kind: identifier
                  pattern: $STREAM
    - any:
        - has:
            field: function
            has:
              field: value
              matches: plain-ois-instance
        - all:
            - inside:
                stopBy: end
                matches: val-source
            - not:
                inside:
                  stopBy:
                    any:
                      - matches: val-source
                      - matches: using-source
                  matches: scope-rebinds-stream
                  inside:
                    stopBy: end
                    matches: val-source
        - all:
            - inside:
                stopBy: end
                matches: using-source
            - not:
                inside:
                  stopBy:
                    any:
                      - matches: val-source
                      - matches: using-source
                  matches: scope-rebinds-stream
                  inside:
                    stopBy: end
                    matches: using-source
