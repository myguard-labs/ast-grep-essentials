# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: scala-sys-process-dynamic-command-scala
language: scala
severity: warning
message: >-
  A scala.sys.process command is built from a string that is interpolated or
  concatenated at run time and then executed with the `!`, `!!` or `run`
  family of process operators. The process library splits that string on whitespace, so a value that
  carries spaces, quotes or option-like text changes the program name or its
  arguments. Pass the program and each argument as separate elements of a Seq
  or Process(Seq(...)) and validate or allow-list any value that comes from a
  request, file or environment.
note: >-
  [CWE-78]: Improper Neutralization of Special Elements used in an OS Command
  [OWASP A05:2025] [A03:2021]: Injection
  [REFERENCES]
      - https://cwe.mitre.org/data/definitions/78.html
      - https://owasp.org/Top10/A03_2021-Injection
  Matches `s"..."`, `f"..."` or `raw"..."` with an interpolation, or a `+`
  concatenation that has a non-literal operand on either side, run through
  `.!`, `.!!`, `.!<`, `.!!<`, `.run`, `.lazyLines`, or the postfix spelling
  `cmd !` and `cmd !!`, and the infix spelling with a logger or an input
  such as `cmd ! ProcessLogger(...)` (the left operand is checked). Both the direct string and the argument of
  `Process(...)` are checked, including the qualified spellings
  `process.Process`, `sys.process.Process`, `scala.sys.process.Process` and
  `_root_.scala.sys.process.Process`. An alias import such as
  `import scala.sys.process.{Process => P}` is a known miss. A literal command
  and an argument Seq are not reported. A plain identifier receiver is not
  reported because its origin cannot be told from syntax alone. An operand that only
  calls a method on a string literal, such as `"ls " + "-l".trim`, or an `s"..."`
  without an interpolation counts as literal; `"a" + "b".trim + x` is dynamic. A chained method on a literal, such as
  `"b".trim.toLowerCase` or `s"b".trim`, also counts as dynamic (a minor false
  positive). The unparenthesized `"ls " + dir ! logger` parses with `dir` as the
  infix left operand and is judged on that operand only.
utils:
  # An identifier that is not the interpolator of an interpolation-free
  # s/f/raw string and not a method name called on a string literal, so
  # "select 1" + "x".trim and s"a" + "b" are literal-only.
  non-literal-identifier:
    kind: identifier
    not:
      any:
        - nthChild: 1
          inside:
            kind: interpolated_string_expression
            not:
              has:
                stopBy: end
                kind: interpolation
        - inside:
            kind: field_expression
            has:
              field: value
              kind: string
          nthChild: 2
  dynamic-string:
    any:
      - kind: interpolated_string_expression
        all:
          - has:
              field: interpolator
              kind: identifier
              regex: ^(s|f|raw)$
          - has:
              stopBy: end
              kind: interpolation
      - kind: infix_expression
        all:
          - has:
              field: operator
              regex: ^\+$
          - has:
              stopBy: end
              matches: non-literal-identifier
  process-command:
    any:
      - matches: dynamic-string
      - kind: parenthesized_expression
        has:
          matches: dynamic-string
      - kind: call_expression
        all:
          - has:
              field: function
              any:
                - kind: identifier
                  regex: ^Process$
                - kind: field_expression
                  regex: ^(_root_\.)?((scala\.)?sys\.)?process\.Process$
          - has:
              field: arguments
              kind: arguments
              has:
                nthChild:
                  position: 1
                  ofRule:
                    not:
                      any:
                        - kind: comment
                        - kind: block_comment
                matches: dynamic-string
rule:
  any:
    - kind: field_expression
      all:
        - has:
            field: field
            regex: ^(!|!!|!<|!!<|run|lazyLines|lazyLines_!)$
        - has:
            field: value
            matches: process-command
    - kind: postfix_expression
      all:
        - has:
            kind: operator_identifier
            regex: ^(!|!!|!<|!!<)$
        - has:
            matches: process-command
    - kind: infix_expression
      all:
        - has:
            field: operator
            kind: operator_identifier
            regex: ^(!|!!|!<|!!<)$
        - has:
            field: left
            matches: process-command
