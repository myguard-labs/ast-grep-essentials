# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: scala-jdbc-dynamic-sql-scala
language: scala
severity: warning
message: >-
  A JDBC statement method receives SQL text that is interpolated with `s"..."`
  or concatenated with `+` at run time. A value that carries quotes or SQL
  syntax changes the query, which allows SQL injection. Use a
  PreparedStatement with `?` placeholders and bind each value with the typed
  setters, or a library interpolator that binds parameters, and allow-list any
  identifier that cannot be bound.
note: >-
  [CWE-89]: Improper Neutralization of Special Elements used in an SQL Command
  [OWASP A05:2025] [A03:2021]: Injection
  [REFERENCES]
      - https://cwe.mitre.org/data/definitions/89.html
      - https://owasp.org/Top10/A03_2021-Injection
  Matches executeQuery, executeUpdate, executeLargeUpdate, execute,
  addBatch, prepareStatement and prepareCall called with an `s`, `f` or `raw`
  interpolated string that has an interpolation, or a `+` concatenation with a
  non-literal operand on either side, also when the string, or the parenthesized
  concatenation, is followed by `.stripMargin`, `.trim` or `.stripLineEnd`. Literal SQL, `?` placeholders and
  parameter-binding interpolators such as `sql"..."` are not reported. A plain identifier
  argument is not reported because its origin cannot be told from syntax. An operand that only calls a method on a string literal, such as
  `"select 1" + "x".trim`, or an `s"..."` without an interpolation counts as
  literal; a chained method on a literal, such as `"b".trim.toLowerCase` or
  `s"b".trim`, counts as dynamic (a minor false positive). Known miss: `execute` and `addBatch` are matched on any receiver, so a
  non-JDBC `client.execute(s"key-$id")` is also reported, because the receiver
  type cannot be told from syntax.
utils:
  # An identifier that is not the interpolator of an interpolation-free
  # s/f/raw string and not a method name called on a string literal, so
  # "select 1" + "x".trim and s"a" + "b" are literal-only.
  non-literal-identifier:
    kind: identifier
    not:
      any:
        - nthChild: 1
          inside:
            kind: interpolated_string_expression
            not:
              has:
                stopBy: end
                kind: interpolation
        - inside:
            kind: field_expression
            has:
              field: value
              kind: string
          nthChild: 2
  dynamic-sql:
    any:
      - kind: interpolated_string_expression
        all:
          - has:
              field: interpolator
              kind: identifier
              regex: ^(s|f|raw)$
          - has:
              stopBy: end
              kind: interpolation
      - kind: infix_expression
        all:
          - has:
              field: operator
              regex: ^\+$
          - has:
              stopBy: end
              matches: non-literal-identifier
  paren-dynamic-sql:
    any:
      - matches: dynamic-sql
      - kind: parenthesized_expression
        has:
          matches: paren-dynamic-sql
  sql-trimmed:
    kind: field_expression
    all:
      - has:
          field: value
          matches: paren-dynamic-sql
      - has:
          field: field
          kind: identifier
          regex: ^(stripMargin|trim|stripLineEnd)$
  sql-argument:
    any:
      - matches: paren-dynamic-sql
      - matches: sql-trimmed
      - kind: call_expression
        has:
          field: function
          matches: sql-trimmed
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: field_expression
        has:
          field: field
          kind: identifier
          regex: ^(executeQuery|executeUpdate|executeLargeUpdate|execute|addBatch|prepareStatement|prepareCall)$
    - has:
        field: arguments
        kind: arguments
        has:
          nthChild:
            position: 1
            ofRule:
              not:
                any:
                  - kind: comment
                  - kind: block_comment
          matches: sql-argument
