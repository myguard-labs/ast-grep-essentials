id: scala-jwt-hardcoded-secret-scala
severity: warning
language: scala
message: >-
  A secret is hard-coded in the application. Secrets stored in source
  code, such as credentials, identifiers, and other types of sensitive data,
  can be leaked and used by internal or external malicious actors. It is
  recommended to rotate the secret and retrieve them from a secure secret
  vault or Hardware Security Module (HSM), alternatively environment
  variables can be used if allowed by your company policy.
note: >-
  [CWE-798]: Use of Hard-coded Credentials
  [OWASP A07:2021]: Identification and Authentication Failures
  [REFERENCES]
      - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures

ast-grep-essentials: true

utils:
  call_expression_HMAC256:
    kind: call_expression
    all:
      - has:
          kind: field_expression
          nthChild: 1
          all:
            - has:
                kind: identifier
                field: value
                nthChild: 1
                regex: ^(Algorithm)$
            - has:
                kind: identifier
                field: field
                nthChild: 2
                regex: ^(HMAC256)$
      - has:
          kind: arguments
          nthChild: 2
          has:
            nthChild:
              position: 1
              ofRule:
                not:
                  kind: comment
            kind: identifier
            pattern: $STRG

  call_expression_HMAC256_no_import:
    kind: call_expression
    all:
      - has:
          kind: field_expression
          nthChild: 1
          regex: ^(com\.auth0\.jwt\.algorithms\.Algorithm\.(HMAC256|HMAC512|HMAC384))$
      - has:
          kind: arguments
          nthChild: 2
          has:
            nthChild:
              position: 1
              ofRule:
                not:
                  kind: comment
            kind: identifier
            pattern: $STRG

rule:
  any:
    - kind: call_expression
      all:
        - has:
            kind: field_expression
            nthChild: 1
            regex: ^(com.auth0.jwt.algorithms.Algorithm.HMAC256|com.auth0.jwt.algorithms.Algorithm.HMAC384|com.auth0.jwt.algorithms.Algorithm.HMAC512)$
            precedes:
              kind: arguments
              not:
                has:
                  nthChild:
                    position: 2
                    ofRule:
                      not:
                        kind: comment
              has:
                nthChild:
                  position: 1
                  ofRule:
                    not:
                      kind: comment
                kind: string
                not:
                  regex: ^""$
    - kind: call_expression
      all:
        - has:
            kind: field_expression
            regex: ^(Algorithm.HMAC256|Algorithm.HMAC384|Algorithm.HMAC512)$
            precedes:
              kind: arguments
              has:
                kind: string
                nthChild:
                  position: 1
                  ofRule:
                    not:
                      kind: comment
                not:
                  regex: ^""$
              not:
                has:
                  nthChild:
                    position: 2
                    ofRule:
                      not:
                        kind: comment
        - inside:
            stopBy: end
            follows:
              stopBy: end
              kind: import_declaration
              pattern: import com.auth0.jwt.algorithms.Algorithm
    - kind: class_definition
      has:
        kind: template_body
        has:
          any:
            - kind: val_definition
            - kind: assignment_expression
          all:
            - has:
                nthChild: 1
                kind: identifier
                pattern: $STRG
            - has:
                nthChild: 2
                kind: string
                not:
                  regex: ^""$
            - precedes:
                stopBy: end
                kind: function_definition
                has:
                  kind: block
                  has:
                    any:
                      - matches: call_expression_HMAC256
                      - kind: val_definition
                        has:
                          nthChild: 2
                          matches: call_expression_HMAC256

      follows:
        stopBy: end
        kind: import_declaration
        pattern: import com.auth0.jwt.algorithms.Algorithm
    - kind: class_definition
      has:
        kind: template_body
        has:
          any:
            - kind: val_definition
            - kind: assignment_expression
          all:
            - has:
                nthChild: 1
                kind: identifier
                pattern: $STRG
            - has:
                nthChild: 2
                kind: string
                not:
                  regex: ^""$
            - precedes:
                stopBy: end
                kind: function_definition
                has:
                  kind: block
                  has:
                    any:
                      - matches: call_expression_HMAC256_no_import
                      - kind: val_definition
                        has:
                          nthChild: 2
                          matches: call_expression_HMAC256_no_import
metadata:
  created_at: '2026-09-11'
  source: 'CodeRabbit'
  modified_by: 'MyGuard'
