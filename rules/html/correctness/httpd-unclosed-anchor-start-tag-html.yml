id: httpd-unclosed-anchor-start-tag-html
language: html
severity: warning
message: 'Anchor start tag is missing its closing ''>'' before the next tag opener.'
note: >-
  Syntactic check only. It matches start_tag nodes whose text begins with an
  <a> tag and contains a '<' before any '>'. It does not verify the parser's
  error recovery, element nesting, or rendered output.
rule:
  kind: start_tag
  regex: '(?i)^<a\s[^>]*<'
