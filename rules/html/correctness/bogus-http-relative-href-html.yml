# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: bogus-http-relative-href-html
language: html
severity: warning
message: 'This href value uses "http:" without "//", which is a malformed link.'
note: >-
  Syntactic check on the literal href attribute value only; it does not
  resolve URLs, base hrefs, or runtime values.
rule:
  kind: attribute
  has:
    kind: attribute_name
    regex: '^href$'
  all:
    - has:
        kind: quoted_attribute_value
        regex: '^"http:[^/]'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: a single-quoted (<a href=''http:foo.html''>), upper-case HREF or unquoted (<a href=http:foo.html>) attribute and an upper-case scheme (href="HTTP:foo.html") are not reported, only double-quoted lower-case href with http: is matched'
    - 'FN: a single-slash form (<a href="http:/foo.html">) is not reported, the regex needs a non-slash after http:'
