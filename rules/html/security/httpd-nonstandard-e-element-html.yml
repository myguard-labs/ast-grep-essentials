# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: httpd-nonstandard-e-element-html
language: html
severity: warning
message: 'Element <e> is not a recognised HTML element; did you mean <em>?'
note: >-
  Matches the literal start tag name e syntactically; does not verify the
  document context or resolve rendering semantics.
rule:
  kind: start_tag
  has:
    kind: tag_name
    regex: '^e$'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
