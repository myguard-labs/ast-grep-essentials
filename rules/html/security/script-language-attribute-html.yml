id: script-language-attribute-html
language: html
severity: warning
message: >-
  Remove the deprecated language attribute from the script tag; use type
  instead.
note: >-
  Syntactic check on a single script start tag with a literal language
  attribute; it does not evaluate runtime script behavior or the declared
  type.
rule:
  pattern: '<script language="$VALUE">$$$BODY</script>'
