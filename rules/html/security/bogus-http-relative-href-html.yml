# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: bogus-http-relative-href-html
language: html
severity: warning
message: 'This href value uses "http:" without "//", which is a malformed link.'
note: >-
  Syntactic check on the literal href attribute value only; it does not
  resolve URLs, base hrefs, or runtime values.
rule:
  kind: attribute
  has:
    kind: attribute_name
    regex: '^href$'
  all:
    - has:
        kind: quoted_attribute_value
        regex: '^"http:[^/]'
metadata:
  rule_modified_at: '2026-10-16'
