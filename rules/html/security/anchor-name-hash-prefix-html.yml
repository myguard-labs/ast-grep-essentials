# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: anchor-name-hash-prefix-html
language: html
severity: warning
message: >-
  This anchor's name attribute starts with '#', so the name cannot be targeted
  as a fragment.
note: >-
  Syntactic check only. It flags an a element whose name attribute value
  literally begins with '#' and does not evaluate attribute values computed at
  runtime or resolve link targets.
rule:
  kind: element
  all:
    - has:
        kind: start_tag
        has:
          kind: tag_name
          regex: '^a$'
          stopBy: end
    - has:
        kind: attribute
        stopBy: end
        all:
          - has:
              kind: attribute_name
              regex: '^name$'
          - has:
              kind: quoted_attribute_value
              regex: '^["'']#'
metadata:
  rule_modified_at: '2026-10-16'
