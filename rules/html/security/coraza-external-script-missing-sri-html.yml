id: coraza-external-script-missing-sri-html
language: html
severity: warning
message: >-
  External script loaded from an absolute http(s) URL without an integrity
  attribute; add a Subresource Integrity hash.
note: >-
  Syntactic check only. Matches a script element whose src starts with http://
  or https:// and that has no integrity attribute on the same start tag. It
  does not verify the hash value, the crossorigin attribute, or whether the
  script is loaded elsewhere.
rule:
  pattern: '<script src="$SRC"></script>'
  all:
    - regex: 'src="https?://'
    - not:
        has:
          pattern: 'integrity="$INT"'
          stopBy: end
