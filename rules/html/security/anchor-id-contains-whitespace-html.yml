# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: anchor-id-contains-whitespace-html
language: html
severity: warning
message: >-
  This anchor id contains whitespace, so a fragment link to it cannot target
  it.
note: >-
  Matches a literal a element whose id attribute value contains a space
  character in the shown syntax; it does not check whether any link actually
  references the id.
rule:
  kind: element
  all:
    - has:
        kind: start_tag
        has:
          kind: tag_name
          regex: '^a$'
    - has:
        kind: start_tag
        has:
          kind: attribute
          regex: '^id=[''"][^''"]*\s[^''"]*[''"]$'
metadata:
  rule_modified_at: '2026-10-14'
  ast_grep_tested_version: 0.50.0
