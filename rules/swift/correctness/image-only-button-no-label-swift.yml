id: image-only-button-no-label-swift
language: swift
severity: warning
message: >-
  Image-only Button has no accessibilityLabel; VoiceOver will read the SF
  Symbol name instead of the action.
note: >-
  Syntactic check within a single Button expression. It only recognizes an
  accessibilityLabel modifier applied directly to the Button call. Labels
  applied further along the modifier chain or on enclosing containers are not
  seen.
rule:
  all:
    - kind: call_expression
    - has:
        kind: simple_identifier
        regex: '^Button$'
    - has:
        kind: lambda_literal
        stopBy: end
        regex: '^\{\s*Image\(systemName:[^{}]*\)\s*\}$'
    - not:
        inside:
          kind: navigation_expression
          has:
            kind: navigation_suffix
            regex: accessibilityLabel
