id: swift-callback-invoked-under-lock
language: swift
severity: warning
message: >-
  Optional callback is invoked inside a withLock closure; capture it under the
  lock and call it after releasing the lock.
note: >-
  Purely syntactic match on a call of the form name?() located inside a
  withLock trailing closure body. It does not resolve whether name is a stored
  closure property, whether the receiver is a lock, or whether the callback
  re-enters the same object.
rule:
  all:
    - pattern: '$CB?()'
      inside:
        pattern: '$LOCK.withLock { $$$BODY }'
        stopBy: end
