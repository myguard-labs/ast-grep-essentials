# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: swift-uiwebview-use
language: swift
severity: warning
message: >-
  UIWebView is deprecated and lacks WKWebView process isolation; migrate to WKWebView.
note: >-
  [CWE-749]: Exposed Dangerous Method or Function
  [OWASP A05:2021]: Security Misconfiguration
  Matches the identifier UIWebView used as a type or constructor by name without resolving imports.
rule:
  any:
    - kind: simple_identifier
    - kind: type_identifier
  regex: '^UIWebView$'
metadata:
  created_at: '2026-11-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-749'
  owasp: 'A02:2025|A05:2021'
  category: 'security'
