id: reactorkit-asyncafter-fixed-delay-swift
language: swift
severity: warning
message: >-
  DispatchQueue.main.asyncAfter with a fixed delay fulfils an expectation;
  await a deterministic signal instead of sleeping.
note: >-
  Purely syntactic match on a literal DispatchQueue.main.asyncAfter call with
  a .now() + delay deadline whose trailing closure calls
  expectation.fulfill(). It does not resolve types, imports, or runtime
  values.
rule:
  pattern: |
    DispatchQueue.main.asyncAfter(deadline: .now() + $DELAY) {
      expectation.fulfill()
    }
