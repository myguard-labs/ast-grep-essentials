id: swift-try-optional-setattributes-discarded
language: swift
severity: warning
message: >-
  A try? expression discards the error from FileManager.default.setAttributes;
  handle the failure so file permissions are known to be applied.
note: >-
  Matches the literal receiver syntax FileManager.default.setAttributes
  wrapped in try? without resolving types, imports, or runtime values; it
  cannot confirm the receiver is a FileManager instance.
rule:
  pattern: 'try? FileManager.default.setAttributes($$$ARGS)'
