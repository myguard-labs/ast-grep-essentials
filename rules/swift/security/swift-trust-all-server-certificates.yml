# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: swift-trust-all-server-certificates
language: swift
severity: warning
message: >-
  The authentication challenge handler accepts the server trust with .useCredential without a guarding evaluation; call SecTrustEvaluateWithError first.
note: >-
  [CWE-295]: Improper Certificate Validation
  [OWASP A07:2021]: Identification and Authentication Failures
  Matches a completion call of the form handler(.useCredential, URLCredential(trust: ...)) that is not in the then-block of an if whose condition is a non-negated SecTrustEvaluate* call (the else branch and a negated check are still reported) and does not follow a guard whose condition is such a call; a call that ignores the evaluation result (for example _ = SecTrustEvaluateWithError(...)) is still reported, and evaluation done in a helper defined elsewhere or inside a compound && / == condition is not seen. Scope: it matches the literal .useCredential with an inline URLCredential(trust:); fully qualified dispositions and credentials built into a variable first are not covered.
utils:
  evaluated-condition:
    has:
      kind: call_expression
      has:
        kind: simple_identifier
        regex: '^SecTrustEvaluate'
rule:
  pattern: '$HANDLER(.useCredential, URLCredential(trust: $TRUST))'
  not:
    any:
      - inside:
          kind: statements
          stopBy: end
          not:
            follows:
              kind: statements
              stopBy: end
          inside:
            kind: if_statement
            matches: evaluated-condition
      - follows:
          kind: guard_statement
          stopBy: end
          matches: evaluated-condition
      - inside:
          stopBy: end
          follows:
            kind: guard_statement
            stopBy: end
            matches: evaluated-condition
metadata:
  created_at: '2026-11-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-295'
  owasp: 'A07:2025|A07:2021'
  category: 'security'
