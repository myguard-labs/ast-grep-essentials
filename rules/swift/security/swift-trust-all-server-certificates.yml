# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: swift-trust-all-server-certificates
language: swift
severity: warning
message: >-
  The authentication challenge handler accepts the server trust with .useCredential without evaluating it; call SecTrustEvaluateWithError first.
note: >-
  [CWE-295]: Improper Certificate Validation
  [OWASP A07:2021]: Identification and Authentication Failures
  Matches a completion call of the form handler(.useCredential, URLCredential(trust: ...)) that is not inside a function containing SecTrustEvaluate; it cannot see evaluation done in a helper defined elsewhere.
rule:
  pattern: '$HANDLER(.useCredential, URLCredential(trust: $TRUST))'
  not:
    inside:
      kind: function_declaration
      stopBy: end
      has:
        stopBy: end
        kind: simple_identifier
        regex: '^SecTrustEvaluate'
metadata:
  created_at: '2026-11-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-295'
  owasp: 'A07:2025|A07:2021'
  category: 'security'
