id: dont-call-system-cpp
language: cpp
severity: warning
message: Avoid direct calls to system because they execute commands through a shell.
note: >-
  This rule matches syntactically unqualified calls named system, including
  local variable initializers. It excludes member calls and does not resolve
  the callee or determine whether command injection is possible.
rule:
  pattern: 'system($$$ARGS)'
metadata:
  rule_modified_at: '2026-10-05'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-05'
