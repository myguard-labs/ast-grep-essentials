id: insecure-hash-cpp
language: cpp
severity: warning
message: This call explicitly selects a weak hashing algorithm.
note: >-
  This rule detects explicit weak-hash function names and literal algorithm
  selections in a single file. It does not determine security relevance,
  resolve symbols, or track algorithm names through variables.
rule:
  kind: call_expression
  regex: >-
    ^(?:(?:EVP_md2|MD2|MD2_Final|MD2_Init|MD2_Update|MD2_options|EVP_md4|MD4|MD4_Final|MD4_Init|MD4_Transform|MD4_Update|EVP_md5|MD5|MD5_Final|MD5_Init|MD5_Transform|MD5_Update|EVP_sha1|SHA1_Final|SHA1_Init|SHA1_Transform|SHA1_Update)\s*\(|EVP_get_digestbyname\s*\(\s*"(?:MD2|MD4|MD5|SHA1|SHA-1)"\s*\)|EVP_MD_fetch\s*\([^,]*,\s*"(?:MD2|MD4|MD5|SHA1|SHA-1)"\s*,|gcry_md_(?:open|enable|read|extract|hash_buffers|hash_buffer)\s*\([^()]*\bGCRY_MD_(?:MD2|MD4|MD5|SHA1)\b)
metadata:
  rule_modified_at: '2026-10-05'
  ast_grep_tested_version: 0.45.3
  validated_at: '2026-10-05'
  created_at: '2026-09-11'
  source: 'CodeRabbit'
  modified_by: MyGuard
  license: Apache-2.0
ast-grep-essentials: true
