id: std-return-data-cpp
language: cpp
severity: warning
message: >-
  Returning data() from a preceding local container declaration may leave a
  dangling pointer after the function returns.
note: >-
  This rule checks direct return syntax and a preceding non-static declaration
  in the same block. It does not resolve names, types, aliases, ownership, or
  runtime lifetime.
rule:
  kind: return_statement
  pattern: 'return $VAR.data();'
  follows:
    stopBy: end
    all:
      - kind: declaration
      - has:
          nthChild: 1
          regex: '^(std::string|vector<.*>|std::vector<.*>|array<.*>|std::array<.*>)$'
      - has:
          stopBy: end
          kind: identifier
          pattern: '$VAR'
      - not:
          has:
            kind: storage_class_specifier
      - inside:
          kind: compound_statement
