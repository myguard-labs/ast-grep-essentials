id: missing-return-value-cpp
language: cpp
severity: warning
message: This non-void function has no return statement in its body.
note: >-
  Syntactic approximation only. Matches a function definition with a non-void
  return type whose body contains no return_statement node anywhere; it does
  not analyse control flow, so functions that always throw or exit, or that
  return via nested lambdas, are not distinguished.
rule:
  all:
    - kind: 'function_definition:has(> compound_statement)'
    - not:
        has:
          kind: return_statement
          stopBy: end
    - not:
        has:
          pattern: 'void $NAME($$$ARGS) $$$BODY'
          stopBy: end
    - not:
        has:
          kind: type_identifier
          regex: '^void$'
          stopBy: end
