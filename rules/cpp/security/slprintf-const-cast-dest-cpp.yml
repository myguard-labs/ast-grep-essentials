# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: slprintf-const-cast-dest-cpp
language: cpp
severity: warning
message: >-
  C-style cast to non-const char pointer passed as the destination of
  slprintf; review for writes into read-only memory.
note: >-
  Purely syntactic check on a literal slprintf call whose first argument is a
  C-style cast to char pointer. It does not resolve types, const-ness of the
  cast operand, or whether the destination is writable at runtime.
rule:
  pattern: 'slprintf((char*)$DST, $$$ARGS)'
