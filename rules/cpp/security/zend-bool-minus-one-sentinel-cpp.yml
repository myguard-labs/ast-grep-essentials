id: zend-bool-minus-one-sentinel-cpp
language: cpp
severity: warning
message: >-
  A zend_bool is initialized from the cast (zend_bool)-1, which yields 255 and
  can collide with a real value used as a sentinel.
note: >-
  Purely syntactic match on a C-style cast of the literal -1 to zend_bool
  inside a declaration initializer. It does not verify that the variable is
  used as a sentinel or resolve the zend_bool type.
rule:
  pattern: 'zend_bool $VAR = (zend_bool)-1;'
