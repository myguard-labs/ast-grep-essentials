id: null-library-function-cpp
language: cpp
severity: warning
message: >-
  A library function that may return NULL is dereferenced or passed directly to a
  library function that requires a valid pointer, without a NULL check.
note: >-
  [CWE-476] NULL Pointer Dereference. [REFERENCES]
      - https://wiki.sei.cmu.edu/confluence/display/c/EXP34-C.+Do+not+dereference+null+pointers
ast-grep-essentials: true
constraints:
  FORMAT:
    matches: percent-s-format
  OPERAND:
    any:
    - matches: null-return-operand
    - kind: assignment_expression
      has:
        field: right
        matches: null-return-operand
utils:
  null-return-call:
    kind: call_expression
    has:
      field: function
      regex: ^\(*\s*(?:(?:::\s*|std\s*::\s*)?(?:fgets|fopen|getenv|getgrent|getgrgid|getgrnam|getlogin|getpwent|getpwnam|getpwuid|getpwuuid|gets|inet_ntop|realpath|tempnam|tmpfile|tmpnam|memchr|strcasestr_l|strcasestr|strchr|strnstr|strpbrk|strrchr|strstr|strtok_r|strtok))\s*\)*$
  null-return-paren-one:
    kind: parenthesized_expression
    has:
      stopBy: neighbor
      matches: null-return-call
  null-return-paren-two:
    kind: parenthesized_expression
    has:
      stopBy: neighbor
      matches: null-return-paren-one
  null-return-operand:
    any:
    - matches: null-return-call
    - matches: null-return-paren-one
    - matches: null-return-paren-two
  nullable-consumed-operand:
    any:
    - matches: null-return-operand
    - kind: assignment_expression
      has:
        field: right
        matches: null-return-operand
  percent-s-format:
    any:
    - matches: percent-s-literal
    - kind: parenthesized_expression
      has:
        stopBy: neighbor
        matches: percent-s-literal
    - kind: parenthesized_expression
      has:
        stopBy: neighbor
        kind: parenthesized_expression
        has:
          stopBy: neighbor
          matches: percent-s-literal
  percent-s-literal:
    any:
    - kind: string_literal
      regex: ^"(?:[^%"\\]|%%)*%(?:[0-9]+)?(?:\.[0-9]+)?s
    - kind: raw_string_literal
      regex: ^R"[^()\\\s]{0,16}\((?:[^%)]|%%)*%(?:[0-9]+)?(?:\.[0-9]+)?s
    - kind: concatenated_string
      regex: ^"(?:[^%"\\]|%%)*%(?:[0-9]+)?(?:\.[0-9]+)?s
    - kind: concatenated_string
      regex: ^"(?:[^%"\\]|%%)*%"\s*"s
labels:
  OPERAND:
    style: secondary
rule:
  all:
  - not:
      inside:
        stopBy: end
        kind: ERROR
  - not:
      has:
        stopBy: end
        kind: ERROR
  - any:
    - kind: subscript_expression
      has:
        field: argument
        matches: null-return-operand
    - kind: field_expression
      has:
        field: argument
        matches: null-return-operand
    - kind: pointer_expression
      has:
        field: argument
        matches: null-return-operand
    - all:
      - pattern:
          context: void f() { $FPRINTF_ONLY($_, $FORMAT, $OPERAND); }
          selector: call_expression
      - has:
          field: function
          regex: ^\(*\s*(?:(?:std\s*)?::\s*)?fprintf\s*\)*$
    - all:
      - pattern:
          context: void f() { $FPRINTF_REST($_, $FORMAT, $OPERAND, $$$REST); }
          selector: call_expression
      - has:
          field: function
          regex: ^\(*\s*(?:(?:std\s*)?::\s*)?fprintf\s*\)*$
    - all:
      - pattern:
          context: void f() { $FWRITE($_, $_, $_, $OPERAND); }
          selector: call_expression
      - has:
          field: function
          regex: ^\(*\s*(?:(?:std\s*)?::\s*)?fwrite\s*\)*$
    - all:
      - matches: nullable-consumed-operand
      - nthChild: 1
      - inside:
          stopBy: neighbor
          kind: argument_list
          inside:
            stopBy: neighbor
            kind: call_expression
            has:
              field: function
              regex: ^\(*\s*(?:(?:std\s*)?::\s*)?(?:fprintf|bcopy|memccpy|memcpy|memmove|stpncpy|strcat|strcpy|strlcat|strlcpy|strncat|stpcpy|wcpcpy|wcpncpy|fwrite)\s*\)*$
    - all:
      - matches: nullable-consumed-operand
      - nthChild: 2
      - inside:
          stopBy: neighbor
          kind: argument_list
          inside:
            stopBy: neighbor
            kind: call_expression
            has:
              field: function
              regex: ^\(*\s*(?:(?:std\s*)?::\s*)?(?:fprintf|bcopy|memccpy|memcpy|memmove|stpncpy|strcat|strcpy|strlcat|strlcpy|strncat|stpcpy|wcpcpy|wcpncpy)\s*\)*$
    - all:
      - pattern:
          context: void f() { $FIRST_ONLY($OPERAND); }
          selector: call_expression
      - has:
          field: function
          regex: ^\(*\s*(?:(?:std\s*)?::\s*)?(?:atof|atoi|atol|atoll|getc|ftell|ftello|rewind|strlen)\s*\)*$
    - all:
      - pattern:
          context: void f() { $FIRST_REST($OPERAND, $$$REST); }
          selector: call_expression
      - has:
          field: function
          regex: ^\(*\s*(?:(?:std\s*)?::\s*)?(?:atol_l|atoll_l|fgetpos|fseek|fseeko|fsetpos|strtoimax|strtod|strtol|strtoul|strtoll|strtoq)\s*\)*$
