id: string-view-temporary-string-cpp
language: cpp
severity: warning
message: >-
  This `std::string_view` is constructed from a temporary `std::string`.
  The `std::string` value is immediately destroyed after assignment and
  accessing data through the `std::string_view` will trigger a
  use-after-free.
note: >-
  [CWE-416] Use After Free.
  [REFERENCES]
      - https://wiki.sei.cmu.edu/confluence/display/cplusplus/MEM50-CPP.+Do+not+access+freed+memory

ast-grep-essentials: true

utils:
  UPSTREAM_UTIL_001:
    # $VAR = std::to_string(...);
    kind: expression_statement
    has:
      stopBy: neighbor
      kind: assignment_expression
      all:
        - has:
            stopBy: neighbor
            kind: identifier
            regex: ^(string_view|wstring_view)$
        - has:
            stopBy: neighbor
            kind: call_expression
            all:
              - has:
                  stopBy: neighbor
                  kind: qualified_identifier
                  regex: ^std::to_string$
              - has:
                  stopBy: neighbor
                  kind: argument_list

  UPSTREAM_UTIL_002:
    # $VAR = std::to_string(...);
    kind: expression_statement
    has:
      stopBy: neighbor
      kind: assignment_expression
      all:
        - has:
            stopBy: neighbor
            kind: identifier
            regex: ^(string_view|wstring_view)$
        - has:
            stopBy: neighbor
            kind: call_expression
            all:
              - has:
                  stopBy: neighbor
                  kind: field_expression
                  regex: ^(string.substr|wstring.substr)$
              - has:
                  stopBy: neighbor
                  kind: argument_list

  UPSTREAM_UTIL_003:
    #  $VAR = $EXPR + ...
    kind: expression_statement
    has:
      stopBy: neighbor
      kind: assignment_expression
      all:
        - has:
            stopBy: neighbor
            kind: identifier
            regex: ^(string_view|wstring_view)$
        - has:
            stopBy: neighbor
            kind: binary_expression
            has:
              stopBy: neighbor
              kind: identifier
              regex: ^(wstring|string)$
              nthChild: 1

  UPSTREAM_UTIL_004:
    #  $VAR = "..." + $EXPR
    kind: expression_statement
    has:
      stopBy: neighbor
      kind: assignment_expression
      all:
        - has:
            stopBy: neighbor
            kind: identifier
            regex: ^(string_view|wstring_view)$
        - has:
            stopBy: end
            kind: binary_expression
            all:
              - has:
                  stopBy: end
                  kind: string_literal
                  nthChild: 1
              - has:
                  stopBy: end
                  kind: identifier
                  regex: ^(string|wstring)$

  UPSTREAM_UTIL_005:
    # $VAR_instance = "..." + $EXPR
    kind: expression_statement
    all:
      - has:
          stopBy: neighbor
          kind: assignment_expression
          all:
            - has:
                stopBy: neighbor
                kind: identifier
                pattern: $VAR_INSTANCE
            - has:
                stopBy: neighbor
                kind: binary_expression
                all:
                  - has:
                      stopBy: neighbor
                      kind: string_literal
                  - has:
                      stopBy: neighbor
                      kind: identifier
                      pattern: $EXPR_INSTANCE
      - any:
          - inside:
              stopBy: end
              follows:
                stopBy: end
                kind: declaration
                all:
                  - has:
                      stopBy: neighbor
                      regex: ^(wstring|string|std::wstring|std::string|std::basic_string<.*>|basic_string<.*>)$
                      nthChild: 1
                  - has:
                      stopBy: end
                      kind: identifier
                      pattern: $EXPR_INSTANCE
          - follows:
              stopBy: end
              any:
                - kind: field_declaration
                - kind: declaration
              all:
                - has:
                    stopBy: neighbor
                    regex: ^(wstring|string|std::wstring|std::string|std::basic_string<.*>|basic_string<.*>)$
                    nthChild: 1
                - has:
                    stopBy: end
                    kind: identifier
                    pattern: $EXPR_INSTANCE
          - follows:
              stopBy: end
              any:
                - kind: field_declaration
                - kind: declaration
              all:
                - has:
                    stopBy: neighbor
                    any:
                      - kind: type_identifier
                      - kind: qualified_identifier
                    regex: ^(wstring|string|std::wstring|std::string|std::basic_string<.*>|basic_string<.*>)$
                - has:
                    stopBy: end
                    kind: init_declarator
                    has:
                      stopBy: end
                      kind: identifier
                      pattern: $EXPR_INSTANCE
      - any:
          - inside:
              stopBy: end
