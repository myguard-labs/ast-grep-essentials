# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: driver-delete-back-only-cpp
language: cpp
severity: warning
message: >-
  This delete applies only to the back() element of a container; other owned
  pointers may leak.
note: >-
  Matches the literal syntax delete X.back(); it does not verify container
  element ownership, types, or that other elements are left undeleted.
rule:
  pattern: 'delete $C.back()'
