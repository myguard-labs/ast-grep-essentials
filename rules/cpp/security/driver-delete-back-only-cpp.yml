# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: driver-delete-back-only-cpp
language: cpp
severity: warning
message: >-
  This delete applies only to the back() element of a container; other owned
  pointers may leak.
note: >-
  Matches the literal syntax delete X.back(); it does not verify container
  element ownership, types, or that other elements are left undeleted.
rule:
  pattern: 'delete $C.back()'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  cwe: 'CWE-401'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/401.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'Driver::~Driver() { while (!locs.empty()) { delete locs.back(); locs.pop_back(); } } (loop deletes every element but delete X.back() is still reported)'
  todo_cases:
    - 'FN: Driver::~Driver() { delete (locs.back()); } (parenthesised operand is not matched)'
    - 'FN: Driver::~Driver() { delete locs->back(); } (back() called through a pointer to the container is not matched)'
