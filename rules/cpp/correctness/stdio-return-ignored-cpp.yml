# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: stdio-return-ignored-cpp
language: cpp
severity: warning
message: >-
  Return value of a stdio call is discarded by using the call as a bare
  statement. These functions report failure or short transfers only through
  their result, so an ignored result lets the program continue with unread
  input, unwritten output or a file that was never removed or renamed.
note: >-
  [CWE-252]: Unchecked Return Value
  [OWASP A10:2025]
  Syntactic subset of cert-err33-c. A match is an expression statement whose
  call names fgets, fread, fwrite, fputs, fputc, fseek, fsetpos, fopen,
  tmpfile or setvbuf unqualified or as std::name, or remove/rename as ::name or
  std::name with the C argument count. An explicit (void) cast parses as a cast
  expression and is not matched. A same-named member function called without
  an object, or a user overload, is not told apart from the C function.
rule:
  kind: expression_statement
  has:
    kind: call_expression
    any:
      - has:
          field: function
          regex: '^(std::)?(fgets|fread|fwrite|fputs|fputc|fseek|fsetpos|fopen|tmpfile|setvbuf)$'
      - all:
          - has:
              field: function
              regex: '^(::|std::)remove$'
          - has:
              field: arguments
              not:
                has:
                  nthChild: 2
      - all:
          - has:
              field: function
              regex: '^(::|std::)rename$'
          - has:
              field: arguments
              has:
                nthChild: 2
