# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: missing-return-value-cpp
language: cpp
severity: warning
message: This non-void function has no return statement in its body.
note: >-
  Syntactic approximation only. Matches a function definition with a non-void
  return type whose body contains no return_statement node anywhere; it does
  not analyse control flow, so functions that always throw or exit, or that
  return via nested lambdas, are not distinguished.
rule:
  all:
    - kind: 'function_definition:has(> compound_statement)'
    - not:
        has:
          kind: return_statement
          stopBy: end
    - not:
        has:
          pattern: 'void $NAME($$$ARGS) $$$BODY'
          stopBy: end
    - not:
        has:
          kind: type_identifier
          regex: '^void$'
          stopBy: end
metadata:
  todo_cases:
    - 'Observed false positive (high noise): every void function without a return statement is reported'
    - 'Observed false positive: constructors and destructors with a body are reported'
    - 'Observed false positive: int main() { ... } without return (valid C++) is reported'
    - 'Observed false positive: a function whose body only throws or calls std::exit is reported'
    - 'Observed false positive: trailing-return auto f() -> void { ... } is reported'
    - 'Observed miss: int f() { auto l = [] { return 1; }; l(); } is not reported because the nested lambda return counts'
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
