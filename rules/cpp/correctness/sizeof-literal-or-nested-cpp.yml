id: sizeof-literal-or-nested-cpp
language: cpp
severity: warning
message: >-
  sizeof is applied to an integer literal or to another sizeof expression.
  The result is the size of int or of size_t, not the size of any object the
  code is working with, so the computed length is almost certainly wrong.
note: >-
  [CWE-682]: Incorrect Calculation
  Syntactic subset of bugprone-sizeof-expression. It matches sizeof whose
  operand, with or without parentheses, is a number literal or another sizeof
  expression. The pointer-this form is covered by sizeof-this-cpp. Sizeof of
  a pointer-typed variable or of a pointer arithmetic result needs type
  information and is not matched. Using sizeof on a literal only to get the
  size of its type is legitimate and is the dismissal.
rule:
  kind: sizeof_expression
  has:
    field: value
    any:
      - kind: number_literal
      - kind: sizeof_expression
      - kind: parenthesized_expression
        has:
          any:
            - kind: number_literal
            - kind: sizeof_expression
