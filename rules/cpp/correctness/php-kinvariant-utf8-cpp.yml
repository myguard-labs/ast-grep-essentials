# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: php-kinvariant-utf8-cpp
language: cpp
severity: warning
message: >-
  UnicodeString is built from a char buffer with the kInvariant tag;
  kInvariant does not decode UTF-8 input.
note: >-
  Syntactic match only. It flags a three-argument UnicodeString construction
  whose third argument is UnicodeString::kInvariant. It cannot tell whether
  the buffer holds UTF-8 bytes or ASCII literal data, and it does not check
  types, dataflow, or buffer provenance.
rule:
  pattern: 'UnicodeString($BUF, $LEN, UnicodeString::kInvariant)'
