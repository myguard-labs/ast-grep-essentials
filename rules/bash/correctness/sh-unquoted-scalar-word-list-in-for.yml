id: sh-unquoted-scalar-word-list-in-for
language: bash
severity: warning
message: >-
  for-in word list is an unquoted parameter expansion; its value is split on
  whitespace and glob-expanded.
note: >-
  Syntactic only. It matches an unquoted $var directly in the for-in word
  list. It cannot tell whether the variable holds a single value or is meant
  to be split on purpose, and it does not cover the ${var} form.
rule:
  kind: for_statement
  has:
    field: value
    kind: simple_expansion
