id: sh-pipe-printf-into-grep-q
language: bash
severity: 'off'
message: >-
  Deprecated rule ID; use sh-grep-quiet-pipe-under-pipefail. Piping printf
  output into grep -q can fail under pipefail when grep exits early and SIGPIPE
  hits the producer.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use sh-grep-quiet-pipe-under-pipefail and do not emit this rule.
rule:
  pattern: '$LEFT | grep $$$FLAGS'
  inside:
    kind: program
    stopBy: end
  has:
    pattern: '$FLAG'
    regex: '^-[A-Za-z]*q[A-Za-z]*$'
    kind: word
    stopBy: end
metadata:
  deprecated_alias_of: sh-grep-quiet-pipe-under-pipefail
