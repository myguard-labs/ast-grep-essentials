id: sh-jq-program-built-from-variable
language: bash
severity: warning
message: >-
  jq filter argument interpolates a shell variable; pass the value with --arg
  instead.
note: >-
  Syntactic only, single file. Flags a jq command with a double-quoted
  argument that has literal text before a shell expansion. Cannot confirm the
  argument is the jq program or that the value is unsafe, and --arg values may
  also match.
rule:
  kind: command
  all:
    - has:
        field: name
        regex: '^jq$'
    - has:
        kind: string
        regex: '^"[^"$]+\$[A-Za-z_{]'
