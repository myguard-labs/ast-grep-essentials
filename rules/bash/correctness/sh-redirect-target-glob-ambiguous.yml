id: sh-redirect-target-glob-ambiguous
language: bash
severity: warning
message: >-
  Output redirection target contains an unquoted glob wildcard; it may fail
  with an ambiguous redirect or write to an unintended file.
note: >-
  Syntactic check only. Matches an output file_redirect whose destination text
  contains a literal *, ? or bracket class and is not wholly quoted; it does
  not resolve filesystem matches, variable values, or quoting beyond the shown
  syntax.
rule:
  kind: file_redirect
  all:
    - regex: '^(\d*|&)>'
    - has:
        field: destination
        regex: '[*?]|\[[^\]]+\]'
    - not:
        has:
          kind: string
    - not:
        has:
          kind: raw_string
