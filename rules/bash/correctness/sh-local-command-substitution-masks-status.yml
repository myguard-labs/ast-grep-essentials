id: sh-local-command-substitution-masks-status
language: bash
severity: warning
message: >-
  A local declaration whose value is a command substitution hides the
  substitution's exit status. Declare the local first, then assign it in a
  separate statement.
note: >-
  Single-file syntactic check only. It matches a local declaration whose
  variable assignment value is a command substitution. It cannot determine
  whether the exit status is checked afterwards, whether set -e is active, or
  whether the output is used; those require control-flow context outside this
  syntax.
rule:
  all:
    - kind: declaration_command
    - regex: '^local\b'
    - has:
        kind: variable_assignment
        has:
          kind: command_substitution
