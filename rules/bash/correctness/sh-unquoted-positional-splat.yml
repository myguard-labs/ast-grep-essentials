# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-unquoted-positional-splat
language: bash
severity: 'off'
message: >-
  Deprecated rule ID; use sh-unquoted-star-argument. Unquoted positional
  parameter expansion as a command argument; quote it as "$@" to keep each
  argument intact.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use sh-unquoted-star-argument and do not emit this rule.
rule:
  kind: simple_expansion
  regex: '^\$\*$'
  inside:
    kind: command
metadata:
  deprecated_alias_of: sh-unquoted-star-argument
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
