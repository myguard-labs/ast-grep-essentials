# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-array-literal-comma-separator
language: bash
severity: warning
message: >-
  Bash array literal elements are separated by whitespace, not commas; this
  array has a comma directly after a double-quoted element.
note: >-
  Syntactic check only. It flags bash array literals whose text contains a
  double quote followed by a comma. It does not verify intent or runtime
  values, and it may miss unquoted elements or escaped quotes.
rule:
  kind: array
  regex: '"\s*,'
