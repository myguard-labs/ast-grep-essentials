# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-unquoted-positional-splat
language: bash
severity: warning
message: >-
  Unquoted positional parameter expansion as a command argument; quote it as
  "$@" to keep each argument intact.
note: >-
  Syntactic check only. Matches a bare $* word used as a command argument by
  literal shape; it does not verify runtime argument values or that the
  surrounding script intends otherwise.
rule:
  pattern: '$*'
  inside:
    kind: command
