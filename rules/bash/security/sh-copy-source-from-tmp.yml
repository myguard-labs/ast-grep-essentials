# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-copy-source-from-tmp
language: bash
severity: warning
message: >-
  This cp or mv copies a file whose literal source path starts under /tmp/, a
  shared writable directory.
note: >-
  Matches only a literal /tmp/ source operand in a cp or mv command by syntax;
  does not check file ownership, permissions, symlinks, or runtime values.
rule:
  all:
    - kind: command
    - pattern: '$CMD $$$ARGS'
    - has:
        field: name
        regex: '^(cp|mv)$'
    - has:
        kind: word
        regex: '^/tmp/'
