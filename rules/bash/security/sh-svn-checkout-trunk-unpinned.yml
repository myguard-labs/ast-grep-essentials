# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-svn-checkout-trunk-unpinned
language: bash
severity: warning
message: >-
  svn checkout from a trunk path follows a moving head; pin to a tag or
  revision.
note: >-
  Matches literal command syntax only (svn, checkout/co, an argument with a
  trunk path segment); it does not resolve aliases, wrappers, or whether a
  revision is pinned by other flags.
rule:
  all:
    - pattern: 'svn $SUB $$$ARGS'
    - has:
        regex: '(^|/)trunk(/|$)'
constraints:
  SUB:
    regex: '^(checkout|co)$'
