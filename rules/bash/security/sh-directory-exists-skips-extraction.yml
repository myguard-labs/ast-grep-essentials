id: sh-directory-exists-skips-extraction
language: bash
severity: warning
message: >-
  Extraction is skipped whenever the directory exists; a partial directory
  from an interrupted run will not be re-extracted.
note: >-
  Syntactic match only on a literal `[ -d ... ] || tar ...` line. It does not
  verify archive integrity, whether the directory is complete, or any other
  control flow.
rule:
  pattern: '[ -d $DIR ] || tar $$$ARGS'
