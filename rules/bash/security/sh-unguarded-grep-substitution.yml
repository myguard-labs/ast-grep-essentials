# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-unguarded-grep-substitution
language: bash
severity: warning
message: >-
  Command substitution running grep is assigned to a variable without a
  fallback; under set -e, grep exiting 1 on no match will abort the script.
note: >-
  Syntactic heuristic only. It matches a plain assignment whose value is a
  grep command substitution with no fallback in the shown syntax; it does not
  verify that set -e is active or that a no-match result is possible.
rule:
  kind: variable_assignment
  all:
    - has:
        kind: command_substitution
        pattern: '$(grep $$$ARGS)'
    - not:
        has:
          kind: command_substitution
          pattern: '$(grep $$$ARGS || $$$FALLBACK)'
