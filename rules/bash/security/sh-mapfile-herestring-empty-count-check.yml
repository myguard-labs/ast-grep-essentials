# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-mapfile-herestring-empty-count-check
language: bash
severity: warning
message: >-
  Array-length emptiness check after mapfile from a here-string never sees an
  empty array; test the source variable instead.
note: >-
  Matches a test containing an array-length expansion within a statement
  directly after a mapfile line that uses a here-string; it does not verify
  the array name matches or whether the source variable can be empty.
rule:
  kind: test_command
  regex: '\$\{#[A-Za-z_][A-Za-z0-9_]*\[@\]\}'
  inside:
    stopBy: end
    follows:
      regex: '^mapfile\b.*<<<'
