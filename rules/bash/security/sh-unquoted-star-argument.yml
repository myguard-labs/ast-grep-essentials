# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-unquoted-star-argument
language: bash
severity: warning
message: >-
  Unquoted $* as a command argument word-splits and globs; quote it as "$*" or
  use "$@" where appropriate.
note: >-
  Syntactic match only on a bare $* word outside double quotes; does not
  verify that the enclosing command or variable context is actually
  problematic.
rule:
  kind: simple_expansion
  regex: '^\$\*$'
  inside:
    kind: command
