id: sh-curl-exit-masked-by-pipe
language: bash
severity: warning
message: >-
  A curl call piped into another command inside a command substitution hides
  curl's exit status.
note: >-
  Single-file syntactic match on a literal curl command used as the left side
  of a pipeline inside $(...). It does not check pipefail settings,
  exit-status handling, or whether the result is used.
rule:
  pattern: '$(curl $$$ARGS | $$$REST)'
