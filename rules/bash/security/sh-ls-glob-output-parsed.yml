# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-ls-glob-output-parsed
language: bash
severity: warning
message: 'Avoid parsing ls output of a glob; iterate the glob directly instead.'
note: >-
  Matches a literal ls command whose argument contains a glob-style wildcard
  inside a process substitution. It does not resolve runtime values,
  filenames, or whether the substitution is used for parsing.
rule:
  all:
    - pattern: 'ls $$$ARGS'
    - inside:
        kind: process_substitution
        stopBy: end
    - has:
        pattern: '$GLOB'
        stopBy: end
        regex: '\*'
