id: sh-curl-pipe-shell
language: bash
severity: error
message: >-
  Remote script piped straight into a shell — the fetched bytes execute with no
  chance to inspect or verify them (OWASP A03:2025 Software Supply Chain
  Failures). A compromised host, a hijacked DNS answer or a MITM on the
  connection gets arbitrary code execution, and a truncated download executes
  half a script. Fetch to a file, verify a published checksum or signature, then
  run it.
note: >-
  Fires when curl writes its response to stdout, or wget explicitly selects
  stdout, and that stream reaches sh/bash/zsh/ksh/dash with no script path
  (including stdin-preserving shell options), or python/perl/ruby with `-`.
  Also covers sudo with any sequence or cluster of the common no-argument
  -E/-H/-n/-S options and short or long user selection. Arguments after an
  explicit stdin selector are program argv, so they remain covered. A terminal
  `--` with no script path also reads stdin. Commands that select an output
  file, interpreters given a script path or `-c`, and sudo tee/install do not
  match.
  Vendor install instructions use this shape; that is the reason to pin and
  verify locally rather than a reason to dismiss it. An interpreter given an
  inline script (python3 -c, perl -e) does not match: stdin is data there, not
  the code being run.
utils:
  argument-token:
    any:
      - kind: word
      - kind: string
      - kind: raw_string
  curl-value-option:
    matches: argument-token
    regex: '^["'']?(?:-[sSfLvikN]*(?:A|b|c|C|d|D|e|E|F|H|K|m|o|P|Q|r|t|T|u|U|w|x|X|y|Y|z)|--(?:header|user-agent|referer|cookie|cookie-jar|data|data-raw|data-binary|data-urlencode|form|form-string|url|request|user|proxy|proxy-user|output|output-dir|config|cacert|capath|cert|key|resolve|connect-to|upload-file|write-out|dump-header|max-time|connect-timeout))["'']?$'
  wget-value-option:
    matches: argument-token
    regex: '^["'']?(?:-(?:[bdqvFcNSxEkrKmpHL]|n[cdHpv])*(?:O|o|a|P|U|e|i|T|t|w|Q|A|B|D|I|R|X|l)|--(?:output-document|output-file|append-output|directory-prefix|user-agent|execute|input-file|timeout|tries|wait|quota|header|referer|user|password|post-data|post-file|load-cookies|save-cookies|ca-certificate|certificate|private-key))["'']?$'
  curl-output-option:
    all:
      - matches: argument-token
      - regex: '^["'']?(?:-[sSfLvikN]*[oO].*|--output(?:=.*)?|--remote-name|--remote-name-all|--remote-header-name)["'']?$'
      - not:
          follows: {matches: curl-value-option}
  curl-stdout-option:
    all:
      - matches: curl-output-option
      - any:
          - regex: '^["'']?(?:-[sSfLvikN]*o-|--output=-)["'']?$'
          - all:
              - regex: '^["'']?(?:-[sSfLvikN]*o|--output)["'']?$'
              - precedes:
                  matches: argument-token
                  regex: '^["'']?-["'']?$'
  wget-stdout-option:
    all:
      - matches: argument-token
      - not:
          follows: {matches: wget-value-option}
      - any:
          - regex: '^["'']?(?:-(?:[bdqvFcNSxEkrKmpHL]|n[cdHpv])*O-|--output-document=-)["'']?$'
          - all:
              - regex: '^["'']?(?:-(?:[bdqvFcNSxEkrKmpHL]|n[cdHpv])*O|--output-document)["'']?$'
              - precedes:
                  matches: argument-token
                  regex: '^["'']?-["'']?$'
  interpreter:
    regex: '^["'']?(sh|bash|zsh|ksh|dash|python|python3|perl|ruby)["'']?$'
  stdin-marker:
    regex: '^["'']?(-s|-)["'']?$'
  shell-with-stdin-options:
    regex: '^["'']?(sh|bash|zsh|ksh|dash)["'']?(\s+["'']?(-[abefhkmnptuvxBCEHPT]+|--(noprofile|norc|posix|restricted|verbose|noediting|login|debugger))["'']?)*(\s+["'']?-[abefhkmnptuvxBCEHPTs]*s[abefhkmnptuvxBCEHPTs]*["'']?(\s+.*)?|\s+["'']?--["'']?)?$'
  stdout-fetch:
    kind: command
    any:
      - all:
          - has: {field: name, regex: '^["'']?curl["'']?$'}
          - any:
              - has: {matches: curl-stdout-option}
              - not:
                  has: {matches: curl-output-option}
      - all:
          - has: {field: name, regex: '^["'']?wget["'']?$'}
          - has: {matches: wget-stdout-option}
  stdin-interpreter:
    kind: command
    any:
      # A direct, bare interpreter reads the pipe as program text.
      - all:
          - matches: interpreter
          - not:
              has: {field: argument, regex: '.+'}
      - all:
          - has: {field: name, matches: interpreter}
          - any:
              - has: {nthChild: 2, matches: stdin-marker}
              - matches: shell-with-stdin-options
      # Supported sudo options and user selectors can be interleaved before the
      # interpreter. A stdin selector may be followed by argv.
      - all:
          - has: {field: name, regex: '^sudo$'}
          - any:
              - regex: '^sudo(?:\s+(?:-[EHnS]+|-[EHnS]*u(?:\S+|\s+\S+)|--user(?:=\S+|\s+\S+)))*(?:\s+--)?\s+["'']?(?:sh|bash|zsh|ksh|dash)["'']?(?:\s+["'']?(?:-[abefhkmnptuvxBCEHPT]+|--(?:noprofile|norc|posix|restricted|verbose|noediting|login|debugger))["'']?)*(?:\s+["'']?-[abefhkmnptuvxBCEHPTs]*s[abefhkmnptuvxBCEHPTs]*["'']?(?:\s+.*)?|\s+["'']?--["'']?)?$'
              - regex: '^sudo(?:\s+(?:-[EHnS]+|-[EHnS]*u(?:\S+|\s+\S+)|--user(?:=\S+|\s+\S+)))*(?:\s+--)?\s+["'']?(?:python3?|perl|ruby)["'']?(?:\s+["'']?-["'']?(?:\s+.*)?)?$'
rule:
  kind: pipeline
  has:
    all:
      - matches: stdout-fetch
      - precedes:
          stopBy: end
          matches: stdin-interpreter
