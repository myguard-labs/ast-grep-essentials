id: sh-for-loop-over-ls-substitution
language: bash
severity: warning
message: >-
  Avoid looping over the output of ls; iterate over a glob directly so
  filenames are not word-split.
note: >-
  Matches a for loop whose word list is a backtick or $() command substitution
  running ls. It is purely syntactic and does not verify runtime filenames or
  behavior.
rule:
  kind: for_statement
  has:
    kind: command_substitution
    regex: '^(`|\$\()\s*ls\b'
