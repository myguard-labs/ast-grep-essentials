# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-curl-output-into-guarded-slot
language: bash
severity: warning
message: >-
  curl writes directly to a path that a preceding existence test guards; an
  interrupted download can leave a truncated file that later runs skip.
note: >-
  Syntactic match only. Matches a list command whose left side is a [ -f ]
  test and whose right side is a curl call with -o writing to the same literal
  variable path; it does not verify runtime file state, exit handling, or
  whether the file is ever cleaned up.
rule:
  pattern: '[ -f "$file" ] || curl $$$ARGS -o "$file" $$$REST'
