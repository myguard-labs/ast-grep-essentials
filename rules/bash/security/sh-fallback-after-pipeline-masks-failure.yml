id: sh-fallback-after-pipeline-masks-failure
language: bash
severity: warning
message: >-
  A `||` fallback after a pipeline only runs when the last command fails; an
  earlier pipeline stage failure is ignored.
note: >-
  Syntactic match only. Flags a command substitution whose body is a pipeline
  ending in a `|| ...` fallback; it does not check pipefail settings, set -o
  pipefail, or runtime exit statuses.
rule:
  pattern: '$($A | $B || $C)'
