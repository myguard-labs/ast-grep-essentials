id: sh-assign-builtin-word-then-args
language: bash
severity: warning
message: >-
  A bare builtin name is assigned as a word followed by more arguments, so the
  builtin does not run and the command substitution is likely missing.
note: >-
  Syntactic check only. Matches a variable assignment whose value is the bare
  word wait followed by further words in the same simple command; it does not
  resolve shell functions, aliases, or runtime behavior.
rule:
  kind: command
  has:
    kind: variable_assignment
    pattern: 'eret=wait'
  pattern: 'eret=wait $$$ARGS'
