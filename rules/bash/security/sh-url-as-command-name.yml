# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-url-as-command-name
language: bash
severity: warning
message: >-
  A URL is used as the command name of a simple command, so it will be
  executed as a program.
note: >-
  Syntactic match only. Flags a bash command whose command word is a literal
  http:// or https:// URL; it does not check whether the command exists or
  resolve runtime behavior.
rule:
  kind: command
  pattern: '$URL'
  has:
    field: name
    regex: '^https?://'
