id: sh-pipeline-grep-count-hides-producer-failure
language: bash
severity: 'off'
message: >-
  Deprecated rule ID; use sh-fallback-after-pipeline-masks-failure. A producer
  piped into grep -c that ends with || true treats a failing producer as a
  count of 0.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use sh-fallback-after-pipeline-masks-failure and do not emit
  this rule.
rule:
  pattern: '$($A | $B || $C)'
metadata:
  deprecated_alias_of: sh-fallback-after-pipeline-masks-failure
