# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-pipeline-grep-count-hides-producer-failure
language: bash
severity: warning
message: >-
  This command substitution pipes a producer into grep -c and ends with ||
  true, so a failing producer is silently treated as a count of 0.
note: >-
  Syntactic match only. It flags a command substitution whose pipeline has a
  producer piped into grep -c and ends with || true. It does not verify that
  the producer can fail or resolve which tool is invoked.
rule:
  pattern: '$($A | grep -c $$$ARGS || true)'
