id: sh-pipe-printf-into-grep-q
language: bash
severity: warning
message: >-
  Piping printf output into grep -q can fail under pipefail when grep exits
  early and SIGPIPE hits the producer; use a here-string or file instead.
note: >-
  Syntactic match only: flags a literal printf of a variable piped directly
  into a grep command with a -q-style flag. Does not verify pipefail is set,
  grep's exact flag semantics, or input size.
rule:
  pattern: 'printf $FMT $VAR | grep $$$ARGS'
