id: sh-redirect-target-glob-ambiguous
language: bash
severity: warning
message: >-
  Output redirection target contains an unquoted glob wildcard; it may fail
  with an ambiguous redirect or write to an unintended file.
note: >-
  Syntactic check only. Matches a file_redirect whose destination word
  contains a literal * or ? glob character; it does not resolve filesystem
  matches, variable values, or quoting context beyond the shown syntax.
rule:
  kind: file_redirect
  all:
    - has:
        field: destination
        regex: '[*?]'
    - not:
        has:
          kind: string
    - not:
        has:
          kind: raw_string
