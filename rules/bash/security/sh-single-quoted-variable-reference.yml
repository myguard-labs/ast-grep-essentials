# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-single-quoted-variable-reference
language: bash
severity: warning
message: >-
  A single-quoted argument contains a ${NAME} reference that will not be
  expanded.
note: >-
  Syntactic check only. Matches a single-quoted string literal containing a
  brace-form parameter reference; it does not determine whether the string is
  later passed through expansion or which command consumes it.
rule:
  kind: raw_string
  regex: '\$\{[A-Za-z_][A-Za-z0-9_]*\}'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
