id: sh-background-server-port-poll-no-liveness
language: bash
severity: warning
message: >-
  A background process pid is captured from $!, then a /dev/tcp port is polled
  in a loop with no later kill -0 liveness check on the pid.
note: >-
  Syntactic approximation only. It does not verify that the pid variable
  refers to the polled server, and it does not see a kill -0 placed before the
  loop, inside it, or in another scope.
rule:
  kind: for_statement
  all:
    - has:
        stopBy: end
        regex: '/dev/tcp/'
    - follows:
        stopBy: end
        kind: variable_assignment
        regex: '\$!'
    - not:
        precedes:
          stopBy: end
          regex: 'kill\s+-0'
