id: sh-array-unquoted-command-substitution
language: bash
severity: warning
message: >-
  Unquoted command substitution inside an array literal is subject to word
  splitting and pathname expansion; quote it or use mapfile/readarray.
note: >-
  Purely syntactic match on a command substitution that is a direct child of
  an array assignment's element list; it does not check whether the command
  output can actually contain spaces or glob characters, nor resolve types or
  aliases.
rule:
  pattern: '$(list_versions)'
  inside:
    kind: variable_assignment
    stopBy: end
    has:
      kind: array
      stopBy: end
  not:
    inside:
      kind: string
      stopBy: end
