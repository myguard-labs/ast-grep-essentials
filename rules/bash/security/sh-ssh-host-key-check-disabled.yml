# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-ssh-host-key-check-disabled
language: bash
severity: error
message: >-
  SSH host-key verification is disabled with StrictHostKeyChecking=no (or off/false). A
  machine-in-the-middle can impersonate the server and capture credentials or
  replace transferred data. Pin the host key in a managed known_hosts file and
  keep strict checking enabled.
note: >-
  Matches -o StrictHostKeyChecking=no and the joined -oStrictHostKeyChecking=no
  form (also the ssh_config space separator inside one quoted token, and the
  synonyms off and false) in the client-option region of direct or `command`-prefixed ssh, scp, or
  sftp commands, including quoted option tokens. Options following `--`, or
  immediately following an ordinary operand, are excluded so remote-command
  data is not mistaken for a client setting. This conservative boundary can
  miss an option after another option's separate value. It does not resolve
  other wrappers, aliases, config files, or options supplied through
  arrays/variables. `accept-new` is not matched: it has first-contact risk but
  rejects changed keys and is a different policy decision.
utils:
  argument-token:
    any:
      - kind: word
      - kind: string
      - kind: raw_string
  unsafe-setting:
    matches: argument-token
    regex: (?i)^["']?StrictHostKeyChecking(\s*=\s*|\s+)(no|off|false)["']?$
  ordinary-operand:
    matches: argument-token
    regex: ^["']?[^-'"].*$
  option-barrier:
    matches: argument-token
    regex: ^["']?--["']?$
  unsafe-option-shape:
    all:
      - matches: argument-token
      - any:
          - regex: (?i)^["']?-oStrictHostKeyChecking(\s*=\s*|\s+)(no|off|false)["']?$
          - all:
              - regex: ^["']?-o["']?$
              - precedes: {matches: unsafe-setting}
  unsafe-option:
    all:
      - matches: unsafe-option-shape
      - not: {follows: {matches: ordinary-operand}}
      - not:
          follows:
            stopBy: end
            matches: option-barrier
  wrapped-client:
    all:
      - matches: argument-token
      - regex: '^["'']?(ssh|scp|sftp)["'']?$'
      - any:
          - follows:
              kind: command_name
              regex: '^["'']?command["'']?$'
          - follows:
              matches: option-barrier
              follows:
                kind: command_name
                regex: '^["'']?command["'']?$'
  wrapped-unsafe-option:
    all:
      - matches: unsafe-option-shape
      - not:
          follows:
            stopBy: {matches: wrapped-client}
            matches: option-barrier
      - follows:
          stopBy:
            all:
              - matches: ordinary-operand
              - not: {matches: wrapped-client}
          matches: wrapped-client
transform:
  FIXED:
    rewrite:
      rewriters: [joined-option-to-yes, separate-setting-to-yes]
      source: $CMD
rewriters:
  # -oStrictHostKeyChecking=no (one token) -> =yes, keeping quotes and case
  - id: joined-option-to-yes
    rule:
      pattern: $TOK
      regex: (?i)^["']?-oStrictHostKeyChecking(\s*=\s*|\s+)(no|off|false)["']?$
      any:
        - matches: unsafe-option
        - matches: wrapped-unsafe-option
    transform:
      REPL:
        replace:
          source: $TOK
          replace: (?i)(no|off|false)(["']?)$
          by: yes$2
    fix: $REPL
  # -o StrictHostKeyChecking=no: only the setting token after the guarded -o
  - id: separate-setting-to-yes
    rule:
      pattern: $TOK
      matches: unsafe-setting
      follows:
        regex: ^["']?-o["']?$
        any:
          - matches: unsafe-option
          - matches: wrapped-unsafe-option
    transform:
      REPL:
        replace:
          source: $TOK
          replace: (?i)(no|off|false)(["']?)$
          by: yes$2
    fix: $REPL
fix: $FIXED
rule:
  kind: command
  pattern: $CMD
  any:
    - all:
        - has:
            field: name
            regex: ^["']?(ssh|scp|sftp)["']?$
        - has: {matches: unsafe-option}
    - has: {matches: wrapped-unsafe-option}
metadata:
  created_at: '2026-09-06'
  source: 'MyGuard'
  modified_by: 'MyGuard'
  license: 'MyGuard Internal Use License 1.0'
