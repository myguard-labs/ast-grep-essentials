# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-test-obsolescent-and-or
language: bash
severity: warning
message: >-
  Avoid the obsolescent -a/-o operators inside a single [ ] test; join
  separate tests with && or || instead.
note: >-
  Textual match on a single-bracket test command; it cannot tell an operator
  from an operand that happens to be spelled -a or -o, and does not cover the
  test builtin form.
rule:
  kind: test_command
  regex: '(?s)^\[\s.*[^\s\[]\s+-[ao]\s'
metadata:
  rule_modified_at: '2026-10-18'
  ast_grep_tested_version: 0.51.0
