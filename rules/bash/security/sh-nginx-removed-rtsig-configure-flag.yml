id: sh-nginx-removed-rtsig-configure-flag
language: bash
severity: warning
message: >-
  This configure option was removed in nginx 1.9.0 and will break the build on
  current nginx; remove --with-rtsig_module.
note: >-
  Matches the literal flag text --with-rtsig_module anywhere in a bash command
  word. It does not verify the script builds nginx or resolve the nginx
  version.
rule:
  pattern: '--with-rtsig_module'
