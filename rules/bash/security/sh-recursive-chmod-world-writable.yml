# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-recursive-chmod-world-writable
language: bash
severity: 'off'
message: >-
  Deprecated rule ID; use sh-world-writable-permissions. Recursive chmod grants
  world-writable permissions; other local accounts can modify every file under
  the tree.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use sh-world-writable-permissions and do not emit this rule.
rule:
  kind: command
  any:
    - all:
        - has: {field: name, kind: command_name, regex: '^["'']?chmod["'']?$'}
        - has: {matches: wide-mode}
    - all:
        - has: {field: name, kind: command_name, regex: '^["'']?umask["'']?$'}
        - has: {matches: wide-umask}
utils:
  argument-token:
    any:
      - kind: word
      - kind: number
      - kind: string
      - kind: raw_string
  chmod-value-option:
    matches: argument-token
    regex: '^["'']?--reference["'']?$'
  wide-mode:
    all:
      - matches: argument-token
      - regex: '^["'']?(0?(777|666|646|622|707|766|676)|[ugoa]*[ao][ugoa]*[+=][rwxXst]*w[rwxXst]*|o[+=][rwxXst]*w[rwxXst]*)["'']?$'
      - not: {follows: {matches: chmod-value-option}}
  wide-umask:
    all:
      - matches: argument-token
      - regex: '^["'']?0{1,4}["'']?$'
metadata:
  deprecated_alias_of: sh-world-writable-permissions
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
