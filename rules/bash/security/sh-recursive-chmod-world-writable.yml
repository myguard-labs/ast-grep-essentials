# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-recursive-chmod-world-writable
language: bash
severity: warning
message: >-
  Recursive chmod grants world-writable permissions; other local accounts can
  modify every file under the tree.
note: >-
  Matches only the literal chmod command with -R and a literal 777 mode in the
  same command. It does not resolve variables, symbolic modes, or whether the
  target path is sensitive.
rule:
  pattern: 'chmod -R 777 $$$ARGS'
