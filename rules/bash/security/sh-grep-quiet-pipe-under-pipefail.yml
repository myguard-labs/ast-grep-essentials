# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-grep-quiet-pipe-under-pipefail
language: bash
severity: warning
message: >-
  Piping printf or echo output into grep -q can cause SIGPIPE failures under
  pipefail; use a here-string instead.
note: >-
  Purely syntactic match on a pipeline whose left side is printf or echo and
  whose right side is grep with a -q flag. It does not verify that pipefail is
  set, that the input is large, or the runtime behavior of grep.
rule:
  pattern: '$LEFT | grep $$$FLAGS'
  inside:
    kind: program
    stopBy: end
  has:
    pattern: '$FLAG'
    regex: '^-[A-Za-z]*q[A-Za-z]*$'
    kind: word
    stopBy: end
