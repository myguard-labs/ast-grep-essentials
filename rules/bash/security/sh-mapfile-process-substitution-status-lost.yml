id: sh-mapfile-process-substitution-status-lost
language: bash
severity: warning
message: >-
  mapfile or readarray reads from a process substitution, so the exit status
  of the producing command is discarded.
note: >-
  Single-file syntactic match on literal mapfile or readarray commands whose
  input redirect is a process substitution. It does not check whether the
  substituted command can fail or whether its status is checked elsewhere.
rule:
  pattern: 'mapfile $$$ARGS < <($CMD)'
