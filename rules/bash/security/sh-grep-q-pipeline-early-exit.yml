# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: sh-grep-q-pipeline-early-exit
language: bash
severity: warning
message: >-
  Piping printf or echo output into grep -q can SIGPIPE the writer; under
  pipefail this may report a false failure. Consider a here-string.
note: >-
  Matches only the literal syntactic shape of a printf or echo command piped
  directly into grep -q. It does not verify pipefail is set, the output size,
  or runtime SIGPIPE behavior.
rule:
  pattern: 'printf $$$A | grep -q $$$ARGS'
