id: sh-secret-on-command-line
language: bash
severity: error
message: >-
  Credential passed as a command-line argument. Every process argument list is
  world-readable through /proc, so any local account reads the secret while the
  command runs, and the same text lands in shell history and in CI job logs.
  Pass the secret through the environment or on standard input instead, with
  MYSQL_PWD, a curl header from stdin, or a password-stdin option.
note: >-
  Matches a mysql or psql password option, a curl or wget user or password
  option, an sshpass password option, a docker login password option and an
  openssl pass argument, when the value in that position expands a variable
  whose name reads as a secret, and also a bare word carrying an inline password
  option with such an expansion. Whether the variable really holds a secret is a
  naming heuristic, and a secret under a neutral variable name is missed.
utils:
  argument-token:
    any:
      - kind: word
      - kind: string
      - kind: raw_string
      - kind: concatenation
      - kind: simple_expansion
      - kind: expansion
  secret-valued:
    all:
      - matches: argument-token
      - regex: '(?i)\$\{?[A-Za-z_][A-Za-z0-9_]*(PASS|PASSWD|PASSWORD|TOKEN|SECRET|APIKEY|API_KEY|CREDENTIAL|PAT|PWD)[A-Za-z0-9_]*\}?'
  separate-secret-option:
    all:
      - matches: argument-token
      - regex: '^["'']?(-p|-P|-u|-U|--password|--user|--pass|--token|--api-key|--http-password)["'']?$'
      - precedes: {matches: secret-valued}
  inline-secret-option:
    all:
      - matches: secret-valued
      - regex: '(?i)^["'']?(-p|-u|--password=|--user=|--pass=|--token=|--http-password=|pass:|--password-stdin=)'
rule:
  kind: command
  all:
    - has:
        field: name
        kind: command_name
        regex: '^["'']?(mysql|mysqldump|psql|curl|wget|sshpass|docker|openssl|useradd|chpasswd|git)["'']?$'
    - has:
        any:
          - matches: separate-secret-option
          - matches: inline-secret-option
