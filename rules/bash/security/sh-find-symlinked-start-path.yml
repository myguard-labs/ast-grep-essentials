id: sh-find-symlinked-start-path
language: bash
severity: warning
message: >-
  This find starts at a variable that was only checked with -d, and it has no
  -H or -L flag, so a symlinked starting directory may match nothing.
note: >-
  Syntactic check only. It matches a literal -d test on a variable followed by
  a find whose starting path is that variable and that has no -H or -L flag in
  the matched command. It does not resolve whether the variable is a symlink
  at runtime or whether the test and find use the same value.
rule:
  pattern: 'find $ARG $$$REST'
  inside:
    pattern: 'if [ -d $ARG ]; then $$$BODY; fi'
    stopBy: end
  not:
    has:
      pattern: '$FLAG'
      regex: '^-[HL]$'
