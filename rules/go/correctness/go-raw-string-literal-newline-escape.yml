# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-raw-string-literal-newline-escape
language: go
severity: 'off'
message: >-
  Deprecated rule ID; use go-backtick-string-backslash-escape. Backtick raw
  string contains a backslash escape sequence such as \n or \r\n, which stays
  literal text and is not interpreted as a newline.
note: >-
  Compatibility alias for consumers that explicitly promote the former ID.
  Normal scans use go-backtick-string-backslash-escape and do not emit this
  rule.
rule:
  kind: raw_string_literal
  regex: '\\[nr]'
metadata:
  deprecated_alias_of: go-backtick-string-backslash-escape
  rule_modified_at: '2026-11-18'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
  created_at: '2026-10-15'
