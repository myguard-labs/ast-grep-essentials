id: go-branch-store-falls-through-double-write
language: go
severity: warning
message: >-
  An if-block that stores into a map index falls through to a second map-index
  store of the same key and value; a return may be missing.
note: >-
  Syntactic only. Matches an if statement with no else whose block contains an
  index store and no return or continue, followed later in the same block by
  another index store using the same key and value expressions. It does not
  check types, aliasing, or whether writing to both stores is intended.
rule:
  all:
    - kind: if_statement
    - not:
        has:
          field: alternative
          regex: '.'
    - has:
        field: consequence
        all:
          - has:
              stopBy: end
              pattern: '$FIRST[$KEY] = $VAL'
          - not:
              has:
                stopBy: end
                kind: return_statement
          - not:
              has:
                stopBy: end
                kind: continue_statement
    - precedes:
        stopBy: end
        pattern: '$SECOND[$KEY] = $VAL'
