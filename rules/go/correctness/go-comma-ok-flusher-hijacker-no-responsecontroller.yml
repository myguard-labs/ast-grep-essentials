# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-comma-ok-flusher-hijacker-no-responsecontroller
language: go
severity: warning
message: >-
  Comma-ok assertion to http.Flusher or http.Hijacker silently skips the
  capability; consider http.NewResponseController.
note: >-
  Syntactic match on a comma-ok type assertion to http.Flusher or
  http.Hijacker written as a short variable declaration. It does not verify
  the receiver type, does not check whether the enclosing function calls
  http.NewResponseController, and does not follow Unwrap() chains.
rule:
  pattern: '$V, ok := $W.($T.Flusher)'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: package p; func f(w http.ResponseWriter) { hj, ok := w.(http.Hijacker); _, _ = hj, ok } is not matched although the message names http.Hijacker'
    - 'FN: package p; func f(w http.ResponseWriter) { fl, found := w.(http.Flusher); _, _ = fl, found } is not matched because the pattern fixes the name ok'
    - 'FN: package p; func f(w http.ResponseWriter) { var fl http.Flusher; var ok bool; fl, ok = w.(http.Flusher); _, _ = fl, ok } assignment form is not matched'
