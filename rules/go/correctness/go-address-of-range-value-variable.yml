# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-address-of-range-value-variable
language: go
severity: warning
message: >-
  Taking the address of a range value variable may share one variable across
  loop iterations.
note: >-
  Syntactic match on a unary & applied to the bare identifier bound as the
  last variable of a `for k, v := range`, `for _, v := range` or single-variable
  `for v := range` loop (the value, or the only variable of a channel, integer
  or index range), anywhere in that
  loop body including nested blocks and function literals. A direct `v := v`
  statement in the loop body is treated as the shadow-copy fix and silences the
  report. The go.mod `go` directive is not visible to the rule: since Go 1.22
  each `:=` range iteration has its own variable, so for that form the defect
  exists only for modules with a `go` directive below 1.22. A `for _, v = range`
  loop assigns to a variable declared outside the loop and shares it in every
  Go version.
rule:
  all:
    - pattern: '&$V'
    - inside:
        stopBy: end
        kind: block
        inside:
          kind: for_statement
          has:
            kind: range_clause
            has:
              field: left
              kind: expression_list
              has:
                kind: identifier
                nthChild:
                  position: 1
                  reverse: true
                pattern: $V
        not:
          has:
            kind: statement_list
            has:
              pattern: '$V := $V'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FN: the address of a field (&v.f), a method value on a pointer receiver and an index-address of the value (&v[0]) are not matched, only &v on the bare identifier'
    - 'FN: &v taken before a later v := v statement in the same body is silenced too (the shadow-copy exclusion ignores statement order)'
    - 'FP: a closure parameter or local named like the range value (go func(v T) { use(&v) }(v)) is reported, and a v := v only inside a nested block does not count as the shadow copy'
    - 'FP: when an inner range loop rebinds the same name and holds the v := v copy (for _, v := range xs { for _, v := range ys { v := v; use(&v) } }), the outer loop still reports it'
    - 'FP: in a module with go >= 1.22 (per-iteration loop variable) the range-value address is not shared; the go directive is not visible to the rule'
