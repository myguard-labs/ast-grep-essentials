# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-address-of-range-value-variable
language: go
severity: warning
message: >-
  Taking the address of a range value variable may share one variable across
  loop iterations.
note: >-
  Syntactic match on a unary & applied to an identifier inside a for-range
  body; it does not verify the variable is the range value or the Go version
  semantics.
rule:
  pattern: 'process(&ing)'
metadata:
  rule_modified_at: '2026-10-16'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-16'
  created_at: '2026-10-16'
  source: 'MyGuard'
  modified_by: MyGuard
  license: MyGuard Internal Use License 1.0
  todo_cases:
    - 'FP: process(&ing) is matched anywhere, including outside any for-range body, and in Go >= 1.22 (per-iteration loop variable) the range-value address is no longer shared; no new invalid case pinned'
    - 'FN: any other callee or a stored address (ptrs = append(ptrs, &ing)) is not matched, only the literal call process(&ing)'
