id: go-max-clamp-offset-index
language: go
severity: warning
message: >-
  Index clamped with max(0, ...) may silently read the wrong element instead
  of failing on a negative offset.
note: >-
  Syntactic heuristic only. It matches an index expression whose index is a
  direct call max(0, expr). It cannot tell whether the clamp is intentional,
  whether the operand is a slice or string, or whether max is the builtin.
rule:
  pattern: '$S[max(0, $E)]'
