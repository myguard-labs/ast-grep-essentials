id: go-unchecked-type-assertion
language: go
severity: warning
message: >-
  Single-value type assertion — if the interface holds a different type, or is
  nil, this panics and takes down the goroutine (CWE-476). Use the comma-ok form
  `v, ok := x.(T)` and handle !ok, or a type switch, whenever the dynamic type
  is not guaranteed by the code immediately above.
note: >-
  Direct and once-parenthesized comma-ok assignments such as
  `v, ok := x.(T)` do not match while `v := x.(T)` does. Redundantly nested
  parentheses around the assertion can still report. An assertion right after
  a type switch case, or on a value the same function just constructed, is the
  routine dismissal; assertions on data crossing a trust boundary (decoded
  JSON, plugin returns) are the ones that matter.
rule:
  kind: type_assertion_expression
  not:
    any:
      - inside:
          kind: expression_list
          not:
            has:
              nthChild: 2
              regex: '.'
          inside:
            any:
              - kind: assignment_statement
              - kind: short_var_declaration
            has:
              field: left
              kind: expression_list
              has:
                kind: identifier
                nthChild: 2
      - inside:
          kind: parenthesized_expression
          inside:
            kind: expression_list
            not:
              has:
                nthChild: 2
                regex: '.'
            inside:
              any:
                - kind: assignment_statement
                - kind: short_var_declaration
              has:
                field: left
                kind: expression_list
                has:
                  kind: identifier
                  nthChild: 2
      - inside:
          kind: expression_list
          not:
            has:
              nthChild: 2
              regex: '.'
          inside:
            kind: var_spec
            has:
              kind: identifier
              nthChild: 2
      - inside:
          kind: parenthesized_expression
          inside:
            kind: expression_list
            not:
              has:
                nthChild: 2
                regex: '.'
            inside:
              kind: var_spec
              has:
                kind: identifier
                nthChild: 2
