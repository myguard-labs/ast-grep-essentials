id: go-nil-guard-slice-index
language: go
severity: warning
message: >-
  A nil check on a slice does not guarantee it has an element; the constant
  index [0] inside the guard can panic on an empty non-nil slice.
note: >-
  Syntactic only: matches an if statement whose condition is `X != nil` and
  whose body contains `X[0]` for the same selector expression. It cannot
  verify that X is a slice, that its length is non-zero, or that the body does
  not reassign X. A length check such as len(X) > 0 is needed to rule out the
  panic.
rule:
  all:
    - pattern: |
        if $X != nil {
          $$$BODY
        }
    - has:
        pattern: '$X[0]'
        stopBy: end
