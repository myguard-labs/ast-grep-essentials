id: go-sticky-error-iterator-unguarded
language: go
severity: warning
message: >-
  Method increments receiver state without first checking the receiver's
  sticky err field.
note: >-
  Syntactic only. It matches a method body that increments a receiver field
  and contains no `if recv.err != nil` check anywhere in that body. It does
  not check whether the receiver struct actually declares an err field,
  whether the guard comes first or returns, or whether the error is checked
  some other way.
rule:
  kind: method_declaration
  all:
    - has:
        field: receiver
        has:
          kind: parameter_declaration
          has:
            field: name
            pattern: '$R'
    - has:
        field: body
        has:
          stopBy: end
          pattern: '$R.$F++'
    - not:
        has:
          field: body
          has:
            stopBy: end
            pattern: |
              if $R.err != nil {
                $$$
              }
