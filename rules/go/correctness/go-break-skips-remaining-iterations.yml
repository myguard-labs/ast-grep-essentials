# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-break-skips-remaining-iterations
language: go
severity: warning
message: >-
  break in an empty-length guard ends the loop early; continue may have been
  intended.
note: >-
  Syntactic heuristic only. Some breaks are intentional sentinels, so review
  each hit. The rule does not check intent, runtime values or data flow.
rule:
  kind: break_statement
  inside:
    kind: if_statement
    stopBy: end
    has:
      field: condition
      pattern: 'len($X) == 0'
    precedes:
      regex: '\S'
    inside:
      kind: for_statement
      stopBy: end
