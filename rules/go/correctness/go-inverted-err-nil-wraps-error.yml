id: go-inverted-err-nil-wraps-error
language: go
severity: warning
message: >-
  Error is wrapped inside an err == nil branch, which may indicate an inverted
  error check.
note: >-
  Syntactic match only. It does not confirm that err has an error type, that
  the branch is unintended, or that the branch is reachable. Review the
  surrounding logic before changing the condition.
rule:
  pattern: |
    if err == nil {
      return fmt.Errorf($MSG, err)
    }
