id: go-getcurrentns-not-closed
language: go
severity: warning
message: >-
  The handle returned by ns.GetCurrentNS() is never closed in this function.
  Call Close() on it, for example with defer, so the netns file descriptor
  does not leak.
note: >-
  This is a syntactic check only. It looks for a Close() call on the bound
  variable anywhere inside the same function declaration. It does not track
  whether the handle escapes or is returned (ownership transfer), aliasing, or
  whether Close runs on every path.
rule:
  pattern: '$HANDLE, $ERR := ns.GetCurrentNS()'
  not:
    inside:
      kind: function_declaration
      stopBy: end
      has:
        stopBy: end
        pattern: '$HANDLE.Close()'
