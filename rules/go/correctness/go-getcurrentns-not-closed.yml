# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-getcurrentns-not-closed
language: go
severity: warning
message: >-
  The handle returned by ns.GetCurrentNS() is never closed in this function.
  Call Close() on it, for example with defer, so the netns file descriptor
  does not leak.
note: >-
  This is a syntactic check only. It looks for a Close() call on the bound
  variable anywhere inside an enclosing function declaration, method
  declaration or func literal. It does not track whether the handle escapes or
  is returned (ownership transfer), aliasing, or whether Close runs on every
  path.
rule:
  pattern: '$HANDLE, $ERR := ns.GetCurrentNS()'
  not:
    inside:
      any:
        - kind: function_declaration
        - kind: method_declaration
        - kind: func_literal
      stopBy: end
      has:
        stopBy: end
        pattern: '$HANDLE.Close()'
metadata:
  todo_cases:
    - "FN: the Close() search runs over every enclosing function, method and func literal, so a handle opened in a func literal is silenced when the enclosing function closes a variable with the same name"
    - "FN: a Close() on the same name in a nested func literal or a different branch counts as closing, with no path analysis"
    - "Known gap: the `h, err = ns.GetCurrentNS()` assignment form is not matched at all"
