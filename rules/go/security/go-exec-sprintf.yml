id: go-exec-sprintf
language: go
severity: warning
message: >-
  Formatted argument in exec.Command/CommandContext. These APIs pass arguments
  directly without invoking a shell. Review executable selection and option
  handling; shell injection is relevant when the command explicitly invokes a
  shell. Formatting alone does not establish injection.
note: >-
  Candidate: finds a Sprintf call inside the command arguments. Check which
  argument is formatted and how the executable interprets it; safely formatted
  direct arguments can match.
rule:
  all:
    - kind: call_expression
    - any:
        - all:
            - has:
                field: function
                matches: command
            - has:
                field: arguments
                kind: argument_list
                has:
                  all:
                    - nthChild: n+1
                    - matches: formatted-argument
        - all:
            - has:
                field: function
                matches: command-context
            - has:
                field: arguments
                kind: argument_list
                has:
                  all:
                    - nthChild: n+2
                    - matches: formatted-argument
utils:
  command:
    kind: selector_expression
    all:
      - has: {field: operand, regex: ^exec$}
      - has: {field: field, regex: ^Command$}
  command-context:
    kind: selector_expression
    all:
      - has: {field: operand, regex: ^exec$}
      - has: {field: field, regex: ^CommandContext$}
  sprintf-call:
    kind: call_expression
    has:
      field: function
      kind: selector_expression
      all:
        - has: {field: operand, regex: ^fmt$}
        - has: {field: field, regex: ^Sprintf$}
  formatted-argument:
    any:
      - matches: sprintf-call
      - has:
          stopBy:
            kind: func_literal
          matches: sprintf-call
