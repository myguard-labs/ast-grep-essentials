id: go-exec-sprintf
language: go
severity: warning
message: >-
  Formatted argument in exec.Command/CommandContext. These APIs pass arguments
  directly without invoking a shell. Review executable selection and option
  handling; shell injection is relevant when the command explicitly invokes a
  shell. Formatting alone does not establish injection.
note: >-
  Candidate: finds a Sprintf call inside the command arguments. Check which
  argument is formatted and how the executable interprets it; safely formatted
  direct arguments can match.
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: 'exec\.(Command|CommandContext)'
    - has:
        stopBy: end
        kind: call_expression
        has:
          field: function
          regex: 'Sprintf$'
