id: go-address-of-range-value-variable
language: go
severity: warning
message: >-
  Taking the address of a range value variable may share one variable across
  loop iterations.
note: >-
  Syntactic match on a unary & applied to an identifier inside a for-range
  body; it does not verify the variable is the range value or the Go version
  semantics.
rule:
  pattern: 'process(&ing)'
