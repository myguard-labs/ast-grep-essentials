id: go-strings-split-index-one-unchecked
language: go
severity: warning
message: >-
  Indexing strings.Split(...) at [1] without a length check panics when the
  separator is absent.
note: >-
  Matches the literal syntax strings.Split(...)[1] applied directly to the
  call result. It does not check for a preceding length guard, and it does not
  resolve whether strings refers to the standard library package or whether
  the separator can occur in the input.
rule:
  pattern: 'strings.Split($$$ARGS)[1]'
