id: go-unguarded-first-element-field
language: go
severity: warning
message: An index literal 0 applied to a field selector expression x.F[0] in a function
  with no preceding len check on that same field.
note: Excelize extractors index parsed XML slice fields such as Formula[0] and Cfvo[1]
  with no length guard, so an empty element panics. Needs slice typing and guard flow,
  so recorded as taint.
rule:
  all:
    - pattern: '$X.$F[0]'
    - not:
        inside:
          kind: function_declaration
          has:
            pattern: 'len($X.$F)'
            stopBy: end
          stopBy: end
    - not:
        inside:
          kind: method_declaration
          has:
            pattern: 'len($X.$F)'
            stopBy: end
          stopBy: end
metadata:
  cwe: 'CWE-129'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/129.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A05:2025'
  todo_cases:
    - "package p\nfunc f() {\n\tv := cf.Formula[0]\n\tuse(v)\n\tif len(cf.Formula) > 0 {\n\t\tuse(v)\n\t}\n}\n"
    - "cf.Cfvo[1] (index 1, named in the note) is not reported; only index 0 matches"
