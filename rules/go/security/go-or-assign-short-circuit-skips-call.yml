id: go-or-assign-short-circuit-skips-call
language: go
severity: warning
message: >-
  This assignment short-circuits a call on the right side of `||` when the
  assigned variable is already true; the call is skipped.
note: >-
  Syntactic check only. Matches an assignment whose right side is a binary
  `||` with the assigned identifier as the left operand and a call as the
  right operand. It does not verify that the call has side effects or that
  skipping it matters at runtime.
rule:
  pattern: '$X = $X || $F($$$ARGS)'
