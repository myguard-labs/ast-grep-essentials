id: go-auth-middleware-skipped-on-empty-secret
language: go
severity: warning
message: An if statement comparing a selector ending in .Secret to an empty string
  wraps a .Use call that registers a middleware whose name contains Middleware.
note: Gating auth middleware on a configured secret means an empty secret silently
  disables authentication for the whole route group, which fails open. The unconditional
  registration is the safe shape.
rule:
  pattern: func $V0(c *Coordinator) { if c.config.JWT.Secret != "" { protected.Use(authHandler.JWTMiddleware())
    } }
