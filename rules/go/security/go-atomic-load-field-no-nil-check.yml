id: go-atomic-load-field-no-nil-check
language: go
severity: warning
message: >-
  Field selected directly on a Load() result without a nil check; the loaded
  pointer may be nil before the first Store.
note: >-
  Syntactic match only: flags a field selector applied directly to a
  zero-argument .Load() call. It does not verify the receiver is an
  atomic.Pointer or that the value can be nil at runtime, and it does not
  detect guards elsewhere in the function.
rule:
  pattern: '$X.Load().$F'
