# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-single-backslash-escape-check
language: go
severity: warning
message: >-
  This condition checks only one preceding backslash for escape parity; an
  even backslash run is misread as escaped.
note: >-
  Single-file syntactic match on an index expression s[i-1] compared with a
  backslash rune literal inside an if condition in a for loop. It does not
  resolve types, aliasing, or the true length of the backslash run.
rule:
  all:
    - pattern: '$S[$I - 1] == ''\\'''
    - inside:
        kind: if_statement
        stopBy: end
        inside:
          kind: for_statement
          stopBy: end
