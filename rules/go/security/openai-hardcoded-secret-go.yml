# CodeRabbit source repository: https://github.com/coderabbitai/ast-grep-essentials
# CodeRabbit source file: https://github.com/coderabbitai/ast-grep-essentials/blob/73120109bf45c284d0cd8a37bdd7082e80e92e87/rules/go/security/openai-hardcoded-secret-go.yml
# Original author (Git): ESS-ENN
# License: Apache License 2.0 (https://www.apache.org/licenses/LICENSE-2.0)
# Modified by MyGuard: provenance metadata added; utility IDs normalized; matcher behavior is unchanged.
id: openai-hardcoded-secret-go
language: go
severity: warning
message: >-
  A secret is hard-coded in the application. Secrets stored in source
  code, such as credentials, identifiers, and other types of sensitive data,
  can be leaked and used by internal or external malicious actors. It is
  recommended to rotate the secret and retrieve them from a secure secret
  vault or Hardware Security Module (HSM), alternatively environment
  variables can be used if allowed by your company policy.
note: >-
  [CWE-798] Use of Hard-coded Credentials.
  [REFERENCES]
      - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures

ast-grep-essentials: true

utils:
  UPSTREAM_UTIL_001:
    kind: call_expression
    all:
      - has:
          stopBy: neighbor
          kind: selector_expression
          all:
            - has:
                stopBy: neighbor
                kind: identifier
                regex: ^openai$
            - has:
                stopBy: neighbor
                kind: field_identifier
                regex: ^NewClient$
      - has:
          stopBy: neighbor
          kind: argument_list
          has:
            kind: interpreted_string_literal
            has:
              kind: interpreted_string_literal_content
            nthChild:
              position: 1
              ofRule:
                not:
                  kind: comment
          not:
            has:
              nthChild:
                position: 2
                ofRule:
                  not:
                    kind: comment
      - any:
          - inside:
              stopBy: end
              follows:
                stopBy: end
                has:
                  stopBy: end
                  kind: import_spec
                  regex: "github.com/sashabaranov/go-openai"
          - follows:
              stopBy: end
              has:
                stopBy: end
                kind: import_spec
                regex: "github.com/sashabaranov/go-openai"
  UPSTREAM_UTIL_002:
    kind: call_expression
    all:
      - has:
          stopBy: neighbor
          kind: selector_expression
          all:
            - has:
                stopBy: neighbor
                kind: identifier
                regex: ^openai$
            - has:
                stopBy: neighbor
                kind: field_identifier
                regex: ^NewClient$
      - has:
          stopBy: neighbor
          kind: argument_list
          has:
            kind: identifier
            pattern: $VAR
            nthChild:
              position: 1
              ofRule:
                not:
                  kind: comment
          not:
            has:
              nthChild:
                position: 2
                ofRule:
                  not:
                    kind: comment
      - any:
          - inside:
              stopBy: end
              follows:
                stopBy: end
                has:
                  stopBy: end
                  kind: import_spec
                  regex: "github.com/sashabaranov/go-openai"
          - follows:
              stopBy: end
              has:
                stopBy: end
                kind: import_spec
                regex: "github.com/sashabaranov/go-openai"
    any:
      - follows:
          stopBy: end
          kind: assignment_statement
          all:
            - has:
                kind: expression_list
                has:
                  pattern: $VAR
            - has:
                kind: expression_list
                has:
                  pattern: $SECRET
      - inside:
          stopBy: end
          follows:
            stopBy: end
            kind: assignment_statement
            all:
              - has:
                  kind: expression_list
                  has:
                    pattern: $VAR
              - has:
                  kind: expression_list
                  has:
                    pattern: $SECRET
      - follows:
          stopBy: end
          kind: const_declaration
          all:
            - has:
                kind: const_spec
                has:
                  pattern: $VAR
            - has:
                kind: expression_list
                has:
                  pattern: $SECRET
      - inside:
          stopBy: end
          follows:
            stopBy: end
            kind: const_declaration
            all:
              - has:
                  kind: const_spec
                  has:
                    pattern: $VAR
              - has:
                  kind: expression_list
                  has:
                    pattern: $SECRET
      - follows:
          stopBy: end
          kind: var_declaration
          has:
            kind: var_spec
            all:
              - has:
                  kind: identifier
                  pattern: $VAR
              - has:
                  kind: expression_list
                  has:
                    pattern: $SECRET
      - inside:
          stopBy: end
          follows:
            stopBy: end
            kind: var_declaration
            has:
              kind: var_spec
              all:
                - has:
                    kind: identifier
                    pattern: $VAR
                - has:
                    kind: expression_list
                    has:
                      pattern: $SECRET
rule:
  kind: call_expression
  any:
    - matches: UPSTREAM_UTIL_001
    - matches: UPSTREAM_UTIL_002
  not:
    all:
      - has:
          stopBy: end
          kind: ERROR
      - inside:
          stopBy: end
          kind: ERROR
constraints:
  SECRET:
    not:
      regex: ^""$
