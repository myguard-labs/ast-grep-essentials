id: go-make-len-from-field
language: go
severity: warning
message: A make call for a byte slice whose length argument is a field selector such
  as x.Size, not a constant.
note: Allocating a buffer from a size read out of an untrusted container lets a crafted
  file force huge or negative allocations. Whether a bound check precedes it needs
  a guard elsewhere, so it is recorded as taint.
rule:
  pattern: make([]byte, $OBJ.$FIELD)
metadata:
  cwe: 'CWE-789'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/789.html'
  taxonomy_cited_keys: 'cwe'
  known_false_positives: 'func r(h Header) []byte { if h.Size > 4096 { return nil }; return make([]byte, h.Size) } is still reported although an upper bound check precedes the make'
  todo_cases:
    - |-
      package p
      func f(h Header) { _ = make([]int, h.Size) }
    - |-
      package p
      func f(h Header) { _ = make([]byte, 0, h.Size) }
    - |-
      package p
      func f(h Header) { _ = make([]byte, h.Size()) }
