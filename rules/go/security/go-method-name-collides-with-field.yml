id: go-method-name-collides-with-field
language: go
severity: warning
message: >-
  This method has the same name as a field declared on the same struct type,
  which Go rejects at compile time.
note: >-
  Syntactic single-file check on a literal struct type declaration and a
  method declaration with a matching identifier; it does not resolve embedded
  fields, promoted names, or types across files.
rule:
  all:
    - pattern: |
        type $T struct {
          $$$BEFORE
          $NAME $_
          $$$AFTER
        }
    - inside:
        kind: source_file
        stopBy: end
        has:
          pattern: 'func ($R *$T) $NAME($$$ARGS) $$$RET'
          stopBy: end
