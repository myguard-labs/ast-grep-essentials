id: go-owner-reference-literal-not-controller-ref
language: go
severity: warning
message: >-
  Owner reference is hand-built as a composite literal; consider
  controllerutil.SetControllerReference.
note: >-
  Matches the literal composite syntax metav1.OwnerReference{...} within a
  slice literal of the same type only; it does not verify the field values,
  the controller flag, scheme validation, or resolve imports or aliases.
rule:
  pattern: '[]metav1.OwnerReference{{$$$FIELDS}}'
