# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-struct-tag-key-misspelled-json
language: go
severity: warning
message: >-
  This struct field tag uses the key "josn", which is not a recognised
  encoding key, so the field silently gets no JSON name.
note: >-
  Syntactic check on the literal tag key text only; it does not verify the
  struct is serialized or resolve types, and other misspellings are not
  covered.
rule:
  kind: raw_string_literal
  regex: '^`josn:'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
  validated_at: '2026-10-15'
