id: go-changed-flag-literal-true
language: go
severity: warning
message: >-
  Return value for the changed flag is the literal true; compute it from the
  actual comparison instead.
note: >-
  Single-file syntactic match on a return statement with three expressions
  whose second is the literal true. Does not check the function signature,
  types, or whether the flag is consumed by callers.
rule:
  pattern: 'return $A, true, $C'
