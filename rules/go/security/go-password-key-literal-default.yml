id: go-password-key-literal-default
language: go
severity: warning
message: A composite literal key whose name contains Password or Secret is set to
  a non-empty string literal.
note: Shipped default credentials let attackers log in unchanged. The commit's default
  was a named constant, not a literal, so the literal form is one shape of the same
  defect. Expect fixtures and test data to need suppression.
rule:
  pattern: 'func $V0() Config { return Config{AdminPassword: "sipcapture"} }'
metadata:
  cwe: 'CWE-798|CWE-1392'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/798.html|https://cwe.mitre.org/data/definitions/1392.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A07:2025'
  todo_cases:
    - "Config{DBSecret: \"hunter2\"} is not reported; the pattern is the exact AdminPassword \"sipcapture\" literal"
    - "Config{AdminPassword: \"changeme\"} is not reported; only the literal value sipcapture matches"
    - "Config{AdminPassword: \"sipcapture\", Port: 80} with a second field is not reported"
    - "&Config{AdminPassword: \"sipcapture\"} returning *Config is not reported"
    - "Config{AdminPassword: `sipcapture`} with a raw string literal is not reported"
