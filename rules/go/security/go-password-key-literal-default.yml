id: go-password-key-literal-default
language: go
severity: warning
message: A composite literal key whose name contains Password or Secret is set to
  a non-empty string literal.
note: Shipped default credentials let attackers log in unchanged. The commit's default
  was a named constant, not a literal, so the literal form is one shape of the same
  defect. Expect fixtures and test data to need suppression.
rule:
  pattern: 'func $V0() Config { return Config{AdminPassword: "sipcapture"} }'
