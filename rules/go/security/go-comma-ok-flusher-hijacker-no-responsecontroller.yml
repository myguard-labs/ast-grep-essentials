# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-comma-ok-flusher-hijacker-no-responsecontroller
language: go
severity: warning
message: >-
  Comma-ok assertion to http.Flusher or http.Hijacker silently skips the
  capability; consider http.NewResponseController.
note: >-
  Syntactic match on a comma-ok type assertion to http.Flusher or
  http.Hijacker written as a short variable declaration. It does not verify
  the receiver type, does not check whether the enclosing function calls
  http.NewResponseController, and does not follow Unwrap() chains.
rule:
  pattern: '$V, ok := $W.($T.Flusher)'
