# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-cookie-samesite-none-or-missing
language: go
severity: warning
message: >-
  Cookie literal with SameSite set to SameSiteNoneMode, or a session-style
  cookie with no SameSite field. A cookie sent on cross-site requests lets
  another site trigger authenticated requests, which is the precondition for
  cross-site request forgery. Set http.SameSiteLaxMode or http.SameSiteStrictMode
  unless the cookie must really travel cross-site, and then pair None with
  Secure and a CSRF token.
note: >-
  Fires on an http.Cookie literal whose SameSite field is
  http.SameSiteNoneMode, and on one with no SameSite field whose Name is a
  string literal with a name segment of session, token, auth, jwt, sid, login,
  remember or csrf (at the start of the name or after _ - . or a camelCase
  step, so sidebar and author_pref do not count). A field assigned to the
  value on a later statement, or a name held in a variable, is not visible
  here. A cookie that must be embedded cross-site is the routine dismissal.

  [CWE-1275] [A01:2025] [A01:2021]

  [REFERENCES]
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#samesite_attribute
rule:
  kind: composite_literal
  all:
    - has: {field: type, regex: '^http\.Cookie$'}
    - has:
        field: body
        kind: literal_value
        has: {kind: keyed_element}
    - any:
        - has:
            field: body
            kind: literal_value
            has:
              kind: keyed_element
              all:
                - has: {nthChild: 1, regex: '^SameSite$'}
                - has: {nthChild: 2, regex: '^http\.SameSiteNoneMode$'}
        - all:
            - has:
                field: body
                kind: literal_value
                has:
                  kind: keyed_element
                  all:
                    - has: {nthChild: 1, regex: '^Name$'}
                    - has:
                        nthChild: 2
                        regex: '(?:^["''`]|[_.\-])(?:(?:session|token|auth|jwt|sid|login|remember|csrf|Session|Token|Auth|Jwt|Sid|Login|Remember|Csrf)(?:["''`_.\-]|[A-Z0-9])|(?:SESSION|TOKEN|AUTH|JWT|SID|LOGIN|REMEMBER|CSRF)(?:["''`_.\-]|[0-9])|(?i:phpsessid|jsessionid|sessionid|sessid|csrftoken|xsrftoken|authtoken|accesstoken|refreshtoken)(?:["''`_.\-]))|[a-z0-9](?:(?:Session|Token|Auth|Jwt|Sid|Login|Remember|Csrf)(?:["''`_.\-]|[A-Z0-9])|(?:SESSION|TOKEN|AUTH|JWT|SID|LOGIN|REMEMBER|CSRF)(?:["''`_.\-]|[0-9]))'
            - not:
                has:
                  field: body
                  kind: literal_value
                  has:
                    kind: keyed_element
                    has: {nthChild: 1, regex: '^SameSite$'}
metadata:
  created_at: '2026-11-16'
  source: 'MyGuard'
  modified_by: 'MyGuard'
  license: 'MyGuard Internal Use License 1.0'
  cwe: 'CWE-1275'
  owasp: 'A01:2025|A01:2021'
  category: 'security'
  references: 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#samesite_attribute'
