# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-double-close-same-receiver
language: go
severity: warning
message: >-
  This call passes a receiver's Close method value as an argument, and the
  same Close value may be passed again in the same block.
note: >-
  Syntactic check only. It matches literal receiver.Close method values passed
  as call arguments inside assignment statements, without verifying control
  flow, branches, aliasing, or runtime types.
rule:
  pattern: '$LHS = $CALL($RECV.Close, $$$ARGS)'
