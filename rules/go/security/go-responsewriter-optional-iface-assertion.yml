id: go-responsewriter-optional-iface-assertion
language: go
severity: warning
message: >-
  Direct type assertion to http.Flusher, http.Hijacker, or http.Pusher misses
  writers that expose the interface only through Unwrap; consider
  http.NewResponseController.
note: >-
  Syntactic check only. Matches a comma-ok type assertion whose target is the
  literal qualified type http.Flusher, http.Hijacker, or http.Pusher. It does
  not resolve the receiver's type or whether an Unwrap chain exists at
  runtime.
rule:
  pattern: '$W.(http.Flusher)'
