id: go-deref-index-missing-lower-bound
language: go
severity: warning
message: >-
  Dereferenced index is checked only against len(...) with no 0 <= lower bound
  in the same && chain.
note: >-
  This is a syntax-only check. It looks for a `*x < len(s)` comparison inside
  an && chain where no enclosing && expression has a `0 <= *x` term. It cannot
  see lower bounds enforced elsewhere, unsigned types, or values that are
  proven non-negative.
rule:
  all:
    - pattern: '*$X < len($S)'
    - inside:
        pattern: '$A && $B'
        stopBy: end
    - not:
        inside:
          pattern: '$C && $D'
          has:
            pattern: '0 <= *$X'
            stopBy: end
          stopBy: end
