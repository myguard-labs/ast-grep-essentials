# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-context-withvalue-slog-attr
language: go
severity: warning
message: >-
  context.WithValue stores an slog.Attr constructor result as the context
  value; store the raw value instead.
note: >-
  Syntactic match only. Checks that the third argument of a literal
  context.WithValue call is a literal slog.Any, slog.String, or similar slog
  attribute constructor call. Does not resolve imports, aliases, or the
  runtime type of the stored value.
rule:
  pattern: 'context.WithValue($CTX, $KEY, slog.$ATTR($$$ARGS))'
