# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-backtick-string-backslash-escape
language: go
severity: warning
message: >-
  This raw string literal contains a backslash escape such as \n or \r, which
  is kept as literal text. Use an interpreted string if a newline or carriage
  return was intended.
note: >-
  Purely syntactic check on raw string literal text. It cannot tell whether
  the content is protocol text, a regex, or a Windows path, so those
  legitimate cases may be flagged and need review.
rule:
  kind: raw_string_literal
  regex: '\\[nr]'
