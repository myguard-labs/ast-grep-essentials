# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-int-cast-decoded-length-signed
language: go
severity: warning
message: >-
  A shift-or decoded value is converted to int; values above MaxInt32 can
  become negative on 32-bit targets.
note: >-
  Syntactic check only. It matches an int(...) call whose single argument is a
  bitwise-or expression containing a left shift by 24; it does not prove the
  value is a length, reachable, or unbounded.
rule:
  pattern: 'int($EXPR)'
  all:
    - has:
        pattern: '$A << 24'
        stopBy: end
    - has:
        pattern: '$B | $C'
        stopBy: end
