id: go-health-check-time-unconverted
language: go
severity: warning
message: >-
  Duration field copied directly from upstream HealthCheck without
  generateTime conversion.
note: >-
  Syntactic match only on the literal assignment shape hc.<Field> =
  upstream.HealthCheck.<Field>; it does not resolve types, aliases, or whether
  the struct field is a duration, and does not verify that generateTime is
  absent elsewhere in the file.
rule:
  pattern: '$OBJ.$FIELD = upstream.HealthCheck.$FIELD2'
