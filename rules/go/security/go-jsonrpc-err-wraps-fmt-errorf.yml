id: go-jsonrpc-err-wraps-fmt-errorf
language: go
severity: warning
message: >-
  This jsonrpc.Err call passes a fmt.Errorf error value as the data field;
  clients receive an empty JSON object instead of the message. Pass a
  formatted string instead.
note: >-
  Matches the literal syntax jsonrpc.Err(_, fmt.Errorf(...)) with a direct
  qualified call; it does not resolve types, imports, or aliases, and does not
  check that the argument is an error value at runtime.
rule:
  pattern: 'jsonrpc.Err($CODE, fmt.Errorf($$$ARGS))'
