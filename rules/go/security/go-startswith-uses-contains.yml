id: go-startswith-uses-contains
language: go
severity: warning
message: >-
  Function named *StartsWith returns strings.Contains; a prefix check should
  use strings.HasPrefix.
note: >-
  Matches only a literal strings.Contains call inside a Go function
  declaration whose name ends in StartsWith. It does not resolve imports or
  aliases and cannot confirm the call is semantically a prefix check.
rule:
  kind: function_declaration
  all:
    - has:
        field: name
        regex: 'StartsWith$'
    - has:
        kind: return_statement
        pattern: 'return strings.Contains($$$ARGS)'
        stopBy: end
