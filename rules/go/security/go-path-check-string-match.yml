# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-path-check-string-match
language: go
severity: warning
message: >-
  Path-related substring checks and dot trimming or replacement warrant review
  of path containment validation.
note: >-
  Matches only the shown call syntax and literal arguments. It cannot
  establish path traversal, import identity, or whether another containment
  guard exists.
rule:
  kind: call_expression
  not:
    all:
      - not:
          matches: substring_check
      - not:
          matches: dot_removal
utils:
  substring_check:
    all:
      - has:
          field: function
          regex: '^strings\.(Contains|HasPrefix|HasSuffix|Index)$'
      - has:
          field: arguments
          kind: argument_list
          has:
            regex: '^["`](\.\.|\.\./|\.\.\\\\)["`]$'
  dot_removal:
    all:
      - has:
          field: function
          regex: '^strings\.(Replace|ReplaceAll|Trim|TrimLeft|TrimRight)$'
      - has:
          field: arguments
          kind: argument_list
          has:
            regex: '^["`]\.\.["`]$'
