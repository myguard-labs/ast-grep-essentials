id: go-wei-field-from-strk-or-infri
language: go
severity: warning
message: >-
  A keyed composite-literal field with a WEI name is assigned a STRK or FRI
  selector; review the unit mismatch.
note: >-
  Purely syntactic name-suffix heuristic. It does not resolve types, values,
  or unit semantics, so it can produce false positives in codebases without
  consistent unit suffixes.
rule:
  kind: keyed_element
  all:
    - has:
        field: key
        kind: literal_element
        regex: WEI
    - has:
        field: value
        kind: literal_element
        regex: 'STRK|InFri'
metadata:
  rule_modified_at: '2026-10-15'
  ast_grep_tested_version: 0.50.0
