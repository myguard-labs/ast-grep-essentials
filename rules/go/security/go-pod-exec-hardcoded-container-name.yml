id: go-pod-exec-hardcoded-container-name
language: go
severity: warning
message: >-
  A string literal is passed as the container name to PodExecutor; hardcoded
  container names break when pods name containers differently.
note: >-
  Matches the literal syntactic shape of a PodExecutor call whose third
  argument is a string literal. It does not resolve the receiver type,
  imports, or runtime container names.
rule:
  pattern: '$RECV.PodExecutor($NS, $POD, "$CONTAINER", $$$REST)'
