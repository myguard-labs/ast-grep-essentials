id: avoid-bind-to-all-interfaces-go
language: go
severity: warning
message: >-
  Network listener uses a literal wildcard address that may expose it on all
  available interfaces.
note: >-
  Matches only calls spelled net.Listen or tls.Listen with literal wildcard
  addresses; import resolution, network semantics, and runtime exposure are
  not verified.
rule:
  pattern: '$PKG.Listen($NETWORK, $IP)'
  not:
    has:
      stopBy: end
      kind: ERROR
constraints:
  PKG:
    regex: '^(net|tls)$'
  IP:
    regex: '^("(0\.0\.0\.0|\[::\])?:[^"]*"|`(0\.0\.0\.0|\[::\])?:[^`]*`)$'
metadata:
  rule_modified_at: '2026-10-05'
  ast_grep_tested_version: 0.45.3
