id: go-cors-wildcard-credentials
language: go
severity: error
message: >-
  CORS configured to accept every origin while also allowing credentials. Any
  site the victim visits can then issue authenticated cross-origin requests
  with the victim's cookies and read the responses, which is a full account
  takeover primitive. List the origins that genuinely need credentialed access,
  or drop AllowCredentials.
note: >-
  Fires when both settings appear in one configuration literal, or when an
  origin-check callback in that literal returns true unconditionally. A
  configuration assembled field by field across several statements is not
  visible to this matcher, and an API that serves no cookies or authorization
  headers at all is a legitimate dismissal.
rule:
  kind: composite_literal
  all:
    - has:
        field: body
        kind: literal_value
        has:
          kind: keyed_element
          all:
            - has: {nthChild: 1, regex: '^AllowCredentials$'}
            - has: {nthChild: 2, regex: '^true$'}
    - has:
        field: body
        kind: literal_value
        has:
          kind: keyed_element
          any:
            - all:
                - has: {nthChild: 1, regex: '^(AllowedOrigins|AllowOrigins|Origins)$'}
                - has:
                    nthChild: 2
                    has:
                      stopBy: end
                      regex: '^["`]\*["`]$'
            - all:
                - has: {nthChild: 1, regex: '^AllowAllOrigins$'}
                - has: {nthChild: 2, regex: '^true$'}
            - all:
                - has: {nthChild: 1, regex: '^AllowOriginFunc$'}
                - has:
                    stopBy: end
                    kind: func_literal
                    has:
                      stopBy: end
                      kind: return_statement
                      has: {stopBy: end, regex: '^true$'}
