# https://deb.myguard.nl/articles/ast-grep-security-rules-pack/ | https://github.com/myguard-labs/ast-grep-essentials

id: go-recursion-guard-negatives
language: go
severity: warning
message: Depth guard should reject non-positive recursion limits.
note: >-
  Matches the literal `maxRecursion == 0` comparison only; it does not verify
  that any following branch returns and halts recursion.
rule:
  pattern: 'maxRecursion == 0'
