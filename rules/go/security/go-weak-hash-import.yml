id: go-weak-hash-import
language: go
severity: warning
message: >-
  Import of crypto/md5 or crypto/sha1 requires review of the construction and
  required hash properties. Collision-dependent uses such as signatures need a
  modern alternative; new designs should prefer crypto/sha256 or a dedicated
  password-hashing construction.
note: >-
  Fires on the import alone and does not establish compromise. Record whether
  the use needs collision resistance, message authentication, legacy interop,
  or only a non-security checksum. See https://www.rfc-editor.org/rfc/rfc6151.
rule:
  any:
    - kind: interpreted_string_literal
    - kind: raw_string_literal
  regex: '^["`]crypto/(md5|sha1)["`]$'
  inside:
    stopBy: end
    any:
      - kind: import_spec
      - kind: import_spec_list
