id: go-panic-in-error-returning-func
language: go
severity: warning
message: >-
  Panic with a literal message inside a function whose results include error;
  consider returning the error instead.
note: >-
  Single-file syntactic match on a panic call with a string literal argument
  inside a function_declaration whose source text includes error in its result
  list. It does not resolve types, check whether the panic guards a true
  invariant, or verify reachability.
rule:
  all:
    - pattern: 'panic("invalid line")'
    - inside:
        kind: function_declaration
        has:
          field: result
          regex: error
        stopBy: end
