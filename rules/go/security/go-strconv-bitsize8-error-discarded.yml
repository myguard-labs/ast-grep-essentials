id: go-strconv-bitsize8-error-discarded
language: go
severity: warning
message: A strconv.ParseUint or strconv.ParseInt call with bitSize literal 8 whose
  error result is assigned to the blank identifier.
note: Out-of-range input makes ParseUint/ParseInt return the saturated bound plus
  an error. Discarding the error keeps that bound, so octal escapes above the byte
  range decode to wrong bytes. The shape recurs in both decoders of the commit.
rule:
  pattern: "func $V0($V1 string) byte {\n\t$V2, _ := strconv.ParseUint($V1, 8, 8)\n\
    \treturn byte($V2)\n}"
metadata:
  cwe: 'CWE-252'
  taxonomy_source: 'https://cwe.mitre.org/data/definitions/252.html'
  taxonomy_cited_keys: 'cwe'
  owasp: 'A10:2025'
  todo_cases:
    - "Single-line func f(s string) byte { b, _ := strconv.ParseUint(s, 8, 8); return byte(b) } is not reported; the pattern is a multi-line function"
    - "strconv.ParseInt(s, 8, 8) with the error discarded is not reported"
    - "A method with a receiver, func (d *dec) f(s string) byte, is not reported"
    - "A trailing line comment after the ParseUint statement stops the match"
    - "An aliased import calling str.ParseUint(in, 8, 8) with the error discarded is not reported"
