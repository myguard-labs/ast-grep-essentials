# ast-grep test snapshots record only the first match of a case, so this probe
# pins that a qualifier prefix never matches on its own while an on-demand
# import of the same package does.
id: probe-java-imported-name-exact
language: java
severity: hint
message: probe for exact names of the java-imported-name util
rule:
  matches: java-imported-name
  regex: '^javax\.crypto$'
