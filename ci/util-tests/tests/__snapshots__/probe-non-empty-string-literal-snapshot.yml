id: probe-non-empty-string-literal
snapshots:
  a = "" "y":
    labels:
    - source: '"y"'
      style: primary
      start: 7
      end: 10
  a = """z""":
    labels:
    - source: '"""z"""'
      style: primary
      start: 4
      end: 11
  a = "\n":
    labels:
    - source: '"\n"'
      style: primary
      start: 4
      end: 8
  a = "x":
    labels:
    - source: '"x"'
      style: primary
      start: 4
      end: 7
  a = 'x':
    labels:
    - source: '''x'''
      style: primary
      start: 4
      end: 7
  a = b"x":
    labels:
    - source: b"x"
      style: primary
      start: 4
      end: 8
  a = f"x{y}":
    labels:
    - source: f"x{y}"
      style: primary
      start: 4
      end: 11
  a = r"\n":
    labels:
    - source: r"\n"
      style: primary
      start: 4
      end: 9
