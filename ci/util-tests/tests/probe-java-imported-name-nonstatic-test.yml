id: probe-java-imported-name-nonstatic
valid:
  - 'import static org.junit.Assert.assertEquals;'
  - 'import static org.junit.Assert.*;'
  - 'import static javax.crypto.Cipher.getInstance;'
invalid:
  - 'import javax.crypto.Cipher;'
  - 'import javax.crypto.*;'
  - |
    import static org.junit.Assert.*;
    import javax.crypto.Cipher;
