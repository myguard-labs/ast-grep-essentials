id: powershell-add-type-dynamic-source
valid:
# Constant definitions: single-quoted, non-interpolating double-quoted, and a
# verbatim here-string. These are the supported way to use the cmdlet.
- "Add-Type -TypeDefinition 'public class X {}'"
- 'Add-Type -TypeDefinition "public class X {}"'
- "Add-Type 'public class X {}'"
# A verbatim here-string containing what looks like interpolation. `@'...'@` does
# not expand, so the `$b` is literal C# text and this compiles fixed source.
- "Add-Type -TypeDefinition @'\npublic class X { $b }\n'@"
# An expandable here-string with nothing to interpolate.
- "Add-Type -TypeDefinition @\"\npublic class X {}\n\"@"
# The genuinely safe parameter sets. -AssemblyName names a prebuilt assembly
# resolved through .NET assembly binding and -ReferencedAssemblies names what
# the compilation links against; neither is source text, so no compiler decides
# anything from them and a variable bound to one is not a finding. This is the
# exclusion a false positive would live in.
- 'Add-Type -AssemblyName $asm'
- 'Add-Type -ReferencedAssemblies $refs -TypeDefinition "public class X {}"'
- 'Add-Type -AssemblyName System.Windows.Forms'
- 'Add-Type -AssemblyName $asm -PassThru'
- 'Add-Type -AN $asm'
# A CONSTANT source path names a fixed file that is itself under review, so the
# compiled text is decided by the source, not at runtime.
- 'Add-Type -Path C:\src\Thing.cs'
- 'Add-Type -LiteralPath C:\src\Thing.cs'
- 'Add-Type -Pat C:\src\Thing.cs'
# Near misses on the prefix enumerations. -P and -Pa are ambiguous between
# -Path and -PassThru so PowerShell rejects them, and the rule must not match
# them either. -La resolves to -Language, not -LiteralPath.
- 'Add-Type -P $cs'
- 'Add-Type -Pa $cs'
- 'Add-Type -La $lang -TypeDefinition "public class X {}"'
# A CONSTANT member definition is the supported P/Invoke idiom: the compiled
# member text is fixed and under review, so only -Name/-Namespace vary.
- "Add-Type -MemberDefinition '[DllImport(\"user32.dll\")]public static extern bool ShowWindowAsync(IntPtr h, int n);' -Name W -Namespace N"
- "Add-Type -MemberDefinition '[DllImport(\"user32.dll\")]public static extern bool X();' -Name $cls -Namespace $ns"
# -Name and -Namespace name the generated class, not the compiled member text,
# so a variable bound to either decides no code. They start with N, not M, so
# the -MemberDefinition enumeration must not reach them.
- "Add-Type -MemberDefinition 'public static int A() { return 1; }' -Name $n"
- "Add-Type -MemberDefinition 'public static int A() { return 1; }' -NS $ns"
# Constant source alongside a variable-valued unrelated parameter: the variable
# controls the output object or the reference set, not the compiled text.
- 'Add-Type -TypeDefinition "public class X {}" -OutputAssembly $out'
- "Add-Type -TypeDefinition 'public class X {}' -ReferencedAssemblies $refs"
# Case variants of a constant definition.
- "ADD-TYPE -TYPEDEFINITION 'public class X {}'"
- "add-type -typedefinition 'public class X {}'"
# The value is built but never compiled.
- '$code = "public class X { $b }"'
- '$code = Get-Content src.cs'
# Sink name only in a comment or a string.
- '# Add-Type -TypeDefinition $code'
- '$s = "Add-Type -TypeDefinition $code"'
- "$s = 'Add-Type -TypeDefinition $code'"
# A different cmdlet whose name merely contains the sink name.
- 'Add-TypeDefinition $code'
- 'Get-AddType $code'
# Parser-error control.
- 'Add-Type -TypeDefinition $code {'
# A SCRIPT BLOCK bound to a source parameter, with or without variables in it.
# A script block is not interpolated where it is written: it carries fixed
# script text, and any variable inside it is resolved wherever the block is
# later evaluated, not by the caller binding it. So nothing in these is decided
# by the parent's state, and reporting any of them is a false positive. (A
# script block is not valid C# either, so Add-Type would reject it at runtime --
# but that is a type error, not the dynamic-source risk this rule reports.)
- 'Add-Type -TypeDefinition { public class X {} }'
- 'Add-Type -MemberDefinition { Get-Thing } -Name W -Namespace N'
- 'Add-Type { public class X {} }'
- 'Add-Type -TypeDefinition { public class X { $body } }'
invalid:
# Bare variable bound to -TypeDefinition, and the positional source form.
- 'Add-Type -TypeDefinition $code'
- 'Add-Type $code'
# Case variants: the cmdlet name and the parameter name are both matched
# case-insensitively.
- 'ADD-TYPE -TYPEDEFINITION $code'
- 'add-type -typedefinition $code'
- 'Add-Type -typeDefinition $code'
# Interpolated double-quoted string: variable, environment variable,
# subexpression.
- 'Add-Type -TypeDefinition "public class X { $body }"'
- 'Add-Type -TypeDefinition "$env:PAYLOAD"'
- 'Add-Type -TypeDefinition "public class X { $(Get-Body) }"'
# An expandable here-string that really interpolates. The literal one above is
# the near miss this is paired with.
- "Add-Type -TypeDefinition @\"\npublic class X { $body }\n\"@"
# Concatenation and a parenthesised command invocation whose output becomes the
# compiled text. Neither carries a variable directly under the argument.
- 'Add-Type -TypeDefinition ($prefix + $suffix)'
- 'Add-Type -TypeDefinition (Get-Content src.cs)'
- 'Add-Type -MemberDefinition (Get-Sig) -Name W -Namespace N'
- 'Add-Type $(Get-Source)'
# Splatted arguments parse as a variable in the positional slot.
- 'Add-Type @splat'
# A dynamic definition alongside other parameters, in both orders: the source
# argument still decides, so the safe-parameter exclusion must not swallow it.
- 'Add-Type -TypeDefinition $code -Language CSharp'
- 'Add-Type -ReferencedAssemblies System.Xml -TypeDefinition $code'
- 'Add-Type -TypeDefinition $code -PassThru'
# A dynamic SOURCE PATH. Add-Type -Path compiles the named .cs/.vb file rather
# than loading a prebuilt assembly, so a runtime-decided path chooses the C#
# that is compiled and run -- the same risk class as a dynamic definition.
- 'Add-Type -Path $cs'
- 'Add-Type -LiteralPath $cs'
- 'Add-Type -LiteralPath $cs -PassThru'
- 'Add-Type -Path "$dir\Thing.cs"'
- 'Add-Type -Path (Join-Path $dir Thing.cs)'
# Unambiguous parameter PREFIXES. PowerShell binds any prefix that resolves to
# exactly one parameter, so the rule enumerates them; the ambiguous ones are in
# the valid block above as near misses.
- 'Add-Type -T $code'
- 'Add-Type -TypeD $code'
- 'Add-Type -TypeDefi $code'
- 'Add-Type -Pat $cs'
- 'Add-Type -Li $cs'
- 'Add-Type -LiteralPat $cs'
- 'Add-Type -LP $cs'
# -MemberDefinition compiles supplied C# member text into a type that is loaded
# and callable -- the P/Invoke idiom, used with -Name and -Namespace -- so a
# dynamic value bound to it decides compiled code exactly as -TypeDefinition
# does. -M is unambiguous: MemberDefinition is the only Add-Type parameter,
# common parameters included, that starts with M.
- 'Add-Type -MemberDefinition $sig -Name W -Namespace N'
- 'Add-Type -M $sig -Name W -Namespace N'
- 'Add-Type -Member $sig -Name W -Namespace N'
- 'Add-Type -memberdefinition $sig -Name W'
- 'Add-Type -MemberDefinition "public static int A() { return $n; }" -Name W'
- 'Add-Type -MemberDefinition (Get-Content sig.cs) -Name W -Namespace N'
