id: powershell-invoke-expression-dynamic-argument
language: powershell
severity: error
message: >-
  Invoke-Expression is called on an argument that is not a constant: a variable,
  a splatted hashtable, a parenthesised expression, or a double-quoted string
  containing an interpolated variable or subexpression. Every one of those
  resolves at runtime, so the text PowerShell parses as code is decided by
  whatever fed that value — a parameter, an environment variable, a file, a
  registry read, or an HTTP response — and an attacker who influences it chooses
  the code that runs, not merely the data it operates on (CWE-94, CWE-95).
  String interpolation is not escaping: there is no quoting context in
  PowerShell source that makes an injected semicolon, backtick or subexpression
  inert. Call the command directly and pass the value as a parameter, use the
  call operator on a known command name, or use a parameterised API, so the
  value stays data.
note: >-
  Matches an Invoke-Expression or iex command, in any casing, under the alias or
  the full cmdlet name, whose CODE argument is dynamic. The code argument is the
  positional one, or the value bound to -Command; it is dynamic when it contains
  a variable, a subexpression, a splatted argument, or a parenthesised command
  invocation whose output is parsed as code. The test applies to that argument
  alone: a variable bound to some other parameter, such as -Verbose:$verbose or
  -ErrorVariable $e, does not decide the executed text and does not match on its
  own. It deliberately does not match a wholly constant code argument — a
  single-quoted verbatim string, or a double-quoted string with no
  interpolation — which is pointless but not an injection risk, and it does not
  match a piped pipeline stage, which powershell-invoke-expression-piped-input
  reports instead, so the two rules never double-report one site. The rule
  performs no taint tracking and does not claim the value is attacker-
  controlled. It does not need to: the argument is resolved at runtime and then
  parsed as PowerShell source, so the executing code is not determined by the
  source text under review. Where the value really is a hardcoded constant the
  finding still stands, because the correct edit is to invoke the command
  directly and delete Invoke-Expression rather than to keep an interpreter on
  the path.

  `command_elements` is flat, so a positional code argument that follows a
  switch parameter (`-Verbose $cmd`) is indistinguishable by tree shape from a
  real parameter value that follows a value-taking parameter (-ErrorVariable
  $e) without an arity model. The rule closes that gap for the bounded set of
  PowerShell common parameters that take no value (switches):
  -Verbose, -Debug, -WhatIf, -Confirm. A positional dynamic argument
  immediately following one of those switch names is still the code argument
  and matches. Value-taking common parameters (-ErrorAction, -ErrorVariable,
  -WarningAction, -WarningVariable, -InformationAction, -InformationVariable,
  -OutVariable, -OutBuffer, -PipelineVariable) are deliberately excluded from
  this list, so the token immediately after one of those still resolves as
  that parameter's own value and does not match; a further alternative below
  matches the argument one position past THAT value instead, since it is the
  code argument (`-ErrorVariable $e $cmd`). A colon-bound switch value
  (-Verbose:$verbose) is unaffected: the colon parses as part of the
  argument-separator token between the parameter and its value -- the same
  sibling shape as a positional code argument after that switch -- so the
  switch alternative additionally requires that separator to be whitespace,
  not a colon, to keep the colon-bound form excluded.
rule:
  kind: command
  all:
    - has:
        field: command_name
        regex: '(?i)^(iex|Invoke-Expression)$'
    # The dynamic-input test applies to the CODE argument only, not to every
    # element on the command line. `Invoke-Expression 'Get-Date' -Verbose:$v`
    # executes a constant; the variable binds a common parameter. Searching all
    # elements reported that as an injection, so the argument is selected first:
    # a direct child of `command_elements` that either follows no
    # `command_parameter` at all (the positional code argument) or follows the
    # `-Command` parameter across its separator.
    - has:
        field: command_elements
        has:
          any:
            - not:
                follows:
                  stopBy: end
                  kind: command_parameter
            - follows:
                kind: command_argument_sep
                follows:
                  kind: command_parameter
                  regex: '(?i)^-Command$'
            # A positional code argument that immediately follows one of the
            # value-less common parameters (switches): the switch itself binds
            # no value, so this argument is still the code argument, e.g.
            # `Invoke-Expression -Verbose $cmd`. Value-taking common
            # parameters (-ErrorVariable, -ErrorAction, ...) are intentionally
            # absent from this regex: the argument right after one of those is
            # that parameter's own value, not the code argument, and must keep
            # falling through to the exclusion above.
            - follows:
                kind: command_argument_sep
                # A colon-bound switch value (-Verbose:$verbose) parses the
                # colon itself into this separator token, which is otherwise
                # whitespace for a positional argument. Requiring whitespace
                # here is what keeps the colon-bound form excluded: without
                # it, `-Verbose:$verbose` is structurally identical to
                # `-Verbose $cmd` and would wrongly match.
                regex: '^\s+$'
                follows:
                  kind: command_parameter
                  regex: '(?i)^-(Verbose|Debug|WhatIf|Confirm)$'
            # A positional code argument that follows a value-taking common
            # parameter's OWN value, e.g. `Invoke-Expression -ErrorVariable $e
            # $cmd`: $e is -ErrorVariable's value (excluded above by the
            # general "follows a command_parameter" test) and $cmd is one
            # position further along, still the code argument. Anchored to
            # the same bounded value-taking name list as the switch
            # exclusion above, so this cannot widen to match a switch's own
            # value (switches take none) or an unrecognised parameter.
            - follows:
                kind: command_argument_sep
                follows:
                  any:
                    - kind: variable
                    - kind: sub_expression
                    - kind: unary_expression
                  follows:
                    kind: command_argument_sep
                    follows:
                      kind: command_parameter
                      regex: '(?i)^-(ErrorAction|ErrorVariable|WarningAction|WarningVariable|InformationAction|InformationVariable|OutVariable|OutBuffer|PipelineVariable)$'
          # Matching `variable` and `sub_expression` rather than the enclosing
          # expandable_string_literal is what keeps `iex "literal"` out: a
          # double-quoted string with nothing to interpolate has neither child.
          # A splatted `@args` also parses as a `variable`. `command` covers a
          # parenthesised command invocation -- `iex (Get-Content payload.txt)`
          # -- whose output is parsed as code but which contains neither of the
          # other two kinds.
          has:
            stopBy: end
            any:
              - kind: variable
              - kind: sub_expression
              - kind: command
    # Piped input is the other rule's shape; excluding it here keeps each site
    # to one finding and keeps the two severities meaningful.
    - not:
        follows:
          stopBy: end
          any:
            - kind: command
            - kind: unary_expression
